              fun setRing() { val b = hist.maxOrNull() ?: 0f; val l = hist.lastOrNull() ?: 0f; ring.set(if (b > 0) l / b else 0f, if (l > 0) "${l.toInt()}" else "–", T.acc); hs.text = if (hist.isEmpty()) "No runs yet" else "runs ${hist.size} · best ${b.toInt()} · last ${l.toInt()}"; sp.invalidate() }
              setRing(); var lastS = ""
