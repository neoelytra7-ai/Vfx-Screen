          class Spark(c: Context, val title: String, val unit: String = "", var col: Int = T.acc) : View(c) {
            var src: List<Float> = emptyList(); var fixMax = 0f; var compact = false; var fit = false
            private val p = Paint(Paint.ANTI_ALIAS_FLAG); private var ph = 0f
            private val an = ValueAnimator.ofFloat(0f, 1f).apply { duration = 1500; repeatCount = ValueAnimator.INFINITE; addUpdateListener { ph = it.animatedFraction; invalidate() }; start() }
            override fun onDetachedFromWindow() { an.cancel(); super.onDetachedFromWindow() }
            private fun f(v: Float) = if (v >= 100f) "%.0f".format(v) else "%.1f".format(v)
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val h = height.toFloat(); val d = src; val n = d.size; val top = if (compact) 2f else dpf(24f)
              if (!compact) {
                p.style = Paint.Style.FILL; p.typeface = Typeface.MONOSPACE; p.textSize = dpf(11f)
                p.color = T.dim; p.textAlign = Paint.Align.LEFT; cv.drawText(title.uppercase() + if (n > 0) "  pk " + f(d.maxOrNull() ?: 0f) else "", 0f, dpf(12f), p)
                if (n > 0) { p.color = col; p.textAlign = Paint.Align.RIGHT; p.textSize = dpf(15f); p.typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD); cv.drawText(f(d[n - 1]) + unit, w, dpf(14f), p) }
              }
              if (n < 2) return
              val mx = if (fixMax > 0) fixMax else maxOf(d.maxOrNull() ?: 1f, 1f) * 1.15f
              val step = if (fit) w / (n - 1) else w / 89f; val path = Path(); var px = 0f; var py = 0f; var fx = 0f
              for (i in 0 until n) {
                val x = if (fit) i * step else w - (n - 1 - i) * step; val y = h - 3f - (d[i] / mx).coerceIn(0f, 1f) * (h - top - 6f)
                if (i == 0) { path.moveTo(x, y); fx = x } else { val m = (px + x) / 2; path.cubicTo(m, py, m, y, x, y) }
                px = x; py = y
              }
              val fill = Path(path).apply { lineTo(px, h); lineTo(fx, h); close() }
              p.style = Paint.Style.FILL; p.shader = LinearGradient(0f, top, 0f, h, (col and 0xFFFFFF) or 0x66000000, col and 0xFFFFFF, Shader.TileMode.CLAMP)
              cv.drawPath(fill, p); p.shader = null
              p.style = Paint.Style.STROKE; p.strokeWidth = dpf(2f); p.strokeJoin = Paint.Join.ROUND; p.color = col; cv.drawPath(path, p)
              p.style = Paint.Style.FILL; p.alpha = ((1 - ph) * 110).toInt(); cv.drawCircle(px, py, dpf(3f + 7f * ph), p)
              p.color = col; cv.drawCircle(px, py, dpf(3f), p)
            }
          }

