            override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
              val nm = getSystemService(NotificationManager::class.java)
              nm.createNotificationChannel(NotificationChannel("sx", "SysX", NotificationManager.IMPORTANCE_LOW)); nm.createNotificationChannel(NotificationChannel("sx2", "SysX (default priority)", NotificationManager.IMPORTANCE_DEFAULT))
