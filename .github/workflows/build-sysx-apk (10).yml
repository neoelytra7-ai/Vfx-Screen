            private fun kv(ls: List<String>): CharSequence {
              val sb = SpannableStringBuilder()
              for (l in ls) { val s = sb.length; sb.append(l).append('\n'); if (l.length > 17 && !l.startsWith(" ")) sb.setSpan(ForegroundColorSpan(T.dim), s, s + 17, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE) }
              return sb
            }
            private fun secCard(n: String, ls: List<String>, open: Boolean): View {
              val c = card(); val ch = tv(if (open) "▾" else "▸", 15f, T.acc)
              val body = TextView(this).apply { typeface = Typeface.MONOSPACE; textSize = 11f; setTextColor(T.tx); setTextIsSelectable(true); text = kv(ls); visibility = if (open) View.VISIBLE else View.GONE; setPadding(0, dp(8), 0, 0) }
              val hd = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(2), 0, dp(2)); add(tv(n, 13f, T.tx, true, true), 0, -2, 1f); add(tv("${ls.size}", 11f, T.dim, true), -2, -2, mr = 10); addView(ch) }
              hd.press { TransitionManager.beginDelayedTransition((c.parent as? ViewGroup) ?: c); val o = body.visibility != View.VISIBLE; body.visibility = if (o) View.VISIBLE else View.GONE; ch.text = if (o) "▾" else "▸" }
              c.setOnLongClickListener { Fx.heavy(c); copy(n + "\n" + ls.joinToString("\n")); true }
              c.addView(hd); c.addView(body); return c
            }
