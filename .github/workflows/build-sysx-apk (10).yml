                for (l in s.lines()) { if (l.contains("Warming")) { msg.text = "Warming up…"; continue }; if (l.length > 18 && !l.startsWith("★") && !l.startsWith("(")) { n++
                  val r = LinearLayout(this).apply { setPadding(0, dp(5), 0, dp(5)); add(tv(l.take(18).trim(), 12f, T.dim, true), 0, -2, 1f); addView(tv(l.drop(18).trim(), 12.5f, T.tx, true, true)) }; res.addView(r) } }
                if (n > 0) { msg.text = "Testing… $n/11"; ring.set(n / 11f, "$n/11", T.acc); res.getChildAt(res.childCount - 1).enter(0) }
              }
              go.press {
                if (run) return@press; run = true; go.text = "Running…"; go.alpha = .6f; sh.run(true); res.visibility = View.VISIBLE; while (res.childCount > 1) res.removeViewAt(1); msg.text = "Warming up…"; window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                Thread {
                  try { Bench.run(this) { s -> runOnUiThread { showRes(s) } } } finally {
                    runOnUiThread {
                      run = false; go.text = "▶  Run again"; go.alpha = 1f; sh.run(false); window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      val sc = Regex("TOTAL SCORE (\\d+)").find(lastS)?.groupValues?.get(1)?.toFloatOrNull()
                      if (sc != null) { val pb0 = hist.maxOrNull() ?: 0f; hist.add(sc); while (hist.size > 30) hist.removeAt(0); p.edit().putString("bh", JSONArray(hist.map { it.toDouble() }).toString()).apply(); setRing()
                        msg.text = if (sc > pb0) "🏆 New personal best!" else "${(sc * 100 / pb0).toInt()}% of your best"; Fx.heavy(go); sn("Score ${sc.toInt()}", T.ok) } else msg.text = "Interrupted"
                    }
                  }
                }.start()
              }
              refs.add {}; return wrap(col)
            }

            // ───────── AUTO
            private fun rules(): JSONArray = try { JSONArray(p.getString("rules", "[]")) } catch (e: Throwable) { JSONArray() }
            private fun saveRules(a: JSONArray) { p.edit().putString("rules", a.toString()).apply(); json.setText(a.toString(2)); renderRules() }
            private fun runRule(o: JSONObject) {
              val acts = o.optJSONArray("do") ?: return; Auto.log("▶ test ${o.optString("name")}")
              Thread { for (j in 0 until acts.length()) try { Auto.act(this, acts.getJSONObject(j)) } catch (e: Throwable) { Auto.log("  ✖ ${e.message}") } }.start(); sn("Ran “${o.optString("name")}”", T.ok)
            }
            private fun renderRules() {
              rbox.removeAllViews(); val a = rules()
              if (a.length() == 0) { rbox.addView(tv("No rules yet — forge one with AI or add a template ↓", 12f, T.dim)); return }
              for (i in 0 until a.length()) {
                val o = a.optJSONObject(i) ?: continue; val w = o.optJSONObject("when"); val nc = (w?.optJSONArray("all")?.length() ?: 0) + (w?.optJSONArray("any")?.length() ?: 0)
                val row = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(8), 0, dp(8)); alpha = if (o.optBoolean("enabled", true)) 1f else .5f }
                row.add(LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; addView(tv(o.optString("name", "rule $i"), 14f, T.tx, false, true)); addView(tv("$nc cond · ${o.optJSONArray("do")?.length() ?: 0} act · cd ${o.optLong("cooldown", 300)}s", 11f, T.dim, true)) }, 0, -2, 1f)
