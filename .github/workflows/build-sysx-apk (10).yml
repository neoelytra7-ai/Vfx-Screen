                val bl = a.btn(if (ld) "● Loaded" else "⚡ Load") {
                  if (!ok) sn("Convert to .task / .litertlm to run on the GPU runtime", T.warn)
                  else { sn("Loading…"); Llm.load(a, f) { e -> a.runOnUiThread { libSig = ""; if (e == null) sn("Ready on ${Llm.backend} · ${Llm.loadMs} ms", T.ok) else { sn("Load failed", T.bad); stat.text = "⚠ $e" } } } }
                }
                val bi = a.btn("ℹ Info") {
                  if (info.visibility == View.VISIBLE) info.visibility = View.GONE
                  else { info.visibility = View.VISIBLE; info.text = "reading…"; Thread { val t = (Fmt.probe(f) + Fmt.fit(a, f.length())).joinToString("\n"); a.runOnUiThread { info.text = t } }.start() }
                }
                val bd = a.btn("🗑") {
                  if (!armed) { armed = true; sn("Tap again to delete", T.warn); libBox.postDelayed({ armed = false }, 3000) }
                  else { if (ld) Llm.unload(); f.delete(); File(f.path + ".sx").delete(); libSig = "" }
                }
                val card = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL; setPadding(a.dp(12), a.dp(10), a.dp(12), a.dp(10)); background = rr(T.card2, a.dpf(16f), if (ld) T.acc else T.line, 1) }
                card.addView(a.tv(f.name.takeLast(40), 12.5f, T.tx, true, true)); card.addView(a.tv("${Fmt.size(f.length())} · $k · ${f.parentFile?.name ?: ""}", 10.5f, T.dim, true))
                card.addView(a.tv(Fmt.note(k), 10.5f, if (ok) T.ok else T.warn, true)); card.add(info, mt = 6)
                val r = LinearLayout(a); r.add(bl, 0, -2, 1f, mr = 4); r.add(bi, 0, -2, 1f, ml = 4, mr = 4); r.add(bd, -2, -2, ml = 4); card.add(r, mt = 8)
                libBox.add(card, mb = 8)
              }
            }

            fun refresh() {
              val js = Dl.jobs.toList(); val ids = js.map { it.id }.toSet()
              rows.keys.filter { it !in ids }.toList().forEach { k -> rows.remove(k)?.let { dlBox.removeView(it.root) } }
              for (j in js) upd(j, rows.getOrPut(j.id) { mkRow(j) })
              empty.visibility = if (js.isEmpty()) View.VISIBLE else View.GONE
              val sig = Dl.models(a).joinToString { it.path + it.length() } + Llm.state + Llm.lastPath
              if (sig != libSig) { libSig = sig; drawLib() }
              if (stat.text.startsWith("⚠") && Llm.loaded()) stat.text = ""
              if (!stat.text.startsWith("⚠")) stat.text = "${Llm.state} · ${Llm.backend} · load ${Llm.loadMs} ms · TTFT ${Llm.ttft} ms · ${"%.1f".format(Llm.tps)} tok/s"
            }
          }
          EOF

      - name: Build release APK
        working-directory: sysx
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp sysx/app/build/outputs/apk/release/app-release.apk SysX.apk
          sha256sum SysX.apk > SysX.apk.sha256
          { echo "### 📦 SysX APK"; echo "- size: $(du -h SysX.apk | cut -f1)"; echo "- sha256: \`$(sha256sum SysX.apk | cut -d' ' -f1)\`"; echo "- build: #$GITHUB_RUN_NUMBER @ ${GITHUB_SHA::7}"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: SysX-apk
          path: |
            SysX.apk
            SysX.apk.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SysX.apk
            SysX.apk.sha256
          generate_release_notes: true
