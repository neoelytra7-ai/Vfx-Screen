              if (Cfg.gb(p, "nt_pw")) b.add("${"%.1f".format(H.pw.last())}W")
              if (Cfg.gb(p, "nt_net")) b.add("↓${"%.0f".format(H.dn.last())} KB/s")
              if (Cfg.gb(p, "nt_ai")) b.add(Llm.line())
              val live = Cfg.gb(p, "nt_on")
              return Notification.Builder(this, if (Cfg.gi(p, "nt_pri") == 0) "sx" else "sx2")
                .setContentTitle(if (live && a.isNotEmpty()) "SysX · " + a.joinToString(" · ") else "SysX running")
