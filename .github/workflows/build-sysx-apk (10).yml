          class Tog(c: Context, init0: Boolean, val cb: (Boolean) -> Unit) : View(c) {
            var on = init0; private var k = if (init0) 1f else 0f; private val p = Paint(Paint.ANTI_ALIAS_FLAG)
            init { setOnClickListener { set(!on, true) } }
