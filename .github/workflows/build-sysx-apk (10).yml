          package dev.sysx

          import android.content.Context
          import android.content.SharedPreferences
          import com.google.mediapipe.tasks.genai.llminference.LlmInference
          import com.google.mediapipe.tasks.genai.llminference.LlmInferenceSession
          import com.google.mediapipe.tasks.genai.llminference.ProgressListener
          import java.io.File

          object Llm {
            @Volatile var name = ""; @Volatile var backend = "-"; @Volatile var state = "idle"; @Volatile var loadMs = 0L; @Volatile var tps = 0.0; @Volatile var ttft = 0L; @Volatile var lastPath = ""; @Volatile var busy = false
            private var llm: LlmInference? = null; private var ses: LlmInferenceSession? = null; private var first = true
            fun loaded() = llm != null
            fun line(): String = if (llm != null) "${name.take(16)} $backend ${"%.1f".format(tps)}t/s" else if (state == "loading") "loading…" else "no model"

            fun unload() { try { ses?.close() } catch (e: Throwable) {}; try { llm?.close() } catch (e: Throwable) {}; ses = null; llm = null; state = "idle"; backend = "-" }
            fun reset() { try { ses?.close() } catch (e: Throwable) {}; ses = null; first = true }

            fun load(c: Context, f: File, done: (String?) -> Unit) {
              if (state == "loading") return; state = "loading"
              Thread {
                val p = c.getSharedPreferences("sx", 0); val t0 = System.currentTimeMillis(); unload(); state = "loading"
                val order = when (Cfg.gi(p, "ai_backend")) { 1 -> listOf(true); 2 -> listOf(false); else -> listOf(true, false) }; var err: String? = null
                for (gpu in order) {
                  try {
                    val o = LlmInference.LlmInferenceOptions.builder().setModelPath(f.path).setMaxTokens(Cfg.gi(p, "ai_maxtok")).setPreferredBackend(if (gpu) LlmInference.Backend.GPU else LlmInference.Backend.CPU).build()
                    llm = LlmInference.createFromOptions(c.applicationContext, o); backend = if (gpu) "GPU" else "CPU"; err = null; break
                  } catch (e: Throwable) { err = (e.message ?: e.toString()).take(300) }
                }
                if (llm != null) { name = f.name; lastPath = f.path; loadMs = System.currentTimeMillis() - t0; p.edit().putString("ai_last", f.path).apply(); state = "ready"; first = true } else state = "idle"
                done(err)
              }.start()
            }

            private fun fmt(p: SharedPreferences, q: String): String {
              val sys = Cfg.gs(p, "ai_sys").trim(); val nm = name.lowercase()
              val t = Cfg.gi(p, "ai_tmpl").let { if (it == 0) (if (nm.contains("gemma")) 1 else if (nm.contains("llama")) 3 else 4) else it }; val sy = first && sys.isNotEmpty()
              return when (t) {
                1 -> "<start_of_turn>user\n" + (if (sy) "$sys\n\n" else "") + "$q<end_of_turn>\n<start_of_turn>model\n"
                2 -> (if (sy) "<|im_start|>system\n$sys<|im_end|>\n" else "") + "<|im_start|>user\n$q<|im_end|>\n<|im_start|>assistant\n"
                3 -> (if (sy) "<|start_header_id|>system<|end_header_id|>\n\n$sys<|eot_id|>" else "") + "<|start_header_id|>user<|end_header_id|>\n\n$q<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n"
                else -> if (sy) "$sys\n\n$q" else q
              }
            }

            fun ask(c: Context, text: String, on: (String, Boolean) -> Unit) {
              val m = llm; if (m == null) { on("⚠ Load a model first.", true); return }
              if (busy) { on("⚠ Still generating…", true); return }
              busy = true
              Thread {
                try {
                  val p = c.getSharedPreferences("sx", 0)
                  val s = ses ?: LlmInferenceSession.createFromOptions(m, LlmInferenceSession.LlmInferenceSessionOptions.builder().setTopK(Cfg.gi(p, "ai_topk")).setTopP(Cfg.gi(p, "ai_topp") / 100f).setTemperature(Cfg.gi(p, "ai_temp") / 100f).build()).also { ses = it; first = true }
                  s.addQueryChunk(fmt(p, text)); first = false; var n = 0; val t0 = System.nanoTime(); ttft = 0
                  s.generateResponseAsync(ProgressListener<String> { part, fin ->
                    if (n == 0) ttft = (System.nanoTime() - t0) / 1_000_000
                    n++; tps = n / ((System.nanoTime() - t0) / 1e9).coerceAtLeast(0.001)
                    if (fin) busy = false
                    on(part ?: "", fin)
                  })
                } catch (e: Throwable) { busy = false; on("⚠ ${(e.message ?: e.toString()).take(200)}", true) }
              }.start()
            }

            fun stop() { try { ses?.javaClass?.getMethod("cancelGenerateResponseAsync")?.invoke(ses) } catch (e: Throwable) { reset() }; busy = false }
          }
