            private fun go(i: Int) {
              if (i == cur) return; val d = if (i > cur) 1 else -1; val o = pages[cur]; val n = pages[i]; val w = dp(56).toFloat()
              o.animate().alpha(0f).translationX(-d * w).setDuration(150).withEndAction { o.visibility = View.GONE; o.alpha = 1f; o.translationX = 0f }.start()
              n.visibility = View.VISIBLE; n.alpha = 0f; n.translationX = d * w; n.animate().alpha(1f).translationX(0f).setStartDelay(60).setDuration(300).setInterpolator(DecelerateInterpolator()).start()
              val col = (n as ViewGroup).getChildAt(0) as ViewGroup; for (j in 0 until col.childCount) col.getChildAt(j).enter(j + 1)
              tabIc.forEachIndexed { k, v -> v.animate().scaleX(if (k == i) 1.2f else 1f).scaleY(if (k == i) 1.2f else 1f).setDuration(260).setInterpolator(OvershootInterpolator(3f)).start() }
              if (bar.width > 0) ind.animate().translationX(i * (bar.width / 7f)).setDuration(380).setInterpolator(OvershootInterpolator(1.3f)).start()
              cur = i; refs.getOrNull(i)?.invoke()
            }

