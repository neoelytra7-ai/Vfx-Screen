                "settings" -> c.startActivity(Intent(android.provider.Settings.ACTION_BATTERY_SAVER_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                else -> log("  ? unknown action")
              }
            }
          }
