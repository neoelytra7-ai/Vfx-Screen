          #define glViewport p_glViewport
          #define glDrawArrays p_glDrawArrays
          #define glGenVertexArrays p_glGenVertexArrays
          #define glBindVertexArray p_glBindVertexArray
          #define glDeleteVertexArrays p_glDeleteVertexArrays
          #define glBindSampler p_glBindSampler
          #define glColorMask p_glColorMask
          #define glDepthMask p_glDepthMask

          static EGLContext (*p_eglGetCurrentContext)(void) = nullptr;
          static EGLSurface (*p_eglGetCurrentSurface)(EGLint) = nullptr;
          static EGLBoolean (*p_eglQuerySurface)(EGLDisplay, EGLSurface, EGLint, EGLint*) = nullptr;
          static void* (*p_eglGetProcAddress)(const char*) = nullptr;

          static bool g_glLoaded = false;

          static bool loadGL() {
              void* gles = dlopen("libGLESv3.so", RTLD_NOW);
              void* egl = dlopen("libEGL.so", RTLD_NOW);
              if (!egl) { LOGE("libEGL not found"); return false; }
              p_eglGetCurrentContext = (decltype(p_eglGetCurrentContext))dlsym(egl, "eglGetCurrentContext");
              p_eglGetCurrentSurface = (decltype(p_eglGetCurrentSurface))dlsym(egl, "eglGetCurrentSurface");
              p_eglQuerySurface = (decltype(p_eglQuerySurface))dlsym(egl, "eglQuerySurface");
              p_eglGetProcAddress = (decltype(p_eglGetProcAddress))dlsym(egl, "eglGetProcAddress");
              if (!p_eglGetCurrentContext || !p_eglGetCurrentSurface || !p_eglQuerySurface) { LOGE("EGL symbols missing"); return false; }
              bool ok = true;
          #define GL_LOAD(n) \
              p_##n = (decltype(p_##n))(gles ? dlsym(gles, #n) : nullptr); \
              if (!p_##n && p_eglGetProcAddress) p_##n = (decltype(p_##n))p_eglGetProcAddress(#n); \
              if (!p_##n) { LOGE("missing GL fn %s", #n); ok = false; }
              GL_FUNCS(GL_LOAD)
          #undef GL_LOAD
              return ok;
          }

          // ---------------------------------------------------------------- shaders
          static const char* VS = R"GLSL(
          out vec2 vUV;
          void main() {
              vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
              vUV = p;
              gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
          }
          )GLSL";

          static const char* FS_BRIGHT = R"GLSL(
          in vec2 vUV; out vec4 fragColor;
          uniform sampler2D uTex; uniform vec2 uTexel; uniform vec2 uThr;
          void main() {
              vec3 c = (texture(uTex, vUV + uTexel * vec2(-1.0, -1.0)).rgb + texture(uTex, vUV + uTexel * vec2(1.0, -1.0)).rgb +
                        texture(uTex, vUV + uTexel * vec2(-1.0, 1.0)).rgb + texture(uTex, vUV + uTexel * vec2(1.0, 1.0)).rgb) * 0.25;
              float br = max(c.r, max(c.g, c.b));
              float knee = uThr.x * uThr.y + 1e-4;
              float soft = clamp(br - uThr.x + knee, 0.0, 2.0 * knee);
              soft = soft * soft / (4.0 * knee + 1e-4);
              float w = max(soft, br - uThr.x) / max(br, 1e-4);
              fragColor = vec4(c * max(w, 0.0), 1.0);
          }
          )GLSL";

          static const char* FS_DOWN = R"GLSL(
          in vec2 vUV; out vec4 fragColor;
          uniform sampler2D uTex; uniform vec2 uTexel;
          void main() {
              vec3 c = texture(uTex, vUV).rgb * 4.0;
              c += texture(uTex, vUV + uTexel * vec2(-1.0, -1.0)).rgb;
              c += texture(uTex, vUV + uTexel * vec2(1.0, -1.0)).rgb;
              c += texture(uTex, vUV + uTexel * vec2(-1.0, 1.0)).rgb;
              c += texture(uTex, vUV + uTexel * vec2(1.0, 1.0)).rgb;
              fragColor = vec4(c * 0.125, 1.0);
          }
          )GLSL";

          static const char* FS_UP = R"GLSL(
          in vec2 vUV; out vec4 fragColor;
          uniform sampler2D uTex; uniform sampler2D uAdd; uniform vec2 uTexel; uniform vec2 uW;
          void main() {
              vec3 s = texture(uTex, vUV + vec2(-uTexel.x * 2.0, 0.0)).rgb;
              s += texture(uTex, vUV + vec2(-uTexel.x, uTexel.y)).rgb * 2.0;
              s += texture(uTex, vUV + vec2(0.0, uTexel.y * 2.0)).rgb;
              s += texture(uTex, vUV + vec2(uTexel.x, uTexel.y)).rgb * 2.0;
              s += texture(uTex, vUV + vec2(uTexel.x * 2.0, 0.0)).rgb;
              s += texture(uTex, vUV + vec2(uTexel.x, -uTexel.y)).rgb * 2.0;
              s += texture(uTex, vUV + vec2(0.0, -uTexel.y * 2.0)).rgb;
              s += texture(uTex, vUV + vec2(-uTexel.x, -uTexel.y)).rgb * 2.0;
              fragColor = vec4(s / 12.0 * uW.x + texture(uAdd, vUV).rgb * uW.y, 1.0);
          }
          )GLSL";

          static const char* FS_STREAK = R"GLSL(
          in vec2 vUV; out vec4 fragColor;
          uniform sampler2D uTex; uniform vec2 uStep;
          void main() {
              vec3 acc = vec3(0.0); float ws = 0.0;
              for (int i = -12; i <= 12; i++) {
                  float w = exp(-float(i * i) / 72.0);
                  acc += texture(uTex, vUV + vec2(float(i) * uStep.x, 0.0)).rgb * w;
                  ws += w;
              }
              fragColor = vec4(acc / ws * 2.0, 1.0);
          }
          )GLSL";

          static const char* FS_COMP = R"GLSL(
          in vec2 vUV; out vec4 fragColor;
          uniform sampler2D uScene; uniform sampler2D uBloom; uniform sampler2D uStreak; uniform sampler2D uPrev;
          uniform vec2 uRes; uniform float uTime; uniform float uHasPrev;

          float hash(vec2 p) { p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
          float lum(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
          vec3 hue2rgb(float h) {
              h = fract(h / 360.0);
              vec3 k = abs(fract(vec3(h) + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0);
              return clamp(k - 1.0, 0.0, 1.0);
          }
          vec3 hueRot(vec3 c, float deg) {
              float a = radians(deg); float s = sin(a); float co = cos(a);
              mat3 m = mat3(0.299 + 0.701 * co + 0.168 * s, 0.587 - 0.587 * co + 0.330 * s, 0.114 - 0.114 * co - 0.497 * s,
                            0.299 - 0.299 * co - 0.328 * s, 0.587 + 0.413 * co + 0.035 * s, 0.114 - 0.114 * co + 0.292 * s,
                            0.299 - 0.300 * co + 1.250 * s, 0.587 - 0.588 * co - 1.050 * s, 0.114 + 0.886 * co - 0.203 * s);
              return clamp(c * m, 0.0, 1.0);
          }
          vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
          vec3 hable(vec3 x) { return ((x * (0.15 * x + 0.05) + 0.004) / (x * (0.15 * x + 0.5) + 0.06)) - 0.02 / 0.3; }
          vec3 filmic(vec3 c) { return clamp(hable(c * 2.0) / hable(vec3(11.2)), 0.0, 1.0); }

          vec3 fetch(vec2 uv, vec2 ca) {
              if (P_ca <= 0.0) return texture(uScene, uv).rgb;
              return vec3(texture(uScene, uv + ca).r, texture(uScene, uv).g, texture(uScene, uv - ca).b);
          }

          void main() {
              vec2 uv = vUV;
              float asp = uRes.x / uRes.y;
              if (P_pixel > 0.5) { vec2 g = uRes / P_pixel; uv = (floor(uv * g) + 0.5) / g; }
              if (P_vhs > 0.0) {
                  float row = floor(uv.y * uRes.y * 0.5); float tt = floor(uTime * 24.0);
                  float j = hash(vec2(row, tt));
                  uv.x += (j - 0.5) * 0.03 * P_vhs * step(0.985, hash(vec2(row * 0.37, tt))) + 0.0015 * P_vhs * sin(uv.y * 40.0 + uTime * 3.0);
              }
              vec2 d = uv - 0.5;
              if (abs(P_lens) > 0.001) {
                  vec2 q = d * vec2(asp, 1.0);
                  float r2 = dot(q, q);
                  d *= (1.0 + P_lens * r2) / (1.0 + P_lens * 0.35);
                  uv = 0.5 + d;
              }
              float oob = (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) ? 1.0 : 0.0;
              vec2 cuv = clamp(uv, vec2(0.0), vec2(1.0));
              vec2 dd = cuv - 0.5;
              vec2 ca = dd * (P_ca * 0.02) * pow(clamp(length(dd * vec2(asp, 1.0)) * 2.0, 0.0, 2.0), P_ca_fall);

              vec3 c;
              float rad = 0.0;
              if (P_dof > 0.0) rad = P_dof * 8.0 * smoothstep(0.0, 0.35, max(abs(cuv.y - (1.0 - P_dof_y)) - P_dof_w, 0.0));
              if (rad > 0.5) {
                  vec3 acc = fetch(cuv, ca);
                  for (int i = 0; i < 12; i++) {
                      float fi = float(i); float a = fi * 2.39996; float r = sqrt((fi + 0.5) / 12.0) * rad;
                      acc += fetch(cuv + vec2(cos(a), sin(a)) * r / uRes, ca);
                  }
                  c = acc / 13.0;
              } else {
                  c = fetch(cuv, ca);
              }

              vec2 px = 1.0 / uRes;
              if (P_fxaa > 0.5) {
                  vec3 nN = texture(uScene, cuv + vec2(0.0, px.y)).rgb; vec3 nS = texture(uScene, cuv - vec2(0.0, px.y)).rgb;
                  vec3 nE = texture(uScene, cuv + vec2(px.x, 0.0)).rgb; vec3 nW = texture(uScene, cuv - vec2(px.x, 0.0)).rgb;
                  float lc = lum(c); float ln = lum(nN); float ls = lum(nS); float le = lum(nE); float lw = lum(nW);
                  float range = max(max(max(ln, ls), max(le, lw)), lc) - min(min(min(ln, ls), min(le, lw)), lc);
                  float k = smoothstep(0.04, 0.2, range);
                  c = mix(c, (c * 2.0 + nN + nS + nE + nW) / 6.0, k * 0.85);
              }
              if (P_sharpen > 0.0) {
                  vec3 n = texture(uScene, cuv + vec2(0.0, px.y)).rgb + texture(uScene, cuv - vec2(0.0, px.y)).rgb +
                           texture(uScene, cuv + vec2(px.x, 0.0)).rgb + texture(uScene, cuv - vec2(px.x, 0.0)).rgb;
                  c += (c - n * 0.25) * P_sharpen;
              }
              if (P_clarity > 0.0) {
                  vec2 o = px * 3.0;
                  vec3 b = texture(uScene, cuv + vec2(o.x, 0.0)).rgb + texture(uScene, cuv - vec2(o.x, 0.0)).rgb +
                           texture(uScene, cuv + vec2(0.0, o.y)).rgb + texture(uScene, cuv - vec2(0.0, o.y)).rgb +
                           texture(uScene, cuv + o).rgb + texture(uScene, cuv - o).rgb +
                           texture(uScene, cuv + vec2(o.x, -o.y)).rgb + texture(uScene, cuv + vec2(-o.x, o.y)).rgb;
                  b *= 0.125;
                  float m = 1.0 - abs(lum(c) * 2.0 - 1.0) * 0.5;
                  c += (c - b) * P_clarity * m;
              }
              if (P_outline > 0.0) {
                  float l1 = lum(texture(uScene, cuv + vec2(px.x, 0.0)).rgb); float l2 = lum(texture(uScene, cuv - vec2(px.x, 0.0)).rgb);
                  float l3 = lum(texture(uScene, cuv + vec2(0.0, px.y)).rgb); float l4 = lum(texture(uScene, cuv - vec2(0.0, px.y)).rgb);
                  float e = smoothstep(P_outline_thr, P_outline_thr + 0.1, abs(l1 - l2) + abs(l3 - l4));
                  c = mix(c, vec3(0.0), e * P_outline);
              }

              if (P_bloom > 0.0 || P_halation > 0.0) {
                  vec3 bl = texture(uBloom, cuv).rgb;
                  vec3 tint = vec3(1.0 + 0.3 * P_bloom_warm, 1.0, 1.0 - 0.3 * P_bloom_warm);
                  c += bl * tint * P_bloom;
                  c += bl * vec3(1.0, 0.25, 0.08) * P_halation * 0.6;
              }
              if (P_streak > 0.0) c += texture(uStreak, cuv).rgb * vec3(0.45, 0.65, 1.0) * P_streak;
              if (P_rays > 0.0) {
                  vec2 L = vec2(P_rays_x, 1.0 - P_rays_y);
                  vec2 st = (L - cuv) * P_rays_density / 24.0;
                  vec2 p = cuv; vec3 acc = vec3(0.0); float w = 1.0;
                  for (int i = 0; i < 24; i++) { p += st; acc += texture(uBloom, p).rgb * w; w *= P_rays_decay; }
                  c += acc * (P_rays / 24.0) * vec3(1.0, 0.9, 0.75);
              }

              c *= exp2(P_exposure);
              int tm = int(P_tm_mode + 0.5);
              if (tm == 1) c = c / (1.0 + c) * 1.15;
              else if (tm == 2) c = aces(c);
              else if (tm == 3) c = filmic(c);

              c += P_brightness;
              c.r += P_temp * 0.1; c.b -= P_temp * 0.1;
              c.g += P_tint * 0.06; c.r -= P_tint * 0.03; c.b -= P_tint * 0.03;
              c = (c - 0.5) * P_contrast + 0.5;
              c = mix(vec3(lum(c)), c, P_saturation);
              float mx = max(c.r, max(c.g, c.b)); float mn = min(c.r, min(c.g, c.b));
              c = mix(vec3(lum(c)), c, 1.0 + P_vibrance * (1.0 - (mx - mn)));
              if (abs(P_hue) > 0.5) c = hueRot(clamp(c, 0.0, 1.0), P_hue);
              c = pow(max(c * P_gain + P_lift, 0.0), vec3(1.0 / max(P_gamma, 0.1)));
              if (P_split > 0.0) {
                  float l = lum(c);
                  float sh = 1.0 - smoothstep(0.0, 0.6, l); float hi = smoothstep(0.4, 1.0, l);
                  c = mix(c, c * (0.5 + hue2rgb(P_split_sh_hue)), sh * P_split * 0.6);
                  c = mix(c, c * (0.5 + hue2rgb(P_split_hi_hue)), hi * P_split * 0.6);
              }
              if (P_vig > 0.0) {
                  vec2 q = (cuv - 0.5) * vec2(mix(1.0, asp, P_vig_round), 1.0);
                  float dst = length(q) / length(vec2(0.5 * mix(1.0, asp, P_vig_round), 0.5));
                  float v = smoothstep(P_vig_size * (1.0 - 0.9 * P_vig_soft), P_vig_size, dst);
                  c *= 1.0 - v * P_vig;
              }
              if (P_scan > 0.0) c *= 1.0 - P_scan * 0.35 * (0.5 + 0.5 * sin(cuv.y * uRes.y * 3.14159));
              if (P_nv > 0.0) {
                  float l = lum(c);
                  vec3 g = vec3(0.1, 1.0, 0.25) * l * 1.8 + (hash(cuv * uRes + uTime) - 0.5) * 0.12;
                  c = mix(c, g, P_nv);
              }
              if (P_poster > 1.5) c = floor(c * P_poster + 0.5) / P_poster;
              if (P_grain > 0.0) {
                  vec2 gp = floor(cuv * uRes / max(P_grain_size, 0.5));
                  float n = hash(gp + fract(uTime) * 100.0) - 0.5;
                  c += n * P_grain * 0.15 * (1.0 - 0.5 * lum(c));
              }
              if (abs(cuv.y - 0.5) > 0.5 - P_letter) c = vec3(0.0);
              c *= 1.0 - oob;
              if (P_dither > 0.5) c += (hash(cuv * uRes + uTime * 7.0) - 0.5) / 255.0;
              if (uHasPrev > 0.5 && P_mblur > 0.0) c = mix(c, texture(uPrev, vUV).rgb, P_mblur);
              fragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
          }
          )GLSL";

          // ---------------------------------------------------------------- GL helpers
          struct Prog { GLuint id = 0; GLint tex = -1, add = -1, texel = -1, thr = -1, w = -1, step = -1;
                        GLint scene = -1, bloom = -1, streak = -1, prev = -1, res = -1, time = -1, hasPrev = -1, par = -1; };
          struct Tgt { GLuint tex = 0, fbo = 0; int w = 0, h = 0; };

          static bool g_failed = false;
          static Prog pBright, pDown, pUp, pStreak, pComp;
          static Tgt scene, dn[6], up[6], streakT, outA, outB;
          static GLuint g_vao = 0;
          static int g_w = 0, g_h = 0, g_L = 0;
          static bool g_hdr = false, g_pyr = false, g_mb = false, g_hdrOk = true, g_havePrev = false, g_useA = true;
          static EGLContext g_ctx = EGL_NO_CONTEXT;
          static EGLSurface g_surf = EGL_NO_SURFACE;
          static bool g_progsOk = false;
          static long long g_lastMs = 0;
          static unsigned g_frame = 0;
          static double g_t0 = 0;

          static std::string paramHeader() {
              std::string h = "#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n";
              for (int i = 0; i < NP; i++)
                  h += std::string("#define P_") + PR[i].key + " P[" + std::to_string(i / 4) + "]." + "xyzw"[i % 4] + "\n";
              h += "uniform vec4 P[" + std::to_string((NP + 3) / 4) + "];\n";
              return h;
          }

          static GLuint compile(GLenum type, const std::string& src, const char* name) {
              GLuint s = glCreateShader(type);
              const char* p = src.c_str();
              glShaderSource(s, 1, &p, nullptr);
              glCompileShader(s);
              GLint ok = 0;
              glGetShaderiv(s, GL_COMPILE_STATUS, &ok);
              if (!ok) {
                  char log[1024]; GLsizei n = 0;
                  glGetShaderInfoLog(s, sizeof log - 1, &n, log); log[n] = 0;
                  LOGE("shader %s compile error: %s", name, log);
                  glDeleteShader(s);
                  return 0;
              }
              return s;
          }

          static bool makeProg(Prog& pr, const char* fs, const char* name) {
              std::string hdr = paramHeader();
              GLuint v = compile(GL_VERTEX_SHADER, hdr + VS, name);
              GLuint f = compile(GL_FRAGMENT_SHADER, hdr + fs, name);
              if (!v || !f) return false;
              GLuint id = glCreateProgram();
              glAttachShader(id, v); glAttachShader(id, f);
              glLinkProgram(id);
              glDeleteShader(v); glDeleteShader(f);
              GLint ok = 0;
              glGetProgramiv(id, GL_LINK_STATUS, &ok);
              if (!ok) {
                  char log[1024]; GLsizei n = 0;
                  glGetProgramInfoLog(id, sizeof log - 1, &n, log); log[n] = 0;
                  LOGE("program %s link error: %s", name, log);
                  return false;
              }
              pr.id = id;
              pr.tex = glGetUniformLocation(id, "uTex"); pr.add = glGetUniformLocation(id, "uAdd");
              pr.texel = glGetUniformLocation(id, "uTexel"); pr.thr = glGetUniformLocation(id, "uThr");
              pr.w = glGetUniformLocation(id, "uW"); pr.step = glGetUniformLocation(id, "uStep");
              pr.scene = glGetUniformLocation(id, "uScene"); pr.bloom = glGetUniformLocation(id, "uBloom");
              pr.streak = glGetUniformLocation(id, "uStreak"); pr.prev = glGetUniformLocation(id, "uPrev");
              pr.res = glGetUniformLocation(id, "uRes"); pr.time = glGetUniformLocation(id, "uTime");
              pr.hasPrev = glGetUniformLocation(id, "uHasPrev"); pr.par = glGetUniformLocation(id, "P");
              return true;
          }

          static bool buildProgs() {
              bool ok = makeProg(pBright, FS_BRIGHT, "bright") && makeProg(pDown, FS_DOWN, "down") &&
                        makeProg(pUp, FS_UP, "up") && makeProg(pStreak, FS_STREAK, "streak") && makeProg(pComp, FS_COMP, "composite");
              if (ok) glGenVertexArrays(1, &g_vao);
              return ok;
          }

          static bool mkTarget(Tgt& t, int w, int h, GLenum fmt) {
              t.w = w; t.h = h;
              glGenTextures(1, &t.tex);
              glBindTexture(GL_TEXTURE_2D, t.tex);
              glTexStorage2D(GL_TEXTURE_2D, 1, fmt, w, h);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
              glGenFramebuffers(1, &t.fbo);
              glBindFramebuffer(GL_FRAMEBUFFER, t.fbo);
              glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, t.tex, 0);
              return glCheckFramebufferStatus(GL_FRAMEBUFFER) == GL_FRAMEBUFFER_COMPLETE;
          }

          static void freeTarget(Tgt& t) {
              if (t.fbo) glDeleteFramebuffers(1, &t.fbo);
              if (t.tex) glDeleteTextures(1, &t.tex);
              t = Tgt();
          }

          static void freeAll() {
              freeTarget(scene); freeTarget(streakT); freeTarget(outA); freeTarget(outB);
              for (int i = 0; i < 6; i++) { freeTarget(dn[i]); freeTarget(up[i]); }
              g_w = g_h = g_L = 0; g_havePrev = false;
          }

          static bool ensure(int w, int h, int L, bool hdr, bool pyr, bool mb) {
              if (w == g_w && h == g_h && L == g_L && hdr == g_hdr && pyr == g_pyr && mb == g_mb) return true;
              freeAll();
              GLenum f = (hdr && g_hdrOk) ? GL_RGBA16F : GL_RGBA8;
              bool ok = mkTarget(scene, w, h, GL_RGBA8);
              if (pyr && ok) {
                  for (int i = 0; i < L && ok; i++) {
                      int tw = w >> (i + 1); int th = h >> (i + 1);
                      if (tw < 1) tw = 1;
                      if (th < 1) th = 1;
                      ok = mkTarget(dn[i], tw, th, f);
                      if (ok && i < L - 1) ok = mkTarget(up[i], tw, th, f);
                  }
                  if (ok) ok = mkTarget(streakT, dn[1].w, dn[1].h, f);
              }
              if (mb && ok) ok = mkTarget(outA, w, h, GL_RGBA8) && mkTarget(outB, w, h, GL_RGBA8);
              if (!ok) {
                  freeAll();
                  if (f == GL_RGBA16F) { g_hdrOk = false; LOGI("fp16 targets unavailable, using RGBA8"); return ensure(w, h, L, hdr, pyr, mb); }
                  LOGE("framebuffer allocation failed");
                  return false;
              }
              g_w = w; g_h = h; g_L = L; g_hdr = hdr; g_pyr = pyr; g_mb = mb;
              return true;
          }

          static void bindTex(int unit, GLuint t) {
              glActiveTexture(GL_TEXTURE0 + unit);
              glBindTexture(GL_TEXTURE_2D, t);
              glBindSampler(unit, 0);
          }

          static void drawTo(const Tgt& t) {
              glBindFramebuffer(GL_FRAMEBUFFER, t.fbo);
              glViewport(0, 0, t.w, t.h);
              glDrawArrays(GL_TRIANGLES, 0, 3);
          }

          static float PV4[(NP + 3) / 4 * 4 + 4];

          static void runPipeline(int w, int h) {
              float bl = PV[I_bloom], ha = PV[I_halation], ra = PV[I_rays], st = PV[I_streak];
              bool needBloom = bl > 0.001f || ha > 0.001f || ra > 0.001f;
              bool needStreak = st > 0.001f;
              bool pyr = needBloom || needStreak;
              bool mb = PV[I_mblur] > 0.001f;
              int L = (int)(PV[I_bloom_levels] + 0.5f);
              if (L < 2) L = 2;
              if (L > 6) L = 6;
              if (!ensure(w, h, L, PV[I_hdr] > 0.5f, pyr, mb)) { g_failed = true; return; }

              glActiveTexture(GL_TEXTURE0);
              glBindVertexArray(g_vao);
              glColorMask(GL_TRUE, GL_TRUE, GL_TRUE, GL_TRUE);

              glBindFramebuffer(GL_READ_FRAMEBUFFER, 0);
              glBindFramebuffer(GL_DRAW_FRAMEBUFFER, scene.fbo);
              glBlitFramebuffer(0, 0, w, h, 0, 0, w, h, GL_COLOR_BUFFER_BIT, GL_NEAREST);

              if (pyr) {
                  glUseProgram(pBright.id);
                  bindTex(0, scene.tex);
                  glUniform1i(pBright.tex, 0);
                  glUniform2f(pBright.texel, 1.0f / w, 1.0f / h);
                  glUniform2f(pBright.thr, PV[I_bloom_thr], PV[I_bloom_knee]);
                  drawTo(dn[0]);

                  glUseProgram(pDown.id);
                  glUniform1i(pDown.tex, 0);
                  for (int i = 1; i < L; i++) {
                      bindTex(0, dn[i - 1].tex);
                      glUniform2f(pDown.texel, 1.0f / dn[i - 1].w, 1.0f / dn[i - 1].h);
                      drawTo(dn[i]);
                  }

                  glUseProgram(pUp.id);
                  glUniform1i(pUp.tex, 0);
                  glUniform1i(pUp.add, 1);
                  float rad = PV[I_bloom_radius];
                  for (int i = L - 2; i >= 0; i--) {
                      const Tgt& src = (i == L - 2) ? dn[L - 1] : up[i + 1];
                      bindTex(0, src.tex);
                      bindTex(1, dn[i].tex);
                      glUniform2f(pUp.texel, 1.0f / src.w, 1.0f / src.h);
                      glUniform2f(pUp.w, 0.45f + 0.55f * rad, 1.0f);
                      drawTo(up[i]);
                  }

                  if (needStreak) {
                      glUseProgram(pStreak.id);
                      bindTex(0, dn[1].tex);
                      glUniform1i(pStreak.tex, 0);
                      glUniform2f(pStreak.step, 2.0f * PV[I_streak_len] / dn[1].w, 0.0f);
                      drawTo(streakT);
                  }
              }

              glUseProgram(pComp.id);
              GLuint bloomTex = pyr ? up[0].tex : scene.tex;
              GLuint streakTex = needStreak ? streakT.tex : scene.tex;
              GLuint prevTex = scene.tex;
              Tgt* cur = nullptr;
              if (mb) { cur = g_useA ? &outA : &outB; prevTex = g_useA ? outB.tex : outA.tex; }
              bindTex(0, scene.tex); bindTex(1, bloomTex); bindTex(2, streakTex); bindTex(3, prevTex);
              glUniform1i(pComp.scene, 0); glUniform1i(pComp.bloom, 1); glUniform1i(pComp.streak, 2); glUniform1i(pComp.prev, 3);
              glUniform2f(pComp.res, (float)w, (float)h);
              struct timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts);
              double now = ts.tv_sec + ts.tv_nsec * 1e-9;
              if (g_t0 == 0) g_t0 = now;
              glUniform1f(pComp.time, (float)(now - g_t0));
              glUniform1f(pComp.hasPrev, (mb && g_havePrev) ? 1.0f : 0.0f);
              for (int i = 0; i < NP; i++) PV4[i] = PV[i];
              glUniform4fv(pComp.par, (NP + 3) / 4, PV4);

              if (mb) {
                  drawTo(*cur);
                  glBindFramebuffer(GL_READ_FRAMEBUFFER, cur->fbo);
                  glBindFramebuffer(GL_DRAW_FRAMEBUFFER, 0);
                  glBlitFramebuffer(0, 0, w, h, 0, 0, w, h, GL_COLOR_BUFFER_BIT, GL_NEAREST);
                  g_useA = !g_useA; g_havePrev = true;
              } else {
                  glBindFramebuffer(GL_FRAMEBUFFER, 0);
                  glViewport(0, 0, w, h);
                  glDrawArrays(GL_TRIANGLES, 0, 3);
                  g_havePrev = false;
              }
          }

          struct GLState {
              GLint prog = 0, vao = 0, fbDraw = 0, fbRead = 0, vp[4] = {0, 0, 0, 0}, act = 0, tex[4] = {0, 0, 0, 0}, smp[4] = {0, 0, 0, 0};
              GLboolean en[9] = {0}; GLboolean cm[4] = {1, 1, 1, 1}; GLboolean dm = 1;
          };
          static const GLenum CAPS[9] = { GL_BLEND, GL_DEPTH_TEST, GL_STENCIL_TEST, GL_SCISSOR_TEST, GL_CULL_FACE, GL_DITHER,
                                          GL_POLYGON_OFFSET_FILL, GL_SAMPLE_ALPHA_TO_COVERAGE, GL_RASTERIZER_DISCARD };

          static void saveState(GLState& s) {
              glGetIntegerv(GL_CURRENT_PROGRAM, &s.prog);
              glGetIntegerv(GL_VERTEX_ARRAY_BINDING, &s.vao);
              glGetIntegerv(GL_DRAW_FRAMEBUFFER_BINDING, &s.fbDraw);
              glGetIntegerv(GL_READ_FRAMEBUFFER_BINDING, &s.fbRead);
              glGetIntegerv(GL_VIEWPORT, s.vp);
              glGetIntegerv(GL_ACTIVE_TEXTURE, &s.act);
              for (int u = 0; u < 4; u++) {
                  glActiveTexture(GL_TEXTURE0 + u);
                  glGetIntegerv(GL_TEXTURE_BINDING_2D, &s.tex[u]);
                  glGetIntegerv(GL_SAMPLER_BINDING, &s.smp[u]);
              }
              for (int i = 0; i < 9; i++) s.en[i] = glIsEnabled(CAPS[i]);
              glGetBooleanv(GL_COLOR_WRITEMASK, s.cm);
              glGetBooleanv(GL_DEPTH_WRITEMASK, &s.dm);
              for (int i = 0; i < 9; i++) glDisable(CAPS[i]);
              glDepthMask(GL_FALSE);
          }

          static void restoreState(const GLState& s) {
              for (int u = 0; u < 4; u++) {
                  glActiveTexture(GL_TEXTURE0 + u);
                  glBindTexture(GL_TEXTURE_2D, (GLuint)s.tex[u]);
                  glBindSampler(u, (GLuint)s.smp[u]);
              }
              glActiveTexture((GLenum)s.act);
              glBindFramebuffer(GL_READ_FRAMEBUFFER, (GLuint)s.fbRead);
              glBindFramebuffer(GL_DRAW_FRAMEBUFFER, (GLuint)s.fbDraw);
              glBindVertexArray((GLuint)s.vao);
              glUseProgram((GLuint)s.prog);
              glViewport(s.vp[0], s.vp[1], s.vp[2], s.vp[3]);
              glColorMask(s.cm[0], s.cm[1], s.cm[2], s.cm[3]);
              glDepthMask(s.dm);
              for (int i = 0; i < 9; i++) { if (s.en[i]) glEnable(CAPS[i]); else glDisable(CAPS[i]); }
          }

          static long long nowMs() {
              struct timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts);
              return (long long)ts.tv_sec * 1000 + ts.tv_nsec / 1000000;
          }

          static void process(EGLDisplay dpy, EGLSurface surf) {
              if (g_failed) return;
              if (!g_glLoaded) {
                  if (!loadGL()) { g_failed = true; return; }
                  g_glLoaded = true;
              }
              EGLContext c = p_eglGetCurrentContext();
              if (c == EGL_NO_CONTEXT || p_eglGetCurrentSurface(EGL_DRAW) != surf) return;
              EGLint w = 0, h = 0;
              p_eglQuerySurface(dpy, surf, EGL_WIDTH, &w);
              p_eglQuerySurface(dpy, surf, EGL_HEIGHT, &h);
              if (w < 480 || h < 270) return;

              long long t = nowMs();
              if (surf != g_surf) { if (g_surf != EGL_NO_SURFACE && t - g_lastMs < 1500) return; g_surf = surf; }
              g_lastMs = t;

              if ((++g_frame % 30) == 0) pollConfig(false);
              if (PV[I_enabled] < 0.5f) return;

              if (c != g_ctx) {
                  g_ctx = c; g_progsOk = false; g_w = g_h = g_L = 0;
                  for (Tgt* tg : {&scene, &streakT, &outA, &outB}) *tg = Tgt();
                  for (int i = 0; i < 6; i++) { dn[i] = Tgt(); up[i] = Tgt(); }
                  g_vao = 0; g_havePrev = false;
                  const char* v = (const char*)glGetString(GL_VERSION);
                  LOGI("context %p version %s", c, v ? v : "?");
              }
              const char* ver = (const char*)glGetString(GL_VERSION);
              if (!ver || !strstr(ver, "OpenGL ES 3")) return;

              GLState st;
              saveState(st);
              if (!g_progsOk) {
                  if (!buildProgs()) { g_failed = true; restoreState(st); return; }
                  g_progsOk = true;
                  LOGI("shaders ready %dx%d", w, h);
              }
              runPipeline(w, h);
              restoreState(st);
          }

          // ---------------------------------------------------------------- hooks
          static EGLBoolean (*orig_swap)(EGLDisplay, EGLSurface) = nullptr;
          static EGLBoolean (*orig_swapDmg)(EGLDisplay, EGLSurface, EGLint*, EGLint) = nullptr;
          static void* (*orig_getProc)(const char*) = nullptr;

          static EGLBoolean my_swap(EGLDisplay d, EGLSurface s) {
              process(d, s);
              return orig_swap ? orig_swap(d, s) : EGL_FALSE;
          }

          static EGLBoolean my_swapDmg(EGLDisplay d, EGLSurface s, EGLint* r, EGLint n) {
              process(d, s);
              return orig_swapDmg ? orig_swapDmg(d, s, r, n) : EGL_FALSE;
          }

          static void* my_getProc(const char* name) {
              void* p = orig_getProc ? orig_getProc(name) : nullptr;
              if (name && p) {
                  if (strcmp(name, "eglSwapBuffersWithDamageKHR") == 0 || strcmp(name, "eglSwapBuffersWithDamageEXT") == 0) {
                      orig_swapDmg = (decltype(orig_swapDmg))p;
                      return (void*)my_swapDmg;
                  }
                  if (strcmp(name, "eglSwapBuffers") == 0) { orig_swap = (decltype(orig_swap))p; return (void*)my_swap; }
              }
              return p;
          }

          static void* hookThread(void*) {
              xhook_enable_debug(0);
              xhook_register(".*\\.so$", "eglSwapBuffers", (void*)my_swap, (void**)&orig_swap);
              xhook_register(".*\\.so$", "eglSwapBuffersWithDamageKHR", (void*)my_swapDmg, (void**)&orig_swapDmg);
              xhook_register(".*\\.so$", "eglSwapBuffersWithDamageEXT", (void*)my_swapDmg, (void**)&orig_swapDmg);
              xhook_register(".*\\.so$", "eglGetProcAddress", (void*)my_getProc, (void**)&orig_getProc);
              xhook_ignore(".*/libEGL\\.so$", nullptr);
              xhook_ignore(".*/arm64-v8a\\.so$", nullptr);
              for (int i = 0;; i++) {
                  sleep(i < 20 ? 1 : 10);
                  xhook_refresh(0);
              }
              return nullptr;
          }

          static void startHooks(const std::string& cfg) {
              g_cfgPath = cfg;
              loadDefaults();
              pollConfig(true);
              pthread_t th;
              if (pthread_create(&th, nullptr, hookThread, nullptr) == 0) pthread_detach(th);
          }

          // ---------------------------------------------------------------- Zygisk module
          class CineModule : public zygisk::ModuleBase {
          public:
              void onLoad(zygisk::Api* api, JNIEnv* env) override { api_ = api; env_ = env; }

              void preAppSpecialize(zygisk::AppSpecializeArgs* args) override {
                  if (args->app_data_dir) {
                      const char* d = env_->GetStringUTFChars(args->app_data_dir, nullptr);
                      if (d) { dataDir_ = d; env_->ReleaseStringUTFChars(args->app_data_dir, d); }
                  }
              }

              void postAppSpecialize(const zygisk::AppSpecializeArgs*) override {
                  std::string cfg = dataDir_ + "/cineshade.ini";
                  if (dataDir_.empty() || access(cfg.c_str(), R_OK) != 0) {
                      api_->setOption(zygisk::Option::DLCLOSE_MODULE_LIBRARY);
                      return;
                  }
                  LOGI("injecting into %s", dataDir_.c_str());
                  startHooks(cfg);
              }

          private:
              zygisk::Api* api_ = nullptr;
              JNIEnv* env_ = nullptr;
              std::string dataDir_;
          };

          REGISTER_ZYGISK_MODULE(CineModule)
          EOF
          mkdir -p $(dirname mod/module.prop)
          cat > mod/module.prop <<'EOF'
          id=cineshade
          name=CineShade
          version=v1.0
          versionCode=1
          author=CineShade
          description=ReShade-style post-processing for Android games. Zygisk module, configured by the CineShade app.
          EOF
          mkdir -p $(dirname mod/uninstall.sh)
          cat > mod/uninstall.sh <<'EOF'
          #!/system/bin/sh
          rm -f /data/data/*/cineshade.ini
          EOF
          mkdir -p $(dirname mod/META-INF/com/google/android/updater-script)
          cat > mod/META-INF/com/google/android/updater-script <<'EOF'
          #MAGISK
          EOF
          mkdir -p $(dirname mod/META-INF/com/google/android/update-binary)
          cat > mod/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh

          umask 022

          ui_print() { echo "$1"; }

          require_new_magisk() {
            ui_print "*******************************"
            ui_print " Please install Magisk v20.4+! "
            ui_print "*******************************"
            exit 1
          }

          OUTFD=$2
          ZIPFILE=$3

          mount /data 2>/dev/null

          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 20400 ] && require_new_magisk

          install_module
          exit 0
          EOF
      - name: Build native module
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -d "$NDK" ] || NDK="${ANDROID_NDK_HOME:-}"
          [ -d "$NDK" ] || NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n1)
          echo "NDK=$NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          git clone --depth 1 https://github.com/topjohnwu/zygisk-module-sample zs
          git clone --depth 1 https://github.com/iqiyi/xHook xh
          ZF=$(find zs -name zygisk.hpp | head -n1)
          XF=$(find xh -name xhook.h | head -n1)
          [ -n "$ZF" ] && [ -n "$XF" ] || { echo "dependency headers not found"; exit 1; }
          ZH=$(dirname "$ZF"); XH=$(dirname "$XF")
          echo "zygisk: $ZH  xhook: $XH"
          mkdir -p build mod/zygisk
          for f in xhook xh_core xh_elf xh_log xh_util xh_version; do
            "$TC/aarch64-linux-android26-clang" -O2 -fPIC -fvisibility=hidden -include stdint.h -include stddef.h -include unistd.h '-DPAGE_SIZE=((uintptr_t)sysconf(_SC_PAGESIZE))' '-DPAGE_MASK=(~((uintptr_t)sysconf(_SC_PAGESIZE)-1))' -I"$XH" -c "$XH/$f.c" -o "build/$f.o"
          done
          "$TC/aarch64-linux-android26-clang++" -std=c++17 -O2 -fPIC -fvisibility=hidden -I"$ZH" -I"$XH" -shared native/cineshade.cpp build/*.o -llog -ldl -static-libstdc++ -Wl,-z,max-page-size=16384 -o mod/zygisk/arm64-v8a.so
          ls -l mod/zygisk
      - name: Package module
        run: |
          set -e
          chmod +x mod/META-INF/com/google/android/update-binary
          (cd mod && zip -r ../cineshade-module.zip .)
          mkdir -p app/src/main/assets
          cp cineshade-module.zip app/src/main/assets/cineshade-module.zip
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: CineShade-apk, path: app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: CineShade-module, path: cineshade-module.zip }
