name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/cineoverlay app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CineOverlay"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.cineoverlay"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.cineoverlay"; minSdk = 26; targetSdk = 34; versionCode = 2; versionName = "2.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <application android:label="CineOverlay"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FxService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Screen overlay visual effects"/>
                  </service>
                  <service android:name=".FxTile" android:exported="true"
                      android:label="Cine"
                      android:icon="@drawable/ic_tile"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>
                  <service android:name=".CamService" android:exported="true"
                      android:label="CineOverlay Camera"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/cam_service"/>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#1A1D27" android:endColor="#07080B" android:angle="270"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:strokeColor="#F5B942" android:strokeWidth="3.5" android:fillColor="#00000000"
                  android:pathData="M54,54m-24,0a24,24 0 1,0 48,0a24,24 0 1,0 -48,0"/>
              <path android:strokeColor="#3FD0C9" android:strokeWidth="2.5" android:fillColor="#00000000"
                  android:pathData="M54,54m-14,0a14,14 0 1,0 28,0a14,14 0 1,0 -28,0"/>
              <path android:fillColor="#F5B942"
                  android:pathData="M54,54m-5,0a5,5 0 1,0 10,0a5,5 0 1,0 -10,0"/>
              <path android:strokeColor="#F5B942" android:strokeWidth="3" android:fillColor="#00000000"
                  android:pathData="M54,28L54,38M54,70L54,80M28,54L38,54M70,54L80,54"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_tile.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:fillColor="#00000000"
                  android:pathData="M12,12m-8,0a8,8 0 1,0 16,0a8,8 0 1,0 -16,0"/>
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,12m-3,0a3,3 0 1,0 6,0a3,3 0 1,0 -6,0"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/xml/cam_service.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canControlMagnification="true"
              android:notificationTimeout="100"
              android:description="@string/cam_desc"/>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="cam_desc">Used by CineOverlay to zoom and pan the screen for handheld-camera effects. It does not read screen content.</string>
          </resources>
          EOF
          cat > app/src/main/java/com/example/cineoverlay/Params.kt <<'EOF'
          package com.example.cineoverlay

          import org.json.JSONObject
          import java.util.Locale

          enum class Kind { SLIDER, SWITCH, CHOICE }
          enum class Target { MATRIX, OVERLAY, NATIVE, SYSTEM, APP }

          class Param(
              val key: String,
              val label: String,
              val group: String,
              val target: Target,
              val min: Float,
              val max: Float,
              val def: Float,
              val kind: Kind = Kind.SLIDER,
              val unit: String = "",
              val decimals: Int = 0,
              val style: String = "",
              val options: List<String> = emptyList(),
              val tpl: Boolean = true
          ) {
              var idx = -1

              fun fmt(v: Float): String = when (kind) {
                  Kind.SWITCH -> if (v > 0.5f) "ON" else "OFF"
                  Kind.CHOICE -> options.getOrElse(v.toInt()) { "" }
                  Kind.SLIDER -> {
                      val s = String.format(Locale.US, "%." + decimals + "f", v)
                      (if (min < 0f && v > 0f) "+" else "") + s + unit
                  }
              }

              fun step(): Float {
                  var s = 1f
                  repeat(decimals) { s /= 10f }
                  return s
              }

              fun isMod(v: Float): Boolean = Math.abs(v - def) > 1e-4f
          }

          class TabDef(val name: String, val icon: String, val groups: List<String>)

          /** Central parameter store. Every control in the app is one Param; values live in [v]. */
          object P {
              val all = ArrayList<Param>()
              private val map = HashMap<String, Param>()

              val aspects = floatArrayOf(2.76f, 2.39f, 2.00f, 1.85f, 1.7778f)

              val tabs = listOf(
                  TabDef("Grade", "◐", listOf("Exposure & Tone", "Color Balance", "Split Toning", "Stock Effects", "Channel Mixer")),
                  TabDef("Look", "✦", listOf("Lens", "Film", "Light", "Display", "Frame", "Viewfinder HUD")),
                  TabDef("Optics", "◉", listOf("Native Blur", "Depth of Field", "Rack Focus", "Camera Move")),
                  TabDef("Presets", "▤", emptyList()),
                  TabDef("System", "⚙", listOf("System Motion", "Behaviour"))
              )

              private fun add(p: Param): Param {
                  p.idx = all.size
                  all.add(p)
                  map[p.key] = p
                  return p
              }

              private fun isTpl(t: Target) = t == Target.MATRIX || t == Target.OVERLAY || t == Target.NATIVE

              private fun s(key: String, label: String, group: String, t: Target, min: Float, max: Float, def: Float,
                            unit: String = "", dec: Int = 0, style: String = "") =
                  add(Param(key, label, group, t, min, max, def, Kind.SLIDER, unit, dec, style, emptyList(), isTpl(t)))

              private fun sw(key: String, label: String, group: String, t: Target, def: Boolean) =
                  add(Param(key, label, group, t, 0f, 1f, if (def) 1f else 0f, Kind.SWITCH, "", 0, "", emptyList(), isTpl(t)))

              private fun ch(key: String, label: String, group: String, t: Target, def: Int, opts: List<String>) =
                  add(Param(key, label, group, t, 0f, (opts.size - 1).toFloat(), def.toFloat(), Kind.CHOICE, "", 0, "", opts, isTpl(t)))

              init {
                  val M = Target.MATRIX
                  val O = Target.OVERLAY
                  val N = Target.NATIVE

                  // ---------------- GRADE (root: SurfaceFlinger color matrix) ----------------
                  s("exposure", "Exposure", "Exposure & Tone", M, -2f, 0.8f, 0f, " EV", 2)
                  s("contrast", "Contrast", "Exposure & Tone", M, 50f, 150f, 100f, "%")
                  s("blacks", "Blacks  (crush ← → fade)", "Exposure & Tone", M, -30f, 30f, 0f, "%")
                  s("whites", "Highlight gain", "Exposure & Tone", M, 70f, 130f, 100f, "%")
                  s("dim", "Extra dim", "Exposure & Tone", M, 0f, 100f, 0f, "%")

                  s("sat", "Saturation", "Color Balance", M, 0f, 200f, 100f, "%")
                  s("hue", "Hue rotate", "Color Balance", M, -180f, 180f, 0f, "°")
                  s("temp", "Temperature", "Color Balance", M, -100f, 100f, 0f, "", 0, "temp")
                  s("tint", "Tint", "Color Balance", M, -100f, 100f, 0f, "", 0, "tint")

                  s("shHue", "Shadow hue", "Split Toning", M, 0f, 360f, 200f, "°", 0, "hue")
                  s("shAmt", "Shadow amount", "Split Toning", M, 0f, 100f, 0f, "%")
                  s("hiHue", "Highlight hue", "Split Toning", M, 0f, 360f, 30f, "°", 0, "hue")
                  s("hiAmt", "Highlight amount", "Split Toning", M, 0f, 100f, 0f, "%")

                  s("bleach", "Bleach bypass", "Stock Effects", M, 0f, 100f, 0f, "%")
                  s("sepia", "Sepia", "Stock Effects", M, 0f, 100f, 0f, "%")
                  s("invert", "Invert", "Stock Effects", M, 0f, 100f, 0f, "%")

                  val names = listOf("Red", "Green", "Blue")
                  for (o in 0..2) {
                      for (i in 0..2) {
                          s("m" + "rgb"[o] + "rgb"[i], names[o] + " out  ←  " + names[i] + " in", "Channel Mixer", M,
                              -100f, 200f, if (o == i) 100f else 0f, "%")
                      }
                  }

                  // ---------------- LOOK (GPU overlay) ----------------
                  s("vig", "Vignette", "Lens", O, 0f, 100f, 40f, "%")
                  s("vigSize", "Vignette size", "Lens", O, 0f, 100f, 55f, "%")
                  s("vigRound", "Vignette roundness", "Lens", O, 0f, 100f, 0f, "%")
                  s("fringe", "Chromatic fringe", "Lens", O, 0f, 100f, 30f, "%")
                  s("halation", "Halation glow", "Lens", O, 0f, 100f, 0f, "%")
                  s("flare", "Anamorphic streak", "Lens", O, 0f, 100f, 0f, "%")
                  s("flareY", "Streak position", "Lens", O, 0f, 100f, 50f, "%")

                  s("grain", "Film grain", "Film", O, 0f, 100f, 25f, "%")
                  s("grainSize", "Grain size", "Film", O, 1f, 6f, 2f, " px", 1)
                  s("grainChroma", "Chroma grain", "Film", O, 0f, 100f, 10f, "%")
                  s("grainFps", "Grain frame rate", "Film", O, 6f, 48f, 24f, " fps")
                  s("flicker", "Projector flicker", "Film", O, 0f, 100f, 0f, "%")
                  s("dust", "Dust & scratches", "Film", O, 0f, 100f, 0f, "%")

                  s("leak", "Light leak", "Light", O, 0f, 100f, 0f, "%")
                  s("leakHue", "Leak hue", "Light", O, 0f, 360f, 20f, "°", 0, "hue")
                  s("wash", "Teal · Orange wash", "Light", O, 0f, 100f, 0f, "%")

                  s("scan", "Scanlines", "Display", O, 0f, 100f, 0f, "%")
                  s("scanGap", "Line spacing", "Display", O, 2f, 12f, 4f, " px")

                  s("bars", "Letterbox", "Frame", O, 0f, 100f, 0f, "%")
                  ch("aspect", "Aspect ratio", "Frame", O, 1, listOf("2.76", "2.39", "2.00", "1.85", "16:9"))

                  sw("hudRec", "REC + timecode", "Viewfinder HUD", O, false)
                  sw("hudGrid", "Rule-of-thirds grid", "Viewfinder HUD", O, false)
                  sw("hudBrackets", "Frame brackets", "Viewfinder HUD", O, false)
                  sw("hudReticle", "Focus reticle", "Viewfinder HUD", O, false)
                  s("hudAlpha", "HUD opacity", "Viewfinder HUD", O, 20f, 100f, 70f, "%")

                  // ---------------- OPTICS (native compositor blur + accessibility magnification) ----------------
                  s("blur", "Global blur", "Native Blur", N, 0f, 100f, 0f, "%")
                  s("mist", "Bloom · soft-focus diffusion", "Native Blur", N, 0f, 100f, 0f, "%")
                  s("mistRadius", "Diffusion radius", "Native Blur", N, 5f, 80f, 24f, " px")
                  s("mistGlow", "Glow lift", "Native Blur", N, 0f, 100f, 20f, "%")

                  s("dof", "Edge blur strength", "Depth of Field", N, 0f, 100f, 0f, "%")
                  ch("dofAxis", "Focus band direction", "Depth of Field", N, 0, listOf("Horizontal", "Vertical"))
                  s("focusY", "Focus position", "Depth of Field", N, 0f, 100f, 50f, "%")
                  s("focusH", "Focus size", "Depth of Field", N, 5f, 90f, 35f, "%")
                  s("focusSoft", "Transition softness", "Depth of Field", N, 0f, 100f, 60f, "%")

                  sw("rack", "Random focus pulls", "Rack Focus", N, false)
                  s("rackEvery", "Pull interval", "Rack Focus", N, 1f, 15f, 4f, " s")
                  s("rackSpeed", "Pull speed", "Rack Focus", N, 10f, 100f, 50f, "%")
                  s("rackRange", "Focus travel", "Rack Focus", N, 0f, 100f, 60f, "%")
                  s("rackDepth", "Blur depth variation", "Rack Focus", N, 0f, 100f, 50f, "%")

                  sw("cam", "Camera movement", "Camera Move", N, false)
                  s("camZoom", "Crop zoom (room to move)", "Camera Move", N, 100f, 125f, 104f, "%")
                  s("camShake", "Handheld shake", "Camera Move", N, 0f, 100f, 30f, "%")
                  s("camRough", "Shake roughness", "Camera Move", N, 0f, 100f, 40f, "%")
                  s("camDrift", "Slow drift", "Camera Move", N, 0f, 100f, 40f, "%")
                  s("camBreath", "Breathing push-in", "Camera Move", N, 0f, 100f, 0f, "%")
                  s("camSpeed", "Motion speed", "Camera Move", N, 20f, 300f, 100f, "%")

                  // ---------------- SYSTEM (root: settings) ----------------
                  s("animScale", "Animation duration  (lower = snappier)", "System Motion", Target.SYSTEM, 20f, 250f, 100f, "%")
                  ch("refresh", "Force refresh rate", "System Motion", Target.SYSTEM, 0, listOf("System", "60", "90", "120", "144"))
                  sw("safeTrial", "5s safe trial (auto-revert)", "Behaviour", Target.APP, true)
                  sw("autoStart", "Start engine on boot", "Behaviour", Target.APP, false)
                  sw("haptics", "Haptic feedback", "Behaviour", Target.APP, true)
              }

              val v = FloatArray(all.size) { all[it].def }

              private val undo = ArrayDeque<FloatArray>()

              fun find(key: String): Param? = map[key]
              fun index(key: String): Int = map.getValue(key).idx
              operator fun get(key: String): Float = v[map.getValue(key).idx]
              fun b(key: String): Boolean = get(key) > 0.5f
              fun i(key: String): Int = get(key).toInt()

              fun set(p: Param, value: Float) {
                  v[p.idx] = value.coerceIn(p.min, p.max)
                  when (p.target) {
                      Target.MATRIX -> RootEngine.dirtyMatrix()
                      Target.SYSTEM -> RootEngine.dirtySystem()
                      else -> {}
                  }
                  Store.saveSoon()
              }

              fun changedAll() {
                  RootEngine.dirtyMatrix()
                  Store.saveSoon()
              }

              fun resetTpl() {
                  for (p in all) if (p.tpl) v[p.idx] = p.def
              }

              fun resetAll() {
                  pushUndo()
                  resetTpl()
                  changedAll()
              }

              fun modifiedCount(params: List<Param>): Int = params.count { it.isMod(v[it.idx]) }

              fun templateTweaks(a: FloatArray): Int = all.count { it.tpl && it.isMod(a[it.idx]) }

              // ---- undo ----
              fun pushUndo() {
                  undo.addLast(v.copyOf())
                  if (undo.size > 40) undo.removeFirst()
              }

              fun popUndo(): Boolean {
                  val a = undo.removeLastOrNull() ?: return false
                  for (p in all) if (p.tpl) v[p.idx] = a[p.idx]
                  changedAll()
                  return true
              }

              // ---- snapshots / json ----
              fun toJson(tplOnly: Boolean): JSONObject {
                  val o = JSONObject()
                  for (p in all) if (!tplOnly || p.tpl) o.put(p.key, v[p.idx].toDouble())
                  return o
              }

              fun fromJson(o: JSONObject, resetMissing: Boolean, tplOnly: Boolean) {
                  for (p in all) {
                      if (tplOnly && !p.tpl) continue
                      if (o.has(p.key)) {
                          v[p.idx] = o.optDouble(p.key, p.def.toDouble()).toFloat().coerceIn(p.min, p.max)
                      } else if (resetMissing) {
                          v[p.idx] = p.def
                      }
                  }
              }

              fun arrayFromJson(o: JSONObject): FloatArray {
                  val a = FloatArray(all.size) { all[it].def }
                  for (p in all) if (p.tpl && o.has(p.key)) a[p.idx] = o.optDouble(p.key, p.def.toDouble()).toFloat().coerceIn(p.min, p.max)
                  return a
              }

              fun arrayFromMap(m: Map<String, Float>): FloatArray {
                  val a = FloatArray(all.size) { all[it].def }
                  for ((k, value) in m) {
                      val p = map[k] ?: continue
                      a[p.idx] = value.coerceIn(p.min, p.max)
                  }
                  return a
              }

              fun applyArray(a: FloatArray) {
                  for (p in all) if (p.tpl) v[p.idx] = a[p.idx]
                  changedAll()
              }
          }

          class Preset(val name: String, val note: String, val v: Map<String, Float>)

          object Presets {
              val list: List<Preset> = listOf(
                  Preset("Neutral", "Clean slate. Nothing applied.", mapOf()),

                  Preset("Blockbuster", "Teal shadows, orange skin, punchy contrast.", mapOf(
                      "shHue" to 190f, "shAmt" to 60f, "hiHue" to 28f, "hiAmt" to 60f,
                      "sat" to 112f, "contrast" to 112f, "blacks" to 4f, "temp" to 6f,
                      "vig" to 35f, "grain" to 18f, "fringe" to 18f, "flare" to 20f, "flareY" to 40f)),

                  Preset("Bleach Bypass", "Silver-retention look. Gritty, desaturated, hard.", mapOf(
                      "bleach" to 75f, "contrast" to 112f, "blacks" to -4f, "sat" to 92f,
                      "grain" to 38f, "grainSize" to 2.5f, "vig" to 32f, "fringe" to 10f)),

                  Preset("Noir", "High-contrast monochrome with projector dirt.", mapOf(
                      "sat" to 0f, "contrast" to 135f, "blacks" to -8f, "whites" to 105f,
                      "vig" to 58f, "grain" to 42f, "flicker" to 14f, "dust" to 28f, "fringe" to 0f)),

                  Preset("Tungsten 500T", "Warm night stock, halated highlights.", mapOf(
                      "temp" to 24f, "sat" to 105f, "contrast" to 106f, "blacks" to 6f,
                      "shHue" to 210f, "shAmt" to 30f, "hiHue" to 35f, "hiAmt" to 38f,
                      "halation" to 42f, "grain" to 46f, "grainChroma" to 25f, "vig" to 30f,
                      "leak" to 18f, "leakHue" to 18f, "dust" to 14f, "fringe" to 14f, "flicker" to 8f)),

                  Preset("Pastel Symmetry", "Soft, candy-box palette. Lifted blacks.", mapOf(
                      "sat" to 118f, "contrast" to 92f, "blacks" to 12f, "whites" to 104f,
                      "exposure" to 0.15f, "temp" to 8f, "tint" to 8f,
                      "shHue" to 340f, "shAmt" to 28f, "hiHue" to 50f, "hiAmt" to 28f,
                      "vig" to 12f, "grain" to 8f, "fringe" to 6f)),

                  Preset("Neon Dystopia", "Purple shadows, amber haze, glowing streaks.", mapOf(
                      "sat" to 125f, "contrast" to 118f, "temp" to 18f, "blacks" to 5f,
                      "shHue" to 275f, "shAmt" to 58f, "hiHue" to 25f, "hiAmt" to 72f,
                      "halation" to 55f, "flare" to 60f, "flareY" to 38f, "fringe" to 40f,
                      "vig" to 40f, "grain" to 20f, "scan" to 14f)),

                  Preset("Green Code", "Sickly green cast, phosphor scanlines.", mapOf(
                      "sat" to 85f, "tint" to -55f, "temp" to -10f, "contrast" to 118f,
                      "shHue" to 130f, "shAmt" to 48f, "hiHue" to 120f, "hiAmt" to 40f,
                      "mrr" to 85f, "mrg" to 15f, "mbb" to 90f, "mbg" to 10f,
                      "scan" to 24f, "scanGap" to 3f, "grain" to 20f, "vig" to 42f)),

                  Preset("Fury Desert", "Scorched orange, hyper-saturated, dusty.", mapOf(
                      "temp" to 45f, "sat" to 135f, "contrast" to 125f, "exposure" to 0.1f,
                      "hiHue" to 35f, "hiAmt" to 72f, "shHue" to 200f, "shAmt" to 48f,
                      "vig" to 38f, "grain" to 22f, "dust" to 32f)),

                  Preset("Day for Night", "Moonlit blue, crushed exposure.", mapOf(
                      "exposure" to -0.6f, "temp" to -55f, "sat" to 70f, "contrast" to 110f,
                      "shHue" to 225f, "shAmt" to 62f, "hiHue" to 215f, "hiAmt" to 38f,
