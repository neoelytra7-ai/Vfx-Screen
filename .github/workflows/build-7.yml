                  }
                  pressAnim = a
                  a.start()
              }

              private fun fromX(x: Float) {
                  val l = padX
                  val r = width - padX
                  val frac = ((x - l) / (r - l)).coerceIn(0f, 1f)
                  var v = p.min + frac * (p.max - p.min)
