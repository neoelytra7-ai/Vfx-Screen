              // ------------------------------------------------------------------ 5s safe trial
              private fun matrixDiffers(): Boolean {
                  val c = confirmed ?: return false
                  for (p in P.all) {
                      if (p.target == Target.MATRIX && Math.abs(P.v[p.idx] - c[p.idx]) > 1e-4f) return true
                  }
                  return false
              }

              private fun armTrial(fromPower: Boolean) {
                  if (!P.b("safeTrial") || !RootEngine.enabled) return
                  if (!fromPower && !trialPending && !matrixDiffers()) return
                  if (fromPower) trialPower = true
                  trialPending = true
                  trialDeadline = SystemClock.elapsedRealtime() + 5000L
                  showBanner(true)
                  ui.removeCallbacks(trialTick)
                  ui.post(trialTick)
              }

              private fun cancelTrial() {
                  trialPending = false
                  trialPower = false
                  ui.removeCallbacks(trialTick)
                  showBanner(false)
              }

              private fun keepTrial() {
                  confirmed = P.v.copyOf()
                  cancelTrial()
                  toast("Grade kept")
              }

              private fun trialExpired() {
                  val wasPower = trialPower
                  cancelTrial()
                  if (wasPower) {
                      setPower(false)
                      toast("No confirmation · engine turned off")
                  } else {
                      val c = confirmed
                      if (c != null) {
                          for (p in P.all) if (p.target == Target.MATRIX) P.v[p.idx] = c[p.idx]
                          P.changedAll()
                          for (r in rows) r.sync(true)
                          for (s in sections) s.refreshBadge()
                          toast("Reverted to last confirmed grade")
                      }
                  }
              }

              private fun buildBanner() {
                  val b = LinearLayout(this)
                  b.orientation = LinearLayout.HORIZONTAL
                  b.gravity = Gravity.CENTER_VERTICAL
                  b.setPadding(dp(20f), dp(8f), dp(8f), dp(8f))
                  b.background = rbg(0xF0222633.toInt(), dpf(28f))
                  b.elevation = dpf(10f)
                  val tv = TextView(this)
                  tv.textSize = 13.5f
                  tv.setTextColor(Th.TEXT)
                  tv.typeface = medium()
                  b.addView(tv, LinearLayout.LayoutParams(WRAP, WRAP))
                  val keep = pill(this, "KEEP", Th.GOLD, Th.INK, 13f)
                  keep.setOnClickListener {
                      keep.haptic(true)
                      keepTrial()
                  }
                  val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                  lp.leftMargin = dp(14f)
                  b.addView(keep, lp)
                  b.visibility = View.GONE
                  val flp = FrameLayout.LayoutParams(WRAP, WRAP, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
                  flp.bottomMargin = dp(150f)
                  root.addView(b, flp)
                  banner = b
                  bannerTv = tv
              }

              private fun showBanner(show: Boolean) {
                  val b = banner ?: return
                  if (show) {
                      if (b.visibility == View.VISIBLE && b.alpha > 0.9f) return
                      b.visibility = View.VISIBLE
                      b.alpha = 0f
                      b.translationY = dpf(30f)
                      b.animate().alpha(1f).translationY(0f).setDuration(300).setInterpolator(OvershootInterpolator(1.4f)).start()
                  } else {
                      b.animate().alpha(0f).translationY(dpf(20f)).setDuration(220).withEndAction {
                          if (!trialPending) b.visibility = View.GONE
                      }.start()
                  }
              }

              // ------------------------------------------------------------------ toast
              private fun toast(msg: String) {
                  val t = toastView ?: TextView(this).also {
                      it.textSize = 13.5f
                      it.setTextColor(Th.TEXT)
                      it.typeface = medium()
                      it.setPadding(dp(20f), dp(12f), dp(20f), dp(12f))
                      it.background = rbg(0xF0222633.toInt(), dpf(24f))
                      it.elevation = dpf(8f)
                      toastView = it
                  }
                  if (t.parent == null) {
                      val lp = FrameLayout.LayoutParams(WRAP, WRAP, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
                      lp.bottomMargin = dp(92f)
                      root.addView(t, lp)
                  }
                  t.text = msg
                  t.animate().cancel()
                  t.alpha = 0f
                  t.translationY = dpf(30f)
                  t.scaleX = 0.9f
                  t.scaleY = 0.9f
                  t.animate().alpha(1f).translationY(0f).scaleX(1f).scaleY(1f)
                      .setStartDelay(0).setDuration(300).setInterpolator(OvershootInterpolator(1.4f))
                      .withEndAction {
                          t.animate().alpha(0f).translationY(dpf(16f)).setStartDelay(1500).setDuration(260).start()
                      }.start()
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: CineOverlay-debug, path: app/build/outputs/apk/debug/*.apk }
