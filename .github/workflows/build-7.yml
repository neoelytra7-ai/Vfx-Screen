          package com.example.cineoverlay

          /**
           * Single-pass AGSL fragment shader (Android 13+, runs on the GPU via RenderThread).
           * Output is premultiplied RGBA that gets alpha-composited over the screen.
           * Layers are stacked with a premultiplied "over" operator, bottom to top.
           */
          object Shaders {
              val AGSL: String = """
          uniform float2 res;
          uniform float time;
          uniform float gtime;
          uniform float vig;
          uniform float vigSize;
          uniform float vigRound;
          uniform float fringe;
          uniform float halation;
          uniform float flare;
          uniform float flareY;
          uniform float grain;
          uniform float grainSize;
          uniform float chroma;
          uniform float flicker;
          uniform float dust;
          uniform float leak;
          uniform float leakHue;
          uniform float scan;
          uniform float scanGap;
          uniform float wash;
          uniform float2 bars;

          float hash12(float2 p) {
              float3 p3 = fract(float3(p.x, p.y, p.x) * 0.1031);
              p3 += dot(p3, float3(p3.y, p3.z, p3.x) + 33.33);
              return fract((p3.x + p3.y) * p3.z);
          }

          float3 hue2rgb(float h) {
              float3 k = fract(float3(0.0, 0.6666667, 0.3333333) + h);
              return clamp(abs(k * 6.0 - 3.0) - 1.0, 0.0, 1.0);
          }

          void over(inout float3 c, inout float a, float3 s, float sa) {
              float k = clamp(sa, 0.0, 1.0);
              c = s * k + c * (1.0 - k);
              a = k + a * (1.0 - k);
          }

          half4 main(float2 fc) {
              float2 uv = fc / res;
              float aspect = res.x / res.y;
              float3 col = float3(0.0);
              float a = 0.0;

              // teal -> orange wash
              if (wash > 0.5) {
                  over(col, a, mix(float3(0.0, 0.43, 0.51), float3(1.0, 0.47, 0.12), uv.y), wash * 0.0045);
              }

              // drifting light leak
              if (leak > 0.5) {
                  float lx = 0.5 + 0.5 * sin(time * 0.21);
                  float2 d2 = (uv - float2(lx * 1.4 - 0.2, -0.05)) * float2(aspect * 0.9 + 0.35, 1.0);
                  float k = 1.0 - smoothstep(0.0, 0.95, length(d2));
                  float fl = 0.78 + 0.22 * sin(time * 3.1) * sin(time * 1.7);
                  over(col, a, hue2rgb(leakHue / 360.0), k * k * fl * leak * 0.005);
              }

              // halation: warm red bloom creeping in from the edges
              if (halation > 0.5) {
                  float2 q = (uv - 0.5) * 2.0;
                  float e = smoothstep(0.55, 1.45, length(q));
                  over(col, a, float3(1.0, 0.27, 0.10), e * e * halation * 0.0035);
              }

              // anamorphic streak
              if (flare > 0.5) {
                  float py = abs(fc.y - flareY * 0.01 * res.y);
                  float cx = 0.5 + 0.38 * sin(time * 0.23);
                  float q = (uv.x - cx) * 1.5;
                  float fx = exp(-q * q * 2.0);
                  float s = exp(-py * 0.22) * 0.55 + exp(-py * 0.03) * 0.22;
                  over(col, a, float3(0.40, 0.65, 1.0), s * (0.25 + 0.75 * fx) * flare * 0.0065);
              }

              // chromatic fringing: red / cyan rings pushed in opposite directions
              if (fringe > 0.5) {
                  float2 cp = fc - res * 0.5;
                  float rr = length(res * 0.5);
                  float off = res.x * 0.006 * (fringe / 50.0);
                  float er = smoothstep(0.7, 1.0, length(cp - float2(off, 0.0)) / rr);
                  float ec = smoothstep(0.7, 1.0, length(cp + float2(off, 0.0)) / rr);
                  over(col, a, float3(1.0, 0.0, 0.16), er * fringe * 0.004);
                  over(col, a, float3(0.0, 0.86, 1.0), ec * fringe * 0.004);
              }

              // dust specks + vertical scratches (12 fps)
              if (dust > 0.5) {
                  float ft = floor(time * 12.0);
                  float2 cell = floor(fc / 48.0);
                  float r1 = hash12(cell + ft * 13.7);
                  float r2 = hash12(cell * 1.7 + ft * 5.3 + 3.1);
                  float r3 = hash12(cell * 2.3 + ft * 9.1 + 7.7);
                  float r4 = hash12(cell + ft * 3.3 + 21.0);
                  float2 sp = (cell + float2(r2, r3)) * 48.0;
                  float dd = length(fc - sp);
                  float speck = (1.0 - smoothstep(0.0, 1.0 + r4 * 3.0, dd)) * step(1.0 - dust * 0.0007, r1);
                  float3 sc = (r4 > 0.5) ? float3(1.0) : float3(0.0);
                  over(col, a, sc, speck * 0.7);
                  float fr = hash12(float2(ft, 7.0));
                  float sx = hash12(float2(ft, 3.0)) * res.x;
                  float seg = 1.0 - smoothstep(0.12, 0.22, abs(uv.y - hash12(float2(ft, 11.0))));
                  float ln = (1.0 - smoothstep(0.0, 1.3, abs(fc.x - sx))) * seg * step(1.0 - dust * 0.0012, fr);
                  over(col, a, float3(1.0), ln * 0.28);
              }

              // scanlines
              if (scan > 0.5) {
                  float sl = step(mod(fc.y, max(scanGap, 2.0)), 1.5);
                  over(col, a, float3(0.0), sl * scan * 0.007);
              }

              // film grain: signed noise, light grains over dark grains, optional chroma
              if (grain > 0.5) {
                  float2 g = floor(fc / max(grainSize, 1.0));
                  float seed = gtime * 37.0;
                  float n = hash12(g + seed) - 0.5;
                  float3 cn = float3(hash12(g + seed + 11.0), hash12(g + seed + 23.0), hash12(g + seed + 41.0)) - 0.5;
                  float cm = chroma * 0.01;
                  float lum = mix(n, (cn.x + cn.y + cn.z) * 0.3333, cm);
                  float3 gc = (lum > 0.0) ? float3(1.0) : float3(0.0);
                  gc = mix(gc, clamp(float3(0.5) + cn * 2.0, 0.0, 1.0), cm);
                  over(col, a, gc, abs(lum) * 2.0 * grain * 0.0032);
              }

              // vignette (blend between screen-shaped ellipse and a true circle)
              if (vig > 0.5) {
                  float2 q = (uv - 0.5) * 2.0;
                  float de = length(q) / 1.4142;
                  float dc = length(fc - res * 0.5) / length(res * 0.5);
                  float d = mix(de, dc, vigRound * 0.01);
                  float inner = clamp(vigSize * 0.009, 0.05, 0.9);
                  float v = smoothstep(inner, 1.05, d);
                  over(col, a, float3(0.0), pow(v, 1.4) * vig * 0.0095);
              }

              // projector flicker
              if (flicker > 0.5) {
                  float fr = hash12(float2(floor(time * 24.0), 5.0));
                  over(col, a, float3(0.0), fr * fr * flicker * 0.0016);
              }

              // letterbox / pillarbox bars (px thickness in bars.x top+bottom, bars.y left+right)
              float inY = step(fc.y, bars.x) + step(res.y - bars.x, fc.y);
              float inX = step(fc.x, bars.y) + step(res.x - bars.y, fc.x);
              over(col, a, float3(0.0), clamp(inX + inY, 0.0, 1.0));

              return half4(half3(col), half(a));
          }
          """.trimIndent()
          }
