                  if (u[7] > 0.5f) {
                      val rnd = Random(u[20].toLong())
                      val n = 200 + (u[7] * 12f).toInt()
                      p.strokeWidth = 2.5f * u[8] / 2f
                      p.style = Paint.Style.STROKE
                      repeat(n) {
                          val light = rnd.nextBoolean()
                          val v = if (light) 255 else 0
                          p.color = Color.argb(20 + u[7].toInt(), v, v, v)
                          c.drawPoint(rnd.nextFloat() * w, rnd.nextFloat() * h, p)
                      }
                      p.style = Paint.Style.FILL
                  }
