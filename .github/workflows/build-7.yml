                  m.setTextColor(Th.DIM)
                  m.gravity = Gravity.CENTER
                  col.addView(m, LinearLayout.LayoutParams(WRAP, WRAP))

                  val retry = pill(this, "Retry", Th.GOLD, Th.INK, 15f)
                  retry.setOnClickListener { checkRoot() }
                  val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                  lp.topMargin = dp(28f)
                  col.addView(retry, lp)

                  root.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))
                  staggerIn(col)
              }

              private fun onRoot() {
                  splashAnim?.cancel()
                  RootEngine.grantSelf(this)
                  buildUi()
                  if (Store.engineOn && !RootEngine.enabled) setPower(true)
              }

              // ------------------------------------------------------------------ main ui
              private fun buildUi() {
                  root.removeAllViews()
                  rows.clear()
                  sections.clear()
                  pageViews.clear()
                  pageBodies.clear()
                  cur = 0

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  root.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))

                  col.addView(buildHeader(), LinearLayout.LayoutParams(MATCH, WRAP))
                  pages = FrameLayout(this)
                  col.addView(pages, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  for ((ti, tab) in P.tabs.withIndex()) {
                      val sv = ScrollView(this)
                      sv.isVerticalScrollBarEnabled = false
                      val body = LinearLayout(this)
                      body.orientation = LinearLayout.VERTICAL
                      body.setPadding(dp(14f), dp(6f), dp(14f), dp(28f))
                      sv.addView(body, FrameLayout.LayoutParams(MATCH, WRAP))
                      pages.addView(sv, FrameLayout.LayoutParams(MATCH, MATCH))
                      sv.visibility = if (ti == 0) View.VISIBLE else View.GONE
                      pageViews.add(sv)
                      pageBodies.add(body)

                      if (tab.name == "Presets") {
                          buildPresets(body)
                      } else {
                          for ((gi, g) in tab.groups.withIndex()) {
                              val params = P.all.filter { it.group == g }
                              addSection(body, g, params, gi == 0 || tab.name == "System")
                          }
                          if (tab.name == "System") buildSystemTools(body)
                      }
                  }

                  nav = NavBar(this, P.tabs)
                  nav.setBackgroundColor(Th.NAV)
                  nav.onSelect = { showTab(it) }
                  col.addView(nav, LinearLayout.LayoutParams(MATCH, WRAP))

                  buildBanner()
                  confirmed = P.v.copyOf()
                  staggerIn(pageBodies[0], 120)
                  power.set(RootEngine.enabled, false)
                  refreshStatus()
              }

              private fun addSection(body: LinearLayout, title: String, params: List<Param>, open: Boolean) {
                  val sec = Section(this, title, params, open)
                  for (p in params) {
                      val row = ParamRow(this, p)
                      row.onGesture = { P.pushUndo() }
                      row.onModify = {
                          sec.refreshBadge()
                          armTrial(false)
                          if (P.b("cam")) RootEngine.ensureCam(this)
                      }
                      rows.add(row)
                      sec.body.addView(row, LinearLayout.LayoutParams(MATCH, WRAP))
                  }
                  sec.onResetGroup = {
                      P.pushUndo()
                      for (p in params) P.set(p, p.def)
                      for (r in rows) if (r.p.group == title) r.sync(true)
                      sec.refreshBadge()
                      sec.haptic(true)
                      armTrial(false)
                  }
                  sections.add(sec)
                  val lp = LinearLayout.LayoutParams(MATCH, WRAP)
                  lp.topMargin = dp(10f)
                  body.addView(sec, lp)
              }

              private fun showTab(i: Int) {
                  if (i == cur) return
                  val old = pageViews[cur]
                  val nw = pageViews[i]
                  val dir = if (i > cur) 1 else -1
                  cur = i
                  old.animate().alpha(0f).translationX(-dir * dpf(40f)).setDuration(180).withEndAction {
                      if (pageViews[cur] !== old) old.visibility = View.GONE
                      old.translationX = 0f
                  }.start()
                  nw.visibility = View.VISIBLE
                  nw.alpha = 0f
                  nw.translationX = dir * dpf(40f)
                  nw.animate().alpha(1f).translationX(0f).setDuration(340).setInterpolator(DecelerateInterpolator(2f)).start()
                  staggerIn(pageBodies[i], 40)
              }

