          package com.example.cineoverlay

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Choreographer
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast
          import kotlin.random.Random

          /**
           * Native compositor blur. Each window asks SurfaceFlinger to blur whatever is *behind it*
           * (real UI pixels, GPU, no screen capture, no feedback loop). Stacking bands with growing radii
           * gives a depth-of-field falloff; moving the focus band randomly gives rack-focus pulls.
           */
          class BlurFx(private val ctx: Context, private val wm: WindowManager) {
              private class Win(val view: View, val lp: WindowManager.LayoutParams)

              private val nb = 5
              private val bands = ArrayList<Win>()
              private var glob: Win? = null
              private var mist: Win? = null
              private val rnd = Random(System.nanoTime())
              private var last = SystemClock.elapsedRealtime()
              private var fade = 0f
              private var fy = 0.5f
              private var depth = 1f
              private var tFy = 0.5f
              private var tDepth = 1f
              private var nextPull = 0L
              private var warned = false
              private var lastGlow = -1

              private fun supported(): Boolean =
                  Build.VERSION.SDK_INT >= 31 && try { wm.isCrossWindowBlurEnabled } catch (e: Throwable) { false }

              private fun makeWin(x: Int, y: Int, w: Int, h: Int, r: Int, a: Float): Win? {
                  return try {
                      val v = View(ctx)
                      val lp = WindowManager.LayoutParams(w, h, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_BLUR_BEHIND,
                          PixelFormat.TRANSLUCENT)
                      lp.gravity = Gravity.TOP or Gravity.START
                      lp.x = x
                      lp.y = y
                      lp.alpha = a
                      lp.blurBehindRadius = r
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      wm.addView(v, lp)
                      Win(v, lp)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun apply(w: Win, x: Int, y: Int, ww: Int, hh: Int, r: Int, a: Float) {
                  val lp = w.lp
                  val rr = Math.max(0, r)
                  if (lp.x == x && lp.y == y && lp.width == ww && lp.height == hh &&
                      lp.blurBehindRadius == rr && Math.abs(lp.alpha - a) < 0.004f) return
                  lp.x = x
                  lp.y = y
                  lp.width = ww
                  lp.height = hh
                  lp.blurBehindRadius = rr
                  lp.alpha = a
                  try { wm.updateViewLayout(w.view, lp) } catch (e: Exception) { }
              }

              private fun drop(w: Win?) {
                  if (w == null) return
                  try { wm.removeView(w.view) } catch (e: Exception) { }
              }

              private fun dropBands() {
                  for (b in bands) drop(b)
                  bands.clear()
              }

              fun destroy() {
                  dropBands()
                  drop(glob)
                  glob = null
                  drop(mist)
                  mist = null
              }

              fun tick() {
                  val now = SystemClock.elapsedRealtime()
                  val dt = ((now - last) / 1000f).coerceIn(0.001f, 0.2f)
                  last = now
                  val tf = if (RootEngine.active) 1f else 0f
                  fade += (tf - fade) * (1f - Math.exp(-8.0 * dt).toFloat())
                  if (Math.abs(tf - fade) < 0.004f) fade = tf

                  val blurA = P["blur"] * fade
                  val mistA = P["mist"] * fade
                  val dofA = P["dof"] * fade
                  val any = blurA > 0.5f || mistA > 0.5f || dofA > 0.5f
                  if (!any) {
                      if (glob != null || mist != null || bands.isNotEmpty()) destroy()
                      return
                  }
                  if (!supported()) {
                      if (!warned) {
                          warned = true
                          Toast.makeText(ctx, "Native blur is disabled on this device (cross-window blur off)", Toast.LENGTH_LONG).show()
                      }
                      return
                  }

                  @Suppress("DEPRECATION")
                  val dm = DisplayMetrics().also { wm.defaultDisplay.getRealMetrics(it) }
                  val sw = dm.widthPixels
                  val sh = dm.heightPixels

                  // ---- global blur
                  val gr = (blurA * 0.8f).toInt()
                  if (gr >= 1) {
                      var g = glob
                      if (g == null) {
                          g = makeWin(0, 0, sw, sh, gr, 1f)
                          glob = g
                      }
                      if (g != null) apply(g, 0, 0, sw, sh, gr, 1f)
                  } else if (glob != null) {
                      drop(glob)
                      glob = null
                  }

                  // ---- diffusion (blur mixed with the sharp image via window alpha, plus a soft white lift)
                  val ma = (mistA / 100f * 0.85f).coerceIn(0f, 1f)
                  if (ma > 0.004f) {
                      var m = mist
                      if (m == null) {
                          m = makeWin(0, 0, sw, sh, P["mistRadius"].toInt(), ma)
                          mist = m
                          lastGlow = -1
                      }
                      if (m != null) {
                          apply(m, 0, 0, sw, sh, P["mistRadius"].toInt(), ma)
                          val glow = (P["mistGlow"] / 100f * 0.22f * 255f).toInt()
                          if (glow != lastGlow) {
                              lastGlow = glow
                              m.view.setBackgroundColor(Color.argb(glow, 255, 255, 255))
                          }
                      }
                  } else if (mist != null) {
                      drop(mist)
                      mist = null
                  }

                  // ---- rack focus: random focus pulls
                  val baseFy = P["focusY"] / 100f
                  if (P.b("rack")) {
                      if (now >= nextPull) {
                          val every = P["rackEvery"] * 1000f
                          nextPull = now + (every * (0.6f + rnd.nextFloat() * 0.8f)).toLong()
                          val range = P["rackRange"] / 100f * 0.4f
                          tFy = (baseFy + (rnd.nextFloat() * 2f - 1f) * range).coerceIn(0.08f, 0.92f)
                          tDepth = 1f - rnd.nextFloat() * P["rackDepth"] / 100f
                      }
                  } else {
                      tFy = baseFy
                      tDepth = 1f
                  }
                  val spd = 0.6f + P["rackSpeed"] / 100f * 5f
                  val k = 1f - Math.exp((-spd * dt).toDouble()).toFloat()
                  fy += (tFy - fy) * k
                  depth += (tDepth - depth) * k

                  // ---- depth of field bands
                  val maxR = dofA * 0.9f * depth
                  if (maxR < 1f) {
                      if (bands.isNotEmpty()) dropBands()
                      return
                  }
                  while (bands.size < 2 * nb) {
                      val w = makeWin(-5, -5, 1, 1, 0, 1f) ?: break
                      bands.add(w)
                  }
                  if (bands.size < 2 * nb) return

                  val horiz = P.i("dofAxis") == 0
                  val len0 = (if (horiz) sh else sw).toFloat()
                  val cross = if (horiz) sw else sh
                  val half = P["focusH"] / 200f
                  val edgeA = ((fy - half) * len0).coerceIn(0f, len0)
                  val edgeB = ((fy + half) * len0).coerceIn(0f, len0)
                  val soft = (P["focusSoft"] / 100f).coerceIn(0.05f, 1f)

                  for (side in 0..1) {
                      val total = if (side == 0) edgeA else len0 - edgeB
                      var pos = if (side == 0) edgeA else edgeB
                      for (i in 1..nb) {
                          val win = bands[side * nb + (i - 1)]
                          val len = if (i == nb) (if (side == 0) pos else len0 - pos) else total * soft / nb
                          val r = (maxR * i / nb).toInt()
                          val s0: Float
                          if (side == 0) {
                              s0 = pos - len
                              pos -= len
                          } else {
                              s0 = pos
                              pos += len
                          }
                          val l1 = Math.round(len)
                          if (l1 >= 2 && r >= 1) {
                              val a0 = Math.round(s0)
                              if (horiz) apply(win, 0, a0, cross, l1, r, 1f) else apply(win, a0, 0, l1, cross, r, 1f)
                          } else {
                              apply(win, -5, -5, 1, 1, 0, 1f)
                          }
                      }
                  }
              }
          }

          /**
           * Accessibility service used only for its MagnificationController: it lets us scale/pan the whole
           * display natively (real UI transform) to fake handheld camera motion. Enabled through root.
           */
          class CamService : AccessibilityService() {
              companion object {
                  @Volatile var connected = false
              }

              private var running = false
              private var sc = 1f
              private var lastScale = 1f
              private var lastTick = 0L
              private val t0 = SystemClock.elapsedRealtime()

              private val frame = object : Choreographer.FrameCallback {
                  override fun doFrame(frameTimeNanos: Long) {
                      tick()
                      if (running) Choreographer.getInstance().postFrameCallback(this)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Store.init(this)
                  connected = true
                  running = true
                  Choreographer.getInstance().postFrameCallback(frame)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  running = false
                  connected = false
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  running = false
                  connected = false
                  super.onDestroy()
              }

              private fun n(t: Float, s: Float): Float =
                  (Math.sin((t + s).toDouble()) * 0.5 +
                      Math.sin((t * 2.31f + s * 1.7f).toDouble()) * 0.3 +
                      Math.sin((t * 4.77f + s * 2.9f).toDouble()) * 0.2).toFloat()

              private fun tick() {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastTick < 22L) return
                  val dt = ((now - lastTick) / 1000f).coerceIn(0.001f, 0.1f)
                  lastTick = now

                  val on = P.b("cam") && RootEngine.active
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels.toFloat()
                  val h = dm.heightPixels.toFloat()
                  val sec = (now - t0) / 1000f * (P["camSpeed"] / 100f)

                  var target = 1f
                  if (on) {
                      val breath = P["camBreath"] / 100f * 0.04f * Math.sin((sec * 0.6f).toDouble()).toFloat()
                      target = (P["camZoom"] / 100f + breath).coerceIn(1f, 1.3f)
                  }
                  sc += (target - sc) * (1f - Math.exp(-6.0 * dt).toFloat())
                  if (Math.abs(target - sc) < 0.0005f) sc = target

                  val mc = magnificationController
                  if (sc <= 1.0005f) {
                      if (lastScale != 1f) {
                          mc.setScale(1f, false)
                          lastScale = 1f
                      }
                      return
                  }
                  if (Math.abs(sc - lastScale) > 0.0004f) {
                      mc.setScale(sc, false)
                      lastScale = sc
                  }
                  val roomX = w * (1f - 1f / sc) / 2f
                  val roomY = h * (1f - 1f / sc) / 2f
                  val fr = 1.5f + P["camRough"] / 100f * 6f
                  val shake = P["camShake"] / 100f * 0.45f
                  val drift = P["camDrift"] / 100f * 0.45f
                  val fx = (shake * n(sec * fr, 0f) + drift * n(sec * 0.25f, 3f)).coerceIn(-1f, 1f)
                  val fyy = (shake * n(sec * fr, 7f) + drift * n(sec * 0.25f, 11f)).coerceIn(-1f, 1f)
                  mc.setCenter(w / 2f + fx * roomX, h / 2f + fyy * roomY, false)
              }
          }
