              var onChange: ((Boolean) -> Unit)? = null
              private var prog = 0f
              private var anim: ValueAnimator? = null
              private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val kp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ev = ArgbEvaluator()

              init {
                  setOnClickListener {
                      set(!checked, true)
                      onChange?.invoke(checked)
                      haptic(true)
                  }
                  pressable(0.92f)
              }

              fun set(b: Boolean, animate: Boolean) {
                  checked = b
                  anim?.cancel()
                  val t = if (b) 1f else 0f
                  if (!animate) {
                      prog = t
                      invalidate()
                      return
                  }
                  val a = ValueAnimator.ofFloat(prog, t)
                  a.duration = 300
                  a.interpolator = OvershootInterpolator(1.8f)
                  a.addUpdateListener {
                      prog = it.animatedValue as Float
                      invalidate()
                  }
                  anim = a
                  a.start()
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(dp(52f), dp(32f))
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val pc = prog.coerceIn(0f, 1f)
                  tp.color = ev.evaluate(pc, Th.LINE, Th.GOLD) as Int
                  c.drawRoundRect(0f, 0f, w, h, h / 2f, h / 2f, tp)
                  val rr = h / 2f - dpf(4f)
                  val cx = h / 2f + (w - h) * prog
                  kp.color = Color.argb(70, 0, 0, 0)
                  c.drawCircle(cx, h / 2f + dpf(1.5f), rr + dpf(1f), kp)
                  kp.color = Color.WHITE
                  c.drawCircle(cx, h / 2f, rr, kp)
              }
          }

          // ============================================================ chip
          class Chip(ctx: Context, label: String) : TextView(ctx) {
              private val ev = ArgbEvaluator()
              private val bg = GradientDrawable()
              private var t = 0f
              private var anim: ValueAnimator? = null

              init {
                  text = label
                  textSize = 13f
                  gravity = Gravity.CENTER
                  typeface = medium()
                  bg.cornerRadius = ctx.dpf(18f)
                  background = bg
                  setPadding(ctx.dp(16f), ctx.dp(8f), ctx.dp(16f), ctx.dp(8f))
                  pressable(0.93f)
                  tint(0f)
              }

              private fun tint(x: Float) {
                  t = x
                  val k = x.coerceIn(0f, 1f)
                  bg.setColor(ev.evaluate(k, Th.CARD2, Th.GOLD) as Int)
                  setTextColor(ev.evaluate(k, Th.DIM, Th.INK) as Int)
              }

              fun mark(sel: Boolean, animate: Boolean) {
                  anim?.cancel()
                  val target = if (sel) 1f else 0f
                  if (!animate) {
                      tint(target)
                      return
                  }
                  val a = ValueAnimator.ofFloat(t, target)
                  a.duration = 260
                  a.interpolator = DecelerateInterpolator()
                  a.addUpdateListener { tint(it.animatedValue as Float) }
                  anim = a
                  a.start()
              }
          }

          // ============================================================ param row (label, value, reset, control)
          class ParamRow(ctx: Context, val p: Param) : LinearLayout(ctx) {
              var onModify: (() -> Unit)? = null
              var onGesture: (() -> Unit)? = null

              private val name = TextView(ctx)
              private val valueTv = TextView(ctx)
              private val reset = TextView(ctx)
              private var slider: FxSlider? = null
              private var sw: FxSwitch? = null
              private var chips: List<Chip> = emptyList()
              private var lastMod = false

              init {
                  orientation = VERTICAL
                  setPadding(dp(18f), dp(10f), dp(10f), dp(4f))

                  val head = LinearLayout(ctx)
                  head.orientation = HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL

                  name.text = p.label
                  name.textSize = 14f
                  name.typeface = medium()
                  head.addView(name, LinearLayout.LayoutParams(0, WRAP, 1f))

                  valueTv.textSize = 13f
                  valueTv.typeface = Typeface.MONOSPACE
                  valueTv.setPadding(dp(8f), 0, dp(4f), 0)
                  if (p.kind == Kind.SLIDER) head.addView(valueTv, LinearLayout.LayoutParams(WRAP, WRAP))

                  when (p.kind) {
                      Kind.SWITCH -> {
                          val s = FxSwitch(ctx)
                          s.onChange = { b ->
                              onGesture?.invoke()
                              P.set(p, if (b) 1f else 0f)
                              refresh()
                              onModify?.invoke()
                          }
                          sw = s
                          head.addView(s, LinearLayout.LayoutParams(dp(52f), dp(32f)))
                      }
                      else -> {}
                  }

                  reset.text = "↺"
                  reset.textSize = 19f
                  reset.gravity = Gravity.CENTER
                  reset.setTextColor(Th.DIM)
                  reset.setOnClickListener {
                      onGesture?.invoke()
                      P.set(p, p.def)
                      sync(true)
                      reset.animate().rotationBy(-360f).setDuration(460).setInterpolator(OvershootInterpolator(1.2f)).start()
                      haptic(true)
                      onModify?.invoke()
                  }
                  reset.pressable(0.8f)
                  head.addView(reset, LinearLayout.LayoutParams(dp(38f), dp(34f)))
                  addView(head, LinearLayout.LayoutParams(MATCH, WRAP))

                  when (p.kind) {
                      Kind.SLIDER -> {
                          val s = FxSlider(ctx, p)
                          s.onStart = { onGesture?.invoke() }
                          s.onUser = { v ->
                              P.set(p, v)
                              refresh()
                              onModify?.invoke()
                          }
                          s.onVisual = { v ->
                              valueTv.text = p.fmt(v)
                              valueTv.setTextColor(if (p.isMod(v)) Th.GOLD else Th.DIM)
                          }
                          slider = s
                          addView(s, LinearLayout.LayoutParams(MATCH, WRAP))
                      }
                      Kind.CHOICE -> {
                          val scroll = HorizontalScrollView(ctx)
                          scroll.isHorizontalScrollBarEnabled = false
                          val row = LinearLayout(ctx)
                          row.orientation = HORIZONTAL
                          row.setPadding(0, dp(6f), 0, dp(8f))
                          val list = ArrayList<Chip>()
                          for ((i, o) in p.options.withIndex()) {
                              val chip = Chip(ctx, o)
                              chip.setOnClickListener {
                                  onGesture?.invoke()
                                  P.set(p, i.toFloat())
                                  for ((j, other) in list.withIndex()) other.mark(j == i, true)
                                  refresh()
                                  haptic()
                                  onModify?.invoke()
                              }
                              val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                              lp.rightMargin = dp(8f)
                              row.addView(chip, lp)
                              list.add(chip)
                          }
                          chips = list
                          scroll.addView(row)
                          addView(scroll, LinearLayout.LayoutParams(MATCH, WRAP))
                      }
                      else -> {}
                  }
                  sync(false)
              }

              fun sync(animated: Boolean) {
                  val v = P.v[p.idx]
                  when (p.kind) {
                      Kind.SLIDER -> {
                          val s = slider
                          if (s != null) { if (animated) s.animateTo(v) else s.setSilently(v) }
                      }
                      Kind.SWITCH -> sw?.set(v > 0.5f, animated)
                      Kind.CHOICE -> for ((i, chip) in chips.withIndex()) chip.mark(i == v.toInt(), animated)
                  }
                  refresh()
              }

              private fun refresh() {
                  val m = p.isMod(P.v[p.idx])
                  name.setTextColor(if (m) Th.TEXT else Th.DIM)
                  if (m != lastMod) {
                      lastMod = m
                      reset.animate().alpha(if (m) 1f else 0.28f).setDuration(220).start()
                  }
              }
          }

          // ============================================================ collapsible card
          class Section(ctx: Context, val title: String, val params: List<Param>, startOpen: Boolean) : LinearLayout(ctx) {
              val body = LinearLayout(ctx)
              var expanded = startOpen
              var onResetGroup: (() -> Unit)? = null
              private val badge = TextView(ctx)
              private val chev = TextView(ctx)
              private var lastCount = -1

              init {
                  orientation = VERTICAL
                  background = rbg(Th.CARD, ctx.dpf(20f))

                  val header = LinearLayout(ctx)
                  header.orientation = HORIZONTAL
                  header.gravity = Gravity.CENTER_VERTICAL
                  header.setPadding(dp(18f), dp(14f), dp(8f), dp(14f))

                  val tv = TextView(ctx)
                  tv.text = title
                  tv.textSize = 15f
                  tv.setTextColor(Th.TEXT)
                  tv.typeface = medium()
                  header.addView(tv, LinearLayout.LayoutParams(0, WRAP, 1f))

                  badge.textSize = 11f
                  badge.setTextColor(Th.GOLD)
                  badge.typeface = medium()
                  badge.setPadding(dp(10f), dp(3f), dp(10f), dp(3f))
                  badge.background = rbg(0x26F5B942, ctx.dpf(10f))
                  header.addView(badge, LinearLayout.LayoutParams(WRAP, WRAP))

                  val rg = TextView(ctx)
                  rg.text = "↺"
                  rg.textSize = 18f
                  rg.gravity = Gravity.CENTER
                  rg.setTextColor(Th.DIM)
                  rg.setOnClickListener {
                      onResetGroup?.invoke()
                      rg.animate().rotationBy(-360f).setDuration(460).setInterpolator(OvershootInterpolator(1.2f)).start()
                  }
                  rg.pressable(0.8f)
                  header.addView(rg, LinearLayout.LayoutParams(dp(38f), dp(34f)))

                  chev.text = "⌄"
                  chev.textSize = 20f
                  chev.gravity = Gravity.CENTER
                  chev.setTextColor(Th.DIM)
                  chev.rotation = if (expanded) 180f else 0f
                  header.addView(chev, LinearLayout.LayoutParams(dp(34f), dp(34f)))

                  header.setOnClickListener { toggle() }
                  header.pressable(0.985f)

                  body.orientation = VERTICAL
                  body.setPadding(0, 0, 0, dp(10f))
                  if (!expanded) body.visibility = View.GONE

                  addView(header, LinearLayout.LayoutParams(MATCH, WRAP))
                  addView(body, LinearLayout.LayoutParams(MATCH, WRAP))
                  refreshBadge()
              }

              fun refreshBadge() {
                  val n = P.modifiedCount(params)
                  badge.text = "$n edited"
                  badge.visibility = if (n > 0) View.VISIBLE else View.GONE
                  if (lastCount != -1 && n != lastCount && n > 0) {
                      badge.scaleX = 1.3f
                      badge.scaleY = 1.3f
                      badge.animate().scaleX(1f).scaleY(1f).setDuration(300).setInterpolator(OvershootInterpolator(3f)).start()
                  }
                  lastCount = n
              }

              fun toggle() {
                  expanded = !expanded
                  chev.animate().rotation(if (expanded) 180f else 0f).setDuration(320).setInterpolator(OvershootInterpolator(1.4f)).start()
                  val lp = body.layoutParams
                  if (expanded) {
                      body.visibility = View.VISIBLE
                      body.measure(
                          MeasureSpec.makeMeasureSpec(if (width > 0) width else dp(320f), MeasureSpec.EXACTLY),
                          MeasureSpec.makeMeasureSpec(0, MeasureSpec.UNSPECIFIED))
                      val target = body.measuredHeight
                      lp.height = 0
                      body.layoutParams = lp
                      body.alpha = 0f
                      body.animate().alpha(1f).setDuration(280).start()
                      val a = ValueAnimator.ofInt(0, target)
                      a.duration = 340
                      a.interpolator = DecelerateInterpolator(1.6f)
                      a.addUpdateListener {
                          lp.height = it.animatedValue as Int
                          body.layoutParams = lp
                      }
                      a.addListener(object : AnimatorListenerAdapter() {
                          override fun onAnimationEnd(animation: Animator) {
                              lp.height = WRAP
                              body.layoutParams = lp
                          }
                      })
                      a.start()
                  } else {
                      val from = body.height
                      body.animate().alpha(0f).setDuration(200).start()
                      val a = ValueAnimator.ofInt(from, 0)
                      a.duration = 300
                      a.interpolator = DecelerateInterpolator(1.6f)
                      a.addUpdateListener {
                          lp.height = it.animatedValue as Int
                          body.layoutParams = lp
                      }
                      a.addListener(object : AnimatorListenerAdapter() {
                          override fun onAnimationEnd(animation: Animator) {
                              body.visibility = View.GONE
                              body.alpha = 1f
                              lp.height = WRAP
                              body.layoutParams = lp
                          }
                      })
                      a.start()
                  }
              }
          }

          // ============================================================ grade swatch: shows what a grade does to reference colours
          class Swatch(ctx: Context, private var vals: FloatArray) : View(ctx) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val clip = Path()
              private val refs = intArrayOf(
                  0xFFE2B08F.toInt(), 0xFF5B8DEF.toInt(), 0xFF3F9A55.toInt(),
                  0xFFD0383C.toInt(), 0xFFF2C14E.toInt(), 0xFF7A7F8C.toInt())

              fun setVals(v: FloatArray) {
                  vals = v
                  invalidate()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  clip.reset()
                  clip.addRoundRect(RectF(0f, 0f, w.toFloat(), h.toFloat()), dpf(10f), dpf(10f), Path.Direction.CW)
              }

              override fun onDraw(c: Canvas) {
                  val mx = RootEngine.buildMatrix(vals)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val rampH = h * 0.38f
                  c.save()
                  c.clipPath(clip)
                  val steps = 24
                  for (i in 0 until steps) {
                      val g = (i / (steps - 1f) * 255f).toInt()
                      p.color = mx.map(Color.rgb(g, g, g))
                      c.drawRect(w * i / steps, 0f, w * (i + 1) / steps + 1f, rampH, p)
                  }
                  val n = refs.size
                  val gap = dpf(2f)
                  val cw = (w - gap * (n - 1)) / n
                  for (i in 0 until n) {
                      p.color = mx.map(refs[i])
                      val x = i * (cw + gap)
                      c.drawRect(x, rampH + gap, x + cw, h, p)
                  }
                  c.restore()
              }
          }

          // ============================================================ power button with pulse ring
          class PowerButton(ctx: Context) : View(ctx) {
              var on = false
                  private set
              private var prog = 0f
              private var pulse = 0f
              private var anim: ValueAnimator? = null
              private var pulseAnim: ValueAnimator? = null
              private val fillP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ringP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val iconP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ev = ArgbEvaluator()

              init {
                  ringP.style = Paint.Style.STROKE
                  iconP.style = Paint.Style.STROKE
                  iconP.strokeCap = Paint.Cap.ROUND
                  pressable(0.9f)
              }

              fun set(b: Boolean, animate: Boolean) {
                  on = b
                  anim?.cancel()
                  val t = if (b) 1f else 0f
                  if (animate) {
                      val a = ValueAnimator.ofFloat(prog, t)
                      a.duration = 420
                      a.interpolator = OvershootInterpolator(1.6f)
                      a.addUpdateListener {
                          prog = it.animatedValue as Float
                          invalidate()
                      }
                      anim = a
                      a.start()
                  } else {
                      prog = t
                      invalidate()
                  }
                  if (b) startPulse() else stopPulse()
              }

              private fun startPulse() {
                  if (pulseAnim != null) return
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 1700
                  a.repeatCount = ValueAnimator.INFINITE
                  a.addUpdateListener {
                      pulse = it.animatedValue as Float
                      invalidate()
                  }
                  pulseAnim = a
                  a.start()
              }

              private fun stopPulse() {
                  pulseAnim?.cancel()
                  pulseAnim = null
                  pulse = 0f
                  invalidate()
              }

              override fun onDetachedFromWindow() {
                  pulseAnim?.cancel()
                  pulseAnim = null
                  super.onDetachedFromWindow()
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  if (on) startPulse()
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(dp(54f), dp(54f))
              }

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = Math.min(width, height) / 2f - dpf(10f)
                  val k = prog.coerceIn(0f, 1f)

                  if (pulse > 0f) {
                      ringP.strokeWidth = dpf(2f)
                      ringP.color = Color.argb(((1f - pulse) * 150f).toInt(), 245, 185, 66)
                      c.drawCircle(cx, cy, r + pulse * dpf(10f), ringP)
                  }
                  fillP.color = ev.evaluate(k, Th.CARD2, Th.GOLD) as Int
                  c.drawCircle(cx, cy, r, fillP)

                  iconP.strokeWidth = dpf(2.4f)
                  iconP.color = ev.evaluate(k, Th.DIM, Th.INK) as Int
                  val ir = r * 0.46f
                  c.drawArc(RectF(cx - ir, cy - ir, cx + ir, cy + ir), -55f, 290f, false, iconP)
                  c.drawLine(cx, cy - ir * 1.12f, cx, cy - ir * 0.1f, iconP)
              }
          }

          // ============================================================ bottom nav with sliding pill
          class NavBar(ctx: Context, private val items: List<TabDef>) : View(ctx) {
              var onSelect: ((Int) -> Unit)? = null
              private var pos = 0f
              private var sel = 0
              private var anim: ValueAnimator? = null
              private val bgP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pillP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ip = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ev = ArgbEvaluator()

              init {
                  ip.textAlign = Paint.Align.CENTER
                  tp.textAlign = Paint.Align.CENTER
                  tp.typeface = medium()
                  pillP.color = 0x26F5B942
                  bgP.color = Th.LINE
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(MeasureSpec.getSize(w), dp(66f))
              }

              fun select(i: Int, notify: Boolean) {
                  if (i == sel) return
                  sel = i
                  anim?.cancel()
                  val a = ValueAnimator.ofFloat(pos, i.toFloat())
                  a.duration = 420
                  a.interpolator = OvershootInterpolator(1.1f)
                  a.addUpdateListener {
                      pos = it.animatedValue as Float
                      invalidate()
                  }
                  anim = a
                  a.start()
                  if (notify) onSelect?.invoke(i)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (e.actionMasked == MotionEvent.ACTION_UP) {
                      val i = (e.x / (width.toFloat() / items.size)).toInt().coerceIn(0, items.size - 1)
                      if (i != sel) haptic()
                      select(i, true)
                  }
                  return true
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val iw = w / items.size
                  c.drawRect(0f, 0f, w, 1f, bgP)

                  val pw = iw * 0.78f
                  val pcx = (pos + 0.5f) * iw
                  c.drawRoundRect(pcx - pw / 2f, dpf(8f), pcx + pw / 2f, height - dpf(8f), dpf(22f), dpf(22f), pillP)

                  for (i in items.indices) {
                      val wgt = (1f - Math.min(1f, Math.abs(pos - i))).coerceIn(0f, 1f)
                      val col = ev.evaluate(wgt, Th.DIM, Th.GOLD) as Int
                      val cx = (i + 0.5f) * iw
                      ip.color = col
                      ip.textSize = dpf(20f) * (1f + 0.12f * wgt)
                      c.drawText(items[i].icon, cx, dpf(33f) - dpf(2f) * wgt, ip)
                      tp.color = col
                      tp.textSize = dpf(10.5f)
                      c.drawText(items[i].name.uppercase(), cx, height - dpf(14f), tp)
                  }
              }
          }
