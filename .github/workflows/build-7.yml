          package com.example.cineoverlay

          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONObject

          /** Persists every parameter plus the user's named templates. */
          object Store {
              private var sp: SharedPreferences? = null
              private val h = Handler(Looper.getMainLooper())

              @Volatile var engineOn = false

              fun init(ctx: Context) {
                  if (sp != null) return
                  val s = ctx.applicationContext.getSharedPreferences("cine", Context.MODE_PRIVATE)
                  sp = s
                  val saved = s.getString("state", null)
                  if (saved != null) {
                      try {
                          P.fromJson(JSONObject(saved), false, false)
                      } catch (e: Exception) {
                      }
                  }
                  engineOn = s.getBoolean("engine", false)
              }

              private val saver = Runnable { flush() }

              fun saveSoon() {
                  h.removeCallbacks(saver)
                  h.postDelayed(saver, 400)
              }

              fun flush() {
                  sp?.edit()
                      ?.putString("state", P.toJson(false).toString())
                      ?.putBoolean("engine", engineOn)
                      ?.apply()
              }

              fun setEngine(on: Boolean) {
                  engineOn = on
                  flush()
              }

              // ------------------------------------------------------------ templates
              private fun tplObj(): JSONObject = try {
                  JSONObject(sp?.getString("templates", "{}") ?: "{}")
              } catch (e: Exception) {
                  JSONObject()
              }

              fun templateNames(): List<String> {
                  val o = tplObj()
                  val out = ArrayList<String>()
                  val it = o.keys()
                  while (it.hasNext()) out.add(it.next())
                  return out
              }

              fun getTemplate(name: String): JSONObject? = tplObj().optJSONObject(name)

              fun saveTemplate(name: String, values: JSONObject) {
                  val o = tplObj()
                  o.put(name, values)
                  sp?.edit()?.putString("templates", o.toString())?.apply()
              }

              fun deleteTemplate(name: String) {
                  val o = tplObj()
                  o.remove(name)
                  sp?.edit()?.putString("templates", o.toString())?.apply()
              }

              fun exportAll(): String {
                  val root = JSONObject()
                  root.put("cine", 1)
                  root.put("templates", tplObj())
                  return root.toString()
              }

              fun exportOne(name: String, values: JSONObject): String {
                  val root = JSONObject()
                  root.put("cine", 1)
                  root.put("name", name)
                  root.put("values", values)
                  return root.toString()
              }
          }
