              private fun copy(text: String) {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("cine", text))
              }

              private fun importClipboard() {
                  try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val text = cm.primaryClip?.getItemAt(0)?.text?.toString() ?: throw Exception("empty")
                      val o = JSONObject(text)
                      var n = 0
                      if (o.has("templates")) {
                          val ts = o.getJSONObject("templates")
                          val it = ts.keys()
                          while (it.hasNext()) {
                              val k = it.next()
                              Store.saveTemplate(k, ts.getJSONObject(k))
                              n++
                          }
                      } else if (o.has("values")) {
                          Store.saveTemplate(o.optString("name", "Imported"), o.getJSONObject("values"))
                          n = 1
                      } else {
                          throw Exception("bad")
                      }
                      refreshTemplates(true)
                      toast("Imported $n template(s)")
                  } catch (e: Exception) {
                      toast("Clipboard has no CineOverlay template")
                  }
              }

