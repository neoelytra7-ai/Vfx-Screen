              private fun refreshStatus() {
                  val gpu = if (Build.VERSION.SDK_INT >= 33) "AGSL·GPU" else "CANVAS·HW"
                  val on = RootEngine.enabled
                  statusTv.text = (if (on) "● LIVE" else "○ OFF") + "  ROOT·MATRIX  $gpu"
                  statusTv.setTextColor(if (on) Th.TEAL else Th.DIM)
              }

              private fun setPower(on: Boolean) {
                  val pending = stopSvc
                  if (pending != null) ui.removeCallbacks(pending)
                  power.set(on, true)
                  val ctx = this
                  if (on) {
                      RootEngine.grantSelf(ctx)
                      RootEngine.engage(true)
                      try {
                          startForegroundService(Intent(ctx, FxService::class.java))
                      } catch (e: Exception) {
                          toast("Could not start overlay")
                      }
                      armTrial(true)
                  } else {
                      cancelTrial()
                      RootEngine.engage(false)
                      val r = Runnable { stopService(Intent(ctx, FxService::class.java)) }
                      stopSvc = r
                      ui.postDelayed(r, 650)
                  }
                  refreshStatus()
              }

              private fun syncAll() {
                  for (r in rows) r.sync(true)
                  for (s in sections) s.refreshBadge()
                  armTrial(false)
                  if (P.b("cam")) RootEngine.ensureCam(this)
              }

