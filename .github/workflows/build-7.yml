              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  shader = colors?.let { LinearGradient(padX, 0f, w - padX, 0f, it, null, Shader.TileMode.CLAMP) }
              }

              override fun onDraw(c: Canvas) {
                  val l = padX
                  val r = width - padX
                  val cy = height / 2f
                  val th = dpf(if (colors != null) 7f else 5f)
                  val range = p.max - p.min
                  val frac = ((value - p.min) / range).coerceIn(0f, 1f)
                  val dfrac = (p.def - p.min) / range
                  val x = l + (r - l) * frac

                  tp.shader = shader
                  tp.color = Th.LINE
                  c.drawRoundRect(l, cy - th / 2f, r, cy + th / 2f, th / 2f, th / 2f, tp)

                  if (colors == null) {
                      val bipolar = dfrac >= 0.4f && dfrac <= 0.6f
                      val a0 = if (bipolar) l + (r - l) * dfrac else l
                      val x0 = Math.min(a0, x)
                      val x1 = Math.max(a0, x)
                      if (x1 - x0 > 0.5f) {
                          fp.shader = LinearGradient(x0, 0f, x1, 0f, Th.TEAL, Th.GOLD, Shader.TileMode.CLAMP)
                          c.drawRoundRect(x0, cy - th / 2f, x1, cy + th / 2f, th / 2f, th / 2f, fp)
                      }
                  }

                  gp.shader = null
                  gp.color = 0x66FFFFFF
                  val dx = l + (r - l) * dfrac
                  c.drawRoundRect(dx - dpf(1f), cy - dpf(7f), dx + dpf(1f), cy + dpf(7f), dpf(1f), dpf(1f), gp)

                  val glowR = dpf(9f) + dpf(9f) * press
                  gp.color = Color.argb((40 + 70 * press).toInt().coerceIn(0, 255), 245, 185, 66)
                  c.drawCircle(x, cy, glowR + dpf(4f), gp)
                  gp.color = Color.WHITE
                  c.drawCircle(x, cy, dpf(8f) + dpf(2.5f) * press, gp)
                  gp.color = if (p.isMod(value)) Th.GOLD else Th.DIM
                  c.drawCircle(x, cy, dpf(3f), gp)
