                      p.shader = RadialGradient(cx, cy, r,
                          intArrayOf(Color.TRANSPARENT, Color.TRANSPARENT, Color.argb(al(u[0] * 0.0095f), 0, 0, 0)),
                          floatArrayOf(0f, inner, 1f), Shader.TileMode.CLAMP)
                      c.drawRect(0f, 0f, w, h, p)
                      p.shader = null
                  }
                  if (u[10] > 0.5f) {
                      val rnd = Random((sec * 24f).toInt())
                      val f = rnd.nextFloat()
                      c.drawColor(Color.argb(al(f * f * u[10] * 0.0016f), 0, 0, 0))
                  }
                  p.color = Color.BLACK
                  if (u[17] > 0.5f) {
                      c.drawRect(0f, 0f, w, u[17], p)
                      c.drawRect(0f, h - u[17], w, h, p)
                  }
                  if (u[18] > 0.5f) {
                      c.drawRect(0f, 0f, u[18], h, p)
                      c.drawRect(w - u[18], 0f, w, h, p)
                  }
              }

              // ------------------------------------------------------------------ viewfinder HUD
              private fun drawHud(c: Canvas, w: Float, h: Float, sec: Float) {
                  val rec = P.b("hudRec")
                  val grid = P.b("hudGrid")
                  val br = P.b("hudBrackets")
                  val ret = P.b("hudReticle")
                  if (!(rec || grid || br || ret)) return

                  val d = resources.displayMetrics.density
                  val ia = (P.v[P.index("hudAlpha")] / 100f * fade).coerceIn(0f, 1f).let { (it * 255f).toInt() }
                  val insetTop = rootWindowInsets?.systemWindowInsetTop ?: 0
                  val topPad = Math.max(insetTop, (24 * d).toInt()) + 10 * d
                  val m = 20 * d

                  hp.shader = null
                  hp.style = Paint.Style.STROKE
                  hp.strokeCap = Paint.Cap.SQUARE

                  if (grid) {
                      hp.strokeWidth = 1f * d
                      hp.color = Color.argb((ia * 0.35f).toInt(), 255, 255, 255)
                      c.drawLine(w / 3f, 0f, w / 3f, h, hp)
                      c.drawLine(w * 2f / 3f, 0f, w * 2f / 3f, h, hp)
                      c.drawLine(0f, h / 3f, w, h / 3f, hp)
                      c.drawLine(0f, h * 2f / 3f, w, h * 2f / 3f, hp)
                  }

                  hp.strokeWidth = 2f * d
                  hp.color = Color.argb(ia, 255, 255, 255)
                  if (br) {
                      val l = m
                      val t = topPad + 30 * d
                      val r = w - m
                      val b = h - m - 24 * d
                      val len = 22 * d
                      c.drawLine(l, t, l + len, t, hp); c.drawLine(l, t, l, t + len, hp)
                      c.drawLine(r, t, r - len, t, hp); c.drawLine(r, t, r, t + len, hp)
                      c.drawLine(l, b, l + len, b, hp); c.drawLine(l, b, l, b - len, hp)
                      c.drawLine(r, b, r - len, b, hp); c.drawLine(r, b, r, b - len, hp)
                  }
                  if (ret) {
                      val cx = w / 2f
                      val cy = h / 2f
                      val half = 34 * d * (1f + 0.05f * Math.sin(sec * 3.0).toFloat())
                      val len = 10 * d
                      hp.strokeWidth = 1.6f * d
                      c.drawLine(cx - half, cy - half, cx - half + len, cy - half, hp); c.drawLine(cx - half, cy - half, cx - half, cy - half + len, hp)
                      c.drawLine(cx + half, cy - half, cx + half - len, cy - half, hp); c.drawLine(cx + half, cy - half, cx + half, cy - half + len, hp)
                      c.drawLine(cx - half, cy + half, cx - half + len, cy + half, hp); c.drawLine(cx - half, cy + half, cx - half, cy + half - len, hp)
                      c.drawLine(cx + half, cy + half, cx + half - len, cy + half, hp); c.drawLine(cx + half, cy + half, cx + half, cy + half - len, hp)
                      hp.style = Paint.Style.FILL
                      c.drawCircle(cx, cy, 1.8f * d, hp)
                  }
                  if (rec) {
                      hp.style = Paint.Style.FILL
                      hp.typeface = Typeface.MONOSPACE
                      hp.textSize = 13 * d
                      if (((sec * 1.2f).toInt() and 1) == 0) {
                          hp.color = Color.argb(ia, 255, 50, 60)
                          c.drawCircle(m + 5 * d, topPad, 5 * d, hp)
                      }
                      hp.color = Color.argb(ia, 255, 255, 255)
                      hp.textAlign = Paint.Align.LEFT
                      c.drawText("REC", m + 16 * d, topPad + 5 * d, hp)
                      val total = sec.toInt()
                      val frames = (sec * 24f).toInt() % 24
                      val tc = String.format(Locale.US, "%02d:%02d:%02d:%02d", total / 3600, (total / 60) % 60, total % 60, frames)
                      hp.textAlign = Paint.Align.RIGHT
                      c.drawText(tc, w - m, topPad + 5 * d, hp)
                      hp.textAlign = Paint.Align.LEFT
                      hp.textSize = 11 * d
                      val asp = P.find("aspect")?.options?.getOrNull(P.i("aspect")) ?: ""
                      c.drawText("24p · $asp · ISO 800 · 180°", m, h - m, hp)
                  }
                  hp.textAlign = Paint.Align.LEFT
              }
          }
