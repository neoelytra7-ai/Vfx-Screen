              private fun pressTo(t: Float) {
                  pressAnim?.cancel()
                  val a = ValueAnimator.ofFloat(press, t)
                  a.duration = 220
                  a.interpolator = if (t > 0f) OvershootInterpolator(2f) else DecelerateInterpolator()
                  a.addUpdateListener {
                      press = it.animatedValue as Float
