              private fun confirmDelete(name: String) {
                  dialog().setTitle("Delete “$name”?")
                      .setPositiveButton("Delete") { _, _ ->
                          Store.deleteTemplate(name)
                          refreshTemplates(false)
                          toast("Deleted")
                      }
                      .setNegativeButton("Cancel", null)
