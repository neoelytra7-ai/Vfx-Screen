          package com.example.cineoverlay

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RuntimeShader
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.os.Build
          import android.os.SystemClock
          import android.view.View
          import java.util.Locale
          import kotlin.random.Random

          /** GPU path (Android 13+): the whole look is one AGSL shader executed on the RenderThread. */
          class AgslLayer {
              private val shader = RuntimeShader(Shaders.AGSL)
              private val paint = Paint()

              fun draw(c: Canvas, w: Float, h: Float, u: FloatArray) {
                  shader.setFloatUniform("res", w, h)
                  shader.setFloatUniform("time", u[19])
                  shader.setFloatUniform("gtime", u[20])
                  shader.setFloatUniform("vig", u[0])
                  shader.setFloatUniform("vigSize", u[1])
                  shader.setFloatUniform("vigRound", u[2])
                  shader.setFloatUniform("fringe", u[3])
                  shader.setFloatUniform("halation", u[4])
                  shader.setFloatUniform("flare", u[5])
                  shader.setFloatUniform("flareY", u[6])
                  shader.setFloatUniform("grain", u[7])
                  shader.setFloatUniform("grainSize", u[8])
                  shader.setFloatUniform("chroma", u[9])
                  shader.setFloatUniform("flicker", u[10])
                  shader.setFloatUniform("dust", u[11])
                  shader.setFloatUniform("leak", u[12])
                  shader.setFloatUniform("leakHue", u[13])
                  shader.setFloatUniform("scan", u[14])
                  shader.setFloatUniform("scanGap", u[15])
                  shader.setFloatUniform("wash", u[16])
                  shader.setFloatUniform("bars", u[17], u[18])
                  paint.shader = shader
                  c.drawRect(0f, 0f, w, h, paint)
              }
          }

          class FxView(ctx: Context) : View(ctx) {
              private val agsl: AgslLayer? =
                  if (Build.VERSION.SDK_INT >= 33) {
                      try { AgslLayer() } catch (t: Throwable) { null }
                  } else null

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val hp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val t0 = SystemClock.elapsedRealtime()
              private var last = t0
              private var fade = 0f
              private var barA = 0f
              private var barB = 0f
              private val sm = FloatArray(P.v.size) { P.v[it] }
              private val u = FloatArray(21)

              private val tick = object : Runnable {
                  override fun run() {
                      invalidate()
                      if (fade < 0.003f && !RootEngine.active) postOnAnimationDelayed(this, 100) else postOnAnimation(this)
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  postOnAnimation(tick)
              }

              override fun onDetachedFromWindow() {
                  removeCallbacks(tick)
                  super.onDetachedFromWindow()
              }

              private fun o(key: String): Float = sm[P.index(key)]

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return

                  val now = SystemClock.elapsedRealtime()
                  val dt = ((now - last) / 1000f).coerceIn(0.001f, 0.1f)
                  last = now

                  // ease every parameter toward its target so preset changes crossfade
                  val k = 1f - Math.exp(-12.0 * dt).toFloat()
                  for (i in sm.indices) sm[i] += (P.v[i] - sm[i]) * k

                  val tf = if (RootEngine.active) 1f else 0f
                  fade += (tf - fade) * (1f - Math.exp(-9.0 * dt).toFloat())
                  if (Math.abs(tf - fade) < 0.003f) fade = tf
                  if (fade <= 0f) return

                  val sec = (now - t0) / 1000f
                  u[0] = o("vig") * fade
                  u[1] = o("vigSize")
                  u[2] = o("vigRound")
                  u[3] = o("fringe") * fade
                  u[4] = o("halation") * fade
                  u[5] = o("flare") * fade
                  u[6] = o("flareY")
                  u[7] = o("grain") * fade
                  u[8] = o("grainSize")
                  u[9] = o("grainChroma")
                  u[10] = o("flicker") * fade
                  u[11] = o("dust") * fade
                  u[12] = o("leak") * fade
                  u[13] = o("leakHue")
                  u[14] = o("scan") * fade
                  u[15] = o("scanGap")
                  u[16] = o("wash") * fade

                  val asp = P.aspects[P.i("aspect").coerceIn(0, P.aspects.size - 1)]
                  var bx = 0f
                  var by = 0f
                  if (w / h < asp) bx = (h - w / asp) / 2f else by = (w - h * asp) / 2f
                  val amt = (P.v[P.index("bars")] / 100f) * fade
                  barA += (bx * amt - barA) * k
                  barB += (by * amt - barB) * k
                  u[17] = barA
                  u[18] = barB
                  u[19] = sec
                  val fps = o("grainFps").coerceAtLeast(1f)
                  u[20] = Math.floor((sec * fps).toDouble()).toFloat() % 1024f

                  if (agsl != null) agsl.draw(c, w, h, u) else drawLegacy(c, w, h, sec)
                  drawHud(c, w, h, sec)
              }

              // ------------------------------------------------------------------ Canvas fallback (Android 8-12)
              private fun al(x: Float): Int = (x.coerceIn(0f, 1f) * 255f).toInt()

              private fun drawLegacy(c: Canvas, w: Float, h: Float, sec: Float) {
                  val cx = w / 2f
                  val cy = h / 2f
                  val r = Math.hypot(cx.toDouble(), cy.toDouble()).toFloat()
                  p.shader = null
                  p.style = Paint.Style.FILL

                  if (u[16] > 0.5f) {
                      val a = al(u[16] * 0.0045f)
                      p.shader = LinearGradient(0f, 0f, 0f, h, Color.argb(a, 0, 110, 130), Color.argb(a, 255, 120, 30), Shader.TileMode.CLAMP)
                      c.drawRect(0f, 0f, w, h, p)
                      p.shader = null
                  }
                  if (u[12] > 0.5f) {
                      val lx = (0.5f + 0.5f * Math.sin(sec * 0.21).toFloat()) * 1.4f - 0.2f
                      val a = al(u[12] * 0.005f)
                      val hsv = floatArrayOf(u[13], 1f, 1f)
                      val rgb = Color.HSVToColor(a, hsv)
                      p.shader = RadialGradient(lx * w, -0.05f * h, h * 0.9f, rgb, Color.TRANSPARENT, Shader.TileMode.CLAMP)
                      c.drawRect(0f, 0f, w, h, p)
                      p.shader = null
                  }
                  if (u[4] > 0.5f) {
                      p.shader = RadialGradient(cx, cy, r,
                          intArrayOf(Color.TRANSPARENT, Color.TRANSPARENT, Color.argb(al(u[4] * 0.0035f), 255, 70, 25)),
                          floatArrayOf(0f, 0.65f, 1f), Shader.TileMode.CLAMP)
                      c.drawRect(0f, 0f, w, h, p)
                      p.shader = null
                  }
                  if (u[5] > 0.5f) {
                      val fy = u[6] / 100f * h
                      val a = al(u[5] * 0.006f)
                      p.shader = LinearGradient(0f, fy - 10f, 0f, fy + 10f,
                          intArrayOf(Color.TRANSPARENT, Color.argb(a, 100, 165, 255), Color.TRANSPARENT),
                          floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP)
                      c.drawRect(0f, fy - 10f, w, fy + 10f, p)
                      p.shader = null
                  }
                  if (u[3] > 0.5f) {
                      val a = al(u[3] * 0.004f)
                      val off = w * 0.006f * (u[3] / 50f)
                      val cols = intArrayOf(Color.rgb(255, 0, 40), Color.rgb(0, 220, 255))
                      val offs = floatArrayOf(off, -off)
                      for (i in 0..1) {
                          val col = cols[i]
                          p.shader = RadialGradient(cx + offs[i], cy, r,
                              intArrayOf(Color.TRANSPARENT, Color.TRANSPARENT, Color.argb(a, Color.red(col), Color.green(col), Color.blue(col))),
                              floatArrayOf(0f, 0.7f, 1f), Shader.TileMode.CLAMP)
                          c.drawRect(0f, 0f, w, h, p)
                      }
                      p.shader = null
                  }
                  if (u[11] > 0.5f) {
                      val rnd = Random((sec * 12f).toInt())
                      val n = (u[11] * 0.4f).toInt()
                      repeat(n) {
                          p.color = if (rnd.nextBoolean()) Color.argb(170, 255, 255, 255) else Color.argb(170, 0, 0, 0)
                          c.drawCircle(rnd.nextFloat() * w, rnd.nextFloat() * h, 1f + rnd.nextFloat() * 2.5f, p)
                      }
                  }
                  if (u[14] > 0.5f) {
                      p.color = Color.argb(al(u[14] * 0.007f), 0, 0, 0)
                      val gap = Math.max(u[15], 2f)
                      var y = 0f
                      while (y < h) {
                          c.drawRect(0f, y, w, y + 1.5f, p)
