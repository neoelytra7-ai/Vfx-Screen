                  "temp" -> intArrayOf(0xFF4DA3FF.toInt(), 0xFFE9EEF8.toInt(), 0xFFFFA24D.toInt())
                  "tint" -> intArrayOf(0xFF58D68D.toInt(), 0xFFE9EEF8.toInt(), 0xFFE056FD.toInt())
