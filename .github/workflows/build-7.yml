          package com.example.cineoverlay

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.view.WindowManager

          class FxService : Service() {
              private var view: FxView? = null
              private var blur: BlurFx? = null
              private val blurTick = object : Runnable {
                  override fun run() {
                      blur?.tick()
                      h.postDelayed(this, 40)
                  }
              }
              private val h = Handler(Looper.getMainLooper())
              private val wm get() = getSystemService(WINDOW_SERVICE) as WindowManager

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Store.init(this)
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("fx", "Cine engine", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 0,
                      Intent(this, FxService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
                  val open = PendingIntent.getActivity(this, 1,
                      Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  startForeground(1, Notification.Builder(this, "fx")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Cine engine live")
                      .setContentText("Root grade + GPU overlay active")
                      .setContentIntent(open)
                      .addAction(Notification.Action.Builder(null, "Stop", stop).build()).build())

                  if (i?.action == "STOP") {
                      RootEngine.engage(false)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  RootEngine.engage(true)
                  attach(0)
                  return START_STICKY
              }

              /** Overlay permission is granted by root a moment before we start, so retry for a few seconds. */
              private fun attach(n: Int) {
                  if (view != null) return
                  val retry = Runnable { attach(n + 1) }
                  if (!Settings.canDrawOverlays(this)) {
                      if (n < 12) h.postDelayed(retry, 500)
                      return
                  }
                  try {
                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.TRANSLUCENT)
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      val v = FxView(this)
                      wm.addView(v, lp)
                      view = v
                      if (blur == null) {
                          blur = BlurFx(this, wm)
                          h.post(blurTick)
                      }
                  } catch (e: Exception) {
                      view = null
                      if (n < 12) h.postDelayed(retry, 500)
                  }
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  blur?.destroy()
                  blur = null
                  view?.let {
                      try { wm.removeView(it) } catch (e: Exception) { }
                  }
                  view = null
                  RootEngine.engage(false)
                  super.onDestroy()
              }
          }

          /** Quick Settings tile: tap to toggle the whole engine from the shade. */
          class FxTile : TileService() {
              override fun onStartListening() {
                  Store.init(this)
                  refresh()
              }

              override fun onClick() {
                  Store.init(this)
                  val svc = Intent(this, FxService::class.java)
                  if (RootEngine.enabled) {
                      RootEngine.engage(false)
                      stopService(svc)
                  } else {
                      RootEngine.grantSelf(this)
                      RootEngine.engage(true)
                      try { startForegroundService(svc) } catch (e: Exception) { }
                  }
                  refresh()
              }

              private fun refresh() {
                  val t = qsTile ?: return
                  t.state = if (RootEngine.enabled) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                  t.label = "Cine"
                  t.updateTile()
              }
          }

          /** Optionally re-starts the engine after a reboot (SurfaceFlinger forgets the matrix on boot). */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action != Intent.ACTION_BOOT_COMPLETED) return
                  Store.init(c)
                  if (P.b("autoStart") && Store.engineOn) {
                      try {
                          c.startForegroundService(Intent(c, FxService::class.java))
                      } catch (e: Exception) { }
                  } else {
                      Store.setEngine(false)
                  }
              }
          }
