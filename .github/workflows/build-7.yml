          package com.example.cineoverlay

          import android.content.Context
          import android.graphics.Color
          import android.os.Handler
          import android.os.HandlerThread
          import java.util.Locale

          /** One persistent `su` session. Spawning su per slider tick is far too slow, so we keep a shell open. */
          object RootShell {
              private var proc: Process? = null
              private var out: java.io.OutputStream? = null

              fun check(): Boolean = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", "id"))
                  val text = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  text.contains("uid=0")
              } catch (e: Exception) {
                  false
              }

              fun exec(cmd: String): String = try {
                  val pr = Runtime.getRuntime().exec(arrayOf("su", "-c", cmd))
                  val t = pr.inputStream.bufferedReader().readText()
                  pr.waitFor()
                  t
              } catch (e: Exception) {
                  ""
              }

              @Synchronized
              private fun ensure(): Boolean {
                  val cur = proc
                  if (cur != null) {
                      val alive = try { cur.exitValue(); false } catch (e: IllegalThreadStateException) { true }
                      if (alive) return true
                      proc = null
                  }
                  return try {
                      val p = ProcessBuilder("su").redirectErrorStream(true).start()
                      proc = p
                      out = p.outputStream
                      val t = Thread {
                          try {
                              val buf = ByteArray(1024)
                              val ins = p.inputStream
                              while (ins.read(buf) >= 0) { /* drain */ }
                          } catch (e: Exception) { }
                      }
                      t.isDaemon = true
                      t.start()
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              @Synchronized
              fun run(cmd: String): Boolean {
                  if (!ensure()) return false
                  return try {
                      out!!.write((cmd + "\n").toByteArray())
                      out!!.flush()
                      true
                  } catch (e: Exception) {
                      proc = null
                      false
                  }
              }
          }

          /** 3x3 colour matrix + offset. out = m * in + o  (row-major). */
          class Mx(val m: FloatArray, val o: FloatArray) {
              fun then(n: Mx): Mx {
                  val r = FloatArray(9)
                  val ro = FloatArray(3)
                  for (i in 0..2) {
                      for (j in 0..2) {
                          var s = 0f
                          for (k in 0..2) s += n.m[i * 3 + k] * m[k * 3 + j]
                          r[i * 3 + j] = s
                      }
                      var t = n.o[i]
                      for (k in 0..2) t += n.m[i * 3 + k] * o[k]
                      ro[i] = t
                  }
                  return Mx(r, ro)
              }

              fun lerp(b: Mx, t: Float): Mx =
                  Mx(FloatArray(9) { m[it] + (b.m[it] - m[it]) * t }, FloatArray(3) { o[it] + (b.o[it] - o[it]) * t })

              fun isIdentity(): Boolean {
                  for (i in 0..2) {
                      for (j in 0..2) {
                          val want = if (i == j) 1f else 0f
                          if (Math.abs(m[i * 3 + j] - want) > 1e-4f) return false
                      }
                      if (Math.abs(o[i]) > 1e-4f) return false
                  }
                  return true
              }

              fun map(c: Int): Int {
                  val x = floatArrayOf(Color.red(c) / 255f, Color.green(c) / 255f, Color.blue(c) / 255f)
                  val res = IntArray(3)
                  for (i in 0..2) {
                      val v = m[i * 3] * x[0] + m[i * 3 + 1] * x[1] + m[i * 3 + 2] * x[2] + o[i]
                      res[i] = (v.coerceIn(0f, 1f) * 255f + 0.5f).toInt()
                  }
                  return Color.rgb(res[0], res[1], res[2])
              }

              companion object {
                  fun identity() = Mx(floatArrayOf(1f, 0f, 0f, 0f, 1f, 0f, 0f, 0f, 1f), FloatArray(3))

                  fun diag(s: FloatArray, off: FloatArray) =
                      Mx(floatArrayOf(s[0], 0f, 0f, 0f, s[1], 0f, 0f, 0f, s[2]), off)

                  fun scale(r: Float, g: Float, b: Float) = diag(floatArrayOf(r, g, b), FloatArray(3))

                  fun sat(s: Float): Mx {
                      val l = floatArrayOf(0.2126f, 0.7152f, 0.0722f)
                      val m = FloatArray(9)
                      for (i in 0..2) for (j in 0..2) m[i * 3 + j] = l[j] * (1f - s) + (if (i == j) s else 0f)
                      return Mx(m, FloatArray(3))
                  }

                  fun hue(deg: Float): Mx {
                      val r = Math.toRadians(deg.toDouble())
                      val c = Math.cos(r).toFloat()
                      val s = Math.sin(r).toFloat()
                      val m = floatArrayOf(
                          0.213f + c * 0.787f - s * 0.213f, 0.715f - c * 0.715f - s * 0.715f, 0.072f - c * 0.072f + s * 0.928f,
                          0.213f - c * 0.213f + s * 0.143f, 0.715f + c * 0.285f + s * 0.140f, 0.072f - c * 0.072f - s * 0.283f,
                          0.213f - c * 0.213f - s * 0.787f, 0.715f - c * 0.715f + s * 0.715f, 0.072f + c * 0.928f + s * 0.072f
                      )
                      return Mx(m, FloatArray(3))
                  }
              }
          }

          object RootEngine {
              private val ht = HandlerThread("cine-root").also { it.start() }
              private val h = Handler(ht.looper)

              @Volatile var enabled = false
              @Volatile var bypass = false
              val active: Boolean get() = enabled && !bypass

              private val mIdx: IntArray = P.all.filter { it.target == Target.MATRIX }.map { it.idx }.toIntArray()
              private val cur = FloatArray(P.v.size) { P.all[it].def }
              private var fade = 0f
              private var ticking = false
              private val mixKeys = listOf("mrr", "mrg", "mrb", "mgr", "mgg", "mgb", "mbr", "mbg", "mbb")

              private val tickR = Runnable { tick() }
              private val sysR = Runnable { applySystem() }

              // ------------------------------------------------------------------ control
              fun engage(on: Boolean) {
                  enabled = on
                  Store.setEngine(on)
                  dirtyMatrix()
              }

              fun shell(cmd: String) {
                  h.post { RootShell.run(cmd) }
              }

              fun grantSelf(ctx: Context) {
                  val pkg = ctx.packageName
                  shell("appops set $pkg SYSTEM_ALERT_WINDOW allow\n" +
                      "pm grant $pkg android.permission.POST_NOTIFICATIONS\n" +
                      "dumpsys deviceidle whitelist +$pkg")
              }

              private var lastEnsure = 0L

              /** Enables our accessibility service (needed for camera movement) through root, keeping any other enabled services. */
              fun ensureCam(ctx: Context) {
                  if (CamService.connected) return
                  val now = System.currentTimeMillis()
                  if (now - lastEnsure < 4000L) return
                  lastEnsure = now
                  val cn = ctx.packageName + "/" + CamService::class.java.name
                  h.post {
                      val cur = RootShell.exec("settings get secure enabled_accessibility_services").trim()
                      if (!cur.split(':').contains(cn)) {
                          val v = if (cur.isEmpty() || cur == "null") cn else "$cur:$cn"
                          RootShell.run("settings put secure enabled_accessibility_services $v\nsettings put secure accessibility_enabled 1")
                      }
                  }
              }

              fun panic() {
                  enabled = false
                  bypass = false
                  Store.setEngine(false)
                  h.post {
                      fade = 0f
                      RootShell.run("service call SurfaceFlinger 1015 i32 0")
                  }
              }

              fun dirtyMatrix() {
                  h.post {
                      if (!ticking) {
                          ticking = true
                          tick()
                      }
                  }
              }

              fun dirtySystem() {
                  h.removeCallbacks(sysR)
                  h.postDelayed(sysR, 300)
              }

              // ------------------------------------------------------------------ tick (crossfades matrix params for fluid transitions)
              private fun tick() {
                  val tf = if (active) 1f else 0f
                  var moving = false
                  fade += (tf - fade) * 0.35f
                  if (Math.abs(tf - fade) < 0.004f) fade = tf else moving = true
                  for (i in mIdx) {
                      val t = P.v[i]
                      var c = cur[i]
                      c += (t - c) * 0.35f
                      val p = P.all[i]
                      if (Math.abs(t - c) < (p.max - p.min) * 0.002f) c = t else moving = true
                      cur[i] = c
                  }
                  val full = buildMatrix(cur)
                  val mx = if (fade >= 0.999f) full else Mx.identity().lerp(full, fade)
                  sendMatrix(mx)
                  ticking = moving
                  if (moving) h.postDelayed(tickR, 30)
              }

              private fun sendMatrix(mx: Mx) {
                  if (mx.isIdentity()) {
                      RootShell.run("service call SurfaceFlinger 1015 i32 0")
                      return
                  }
                  // column-major 4x4, translation in elements 12..14
                  val f = FloatArray(16)
                  for (col in 0..2) {
                      for (row in 0..2) f[col * 4 + row] = mx.m[row * 3 + col]
                      f[col * 4 + 3] = 0f
                  }
                  f[12] = mx.o[0]; f[13] = mx.o[1]; f[14] = mx.o[2]; f[15] = 1f
                  // Safety net: many display drivers use fixed-point colour transforms and go black on huge values.
                  for (k in intArrayOf(0, 1, 2, 4, 5, 6, 8, 9, 10)) f[k] = f[k].coerceIn(-1.6f, 1.6f)
                  for (k in 12..14) f[k] = f[k].coerceIn(-0.6f, 0.6f)
                  val sb = StringBuilder("service call SurfaceFlinger 1015 i32 1")
                  for (x in f) sb.append(" f ").append(String.format(Locale.US, "%.5f", x))
                  RootShell.run(sb.toString())
              }

              private fun applySystem() {
                  val s = String.format(Locale.US, "%.2f", P["animScale"] / 100f)
                  val sb = StringBuilder()
                  for (k in listOf("window_animation_scale", "transition_animation_scale", "animator_duration_scale")) {
                      sb.append("settings put global ").append(k).append(' ').append(s).append('\n')
                  }
                  val hz = intArrayOf(0, 60, 90, 120, 144)[P.i("refresh").coerceIn(0, 4)]
                  if (hz == 0) {
                      sb.append("settings delete system min_refresh_rate\n")
                      sb.append("settings delete system peak_refresh_rate\n")
                  } else {
                      sb.append("settings put system min_refresh_rate ").append(hz).append(".0\n")
                      sb.append("settings put system peak_refresh_rate ").append(hz).append(".0\n")
                  }
                  RootShell.run(sb.toString())
              }

              // ------------------------------------------------------------------ the grade
              private fun hueRgb(hDeg: Float): FloatArray {
                  val x = hDeg / 360f
                  val offs = floatArrayOf(0f, 2f / 3f, 1f / 3f)
                  val r = FloatArray(3)
                  for (i in 0..2) {
                      var k = (x + offs[i]) % 1f
                      if (k < 0f) k += 1f
                      r[i] = (Math.abs(k * 6f - 3f) - 1f).coerceIn(0f, 1f)
                  }
                  return r
              }

              /** Builds the full grade from a parameter array. Pure function, also used by preset swatches. */
              fun buildMatrix(v: FloatArray): Mx {
                  fun g(k: String): Float = v[P.index(k)]
                  var m = Mx.identity()

                  // exposure + extra dim
                  val gain = Math.pow(2.0, g("exposure").toDouble()).toFloat() * (1f - g("dim") / 100f * 0.85f)
                  m = m.then(Mx.scale(gain, gain, gain))

                  // temperature + tint
                  val t = g("temp") / 100f
                  val u = g("tint") / 100f
                  m = m.then(Mx.scale(1f + 0.14f * t + 0.04f * u, 1f + 0.02f * t - 0.14f * u, 1f - 0.22f * t + 0.04f * u))

                  // saturation, hue
                  m = m.then(Mx.sat(g("sat") / 100f))
                  if (g("hue") != 0f) m = m.then(Mx.hue(g("hue")))

                  // channel mixer
                  val mix = FloatArray(9) { g(mixKeys[it]) / 100f }
                  m = m.then(Mx(mix, FloatArray(3)))

                  // bleach bypass: desaturate + harder contrast, blended in
                  val bl = g("bleach") / 100f
                  if (bl > 0f) {
                      val c = 1.35f
                      val b = Mx.sat(0.4f).then(Mx.diag(floatArrayOf(c, c, c), floatArrayOf(0.5f * (1f - c), 0.5f * (1f - c), 0.5f * (1f - c))))
                      m = m.lerp(m.then(b), bl)
                  }

                  // sepia
                  val se = g("sepia") / 100f
                  if (se > 0f) {
                      val k = 0.84f
                      val sp = Mx(floatArrayOf(
                          0.393f * k, 0.769f * k, 0.189f * k,
                          0.349f * k, 0.686f * k, 0.168f * k,
                          0.272f * k, 0.534f * k, 0.131f * k), FloatArray(3))
                      m = m.lerp(m.then(sp), se)
                  }

                  // contrast around mid grey
                  val c = g("contrast") / 100f
                  val po = 0.5f * (1f - c)
                  m = m.then(Mx.diag(floatArrayOf(c, c, c), floatArrayOf(po, po, po)))

                  // blacks: fade (+) or crush (-)
                  val bk = g("blacks") / 100f
                  if (bk > 0f) {
                      m = m.then(Mx.diag(floatArrayOf(1f - bk, 1f - bk, 1f - bk), floatArrayOf(bk, bk, bk)))
                  } else if (bk < 0f) {
                      val cc = -bk
                      val sc = 1f / (1f - cc)
                      val off = -cc * sc
                      m = m.then(Mx.diag(floatArrayOf(sc, sc, sc), floatArrayOf(off, off, off)))
                  }

                  // highlight gain
                  val wh = g("whites") / 100f
                  m = m.then(Mx.scale(wh, wh, wh))

                  // split toning: lerp from shadow tint (at black) to highlight tint (at white)
                  val shA = g("shAmt") / 100f
                  val hiA = g("hiAmt") / 100f
                  if (shA > 0f || hiA > 0f) {
                      val sc = hueRgb(g("shHue"))
                      val hc = hueRgb(g("hiHue"))
                      val sm = (sc[0] + sc[1] + sc[2]) / 3f
                      val hm = (hc[0] + hc[1] + hc[2]) / 3f
                      val off = FloatArray(3)
                      val gn = FloatArray(3)
                      for (i in 0..2) {
                          val sh = (sc[i] - sm) * shA * 0.11f
                          val hi = (hc[i] - hm) * hiA * 0.20f
                          off[i] = sh
                          gn[i] = 1f + hi - sh
                      }
                      m = m.then(Mx.diag(gn, off))
                  }

                  // invert (50% = flat grey)
                  val inv = g("invert") / 100f
                  if (inv > 0f) {
                      val s = 1f - 2f * inv
                      m = m.then(Mx.diag(floatArrayOf(s, s, s), floatArrayOf(inv, inv, inv)))
                  }
                  return m
              }
          }
