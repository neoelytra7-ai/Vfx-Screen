          package dev.canvas

          import android.content.ContentValues
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.drawBehind
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import kotlin.math.ln
          import kotlin.math.pow

          /** Every UI token is a live state: the Theme panel edits these and they persist. */
          object T {
              var ah by mutableFloatStateOf(165f)
              var sat by mutableFloatStateOf(1f)
              var av by mutableFloatStateOf(1f)
              var pa by mutableFloatStateOf(.78f)
              var rad by mutableFloatStateOf(12f)
              var sc by mutableFloatStateOf(1f)
              var fs by mutableFloatStateOf(11f)
              var bgv by mutableFloatStateOf(0f)
              var left by mutableStateOf(false)
              val ac: Color get() = Color(android.graphics.Color.HSVToColor(floatArrayOf(ah, sat, av)))
              val panel: Color get() = Color(0xFF0E0F12).copy(alpha = pa)
              val ink = Color(0xFFE6E8EB)
              fun load(p: SharedPreferences) {
                  ah = p.getFloat("ah", ah); sat = p.getFloat("sat", sat); av = p.getFloat("av", av); pa = p.getFloat("pa", pa)
                  rad = p.getFloat("rad", rad); sc = p.getFloat("sc", sc); fs = p.getFloat("fs", fs); bgv = p.getFloat("bgv", bgv)
                  left = p.getBoolean("left", left)
              }
              fun save(p: SharedPreferences) {
                  p.edit().putFloat("ah", ah).putFloat("sat", sat).putFloat("av", av).putFloat("pa", pa).putFloat("rad", rad)
                      .putFloat("sc", sc).putFloat("fs", fs).putFloat("bgv", bgv).putBoolean("left", left).apply()
              }
          }

          object U {
              var rev by mutableIntStateOf(0)
              var hh by mutableFloatStateOf(0f)
              var ss by mutableFloatStateOf(0f)
              var bb by mutableFloatStateOf(1f)
              var tgt by mutableIntStateOf(0)
              fun bump() { rev++ }
              fun col(): Int = android.graphics.Color.HSVToColor(floatArrayOf(hh, ss, bb))
              fun from(c: Int) { val a = FloatArray(3); android.graphics.Color.colorToHSV(c, a); hh = a[0]; ss = a[1]; bb = a[2] }
          }

          fun d(x: Float): Dp = (x * T.sc).dp
          val BL = listOf("NRM", "MUL", "SCR", "ADD")
          val SYM = listOf("OFF", "X", "Y", "XY", "RAD")
          val PRESETS = listOf(
              "PEN" to floatArrayOf(12f, 1f, .95f, .05f, 1f, 0f, 0f, 0f, 0f, 0f, 2f, .3f, .7f, 0f),
              "SOFT" to floatArrayOf(60f, .6f, .1f, .08f, 1f, 0f, 0f, 0f, 0f, 0f, 2f, .2f, .4f, .4f),
              "AIR" to floatArrayOf(120f, .25f, 0f, .04f, 1f, 0f, .1f, 0f, .1f, .2f, 2f, .1f, 0f, .6f),
              "MRK" to floatArrayOf(40f, .9f, .9f, .06f, .35f, 40f, 0f, 0f, 0f, 0f, 2f, .2f, .3f, 0f),
              "CHK" to floatArrayOf(36f, .85f, .6f, .15f, .8f, 0f, .35f, .2f, .3f, .7f, 3f, 0f, .5f, .3f),
              "INK" to floatArrayOf(8f, 1f, 1f, .03f, 1f, 0f, 0f, 0f, 0f, 0f, 2f, .7f, .9f, 0f),
          )

          class PP(val n: String, val lo: Float, val hi: Float, val st: Float, val log: Boolean, val g: () -> Float, val s: (Float) -> Unit)

          fun penParams(e: Engine): List<PP> {
              val p = e.pen
              return listOf(
                  PP("SIZE", 1f, 1000f, 1f, true, { p.size }, { p.size = it }),
                  PP("OPACITY", .01f, 1f, .01f, false, { p.opacity }, { p.opacity = it }),
                  PP("HARDNESS", 0f, 1f, .01f, false, { p.hardness }, { p.hardness = it }),
                  PP("SPACING", .005f, 2f, .005f, true, { p.spacing }, { p.spacing = it }),
                  PP("ROUND", .05f, 1f, .01f, false, { p.round }, { p.round = it }),
                  PP("ANGLE", 0f, 360f, 1f, false, { p.angle }, { p.angle = it }),
                  PP("SCATTER", 0f, 2f, .01f, false, { p.scatter }, { p.scatter = it }),
                  PP("SIZE JIT", 0f, 1f, .01f, false, { p.sizeJit }, { p.sizeJit = it }),
                  PP("OPAC JIT", 0f, 1f, .01f, false, { p.opJit }, { p.opJit = it }),
                  PP("GRAIN", 0f, 1f, .01f, false, { p.grain }, { p.grain = it }),
                  PP("GRAIN SZ", 1f, 32f, 1f, false, { p.grainScale }, { p.grainScale = it }),
                  PP("SMOOTH", 0f, .95f, .01f, false, { p.smooth }, { p.smooth = it }),
                  PP("P CURVE", .2f, 4f, .05f, false, { p.pCurve }, { p.pCurve = it }),
                  PP("P>SIZE", 0f, 1f, .01f, false, { p.pSize }, { p.pSize = it }),
                  PP("P>OPAC", 0f, 1f, .01f, false, { p.pOp }, { p.pOp = it }),
                  PP("BLUR R", 1f, 32f, .5f, false, { p.blurR }, { p.blurR = it }),
                  PP("FILL TOL", 0f, 255f, 1f, false, { p.tol }, { p.tol = it }),
                  PP("SYM N", 2f, 16f, 1f, false, { e.symN.toFloat() }, { e.symN = it.toInt() }),
                  PP("LIQ STR", .05f, 3f, .05f, false, { e.liqS }, { e.liqS = it }),
              )
          }

          fun themeParams() = listOf(
              PP("ACC HUE", 0f, 360f, 1f, false, { T.ah }, { T.ah = it }),
              PP("ACC SAT", 0f, 1f, .01f, false, { T.sat }, { T.sat = it }),
              PP("ACC VAL", .3f, 1f, .01f, false, { T.av }, { T.av = it }),
              PP("PANEL A", .1f, 1f, .01f, false, { T.pa }, { T.pa = it }),
              PP("RADIUS", 0f, 28f, 1f, false, { T.rad }, { T.rad = it }),
              PP("UI SCALE", .7f, 1.6f, .05f, false, { T.sc }, { T.sc = it }),
              PP("FONT", 8f, 18f, .5f, false, { T.fs }, { T.fs = it }),
              PP("CANVAS BG", 0f, .25f, .01f, false, { T.bgv }, { T.bgv = it }),
          )

          @Composable
          fun Modifier.touch(f: (Float, Float) -> Unit): Modifier {
              val u by rememberUpdatedState(f)
              return pointerInput(Unit) {
                  awaitPointerEventScope {
                      while (true) {
                          val c = awaitPointerEvent().changes[0]
                          if (c.pressed) {
                              u((c.position.x / size.width).coerceIn(0f, 1f), (c.position.y / size.height).coerceIn(0f, 1f))
                              c.consume()
                          }
                      }
                  }
              }
          }

          @Composable
          fun Tx(s: String, c: Color = T.ink, mod: Modifier = Modifier, sz: Float = T.fs) =
              Text(s, modifier = mod, color = c, fontSize = sz.sp, fontFamily = FontFamily.Monospace, maxLines = 1)

          @Composable
          fun Btn(s: String, on: Boolean = false, w: Float = 40f, en: Boolean = true, f: () -> Unit) {
              Box(
                  Modifier.alpha(if (en) 1f else .3f).size(d(w), d(38f)).clip(RoundedCornerShape(d(T.rad)))
                      .background(if (on) T.ac else T.panel).clickable(enabled = en, onClick = f),
                  contentAlignment = Alignment.Center
              ) { Tx(s, if (on) Color.Black else T.ac) }
          }

          @Composable
          fun HS(t: Float, mod: Modifier = Modifier, on: (Float) -> Unit) {
              Box(Modifier.then(mod).height(d(24f)).clip(RoundedCornerShape(d(12f))).background(T.panel).touch { x, _ -> on(x) }) {
                  Box(Modifier.fillMaxWidth(t.coerceIn(.02f, 1f)).fillMaxHeight().background(T.ac.copy(alpha = .8f)))
              }
          }

          @Composable
          fun R2(p: PP) {
              val rv = U.rev
              val v = p.g()
              val t = if (p.log) ln(v / p.lo) / ln(p.hi / p.lo) else (v - p.lo) / (p.hi - p.lo)
              fun set(x: Float) { p.s(x.coerceIn(p.lo, p.hi)); U.bump() }
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))) {
                  Tx(p.n, mod = Modifier.width(d(66f)))
                  Btn("-", w = 30f) { set(v - p.st) }
                  HS(t, Modifier.weight(1f)) { x -> set(if (p.log) p.lo * (p.hi / p.lo).pow(x) else p.lo + x * (p.hi - p.lo)) }
                  Btn("+", w = 30f) { set(v + p.st) }
                  Tx("%.2f".format(v), mod = Modifier.width(d(54f)))
              }
          }

          @Composable
          fun BrushPanel(e: Engine) {
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PRESETS.forEach { (n, vals) -> Btn(n, w = 50f) { e.pen.load(vals); U.bump() } }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Btn("FOLLOW", e.pen.follow, 66f) { e.pen.follow = !e.pen.follow; U.bump() }
                  SYM.forEachIndexed { i, s -> Btn(s, e.symMode == i, 44f) { e.symMode = i; U.bump() } }
              }
              penParams(e).forEach { R2(it) }
          }

          @Composable
          fun ColorPanel(e: Engine) {
              val rv = U.rev
              val hc = Color(android.graphics.Color.HSVToColor(floatArrayOf(U.hh, 1f, 1f)))
              fun ap() { val c = U.col(); if (U.tgt == 0) e.pen.color = c else e.pen.color2 = c; U.bump() }
              Row(horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  Btn("FG", U.tgt == 0, 36f) { U.tgt = 0; U.from(e.pen.color) }
                  Btn("BG", U.tgt == 1, 36f) { U.tgt = 1; U.from(e.pen.color2) }
                  Btn("SWAP", w = 52f) {
                      val t = e.pen.color; e.pen.color = e.pen.color2; e.pen.color2 = t
                      U.from(if (U.tgt == 0) e.pen.color else e.pen.color2); U.bump()
                  }
                  Tx("#%06X".format(U.col() and 0xFFFFFF))
              }
              Box(
                  Modifier.fillMaxWidth().height(d(150f)).clip(RoundedCornerShape(d(T.rad))).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.White, hc)))
                      drawRect(Brush.verticalGradient(listOf(Color.Transparent, Color.Black)))
                      drawCircle(Color.White, radius = 9f, center = Offset(U.ss * size.width, (1f - U.bb) * size.height), style = Stroke(3f))
                  }.touch { x, y -> U.ss = x; U.bb = 1f - y; ap() }
              )
              Box(
                  Modifier.fillMaxWidth().height(d(26f)).clip(RoundedCornerShape(d(T.rad))).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.Red, Color.Yellow, Color.Green, Color.Cyan, Color.Blue, Color.Magenta, Color.Red)))
                      drawRect(Color.White, topLeft = Offset(U.hh / 360f * size.width - 2f, 0f), size = Size(4f, size.height))
                  }.touch { x, _ -> U.hh = x * 360f; ap() }
              )
              val pal = listOf(0xFFFFFFFF, 0xFF000000, 0xFFFF3B5C, 0xFFFFB300, 0xFF00E676, 0xFF00B0FF, 0xFF7C4DFF, 0xFFFF4081)
              Row(horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                  pal.forEach { c ->
                      Box(Modifier.size(d(28f)).clip(CircleShape).background(Color(c)).clickable {
                          U.from(Color(c).toArgb()); ap()
                      })
                  }
              }
          }

          @Composable
          fun LayerPanel(e: Engine, v: CanvasView) {
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Btn("+", w = 36f) { v.gl { e.addLayer() } }
                  Btn("DUP", w = 42f) { v.gl { e.dupLayer() } }
                  Btn("DEL", w = 42f) { v.gl { e.delLayer() } }
                  Btn("UP", w = 38f) { v.gl { e.moveLayer(1) } }
                  Btn("DN", w = 38f) { v.gl { e.moveLayer(-1) } }
                  Btn("MRG", w = 42f) { v.gl { e.mergeDown() } }
                  Btn("CLR", w = 42f) { v.gl { e.clearLayer() } }
              }
              e.info.indices.reversed().forEach { i ->
                  val l = e.info[i]
                  Row(
                      Modifier.fillMaxWidth().clickable { v.gl { e.select(i) } },
                      verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))
                  ) {
                      Tx("L${i + 1}", if (i == e.curUi) T.ac else T.ink, Modifier.width(d(34f)))
                      Btn(if (l.show) "ON" else "--", l.show, 36f) { v.gl { e.setShow(i, !l.show) } }
                      Btn(BL[l.blend], w = 44f) { v.gl { e.setBlend(i, (l.blend + 1) % 4) } }
                      HS(l.alpha, Modifier.weight(1f)) { x -> v.gl { e.setAlpha(i, x) } }
                  }
              }
          }

          @Composable
          fun ThemePanel(done: () -> Unit) {
              Row(horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Btn("RAIL " + if (T.left) "L" else "R", w = 66f) { T.left = !T.left }
                  Btn("DONE", w = 50f, f = done)
              }
              themeParams().forEach { R2(it) }
          }

          fun saveBmp(ctx: Context, b: Bitmap) {
              val n = "Canvas_" + System.currentTimeMillis() + ".png"
              var ok = true
              try {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val cv = ContentValues()
                      cv.put(MediaStore.Images.Media.DISPLAY_NAME, n)
                      cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                      cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Canvas")
                      val u = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv)!!
                      ctx.contentResolver.openOutputStream(u)!!.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  } else {
                      val f = java.io.File(ctx.getExternalFilesDir(Environment.DIRECTORY_PICTURES), n)
                      f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  }
              } catch (x: Exception) { ok = false }
              Handler(Looper.getMainLooper()).post {
                  Toast.makeText(ctx, if (ok) "saved " + n else "save failed", Toast.LENGTH_LONG).show()
              }
          }

          @Composable
          fun App(e: Engine) {
              val ctx = LocalContext.current
              val v = remember { CanvasView(ctx, e) }
              val rv = U.rev
              val bg = T.bgv
              var tool by remember { mutableStateOf(Tool.BRUSH) }
              var panel by remember { mutableIntStateOf(0) }
              var hud by remember { mutableStateOf(true) }
              SideEffect { e.bgv = bg; v.requestRender() }
              LaunchedEffect(Unit) { e.onPick = { c -> U.tgt = 0; U.from(c); U.bump() } }

              Box(Modifier.fillMaxSize().background(Color(bg, bg, bg))) {
                  AndroidView({ v }, Modifier.fillMaxSize())
                  if (!hud) {
                      Box(Modifier.align(Alignment.BottomEnd).padding(d(8f))) { Btn("UI", w = 44f) { hud = true } }
                  } else {
                      // ---- top bar ----
                      Row(
                          Modifier.align(Alignment.TopCenter).fillMaxWidth().statusBarsPadding().padding(d(8f)),
                          horizontalArrangement = Arrangement.spacedBy(d(8f)), verticalAlignment = Alignment.CenterVertically
                      ) {
                          Btn("UN", en = e.canUndo) { v.gl { e.undo() } }
                          Btn("RE", en = e.canRedo) { v.gl { e.redo() } }
                          Spacer(Modifier.weight(1f))
                          Btn("SYM:" + SYM[e.symMode], e.symMode != 0, 76f) { e.symMode = (e.symMode + 1) % 5; U.bump() }
                          Btn("SAVE", w = 52f) { v.gl { val b = e.snapshot(); Thread { saveBmp(ctx, b) }.start() } }
                      }
                      // ---- tool rail ----
                      Column(
                          Modifier.align(if (T.left) Alignment.CenterStart else Alignment.CenterEnd).padding(d(4f)).fillMaxHeight(.62f)
                              .clip(RoundedCornerShape(d(T.rad + 6f))).background(T.panel).verticalScroll(rememberScrollState()).padding(d(4f)),
                          verticalArrangement = Arrangement.spacedBy(d(4f))
                      ) {
                          Tool.values().forEach { t -> Btn(t.code, tool == t, 40f) { tool = t; e.tool = t; U.bump() } }
                      }
                      // ---- bottom stack ----
                      val side = if (panel != 0) d(54f) else 0.dp
                      Column(
                          Modifier.align(Alignment.BottomCenter).fillMaxWidth().navigationBarsPadding()
                              .padding(start = if (T.left) side else 0.dp, end = if (T.left) 0.dp else side).padding(d(6f)),
                          verticalArrangement = Arrangement.spacedBy(d(5f))
                      ) {
                          if (panel != 0) {
                              Column(
                                  Modifier.fillMaxWidth().heightIn(max = d(330f)).clip(RoundedCornerShape(d(T.rad + 4f))).background(T.panel)
                                      .verticalScroll(rememberScrollState()).padding(d(8f)),
                                  verticalArrangement = Arrangement.spacedBy(d(6f))
                              ) {
                                  when (panel) {
                                      1 -> BrushPanel(e)
                                      2 -> ColorPanel(e)
                                      3 -> LayerPanel(e, v)
                                      else -> ThemePanel { T.save(ctx.getSharedPreferences("t", 0)); panel = 0 }
                                  }
                              }
                          }
                          if (tool == Tool.LIQUIFY) {
                              Row(horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                                  listOf("PUSH", "PINCH", "BLOAT", "SWIRL").forEachIndexed { i, s ->
                                      Btn(s, e.liqMode == i, 60f) { e.liqMode = i; U.bump() }
                                  }
                                  Btn("APPLY", w = 60f) { v.gl { e.bake() } }
                              }
                          }
                          if (tool == Tool.LIQUIFY) R2(PP("RADIUS", 10f, 500f, 5f, true, { e.liqR }, { e.liqR = it }))
                          else R2(PP("SIZE", 1f, 1000f, 1f, true, { e.pen.size }, { e.pen.size = it }))
                          R2(PP("OPACITY", .01f, 1f, .01f, false, { e.pen.opacity }, { e.pen.opacity = it }))
                          Row(
                              Modifier.fillMaxWidth().clip(RoundedCornerShape(d(T.rad + 4f))).background(T.panel).padding(d(6f)),
                              horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically
                          ) {
                              Btn(if (tool == Tool.ERASER) "BR" else "ER", w = 44f) {
                                  tool = if (tool == Tool.ERASER) Tool.BRUSH else Tool.ERASER; e.tool = tool; U.bump()
                              }
                              Box(
                                  Modifier.size(d(46f)).clip(CircleShape).background(T.panel).clickable { panel = if (panel == 1) 0 else 1 },
                                  contentAlignment = Alignment.Center
                              ) {
                                  Canvas(Modifier.size(d(40f))) {
                                      drawCircle(Brush.radialGradient(0f to T.ink, e.pen.hardness.coerceIn(0f, .97f) to T.ink, 1f to T.ink.copy(alpha = 0f)))
                                  }
                              }
                              Box(
                                  Modifier.size(d(44f)).clip(RoundedCornerShape(d(T.rad))).background(Color(e.pen.color2))
                                      .clickable { panel = if (panel == 2) 0 else 2; U.from(if (U.tgt == 0) e.pen.color else e.pen.color2) },
                                  contentAlignment = Alignment.Center
                              ) { Box(Modifier.size(d(26f)).background(Color(e.pen.color))) }
                              Btn("HUD", w = 44f) { hud = false }
                              Btn("L" + (e.curUi + 1) + "/" + e.info.size, panel == 3, 64f) { panel = if (panel == 3) 0 else 3 }
                              Btn("CFG", panel == 4, 44f) { panel = if (panel == 4) 0 else 4 }
                          }
                      }
                  }
              }
          }
          EOF_SRC
      - uses: actions/cache@v4
        with: {path: ~/ks, key: "ks-${{github.repository}}"}
      - env:
          B: ${{secrets.KS_B64}}
          P: ${{secrets.KS_PASS || 'ci-dev-key'}}
          A: ${{secrets.KS_ALIAS || 'k'}}
        run: |
          V=0.$(date -u +%y%m%d).$GITHUB_RUN_NUMBER
          gradle -q :app:assembleRelease -PversionCode=$((1000+GITHUB_RUN_NUMBER)) -PversionName=$V
          mkdir -p ~/ks dist; K=~/ks/k.jks
          [ -n "$B" ] && echo "$B"|base64 -d >$K
          [ -f $K ] || keytool -genkeypair -keystore $K -alias $A -keyalg RSA -keysize 3072 -validity 36500 -storepass "$P" -keypass "$P" -dname CN=$N
          T=$(ls -d $ANDROID_HOME/build-tools/*|sort -V|tail -1)
          $T/zipalign -fp 4 app/build/outputs/apk/release/*.apk a.apk
          $T/apksigner sign --ks $K --ks-key-alias $A --ks-pass env:P --key-pass env:P --out dist/$N-$V.apk a.apk
          echo "V=$V" >>$GITHUB_ENV
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{github.token}}"}
        run: |
          R=nightly F=-p; [ $GITHUB_REF_TYPE = tag ] && R=$GITHUB_REF_NAME F=
          [ $R = nightly ] && gh release delete nightly --cleanup-tag -y || true
          gh release create $R dist/* -t "$N $V" -n "build $GITHUB_RUN_NUMBER" --target $GITHUB_SHA $F
