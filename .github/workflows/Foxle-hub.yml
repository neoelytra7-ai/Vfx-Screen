      - name: Keystore (cache, dibuat sekali)
        uses: actions/cache@v4
        with:
          path: ks.jks
          key: foxl-keystore-v1

      - name: Buat keystore jika belum ada
        run: |
          [ -f ks.jks ] || keytool -genkeypair -keystore ks.jks -storepass foxlhub -keypass foxlhub \
            -alias k -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Foxle Hub"

      - name: Build release APK
        working-directory: hub
        env:
          KS: ${{ github.workspace }}/ks.jks
        run: gradle assembleRelease --console=plain

      - name: Rename
        run: |
          cp hub/app/build/outputs/apk/release/app-release.apk FoxleHub.apk
          ls -l FoxleHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FoxleHub
          path: FoxleHub.apk
          if-no-files-found: error
