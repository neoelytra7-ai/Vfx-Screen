                '<button class="c rd" data-a="ex" style="flex-basis:100%">Kembali ke Hub</button>';
              scale();
            }
            var fpsOn=false,fr=0,ft=0,raf;
            function loop(t){fr++;if(t-ft>=500){$('#f').textContent=Math.round(fr*1000/(t-ft))+' FPS';fr=0;ft=t}raf=requestAnimationFrame(loop)}
            function fps(on){fpsOn=on;$('#f').style.display=on?'block':'none';cancelAnimationFrame(raf);if(on){fr=0;ft=performance.now();raf=requestAnimationFrame(loop)}}
            $('#b').onclick=function(){w.classList.toggle('o');dim()};
            r.addEventListener('click',function(e){
              var g=e.target.closest('.g>button');
              if(g){var p=g.parentNode,was=p.classList.contains('o');
                ['g1','g2','g3'].forEach(function(i){$('#'+i).classList.remove('o')});
                if(!was)p.classList.add('o');dim();return}
              var c=e.target.closest('.c');if(!c)return;dim();
              if(c.dataset.r){st.res=+c.dataset.r;Host.hRes(st.res)}
              else if(c.dataset.f){st.fs=!st.fs;Host.hFs(st.fs)}
              else if(c.dataset.k){st.ka=!st.ka;Host.hKa(st.ka)}
              else if(c.dataset.o){st.or=c.dataset.o;Host.hOri(st.or)}
              else if(c.dataset.a==='fps')fps(!fpsOn);
              else if(c.dataset.a==='rl')Host.hReload();
              else if(c.dataset.a==='ex')Host.hExit();
              build();
            });
            ['pointerdown','pointerup','touchstart','touchend','mousedown','mouseup','click'].forEach(function(t){h.addEventListener(t,function(e){e.stopPropagation()})});
            build();dim();
            (document.body||document.documentElement).appendChild(h);
            setInterval(function(){if(!h.isConnected)(document.body||document.documentElement).appendChild(h)},2000);
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
          })();
