          /* ---------- sheet detail ---------- */
          #dt{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:linear-gradient(var(--bgd),#000);transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.2,1),visibility 0s .35s}
          #dt.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.2,1),visibility 0s}
          #dh{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--t);border-bottom:4px solid #000;box-shadow:inset 0 3px 0 var(--tl)}
          #bk{width:40px;height:36px;background:#000;box-shadow:inset 0 0 0 2px #555;font-size:24px;color:var(--y)}
          #bk:active{transform:scale(.9)}
          #dn{font:700 22px 'Pixelify Sans',monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:2px 2px 0 #000}
          #db{flex:1;min-height:0;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
          #da{width:96px;height:96px;flex:none;filter:drop-shadow(0 8px 0 #0008)}
          #dt.on #da{animation:drop .55s cubic-bezier(.3,1.6,.5,1) both,bob 2.4s ease-in-out .6s infinite}
          @keyframes drop{from{transform:translateY(-40px) scale(.5);opacity:0}}
          @keyframes bob{50%{transform:translateY(-6px)}}
          #dnm{font:700 26px 'Pixelify Sans',monospace;text-align:center;text-shadow:3px 3px 0 #000;max-width:100%;overflow:hidden;text-overflow:ellipsis}
          #dtt{color:#9a9a9a;font-size:20px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          #mt{width:100%;max-width:360px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
          #mt div{background:var(--pn);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--pnl);padding:6px 8px;min-width:0}
          #mt small{display:block;color:var(--mu);font-size:16px}
          #mt b{display:block;font-weight:400;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          #dt.on #mt div{animation:rise .4s both}
          #dt.on #mt div:nth-child(2){animation-delay:.05s}
          #dt.on #mt div:nth-child(3){animation-delay:.1s}
          #dt.on #mt div:nth-child(4){animation-delay:.15s}
          @keyframes rise{from{transform:translateY(14px);opacity:0}}
          /* ---------- tombol Play ---------- */
          #play{--in:inset 4px 4px 0 var(--ah),inset -4px -4px 0 var(--ad);position:relative;overflow:hidden;flex:none;width:min(88%,330px);height:74px;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--a);border:4px solid #000;box-shadow:var(--in),0 0 0 0 rgba(var(--ahr),.6);font:700 32px 'Pixelify Sans',monospace;color:#fff;text-shadow:3px 3px 0 #000;animation:pulse 1.8s infinite;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
          #play:active{transform:scale(.93)}
          #play::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:36%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 2.6s infinite;pointer-events:none}
          #play i{flex:none;width:0;height:0;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;filter:drop-shadow(3px 3px 0 #000);animation:nudge .7s infinite alternate steps(3)}
          #dt.on #play{animation:pulse 1.8s infinite,rise .5s .2s both}
          @keyframes pulse{0%{box-shadow:var(--in),0 0 0 0 rgba(var(--ahr),.67)}70%,100%{box-shadow:var(--in),0 0 0 18px rgba(var(--ahr),0)}}
          @keyframes shine{0%,35%{left:-60%}100%{left:130%}}
          @keyframes nudge{to{transform:translateX(7px)}}
          .rp{position:absolute;border-radius:50%;background:#fff7;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
          @keyframes rp{to{transform:scale(1);opacity:0}}
          .pt{position:fixed;z-index:9;width:8px;height:8px;pointer-events:none}
          #go{position:fixed;z-index:9;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--ah);transform:scale(0);pointer-events:none;visibility:hidden}
          #go.on{visibility:visible;transform:scale(var(--k));transition:transform .4s cubic-bezier(.6,0,1,.6)}
          /* ---------- opsi kecil ---------- */
          #ops{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
          .sc small{display:block;color:var(--mu);font-size:16px;margin:0 0 6px 2px}
          .sg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
          .ob{width:66px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--t);border:3px solid #000;box-shadow:inset 3px 3px 0 var(--tl),inset -3px -3px 0 var(--td);font-size:15px;line-height:1;text-shadow:2px 2px 0 #000;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
          .ob:active{transform:scale(.88)}
          .ob svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;shape-rendering:crispEdges;stroke-linecap:square}
          .ob em{font-style:normal;color:var(--y);font-size:14px}
          .ob.on{background:var(--a);box-shadow:inset 3px 3px 0 var(--al),inset -3px -3px 0 var(--ad)}
          .ob.on em{color:var(--ah)}
          .ob.rd{background:#6b1c12;box-shadow:inset 3px 3px 0 #b0422f,inset -3px -3px 0 #3a0e06}
          #dt.on .ob{animation:rise .4s both}
          #dt.on .ob:nth-child(1){animation-delay:.3s}#dt.on .ob:nth-child(2){animation-delay:.35s}#dt.on .ob:nth-child(3){animation-delay:.4s}#dt.on .ob:nth-child(4){animation-delay:.45s}#dt.on .ob:nth-child(5){animation-delay:.5s}
          /* ---------- dialog reset data ---------- */
          #rd{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#000b;padding:16px}
          #rd.on{display:flex}
          #rb{width:100%;max-width:340px;max-height:100%;overflow-y:auto;background:var(--pn);border:4px solid #000;box-shadow:inset 0 0 0 2px var(--pn3);padding:14px;display:flex;flex-direction:column;gap:8px}
          #rb h2{font:700 24px 'Pixelify Sans',monospace;text-shadow:2px 2px 0 #000}
          #rb p{color:#9a9a9a;font-size:17px;line-height:1.15;margin-bottom:2px}
          .ck{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;background:var(--pn2);border:3px solid #000;box-shadow:inset 2px 2px 0 var(--pn3);font-size:20px}
          .ck i{flex:none;width:22px;height:22px;background:#000;box-shadow:inset 0 0 0 2px #555}
          .ck.on i{background:var(--ah);box-shadow:inset 0 0 0 4px #000}
          .ck small{display:block;color:var(--mu);font-size:15px}
          .rr{display:flex;gap:8px;margin-top:4px}
          .bt{flex:1;height:46px;background:var(--t);border:3px solid #000;box-shadow:inset 3px 3px 0 var(--tl),inset -3px -3px 0 var(--td);font-size:22px;text-shadow:2px 2px 0 #000}
          .bt:active{transform:scale(.94)}
          .bt.rd{background:#6b1c12;box-shadow:inset 3px 3px 0 #b0422f,inset -3px -3px 0 #3a0e06}
          @media (prefers-reduced-motion:reduce){#play,#play::after,#play i,#da{animation:none!important}}
          #wd{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}#top,#pg,#dots{position:relative;z-index:1}.s{background-image:var(--tex);background-size:32px;image-rendering:pixelated}#e{color:#ddd;text-shadow:2px 2px 0 #000}#lg{cursor:pointer;filter:drop-shadow(0 0 6px var(--glow))}#th{width:40px;height:34px;padding:0;background:#000;box-shadow:inset 0 0 0 2px var(--al);display:flex;align-items:center;justify-content:center}#th img{width:26px;height:26px}#tm{position:absolute;top:calc(58px + env(safe-area-inset-top));right:8px;z-index:12;display:none;flex-direction:column;gap:6px;padding:8px;background:var(--pn);border:4px solid #000;box-shadow:inset 0 0 0 2px var(--pn3)}#tm.on{display:flex;animation:pop .25s both}#tm button{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;min-width:176px;background:var(--t);border:3px solid #000;box-shadow:inset 2px 2px 0 var(--tl),inset -2px -2px 0 var(--td);font-size:21px;text-shadow:2px 2px 0 #000;text-align:left}#tm button.on{background:var(--a);box-shadow:inset 2px 2px 0 var(--al),inset -2px -2px 0 var(--ad)}#tm img{width:26px;height:26px}#fx{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}#fx.on{pointer-events:auto}#fx .lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .35s cubic-bezier(.2,.9,.2,1)}#fx .t{top:0}#fx .b{bottom:0}#fx.on .lb{height:14%}#fx i{position:absolute;pointer-events:none}#ft{position:absolute;top:50%;left:0;right:0;margin-top:-20px;text-align:center;font:700 34px 'Pixelify Sans',monospace;letter-spacing:3px;color:var(--ah);text-shadow:3px 0 #f0f,-3px 0 #0ff;opacity:0}#fx.on #ft{opacity:1;animation:jit .12s steps(2) infinite}@keyframes jit{50%{transform:translate(3px,-2px)}}</style></head><body><canvas id="wd"></canvas>
          <div id="top"><img id="lg" alt=""><h1>Foxle Hub</h1><button id="pm">Akses file</button><button id="th"></button></div>
          <div id="pg"></div>
          <div id="dots"></div>
          <div id="e" hidden>Belum ada projek<br>Tap + untuk impor .html / .zip</div>
          <div id="dt">
            <div id="dh"><button id="bk">&#9664;</button><b id="dn"></b></div>
            <div id="db">
              <img id="da" alt="">
              <div id="dnm"></div>
              <div id="dtt"></div>
              <div id="mt"></div>
              <button id="play"><i></i><span>MAIN</span></button>
              <div id="ops"></div>
            </div>
          </div>
          <div id="rd"><div id="rb"></div></div>
          <div id="go"></div>
          <script>
          const $=s=>document.querySelector(s);
          const pal=['#e8802a','#5fb02f','#4a7fd4','#d6403a','#9b59c9','#fcdb5a','#7cff3a','#e86fb0'];
          const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
          function px(g,pl){const c=document.createElement('canvas');c.width=c.height=10;const x=c.getContext('2d'),on=(i,y)=>pl[(g[y]||'')[i]];
           x.fillStyle='#000';for(let y=-1;y<9;y++)for(let i=-1;i<9;i++)if(!on(i,y)&&(on(i-1,y)||on(i+1,y)||on(i,y-1)||on(i,y+1)))x.fillRect(i+1,y+1,1,1);
           g.forEach((r,y)=>[...r].forEach((ch,i)=>{if(pl[ch]){x.fillStyle=pl[ch];x.fillRect(i+1,y+1,1,1)}}));return c.toDataURL()}
          function av(n){let h=2166136261;for(const c of n){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
           let r=h;const rnd=()=>((r=(Math.imul(r,1103515245)+12345)>>>0)/4294967296);
           const g=[];for(let y=0;y<8;y++){let a='';for(let i=0;i<4;i++)a+=rnd()<.55?'c':'.';g.push(a+[...a].reverse().join(''))}
           g[3]=g[3].replace(/^.(.*).$/,'.$1.');return px(g,{c:pal[h%8]})}
          const FOX=["o......o","oo....oo","oooooooo","owkoowko","oooooooo","owwoowwo",".owwwwo.","..okko.."];
          $('#lg').src=px(FOX,{o:'#e8802a',w:'#fff',k:'#000'});

          /* ---------- grid ---------- */
          const PER=24;let P=[],cur=0;const pg=$('#pg');
          function refresh(){let n;try{n=Host.list()}catch(e){n='[]'}if(n===window.__ls&&pg.firstChild)return;window.__ls=n;try{P=JSON.parse(n)}catch(e){P=[]}draw()}
          function draw(){
            const it=P.map((p,i)=>`<div class="s" data-id="${p.id}" style="animation-delay:${Math.min(i%PER,23)*18}ms"><img src="${av(p.name)}" alt=""><span>${esc(p.name)}</span></div>`);
            it.push(`<div class="s add" id="add"><b>+</b><span>Impor</span></div>`);
            const n=Math.ceil(it.length/PER);let h='';
            for(let i=0;i<n;i++)h+=`<div class="pc">${it.slice(i*PER,(i+1)*PER).join('')}</div>`;
            pg.innerHTML=h;
            $('#dots').innerHTML=n>1?Array.from({length:n},(_,i)=>'<i></i>').join(''):'';
            cur=Math.min(cur,n-1);pg.scrollLeft=cur*pg.clientWidth;dots();
            $('#e').hidden=P.length>0;
          }
          function dots(){const d=$('#dots').children;for(let i=0;i<d.length;i++)d[i].className=i===cur?'on':''}
          pg.addEventListener('scroll',()=>{const i=Math.round(pg.scrollLeft/(pg.clientWidth||1));if(i!==cur){cur=i;dots()}},{passive:true});
          addEventListener('resize',()=>{pg.scrollLeft=cur*pg.clientWidth});
          pg.addEventListener('click',e=>{
            const s=e.target.closest('.s');if(!s)return;
            if(s.id==='add')return Host.imp();
            openDt(s.dataset.id);
          });

          /* ---------- detail ---------- */
          const DEF={fs:false,or:'auto',res:100,ka:false,st:true,cam:true,mic:true,net:true,ex:true,mn:true,av:true};
          const TG=['ka','st','cam','mic','net','ex','mn','av'];
          let id=null,C={...DEF},openD=false;
          const ORN={auto:'Auto',land:'Landscape',port:'Portrait'},ORS=['auto','land','port'],RES=[100,75,50,35];
          const ic={
           fs:'<svg viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>',
           or:'<svg viewBox="0 0 24 24"><path d="M4 8h16v10H4zM8 4h8"/></svg>',
           rs:'<svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 12h18M12 3v18"/></svg>',
           rn:'<svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4"/></svg>',
           dl:'<svg viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg>',
           ka:'<svg viewBox="0 0 24 24"><path d="M8 8h8v8H8zM12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
           st:'<svg viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v10H3z"/></svg>',
           cam:'<svg viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 11l6-3v8l-6-3"/></svg>',
           mic:'<svg viewBox="0 0 24 24"><path d="M9 3h6v10H9zM5 11v3h14v-3M12 17v4"/></svg>',
           net:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
           ex:'<svg viewBox="0 0 24 24"><path d="M10 14l4-4M8 12l-3 3a3 3 0 0 0 4 4l3-3M16 12l3-3a3 3 0 0 0-4-4l-3 3"/></svg>',
           mn:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
           av:'<svg viewBox="0 0 24 24"><path d="M6 11h12v9H6zM8 11V7a4 4 0 0 1 8 0v4"/></svg>',
           rst:'<svg viewBox="0 0 24 24"><path d="M4 4v6h6M4 10a8 8 0 1 1 2 6"/></svg>'};
          function sz(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB'}
          function saveC(){try{Host.setCfg(id,JSON.stringify(C))}catch(e){}}
          const oo=v=>v?'ON':'OFF';
          const T=(o,lb,on,em)=>`<button class="ob${on?' on':''}" data-o="${o}">${ic[o]}${lb}<em>${em}</em></button>`;
          const SC=(t,a)=>`<div class="sc"><small>${t}</small><div class="sg">${a.join('')}</div></div>`;
          function ops(){
            $('#ops').innerHTML=
             SC('Tampilan',[T('fs','Layar penuh',C.fs,oo(C.fs)),T('or','Orientasi',C.or!=='auto',ORN[C.or]),T('rs','Resolusi',C.res!==100,C.res+'%'),T('ka','Tetap nyala',C.ka,oo(C.ka))])+
             SC('Izin',[T('st','Penyimpanan',C.st,oo(C.st)),T('cam','Kamera',C.cam,oo(C.cam)),T('mic','Mikrofon',C.mic,oo(C.mic)),T('net','Internet',C.net,oo(C.net))])+
             SC('Perilaku',[T('ex','Tautan luar',C.ex,oo(C.ex)),T('mn','Menu game',C.mn,oo(C.mn)),T('av','Auto-unlock',C.av,oo(C.av))])+
             SC('Data',[`<button class="ob rd" data-o="rst">${ic.rst}Reset data</button>`,`<button class="ob" data-o="rn">${ic.rn}Ganti nama</button>`,`<button class="ob rd" data-o="dl">${ic.dl}Hapus</button>`]);
          }
          function openDt(i){
            const p=P.find(x=>x.id===i);if(!p)return;id=i;
            let f={};try{f=JSON.parse(Host.info(i))}catch(e){}
            try{C=Object.assign({},DEF,JSON.parse(Host.cfg(i)))}catch(e){C={...DEF}}
            $('#dn').textContent=p.name;$('#dnm').textContent=p.name;$('#da').src=av(p.name);
            const t=(f.title||'').trim();$('#dtt').textContent=t&&t!==p.name?t:'';$('#dtt').hidden=!($('#dtt').textContent);
            $('#mt').innerHTML=
             `<div><small>Ukuran</small><b>${sz(f.size||0)}</b></div>`+
             `<div><small>Berkas</small><b>${f.files||0}</b></div>`+
             `<div><small>Diubah</small><b>${f.mod?new Date(f.mod).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-'}</b></div>`+
             `<div><small>index.html</small><b>${f.entry?'Ada':'Tidak ada'}</b></div>`;
            ops();$('#dt').classList.add('on');openD=true;
          }
          function closeDt(){$('#dt').classList.remove('on');openD=false;$('#go').classList.remove('on')}
          $('#bk').onclick=closeDt;
          addEventListener('foxlback',e=>{
            if($('#rd').classList.contains('on')){e.preventDefault();$('#rd').classList.remove('on')}
            else if(openD){e.preventDefault();closeDt()}
          });

          /* ---------- reset data per projek ---------- */
          const RK=[['l','Simpanan lokal','save game, skor, setelan halaman'],['i','Database (IndexedDB)','data besar / offline'],['c','Cache & service worker','aset tersimpan halaman'],['ck','Cookie',''],['cf','Pengaturan projek','layar, izin, dll kembali default']];
          let R={l:1,i:1,c:1,ck:1,cf:0};
          function rdDraw(){
            const p=P.find(x=>x.id===id);
            $('#rb').innerHTML=`<h2>Reset data</h2><p>${esc(p?p.name:'')}. File projek tidak dihapus. Tutup projek dulu kalau sedang berjalan.</p>`+
             RK.map(k=>`<button class="ck${R[k[0]]?' on':''}" data-k="${k[0]}"><i></i><span>${k[1]}${k[2]?`<small>${k[2]}</small>`:''}</span></button>`).join('')+
             `<div class="rr"><button class="bt" data-a="x">Batal</button><button class="bt rd" data-a="ok">Reset</button></div>`;
          }
          function openRd(){R={l:1,i:1,c:1,ck:1,cf:0};rdDraw();$('#rd').classList.add('on')}
          $('#rb').addEventListener('click',e=>{
            const k=e.target.closest('.ck');
            if(k){R[k.dataset.k]=R[k.dataset.k]?0:1;rdDraw();return}
            const b=e.target.closest('.bt');if(!b)return;
            $('#rd').classList.remove('on');
            if(b.dataset.a!=='ok')return;
            const m=(R.l?'l':'')+(R.i?'i':'')+(R.c?'cs':'');
            if(m||R.ck||R.cf)Host.resetData(id,m,!!R.ck,!!R.cf);
          });
          window.__rd=cf=>{if(cf&&id)openDt(id)};
          $('#ops').addEventListener('click',e=>{
            const b=e.target.closest('.ob');if(!b)return;const o=b.dataset.o;
            if(o==='fs'){C.fs=!C.fs;saveC();ops()}
            else if(o==='or'){C.or=ORS[(ORS.indexOf(C.or)+1)%3];saveC();ops()}
            else if(o==='rs'){C.res=RES[(RES.indexOf(C.res)+1)%RES.length];saveC();ops()}
            else if(TG.includes(o)){C[o]=!C[o];saveC();ops()}
            else if(o==='rst')openRd();
            else if(o==='rn'){const p=P.find(x=>x.id===id);const n=prompt('Nama baru',p.name);if(n&&n.trim()){Host.rename(id,n.trim());refresh();openDt(id)}}
            else if(o==='dl'){const p=P.find(x=>x.id===id);if(confirm('Hapus "'+p.name+'"?')){Host.drop(id);closeDt();refresh()}}
          });

          /* ---------- Play: ripple + partikel + wipe ---------- */
          const play=$('#play');
          play.addEventListener('click',e=>{
            if(!id||play.dataset.b)return;play.dataset.b=1;
            const r=play.getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;
            const d=Math.max(r.width,r.height)*2,rp=document.createElement('span');rp.className='rp';
            rp.style.cssText=`width:${d}px;height:${d}px;left:${x-r.left-d/2}px;top:${y-r.top-d/2}px`;play.appendChild(rp);setTimeout(()=>rp.remove(),650);
            const cs=getComputedStyle(document.documentElement),cols=['--ah','--y','--al','--t'].map(v=>cs.getPropertyValue(v).trim()).concat('#fff');
            for(let i=0;i<18;i++){const q=document.createElement('i');q.className='pt';q.style.cssText=`left:${x-4}px;top:${y-4}px;background:${cols[i%5]};box-shadow:2px 2px 0 #000`;document.body.appendChild(q);
              const a=Math.random()*Math.PI*2,m=60+Math.random()*110;
              q.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*m}px,${Math.sin(a)*m-30}px) scale(0)`,opacity:0}],{duration:520+Math.random()*260,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>q.remove()}
            navigator.vibrate&&navigator.vibrate(18);
