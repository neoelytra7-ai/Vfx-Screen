              // 13 ----------------------------------------------------------- Line chart
              Kind("Line chart", "Smooth or straight line chart with area fill, grid, dots and seeded data",
                  g("Data", pi("n", "Points", 10, 3, 40, "Number of samples"), pi("seed", "Seed", 3, 0, 99, "Random seed"), pb("smooth", "Smooth curve", true, "Bezier smoothing"), pb("fill", "Area fill", true, "Gradient under the line")) +
                      g("Style", pc("c1", "Line color", Color(0xFF6750A4), "Stroke color"), pc("c2", "Fill color", Color(0xFFEA4C89), "Area tint"), pd("sw", "Line width", 3f, 1f, 10f, "Stroke width"),
                          pb("grid", "Grid", true, "Horizontal grid"), pc("gc", "Grid color", Color(0x33888888), "Grid line color"), pb("dots", "Dots", true, "Sample markers"), pd("ds", "Dot size", 4f, 1f, 12f, "Marker radius"), pd("h", "Height", 130f, 70f, 260f, "Chart height"))
              ) { p ->
                  val n = p.f("n").toInt(); val r = Random(p.f("seed").toInt())
                  val pts = List(n) { 0.1f + 0.8f * r.nextFloat() }
                  Canvas(Modifier.fillMaxWidth().height(p.dp("h"))) {
                      val w = size.width; val ht = size.height
                      fun px(k: Int) = w * k / (n - 1)
                      fun py(k: Int) = ht * (1f - pts[k])
                      if (p.b("grid")) for (k in 0..4) drawLine(p.c("gc"), Offset(0f, ht * k / 4), Offset(w, ht * k / 4), strokeWidth = 1f)
                      val line = Path(); val area = Path()
                      line.moveTo(px(0), py(0)); area.moveTo(px(0), py(0))
                      for (k in 1 until n) {
                          if (p.b("smooth")) {
                              val mx = (px(k - 1) + px(k)) / 2
                              line.cubicTo(mx, py(k - 1), mx, py(k), px(k), py(k)); area.cubicTo(mx, py(k - 1), mx, py(k), px(k), py(k))
                          } else { line.lineTo(px(k), py(k)); area.lineTo(px(k), py(k)) }
                      }
                      area.lineTo(w, ht); area.lineTo(0f, ht); area.close()
                      if (p.b("fill")) drawPath(area, Brush.verticalGradient(listOf(p.c("c2").copy(alpha = 0.45f), Color.Transparent)))
                      drawPath(line, p.c("c1"), style = Stroke(width = p.dp("sw").toPx(), cap = StrokeCap.Round))
                      if (p.b("dots")) for (k in 0 until n) drawCircle(p.c("c1"), p.dp("ds").toPx(), Offset(px(k), py(k)))
                  }
              },

