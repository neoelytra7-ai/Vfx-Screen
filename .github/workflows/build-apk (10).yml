                          textAlign = r.pick(listOf(TextAlign.Start, TextAlign.Center, TextAlign.End, TextAlign.Justify)))
                  }
                  1 -> {
                      Text("QUARTERLY REPORT", fontSize = 11.sp, letterSpacing = 3.sp, color = c)
                      Text("" + r.nextInt(9999), fontSize = 56.sp, fontWeight = FontWeight.Thin, fontFamily = fam)
                  }
                  2 -> Row {
                      Text("\u201C", fontSize = 64.sp, color = c, fontFamily = FontFamily.Serif)
