          val groupedEntries: Map<String, List<ShowEntry>> by lazy { allEntries.groupBy { it.type } }
          fun groupDesc(type: String): String = famDesc[type] ?: labKinds.firstOrNull { it.type == type }?.desc ?: ""

          // ===================================================================== screens
          @Composable
          fun Home(q: String, onQ: (String) -> Unit, open: (String) -> Unit) {
              val groups = groupedEntries.filter { (k, v) -> q.isBlank() || k.contains(q, true) || groupDesc(k).contains(q, true) || v.first().tag.contains(q, true) }
              Column(Modifier.fillMaxSize()) {
                  OutlinedTextField(q, onQ, Modifier.fillMaxWidth().padding(12.dp), singleLine = true,
                      placeholder = { Text("Search ${groupedEntries.size} types / ${allEntries.size} items", fontSize = 13.sp) }, textStyle = TextStyle(fontSize = 14.sp))
                  LazyColumn(Modifier.weight(1f)) {
                      items(groups.keys.toList()) { name ->
                          val list = groups.getValue(name)
                          Column(Modifier.fillMaxWidth().clickable { open(name) }.padding(horizontal = 16.dp, vertical = 10.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(name, Modifier.weight(1f), style = MaterialTheme.typography.titleMedium)
                                  Text("${list.size} items", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)
                              }
                              Text("Type: ${list.first().tag}" + if (list.first().schema.isNotEmpty()) " \u00B7 ${list.first().schema.size} own props + ${universalDefs.size} wrapper props" else " \u00B7 ${universalDefs.size} wrapper props",
                                  fontSize = 10.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
