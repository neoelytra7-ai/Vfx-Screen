              // 23 ----------------------------------------------------------- Motion
              Kind("Motion", "Eight animation styles with duration, easing, stagger, amplitude and repeat mode",
                  g("Content", pe("anim", "Animation", "Rotate|Pulse|Bounce|Morph|Orbit|Wave|Swing|Flip", "Motion style"), pi("n", "Copies", 3, 1, 6, "Number of animated shapes"), pf("amp", "Amplitude", 1f, 0.1f, 3f, "Motion strength")) + shapeG(16f) +
                      g("Timing", pf("dur", "Duration (ms)", 1200f, 300f, 4000f, "One cycle"), pe("ease", "Easing", "Linear|FastOutSlowIn|LinearOutSlowIn|FastOutLinearIn", "Interpolator"), pe("rep", "Repeat", "Reverse|Restart", "Loop mode"), pf("stag", "Stagger (ms)", 150f, 0f, 600f, "Delay between copies")) +
                      g("Colors", pc("c1", "Color A", Color(0xFF6750A4), "First color"), pc("c2", "Color B", Color(0xFFEA4C89), "Second color")) +
                      g("Size", pd("size", "Size", 48f, 16f, 100f, "Shape edge"), pd("gap", "Gap", 20f, 0f, 60f, "Space between copies"))
              ) { p ->
                  val dur = p.f("dur").toInt()
                  val ease = when (p.e("ease")) { "FastOutSlowIn" -> FastOutSlowInEasing; "LinearOutSlowIn" -> LinearOutSlowInEasing; "FastOutLinearIn" -> FastOutLinearInEasing; else -> LinearEasing }
                  val mode = if (p.e("rep") == "Reverse") RepeatMode.Reverse else RepeatMode.Restart
                  val t = rememberInfiniteTransition(label = "mo")
                  val st = p.f("stag").toInt()
                  val xs = List(6) { k -> t.animateFloat(0f, 1f, infiniteRepeatable(tween(dur, easing = ease), mode, StartOffset(k * st)), label = "m$k") }
                  val sz = p.dp("size"); val amp = p.f("amp"); val an = p.e("anim"); val sh = shp(p)
                  Row(Modifier.fillMaxWidth().heightIn(min = sz * 2f), horizontalArrangement = Arrangement.spacedBy(p.dp("gap")), verticalAlignment = Alignment.CenterVertically) {
                      for (k in 0 until p.f("n").toInt()) {
                          val x = xs[k].value
                          val base = if (an == "Wave") Modifier.width(sz / 2).height(sz * (0.3f + 0.7f * x)) else Modifier.size(sz)
                          val m = when (an) {
                              "Rotate" -> Modifier.rotate(x * 360f * amp)
                              "Pulse" -> Modifier.scale(1f + (x - 0.5f) * amp).alpha(0.4f + 0.6f * x)
                              "Bounce" -> Modifier.offset(y = (-x * amp * 40f).dp)
                              "Swing" -> Modifier.rotate((x - 0.5f) * amp * 90f)
                              "Flip" -> Modifier.graphicsLayer(rotationY = x * 360f * amp)
                              "Orbit" -> Modifier.offset(x = (cos(x * 6.2832f) * amp * 24f).dp, y = (sin(x * 6.2832f) * amp * 24f).dp)
                              else -> Modifier
                          }
                          val col = if (an == "Morph") lerp(p.c("c1"), p.c("c2"), x) else if (k % 2 == 0) p.c("c1") else p.c("c2")
                          Box(base.then(m).background(col, if (an == "Morph") RoundedCornerShape((x * 50f).toInt()) else sh))
                      }
                  }
              },

              // 24 ----------------------------------------------------------- Pattern
              Kind("Pattern", "Seven procedural canvas patterns with spacing, thickness, colors and shape clip",
                  g("Content", pe("pat", "Pattern", "Stripes|Dots|Grid|Waves|Checker|Rings|Cross", "Procedural pattern")) + shapeG(16f) +
                      g("Colors", pc("c1", "Background", Color(0xFF1D1B20), "Base fill"), pc("c2", "Ink", Color(0xFFD0BCFF), "Pattern color")) +
                      g("Size", pd("sp", "Spacing", 18f, 4f, 60f, "Distance between marks"), pd("th", "Thickness", 6f, 1f, 20f, "Mark size"), pd("h", "Height", 120f, 60f, 260f, "Box height"))
              ) { p ->
                  Box(Modifier.fillMaxWidth().height(p.dp("h")).clip(shp(p)).background(p.c("c1"))) {
                      Canvas(Modifier.fillMaxSize()) {
                          val s = p.dp("sp").toPx(); val th = p.dp("th").toPx(); val col = p.c("c2")
                          when (p.e("pat")) {
                              "Stripes" -> { var x = -size.height; while (x < size.width) { drawLine(col, Offset(x, size.height), Offset(x + size.height, 0f), strokeWidth = th); x += s } }
                              "Dots" -> { var y = s / 2; while (y < size.height) { var x = s / 2; while (x < size.width) { drawCircle(col, th / 2, Offset(x, y)); x += s }; y += s } }
                              "Grid" -> {
                                  var x = 0f; while (x < size.width) { drawLine(col, Offset(x, 0f), Offset(x, size.height), strokeWidth = th / 4 + 1f); x += s }
                                  var y = 0f; while (y < size.height) { drawLine(col, Offset(0f, y), Offset(size.width, y), strokeWidth = th / 4 + 1f); y += s }
                              }
                              "Waves" -> { var y = s / 2; while (y < size.height) { val path = Path(); path.moveTo(0f, y); var x = 0f; while (x < size.width) { path.lineTo(x, y + sin(x / s * 3.1416f) * s * 0.25f); x += 4f }; drawPath(path, col, style = Stroke(width = th / 2 + 1f)); y += s } }
                              "Checker" -> { var yy = 0; var y = 0f; while (y < size.height) { var xx = 0; var x = 0f; while (x < size.width) { if ((xx + yy) % 2 == 0) drawRect(col, Offset(x, y), Size(s, s)); x += s; xx++ }; y += s; yy++ } }
                              "Rings" -> { var r = s; while (r < size.width) { drawCircle(col, r, Offset(size.width / 2, size.height / 2), style = Stroke(width = th / 2 + 1f)); r += s } }
                              else -> { var y = s / 2; while (y < size.height) { var x = s / 2; while (x < size.width) { drawLine(col, Offset(x - th, y), Offset(x + th, y), strokeWidth = 2f); drawLine(col, Offset(x, y - th), Offset(x, y + th), strokeWidth = 2f); x += s }; y += s } }
                          }
                      }
                  }
              },

