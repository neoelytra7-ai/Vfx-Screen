name: Build UI Showcase APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # ------------------------------------------------------------------
      # 1. Project skeleton (Gradle + manifest)
      # ------------------------------------------------------------------
      - name: Generate project skeleton
        run: |
          mkdir -p app/src/main/java/com/showcase/ui app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "UiShowcase"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g
          kotlin.daemon.jvmargs=-Xmx3g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.showcase.ui"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.showcase.ui"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi",
                      "-opt-in=androidx.compose.animation.ExperimentalAnimationApi",
                      "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi"
                  )
              }
          }
          dependencies {
              val bom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(bom)
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.animation:animation")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="UI Showcase"
                  android:theme="@style/Theme.Showcase">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Showcase" parent="@android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

      # ------------------------------------------------------------------
      # 2. App shell: activity + section registry
      # ------------------------------------------------------------------
      - name: Generate app shell
        run: |
          D=app/src/main/java/com/showcase/ui

          cat > $D/MainActivity.kt <<'EOF'
          package com.showcase.ui

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = if (isSystemInDarkTheme()) darkColorScheme() else lightColorScheme()) {
                          Surface(Modifier.fillMaxSize()) { ShowcaseApp() }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ShowcaseApp() {
              var group by remember { mutableStateOf<String?>(null) }
              var sel by remember { mutableStateOf<ShowEntry?>(null) }
              var q by remember { mutableStateOf("") }
              BackHandler(enabled = sel != null || group != null) { if (sel != null) sel = null else group = null }
              val title = sel?.title ?: group ?: "UI Showcase"
              val sub = sel?.let { "Type: ${it.type} \u00B7 ${it.tag}" }
                  ?: group?.let { "Type: ${groupedEntries[it]?.firstOrNull()?.tag ?: ""}" }
                  ?: "${allEntries.size} items \u00B7 ${groupedEntries.size} types"
              Scaffold(topBar = {
                  TopAppBar(title = { Column { Text(title, fontSize = 18.sp, maxLines = 1); Text(sub, fontSize = 11.sp) } })
              }) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      val s = sel
                      val g = group
                      when {
                          s != null -> Inspector(s)
                          g != null -> GroupScreen(g) { sel = it }
                          else -> Home(q, { q = it }) { group = it }
                      }
                  }
              }
          }
          EOF

          # Registry. To add a section: create a new file and append a line here.
          cat > $D/Registry.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.runtime.Composable

          val baseSections: List<Pair<String, @Composable () -> Unit>> = listOf(
              "Buttons" to { ButtonsSection() },
              "Text inputs" to { InputsSection() },
              "Selection controls" to { SelectionSection() },
              "Progress & loading" to { ProgressSection() },
              "Sliders" to { SlidersSection() },
              "Cards" to { CardsSection() },
              "Chips" to { ChipsSection() },
              "Dialogs & menus" to { DialogsSection() },
              "Tabs" to { TabsSection() },
              "Animations" to { AnimationsSection() },
              "Typography" to { TypographySection() },
              "Color scheme" to { ColorsSection() },
              "Shapes & elevation" to { ShapesSection() },
              "Lists" to { ListsSection() },
          )
          EOF

      # ------------------------------------------------------------------
      # 3. Showcase sections (one heredoc per file; append more freely)
      # ------------------------------------------------------------------
      - name: Generate sections A (buttons, inputs, selection, progress, sliders)
        run: |
          D=app/src/main/java/com/showcase/ui

          cat > $D/Section1.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          @Composable
          fun ButtonsSection() {
              Button(onClick = {}) { Text("Filled") }
              FilledTonalButton(onClick = {}) { Text("Tonal") }
              OutlinedButton(onClick = {}) { Text("Outlined") }
              ElevatedButton(onClick = {}) { Text("Elevated") }
              TextButton(onClick = {}) { Text("Text") }
              Button(onClick = {}, enabled = false) { Text("Disabled") }
              Button(onClick = {}) {
                  Icon(Icons.Default.Favorite, null, Modifier.size(18.dp))
                  Spacer(Modifier.width(8.dp))
                  Text("With icon")
              }
              Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                  FloatingActionButton(onClick = {}) { Icon(Icons.Default.Add, null) }
                  SmallFloatingActionButton(onClick = {}) { Icon(Icons.Default.Star, null) }
                  ExtendedFloatingActionButton(onClick = {}) {
                      Icon(Icons.Default.Search, null); Spacer(Modifier.width(6.dp)); Text("Search")
                  }
              }
              Row {
                  IconButton(onClick = {}) { Icon(Icons.Default.Home, null) }
                  FilledIconButton(onClick = {}) { Icon(Icons.Default.Settings, null) }
                  OutlinedIconButton(onClick = {}) { Icon(Icons.Default.Person, null) }
              }
          }

          @Composable
          fun InputsSection() {
              var a by remember { mutableStateOf("") }
              var b by remember { mutableStateOf("") }
              var c by remember { mutableStateOf("secret") }
              OutlinedTextField(a, { a = it }, label = { Text("Outlined") }, modifier = Modifier.fillMaxWidth())
              TextField(b, { b = it }, label = { Text("Filled") }, modifier = Modifier.fillMaxWidth())
              OutlinedTextField(
                  c, { c = it }, label = { Text("Password") },
                  visualTransformation = androidx.compose.ui.text.input.PasswordVisualTransformation(),
                  modifier = Modifier.fillMaxWidth()
              )
              OutlinedTextField(
                  "bad", {}, label = { Text("Error state") }, isError = true,
                  supportingText = { Text("Something is wrong") }, modifier = Modifier.fillMaxWidth()
              )
              OutlinedTextField(
                  a, { a = it }, label = { Text("With icons") },
                  leadingIcon = { Icon(Icons.Default.Search, null) },
                  trailingIcon = { Icon(Icons.Default.Close, null) },
                  modifier = Modifier.fillMaxWidth()
              )
          }

          @Composable
          fun SelectionSection() {
              var cb by remember { mutableStateOf(true) }
              var sw by remember { mutableStateOf(true) }
              var radio by remember { mutableStateOf(0) }
              var tri by remember { mutableStateOf(androidx.compose.ui.state.ToggleableState.Indeterminate) }
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Checkbox(cb, { cb = it }); Text("Checkbox")
              }
              Row(verticalAlignment = Alignment.CenterVertically) {
                  TriStateCheckbox(tri, onClick = {}); Text("Tri-state")
              }
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Switch(sw, { sw = it }); Spacer(Modifier.width(8.dp)); Text("Switch")
              }
              listOf("Alpha", "Beta", "Gamma").forEachIndexed { i, t ->
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      RadioButton(radio == i, { radio = i }); Text(t)
                  }
              }
              SingleChoiceSegmentedButtonRow {
                  listOf("Day", "Week", "Month").forEachIndexed { i, t ->
                      SegmentedButton(
                          selected = radio == i, onClick = { radio = i },
                          shape = SegmentedButtonDefaults.itemShape(i, 3)
                      ) { Text(t) }
                  }
              }
          }

          @Composable
          fun ProgressSection() {
              Text("Indeterminate linear"); LinearProgressIndicator(Modifier.fillMaxWidth())
              Text("Determinate linear"); LinearProgressIndicator({ 0.65f }, Modifier.fillMaxWidth())
              Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                  CircularProgressIndicator()
                  CircularProgressIndicator({ 0.4f })
                  CircularProgressIndicator({ 0.9f }, strokeWidth = 8.dp)
              }
          }

          @Composable
          fun SlidersSection() {
              var s by remember { mutableStateOf(0.3f) }
              var step by remember { mutableStateOf(2f) }
              var range by remember { mutableStateOf(0.2f..0.8f) }
              Text("Value: %.2f".format(s)); Slider(s, { s = it })
              Text("Stepped: ${step.toInt()}")
              Slider(step, { step = it }, valueRange = 0f..10f, steps = 9)
              RangeSlider(range, { range = it })
          }
          EOF

      - name: Generate sections B (cards, chips, dialogs, tabs)
        run: |
          D=app/src/main/java/com/showcase/ui

          cat > $D/Section2.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          @Composable
          fun CardsSection() {
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp)) {
                      Text("Filled card", style = MaterialTheme.typography.titleMedium)
                      Text("Default container color.")
                  }
              }
              ElevatedCard(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp)) {
                      Text("Elevated card", style = MaterialTheme.typography.titleMedium)
                      Text("Has a shadow.")
                  }
              }
              OutlinedCard(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp)) {
                      Text("Outlined card", style = MaterialTheme.typography.titleMedium)
                      Text("Has a border.")
                  }
              }
              Card(
                  onClick = {}, Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primaryContainer)
              ) {
                  Row(Modifier.padding(16.dp)) {
                      Badge { Text("3") }
                      Spacer(Modifier.width(12.dp))
                      Text("Clickable, tinted card")
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ChipsSection() {
              var sel by remember { mutableStateOf(setOf("Kotlin")) }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  AssistChip(onClick = {}, label = { Text("Assist") },
                      leadingIcon = { Icon(Icons.Default.Star, null, Modifier.size(18.dp)) })
                  SuggestionChip(onClick = {}, label = { Text("Suggestion") })
              }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  listOf("Kotlin", "Java", "Rust").forEach { t ->
                      FilterChip(
                          selected = t in sel,
                          onClick = { sel = if (t in sel) sel - t else sel + t },
                          label = { Text(t) },
                          leadingIcon = if (t in sel) {
                              { Icon(Icons.Default.Check, null, Modifier.size(18.dp)) }
                          } else null
                      )
                  }
              }
              InputChip(selected = false, onClick = {}, label = { Text("Input") },
                  trailingIcon = { Icon(Icons.Default.Close, null, Modifier.size(18.dp)) })
          }

          @Composable
          fun DialogsSection() {
              var dlg by remember { mutableStateOf(false) }
              var menu by remember { mutableStateOf(false) }
              Button(onClick = { dlg = true }) { Text("Show dialog") }
              Box {
                  OutlinedButton(onClick = { menu = true }) { Text("Show menu") }
                  DropdownMenu(menu, { menu = false }) {
                      listOf("Copy", "Paste", "Delete").forEach {
                          DropdownMenuItem(text = { Text(it) }, onClick = { menu = false })
                      }
                  }
              }
              if (dlg) AlertDialog(
                  onDismissRequest = { dlg = false },
                  title = { Text("Alert") },
                  text = { Text("This is a Material 3 alert dialog.") },
                  icon = { Icon(Icons.Default.Settings, null) },
                  confirmButton = { TextButton({ dlg = false }) { Text("OK") } },
                  dismissButton = { TextButton({ dlg = false }) { Text("Cancel") } }
              )
          }

          @Composable
          fun TabsSection() {
              var t by remember { mutableStateOf(0) }
              val names = listOf("Home", "Search", "Profile")
              TabRow(t) { names.forEachIndexed { i, n -> Tab(t == i, { t = i }, text = { Text(n) }) } }
              SecondaryTabRow(t) { names.forEachIndexed { i, n -> Tab(t == i, { t = i }, text = { Text(n) }) } }
              NavigationBar {
                  listOf(Icons.Default.Home, Icons.Default.Search, Icons.Default.Person).forEachIndexed { i, ic ->
                      NavigationBarItem(t == i, { t = i }, { Icon(ic, null) }, label = { Text(names[i]) })
                  }
              }
              Text("Selected: ${names[t]}")
          }
          EOF

      - name: Generate sections C (animations, typography, colors, shapes, lists)
        run: |
          D=app/src/main/java/com/showcase/ui

          cat > $D/Section3.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.rotate
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.RectangleShape
          import androidx.compose.ui.unit.dp

          @Composable
          fun AnimationsSection() {
              var show by remember { mutableStateOf(true) }
              var big by remember { mutableStateOf(false) }
              val size by animateDpAsState(if (big) 120.dp else 56.dp, spring(Spring.DampingRatioMediumBouncy), label = "s")
              val color by animateColorAsState(
                  if (big) MaterialTheme.colorScheme.tertiary else MaterialTheme.colorScheme.primary, label = "c")
              val inf = rememberInfiniteTransition(label = "i")
              val angle by inf.animateFloat(0f, 360f, infiniteRepeatable(tween(2000, easing = LinearEasing)), label = "a")
              val pulse by inf.animateFloat(0.8f, 1.2f, infiniteRepeatable(tween(800), RepeatMode.Reverse), label = "p")

              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  Button({ show = !show }) { Text("Toggle") }
                  Button({ big = !big }) { Text("Resize") }
              }
              AnimatedVisibility(show, enter = fadeIn() + expandVertically(), exit = fadeOut() + shrinkVertically()) {
                  Card(Modifier.fillMaxWidth()) { Text("I fade and expand", Modifier.padding(16.dp)) }
              }
              Box(Modifier.size(size).clip(RoundedCornerShape(16.dp)).background(color))
              Row(horizontalArrangement = Arrangement.spacedBy(24.dp), verticalAlignment = Alignment.CenterVertically) {
                  Box(Modifier.size(48.dp).rotate(angle).background(Color(0xFFE91E63), RoundedCornerShape(8.dp)))
                  Box(Modifier.size(48.dp).scale(pulse).background(Color(0xFF2196F3), CircleShape))
              }
              AnimatedContent(targetState = big, label = "ac") { Text(if (it) "BIG" else "small", style = MaterialTheme.typography.headlineMedium) }
          }

          @Composable
          fun TypographySection() {
              val t = MaterialTheme.typography
              listOf(
                  "Display Large" to t.displayLarge, "Display Medium" to t.displayMedium, "Display Small" to t.displaySmall,
                  "Headline Large" to t.headlineLarge, "Headline Medium" to t.headlineMedium, "Headline Small" to t.headlineSmall,
                  "Title Large" to t.titleLarge, "Title Medium" to t.titleMedium, "Title Small" to t.titleSmall,
                  "Body Large" to t.bodyLarge, "Body Medium" to t.bodyMedium, "Body Small" to t.bodySmall,
                  "Label Large" to t.labelLarge, "Label Medium" to t.labelMedium, "Label Small" to t.labelSmall,
              ).forEach { (n, s) -> Text(n, style = s) }
          }

          @Composable
          fun ColorsSection() {
              val c = MaterialTheme.colorScheme
              listOf(
                  "primary" to c.primary, "onPrimary" to c.onPrimary, "primaryContainer" to c.primaryContainer,
                  "secondary" to c.secondary, "secondaryContainer" to c.secondaryContainer,
                  "tertiary" to c.tertiary, "tertiaryContainer" to c.tertiaryContainer,
                  "error" to c.error, "errorContainer" to c.errorContainer,
                  "background" to c.background, "surface" to c.surface, "surfaceVariant" to c.surfaceVariant,
                  "outline" to c.outline, "inverseSurface" to c.inverseSurface,
              ).forEach { (n, col) ->
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(Modifier.size(40.dp).background(col, RoundedCornerShape(8.dp)))
                      Spacer(Modifier.width(12.dp)); Text(n)
                  }
              }
          }

          @Composable
          fun ShapesSection() {
              val shapes = listOf(
                  "Rect" to RectangleShape, "Rounded 8" to RoundedCornerShape(8.dp), "Rounded 24" to RoundedCornerShape(24.dp),
                  "Circle" to CircleShape, "Cut corner" to CutCornerShape(16.dp),
                  "Mixed" to RoundedCornerShape(topStart = 32.dp, bottomEnd = 32.dp),
              )
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  shapes.take(3).forEach { (_, s) -> Surface(Modifier.size(80.dp), shape = s, color = MaterialTheme.colorScheme.primary) {} }
              }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  shapes.drop(3).forEach { (_, s) -> Surface(Modifier.size(80.dp), shape = s, color = MaterialTheme.colorScheme.secondary) {} }
              }
              Text("Elevation")
              Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                  listOf(0, 2, 6, 12).forEach { e ->
                      Surface(Modifier.size(64.dp), shape = RoundedCornerShape(12.dp), shadowElevation = e.dp) {
                          Box(contentAlignment = Alignment.Center) { Text("$e") }
                      }
                  }
              }
          }

          @Composable
          fun ListsSection() {
              Column {
                  repeat(8) { i ->
                      ListItem(
                          leadingContent = { Surface(Modifier.size(40.dp), shape = CircleShape, color = MaterialTheme.colorScheme.primaryContainer) {
                              Box(contentAlignment = Alignment.Center) { Text("${i + 1}") } } },
                          headlineContent = { Text("List item ${i + 1}") },
                          supportingContent = { Text("Supporting text") },
                          trailingContent = { Text("12:0$i") },
                      )
                      HorizontalDivider()
                  }
              }
          }
          EOF

      # ------------------------------------------------------------------
      # 4. Build + upload
      # ------------------------------------------------------------------
      - name: Generate sections D (batch 2)
        run: |
          D=app/src/main/java/com/showcase/ui

          # Extra registry: append new sections here, final list = base + extra
          cat > $D/Registry2.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.runtime.Composable

          val extraSections: List<Pair<String, @Composable () -> Unit>> = listOf(
              "Snackbar" to { SnackbarSection() },
              "Date & time pickers" to { PickersSection() },
              "Bottom sheet" to { BottomSheetSection() },
              "Pager" to { PagerSection() },
              "Canvas drawing" to { CanvasSection() },
              "Drag gestures" to { GestureSection() },
              "Swipe to dismiss" to { SwipeSection() },
              "Search bar" to { SearchSection() },
              "Navigation rail & badges" to { RailSection() },
              "Layout containers" to { LayoutSection() },
          )

          val sections: List<Pair<String, @Composable () -> Unit>> = baseSections + extraSections + bulkSections
          EOF

          cat > $D/Section4.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import kotlin.math.roundToInt
          import kotlinx.coroutines.launch

          @Composable
          fun SnackbarSection() {
              val host = remember { SnackbarHostState() }
              val scope = rememberCoroutineScope()
              Button(onClick = { scope.launch { host.showSnackbar("Hello from a snackbar") } }) { Text("Short") }
              Button(onClick = {
                  scope.launch {
                      host.showSnackbar("With action", actionLabel = "UNDO", duration = SnackbarDuration.Long)
                  }
              }) { Text("With action") }
              Box(Modifier.fillMaxWidth().height(80.dp)) {
                  SnackbarHost(host, Modifier.align(Alignment.BottomCenter))
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun PickersSection() {
              val date = rememberDatePickerState()
              val time = rememberTimePickerState(10, 30, false)
              Text("Selected millis: ${date.selectedDateMillis ?: "none"}")
              DatePicker(date, showModeToggle = true)
              HorizontalDivider()
              Text("Time: %02d:%02d".format(time.hour, time.minute))
              TimePicker(time)
              TimeInput(rememberTimePickerState(8, 15, true))
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun BottomSheetSection() {
              var open by remember { mutableStateOf(false) }
              val state = rememberModalBottomSheetState()
              val scope = rememberCoroutineScope()
              Button(onClick = { open = true }) { Text("Open bottom sheet") }
              if (open) ModalBottomSheet(onDismissRequest = { open = false }, sheetState = state) {
                  Column(Modifier.padding(16.dp).padding(bottom = 32.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Text("Sheet content", style = MaterialTheme.typography.titleLarge)
                      repeat(4) { ListItem(headlineContent = { Text("Action ${it + 1}") }, leadingContent = { Icon(Icons.Default.Star, null) }) }
                      Button(onClick = { scope.launch { state.hide() }.invokeOnCompletion { open = false } }) { Text("Close") }
                  }
              }
          }

          @Composable
          fun PagerSection() {
              val pager = rememberPagerState { 5 }
              val colors = listOf(Color(0xFFEF5350), Color(0xFFAB47BC), Color(0xFF42A5F5), Color(0xFF66BB6A), Color(0xFFFFA726))
              HorizontalPager(pager, Modifier.fillMaxWidth().height(160.dp), pageSpacing = 12.dp) { p ->
                  Box(Modifier.fillMaxSize().background(colors[p], RoundedCornerShape(16.dp)), contentAlignment = Alignment.Center) {
                      Text("Page ${p + 1}", color = Color.White, style = MaterialTheme.typography.headlineMedium)
                  }
              }
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
                  repeat(5) { i ->
                      val sel = pager.currentPage == i
                      Box(Modifier.padding(4.dp).size(if (sel) 12.dp else 8.dp)
                          .background(if (sel) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.outlineVariant, CircleShape))
                  }
              }
          }

          @Composable
          fun CanvasSection() {
              val primary = MaterialTheme.colorScheme.primary
              val tertiary = MaterialTheme.colorScheme.tertiary
              Canvas(Modifier.fillMaxWidth().height(200.dp)) {
                  drawRect(Brush.horizontalGradient(listOf(primary, tertiary)), size = size.copy(height = 60f))
                  drawCircle(primary, radius = 40f, center = Offset(80f, 140f))
                  drawCircle(tertiary, radius = 40f, center = Offset(200f, 140f), style = Stroke(width = 8f))
                  drawLine(Color.Gray, Offset(300f, 100f), Offset(480f, 180f), strokeWidth = 10f, cap = StrokeCap.Round)
                  val path = Path().apply {
                      moveTo(520f, 180f); cubicTo(560f, 80f, 640f, 260f, 700f, 100f)
                  }
                  drawPath(path, primary, style = Stroke(width = 6f, cap = StrokeCap.Round))
                  drawArc(tertiary, 0f, 270f, useCenter = true, topLeft = Offset(720f, 90f), size = androidx.compose.ui.geometry.Size(100f, 100f))
              }
          }

          @Composable
          fun GestureSection() {
              var off by remember { mutableStateOf(Offset(40f, 40f)) }
              Box(Modifier.fillMaxWidth().height(220.dp).background(MaterialTheme.colorScheme.surfaceVariant, RoundedCornerShape(12.dp))) {
                  Box(
                      Modifier.offset { IntOffset(off.x.roundToInt(), off.y.roundToInt()) }
                          .size(64.dp).background(MaterialTheme.colorScheme.primary, CircleShape)
                          .pointerInput(Unit) { detectDragGestures { c, d -> c.consume(); off += d } }
                  )
              }
              Text("Drag the circle. Offset: ${off.x.roundToInt()}, ${off.y.roundToInt()}")
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SwipeSection() {
              val items = remember { mutableStateListOf("Alpha", "Beta", "Gamma", "Delta", "Epsilon") }
              Column {
                  items.toList().forEach { name ->
                      key(name) {
                          val st = rememberSwipeToDismissBoxState(confirmValueChange = {
                              if (it != SwipeToDismissBoxValue.Settled) { items.remove(name); true } else false
                          })
                          SwipeToDismissBox(st, backgroundContent = {
                              Box(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.errorContainer).padding(16.dp), contentAlignment = Alignment.CenterEnd) {
                                  Icon(Icons.Default.Close, null)
                              }
                          }) { ListItem(headlineContent = { Text(name) }, modifier = Modifier.background(MaterialTheme.colorScheme.surface)) }
                      }
                  }
              }
              if (items.isEmpty()) Text("All dismissed")
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SearchSection() {
              var q by remember { mutableStateOf("") }
              var active by remember { mutableStateOf(false) }
              val all = listOf("Apple", "Banana", "Cherry", "Date", "Elderberry", "Fig", "Grape")
              SearchBar(
                  query = q, onQueryChange = { q = it }, onSearch = { active = false },
                  active = active, onActiveChange = { active = it },
                  placeholder = { Text("Search fruit") },
                  leadingIcon = { Icon(Icons.Default.Search, null) },
                  modifier = Modifier.fillMaxWidth().height(if (active) 320.dp else 56.dp)
              ) {
                  LazyColumn { items(all.filter { it.contains(q, true) }) { ListItem(headlineContent = { Text(it) }) } }
              }
          }

          @Composable
          fun RailSection() {
              var sel by remember { mutableStateOf(0) }
              Row(Modifier.height(240.dp)) {
                  NavigationRail {
                      listOf(Icons.Default.Home to "Home", Icons.Default.Favorite to "Likes", Icons.Default.Settings to "Prefs").forEachIndexed { i, (ic, n) ->
                          NavigationRailItem(sel == i, { sel = i }, icon = {
                              if (i == 1) BadgedBox(badge = { Badge { Text("9") } }) { Icon(ic, null) } else Icon(ic, null)
                          }, label = { Text(n) })
                      }
                  }
                  Box(Modifier.weight(1f).fillMaxHeight(), contentAlignment = Alignment.Center) { Text("Page $sel") }
              }
              Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                  BadgedBox(badge = { Badge() }) { Icon(Icons.Default.Person, null) }
                  BadgedBox(badge = { Badge { Text("12") } }) { Icon(Icons.Default.Home, null) }
                  BadgedBox(badge = { Badge { Text("99+") } }) { Icon(Icons.Default.Star, null) }
              }
          }

          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          fun LayoutSection() {
              Text("Row weights")
              Row(Modifier.fillMaxWidth().height(48.dp)) {
                  Box(Modifier.weight(1f).fillMaxHeight().background(Color(0xFF42A5F5)))
                  Box(Modifier.weight(2f).fillMaxHeight().background(Color(0xFF66BB6A)))
                  Box(Modifier.weight(3f).fillMaxHeight().background(Color(0xFFFFA726)))
              }
              Text("FlowRow")
              FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                  listOf("one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten").forEach {
                      AssistChip(onClick = {}, label = { Text(it) })
                  }
              }
              Text("Box overlay")
              Box(Modifier.size(120.dp).background(MaterialTheme.colorScheme.primaryContainer, RoundedCornerShape(12.dp))) {
                  Box(Modifier.align(Alignment.TopStart).size(24.dp).background(Color.Red, CircleShape))
                  Box(Modifier.align(Alignment.Center).size(40.dp).background(Color.Blue, CircleShape))
                  Box(Modifier.align(Alignment.BottomEnd).size(24.dp).background(Color.Green, CircleShape))
              }
              Text("Horizontal scroll")
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  repeat(15) { Surface(Modifier.size(72.dp), shape = RoundedCornerShape(8.dp), color = MaterialTheme.colorScheme.secondaryContainer) {
                      Box(contentAlignment = Alignment.Center) { Text("$it") } } }
              }
              Text("Divider variants")
              HorizontalDivider(thickness = 4.dp, color = MaterialTheme.colorScheme.primary)
              HorizontalDivider()
              Row(Modifier.height(32.dp)) { Text("Left"); VerticalDivider(Modifier.padding(horizontal = 8.dp)); Text("Right") }
          }
          EOF

      # ------------------------------------------------------------------
      # 4. Bulk showcase variants (9 families x 99, parameterized)
      # ------------------------------------------------------------------
      - name: Generate bulk showcase
        run: |
          D=app/src/main/java/com/showcase/ui
          cat > $D/Bulk.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.animateColor
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.shape.*
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.*
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.state.ToggleableState
          import androidx.compose.ui.text.*
          import androidx.compose.ui.text.font.*
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.input.VisualTransformation
          import androidx.compose.ui.text.style.*
          import androidx.compose.ui.unit.*
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.random.Random

          // 17 families. Every item is a different layout (no repeats); colors, shapes, sizes and text are seeded-random per item.

          private fun rnd(i: Int, salt: Int) = Random(i * 7919 + salt * 104729)
          private fun Random.hue() = nextInt(360).toFloat()
          private fun <T> Random.pick(l: List<T>): T = l[nextInt(l.size)]
          private fun hc(h: Float, s: Float = 0.65f, l: Float = 0.5f) = Color.hsl(((h % 360f) + 360f) % 360f, s, l)
          private fun ink(c: Color) = if (c.luminance() > 0.5f) Color.Black else Color.White
          private fun hex(c: Color) = String.format("#%06X", c.toArgb() and 0xFFFFFF)

          private fun Random.shape(): Shape {
              val r = (4 + nextInt(8) * 4).dp
              return when (nextInt(6)) {
                  0 -> CutCornerShape(r)
                  1 -> RoundedCornerShape(topStart = r, bottomEnd = r)
                  2 -> RoundedCornerShape(topEnd = r, bottomStart = r)
                  3 -> AbsoluteCutCornerShape(topLeft = r, bottomRight = r)
                  4 -> RoundedCornerShape(r)
                  else -> CircleShape
              }
          }

          private val bodyText = "The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs."

          // ---------------------------------------------------------------- Palette
          @Composable
          fun Palette(i: Int) {
              val r = rnd(i, 1)
              val h = r.hue()
              val sat = 0.4f + r.nextFloat() * 0.5f
              val sh = r.shape()
              when (i % 8) {
                  0 -> Row(Modifier.fillMaxWidth()) {
                      for (k in 0 until 10) Box(Modifier.weight(1f).height(56.dp).background(hc(h, sat, 0.1f + 0.08f * k)))
                  }
                  1 -> {
                      val cols = List(20) { hc(h + it * 18f, sat, 0.35f + (it % 5) * 0.1f) }
                      for (row in 0 until 4) Row(Modifier.fillMaxWidth()) {
                          for (c in 0 until 5) {
                              val col = cols[row * 5 + c]
                              Box(Modifier.weight(1f).height(44.dp).background(col), contentAlignment = Alignment.Center) {
                                  Text(hex(col), fontSize = 9.sp, color = ink(col))
                              }
                          }
                      }
                  }
                  2 -> {
                      val a = hc(h, sat)
                      val b = hc(h + 180f, sat)
                      Row(Modifier.fillMaxWidth().height(110.dp).clip(sh)) {
                          Box(Modifier.weight(1f).fillMaxHeight().background(a).padding(12.dp)) { Text("Base\n" + hex(a), color = ink(a)) }
                          Box(Modifier.weight(1f).fillMaxHeight().background(b).padding(12.dp)) { Text("Contrast\n" + hex(b), color = ink(b)) }
                      }
                  }
                  3 -> Row(Modifier.padding(start = 12.dp)) {
                      for (k in 0 until 6) Box(
                          Modifier.offset(x = (-12 * k).dp).size(64.dp).clip(CircleShape)
                              .background(hc(h + k * 30f, sat))
                              .border(2.dp, MaterialTheme.colorScheme.surface, CircleShape)
                      )
                  }
                  4 -> {
                      Box(Modifier.fillMaxWidth().height(40.dp).clip(sh).background(Brush.horizontalGradient(List(6) { hc(h + it * 25f, sat) })))
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          for (k in 0 until 3) {
                              val c = hc(h + k * 40f, sat)
                              AssistChip(onClick = {}, label = { Text(hex(c)) },
                                  colors = AssistChipDefaults.assistChipColors(containerColor = c, labelColor = ink(c)))
                          }
                      }
                  }
                  5 -> Row(Modifier.fillMaxWidth().height(110.dp), verticalAlignment = Alignment.Bottom, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                      for (k in 0 until 12) Box(Modifier.weight(1f).fillMaxHeight(0.2f + 0.8f * r.nextFloat()).background(hc(h + k * 8f, sat)))
                  }
                  6 -> {
                      val cols = listOf(hc(h, sat), hc(h + 120f, sat), hc(h + 240f, sat))
                      Canvas(Modifier.size(120.dp)) {
                          cols.forEachIndexed { k, c ->
                              drawArc(c, startAngle = k * 120f, sweepAngle = 116f, useCenter = false, style = Stroke(width = 28.dp.toPx()))
                          }
                      }
                  }
                  else -> {
                      var sel by remember { mutableStateOf(0) }
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          for (k in 0 until 3) {
                              val c = hc(h + k * 50f, sat)
                              FilterChip(selected = sel == k, onClick = { sel = k }, label = { Text(hex(c)) },
                                  colors = FilterChipDefaults.filterChipColors(selectedContainerColor = c, selectedLabelColor = ink(c)))
                          }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- Buttons
          @Composable
          fun BtnMatrix(i: Int) {
              val r = rnd(i, 2)
              val h = r.hue()
              val c = hc(h)
              val sh = r.shape()
              val colors = ButtonDefaults.buttonColors(containerColor = c, contentColor = ink(c))
              when (i % 8) {
                  0 -> {
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = {}, shape = sh, colors = colors, elevation = ButtonDefaults.buttonElevation(defaultElevation = r.nextInt(10).dp)) { Text("Filled") }
                          OutlinedButton(onClick = {}, shape = sh, border = BorderStroke((1 + r.nextInt(4)).dp, c)) { Text("Outline", color = c) }
                          TextButton(onClick = {}, shape = sh) { Text("Text", color = c) }
                      }
                      Button(onClick = {}, shape = sh, enabled = false) { Text("Disabled") }
                  }
                  1 -> for (k in 0 until 2) {
                      Box(
                          Modifier.fillMaxWidth().height(48.dp).clip(sh)
                              .background(Brush.horizontalGradient(listOf(hc(h + k * 80f), hc(h + 60f + k * 80f))))
                              .clickable { },
                          contentAlignment = Alignment.Center
                      ) { Text("Gradient action ${k + 1}", color = Color.White, fontWeight = FontWeight.Bold) }
                  }
                  2 -> {
                      var sel by remember { mutableStateOf(0) }
                      Row(Modifier.clip(sh).border(1.dp, c, sh)) {
                          listOf("Day", "Week", "Month", "Year").forEachIndexed { k, l ->
                              Box(
                                  Modifier.weight(1f).background(if (sel == k) c else Color.Transparent)
                                      .clickable { sel = k }.padding(vertical = 10.dp),
                                  contentAlignment = Alignment.Center
                              ) { Text(l, color = if (sel == k) ink(c) else c) }
                          }
                      }
                  }
                  3 -> Row(horizontalArrangement = Arrangement.spacedBy(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      FloatingActionButton(onClick = {}, containerColor = c, contentColor = ink(c)) { Text("+", fontSize = 24.sp) }
                      SmallFloatingActionButton(onClick = {}, containerColor = hc(h + 120f)) { Text("\u2665", color = Color.White) }
                      ExtendedFloatingActionButton(onClick = {}, containerColor = hc(h + 240f), contentColor = Color.White) { Text("Compose") }
                  }
                  4 -> {
                      val ic = IconButtonDefaults.filledIconButtonColors(containerColor = c, contentColor = ink(c))
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.CenterVertically) {
                          FilledIconButton(onClick = {}, colors = ic) { Text("\u2605") }
                          FilledTonalIconButton(onClick = {}) { Text("\u2665") }
                          OutlinedIconButton(onClick = {}) { Text("\u2713") }
                          IconButton(onClick = {}) { Text("\u2699", fontSize = 22.sp) }
                      }
                  }
                  5 -> {
                      var n by remember { mutableStateOf(0) }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = { n++ }, shape = sh, colors = colors) { Text("Tapped $n times") }
                          OutlinedButton(onClick = { n = 0 }, shape = sh) { Text("Reset") }
                      }
                  }
                  6 -> Row(horizontalArrangement = Arrangement.spacedBy(20.dp), verticalAlignment = Alignment.CenterVertically) {
                      BadgedBox(badge = { Badge { Text("${i % 9 + 1}") } }) {
                          Button(onClick = {}, shape = sh, colors = colors) { Text("Inbox") }
                      }
                      ElevatedButton(onClick = {}, shape = sh) { Text("Elevated") }
                  }
                  else -> FlowRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      ElevatedButton(onClick = {}, shape = sh) { Text("Elevated") }
                      FilledTonalButton(onClick = {}, shape = sh) { Text("Tonal") }
                      OutlinedButton(onClick = {}, shape = sh, border = BorderStroke(2.dp, Brush.horizontalGradient(listOf(c, hc(h + 90f))))) { Text("Gradient border") }
                  }
              }
          }

          // ---------------------------------------------------------------- Cards
          @Composable
          fun GradCard(i: Int) {
              val r = rnd(i, 3)
              val h = r.hue()
              val c1 = hc(h)
              val c2 = hc(h + 70f + r.nextInt(100))
              val sh = r.shape()
              val names = listOf("Ava Moreno", "Kenji Sato", "Lina Okafor", "Mateo Rossi", "Zoe Lindqvist", "Omar Haddad")
              when (i % 8) {
                  0 -> Card(Modifier.fillMaxWidth(), shape = sh, elevation = CardDefaults.cardElevation((1 + r.nextInt(8)).dp)) {
                      Box(Modifier.background(if (r.nextBoolean()) Brush.verticalGradient(listOf(c1, c2)) else Brush.horizontalGradient(listOf(c1, c2))).padding(20.dp)) {
                          Column {
                              Text("Gradient card $i", color = Color.White, style = MaterialTheme.typography.titleLarge)
                              Text("Hue ${h.toInt()}", color = Color.White.copy(alpha = 0.85f))
                          }
                      }
                  }
                  1 -> Card(Modifier.fillMaxWidth(), shape = CutCornerShape(18.dp)) {
                      Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Text("ADMIT ONE", fontSize = 11.sp, letterSpacing = 2.sp, color = c1)
                              Text("Gate ${i % 20 + 1}", style = MaterialTheme.typography.headlineSmall)
                          }
                          Canvas(Modifier.width(2.dp).height(60.dp)) {
                              drawLine(c1, Offset(0f, 0f), Offset(0f, size.height), strokeWidth = 3f,
                                  pathEffect = PathEffect.dashPathEffect(floatArrayOf(10f, 10f)))
                          }
                          Text("No. ${1000 + i}", Modifier.padding(start = 16.dp), fontWeight = FontWeight.Bold)
                      }
                  }
                  2 -> Card(Modifier.fillMaxWidth()) {
                      var f by remember { mutableStateOf(false) }
                      val name = names[i % names.size]
                      Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                          Box(Modifier.size(52.dp).clip(CircleShape).background(Brush.linearGradient(listOf(c1, c2))), contentAlignment = Alignment.Center) {
                              Text(name.take(1) + name.substringAfter(' ').take(1), color = Color.White, fontWeight = FontWeight.Bold)
                          }
                          Column(Modifier.weight(1f).padding(start = 12.dp)) {
                              Text(name, fontWeight = FontWeight.SemiBold)
                              Text("@" + name.lowercase().replace(' ', '_'), fontSize = 11.sp)
                          }
                          if (f) OutlinedButton(onClick = { f = false }) { Text("Following") }
                          else Button(onClick = { f = true }, colors = ButtonDefaults.buttonColors(containerColor = c1, contentColor = ink(c1))) { Text("Follow") }
                      }
                  }
                  3 -> {
                      val pts = List(12) { r.nextFloat() }
                      Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = hc(h, 0.5f, 0.15f))) {
                          Column(Modifier.padding(16.dp)) {
                              Text("REVENUE", fontSize = 11.sp, color = hc(h, 0.6f, 0.7f), letterSpacing = 2.sp)
                              Text("\$" + (100 + r.nextInt(900)) + "K", fontSize = 34.sp, color = Color.White, fontWeight = FontWeight.Bold)
                              Canvas(Modifier.fillMaxWidth().height(48.dp)) {
                                  val p = Path()
                                  pts.forEachIndexed { k, v ->
                                      val x = size.width * k / (pts.size - 1)
                                      val y = size.height * (1f - v)
                                      if (k == 0) p.moveTo(x, y) else p.lineTo(x, y)
                                  }
                                  drawPath(p, c1, style = Stroke(width = 3.dp.toPx()))
                              }
                          }
                      }
                  }
                  4 -> Box(Modifier.fillMaxWidth().height(150.dp).clip(sh).background(Brush.radialGradient(listOf(c1, c2)))) {
                      Column(Modifier.align(Alignment.BottomStart).padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text("Big headline $i", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)
                          Button(onClick = {}, colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = c2)) { Text("Get started") }
                      }
                  }
                  5 -> Card(Modifier.fillMaxWidth(), border = BorderStroke(2.dp, c1)) {
                      Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Text(r.pick(listOf("PRO", "TEAM", "STARTER", "MAX")), color = c1, fontWeight = FontWeight.Bold)
                          Text("\$" + (5 + i % 20) + "/mo", fontSize = 30.sp)
                          listOf("Unlimited screens", "Dark mode", "Priority support").forEach { Text("\u2713 $it", fontSize = 13.sp) }
                          Button(onClick = {}, Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = c1, contentColor = ink(c1))) { Text("Choose") }
                      }
                  }
                  6 -> Card(Modifier.fillMaxWidth()) {
                      Row(Modifier.height(IntrinsicSize.Min)) {
                          Box(Modifier.width(6.dp).fillMaxHeight().background(c1))
                          Column(Modifier.padding(12.dp)) {
                              Text("Update available", fontWeight = FontWeight.Bold)
                              Text("Version 2.$i is ready to install", fontSize = 12.sp)
                          }
                      }
                  }
                  else -> Box(Modifier.fillMaxWidth().height(130.dp).clip(sh).background(Brush.linearGradient(listOf(c1, c2, hc(h + 200f))))) {
                      Box(
                          Modifier.align(Alignment.Center).fillMaxWidth(0.8f).clip(RoundedCornerShape(16.dp))
                              .background(Color.White.copy(alpha = 0.25f))
                              .border(1.dp, Color.White.copy(alpha = 0.5f), RoundedCornerShape(16.dp)).padding(16.dp)
                      ) { Text("Glass panel $i", color = Color.White) }
                  }
              }
          }

          // ---------------------------------------------------------------- Gradients
          @Composable
          fun Gradient(i: Int) {
              val r = rnd(i, 4)
              val h = r.hue()
              val c1 = hc(h)
              val c2 = hc(h + 60f + r.nextInt(120))
              val c3 = hc(h + 200f + r.nextInt(100))
              val sh = r.shape()
              val full = Modifier.fillMaxWidth().height(52.dp)
              when (i % 8) {
                  0 -> {
                      val a = listOf(c1, c2, c3)
                      Box(full.background(Brush.horizontalGradient(a), sh))
                      Box(full.background(Brush.verticalGradient(a), sh))
                      Box(full.background(Brush.radialGradient(a), sh))
                      Box(full.background(Brush.sweepGradient(a + c1), sh))
                      Box(full.background(Brush.linearGradient(a, start = Offset(0f, 0f), end = Offset(400f, 200f)), sh))
                  }
                  1 -> Box(Modifier.size(140.dp).clip(CircleShape).background(Brush.radialGradient(listOf(c1, c2, c3))))
                  2 -> Canvas(Modifier.size(140.dp)) {
                      drawCircle(Brush.sweepGradient(listOf(c1, c2, c3, c1)), style = Stroke(width = 24.dp.toPx()))
                  }
                  3 -> Canvas(Modifier.fillMaxWidth().height(100.dp)) {
                      val step = (10 + r.nextInt(20)).dp.toPx()
                      var x = -size.height
                      var k = 0
                      while (x < size.width) {
                          drawLine(if (k % 2 == 0) c1 else c2, Offset(x, size.height), Offset(x + size.height, 0f), strokeWidth = step / 2)
                          x += step
                          k++
                      }
                  }
                  4 -> {
                      val centers = List(4) { Offset(r.nextFloat(), r.nextFloat()) }
                      Box(Modifier.fillMaxWidth().height(130.dp).clip(sh).background(Color(0xFF111111))) {
                          Canvas(Modifier.fillMaxSize()) {
                              centers.forEachIndexed { k, o ->
                                  val ctr = Offset(size.width * o.x, size.height * o.y)
                                  val rad = size.width * 0.4f
                                  drawCircle(
                                      Brush.radialGradient(listOf(hc(h + k * 80f).copy(alpha = 0.9f), Color.Transparent), center = ctr, radius = rad),
                                      radius = rad, center = ctr
                                  )
                              }
                          }
                      }
                  }
                  5 -> Text("Gradient text $i", style = TextStyle(brush = Brush.horizontalGradient(listOf(c1, c2, c3)), fontSize = 34.sp, fontWeight = FontWeight.Bold))
                  6 -> Box(
                      Modifier.fillMaxWidth().height(80.dp).border(4.dp, Brush.sweepGradient(listOf(c1, c2, c3, c1)), sh).padding(16.dp),
                      contentAlignment = Alignment.Center
                  ) { Text("Gradient border $i") }
                  else -> Box(
                      Modifier.fillMaxWidth().height(80.dp).clip(sh).background(
                          Brush.horizontalGradient(0f to c1, 0.33f to c1, 0.33f to c2, 0.66f to c2, 0.66f to c3, 1f to c3)
                      )
                  )
              }
          }

          // ---------------------------------------------------------------- Typography
