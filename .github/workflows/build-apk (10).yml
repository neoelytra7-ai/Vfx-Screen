              LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  item {
                      Text("Type: ${list.firstOrNull()?.tag ?: ""} \u00B7 ${list.size} items", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)
                      Text(groupDesc(name), fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
                  items(list, key = { it.id }) { e ->
                      Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Row(Modifier.fillMaxWidth().clickable { edit(e) }, verticalAlignment = Alignment.CenterVertically) {
                              Column(Modifier.weight(1f)) {
                                  Text(e.title, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                                  Text("Type: ${e.type} \u00B7 ${e.tag}", fontSize = 10.sp, color = MaterialTheme.colorScheme.primary)
                                  Text(e.desc, fontSize = 10.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              Text("\u2699 Customize", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)
                          }
                          Wrapped(e.uprops) { e.render(e.props) }
                          HorizontalDivider()
                      }
