                      pf("asp", "Aspect ratio", 1f, 0.5f, 2f, "Tile width / height (Grid)"), pi("seed", "Seed", 5, 0, 99, "Stagger heights seed"), pb("num", "Numbered", true, "Number each tile")) + shapeG(12f) +
