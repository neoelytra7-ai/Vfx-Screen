                          if (p.b("num")) Text(if (k < cur) "✓" else "${k + 1}", color = lnk(if (k <= cur) p.c("dc") else p.c("tc")), fontSize = (p.f("dot") * 0.4f).sp)
                      }
                  }
                  if (p.e("dir") == "Horizontal") Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      for (k in 0 until n) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) { dot(k); if (p.b("labels")) Text("${p.s("lbl")} ${k + 1}", fontSize = 9.sp) }
                          if (k < n - 1) Box(Modifier.weight(1f).height(p.dp("lw")).background(if (k < cur) p.c("dc") else p.c("tc")))
                      }
                  } else Column {
                      for (k in 0 until n) Row(Modifier.height(IntrinsicSize.Min)) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) { dot(k); if (k < n - 1) Box(Modifier.width(p.dp("lw")).weight(1f).background(if (k < cur) p.c("dc") else p.c("tc"))) }
                          Column(Modifier.padding(start = 12.dp, bottom = 18.dp)) { Text("${p.s("lbl")} ${k + 1}", fontWeight = FontWeight.Bold, fontSize = 13.sp); Text("Details for this step", fontSize = 11.sp) }
