                      "Pill" -> Row(Modifier.fillMaxWidth().clip(sh).background(p.c("cc")).padding(4.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) { labels.forEachIndexed { k, l -> tab(k, l, Modifier.weight(1f)) } }
