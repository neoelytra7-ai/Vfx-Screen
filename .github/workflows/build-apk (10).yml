          // ---------------------------------------------------------------- Animation
          @Composable
          fun Anim(i: Int) {
              val r = rnd(i, 6)
              val h = r.hue()
              val c1 = hc(h)
              val c2 = hc(h + 150f)
              val dur = 600 + r.nextInt(1800)
              val ease = r.pick(listOf(LinearEasing, LinearOutSlowInEasing, FastOutLinearInEasing, FastOutSlowInEasing))
              val sh = r.shape()
              val t = rememberInfiniteTransition(label = "t$i")
              when (i % 8) {
                  0 -> {
                      val a by t.animateFloat(0f, 360f, infiniteRepeatable(tween(dur, easing = LinearEasing), RepeatMode.Restart), label = "a")
                      Box(Modifier.size(64.dp).rotate(a).background(c1, sh))
                  }
                  1 -> {
                      val s by t.animateFloat(0.6f, 1.2f, infiniteRepeatable(tween(dur, easing = ease), RepeatMode.Reverse), label = "s")
                      val al by t.animateFloat(0.3f, 1f, infiniteRepeatable(tween(dur, easing = ease), RepeatMode.Reverse), label = "al")
                      Box(Modifier.size(72.dp).scale(s).alpha(al).background(c1, CircleShape))
                  }
                  2 -> {
                      val ys = List(3) { k ->
                          t.animateFloat(0f, 24f, infiniteRepeatable(tween(dur / 2, easing = ease), RepeatMode.Reverse, StartOffset(k * dur / 6)), label = "y$k")
                      }
                      Row(Modifier.height(48.dp), horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.Bottom) {
                          for (k in 0 until 3) Box(Modifier.offset(y = (-ys[k].value).dp).size(16.dp).background(hc(h + k * 40f), CircleShape))
                      }
                  }
                  3 -> {
                      val x by t.animateFloat(0f, 1f, infiniteRepeatable(tween(dur, easing = LinearEasing), RepeatMode.Restart), label = "x")
                      Box(
                          Modifier.fillMaxWidth().height(20.dp).clip(RoundedCornerShape(10.dp)).background(
                              Brush.horizontalGradient(listOf(c1.copy(alpha = 0.15f), c1, c1.copy(alpha = 0.15f)), startX = x * 800f - 300f, endX = x * 800f + 300f)
                          )
                      )
                  }
                  4 -> {
                      val sweep by t.animateFloat(30f, 300f, infiniteRepeatable(tween(dur, easing = ease), RepeatMode.Reverse), label = "sw")
                      val rot by t.animateFloat(0f, 360f, infiniteRepeatable(tween(dur * 2, easing = LinearEasing), RepeatMode.Restart), label = "rot")
                      Canvas(Modifier.size(80.dp).rotate(rot)) {
                          drawArc(c1, 0f, sweep, false, style = Stroke(width = 8.dp.toPx(), cap = StrokeCap.Round))
                      }
                  }
                  5 -> {
                      val hs = List(5) { k ->
                          t.animateFloat(0.2f, 1f, infiniteRepeatable(tween(dur / 2, easing = ease), RepeatMode.Reverse, StartOffset(k * dur / 8)), label = "b$k")
                      }
                      Row(Modifier.height(60.dp), horizontalArrangement = Arrangement.spacedBy(6.dp), verticalAlignment = Alignment.Bottom) {
                          for (k in 0 until 5) Box(Modifier.width(10.dp).fillMaxHeight(hs[k].value).background(hc(h + k * 25f), RoundedCornerShape(5.dp)))
                      }
                  }
                  6 -> {
                      val pct by t.animateFloat(0f, 50f, infiniteRepeatable(tween(dur, easing = ease), RepeatMode.Reverse), label = "p")
                      val col by t.animateColor(c1, c2, infiniteRepeatable(tween(dur), RepeatMode.Reverse), label = "c")
                      Box(Modifier.size(80.dp).background(col, RoundedCornerShape(pct.toInt())))
                  }
                  else -> {
                      val ang by t.animateFloat(0f, 360f, infiniteRepeatable(tween(dur * 2, easing = LinearEasing), RepeatMode.Restart), label = "o")
                      val rad = ang * 0.017453292f
                      Box(Modifier.size(120.dp), contentAlignment = Alignment.Center) {
                          Box(Modifier.size(24.dp).background(c2, CircleShape))
                          Box(Modifier.size(14.dp).offset(x = (50f * cos(rad)).dp, y = (50f * sin(rad)).dp).background(c1, CircleShape))
                      }
                  }
              }
              Text("Duration $dur ms", fontSize = 11.sp)
          }

          // ---------------------------------------------------------------- Shape lab
          @Composable
          fun ShapeLab(i: Int) {
              val r = rnd(i, 7)
              val h = r.hue()
              val c1 = hc(h)
              val c2 = hc(h + 90f)
              val c3 = hc(h + 200f)
              val sh = r.shape()
              when (i % 8) {
                  0 -> Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Surface(Modifier.size(72.dp), shape = sh, color = c1, shadowElevation = r.nextInt(10).dp) {}
                      Surface(Modifier.size(72.dp), shape = r.shape(), color = c2, border = BorderStroke(2.dp, c1)) {}
                      Surface(Modifier.size(72.dp), shape = r.shape(), color = c3, tonalElevation = r.nextInt(10).dp) {}
                      Surface(Modifier.size(72.dp), shape = r.shape(), color = Color.Transparent, border = BorderStroke(2.dp, c2)) {}
                  }
                  1 -> {
                      val n = 3 + i % 7
                      Canvas(Modifier.size(110.dp)) {
                          val p = Path()
                          for (k in 0 until n) {
                              val a = (2.0 * PI * k / n - PI / 2).toFloat()
                              val x = size.width / 2 + size.width / 2 * cos(a)
                              val y = size.height / 2 + size.height / 2 * sin(a)
                              if (k == 0) p.moveTo(x, y) else p.lineTo(x, y)
                          }
                          p.close()
                          drawPath(p, Brush.linearGradient(listOf(c1, c2)))
                      }
                  }
                  2 -> {
                      val pts = 5 + i % 5
                      Canvas(Modifier.size(110.dp)) {
                          val p = Path()
                          for (k in 0 until pts * 2) {
                              val rad = if (k % 2 == 0) size.width / 2 else size.width / 4
                              val a = (PI * k / pts - PI / 2).toFloat()
                              val x = size.width / 2 + rad * cos(a)
                              val y = size.height / 2 + rad * sin(a)
                              if (k == 0) p.moveTo(x, y) else p.lineTo(x, y)
                          }
                          p.close()
                          drawPath(p, c1)
                      }
                  }
                  3 -> Box(Modifier.size(120.dp)) {
                      Box(Modifier.size(80.dp).background(c1.copy(alpha = 0.8f), CircleShape))
                      Box(Modifier.size(70.dp).offset(40.dp, 20.dp).background(c2.copy(alpha = 0.8f), CircleShape))
                      Box(Modifier.size(60.dp).offset(10.dp, 50.dp).background(c3.copy(alpha = 0.8f), CircleShape))
                  }
                  4 -> Box(Modifier.size(120.dp), contentAlignment = Alignment.Center) {
                      for (k in 0 until 5) Box(Modifier.size((110 - k * 18).dp).rotate(k * (10f + i % 20)).background(hc(h + k * 30f).copy(alpha = 0.7f), sh))
                  }
                  5 -> {
                      val tri = GenericShape { s, _ -> moveTo(s.width / 2, 0f); lineTo(s.width, s.height); lineTo(0f, s.height); close() }
                      val dia = GenericShape { s, _ -> moveTo(s.width / 2, 0f); lineTo(s.width, s.height / 2); lineTo(s.width / 2, s.height); lineTo(0f, s.height / 2); close() }
                      val hex = GenericShape { s, _ ->
                          moveTo(s.width * 0.25f, 0f); lineTo(s.width * 0.75f, 0f); lineTo(s.width, s.height / 2)
                          lineTo(s.width * 0.75f, s.height); lineTo(s.width * 0.25f, s.height); lineTo(0f, s.height / 2); close()
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Box(Modifier.size(80.dp).clip(tri).background(c1))
                          Box(Modifier.size(80.dp).clip(dia).background(c2))
                          Box(Modifier.size(80.dp).clip(hex).background(c3))
                      }
                  }
                  6 -> Box(Modifier.size(120.dp), contentAlignment = Alignment.Center) {
                      for (k in 0 until 5) Box(Modifier.size((120 - k * 22).dp).border((2 + k % 3).dp, hc(h + k * 40f), CircleShape))
                  }
                  else -> FlowRow(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      for (k in 0 until 6) {
                          val c = hc(h + k * 55f)
                          Box(Modifier.size(width = 70.dp, height = 36.dp).background(c, r.shape()), contentAlignment = Alignment.Center) {
                              Text("B$k", color = ink(c), fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- Controls
          @Composable
          fun Ctl(i: Int) {
              val r = rnd(i, 8)
              val h = r.hue()
              val c = hc(h)
              val sh = r.shape()
              when (i % 8) {
                  0 -> {
                      var s by remember { mutableStateOf(0.2f + 0.1f * r.nextInt(8)) }
                      var on by remember { mutableStateOf(r.nextBoolean()) }
                      Slider(s, { s = it }, colors = SliderDefaults.colors(thumbColor = c, activeTrackColor = c, inactiveTrackColor = c.copy(alpha = 0.25f)))
                      LinearProgressIndicator({ s }, Modifier.fillMaxWidth().height((4 + r.nextInt(8)).dp), color = c, trackColor = c.copy(alpha = 0.2f))
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                          CircularProgressIndicator({ s }, color = c, strokeWidth = (2 + r.nextInt(6)).dp)
                          Switch(on, { on = it }, colors = SwitchDefaults.colors(checkedThumbColor = Color.White, checkedTrackColor = c))
                          Checkbox(on, { on = it }, colors = CheckboxDefaults.colors(checkedColor = c))
                          RadioButton(on, { on = !on }, colors = RadioButtonDefaults.colors(selectedColor = c))
                      }
                  }
                  1 -> {
                      var range by remember { mutableStateOf(0.2f..0.7f) }
                      RangeSlider(value = range, onValueChange = { range = it },
                          colors = SliderDefaults.colors(thumbColor = c, activeTrackColor = c))
                      Text("${(range.start * 100).toInt()} \u2013 ${(range.endInclusive * 100).toInt()}", fontSize = 11.sp)
                  }
                  2 -> {
                      var sel by remember { mutableStateOf(1) }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("S", "M", "L", "XL").forEachIndexed { k, l ->
                              FilterChip(selected = sel == k, onClick = { sel = k }, label = { Text(l) }, shape = sh,
                                  colors = FilterChipDefaults.filterChipColors(selectedContainerColor = c, selectedLabelColor = ink(c)))
                          }
                      }
                  }
                  3 -> {
                      var n by remember { mutableStateOf(r.nextInt(5)) }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          OutlinedIconButton(onClick = { if (n > 0) n-- }) { Text("\u2212") }
                          Text("$n", Modifier.padding(horizontal = 16.dp), fontSize = 22.sp)
                          FilledIconButton(onClick = { n++ }, colors = IconButtonDefaults.filledIconButtonColors(containerColor = c, contentColor = ink(c))) { Text("+") }
                      }
                  }
                  4 -> {
                      var rating by remember { mutableStateOf(1 + r.nextInt(5)) }
                      Row {
                          for (k in 1..5) Text(if (k <= rating) "\u2605" else "\u2606", fontSize = 32.sp, color = c, modifier = Modifier.clickable { rating = k })
                      }
                  }
                  5 -> {
                      val st = remember { mutableStateListOf(true, false, true) }
                      listOf("Wi-Fi", "Bluetooth", "Airplane mode").forEachIndexed { k, label ->
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text(label)
                              Switch(st[k], { st[k] = it }, colors = SwitchDefaults.colors(checkedTrackColor = c))
                          }
                      }
                  }
                  6 -> {
                      var p by remember { mutableStateOf(0.1f + 0.1f * r.nextInt(8)) }
                      Box(contentAlignment = Alignment.Center) {
                          CircularProgressIndicator({ p }, Modifier.size(100.dp), color = c, strokeWidth = 8.dp)
                          Text("${(p * 100).toInt()}%", fontSize = 20.sp)
                      }
                      Slider(p, { p = it }, colors = SliderDefaults.colors(thumbColor = c, activeTrackColor = c))
                  }
                  else -> {
                      val kids = remember { mutableStateListOf(true, false, true) }
                      val parent = when {
                          kids.all { it } -> ToggleableState.On
                          kids.none { it } -> ToggleableState.Off
                          else -> ToggleableState.Indeterminate
                      }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          TriStateCheckbox(state = parent, onClick = {
                              val all = parent != ToggleableState.On
                              for (k in kids.indices) kids[k] = all
                          }, colors = CheckboxDefaults.colors(checkedColor = c))
                          Text("Select all")
                      }
                      kids.forEachIndexed { k, v ->
                          Row(Modifier.padding(start = 24.dp), verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(v, { kids[k] = it }, colors = CheckboxDefaults.colors(checkedColor = c))
                              Text("Option ${k + 1}")
                          }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- Text fields
          @Composable
          fun Field(i: Int) {
              val r = rnd(i, 9)
              val h = r.hue()
              val c = hc(h)
              val sh = r.shape()
              var v by remember { mutableStateOf("") }
              when (i % 8) {
                  0 -> {
                      OutlinedTextField(v, { v = it }, label = { Text("Outlined field $i") }, shape = sh, modifier = Modifier.fillMaxWidth(),
                          colors = OutlinedTextFieldDefaults.colors(focusedBorderColor = c, unfocusedBorderColor = c.copy(alpha = 0.5f), focusedLabelColor = c, cursorColor = c))
                      TextField(v, { v = it }, placeholder = { Text("Filled field $i") }, shape = sh, modifier = Modifier.fillMaxWidth(),
                          colors = TextFieldDefaults.colors(focusedContainerColor = c.copy(alpha = 0.15f), unfocusedContainerColor = c.copy(alpha = 0.08f),
                              focusedIndicatorColor = Color.Transparent, unfocusedIndicatorColor = Color.Transparent))
                  }
                  1 -> OutlinedTextField(v, { v = it }, placeholder = { Text("Search\u2026") }, leadingIcon = { Text("\uD83D\uDD0D") },
                      trailingIcon = { if (v.isNotEmpty()) Text("\u2715", Modifier.clickable { v = "" }.padding(8.dp)) },
                      singleLine = true, shape = CircleShape, modifier = Modifier.fillMaxWidth())
                  2 -> {
                      var show by remember { mutableStateOf(false) }
                      OutlinedTextField(v, { v = it }, label = { Text("Password") }, singleLine = true, shape = sh,
                          visualTransformation = if (show) VisualTransformation.None else PasswordVisualTransformation(),
                          trailingIcon = { TextButton(onClick = { show = !show }) { Text(if (show) "Hide" else "Show", color = c) } })
                  }
                  3 -> {
                      val d = remember { mutableStateListOf("", "", "", "") }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          for (k in 0 until 4) OutlinedTextField(d[k], { if (it.length <= 1) d[k] = it.filter(Char::isDigit) }, Modifier.width(58.dp),
                              singleLine = true, textStyle = TextStyle(textAlign = TextAlign.Center, fontSize = 20.sp), shape = sh)
                      }
                  }
                  4 -> OutlinedTextField(v, { v = it }, label = { Text("Username") }, shape = sh, modifier = Modifier.fillMaxWidth(),
                      isError = v.length in 1..2, supportingText = { Text(if (v.length in 1..2) "Too short" else "${v.length}/12") })
                  5 -> TextField(v, { v = it }, minLines = 3, maxLines = 5, label = { Text("Message") }, modifier = Modifier.fillMaxWidth(),
                      supportingText = { Text("${v.length}/200", Modifier.fillMaxWidth(), textAlign = TextAlign.End) })
                  6 -> BasicTextField(v, { v = it }, Modifier.fillMaxWidth(),
                      textStyle = TextStyle(fontSize = 18.sp, color = MaterialTheme.colorScheme.onSurface),
                      decorationBox = { inner ->
                          Column {
                              Box { if (v.isEmpty()) Text("Type here\u2026", color = Color.Gray, fontSize = 18.sp); inner() }
                              Box(Modifier.fillMaxWidth().padding(top = 4.dp).height(2.dp).background(c))
                          }
                      })
                  else -> OutlinedTextField(v, { v = it.filter { ch -> ch.isDigit() } }, label = { Text("Amount") },
                      prefix = { Text("\$") }, suffix = { Text(".00") }, singleLine = true, shape = sh,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number))
              }
          }


