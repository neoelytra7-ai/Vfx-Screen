                      pt("lbl", "Label", "Step", "Label prefix"), pb("labels", "Show labels", true, "Display captions"), pb("num", "Numbered", true, "Number inside dots"), pe("dshape", "Dot shape", "Circle|Rounded|Cut|Rect", "Dot geometry")) +
                      g("Colors", pc("dc", "Done", Color(0xFF6750A4), "Completed color"), pc("tc", "Todo", Color(0xFFCAC4D0), "Pending color")) +
