          // ---------------------------------------------------------------- Charts & data
          @Composable
          fun VizFam(i: Int) {
              val r = rnd(i, 14)
              val h = r.hue()
              val c = hc(h)
              val sh = r.shape()
              when (i % 10) {
                  0 -> {
                      val v = List(7) { 0.15f + 0.85f * r.nextFloat() }
                      Row(Modifier.fillMaxWidth().height(130.dp), verticalAlignment = Alignment.Bottom, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          v.forEachIndexed { k, x ->
                              Column(Modifier.weight(1f).fillMaxHeight(), verticalArrangement = Arrangement.Bottom, horizontalAlignment = Alignment.CenterHorizontally) {
                                  Box(Modifier.fillMaxWidth().fillMaxHeight(x * 0.85f).background(hc(h + k * 10f), RoundedCornerShape(topStart = 6.dp, topEnd = 6.dp)))
                                  Text("MTWTFSS"[k].toString(), fontSize = 10.sp)
                              }
                          }
                      }
                  }
                  1 -> {
                      val pts = List(10) { 0.1f + 0.8f * r.nextFloat() }
                      Canvas(Modifier.fillMaxWidth().height(120.dp)) {
                          val line = Path(); val area = Path()
                          pts.forEachIndexed { k, v ->
                              val x = size.width * k / (pts.size - 1); val y = size.height * (1f - v)
                              if (k == 0) { line.moveTo(x, y); area.moveTo(x, y) } else { line.lineTo(x, y); area.lineTo(x, y) }
                          }
                          area.lineTo(size.width, size.height); area.lineTo(0f, size.height); area.close()
                          drawPath(area, Brush.verticalGradient(listOf(c.copy(alpha = 0.4f), Color.Transparent)))
                          drawPath(line, c, style = Stroke(width = 3.dp.toPx(), cap = StrokeCap.Round))
                      }
                  }
                  2 -> {
                      val parts = List(5) { 0.1f + r.nextFloat() }
                      val total = parts.sum()
                      Canvas(Modifier.size(140.dp)) {
                          var a = -90f
                          parts.forEachIndexed { k, p -> val sw = 360f * p / total; drawArc(hc(h + k * 60f), a, sw, true); a += sw }
                      }
                  }
                  3 -> {
                      val parts = List(4) { 0.1f + r.nextFloat() }
                      val total = parts.sum()
                      Box(Modifier.size(150.dp), contentAlignment = Alignment.Center) {
                          Canvas(Modifier.fillMaxSize().padding(14.dp)) {
                              var a = -90f
                              parts.forEachIndexed { k, p -> val sw = 360f * p / total; drawArc(hc(h + k * 70f), a, sw - 2f, false, style = Stroke(width = 22.dp.toPx())); a += sw }
                          }
                          Text("${(total * 10).toInt()}k", fontSize = 22.sp, fontWeight = FontWeight.Bold)
                      }
                  }
                  4 -> {
                      val pct = 0.15f + 0.8f * r.nextFloat()
                      Box(Modifier.size(width = 180.dp, height = 100.dp).clipToBounds()) {
                          Canvas(Modifier.fillMaxSize()) {
                              val w = size.width - 40f
                              drawArc(c.copy(alpha = 0.2f), 180f, 180f, false, topLeft = Offset(20f, 20f), size = Size(w, w), style = Stroke(width = 20f, cap = StrokeCap.Round))
                              drawArc(c, 180f, 180f * pct, false, topLeft = Offset(20f, 20f), size = Size(w, w), style = Stroke(width = 20f, cap = StrokeCap.Round))
                          }
                          Text("${(pct * 100).toInt()}%", Modifier.align(Alignment.BottomCenter), fontSize = 24.sp, fontWeight = FontWeight.Bold)
                      }
                  }
                  5 -> Column(verticalArrangement = Arrangement.spacedBy(3.dp)) {
                      for (row in 0 until 5) Row(horizontalArrangement = Arrangement.spacedBy(3.dp)) {
                          for (col in 0 until 12) Box(Modifier.weight(1f).aspectRatio(1f).background(c.copy(alpha = 0.1f + 0.9f * r.nextFloat()), RoundedCornerShape(3.dp)))
                      }
                  }
                  6 -> listOf("Kotlin", "Swift", "Rust", "Go").forEachIndexed { k, l ->
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text(l, Modifier.width(60.dp), fontSize = 12.sp)
                          Box(Modifier.weight(1f).height(14.dp).clip(CircleShape).background(c.copy(alpha = 0.15f))) {
                              Box(Modifier.fillMaxWidth(0.2f + 0.8f * r.nextFloat()).fillMaxHeight().background(hc(h + k * 30f)))
                          }
                      }
                  }
                  7 -> {
                      val pts = List(25) { Offset(r.nextFloat(), r.nextFloat()) }
                      Canvas(Modifier.fillMaxWidth().height(120.dp).border(1.dp, c.copy(alpha = 0.3f))) {
                          pts.forEach { drawCircle(c.copy(alpha = 0.7f), radius = (3 + it.x * 6).dp.toPx(), center = Offset(it.x * size.width, it.y * size.height)) }
                      }
                  }
                  8 -> {
                      val vals = List(5) { 0.3f + 0.7f * r.nextFloat() }
                      Canvas(Modifier.size(150.dp)) {
                          val cx = size.width / 2; val cy = size.height / 2; val rad = size.width / 2 * 0.9f
                          fun poly(f: (Int) -> Float): Path {
                              val p = Path()
                              for (k in 0 until 5) {
                                  val a = (2.0 * PI * k / 5 - PI / 2).toFloat()
                                  val x = cx + rad * f(k) * cos(a); val y = cy + rad * f(k) * sin(a)
                                  if (k == 0) p.moveTo(x, y) else p.lineTo(x, y)
                              }
                              p.close(); return p
                          }
                          for (g in 1..3) drawPath(poly { g / 3f }, c.copy(alpha = 0.3f), style = Stroke(width = 1.dp.toPx()))
                          drawPath(poly { vals[it] }, c.copy(alpha = 0.4f))
                          drawPath(poly { vals[it] }, c, style = Stroke(width = 2.dp.toPx()))
                      }
                  }
                  else -> {
                      val parts = List(4) { 0.2f + r.nextFloat() }
                      Row(Modifier.fillMaxWidth().height(28.dp).clip(sh)) {
                          parts.forEachIndexed { k, p -> Box(Modifier.weight(p).fillMaxHeight().background(hc(h + k * 70f))) }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          for (k in parts.indices) Row(verticalAlignment = Alignment.CenterVertically) { Box(Modifier.size(8.dp).background(hc(h + k * 70f), CircleShape)); Text(" S${k + 1}", fontSize = 11.sp) }
                      }
                  }
              }
          }

