          private fun fw(p: Props) = FontWeight((p.f("wt").toInt() * 100).coerceIn(100, 900))
          private fun fam(p: Props): FontFamily = when (p.e("font")) {
              "Serif" -> FontFamily.Serif; "Sans" -> FontFamily.SansSerif; "Mono" -> FontFamily.Monospace; "Cursive" -> FontFamily.Cursive; else -> FontFamily.Default
          }
          private fun brd(p: Props): BorderStroke? = if (p.f("bw") > 0.4f) BorderStroke(p.dp("bw"), p.c("bc")) else null
          private fun tsty(p: Props) = TextStyle(fontSize = p.f("fs").sp, fontFamily = fam(p), fontWeight = fw(p), letterSpacing = p.f("ls").sp)
          private fun slot(s: String): (@Composable () -> Unit)? {
              if (s.isEmpty()) return null
              return { Text(s) }
