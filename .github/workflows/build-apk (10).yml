          const val VARIANTS = 80

          val allEntries: List<ShowEntry> by lazy {
              val core = (baseSections + extraSections).map { s ->
                  ShowEntry("core:${s.first}", s.first, "Core demos", coreDesc[s.first] ?: "Hand-written Material 3 demo", "Core demo", emptyList(), 1) { _ -> s.second() }
              }
              val legacy = families.flatMap { f ->
                  (1..f.count).map { i ->
                      val info = legacyInfo[f.name]?.getOrNull(i % f.count) ?: ("Layout" to "Layout demo")
                      ShowEntry("${f.name}:$i", "${f.name} $i \u00B7 ${info.first}", f.name, info.second, "Layout demo", emptyList(), 1) { _ -> f.body(i) }
                  }
              }
              val lab = labKinds.flatMap { k ->
                  (1..VARIANTS).map { n -> ShowEntry("${k.type}:$n", "${k.type} #$n", k.type, k.desc, "Customizable", k.props, n, k.render) }
