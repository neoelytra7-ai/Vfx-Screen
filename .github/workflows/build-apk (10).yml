          private fun typeName(t: PT) = when (t) { PT.COLOR -> "Color"; PT.DP -> "Dp"; PT.FLOAT -> "Float"; PT.INT -> "Int"; PT.BOOL -> "Bool"; PT.ENUM -> "Choice"; PT.TEXT -> "Text" }
          private fun valueText(d: PropDef, p: Props): String = when (d.type) {
              PT.COLOR -> p.c(d.key).let { if (it == Color.Unspecified) "theme" else lhex(it) }
              PT.DP -> String.format("%.1f dp", p.f(d.key))
              PT.FLOAT -> String.format("%.2f", p.f(d.key))
              PT.INT -> "" + p.f(d.key).toInt()
              PT.BOOL -> if (p.b(d.key)) "on" else "off"
              PT.ENUM -> p.e(d.key)
              PT.TEXT -> "\"" + p.s(d.key).take(14) + "\""
          }

          @Composable
          private fun PropEditor(d: PropDef, p: Props) {
              val sub = MaterialTheme.colorScheme.onSurfaceVariant
              Column(Modifier.fillMaxWidth().padding(vertical = 6.dp), verticalArrangement = Arrangement.spacedBy(2.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text(d.label, Modifier.weight(1f), fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                      Text(typeName(d.type), fontSize = 10.sp, color = MaterialTheme.colorScheme.primary)
                      Text("  " + valueText(d, p), fontSize = 10.sp, color = sub)
                  }
                  if (d.desc.isNotEmpty()) Text(d.desc, fontSize = 10.sp, color = sub)
                  when (d.type) {
                      PT.DP, PT.FLOAT, PT.INT -> Slider(p.f(d.key).coerceIn(d.min, d.max), { p.m[d.key] = if (d.type == PT.INT) it.roundToInt().toFloat() else it }, valueRange = d.min..d.max)
                      PT.BOOL -> Switch(p.b(d.key), { p.m[d.key] = it })
                      PT.ENUM -> FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          d.opts.forEach { o -> FilterChip(selected = p.e(d.key) == o, onClick = { p.m[d.key] = o }, label = { Text(o, fontSize = 11.sp) }) }
                      }
                      PT.TEXT -> OutlinedTextField(p.s(d.key), { p.m[d.key] = it }, Modifier.fillMaxWidth(), textStyle = TextStyle(fontSize = 13.sp), singleLine = true)
                      PT.COLOR -> {
                          val c = p.c(d.key)
                          if (c == Color.Unspecified) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text("Using theme default", Modifier.weight(1f), fontSize = 11.sp)
                                  OutlinedButton(onClick = { p.m[d.key] = Color(0xFF6750A4) }) { Text("Customize", fontSize = 11.sp) }
                              }
                          } else {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(Modifier.size(28.dp).background(c, CircleShape).border(1.dp, Color.Gray, CircleShape))
                                  Text(lhex(c), Modifier.padding(start = 8.dp).weight(1f), fontSize = 11.sp)
                                  if (d.def == Color.Unspecified) TextButton(onClick = { p.m[d.key] = Color.Unspecified }) { Text("Use theme", fontSize = 11.sp) }
                              }
                              listOf("R" to c.red, "G" to c.green, "B" to c.blue, "A" to c.alpha).forEachIndexed { k, (n, v) ->
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text(n, Modifier.width(16.dp), fontSize = 11.sp)
                                      Slider(v, { nv -> p.m[d.key] = when (k) { 0 -> c.copy(red = nv); 1 -> c.copy(green = nv); 2 -> c.copy(blue = nv); else -> c.copy(alpha = nv) } }, Modifier.weight(1f))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun Inspector(e: ShowEntry) {
              val sub = MaterialTheme.colorScheme.onSurfaceVariant
              Column(Modifier.fillMaxSize()) {
                  Column(Modifier.weight(0.42f).fillMaxWidth().verticalScroll(rememberScrollState()).padding(12.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      Text("Type: ${e.type} \u00B7 ${e.tag} \u00B7 ${e.schema.size} own props + ${universalDefs.size} wrapper props", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)
                      Text(e.desc, fontSize = 11.sp, color = sub)
                      Wrapped(e.uprops) { e.render(e.props) }
                  }
                  HorizontalDivider()
                  LazyColumn(Modifier.weight(0.58f).fillMaxWidth(), contentPadding = PaddingValues(12.dp)) {
                      item {
                          FlowRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              if (e.schema.isNotEmpty()) {
                                  OutlinedButton(onClick = { e.props.preset(e.variant) }) { Text("Preset", fontSize = 12.sp) }
                                  OutlinedButton(onClick = { e.props.preset(1) }) { Text("Defaults", fontSize = 12.sp) }
                                  Button(onClick = { e.props.preset(2 + Random.nextInt(100000)) }) { Text("Shuffle", fontSize = 12.sp) }
                              }
                              OutlinedButton(onClick = { e.uprops.preset(1) }) { Text("Reset wrapper", fontSize = 12.sp) }
                          }
                      }
                      if (e.schema.isEmpty()) item { Text("This item is a fixed layout; all wrapper properties below still apply.", fontSize = 11.sp, color = sub, modifier = Modifier.padding(vertical = 8.dp)) }
                      var last = ""
                      e.schema.forEach { d ->
                          if (d.group != last) { last = d.group; val t = d.group; item(key = "h:$t") { Text("COMPONENT \u00B7 " + t.uppercase(), fontSize = 11.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary, modifier = Modifier.padding(top = 14.dp)) } }
                          item(key = "c:" + d.key) { PropEditor(d, e.props) }
                      }
                      var ul = ""
                      universalDefs.forEach { d ->
                          if (d.group != ul) { ul = d.group; val t = d.group; item(key = "uh:$t") { Text("WRAPPER \u00B7 " + t.uppercase(), fontSize = 11.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.secondary, modifier = Modifier.padding(top = 14.dp)) } }
                          item(key = "u:" + d.key) { PropEditor(d, e.uprops) }
                      }
                  }
              }
          }
          EOF

