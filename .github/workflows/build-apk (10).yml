              Kind("Pie & donut", "Pie or donut chart with hue-stepped slices, gaps, start angle and center total",
                  g("Data", pi("n", "Slices", 5, 2, 12, "Number of slices"), pi("seed", "Seed", 4, 0, 99, "Random seed"), pb("donut", "Donut", false, "Cut a hole"), pd("ring", "Ring thickness", 28f, 6f, 80f, "Donut stroke"),
                      pf("gap", "Slice gap", 1f, 0f, 12f, "Degrees between slices"), pf("start", "Start angle", -90f, -180f, 180f, "First slice start"), pb("ctr", "Center total", true, "Label in donut hole")) +
                      g("Color", pf("hs", "Hue start", 200f, 0f, 360f, "First hue"), pf("hstep", "Hue step", 40f, 5f, 90f, "Hue increment"), pf("sat", "Saturation", 0.65f, 0.2f, 1f, "Color richness"), pf("lit", "Lightness", 0.5f, 0.25f, 0.75f, "Brightness")) +
                      g("Size", pd("size", "Diameter", 150f, 80f, 260f, "Chart size"))
              ) { p ->
                  val r = Random(p.f("seed").toInt())
                  val parts = List(p.f("n").toInt()) { 0.1f + r.nextFloat() }
                  val total = parts.sum()
                  Box(Modifier.size(p.dp("size")), contentAlignment = Alignment.Center) {
                      Canvas(Modifier.fillMaxSize().padding(if (p.b("donut")) p.dp("ring") / 2 else 0.dp)) {
                          var a = p.f("start")
                          parts.forEachIndexed { k, v ->
                              val sw = 360f * v / total
                              val c = lhc(p.f("hs") + k * p.f("hstep"), p.f("sat"), p.f("lit"))
                              if (p.b("donut")) drawArc(c, a, (sw - p.f("gap")).coerceAtLeast(0.5f), false, style = Stroke(p.dp("ring").toPx()))
                              else drawArc(c, a, (sw - p.f("gap")).coerceAtLeast(0.5f), true)
                              a += sw
                          }
                      }
                      if (p.b("donut") && p.b("ctr")) Text("${(total * 10).toInt()}k", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  }
              },

