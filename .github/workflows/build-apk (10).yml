          cat > $D/LabCore.kt <<'EOF'
          package com.showcase.ui

          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.*
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.*
          import androidx.compose.ui.text.font.*
          import androidx.compose.ui.unit.*
          import kotlin.math.roundToInt
          import kotlin.random.Random

          // ===================================================================== property engine
          enum class PT { COLOR, DP, FLOAT, INT, BOOL, ENUM, TEXT }

          class PropDef(
              val key: String, val label: String, val type: PT, val def: Any,
              val min: Float = 0f, val max: Float = 1f, val opts: List<String> = emptyList(), val desc: String = ""
          ) { var group: String = "" }

          class Props(val defs: List<PropDef>) {
              val m = mutableStateMapOf<String, Any>().apply { defs.forEach { put(it.key, it.def) } }
              fun f(k: String): Float = (m[k] as? Float) ?: 0f
              fun dp(k: String): Dp = f(k).dp
              fun b(k: String): Boolean = (m[k] as? Boolean) ?: false
              fun s(k: String): String = (m[k] as? String) ?: ""
              fun e(k: String): String = (m[k] as? String) ?: ""
              fun c(k: String): Color = (m[k] as? Color) ?: Color.Unspecified

              fun preset(seed: Int) {
                  defs.forEach { m[it.key] = it.def }
                  if (seed <= 1) return
                  defs.forEach { d ->
                      if (d.key == "enabled") return@forEach
                      val r = Random(seed * 7919 + d.key.hashCode())
                      when (d.type) {
                          PT.COLOR -> if (d.def != Color.Unspecified) m[d.key] = Color.hsl(r.nextInt(360).toFloat(), 0.45f + 0.4f * r.nextFloat(), 0.3f + 0.4f * r.nextFloat(), (d.def as Color).alpha)
                          PT.DP, PT.FLOAT -> m[d.key] = d.min + (d.max - d.min) * r.nextFloat()
                          PT.INT -> m[d.key] = (d.min + (d.max - d.min) * r.nextFloat()).roundToInt().toFloat()
                          PT.BOOL -> m[d.key] = r.nextBoolean()
                          PT.ENUM -> m[d.key] = d.opts[r.nextInt(d.opts.size)]
                          PT.TEXT -> {}
                      }
                      Unit
                  }
                  val bg = m["bg"]
                  if (defs.any { it.key == "fg" && it.type == PT.COLOR } && bg is Color) m["fg"] = lnk(bg)
              }
          }

          class Kind(val type: String, val desc: String, val props: List<PropDef>, val render: @Composable (Props) -> Unit)

          class ShowEntry(
              val id: String, val title: String, val type: String, val desc: String, val tag: String,
              val schema: List<PropDef>, val variant: Int, val render: @Composable (Props) -> Unit
          ) {
              val props: Props by lazy { Props(schema).also { it.preset(variant) } }
              val uprops: Props by lazy { Props(universalDefs) }
          }

          // ---- tiny builders (shared with LabKinds.kt)
          internal fun lnk(c: Color) = if (c.luminance() > 0.5f) Color.Black else Color.White
          internal fun lhc(h: Float, s: Float = 0.65f, l: Float = 0.5f) = Color.hsl(((h % 360f) + 360f) % 360f, s, l)
          internal fun lhex(c: Color) = String.format("#%08X", c.toArgb())
          internal fun pc(k: String, l: String, v: Color, d: String = "") = PropDef(k, l, PT.COLOR, v, desc = d)
          internal fun pd(k: String, l: String, v: Float, mn: Float, mx: Float, d: String = "") = PropDef(k, l, PT.DP, v, mn, mx, desc = d)
          internal fun pf(k: String, l: String, v: Float, mn: Float, mx: Float, d: String = "") = PropDef(k, l, PT.FLOAT, v, mn, mx, desc = d)
          internal fun pi(k: String, l: String, v: Int, mn: Int, mx: Int, d: String = "") = PropDef(k, l, PT.INT, v.toFloat(), mn.toFloat(), mx.toFloat(), desc = d)
          internal fun pb(k: String, l: String, v: Boolean, d: String = "") = PropDef(k, l, PT.BOOL, v, desc = d)
          internal fun pt(k: String, l: String, v: String, d: String = "") = PropDef(k, l, PT.TEXT, v, desc = d)
          internal fun pe(k: String, l: String, opts: String, d: String = "", v: String = "") =
              PropDef(k, l, PT.ENUM, if (v.isEmpty()) opts.substringBefore('|') else v, opts = opts.split('|'), desc = d)
          internal fun g(name: String, vararg d: PropDef): List<PropDef> { d.forEach { it.group = name }; return d.toList() }

          internal fun shapeG(r: Float, s: String = "Rounded") = g("Shape",
              pe("shape", "Shape family", "Rounded|Cut|Rect|Circle", "Outline geometry", s),
              pd("tl", "Top-start radius", r, 0f, 80f, "Top-left corner size"),
              pd("tr", "Top-end radius", r, 0f, 80f, "Top-right corner size"),
              pd("br", "Bottom-end radius", r, 0f, 80f, "Bottom-right corner size"),
              pd("bl", "Bottom-start radius", r, 0f, 80f, "Bottom-left corner size"))
          internal fun borderG(w: Float) = g("Border",
              pd("bw", "Border width", w, 0f, 10f, "0 hides the border"),
              pc("bc", "Border color", Color(0xFF79747E), "Stroke color"))
          internal fun fontG(s: Float, w: Int) = g("Typography",
              pe("font", "Font family", "Default|Serif|Sans|Mono|Cursive", "Typeface"),
              pi("wt", "Weight (x100)", w, 1, 9, "100 = thin ... 900 = black"),
              pf("fs", "Font size", s, 8f, 48f, "Text size in sp"),
              pf("ls", "Letter spacing", 0f, -2f, 10f, "Tracking in sp"))

          internal fun shp(p: Props): Shape = when (p.e("shape")) {
              "Cut" -> CutCornerShape(p.dp("tl"), p.dp("tr"), p.dp("br"), p.dp("bl"))
              "Rect" -> RectangleShape
              "Circle" -> CircleShape
              else -> RoundedCornerShape(p.dp("tl"), p.dp("tr"), p.dp("br"), p.dp("bl"))
          }

          // ---- universal wrapper properties (apply to EVERY item)
          val universalDefs: List<PropDef> =
              g("Box", pf("wf", "Width fraction", 1f, 0.2f, 1f, "Share of available width"),
                  pd("pad", "Padding", 0f, 0f, 48f, "Inner spacing"),
                  pd("gap", "Child gap", 6f, 0f, 32f, "Space between stacked children"),
                  pc("bg", "Background", Color.Unspecified, "Fill behind the item"),
                  pd("rad", "Corner radius", 0f, 0f, 64f, "Clip radius of the wrapper"),
                  pd("bw", "Border width", 0f, 0f, 12f, "Wrapper outline width"),
                  pc("bcol", "Border color", Color(0xFF888888), "Wrapper outline color"),
                  pd("elev", "Shadow elevation", 0f, 0f, 24f, "Drop shadow depth"),
                  pf("alpha", "Opacity", 1f, 0.1f, 1f, "Overall transparency")) +
              g("Transform", pf("sc", "Scale", 1f, 0.3f, 2f, "Zoom factor"),
                  pf("rot", "Rotation", 0f, -180f, 180f, "Degrees"),
                  pd("ox", "Offset X", 0f, -100f, 100f, "Horizontal shift"),
                  pd("oy", "Offset Y", 0f, -100f, 100f, "Vertical shift")) +
              g("Environment", pe("theme", "Theme mode", "System|Light|Dark", "Force light or dark scheme"),
                  pb("rtl", "Right-to-left", false, "Mirror layout direction"),
                  pf("dens", "Density scale", 1f, 0.6f, 1.8f, "Scales every dp"),
                  pf("fscale", "Font scale", 1f, 0.6f, 2f, "Scales every sp")) +
              g("Theme overrides", pc("primary", "Primary", Color.Unspecified, "Material primary color"),
                  pc("secondary", "Secondary", Color.Unspecified, "Material secondary color"),
                  pc("surf", "Surface", Color.Unspecified, "Material surface color"),
                  pc("onsurf", "On-surface text", Color.Unspecified, "Default text color"))

          @Composable
          fun Wrapped(u: Props, content: @Composable () -> Unit) {
              val sysDark = isSystemInDarkTheme()
              val mode = u.e("theme")
              val dark = when (mode) { "Dark" -> true; "Light" -> false; else -> sysDark }
              val base = if (dark) darkColorScheme() else lightColorScheme()
              fun ov(k: String, cur: Color): Color = u.c(k).let { if (it == Color.Unspecified) cur else it }
              val cs = base.copy(primary = ov("primary", base.primary), secondary = ov("secondary", base.secondary),
                  surface = ov("surf", base.surface), onSurface = ov("onsurf", base.onSurface))
              val d = LocalDensity.current
              val bg = u.c("bg")
              CompositionLocalProvider(
                  LocalDensity provides Density(d.density * u.f("dens"), d.fontScale * u.f("fscale")),
                  LocalLayoutDirection provides if (u.b("rtl")) LayoutDirection.Rtl else LayoutDirection.Ltr
              ) {
                  MaterialTheme(colorScheme = cs) {
                      Surface(
                          modifier = Modifier.fillMaxWidth(u.f("wf").coerceIn(0.1f, 1f)).offset(u.dp("ox"), u.dp("oy"))
                              .graphicsLayer(scaleX = u.f("sc"), scaleY = u.f("sc"), rotationZ = u.f("rot"), alpha = u.f("alpha")),
                          shape = RoundedCornerShape(u.dp("rad")),
                          color = if (bg != Color.Unspecified) bg else if (mode == "System") Color.Transparent else cs.surface,
                          contentColor = cs.onSurface,
                          shadowElevation = u.dp("elev"),
                          border = if (u.f("bw") > 0.4f) BorderStroke(u.dp("bw"), u.c("bcol")) else null
                      ) {
                          Column(Modifier.padding(u.dp("pad")), verticalArrangement = Arrangement.spacedBy(u.dp("gap"))) { content() }
                      }
                  }
              }
          }

