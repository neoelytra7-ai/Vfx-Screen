              // 30 ----------------------------------------------------------- Tooltip
              Kind("Tooltip", "Bubble with a directional arrow, custom padding, radius, shadow and colors",
                  g("Content", pt("text", "Text", "Helpful tip: long-press to edit", "Tooltip text"), pe("arrow", "Arrow side", "Bottom|Top|Start|End|None", "Where the arrow points from")) +
                      g("Colors", pc("bg", "Background", Color(0xFF322F35), "Bubble fill"), pc("fg", "Text", Color.White, "Text color")) +
                      g("Size", pd("rad", "Radius", 10f, 0f, 30f, "Bubble corners"), pd("pad", "Padding", 10f, 2f, 28f, "Inner padding"), pd("arr", "Arrow size", 10f, 4f, 24f, "Arrow edge"), pd("elev", "Shadow", 4f, 0f, 16f, "Elevation"), pf("fs", "Text size", 13f, 8f, 22f, "Text sp"))
              ) { p ->
                  val a = p.dp("arr")
                  val up = GenericShape { s, _ -> moveTo(s.width / 2, 0f); lineTo(s.width, s.height); lineTo(0f, s.height); close() }
                  val down = GenericShape { s, _ -> moveTo(0f, 0f); lineTo(s.width, 0f); lineTo(s.width / 2, s.height); close() }
                  val left = GenericShape { s, _ -> moveTo(0f, s.height / 2); lineTo(s.width, 0f); lineTo(s.width, s.height); close() }
                  val right = GenericShape { s, _ -> moveTo(0f, 0f); lineTo(s.width, s.height / 2); lineTo(0f, s.height); close() }
                  val bubble: @Composable () -> Unit = {
                      Box(Modifier.shadow(p.dp("elev"), RoundedCornerShape(p.dp("rad"))).clip(RoundedCornerShape(p.dp("rad"))).background(p.c("bg")).padding(p.dp("pad"))) { Text(p.s("text"), color = p.c("fg"), fontSize = p.f("fs").sp) }
                  }
                  when (p.e("arrow")) {
                      "Top" -> Column(horizontalAlignment = Alignment.CenterHorizontally) { Box(Modifier.size(a).clip(up).background(p.c("bg"))); bubble() }
                      "Start" -> Row(verticalAlignment = Alignment.CenterVertically) { Box(Modifier.size(a).clip(left).background(p.c("bg"))); bubble() }
                      "End" -> Row(verticalAlignment = Alignment.CenterVertically) { bubble(); Box(Modifier.size(a).clip(right).background(p.c("bg"))) }
                      "None" -> bubble()
                      else -> Column(horizontalAlignment = Alignment.CenterHorizontally) { bubble(); Box(Modifier.size(a).clip(down).background(p.c("bg"))) }
                  }
              },

              // 31 ----------------------------------------------------------- Divider
              Kind("Divider", "Solid, dashed, dotted, gradient or labelled dividers with indents and spacing",
                  g("Content", pe("kind", "Kind", "Line|Dashed|Dotted|Gradient|Label", "Divider flavour"), pt("label", "Label", "OR", "Center text (Label kind)"), pb("cap", "Round caps", true, "Round line ends")) +
                      g("Colors", pc("c1", "Color", Color(0xFF6750A4), "Line color"), pc("c2", "Gradient end", Color(0xFFEA4C89), "Gradient stop")) +
                      g("Size", pd("th", "Thickness", 3f, 1f, 16f, "Line width"), pd("ind", "Start indent", 0f, 0f, 80f, "Left inset"), pd("end", "End indent", 0f, 0f, 80f, "Right inset"), pd("vs", "Vertical spacing", 12f, 0f, 40f, "Space above and below"), pf("dash", "Dash length", 12f, 2f, 40f, "Pattern length"))
              ) { p ->
                  val cap = if (p.b("cap")) StrokeCap.Round else StrokeCap.Butt
                  val line: @Composable (Modifier) -> Unit = { m ->
                      Canvas(m.height(p.dp("th"))) {
                          val y = size.height / 2
                          when (p.e("kind")) {
                              "Dashed" -> drawLine(p.c("c1"), Offset(0f, y), Offset(size.width, y), p.dp("th").toPx(), cap, PathEffect.dashPathEffect(floatArrayOf(p.f("dash") * 2f, p.f("dash"))))
                              "Dotted" -> drawLine(p.c("c1"), Offset(0f, y), Offset(size.width, y), p.dp("th").toPx(), StrokeCap.Round, PathEffect.dashPathEffect(floatArrayOf(0.1f, p.dp("th").toPx() * 2.5f)))
                              "Gradient" -> drawLine(Brush.horizontalGradient(listOf(p.c("c1"), p.c("c2"))), Offset(0f, y), Offset(size.width, y), p.dp("th").toPx(), cap)
                              else -> drawLine(p.c("c1"), Offset(0f, y), Offset(size.width, y), p.dp("th").toPx(), cap)
                          }
                      }
                  }
                  Row(Modifier.fillMaxWidth().padding(start = p.dp("ind"), end = p.dp("end"), top = p.dp("vs"), bottom = p.dp("vs")), verticalAlignment = Alignment.CenterVertically) {
                      if (p.e("kind") == "Label") {
                          Box(Modifier.weight(1f).height(p.dp("th")).background(p.c("c1")))
                          Text(p.s("label"), Modifier.padding(horizontal = 10.dp), fontSize = 12.sp, color = p.c("c1"))
                          Box(Modifier.weight(1f).height(p.dp("th")).background(p.c("c1")))
                      } else line(Modifier.fillMaxWidth())
                  }
              },

              // 32 ----------------------------------------------------------- Settings rows
              Kind("Settings rows", "Settings panel with switches, chevrons or values, icons, dividers and shaped container",
                  g("Content", pi("rows", "Rows", 4, 1, 8, "Number of settings"), pe("trail", "Trailing", "Switch|Chevron|Value|None", "Right-side control"), pb("icons", "Icons", true, "Leading glyphs"), pb("sub", "Subtitles", true, "Secondary lines"), pb("div", "Dividers", true, "Line between rows")) + shapeG(16f) +
                      g("Colors", pc("bg", "Background", Color(0xFFF3EDF7), "Panel fill"), pc("ac", "Accent", Color(0xFF6750A4), "Switch / chevron color")) +
                      g("Size", pd("rh", "Row padding", 12f, 2f, 28f, "Vertical padding"), pf("fs", "Title size", 15f, 9f, 24f, "Title sp"))
              ) { p ->
                  val names = listOf("Notifications" to "🔔", "Dark mode" to "🌙", "Location" to "📍", "Wi-Fi" to "📶", "Bluetooth" to "🔵", "Privacy" to "🔒", "Storage" to "💾", "Language" to "🌐")
                  val st = remember { mutableStateListOf(true, false, true, true, false, true, false, true) }
                  val n = p.f("rows").toInt()
                  Column(Modifier.clip(shp(p)).background(p.c("bg"))) {
                      for (k in 0 until n) {
                          Row(Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = p.dp("rh")), verticalAlignment = Alignment.CenterVertically) {
                              if (p.b("icons")) Text(names[k].second, Modifier.padding(end = 12.dp), fontSize = 20.sp)
                              Column(Modifier.weight(1f)) {
                                  Text(names[k].first, fontSize = p.f("fs").sp)
                                  if (p.b("sub")) Text("Manage ${names[k].first.lowercase()}", fontSize = 11.sp)
                              }
                              when (p.e("trail")) {
                                  "Switch" -> Switch(st[k], { st[k] = it }, colors = SwitchDefaults.colors(checkedTrackColor = p.c("ac")))
                                  "Chevron" -> Text("›", fontSize = 22.sp, color = p.c("ac"))
                                  "Value" -> Text(if (st[k]) "On" else "Off", color = p.c("ac"), fontSize = 13.sp)
                                  else -> {}
                              }
                          }
                          if (p.b("div") && k < n - 1) HorizontalDivider()
                      }
                  }
              }
          )
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ui-showcase-debug
          path: app/build/outputs/apk/debug/*.apk
