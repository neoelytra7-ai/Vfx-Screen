                  }
                  3 -> Row {
                      Text("T", fontSize = 64.sp, fontWeight = FontWeight.Bold, color = c, fontFamily = fam)
                      Text("he quick brown fox jumps over the lazy dog and keeps running across the field.", Modifier.padding(start = 6.dp, top = 12.dp), fontSize = 14.sp)
                  }
                  4 -> Box(Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp)).background(Color(0xFF1E1E2E)).padding(12.dp)) {
                      Text("fun main() {\n    println(\"Hello $i\")\n}", fontFamily = FontFamily.Monospace, color = Color(0xFFA6E3A1), fontSize = 13.sp)
                  }
                  5 -> Text("Shadow $i", style = TextStyle(fontSize = 40.sp, fontWeight = FontWeight.Black, color = c,
                      shadow = Shadow(color = c2, offset = Offset(6f, 6f), blurRadius = 8f)))
                  6 -> Text(buildAnnotatedString {
                      append("E = mc")
                      withStyle(SpanStyle(baselineShift = BaselineShift.Superscript, fontSize = 14.sp)) { append("2") }
                      append("   H")
                      withStyle(SpanStyle(baselineShift = BaselineShift.Subscript, fontSize = 14.sp)) { append("2") }
                      append("O")
                  }, fontSize = 28.sp, color = c)
                  else -> Column {
