          private const val FS_GB = """#version 300 es
          precision mediump float;in vec2 vU;uniform sampler2D uT;uniform vec2 uD;out vec4 o;
          void main(){vec4 a=texture(uT,vU)*.2270;a+=(texture(uT,vU+uD*1.3846)+texture(uT,vU-uD*1.3846))*.3162;a+=(texture(uT,vU+uD*3.2308)+texture(uT,vU-uD*3.2308))*.0703;o=a;}"""

