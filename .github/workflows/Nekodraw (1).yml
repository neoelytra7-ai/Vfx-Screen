          package dev.canvas

          import android.app.ActivityManager
          import android.content.Context
          import android.opengl.GLES30 as G
          import android.opengl.GLSurfaceView
          import android.os.Handler
          import android.os.Looper
          import androidx.compose.runtime.*
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.ln
          import kotlin.math.max

          // metrics: 0 pixels (Mpx/s)  1 brush stamps (k/s)  2 fx shader (Mpx/s)  3 gpu read (MB/s)  4 cpu (M ops/s)  5 ram (GB)
          val BLO = floatArrayOf(200f, 15f, 10f, 50f, 80f, 1.5f)
          val BHI = floatArrayOf(8000f, 400f, 1000f, 2000f, 1500f, 12f)
          val BW = floatArrayOf(.2f, .15f, .25f, .05f, .1f, .25f)
          val BMIN = floatArrayOf(300f, 25f, 20f, 80f, 120f, 2f)     // below = LOW
          val BREC = floatArrayOf(1500f, 90f, 150f, 300f, 400f, 4f)  // above = GREAT
          val BN = listOf("PIXELS", "BRUSH", "FX", "I/O", "CPU", "RAM")

          class TierInfo(val name: String, val tag: String, val budget: Int)
          val TIERS = listOf(
              TierInfo("ENTRY LEVEL", "light and steady", 96), TierInfo("MID-RANGE", "smooth and balanced", 128),
              TierInfo("UPPER MID", "quick and capable", 160), TierInfo("FLAGSHIP", "fast and fluid", 224), TierInfo("ULTRA", "no limits", 320),
          )
          val BSTAGE = listOf("checking pixels", "trying the brush", "testing filters", "reading pixels back", "warming the cpu", "counting memory")
          fun deviceName(): String = android.os.Build.MANUFACTURER + " " + android.os.Build.MODEL
          val SIZES = intArrayOf(1024, 1536, 2048, 2560, 3072)
          val SIZE_N = listOf("S", "M", "L", "XL", "XXL")

          class BenchRes(val gpu: String, val api: String, val maxTex: Int, val raw: FloatArray, val cores: Int) {
              val sc = FloatArray(6) { (ln(raw[it] / BLO[it]) / ln(BHI[it] / BLO[it])).coerceIn(0f, 1f) }
              val score: Int
              val tier: Int
              init {
                  var t = 0f
                  for (i in 0 until 6) t += sc[i] * BW[i]
                  score = (t * 100f).toInt()
                  tier = if (score < 25) 0 else if (score < 50) 1 else if (score < 72) 2 else if (score < 88) 3 else 4
              }
          }

          class BenchState {
              var running by mutableStateOf(false)
              var stage by mutableIntStateOf(0)
              var key by mutableIntStateOf(0)
              var res by mutableStateOf<BenchRes?>(null)
              val bars = mutableStateListOf(0f, 0f, 0f, 0f, 0f, 0f)
          }

          fun ramGb(ctx: Context): Float {
              val mi = ActivityManager.MemoryInfo()
              (ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).getMemoryInfo(mi)
              return mi.totalMem / 1073741824f
          }

          fun fallbackRes(ctx: Context): BenchRes {
              val g = ramGb(ctx)
              return BenchRes("unknown gpu", "unknown", 4096, floatArrayOf(BLO[0] * 3f, BLO[1] * 3f, BLO[2] * 3f, BLO[3] * 3f, BLO[4] * 3f, g), Runtime.getRuntime().availableProcessors())
          }

          fun saveBench(ctx: Context, r: BenchRes) {
              val ed = ctx.getSharedPreferences("bench", 0).edit()
              ed.putString("gpu", r.gpu).putString("api", r.api).putInt("tex", r.maxTex).putInt("cores", r.cores)
              for (i in 0 until 6) ed.putFloat("r" + i, r.raw[i])
              ed.apply()
          }

          fun loadBench(ctx: Context): BenchRes? {
              val p = ctx.getSharedPreferences("bench", 0)
              if (!p.contains("r0")) return null
              return BenchRes(p.getString("gpu", "?") ?: "?", p.getString("api", "?") ?: "?", p.getInt("tex", 4096), FloatArray(6) { p.getFloat("r" + it, BLO[it]) }, p.getInt("cores", 4))
          }

          private const val BVS = """#version 300 es
          uniform vec4 uR;out vec2 vU;void main(){vec2 p=vec2(float(gl_VertexID&1),float(gl_VertexID>>1))*2.-1.;vU=p*.5+.5;gl_Position=vec4(uR.xy+p*uR.zw,0.,1.);}"""
          private const val BFS_FILL = """#version 300 es
          precision mediump float;uniform vec4 uC;out vec4 o;void main(){o=uC;}"""
          private const val BFS_FX = """#version 300 es
          precision highp float;in vec2 vU;uniform sampler2D uT;uniform vec2 uD;out vec4 o;
          void main(){vec4 a=vec4(0.);for(int i=-12;i<=12;i++){a+=texture(uT,vU+uD*float(i)*.0015)*(1.-abs(float(i))/13.);}o=a/7.;}"""

          /** A tiny offscreen GPU/CPU/RAM benchmark, ~2 s, runs once in its own GL context. */
          class BenchView(c: Context, st: BenchState, done: (BenchRes) -> Unit) : GLSurfaceView(c) {
              init {
                  setEGLContextClientVersion(3); setEGLConfigChooser(8, 8, 8, 0, 0, 0)
                  setRenderer(BenchRenderer(c, st, done)); renderMode = RENDERMODE_WHEN_DIRTY
              }
          }

          private class BenchRenderer(val ctx: Context, val st: BenchState, val done: (BenchRes) -> Unit) : GLSurfaceView.Renderer {
              private var ran = false
              override fun onSurfaceCreated(g: GL10?, c: EGLConfig?) {}
              override fun onSurfaceChanged(g: GL10?, w: Int, h: Int) {}
              override fun onDrawFrame(g: GL10?) {
                  if (ran) return
                  ran = true
                  val res = try { run() } catch (t: Throwable) { fallbackRes(ctx) }
                  Handler(Looper.getMainLooper()).post { done(res) }
              }

              private fun prog(fs: String): Int {
                  fun sh(t: Int, s: String): Int {
                      val h = G.glCreateShader(t); G.glShaderSource(h, s); G.glCompileShader(h)
                      val ok = IntArray(1); G.glGetShaderiv(h, G.GL_COMPILE_STATUS, ok, 0)
                      if (ok[0] == 0) throw RuntimeException(G.glGetShaderInfoLog(h))
                      return h
                  }
                  val p = G.glCreateProgram()
                  G.glAttachShader(p, sh(G.GL_VERTEX_SHADER, BVS)); G.glAttachShader(p, sh(G.GL_FRAGMENT_SHADER, fs)); G.glLinkProgram(p)
                  return p
              }
              private fun ms(f: () -> Unit): Float { G.glFinish(); val t = System.nanoTime(); f(); G.glFinish(); return (System.nanoTime() - t) / 1e6f }
              private fun avg(f: () -> Unit): Float { f(); return (ms(f) + ms(f)) / 2f }
              private fun per(x: Float, tm: Float) = x / (max(tm, .05f) / 1000f)
              private fun fin(i: Int, raw: FloatArray, v: Float) {
                  raw[i] = v; st.bars[i] = (ln(v / BLO[i]) / ln(BHI[i] / BLO[i])).coerceIn(0f, 1f); st.stage = i + 1
              }
              private fun quad() = G.glDrawArrays(G.GL_TRIANGLE_STRIP, 0, 4)

              private fun run(): BenchRes {
                  val n = 1024
                  val raw = FloatArray(6)
                  val gpu = G.glGetString(G.GL_RENDERER) ?: "gpu"
                  val api = G.glGetString(G.GL_VERSION) ?: "gl"
                  val mt = IntArray(1); G.glGetIntegerv(G.GL_MAX_TEXTURE_SIZE, mt, 0)
                  val t = IntArray(2); G.glGenTextures(2, t, 0)
                  val fb = IntArray(2); G.glGenFramebuffers(2, fb, 0)
                  for (i in 0..1) {
                      G.glBindTexture(G.GL_TEXTURE_2D, t[i])
                      G.glTexImage2D(G.GL_TEXTURE_2D, 0, G.GL_RGBA8, n, n, 0, G.GL_RGBA, G.GL_UNSIGNED_BYTE, null)
                      G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MIN_FILTER, G.GL_LINEAR); G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MAG_FILTER, G.GL_LINEAR)
                      G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_S, G.GL_CLAMP_TO_EDGE); G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_T, G.GL_CLAMP_TO_EDGE)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, fb[i])
                      G.glFramebufferTexture2D(G.GL_FRAMEBUFFER, G.GL_COLOR_ATTACHMENT0, G.GL_TEXTURE_2D, t[i], 0)
                  }
                  val va = IntArray(1); G.glGenVertexArrays(1, va, 0); G.glBindVertexArray(va[0])
                  G.glViewport(0, 0, n, n)

                  // 1 pixels: blended full-screen quads
                  val pf = prog(BFS_FILL); G.glUseProgram(pf); G.glBindFramebuffer(G.GL_FRAMEBUFFER, fb[0])
                  val uR = G.glGetUniformLocation(pf, "uR"); val uC = G.glGetUniformLocation(pf, "uC")
                  G.glUniform4f(uR, 0f, 0f, 1f, 1f); G.glUniform4f(uC, .01f, .01f, .01f, .02f)
                  G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                  fin(0, raw, per(25f, avg { repeat(24) { quad() } }))
                  // 2 brush: many small blended draws with changing uniforms
                  fin(1, raw, per(3f, avg {
                      for (i in 0 until 3000) { G.glUniform4f(uR, ((i * 37) % 100) / 50f - 1f, ((i * 91) % 100) / 50f - 1f, .03f, .03f); quad() }
                  }))
                  G.glDisable(G.GL_BLEND)
                  // 3 fx: 25-tap blur passes (like the filter panel)
                  val px = prog(BFS_FX); G.glUseProgram(px)
                  G.glUniform4f(G.glGetUniformLocation(px, "uR"), 0f, 0f, 1f, 1f); G.glUniform1i(G.glGetUniformLocation(px, "uT"), 0)
                  val uD = G.glGetUniformLocation(px, "uD")
                  fin(2, raw, per(4.2f, avg {
                      for (k in 0 until 4) {
                          G.glBindFramebuffer(G.GL_FRAMEBUFFER, fb[(k + 1) % 2]); G.glBindTexture(G.GL_TEXTURE_2D, t[k % 2])
                          if (k % 2 == 0) G.glUniform2f(uD, 1f, 0f) else G.glUniform2f(uD, 0f, 1f)
                          quad()
                      }
                  }))
                  // 4 gpu read-back (flood fill, save, eyedropper)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, fb[0])
                  val bb = ByteBuffer.allocateDirect(n * n * 4).order(ByteOrder.nativeOrder())
                  fin(3, raw, per(12f, avg { repeat(3) { G.glReadPixels(0, 0, n, n, G.GL_RGBA, G.GL_UNSIGNED_BYTE, bb) } }))
                  // 5 cpu
                  val arr = IntArray(1 shl 22); var sink = 0
                  fin(4, raw, per(8.4f, avg {
                      var s = 0
                      for (k in 0 until 2) for (i in arr.indices) { val x = arr[i]; if ((x and 1) == 0) { arr[i] = x + i; s += x } else arr[i] = x xor s }
                      sink += s
                  }))
                  // 6 ram
                  fin(5, raw, ramGb(ctx))
                  return BenchRes(gpu, api, mt[0], raw, Runtime.getRuntime().availableProcessors())
              }
          }
