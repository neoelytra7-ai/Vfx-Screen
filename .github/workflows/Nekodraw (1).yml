          """

          private const val FS_XB = """vec2 PX;
          vec4 S(vec2 q){return texture(uT,q);}
          vec4 Sb(vec2 q){if(q.x<0.||q.y<0.||q.x>1.||q.y>1.)return vec4(0.);return texture(uT,q);}
          vec4 un(vec4 c){return c.a>.001?vec4(c.rgb/c.a,c.a):vec4(0.);}
          vec4 pmul(vec4 c){return vec4(c.rgb*c.a,c.a);}
          float L(vec3 c){return dot(c,vec3(.299,.587,.114));}
          vec3 h2r(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}
          vec3 r2h(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1.0e-10;return vec3(abs(q.z+(q.w-q.x)/(6.*d+e)),d/(q.x+e),q.x);}
          float Lv(vec2 q){vec4 t=S(q);return L(t.rgb)+t.a*.35;}
          float edge(vec2 uv){vec2 d=PX;float tl=Lv(uv+d*vec2(-1.,1.)),t=Lv(uv+d*vec2(0.,1.)),tr=Lv(uv+d*vec2(1.,1.)),l=Lv(uv+d*vec2(-1.,0.)),rr=Lv(uv+d*vec2(1.,0.)),bl=Lv(uv+d*vec2(-1.,-1.)),b=Lv(uv+d*vec2(0.,-1.)),br=Lv(uv+d*vec2(1.,-1.));float gx=-tl-2.*l-bl+tr+2.*rr+br;float gy=-tl-2.*t-tr+bl+2.*b+br;return length(vec2(gx,gy));}
          const float B4[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
          void main(){
          vec2 uv=vU;PX=1./uSz;vec4 c=S(uv);vec4 u=un(c);vec4 r=c;float m=uM;float asp=uSz.x/uSz.y;vec2 A=vec2(asp,1.);bool cm=false;
          if(m<.5){}
          else if(m<1.5){u.rgb=(u.rgb-.5)*uP.y+.5+uP.x;cm=true;}
          else if(m<2.5){vec3 h=r2h(u.rgb);h.x=fract(h.x+uP.x/360.);h.y=clamp(h.y*uP.y,0.,1.);h.z*=uP.z;u.rgb=h2r(h);cm=true;}
          else if(m<3.5){u.rgb+=vec3(uP.x,-uP.y,-uP.x)*.15;cm=true;}
          else if(m<4.5){u.rgb=pow(clamp((u.rgb-uP.y)/max(uP.z-uP.y,.001),0.,1.),vec3(1./max(uP.x,.01)));cm=true;}
          else if(m<5.5){u.rgb=mix(u.rgb,1.-u.rgb,uP.x);cm=true;}
          else if(m<6.5){float g=L(u.rgb);u.rgb=mix(u.rgb,mix(vec3(g),vec3(g)*vec3(1.2,1.,.8),uP.y),uP.x);cm=true;}
          else if(m<7.5){u.rgb=mix(u.rgb,mix(uC1.rgb,uC2.rgb,L(u.rgb)),uP.x);cm=true;}
          else if(m<8.5){float g=L(u.rgb);vec3 t=g<.5?mix(uC1.rgb,uC2.rgb,g*2.):mix(uC2.rgb,uC3.rgb,g*2.-1.);u.rgb=mix(u.rgb,t,uP.x);cm=true;}
          else if(m<9.5){float n=max(floor(uP.x+.5),2.);u.rgb=floor(u.rgb*(n-1.)+.5)/(n-1.);cm=true;}
          else if(m<10.5){float t=smoothstep(uP.x-uP.y,uP.x+uP.y+.001,L(u.rgb));u.rgb=mix(uC1.rgb,uC2.rgb,t);cm=true;}
          else if(m<11.5){vec2 q=(uv-.5)*A;float v=smoothstep(uP.y,uP.y+uP.z+.001,length(q));u.rgb=mix(u.rgb,uC1.rgb,v*uP.x);cm=true;}
          else if(m<12.5){vec2 dd=(uv-.5)*uP.x*PX*2.;vec4 a=S(uv+dd),b=S(uv-dd);r=vec4(a.r,c.g,b.b,max(c.a,max(a.a,b.a)));}
          else if(m<13.5){u.rgb=mix(u.rgb,1.-u.rgb,step(uP.x,u.rgb));cm=true;}
          else if(m<14.5){vec2 cs=uP.x*PX;r=S((floor(uv/cs)+.5)*cs);}
          else if(m<15.5){float cs=max(uP.x,3.);float a=uP.y*.01745;mat2 R=mat2(cos(a),-sin(a),sin(a),cos(a));vec2 g=R*(uv*uSz)/cs;vec2 cell=floor(g)+.5;vec2 ctr=(cell*cs)*R/uSz;vec4 cu=un(S(ctr));float ink=cu.a*(.3+.7*(1.-L(cu.rgb)));float rad=.72*sqrt(clamp(ink,0.,1.));float aa2=.7/cs+.03;float mk=1.-smoothstep(rad-aa2,rad+aa2,length(g-cell));r=pmul(vec4(cu.rgb,cu.a*mk));}
          else if(m<16.5){float n=max(floor(uP.x+.5),2.);ivec2 ip=ivec2(mod(floor(gl_FragCoord.xy/max(uP.y,1.)),4.));float th=(B4[ip.y*4+ip.x]+.5)/16.-.5;u.rgb=floor(u.rgb*(n-1.)+th+.5)/(n-1.);cm=true;}
          else if(m<17.5){float a=uP.y*.01745;vec2 dv=vec2(cos(a),sin(a))*PX;float e=L(S(uv+dv).rgb)-L(S(uv-dv).rgb);u.rgb+=e*uP.x;cm=true;}
          else if(m<18.5){float e=clamp(edge(uv)*uP.x,0.,1.);r=mix(vec4(uC2.rgb*e,e),c,uP.y);}
          else if(m<19.5){float n=max(floor(uP.x+.5),2.);vec3 p=floor(u.rgb*n+.5)/n;float e=clamp(edge(uv)*uP.y,0.,1.)*u.a;u.rgb=mix(p,uC1.rgb,e);cm=true;}
          else if(m<20.5){float cs=max(uP.x,2.);vec2 g=uv*uSz/cs;vec2 ig=floor(g);float best=9.;vec2 bc=g;for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 nn=ig+vec2(float(i),float(j));vec2 pt=nn+vec2(hh(nn+uP.y),hh(nn+uP.y+7.3));float dd=length(g-pt);if(dd<best){best=dd;bc=pt;}}r=S(bc*cs/uSz);}
          else if(m<21.5){float by=floor(uv.y*uSz.y/max(uP.y,2.));float rn=hh(vec2(by,uP.z));float sh=step(.75,rn)*(hh(vec2(by,uP.z+1.))-.5)*uP.x*.25;vec2 q=vec2(uv.x+sh,uv.y);float ca=uP.x*.012*step(.55,rn);vec4 a=S(q+vec2(ca,0.)),b=S(q-vec2(ca,0.)),g=S(q);r=vec4(a.r,g.g,b.b,max(max(a.a,b.a),g.a));}
          else if(m<22.5){vec2 q=uv*2.-1.;q*=1.+dot(q,q)*uP.z*.12;vec2 w=q*.5+.5;vec4 s=Sb(w);float ln=.5+.5*sin(w.y*uSz.y*uP.x*1.5708);s*=1.-uP.y*(1.-ln);r=s;}
          else if(m<23.5){float n=hh(floor(gl_FragCoord.xy/max(uP.y,1.))+uP.z)-.5;u.rgb+=n*uP.x;cm=true;}
          else if(m<24.5){float R=uP.x;float st=max(1.,floor(R/3.));float best=1.0e9;vec3 res=c.rgb;for(int sec=0;sec<4;sec++){vec2 sg=vec2((sec&1)==0?-1.:1.,sec<2?-1.:1.);vec3 mean=vec3(0.),sq=vec3(0.);float cnt=0.;for(int j=0;j<4;j++){for(int i=0;i<4;i++){vec3 c3=S(uv+vec2(float(i),float(j))*st*sg*PX).rgb;mean+=c3;sq+=c3*c3;cnt+=1.;}}mean/=cnt;float vr=dot(sq/cnt-mean*mean,vec3(1.));if(vr<best){best=vr;res=mean;}}r=vec4(min(res,vec3(c.a)),c.a);}
          else if(m<25.5){float cs=28.*uS;vec2 g=gl_FragCoord.xy/cs;vec2 ig=floor(g);float sp=0.;if(hh(ig+uP.z)<uP.x){vec2 ctr=ig+.2+.6*vec2(hh(ig+3.1),hh(ig+5.7));vec2 q=(g-ctr)/(uP.y*.5*(.5+hh(ig+9.)));float v=sqrt(abs(q.x))+sqrt(abs(q.y));sp=1.-smoothstep(.85,1.,v);}r=vec4(uC2.rgb*sp,sp)+c*(1.-sp);}
          else if(m<26.5){float mk=patMask(int(uP.x+.5),gl_FragCoord.xy,max(uP.y,4.),0.)*uP.z;r=vec4(uC2.rgb*mk,mk)+c*(1.-mk);}
          else if(m<27.5){vec2 cn=vec2(uP.z,uP.w);vec2 q=(uv-cn)*A;float dd=length(q);float k=max(1.-dd/max(uP.y,.01),0.);float a=uP.x*k*k;vec2 q2=vec2(cos(a)*q.x-sin(a)*q.y,sin(a)*q.x+cos(a)*q.y);r=Sb(q2/A+cn);}
          else if(m<28.5){vec2 cn=vec2(uP.z,uP.w);vec2 q=(uv-cn)*A;float dd=length(q);float k=clamp(1.-dd/max(uP.y,.01),0.,1.);q*=1.-uP.x*k*k;r=Sb(q/A+cn);}
          else if(m<29.5){float f=uP.y*6.2832;vec2 q=uv+vec2(sin(uv.y*f+uP.z)*uP.x,uP.w*sin(uv.x*f+uP.z)*uP.x);r=Sb(q);}
          else if(m<30.5){vec2 q=uv*2.-1.;q*=1.+uP.x*dot(q,q);r=Sb(q*.5+.5);}
          else if(m<31.5){vec2 q=(uv-.5)*A;float a=atan(q.y,q.x)+uP.y;float sg=6.2832/max(uP.x,2.);a=mod(a,sg);a=abs(a-sg*.5);vec2 q2=length(q)*vec2(cos(a),sin(a));r=Sb(q2/A+.5);}
          else if(m<32.5){vec2 q=uv;int sl=int(uP.x+.5);if(sl==0||sl==4)q.x=q.x>.5?1.-q.x:q.x;if(sl==1)q.x=q.x<.5?1.-q.x:q.x;if(sl==2||sl==4)q.y=q.y>.5?1.-q.y:q.y;if(sl==3)q.y=q.y<.5?1.-q.y:q.y;r=S(q);}
          else if(m<33.5){r=S(fract(uv*max(uP.x,1.)));}
          else if(m<34.5){vec2 q=uv-.5;if(uP.x<.5){r=Sb(vec2(atan(q.y,q.x)/6.2832+.5,length(q)*2.));}else{float an=uv.x*6.2832;r=Sb(.5+uv.y*.5*vec2(cos(an),sin(an)));}}
          else if(m<35.5){vec4 acc=vec4(0.);float ws=0.;for(int i=-12;i<=12;i++){float t=float(i)/12.;float w=uP.y>.5?1.:exp(-t*t*3.);acc+=S(uv+uD*PX*t*uP.x)*w;ws+=w;}r=acc/ws;}
          else if(m<36.5){vec2 cn=vec2(uP.y,uP.z);vec2 dv=(uv-cn)*uP.x;vec4 acc=vec4(0.);for(int i=0;i<16;i++){acc+=S(uv-dv*(float(i)/15.));}r=acc/16.;}
          else if(m<37.5){float dist=abs(uv.y-uP.x);float bl=smoothstep(uP.y,uP.y+.3,dist)*uP.z;vec4 acc=vec4(0.);for(int i=0;i<20;i++){float a=float(i)*2.39996;float rr=sqrt(float(i)/20.)*bl;acc+=S(uv+vec2(cos(a),sin(a))*rr*PX);}r=acc/20.;}
          else if(m<38.5){vec4 acc=vec4(0.);for(int i=0;i<24;i++){float a=float(i)*2.39996;float rr=sqrt(float(i)/24.)*uP.x;acc+=S(uv+vec2(cos(a),sin(a))*rr*PX);}r=acc/24.;}
          else if(m<39.5){r=c*smoothstep(uP.x,uP.x+.25,L(c.rgb));}
          else if(m<40.5){vec4 bl=S(uv);vec4 og=texture(uO,uv);r=min(vec4(1.),og+bl*uP.x-og*bl*uP.x);}
          else{vec4 bl=S(uv);vec4 og=texture(uO,uv);r=clamp(og+(og-bl)*uP.x,0.,1.);r.rgb=min(r.rgb,vec3(r.a));}
          if(cm)r=pmul(vec4(clamp(u.rgb,0.,1.),u.a));
          o=r;}"""

          private const val FS_X = FS_XH + GLSL_PAT + FS_XB

          class Engine(
              val W: Int, val H: Int = W, val paper: Int = -1, val paperPat: Int = 0,
              val maxLayers: Int = 24, val tileBudget: Int = 160
          ) : GLSurfaceView.Renderer {
              @JvmField var tool = Tool.BRUSH
              val pen = Pen()
              @JvmField var liqMode = 0
              @JvmField var liqR = 140f
              @JvmField var liqS = 1f
              @JvmField var symMode = 0
              @JvmField var symN = 6
              @JvmField var cur = 0
              @JvmField var onPick: ((Int) -> Unit)? = null
              @Volatile var vw = 1
              @Volatile var vh = 1
              var zoom by mutableFloatStateOf(1f)
              var rot by mutableFloatStateOf(0f)
              @Volatile var px = 0f
              @Volatile var py = 0f
              private var rotRaw = 0f
              @JvmField var rotLock = false

              // ---- backdrop (set from the theme) ----
              @Volatile var bg = floatArrayOf(0f, 0f, 0f)
              @Volatile var patC = floatArrayOf(.3f, .2f, .25f)
              @Volatile var pat = 0
              @Volatile var patSz = 56f
              @Volatile var patAmt = .5f
              @Volatile var plx = .3f
              @Volatile var glowAmt = 0f
              @Volatile var glowBlur = .5f
              @Volatile var glowSpread = 1.6f
              @Volatile var glowSat = 1.3f
              @Volatile var glowDim = .6f
              @Volatile var bgAnim = 0f
              @Volatile var animFps = 24f
              @Volatile var rippleOn = true
              @Volatile var lastAct = 0L
              @Volatile private var ripT0 = -100000L
              @Volatile private var pulseT0 = -100000L
              @Volatile private var tpx = 0f
              @Volatile private var tpy = 0f
              private var animT = 0f; private var pulseV = 0f; private var ripS = 0f; private var ripR = 0f

              // ---- UI-observable state (written on the GL thread, read by Compose) ----
              var info by mutableStateOf(listOf<LI>())
              var curUi by mutableIntStateOf(0)
              var canUndo by mutableStateOf(false)
              var canRedo by mutableStateOf(false)
              var busy by mutableStateOf(false)
              var fxOk by mutableStateOf(true)
              @Volatile var fxOn = false
              @Volatile var fxHq = false

              private val layers = ArrayList<Layer>()
              private val uStack = ArrayDeque<Step>()
              private val rStack = ArrayDeque<Step>()
              private var step: Step? = null
              private var tiles = 0
              private var grpN = 0
              private var warped = false
              private var checker = false
              private lateinit var pB: P; private lateinit var pS: P; private lateinit var pG: P
              private lateinit var pC: P; private lateinit var pL: P; private lateinit var pD: P
              private lateinit var cp: P
              private var pP: P? = null; private var pK: P? = null; private var pF: P? = null
              private var pGlow: P? = null; private var pGB: P? = null; private var pX: P? = null
              private lateinit var map: Layer
              private var dTex = 0; private var dFbo = 0; private var sTex = 0; private var sFbo = 0; private var tFbo = 0
              private var xTex = 0; private var xFbo = 0                    // full-res overlay / fx scratch (lazy)
              private var gA = 0; private var gAF = 0; private var gB = 0; private var gBF = 0; private var gw = 96; private var gh = 96
              private var glowDirty = true; private var lastGlow = 0L
              private val rng = 128f
              private var lx = 0f; private var ly = 0f; private var acc = 0f
              private var sx = 0f; private var sy = 0f; private var x0 = 0f; private var y0 = 0f
              private var pdx = 0f; private var pdy = 0f; private var mox = 0f; private var moy = 0f
              private var liqX0 = 0; private var liqY0 = 0; private var liqX1 = 0; private var liqY1 = 0
              private var ovMode = false; private var ovOn = false; private var pvDirty = false
              private var seeded = false; private var rs = 12345L

              private fun rnd(): Float {
                  if (!seeded) return Random.nextFloat()
                  rs = rs * 6364136223846793005L + 1442695040888963407L
                  return ((rs ushr 40).toInt() and 0xFFFFFF) / 16777216f
              }

              private fun sync() {
                  info = layers.map { LI(it.show, it.alpha, it.blend) }; curUi = cur
                  canUndo = uStack.isNotEmpty(); canRedo = rStack.isNotEmpty(); glowDirty = true
              }

              // ---- live-feedback hooks (UI thread) ----
              fun ripple(sx: Float, sy: Float) { tpx = sx; tpy = vh - sy; ripT0 = SystemClock.uptimeMillis(); lastAct = ripT0 }
              fun pulse() { pulseT0 = SystemClock.uptimeMillis(); lastAct = pulseT0 }
              fun needFrames(): Boolean {
                  val n = SystemClock.uptimeMillis()
                  return (bgAnim > .01f && animFps > 0f) || n - ripT0 < 1000 || n - pulseT0 < 1000
              }

              // ---------- GL helpers ----------
              private fun tex(f: Int, w: Int = W, h: Int = H): Int {
                  val t = IntArray(1); G.glGenTextures(1, t, 0); G.glBindTexture(G.GL_TEXTURE_2D, t[0])
                  G.glTexImage2D(G.GL_TEXTURE_2D, 0, G.GL_RGBA8, w, h, 0, G.GL_RGBA, G.GL_UNSIGNED_BYTE, null)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MIN_FILTER, f)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MAG_FILTER, f)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_S, G.GL_CLAMP_TO_EDGE)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_T, G.GL_CLAMP_TO_EDGE)
                  return t[0]
              }
              private fun fbo(t: Int): Int {
                  val f = IntArray(1); G.glGenFramebuffers(1, f, 0); G.glBindFramebuffer(G.GL_FRAMEBUFFER, f[0])
                  G.glFramebufferTexture2D(G.GL_FRAMEBUFFER, G.GL_COLOR_ATTACHMENT0, G.GL_TEXTURE_2D, t, 0)
                  return f[0]
              }
              private fun delTex(t: Int) = G.glDeleteTextures(1, intArrayOf(t), 0)
              private fun delFbo(f: Int) = G.glDeleteFramebuffers(1, intArrayOf(f), 0)
              private fun prog(fs: String, vs: String = VS): P {
                  fun sh(t: Int, s: String): Int {
                      val h = G.glCreateShader(t); G.glShaderSource(h, s); G.glCompileShader(h)
                      val ok = IntArray(1); G.glGetShaderiv(h, G.GL_COMPILE_STATUS, ok, 0)
                      if (ok[0] == 0) throw RuntimeException(G.glGetShaderInfoLog(h))
                      return h
                  }
                  val p = G.glCreateProgram()
                  G.glAttachShader(p, sh(G.GL_VERTEX_SHADER, vs)); G.glAttachShader(p, sh(G.GL_FRAGMENT_SHADER, fs))
                  G.glLinkProgram(p)
                  val ls = IntArray(1); G.glGetProgramiv(p, G.GL_LINK_STATUS, ls, 0)
                  if (ls[0] == 0) throw RuntimeException(G.glGetProgramInfoLog(p))
                  return P(p)
              }
              private fun tryProg(fs: String, vs: String = VS): P? = try { prog(fs, vs) } catch (t: Throwable) { null }
              private fun quad() = G.glDrawArrays(G.GL_TRIANGLE_STRIP, 0, 4)
              private fun ch(c: Int, s: Int) = ((c shr s) and 255) / 255f
              private fun blend(m: Int) {
                  when (m) {
                      1 -> G.glBlendFuncSeparate(G.GL_DST_COLOR, G.GL_ONE_MINUS_SRC_ALPHA, G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      2 -> G.glBlendFuncSeparate(G.GL_ONE, G.GL_ONE_MINUS_SRC_COLOR, G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      3 -> G.glBlendFuncSeparate(G.GL_ONE, G.GL_ONE, G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      else -> G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                  }
              }
              private fun clearMapBox(bx0: Int, by0: Int, bx1: Int, by1: Int) {
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, dFbo)
                  G.glEnable(G.GL_SCISSOR_TEST); G.glScissor(bx0, by0, bx1 - bx0, by1 - by0)
                  G.glClearColor(128 / 255f, 0f, 128 / 255f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  G.glDisable(G.GL_SCISSOR_TEST)
              }
              private fun pm(p: P, n: String, c: Int, fade: Boolean = false) {
                  val a = pen.opacity
                  if (fade) G.glUniform4f(p.u(n), 0f, 0f, 0f, 0f) else G.glUniform4f(p.u(n), ch(c, 16) * a, ch(c, 8) * a, ch(c, 0) * a, a)
              }
              private fun ensureX() { if (xTex == 0) { xTex = tex(G.GL_LINEAR); xFbo = fbo(xTex) } }

              // ---------- undo: tile copy-on-write, steps can be grouped ----------
              private fun beginStep(l: Layer) { step = Step(l) }
              private fun touch(tx0: Int, ty0: Int, tx1: Int, ty1: Int) {
                  val s = step ?: return
                  val nx = W / TS
                  for (ty in (ty0 / TS)..((ty1 - 1) / TS)) for (tx in (tx0 / TS)..((tx1 - 1) / TS)) {
                      val k = ty * nx + tx
                      if (s.t.containsKey(k)) continue
                      val t = tex(G.GL_NEAREST, TS, TS)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, s.l.fbo)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, tx * TS, ty * TS, TS, TS)
                      s.t[k] = t; tiles++
                  }
              }
              private fun dropTiles(s: Step) { for (t in s.t.values) delTex(t); tiles -= s.t.size }
              private fun commitStep(g: Int = 0) {
                  val s = step ?: return
                  step = null
                  if (s.t.isEmpty()) return
                  s.grp = g
                  uStack.addLast(s)
                  for (r in rStack) dropTiles(r)
                  rStack.clear()
                  while (tiles > tileBudget && uStack.size > 1) dropTiles(uStack.removeFirst())
                  sync()
              }
              private fun swap(s: Step): Step {
                  val r = Step(s.l); r.grp = s.grp; val nx = W / TS
                  for ((k, t) in s.t) {
                      val tx = k % nx; val ty = k / nx
                      val n = tex(G.GL_NEAREST, TS, TS)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, s.l.fbo)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, tx * TS, ty * TS, TS, TS)
                      r.t[k] = n
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, tFbo)
                      G.glFramebufferTexture2D(G.GL_FRAMEBUFFER, G.GL_COLOR_ATTACHMENT0, G.GL_TEXTURE_2D, t, 0)
                      G.glBindTexture(G.GL_TEXTURE_2D, s.l.tex)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, tx * TS, ty * TS, 0, 0, TS, TS)
                      delTex(t)
                  }
                  return r
              }
              fun undo() {
                  val s = uStack.removeLastOrNull() ?: return
                  val g = s.grp; rStack.addLast(swap(s))
                  if (g != 0) while (uStack.isNotEmpty() && uStack.last().grp == g) rStack.addLast(swap(uStack.removeLast()))
                  sync()
              }
              fun redo() {
                  val s = rStack.removeLastOrNull() ?: return
                  val g = s.grp; uStack.addLast(swap(s))
                  if (g != 0) while (rStack.isNotEmpty() && rStack.last().grp == g) uStack.addLast(swap(rStack.removeLast()))
                  sync()
              }
              private fun clearHistory() {
                  for (s in uStack) dropTiles(s); for (s in rStack) dropTiles(s)
                  uStack.clear(); rStack.clear(); sync()
              }

              // ---------- layers ----------
              fun addLayer(fill: Boolean = false, below: Boolean = false) {
                  if (layers.size >= maxLayers) return
                  val t = tex(G.GL_LINEAR); val f = fbo(t)
                  if (fill) G.glClearColor(1f, 1f, 1f, 1f) else G.glClearColor(0f, 0f, 0f, 0f)
                  G.glClear(G.GL_COLOR_BUFFER_BIT)
                  val at = if (layers.isEmpty()) 0 else if (below) cur else cur + 1
                  layers.add(at, Layer(t, f)); cur = at; sync()
              }
              private fun blit(s: Layer, d: Layer, a: Float, bm: Int) {
                  compUniforms(0f)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, d.fbo); G.glViewport(0, 0, W, H); G.glUniform1f(pC.u("uA"), a)
                  if (bm < 0) G.glDisable(G.GL_BLEND) else { G.glEnable(G.GL_BLEND); blend(bm) }
                  G.glBindTexture(G.GL_TEXTURE_2D, s.tex); quad(); G.glDisable(G.GL_BLEND)
              }
              private fun delGl(l: Layer) { delTex(l.tex); delFbo(l.fbo) }
              private fun purge(l: Layer) { for (q in arrayOf(uStack, rStack)) q.removeAll { if (it.l === l) { dropTiles(it); true } else false } }
              fun select(i: Int) { if (i in layers.indices) { cur = i; sync() } }
              fun setShow(i: Int, b: Boolean) { layers.getOrNull(i)?.show = b; sync() }
              fun setAlpha(i: Int, a: Float) { layers.getOrNull(i)?.alpha = a; sync() }
              fun setBlend(i: Int, m: Int) { layers.getOrNull(i)?.blend = m; sync() }
              fun solo(i: Int) {
                  if (i !in layers.indices) return
                  val others = layers.indices.filter { it != i }
                  if (others.all { !layers[it].show }) layers.forEach { it.show = true }
                  else layers.forEachIndexed { k, l -> l.show = k == i }
                  sync()
              }
              fun delLayer() {
                  if (layers.size <= 1) return
                  val l = layers.removeAt(cur); purge(l); delGl(l); cur = min(cur, layers.size - 1); sync()
              }
              fun delHidden() {
                  val gone = layers.filter { !it.show }
                  if (gone.isEmpty() || gone.size >= layers.size) return
                  for (l in gone) { purge(l); delGl(l); layers.remove(l) }
                  cur = cur.coerceIn(0, layers.size - 1); sync()
              }
              fun dupLayer() {
                  if (layers.size >= maxLayers) return
                  val s = layers[cur]; addLayer(); val d = layers[cur]
                  blit(s, d, 1f, -1); d.alpha = s.alpha; d.blend = s.blend; d.show = s.show; sync()
              }
              fun mergeDown() {
                  if (cur <= 0) return
                  val s = layers[cur]; blit(s, layers[cur - 1], s.alpha, s.blend)
                  layers.removeAt(cur); delGl(s); cur--; clearHistory()
              }
              fun flatten() { delHidden(); while (layers.size > 1) { cur = layers.size - 1; mergeDown() } }
              fun moveLayer(dir: Int) {
                  val j = cur + dir
                  if (j !in layers.indices) return
                  java.util.Collections.swap(layers, cur, j); cur = j; sync()
              }
              fun moveLayerTo(top: Boolean) {
                  val l = layers.removeAt(cur)
                  if (top) { layers.add(l); cur = layers.size - 1 } else { layers.add(0, l); cur = 0 }
                  sync()
              }
              fun clearLayer() {
                  val l = layers[cur]; beginStep(l); touch(0, 0, W, H)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo); G.glClearColor(0f, 0f, 0f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  commitStep()
              }
              fun fillLayerColor() {
                  val l = layers[cur]; beginStep(l); touch(0, 0, W, H)
                  val a = pen.opacity
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo)
                  G.glClearColor(ch(pen.color, 16) * a, ch(pen.color, 8) * a, ch(pen.color, 0) * a, a); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  commitStep()
              }

              // ---------- view transform (pan / zoom / free rotation) ----------
              private fun sc() = min(vw.toFloat() / W, vh.toFloat() / H) * zoom
              private fun snap(r: Float): Float {
                  val q = r / (PIF / 2f); val k = Math.round(q).toFloat()
                  return if (abs(q - k) * 90f < 3.5f) k * PIF / 2f else r
              }
              fun cx(tx: Float, ty: Float): Float {
                  val dx = tx - (vw / 2f + px); val dy = ty - (vh / 2f + py)
                  return (cos(rot) * dx + sin(rot) * dy) / sc() + W / 2f
              }
              fun cy(tx: Float, ty: Float): Float {
                  val dx = tx - (vw / 2f + px); val dy = ty - (vh / 2f + py)
                  return H / 2f - (-sin(rot) * dx + cos(rot) * dy) / sc()
              }
              /** Two-finger transform: keeps the canvas point under the old midpoint glued to the new midpoint. */
              fun gesture(omx: Float, omy: Float, nmx: Float, nmy: Float, f: Float, dr: Float) {
                  val s0 = sc(); val c0 = cos(rot); val n0 = sin(rot)
                  val dx = omx - (vw / 2f + px); val dy = omy - (vh / 2f + py)
                  val lx2 = (c0 * dx + n0 * dy) / s0; val ly2 = (-n0 * dx + c0 * dy) / s0
                  zoom = (zoom * f).coerceIn(.05f, 40f)
                  if (!rotLock) { rotRaw += dr; rot = snap(rotRaw) }
                  val s1 = sc(); val c1 = cos(rot); val n1 = sin(rot)
                  px = nmx - (c1 * lx2 - n1 * ly2) * s1 - vw / 2f
                  py = nmy - (n1 * lx2 + c1 * ly2) * s1 - vh / 2f
              }
              fun resetView() { zoom = 1f; px = 0f; py = 0f; rot = 0f; rotRaw = 0f }
              fun resetRot() { rot = 0f; rotRaw = 0f }

              // ---------- renderer ----------
              private fun drawPattern(p: P, b: FloatArray, pc: FloatArray, id: Int, cs: Float, amt: Float, ox: Float, oy: Float, live: Boolean, ov: Boolean) {
                  G.glUseProgram(p.id)
                  if (ov) { G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA) } else G.glDisable(G.GL_BLEND)
                  G.glUniform4f(p.u("uR"), 0f, 0f, 1f, 1f)
                  G.glUniform4f(p.u("uBg"), b[0], b[1], b[2], 1f); G.glUniform4f(p.u("uPc"), pc[0], pc[1], pc[2], 1f)
                  G.glUniform3f(p.u("uK"), id.toFloat(), cs, amt); G.glUniform2f(p.u("uOf"), ox, oy)
                  if (live) { G.glUniform4f(p.u("uT"), animT, pulseV, ripS, ripR); G.glUniform2f(p.u("uTp"), tpx, tpy) }
                  else { G.glUniform4f(p.u("uT"), 0f, 0f, 0f, 0f); G.glUniform2f(p.u("uTp"), 0f, 0f) }
                  G.glUniform1f(p.u("uOv"), if (ov) 1f else 0f)
                  quad(); G.glDisable(G.GL_BLEND)
              }

              private fun paintPaper(l: Layer) {
                  val a = (paper ushr 24) / 255f
                  val r = ch(paper, 16); val g = ch(paper, 8); val b = ch(paper, 0)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo); G.glViewport(0, 0, W, H)
                  G.glClearColor(r * a, g * a, b * a, a); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  val pp = pP
                  if (a > .99f && paperPat > 0 && pp != null) {
                      val dark = (r * .3f + g * .59f + b * .11f) < .5f
                      val k = if (dark) 1.5f else .82f; val o = if (dark) .12f else 0f
                      drawPattern(pp, floatArrayOf(r, g, b), floatArrayOf(min(1f, r * k + o), min(1f, g * k + o), min(1f, b * k + o)), paperPat, 32f, .6f, 0f, 0f, false, false)
                  }
                  checker = a < .99f
              }

              override fun onSurfaceCreated(g: GL10?, c: EGLConfig?) {
                  val a = IntArray(1); G.glGenVertexArrays(1, a, 0); G.glBindVertexArray(a[0])
                  pB = prog(FS_B); pS = prog(FS_S); pG = prog(FS_G); pC = prog(FS_C); pL = prog(FS_L); pD = prog(FS_C, VSD)
                  pP = tryProg(FS_P); pK = tryProg(FS_K, VSD); pF = tryProg(FS_SH); pGlow = tryProg(FS_GLOW); pGB = tryProg(FS_GB)
                  pX = null; fxTried = false; fxOn = false; ovOn = false; xTex = 0; xFbo = 0
                  dTex = tex(G.GL_NEAREST); dFbo = fbo(dTex); sTex = tex(G.GL_LINEAR); sFbo = fbo(sTex)
                  G.glGenFramebuffers(1, a, 0); tFbo = a[0]
                  gw = if (W >= H) 96 else max(8, 96 * W / H); gh = if (W >= H) max(8, 96 * H / W) else 96
                  gA = tex(G.GL_LINEAR, gw, gh); gAF = fbo(gA); gB = tex(G.GL_LINEAR, gw, gh); gBF = fbo(gB)
                  map = Layer(dTex, dFbo); clearMapBox(0, 0, W, H)
                  layers.clear(); uStack.clear(); rStack.clear(); tiles = 0; step = null; warped = false; cur = 0; glowDirty = true
                  addLayer(true); paintPaper(layers[0]); addLayer()
              }
              override fun onSurfaceChanged(g: GL10?, w: Int, h: Int) { vw = w; vh = h }

              private fun compUniforms(w: Float, p: P = pC) {
                  cp = p
                  G.glUseProgram(p.id); G.glUniform1i(p.u("uL"), 0); G.glUniform1i(p.u("uD"), 1)
                  G.glUniform2f(p.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform1f(p.u("uRng"), rng)
                  G.glUniform1f(p.u("uW"), w); G.glUniform1f(p.u("uA"), 1f); G.glUniform2f(p.u("uO"), 0f, 0f)
                  G.glUniform4f(p.u("uR"), 0f, 0f, 1f, 1f)
                  G.glActiveTexture(G.GL_TEXTURE1); G.glBindTexture(G.GL_TEXTURE_2D, dTex); G.glActiveTexture(G.GL_TEXTURE0)
              }
              private fun drawLayers() {
                  G.glEnable(G.GL_BLEND)
                  for ((i, l) in layers.withIndex()) if (l.show) {
                      blend(l.blend)
                      G.glBindTexture(G.GL_TEXTURE_2D, if (fxOn && fxValid && i == cur) (if (fxFull) xTex else pvAT) else l.tex)
                      G.glUniform1f(cp.u("uA"), l.alpha)
                      val mv = tool == Tool.MOVE && i == cur
                      G.glUniform2f(cp.u("uO"), if (mv) mox else 0f, if (mv) moy else 0f); quad()
                      if (ovOn && i == cur) {
                          blend(0); G.glBindTexture(G.GL_TEXTURE_2D, xTex); G.glUniform2f(cp.u("uO"), 0f, 0f); quad()
                      }
                  }
                  G.glDisable(G.GL_BLEND)
              }
              private fun composite() {
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H)
                  G.glClearColor(0f, 0f, 0f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  compUniforms(if (warped) 1f else 0f); drawLayers()
              }

              /** tiny blurred copy of the whole canvas (all layers) used as an ambient backdrop */
              private fun updateGlow() {
                  val gb = pGB ?: return
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, gAF); G.glViewport(0, 0, gw, gh)
                  G.glClearColor(0f, 0f, 0f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  compUniforms(if (warped) 1f else 0f); drawLayers()
                  G.glUseProgram(gb.id); G.glUniform4f(gb.u("uR"), 0f, 0f, 1f, 1f); G.glUniform1i(gb.u("uT"), 0); G.glDisable(G.GL_BLEND)
                  val sp = 1f + glowBlur * 3f
                  for (k in 0 until (if (glowBlur > .55f) 2 else 1)) {
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, gBF); G.glBindTexture(G.GL_TEXTURE_2D, gA)
                      G.glUniform2f(gb.u("uD"), sp / gw, 0f); quad()
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, gAF); G.glBindTexture(G.GL_TEXTURE_2D, gB)
                      G.glUniform2f(gb.u("uD"), 0f, sp / gh); quad()
                  }
                  glowDirty = false
              }

              override fun onDrawFrame(g: GL10?) {
                  val now = SystemClock.uptimeMillis()
                  if (fxDirty) { fxDirty = false; fxRender(false) }
                  if (pvDirty) { pvDirty = false; previewShape() }
                  val gp = pGlow; val gb = pGB
                  val glowOn = glowAmt > .01f && gp != null && gb != null
                  if (glowOn && glowDirty && (now - lastGlow > 90 || !busy)) { updateGlow(); lastGlow = now }
                  animT = if (bgAnim > .01f) (now % 600000L) / 1000f * bgAnim else 0f
                  pulseV = (1f - (now - pulseT0) / 900f).coerceIn(0f, 1f).let { it * it }
                  val age = now - ripT0
                  ripS = if (rippleOn && bgAnim > .01f) (1f - age / 900f).coerceIn(0f, 1f) * .9f else 0f
                  ripR = age * .55f
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, 0); G.glViewport(0, 0, vw, vh)
                  val b = bg; val pp = pP
                  val s = sc(); val hx = W * s / 2f; val hy = H * s / 2f
                  if (glowOn && gp != null) {
                      G.glUseProgram(gp.id); G.glDisable(G.GL_BLEND)
                      G.glActiveTexture(G.GL_TEXTURE0); G.glBindTexture(G.GL_TEXTURE_2D, gA); G.glUniform1i(gp.u("uG"), 0)
                      G.glUniform2f(gp.u("uVp"), vw.toFloat(), vh.toFloat()); G.glUniform2f(gp.u("uCt"), vw / 2f + px, vh / 2f + py)
                      G.glUniform2f(gp.u("uHf"), hx, hy); G.glUniform2f(gp.u("uRt"), cos(rot), sin(rot))
                      G.glUniform4f(gp.u("uBg"), b[0], b[1], b[2], 1f); G.glUniform4f(gp.u("uA"), glowAmt, glowSpread, glowSat, glowDim)
                      G.glUniform4f(gp.u("uT"), animT, pulseV, 0f, 0f); G.glUniform4f(gp.u("uR"), 0f, 0f, 1f, 1f); quad()
                      if (pat > 0 && pp != null) drawPattern(pp, b, patC, pat, patSz, patAmt, -px * plx, py * plx, true, true)
                  } else if (pp != null) drawPattern(pp, b, patC, pat, patSz, patAmt, -px * plx, py * plx, true, false)
                  else { G.glClearColor(b[0], b[1], b[2], 1f); G.glClear(G.GL_COLOR_BUFFER_BIT) }
                  compUniforms(if (warped) 1f else 0f, pD)
                  G.glUniform2f(pD.u("uVp"), vw.toFloat(), vh.toFloat()); G.glUniform2f(pD.u("uCt"), vw / 2f + px, vh / 2f + py)
                  G.glUniform2f(pD.u("uHf"), hx, hy); G.glUniform2f(pD.u("uRt"), cos(rot), sin(rot))
                  val pk = pK
                  if (checker && pk != null) {
                      G.glUseProgram(pk.id)
                      G.glUniform2f(pk.u("uVp"), vw.toFloat(), vh.toFloat()); G.glUniform2f(pk.u("uCt"), vw / 2f + px, vh / 2f + py)
                      G.glUniform2f(pk.u("uHf"), hx, hy); G.glUniform2f(pk.u("uRt"), cos(rot), sin(rot))
                      G.glUniform2f(pk.u("uSz"), W.toFloat(), H.toFloat()); G.glDisable(G.GL_BLEND); quad()
                      G.glUseProgram(pD.id)
                  }
                  drawLayers()
              }

              // ---------- input (GL thread; x,y canvas px, y up) ----------
              private inline fun sym(x: Float, y: Float, a: Float, f: (Float, Float, Float) -> Unit) {
                  f(x, y, a)
                  when (symMode) {
                      1 -> f(W - x, y, PIF - a)
                      2 -> f(x, H - y, -a)
                      3 -> { f(W - x, y, PIF - a); f(x, H - y, -a); f(W - x, H - y, PIF + a) }
                      4 -> {
                          val cx0 = W / 2f; val cy0 = H / 2f
                          for (k in 1 until symN) {
                              val t = 2.0 * PI * k / symN; val c = cos(t).toFloat(); val s = sin(t).toFloat()
                              f(cx0 + (x - cx0) * c - (y - cy0) * s, cy0 + (x - cx0) * s + (y - cy0) * c, a + t.toFloat())
                          }
                      }
                  }
              }

              fun begin(x: Float, y: Float, p: Float) {
                  if (fxOn) return
                  commitStep()
                  if (warped && tool != Tool.LIQUIFY) bake()
                  busy = true
                  x0 = x; y0 = y; sx = x; sy = y; lx = x; ly = y; acc = 0f; pdx = x; pdy = y
                  when (tool) {
                      Tool.FILL -> fill(x.toInt(), y.toInt())
                      Tool.PICK -> pick(x.toInt(), y.toInt())
                      Tool.LIQUIFY -> { liqX0 = W; liqY0 = H; liqX1 = 0; liqY1 = 0 }
                      Tool.MOVE -> { beginStep(layers[cur]); mox = 0f; moy = 0f }
                      Tool.GRAD, Tool.LINE, Tool.RECT, Tool.OVAL -> beginStep(layers[cur])
                      else -> { beginStep(layers[cur]); dab(x, y, p, pen.angle * PIF / 180f) }
                  }
                  glowDirty = true
              }

              fun move(x: Float, y: Float, p: Float) {
                  if (fxOn) return
                  when (tool) {
                      Tool.FILL -> {}
                      Tool.PICK -> pick(x.toInt(), y.toInt())
                      Tool.LIQUIFY -> { val dx = x - lx; val dy = y - ly; if (hypot(dx, dy) >= .5f) { push(x, y, dx, dy); lx = x; ly = y } }
                      Tool.MOVE -> { mox = (x - x0).roundToInt().toFloat(); moy = (y - y0).roundToInt().toFloat() }
                      Tool.GRAD, Tool.LINE, Tool.RECT, Tool.OVAL -> { sx = x; sy = y; pvDirty = true }
                      else -> {
                          val k = pen.smooth.coerceIn(0f, .95f)
                          sx += (x - sx) * (1f - k); sy += (y - sy) * (1f - k); seg(sx, sy, p)
                      }
                  }
              }

              fun end() {
                  if (fxOn) return
                  when (tool) {
                      Tool.GRAD, Tool.LINE, Tool.RECT, Tool.OVAL -> { ovOn = false; pvDirty = false; seeded = true; rs = 12345L; drawShape(); seeded = false }
                      Tool.MOVE -> commitMove()
                      Tool.LIQUIFY -> finishLiquify()
                      else -> {}
                  }
                  commitStep(); busy = false; glowDirty = true
              }

              /** Cancel the running stroke: restores the touched tiles, leaves history untouched. */
              fun abort() {
                  val st = step; step = null; busy = false; mox = 0f; moy = 0f; ovOn = false; pvDirty = false
                  if (tool == Tool.LIQUIFY && warped) { clearMapBox(0, 0, W, H); warped = false }
                  if (st != null && st.t.isNotEmpty()) { val r = swap(st); dropTiles(r) }
                  glowDirty = true
              }

              private fun seg(x: Float, y: Float, p: Float) {
                  val dx = x - lx; val dy = y - ly; val d = hypot(dx, dy)
                  if (d < .01f) return
                  val ang = if (pen.follow) atan2(dy, dx) else pen.angle * PIF / 180f
                  var st = max(1f, pen.size * pen.spacing)
                  if (ovMode) st = max(st, d / 150f)       // cheap preview: capped stamp count per segment
                  var t = st - acc
                  while (t <= d) { dab(lx + dx * t / d, ly + dy * t / d, p, ang); t += st }
                  acc = d - (t - st); lx = x; ly = y
              }

              private fun dab(x: Float, y: Float, p: Float, a: Float) {
                  if (tool == Tool.SMUDGE) { stamp(x, y, p, a); return }
                  sym(x, y, a) { xx, yy, aa -> stamp(xx, yy, p, aa) }
              }

              private fun stamp(x: Float, y: Float, p: Float, a: Float) {
                  val l = layers[cur]
                  val pp = p.coerceIn(0f, 1f).pow(max(.05f, pen.pCurve))
                  val r = max(.5f, pen.size / 2f * (1f - pen.pSize + pen.pSize * pp) * (1f - pen.sizeJit * rnd()))
                  val op = pen.opacity * (1f - pen.pOp + pen.pOp * pp) * (1f - pen.opJit * rnd())
                  var cx = x; var cy = y
                  if (pen.scatter > 0f) {
                      val t = rnd() * 2f * PIF; val q = rnd() * pen.scatter * r * 2f
                      cx += cos(t) * q; cy += sin(t) * q
                  }
                  val flt = !ovMode && (tool == Tool.SMUDGE || tool == Tool.BLUR)
                  val fd = if (flt && tool == Tool.SMUDGE) hypot(cx - pdx, cy - pdy) else if (flt) pen.blurR else 0f
                  val pad = ceil(r + fd).toInt() + 3
                  val bx0 = max(0, floor(cx).toInt() - pad); val bx1 = min(W, ceil(cx).toInt() + pad)
                  val by0 = max(0, floor(cy).toInt() - pad); val by1 = min(H, ceil(cy).toInt() + pad)
                  if (bx1 <= bx0 || by1 <= by0) return
                  if (!ovMode) touch(bx0, by0, bx1, by1)
                  G.glActiveTexture(G.GL_TEXTURE0)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, if (ovMode) xFbo else l.fbo); G.glViewport(0, 0, W, H)
                  val rx = cx * 2f / W - 1f; val ry = cy * 2f / H - 1f; val rw = 2f * r / W; val rh = 2f * r / H
                  if (flt) {
                      G.glBindTexture(G.GL_TEXTURE_2D, sTex)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, bx0, by0, bx0, by0, bx1 - bx0, by1 - by0)
                      G.glUseProgram(pS.id); G.glUniform1i(pS.u("uT"), 0); G.glUniform4f(pS.u("uR"), rx, ry, rw, rh)
                      G.glUniform2f(pS.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform2f(pS.u("uD"), cx - pdx, cy - pdy)
                      G.glUniform4f(pS.u("uQ"), min(pen.hardness, .98f), 0f, 0f, 0f)
                      G.glUniform1f(pS.u("uM"), if (tool == Tool.SMUDGE) 0f else 1f)
                      G.glUniform1f(pS.u("uS"), op); G.glUniform1f(pS.u("uBr"), pen.blurR)
                      G.glDisable(G.GL_BLEND); quad(); pdx = cx; pdy = cy
                  } else {
                      G.glUseProgram(pB.id); G.glUniform4f(pB.u("uR"), rx, ry, rw, rh)
                      G.glUniform4f(pB.u("uC"), ch(pen.color, 16), ch(pen.color, 8), ch(pen.color, 0), op)
                      G.glUniform4f(pB.u("uQ"), min(pen.hardness, .98f), pen.round.coerceIn(.05f, 1f), a, pen.grain)
                      G.glUniform2f(pB.u("uG"), max(1f, pen.grainScale), if (tool == Tool.DODGE || tool == Tool.BURN) 1f else 0f)
                      G.glEnable(G.GL_BLEND)
                      when (tool) {
                          Tool.ERASER -> G.glBlendFunc(G.GL_ZERO, G.GL_ONE_MINUS_SRC_ALPHA)
                          Tool.DODGE -> G.glBlendFuncSeparate(G.GL_ONE, G.GL_ONE, G.GL_ZERO, G.GL_ONE)
                          Tool.BURN -> G.glBlendFuncSeparate(G.GL_ZERO, G.GL_ONE_MINUS_SRC_COLOR, G.GL_ZERO, G.GL_ONE)
                          else -> G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      }
                      quad(); G.glDisable(G.GL_BLEND)
                  }
                  glowDirty = true
              }

              // ---------- shapes & gradient with instant overlay preview ----------
              private fun tgtFbo(): Int = if (ovMode) xFbo else layers[cur].fbo

              private fun previewShape() {
                  ensureX()
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, xFbo); G.glViewport(0, 0, W, H)
                  G.glClearColor(0f, 0f, 0f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  ovMode = true; seeded = true; rs = 12345L
                  drawShape()
                  ovMode = false; seeded = false; ovOn = true; glowDirty = true
              }

              private fun drawShape() {
                  when (tool) {
                      Tool.GRAD -> gradient(x0, y0, sx, sy)
                      Tool.LINE -> { lx = x0; ly = y0; acc = 0f; seg(sx, sy, 1f) }
                      Tool.RECT -> {
                          if (pen.shapeFill != 0) fillShape(0)
                          if (pen.shapeFill != 1) { lx = x0; ly = y0; acc = 0f; seg(sx, y0, 1f); seg(sx, sy, 1f); seg(x0, sy, 1f); seg(x0, y0, 1f) }
                      }
                      Tool.OVAL -> {
                          if (pen.shapeFill != 0) fillShape(1)
                          if (pen.shapeFill != 1) {
                              val cx0 = (x0 + sx) / 2f; val cy0 = (y0 + sy) / 2f; val rx = abs(sx - x0) / 2f; val ry = abs(sy - y0) / 2f
                              lx = cx0 + rx; ly = cy0; acc = 0f
                              for (i in 1..72) { val t = i * 2f * PIF / 72f; seg(cx0 + rx * cos(t), cy0 + ry * sin(t), 1f) }
                          }
                      }
                      else -> {}
                  }
              }

              private fun fillShape(md: Int) {
                  val pf = pF ?: return
                  val cx0 = (x0 + sx) / 2f; val cy0 = (y0 + sy) / 2f; val rx = abs(sx - x0) / 2f; val ry = abs(sy - y0) / 2f
                  if (rx < .5f && ry < .5f) return
                  val bx0 = max(0, floor(cx0 - rx - 2f).toInt()); val bx1 = min(W, ceil(cx0 + rx + 2f).toInt())
                  val by0 = max(0, floor(cy0 - ry - 2f).toInt()); val by1 = min(H, ceil(cy0 + ry + 2f).toInt())
                  if (bx1 <= bx0 || by1 <= by0) return
                  if (!ovMode) touch(bx0, by0, bx1, by1)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, tgtFbo()); G.glViewport(0, 0, W, H); G.glUseProgram(pf.id)
                  G.glUniform4f(pf.u("uR"), (bx0 + bx1) / W.toFloat() - 1f, (by0 + by1) / H.toFloat() - 1f, (bx1 - bx0) / W.toFloat(), (by1 - by0) / H.toFloat())
                  G.glUniform4f(pf.u("uBox"), cx0, cy0, rx, ry); G.glUniform1f(pf.u("uMd"), md.toFloat()); pm(pf, "uC", pen.color)
                  G.glEnable(G.GL_BLEND); blend(0); quad(); G.glDisable(G.GL_BLEND)
              }

              private fun gradient(ax: Float, ay: Float, ex: Float, ey: Float) {
                  if (hypot(ex - ax, ey - ay) < 1f) return
                  if (!ovMode) touch(0, 0, W, H)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, tgtFbo()); G.glViewport(0, 0, W, H); G.glUseProgram(pG.id)
                  G.glUniform2f(pG.u("uA"), ax, ay); G.glUniform2f(pG.u("uB"), ex, ey); G.glUniform4f(pG.u("uR"), 0f, 0f, 1f, 1f)
                  G.glUniform1f(pG.u("uMd"), pen.gradMode.toFloat())
                  pm(pG, "uC1", pen.color); pm(pG, "uC2", pen.color2, pen.gradFade)
                  G.glEnable(G.GL_BLEND); blend(0); quad(); G.glDisable(G.GL_BLEND)
              }

              // ---------- liquify: live warp during the stroke, auto-baked at stroke end (undoable) ----------
              private fun push(x: Float, y: Float, dx: Float, dy: Float) {
                  val r = liqR
                  val bx0 = max(0, floor(x - r).toInt()); val bx1 = min(W, ceil(x + r).toInt())
                  val by0 = max(0, floor(y - r).toInt()); val by1 = min(H, ceil(y + r).toInt())
                  if (bx1 <= bx0 || by1 <= by0) return
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H); G.glUseProgram(pL.id)
                  G.glActiveTexture(G.GL_TEXTURE0); G.glBindTexture(G.GL_TEXTURE_2D, dTex); G.glUniform1i(pL.u("uD"), 0)
                  G.glUniform4f(pL.u("uR"), (bx0 + bx1) / W.toFloat() - 1f, (by0 + by1) / H.toFloat() - 1f, (bx1 - bx0) / W.toFloat(), (by1 - by0) / H.toFloat())
                  G.glUniform2f(pL.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform2f(pL.u("uC"), x, y); G.glUniform2f(pL.u("uV"), dx, dy)
                  G.glUniform1f(pL.u("uRad"), r); G.glUniform1f(pL.u("uS"), liqS); G.glUniform1f(pL.u("uRng"), rng)
                  G.glUniform1f(pL.u("uM"), liqMode.toFloat())
                  G.glDisable(G.GL_BLEND); quad()
                  G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, bx0, by0, bx0, by0, bx1 - bx0, by1 - by0)
                  liqX0 = min(liqX0, bx0); liqY0 = min(liqY0, by0); liqX1 = max(liqX1, bx1); liqY1 = max(liqY1, by1)
                  warped = true; glowDirty = true
              }

              private fun finishLiquify() {
                  if (!warped) return
                  if (liqX1 <= liqX0 || liqY1 <= liqY0) { warped = false; return }
                  bakeBox(liqX0, liqY0, liqX1, liqY1)
              }
              fun bake() { if (warped) bakeBox(0, 0, W, H) }

              /** Resample every layer once through the map inside the box, then zero the map: nothing stays warped. */
              private fun bakeBox(bx0: Int, by0: Int, bx1: Int, by1: Int) {
                  val g = ++grpN
                  for (l in layers) {
                      beginStep(l); touch(bx0, by0, bx1, by1)
                      compUniforms(1f); G.glDisable(G.GL_BLEND)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H)
                      G.glEnable(G.GL_SCISSOR_TEST); G.glScissor(bx0, by0, bx1 - bx0, by1 - by0)
                      G.glBindTexture(G.GL_TEXTURE_2D, l.tex); quad()
                      G.glDisable(G.GL_SCISSOR_TEST)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, bx0, by0, bx0, by0, bx1 - bx0, by1 - by0)
                      commitStep(g)
                  }
                  clearMapBox(bx0, by0, bx1, by1); warped = false; glowDirty = true
              }

              private fun commitMove() {
                  val dx = mox; val dy = moy; mox = 0f; moy = 0f
                  if (dx == 0f && dy == 0f) return
                  val l = layers[cur]; touch(0, 0, W, H)
                  compUniforms(0f); G.glUniform2f(pC.u("uO"), dx, dy); G.glDisable(G.GL_BLEND)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H)
                  G.glBindTexture(G.GL_TEXTURE_2D, l.tex); quad()
                  G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, 0, 0, W, H)
              }

              private fun pick(x: Int, y: Int) {
                  if (x !in 0 until W || y !in 0 until H) return
                  composite()
                  val bb = ByteBuffer.allocateDirect(4).order(ByteOrder.nativeOrder())
                  G.glReadPixels(x, y, 1, 1, G.GL_RGBA, G.GL_UNSIGNED_BYTE, bb)
                  val r = bb.get(0).toInt() and 255; val g = bb.get(1).toInt() and 255
                  val b = bb.get(2).toInt() and 255; val a = bb.get(3).toInt() and 255
                  if (a == 0) return
                  val c = (255 shl 24) or (min(255, r * 255 / a) shl 16) or (min(255, g * 255 / a) shl 8) or min(255, b * 255 / a)
                  pen.color = c; onPick?.invoke(c)
              }

              private fun near(p: Int, t: Int, tol: Int): Boolean {
                  var s = 0
                  while (s < 32) { if (abs(((p shr s) and 255) - ((t shr s) and 255)) > tol) return false; s += 8 }
                  return true
              }

              private fun fill(sx0: Int, sy0: Int) {
                  if (sx0 !in 0 until W || sy0 !in 0 until H) return
                  val l = layers[cur]
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo)
                  val bb = ByteBuffer.allocateDirect(W * H * 4).order(ByteOrder.nativeOrder())
                  G.glReadPixels(0, 0, W, H, G.GL_RGBA, G.GL_UNSIGNED_BYTE, bb)
                  val a = IntArray(W * H); bb.asIntBuffer().get(a)
                  val o = pen.opacity
                  val fc = ((255 * o).toInt() shl 24) or ((ch(pen.color, 0) * o * 255).toInt() shl 16) or
                      ((ch(pen.color, 8) * o * 255).toInt() shl 8) or (ch(pen.color, 16) * o * 255).toInt()
                  val t = a[sy0 * W + sx0]; val tol = pen.tol.toInt()
                  if (t == fc) return
                  val vis = BooleanArray(W * H); var st = IntArray(1024); var sp = 0
                  var mnx = W; var mxx = 0; var mny = H; var mxy = 0
                  st[sp++] = sy0 * W + sx0
                  while (sp > 0) {
                      val p = st[--sp]; val y = p / W; val x = p - y * W; val rb = y * W
                      if (vis[p] || !near(a[p], t, tol)) continue
                      var l2 = x; while (l2 > 0 && !vis[rb + l2 - 1] && near(a[rb + l2 - 1], t, tol)) l2--
                      var r2 = x; while (r2 < W - 1 && !vis[rb + r2 + 1] && near(a[rb + r2 + 1], t, tol)) r2++
                      for (i in l2..r2) { vis[rb + i] = true; a[rb + i] = fc }
                      mnx = min(mnx, l2); mxx = max(mxx, r2); mny = min(mny, y); mxy = max(mxy, y)
                      for (ny in intArrayOf(y - 1, y + 1)) {
                          if (ny < 0 || ny >= H) continue
                          val nb = ny * W; var i = l2
                          while (i <= r2) {
                              if (!vis[nb + i] && near(a[nb + i], t, tol)) {
                                  if (sp == st.size) st = st.copyOf(sp * 2)
                                  st[sp++] = nb + i
                                  while (i <= r2 && !vis[nb + i] && near(a[nb + i], t, tol)) i++
                              } else i++
                          }
                      }
                  }
                  beginStep(l); touch(mnx, mny, mxx + 1, mxy + 1)
                  G.glBindTexture(G.GL_TEXTURE_2D, l.tex)
                  G.glTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, W, H, G.GL_RGBA, G.GL_UNSIGNED_BYTE, IntBuffer.wrap(a))
                  commitStep(); glowDirty = true
              }

              // ---------- FX: cheap low-res live preview, full-res render on APPLY ----------
              private class St(val m: Int, val dx: Float, val dy: Float, val p: FloatArray)
              private var pvW = 8; private var pvH = 8; private var fxLod = 1f
              private var pvST = 0; private var pvSF = 0; private var pvAT = 0; private var pvAF = 0; private var pvBT = 0; private var pvBF = 0
              private var fxIdx = -1; private var fxV = FloatArray(4)
              private var fxDirty = false; private var fxValid = false; private var fxTried = false; private var fxFull = false

              private fun fxCompile() { if (!fxTried) { fxTried = true; pX = tryProg(FS_X); fxOk = pX != null } }

              fun fxOpen() {
                  if (fxOn) return
                  fxCompile()
                  if (pX == null) return
                  fxLod = min(1f, 512f / max(W, H)); pvW = max(8, (W * fxLod).toInt()); pvH = max(8, (H * fxLod).toInt())
                  pvST = tex(G.GL_LINEAR, pvW, pvH); pvSF = fbo(pvST)
                  pvAT = tex(G.GL_LINEAR, pvW, pvH); pvAF = fbo(pvAT)
                  pvBT = tex(G.GL_LINEAR, pvW, pvH); pvBF = fbo(pvBT)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, pvSF); G.glViewport(0, 0, pvW, pvH)
                  compUniforms(0f); G.glDisable(G.GL_BLEND)
                  G.glBindTexture(G.GL_TEXTURE_2D, layers[cur].tex); quad()
                  fxOn = true; fxIdx = -1; fxValid = false
              }
              fun fxClose() {
                  if (!fxOn) return
                  fxOn = false; fxValid = false
                  delTex(pvST); delFbo(pvSF); delTex(pvAT); delFbo(pvAF); delTex(pvBT); delFbo(pvBF)
              }
              fun fxSet(i: Int, v: FloatArray) { fxIdx = i; fxV = v; fxDirty = true }
              fun fxSetHq(b: Boolean) { fxHq = b; fxDirty = true }

              private fun fxCommitFull() {
                  fxRender(true)
                  if (!fxValid) return
                  val l = layers[cur]; beginStep(l); touch(0, 0, W, H)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, xFbo); G.glBindTexture(G.GL_TEXTURE_2D, l.tex)
                  G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, 0, 0, W, H)
                  commitStep()
              }
              fun fxApply() {
                  if (!fxOn || !fxValid) { fxClose(); return }
                  fxDirty = false; fxCommitFull(); fxClose()
              }
              /** re-apply a filter without opening the panel (used by the FX button hold) */
              fun fxQuick(i: Int, v: FloatArray) {
                  fxCompile()
                  if (pX == null || fxOn) return
                  fxIdx = i; fxV = v; fxCommitFull(); fxValid = false
              }

              private fun gauss(rad: Float, o: ArrayList<St>) {
                  if (rad < .5f) { o.add(St(0, 0f, 0f, FloatArray(4))); return }
                  val k = min(4, max(1, ceil((rad / 12f) * (rad / 12f)).toInt())); val ri = rad / sqrt(k.toFloat())
                  repeat(k) { o.add(St(35, 1f, 0f, floatArrayOf(ri, 0f, 0f, 0f))); o.add(St(35, 0f, 1f, floatArrayOf(ri, 0f, 0f, 0f))) }
              }
              private fun fxPlan(f: Fx, v: FloatArray): List<St> {
                  val o = ArrayList<St>()
                  when (f.m) {
                      100 -> gauss(v[0], o)
                      101 -> { o.add(St(39, 0f, 0f, floatArrayOf(v[0], 0f, 0f, 0f))); gauss(v[1], o); o.add(St(40, 0f, 0f, floatArrayOf(v[2], 0f, 0f, 0f))) }
                      102 -> { gauss(v[0], o); o.add(St(40, 0f, 0f, floatArrayOf(v[1], 0f, 0f, 0f))) }
                      103 -> { gauss(v[0], o); o.add(St(41, 0f, 0f, floatArrayOf(v[1], 0f, 0f, 0f))) }
                      104 -> { val a = v[1] * .01745f; o.add(St(35, cos(a), sin(a), floatArrayOf(v[0], 1f, 0f, 0f))) }
                      else -> o.add(St(f.m, 0f, 0f, floatArrayOf(v[0], v[1], v[2], v[3])))
                  }
                  return o
              }
              /** pixel-unit params shrink with the preview resolution so the low-res preview matches the final look */
              private fun fxScaled(f: Fx, v: FloatArray, s: Float): FloatArray {
                  val o = v.copyOf(4)
                  if (s != 1f) {
                      val idx = when (f.m) {
                          100, 102, 103, 104, 12, 14, 15, 20, 24, 38 -> intArrayOf(0)
                          101, 16, 21, 23, 26 -> intArrayOf(1)
                          37 -> intArrayOf(2)
                          else -> intArrayOf()
                      }
                      for (i in idx) o[i] = o[i] * s
                  }
                  return o
              }

              private fun fxRender(force: Boolean) {
                  val shader = pX ?: return
                  if (!force && !fxOn) return
                  val f = FXS.getOrNull(fxIdx)
                  if (f == null) { fxValid = false; return }
                  val full = force || fxHq
                  val l = layers[cur]
                  val t = if (full) { ensureX(); Tgt(W, H, l.tex, xTex, xFbo, sTex, sFbo, 1f) }
                  else Tgt(pvW, pvH, pvST, pvAT, pvAF, pvBT, pvBF, fxLod)
                  val plan = fxPlan(f, fxScaled(f, fxV, t.sc)); val n = plan.size
                  G.glUseProgram(shader.id); G.glViewport(0, 0, t.w, t.h); G.glDisable(G.GL_BLEND)
                  G.glUniform4f(shader.u("uR"), 0f, 0f, 1f, 1f); G.glUniform2f(shader.u("uSz"), t.w.toFloat(), t.h.toFloat()); G.glUniform1f(shader.u("uS"), t.sc)
                  G.glUniform4f(shader.u("uC1"), ch(pen.color2, 16), ch(pen.color2, 8), ch(pen.color2, 0), 1f)
                  G.glUniform4f(shader.u("uC2"), ch(pen.color, 16), ch(pen.color, 8), ch(pen.color, 0), 1f)
                  G.glUniform4f(shader.u("uC3"), 1f, 1f, 1f, 1f)
                  G.glUniform1i(shader.u("uT"), 0); G.glUniform1i(shader.u("uO"), 1)
                  G.glActiveTexture(G.GL_TEXTURE1); G.glBindTexture(G.GL_TEXTURE_2D, t.src); G.glActiveTexture(G.GL_TEXTURE0)
                  var cs = t.src
                  for ((i, s) in plan.withIndex()) {
                      val toOut = (n - 1 - i) % 2 == 0
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, if (toOut) t.outF else t.tmpF)
                      G.glBindTexture(G.GL_TEXTURE_2D, cs)
                      G.glUniform1f(shader.u("uM"), s.m.toFloat()); G.glUniform2f(shader.u("uD"), s.dx, s.dy)
                      G.glUniform4f(shader.u("uP"), s.p[0], s.p[1], s.p[2], s.p[3]); quad()
                      cs = if (toOut) t.outT else t.tmpT
                  }
                  fxValid = true; fxFull = full; glowDirty = true
              }

              fun snapshot(): Bitmap {
                  composite()
                  val bb = ByteBuffer.allocateDirect(W * H * 4).order(ByteOrder.nativeOrder())
                  G.glReadPixels(0, 0, W, H, G.GL_RGBA, G.GL_UNSIGNED_BYTE, bb); bb.rewind()
                  val b = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888); b.copyPixelsFromBuffer(bb)
                  val m = Matrix(); m.preScale(1f, -1f)
                  return Bitmap.createBitmap(b, 0, 0, W, H, m, false)
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/CanvasView.kt <<'EOF_SRC'
          package dev.canvas

          import android.content.Context
          import android.opengl.GLSurfaceView
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.ViewConfiguration
          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.hypot

          /**
           * Touch policy: a stroke does NOT start on finger-down. It starts once the finger moved past a slop
           * distance or was held ~90 ms. A second finger = pan / zoom / free rotate (nothing is drawn). If a second
           * finger lands right after a stroke began (<250 ms) the stroke is rolled back.
           * A tiny ticker drives the animated backdrop only while it is needed (zero idle cost otherwise).
           */
          class CanvasView(c: Context, private val e: Engine) : GLSurfaceView(c) {
              private var draw = false
              private var pend = false
              private var pan = false
              private var moved = false
              private var t0 = 0L
              private var downT = 0L
              private var strokeT = 0L
              private var ripT = 0L
              private var ticking = false
              private var fx = 0f; private var fy = 0f
              private var mx = 0f; private var my = 0f; private var md = 1f; private var ma = 0f
              private val slop = ViewConfiguration.get(c).scaledTouchSlop * 1.4f
              private val buf = ArrayList<FloatArray>()
              private val pi = Math.PI.toFloat()

              private val tick = object : Runnable {
                  override fun run() {
                      requestRender()
                      if (e.needFrames()) {
                          val idle = SystemClock.uptimeMillis() - e.lastAct > 20000
                          val fps = if (idle) minOf(e.animFps, 8f) else e.animFps
                          postDelayed(this, (1000f / fps.coerceAtLeast(4f)).toLong().coerceIn(16L, 250L))
                      } else ticking = false
                  }
              }

              init {
                  setEGLContextClientVersion(3)
                  setEGLConfigChooser(8, 8, 8, 0, 0, 0) // no depth/stencil/alpha: less memory
                  preserveEGLContextOnPause = true
                  setRenderer(e)
                  renderMode = RENDERMODE_WHEN_DIRTY    // zero idle GPU cost
              }

              fun kick() { if (!ticking) { ticking = true; post(tick) } }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); kick() }
              override fun onDetachedFromWindow() { removeCallbacks(tick); ticking = false; super.onDetachedFromWindow() }

              fun gl(f: () -> Unit) { queueEvent(Runnable { f() }); requestRender(); kick() }

              private fun send(a: Int, x: Float, y: Float, p: Float) {
                  val cx = e.cx(x, y); val cy = e.cy(x, y)
                  queueEvent(Runnable { if (a == 0) e.begin(cx, cy, p) else e.move(cx, cy, p) })
              }
              private fun press(t: MotionEvent, v: Float) = if (t.getToolType(0) == MotionEvent.TOOL_TYPE_STYLUS) v else 1f
              private fun end() = queueEvent(Runnable { e.end() })

              private fun start() {
                  pend = false; draw = true; strokeT = SystemClock.uptimeMillis()
                  for ((i, q) in buf.withIndex()) send(if (i == 0) 0 else 1, q[0], q[1], q[2])
                  buf.clear()
              }

              private fun sync(t: MotionEvent) {
                  mx = (t.getX(0) + t.getX(1)) / 2; my = (t.getY(0) + t.getY(1)) / 2
                  md = hypot(t.getX(0) - t.getX(1), t.getY(0) - t.getY(1)).coerceAtLeast(1f)
                  ma = atan2(t.getY(1) - t.getY(0), t.getX(1) - t.getX(0))
              }

              override fun onTouchEvent(t: MotionEvent): Boolean {
                  when (t.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          draw = false; pan = false; moved = false; pend = true; downT = t.eventTime; fx = t.x; fy = t.y
                          buf.clear(); buf.add(floatArrayOf(t.x, t.y, press(t, t.pressure)))
                          e.ripple(t.x, t.y); ripT = t.eventTime
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          if (pend) { pend = false; buf.clear() }              // pinch: the first finger never drew
                          else if (draw) {
                              draw = false
                              if (SystemClock.uptimeMillis() - strokeT < 250) queueEvent(Runnable { e.abort() }) else end()
                          }
                          pan = true; moved = false; sync(t); t0 = t.eventTime
                      }
                      MotionEvent.ACTION_MOVE ->
                          if (pan && t.pointerCount > 1) {
                              val x = (t.getX(0) + t.getX(1)) / 2; val y = (t.getY(0) + t.getY(1)) / 2
                              val d = hypot(t.getX(0) - t.getX(1), t.getY(0) - t.getY(1)).coerceAtLeast(1f)
                              val an = atan2(t.getY(1) - t.getY(0), t.getX(1) - t.getX(0))
                              var da = an - ma
                              while (da > pi) da -= 2f * pi
                              while (da < -pi) da += 2f * pi
                              if (abs(x - mx) + abs(y - my) + abs(d - md) + abs(da) * md * .5f > 14f) moved = true
                              if (moved) { e.gesture(mx, my, x, y, d / md, da); mx = x; my = y; md = d; ma = an }
                          } else {
                              if (draw || pend) { e.lastAct = t.eventTime; if (t.eventTime - ripT > 140) { e.ripple(t.x, t.y); ripT = t.eventTime } }
                              if (pend) {
                                  for (h in 0 until t.historySize) buf.add(floatArrayOf(t.getHistoricalX(h), t.getHistoricalY(h), press(t, t.getHistoricalPressure(h))))
                                  buf.add(floatArrayOf(t.x, t.y, press(t, t.pressure)))
                                  if (hypot(t.x - fx, t.y - fy) > slop || t.eventTime - downT >= 90) start()
                              } else if (draw) {
                                  for (h in 0 until t.historySize) send(1, t.getHistoricalX(h), t.getHistoricalY(h), press(t, t.getHistoricalPressure(h)))
                                  send(1, t.x, t.y, press(t, t.pressure))
                              }
                          }
                      MotionEvent.ACTION_POINTER_UP -> {
                          // quick 2-finger tap = undo, 3-finger tap = redo
                          if (!moved && t0 > 0 && t.eventTime - t0 < 260) {
                              if (t.pointerCount == 2) gl { e.undo() } else if (t.pointerCount == 3) gl { e.redo() }
                              t0 = 0
                          }
                          if (t.pointerCount <= 2) pan = false
                      }
                      MotionEvent.ACTION_UP -> {
                          if (pend) {                                           // a tap = a single dab
                              if (!pan && buf.isNotEmpty()) { val q = buf[0]; send(0, q[0], q[1], q[2]); end() }
                              pend = false; buf.clear()
                          } else if (draw) end()
                          draw = false; pan = false
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          if (draw) queueEvent(Runnable { e.abort() })
                          draw = false; pend = false; pan = false; buf.clear()
                      }
                  }
                  requestRender(); kick(); return true
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Icons.kt <<'EOF_SRC'
          package dev.canvas

          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.StrokeJoin
          import androidx.compose.ui.graphics.drawscope.DrawScope
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.graphics.drawscope.scale
          import kotlin.math.cos
          import kotlin.math.sin

          // ───────────────────────── procedural icons (no assets, drawn + animated in code) ─────────────────────────
          enum class Ik { BR, ER, SM, BL, DG, BN, LQ, FL, GR, LN, RC, OV, PK, MV, UN, RE, LY, CO, BS, MN, SV, SY, EY, EN, PL, MI, DP, TR, UP, DN, MG, CX, CV, OK, TH, FX, CP, HM, LK, SH, RD, PW }

          /** ph = animation phase 0..1 (looping while active, one-shot on tap). */
          fun DrawScope.ic(k: Ik, c: Color, c2: Color, ph: Float) {
              val u = size.minDimension / 24f
              val sw = 2.1f * u
              val tau = 6.2832f
              val w = sin(ph * tau)
              val st = Stroke(sw, cap = StrokeCap.Round, join = StrokeJoin.Round)
              fun o(x: Float, y: Float) = Offset(x * u, y * u)
              fun l(a: Float, b: Float, x: Float, y: Float, col: Color = c) = drawLine(col, o(a, b), o(x, y), sw, StrokeCap.Round)
              fun dot(x: Float, y: Float, r: Float, col: Color = c2) = drawCircle(col, r * u, o(x, y))
              fun ring(x: Float, y: Float, r: Float, col: Color = c) = drawCircle(col, r * u, o(x, y), style = st)
              fun poly(vararg p: Float, close: Boolean = true, fill: Color? = null) {
                  val pa = Path(); pa.moveTo(p[0] * u, p[1] * u)
                  var i = 2
                  while (i < p.size) { pa.lineTo(p[i] * u, p[i + 1] * u); i += 2 }
                  if (close) pa.close()
                  if (fill != null) drawPath(pa, fill)
                  drawPath(pa, c, style = st)
              }
              when (k) {
                  Ik.BR -> { l(19f, 5f, 10f, 14f); dot(8f, 16f + w * .6f, 3.6f); dot(19f, 19f, 1.2f + w * .3f) }
                  Ik.ER -> { poly(5f, 15f, 13f, 6f, 19f, 11f, 12f, 20f, fill = c2.copy(alpha = .35f)); l(9f, 11f, 15f, 16f, c2); dot(4f + (w + 1f) * 2f, 5f, 1f) }
                  Ik.SM -> {
                      val pa = Path(); pa.moveTo(3f * u, 17f * u); pa.cubicTo(8f * u, 6f * u, 14f * u, 22f * u, 21f * u, 9f * u)
                      drawPath(pa, c, style = st); dot(8f + w * 2f, 14f, 3f)
                  }
                  Ik.BL -> { dot(12f, 12f, 3.2f); ring(12f, 12f, 6.5f + w * .7f); ring(12f, 12f, 10f + w * .5f, c.copy(alpha = .45f)) }
                  Ik.DG -> {
                      dot(12f, 12f, 4f)
                      for (i in 0..7) { val a = (i * 45f + ph * 45f) * 0.01745f; l(12f + cos(a) * 7f, 12f + sin(a) * 7f, 12f + cos(a) * 10f, 12f + sin(a) * 10f) }
                  }
                  Ik.BN -> {
                      poly(12f, 3f + w * .5f, 18f, 11f, 17f, 18f, 12f, 21f, 7f, 18f, 6f, 11f, fill = c2.copy(alpha = .5f))
                      poly(12f, 12f, 14f, 16f, 12f, 19f, 10f, 16f, fill = c2)
                  }
                  Ik.LQ -> for (j in 0..1) {
                      val pa = Path()
                      for (i in 0..16) {
                          val x = 3f + i * 1.125f
                          val y = (if (j == 0) 9f else 15f) + 2.6f * sin((i / 16f + ph * (if (j == 0) 1f else -1f)) * tau)
                          if (i == 0) pa.moveTo(x * u, y * u) else pa.lineTo(x * u, y * u)
                      }
                      drawPath(pa, if (j == 0) c else c2, style = st)
                  }
                  Ik.FL -> { poly(4f, 12f, 11f, 5f, 18f, 12f, 11f, 19f, fill = c2.copy(alpha = .4f)); l(4f, 12f, 18f, 12f); dot(20f, 17f + w * .8f, 2.2f) }
                  Ik.GR -> for (i in 0..4) drawRect(c.copy(alpha = ((i + 1) / 5f) * (.75f + .25f * sin((ph + i / 5f) * tau))), o(4f + i * 3.2f, 5f), Size(2.6f * u, 14f * u))
                  Ik.LN -> { l(5f, 19f, 19f, 5f); ring(5f, 19f, 2f); ring(19f, 5f, 2f); dot(5f + 14f * ph, 19f - 14f * ph, 1.5f) }
                  Ik.RC -> { drawRoundRect(c, o(5f, 6f), Size(14f * u, 12f * u), CornerRadius(2.5f * u), style = st); dot(5f, 6f, 1.5f); dot(19f, 18f, 1.5f) }
                  Ik.OV -> { drawOval(c, o(4f, 6f), Size(16f * u, 12f * u), style = st); dot(12f, 12f, 1.5f + w * .4f) }
                  Ik.PK -> { l(6f, 18f, 15f, 9f); dot(17f, 7f, 3.2f); dot(5f, 19f, 1.3f + w * .4f, c) }
                  Ik.MV -> {
                      val g = 2.5f + w * .5f
                      l(12f, 3f, 12f, 21f); l(3f, 12f, 21f, 12f)
                      l(12f, 3f, 12f - g, 3f + g); l(12f, 3f, 12f + g, 3f + g); l(12f, 21f, 12f - g, 21f - g); l(12f, 21f, 12f + g, 21f - g)
                      l(3f, 12f, 3f + g, 12f - g); l(3f, 12f, 3f + g, 12f + g); l(21f, 12f, 21f - g, 12f - g); l(21f, 12f, 21f - g, 12f + g)
                  }
                  Ik.UN -> rotate(-w * 20f, o(12f, 12f)) {
                      val pa = Path(); pa.moveTo(19f * u, 19f * u); pa.cubicTo(19f * u, 11f * u, 14f * u, 9f * u, 6f * u, 9f * u)
                      drawPath(pa, c, style = st); l(6f, 9f, 10f, 5f); l(6f, 9f, 10f, 13f)
                  }
                  Ik.RE -> scale(-1f, 1f, o(12f, 12f)) { ic(Ik.UN, c, c2, ph) }
                  Ik.LY -> for (i in 0..2) {
                      val cy = 7f + i * 5f * (1f + .15f * w)
                      poly(12f, cy - 3.5f, 20f, cy, 12f, cy + 3.5f, 4f, cy, fill = if (i == 2) c2.copy(alpha = .5f) else null)
                  }
                  Ik.CO -> {
                      ring(12f, 12f, 9f)
                      val cs = listOf(c, c2, Color.White)
                      for (i in 0..2) { val a = (i * 120f + ph * 120f) * 0.01745f; dot(12f + cos(a) * 4.5f, 12f + sin(a) * 4.5f, 1.8f, cs[i]) }
                  }
                  Ik.BS -> for (i in 0..2) { val y = 6f + i * 6f; l(4f, y, 20f, y, c.copy(alpha = .5f)); dot(8f + i * 4f + w * 2f, y, 2.4f) }
                  Ik.MN -> for (i in 0..2) dot(6f + i * 6f, 12f + sin((ph + i * .2f) * tau) * 2.5f, 1.9f, c)
                  Ik.SV -> { l(12f, 4f + w * .8f, 12f, 15f); l(12f, 15f, 8f, 11f); l(12f, 15f, 16f, 11f); poly(5f, 16f, 5f, 20f, 19f, 20f, 19f, 16f, close = false) }
                  Ik.SY -> {
                      for (i in 0..4) l(12f, 3f + i * 4.5f, 12f, 5f + i * 4.5f)
                      poly(4f, 8f + w * .5f, 9f, 12f, 4f, 16f - w * .5f, fill = c2.copy(alpha = .4f))
                      poly(20f, 8f + w * .5f, 15f, 12f, 20f, 16f - w * .5f, fill = c2.copy(alpha = .4f))
                  }
                  Ik.EY -> { drawOval(c, o(3f, 7f), Size(18f * u, 10f * u), style = st); dot(12f, 12f, 3f + w * .3f) }
                  Ik.EN -> { drawOval(c.copy(alpha = .5f), o(3f, 7f), Size(18f * u, 10f * u), style = st); l(4f, 20f, 20f, 4f) }
                  Ik.PL -> { l(12f, 5f, 12f, 19f); l(5f, 12f, 19f, 12f) }
                  Ik.MI -> l(5f, 12f, 19f, 12f)
                  Ik.DP -> {
                      drawRoundRect(c, o(8f, 8f), Size(12f * u, 12f * u), CornerRadius(3f * u), style = st)
                      drawRoundRect(c2, o(4f, 4f), Size(12f * u, 12f * u), CornerRadius(3f * u), style = st)
                  }
                  Ik.TR -> {
                      val lift = (w + 1f) * .8f
                      poly(7f, 9f, 8f, 20f, 16f, 20f, 17f, 9f, close = false); l(5f, 7f - lift, 19f, 7f - lift); l(10f, 4f - lift, 14f, 4f - lift)
                  }
                  Ik.UP -> { l(12f, 19f, 12f, 5f); l(12f, 5f, 6f, 11f); l(12f, 5f, 18f, 11f) }
                  Ik.DN -> { l(12f, 5f, 12f, 19f); l(12f, 19f, 6f, 13f); l(12f, 19f, 18f, 13f) }
                  Ik.MG -> { l(12f, 3f, 12f, 14f); l(12f, 14f, 7f, 9f); l(12f, 14f, 17f, 9f); l(5f, 19f, 19f, 19f) }
                  Ik.CX -> rotate(ph * 90f, o(12f, 12f)) {
                      poly(12f, 3f, 14f, 10f, 21f, 12f, 14f, 14f, 12f, 21f, 10f, 14f, 3f, 12f, 10f, 10f, fill = c2.copy(alpha = .5f))
                  }
                  Ik.CV -> rotate(ph * 180f, o(12f, 12f)) { l(7f, 10f, 12f, 15f); l(12f, 15f, 17f, 10f) }
                  Ik.OK -> { l(5f, 12f, 10f, 17f); l(10f, 17f, 19f, 7f) }
                  Ik.TH -> {
                      for (i in 0..5) { val a = (i * 60f + ph * 60f) * 0.01745f; dot(12f + cos(a) * 5.5f, 12f + sin(a) * 5.5f, 3.2f, if (i % 2 == 0) c else c2) }
                      dot(12f, 12f, 2.6f, Color.White)
                  }
                  Ik.FX -> {
                      l(4f, 20f, 14f, 10f)
                      rotate(ph * 90f, o(17f, 7f)) { poly(17f, 2f, 18.5f, 5.5f, 22f, 7f, 18.5f, 8.5f, 17f, 12f, 15.5f, 8.5f, 12f, 7f, 15.5f, 5.5f, fill = c2.copy(alpha = .6f)) }
                      dot(7f, 8f, 1.2f + w * .4f); dot(19f, 18f, 1f - w * .3f)
                  }
                  Ik.CP -> {
                      ring(12f, 12f, 9f)
                      rotate(ph * 360f, o(12f, 12f)) { poly(12f, 5f, 14.5f, 12f, 12f, 10.5f, 9.5f, 12f, fill = c2); l(12f, 13.5f, 12f, 18f, c.copy(alpha = .5f)) }
                  }
                  Ik.HM -> { poly(4f, 12f, 12f, 4f, 20f, 12f, close = false); poly(6f, 11f, 6f, 20f, 18f, 20f, 18f, 11f, close = false); l(10.5f, 20f, 10.5f, 15f); l(13.5f, 20f, 13.5f, 15f) }
                  Ik.LK -> {
                      drawRoundRect(c, o(6f, 11f), Size(12f * u, 9f * u), CornerRadius(2f * u), style = st)
                      drawArc(c, 180f, 180f, false, o(8f, 4f), Size(8f * u, 10f * u), style = st); dot(12f, 15.5f, 1.3f)
                  }
                  Ik.SH -> { l(12f, 4f, 12f, 14f); l(12f, 4f, 8f, 8f); l(12f, 4f, 16f, 8f); poly(5f, 12f, 5f, 20f, 19f, 20f, 19f, 12f, close = false) }
                  Ik.RD -> {
                      drawRoundRect(c, o(4f, 4f), Size(16f * u, 16f * u), CornerRadius(4f * u), style = st)
                      val jig = w * .6f
                      dot(8.5f, 8.5f + jig, 1.5f); dot(15.5f, 15.5f - jig, 1.5f); dot(12f, 12f, 1.5f, c)
                  }
                  Ik.PW -> {
                      dot(12f, 15f, 4.2f); dot(6f, 10.5f + w * .4f, 2f); dot(10f, 6.5f, 2f); dot(14f, 6.5f, 2f); dot(18f, 10.5f + w * .4f, 2f)
                  }
                  else -> {}
              }
          }

          EOF_SRC
