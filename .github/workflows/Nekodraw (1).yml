          @Composable
          fun Modifier.touch(f: (Float, Float) -> Unit): Modifier {
              val u by rememberUpdatedState(f)
              return pointerInput(Unit) {
                  awaitPointerEventScope {
                      while (true) {
                          val c = awaitPointerEvent().changes[0]
                          if (c.pressed) {
                              u((c.position.x / size.width).coerceIn(0f, 1f), (c.position.y / size.height).coerceIn(0f, 1f))
                              c.consume()
                          }
                      }
                  }
              }
          }

          /** springy pop-in; i staggers siblings */
          @Composable
          fun Modifier.pop(i: Int = 0): Modifier {
              val a = remember { Animatable(0f) }
              LaunchedEffect(Unit) {
                  if (T.an > .01f) { delay(i * 28L); a.animateTo(1f, spring(.45f, 260f)) } else a.snapTo(1f)
              }
              return graphicsLayer {
                  val v = a.value
                  scaleX = .6f + .4f * v; scaleY = .6f + .4f * v; alpha = v.coerceIn(0f, 1f); translationY = (1f - v) * 24f
              }
          }

          /**
           * Squishy bubble: spring squish + tilt on press, expanding ring + sparkles on tap, looping phase while [anim].
           * hold = long-press action (a ring charges around the bubble); rep = keep repeating while held.
           */
          @Composable
          fun Bub(
              sz: Float, on: Boolean, en: Boolean = true, anim: Boolean = on, pad: Float = .42f,
              hold: (() -> Unit)? = null, rep: Boolean = false, f: () -> Unit, draw: DrawScope.(Float) -> Unit
          ) {
              var pr by remember { mutableStateOf(false) }
              val sq by animateFloatAsState(if (pr) .82f else 1f, spring(.35f, 600f), label = "sq")
              val tl by animateFloatAsState(if (pr) -7f else 0f, spring(.35f, 400f), label = "tl")
              val pop = remember { Animatable(0f) }
              val charge = remember { Animatable(0f) }
              val rj = remember { arrayOfNulls<Job>(1) }
              val scope = rememberCoroutineScope()
              val haptic = LocalHapticFeedback.current
              val fU by rememberUpdatedState(f)
              val hU by rememberUpdatedState(hold)
              val ph = if (anim && T.an > .01f)
                  rememberInfiniteTransition(label = "ph").animateFloat(0f, 1f, infiniteRepeatable(tween(1800, easing = LinearEasing)), label = "p").value
              else pop.value
              val ac = T.ac; val ac2 = T.ac2; val bgc = if (on) T.ac else T.panel2
              val lp: ((Offset) -> Unit)? = if (hold != null) ({ _: Offset ->
                  if (T.hap > .5f) haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                  scope.launch { pop.snapTo(0f); pop.animateTo(1f, tween(520)) }
                  hU?.invoke()
                  if (rep) rj[0] = scope.launch { while (true) { delay(110); hU?.invoke() } }
              }) else null
              Canvas(
                  Modifier.size(d(sz)).graphicsLayer { scaleX = sq; scaleY = sq; rotationZ = tl; alpha = if (en) 1f else .3f }
                      .pointerInput(en, hold != null, rep) {
                          if (en) detectTapGestures(
                              onPress = {
                                  pr = true
                                  val cj = if (hU != null) scope.launch { charge.snapTo(0f); charge.animateTo(1f, tween(400, easing = LinearEasing)) } else null
                                  tryAwaitRelease()
                                  cj?.cancel(); rj[0]?.cancel(); rj[0] = null
                                  scope.launch { charge.snapTo(0f) }
                                  pr = false
                              },
                              onLongPress = lp,
                              onTap = { scope.launch { pop.snapTo(0f); pop.animateTo(1f, tween(450)) }; fU() }
                          )
                      }
              ) {
                  val r = size.minDimension / 2f
                  val cr = CornerRadius(r * .92f * T.bsh.coerceIn(.2f, 1f))
                  val bs = Size(r * 1.84f, r * 1.84f)
                  drawRoundRect(Color.Black.copy(alpha = .35f * T.sdw), Offset(r * .08f, r * .15f), bs, cr)
                  drawRoundRect(bgc, Offset(r * .08f, r * .08f), bs, cr)
                  if (T.olw > .05f) drawRoundRect(T.ink.copy(alpha = .8f), Offset(r * .08f, r * .08f), bs, cr, style = Stroke(T.olw * 1.5f))
                  drawCircle(Color.White.copy(alpha = (if (on) .38f else .12f) * T.gls * 2f), r * .16f, Offset(r * .62f, r * .5f))
                  val cg = charge.value
                  if (cg > .02f) drawArc(ac2, -90f, 360f * cg, false, Offset(r * .05f, r * .05f), Size(r * 1.9f, r * 1.9f), style = Stroke(r * .13f, cap = StrokeCap.Round))
                  val pv = pop.value
                  if (pv > 0f && pv < 1f) {
                      drawCircle(ac2.copy(alpha = (1f - pv) * .8f), r * (.95f + .55f * pv), Offset(r, r), style = Stroke(2.5f))
                      for (i in 0..5) {
                          val a = i * 1.0472f + .4f; val rr = r * (1f + .5f * pv)
                          drawCircle(ac.copy(alpha = 1f - pv), 2.4f, Offset(r + cos(a) * rr, r + sin(a) * rr))
                      }
                  }
                  inset(r * pad) { draw(ph) }
              }
          }

          @Composable
          fun IB(k: Ik, on: Boolean = false, en: Boolean = true, sz: Float = 44f, anim: Boolean = on, hold: (() -> Unit)? = null, rep: Boolean = false, f: () -> Unit) {
              val ac2 = T.ac2
              Bub(sz, on, en, anim, .42f, hold, rep, f) { ph -> ic(k, if (on) T.dk else T.ink, if (on) Color.White else ac2, ph) }
          }

          @Composable
          fun Pill(s: String, on: Boolean = false, k: Ik? = null, ph: Float = 0f, hold: (() -> Unit)? = null, ff: FontFamily? = null, f: () -> Unit) {
              var pr by remember { mutableStateOf(false) }
              val sq by animateFloatAsState(if (pr) .9f else 1f, spring(.4f, 500f), label = "pl")
              val fU by rememberUpdatedState(f)
              val hU by rememberUpdatedState(hold)
              val haptic = LocalHapticFeedback.current
              val fg = if (on) T.dk else T.ink
              val ac2 = T.ac2
              val lp: ((Offset) -> Unit)? = if (hold != null) ({ _: Offset ->
                  if (T.hap > .5f) haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                  hU?.invoke()
              }) else null
              Row(
                  Modifier.graphicsLayer { scaleX = sq; scaleY = sq }.clip(RoundedCornerShape(50)).background(if (on) T.ac else T.panel2)
                      .pointerInput(hold != null) {
                          detectTapGestures(onPress = { pr = true; tryAwaitRelease(); pr = false }, onLongPress = lp, onTap = { fU() })
                      }.padding(horizontal = d(11f), vertical = d(7f)),
                  verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))
              ) {
                  if (k != null) Canvas(Modifier.size(d(16f))) { ic(k, fg, ac2, ph) }
                  Tx(s, fg, ff = ff)
              }
          }

          /** Slider whose knob is a little cat face. */
          @Composable
          fun CS(t: Float, mod: Modifier = Modifier, on: (Float) -> Unit) {
              val ac = T.ac; val ac2 = T.ac2; val tr = T.panel2
              Box(
                  Modifier.then(mod).height(d(28f)).drawBehind {
                      val h = size.height; val r = h / 2f
                      val x = r + (size.width - 2f * r) * t.coerceIn(0f, 1f)
                      val cr = CornerRadius(h * .25f)
                      drawRoundRect(tr, Offset(0f, h * .25f), Size(size.width, h * .5f), cr)
                      drawRoundRect(Brush.horizontalGradient(listOf(ac2, ac), 0f, x.coerceAtLeast(1f)), Offset(0f, h * .25f), Size(x, h * .5f), cr)
                      val ear = Path(); ear.moveTo(x - r * .75f, r * .55f); ear.lineTo(x - r * .6f, r * .05f); ear.lineTo(x - r * .2f, r * .38f); ear.close()
                      val ear2 = Path(); ear2.moveTo(x + r * .75f, r * .55f); ear2.lineTo(x + r * .6f, r * .05f); ear2.lineTo(x + r * .2f, r * .38f); ear2.close()
                      drawPath(ear, Color.White); drawPath(ear2, Color.White)
                      drawCircle(Color.White, r * .92f, Offset(x, r))
                      drawCircle(T.dk, r * .09f, Offset(x - r * .28f, r * .86f)); drawCircle(T.dk, r * .09f, Offset(x + r * .28f, r * .86f))
                      drawArc(T.dk, 20f, 140f, false, Offset(x - r * .2f, r * .92f), Size(r * .4f, r * .26f), style = Stroke(r * .08f, cap = StrokeCap.Round))
                      drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x - r * .52f, r * 1.08f)); drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x + r * .52f, r * 1.08f))
                  }.touch { xx, _ -> on(xx) }
              )
          }

          @Composable
          fun R2(p: PP) {
              val rv = U.rev
              val v = p.g()
              val t = if (p.log) ln(v / p.lo) / ln(p.hi / p.lo) else (v - p.lo) / (p.hi - p.lo)
              fun set(x: Float) { p.s(x.coerceIn(p.lo, p.hi)); U.bump() }
              Column(verticalArrangement = Arrangement.spacedBy(d(1f))) {
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))) {
                      Tx(p.n, T.ink.copy(alpha = .8f), Modifier.width(d(66f)), 10f)
                      IB(Ik.MI, sz = 30f) { set(v - p.st) }
                      CS(t, Modifier.weight(1f)) { x -> set(if (p.log) p.lo * (p.hi / p.lo).pow(x) else p.lo + x * (p.hi - p.lo)) }
                      IB(Ik.PL, sz = 30f) { set(v + p.st) }
                      Tx("%.2f".format(v), mod = Modifier.width(d(48f)))
                  }
                  if (T.hint > .5f && p.desc.isNotEmpty()) Tx(p.desc, T.ink.copy(alpha = .5f), Modifier.padding(start = d(70f)), 8f)
              }
          }

          @Composable
          fun Choice(label: String, opts: List<String>, sel: Int, fonts: Boolean = false, on: (Int) -> Unit) {
              Tx(label, T.ink.copy(alpha = .7f), sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  opts.forEachIndexed { i, s -> Pill(s, sel == i, ff = if (fonts) FONTS[i] else null) { on(i) } }
              }
          }

          // ───────────────────────── the cat ─────────────────────────
          fun DrawScope.drawEars(ac: Color, ac2: Color, s: Float, ear: Int) {
              val inn = ac2.copy(alpha = .7f)
              when (ear) {
                  1 -> for (sd in 0..1) {
                      val x = if (sd == 0) .22f else .78f; val dx = if (sd == 0) 1f else -1f
                      val pa = Path(); pa.moveTo(s * (x - .13f * dx), s * .34f); pa.lineTo(s * (x - .03f * dx), s * .01f); pa.lineTo(s * (x + .15f * dx), s * .26f); pa.close(); drawPath(pa, ac)
                      val pb = Path(); pb.moveTo(s * (x - .07f * dx), s * .3f); pb.lineTo(s * (x - .02f * dx), s * .1f); pb.lineTo(s * (x + .08f * dx), s * .25f); pb.close(); drawPath(pb, inn)
                  }
                  2 -> for (sd in 0..1) {
                      val x = if (sd == 0) .3f else .7f
                      drawOval(ac, Offset(s * (x - .07f), 0f), Size(s * .14f, s * .34f)); drawOval(inn, Offset(s * (x - .035f), s * .05f), Size(s * .07f, s * .22f))
                  }
                  else -> {
                      drawCircle(ac, s * .13f, Offset(s * .24f, s * .2f)); drawCircle(ac, s * .13f, Offset(s * .76f, s * .2f))
                      drawCircle(inn, s * .06f, Offset(s * .24f, s * .2f)); drawCircle(inn, s * .06f, Offset(s * .76f, s * .2f))
                  }
              }
          }

          fun DrawScope.drawBow(c: Color, s: Float) {
              val x = s * .8f; val y = s * .2f
              val a = Path(); a.moveTo(x, y); a.lineTo(x - s * .1f, y - s * .06f); a.lineTo(x - s * .1f, y + s * .06f); a.close(); drawPath(a, c)
              val b = Path(); b.moveTo(x, y); b.lineTo(x + s * .1f, y - s * .06f); b.lineTo(x + s * .1f, y + s * .06f); b.close(); drawPath(b, c)
              drawCircle(Color.White.copy(alpha = .85f), s * .025f, Offset(x, y))
          }

          /** Neko: menu button + mood display. mood 0 idle 1 happy 2 focus 3 love 4 oops 5 sleep. Tap = menu, hold = nap. */
          @Composable
          fun Mascot(mood: Int, sz: Float, hold: (() -> Unit)? = null, f: () -> Unit) {
              var pr by remember { mutableStateOf(false) }
              val sq by animateFloatAsState(if (pr) .85f else 1f, spring(.3f, 500f), label = "ms")
              var blink by remember { mutableStateOf(false) }
              val anim = T.an > .01f
              LaunchedEffect(anim) { if (anim) while (true) { delay((2200L..4600L).random()); blink = true; delay(130); blink = false } }
              val br = if (anim) rememberInfiniteTransition(label = "br").animateFloat(0f, 1f, infiniteRepeatable(tween(2200), RepeatMode.Reverse), label = "b").value else 0f
              val fU by rememberUpdatedState(f)
              val hU by rememberUpdatedState(hold)
              val haptic = LocalHapticFeedback.current
              val lp: ((Offset) -> Unit)? = if (hold != null) ({ _: Offset ->
                  if (T.hap > .5f) haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                  hU?.invoke()
              }) else null
              val ac = T.hsv(T.ah + T.mh, T.sat, T.av); val ac2 = T.ac2; val dk = T.dk
              val ear = T.ear.toInt(); val cheek = T.cheek; val blush = T.blush; val whisk = T.whisk > .5f; val bow = T.bow > .5f
              Canvas(
                  Modifier.size(d(sz)).graphicsLayer { scaleX = sq * (1f + .035f * br); scaleY = sq * (1f - .035f * br) }
                      .pointerInput(hold != null) {
                          detectTapGestures(onPress = { pr = true; tryAwaitRelease(); pr = false }, onLongPress = lp, onTap = { fU() })
                      }
              ) {
                  val s = size.minDimension
                  val sk = Stroke(s * .035f, cap = StrokeCap.Round)
                  drawEars(ac, ac2, s, ear)
                  val cr = s * (.09f + .1f * cheek)
                  drawOval(ac, Offset(s * .03f, s * .17f), Size(s * .94f, s * .8f))
                  drawCircle(ac, cr, Offset(s * .17f, s * .72f)); drawCircle(ac, cr, Offset(s * .83f, s * .72f))
                  drawOval(ac, Offset(s * .2f, s * .8f), Size(s * .6f, s * .18f))
                  drawOval(Color.White.copy(alpha = .28f), Offset(s * .16f, s * .24f), Size(s * .3f, s * .12f))
                  if (bow) drawBow(ac2, s)
                  drawOval(ac2.copy(alpha = .75f * blush), Offset(s * .1f, s * .63f), Size(s * .17f, s * .1f))
                  drawOval(ac2.copy(alpha = .75f * blush), Offset(s * .73f, s * .63f), Size(s * .17f, s * .1f))
                  if (whisk) for (side in 0..1) {
                      val dir = if (side == 0) -1f else 1f; val bx = if (side == 0) s * .22f else s * .78f
                      for (k in -1..1) drawLine(dk.copy(alpha = .5f), Offset(bx, s * (.6f + .05f * k)), Offset(bx + dir * s * .2f, s * (.57f + .09f * k)), s * .02f, StrokeCap.Round)
                  }
                  val ey = s * .5f
                  for (side in 0..1) {
                      val cx = if (side == 0) s * .33f else s * .67f
                      val dir = if (side == 0) 1f else -1f
                      if (blink || mood == 5) drawArc(dk, 20f, 140f, false, Offset(cx - s * .06f, ey - s * .02f), Size(s * .12f, s * .08f), style = sk)
                      else when (mood) {
                          1 -> drawArc(dk, 200f, 140f, false, Offset(cx - s * .07f, ey - s * .02f), Size(s * .14f, s * .1f), style = sk)
                          3 -> {
                              val hc = Color(0xFFFF4F7A); val r = s * .07f
                              drawCircle(hc, r * .55f, Offset(cx - r * .5f, ey - r * .2f)); drawCircle(hc, r * .55f, Offset(cx + r * .5f, ey - r * .2f))
                              val pa = Path(); pa.moveTo(cx - r * 1.02f, ey); pa.lineTo(cx, ey + r); pa.lineTo(cx + r * 1.02f, ey); pa.close(); drawPath(pa, hc)
                          }
                          4 -> {
                              drawLine(dk, Offset(cx - dir * s * .05f, ey - s * .05f), Offset(cx + dir * s * .04f, ey), s * .035f, StrokeCap.Round)
                              drawLine(dk, Offset(cx + dir * s * .04f, ey), Offset(cx - dir * s * .05f, ey + s * .05f), s * .035f, StrokeCap.Round)
                          }
                          else -> {
                              drawCircle(dk, s * (if (mood == 2) .045f else .06f), Offset(cx, ey))
                              drawCircle(Color.White, s * .018f, Offset(cx - s * .018f, ey - s * .02f))
                          }
                      }
                  }
                  val nose = Path(); nose.moveTo(s * .46f, s * .585f); nose.lineTo(s * .54f, s * .585f); nose.lineTo(s * .5f, s * .625f); nose.close()
                  drawPath(nose, ac2)
                  when (mood) {
                      1, 3 -> { drawArc(dk, 0f, 180f, true, Offset(s * .44f, s * .63f), Size(s * .12f, s * .1f)); drawCircle(ac2, s * .025f, Offset(s * .5f, s * .71f)) }
                      2, 5 -> drawCircle(dk, s * .025f, Offset(s * .5f, s * .66f))
                      4 -> drawLine(dk, Offset(s * .45f, s * .66f), Offset(s * .55f, s * .66f), s * .03f, StrokeCap.Round)
                      else -> {
                          drawArc(dk, 20f, 140f, false, Offset(s * .42f, s * .62f), Size(s * .08f, s * .07f), style = sk)
                          drawArc(dk, 20f, 140f, false, Offset(s * .5f, s * .62f), Size(s * .08f, s * .07f), style = sk)
                      }
                  }
                  if (mood == 5) {
                      val z = s * (.78f + .03f * br)
                      drawLine(dk, Offset(z, s * .08f), Offset(z + s * .1f, s * .08f), s * .03f, StrokeCap.Round)
                      drawLine(dk, Offset(z + s * .1f, s * .08f), Offset(z, s * .18f), s * .03f, StrokeCap.Round)
                      drawLine(dk, Offset(z, s * .18f), Offset(z + s * .1f, s * .18f), s * .03f, StrokeCap.Round)
                  }
              }
          }

          // ───────────────────────── panels ─────────────────────────
          @Composable
          fun ToolsPanel(cur: Tool, pick: (Tool) -> Unit, hold: (Tool) -> Unit) {
              if (T.hint > .5f) Tx("tap = pick   hold = what is this + set as alt tool", T.ink.copy(alpha = .5f), sz = 8f)
              val cols = T.cols.toInt().coerceIn(3, 7)
              Tool.values().toList().chunked(cols).forEachIndexed { r, row ->
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      row.forEachIndexed { c, t ->
                          Column(Modifier.pop(r * cols + c), horizontalAlignment = Alignment.CenterHorizontally) {
                              IB(Ik.valueOf(t.code), t == cur, sz = 46f, hold = { hold(t) }) { pick(t) }
                              Tx(TN[t.ordinal], if (t == cur) T.ac else T.ink.copy(alpha = .7f), sz = 9f)
                          }
                      }
                  }
              }
          }

          @Composable
          fun BrushPanel(e: Engine) {
              val rv = U.rev
              var more by remember { mutableStateOf(false) }
              val ps = penParams(e)
              when (e.tool) {
                  Tool.LIQUIFY -> {
                      Choice("LIQUIFY MODE", listOf("PUSH", "PINCH", "BLOAT", "SWIRL"), e.liqMode) { e.liqMode = it; U.bump() }
                      R2(PP("RADIUS", 10f, 500f, 5f, true, { e.liqR }, { e.liqR = it }, "brush radius"))
                      R2(PP("STRENGTH", .05f, 3f, .05f, false, { e.liqS }, { e.liqS = it }, "how hard it pushes"))
                  }
                  Tool.GRAD -> {
                      Choice("GRADIENT", listOf("LINEAR", "RADIAL", "CONIC", "MIRROR"), e.pen.gradMode) { e.pen.gradMode = it; U.bump() }
                      Choice("ENDS", listOf("FG > BG", "FG > FADE"), if (e.pen.gradFade) 1 else 0) { e.pen.gradFade = it == 1; U.bump() }
                  }
                  Tool.RECT, Tool.OVAL -> Choice("SHAPE", listOf("OUTLINE", "FILL", "BOTH"), e.pen.shapeFill) { e.pen.shapeFill = it; U.bump() }
                  Tool.FILL -> R2(ps[16])
                  else -> {}
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PRESETS.forEachIndexed { i, (n, vals) -> Box(Modifier.pop(i)) { Pill(n) { e.pen.load(vals); U.bump() } } }
              }
              R2(ps[0]); R2(ps[1])
              val pg by animateFloatAsState(if (more) 1f else 0f, spring(.6f, 300f), label = "more")
              Pill(if (more) "LESS" else "MORE", more, Ik.CV, pg) { more = !more }
              if (more) {
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Pill("FOLLOW", e.pen.follow) { e.pen.follow = !e.pen.follow; U.bump() }
                      SYM.forEachIndexed { i, s -> Pill(s, e.symMode == i) { e.symMode = i; U.bump() } }
                  }
                  ps.drop(2).forEach { R2(it) }
              }
          }

          @Composable
          fun ColorPanel(e: Engine, feel: (Int, String) -> Unit) {
              val rv = U.rev
              val hc = Color(android.graphics.Color.HSVToColor(floatArrayOf(U.hh, 1f, 1f)))
              fun ap() { val c = U.col(); if (U.tgt == 0) e.pen.color = c else e.pen.color2 = c; U.bump() }
              Row(horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  Pill("FG", U.tgt == 0) { U.tgt = 0; U.from(e.pen.color) }
                  Pill("BG", U.tgt == 1) { U.tgt = 1; U.from(e.pen.color2) }
                  Pill("SWAP", false, Ik.SY) {
                      val t = e.pen.color; e.pen.color = e.pen.color2; e.pen.color2 = t
                      U.from(if (U.tgt == 0) e.pen.color else e.pen.color2); U.bump()
                  }
                  Tx("#%06X".format(U.col() and 0xFFFFFF))
              }
              Box(
                  Modifier.fillMaxWidth().height(d(150f)).clip(rs(.8f)).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.White, hc)))
                      drawRect(Brush.verticalGradient(listOf(Color.Transparent, Color.Black)))
                      drawCircle(Color.White, radius = 10f, center = Offset(U.ss * size.width, (1f - U.bb) * size.height), style = Stroke(3.5f))
                  }.touch { x, y -> U.ss = x; U.bb = 1f - y; ap() }
              )
              Box(
                  Modifier.fillMaxWidth().height(d(26f)).clip(RoundedCornerShape(50)).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.Red, Color.Yellow, Color.Green, Color.Cyan, Color.Blue, Color.Magenta, Color.Red)))
                      drawCircle(Color.White, size.height / 2f - 2f, Offset(U.hh / 360f * size.width, size.height / 2f), style = Stroke(4f))
                  }.touch { x, _ -> U.hh = x * 360f; ap() }
              )
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                  PASTEL.forEachIndexed { i, c ->
                      Box(Modifier.pop(i)) {
                          Bub(36f, false, anim = false, pad = .26f, f = { U.from(Color(c).toArgb()); ap(); feel(1, "pretty!") }) {
                              drawCircle(Color(c), size.minDimension / 2f)
                          }
                      }
                  }
              }
          }

          @Composable
          fun LayerPanel(e: Engine, v: CanvasView, feel: (Int, String) -> Unit) {
              if (T.hint > .5f) Tx("tap = do it   hold = the bonus move", T.ink.copy(alpha = .5f), sz = 8f)
              val ops: List<Triple<Ik, () -> Unit, () -> Unit>> = listOf(
                  Triple(Ik.PL, { v.gl { e.addLayer() }; feel(1, "new layer!") }, { v.gl { e.addLayer(below = true) }; feel(1, "layer below!") }),
                  Triple(Ik.DP, { v.gl { e.dupLayer() } }, { v.gl { e.dupLayer(); e.setBlend(e.cur, 1) }; feel(1, "multiply copy") }),
                  Triple(Ik.TR, { v.gl { e.delLayer() }; feel(4, "bye layer") }, { v.gl { e.delHidden() }; feel(4, "hidden layers gone") }),
                  Triple(Ik.UP, { v.gl { e.moveLayer(1) } }, { v.gl { e.moveLayerTo(true) }; feel(1, "to the top") }),
                  Triple(Ik.DN, { v.gl { e.moveLayer(-1) } }, { v.gl { e.moveLayerTo(false) }; feel(1, "to the bottom") }),
                  Triple(Ik.MG, { v.gl { e.mergeDown() } }, { v.gl { e.flatten() }; feel(1, "flattened") }),
                  Triple(Ik.CX, { v.gl { e.clearLayer() }; feel(1, "squeaky clean") }, { v.gl { e.fillLayerColor() }; feel(1, "painted it all") }),
              )
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  ops.forEachIndexed { i, (k, a, h) -> Box(Modifier.pop(i)) { IB(k, sz = 40f, hold = h) { a() } } }
              }
              e.info.indices.reversed().forEachIndexed { n, i ->
                  val l = e.info[i]
                  Row(
                      Modifier.pop(n).fillMaxWidth().clip(rs(.6f)).background(if (i == e.curUi) T.ac.copy(alpha = .16f) else Color.Transparent)
                          .clickable { v.gl { e.select(i) } }.padding(d(3f)),
                      verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))
                  ) {
                      Tx("L" + (i + 1), if (i == e.curUi) T.ac else T.ink, Modifier.width(d(28f)))
                      IB(if (l.show) Ik.EY else Ik.EN, l.show, sz = 34f, anim = false, hold = { v.gl { e.solo(i) }; feel(1, "solo!") }) { v.gl { e.setShow(i, !l.show) } }
                      Pill(BL[l.blend], hold = { v.gl { e.setBlend(i, 0) } }) { v.gl { e.setBlend(i, (l.blend + 1) % 4) } }
                      CS(l.alpha, Modifier.weight(1f)) { x -> v.gl { e.setAlpha(i, x) } }
                  }
              }
          }

          @Composable
          fun MenuPanel(
              e: Engine, sym: () -> Unit, symHold: () -> Unit, save: () -> Unit, share: () -> Unit,
              theme: () -> Unit, dice: () -> Unit, rotReset: () -> Unit, hide: () -> Unit, home: () -> Unit
          ) {
              val rv = U.rev
              var sure by remember { mutableStateOf(false) }
              if (T.hint > .5f) Tx("hold: SYM = more axes   SAVE = share   STYLE = surprise   ROT = reset angle", T.ink.copy(alpha = .5f), sz = 8f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                  Pill("SYM " + SYM[e.symMode] + (if (e.symMode == 4) " " + e.symN else ""), e.symMode != 0, Ik.SY, hold = symHold) { sym() }
                  Pill("SAVE", false, Ik.SV, hold = share) { save() }
                  Pill("STYLE", false, Ik.TH, hold = dice) { theme() }
                  Pill(if (e.rotLock) "ROT LOCKED" else "ROT FREE", e.rotLock, Ik.LK, hold = rotReset) { e.rotLock = !e.rotLock; U.bump() }
                  Pill("HIDE", false, Ik.CV) { hide() }
                  Pill(if (sure) "SURE? ART VANISHES" else "HOME", sure, Ik.HM) { if (sure) home() else sure = true }
              }
          }

          @Composable
          fun ThemePanel(done: () -> Unit) {
              val rv = U.rev
              var grp by remember { mutableIntStateOf(0) }
              val gs = themeGroups()
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  THEME_PRESETS.forEachIndexed { i, v ->
                      Box(Modifier.pop(i)) {
                          Bub(38f, false, anim = false, pad = .2f, f = { applyPreset(v); U.bump() }) {
                              drawCircle(T.hsv(v[0], v[1], v[2]), size.minDimension / 2f)
                              drawCircle(T.hsv(v[8], v[9], .9f), size.minDimension * .2f, Offset(size.width * .7f, size.height * .3f))
                          }
                      }
                  }
              }
              if (T.hint > .5f) Tx("presets: " + THEME_NAMES.joinToString(" - ").lowercase(), T.ink.copy(alpha = .5f), sz = 8f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  gs.forEachIndexed { i, g -> Pill(g.first, grp == i) { grp = i } }
                  Pill("DONE", true, Ik.OK, f = done)
              }
              val skip: Set<String> = when (grp) {
                  2 -> setOf("FONT", "TITLE FONT", "UI SCALE", "HINTS")
                  3 -> setOf("DOCK POS", "DOCK ALIGN", "DOCK STYLE", "LABELS", "TOOL COLS", "HAPTICS")
                  4 -> setOf("EARS", "WHISKERS", "BOW")
                  5 -> setOf("PATTERN")
                  6 -> setOf("RIPPLE")
                  else -> emptySet()
              }
              when (grp) {
                  2 -> {
                      Choice("UI SCALE", SC_N, SC_V.indices.minByOrNull { kotlin.math.abs(SC_V[it] - T.sc) } ?: 2) { T.sc = SC_V[it]; U.bump() }
                      Choice("BODY FONT", FONT_NAMES, T.fnt.toInt(), true) { T.fnt = it.toFloat(); U.bump() }
                      Choice("TITLE FONT", FONT_NAMES, T.fnt2.toInt(), true) { T.fnt2 = it.toFloat(); U.bump() }
                      Choice("HINTS", listOf("OFF", "ON"), T.hint.toInt()) { T.hint = it.toFloat(); U.bump() }
                  }
                  3 -> {
                      Choice("DOCK POSITION", listOf("BOTTOM", "TOP"), T.dpos.toInt()) { T.dpos = it.toFloat(); U.bump() }
                      Choice("DOCK ALIGN", listOf("LEFT", "CENTER", "RIGHT"), T.dal.toInt()) { T.dal = it.toFloat(); U.bump() }
                      Choice("DOCK STYLE", listOf("PILL", "FLOATING", "COMPACT"), T.dst.toInt()) { T.dst = it.toFloat(); U.bump() }
                      Choice("LABELS", listOf("OFF", "ON"), T.lbl.toInt()) { T.lbl = it.toFloat(); U.bump() }
                      Choice("TOOL COLUMNS", listOf("3", "4", "5", "6", "7"), T.cols.toInt() - 3) { T.cols = (it + 3).toFloat(); U.bump() }
                      Choice("HAPTICS", listOf("OFF", "ON"), T.hap.toInt()) { T.hap = it.toFloat(); U.bump() }
                  }
                  4 -> {
                      Choice("EARS", listOf("ROUND", "CAT", "BUNNY"), T.ear.toInt()) { T.ear = it.toFloat(); U.bump() }
                      Choice("WHISKERS", listOf("OFF", "ON"), T.whisk.toInt()) { T.whisk = it.toFloat(); U.bump() }
                      Choice("BOW", listOf("OFF", "ON"), T.bow.toInt()) { T.bow = it.toFloat(); U.bump() }
                  }
                  5 -> Choice("PATTERN", PAT_NAMES, T.pat.toInt()) { T.pat = it.toFloat(); U.bump() }
                  6 -> Choice("TAP RIPPLE", listOf("OFF", "ON"), T.rip.toInt()) { T.rip = it.toFloat(); U.bump() }
                  else -> {}
              }
              gs[grp].second.filter { it.n !in skip }.forEach { R2(it) }
          }

          fun saveBmp(ctx: Context, b: Bitmap, share: Boolean = false) {
              val n = "Neko_" + System.currentTimeMillis() + ".png"
              var ok = true
              var uri: Uri? = null
              try {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val cv = ContentValues()
                      cv.put(MediaStore.Images.Media.DISPLAY_NAME, n)
                      cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                      cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Neko")
                      val u = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv)!!
                      ctx.contentResolver.openOutputStream(u)!!.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                      uri = u
                  } else {
                      val f = java.io.File(ctx.getExternalFilesDir(Environment.DIRECTORY_PICTURES), n)
                      f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  }
              } catch (x: Exception) { ok = false }
              val u2 = uri
              Handler(Looper.getMainLooper()).post {
                  Toast.makeText(ctx, if (ok) "saved " + n else "save failed", Toast.LENGTH_LONG).show()
                  if (share && ok && u2 != null) {
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "image/png"; i.putExtra(Intent.EXTRA_STREAM, u2); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      val ch = Intent.createChooser(i, "share"); ch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(ch)
                  }
              }
          }

          // ───────────────────────── app ─────────────────────────
          @Composable
          fun Compass(e: Engine, v: CanvasView, hold: () -> Unit, onReset: () -> Unit) {
              val moved by remember { derivedStateOf { e.rot != 0f || e.zoom != 1f } }
              AnimatedVisibility(visible = moved, enter = scaleIn(spring(.5f, 400f)) + fadeIn(), exit = scaleOut() + fadeOut()) {
                  Bub(40f, false, anim = false, pad = .24f, hold = hold, f = { e.resetView(); v.requestRender(); onReset() }) { ic(Ik.CP, T.ink, T.ac2, e.rot / 6.2832f) }
              }
          }

          @Composable
          fun App(e: Engine, onHome: () -> Unit) {
              val ctx = LocalContext.current
              val v = remember { CanvasView(ctx, e) }
              val rv = U.rev
              val sig = T.sig()
              val scope = rememberCoroutineScope()
              var tool by remember { mutableStateOf(Tool.BRUSH) }
              var alt by remember { mutableStateOf(Tool.ERASER) }
              var presetI by remember { mutableIntStateOf(0) }
              var panel by remember { mutableIntStateOf(0) }   // 0 none 1 tools 2 brush 3 color 4 layers 5 menu 6 style 7 fx
              var last by remember { mutableIntStateOf(1) }
              var prevShown by remember { mutableIntStateOf(1) }
              var hud by remember { mutableStateOf(true) }
              var mood by remember { mutableIntStateOf(0) }
              var say by remember { mutableStateOf("") }
              var sayOn by remember { mutableStateOf(false) }
              var backT by remember { mutableLongStateOf(0L) }
              val job = remember { arrayOfNulls<Job>(1) }
              fun feel(m: Int, s: String) {
                  job[0]?.cancel(); mood = m; say = s; sayOn = true
                  job[0] = scope.launch { delay(1600); mood = 0; sayOn = false }
              }
              fun setTool(t: Tool) { tool = t; e.tool = t; U.bump() }
              SideEffect {
                  T.push(e); v.kick()
                  if (panel != 0 && panel != last) { prevShown = last; last = panel }
              }
              LaunchedEffect(Unit) { e.onPick = { c -> U.tgt = 0; U.from(c); U.bump() }; feel(1, "meow~ let's draw!") }
              LaunchedEffect(e.busy) { if (e.busy && (panel == 1 || panel == 5)) panel = 0 }
              LaunchedEffect(panel) {
                  e.pulse(); v.kick()
                  if (panel == 7) v.gl { e.fxOpen() } else v.gl { e.fxClose() }
              }
              BackHandler {
                  if (panel != 0) panel = 0
                  else if (!hud) hud = true
                  else {
                      val n = System.currentTimeMillis()
                      if (n - backT < 2000) onHome() else { backT = n; feel(4, "back again to leave") }
                  }
              }
              val m = if (!hud) 5 else if (e.busy) 2 else mood
              val top = T.dpos > .5f
              val dockA by animateFloatAsState(if (e.busy) .08f else 1f, label = "dock")
              val bs = if (T.dst.toInt() == 2) 38f else 44f
              val shown = if (panel != 0) panel else last
              val oy = if (top) 0f else 1f
              val ox = when (shown) { 5, 6 -> .1f; 1 -> .3f; 2 -> .46f; 3 -> .62f; 4 -> .78f; 7 -> .92f; else -> .5f }
              val dal = when (T.dal.toInt()) { 0 -> Alignment.Start; 2 -> Alignment.End; else -> Alignment.CenterHorizontally }

              val panelC: @Composable ColumnScope.() -> Unit = {
                  AnimatedVisibility(
                      visible = panel != 0,
                      enter = fadeIn() + scaleIn(spring(.5f, 340f), initialScale = .86f, transformOrigin = TransformOrigin(ox, oy)) + expandVertically(),
                      exit = fadeOut() + scaleOut(targetScale = .9f, transformOrigin = TransformOrigin(ox, oy)) + shrinkVertically()
                  ) {
                      Column(
                          Modifier.fillMaxWidth().padding(vertical = d(6f)).heightIn(max = d(T.pnh)).clip(rs()).background(T.panel)
                              .animateContentSize().verticalScroll(rememberScrollState()).padding(d(10f))
                      ) {
                          key(shown) {
                              val a = remember { Animatable(0f) }
                              LaunchedEffect(Unit) { if (T.an > .01f) { a.snapTo(0f); a.animateTo(1f, spring(.5f, 280f)) } else a.snapTo(1f) }
                              val dir = if (shown >= prevShown) 1f else -1f
                              Column(
                                  Modifier.graphicsLayer {
                                      val t = a.value
                                      translationX = (1f - t) * 70f * dir; alpha = t.coerceIn(0f, 1f); scaleX = .94f + .06f * t; scaleY = .94f + .06f * t
                                  },
                                  verticalArrangement = Arrangement.spacedBy(d(8f))
                              ) {
                                  when (shown) {
                                      1 -> ToolsPanel(tool, { t -> setTool(t); feel(1, SAY[t.ordinal]); panel = 0 }, { t -> alt = t; feel(1, TD[t.ordinal]) })
                                      2 -> BrushPanel(e)
                                      3 -> ColorPanel(e) { a2, b -> feel(a2, b) }
                                      4 -> LayerPanel(e, v) { a2, b -> feel(a2, b) }
                                      5 -> MenuPanel(
                                          e,
                                          sym = { e.symMode = (e.symMode + 1) % 5; U.bump(); feel(1, "sym " + SYM[e.symMode]) },
                                          symHold = { e.symMode = 4; e.symN = if (e.symN >= 12) 2 else e.symN + 1; U.bump(); feel(1, "radial x" + e.symN) },
                                          save = { v.gl { val b = e.snapshot(); Thread { saveBmp(ctx, b) }.start() }; feel(3, "saved!"); panel = 0 },
                                          share = { v.gl { val b = e.snapshot(); Thread { saveBmp(ctx, b, true) }.start() }; feel(3, "sharing!"); panel = 0 },
                                          theme = { panel = 6 },
                                          dice = { randomTheme(); U.bump(); feel(3, "surprise!") },
                                          rotReset = { e.resetRot(); v.requestRender(); feel(1, "angle reset") },
                                          hide = { hud = false; panel = 0 },
                                          home = { onHome() }
                                      )
                                      6 -> ThemePanel { T.save(ctx.getSharedPreferences("t", 0)); panel = 0; feel(3, "so cute!") }
                                      else -> FxPanel(e, v, { panel = 0; feel(3, "sparkly!") }, { panel = 0 })
                                  }
                              }
                          }
                      }
                  }
              }
              val sayC: @Composable ColumnScope.() -> Unit = {
                  AnimatedVisibility(visible = sayOn, enter = scaleIn(spring(.5f, 500f)) + fadeIn(), exit = fadeOut() + scaleOut()) {
                      Tx(say, T.dk, Modifier.padding(start = d(6f), bottom = d(4f), top = d(4f)).clip(RoundedCornerShape(50)).background(T.ac).padding(horizontal = d(12f), vertical = d(5f)), head = true)
                  }
              }
              val dockC: @Composable ColumnScope.() -> Unit = {
                  Row(
                      Modifier.align(dal).then(if (T.dst.toInt() == 1) Modifier else Modifier.clip(RoundedCornerShape(50)).background(T.panel)).padding(d(6f)),
                      horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Mascot(m, bs + 2f, hold = { hud = false; panel = 0 }) { panel = if (panel == 5) 0 else 5 }
                          if (T.lbl > .5f) Tx("menu", T.ink.copy(alpha = .7f), sz = 8f)
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          IB(Ik.valueOf(tool.code), true, sz = bs, anim = !e.busy, hold = { val a = alt; alt = tool; setTool(a); feel(1, "swap! " + TN[a.ordinal]) }) { panel = if (panel == 1) 0 else 1 }
                          if (T.lbl > .5f) Tx(TN[tool.ordinal], T.ink.copy(alpha = .7f), sz = 8f)
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          val nz = (ln(e.pen.size) / ln(1000f)).coerceIn(0f, 1f)
                          val hd = e.pen.hardness.coerceIn(0f, .97f)
                          Bub(bs, panel == 2, anim = false, pad = .2f, hold = {
                              presetI = (presetI + 1) % PRESETS.size; e.pen.load(PRESETS[presetI].second); U.bump(); feel(1, PRESETS[presetI].first.lowercase() + " brush")
                          }, f = { panel = if (panel == 2) 0 else 2 }) {
                              val col = if (panel == 2) T.dk else T.ink
                              drawCircle(Brush.radialGradient(0f to col, hd to col, 1f to col.copy(alpha = 0f)), size.minDimension / 2f * (.35f + .65f * nz))
                          }
                          if (T.lbl > .5f) Tx("brush", T.ink.copy(alpha = .7f), sz = 8f)
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Bub(bs, panel == 3, anim = false, pad = .24f, hold = {
                              val t = e.pen.color; e.pen.color = e.pen.color2; e.pen.color2 = t; U.from(if (U.tgt == 0) e.pen.color else e.pen.color2); U.bump(); feel(1, "swapped colors")
                          }, f = { panel = if (panel == 3) 0 else 3; U.from(if (U.tgt == 0) e.pen.color else e.pen.color2) }) {
                              val s2 = size.minDimension
                              drawCircle(Color(e.pen.color2), s2 * .3f, Offset(s2 * .66f, s2 * .66f))
                              drawCircle(Color.White, s2 * .36f, Offset(s2 * .4f, s2 * .4f))
                              drawCircle(Color(e.pen.color), s2 * .29f, Offset(s2 * .4f, s2 * .4f))
                          }
                          if (T.lbl > .5f) Tx("color", T.ink.copy(alpha = .7f), sz = 8f)
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Box {
                              IB(Ik.LY, panel == 4, sz = bs, anim = false, hold = { v.gl { e.addLayer() }; feel(1, "new layer!") }) { panel = if (panel == 4) 0 else 4 }
                              Tx("" + e.info.size, T.dk, Modifier.align(Alignment.BottomEnd).clip(CircleShape).background(T.ac2).padding(horizontal = d(5f)), 9f)
                          }
                          if (T.lbl > .5f) Tx("layers", T.ink.copy(alpha = .7f), sz = 8f)
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          IB(Ik.FX, panel == 7, sz = bs, anim = false, hold = {
                              if (FxMem.idx >= 0) {
                                  val i = FxMem.idx; val vv = FxMem.vals.copyOf()
                                  v.gl { e.fxQuick(i, vv) }; feel(3, "again: " + FXS[i].n.lowercase())
                              } else feel(4, "no filter used yet")
                          }) { panel = if (panel == 7) 0 else 7 }
                          if (T.lbl > .5f) Tx("fx", T.ink.copy(alpha = .7f), sz = 8f)
                      }
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  AndroidView({ v }, Modifier.fillMaxSize())
                  AnimatedVisibility(
                      visible = hud, modifier = Modifier.fillMaxSize(),
                      enter = fadeIn() + slideInVertically(spring(.55f, 300f)) { if (top) -it / 3 else it / 3 },
                      exit = fadeOut() + slideOutVertically { if (top) -it / 3 else it / 3 }
                  ) {
                      Box(Modifier.fillMaxSize()) {
                          Row(
                              Modifier.align(if (top) Alignment.BottomStart else Alignment.TopStart)
                                  .then(if (top) Modifier.navigationBarsPadding() else Modifier.statusBarsPadding()).padding(d(10f)),
                              horizontalArrangement = Arrangement.spacedBy(d(8f))
                          ) {
                              IB(Ik.UN, en = e.canUndo, anim = false, hold = { v.gl { e.undo() } }, rep = true) { v.gl { e.undo() }; feel(4, "oops!") }
                              IB(Ik.RE, en = e.canRedo, anim = false, hold = { v.gl { e.redo() } }, rep = true) { v.gl { e.redo() }; feel(1, "again!") }
                          }
                          Box(Modifier.align(Alignment.TopEnd).statusBarsPadding().padding(d(10f))) {
                              Compass(e, v, { e.rotLock = !e.rotLock; U.bump(); feel(1, if (e.rotLock) "rotation locked" else "rotation free") }) { feel(1, "view reset") }
                          }
                          Column(
                              Modifier.align(if (top) Alignment.TopCenter else Alignment.BottomCenter)
                                  .then(if (top) Modifier.statusBarsPadding() else Modifier.navigationBarsPadding())
                                  .padding(d(8f)).graphicsLayer { alpha = dockA },
                              horizontalAlignment = Alignment.Start
                          ) {
                              if (top) { dockC(); sayC(); panelC() } else { panelC(); sayC(); dockC() }
                          }
                      }
                  }
                  AnimatedVisibility(
                      visible = !hud, modifier = Modifier.align(Alignment.BottomStart),
                      enter = scaleIn(spring(.5f, 400f)) + fadeIn(), exit = scaleOut() + fadeOut()
                  ) {
                      Box(Modifier.navigationBarsPadding().padding(d(10f))) { Mascot(5, 52f) { hud = true; feel(1, "meow!") } }
                  }
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Fx.kt <<'EOF_SRC'
