# Single-file pipeline: this YAML contains the whole Android app (Kotlin) + build + sign + release.
# Edit the source blocks in the 'src' step and push: every push builds an updatable APK.
name: apk
on:
  push: {branches: [main], tags: ['v*']}
  workflow_dispatch:
concurrency: {group: "apk-${{github.ref}}", cancel-in-progress: true}
permissions: {contents: write}
env: {N: Canvas}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - name: src
        run: |
          cat > settings.gradle.kts <<'EOF_SRC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Canvas"
          include(":app")
          EOF_SRC
          cat > build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_SRC
          cat > gradle.properties <<'EOF_SRC'
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_SRC
          cat > .gitignore <<'EOF_SRC'
          build/
          .gradle/
          local.properties
          *.jks
          EOF_SRC
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "dev.canvas"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.canvas"; minSdk = 24; targetSdk = 35
                  versionCode = (findProperty("versionCode") as String?)?.toInt() ?: 1
                  versionName = findProperty("versionName") as String? ?: "dev"
              }
              buildTypes { release { isMinifyEnabled = true; isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt")) } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
          }
          EOF_SRC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <application android:label="Neko Canvas" android:icon="@mipmap/ic_launcher" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0" android:color="#FFE3C2" />
                          <item android:offset="1" android:color="#FFB8CC" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:fillColor="#40FFFFFF" android:pathData="M12,22 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0 z" />
              <path android:fillColor="#33FFFFFF" android:pathData="M86,78 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 z" />
              <path android:fillColor="#33FFFFFF" android:pathData="M18,88 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 z" />
              <path android:fillColor="#40FFFFFF" android:pathData="M90,16 l1.2,3.8 l3.8,1.2 l-3.8,1.2 l-1.2,3.8 l-1.2,-3.8 l-3.8,-1.2 l3.8,-1.2 z" />
          </vector>
          EOF_SRC
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FF9A5C" android:pathData="M30,50 L33,24 L52,40 z" />
              <path android:fillColor="#FF9A5C" android:pathData="M78,50 L75,24 L56,40 z" />
              <path android:fillColor="#FFD0B0" android:pathData="M35,45 L36,31 L47,40 z" />
              <path android:fillColor="#FFD0B0" android:pathData="M73,45 L72,31 L61,40 z" />
              <path android:fillColor="#FFA866" android:pathData="M27,60 a27,23 0 1,0 54,0 a27,23 0 1,0 -54,0 z" />
              <path android:fillColor="#FFA866" android:pathData="M24,68 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0 z" />
              <path android:fillColor="#FFA866" android:pathData="M64,68 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0 z" />
              <path android:fillColor="#FFA866" android:pathData="M36,72 a18,8 0 1,0 36,0 a18,8 0 1,0 -36,0 z" />
              <path android:fillColor="#66FFFFFF" android:pathData="M35,48 a8,3.5 0 1,0 16,0 a8,3.5 0 1,0 -16,0 z" />
              <path android:fillColor="#99FF6F9C" android:pathData="M26,66 a6,3.6 0 1,0 12,0 a6,3.6 0 1,0 -12,0 z" />
              <path android:fillColor="#99FF6F9C" android:pathData="M70,66 a6,3.6 0 1,0 12,0 a6,3.6 0 1,0 -12,0 z" />
              <path android:fillColor="#2A1722" android:pathData="M40.8,58 a3.2,3.2 0 1,0 6.4,0 a3.2,3.2 0 1,0 -6.4,0 z" />
              <path android:fillColor="#2A1722" android:pathData="M60.8,58 a3.2,3.2 0 1,0 6.4,0 a3.2,3.2 0 1,0 -6.4,0 z" />
              <path android:fillColor="#FFFFFF" android:pathData="M43.9,57 a1.1,1.1 0 1,0 2.2,0 a1.1,1.1 0 1,0 -2.2,0 z" />
              <path android:fillColor="#FFFFFF" android:pathData="M63.9,57 a1.1,1.1 0 1,0 2.2,0 a1.1,1.1 0 1,0 -2.2,0 z" />
              <path android:fillColor="#FF7A9C" android:pathData="M51.5,63 L56.5,63 L54,66.5 z" />
              <path
                  android:fillColor="#00000000"
                  android:pathData="M54,66.5 q-2.5,3.5 -5,0 M54,66.5 q2.5,3.5 5,0"
                  android:strokeColor="#2A1722"
                  android:strokeLineCap="round"
                  android:strokeWidth="1.8" />
              <path
                  android:fillColor="#00000000"
                  android:pathData="M30,62 L21,60 M30,66 L20,66 M30,70 L22,72 M78,62 L87,60 M78,66 L88,66 M78,70 L86,72"
                  android:strokeColor="#8A2A1722"
                  android:strokeLineCap="round"
                  android:strokeWidth="1.2" />
              <path android:fillColor="#FFFFFF" android:pathData="M84,26 l1.6,4.6 l4.6,1.6 l-4.6,1.6 l-1.6,4.6 l-1.6,-4.6 l-4.6,-1.6 l4.6,-1.6 z" />
          </vector>
          EOF_SRC
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF_SRC
          mkdir -p app/src/main/res/mipmap-anydpi
          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_bg" />
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/MainActivity.kt <<'EOF_SRC'
          package dev.canvas

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalContext
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  T.load(getSharedPreferences("t", 0))
                  setContent { Root() }
              }
          }

          @Composable
          fun Root() {
              val ctx = LocalContext.current
              ScaleAnim()
              val st = remember { BenchState().also { it.res = loadBench(ctx) } }
              var eng by remember { mutableStateOf<Engine?>(null) }
              val e = eng
              if (e == null) Home(st) { c -> eng = Engine(c.w, c.h, c.paper, c.pat, c.layers, c.budget) }
              else App(e) { eng = null }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Engine.kt <<'EOF_SRC'
          package dev.canvas

          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.opengl.GLES30 as G
          import android.opengl.GLSurfaceView
          import android.os.SystemClock
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.IntBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.*
          import kotlin.random.Random

          enum class Tool(val code: String) {
              BRUSH("BR"), ERASER("ER"), SMUDGE("SM"), BLUR("BL"), DODGE("DG"), BURN("BN"), LIQUIFY("LQ"),
              FILL("FL"), GRAD("GR"), LINE("LN"), RECT("RC"), OVAL("OV"), PICK("PK"), MOVE("MV")
          }

          class Pen {
              var size = 24f; var opacity = 1f; var hardness = .8f; var spacing = .08f
              var round = 1f; var angle = 0f; var follow = false
              var scatter = 0f; var sizeJit = 0f; var opJit = 0f
              var grain = 0f; var grainScale = 2f; var smooth = .2f
              var pCurve = 1f; var pSize = .7f; var pOp = 0f
              var blurR = 2f; var tol = 24f
              var gradMode = 0; var gradFade = false; var shapeFill = 0
              var color = -1; var color2 = 0xFF000000.toInt()
              fun load(v: FloatArray) {
                  size = v[0]; opacity = v[1]; hardness = v[2]; spacing = v[3]; round = v[4]; angle = v[5]; scatter = v[6]
                  sizeJit = v[7]; opJit = v[8]; grain = v[9]; grainScale = v[10]; smooth = v[11]; pSize = v[12]; pOp = v[13]
              }
          }

          class LI(val show: Boolean, val alpha: Float, val blend: Int)
          class Layer(val tex: Int, val fbo: Int) { var show = true; var alpha = 1f; var blend = 0 }

          private class P(val id: Int) {
              private val m = HashMap<String, Int>()
              fun u(n: String) = m.getOrPut(n) { G.glGetUniformLocation(id, n) }
          }
          private class Step(val l: Layer) { val t = HashMap<Int, Int>(); var grp = 0 }
          private class Tgt(val w: Int, val h: Int, val src: Int, val outT: Int, val outF: Int, val tmpT: Int, val tmpF: Int, val sc: Float)

          private const val PIF = 3.1415927f
          private const val TS = 256        // undo tile size (copy-on-write: only touched tiles are stored)

          private const val VS = """#version 300 es
          uniform vec4 uR;out vec2 vP,vU;
          void main(){vec2 p=vec2(float(gl_VertexID&1),float(gl_VertexID>>1))*2.-1.;vP=p;vU=p*.5+.5;gl_Position=vec4(uR.xy+p*uR.zw,0,1);}"""

          private const val VSD = """#version 300 es
          uniform vec2 uVp,uCt,uHf,uRt;out vec2 vP,vU;
          void main(){vec2 p=vec2(float(gl_VertexID&1),float(gl_VertexID>>1))*2.-1.;vP=p;vU=p*.5+.5;
          vec2 l=vec2(p.x*uHf.x,-p.y*uHf.y);vec2 s=uCt+vec2(uRt.x*l.x-uRt.y*l.y,uRt.y*l.x+uRt.x*l.y);
          gl_Position=vec4(s.x/uVp.x*2.-1.,1.-s.y/uVp.y*2.,0.,1.);}"""

          private const val FS_B = """#version 300 es
          precision highp float;in vec2 vP;uniform vec4 uC,uQ;uniform vec2 uG;out vec4 o;
          float hs(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
          void main(){float c=cos(uQ.z),s=sin(uQ.z);vec2 q=vec2(c*vP.x+s*vP.y,-s*vP.x+c*vP.y);q.y/=uQ.y;
          float a=(1.-smoothstep(uQ.x,1.,length(q)))*uC.a;a*=1.-uQ.w*hs(floor(gl_FragCoord.xy/uG.x));
          o=uG.y<.5?vec4(uC.rgb*a,a):vec4(vec3(a*.3),0.);}"""

          private const val FS_S = """#version 300 es
          precision highp float;in vec2 vP;uniform sampler2D uT;uniform vec2 uSz,uD;uniform vec4 uQ;uniform float uM,uS,uBr;out vec4 o;
          void main(){vec2 uv=gl_FragCoord.xy/uSz;vec4 src=texture(uT,uv);float a=(1.-smoothstep(uQ.x,1.,length(vP)))*uS;vec4 r;
          if(uM<.5)r=texture(uT,uv-uD/uSz);else{r=vec4(0.);for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++)r+=texture(uT,uv+vec2(float(i),float(j))*uBr/uSz);r/=9.;}
          o=mix(src,r,a);}"""

          // gradient: 0 linear 1 radial 2 conic 3 mirror
          private const val FS_G = """#version 300 es
          precision highp float;uniform vec2 uA,uB;uniform vec4 uC1,uC2;uniform float uMd;out vec4 o;
          void main(){vec2 d=uB-uA;vec2 p=gl_FragCoord.xy-uA;float t;
          if(uMd<.5)t=dot(p,d)/dot(d,d);else if(uMd<1.5)t=length(p)/length(d);
          else if(uMd<2.5)t=fract((atan(p.y,p.x)-atan(d.y,d.x))/6.2832);else t=abs(dot(p,d)/dot(d,d));
          o=mix(uC1,uC2,clamp(t,0.,1.));}"""

          // filled rect / oval (analytic, anti-aliased, instant)
          private const val FS_SH = """#version 300 es
          precision highp float;uniform vec4 uBox,uC;uniform float uMd;out vec4 o;
          void main(){vec2 p=gl_FragCoord.xy-uBox.xy;vec2 r=max(uBox.zw,vec2(.5));float a;
          if(uMd<.5){vec2 q=abs(p)-r;a=1.-smoothstep(-.7,.7,max(q.x,q.y));}
          else{vec2 q=p/r;float d=(length(q)-1.)*min(r.x,r.y);a=1.-smoothstep(-.7,.7,d);}
          o=uC*a;}"""

          private const val FS_C = """#version 300 es
          precision highp float;in vec2 vU;uniform sampler2D uL,uD;uniform vec2 uSz,uO;uniform float uA,uW,uRng;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          void main(){vec2 uv=vU-uO/uSz;if(uW>0.)uv+=dec(texture(uD,vU))/uSz;
          if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.){o=vec4(0.);return;}o=texture(uL,uv)*uA;}"""

          private const val FS_L = """#version 300 es
          precision highp float;uniform sampler2D uD;uniform vec2 uSz,uC,uV;uniform float uRad,uS,uRng,uM;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          vec4 enc(vec2 v){vec2 q=floor((clamp(v/uRng,-1.,1.)*.5+.5)*65535.+.5);vec2 h=floor(q/256.);vec2 l=q-h*256.;return vec4(h.x,l.x,h.y,l.y)/255.;}
          void main(){vec2 c=dec(texture(uD,gl_FragCoord.xy/uSz));vec2 dr=gl_FragCoord.xy-uC;float L=length(dr);float d=L/uRad;float f=max(1.-d*d,0.);f*=f;
          vec2 n=L>0.?dr/L:vec2(0.);float k=length(uV);vec2 dd;
          if(uM<.5)dd=-uV;else if(uM<1.5)dd=n*k;else if(uM<2.5)dd=-n*k;else dd=vec2(-n.y,n.x)*k;
          o=enc(c+dd*f*uS);}"""

          // procedural cute patterns (1..15), animated by tm (0 = static). Shared by backdrop, paper and the PATTERN fx.
          private const val GLSL_PAT = """float hh(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
          float aa(float d){return 1.-smoothstep(-.03,.03,d);}
          float heartF(vec2 p){float a=p.x*p.x+p.y*p.y-1.;return a*a*a-p.x*p.x*p.y*p.y*p.y;}
          float patMask(int id,vec2 fc,float cs,float tm){
          vec2 g=fc/cs;vec2 ig=floor(g);vec2 f=fract(g)-.5;float hs=hh(ig);float ph=hs*6.2832;
          if(id==1)return aa(length(f)-.22*(1.+.2*sin(tm*2.+ph)));
          if(id==2)return 1.-smoothstep(.02,.045,min(.5-abs(f.x),.5-abs(f.y)));
          if(id==3)return 1.-smoothstep(.12,.16,abs(fract((g.x+g.y)*.5-tm*.08)-.5));
          if(id==4){vec2 q=g;q.x+=mod(ig.y,2.)*.5;vec2 ff=(fract(q)-.5)*2.6*(1.+.12*sin(tm*3.+ph));return 1.-smoothstep(-.06,.06,heartF(ff));}
          if(id==5){vec2 q=g;q.x+=mod(ig.y,2.)*.5;vec2 ff=(fract(q)-.5)*2.6/(.8+.22*sin(tm*2.5+ph));return 1.-smoothstep(.85,1.,sqrt(abs(ff.x))+sqrt(abs(ff.y)));}
          if(id==6)return mod(ig.x+ig.y,2.)*(.65+.35*sin(tm+ig.x*.8+ig.y*.6));
          if(id==7){float w=sin(g.x*6.2832+tm*1.6)*.16;return 1.-smoothstep(.03,.07,abs(f.y-w));}
          if(id==8){vec2 c=(vec2(hh(ig+1.7),hh(ig+4.1))-.5)*.5;c.y+=.12*sin(tm*(.8+hs)+ph);float r=.1+.18*hs;return 1.-smoothstep(.0,.03,abs(length(f-c)-r)-.012);}
          if(id==9){vec2 q=g;q.x+=mod(ig.y,2.)*.5+tm*.03*(1.+hh(vec2(ig.y,3.)));vec2 ff=fract(q)-.5;float d=min(min(length(ff-vec2(-.17,-.02))-.15,length(ff-vec2(.02,.06))-.19),length(ff-vec2(.2,-.02))-.14);d=max(d,-ff.y-.1);return aa(d*2.);}
          if(id==10){if(hs<.5)return 0.;vec2 c=(vec2(hh(ig+3.),hh(ig+8.))-.5)*.5;float an=hs*12.566+tm*(.4+hs);mat2 R=mat2(cos(an),-sin(an),sin(an),cos(an));vec2 q=R*(f-c);return 1.-smoothstep(.0,.03,max(abs(q.x)-.18,abs(q.y)-.05));}
          if(id==11){float d=min(abs(f.x),abs(f.y));float s=.22*(1.+.15*sin(tm*2.+ph));return(1.-smoothstep(.03,.06,d))*(1.-smoothstep(s,s+.04,max(abs(f.x),abs(f.y))));}
          if(id==12)return smoothstep(0.,1.,fract(fc.y/(cs*4.)+tm*.03));
          if(id==13){float z=abs(fract(g.x+tm*.1)-.5)*2.;return 1.-smoothstep(.0,.05,abs(f.y-(z-.5)*.5)-.03);}
          if(id==14){vec2 q=g;q.x+=mod(ig.y,2.)*.5;vec2 ff=(fract(q)-.5)*1.5*(1.+.1*sin(tm*2.+ph));float d=length(ff*vec2(1.,1.15)-vec2(0.,-.1))-.2;
          d=min(d,length(ff-vec2(-.22,.12))-.09);d=min(d,length(ff-vec2(-.08,.24))-.09);d=min(d,length(ff-vec2(.08,.24))-.09);d=min(d,length(ff-vec2(.22,.12))-.09);return aa(d*3.);}
          if(id==15){vec2 q=g;q.x+=mod(ig.y,2.)*.5;vec2 ff=(fract(q)-.5)*1.6;float d=length(ff)-.3;vec2 e=vec2(abs(ff.x),ff.y);d=min(d,length(e-vec2(.2,.26))-.1);
          d=max(d,-(length(e-vec2(.1,.02))-.04*(1.-.8*step(.97,sin(tm*1.3+ph)))));return aa(d*3.);}
          return 0.;}
          """

          // backdrop / paper. uT = (anim time, pulse, ripple strength, ripple radius px); uOv = overlay (premultiplied) mode
          private const val FS_P = "#version 300 es\nprecision highp float;uniform vec4 uBg,uPc,uT;uniform vec3 uK;uniform vec2 uOf,uTp;uniform float uOv;out vec4 o;\n" + GLSL_PAT +
              "void main(){vec2 fc=gl_FragCoord.xy+uOf;float cs=max(uK.y,2.)*(1.-.05*uT.y);float m=patMask(int(uK.x+.5),fc,cs,uT.x);" +
              "float rg=0.;if(uT.z>.001){float q=(length(gl_FragCoord.xy-uTp)-uT.w)/50.;rg=uT.z*exp(-q*q);}" +
              "float mm=clamp(m*uK.z*(1.+.6*uT.y+2.*rg),0.,1.);mm=max(mm,rg*.1);" +
              "if(uOv>.5)o=vec4(uPc.rgb*mm,mm);else o=vec4(mix(uBg.rgb,uPc.rgb,mm),1.);}"

          private const val FS_K = """#version 300 es
          precision highp float;in vec2 vU;uniform vec2 uSz;out vec4 o;
          void main(){float k=mod(floor(vU.x*uSz.x/16.)+floor(vU.y*uSz.y/16.),2.);o=vec4(vec3(mix(.78,.93,k)),1.);}"""

          // blurred-canvas backdrop: samples the tiny blurred composite in canvas space (follows pan / zoom / rotation)
          private const val FS_GLOW = """#version 300 es
          precision highp float;uniform sampler2D uG;uniform vec2 uVp,uCt,uHf,uRt;uniform vec4 uBg,uA,uT;out vec4 o;
          void main(){vec2 s=vec2(gl_FragCoord.x,uVp.y-gl_FragCoord.y)-uCt;vec2 l=vec2(uRt.x*s.x+uRt.y*s.y,-uRt.y*s.x+uRt.x*s.y);
