          cat > app/src/main/kotlin/dev/canvas/Theme.kt <<'EOF_SRC'
          package dev.canvas

          import android.content.SharedPreferences
          import android.graphics.Typeface
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.spring
          import androidx.compose.runtime.*
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp

          /** One tweakable setting. desc is the little hint line shown under sliders when HINTS is on. */
          class PP(val n: String, val lo: Float, val hi: Float, val st: Float, val log: Boolean, val g: () -> Float, val s: (Float) -> Unit, val desc: String = "")

          private fun tf(n: String, w: Int = Typeface.NORMAL) = FontFamily(Typeface.create(n, w))
          val FONTS = listOf(
              tf("sans-serif-rounded", Typeface.BOLD), FontFamily.Monospace, FontFamily.Serif, FontFamily.Cursive, tf("casual", Typeface.BOLD),
              tf("sans-serif-condensed", Typeface.BOLD), tf("sans-serif-black"), tf("sans-serif-light"), tf("serif-monospace"), tf("sans-serif-smallcaps"),
          )
          val FONT_NAMES = listOf("ROUNDY", "MONO", "SERIF", "SCRIPT", "CASUAL", "SLIM", "BOLDY", "LIGHT", "TYPEWRITER", "SMALLCAPS")
          val PAT_NAMES = listOf("NONE", "DOTS", "GRID", "STRIPES", "HEARTS", "STARS", "CHECK", "WAVES", "BUBBLES", "CLOUDS", "CONFETTI", "PLUS", "OMBRE", "ZIGZAG", "PAWS", "KITTIES")
          val SC_N = listOf("XS", "S", "M", "L", "XL", "XXL")
          val SC_V = floatArrayOf(.8f, .9f, 1f, 1.15f, 1.3f, 1.5f)

          object T {
              var ah by mutableFloatStateOf(24f)     // accent hue (ginger)
              var sat by mutableFloatStateOf(.42f)
              var av by mutableFloatStateOf(1f)
              var sh by mutableFloatStateOf(190f)    // hue shift of the 2nd accent
              var pa by mutableFloatStateOf(.82f)    // panel opacity
              var rad by mutableFloatStateOf(1f)     // panel roundness 0..1
              var sc by mutableFloatStateOf(1f)      // UI scale target
              var scA by mutableFloatStateOf(1f)     // UI scale as animated (what d() really uses)
              var fsc by mutableFloatStateOf(1f)     // font scale
              var fs by mutableFloatStateOf(11f)     // base text size
              var fnt by mutableFloatStateOf(0f)     // body font
              var fnt2 by mutableFloatStateOf(0f)    // title font
              var hint by mutableFloatStateOf(1f)    // show slider hints
              var an by mutableFloatStateOf(1f)      // cute-animation master (0 = all off)
              var hap by mutableFloatStateOf(1f)     // haptics on hold
              var bsh by mutableFloatStateOf(.85f)   // bubble roundness
              var gls by mutableFloatStateOf(.5f)
              var sdw by mutableFloatStateOf(.5f)
              var olw by mutableFloatStateOf(0f)
              var dpos by mutableFloatStateOf(0f)    // dock: 0 bottom 1 top
              var dal by mutableFloatStateOf(1f)     // dock align 0 left 1 center 2 right
              var dst by mutableFloatStateOf(0f)     // dock style 0 pill 1 floating 2 compact
              var lbl by mutableFloatStateOf(0f)     // dock labels
              var cols by mutableFloatStateOf(5f)    // tool grid columns
              var pnh by mutableFloatStateOf(360f)   // panel max height
              var ear by mutableFloatStateOf(1f)     // 0 round 1 cat 2 bunny
              var mh by mutableFloatStateOf(0f)      // cat hue shift
              var cheek by mutableFloatStateOf(.75f) // puffy cheeks
              var whisk by mutableFloatStateOf(1f)
              var bow by mutableFloatStateOf(0f)
              var blush by mutableFloatStateOf(.6f)
              var bgv by mutableFloatStateOf(.035f)  // backdrop base (0 = AMOLED black)
              var bgh by mutableFloatStateOf(24f)
              var bgs by mutableFloatStateOf(.5f)
              var pat by mutableFloatStateOf(14f)    // backdrop pattern id (14 = paws)
              var psz by mutableFloatStateOf(48f)
              var ph by mutableFloatStateOf(24f)
              var ps by mutableFloatStateOf(.4f)
              var pv by mutableFloatStateOf(.3f)
              var pam by mutableFloatStateOf(.5f)
              var plx by mutableFloatStateOf(.3f)
              var glow by mutableFloatStateOf(.55f)  // blurred-canvas backdrop amount
              var gblur by mutableFloatStateOf(.5f)
              var gspr by mutableFloatStateOf(1.6f)
              var gsat by mutableFloatStateOf(1.3f)
              var gdim by mutableFloatStateOf(.6f)
              var bga by mutableFloatStateOf(.6f)    // backdrop animation amount
              var fps by mutableFloatStateOf(24f)
              var rip by mutableFloatStateOf(1f)

              fun hsv(h: Float, s: Float, v: Float): Color =
                  Color(android.graphics.Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f))))
              fun rgb(h: Float, s: Float, v: Float): FloatArray {
                  val c = android.graphics.Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f)))
                  return floatArrayOf(android.graphics.Color.red(c) / 255f, android.graphics.Color.green(c) / 255f, android.graphics.Color.blue(c) / 255f)
              }
              val ac: Color get() = hsv(ah, sat, av)
              val ac2: Color get() = hsv(ah + sh, sat, av)
              val panel: Color get() = hsv(ah, .35f, .11f).copy(alpha = pa)
              val panel2: Color get() = hsv(ah, .3f, .2f)
              val ink = Color(0xFFFFF4EA)
              val dk = Color(0xFF2A1722)

              fun sig(): Float = bgv + bgh + bgs + pat + psz + ph + ps + pv + pam + plx + glow + gblur + gspr + gsat + gdim + bga + fps + rip + an
              fun push(e: Engine) {
                  e.bg = rgb(bgh, bgs, bgv); e.patC = rgb(ph, ps, pv)
                  e.pat = pat.toInt(); e.patSz = psz; e.patAmt = pam; e.plx = plx
                  e.glowAmt = glow; e.glowBlur = gblur; e.glowSpread = gspr; e.glowSat = gsat; e.glowDim = gdim
                  e.bgAnim = if (an > .01f) bga * an else 0f; e.animFps = fps; e.rippleOn = rip > .5f
              }
              fun load(p: SharedPreferences) { for (q in themeParams()) q.s(p.getFloat("t_" + q.n, q.g())) }
              fun save(p: SharedPreferences) { val ed = p.edit(); for (q in themeParams()) ed.putFloat("t_" + q.n, q.g()); ed.apply() }
          }

          fun d(x: Float): Dp = (x * T.scA).dp
          fun rs(m: Float = 1f) = androidx.compose.foundation.shape.RoundedCornerShape(d((8f + 18f * T.rad) * m))
          fun fsz(sz: Float): Float = sz * T.fsc * (1f + (T.scA - 1f) * .6f)
          fun font(i: Float): FontFamily = FONTS[i.toInt().coerceIn(0, FONTS.size - 1)]

          /** UI scale changes glide with a little bounce instead of snapping */
          @Composable
          fun ScaleAnim() {
              val a by animateFloatAsState(T.sc, spring(.5f, 180f), label = "sc")
              SideEffect { T.scA = a }
          }

