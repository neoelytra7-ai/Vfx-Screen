                  val L = FloatArray(n) { lab[it * 3] }; val A = FloatArray(n) { lab[it * 3 + 1] }; val B = FloatArray(n) { lab[it * 3 + 2] }
                  if (sp.smooth > 0f || sp.even > 0f) {
                      val low = Img.guided(L, L, cw, ch, r1, 0.0025f)
