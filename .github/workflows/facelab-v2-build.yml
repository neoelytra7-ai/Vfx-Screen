          package com.example.facelab

          import android.content.ContentValues
          import android.content.Context
          import android.graphics.*
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.provider.MediaStore
          import kotlin.math.*

          class ParP {
              var path = 0; var amp = 0.035f; var vr = 0.6f; var focus = 0.5f; var gamma = 1f; var smooth = 0.4f; var protect = 0.5f; var zoom = 1.06f; var auto = true
              var dur = 4f; var fps = 30; var res = 1080; var mbps = 16; var loops = 1; var ease = 0.4f; var roll = 0f
              fun copy() = ParP().also { it.path = path; it.amp = amp; it.vr = vr; it.focus = focus; it.gamma = gamma; it.smooth = smooth; it.protect = protect; it.zoom = zoom; it.auto = auto
                  it.dur = dur; it.fps = fps; it.res = res; it.mbps = mbps; it.loops = loops; it.ease = ease; it.roll = roll }
          }

          class Prep(val dg: FloatArray, val ep: FloatArray, val maxDd: Float)
          class Cam(val ox: Float, val oy: Float, val zr: Float, val dolly: Float)

          /** 2.5D parallax from the depth map: a camera move shifts every mesh vertex in proportion to its depth. */
          object Parallax {
              val PATHS = listOf("Orbit", "Sweep", "Rise", "Figure 8", "Push in", "Dolly zoom", "Swing")

              fun prepare(d: DepthData, mw: Int, mh: Int, p: ParP): Prep {
                  val gw = mw + 1; val gh = mh + 1; val g = FloatArray(gw * gh)
                  for (j in 0 until gh) for (i in 0 until gw) {
                      val u = i.toFloat() / mw * (d.w - 1); val v = j.toFloat() / mh * (d.h - 1)
                      val x0 = u.toInt(); val y0 = v.toInt(); val x1 = minOf(x0 + 1, d.w - 1); val y1 = minOf(y0 + 1, d.h - 1); val fu = u - x0; val fv = v - y0
                      g[j * gw + i] = (d.d[y0 * d.w + x0] * (1 - fu) + d.d[y0 * d.w + x1] * fu) * (1 - fv) + (d.d[y1 * d.w + x0] * (1 - fu) + d.d[y1 * d.w + x1] * fu) * fv
                  }
                  val r = (p.smooth * 6f).roundToInt(); var s = g
                  if (r > 0) { s = Img.box(g, gw, gh, r); s = Img.box(s, gw, gh, r) }
                  val fg = p.focus.pow(p.gamma)
                  val dg = FloatArray(s.size) { s[it].coerceIn(0f, 1f).pow(p.gamma) - fg }
                  val ep = FloatArray(s.size)
                  for (j in 0 until gh) for (i in 0 until gw) {
                      val gx = s[j * gw + minOf(i + 1, gw - 1)] - s[j * gw + maxOf(i - 1, 0)]; val gy = s[minOf(j + 1, gh - 1) * gw + i] - s[maxOf(j - 1, 0) * gw + i]
                      ep[j * gw + i] = 1f - p.protect * Img.smooth(hypot(gx, gy), 0.03f, 0.2f)
                  }
                  var mx = 0f; for (v in dg) mx = maxOf(mx, abs(v))
                  return Prep(dg, ep, mx)
              }

              fun cam(p: ParP, t: Float): Cam {
                  val tau = (2.0 * PI * t).toFloat()
                  fun e(x: Float): Float = sign(x) * abs(x).pow(1f - 0.6f * p.ease)
                  return when (p.path) {
                      0 -> Cam(e(cos(tau)), e(sin(tau)), 0f, 0f)
                      1 -> Cam(e(sin(tau)), 0f, 0f, 0f)
                      2 -> Cam(0f, e(sin(tau)), 0f, 0f)
                      3 -> Cam(e(sin(tau)), e(sin(2 * tau)) * 0.5f, 0f, 0f)
                      4 -> Cam(0.35f * e(sin(tau)), 0f, 0.5f * (1f - cos(tau)), 0f)
                      5 -> Cam(0f, 0f, 0f, e(sin(tau)))
                      else -> Cam(e(sin(tau)), 0.25f * e(cos(tau)), 0f, 0f)
                  }
              }

              /** Writes the displaced vertices for time t (0..1, looping) into [out]. [base] is the warp mesh, so reshaping and parallax combine. */
              fun frame(base: FloatArray, w: Int, h: Int, prep: Prep, p: ParP, t: Float, out: FloatArray) {
                  val c = cam(p, t); val amp = p.amp * w; val cx = w / 2f; val cy = h / 2f; val dollyK = p.amp * 8f
                  val z0 = if (p.auto) maxOf(p.zoom, 1f + 2f * p.amp * prep.maxDd * maxOf(1f, p.vr * w / h) * 1.15f + (if (p.path == 5) dollyK * prep.maxDd else 0f)) else p.zoom
                  val zt = z0 + c.zr * 0.12f
                  val ang = (p.roll * PI / 180.0 * sin(2.0 * PI * t)).toFloat(); val ca = cos(ang); val sa = sin(ang)
                  for (i in 0 until out.size / 2) {
                      val dd = prep.dg[i] * prep.ep[i]
                      var x = base[2 * i] - c.ox * amp * dd; var y = base[2 * i + 1] - c.oy * amp * p.vr * dd
                      if (c.dolly != 0f) { val s = 1f + c.dolly * dd * dollyK; x = cx + (x - cx) * s; y = cy + (y - cy) * s }
                      val dx = (x - cx) * zt; val dy = (y - cy) * zt
                      out[2 * i] = cx + dx * ca - dy * sa; out[2 * i + 1] = cy + dx * sa + dy * ca
                  }
              }

              /** Hardware H.264: frames are drawn with the GPU onto the encoder's input surface. Timestamps are written by frame index. */
              fun encode(ctx: Context, bmp: Bitmap, baseVerts: FloatArray, mw: Int, mh: Int, prep: Prep, p: ParP, onP: (Float) -> Unit): Boolean {
                  val w = bmp.width; val h = bmp.height
                  val fmt = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, w, h)
                  fmt.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
                  fmt.setInteger(MediaFormat.KEY_BIT_RATE, p.mbps * 1_000_000); fmt.setInteger(MediaFormat.KEY_FRAME_RATE, p.fps)
                  fmt.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1); fmt.setInteger(MediaFormat.KEY_MAX_B_FRAMES, 0)
                  val codec = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                  codec.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  val surf = codec.createInputSurface(); codec.start()
                  val v = ContentValues().apply { put(MediaStore.Video.Media.DISPLAY_NAME, "FaceLab_" + System.currentTimeMillis() + ".mp4"); put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/FaceLab"); put(MediaStore.Video.Media.IS_PENDING, 1) }
                  val uri = ctx.contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v) ?: return false
                  val pfd = ctx.contentResolver.openFileDescriptor(uri, "w") ?: return false
                  val muxer = MediaMuxer(pfd.fileDescriptor, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  var track = -1; var started = false; var count = 0L; val info = MediaCodec.BufferInfo()
                  fun drain(end: Boolean) {
                      var tries = 0
                      while (true) {
                          val i = codec.dequeueOutputBuffer(info, if (end) 10000L else 0L)
                          if (i == MediaCodec.INFO_TRY_AGAIN_LATER) { if (!end || ++tries > 600) break else continue }
                          if (i == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) { track = muxer.addTrack(codec.outputFormat); muxer.start(); started = true }
                          else if (i >= 0) {
                              val buf = codec.getOutputBuffer(i)!!
                              if (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG != 0) info.size = 0
                              if (info.size > 0 && started) { buf.position(info.offset); buf.limit(info.offset + info.size); info.presentationTimeUs = count * 1_000_000L / p.fps; count++; muxer.writeSampleData(track, buf, info) }
                              codec.releaseOutputBuffer(i, false)
                              if (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) break
                          }
                      }
                  }
                  val per = (p.dur * p.fps).roundToInt().coerceAtLeast(2); val total = per * p.loops
                  val verts = FloatArray(baseVerts.size); val paint = Paint(Paint.FILTER_BITMAP_FLAG or Paint.ANTI_ALIAS_FLAG)
                  for (f in 0 until total) {
