          // ---------------------------------------------------------------- glass primitives

          @Composable fun Modifier.glass(radius: Dp = Th.corner.dp, strength: Float = 1f): Modifier {
              val bd = LocalBackdrop.current
              var pos by remember { mutableStateOf(Offset.Zero) }
              val shape = RoundedCornerShape(radius)
              return this.onGloballyPositioned { pos = it.positionInRoot() }.clip(shape).drawBehind {
                  val b = bd?.bmp
                  if (b != null && bd.root.width > 0) {
                      val fit = minOf(bd.root.width.toFloat() / b.width, bd.root.height.toFloat() / b.height) * bd.zoom
                      val dw = b.width * fit; val dh = b.height * fit
                      translate(-pos.x, -pos.y) { drawImage(b, dstOffset = IntOffset((bd.root.width / 2f + bd.off.x - dw / 2f).toInt(), (bd.root.height / 2f + bd.off.y - dh / 2f).toInt()), dstSize = IntSize(dw.toInt(), dh.toInt())) }
                  }
                  drawRect(Color(0xFF0C0C14).copy(alpha = (Th.opacity * strength).coerceIn(0f, 0.95f)))
                  drawRect(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.13f * strength), Color.Transparent), endY = size.height * 0.6f))
              }.border(1.dp, Brush.linearGradient(listOf(Color.White.copy(alpha = 0.5f), Color.White.copy(alpha = 0.05f), Color.White.copy(alpha = 0.2f))), shape)
          }

          @Composable fun Modifier.press(onClick: () -> Unit): Modifier {
              val src = remember { MutableInteractionSource() }; val p by src.collectIsPressedAsState(); val hap = LocalHapticFeedback.current
              val s by animateFloatAsState(if (p) 0.93f else 1f, spring(0.45f, 500f * Th.speed), label = "press")
              return this.graphicsLayer { scaleX = s; scaleY = s }.clickable(src, null) { if (Th.haptics) hap.performHapticFeedback(HapticFeedbackType.TextHandleMove); onClick() }
          }

          @Composable fun GPill(text: String, on: Boolean = false, onClick: () -> Unit) {
              val a by animateFloatAsState(if (on) 1f else 0f, tween(ms(260)), label = "pill")
              Box(Modifier.press(onClick).glass(20.dp, 0.8f).drawBehind { if (a > 0f) drawRect(Th.grad(), alpha = 0.9f * a) }.padding(horizontal = 14.dp, vertical = 8.dp)) {
                  Text(text, color = if (on) Color(0xFF0A0A0F) else Color.White, fontSize = 13.sp, fontWeight = if (on) FontWeight.Bold else FontWeight.Medium) }
          }

          private fun DrawScope.glyph(i: Int, c: Color) {
              val s = size.minDimension; val w = s * 0.09f; val rc = StrokeCap.Round
              when (i) {
                  0 -> { drawLine(c, Offset(s * .27f, s * .27f), Offset(s * .73f, s * .73f), w, rc); drawLine(c, Offset(s * .73f, s * .27f), Offset(s * .27f, s * .73f), w, rc) }
                  1 -> { drawArc(c, 200f, 230f, false, Offset(s * .22f, s * .3f), Size(s * .56f, s * .46f), style = Stroke(w, cap = rc)); drawLine(c, Offset(s * .24f, s * .22f), Offset(s * .24f, s * .42f), w, rc); drawLine(c, Offset(s * .24f, s * .42f), Offset(s * .42f, s * .4f), w, rc) }
                  2 -> { drawOval(c, Offset(s * .14f, s * .3f), Size(s * .72f, s * .4f), style = Stroke(w)); drawCircle(c, s * .09f, Offset(s * .5f, s * .5f)) }
                  3 -> for ((x, y) in listOf(.2f to .2f, .8f to .2f, .2f to .8f, .8f to .8f)) { val dx = if (x < .5f) 1f else -1f; val dy = if (y < .5f) 1f else -1f
                      drawLine(c, Offset(s * x, s * y), Offset(s * (x + dx * .16f), s * y), w, rc); drawLine(c, Offset(s * x, s * y), Offset(s * x, s * (y + dy * .16f)), w, rc) }
                  4 -> for ((k, kx) in listOf(.25f to .35f, .5f to .65f, .75f to .45f)) { drawLine(c, Offset(s * .18f, s * k), Offset(s * .82f, s * k), w * .7f, rc); drawCircle(c, s * .075f, Offset(s * kx, s * k)) }
                  5 -> { drawLine(c, Offset(s * .5f, s * .62f), Offset(s * .5f, s * .2f), w, rc); drawLine(c, Offset(s * .34f, s * .36f), Offset(s * .5f, s * .2f), w, rc); drawLine(c, Offset(s * .66f, s * .36f), Offset(s * .5f, s * .2f), w, rc)
                      drawRoundRect(c, Offset(s * .2f, s * .5f), Size(s * .6f, s * .3f), CornerRadius(s * .08f), style = Stroke(w)) }
                  else -> { drawLine(c, Offset(s * .25f, s * .4f), Offset(s * .5f, s * .62f), w, rc); drawLine(c, Offset(s * .75f, s * .4f), Offset(s * .5f, s * .62f), w, rc) }
              }
          }

          @Composable fun GIcon(i: Int, on: Boolean = false, onClick: (() -> Unit)? = null) {
              val a by animateFloatAsState(if (on) 1f else 0f, tween(ms(260)), label = "ic")
