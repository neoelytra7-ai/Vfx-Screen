          class Op(val cx: Float, val cy: Float, val rx: Float, val ry: Float, val th: Float, val sx: Float, val sy: Float, val shx: Float, val shy: Float, val rot: Float) {
              val c = cos(th); val s = sin(th)
          }

          object Warp {
              /** All face operators are defined in a face-aligned frame (origin between the eyes, unit = inter-eye distance), so they follow roll and size. */
              fun faceOps(f: FloatArray, p: Map<String, Float>, K: Float, out: MutableList<Op>) {
                  if (p.values.all { it == 0f }) return
                  fun x(i: Int) = f[i * 2]
                  fun y(i: Int) = f[i * 2 + 1]
                  val u = hypot(x(473) - x(468), y(473) - y(468)); if (u < 8f) return
                  val th = atan2(y(473) - y(468), x(473) - x(468)); val ct = cos(th); val st = sin(th)
                  val mx = (x(468) + x(473)) / 2; val my = (y(468) + y(473)) / 2
                  fun px(a: Float, b: Float) = mx + (ct * a - st * b) * u
                  fun py(a: Float, b: Float) = my + (st * a + ct * b) * u
                  fun v(n: String) = (p[n] ?: 0f) * K
                  fun mv(cx: Float, cy: Float, r: Float, dx: Float, dy: Float) { if (dx != 0f || dy != 0f) out.add(Op(cx, cy, r * u, r * u, th, 0f, 0f, dx * u, dy * u, 0f)) }
                  fun mvi(i: Int, r: Float, dx: Float, dy: Float) = mv(x(i), y(i), r, dx, dy)
                  fun sym(il: Int, ir: Int, r: Float, dxOut: Float, dy: Float) { mvi(il, r, -dxOut, dy); mvi(ir, r, dxOut, dy) }
                  fun sc(cx: Float, cy: Float, rx: Float, ry: Float, sx: Float, sy: Float) { if (sx != 0f || sy != 0f) out.add(Op(cx, cy, rx * u, ry * u, th, sx.coerceIn(-0.6f, 0.6f), sy.coerceIn(-0.6f, 0.6f), 0f, 0f, 0f)) }

                  // ---- face shape
                  val fwv = v("faceW")
                  if (fwv != 0f) { for ((a, b) in listOf(234 to 454, 93 to 323, 132 to 361, 58 to 288, 172 to 397, 136 to 365, 150 to 379)) { sym(a, b, 0.45f, fwv * 0.09f, 0f) } }
                  v("faceL").let { mvi(152, 0.8f, 0f, it * 0.12f); mvi(10, 0.9f, 0f, -it * 0.10f) }
