                      val t = Lab.of(sp.tone)
                      for (i in 0 until n) {
                          val mm = m[i] * sp.amt; if (mm <= 0.003f) continue
                          val l0 = L[i]
                          val l1 = if (t[0] > ml) 1f - (1f - l0) * ((1f - t[0]) / (1f - ml + 1e-4f)) else l0 * (t[0] / (ml + 1e-4f))
                          L[i] = l0 + (l1 - l0) * mm; A[i] += (t[1] - ma) * mm; B[i] += (t[2] - mb) * mm
                      }
                  }
                  if (sp.lighten != 0f || sp.warmth != 0f || sp.sat != 0f || sp.shadows != 0f || sp.highlights != 0f || sp.redness > 0f) for (i in 0 until n) {
                      val mm = m[i]; if (mm <= 0.003f) continue
                      val l = L[i]; val ws = 1f - Img.smooth(l, 0.25f, 0.6f); val wh = Img.smooth(l, 0.65f, 0.9f)
                      L[i] += (sp.lighten * 0.12f + sp.shadows * 0.12f * ws + sp.highlights * 0.08f * wh) * mm
                      A[i] += sp.warmth * 0.02f * mm; B[i] += sp.warmth * 0.035f * mm
                      if (sp.sat != 0f) { val s = 1f + sp.sat * 0.5f * mm; A[i] = ma + (A[i] - ma) * s; B[i] = mb + (B[i] - mb) * s }
                      if (sp.redness > 0f && A[i] > ma) A[i] -= (A[i] - ma) * sp.redness * mm * 0.9f
                  }
                  if (sp.glow > 0f) {
                      val hi = FloatArray(n) { maxOf(L[it] - 0.72f, 0f) * m[it] }
                      val bl = Img.box(hi, cw, ch, maxOf(3, (0.015f * maxOf(w, h)).toInt()))
                      for (i in 0 until n) L[i] += bl[i] * sp.glow * 2.2f
                  }
                  for (y in 0 until ch) for (x in 0 until cw) { val i = y * cw + x
                      if (m[i] > 0.003f || sp.glow > 0f) px[(by0 + y) * w + bx0 + x] = Lab.rgb(L[i], A[i], B[i], spx[i] ushr 24) }
              }

              /** Fallback when the whole-frame segmenter is unavailable: pixels inside the pose limbs whose colour matches the face skin. */
              fun bodyMask(px: IntArray, w: Int, h: Int, pose: FloatArray, faceMask: FloatArray, k: Float): FloatArray {
                  val reg = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888); val c = Canvas(reg)
                  fun pt(i: Int) = PointF(pose[i * 2] * k, pose[i * 2 + 1] * k)
                  fun seg(a: Int, b: Int, wf: Float) {
                      val p = pt(a); val q = pt(b); val l = hypot(q.x - p.x, q.y - p.y)
                      c.drawLine(p.x, p.y, q.x, q.y, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; style = Paint.Style.STROKE; strokeWidth = wf * l; strokeCap = Paint.Cap.ROUND })
                  }
                  for ((a, b) in listOf(11 to 13, 13 to 15, 12 to 14, 14 to 16)) seg(a, b, 0.2f)
                  for ((a, b) in listOf(23 to 25, 25 to 27, 24 to 26, 26 to 28)) seg(a, b, 0.26f)
                  val torso = Path().apply { moveTo(pt(11).x, pt(11).y); lineTo(pt(12).x, pt(12).y); lineTo(pt(24).x, pt(24).y); lineTo(pt(23).x, pt(23).y); close() }
                  c.drawPath(torso, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE })
                  val ap = IntArray(w * h); reg.getPixels(ap, 0, w, 0, 0, w, h); reg.recycle()
                  val n = w * h; val t3 = FloatArray(3)
                  var ma = 0.0; var mb = 0.0; var cnt = 0; var i0 = 0
                  while (i0 < n) { if (faceMask[i0] > 0.8f) { Lab.lab(px[i0], t3, 0); ma += t3[1]; mb += t3[2]; cnt++ }; i0 += 5 }
                  if (cnt < 20) return FloatArray(n)
                  val a0 = (ma / cnt).toFloat(); val b0 = (mb / cnt).toFloat()
                  var va = 0.0; var vb = 0.0; i0 = 0
                  while (i0 < n) { if (faceMask[i0] > 0.8f) { Lab.lab(px[i0], t3, 0); va += (t3[1] - a0) * (t3[1] - a0); vb += (t3[2] - b0) * (t3[2] - b0) }; i0 += 5 }
                  val sa = maxOf((va / cnt).toFloat(), 0.0003f); val sb = maxOf((vb / cnt).toFloat(), 0.0003f)
                  val out = FloatArray(n)
                  Img.par(h) { y ->
                      val t = FloatArray(3)
                      for (x in 0 until w) {
                          val i = y * w + x; val r = (ap[i] ushr 24) / 255f; if (r < 0.05f) continue
                          Lab.lab(px[i], t, 0)
                          out[i] = r * exp(-0.5f * ((t[1] - a0) * (t[1] - a0) / sa + (t[2] - b0) * (t[2] - b0) / sb) / 3f)
                      }
                  }
                  return Img.box(out, w, h, 2)
              }
          }

          object Hair {
              private fun hash(ix: Int, iy: Int): Float { var h = ix * 374761393 + iy * 668265263; h = (h xor (h ushr 13)) * 1274126177; return ((h xor (h ushr 16)) and 0xFFFF) / 65535f }
              private fun vnoise(x: Float, y: Float): Float {
                  val ix = floor(x).toInt(); val iy = floor(y).toInt(); val fx = x - ix; val fy = y - iy
                  val sx = fx * fx * (3 - 2 * fx); val sy = fy * fy * (3 - 2 * fy)
                  return Img.mix(Img.mix(hash(ix, iy), hash(ix + 1, iy), sx), Img.mix(hash(ix, iy + 1), hash(ix + 1, iy + 1), sx), sy)
              }

              /** Recolour in OKLab: keeps strand structure and specular highlights, remaps lightness toward the target, supports gradients and streaks. */
              fun apply(px: IntArray, w: Int, h: Int, H: FloatArray, hp: HairP, fx: Float, fy: Float, u: Float, th: Float) {
                  if (hp.c1 == 0) return
                  val n = w * h; val t3 = FloatArray(3)
                  var sl = 0.0; var sw = 0.0; var y0 = h; var y1 = 0
                  for (i in 0 until n) if (H[i] > 0.5f) { val y = i / w; if (y < y0) y0 = y; if (y > y1) y1 = y }
                  var i0 = 0
                  while (i0 < n) { if (H[i0] > 0.6f) { Lab.lab(px[i0], t3, 0); sl += t3[0]; sw += 1.0 }; i0 += 3 }
                  if (sw < 10.0 || y1 <= y0) return
                  val ml = (sl / sw).toFloat(); val c1 = Lab.of(hp.c1); val c2 = Lab.of(if (hp.c2 != 0) hp.c2 else hp.c1)
                  val ct = cos(th); val st = sin(th); val span = (y1 - y0).toFloat()
                  Img.par(h) { y ->
                      if (y < y0 - 2 || y > y1 + 2) return@par
                      val t = FloatArray(3)
                      for (x in 0 until w) {
                          val i = y * w + x; val m = H[i] * hp.amt; if (m < 0.004f) continue
                          Lab.lab(px[i], t, 0)
                          val yn = ((y - y0) / span).coerceIn(0f, 1f)
                          val g = when (hp.mode) {
                              1 -> Img.smooth(yn, hp.pos - hp.soft, hp.pos + hp.soft)
                              2 -> Img.smooth(yn, hp.pos + 0.15f - hp.soft * 0.5f, hp.pos + 0.15f + hp.soft * 0.5f)
                              3 -> { val nz = vnoise(x / (u * 0.35f), y / (u * 3f)) * 0.6f + vnoise(x / (u * 0.15f), y / (u * 1.2f)) * 0.4f
                                  val tt = 0.75f - 0.35f * hp.streak; Img.smooth(nz, tt, tt + 0.12f) * (0.35f + 0.65f * yn) }
                              4 -> { val dx = x - fx; val dy = y - fy; val d = hypot(dx, dy) / u; val along = (dx * -st + dy * ct) / u
                                  exp(-((d - 1.45f) / 0.38f) * ((d - 1.45f) / 0.38f)) * Img.smooth(along, 0.1f, 0.5f) }
                              5 -> Img.smooth(((x - fx) * ct + (y - fy) * st) / u, -0.15f, 0.15f)
                              else -> 0f
                          }
                          val lt = Img.mix(c1[0], c2[0], g); val at = Img.mix(c1[1], c2[1], g); val bt = Img.mix(c1[2], c2[2], g)
                          val spec = Img.smooth(t[0], ml + 0.22f, ml + 0.42f)
                          val kc = (0.8f * (1f - maxOf(0f, lt - 0.7f) * 1.5f)).coerceIn(0.45f, 0.8f)
                          var ln = lt + (t[0] - ml) * kc + hp.lift * 0.12f
                          ln = ln + spec * (maxOf(ln, t[0]) - ln) * 0.6f + spec * hp.shine * 0.15f
                          val ca = at * (1f - spec * 0.6f); val cb = bt * (1f - spec * 0.6f)
                          px[i] = Lab.rgb(t[0] + (ln.coerceIn(0f, 1.02f) - t[0]) * m, t[1] + (ca - t[1]) * m, t[2] + (cb - t[2]) * m, px[i] ushr 24)
                      }
                  }
              }
          }

          /** Teeth, eye whites, iris and under-eye refinements, each limited to a mask built from the face landmarks. */
          object Detail {
              private val UP = listOf(intArrayOf(33, 246, 161, 160, 159, 158, 157, 173, 133), intArrayOf(263, 466, 388, 387, 386, 385, 384, 398, 362))
              private val LO = listOf(intArrayOf(33, 7, 163, 144, 145, 153, 154, 155, 133), intArrayOf(263, 249, 390, 373, 374, 380, 381, 382, 362))
              private val RING = listOf(intArrayOf(469, 470, 471, 472), intArrayOf(474, 475, 476, 477))
              private val LIPI = intArrayOf(78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95)

              fun apply(px: IntArray, w: Int, h: Int, f: FloatArray, dp: DetailP) {
                  if (!dp.active()) return
                  fun X(i: Int) = f[i * 2]
                  fun Y(i: Int) = f[i * 2 + 1]
                  val u = hypot(X(473) - X(468), Y(473) - Y(468)); if (u < 10f) return
                  val th = atan2(Y(473) - Y(468), X(473) - X(468)); val ct = cos(th); val st = sin(th)
                  var x0 = 1e9f; var y0 = 1e9f; var x1 = -1e9f; var y1 = -1e9f
                  for (i in 0 until f.size / 2) { x0 = minOf(x0, X(i)); x1 = maxOf(x1, X(i)); y0 = minOf(y0, Y(i)); y1 = maxOf(y1, Y(i)) }
                  val rx0 = maxOf(0, (x0 - 0.3f * u).toInt()); val ry0 = maxOf(0, (y0 - 0.3f * u).toInt()); val rx1 = minOf(w, (x1 + 0.3f * u).toInt()); val ry1 = minOf(h, (y1 + 0.3f * u).toInt())
                  val rw = rx1 - rx0; val rh = ry1 - ry0; if (rw < 8 || rh < 8) return
                  fun pt(i: Int) = PointF(X(i) - rx0, Y(i) - ry0)
                  fun poly(ids: List<Int>) = Path().apply { ids.forEachIndexed { j, id -> val p = pt(id); if (j == 0) moveTo(p.x, p.y) else lineTo(p.x, p.y) }; close() }
                  val bl = maxOf(1f, 0.012f * u)
                  fun fillP(c: Int = 0xFFFFFFFF.toInt()) = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = c; style = Paint.Style.FILL; maskFilter = BlurMaskFilter(bl, BlurMaskFilter.Blur.NORMAL) }
                  fun maskOf(block: (Canvas) -> Unit): FloatArray {
                      val b = Bitmap.createBitmap(rw, rh, Bitmap.Config.ARGB_8888); block(Canvas(b)); val a = IntArray(rw * rh); b.getPixels(a, 0, rw, 0, 0, rw, rh); b.recycle()
                      return FloatArray(a.size) { (a[it] ushr 24) / 255f }
                  }
                  val teeth = if (dp.teeth > 0f) maskOf { c -> c.drawPath(poly(LIPI.toList()), fillP()) } else null
                  val sclera = if (dp.sclera > 0f) maskOf { c -> for (s in 0..1) { c.drawPath(poly(UP[s].toList() + LO[s].toList().reversed()), fillP())
                      val ic = pt(if (s == 0) 468 else 473); val r = RING[s].map { hypot(pt(it).x - ic.x, pt(it).y - ic.y) }.average().toFloat()
                      c.drawCircle(ic.x, ic.y, r * 1.05f, Paint(Paint.ANTI_ALIAS_FLAG).apply { xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_OUT); color = 0xFF000000.toInt() }) } } else null
                  val iris = if (dp.iris > 0f) maskOf { c -> for (s in 0..1) { val ic = pt(if (s == 0) 468 else 473); val r = RING[s].map { hypot(pt(it).x - ic.x, pt(it).y - ic.y) }.average().toFloat()
                      c.drawCircle(ic.x, ic.y, r * 0.95f, fillP()) } } else null
                  val under = if (dp.underEye > 0f) maskOf { c -> for (s in 0..1) { val a = pt(if (s == 0) 33 else 263); val b = pt(if (s == 0) 133 else 362)
                      val cx = (a.x + b.x) / 2 - st * 0.27f * u; val cy = (a.y + b.y) / 2 + ct * 0.27f * u
                      c.drawOval(RectF(cx - 0.38f * u, cy - 0.1f * u, cx + 0.38f * u, cy + 0.1f * u), fillP()) } } else null
                  val t = FloatArray(3)
                  for (y in 0 until rh) for (x in 0 until rw) {
                      val mi = y * rw + x
                      val tt = teeth?.get(mi) ?: 0f; val sc = sclera?.get(mi) ?: 0f; val ir = iris?.get(mi) ?: 0f; val ue = under?.get(mi) ?: 0f
                      if (tt < 0.01f && sc < 0.01f && ir < 0.01f && ue < 0.01f) continue
                      val pi = (ry0 + y) * w + rx0 + x; Lab.lab(px[pi], t, 0)
                      var L = t[0]; var A = t[1]; var B = t[2]
                      if (tt > 0f) { val wt = tt * Img.smooth(L, 0.5f, 0.72f) * dp.teeth; L += wt * 0.09f * (1f - L); B -= wt * maxOf(B, 0f) * 0.6f; A -= wt * A * 0.3f }
                      if (sc > 0f) { val wt = sc * Img.smooth(L, 0.55f, 0.8f) * dp.sclera; L += wt * 0.07f; A *= 1f - wt * 0.6f; B *= 1f - wt * 0.5f }
                      if (ir > 0f) { val wt = ir * dp.iris; L = 0.45f + (L - 0.45f) * (1f + wt * 0.6f); A *= 1f + wt * 0.7f; B *= 1f + wt * 0.7f }
                      if (ue > 0f) { val wt = ue * dp.underEye; L += wt * 0.07f * (1f - L); A *= 1f - wt * 0.3f; B += wt * 0.008f }
                      px[pi] = Lab.rgb(L, A, B, px[pi] ushr 24)
                  }
              }
          }

          /** Global colour grade: exposure, white balance, tone, saturation, clarity, sharpen, fade, vignette, grain. */
          object Adjust {
              private fun hash(x: Int, y: Int): Float { var h = x * 374761393 + y * 668265263; h = (h xor (h ushr 13)) * 1274126177; return ((h xor (h ushr 16)) and 0xFFFF) / 65535f }
              fun apply(px: IntArray, w: Int, h: Int, ap: AdjP) {
                  if (!ap.active()) return
                  val lum = Img.gray(px)
                  val bl = if (ap.clarity != 0f) Img.box(lum, w, h, maxOf(4, (0.02f * maxOf(w, h)).toInt())) else null
                  val bs = if (ap.sharpen > 0f) Img.box(lum, w, h, 2) else null
                  val cx = w / 2f; val cy = h / 2f; val maxd = hypot(cx, cy); val ev = 2.0.pow(ap.exposure * 1.5).toFloat()
                  Img.par(h) { y ->
                      for (x in 0 until w) {
                          val i = y * w + x; val p = px[i]
                          var r = ((p shr 16) and 255) / 255f * ev * (1f + ap.temp * 0.18f)
                          var g = ((p shr 8) and 255) / 255f * ev * (1f - ap.tint * 0.12f)
                          var b = (p and 255) / 255f * ev * (1f - ap.temp * 0.18f)
                          var l = 0.299f * r + 0.587f * g + 0.114f * b
                          val tone = ap.shadows * 0.22f * (1f - l) * (1f - l) + ap.highlights * 0.22f * l * l
                          r += tone; g += tone; b += tone
                          if (ap.contrast != 0f) { val c = 1f + ap.contrast * 0.8f; r = 0.5f + (r - 0.5f) * c; g = 0.5f + (g - 0.5f) * c; b = 0.5f + (b - 0.5f) * c }
                          if (ap.saturation != 0f || ap.vibrance != 0f) {
                              l = 0.299f * r + 0.587f * g + 0.114f * b
                              val mx = maxOf(r, maxOf(g, b)); val mn = minOf(r, minOf(g, b)); val s0 = if (mx > 0.001f) (mx - mn) / mx else 0f
                              val s = 1f + ap.saturation * 0.9f + ap.vibrance * 0.9f * (1f - s0)
                              r = l + (r - l) * s; g = l + (g - l) * s; b = l + (b - l) * s
                          }
                          var dl = 0f
                          if (bl != null) dl += (lum[i] - bl[i]) * ap.clarity * 1.2f
                          if (bs != null) dl += (lum[i] - bs[i]) * ap.sharpen * 2f
                          r += dl; g += dl; b += dl
                          if (ap.fade > 0f) { val k = 1f - ap.fade * 0.12f; r = r * k + ap.fade * 0.07f; g = g * k + ap.fade * 0.07f; b = b * k + ap.fade * 0.07f }
                          if (ap.vignette > 0f) { val v = 1f - ap.vignette * Img.smooth(hypot(x - cx, y - cy) / maxd, 0.35f, 1.1f) * 0.6f; r *= v; g *= v; b *= v }
                          if (ap.grain > 0f) { val nz = (hash(x, y) - 0.5f) * ap.grain * 0.12f; r += nz; g += nz; b += nz }
                          px[i] = (p and 0xFF000000.toInt()) or ((r.coerceIn(0f, 1f) * 255f + 0.5f).toInt() shl 16) or ((g.coerceIn(0f, 1f) * 255f + 0.5f).toInt() shl 8) or (b.coerceIn(0f, 1f) * 255f + 0.5f).toInt()
                      }
                  }
              }
          }

          /** Studio relight: surface normals come from the depth map, so a directional light really shapes the face and body. */
          object Light {
              fun apply(px: IntArray, w: Int, h: Int, d: FloatArray, subj: FloatArray?, lp: LightP) {
                  val n = w * h; val r = maxOf(2, ((0.003f + lp.soft * 0.012f) * maxOf(w, h)).toInt())
                  val db = Img.box(d, w, h, r); val sm = subj?.let { Img.box(it, w, h, r) }
                  val az = Math.toRadians(lp.angle.toDouble()).toFloat(); val lz = 0.25f + 0.7f * lp.elev; val lxy = sqrt(1f - lz * lz)
                  val lx = cos(az) * lxy; val ly = -sin(az) * lxy; val scale = maxOf(w, h) * 0.6f * lp.bump
                  Img.par(h) { y ->
                      val ym = maxOf(y - 1, 0); val yp = minOf(y + 1, h - 1)
                      for (x in 0 until w) {
                          val i = y * w + x; val xm = maxOf(x - 1, 0); val xp = minOf(x + 1, w - 1)
                          val gx = (db[y * w + xp] - db[y * w + xm]) * 0.5f * scale; val gy = (db[yp * w + x] - db[ym * w + x]) * 0.5f * scale
                          val inv = 1f / sqrt(gx * gx + gy * gy + 1f); val shade = (-gx * lx - gy * ly + lz) * inv - lz
                          val wgt = 0.35f + 0.65f * (sm?.get(i) ?: 1f)
                          var f = 1f + lp.amt * 2.2f * shade * wgt
                          if (sm != null) f *= 1f - lp.ambient * (1f - sm[i]) * 0.6f
                          val p = px[i]; val warm = lp.warm * 0.12f * shade
                          val rr = (((p shr 16) and 255) * f * (1f + warm)).toInt().coerceIn(0, 255); val gg = (((p shr 8) and 255) * f).toInt().coerceIn(0, 255); val bb = ((p and 255) * f * (1f - warm)).toInt().coerceIn(0, 255)
                          px[i] = (p and 0xFF000000.toInt()) or (rr shl 16) or (gg shl 8) or bb
                      }
                  }
              }
          }

          /** Depth-aware lens blur: variable-radius disc gather with occlusion handling, polygon apertures, highlight boost and cat-eye. */
          object Bokeh {
              fun coc(d: FloatArray, df: Float, bp: BokehP, maxR: Float) = FloatArray(d.size) { i ->
                  val diff = d[i] - df
                  if (diff > 0f && !bp.fg) 0f else maxR * (maxOf(0f, abs(diff) - bp.dof) / (1f - bp.dof + 1e-3f)).pow(bp.gamma)
              }

              fun render(px: IntArray, w: Int, h: Int, d: FloatArray, coc: FloatArray, bp: BokehP): IntArray {
                  val n = w * h
                  val R = FloatArray(n) { val v = ((px[it] shr 16) and 255) / 255f; v * v }
                  val G = FloatArray(n) { val v = ((px[it] shr 8) and 255) / 255f; v * v }
                  val B = FloatArray(n) { val v = (px[it] and 255) / 255f; v * v }
                  val T = 96; val ox = FloatArray(T); val oy = FloatArray(T)
                  for (k in 0 until T) {
                      val rad = sqrt((k + 0.5f) / T); val ang = k * 2.3999632f; var a = rad * cos(ang); var b = rad * sin(ang)
                      if (bp.blades >= 3) {
                          val aa = atan2(b, a) - bp.rot; val sec = (2 * PI / bp.blades).toFloat(); val t = ((aa % sec) + sec) % sec
                          val mm = (cos(PI / bp.blades) / cos(t - PI / bp.blades)).toFloat(); a *= mm; b *= mm
                      }
                      ox[k] = a; oy[k] = b
                  }
                  val out = IntArray(n); val cxf = w / 2f; val cyf = h / 2f; val maxD = hypot(cxf, cyf)
                  fun q(v: Float) = (sqrt(v.coerceIn(0f, 1f)) * 255f + 0.5f).toInt()
                  Img.par(h) { y ->
                      for (x in 0 until w) {
                          val i = y * w + x; val r = coc[i]
                          if (r < 0.7f) { out[i] = px[i]; continue }
                          val ns = (r * 2.2f).toInt().coerceIn(12, T)
                          val catS = if (bp.cat > 0f) 1f - bp.cat * 0.6f * (hypot(x - cxf, y - cyf) / maxD) else 1f
                          var sr = 0f; var sg = 0f; var sb = 0f; var sw = 0f
                          for (qq in 0 until ns) {
                              val kk = qq * T / ns; val dx = ox[kk] * r * catS; val dy = oy[kk] * r
                              val sx = (x + dx).roundToInt().coerceIn(0, w - 1); val sy = (y + dy).roundToInt().coerceIn(0, h - 1); val j = sy * w + sx
                              val dist = sqrt(dx * dx + dy * dy)
                              var wg = (coc[j] - dist + 1f).coerceIn(0f, 1f)
                              if (d[j] < d[i] - 0.03f) wg = minOf(wg, (coc[i] - dist + 1f).coerceIn(0f, 1f))
                              if (wg <= 0f) continue
                              val lum = 0.3f * R[j] + 0.59f * G[j] + 0.11f * B[j]
                              wg *= 1f + bp.hl * maxOf(0f, lum - 0.55f) * 8f
                              sr += R[j] * wg; sg += G[j] * wg; sb += B[j] * wg; sw += wg
                          }
                          if (sw < 1e-4f) { out[i] = px[i]; continue }
                          out[i] = (px[i] and 0xFF000000.toInt()) or (q(sr / sw) shl 16) or (q(sg / sw) shl 8) or q(sb / sw)
                      }
                  }
                  return out
              }
