          @Composable fun BokehPanel(vm: Vm) {
              val b = vm.st.bokeh
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Small 99 MB", b.model == 0) { b.model = 0; vm.rev++ }; GPill("Base 389 MB (precise)", b.model == 1) { b.model = 1; vm.rev++ } }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { for (r in listOf(518, 700, 1036)) GPill("$r px", b.side == r) { b.side = r; vm.rev++ }; GPill("Flip TTA", b.tta) { b.tta = !b.tta; vm.rev++ } }
              Box(Modifier.fillMaxWidth().press { vm.computeDepth() }.clip(RoundedCornerShape(18.dp)).background(Th.grad()).padding(vertical = 13.dp), contentAlignment = Alignment.Center) {
                  Text(if (vm.depthReady) "Recompute depth" else "Compute depth map", color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 14.sp) }
              if (!vm.depthReady) { Text("Depth Anything V2 runs once on this phone. Higher resolution and flip-averaging trace edges more precisely but take longer. Base is CC BY-NC (personal use).", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp); return }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Blur on", b.on) { b.on = !b.on; vm.touch(); vm.commit() }; GPill("Show depth", b.showDepth) { b.showDepth = !b.showDepth; vm.touch() }; GPill("Blur foreground", b.fg) { b.fg = !b.fg; vm.touch(); vm.commit() } }
              Text("Tap the photo to set the focus point.", color = Th.a1, fontSize = 12.sp)
              SL(vm, "Aperture", "f/16", "f/1.2", b.aperture, 0f..1f) { b.aperture = it }
              SL(vm, "In-focus range", "thin", "deep", b.dof, 0f..0.4f) { b.dof = it }
              Fine(vm) {
                  SL(vm, "Falloff", "gradual", "fast", 1.6f - b.gamma, 0.2f..1.4f) { b.gamma = 1.6f - it }
                  SL(vm, "Highlight bokeh balls", "soft", "bright", b.hl, 0f..1f) { b.hl = it }
                  SL(vm, "Cat-eye edges", "none", "strong", b.cat, 0f..1f) { b.cat = it }
                  SL(vm, "Protect subject", "", "", b.protect, 0f..1f) { b.protect = it }
                  val shapes = listOf("Circle" to 0, "Pentagon" to 5, "Hexagon" to 6, "Octagon" to 8)
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(shapes.size) { i -> GPill(shapes[i].first, b.blades == shapes[i].second) { b.blades = shapes[i].second; vm.touch(); vm.commit() } } }
                  if (b.blades > 0) SL(vm, "Rotation", "", "", b.rot, 0f..1.57f) { b.rot = it }
              }
          }

          @Composable fun ParallaxPanel(vm: Vm) {
              val p = vm.st.par
              if (!vm.depthReady) { Text("Parallax moves each pixel by its depth. Compute the depth map first.", color = Color.White.copy(alpha = 0.6f), fontSize = 13.sp); Row { GPill("Go to Bokeh") { vm.tab = "Bokeh" } }; return }
              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(Parallax.PATHS.size) { i -> GPill(Parallax.PATHS[i], p.path == i) { p.path = i; vm.rev++ } } }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill(if (vm.parPlay) "Pause preview" else "Play preview", vm.parPlay) { vm.parPlay = !vm.parPlay }; Text("Tap the photo to set the focus plane.", color = Th.a1, fontSize = 11.sp, modifier = Modifier.padding(top = 8.dp)) }
              SliderRow("Amount", "subtle", "dramatic", p.amp, 0.005f..0.08f, { "%.3f".format(it) }, { p.amp = it; vm.rev++ }, { vm.commit() })
              SliderRow("Duration", "", "", p.dur, 2f..10f, { "%.1f s".format(it) }, { p.dur = it; vm.rev++ }, { vm.commit() })
              Fine(vm) {
                  SliderRow("Vertical share", "flat", "full", p.vr, 0f..1.2f, { "%.2f".format(it) }, { p.vr = it; vm.rev++ }, { vm.commit() })
                  SliderRow("Focus plane", "far", "near", p.focus, 0f..1f, { "%.2f".format(it) }, { p.focus = it; vm.rev++ }, { vm.commit() })
                  SliderRow("Depth contrast", "flatter", "deeper", p.gamma, 0.5f..2f, { "%.2f".format(it) }, { p.gamma = it; vm.rev++ }, { vm.commit() })
                  SliderRow("Depth smoothing", "sharp edges", "soft edges", p.smooth, 0f..1f, { "%.2f".format(it) }, { p.smooth = it; vm.rev++ }, { vm.commit() })
                  SliderRow("Edge protect", "", "", p.protect, 0f..1f, { "%.2f".format(it) }, { p.protect = it; vm.rev++ }, { vm.commit() })
                  SliderRow("Ease at the ends", "linear", "lingering", p.ease, 0f..1f, { "%.2f".format(it) }, { p.ease = it; vm.rev++ }, { vm.commit() })
                  SliderRow("Camera roll", "", "", p.roll, 0f..6f, { "%.1f°".format(it) }, { p.roll = it; vm.rev++ }, { vm.commit() })
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Auto zoom to hide edges", p.auto) { p.auto = !p.auto; vm.rev++ } }
                  if (!p.auto) SliderRow("Zoom", "", "", p.zoom, 1f..1.4f, { "%.2f".format(it) }, { p.zoom = it; vm.rev++ }, { vm.commit() })
              }
              Sec("Video")
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { for (r in listOf(720, 1080, 1440)) GPill("${r}p", p.res == r) { p.res = r; vm.rev++ }; for (f in listOf(24, 30, 60)) GPill("$f fps", p.fps == f) { p.fps = f; vm.rev++ } }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { for (l in listOf(1, 2, 3, 5)) GPill("Loop x$l", p.loops == l) { p.loops = l; vm.rev++ } }
              SliderRow("Bitrate", "", "", p.mbps.toFloat(), 4f..40f, { "${it.toInt()} Mbps" }, { p.mbps = it.toInt(); vm.rev++ }, { vm.commit() })
              Box(Modifier.fillMaxWidth().press { vm.parExport() }.clip(RoundedCornerShape(18.dp)).background(Th.grad()).padding(vertical = 13.dp), contentAlignment = Alignment.Center) { Text("Export parallax video", color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 14.sp) }
          }

          // ---------------------------------------------------------------- overlays

          @Composable fun ExportLayer(vm: Vm) {
              Box(Modifier.fillMaxSize().background(Color(0x88000000)).press { vm.showExp = false }, contentAlignment = Alignment.Center) {
                  Column(Modifier.padding(28.dp).fillMaxWidth().glass(Th.corner.dp + 4.dp).padding(22.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Text("Export photo", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Text("Re-runs every effect at the chosen size. Bigger takes longer and uses more memory.", color = Color.White.copy(alpha = 0.55f), fontSize = 12.sp)
                      GPill("Fast  1600 px") { vm.showExp = false; vm.export(1600) }; GPill("High  2560 px", true) { vm.showExp = false; vm.export(2560) }; GPill("Max  3600 px") { vm.showExp = false; vm.export(3600) }
                  }
              }
          }

          @Composable fun SettingsLayer(vm: Vm) {
              fun sv() = vm.saveSettings()
              Box(Modifier.fillMaxSize().background(Color(0x88000000)).press { vm.settings = false }, contentAlignment = Alignment.Center) {
                  Column(Modifier.padding(20.dp).fillMaxWidth().heightIn(max = 640.dp).glass(Th.corner.dp + 4.dp).pointerInput(Unit) { detectTapGestures { } }.verticalScroll(rememberScrollState()).padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Text("Appearance", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      SliderRow("Accent color", "", "", Th.hue, 0f..360f, { "${it.toInt()}°" }, { Th.hue = it }, { sv() })
                      SliderRow("Glass blur", "clear", "frosted", Th.blur, 0f..1f, { "%.2f".format(it) }, { Th.blur = it }, { vm.refreshBackdrop(); sv() })
                      SliderRow("Glass opacity", "", "", Th.opacity, 0.05f..0.8f, { "%.2f".format(it) }, { Th.opacity = it }, { sv() })
                      SliderRow("Corner radius", "", "", Th.corner, 8f..40f, { "${it.toInt()} dp" }, { Th.corner = it }, { sv() })
                      SliderRow("Glow", "", "", Th.glow, 0f..1f, { "%.2f".format(it) }, { Th.glow = it }, { sv() })
                      SliderRow("Animation speed", "calm", "snappy", Th.speed, 0.5f..2f, { "%.1fx".format(it) }, { Th.speed = it }, { sv() })
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Haptics", Th.haptics) { Th.haptics = !Th.haptics; sv() }; GPill("Compact", Th.compact) { Th.compact = !Th.compact; sv() }; GPill("Always show fine tune", Th.expand) { Th.expand = !Th.expand; sv() } }
                      Text("Performance", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { for (r in listOf(900, 1200, 1600)) GPill("Preview $r", vm.prevRes == r) { vm.prevRes = r; sv(); vm.touch(); vm.bake() } }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("AI on GPU/NPU (NNAPI, restart)", Acc.nnapi) { Acc.nnapi = !Acc.nnapi; sv() } }
                      Text("The live reshape preview already runs on the GPU. Colour effects, makeup and bokeh are computed on the CPU. NNAPI lets the AI models use the vendor GPU/DSP driver at slightly lower precision; restart the app after changing it.", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp)
                  }
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon --stacktrace
        env:
          VC: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: FaceLab-debug, path: app/build/outputs/apk/debug/*.apk }
