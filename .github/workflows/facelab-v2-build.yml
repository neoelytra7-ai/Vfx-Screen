          @Composable fun Editor(vm: Vm) {
              BackHandler { if (vm.settings) vm.settings = false else vm.stage = 0 }
              LaunchedEffect(vm.bakeId) { vm.fade.snapTo(0f); vm.fade.animateTo(1f, tween(ms(420))) }
              LaunchedEffect(vm.status) { if (vm.status.isNotEmpty()) { kotlinx.coroutines.delay(4500); if (!vm.busy) vm.status = "" } }
              LaunchedEffect(vm.tab, vm.parPlay) { if (vm.tab == "Parallax") { var last = 0L; while (true) { withFrameNanos { n -> if (vm.parPlay && last != 0L) vm.parT = (vm.parT + (n - last) / 1e9f / vm.st.par.dur) % 1f; last = n } } } }
              Box(Modifier.fillMaxSize()) {
                  Stage(vm)
                  Column(Modifier.align(Alignment.TopCenter).statusBarsPadding().padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                          GIcon(0) { vm.stage = 0 }; GIcon(1) { vm.undo() }
                          Box(Modifier.pointerInput(Unit) { detectTapGestures(onPress = { vm.compare = true; tryAwaitRelease(); vm.compare = false }) }) { GIcon(2, vm.compare) }
                          GIcon(3, vm.detect) { vm.detect = !vm.detect; vm.bake() }
                          GIcon(4) { vm.settings = true }
                          Spacer(Modifier.weight(1f))
                          BakingOrb(vm)
                          Box(Modifier.press { vm.showExp = true }.clip(CircleShape).background(Th.grad()).padding(horizontal = 18.dp, vertical = 11.dp)) { Text("Export", color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 13.sp) }
                      }
                      AnimatedVisibility(vm.status.isNotEmpty() && !vm.busy, enter = fadeIn(tween(ms(250))) + slideInVertically { -it / 2 }, exit = fadeOut()) {
                          Text(vm.status, color = Color.White, fontSize = 12.sp, modifier = Modifier.glass(16.dp, 0.9f).padding(horizontal = 14.dp, vertical = 7.dp)) }
                  }
                  Column(Modifier.align(Alignment.BottomCenter).navigationBarsPadding().padding(10.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      AnimatedVisibility(vm.sheet, enter = fadeIn(tween(ms(250))) + slideInVertically(spring(0.85f, 350f * Th.speed)) { it / 3 }, exit = fadeOut(tween(ms(150))) + slideOutVertically { it / 3 }) { Sheet(vm) }
                      Dock(vm)
                  }
                  if (vm.showExp) ExportLayer(vm)
              }
          }

          @Composable fun BakingOrb(vm: Vm) {
              val a by animateFloatAsState(if (vm.baking) 1f else 0f, tween(ms(300)), label = "orb")
              val t by rememberInfiniteTransition(label = "orbt").animateFloat(initialValue = 0.6f, targetValue = 1.2f, animationSpec = infiniteRepeatable(tween(ms(800)), RepeatMode.Reverse), label = "o")
              Canvas(Modifier.size(22.dp).graphicsLayer { alpha = a }) { drawCircle(Th.a1.copy(alpha = 0.35f), size.minDimension / 2 * t); drawCircle(Th.a2, size.minDimension / 5) }
          }

          @Composable fun Dock(vm: Vm) {
              LazyRow(Modifier.fillMaxWidth().glass(Th.corner.dp, 1f).padding(6.dp), horizontalArrangement = Arrangement.spacedBy(6.dp), verticalAlignment = Alignment.CenterVertically) {
                  item { Box(Modifier.size(34.dp).press { vm.sheet = !vm.sheet }.padding(8.dp)) { val rot by animateFloatAsState(if (vm.sheet) 0f else 180f, tween(ms(300)), label = "chev"); Canvas(Modifier.fillMaxSize().graphicsLayer { rotationZ = rot }) { glyph(9, Color.White) } } }
                  items(TABS.size) { i -> val t = TABS[i]
                      val on = vm.tab == t && vm.sheet; val a by animateFloatAsState(if (on) 1f else 0f, tween(ms(260)), label = "tab")
                      Text(t, color = if (on) Color(0xFF0A0A0F) else Color.White.copy(alpha = 0.85f), fontSize = 13.sp, fontWeight = if (on) FontWeight.Bold else FontWeight.Medium,
                          modifier = Modifier.press { if (vm.tab == t && vm.sheet) vm.sheet = false else { vm.tab = t; vm.sheet = true } }.clip(CircleShape).drawBehind { if (a > 0f) drawRect(Th.grad(), alpha = a) }.padding(horizontal = 13.dp, vertical = 9.dp)) }
              }
          }

          @Composable fun Sheet(vm: Vm) {
              Column(Modifier.fillMaxWidth().heightIn(max = if (vm.tall) 560.dp else 330.dp).glass(Th.corner.dp).animateContentSize(spring(0.85f, 300f * Th.speed))) {
                  Box(Modifier.fillMaxWidth().press { vm.tall = !vm.tall }.padding(top = 9.dp, bottom = 4.dp), contentAlignment = Alignment.Center) { Box(Modifier.size(38.dp, 4.dp).background(Color.White.copy(alpha = 0.35f), CircleShape)) }
                  Column(Modifier.verticalScroll(rememberScrollState()).padding(Th.pad, 4.dp, Th.pad, 18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      vm.rev
                      AnimatedContent(vm.tab, transitionSpec = { (fadeIn(tween(ms(260))) + slideInVertically(tween(ms(260))) { it / 14 }) togetherWith fadeOut(tween(ms(120))) }, label = "panel") { t ->
                          Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              when (t) { "Skin" -> SkinPanel(vm); "Hair" -> HairPanel(vm); "Makeup" -> MakeupPanel(vm); "Detail" -> DetailPanel(vm); "Light" -> LightPanel(vm)
                                  "Adjust" -> AdjustPanel(vm); "Bokeh" -> BokehPanel(vm); "Parallax" -> ParallaxPanel(vm); else -> ParamPanel(vm, t) }
                          }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- stage (GPU mesh preview)

          @Composable fun Stage(vm: Vm) {
              val paint = remember { android.graphics.Paint(android.graphics.Paint.FILTER_BITMAP_FLAG or android.graphics.Paint.ANTI_ALIAS_FLAG) }
              Box(Modifier.fillMaxSize().clipToBounds()
                  .pointerInput(Unit) { detectTransformGestures { _, pan, zoom, _ -> vm.zoom = (vm.zoom * zoom).coerceIn(1f, 6f); vm.off = if (vm.zoom <= 1.02f) Offset.Zero else vm.off + pan } }
                  .pointerInput(vm.tab) {
                      detectTapGestures(onDoubleTap = { vm.zoom = 1f; vm.off = Offset.Zero }, onTap = { p ->
                          val b = vm.baked
                          if (b != null && vm.depthReady && (vm.tab == "Bokeh" || vm.tab == "Parallax")) {
                              val bw = size.width.toFloat(); val bh = size.height.toFloat(); val s = minOf(bw / b.width, bh / b.height); val dw = b.width * s; val dh = b.height * s
                              val qx = (p.x - bw / 2 - vm.off.x) / vm.zoom + bw / 2; val qy = (p.y - bh / 2 - vm.off.y) / vm.zoom + bh / 2
                              val nx = (qx - (bw - dw) / 2) / dw; val ny = (qy - (bh - dh) / 2) / dh
                              if (nx in 0f..1f && ny in 0f..1f) {
                                  if (vm.tab == "Bokeh") { vm.st.bokeh.fx = nx; vm.st.bokeh.fy = ny; vm.touch(); vm.commit() }
                                  else vm.depth?.let { d -> vm.st.par.focus = d.d[(ny * (d.h - 1)).toInt() * d.w + (nx * (d.w - 1)).toInt()]; vm.rev++ }
                              }
                          }
                      })
                  }) {
                  Canvas(Modifier.fillMaxSize()) {
                      vm.meshRev; vm.bakeId; vm.parT
                      val bmp = (if (vm.compare) vm.orig else vm.baked) ?: return@Canvas
                      val bw = bmp.width.toFloat(); val bh = bmp.height.toFloat(); val s = minOf(size.width / bw, size.height / bh) * vm.zoom
                      var v: FloatArray? = if (vm.compare || vm.detect || vm.vertsFor !== vm.baked) null else vm.verts
                      if (v != null && vm.tab == "Parallax" && vm.depthReady) {
                          val prep = vm.parPrep()
                          if (prep != null && prep.dg.size * 2 == v.size) { if (vm.parOut.size != v.size) vm.parOut = FloatArray(v.size); Parallax.frame(v, bmp.width, bmp.height, prep, vm.st.par, vm.parT, vm.parOut); v = vm.parOut }
                      }
                      val vv = v
                      drawIntoCanvas { c ->
                          val n = c.nativeCanvas; n.save(); n.translate(size.width / 2 + vm.off.x, size.height / 2 + vm.off.y); n.scale(s, s); n.translate(-bw / 2, -bh / 2)
                          val prev = vm.prevBaked; val f = vm.fade.value
                          if (!vm.compare && prev != null && f < 1f && prev.width == bmp.width && prev.height == bmp.height) { paint.alpha = 255; if (vv != null) n.drawBitmapMesh(prev, vm.MW, vm.meshH, vv, 0, null, 0, paint) else n.drawBitmap(prev, 0f, 0f, paint) }
                          paint.alpha = if (vm.compare) 255 else (255 * f).toInt().coerceIn(0, 255).let { if (prev == null) 255 else it }
                          if (vv != null) n.drawBitmapMesh(bmp, vm.MW, vm.meshH, vv, 0, null, 0, paint) else n.drawBitmap(bmp, 0f, 0f, paint)
                          n.restore()
                      }
                  }
                  if (vm.baked == null) Text("Rendering...", color = Color.White.copy(alpha = 0.6f), modifier = Modifier.align(Alignment.Center))
              }
          }

          // ---------------------------------------------------------------- panels

          @Composable fun ParamPanel(vm: Vm, tab: String) {
              val a = vm.an
              if (tab != "Body" && (a == null || a.faces.isEmpty())) { Text("No face was detected in this photo.", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp); return }
              if (tab == "Body" && a?.pose == null) { Text("No full body found. Body shaping needs shoulders and hips in frame.", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp); return }
              if (tab != "Body" && a != null && a.faces.size > 1) LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  items(a.faces.size) { i -> GPill("Face ${i + 1}", !vm.allFaces && vm.face == i) { vm.face = i; vm.allFaces = false; vm.touch() } }
                  item { GPill("All faces", vm.allFaces) { vm.allFaces = !vm.allFaces } }
              }
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                  Column(Modifier.weight(1f)) { Text("Template strength  ${"%.1f".format(vm.tplK)}", color = Color.White.copy(alpha = 0.6f), fontSize = 11.sp); GSlider(vm.tplK, 0.2f..1.4f, null, { vm.tplK = it }, {}) }
                  GPill("Reset") { vm.resetTab() }
              }
              for (g in Defs.GROUPS[tab] ?: emptyList()) {
                  val list = Defs.TPL.filter { it.group == g }
                  Sec("$g  ${list.size}")
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(list.size) { i -> GPill(list[i].name) { vm.applyTpl(list[i]) } } }
              }
              Fine(vm) { for (pd in Defs.TABS[tab] ?: emptyList()) SliderRow(pd.label, pd.lo, pd.hi, vm.pv(pd.id), -1f..1f, { "%+.2f".format(it) }, { vm.setP(pd.id, it) }, { vm.commit() }) }
          }

          @Composable fun SkinPanel(vm: Vm) {
              val s = vm.st.skin
              Sec("Skin tone")
              LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                  item { Swatch("Original", 0x444444, s.tone == 0) { s.tone = 0; vm.touch(); vm.commit() } }
                  items(SKIN_TONES.size) { i -> val t = SKIN_TONES[i]; Swatch(t.first, t.second, s.tone == argb(t.second)) { s.tone = argb(t.second); if (s.amt < 0.3f) s.amt = 0.8f; vm.touch(); vm.commit() } }
              }
              SL(vm, "Tone strength", "", "", s.amt, 0f..1f) { s.amt = it }
              SL(vm, "Smoothing", "", "", s.smooth, 0f..1f) { s.smooth = it }
              Fine(vm) {
                  SL(vm, "Brightness", "darker", "brighter", s.lighten, -1f..1f) { s.lighten = it }
                  SL(vm, "Warmth", "cool", "warm", s.warmth, -1f..1f) { s.warmth = it }
                  SL(vm, "Saturation", "muted", "rich", s.sat, -1f..1f) { s.sat = it }
                  SL(vm, "Shadows", "deeper", "lifted", s.shadows, -1f..1f) { s.shadows = it }
                  SL(vm, "Highlights", "calmer", "brighter", s.highlights, -1f..1f) { s.highlights = it }
                  SL(vm, "Texture kept", "plastic", "natural pores", s.texture, 0f..1f) { s.texture = it }
                  SL(vm, "Even tone", "", "", s.even, 0f..1f) { s.even = it }
                  SL(vm, "Redness", "", "", s.redness, 0f..1f) { s.redness = it }
                  SL(vm, "Blemishes", "", "", s.blemish, 0f..1f) { s.blemish = it }
                  SL(vm, "Glow", "", "", s.glow, 0f..1f) { s.glow = it }
                  SL(vm, "Neck, arms and legs", "none", "match", s.bodyAmt, 0f..1f) { s.bodyAmt = it }
                  Row { GPill("Match body skin", s.body) { s.body = !s.body; vm.touch(); vm.commit() } }
              }
          }

          @Composable fun HairPanel(vm: Vm) {
              val h = vm.st.hair
              if (vm.an?.faces.isNullOrEmpty()) { Text("Hair tools need a detected face.", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp); return }
              val modes = listOf("Solid", "Ombre", "Dip dye", "Balayage", "Money piece", "Split")
              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(modes.size) { i -> GPill(modes[i], h.mode == i) { h.mode = i; vm.touch(); vm.commit() } } }
              Sec(if (h.mode == 0) "Color" else "Main color")
              LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                  item { Swatch("Original", 0x444444, h.c1 == 0) { h.c1 = 0; vm.touch(); vm.commit() } }
                  items(HAIR_COLORS.size) { i -> val c = HAIR_COLORS[i]; Swatch(c.first, c.second, h.c1 == argb(c.second)) { h.c1 = argb(c.second); vm.touch(); vm.commit() } }
              }
              if (h.mode != 0) { Sec("Second color"); LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) { items(HAIR_COLORS.size) { i -> val c = HAIR_COLORS[i]; Swatch(c.first, c.second, h.c2 == argb(c.second)) { h.c2 = argb(c.second); vm.touch(); vm.commit() } } } }
              SL(vm, "Strength", "", "", h.amt, 0f..1f) { h.amt = it }
              Fine(vm) {
                  if (h.mode in 1..2) { SL(vm, "Gradient position", "roots", "tips", h.pos, 0.1f..0.95f) { h.pos = it }; SL(vm, "Gradient softness", "hard", "soft", h.soft, 0.03f..0.5f) { h.soft = it } }
                  if (h.mode == 3) SL(vm, "Streaks", "few", "many", h.streak, 0f..1f) { h.streak = it }
                  SL(vm, "Shine", "matte", "glossy", h.shine, 0f..1f) { h.shine = it }
                  SL(vm, "Lift", "darker", "lighter", h.lift, -1f..1f) { h.lift = it }
              }
              Text("Recolors the real strands and keeps their shine. Changing the cut itself needs a generative model; Face has hair volume and crown lift.", color = Color.White.copy(alpha = 0.4f), fontSize = 10.sp)
          }

          @Composable fun MakeupPanel(vm: Vm) {
              val fe = vm.curFace(); if (fe == null) { Text("Makeup needs a detected face.", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp); return }
              fun tg() = vm.targetsPublic()
              val fams = listOf("Asian", "Douyin", "Goth")
              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(fams.size) { i -> GPill(fams[i], vm.mkFamily == fams[i]) { vm.mkFamily = fams[i] } } }
              val list = MkLib.ALL.filter { it.family == vm.mkFamily }
              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  item { GPill("None", fe.mk == null) { tg().forEach { it.mk = null }; vm.touch(); vm.commit() } }
                  items(list.size) { i -> GPill(list[i].name, fe.mk?.name == list[i].name) { tg().forEach { it.mk = list[i] }; vm.touch(); vm.commit() } }
              }
              SliderRow("Intensity", "", "", fe.mkK, 0f..1.5f, { "%.2f".format(it) }, { v -> tg().forEach { it.mkK = v }; vm.touch() }, { vm.commit() })
              val parts = listOf("Lips", "Shadow", "Liner", "Lashes", "Brows", "Blush", "Sculpt", "Lens", "Skin")
              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(parts.size) { i -> GPill(parts[i], parts[i] in fe.mkOn) { tg().forEach { f -> if (parts[i] in f.mkOn) f.mkOn.remove(parts[i]) else f.mkOn.add(parts[i]) }; vm.touch(); vm.commit() } } }
              Fine(vm) {
                  for (p in parts) if (p in fe.mkOn) SliderRow(p, "", "", fe.partK[p] ?: 1f, 0f..1.5f, { "%.2f".format(it) }, { v -> tg().forEach { it.partK[p] = v }; vm.touch() }, { vm.commit() })
                  for ((key, label) in listOf("lip" to "Lip color", "lid" to "Eyeshadow lid", "crease" to "Eyeshadow crease", "blush" to "Blush", "liner" to "Eyeliner", "brow" to "Brow color", "lens" to "Lens color")) {
                      Sec(label)
                      LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          item { Swatch("Template", 0x444444, fe.col[key] == null) { tg().forEach { it.col.remove(key) }; vm.touch(); vm.commit() } }
                          items(PAL.size) { i -> val c = PAL[i]; Swatch(c.first, c.second, fe.col[key] == argb(c.second)) { tg().forEach { it.col[key] = argb(c.second) }; vm.touch(); vm.commit() } }
                      }
                  }
              }
          }

          @Composable fun DetailPanel(vm: Vm) {
