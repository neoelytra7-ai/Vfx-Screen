              }

              /** Vertex grid for drawBitmapMesh: every grid point moved by the summed operators. Cheap enough to redo while a slider moves. */
              fun mesh(w: Int, h: Int, mw: Int, mh: Int, ops: List<Op>, k: Float): FloatArray {
                  val verts = FloatArray((mw + 1) * (mh + 1) * 2); val edge = 0.04f * minOf(w, h)
                  Img.par(mh + 1) { j ->
                      for (i in 0..mw) {
                          val vx = w * i.toFloat() / mw; val vy = h * j.toFloat() / mh
                          val ax = vx / k; val ay = vy / k
                          var dx = 0f; var dy = 0f
                          for (o in ops) {
                              val ddx = ax - o.cx; val ddy = ay - o.cy
                              val qx = o.c * ddx + o.s * ddy; val qy = -o.s * ddx + o.c * ddy
                              val t2 = (qx / o.rx) * (qx / o.rx) + (qy / o.ry) * (qy / o.ry)
                              if (t2 >= 1f) continue
                              val fo = (1f - t2) * (1f - t2)
                              val lx = fo * (o.sx * qx + o.shx - o.rot * qy); val ly = fo * (o.sy * qy + o.shy + o.rot * qx)
                              dx += o.c * lx - o.s * ly; dy += o.s * lx + o.c * ly
                          }
                          val e = Img.smooth(minOf(minOf(vx, vy), minOf(w - vx, h - vy)), 0f, edge)
                          val idx = (j * (mw + 1) + i) * 2
                          verts[idx] = vx + dx * k * e; verts[idx + 1] = vy + dy * k * e
                      }
                  }
                  return verts
              }

              fun apply(src: Bitmap, ops: List<Op>, k: Float): Bitmap {
                  if (ops.isEmpty()) return src
                  val w = src.width; val h = src.height; val mw = 220; val mh = maxOf(2, (mw * h.toFloat() / w).roundToInt())
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  Canvas(out).drawBitmapMesh(src, mw, mh, mesh(w, h, mw, mh, ops, k), 0, null, 0, Paint(Paint.FILTER_BITMAP_FLAG or Paint.ANTI_ALIAS_FLAG))
                  return out
              }
          }
