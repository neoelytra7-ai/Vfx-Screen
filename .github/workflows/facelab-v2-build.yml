                  backdrop = s.asImageBitmap()
              }
              fun refreshBackdrop() { val b = baked ?: return; bakeEx.execute { makeBackdrop(b) } }

              fun bake() {
                  val a = an ?: return; val my = ++bakeReq; val snap = st.copy(); val dp = depth; val dbg = detect; baking = true
                  bakeEx.execute {
                      if (my != bakeReq) return@execute
                      try {
                          val b = if (dbg) Render.debug(a, base(prevRes)) else Render.bake(a, base(prevRes), snap, dp, cache) { my != bakeReq }
                          if (my == bakeReq) { prevBaked = baked; baked = b; bakeId++; if (!dbg) makeBackdrop(b); meshAsync() }
                      } catch (e: Canceled) {} catch (e: Throwable) { status = "Render error: ${e.message?.take(100)}" }
                      if (my == bakeReq) baking = false
                  }
              }

              fun meshAsync() {
                  val a = an ?: return; val b = baked ?: return; val my = ++meshReq; val snap = st.copy()
                  meshEx.execute {
                      if (my != meshReq) return@execute
                      val k = b.width.toFloat() / a.w; val mh = maxOf(2, (MW * b.height.toFloat() / b.width).roundToInt())
                      val v = Warp.mesh(b.width, b.height, MW, mh, Render.ops(a, snap), k)
                      if (my == meshReq) { meshH = mh; vertsFor = b; verts = v; meshRev++ }
                  }
              }

              fun touch() { rev++; val k = st.bakeKey(); if (k != lastKey) { lastKey = k; bake() } else meshAsync() }
              fun commit() { while (hist.size > hp + 1) hist.removeAt(hist.size - 1); hist.add(st.copy()); hp = hist.size - 1; if (hist.size > 40) { hist.removeAt(0); hp-- } }
              fun undo() { if (hp > 0) { hp--; st = hist[hp].copy(); touch() } }

              private fun targets(): List<FaceEdit> = if (allFaces) st.faces else listOfNotNull(st.faces.getOrNull(face))
              fun targetsPublic() = targets()
              fun curFace(): FaceEdit? = st.faces.getOrNull(face)
              fun pv(id: String): Float { rev; return if (tab == "Body") st.body[id] ?: 0f else st.faces.getOrNull(face)?.p?.get(id) ?: 0f }
              fun setP(id: String, v: Float) { if (tab == "Body") st.body[id] = v else targets().forEach { it.p[id] = v }; touch() }
              fun applyTpl(t: Tpl) {
                  val whole = t.group == "Whole look"
                  val clear = if (whole) Defs.TABS.filterKeys { it != "Body" }.values.flatten().map { it.id } else (Defs.TABS[tab] ?: emptyList()).map { it.id }
                  val maps: List<MutableMap<String, Float>> = if (tab == "Body") listOf(st.body) else targets().map { it.p }
                  for (m in maps) { for (c in clear) m.remove(c); for ((k, v) in t.v) m[k] = (v * tplK).coerceIn(-1.3f, 1.3f) }
                  touch(); commit()
              }
              fun resetTab() {
                  val ids = (Defs.TABS[tab] ?: emptyList()).map { it.id }
                  val maps: List<MutableMap<String, Float>> = if (tab == "Body") listOf(st.body) else targets().map { it.p }
                  for (m in maps) for (i in ids) m.remove(i)
                  touch(); commit()
              }

              fun computeDepth() {
                  if (busy || full == null) return; val bp = st.bokeh; startJob("Estimating depth", listOf("Preparing the depth model", "Reading depth (slow, precise)", "Refining edges"))
                  Thread {
                      try {
                          val m = Models.DEPTH[bp.model]
                          if (!Models.has(app, m)) { jobDetail = m.file; Models.fetch(app, m) { jobP = it } }
                          jobP = -1f; jobDetail = ""; jobStep = 1
                          depth = DepthNet.run(app, bp.model, base(2000), bp.side, bp.tta)
                          jobStep = 2; depthReady = true; st.bokeh.on = true; status = "Depth ready. Tap the photo to set focus."; lastKey = 0; touch(); commit()
                      } catch (e: Throwable) { status = "Depth failed: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }

              fun export(r: Int) {
                  val a = an ?: return; if (busy) return; startJob("Exporting the photo", listOf("Applying every effect", "Reshaping", "Saving"))
                  Thread {
                      try {
                          val b = Render.bake(a, base(r), st.copy(), depth, MaskCache()) { false }; jobStep = 1
                          val out = Warp.apply(b, Render.ops(a, st), b.width.toFloat() / a.w); jobStep = 2
                          val v = ContentValues().apply { put(MediaStore.Images.Media.DISPLAY_NAME, "FaceLab_" + System.currentTimeMillis() + ".jpg"); put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                              put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/FaceLab"); put(MediaStore.Images.Media.IS_PENDING, 1) }
                          val u = app.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)
                          if (u != null) { app.contentResolver.openOutputStream(u)?.use { out.compress(Bitmap.CompressFormat.JPEG, 98, it) }; v.clear(); v.put(MediaStore.Images.Media.IS_PENDING, 0); app.contentResolver.update(u, v, null, null); status = "Saved to Pictures/FaceLab (${out.width} x ${out.height})" }
                          else status = "Save failed"
                      } catch (e: Throwable) { status = "Export failed: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }

              fun parPrep(): Prep? {
                  val d = depth ?: return null; if (meshH < 2) return null; val p = st.par; val k = "${p.gamma}|${p.smooth}|${p.protect}|${p.focus}|${MW}|$meshH|${System.identityHashCode(d)}"
                  if (k != parKey || parPrepV == null) { parPrepV = Parallax.prepare(d, MW, meshH, p); parKey = k }
                  return parPrepV
              }

              fun parExport() {
                  val a = an ?: return; val d = depth ?: return; if (busy) return; val p = st.par.copy(); startJob("Rendering parallax video", listOf("Applying every effect", "Building the depth mesh", "Encoding frames"))
                  Thread {
                      try {
                          val bm = base(p.res); val w = maxOf(16, bm.width / 16 * 16); val h = maxOf(16, bm.height / 16 * 16)
                          val b = Render.bake(a, bm, st.copy(), d, MaskCache()) { false }; jobStep = 1
                          val scaled = if (b.width == w && b.height == h) b else Bitmap.createScaledBitmap(b, w, h, true)
                          val mw = 140; val mh = maxOf(2, (mw * h.toFloat() / w).roundToInt())
                          val verts = Warp.mesh(w, h, mw, mh, Render.ops(a, st), w.toFloat() / a.w); val prep = Parallax.prepare(d, mw, mh, p); jobStep = 2
                          val ok = Parallax.encode(app, scaled, verts, mw, mh, prep, p) { jobP = it }
                          status = if (ok) "Saved to Movies/FaceLab (${w} x ${h})" else "Video export failed"
                      } catch (e: Throwable) { status = "Video export failed: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }
          }

