name: Build FaceLab APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/checkout@v4
      - name: Signing key (created once, committed, reused so updates install over the old app)
        run: |
          if [ ! -f hexnpu.keystore ]; then
            keytool -genkeypair -keystore hexnpu.keystore -storepass hexnpu123 -keypass hexnpu123 -alias hexnpu -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=HexNPU"
            git config user.name github-actions; git config user.email actions@github.com
            git add hexnpu.keystore; git commit -m "Add signing key [skip ci]"; git push
          fi
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          P=app/src/main/java/com/example/facelab
          mkdir -p $P app/src/main
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FaceLab"
          include(":app")
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.facelab"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.facelab"; minSdk = 29; targetSdk = 34
                  versionCode = (System.getenv("VC") ?: "1").toInt(); versionName = "1." + (System.getenv("VC") ?: "0")
                  ndk { abiFilters += "arm64-v8a" }
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              signingConfigs { create("rel") { storeFile = rootProject.file("hexnpu.keystore"); storePassword = "hexnpu123"; keyAlias = "hexnpu"; keyPassword = "hexnpu123" } }
              buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("rel") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true; pickFirsts += "**/libc++_shared.so" } }
          }
          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.23.2")
              implementation("com.google.mediapipe:tasks-vision:0.10.21")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="FaceLab" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/Core.kt <<'EOF'
          package com.example.facelab

          import ai.onnxruntime.*
          import android.content.Context
          import android.graphics.*
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.framework.image.ByteBufferExtractor
          import com.google.mediapipe.tasks.vision.imagesegmenter.ImageSegmenter
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.facelandmarker.FaceLandmarker
          import com.google.mediapipe.tasks.vision.poselandmarker.PoseLandmarker
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.stream.IntStream
          import kotlin.math.*

          class Mdl(val file: String, val urls: List<String>, val mb: Int)

          object Models {
              val FACE = Mdl("face_landmarker.task", listOf("https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"), 4)
              val POSE = Mdl("pose_landmarker_heavy.task", listOf("https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task"), 30)
              val PARSE = Mdl("face_parsing_r34.onnx", listOf("https://github.com/yakhyo/face-parsing/releases/download/v0.0.1/resnet34.onnx", "https://github.com/yakhyo/face-parsing/releases/download/weights/resnet34.onnx"), 82)
              val SELFIE = Mdl("selfie_multiclass.tflite", listOf("https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite"), 16)
              val DEPTH = listOf(
                  Mdl("depth_small.onnx", listOf("https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx"), 99),
                  Mdl("depth_base.onnx", listOf("https://huggingface.co/onnx-community/depth-anything-v2-base/resolve/main/onnx/model.onnx"), 389))
              fun path(ctx: Context, m: Mdl) = File(File(ctx.filesDir, "models"), m.file)
              fun has(ctx: Context, m: Mdl) = path(ctx, m).length() > 0
              fun core(ctx: Context) = has(ctx, FACE) && has(ctx, POSE) && has(ctx, PARSE) && has(ctx, SELFIE)

              fun fetch(ctx: Context, m: Mdl, onP: (Float) -> Unit) {
                  if (has(ctx, m)) return
                  val f = path(ctx, m); f.parentFile?.mkdirs(); var err: Throwable? = null
                  for (u in m.urls) {
                      try {
                          val c = URL(u).openConnection() as HttpURLConnection
                          c.connectTimeout = 20000; c.readTimeout = 30000
                          val total = c.contentLengthLong; val part = File(f.path + ".part"); var last = -1
                          c.inputStream.use { i -> part.outputStream().use { o ->
                              val b = ByteArray(1 shl 16); var n = 0L
                              while (true) {
                                  val k = i.read(b); if (k < 0) break
                                  o.write(b, 0, k); n += k
                                  val p = if (total > 0) (n * 100 / total).toInt() else 0
                                  if (p != last) { last = p; onP(p / 100f) }
                              }
                          } }
                          part.renameTo(f); return
                      } catch (e: Throwable) { err = e }
                  }
                  throw err ?: IllegalStateException("no download url")
              }
          }

          object Img {
              fun par(n: Int, f: (Int) -> Unit) { IntStream.range(0, n).parallel().forEach { f(it) } }

              /** Mean filter with radius r (edge-normalised), separable running sums. */
              fun box(a: FloatArray, w: Int, h: Int, r: Int): FloatArray {
                  val t = FloatArray(a.size); val o = FloatArray(a.size)
                  par(h) { y ->
                      val b = y * w; var s = 0.0; var n = 0
                      for (x in 0..minOf(r, w - 1)) { s += a[b + x]; n++ }
                      for (x in 0 until w) {
                          t[b + x] = (s / n).toFloat()
                          val add = x + r + 1; val rem = x - r
                          if (add < w) { s += a[b + add]; n++ }
                          if (rem >= 0) { s -= a[b + rem]; n-- }
                      }
                  }
                  par(w) { x ->
                      var s = 0.0; var n = 0
                      for (y in 0..minOf(r, h - 1)) { s += t[y * w + x]; n++ }
                      for (y in 0 until h) {
                          o[y * w + x] = (s / n).toFloat()
                          val add = y + r + 1; val rem = y - r
                          if (add < h) { s += t[add * w + x]; n++ }
                          if (rem >= 0) { s -= t[rem * w + x]; n-- }
                      }
                  }
                  return o
              }

              /** Edge-aware refinement of [p] guided by [g] (He et al. guided filter). */
              fun guided(p: FloatArray, g: FloatArray, w: Int, h: Int, r: Int, eps: Float): FloatArray {
                  val n = p.size
                  val mg = box(g, w, h, r); val mp = box(p, w, h, r)
                  val gg = FloatArray(n) { g[it] * g[it] }; val gp = FloatArray(n) { g[it] * p[it] }
                  val cg = box(gg, w, h, r); val cp = box(gp, w, h, r)
                  val a = FloatArray(n); val b = FloatArray(n)
                  for (i in 0 until n) { val v = cg[i] - mg[i] * mg[i]; val c = cp[i] - mg[i] * mp[i]; a[i] = c / (v + eps); b[i] = mp[i] - a[i] * mg[i] }
                  val ma = box(a, w, h, r); val mb = box(b, w, h, r)
                  return FloatArray(n) { (ma[it] * g[it] + mb[it]).coerceIn(0f, 1f) }
              }

              fun gray(px: IntArray) = FloatArray(px.size) { val c = px[it]; (0.299f * ((c shr 16) and 255) + 0.587f * ((c shr 8) and 255) + 0.114f * (c and 255)) / 255f }

              fun resize(src: FloatArray, sw: Int, sh: Int, dw: Int, dh: Int): FloatArray {
                  if (sw == dw && sh == dh) return src
                  val out = FloatArray(dw * dh); val fx = sw.toFloat() / dw; val fy = sh.toFloat() / dh
                  par(dh) { y ->
                      val sy = ((y + 0.5f) * fy - 0.5f).coerceIn(0f, sh - 1f); val y0 = sy.toInt(); val y1 = minOf(y0 + 1, sh - 1); val wy = sy - y0
                      for (x in 0 until dw) {
                          val sx = ((x + 0.5f) * fx - 0.5f).coerceIn(0f, sw - 1f); val x0 = sx.toInt(); val x1 = minOf(x0 + 1, sw - 1); val wx = sx - x0
                          val a = src[y0 * sw + x0] * (1 - wx) + src[y0 * sw + x1] * wx
                          val b = src[y1 * sw + x0] * (1 - wx) + src[y1 * sw + x1] * wx
                          out[y * dw + x] = a * (1 - wy) + b * wy
                      }
                  }
                  return out
              }
              fun smooth(x: Float, a: Float, b: Float): Float { val t = ((x - a) / (b - a)).coerceIn(0f, 1f); return t * t * (3 - 2 * t) }
              fun mix(a: Float, b: Float, t: Float) = a + (b - a) * t
          }

          /** OKLab conversion with lookup tables for speed. */
          object Lab {
              private val toLin = FloatArray(256) { val c = it / 255f; if (c <= 0.04045f) c / 12.92f else ((c + 0.055f) / 1.055f).pow(2.4f) }
              private val toS = ByteArray(4097) { val l = it / 4096f; ((if (l <= 0.0031308f) 12.92f * l else 1.055f * l.pow(1f / 2.4f) - 0.055f).coerceIn(0f, 1f) * 255f + 0.5f).toInt().toByte() }
              fun lab(px: Int, o: FloatArray, i: Int) {
                  val r = toLin[(px shr 16) and 255]; val g = toLin[(px shr 8) and 255]; val b = toLin[px and 255]
                  val l = Math.cbrt((0.4122214708f * r + 0.5363325363f * g + 0.0514459929f * b).toDouble()).toFloat()
                  val m = Math.cbrt((0.2119034982f * r + 0.6806995451f * g + 0.1073969566f * b).toDouble()).toFloat()
                  val s = Math.cbrt((0.0883024619f * r + 0.2817188376f * g + 0.6299787005f * b).toDouble()).toFloat()
                  o[i * 3] = 0.2104542553f * l + 0.7936177850f * m - 0.0040720468f * s
                  o[i * 3 + 1] = 1.9779984951f * l - 2.4285922050f * m + 0.4505937099f * s
                  o[i * 3 + 2] = 0.0259040371f * l + 0.7827717662f * m - 0.8086757660f * s
              }
              fun rgb(L: Float, a: Float, b: Float, alpha: Int): Int {
                  val l_ = L + 0.3963377774f * a + 0.2158037573f * b; val m_ = L - 0.1055613458f * a - 0.0638541728f * b; val s_ = L - 0.0894841775f * a - 1.2914855480f * b
                  val l = l_ * l_ * l_; val m = m_ * m_ * m_; val s = s_ * s_ * s_
                  val r = 4.0767416621f * l - 3.3077115913f * m + 0.2309699292f * s
                  val g = -1.2684380046f * l + 2.6097574011f * m - 0.3413193965f * s
                  val bl = -0.0041960863f * l - 0.7034186147f * m + 1.7076147010f * s
                  fun q(v: Float) = toS[(v.coerceIn(0f, 1f) * 4096f).toInt()].toInt() and 255
                  return (alpha shl 24) or (q(r) shl 16) or (q(g) shl 8) or q(bl)
              }
              fun of(c: Int): FloatArray { val o = FloatArray(3); lab(c, o, 0); return o }
          }

          class Analysis(val w: Int, val h: Int, val faces: List<FloatArray>, val pose: FloatArray?, val maps: Map<Int, ByteArray>)
          class DepthData(val d: FloatArray, val w: Int, val h: Int)

          /** ONNX session options: XNNPACK (optimised ARM kernels) by default, NNAPI (GPU/DSP via the vendor driver) when enabled. Always falls back to plain CPU. */
          object Acc {
              var nnapi = false
              fun opts(threads: Int): OrtSession.SessionOptions {
                  val o = OrtSession.SessionOptions(); o.setIntraOpNumThreads(threads)
                  try {
                      if (nnapi) o.addNnapi(java.util.EnumSet.of(ai.onnxruntime.providers.NNAPIFlags.USE_FP16))
                      else { o.addXnnpack(mapOf("intra_op_num_threads" to threads.toString())); o.setIntraOpNumThreads(1) }
                  } catch (_: Throwable) { o.setIntraOpNumThreads(threads) }
                  return o
              }
          }

          object Analyzer {
              private var flm: FaceLandmarker? = null
              private var plm: PoseLandmarker? = null
              private var seg: ImageSegmenter? = null
              private var parse: OrtSession? = null
              private val env = OrtEnvironment.getEnvironment()
              private val NEED = intArrayOf(1, 2, 3, 4, 5, 6, 7, 8, 10, 11, 12, 13, 14, 16, 17, 18)
              private val SWAP = mapOf(2 to 3, 3 to 2, 4 to 5, 5 to 4, 7 to 8, 8 to 7)
              private val OVAL = intArrayOf(10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109)
              private val MEAN = floatArrayOf(0.485f, 0.456f, 0.406f); private val STD = floatArrayOf(0.229f, 0.224f, 0.225f)

              private fun buf(f: File): ByteBuffer { val b = f.readBytes(); return ByteBuffer.allocateDirect(b.size).put(b).also { it.rewind() } }

              /** Finds faces over the whole frame: one full pass plus overlapping tiles, so small and distant faces are caught too. */
              private fun detectFaces(bmp: Bitmap): List<FloatArray> {
                  val out = ArrayList<FloatArray>()
                  fun fsize(a: FloatArray) = hypot(a[454 * 2] - a[234 * 2], a[454 * 2 + 1] - a[234 * 2 + 1])
                  fun add(a: FloatArray) {
                      val sz = fsize(a)
                      for (e in out) if (hypot(a[2] - e[2], a[3] - e[3]) < 0.5f * maxOf(sz, fsize(e))) return
                      out.add(a)
                  }
                  fun run(b: Bitmap, ox: Float, oy: Float) {
                      for (l in flm!!.detect(BitmapImageBuilder(b).build()).faceLandmarks()) {
                          if (l.size < 478) continue
                          val a = FloatArray(l.size * 2); for (i in l.indices) { a[i * 2] = l[i].x() * b.width + ox; a[i * 2 + 1] = l[i].y() * b.height + oy }; add(a)
                      }
                  }
                  run(bmp, 0f, 0f)
                  val w = bmp.width; val h = bmp.height; val ms = maxOf(w, h)
                  if (ms >= 800) {
                      val ts = (ms * 0.55f).toInt(); val step = (ms * 0.4f).toInt().coerceAtLeast(1)
                      var y = 0
                      while (y < h) {
                          var x = 0
                          while (x < w) {
                              val cw = minOf(ts, w - x); val ch = minOf(ts, h - y)
                              if (cw >= 220 && ch >= 220) run(Bitmap.createBitmap(bmp, x, y, cw, ch), x.toFloat(), y.toFloat())
                              if (x + ts >= w) break; x += step
                          }
                          if (y + ts >= h) break; y += step
                      }
                  }
                  return out.sortedBy { it[468 * 2] }
              }

              /** Coarse whole-frame masks (hair, body skin, face skin, clothes) from the multiclass selfie segmenter. */
              private fun wholeFrame(ctx: Context, bmp: Bitmap): Array<FloatArray>? = try {
                  if (seg == null) seg = ImageSegmenter.createFromOptions(ctx, ImageSegmenter.ImageSegmenterOptions.builder()
                      .setBaseOptions(BaseOptions.builder().setModelAssetBuffer(buf(Models.path(ctx, Models.SELFIE))).build())
                      .setRunningMode(RunningMode.IMAGE).setOutputConfidenceMasks(true).setOutputCategoryMask(false).build())
                  val ms = seg!!.segment(BitmapImageBuilder(bmp).build()).confidenceMasks().get()
                  Array(ms.size) { i ->
                      val m = ms[i]; val fb = ByteBufferExtractor.extract(m).order(ByteOrder.nativeOrder()).asFloatBuffer()
                      val a = FloatArray(fb.remaining()); fb.get(a)
                      Img.resize(a, m.width, m.height, bmp.width, bmp.height)
                  }
              } catch (_: Throwable) { null }

              fun analyze(ctx: Context, full: Bitmap, step: (Int) -> Unit): Analysis {
                  val sc = minOf(1f, 1536f / maxOf(full.width, full.height))
                  val w = (full.width * sc).roundToInt(); val h = (full.height * sc).roundToInt()
                  val bmp = Bitmap.createScaledBitmap(full, w, h, true)
                  step(1)
                  if (flm == null) flm = FaceLandmarker.createFromOptions(ctx, FaceLandmarker.FaceLandmarkerOptions.builder()
                      .setBaseOptions(BaseOptions.builder().setModelAssetBuffer(buf(Models.path(ctx, Models.FACE))).build())
                      .setRunningMode(RunningMode.IMAGE).setNumFaces(8)
                      .setMinFaceDetectionConfidence(0.3f).setMinFacePresenceConfidence(0.3f).build())
                  val faces = detectFaces(bmp)
                  step(2)
                  if (plm == null) plm = PoseLandmarker.createFromOptions(ctx, PoseLandmarker.PoseLandmarkerOptions.builder()
                      .setBaseOptions(BaseOptions.builder().setModelAssetBuffer(buf(Models.path(ctx, Models.POSE))).build())
                      .setRunningMode(RunningMode.IMAGE).setNumPoses(1).setMinPoseDetectionConfidence(0.3f).setMinPosePresenceConfidence(0.3f).build())
                  val pr = plm!!.detect(BitmapImageBuilder(bmp).build()).landmarks()
                  val pose = pr.firstOrNull()?.let { l -> FloatArray(l.size * 2).also { a -> for (i in l.indices) { a[i * 2] = l[i].x() * w; a[i * 2 + 1] = l[i].y() * h } } }
                  step(3)
                  val acc = HashMap<Int, FloatArray>(); for (c in NEED) acc[c] = FloatArray(w * h)
                  val cov = FloatArray(w * h)
                  if (faces.isNotEmpty()) {
                      if (parse == null) parse = env.createSession(Models.path(ctx, Models.PARSE).path, Acc.opts(5))
                      for (f in faces) parseFace(bmp, f, w, h, acc, cov, parse!!)
                  }
                  step(4)
                  val sf = wholeFrame(ctx, bmp)
                  step(5)
                  val maps = HashMap<Int, ByteArray>()
                  fun pack(a: FloatArray) = ByteArray(a.size) { (a[it].coerceIn(0f, 1f) * 255f + 0.5f).toInt().toByte() }
                  for ((c, a) in acc) {
                      val sv: FloatArray? = if (sf != null && sf.size >= 5) when (c) { 17 -> sf[1]; 1 -> sf[3]; 16 -> sf[4]; else -> null } else null
                      if (sv != null) { val m = FloatArray(a.size) { cov[it] * a[it] + (1f - cov[it]) * sv[it] }; maps[c] = pack(m) } else maps[c] = pack(a)
                  }
                  if (sf != null && sf.size >= 5) maps[100] = pack(sf[2])
                  return Analysis(w, h, faces, pose, maps)
              }

              private fun parseFace(bmp: Bitmap, f: FloatArray, w: Int, h: Int, acc: Map<Int, FloatArray>, cov: FloatArray, sess: OrtSession) {
                  var x0 = 1e9f; var y0 = 1e9f; var x1 = -1e9f; var y1 = -1e9f
                  for (i in OVAL) { x0 = minOf(x0, f[i * 2]); x1 = maxOf(x1, f[i * 2]); y0 = minOf(y0, f[i * 2 + 1]); y1 = maxOf(y1, f[i * 2 + 1]) }
                  val cx = (x0 + x1) / 2; val cy = (y0 + y1) / 2
                  val th = atan2(f[473 * 2 + 1] - f[468 * 2 + 1], f[473 * 2] - f[468 * 2])
                  val side = maxOf(x1 - x0, y1 - y0) * 2.3f; val k = 512f / side; val c = cos(th); val s = sin(th)
                  val crop = Bitmap.createBitmap(512, 512, Bitmap.Config.ARGB_8888)
                  val m = Matrix(); m.postTranslate(-cx, -cy); m.postRotate(Math.toDegrees((-th).toDouble()).toFloat()); m.postScale(k, k); m.postTranslate(256f, 256f)
                  Canvas(crop).drawBitmap(bmp, m, Paint(Paint.FILTER_BITMAP_FLAG))
                  val px = IntArray(512 * 512); crop.getPixels(px, 0, 512, 0, 0, 512, 512)
                  val hw = 512 * 512
                  fun run(flip: Boolean): Array<FloatArray> {
                      val fb = ByteBuffer.allocateDirect(3 * hw * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                      for (ch in 0..2) for (y in 0 until 512) for (x in 0 until 512) {
                          val p = px[y * 512 + (if (flip) 511 - x else x)]
                          fb.put((((p shr (16 - 8 * ch)) and 255) / 255f - MEAN[ch]) / STD[ch])
                      }
                      fb.rewind()
                      val t = OnnxTensor.createTensor(env, fb, longArrayOf(1, 3, 512, 512))
                      val lg = FloatArray(19 * hw)
                      try { sess.run(mapOf(sess.inputNames.first() to t)).use { r -> (r.first().value as OnnxTensor).floatBuffer.get(lg) } } finally { t.close() }
                      val out = Array(NEED.size) { FloatArray(hw) }
                      Img.par(512) { y ->
                          for (x in 0 until 512) {
                              val i = y * 512 + x
                              var mx = -1e9f; for (cl in 0 until 19) mx = maxOf(mx, lg[cl * hw + i])
                              var sum = 0f; for (cl in 0 until 19) sum += exp(lg[cl * hw + i] - mx)
                              for (j in NEED.indices) out[j][i] = exp(lg[NEED[j] * hw + i] - mx) / sum
                          }
                      }
                      return out
                  }
                  val a = run(false); val b = run(true)
                  val P = Array(NEED.size) { j ->
                      val sj = NEED.indexOf(SWAP[NEED[j]] ?: NEED[j])
                      FloatArray(hw) { i -> val y = i / 512; val x = i % 512; 0.5f * (a[j][i] + b[sj][y * 512 + (511 - x)]) }
                  }
                  Img.par(h) { y ->
                      for (x in 0 until w) {
                          val dx = x - cx; val dy = y - cy
                          val u = 256f + k * (c * dx + s * dy); val v = 256f + k * (-s * dx + c * dy)
                          if (u < 0f || v < 0f || u >= 511f || v >= 511f) continue
                          val ui = u.toInt(); val vi = v.toInt(); val fu = u - ui; val fv = v - vi; val di = y * w + x
                          val cw = Img.smooth(minOf(minOf(u, v), minOf(511f - u, 511f - v)), 18f, 80f)
                          if (cw > cov[di]) cov[di] = cw
                          for (j in NEED.indices) {
                              val q = P[j]; val i0 = vi * 512 + ui
                              val value = (q[i0] * (1 - fu) + q[i0 + 1] * fu) * (1 - fv) + (q[i0 + 512] * (1 - fu) + q[i0 + 513] * fu) * fv
                              val dst = acc[NEED[j]]!!
                              if (value > dst[di]) dst[di] = value
                          }
                      }
                  }
              }
          }

          object DepthNet {
              private val env = OrtEnvironment.getEnvironment()
              private val sess = HashMap<Int, OrtSession>()
              private val MEAN = floatArrayOf(0.485f, 0.456f, 0.406f); private val STD = floatArrayOf(0.229f, 0.224f, 0.225f)

              /** Depth Anything V2. Output is normalised so that near = 1, far = 0. Optional flip test-time augmentation. */
              fun run(ctx: Context, which: Int, src: Bitmap, side: Int, tta: Boolean): DepthData {
                  val s = sess.getOrPut(which) { env.createSession(Models.path(ctx, Models.DEPTH[which]).path, Acc.opts(5)) }
                  val sc = side.toFloat() / maxOf(src.width, src.height)
                  val w = maxOf(14, (src.width * sc / 14f).roundToInt() * 14); val h = maxOf(14, (src.height * sc / 14f).roundToInt() * 14)
                  val px = IntArray(w * h); Bitmap.createScaledBitmap(src, w, h, true).getPixels(px, 0, w, 0, 0, w, h)
                  fun pass(flip: Boolean): FloatArray {
                      val fb = ByteBuffer.allocateDirect(3 * w * h * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                      for (ch in 0..2) for (y in 0 until h) for (x in 0 until w) {
                          val p = px[y * w + (if (flip) w - 1 - x else x)]
                          fb.put((((p shr (16 - 8 * ch)) and 255) / 255f - MEAN[ch]) / STD[ch])
                      }
                      fb.rewind()
                      val t = OnnxTensor.createTensor(env, fb, longArrayOf(1, 3, h.toLong(), w.toLong()))
                      val out = FloatArray(w * h)
                      try { s.run(mapOf(s.inputNames.first() to t)).use { r -> (r.first().value as OnnxTensor).floatBuffer.get(out) } } finally { t.close() }
                      if (flip) for (y in 0 until h) for (x in 0 until w / 2) { val i = y * w + x; val j = y * w + (w - 1 - x); val tmp = out[i]; out[i] = out[j]; out[j] = tmp }
                      return out
                  }
                  val a = pass(false)
                  val d = if (tta) { val b = pass(true); FloatArray(a.size) { (a[it] + b[it]) * 0.5f } } else a
                  val sorted = d.copyOf().also { it.sort() }
                  val lo = sorted[(sorted.size * 0.01f).toInt()]; val hi = sorted[(sorted.size * 0.99f).toInt()]
                  return DepthData(FloatArray(d.size) { ((d[it] - lo) / (hi - lo + 1e-6f)).coerceIn(0f, 1f) }, w, h)
              }
          }
