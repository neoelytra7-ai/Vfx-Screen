              Fine(vm) {
                  SL(vm, "Height", "low", "overhead", l.elev, 0f..1f) { l.elev = it }
                  SL(vm, "Softness", "hard", "soft", l.soft, 0f..1f) { l.soft = it }
                  SL(vm, "Warmth", "cool", "warm", l.warm, -1f..1f) { l.warm = it }
                  SL(vm, "Relief", "flat", "sculpted", l.bump, 0.3f..2.5f) { l.bump = it }
                  SL(vm, "Darken surroundings", "", "", l.ambient, 0f..1f) { l.ambient = it }
              }
          }

