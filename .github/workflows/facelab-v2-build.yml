          cat > $P/Render.kt <<'EOF'
          package com.example.facelab

          import android.graphics.*
          import kotlin.math.*

          class Canceled : RuntimeException()

          class FaceEdit {
              val p = HashMap<String, Float>(); var mk: Makeup? = null; var mkK = 1f
              var mkOn = HashSet<String>(listOf("Lips", "Shadow", "Liner", "Lashes", "Brows", "Blush", "Sculpt", "Lens", "Skin"))
              val partK = HashMap<String, Float>(); val col = HashMap<String, Int>()
              fun copy() = FaceEdit().also { it.p.putAll(p); it.mk = mk; it.mkK = mkK; it.mkOn = HashSet(mkOn); it.partK.putAll(partK); it.col.putAll(col) }
              fun key() = "${mk?.name}|$mkK|${mkOn.sorted()}|${partK.toSortedMap()}|${col.toSortedMap()}"
          }

          class EditState {
              val faces = ArrayList<FaceEdit>(); val body = HashMap<String, Float>()
              var skin = SkinP(); var hair = HairP(); var bokeh = BokehP(); var adj = AdjP(); var light = LightP(); var detail = DetailP(); var par = ParP(); var range = 1f
              fun copy() = EditState().also { s -> faces.forEach { s.faces.add(it.copy()) }; s.body.putAll(body); s.skin = skin.copy(); s.hair = hair.copy(); s.bokeh = bokeh.copy()
                  s.adj = adj.copy(); s.light = light.copy(); s.detail = detail.copy(); s.par = par.copy(); s.range = range }
              /** Everything that needs a full re-render. Warp sliders are excluded on purpose: those run live on the GPU. */
              fun bakeKey(): Int = (skin.key() + "#" + hair.key() + "#" + bokeh.key() + "#" + adj.key() + "#" + light.key() + "#" + detail.key() + "#" + faces.joinToString("/") { it.key() }).hashCode()
          }

          class MaskCache {
              var w = 0; var h = 0; val m = HashMap<String, FloatArray>()
              fun reset(nw: Int, nh: Int) { if (nw != w || nh != h) { m.clear(); w = nw; h = nh } }
          }

          object Render {
              private fun union(an: Analysis, cls: IntArray, w: Int, h: Int, gray: FloatArray, r: Int): FloatArray {
                  var acc: FloatArray? = null
                  for (c in cls) {
                      val b = an.maps[c] ?: continue
                      val f = FloatArray(an.w * an.h) { (b[it].toInt() and 255) / 255f }
                      acc = if (acc == null) f else { val a0 = acc; FloatArray(f.size) { maxOf(a0[it], f[it]) } }
                  }
                  if (acc == null) return FloatArray(w * h)
                  return Img.guided(Img.resize(acc, an.w, an.h, w, h), gray, w, h, r, 0.001f)
              }

              fun mask(an: Analysis, name: String, w: Int, h: Int, gray: FloatArray, cache: MaskCache): FloatArray = cache.m.getOrPut(name) {
                  val r = maxOf(2, (0.004f * maxOf(w, h)).toInt())
                  when (name) {
                      "skin" -> { val su = union(an, intArrayOf(1, 10, 14, 7, 8), w, h, gray, r); val ex = union(an, intArrayOf(2, 3, 4, 5, 6, 11, 12, 13), w, h, gray, r)
                          FloatArray(su.size) { maxOf(0f, su[it] - ex[it]) } }
                      "hair" -> union(an, intArrayOf(17), w, h, gray, r)
                      "body" -> { val b = union(an, intArrayOf(100), w, h, gray, r); val s = mask(an, "skin", w, h, gray, cache); FloatArray(b.size) { maxOf(0f, b[it] - s[it] * 0.5f) } }
                      else -> { val a = mask(an, "skin", w, h, gray, cache); val b = mask(an, "hair", w, h, gray, cache); val c = union(an, intArrayOf(16, 100), w, h, gray, r)
                          FloatArray(a.size) { maxOf(a[it], b[it], c[it]) } }
                  }
              }

              fun depthRefined(d: DepthData, w: Int, h: Int, gray: FloatArray, cache: MaskCache): FloatArray = cache.m.getOrPut("depth") {
                  Img.guided(Img.resize(d.d, d.w, d.h, w, h), gray, w, h, maxOf(4, (0.006f * maxOf(w, h)).toInt()), 0.0002f)
              }

              /** Every effect except the shape warp. The warp is applied live on the GPU (preview) or by [run] (export). */
              fun bake(an: Analysis, base: Bitmap, st: EditState, depth: DepthData?, cache: MaskCache, cancel: () -> Boolean): Bitmap {
                  fun chk() { if (cancel()) throw Canceled() }
                  val w = base.width; val h = base.height; cache.reset(w, h)
                  val k = w.toFloat() / an.w
                  val work = base.copy(Bitmap.Config.ARGB_8888, true)
                  val px = IntArray(w * h); work.getPixels(px, 0, w, 0, 0, w, h)
                  val gray = Img.gray(px); val hasFace = an.faces.isNotEmpty()
                  fun fk(i: Int) = FloatArray(an.faces[i].size) { an.faces[i][it] * k }
                  // ---- skin (user settings merged with the first face's makeup base tone)
                  val sp = st.skin.copy()
                  val fe0 = st.faces.getOrNull(0)
                  val mk0 = if (fe0 != null) fe0.mk?.tuned(fe0.mkOn, fe0.partK, fe0.col) else null
                  if (mk0 != null) { if (sp.tone == 0 && mk0.skinTone != 0) { sp.tone = mk0.skinTone; sp.amt = mk0.skinAmt }; sp.smooth = maxOf(sp.smooth, mk0.smooth); sp.glow = maxOf(sp.glow, mk0.glow) }
                  if (hasFace && sp.active()) {
                      val sm = mask(an, "skin", w, h, gray, cache); chk()
                      val body = if (sp.body && (sp.tone != 0 || sp.sat != 0f || sp.warmth != 0f || sp.lighten != 0f)) {
                          if (an.maps.containsKey(100)) mask(an, "body", w, h, gray, cache) else an.pose?.let { Skin.bodyMask(px, w, h, it, sm, k) }
                      } else null
                      chk(); Skin.apply(px, w, h, sm, sp, body)
                  }
                  chk()
                  // ---- hair
                  val hp = st.hair
                  if (hasFace && hp.c1 != 0) {
                      val f = fk(0); val u = hypot(f[473 * 2] - f[468 * 2], f[473 * 2 + 1] - f[468 * 2 + 1])
                      Hair.apply(px, w, h, mask(an, "hair", w, h, gray, cache), hp, (f[468 * 2] + f[473 * 2]) / 2, (f[468 * 2 + 1] + f[473 * 2 + 1]) / 2, u, atan2(f[473 * 2 + 1] - f[468 * 2 + 1], f[473 * 2] - f[468 * 2]))
                  }
                  chk()
                  // ---- teeth, eyes, under-eye
                  if (hasFace && st.detail.active()) for (i in an.faces.indices) Detail.apply(px, w, h, fk(i), st.detail)
                  chk()
                  // ---- relight from depth normals
                  var dRef: FloatArray? = null
                  if (depth != null && (st.light.on || st.bokeh.on)) dRef = depthRefined(depth, w, h, gray, cache)
                  if (st.light.on && dRef != null) Light.apply(px, w, h, dRef, if (hasFace) mask(an, "subj", w, h, gray, cache) else null, st.light)
                  chk()
                  // ---- makeup
                  work.setPixels(px, 0, w, 0, 0, w, h)
                  for (i in an.faces.indices) {
                      val fe = st.faces.getOrNull(i) ?: continue; val m0 = fe.mk ?: continue
                      Mk.render(work, fk(i), m0.tuned(fe.mkOn, fe.partK, fe.col), fe.mkK, i + 1)
                  }
                  work.getPixels(px, 0, w, 0, 0, w, h)
                  chk()
                  // ---- bokeh
                  val bp = st.bokeh
                  if (bp.on && depth != null && dRef != null) {
                      val d = dRef
                      val sx = (bp.fx * w).toInt().coerceIn(3, w - 4); val sy = (bp.fy * h).toInt().coerceIn(3, h - 4)
                      var df = 0f; for (dy in -3..3) for (dx in -3..3) df += d[(sy + dy) * w + sx + dx]; df /= 49f
                      if (bp.showDepth) {
                          val o = IntArray(w * h) { val v = d[it]; val r = (255 * (1.5f - abs(4f * v - 3f)).coerceIn(0f, 1f)).toInt(); val g = (255 * (1.5f - abs(4f * v - 2f)).coerceIn(0f, 1f)).toInt(); val b = (255 * (1.5f - abs(4f * v - 1f)).coerceIn(0f, 1f)).toInt(); (0xFF shl 24) or (r shl 16) or (g shl 8) or b }
                          val bm = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888); bm.setPixels(o, 0, w, 0, 0, w, h); return bm
                      }
                      val subj = if (hasFace && bp.protect > 0f) mask(an, "subj", w, h, gray, cache) else null
                      val dd = FloatArray(w * h) { if (subj != null) d[it] + (df - d[it]) * subj[it] * bp.protect else d[it] }
                      val maxR = bp.aperture * 0.045f * maxOf(w, h)
                      val cocF = Bokeh.coc(dd, df, bp, maxR)
                      if (maxOf(w, h) <= 2200) { val o = Bokeh.render(px, w, h, dd, cocF, bp); System.arraycopy(o, 0, px, 0, px.size) }
                      else {
                          val sc = 2200f / maxOf(w, h); val sw = (w * sc).toInt(); val sh = (h * sc).toInt()
                          work.setPixels(px, 0, w, 0, 0, w, h)
                          val small = Bitmap.createScaledBitmap(work, sw, sh, true); val spx = IntArray(sw * sh); small.getPixels(spx, 0, sw, 0, 0, sw, sh)
                          val ds = Img.resize(dd, w, h, sw, sh); val blurred = Bokeh.render(spx, sw, sh, ds, Bokeh.coc(ds, df, bp, maxR * sc), bp)
                          small.setPixels(blurred, 0, sw, 0, 0, sw, sh)
                          val up = Bitmap.createScaledBitmap(small, w, h, true); val upx = IntArray(w * h); up.getPixels(upx, 0, w, 0, 0, w, h)
                          for (i in px.indices) {
                              val t = Img.smooth(cocF[i], 0.4f, 1.6f); val a = px[i]; val b = upx[i]
