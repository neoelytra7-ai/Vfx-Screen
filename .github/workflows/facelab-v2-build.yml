          /** Skin: frequency-separation retouch + tone transfer in OKLab, so shading and pores survive. Works only inside the skin bounding box. */
          object Skin {
              fun apply(px: IntArray, w: Int, h: Int, mask: FloatArray, sp: SkinP, body: FloatArray?) {
