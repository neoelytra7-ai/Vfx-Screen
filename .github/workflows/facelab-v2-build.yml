              if (vm.an?.faces.isNullOrEmpty()) { Text("Detail tools need a detected face.", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp); return }
              SL(vm, "Teeth whitening", "", "", d.teeth, 0f..1f) { d.teeth = it }
              SL(vm, "Eye whites", "", "", d.sclera, 0f..1f) { d.sclera = it }
              SL(vm, "Iris pop", "", "", d.iris, 0f..1f) { d.iris = it }
              SL(vm, "Under-eye lift", "", "", d.underEye, 0f..1f) { d.underEye = it }
          }

