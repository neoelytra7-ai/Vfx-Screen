# .github/workflows/apk.yml  ·  NerdFM — build APK, download dari tab Actions > run > Artifacts
# Repo kosong -> source app dibuat otomatis & di-commit balik. Edit source di repo untuk iterasi berikutnya.
# Versi: 1.0.<nomor run>. Tanda tangan: secrets KS_B64 + KS_PASS (opsional; tanpa itu pakai kunci cache).
name: NerdFM-APK
on:
  push: {branches: [main], paths-ignore: ['**.md', '.nerdfm']}
  workflow_dispatch:
    inputs:
      rescaffold: {type: boolean, default: false, description: 'overwrite sources with this YAML scaffold'}
concurrency: {group: 'apk-${{ github.ref }}', cancel-in-progress: true}
permissions: {contents: write}
env:
  SV: '4'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KS: ${{ github.workspace }}/ks.jks
      KS_PASS: ${{ secrets.KS_PASS || 'nerdfm-ci-key' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/cache@v4
        with: {path: ks.jks, key: 'ks-${{ github.repository }}-v1'}

      - name: Keystore
        env: {B64: '${{ secrets.KS_B64 }}'}
        run: |
          [ -s ks.jks ] && exit 0
          if [ -n "$B64" ]; then echo "$B64" | base64 -d > ks.jks
          else keytool -genkeypair -keystore ks.jks -alias k -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=NerdFM"; fi

      - name: Version
        id: v
        run: echo "n=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap
        id: b
        env: {FORCE: '${{ inputs.rescaffold }}'}
        run: |
          [ "$(cat .nerdfm 2>/dev/null)" = "$SV" ] && [ "$FORCE" != true ] && exit 0
          if [ -f settings.gradle.kts ] && [ ! -f .nerdfm ] && ! grep -q NerdFM settings.gradle.kts; then echo "foreign project: skip scaffold"; exit 0; fi
          echo s=1 >> "$GITHUB_OUTPUT"
          cat > .gitignore <<'NFM_EOF'
          build/
          .gradle/
          *.jks
          *.apk
          local.properties
          .idea/
          NFM_EOF
          cat > build.gradle.kts <<'NFM_EOF'
          plugins{
           id("com.android.application") version "8.5.2" apply false
           id("org.jetbrains.kotlin.android") version "2.0.20" apply false
           id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          NFM_EOF
          cat > gradle.properties <<'NFM_EOF'
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.incremental=true
          NFM_EOF
          cat > settings.gradle.kts <<'NFM_EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name="NerdFM"
          include(":app")
          NFM_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'NFM_EOF'
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
          plugins{id("com.android.application");id("org.jetbrains.kotlin.android");id("org.jetbrains.kotlin.plugin.compose")}
          android{
           namespace="dev.nerd.fm";compileSdk=34
           defaultConfig{applicationId="dev.nerd.fm";minSdk=24;targetSdk=34
            versionCode=(findProperty("vCode") as String?)?.toInt()?:1
            versionName=(findProperty("vName") as String?)?:"0.0.1"
            resourceConfigurations+=listOf("en")}
           signingConfigs{create("r"){storeFile=file(System.getenv("KS")?:"ks.jks");storePassword=System.getenv("KS_PASS");keyAlias="k";keyPassword=System.getenv("KS_PASS")}}
           buildTypes{release{isMinifyEnabled=true;isShrinkResources=true;signingConfig=signingConfigs["r"]
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"),"proguard-rules.pro")}}
           buildFeatures{compose=true}
           lint{checkReleaseBuilds=false;abortOnError=false}
           packaging{resources.excludes+=listOf("/META-INF/{AL2.0,LGPL2.1}","/META-INF/*.version","DebugProbesKt.bin","kotlin-tooling-metadata.json")}
          }
          kotlin{jvmToolchain(17)}
          tasks.withType<KotlinCompile>().configureEach{compilerOptions.freeCompilerArgs.addAll("-Xno-param-assertions","-Xno-call-assertions","-Xno-receiver-assertions")}
          dependencies{
           implementation(platform("androidx.compose:compose-bom:2024.09.00"))
           implementation("androidx.compose.material3:material3")
           implementation("androidx.activity:activity-compose:1.9.2")
           implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
           implementation("androidx.profileinstaller:profileinstaller:1.3.1")
          }
          NFM_EOF
          mkdir -p app
          cat > app/proguard-rules.pro <<'NFM_EOF'
          -assumenosideeffects class android.util.Log { *; }
          -repackageclasses ''
          -allowaccessmodification
          NFM_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'NFM_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
           <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
           <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
           <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
           <application android:label="NerdFM" android:icon="@drawable/ic" android:allowBackup="false" android:requestLegacyExternalStorage="true" android:theme="@android:style/Theme.Material.NoActionBar">
            <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
            <provider android:name="androidx.core.content.FileProvider" android:authorities="dev.nerd.fm.fp" android:exported="false" android:grantUriPermissions="true">
             <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/paths"/>
            </provider>
           </application>
          </manifest>
          NFM_EOF
          mkdir -p app/src/main/java/dev/nerd/fm
          cat > app/src/main/java/dev/nerd/fm/Cfg.kt <<'NFM_EOF'
          package dev.nerd.fm

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Typeface
          import androidx.compose.runtime.*
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontFamily
          import kotlin.math.sqrt
          import kotlin.reflect.KProperty

          class Pal(val name: String, val bg: Color, val fg: Color, val dim: Color, val hue: Float, val sat: Float, val light: Boolean = false)

          object Th {
            val pals = listOf(
              Pal("MOCHI", Color(0xFF1C1423), Color(0xFFFFEEF6), Color(0xFFB59AB0), 335f, .45f),
              Pal("AMOLED", Color.Black, Color.White, Color(0xFF9A9A9A), 165f, 1f),
              Pal("MINT", Color(0xFF0E1F1C), Color(0xFFEFFFFA), Color(0xFF8FB5AC), 160f, .5f),
              Pal("PEACH", Color(0xFF231815), Color(0xFFFFF1E8), Color(0xFFBFA092), 20f, .5f),
              Pal("LAVENDER", Color(0xFF16132A), Color(0xFFF2EEFF), Color(0xFFA39BC7), 260f, .45f),
              Pal("SAKURA", Color(0xFFFFF4F8), Color(0xFF4A3040), Color(0xFF9C7F8F), 335f, .55f, true),
              Pal("CREAM", Color(0xFFFFF9EC), Color(0xFF45392C), Color(0xFF9A8B78), 28f, .6f, true)
            )
            var pal by mutableStateOf(pals[0])
            var cap by mutableIntStateOf(2)
            val fg: Color get() = pal.fg
            val dim: Color get() = pal.dim
            val bg: Color get() = pal.bg
          }

          class Pv<T : Any>(private val sp: SharedPreferences, private val k: String, private val d: T) {
            private var s by mutableStateOf(read())
            @Suppress("UNCHECKED_CAST")
            private fun read(): T = when (d) {
              is Float -> sp.getFloat(k, d) as T
              is Int -> sp.getInt(k, d) as T
              is Long -> sp.getLong(k, d) as T
              is Boolean -> sp.getBoolean(k, d) as T
              is String -> (sp.getString(k, d) ?: d) as T
              else -> d
            }
            fun put(v: T) {
              s = v
              val e = sp.edit()
              when (v) {
                is Float -> e.putFloat(k, v)
                is Int -> e.putInt(k, v)
                is Long -> e.putLong(k, v)
                is Boolean -> e.putBoolean(k, v)
                is String -> e.putString(k, v)
              }
              e.apply()
            }
            fun reset() = put(d)
            operator fun getValue(t: Any?, p: KProperty<*>): T = s
            operator fun setValue(t: Any?, p: KProperty<*>, v: T) = put(v)
          }

          private val fRound = FontFamily(Typeface.create("sans-serif-rounded", Typeface.NORMAL))
          private val fCasual = FontFamily(Typeface.create("casual", Typeface.NORMAL))

          class Cfg(ctx: Context) {
            private val sp = ctx.getSharedPreferences("cfg", 0)
            private val all = ArrayList<Pv<*>>()
            private fun <T : Any> pv(k: String, d: T): Pv<T> = Pv(sp, k, d).also { all.add(it) }

            var hue by pv("hue", 335f)
            var sat by pv("sat", .45f)
            var font by pv("font", 0)
            var fs by pv("fs", 1f)
            var pad by pv("pad", 7f)
            var rad by pv("rad", 16f)
            var anim by pv("anim", 2)
            var amp by pv("amp", 4f)
            var spd by pv("spd", 2.4f)
            var stag by pv("stag", 16f)
            var hidden by pv("hidden", false)
            var sort by pv("sort", 0)
            var desc by pv("desc", false)
            var cSize by pv("cSize", true)
            var cDate by pv("cDate", true)
            var cPerm by pv("cPerm", false)
            var dual by pv("dual", true)
            var grid by pv("grid", false)
            var haptic by pv("haptic", true)
            var sparkle by pv("sparkle", true)
            var auto by pv("auto", true)
            var preset by Pv(sp, "preset", 0)
            var bm by Pv(sp, "bm", "")
            var xp by Pv(sp, "xp", 0)
            var cleaned by Pv(sp, "cleaned", 0L)
            var streak by Pv(sp, "streak", 0)
            var lastDay by Pv(sp, "lastDay", 0)

            val fx: Int get() = minOf(anim, Th.cap)
            private val lt: Boolean get() = Th.pal.light
            val ac: Color get() = Color.hsv(hue.coerceIn(0f, 360f), sat.coerceIn(0f, 1f).let { if (lt) maxOf(it, .5f) else it }, if (lt) .86f else 1f)
            val ac2: Color get() = Color.hsv((hue + 50f) % 360f, (sat.coerceIn(0f, 1f) * .9f).let { if (lt) maxOf(it, .45f) else it }, if (lt) .88f else 1f)
            val bgc: Color get() = Th.bg
            val ff: FontFamily get() = when (font) { 0 -> fRound; 1 -> fCasual; 2 -> FontFamily.SansSerif; 3 -> FontFamily.Monospace; else -> FontFamily.Serif }
            val level: Int get() = sqrt(xp / 12.0).toInt() + 1

            fun applyPreset(i: Int) { preset = i; Th.pal = Th.pals[i]; hue = Th.pal.hue; sat = Th.pal.sat }
            fun addXp(n: Int) { if (n > 0) xp += n }
            fun reset() { all.forEach { it.reset() }; applyPreset(0) }

            init {
              Th.pal = Th.pals[preset.coerceIn(0, Th.pals.size - 1)]
              val today = (System.currentTimeMillis() / 86400000L).toInt()
              if (lastDay != today) { streak = if (lastDay == today - 1) streak + 1 else 1; lastDay = today }
            }
          }
          NFM_EOF
          mkdir -p app/src/main/java/dev/nerd/fm
          cat > app/src/main/java/dev/nerd/fm/Fx.kt <<'NFM_EOF'
          package dev.nerd.fm

          import android.os.Build
          import androidx.compose.runtime.Immutable
          import android.os.Environment
          import android.os.StatFs
          import android.webkit.MimeTypeMap
          import kotlinx.coroutines.currentCoroutineContext
          import kotlinx.coroutines.ensureActive
          import java.io.*
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.zip.*
          import kotlin.math.min

          @Immutable class E(val f: File) {
            val dir = f.isDirectory
            val n: String = f.name
            val sz = if (dir) 0L else f.length()
            val mt = f.lastModified()
            val ex = if (dir) "" else n.substringAfterLast('.', "").lowercase()
            val pm = (if (f.canRead()) "r" else "-") + (if (f.canWrite()) "w" else "-") + (if (f.canExecute()) "x" else "-")
          }

          class Q(raw: String, rx: Boolean, private val cs: Boolean) {
            private val inc = ArrayList<(String) -> Boolean>()
            private val exc = ArrayList<(String) -> Boolean>()
            var minS = 0L; var maxS = Long.MAX_VALUE
            var newer = Long.MAX_VALUE; var older = 0L
            val exts = HashSet<String>()
            var type = ""
            var content: String? = null
            var depth = 64
            var onlyD = false; var onlyF = false; var bad = false

            private fun mk(b: String, rx: Boolean): (String) -> Boolean {
              val opt = if (cs) emptySet() else setOf(RegexOption.IGNORE_CASE)
              if (rx) { val r = Regex(b, opt); return { r.containsMatchIn(it) } }
              if (b.contains('*') || b.contains('?')) { val r = Regex(Fx.glob(b), opt); return { r.matches(it) } }
              return { it.contains(b, !cs) }
            }

            init {
              val num = Regex("^(size|age)([<>])(\\d+(?:\\.\\d+)?)([a-z]*)$")
              for (t in raw.trim().split(Regex("\\s+"))) {
                if (t.isEmpty()) continue
                val m = num.find(t)
                if (m != null) {
                  val (k, o, nv, u) = m.destructured
                  val v = nv.toDouble()
                  if (k == "size") {
                    val mul = when (u) { "k", "kb" -> 1024.0; "m", "mb" -> 1048576.0; "g", "gb" -> 1073741824.0; else -> 1.0 }
                    val b = (v * mul).toLong()
                    if (o == ">") minS = b else maxS = b
                  } else {
                    val mul = when (u) { "min" -> 60e3; "h" -> 3.6e6; "w" -> 6.048e8; "mo" -> 2.592e9; "y" -> 3.1536e10; else -> 8.64e7 }
                    val ms = (v * mul).toLong()
                    if (o == "<") newer = ms else older = ms
                  }
                  continue
                }
                when {
                  t.startsWith("ext:") -> exts.addAll(t.substring(4).lowercase().split(',').map { it.trim('.') })
                  t.startsWith("type:") -> type = t.substring(5).lowercase()
                  t.startsWith("c:") -> content = t.substring(2)
                  t.startsWith("depth:") -> depth = t.substring(6).toIntOrNull() ?: 64
                  t == "dir" -> onlyD = true
                  t == "file" -> onlyF = true
                  else -> {
                    val neg = t.length > 1 && t[0] == '-'
                    val b = if (neg) t.substring(1) else t
                    val fn = try { mk(b, rx) } catch (e: Exception) { bad = true; null }
                    if (fn != null) (if (neg) exc else inc).add(fn)
                  }
                }
              }
            }

            fun ok(f: File, d: Boolean, now: Long): Boolean {
              if (onlyD && !d) return false
              if (onlyF && d) return false
              val n = f.name
              for (p in inc) if (!p(n)) return false
              for (p in exc) if (p(n)) return false
              if (exts.isNotEmpty() || type.isNotEmpty()) {
                if (d) return false
                val x = f.extension.lowercase()
                if (exts.isNotEmpty() && x !in exts) return false
                if (type.isNotEmpty() && x !in (Fx.TYPES[type] ?: emptySet())) return false
              }
              if (minS > 0 || maxS != Long.MAX_VALUE) { if (d) return false; val s = f.length(); if (s < minS || s > maxS) return false }
              if (newer != Long.MAX_VALUE || older > 0) { val a = now - f.lastModified(); if (a > newer || a < older) return false }
              val c = content
              if (c != null) { if (d || f.length() > 4_000_000) return false; if (!Fx.grep(f, c, cs)) return false }
              return true
            }
          }

          object Fx {
            val IMG = setOf("jpg", "jpeg", "png", "gif", "webp", "bmp", "heic", "avif")
            val VID = setOf("mp4", "mkv", "webm", "avi", "mov", "3gp", "flv")
            val AUD = setOf("mp3", "flac", "wav", "ogg", "m4a", "aac", "opus", "wma")
            val DOC = setOf("pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "txt", "md", "odt", "epub", "csv")
            val ARC = setOf("zip", "rar", "7z", "tar", "gz", "bz2", "xz", "tgz", "jar", "cbz")
            val CODE = setOf("kt", "java", "py", "js", "ts", "c", "cpp", "h", "rs", "go", "sh", "json", "xml", "yml", "yaml", "html", "css", "gradle", "kts", "toml", "sql")
            val TXT = CODE + setOf("txt", "md", "csv", "log", "ini", "conf", "cfg", "properties", "gitignore")
            val MEDIA = IMG + VID + AUD
            val TYPES = mapOf("img" to IMG, "vid" to VID, "aud" to AUD, "doc" to DOC, "arc" to ARC, "apk" to setOf("apk", "xapk", "apks"), "code" to CODE)
            private val df = SimpleDateFormat("yy-MM-dd HH:mm", Locale.US)

            fun dt(t: Long): String = df.format(Date(t))
            fun sz(n: Long): String {
              if (n < 1024) return "${n}B"
              var v = n.toDouble(); var i = -1
              while (v >= 1024 && i < 3) { v /= 1024; i++ }
              return String.format(Locale.US, "%.1f%c", v, "KMGT"[i])
            }
            fun kind(e: E): Int = if (e.dir) 0 else when { e.ex in IMG -> 1; e.ex in VID -> 2; e.ex in AUD -> 3; e.ex in ARC -> 4; e.ex == "apk" -> 5; e.ex in CODE -> 6; e.ex in DOC -> 7; else -> 8 }
            fun gl(e: E): String = if (e.dir) "▸" else when (e.ex) {
              in IMG -> "◧"; in VID -> "▶"; in AUD -> "♪"; in ARC -> "▤"; "apk" -> "◆"; in CODE -> "‹›"; in DOC -> "≡"; else -> "·"
            }
            fun glob(g: String): String = buildString {
              for (c in g) when (c) { '*' -> append(".*"); '?' -> append('.'); else -> append(Regex.escape(c.toString())) }
            }
            fun mime(f: File): String = MimeTypeMap.getSingleton().getMimeTypeFromExtension(f.extension.lowercase()) ?: "*/*"
            fun stor(): Pair<Long, Long> { val s = StatFs(Environment.getExternalStorageDirectory().path); return s.totalBytes to s.availableBytes }
            fun sym(f: File): Boolean = Build.VERSION.SDK_INT >= 26 && java.nio.file.Files.isSymbolicLink(f.toPath())

            fun list(d: File, hid: Boolean, sort: Int, desc: Boolean): List<E> {
              val a = d.listFiles() ?: return emptyList()
              val l = ArrayList<E>(a.size)
              for (f in a) if (hid || !f.name.startsWith(".")) l.add(E(f))
              val c: Comparator<E> = when (sort) {
                1 -> compareBy<E> { it.sz }
                2 -> compareBy<E> { it.mt }
                3 -> compareBy<E>({ it.ex }, { it.n.lowercase() })
                else -> compareBy<E> { it.n.lowercase() }
              }
              return l.sortedWith(compareBy<E> { !it.dir }.then(if (desc) c.reversed() else c))
            }

            fun uniq(f: File): File {
              if (!f.exists()) return f
              val b = f.nameWithoutExtension
              val x = if (f.extension.isEmpty()) "" else "." + f.extension
              for (i in 1..9999) { val c = File(f.parentFile, "$b ($i)$x"); if (!c.exists()) return c }
              return File(f.parentFile, "$b-${System.currentTimeMillis()}$x")
            }

            fun cp(s: File, d: File) {
              if (s.isDirectory && d.canonicalPath.startsWith(s.canonicalPath + File.separator)) throw IOException("into itself")
              cp0(s, d)
            }
            private fun cp0(s: File, d: File) {
              if (s.isDirectory) { d.mkdirs(); s.listFiles()?.forEach { cp0(it, File(d, it.name)) } }
              else {
                d.parentFile?.mkdirs()
                BufferedInputStream(FileInputStream(s), 65536).use { i -> BufferedOutputStream(FileOutputStream(d), 65536).use { o -> i.copyTo(o, 65536) } }
                d.setLastModified(s.lastModified())
              }
            }
            fun mv(s: File, d: File) { if (!s.renameTo(d)) { cp(s, d); s.deleteRecursively() } }

            fun du(f: File, depth: Int = 0): Long {
              if (!f.isDirectory) return f.length()
              if (depth > 40) return 0L
              var t = 0L
              f.listFiles()?.forEach { t += du(it, depth + 1) }
              return t
            }

            fun hash(f: File, alg: String, lim: Long): String = try {
              val m = MessageDigest.getInstance(alg)
              var left = lim
              f.inputStream().use { i ->
                val b = ByteArray(65536)
                while (left > 0) { val n = i.read(b, 0, min(b.size.toLong(), left).toInt()); if (n < 0) break; m.update(b, 0, n); left -= n }
              }
              m.digest().joinToString("") { "%02x".format(it) }
            } catch (e: Exception) { "!" + f.path }

            fun grep(f: File, c: String, cs: Boolean): Boolean = try {
              f.inputStream().buffered().use { i ->
                val h = ByteArray(512)
                val n = i.read(h)
                var bin = false
                for (k in 0 until n) if (h[k].toInt() == 0) bin = true
                if (bin) false else f.bufferedReader().useLines { s -> s.any { it.contains(c, !cs) } }
              }
            } catch (e: Exception) { false }

            suspend fun search(root: File, q: Q, hid: Boolean, max: Int, hit: suspend (E) -> Unit, prog: (Int) -> Unit) {
              val st = ArrayList<Pair<File, Int>>(); st.add(root to 0)
              var n = 0; var h = 0
              val now = System.currentTimeMillis()
              while (st.isNotEmpty() && h < max) {
                currentCoroutineContext().ensureActive()
                val (d, lv) = st.removeAt(st.lastIndex)
                val ch = d.listFiles() ?: continue
                for (f in ch) {
                  if (!hid && f.name.startsWith(".")) continue
                  n++; if ((n and 255) == 0) prog(n)
                  val dr = f.isDirectory
                  if (dr && lv < q.depth && !sym(f)) st.add(f to lv + 1)
                  if (q.ok(f, dr, now)) { hit(E(f)); h++; if (h >= max) break }
                }
              }
              prog(n)
            }

            suspend fun dupes(root: File, hid: Boolean, minSz: Long): List<List<File>> {
              val by = HashMap<Long, ArrayList<File>>()
              val st = ArrayList<File>(); st.add(root)
              while (st.isNotEmpty()) {
                currentCoroutineContext().ensureActive()
                val d = st.removeAt(st.lastIndex)
                for (f in d.listFiles() ?: continue) {
                  if (!hid && f.name.startsWith(".")) continue
                  if (f.isDirectory) { if (!sym(f)) st.add(f) }
                  else { val l = f.length(); if (l >= minSz) by.getOrPut(l) { ArrayList() }.add(f) }
                }
              }
              val out = ArrayList<List<File>>()
