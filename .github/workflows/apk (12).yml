                  Bt("CLEAR") { mk = emptySet() }
                  Bt("DEL ${mk.size}", mk.isNotEmpty()) { onDel(g.flatten().filter { it.path in mk }) }
                  T("${g.size} grp · ${Fx.sz(g.sumOf { (it.size - 1) * it[0].length() })} wasted", Th.dim, 10f)
                }
                LazyColumn(Modifier.weight(1f)) {
