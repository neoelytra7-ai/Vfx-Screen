            Node N(Node p, Mesh m, float x, float y, float z) {
              Node n = new Node(p, m, x, y, z); all.add(n);
              int h = ((idx++) * 73856093 ^ 19349663) & 0x7fffffff;
              n.asT = 150 + (h % 700);
              double a = (h % 628) / 100.0, el = ((h / 7) % 200) / 100.0 - 1, rr = Math.sqrt(1 - el * el);
              n.ox = (float) (Math.cos(a) * rr * 55); n.oy = (float) (el * 55); n.oz = (float) (Math.sin(a) * rr * 55);
              return n;
            }
