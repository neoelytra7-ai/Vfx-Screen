                  SensorManager.getRotationMatrixFromVector(rotM, v)
                  val dx = -rotM[2]; val dy = -rotM[5]; val dz = -rotM[8]
                  val now = SystemClock.elapsedRealtime()
                  val dot = (dx * lastDir[0] + dy * lastDir[1] + dz * lastDir[2]).coerceIn(-1f, 1f)
                  val moved = Math.toDegrees(Math.acos(dot.toDouble())).toFloat()
