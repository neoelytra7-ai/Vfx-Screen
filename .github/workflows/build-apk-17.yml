                  val shH = min(px(340), (resources.displayMetrics.heightPixels * .46f).toInt())
                  root.addView(sheet, FrameLayout.LayoutParams(-1, shH, Gravity.BOTTOM))

                  // ---- bottom tool
                  bottom = PixelFrame(this)
                  bottom.fill = 0xEE0A0A0A.toInt()
                  bstack = LinearLayout(this)
                  bstack.orientation = LinearLayout.VERTICAL
                  bstack.setPadding(px(8), px(8), px(8), px(8))

                  // row A: every lens + torch on the right end
                  val rowA = LinearLayout(this); rowA.orientation = LinearLayout.HORIZONTAL; rowA.gravity = Gravity.CENTER_VERTICAL
                  val hs = HorizontalScrollView(this); hs.isHorizontalScrollBarEnabled = false; hs.overScrollMode = View.OVER_SCROLL_NEVER
                  lensRow = LinearLayout(this); lensRow.orientation = LinearLayout.HORIZONTAL
                  hs.addView(lensRow, FrameLayout.LayoutParams(-2, -1))
                  btnTorch = btn("", "torch") { b -> cam.p.torch = !cam.p.torch; b.on = cam.p.torch; cam.refresh(); Hap.click() }
                  rowA.addView(hs, lpL(0, px(34), 1f))
                  rowA.addView(btnTorch, lpL(px(40), px(34)).also { it.leftMargin = px(6) })
                  bstack.addView(rowA, lpL(-1, px(34)))

                  // row B: zoom dial (left) · shutter (centre)
                  val rowB = FrameLayout(this)
                  zoomDial = ZoomDial(this)
                  zoomDial.onDelta = { d -> zoomBy(d) }
                  zoomDial.onTap = { setZoomUi(1f) }
                  rowB.addView(zoomDial, FrameLayout.LayoutParams(-2, -2, Gravity.START or Gravity.CENTER_VERTICAL))
                  shutter = ShutterButton(this)
                  shutter.onTap = { onShutter() }
                  shutter.onSwipeDown = { flipRear() }
                  shutter.onSwipeSide = { toggleSelfie() }
                  rowB.addView(shutter, FrameLayout.LayoutParams(-2, -2, Gravity.CENTER))
                  bstack.addView(rowB, lpL(-1, px(96)))

                  // row C: swipeable modes (last touch = chosen) + last photo at the right end
                  val rowC = LinearLayout(this); rowC.orientation = LinearLayout.HORIZONTAL; rowC.gravity = Gravity.CENTER_VERTICAL
                  modeStrip = ModeStrip(this, listOf("RAW", "SR", "HDR+", "VIDEO", "360"), listOf("raw", "sr", "hdr", "video", "globe"))
                  modeStrip.onSelect = { i -> setMode(i) }
                  thumb = ThumbView(this)
                  thumb.onTap = { openLast() }
                  rowC.addView(modeStrip, lpL(0, px(62), 1f))
                  rowC.addView(thumb, lpL(px(56), px(56)).also { it.leftMargin = px(6) })
                  bstack.addView(rowC, lpL(-1, px(62)))

                  bottom.addView(bstack, FrameLayout.LayoutParams(-1, -2))
                  root.addView(bottom, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))

                  fx = FxLayer(this)
                  root.addView(fx, FrameLayout.LayoutParams(-1, -1))
                  splash = SplashView(this, biome)
                  splash.onDone = { loadThumb() }
                  root.addView(splash, FrameLayout.LayoutParams(-1, -1))
                  setContentView(root)

                  root.setOnApplyWindowInsetsListener { _, ins ->
                      topInset = ins.systemWindowInsetTop; botInset = ins.systemWindowInsetBottom
                      colL.setPadding(0, topInset, 0, 0)
                      bstack.setPadding(px(8), px(8), px(8), px(8) + botInset)
                      fx.topInset = topInset + dp(8)
                      fx.achY = bottom.height.toFloat() + dp(12)
                      ins
                  }
                  sheet.post { sheet.translationY = sheet.height.toFloat() + bottom.height }
                  sheetTick = object : Anim.Tick {
                      override fun tick(dt: Float) {
                          sheetSp.step(dt)
                          val hidden = sheet.height.toFloat() + bottom.height
                          sheet.translationY = (1f - sheetSp.x) * hidden
                          sheet.translationY += -bottom.height.toFloat() * sheetSp.x
                          if (sheetSp.settled) Anim.remove(this)
                      }
                  }
              }

              private var sheetTick: Anim.Tick? = null

              private fun toggleSheet() {
                  sheetOpen = !sheetOpen
                  sheetSp.t = if (sheetOpen) 1f else 0f
                  Sfx.tick(); Hap.tick()
                  sheetTick?.let { Anim.add(it) }
              }

              // ============================================================ presets (left, vertical, scrollable)
              private fun buildPresets(): PixelFrame {
                  val box = PixelFrame(this); box.thick = dp(2); box.fill = 0x77000000
                  val sc = ScrollView(this)
                  sc.isVerticalScrollBarEnabled = false; sc.overScrollMode = View.OVER_SCROLL_NEVER
                  val l = LinearLayout(this); l.orientation = LinearLayout.VERTICAL; l.setPadding(px(5), px(5), px(5), px(5))
                  for (i in 0 until Look.count()) {
                      val t = PresetTile(this, i, Look.name(i))
                      t.onPick = { idx -> pickLook(idx, true) }
                      tiles.add(t)
                      l.addView(t, lpL(px(46), px(52)).also { it.bottomMargin = px(4) })
                  }
                  sc.addView(l)
                  box.addView(sc, FrameLayout.LayoutParams(-1, -1))
                  return box
              }

              private fun pickLook(i: Int, user: Boolean) {
                  cam.p.look = i
                  for ((k, t) in tiles.withIndex()) t.picked = (k == i)
                  if (i == 0) tv.setLayerType(View.LAYER_TYPE_NONE, null)
                  else tv.setLayerType(View.LAYER_TYPE_HARDWARE, Paint().apply { colorFilter = Look.filter(i) })
                  if (user) toast("LOOK · " + Look.name(i), if (i == 1) "Scene-adaptive grade is baked into SR / HDR+ shots" else "Live preview + baked into SR / HDR+ JPEGs (DNG stays untouched)", "ai")
              }

              // ============================================================ AI depth panel (right)
              private fun openAi() {
                  rightMain.visibility = View.GONE
                  rightAi.visibility = View.VISIBLE
                  rightAi.translationX = dp(90)
                  rightAi.animate().translationX(0f).setDuration(140).start()
                  Sfx.coin(); Hap.tick()
              }

              private fun closeAi() {
                  rightAi.visibility = View.GONE
                  rightMain.visibility = View.VISIBLE
                  Sfx.tick(); Hap.tick()
              }

              private fun depthPick(k: Int, name: String) {
                  cam.p.depth = if (cam.p.depth == k) 0 else k
                  for ((i, b) in aiBtns.withIndex()) b.on = (cam.p.depth == i + 1)
                  if (cam.p.depth != 0) toast("AI DEPTH · $name", "Depth Anything V2 (GPU) engine lands next build — your pick is saved", "ai")
              }

              // ============================================================ lenses / flip / selfie
              private fun trimX(z: Float): String {
                  val s = String.format(Locale.US, "%.1f", z)
                  return (if (s.endsWith(".0")) s.dropLast(2) else s) + "x"
              }

              private fun buildLensChips() {
                  lensRow.removeAllViews()
                  val main = lenses.firstOrNull { it.id == "0" }?.eq ?: lenses.firstOrNull()?.eq ?: 24f
                  for ((i, l) in lenses.withIndex()) {
                      val z = if (main > 0f && l.eq > 0f) l.eq / main else 1f
                      val t = if (z < .95f || z > 1.05f) trimX(z) else "1x"
                      val b = PixelButton(this, t, null); b.sizeSp = 13f
                      b.onTap = { selfie = false; lensIdx = i; afterLensChange() }
                      lensRow.addView(b, lpL(px(50), px(30)).also { it.setMargins(px(2), px(2), px(2), px(2)) })
                  }
                  val f = PixelButton(this, "SELF", null); f.sizeSp = 12f
                  f.onTap = { toggleSelfie() }
                  lensRow.addView(f, lpL(px(52), px(30)).also { it.setMargins(px(2), px(2), px(2), px(2)) })
                  updateLensChips()
              }

              private fun updateLensChips() {
                  for (k in 0 until lensRow.childCount) {
                      val b = lensRow.getChildAt(k) as? PixelButton ?: continue
                      b.on = if (k < lenses.size) (!selfie && k == lensIdx) else selfie
                  }
              }

              private fun afterLensChange() {
                  tv.scaleX = if (selfie) -1f else 1f
                  updateLensChips()
                  game.event("lens")
                  tryStart()
              }

              /** swipe down on the shutter: flip between the main rear lens and the 2nd rear lens */
              private fun flipRear() {
                  if (selfie) { selfie = false; afterLensChange(); return }
                  if (lenses.size < 2) { toast("FLIP LENS", "Only one rear lens is exposed to apps", "lens"); return }
                  lensIdx = if (lensIdx == 0) 1 else 0
                  afterLensChange()
              }

              /** swipe sideways on the shutter: front selfie camera */
              private fun toggleSelfie() {
                  if (cam.frontId() == null) { toast("SELFIE", "No front camera found", "no"); return }
                  selfie = !selfie
                  afterLensChange()
              }

              // ============================================================ slider math
              private fun isoR(): Range<Int> = cam.isoRange ?: Range(50, 3200)
              private fun expR(): Range<Long> = cam.expRange ?: Range(100_000L, 1_000_000_000L)
              private fun l2(x: Double) = ln(x) / ln(2.0)
              private fun isoStops() = max(.5, l2(isoR().upper.toDouble() / isoR().lower))
              private fun isoOf(v: Float): Int = (isoR().lower * 2.0.pow(v * isoStops())).roundToInt().coerceIn(isoR().lower, isoR().upper)
              private fun isoV(i: Int): Float = (l2(i.toDouble() / isoR().lower) / isoStops()).toFloat().coerceIn(0f, 1f)
              private fun expLo() = max(expR().lower, 125_000L)
              private fun expHi() = min(expR().upper, 1_000_000_000L)
              private fun expStops() = max(.5, l2(expHi().toDouble() / expLo()))
              private fun expOf(v: Float): Long = (expLo() * 2.0.pow(v * expStops())).toLong().coerceIn(expR().lower, expR().upper)
              private fun expV(n: Long): Float = (l2(n.toDouble() / expLo()) / expStops()).toFloat().coerceIn(0f, 1f)
              private fun shutText(n: Long): String { val s = n / 1e9; return if (s >= .4) String.format(Locale.US, "%.1fs", s) else "1/" + (1.0 / s).roundToInt() }
              private fun focusText(v: Float): String {
                  val d = v * cam.minFocus
                  return if (cam.minFocus <= 0f) "FIXED" else if (d < .05f) "∞" else String.format(Locale.US, "%.0fcm", 100f / d)
              }
              private fun zr(): Range<Float> = cam.zoomRange ?: Range(1f, 1f)
              private fun zoomOf(v: Float): Float { val r = zr(); return (r.lower * (r.upper / r.lower).toDouble().pow(v.toDouble())).toFloat() }
              private fun zoomV(z: Float): Float { val r = zr(); return if (r.upper <= r.lower) 0f else (ln((z / r.lower).toDouble()) / ln((r.upper / r.lower).toDouble())).toFloat().coerceIn(0f, 1f) }

              private fun wireSliders() {
                  sIso.onChange = { v -> if (cam.p.autoExp) enterManualExp(); cam.p.iso = isoOf(v); cam.refresh() }
                  sShut.onChange = { v -> if (cam.p.autoExp) enterManualExp(); cam.p.expNs = expOf(v); cam.refresh() }
                  sFocus.onChange = { v -> if (cam.p.autoFocus) enterManualFocus(); cam.p.focus = v; cam.refresh() }
                  sWb.onChange = { v -> if (cam.p.autoWb) enterManualWb(); cam.p.wbShift = (v - .5f) * 2f; cam.refresh() }
                  sEv.onChange = { v -> cam.p.ev = -3f + 6f * v; cam.refresh() }
                  sZoom.onChange = { v -> setZoomUi(zoomOf(v), false) }
                  sHdr.onChange = { v -> cam.p.hdrPower = v }
              }

              private fun syncArmed() {
                  sIso.armed = !cam.p.autoExp; sShut.armed = !cam.p.autoExp; sEv.armed = cam.p.autoExp
                  sFocus.armed = !cam.p.autoFocus; sWb.armed = !cam.p.autoWb
                  btnAe.label(if (cam.p.autoExp) "AE:A" else "AE:M"); btnAe.on = !cam.p.autoExp
                  btnAf.label(if (cam.p.autoFocus) "AF:A" else "AF:M"); btnAf.on = !cam.p.autoFocus
                  btnAwb.label(if (cam.p.autoWb) "WB:A" else "WB:M"); btnAwb.on = !cam.p.autoWb
                  for (s in listOf(sIso, sShut, sEv, sFocus, sWb, sZoom, sHdr)) s.invalidate()
              }

              private fun enterManualExp() {
                  val l = cam.last
                  l?.get(CaptureResult.SENSOR_SENSITIVITY)?.let { cam.p.iso = it; sIso.set(isoV(it)) }
                  l?.get(CaptureResult.SENSOR_EXPOSURE_TIME)?.let { cam.p.expNs = it; sShut.set(expV(it)) }
                  cam.p.autoExp = false; syncArmed(); cam.refresh()
              }
              private fun enterManualFocus() {
                  val fd = cam.last?.get(CaptureResult.LENS_FOCUS_DISTANCE)
                  if (fd != null && cam.minFocus > 0f) { cam.p.focus = (fd / cam.minFocus).coerceIn(0f, 1f); sFocus.set(cam.p.focus) }
                  cam.p.autoFocus = false; cam.p.region = null; syncArmed(); cam.refresh()
              }
              private fun enterManualWb() {
                  cam.captureWbBase(); cam.p.wbShift = 0f; sWb.set(.5f)
                  cam.p.autoWb = false; syncArmed(); cam.refresh()
              }
              private fun toggleAe() { if (cam.p.autoExp) enterManualExp() else { cam.p.autoExp = true; syncArmed(); cam.refresh() } }
              private fun toggleAf() { if (cam.p.autoFocus) enterManualFocus() else { cam.p.autoFocus = true; syncArmed(); cam.refresh() } }
              private fun toggleAwb() { if (cam.p.autoWb) enterManualWb() else { cam.p.autoWb = true; syncArmed(); cam.refresh() } }

              // ============================================================ zoom (dial swipe / pinch / slider all land here)
              private fun zoomBy(dDp: Float) {
                  val r = zr()
                  if (r.upper <= r.lower) return
                  val ratio = (r.upper / r.lower).toDouble()
                  setZoomUi((cam.p.zoom * ratio.pow(dDp / 260.0)).toFloat())
                  val det = (zoomV(cam.p.zoom) * 20f).toInt()
                  if (det != lastDet) { lastDet = det; Hap.tick() }
              }

              private fun setZoomUi(z: Float, syncSlider: Boolean = true) {
                  cam.setZoom(z)
                  val zz = cam.p.zoom
                  val label = String.format(Locale.US, "%.1fx", zz)
                  overlay.zoomText = label; overlay.showZoom()
                  if (syncSlider) sZoom.set(zoomV(zz))
                  zoomDial.setFrac(zoomV(zz), label)
                  if (zz >= 5f) game.event("zoom5")
              }

              // ============================================================ modes
              private fun setMode(i: Int) {
                  modeIdx = i
                  mode = modes[i]
                  pano = (i == 4)
                  if (!pano) { globeRun = false; shutter.recording = false }
                  applyModeUi()
                  tryStart()
              }

              private fun applyModeUi() {
                  modeStrip.select(modeIdx, false)
                  btnProc.visibility = if (mode == Mode.RAW) View.VISIBLE else View.GONE
                  btnStack.visibility = if (mode == Mode.RAW) View.VISIBLE else View.GONE
                  btnHlg.visibility = if (mode == Mode.VIDEO) View.VISIBLE else View.GONE
                  btnFps.visibility = if (mode == Mode.VIDEO) View.VISIBLE else View.GONE
                  btnEis.visibility = if (mode == Mode.VIDEO) View.VISIBLE else View.GONE
                  sHdr.visibility = if (mode == Mode.HDR) View.VISIBLE else View.GONE
                  rowAe.visibility = if (mode == Mode.SR || mode == Mode.HDR) View.GONE else View.VISIBLE
                  globe.visibility = if (pano) View.VISIBLE else View.GONE
                  shutter.red = (mode == Mode.VIDEO)
                  syncArmed()
              }

              private fun applyAccent() {
                  val a = biome.go
                  xpBar.color = biome.xp
                  overlay.accent = a
                  for (s in listOf(sIso, sShut, sFocus, sWb, sEv, sZoom, sHdr)) s.accent = a
                  previewFrame.accent = a; bottom.accent = a; sheet.accent = a; presetBox.accent = a; rightMain.accent = a; rightAi.accent = a
                  zoomDial.accent = biome.xp; shutter.accent = biome.xp; modeStrip.accent = biome.xp; thumb.accent = biome.xp; globe.accent = biome.xp
                  for (t in tiles) t.accent = biome.xp
              }

              private fun toast(t: String, s: String, icon: String) { fx.toast(t, s, icon) }

              // ============================================================ shutter
              private fun capture() { Sfx.shutter(); Hap.heavy(); overlay.doFlash(); cam.shoot() }

              private fun onShutter() {
                  if (pano) { toggleGlobe(); return }
                  if (mode != Mode.VIDEO) capture()
                  else { Sfx.rec(); Hap.double(); cam.shoot() }
              }

              private fun toggleGlobe() {
                  globeRun = !globeRun
                  shutter.recording = globeRun
                  if (globeRun) {
                      globe.reset(); steadySince = SystemClock.elapsedRealtime()
                      status("360 RAW · aim at the yellow pin, hold steady")
                      toast("360 RAW", "22 planes: aim the crosshair at the yellow pin and hold", "globe")
                      Sfx.coin()
                  } else status("360 RAW stopped · " + globe.doneCount() + "/" + globe.total())
              }

              // ============================================================ last photo
              private fun loadThumb() {
                  Thread {
                      try {
                          var best = 0L
                          var found: Uri? = null
                          val proj = arrayOf(MediaStore.MediaColumns._ID, MediaStore.MediaColumns.DATE_ADDED)
                          val sel = MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?"
                          for (coll in arrayOf(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, MediaStore.Video.Media.EXTERNAL_CONTENT_URI)) {
                              contentResolver.query(coll, proj, sel, arrayOf("%MiCamPro%"), MediaStore.MediaColumns.DATE_ADDED + " DESC")?.use { c ->
                                  if (c.moveToFirst()) {
                                      val t = c.getLong(1)
                                      if (t >= best) { best = t; found = ContentUris.withAppendedId(coll, c.getLong(0)) }
                                  }
                              }
                          }
                          val u = found
                          if (u != null) {
                              lastUri = u
                              val bmp = try { contentResolver.loadThumbnail(u, Size(128, 128), null) } catch (e: Exception) { null }
                              runOnUiThread { thumb.setThumb(bmp) }
                          }
                      } catch (e: Exception) { }
                  }.start()
              }

              private fun openLast() {
                  val u = lastUri
                  if (u == null) { toast("GALLERY", "Nothing captured yet", "star"); return }
                  try {
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(u, contentResolver.getType(u))
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(i)
                  } catch (e: Exception) { toast("GALLERY", "No viewer app for this file", "no") }
              }

              // ============================================================ CamUi
              override fun status(s: String) { runOnUiThread { tvStatus.text = s } }
              override fun readout(s: String) { runOnUiThread { overlay.readText = s } }
              override fun busy(b: Boolean) {
                  runOnUiThread {
                      isBusy = b
                      shutter.isEnabled = !b; shutter.alpha = if (b) .55f else 1f
                      if (!b) { overlay.crack = 0f; progBar.set(0f) }
                  }
              }
              override fun progress(f: Float, label: String) {
                  runOnUiThread { progBar.set(f); overlay.crack = if (isBusy) f.coerceIn(0f, 1f) else 0f; if (label.isNotEmpty()) tvStatus.text = label }
              }
              override fun aspect(pw: Int, ph: Int) {
                  runOnUiThread {
                      val sw = resources.displayMetrics.widthPixels
                      val sh = resources.displayMetrics.heightPixels
                      val maxH = sh - topInset - botInset - px(52) - px(236) - px(8)
                      var w = sw - px(12)
                      var h = (w.toFloat() * pw / ph).toInt() + px(6)
                      if (h > maxH) { h = maxH; w = ((h - px(6)).toFloat() * ph / pw).toInt() + px(6) }
                      val lp = previewFrame.layoutParams as LinearLayout.LayoutParams
                      lp.width = w; lp.height = h; lp.gravity = Gravity.CENTER_HORIZONTAL
                      previewFrame.layoutParams = lp
                  }
              }
              override fun recording(b: Boolean) {
                  runOnUiThread {
                      shutter.recording = b
                      if (b) { recSec = 0; overlay.recSeconds = 0; ui.postDelayed(recTick, 1000) } else { ui.removeCallbacks(recTick); overlay.recSeconds = -1; overlay.invalidate() }
                  }
              }
              private val recTick = object : Runnable { override fun run() { recSec++; overlay.recSeconds = recSec; ui.postDelayed(this, 1000) } }

              override fun saved(kind: String) {
                  runOnUiThread {
                      game.event(kind, biome.id)
                      Sfx.done(); Hap.heavy()
                      loadThumb()
                      val r = fx.previewRect
                      if (r != null && !(pano && globeRun)) fx.burst(r.centerX(), r.centerY(), biome.go, 18)
                      val label = when (kind) { "raw" -> "RAW DNG saved"; "stack" -> "RAW+ stack saved"; "sr" -> "Super-Res saved"; "hdr" -> "HDR+ saved"; "video" -> "Video saved"; else -> "Saved" }
                      if (kind != "hlg" && !(pano && globeRun)) toast(label, "Pictures/MiCamPro · Movies/MiCamPro", if (kind == "video") "video" else "star")
                      progBar.set(0f); overlay.crack = 0f
                  }
              }
              override fun hdrFallback() { runOnUiThread { btnHlg.on = false; toast("HLG10 not accepted", "Fell back to SDR HEVC", "no") } }
              override fun ready() {
                  runOnUiThread {
                      sIso.steps = (3 * isoStops()).roundToInt()
                      sShut.steps = (3 * expStops()).roundToInt()
                      sFocus.steps = if (cam.minFocus > 0f) 24 else 0
                      sZoom.set(zoomV(cam.p.zoom), false)
                      sZoom.armed = cam.zoomRange != null && zr().upper > zr().lower
                      zoomDial.setFrac(zoomV(cam.p.zoom), String.format(Locale.US, "%.1fx", cam.p.zoom))
                      btnFps.visibility = if (mode == Mode.VIDEO && cam.fps60Ok) View.VISIBLE else View.GONE
                      btnFps.label("${cam.p.fps} fps")
                      btnHlg.visibility = if (mode == Mode.VIDEO && cam.hdrVideoOk) View.VISIBLE else View.GONE
                      btnHlg.on = cam.p.hdrVideo && cam.hdrVideoOk
                      syncArmed()
                  }
              }

              // ============================================================ Game.Listener
              override fun onGain(text: String) {
                  runOnUiThread { Sfx.coin(); fx.floatText(text, resources.displayMetrics.widthPixels * .28f, resources.displayMetrics.heightPixels * .45f, biome.go) }
              }
              override fun onLevel(lv: Int) {
                  runOnUiThread { Sfx.lvl(); Hap.double(); fx.banner("LEVEL UP!", "LV $lv", col("#fcdb5a")); fx.burst(resources.displayMetrics.widthPixels / 2f, resources.displayMetrics.heightPixels * .32f, col("#fcdb5a"), 26) }
              }
              override fun onAch(title: String, sub: String) { runOnUiThread { Sfx.ach(); Hap.heavy(); fx.ach(title, sub) } }
              override fun onQuest(text: String) { runOnUiThread { fx.banner(text, "", biome.go) } }
              override fun onHud() {
                  runOnUiThread {
                      tvLv.text = "LV " + game.lv
                      xpBar.set(game.xp / game.need(game.lv).toFloat())
                      tvQuest.text = game.questText()
                  }
              }

              // ============================================================ TextureView
              override fun onSurfaceTextureAvailable(st: SurfaceTexture, w: Int, h: Int) { cam.texture = st; texReady = true; tryStart() }
              override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, w: Int, h: Int) {}
              override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean { cam.texture = null; texReady = false; return true }
              override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}
          }
          EOF

      - name: Fetch pixel fonts (Pixelify Sans + VT323, OFL) - app falls back to monospace if this fails
        run: |
          mkdir -p _gen/app/src/main/assets/fonts
          curl -fsSL -o _gen/app/src/main/assets/fonts/VT323-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/vt323/VT323-Regular.ttf" || echo "VT323 download failed"
          curl -fsSL -o _gen/app/src/main/assets/fonts/PixelifySans.ttf "https://github.com/google/fonts/raw/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf" || echo "Pixelify download failed"
          ls -la _gen/app/src/main/assets/fonts

      - name: Build APK (debug + release)
        working-directory: _gen
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: MiCamPro-apk
          path: _gen/app/build/outputs/apk/**/*.apk
