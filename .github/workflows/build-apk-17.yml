          package com.micampro

          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.MediaRecorder
          import android.os.Bundle
          import android.os.Process
          import android.os.SystemClock
          import android.view.Surface
          import java.nio.ByteBuffer
          import kotlin.math.max

          /**
           * HEVC encoder fed by a Camera2 surface. Tuned for real-time capture:
           *  - KEY_PRIORITY=0 (real-time) + KEY_OPERATING_RATE: the default priority is "best effort" and is what makes
           *    high-bitrate 10-bit HLG recordings stutter.
           *  - muxes to a local file (no FUSE write path); Camera publishes it to MediaStore afterwards.
           *  - encoder idles (no camera frames) until the repeating request targets its surface.
           */
          class VideoEncoder(w: Int, h: Int, fps: Int, bitrate: Int, val hdr: Boolean) {
              private val vc: MediaCodec = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_HEVC)
              lateinit var surface: Surface
                  private set
              @Volatile private var vFormat: MediaFormat? = null
              @Volatile private var sink: Sink? = null
              @Volatile private var running = true
              private var pendPath: String? = null
              private var pendAudio = false
              private var pendRealtime = true
              private val th: Thread

              init {
                  try {
                      val f = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_HEVC, w, h)
                      f.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
                      f.setInteger(MediaFormat.KEY_BIT_RATE, bitrate)
                      f.setInteger(MediaFormat.KEY_FRAME_RATE, fps)
                      f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                      f.setInteger(MediaFormat.KEY_BITRATE_MODE, MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR)
                      f.setInteger(MediaFormat.KEY_PRIORITY, 0)
                      f.setInteger(MediaFormat.KEY_OPERATING_RATE, fps)
                      try { f.setInteger(MediaFormat.KEY_MAX_B_FRAMES, 0) } catch (e: Exception) { }
                      try { f.setInteger(MediaFormat.KEY_LATENCY, 1) } catch (e: Exception) { }
                      if (hdr) {
                          f.setInteger(MediaFormat.KEY_PROFILE, MediaCodecInfo.CodecProfileLevel.HEVCProfileMain10)
                          f.setInteger(MediaFormat.KEY_COLOR_STANDARD, MediaFormat.COLOR_STANDARD_BT2020)
                          f.setInteger(MediaFormat.KEY_COLOR_TRANSFER, MediaFormat.COLOR_TRANSFER_HLG)
                          f.setInteger(MediaFormat.KEY_COLOR_RANGE, MediaFormat.COLOR_RANGE_LIMITED)
                      }
                      vc.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      surface = vc.createInputSurface()
                      vc.start()
                  } catch (e: Exception) {
                      try { vc.release() } catch (e2: Exception) { }
                      throw e
                  }
                  th = Thread { Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_DISPLAY); drain() }
                  th.start()
              }

              private fun drain() {
                  val info = MediaCodec.BufferInfo()
                  while (running) {
                      val i = try { vc.dequeueOutputBuffer(info, 20_000) } catch (e: Exception) { break }
                      if (i == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          vFormat = vc.outputFormat
                          startPending()
                      } else if (i >= 0) {
                          val b = vc.getOutputBuffer(i)
                          if (b != null && info.size > 0 && (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0) sink?.video(b, info)
                          vc.releaseOutputBuffer(i, false)
                      }
                  }
              }

              @Synchronized private fun startPending() {
                  val p = pendPath ?: return
                  val f = vFormat ?: return
                  pendPath = null
                  try { sink = Sink(p, f, pendAudio, pendRealtime) } catch (e: Exception) { sink = null }
