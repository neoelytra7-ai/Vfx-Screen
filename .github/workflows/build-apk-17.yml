          package com.micampro

          import android.content.Context
          import android.os.SystemClock

          class Game(ctx: Context) {
              interface Listener {
                  fun onGain(text: String)
                  fun onLevel(lv: Int)
                  fun onAch(title: String, sub: String)
                  fun onQuest(text: String)
                  fun onHud()
              }

              private val sp = ctx.getSharedPreferences("micam_pl", Context.MODE_PRIVATE)
              var listener: Listener? = null
              var xp = sp.getInt("xp", 0)
              var lv = sp.getInt("lv", 1)
              private val ach = HashSet<String>(sp.getStringSet("ach", emptySet()) ?: emptySet())
              private val cnt = HashMap<String, Int>()
              var qi = sp.getInt("qi", 0)
              var qp = sp.getInt("qp", 0)
              var qdone = sp.getBoolean("qd", false)
              private var combo = 0
              private var comboAt = 0L

              class Q(val key: String, val text: String, val goal: Int)
              val quests = listOf(
                  Q("shot", "Ambil 5 foto", 5), Q("raw", "Tangkap 2 RAW", 2), Q("hdr", "Jepret HDR+ 2x", 2),
                  Q("lens", "Coba 2 lensa / zoom", 2), Q("video", "Rekam 1 video", 1), Q("sr", "Super-Res 1x", 1), Q("fine", "Pakai FINE adjust", 1)
              )
              private val AD = mapOf(
                  "first" to ("First Shot" to "Jepretan pertama!"),
                  "raw" to ("RAW Miner" to "Tangkap DNG tanpa processing"),
                  "stack" to ("Stacker" to "Merge burst RAW ala HDR+"),
                  "sr" to ("Pixel Hunter" to "Super-Res sukses"),
                  "hdr" to ("Sun Dodger" to "HDR+ selesai"),
                  "video" to ("Director" to "Rekaman pertama"),
                  "hlg" to ("HLG Wizard" to "Video HDR HLG10"),
                  "fine" to ("Precision" to "Pakai FINE adjust"),
                  "owl" to ("Night Owl" to "Jepret di biome End"),
                  "lv5" to ("Veteran" to "Capai LV 5"),
                  "cmb" to ("Combo King" to "Combo x8"),
                  "zoom" to ("Long Shot" to "Zoom 5x atau lebih")
              )

              fun need(l: Int) = 40 + l * 30

              private fun save() {
                  sp.edit().putInt("xp", xp).putInt("lv", lv).putStringSet("ach", ach).putInt("qi", qi).putInt("qp", qp).putBoolean("qd", qdone).apply()
              }

              fun quest(): Q = quests[qi % quests.size]

              fun questText(): String = if (qdone) "✔ Selesai! +60 XP" else quest().text + "  " + qp + "/" + quest().goal

              fun unlock(k: String) {
                  if (ach.contains(k)) return
                  ach.add(k); save()
                  AD[k]?.let { listener?.onAch(it.first, it.second) }
              }

              fun gain(base: Int, label: String? = null) {
                  val now = SystemClock.elapsedRealtime()
                  combo = if (now - comboAt < 3200) combo + 1 else 1
                  comboAt = now
                  val x = Math.round(base * (1f + minOf(combo, 10) * .1f))
                  xp += x
                  var up = false
                  while (xp >= need(lv)) { xp -= need(lv); lv++; up = true }
                  if (x >= 3 || label != null) listener?.onGain("+" + x + " XP" + (if (label != null) " · $label" else "") + (if (combo > 1) "  x$combo" else ""))
                  unlock("first")
                  if (combo >= 8) unlock("cmb")
                  if (up) { listener?.onLevel(lv); if (lv >= 5) unlock("lv5") }
                  save(); listener?.onHud()
              }

              fun comboCount(): Int = if (SystemClock.elapsedRealtime() - comboAt < 3200) combo else 0

              /** kind: shot,raw,stack,sr,hdr,video,hlg,lens,fine,zoom,tap */
              fun event(kind: String, biomeId: String = "") {
                  when (kind) {
                      "raw" -> { gain(12, "RAW"); unlock("raw"); bump("shot"); bump("raw") }
                      "stack" -> { gain(20, "RAW+"); unlock("raw"); unlock("stack"); bump("shot"); bump("raw") }
                      "sr" -> { gain(25, "SUPER-RES"); unlock("sr"); bump("shot"); bump("sr") }
                      "hdr" -> { gain(25, "HDR+"); unlock("hdr"); bump("shot"); bump("hdr") }
                      "video" -> { gain(30, "VIDEO"); unlock("video"); bump("video") }
                      "hlg" -> { gain(20, "HLG10"); unlock("hlg") }
                      "lens" -> { gain(2); bump("lens") }
                      "fine" -> { gain(5, "FINE"); unlock("fine"); bump("fine") }
                      "zoom" -> { gain(1); bump("lens") }
                      "zoom5" -> unlock("zoom")
                      "tap" -> gain(1)
                  }
                  if (biomeId == "endworld" && (kind == "raw" || kind == "stack" || kind == "sr" || kind == "hdr")) unlock("owl")
              }

              private fun bump(key: String) {
                  if (qdone) return
                  val q = quest()
                  if (q.key != key) return
                  qp = minOf(q.goal, qp + 1)
                  if (qp >= q.goal) {
                      qdone = true
                      gain(60, "QUEST CLEAR!")
                      listener?.onQuest("QUEST CLEAR!")
                      android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
                          qi++; qp = 0; qdone = false; save(); listener?.onHud()
                      }, 3500)
                  }
                  save(); listener?.onHud()
              }
          }
