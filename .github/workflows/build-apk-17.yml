          package com.micampro

          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import java.util.stream.IntStream
          import kotlin.math.max
          import kotlin.math.min

          /** Colour looks: used live on the preview (GPU colour filter) and baked into SR / HDR+ JPEGs. Index 1 = AI AUTO (scene-adaptive). */
          object Look {
              private val names = arrayOf("ORIG", "AI AUTO", "VIVID", "FILM", "MONO", "WARM", "COOL", "CINE", "MOODY", "PASTEL", "NOIR")

              fun count(): Int = names.size
              fun name(i: Int): String = names[i.coerceIn(0, names.size - 1)]

              private fun sat(s: Float): ColorMatrix { val m = ColorMatrix(); m.setSaturation(s); return m }
              private fun con(c: Float, bright: Float = 0f): ColorMatrix {
                  val o = 128f * (1f - c) + bright
                  return ColorMatrix(floatArrayOf(c, 0f, 0f, 0f, o, 0f, c, 0f, 0f, o, 0f, 0f, c, 0f, o, 0f, 0f, 0f, 1f, 0f))
              }
              private fun scl(r: Float, g: Float, b: Float, lift: Float = 0f): ColorMatrix =
                  ColorMatrix(floatArrayOf(r, 0f, 0f, 0f, lift, 0f, g, 0f, 0f, lift, 0f, 0f, b, 0f, lift, 0f, 0f, 0f, 1f, 0f))
              private fun cat(vararg ms: ColorMatrix): ColorMatrix {
                  val o = ColorMatrix()
                  for (m in ms) o.postConcat(m)
                  return o
              }

              fun matrix(i: Int): ColorMatrix = when (i) {
                  1 -> cat(sat(1.1f), con(1.06f))
                  2 -> cat(sat(1.5f), con(1.12f))
                  3 -> cat(sat(.85f), con(1.08f, 6f), scl(1.04f, 1f, .94f, 8f))
                  4 -> cat(sat(0f), con(1.15f))
                  5 -> cat(sat(1.08f), scl(1.07f, 1f, .9f))
                  6 -> cat(sat(1.05f), scl(.92f, 1f, 1.08f))
                  7 -> cat(sat(.9f), con(1.18f, -4f), scl(1.08f, .98f, 1.06f))
                  8 -> cat(sat(.7f), con(1.25f, -14f), scl(.96f, 1f, 1.04f))
                  9 -> cat(sat(.75f), con(.9f, 18f))
                  10 -> cat(sat(0f), con(1.5f, -10f))
                  else -> ColorMatrix()
              }

              fun filter(i: Int): ColorMatrixColorFilter = ColorMatrixColorFilter(matrix(i))

              private fun ap(a: FloatArray, c: Int): Int {
                  val r = Color.red(c); val g = Color.green(c); val b = Color.blue(c)
                  val nr = (a[0] * r + a[1] * g + a[2] * b + a[4]).toInt().coerceIn(0, 255)
                  val ng = (a[5] * r + a[6] * g + a[7] * b + a[9]).toInt().coerceIn(0, 255)
                  val nb = (a[10] * r + a[11] * g + a[12] * b + a[14]).toInt().coerceIn(0, 255)
                  return Color.rgb(nr, ng, nb)
              }

              /** four sample colours pushed through the look, for the preset tile swatch */
              fun swatch(i: Int): IntArray {
                  val a = matrix(i).array
                  return intArrayOf(ap(a, Color.rgb(220, 60, 50)), ap(a, Color.rgb(70, 180, 60)), ap(a, Color.rgb(60, 100, 210)), ap(a, Color.rgb(224, 172, 140)))
              }

              /** returns the same bitmap (graded in place) or a mutable copy when the source is immutable */
              fun process(src: Bitmap, idx: Int): Bitmap {
                  if (idx <= 0) return src
                  val bmp = if (src.isMutable) src else (src.copy(Bitmap.Config.ARGB_8888, true) ?: return src)
                  val m = if (idx == 1) autoMatrix(bmp) else matrix(idx)
                  applyInPlace(bmp, m.array)
                  return bmp
              }

              /** scene-adaptive grade: gray-world cast trim + percentile contrast stretch + shadow lift + saturation by colourfulness */
              private fun autoMatrix(b: Bitmap): ColorMatrix {
                  val w = b.width; val h = b.height
                  val sx = max(1, w / 160); val sy = max(1, h / 120)
                  val hist = IntArray(256)
                  var sr = 0L; var sg = 0L; var sb = 0L; var n = 0L; var sSat = 0.0
                  var y = 0
                  while (y < h) {
                      var x = 0
                      while (x < w) {
                          val c = b.getPixel(x, y)
                          val r = Color.red(c); val g = Color.green(c); val bl = Color.blue(c)
                          val l = (r * 77 + g * 150 + bl * 29) shr 8
                          hist[l.coerceIn(0, 255)]++
                          sr += r; sg += g; sb += bl; n++
                          val mx = max(r, max(g, bl)); val mn = min(r, min(g, bl))
                          if (mx > 0) sSat += (mx - mn).toDouble() / mx
                          x += sx
                      }
                      y += sy
                  }
                  if (n == 0L) return ColorMatrix()
                  var acc = 0L; var p1 = 0; var p99 = 255
                  var found1 = false
                  for (i in 0 until 256) {
                      acc += hist[i]
                      if (!found1 && acc >= n / 100) { p1 = i; found1 = true }
                      if (acc >= n * 99 / 100) { p99 = i; break }
                  }
                  val mr = sr.toFloat() / n; val mg = sg.toFloat() / n; val mb = sb.toFloat() / n
                  val mean = (mr + mg + mb) / 3f
                  val gr = (mean / max(1f, mr)).coerceIn(.92f, 1.08f)
                  val gg = (mean / max(1f, mg)).coerceIn(.92f, 1.08f)
                  val gb = (mean / max(1f, mb)).coerceIn(.92f, 1.08f)
                  val span = max(60f, (p99 - p1).toFloat())
                  val sc = (255f * .97f / span).coerceIn(1f, 1.3f)
                  val meanL = (mr * 77 + mg * 150 + mb * 29) / 256f
                  val lift = (100f - meanL).coerceIn(0f, 60f) * .3f
                  val off = (-p1 * sc).coerceIn(-40f, 0f) + lift
                  val ms = (sSat / n).toFloat()
                  val s = if (ms < .25f) 1.25f else if (ms < .4f) 1.15f else 1.05f
                  val stretch = ColorMatrix(floatArrayOf(sc, 0f, 0f, 0f, off, 0f, sc, 0f, 0f, off, 0f, 0f, sc, 0f, off, 0f, 0f, 0f, 1f, 0f))
                  return cat(scl(gr, gg, gb), stretch, sat(s))
              }

              private fun applyInPlace(b: Bitmap, a: FloatArray) {
                  val w = b.width; val h = b.height
                  val strip = 128
                  val n = (h + strip - 1) / strip
                  IntStream.range(0, n).parallel().forEach { si ->
                      val y0 = si * strip
                      val hh = min(strip, h - y0)
                      val px = IntArray(w * hh)
                      b.getPixels(px, 0, w, 0, y0, w, hh)
                      for (i in px.indices) {
                          val c = px[i]
                          val r = (c shr 16) and 255; val g = (c shr 8) and 255; val bl = c and 255
                          val nr = (a[0] * r + a[1] * g + a[2] * bl + a[4]).toInt().coerceIn(0, 255)
                          val ng = (a[5] * r + a[6] * g + a[7] * bl + a[9]).toInt().coerceIn(0, 255)
                          val nb = (a[10] * r + a[11] * g + a[12] * bl + a[14]).toInt().coerceIn(0, 255)
                          px[i] = (c and 0xFF000000.toInt()) or (nr shl 16) or (ng shl 8) or nb
                      }
                      b.setPixels(px, 0, w, 0, y0, w, hh)
                  }
              }
          }
