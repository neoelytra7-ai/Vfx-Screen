                      arrayOf("#d27bff", "#ffffff", "#a35cff"), intArrayOf(3, 6), floatArrayOf(10f, 20f), 60, false)
              )
              fun byTime(h: Int): Biome = list[when { h in 5..9 -> 0; h in 10..15 -> 1; h in 16..19 -> 2; else -> 3 }]
              fun byId(id: String): Biome = list.firstOrNull { it.id == id } ?: list[0]
          }

          /** rect painter that wraps horizontally (seamless tiling) */
          class Pix(private val c: Canvas, private val sw: Int) {
              private val p = Paint().apply { isAntiAlias = false; style = Paint.Style.FILL }
              operator fun invoke(x: Number, y: Number, w: Number, h: Number, color: String) {
                  p.color = col(color)
                  val a = Math.round(x.toFloat()); val yy = Math.round(y.toFloat())
                  for (o in intArrayOf(-sw, 0, sw)) c.drawRect((a + o).toFloat(), yy.toFloat(), (a + o) + w.toFloat(), yy + h.toFloat(), p)
              }
          }

          object Scene {
              const val SW = 360
              const val SH = 180
              const val U = 6
              const val FH = 48
              private var sd = 1L
              private fun rn(): Float { sd = sd * 16807L % 2147483647L; return sd / 2147483647f }

              private fun hill(r: Pix, b: Number, a: Number, k: Number, p: Number, t: String, f: String, e: String? = null): IntArray {
                  val n = SW / U
                  val ys = IntArray(n)
                  val bb = b.toFloat(); val aa = a.toFloat(); val kk = k.toFloat(); val pp = p.toFloat()
                  for (i in 0 until n) {
                      val y = Math.round((bb + aa * sin(6.283f * kk * i / n + pp) + aa * .5f * sin(6.283f * (2 * kk + 1) * i / n + pp * 2)) / U) * U
                      ys[i] = y
                      r(i * U, y, U, U, t)
                      r(i * U, y + U, U, SH, f)
                      if (e != null && i % 3 == 1) r(i * U + 1, y + U + 2, 3, 3, e)
                  }
                  return ys
              }

              private fun tree(r: Pix, x: Int, y: Int, t: String, a: String, b: String) {
                  r(x, y - 4 * U, U, 4 * U, t); r(x - U, y - 7 * U, 3 * U, 3 * U, a); r(x - 2 * U, y - 6 * U, 5 * U, U, a)
                  r(x, y - 8 * U, U, U, a); r(x - U + 2, y - 7 * U + 2, 5, 5, b); r(x + U, y - 5 * U, 5, 5, b)
              }

              private fun clo(r: Pix, x: Int, y: Int, w: Int) {
                  r(x, y, w, 6, "#fff"); r(x + 6, y - 6, w - 14, 6, "#fff"); r(x + 2, y + 6, w - 4, 3, "#0000001a")
              }

              private fun ceil(r: Pix, a: Int, b: Int, c1: String, c2: String) {
                  for (i in 0 until 60) { val l = a + (i * 41 % 6) * b; r(i * U, 0, U, l, c1); r(i * U, l, U, 5, c2) }
              }

              private val DR: Map<String, List<(Pix) -> Unit>> by lazy {
                  mapOf(
                      "overworld" to listOf<(Pix) -> Unit>(
                          { r ->
                              r(236, 20, 22, 22, "#fff3a8"); r(232, 16, 30, 30, "#fff3a822")
                              for (a in listOf(intArrayOf(20, 60, 40), intArrayOf(110, 34, 30), intArrayOf(180, 70, 44), intArrayOf(290, 46, 36))) clo(r, a[0], a[1], a[2])
                              hill(r, 128, 16, 2, 1, "#a5d6b8", "#a5d6b8")
                          },
                          { r ->
                              val y = hill(r, 114, 12, 3, .5f, "#5aab3c", "#7b5a35", "#6a4a2a")
                              for (i in intArrayOf(6, 17, 31, 44, 53)) tree(r, i * U, y[i], "#6b4a26", "#3f8f2e", "#57ad3f")
                              val n = SW / U
                              for (i in 0 until n) {
                                  val w = Math.round((136 + 4 * sin(6.283f * 2 * i / n + 1) + 2 * sin(6.283f * 5 * i / n)) / 3) * 3
                                  r(i * U, w - 3, U, 3, "#d9c27a"); r(i * U, w, U, 9, "#2f7fd0"); r(i * U, w, U, 3, "#4aa3e8"); r(i * U, w + 9, U, 3, "#d9c27a")
                                  if (i % 5 == 2) r(i * U + 1, w + 3, 4, 2, "#9ad4ff")
                                  if (i % 7 == 4) r(i * U + 2, w + 6, 3, 2, "#6dbcf5")
                              }
                          },
                          { r ->
                              val ys = hill(r, 160, 6, 4, 2, "#3d8a2a", "#4f351d", "#3e2a16")
                              for (i in ys.indices) {
                                  r(i * U + 1, ys[i] - 4, 2, 4, "#4c9a33")
                                  if (i % 9 == 3) r(i * U + 2, ys[i] - 6, 3, 3, if (i % 2 == 1) "#e84a4a" else "#fcdb5a")
                              }
                          }),
                      "lushcave" to listOf<(Pix) -> Unit>(
                          { r -> ceil(r, 8, 10, "#183a29", "#245a3e"); for (x in intArrayOf(60, 170, 280)) r(x, 0, 16, SH, "#b6ff7a12") },
                          { r ->
                              ceil(r, 14, 9, "#1f4d36", "#2c6b4b")
                              val y = hill(r, 140, 8, 3, 0, "#3c8a45", "#173a28", "#10291c")
                              for (i in intArrayOf(8, 25, 41, 52)) tree(r, i * U, y[i], "#5a4630", "#4aa04a", "#e86fb0")
                          },
                          { r ->
                              val xs = intArrayOf(20, 64, 119, 175, 222, 268, 331)
                              for (k in xs.indices) {
                                  val x = xs[k]; val l = 40 + k * 13 % 50
                                  r(x, 0, 2, l, "#3f7a2a"); r(x + 2, 10, 3, 2, "#3f7a2a")
                                  var y = 16
                                  while (y < l) { r(x - 3, y - 2, 9, 9, "#ffb34726"); r(x - 1, y, 5, 5, "#ffb347"); r(x, y + 1, 2, 2, "#fff2b0"); y += 22 }
                              }
                              hill(r, 166, 4, 4, 1, "#1c4a2c", "#0d241a", "#091a12")
                          }),
                      "netherworld" to listOf<(Pix) -> Unit>(
                          { r -> r(0, 118, SW, 62, "#ff5a1a2e"); r(0, 134, SW, 46, "#ff7a2a40"); hill(r, 112, 20, 2, .7f, "#4a1212", "#4a1212") },
                          { r ->
                              ceil(r, 10, 9, "#5c1a1a", "#7a2424")
                              for (x in intArrayOf(90, 250)) { r(x, 0, 8, 150, "#ff6a1a"); r(x + 2, 0, 3, 150, "#ffd36a") }
                              r(50, 96, 6, 52, "#1b0b30"); r(74, 96, 6, 52, "#1b0b30"); r(50, 92, 30, 6, "#1b0b30")
                              r(56, 98, 18, 50, "#b030ff99"); r(60, 104, 4, 36, "#e9a8ff88")
                              hill(r, 150, 8, 3, 1, "#762525", "#4e1515", "#3a0e0e")
                          },
                          { r ->
                              for (x in intArrayOf(30, 150, 260)) { r(x - 4, 0, 20, 30, "#ffd36a14"); r(x, 0, 12, 16, "#ffd36a"); r(x + 2, 16, 8, 9, "#ffb02e") }
                              hill(r, 168, 4, 4, 0, "#2a0a0a", "#1a0606", "#120404")
                          }),
                      "endworld" to listOf<(Pix) -> Unit>(
                          { r ->
                              for (i in 0 until 70) { val x = (rn() * SW).toInt(); val y = (rn() * 140).toInt(); r(x, y, 2, 2, if (rn() > .7f) "#fff" else "#b9a6ff77") }
                              r(130, 50, 80, 80, "#7a3cd014"); r(150, 70, 40, 40, "#a56bff14")
                          },
                          { r ->
                              for (a in listOf(intArrayOf(30, 110, 70), intArrayOf(200, 90, 90), intArrayOf(310, 125, 50))) {
                                  val x = a[0]; val y = a[1]; val w = a[2]
                                  r(x, y, w, 6, "#d8d49a"); r(x + 8, y + 6, w - 16, 6, "#bdb87e"); r(x + 18, y + 12, w - 36, 6, "#8a8658")
                                  r(x + w / 2 - 2, y - 16, 4, 16, "#9b6bc9"); r(x + w / 2 - 8, y - 22, 16, 6, "#c9a0e6")
                              }
                              for (x in intArrayOf(110, 270)) { r(x, 64, 12, 120, "#0e0a1a"); r(x, 64, 2, 120, "#2d2150"); r(x - 3, 44, 18, 22, "#ff4d9a1a"); r(x + 2, 48, 8, 14, "#ff4d9a") }
                          },
                          { r ->
                              hill(r, 164, 4, 3, 0, "#d8d49a", "#aaa56e", "#8d885a")
                              r(250, 126, 3, 38, "#0a0a0a"); r(257, 126, 3, 38, "#0a0a0a"); r(249, 92, 12, 34, "#121212"); r(250, 80, 10, 12, "#121212")
                              r(251, 85, 3, 2, "#e040ff"); r(256, 85, 3, 2, "#e040ff"); r(244, 94, 3, 38, "#121212"); r(262, 94, 3, 38, "#121212")
                          })
                  )
              }

              private val layerCache = HashMap<String, List<Bitmap>>()
              private val fgCache = HashMap<String, Bitmap>()

              fun layers(b: Biome): List<Bitmap> = layerCache.getOrPut(b.id) {
                  DR[b.id]!!.mapIndexed { i, f ->
                      sd = (11 + i).toLong()
                      val bmp = Bitmap.createBitmap(SW, SH, Bitmap.Config.ARGB_8888)
                      f(Pix(Canvas(bmp), SW)); bmp
                  }
              }

              fun foreground(b: Biome): Bitmap = fgCache.getOrPut(b.id) {
                  sd = (41 + b.id.length).toLong()
                  val bmp = Bitmap.createBitmap(SW, FH, Bitmap.Config.ARGB_8888)
                  val r = Pix(Canvas(bmp), SW)
                  val c1 = b.fg[0]; val c2 = b.fg[1]; val b1 = b.fg[2]; val b2 = b.fg[3]
                  r(0, FH - 2, SW, 2, c1); r(0, FH - 3, SW, 1, c2)
                  for (i in 0 until SW / 3) if (rn() < .5f) { val h = 1 + (rn() * 3).toInt(); r(i * 3, FH - 3 - h, 2, h, if (rn() < .5f) b1 else b2) }
                  for (i in 0 until 6) r(((rn() * SW / 3).toInt()) * 3, FH - 6, 2, 2, b.flowers[i % b.flowers.size])
                  bmp
              }
          }

          // ------------------------------------------------------------------ 8-bit sfx + haptics
          object Sfx {
              @Volatile var on = true
              private const val SR = 22050
              private val h = Handler(Looper.getMainLooper())

              private class N(val f: Float, val d: Float, val type: Int, val v: Float, val at: Float)

              private fun play(vararg ns: N) {
                  if (!on) return
                  try {
                      var total = 0f
                      for (n in ns) total = maxOf(total, n.at + n.d)
                      val len = (total * SR).toInt() + 1
                      val buf = FloatArray(len)
                      for (n in ns) {
                          val s0 = (n.at * SR).toInt(); val cnt = (n.d * SR).toInt()
                          for (i in 0 until cnt) {
                              val t = i / SR.toFloat()
                              val ph = (n.f * t) % 1f
                              val w = when (n.type) { 0 -> if (ph < .5f) 1f else -1f; 1 -> 4f * abs(ph - .5f) - 1f; else -> 2f * ph - 1f }
                              val env = exp(-6.9f * t / n.d)
                              if (s0 + i < len) buf[s0 + i] += w * env * n.v
                          }
                      }
                      val pcm = ShortArray(len) { (buf[it].coerceIn(-1f, 1f) * 32000).toInt().toShort() }
                      val at = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_GAME).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(SR).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(pcm.size * 2).setTransferMode(AudioTrack.MODE_STATIC).build()
                      at.write(pcm, 0, pcm.size)
                      at.play()
                      h.postDelayed({ try { at.release() } catch (e: Exception) { } }, (total * 1000).toLong() + 250)
                  } catch (e: Exception) { }
              }

              fun tick() = play(N(660f, .04f, 0, .05f, 0f))
              fun detent() = play(N(1100f, .02f, 1, .06f, 0f))
              fun coin() = play(N(988f, .07f, 0, .05f, 0f), N(1319f, .18f, 0, .05f, .07f))
              fun hit() = play(N(120f, .18f, 2, .08f, 0f), N(80f, .2f, 0, .06f, .05f))
              fun shutter() = play(N(2400f, .015f, 0, .08f, 0f), N(900f, .05f, 0, .07f, .02f), N(500f, .06f, 2, .04f, .05f))
              fun done() = play(N(784f, .08f, 1, .07f, 0f), N(1175f, .2f, 1, .07f, .08f))
              fun lvl() = play(N(523f, .16f, 0, .06f, 0f), N(659f, .16f, 0, .06f, .1f), N(784f, .16f, 0, .06f, .2f), N(1047f, .16f, 0, .06f, .3f))
              fun ach() = play(N(784f, .14f, 1, .07f, 0f), N(988f, .14f, 1, .07f, .08f), N(1175f, .14f, 1, .07f, .16f), N(1568f, .14f, 1, .07f, .24f))
              fun over() = play(N(392f, .22f, 2, .06f, 0f), N(330f, .22f, 2, .06f, .16f), N(262f, .22f, 2, .06f, .32f), N(196f, .22f, 2, .06f, .48f))
              fun rec() = play(N(880f, .06f, 0, .05f, 0f), N(1320f, .12f, 0, .05f, .07f))
          }

          object Hap {
              @Volatile var on = true
              private var v: Vibrator? = null
              @Suppress("DEPRECATION")
              fun init(ctx: Context) { v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator }
              private fun fx(id: Int) { if (on) try { v?.vibrate(VibrationEffect.createPredefined(id)) } catch (e: Exception) { } }
              fun tick() = fx(VibrationEffect.EFFECT_TICK)
              fun click() = fx(VibrationEffect.EFFECT_CLICK)
              fun heavy() = fx(VibrationEffect.EFFECT_HEAVY_CLICK)
              fun double() = fx(VibrationEffect.EFFECT_DOUBLE_CLICK)
          }
