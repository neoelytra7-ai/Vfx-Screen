                          try { startAudio() } catch (e: Exception) {
                              needAudio = false
                              try { rec?.release() } catch (e2: Exception) { }
                              try { ac?.release() } catch (e2: Exception) { }
                              rec = null; ac = null
                          }
                      }
                      if (!needAudio) tryStart()
                  }

                  private fun nowUs(): Long = (if (realtime) SystemClock.elapsedRealtimeNanos() else System.nanoTime()) / 1000

                  private fun tryStart() {
                      synchronized(lock) {
                          if (started) return
                          if (needAudio && aTrack < 0) return
                          muxer.start()
                          started = true
                          try { vc.setParameters(Bundle().apply { putInt(MediaCodec.PARAMETER_KEY_REQUEST_SYNC_FRAME, 0) }) } catch (e: Exception) { }
                      }
                  }

                  private fun startAudio() {
                      val rate = 48000
                      val min = AudioRecord.getMinBufferSize(rate, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT)
                      val r = AudioRecord(MediaRecorder.AudioSource.MIC, rate, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT, min * 4)
                      if (r.state != AudioRecord.STATE_INITIALIZED) { r.release(); throw IllegalStateException("AudioRecord init failed") }
                      val f = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, rate, 2)
                      f.setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                      f.setInteger(MediaFormat.KEY_BIT_RATE, 256_000)
                      f.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384)
                      val c = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                      c.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      c.start()
                      rec = r; ac = c
                      r.startRecording()
                      val t = Thread { Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO); audioLoop(r, c) }
                      at = t
                      t.start()
                  }

                  private fun audioLoop(r: AudioRecord, c: MediaCodec) {
                      val info = MediaCodec.BufferInfo()
                      var lastPts = 0L
                      while (!stopping) {
                          val i = c.dequeueInputBuffer(5000)
                          if (i >= 0) {
                              val b = c.getInputBuffer(i)!!
                              b.clear()
                              val n = r.read(b, b.capacity())
                              if (n > 0) {
                                  var pts = nowUs() - n / 4 * 1_000_000L / 48000
                                  if (pts <= lastPts) pts = lastPts + 1
                                  lastPts = pts
                                  c.queueInputBuffer(i, 0, n, pts, 0)
                              } else c.queueInputBuffer(i, 0, 0, lastPts + 1, 0)
                          }
                          while (true) {
                              val o = c.dequeueOutputBuffer(info, 0)
                              if (o == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                  synchronized(lock) { aTrack = muxer.addTrack(c.outputFormat) }
                                  tryStart()
                              } else if (o >= 0) {
                                  val b = c.getOutputBuffer(o)
                                  if (b != null && info.size > 0 && (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0) audioSample(b, info)
                                  c.releaseOutputBuffer(o, false)
                              } else break
                          }
                      }
                  }

                  fun video(b: ByteBuffer, info: MediaCodec.BufferInfo) {
                      synchronized(lock) {
                          if (!started) return
                          if (t0 < 0) {
                              if ((info.flags and MediaCodec.BUFFER_FLAG_KEY_FRAME) == 0) return
                              t0 = info.presentationTimeUs
                          }
                          val o = MediaCodec.BufferInfo()
                          o.set(info.offset, info.size, max(0L, info.presentationTimeUs - t0), info.flags)
                          b.position(info.offset)
                          b.limit(info.offset + info.size)
                          muxer.writeSampleData(vTrack, b, o)
                      }
                  }

                  private fun audioSample(b: ByteBuffer, info: MediaCodec.BufferInfo) {
                      synchronized(lock) {
                          if (!started || t0 < 0 || aTrack < 0) return
                          if (info.presentationTimeUs < t0) return
                          val o = MediaCodec.BufferInfo()
                          o.set(info.offset, info.size, info.presentationTimeUs - t0, info.flags)
                          b.position(info.offset)
                          b.limit(info.offset + info.size)
                          muxer.writeSampleData(aTrack, b, o)
                      }
                  }

                  fun finish() {
                      stopping = true
                      try { at?.join(2000) } catch (e: Exception) { }
                      try { rec?.stop() } catch (e: Exception) { }
                      try { rec?.release() } catch (e: Exception) { }
                      try { ac?.stop() } catch (e: Exception) { }
                      try { ac?.release() } catch (e: Exception) { }
                      synchronized(lock) {
                          if (started) { started = false; try { muxer.stop() } catch (e: Exception) { } }
                          try { muxer.release() } catch (e: Exception) { }
                      }
                  }
              }
          }
