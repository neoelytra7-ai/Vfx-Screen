name: Build MiCam Pro APK

# =====================================================================================================
# MiCam Pro  -  ONE FILE = WHOLE PROJECT.  Put at .github/workflows/build-apk.yml -> push -> Actions -> Artifacts.
# The heredocs below write every Android source file (Kotlin / Camera2) when CI runs, then Gradle builds the APK.
# v3 (this file): static pixel UI rebuild + new bottom tool / gestures / presets / AI-depth panel / 360 globe.
# =====================================================================================================
#
# ################################  HANDOFF  -  READ THIS FIRST IN A NEW CHAT  ################################
# If the previous chat ran out of tokens: upload THIS file and say
#     "Continue MiCam Pro from the HANDOFF block. Start with NEXT STEP 0, then 1."
#
# ---------------------------------------------- WHAT IS DONE IN v3 ----------------------------------------------
# UI (all pixel / bevel style, notched pixel corners, black outlines, NO background animation):
#   * Removed: ParallaxView, animated HeaderView, Hotbar, biome cycling, CRT default (CRT is now an OFF toggle in TUNING).
#   * StaticBg (flat checker), PixelFrame (pixel outline container) wraps preview / sheet / side panels / bottom tool.
#   * PreviewOverlay is idle-quiet: no Choreographer frames unless focus reticle / zoom text / flash / REC / progress is live.
#   * BOTTOM TOOL (3 rows, top -> bottom):
#       A  every lens as a chip (labels are x-ratios vs main lens) + SELF chip, TORCH button on the right end
#       B  ZoomDial bottom-left (circular, procedural magnifier whose lens radius + tick ring are spring-driven;
#          swipe up = zoom in, swipe down = zoom out, tap = 1x)  +  ShutterButton centre
#       C  ModeStrip (swipeable, the LAST touched item is the chosen one)  +  ThumbView = last photo at the right end (tap opens gallery)
#   * SHUTTER gestures: tap = shoot, swipe DOWN = flip main <-> 2nd rear lens, swipe SIDEWAYS = front selfie (preview mirrored).
#   * LEFT (vertical, scrollable): PresetTile strip - ORIG, AI AUTO, VIVID, FILM, MONO, WARM, COOL, CINE, MOODY, PASTEL, NOIR.
#       Live GPU colour filter on the TextureView + baked into SR / HDR+ JPEGs (Look.kt). DNG is never touched.
#       AI AUTO (default) = scene-adaptive grade after every shot: gray-world cast trim, percentile contrast stretch,
#       shadow lift, saturation by colourfulness (heuristic, NOT a neural net yet).
#   * RIGHT: AI / TUNE / GRID / HIST column. The AI button swaps the column for the AI DEPTH panel
#       (BACK, CUT, SBS, DOF, BOKEH) - BACK returns to the main UI. Selection is stored in Params.depth.
#   * TUNING sheet (gear): ISO / SHUTTER / FOCUS / WB / EV / ZOOM / HDR PWR sliders with FINE drag, AE/AF/AWB, NoProc, RAW stack x1/4/8,
#       HLG10, fps 60/30, EIS on/off, CRT/SFX/HAP.
# CAMERA:
#   * Params.fps default 60 (video falls back to 30 per lens when the stream map says 60 is unsupported).
#   * Preview requests the highest AE fps range on every lens (prefers upper >= 60).
#   * Torch (FLASH_MODE_TORCH), front camera id lookup, EIS (CONTROL_VIDEO_STABILIZATION_MODE_ON, replaces OIS while recording).
#   * 360 RAW mode ("globe + pin-point plane"): GlobeView draws a pixel orthographic globe from the camera's point of view using
#       TYPE_ROTATION_VECTOR; 22 pins (8 @0deg, 6 @+45, 6 @-45, zenith, nadir). Aim the crosshair at the yellow pin, hold steady
#       350 ms -> RAW (DNG) fires automatically, pin turns green. Shutter button starts/stops the sequence.
#
# ---------------------------------------------- STUBBED / HONEST LIMITS ----------------------------------------------
#   * AI DEPTH buttons only store the choice + show a toast. Depth Anything V2 (GPU) is NOT bundled yet (needs a model file + LiteRT).
#   * "AI EIS" today is the platform EIS from Camera2, not a custom gyro/OIS GL stabiliser.
#   * HDR+/SR are the existing multi-frame merges (Merge.kt / Hdr.kt / RawStack.kt); learned denoise / SR is NOT in yet.
#   * 360 mode saves individual DNGs only (no sidecar with yaw/pitch, no stitcher yet).
#   * Front camera: preview mirror is done; JPEG/DNG orientation + mirror for selfie still needs verification on device.
#   * THIS v3 WAS WRITTEN WITHOUT A COMPILER (sandbox had no network / kotlinc). If the CI build fails, paste the Gradle error log
#     into the new chat first (NEXT STEP 0); expect only small type / import fixes.
#
# ---------------------------------------------- FILE MAP (heredocs below, in this order) ----------------------------------------------
#   Pixel.kt       Dp/dp(), col(), Fonts, Anim (Choreographer), Spring, Pal, Icons (8x8 glyphs incl. torch/ai/depth/back/globe/eis), Bevel (notched),
#                  Biomes/Scene (legacy art, only Biome colours still used), Sfx (8-bit synth), Hap
#   Ui.kt          AView base, PixelButton, PixelSlider (FINE drag), StepBar, PreviewOverlay (grid/level/hist/reticle/REC), FxLayer, SplashView
#   Widgets.kt     pxDisc/pxRing, StaticBg, PixelFrame, ZoomDial, ShutterButton, ModeStrip, ThumbView, PresetTile
#   Look.kt        preset matrices, swatches, AI AUTO analyser, in-place strip grading (parallel)
#   Globe.kt       GlobeView (360 guide, pins, nearest pending pin, angle test)
#   Game.kt        XP / quests / achievements (SharedPreferences)
#   Core.kt        Frame, Warp, Align (coarse-to-fine + tile sub-pixel)
#   Merge.kt       SuperRes (multi-frame SR)           Hdr.kt  HdrPlus (burst exposure fusion)
#   RawStack.kt    Bayer-domain RAW merge              VideoEncoder.kt  HEVC Main10 / HLG10 encoder
#   Camera.kt      CamController (Camera2): lenses(), frontId(), sessions, applyParams(), shoot*, processRaw/Sr/Hdr, saveJpeg (+Look)
#   MainActivity.kt  all wiring: buildUi(), presets, AI panel, lens chips, flip/selfie, zoom, globe auto-capture, thumb loader
#
# ---------------------------------------------- NEXT STEPS (do in this order) ----------------------------------------------
# NEXT STEP 0  Build + fix. Push, open Actions, if red paste the log. Then smoke-test on device: gestures on shutter, dial swipe, presets,
#              lens chips, torch, selfie mirror, 360 globe auto-capture, 60 fps video on each lens.
# NEXT STEP 1  AI DEPTH (Depth Anything V2-Small, GPU):
#              - gradle: add LiteRT (com.google.ai.edge.litert:litert + litert-gpu) ; add a workflow step that curls a depth_anything_v2_small
#                .tflite into app/src/main/assets/models/ (fall back gracefully if the download fails, like the font step).
#              - new Depth.kt: load model with GPU delegate, preprocess to model size (ImageNet norm), run, resize relative-inverse-depth to the photo size,
#                guided-filter / joint-bilateral refine against the RGB so edges are crisp.
#              - CUT: threshold at tap-selected depth + feather -> PNG with alpha.   SBS: depth-based parallax warp for L/R eye -> side-by-side JPEG.
#                DOF: depth-driven blur map from a tap focus point.   BOKEH: disc kernel scaled by |depth-focus|, highlight bloom.
#              - hook: in Camera.kt after saveJpeg (SR/HDR) and for a plain preview-frame capture, if p.depth != 0 call Depth.process; save as an extra file.
#              - replace the toast in MainActivity.depthPick() with real progress via ui.progress().
# NEXT STEP 2  HDR + SR quality ("extremely sharp, stack-to-stack precise"):
#              - gyro-seeded alignment, 4-level tile pyramid (16 px tiles) with sub-pixel refinement, robust per-tile merge weights (ghost rejection),
#                frequency-domain Wiener merge for HDR+ (Hasinoff 2016), kernel-regression SR from hand-jitter (Wronski 2019).
#              - optional learned denoise / x2 SR on GPU through LiteRT, 256 px tiles with 16 px overlap.
#              - Ultra HDR (JPEG_R gain map, API 34) output for HDR+.
# NEXT STEP 3  AI EIS + 60 fps video pipeline: SurfaceTexture -> GLES -> MediaCodec input surface; gyro + OIS samples
#              (STATISTICS_OIS_SAMPLES) -> smoothed virtual camera with ~15 frame look-ahead + rolling-shutter correction; the same GL pass applies
#              the preset LUT live to recorded video.
# NEXT STEP 4  Granular RAW: photo (bracket ladder, per-channel WB gains, black level / lens shading / noise-profile overrides, DNG colour tags),
#              video (RAW16 ring buffer -> DNG sequence + sidecar), 360 (sidecar PANO_<stamp>.json with yaw/pitch/roll per frame from the rotation
#              vector + LENS_INTRINSIC_CALIBRATION, equirect stitcher with feathered blend, GPano XMP, optional linear equirect DNG).
# NEXT STEP 5  More camera "breakthroughs": night mode long-stack, astro, focus stacking (manual focus sweep + sharpness merge), zebra / focus peaking,
#              LOG profile + LUT preview, physical-lens streams on logical multi-camera (OutputConfiguration.setPhysicalCameraId) so every lens runs 60 fps.
# NEXT STEP 6  Polish: tablet / short-screen layout, haptic map for the dial, game quests for the new gestures.
#
# Conventions: every Kotlin file is a quoted heredoc (<<'EOF') indented 10 spaces; never put a line that is exactly EOF inside a file;
# minSdk 29, no new permissions so far; fonts are fetched at CI time with a monospace fallback.
# ###############################################################################################################


on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project (heredocs)
        run: |
          set -e
          mkdir -p _gen/app/src/main/java/com/micampro _gen/app/src/main/assets/fonts
          cd _gen
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MiCamPro"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.micampro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.micampro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "0.2"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera.any" />
              <application
                  android:label="MiCam Pro"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/micampro/Pixel.kt <<'EOF'
          package com.micampro

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Choreographer
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.min
          import kotlin.math.sin

          object Dp { var d = 1f }
          fun dp(v: Number): Float = v.toFloat() * Dp.d

          /** CSS-style #rgb / #rrggbb / #rrggbbaa -> ARGB int */
          fun col(s: String): Int {
              val h = s.removePrefix("#")
              fun b(i: Int) = h.substring(i, i + 2).toInt(16)
              return when (h.length) {
                  3 -> Color.argb(255, h[0].digitToInt(16) * 17, h[1].digitToInt(16) * 17, h[2].digitToInt(16) * 17)
                  6 -> Color.argb(255, b(0), b(2), b(4))
                  8 -> Color.argb(b(6), b(0), b(2), b(4))
                  else -> Color.MAGENTA
              }
          }

          fun withA(c: Int, a: Float): Int = Color.argb((a.coerceIn(0f, 1f) * 255).toInt(), Color.red(c), Color.green(c), Color.blue(c))
          fun mix(a: Int, b: Int, t: Float): Int = Color.argb(
              (Color.alpha(a) + (Color.alpha(b) - Color.alpha(a)) * t).toInt(),
              (Color.red(a) + (Color.red(b) - Color.red(a)) * t).toInt(),
              (Color.green(a) + (Color.green(b) - Color.green(a)) * t).toInt(),
              (Color.blue(a) + (Color.blue(b) - Color.blue(a)) * t).toInt()
          )

          // ------------------------------------------------------------------ fonts / frame clock / spring
          object Fonts {
              var px: Typeface = Typeface.MONOSPACE
              var vt: Typeface = Typeface.MONOSPACE
              fun init(ctx: Context) {
                  try { vt = Typeface.createFromAsset(ctx.assets, "fonts/VT323-Regular.ttf") } catch (e: Exception) { }
                  try {
                      val t = Typeface.createFromAsset(ctx.assets, "fonts/PixelifySans.ttf")
                      px = Typeface.create(t, 700, false)
                  } catch (e: Exception) { px = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD) }
              }
          }

          object Anim : Choreographer.FrameCallback {
              interface Tick { fun tick(dt: Float) }
              private val subs = ArrayList<Tick>()
              private var last = 0L
              private var running = false
              fun add(t: Tick) {
                  if (!subs.contains(t)) subs.add(t)
                  if (!running) { running = true; last = 0L; Choreographer.getInstance().postFrameCallback(this) }
              }
              fun remove(t: Tick) { subs.remove(t) }
              override fun doFrame(ns: Long) {
                  val dt = if (last == 0L) 0.008f else min(0.05f, (ns - last) / 1e9f)
                  last = ns
                  for (i in subs.indices.reversed()) if (i < subs.size) subs[i].tick(dt)
                  if (subs.isEmpty()) running = false else Choreographer.getInstance().postFrameCallback(this)
              }
          }

          /** Critically-ish damped spring; slightly under-damped by default so things overshoot like cubic-bezier(.3,1.6,.5,1). */
          class Spring(start: Float = 0f, private val k: Float = 320f, private val d: Float = 21f) {
              var x = start
              var t = start
              private var v = 0f
              fun step(dt: Float) {
                  var left = dt
                  while (left > 0f) { // sub-step for stability at low fps
                      val h = min(left, 0.008f)
                      v += (-k * (x - t) - d * v) * h
                      x += v * h
                      left -= h
                  }
              }
              fun snap(to: Float) { x = to; t = to; v = 0f }
              fun kick(impulse: Float) { v += impulse }
              val settled: Boolean get() = abs(x - t) < 0.0015f && abs(v) < 0.02f
          }

          // ------------------------------------------------------------------ palette + icons
          object Pal {
              val m: HashMap<Char, Int> = hashMapOf(
                  'k' to col("#000"), 'o' to col("#e8802a"), 'w' to col("#fff"), 'g' to col("#5fb02f"), 'd' to col("#8a5a2b"),
                  'y' to col("#fcdb5a"), 's' to col("#7a7a7a"), 'b' to col("#4a7fd4"), 'r' to col("#d6403a"),
                  'l' to col("#c9c9c9"), 'p' to col("#9b59c9")
              )
          }

          object Icons {
              private val G: HashMap<String, Array<String>> = hashMapOf(
                  "no" to arrayOf("r......r", ".r....r.", "..r..r..", "...rr...", "...rr...", "..r..r..", ".r....r.", "r......r"),
                  "fox" to arrayOf("o......o", "oo....oo", "oooooooo", "owkoowko", "oooooooo", "owwoowwo", ".owwwwo.", "..okko.."),
                  "star" to arrayOf("...yy...", "...yy...", "yyyyyyyy", ".yyyyyy.", "..yyyy..", ".yyyyyy.", ".yy..yy.", "y......y"),
                  "cfg" to arrayOf("...ll...", "l.llll.l", "llllllll", "lll..lll", "lll..lll", "llllllll", "l.llll.l", "...ll..."),
                  "raw" to arrayOf("rgrgrgrg", "gbgbgbgb", "rgrgrgrg", "gbgbgbgb", "rgrgrgrg", "gbgbgbgb", "rgrgrgrg", "gbgbgbgb"),
                  "sr" to arrayOf("..lll...", ".l...l..", "l..y..l.", "l.yyy.l.", "l..y..l.", ".l...l..", "..lll.s.", "......ss"),
                  "hdr" to arrayOf("...y....", "y..y..y.", ".y.y.y..", "..yyy...", "yyyyyyyy", ".yyyyyy.", "bbbbbbbb", "b.b.b.b."),
                  "video" to arrayOf("kkkkkkkk", "kbbbbbbk", "kbwbbbbk", "kbwwbbbk", "kbwwwbbk", "kbwwbbbk", "kbwbbbbk", "kkkkkkkk"),
                  "lens" to arrayOf("..kkkk..", ".kbbbbk.", "kbwbbbbk", "kbbbbbbk", "kbbbbbbk", "kbbbbbbk", ".kbbbbk.", "..kkkk.."),
                  "ae" to arrayOf("y..y..y.", ".y.yyy..", "..yyyy..", "yyyyyyyy", "..yyyy..", ".yyyyyy.", "y..y..y.", "...y...."),
                  "af" to arrayOf("..rrrr..", ".r....r.", "r..rr..r", "r.rrrr.r", "r.rrrr.r", "r..rr..r", ".r....r.", "..rrrr.."),
                  "wb" to arrayOf("...bb...", "..bbbb..", ".bbwbbb.", ".bbbbbb.", ".bbbbbb.", "..bbbb..", "...bb...", "........"),
                  "grid" to arrayOf("l..l..l.", "llllllll", "l..l..l.", "l..l..l.", "llllllll", "l..l..l.", "l..l..l.", "llllllll"),
                  "hist" to arrayOf("......y.", "....y.y.", "..y.y.y.", "..y.y.y.", "y.y.y.y.", "y.y.y.y.", "yyyyyyyy", "........"),
                  "stack" to arrayOf("..bbbb..", ".bbwwbb.", "bbbbbbbb", "..bbbb..", ".bbwwbb.", "bbbbbbbb", "..bbbb..", "........"),
                  "zoom" to arrayOf("........", ".lllll..", "l.....l.", "l..y..l.", "l.yyy.l.", "l..y..l.", ".lllll.s", "......ss"),
                  "ev" to arrayOf("..yyyy..", ".y....y.", "y..yy..y", "y.yyyy.y", "y..yy..y", ".y....y.", "..yyyy..", "........"),
                  "iso" to arrayOf("kkkkkkkk", "kwwkwwwk", "kkwkwkkk", "kkwkwwwk", "kkwkkkwk", "kwwkwwwk", "kkkkkkkk", "........"),
                  "shut" to arrayOf("..llll..", ".l....l.", "l..ll..l", "l..ll..l", "l..l...l", ".l....l.", "..llll..", "........"),
                  "torch" to arrayOf("..yyyy..", ".ywwwwy.", ".ywwwwy.", "..yyyy..", "...ll...", "...ll...", "...ll...", "...ss..."),
                  "ai" to arrayOf("...p....", "..ppp...", "p.ppp.p.", ".ppppp..", "p.ppp.p.", "..ppp...", "...p....", "........"),
                  "depth" to arrayOf("bb......", "bbbb....", "bbbbbb..", "bbbbbbbb", ".bbbbbbb", "..bbbbbb", "...bbbbb", "....bbbb"),
                  "back" to arrayOf("...l....", "..ll....", ".lllllll", "llllllll", ".lllllll", "..ll....", "...l....", "........"),
                  "globe" to arrayOf("..bbbb..", ".bgbbgb.", "bggbbbbb", "bbbgbbgb", "bbbbbggb", "bgbbbbbb", ".bbgbbb.", "..bbbb.."),
                  "eis" to arrayOf("l......l", ".l....l.", "..l..l..", "...ll...", "...ll...", "..l..l..", ".l....l.", "l......l"),
                  "gold" to arrayOf("..yyyy..", ".yywwyy.", "yyywyyyy", "yyyyyyyy", "yyyyyyyy", "yyyyyyyy", ".yyyyyy.", "..yyyy..")
              )
              private val cache = HashMap<String, Bitmap>()
              fun has(n: String) = G.containsKey(n)
              fun get(n: String): Bitmap = cache.getOrPut(n) { build(G[n] ?: G["no"]!!) }

              private fun build(g: Array<String>): Bitmap {
                  val bmp = Bitmap.createBitmap(10, 10, Bitmap.Config.ARGB_8888)
                  fun on(i: Int, y: Int) = y in g.indices && i in 0 until g[y].length && Pal.m.containsKey(g[y][i])
                  for (y in -1..8) for (i in -1..8) {
                      if (!on(i, y) && (on(i - 1, y) || on(i + 1, y) || on(i, y - 1) || on(i, y + 1))) bmp.setPixel(i + 1, y + 1, Color.BLACK)
                  }
                  for (y in 0 until 8) for (i in 0 until 8) if (on(i, y)) bmp.setPixel(i + 1, y + 1, Pal.m[g[y][i]]!!)
                  return bmp
              }

              private val ip = Paint().apply { isFilterBitmap = false; isAntiAlias = false }
              private val src = android.graphics.Rect(0, 0, 10, 10)
              private val dst = android.graphics.RectF()
              fun draw(c: Canvas, n: String, x: Float, y: Float, size: Float, alpha: Float = 1f) {
                  dst.set(x, y, x + size, y + size)
                  ip.alpha = (alpha * 255).toInt()
                  c.drawBitmap(get(n), src, dst, ip)
              }
          }

          object Bevel {
              private val p = Paint().apply { isAntiAlias = false }
              /** pixel-stepped corners: a cross of two rects, so every outline in the UI reads as chunky pixel art */
              private fun notched(c: Canvas, l: Float, t: Float, r: Float, b: Float, n: Float) {
                  c.drawRect(l + n, t, r - n, b, p)
                  c.drawRect(l, t + n, r, b - n, p)
              }
              fun draw(c: Canvas, l: Float, t: Float, r: Float, b: Float, base: Int, hi: Int, lo: Int,
                       border: Int = Color.BLACK, bw: Float = dp(3), inset: Float = dp(3)) {
                  p.style = Paint.Style.FILL
                  p.color = border; notched(c, l, t, r, b, bw)
                  p.color = base; c.drawRect(l + bw, t + bw, r - bw, b - bw, p)
                  p.color = hi
                  c.drawRect(l + bw, t + bw, r - bw, t + bw + inset, p); c.drawRect(l + bw, t + bw, l + bw + inset, b - bw, p)
                  p.color = lo
                  c.drawRect(l + bw, b - bw - inset, r - bw, b - bw, p); c.drawRect(r - bw - inset, t + bw, r - bw, b - bw, p)
              }
          }

          // ------------------------------------------------------------------ biomes (ported from Foxle)
          class Biome(
              val id: String, val name: String, th: Array<String>, sky: Array<String>, ambC: String, val ambK: Float,
              val fg: Array<String>, val flowers: Array<String>, val partCols: Array<String>, val partSize: IntArray,
              val partDur: FloatArray, val partDx: Int, val leaf: Boolean
          ) {
              val h1 = col(th[0]); val h2 = col(th[1]); val st = col(th[2]); val go = col(th[3])
              val gr = col(th[4]); val xp = col(th[5]); val row = col(th[6])
              val skyA = col(sky[0]); val skyB = col(sky[1]); val skyC = col(sky[2])
              val amb = col(ambC)
              val accent = st
          }

          object Biomes {
              val list: List<Biome> = listOf(
                  Biome("overworld", "Overworld", arrayOf("#7a5230", "#6a4627", "#5fb02f", "#fcdb5a", "#5fb02f", "#7cff3a", "#161616"),
                      arrayOf("#3d8cd6", "#8fcdf5", "#d3f0ff"), "#fffbd0", 22f / 14f,
                      arrayOf("#4f351d", "#3d8a2a", "#5aab3c", "#4c9a33"), arrayOf("#e84a4a", "#fcdb5a"),
                      arrayOf("#fffbd0", "#ffffff", "#d6f0a8"), intArrayOf(3, 6), floatArrayOf(16f, 28f), 90, true),
                  Biome("lushcave", "Lush", arrayOf("#2f5a2a", "#26491f", "#e86fb0", "#ffb347", "#8fd14f", "#9dff5a", "#0d170d"),
                      arrayOf("#050d08", "#0c2416", "#14381f"), "#b6ff7a", 1f,
                      arrayOf("#10291c", "#2c6b4b", "#4aa04a", "#8fd14f"), arrayOf("#e86fb0", "#ffb347"),
                      arrayOf("#c8ff8a", "#ff9ad0", "#8fffd0"), intArrayOf(4, 7), floatArrayOf(16f, 30f), 50, false),
                  Biome("netherworld", "Nether", arrayOf("#6b1d1d", "#581414", "#ff6a1a", "#ffb02e", "#e0481f", "#ff7b2e", "#1c0d0d"),
                      arrayOf("#1a0404", "#5a1408", "#a8300c"), "#ff9a3a", 6f / 14f,
                      arrayOf("#3a0e0e", "#762525", "#a8300c", "#ff6a1a"), arrayOf("#ffb02e"),
                      arrayOf("#ff8a2a", "#ffc24a", "#ff5a1a"), intArrayOf(3, 6), floatArrayOf(6f, 12f), 70, false),
                  Biome("endworld", "End", arrayOf("#2f2a4a", "#25213c", "#b44cff", "#e0a8ff", "#a35cff", "#c86bff", "#140f1d"),
                      arrayOf("#030108", "#120826", "#1f0e3d"), "#c86bff", 12f / 14f,
