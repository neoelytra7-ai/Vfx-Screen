          package com.micampro

          import android.graphics.Bitmap
          import java.util.stream.IntStream
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.ln
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.roundToInt
          import kotlin.math.tanh

          /**
           * HDR+ style pipeline (after Hasinoff et al. 2016 and the Pixel "bracketing" extension):
           *  - N short, equally-exposed frames (under-exposed to protect highlights) are tile-aligned to the sharpest one
           *  - 1 long frame (shadows) is aligned on exposure-equalised luma with clipped/crushed pixels masked out
           *  - merge in linear radiance, per-pixel robust (deghost) weights, hat + exposure weighting
           *  - tone map: self-guided (edge preserving) base/detail split at 1/4 res, adaptive compression
           * Input frames must be captured with a known tone curve (gamma 2.2 or sRGB) - see Camera.lockFrom().
           */
          object HdrPlus {
              private const val GAMMA = 2.2f
              private val lin = FloatArray(256) { (it / 255f).pow(GAMMA) }
              private val encTab = IntArray(4096) { i ->
                  val c = i / 4095f
                  val v = if (c <= 0.0031308f) 12.92f * c else 1.055f * c.pow(1f / 2.4f) - 0.055f
                  (v * 255f + 0.5f).toInt().coerceIn(0, 255)
              }

              private fun enc(l: Float): Int = encTab[(l.coerceIn(0f, 1f) * 4095f + 0.5f).toInt()]
              private fun gEnc(l: Float): Float = l.coerceIn(0f, 1f).pow(1f / GAMMA) * 255f
              private fun lum(o: FloatArray) = 0.2126f * o[0] + 0.7152f * o[1] + 0.0722f * o[2]

              private fun sharp(y: ByteArray, w: Int, h: Int): Long {
                  var s = 0L
                  var r = 0
                  while (r < h) {
                      var c = 0
                      while (c < w - 1) { s += abs((y[r * w + c].toInt() and 0xFF) - (y[r * w + c + 1].toInt() and 0xFF)); c += 3 }
                      r += 3
                  }
                  return s
              }

              private fun box(a: FloatArray, w: Int, h: Int, r: Int): FloatArray {
                  val t = FloatArray(w * h)
                  val o = FloatArray(w * h)
                  val pre = DoubleArray(max(w, h) + 1)
                  for (y in 0 until h) {
                      pre[0] = 0.0
                      for (x in 0 until w) pre[x + 1] = pre[x] + a[y * w + x]
                      for (x in 0 until w) { val lo = max(0, x - r); val hi = min(w, x + r + 1); t[y * w + x] = ((pre[hi] - pre[lo]) / (hi - lo)).toFloat() }
                  }
                  for (x in 0 until w) {
                      pre[0] = 0.0
                      for (y in 0 until h) pre[y + 1] = pre[y] + t[y * w + x]
                      for (y in 0 until h) { val lo = max(0, y - r); val hi = min(h, y + r + 1); o[y * w + x] = ((pre[hi] - pre[lo]) / (hi - lo)).toFloat() }
                  }
                  return o
              }

              /** self-guided filter (He et al.): edge-preserving smoothing, O(N), no halos like a plain blur */
              private fun guided(p: FloatArray, w: Int, h: Int, r: Int, eps: Float): FloatArray {
                  val mean = box(p, w, h, r)
                  val sq = FloatArray(p.size) { p[it] * p[it] }
                  val msq = box(sq, w, h, r)
                  val a = FloatArray(p.size)
                  val b = FloatArray(p.size)
                  for (i in p.indices) {
                      val v = max(0f, msq[i] - mean[i] * mean[i])
                      a[i] = v / (v + eps)
                      b[i] = mean[i] - a[i] * mean[i]
                  }
                  val ma = box(a, w, h, r)
                  val mb = box(b, w, h, r)
                  return FloatArray(p.size) { ma[it] * p[it] + mb[it] }
              }

              fun run(frames: List<Frame>, shorts: Int, power: Float, log: (String) -> Unit): Bitmap {
                  val n = frames.size
                  val w = frames[0].w
                  val h = frames[0].h
                  var ri = 0
                  var bestS = -1L
                  for (i in 0 until shorts) { val s = sharp(frames[i].y, w, h); if (s > bestS) { bestS = s; ri = i } }
                  val ref = frames[ri]
                  val warps = arrayOfNulls<Warp>(n)
                  val e = FloatArray(n) { (frames[it].gain / ref.gain).toFloat() }
                  for (i in 0 until n) {
                      if (i == ri) continue
                      log("Aligning ${i + 1}/$n…")
                      if (i < shorts) {
                          warps[i] = Align.estimate(ref.y, frames[i].y, w, h, true, false)
                      } else {
                          val rel = 1f / e[i]
                          val lut = ByteArray(256) { k -> if (k >= 244) 0.toByte() else gEnc(lin[k] * rel).roundToInt().coerceIn(1, 255).toByte() }
                          val src = frames[i].y
                          val eq = ByteArray(w * h)
                          for (p in eq.indices) eq[p] = lut[src[p].toInt() and 0xFF]
                          warps[i] = Align.estimate(ref.y, eq, w, h, true, true)
                      }
                  }
                  // expected level of frame i given reference level k (for deghosting)
                  val expT = Array(n) { i -> FloatArray(256) { k -> gEnc(lin[k] * e[i]) } }

                  fun sample(x: Int, y: Int, sv: FloatArray, o: FloatArray) {
                      val ryb = ref.y[y * w + x].toInt() and 0xFF
                      var sr = 0f; var sg = 0f; var sb = 0f; var sw = 0f
                      for (i in 0 until n) {
                          val f = frames[i]
                          val wp = warps[i]
                          var px = x.toFloat()
                          var py = y.toFloat()
                          if (wp != null) { wp.eval(px, py, sv); px += sv[0]; py += sv[1] }
                          if (px < 0f || py < 0f || px > w - 1f || py > h - 1f) continue
                          val yv = Px.bil(f.y, w, h, px, py)
                          var gh = 1f
                          if (i != ri) {
                              val ex = expT[i][ryb]
                              if (ex < 244f && yv < 244f) {
                                  val tol = 12f + (if (ex < 60f) (60f - ex) * .4f else 0f)
                                  gh = (1f - (abs(yv - ex) / tol - 1f) / 2f).coerceIn(0f, 1f)
                              }
                              if (gh <= 0f) continue
                          }
                          val ci = min(f.cb.size - 1, (py.toInt() shr 1) * (w shr 1) + (px.toInt() shr 1))
                          val cb = (f.cb[ci].toInt() and 0xFF) - 128f
                          val cr = (f.cr[ci].toInt() and 0xFF) - 128f
                          val r = yv + 1.402f * cr
                          val g = yv - 0.344136f * cb - 0.714136f * cr
                          val b = yv + 1.772f * cb
                          val t = yv / 255f
                          var wt = if (t > 0.985f) 1e-4f else { val a = 2f * t - 1f; val a2 = a * a; max(1f - a2 * a2 * a2, 0.01f) }
                          val ei = e[i]
                          wt *= ei * gh
                          val inv = 1f / ei
                          sr += wt * lin[Px.c8(r)] * inv
                          sg += wt * lin[Px.c8(g)] * inv
                          sb += wt * lin[Px.c8(b)] * inv
                          sw += wt
                      }
                      o[0] = sr / sw; o[1] = sg / sw; o[2] = sb / sw
                  }

                  log("Building radiance map…")
                  val bs = 4
                  val bw = w / bs
                  val bh = h / bs
                  val raw = FloatArray(bw * bh)
                  IntStream.range(0, bh).parallel().forEach { by ->
                      val sv = FloatArray(2)
                      val o = FloatArray(3)
                      for (bx in 0 until bw) {
                          var s = 0f
                          for (dy in intArrayOf(1, 3)) for (dx in intArrayOf(1, 3)) {
                              sample(min(w - 1, bx * bs + dx), min(h - 1, by * bs + dy), sv, o)
                              s += ln(lum(o) + 1e-5f)
                          }
                          raw[by * bw + bx] = s / 4f
                      }
                  }
                  log("Tone mapping…")
                  var base = raw
                  for (k in 0 until 2) base = guided(base, bw, bh, 10, 0.12f)
                  val bf = base
                  val sorted = bf.sortedArray()
                  val hi = sorted[(sorted.size * 0.97f).toInt().coerceAtMost(sorted.size - 1)]
                  val lo = sorted[(sorted.size * 0.03f).toInt()]
                  val range = max(1f, hi - lo)
                  val comp = (4.4f / range).coerceIn(.35f, 1f)
                  val a = (1f - power * (1f - comp) * 1.3f).coerceIn(.3f, 1f)
                  val dBoost = 1.05f + .5f * power * (1f - a)
                  val sat = 1.06f + .14f * (1f - a)
                  val key = ln(0.88f)

                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  IntStream.range(0, h).parallel().forEach { y ->
                      val sv = FloatArray(2)
                      val o = FloatArray(3)
                      val row = IntArray(w)
                      val gy = ((y - bs / 2f) / bs).coerceIn(0f, (bh - 1).toFloat())
                      val y0 = gy.toInt(); val y1 = min(y0 + 1, bh - 1); val fy = gy - y0
                      for (x in 0 until w) {
                          sample(x, y, sv, o)
                          val l = lum(o) + 1e-5f
                          val gx = ((x - bs / 2f) / bs).coerceIn(0f, (bw - 1).toFloat())
                          val x0 = gx.toInt(); val x1 = min(x0 + 1, bw - 1); val fx = gx - x0
                          val b = (bf[y0 * bw + x0] * (1 - fx) + bf[y0 * bw + x1] * fx) * (1 - fy) +
                                  (bf[y1 * bw + x0] * (1 - fx) + bf[y1 * bw + x1] * fx) * fy
                          val detail = (ln(l) - b).coerceIn(-1.6f, 1.6f)
                          val shade = ((b - (hi - 7f)) / 3f).coerceIn(0f, 1f)
                          val db = 1f + (dBoost - 1f) * shade
                          var outL = exp(a * (b - hi) + db * detail + key)
                          if (outL > .8f) outL = .8f + .2f * tanh((outL - .8f) / .2f)
                          val k = outL / l
                          val r = outL + sat * (o[0] * k - outL)
                          val g = outL + sat * (o[1] * k - outL)
                          val bl = outL + sat * (o[2] * k - outL)
                          row[x] = (0xFF shl 24) or (enc(r) shl 16) or (enc(g) shl 8) or enc(bl)
                      }
                      synchronized(bmp) { bmp.setPixels(row, 0, w, 0, y, w, 1) }
                  }
                  return bmp
              }
          }
