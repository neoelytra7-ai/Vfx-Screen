          package com.micampro

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.view.MotionEvent
          import android.view.View
          import android.widget.FrameLayout
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          // ------------------------------------------------------------------ pixel primitives (stepped circles, no anti-aliasing)
          fun pxDisc(c: Canvas, p: Paint, cx: Float, cy: Float, r: Float, color: Int) {
              p.color = color
              val q = dp(2)
              var y = -r
              while (y < r) {
                  val yy = y + q / 2
                  val hw = sqrt(max(0f, r * r - yy * yy))
                  c.drawRect(cx - hw, cy + y, cx + hw, cy + y + q, p)
                  y += q
              }
          }

          fun pxRing(c: Canvas, p: Paint, cx: Float, cy: Float, r: Float, t: Float, color: Int) {
              p.color = color
              val q = dp(2)
              val ri = max(0f, r - t)
              var y = -r
              while (y < r) {
                  val yy = y + q / 2
                  val ho = sqrt(max(0f, r * r - yy * yy))
                  if (abs(yy) < ri) {
                      val hi = sqrt(max(0f, ri * ri - yy * yy))
                      c.drawRect(cx - ho, cy + y, cx - hi, cy + y + q, p)
                      c.drawRect(cx + hi, cy + y, cx + ho, cy + y + q, p)
                  } else c.drawRect(cx - ho, cy + y, cx + ho, cy + y + q, p)
                  y += q
              }
          }

          // ------------------------------------------------------------------ static background (no animation, ever)
          class StaticBg(ctx: Context) : View(ctx) {
              private val p = Paint()
              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  p.color = col("#0c0c0c"); c.drawRect(0f, 0f, w, h, p)
                  val s = dp(12)
                  p.color = col("#121212")
                  var y = 0
                  while (y * s < h) {
                      var x = y % 2
                      while (x * s < w) { c.drawRect(x * s, y * s, (x + 1) * s, (y + 1) * s, p); x += 2 }
                      y++
                  }
              }
          }

          // ------------------------------------------------------------------ pixel outline container
          class PixelFrame(ctx: Context) : FrameLayout(ctx) {
              var accent = col("#5fb02f")
                  set(v) { field = v; invalidate() }
              var thick = dp(3)
              var fill = 0
              private val p = Paint().apply { isAntiAlias = false }
              init { setWillNotDraw(false) }

              override fun dispatchDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val t = thick
                  if (fill != 0) { p.color = fill; c.drawRect(0f, 0f, w, h, p) }
                  super.dispatchDraw(c)
                  p.color = Color.BLACK
                  c.drawRect(0f, 0f, w, t, p); c.drawRect(0f, h - t, w, h, p); c.drawRect(0f, 0f, t, h, p); c.drawRect(w - t, 0f, w, h, p)
                  val i = t * .5f
                  p.color = col("#8b8b8b")
                  c.drawRect(t, t, w - t, t + i, p); c.drawRect(t, h - t - i, w - t, h - t, p); c.drawRect(t, t, t + i, h - t, p); c.drawRect(w - t - i, t, w - t, h - t, p)
                  p.color = accent
                  val k = t * 2.2f
                  c.drawRect(0f, 0f, k, t, p); c.drawRect(0f, 0f, t, k, p)
                  c.drawRect(w - k, 0f, w, t, p); c.drawRect(w - t, 0f, w, k, p)
                  c.drawRect(0f, h - t, k, h, p); c.drawRect(0f, h - k, t, h, p)
                  c.drawRect(w - k, h - t, w, h, p); c.drawRect(w - t, h - k, w, h, p)
              }
          }

          // ------------------------------------------------------------------ circular zoom dial (swipe up = zoom in, down = zoom out)
          class ZoomDial(ctx: Context) : AView(ctx) {
              var accent = col("#7cff3a")
              var onDelta: ((Float) -> Unit)? = null   // dp travelled this move, up = positive
              var onTap: (() -> Unit)? = null
              private var frac = 0f
              private var label = "1.0x"
              private val ring = Spring(0f, 380f, 17f)
              private val rot = Spring(0f, 240f, 21f)
              private val grow = Spring(1f, 500f, 24f)
              private val bp = Paint().apply { isAntiAlias = false }
              private val tp = tpaint(Fonts.vt, 14f, Color.WHITE, Paint.Align.CENTER)
              private var lastY = 0f
              private var y0 = 0f
              private var moved = false

              fun setFrac(f: Float, text: String) {
                  frac = f.coerceIn(0f, 1f); label = text
                  ring.t = frac; rot.t = frac
                  wake()
              }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(dp(68).toInt(), dp(68).toInt()) }

              override fun step(dt: Float): Boolean {
                  ring.step(dt); rot.step(dt); grow.step(dt)
                  return !(ring.settled && rot.settled && grow.settled)
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val cx = w / 2; val cy = height / 2f; val R = w / 2 - dp(2)
                  val u = dp(3)
                  c.save(); c.scale(grow.x, grow.x, cx, cy)
                  pxDisc(c, bp, cx, cy, R, Color.BLACK)
                  pxDisc(c, bp, cx, cy, R - u, col("#4a4a4a"))
                  pxDisc(c, bp, cx, cy, R - u * 1.7f, col("#262626"))
                  // tick ring turns with the zoom position
                  for (i in 0 until 24) {
                      val a = (i / 24f + rot.x * .6f) * 6.2832f
                      val tx = cx + cos(a) * (R - u * 2.3f); val ty = cy + sin(a) * (R - u * 2.3f)
                      bp.color = if (i % 6 == 0) accent else col("#8b8b8b")
                      c.drawRect(tx - dp(1), ty - dp(1), tx + dp(1), ty + dp(1), bp)
                  }
                  // procedural magnifier: lens radius is driven by the zoom spring, so it breathes with every swipe
                  val lr = dp(6) + ring.x.coerceIn(0f, 1.4f) * dp(8)
                  val lcx = cx - dp(3); val lcy = cy - dp(6)
                  pxRing(c, bp, lcx, lcy, lr, dp(2.5f), Color.WHITE)
                  val hx = lcx + lr * .72f; val hy = lcy + lr * .72f
                  bp.color = col("#fcdb5a")
                  for (k in 0..2) { val ox = hx + k * dp(2.6f); val oy = hy + k * dp(2.6f); c.drawRect(ox, oy, ox + dp(3), oy + dp(3), bp) }
                  bp.color = accent
                  val arm = dp(2) + ring.x.coerceIn(0f, 1.4f) * dp(2.5f)
                  c.drawRect(lcx - arm, lcy - dp(.8f), lcx + arm, lcy + dp(.8f), bp)
                  c.drawRect(lcx - dp(.8f), lcy - arm, lcx + dp(.8f), lcy + arm, bp)
                  shText(c, label, cx, cy + R * .68f, tp, dp(1.5f))
                  c.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { parent?.requestDisallowInterceptTouchEvent(true); lastY = e.y; y0 = e.y; moved = false; grow.t = 1.1f; wake() }
                      MotionEvent.ACTION_MOVE -> {
                          if (abs(e.y - y0) > dp(6)) moved = true
                          if (moved) onDelta?.invoke((lastY - e.y) / Dp.d)
                          lastY = e.y
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          if (e.actionMasked == MotionEvent.ACTION_UP && !moved) { Sfx.tick(); Hap.tick(); onTap?.invoke() }
                          grow.t = 1f; grow.kick(2f); wake()
                      }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ shutter: tap = shoot, swipe down = flip rear lens, swipe sideways = selfie
          class ShutterButton(ctx: Context) : AView(ctx) {
              var recording = false
                  set(v) { field = v; invalidate() }
              var red = false
                  set(v) { field = v; invalidate() }
              var accent = col("#7cff3a")
              var onTap: (() -> Unit)? = null
              var onSwipeDown: (() -> Unit)? = null
              var onSwipeSide: ((Int) -> Unit)? = null
              private val ox = Spring(0f, 520f, 24f)
              private val oy = Spring(0f, 520f, 24f)
              private val press = Spring(1f, 520f, 24f)
              private val bp = Paint().apply { isAntiAlias = false }
              private var x0 = 0f
              private var y0 = 0f
              private var fired = false
              private var hint = 0   // 1 down, 2 left, 3 right

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(dp(108).toInt(), dp(96).toInt()) }

              override fun step(dt: Float): Boolean {
                  ox.step(dt); oy.step(dt); press.step(dt)
                  return !(ox.settled && oy.settled && press.settled)
              }

              private fun arrow(c: Canvas, x: Float, y: Float, dir: Int, color: Int) {
                  bp.color = color
                  val q = dp(2.5f)
                  for (i in 0..2) {
                      when (dir) {
                          1 -> c.drawRect(x - (2 - i) * q - q / 2, y + i * q, x + (2 - i) * q + q / 2, y + i * q + q, bp)
                          2 -> c.drawRect(x + i * q, y - i * q - q / 2, x + i * q + q, y + i * q + q / 2, bp)
                          else -> c.drawRect(x - i * q - q, y - i * q - q / 2, x - i * q, y + i * q + q / 2, bp)
                      }
                  }
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val cx = w / 2; val cy = dp(44); val R = dp(31)
                  val idle = 0x55FFFFFF
                  arrow(c, cx - dp(2), cy + R + dp(9), 1, if (hint == 1) accent else idle)
                  arrow(c, cx - R - dp(15), cy - dp(3), 2, if (hint == 2) accent else idle)
                  arrow(c, cx + R + dp(15), cy - dp(3), 3, if (hint == 3) accent else idle)
                  c.save()
                  c.translate(ox.x, oy.x)
                  val s = press.x
                  c.scale(s, s, cx, cy)
                  pxDisc(c, bp, cx, cy, R, Color.BLACK)
                  pxDisc(c, bp, cx, cy, R - dp(3), col("#d8d8d8"))
                  pxDisc(c, bp, cx, cy, R - dp(6), Color.BLACK)
                  if (recording) {
                      bp.color = col("#d6403a"); c.drawRect(cx - dp(11), cy - dp(11), cx + dp(11), cy + dp(11), bp)
                      bp.color = col("#ff8a80"); c.drawRect(cx - dp(11), cy - dp(11), cx + dp(11), cy - dp(8), bp)
                  } else {
                      pxDisc(c, bp, cx, cy, R - dp(8), if (red) col("#d6403a") else col("#f2f2f2"))
                      bp.color = Color.WHITE
                      c.drawRect(cx - dp(13), cy - dp(15), cx - dp(5), cy - dp(12), bp)
                  }
                  c.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!isEnabled) return false
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { parent?.requestDisallowInterceptTouchEvent(true); x0 = e.x; y0 = e.y; fired = false; hint = 0; press.t = .9f; wake() }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = e.x - x0; val dy = e.y - y0
                          ox.t = dx.coerceIn(-dp(16), dp(16)); oy.t = dy.coerceIn(0f, dp(16))
                          hint = if (dy > dp(18) && dy > abs(dx)) 1 else if (dx < -dp(18) && abs(dx) > dy) 2 else if (dx > dp(18) && abs(dx) > dy) 3 else 0
                          if (!fired) {
                              if (dy > dp(40) && dy > abs(dx)) { fired = true; Hap.click(); Sfx.coin(); onSwipeDown?.invoke() }
                              else if (abs(dx) > dp(40) && abs(dx) > dy) { fired = true; Hap.click(); Sfx.coin(); onSwipeSide?.invoke(if (dx > 0f) 1 else -1) }
                          }
                          wake(); invalidate()
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          val dx = e.x - x0; val dy = e.y - y0
                          if (e.actionMasked == MotionEvent.ACTION_UP && !fired && abs(dx) < dp(14) && abs(dy) < dp(14)) onTap?.invoke()
                          hint = 0; ox.t = 0f; oy.t = 0f; press.t = 1f; press.kick(2f); wake()
                      }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ bottom tool: swipeable mode strip, the LAST touched item is the chosen one
          class ModeStrip(ctx: Context, private val labels: List<String>, private val icons: List<String>) : AView(ctx) {
              var selected = 0
                  private set
              var onSelect: ((Int) -> Unit)? = null
              var accent = col("#7cff3a")
              private val lift = List(labels.size) { Spring(0f, 420f, 20f) }
              private val lp = tpaint(Fonts.vt, 13f, Color.WHITE, Paint.Align.CENTER)
              private var off = 0f
              private var offT = 0f
              private var startX = 0f
              private var startOff = 0f
              private var dragging = false

              init { lift[0].snap(1f) }

              private fun iw() = dp(54)
              private fun gap() = dp(4)
              private fun contentW() = labels.size * (iw() + gap()) - gap()
              private fun maxOff() = max(0f, contentW() - width)
              private fun x0() = if (contentW() < width) (width - contentW()) / 2f else 0f

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(resolveSize(dp(240).toInt(), w), dp(62).toInt()) }

              fun select(i: Int, notify: Boolean) {
                  selected = i
                  for (k in lift.indices) lift[k].t = if (k == i) 1f else 0f
                  offT = if (width <= 0) 0f else (i * (iw() + gap()) + iw() / 2 - width / 2f).coerceIn(0f, maxOff())
                  wake()
                  if (notify) onSelect?.invoke(i)
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { select(selected, false); off = offT }

              override fun step(dt: Float): Boolean {
                  var act = false
                  for (s in lift) { s.step(dt); if (!s.settled) act = true }
                  off += (offT - off) * (1f - exp(-dt * 14f))
                  if (abs(offT - off) > .5f) act = true else off = offT
                  return act
              }

              private fun indexAt(x: Float): Int {
                  val rel = x + off - x0()
                  if (rel < 0f) return -1
                  val i = floor(rel / (iw() + gap())).toInt()
                  val within = rel - i * (iw() + gap())
                  return if (i in labels.indices && within <= iw()) i else -1
              }

              override fun onDraw(c: Canvas) {
                  val iw = iw(); val ih = dp(46)
                  for (i in labels.indices) {
                      val x = x0() + i * (iw + gap()) - off
                      if (x > width || x + iw < 0) continue
                      val l = lift[i].x
                      val y = dp(12) - l * dp(7)
                      if (i == selected) Bevel.draw(c, x, y, x + iw, y + ih, col("#3d4a22"), col("#7cff3a"), col("#1f2810"), accent, dp(3), dp(2))
                      else Bevel.draw(c, x, y, x + iw, y + ih, col("#3c3c3c"), col("#8b8b8b"), col("#333333"), Color.BLACK, dp(3), dp(2))
                      Icons.draw(c, icons[i], x + iw * .2f, y + dp(4), iw * .6f)
                      shText(c, labels[i], x + iw / 2, y + ih - dp(5), lp, dp(1.5f))
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { parent?.requestDisallowInterceptTouchEvent(true); startX = e.x; startOff = off; dragging = false; return true }
                      MotionEvent.ACTION_MOVE -> {
                          if (abs(e.x - startX) > dp(8)) dragging = true
                          if (dragging && maxOff() > 0f) { offT = (startOff - (e.x - startX)).coerceIn(0f, maxOff()); off = offT; invalidate() }
                      }
                      MotionEvent.ACTION_UP -> {
                          val idx = indexAt(e.x)      // last touch point decides
                          if (idx >= 0 && idx != selected) { Hap.click(); Sfx.coin(); select(idx, true) }
                          else if (idx >= 0) { Hap.tick() }
                          wake()
                      }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ last-photo preview, right end of the bottom tool
          class ThumbView(ctx: Context) : AView(ctx) {
              var accent = col("#7cff3a")
              var onTap: (() -> Unit)? = null
              private var bmp: Bitmap? = null
              private val bp = Paint().apply { isFilterBitmap = false; isAntiAlias = false }
              private val press = Spring(1f, 520f, 24f)
              private var down = false

              fun setThumb(b: Bitmap?) {
                  if (b == null) { bmp = null; invalidate(); return }
                  val s = min(b.width, b.height)
                  val sq = Bitmap.createBitmap(b, (b.width - s) / 2, (b.height - s) / 2, s, s)
                  bmp = Bitmap.createScaledBitmap(sq, 28, 28, true)   // tiny on purpose: chunky pixel preview
                  invalidate()
              }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(dp(56).toInt(), dp(56).toInt()) }
              override fun step(dt: Float): Boolean { press.step(dt); return !press.settled }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  c.save(); c.scale(press.x, press.x, w / 2, h / 2)
                  Bevel.draw(c, 0f, 0f, w, h, col("#1a1a1a"), col("#6a6a6a"), col("#333333"), accent, dp(3), dp(2))
                  val b = bmp
                  if (b != null) c.drawBitmap(b, Rect(0, 0, b.width, b.height), RectF(dp(5), dp(5), w - dp(5), h - dp(5)), bp)
                  else Icons.draw(c, "grid", dp(14), dp(14), w - dp(28), .6f)
                  c.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { down = true; press.t = .9f; wake() }
                      MotionEvent.ACTION_UP -> {
                          val inside = e.x in 0f..width.toFloat() && e.y in 0f..height.toFloat()
                          if (down && inside) { Sfx.tick(); Hap.tick(); onTap?.invoke() }
                          down = false; press.t = 1f; press.kick(2f); wake()
                      }
                      MotionEvent.ACTION_CANCEL -> { down = false; press.t = 1f; wake() }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ preset tile (left vertical strip)
          class PresetTile(ctx: Context, private val idx: Int, private val name: String) : AView(ctx) {
              var picked = false
                  set(v) { field = v; invalidate() }
              var accent = col("#7cff3a")
              var onPick: ((Int) -> Unit)? = null
              private val sw = Look.swatch(idx)
              private val bp = Paint().apply { isAntiAlias = false }
              private val tp = tpaint(Fonts.vt, 11f, Color.WHITE, Paint.Align.CENTER)
              private val press = Spring(1f, 520f, 24f)
              private var down = false

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(dp(46).toInt(), dp(52).toInt()) }
              override fun step(dt: Float): Boolean { press.step(dt); return !press.settled }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  c.save(); c.scale(press.x, press.x, w / 2, h / 2)
                  if (picked) Bevel.draw(c, 0f, 0f, w, h, col("#3d4a22"), col("#7cff3a"), col("#1f2810"), accent, dp(3), dp(2))
                  else Bevel.draw(c, 0f, 0f, w, h, col("#3c3c3c"), col("#8b8b8b"), col("#333333"), Color.BLACK, dp(3), dp(2))
                  val s = dp(9); val gx = (w - 2 * s) / 2; val gy = dp(7)
                  for (i in 0 until 4) { bp.color = sw[i]; val x = gx + (i % 2) * s; val y = gy + (i / 2) * s; c.drawRect(x, y, x + s, y + s, bp) }
                  shText(c, name, w / 2, h - dp(6), tp, dp(1.2f))
                  c.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { down = true; press.t = .92f; wake() }
                      MotionEvent.ACTION_UP -> {
                          val inside = e.x in 0f..width.toFloat() && e.y in 0f..height.toFloat()
                          if (down && inside) { Hap.tick(); Sfx.tick(); onPick?.invoke(idx) }
                          down = false; press.t = 1f; press.kick(2f); wake()
                      }
                      MotionEvent.ACTION_CANCEL -> { down = false; press.t = 1f; wake() }
                  }
                  return true
              }
          }
