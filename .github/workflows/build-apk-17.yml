          package com.micampro

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.acos
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          /**
           * 360 RAW "globe + pin-point plane" guide.
           * Every pin is one tangent plane (one RAW frame) on the sphere around you. The globe is drawn from the camera's point of view:
           * aim the centre crosshair at the yellow pin, hold steady, the app fires a RAW capture and the pin turns green.
           */
          class GlobeView(ctx: Context) : View(ctx) {
              class Pin(val yaw: Float, val pitch: Float) {
                  var done = false
                  val v = FloatArray(3)
                  init {
                      val y = Math.toRadians(yaw.toDouble()); val p = Math.toRadians(pitch.toDouble())
                      v[0] = (sin(y) * cos(p)).toFloat(); v[1] = (cos(y) * cos(p)).toFloat(); v[2] = sin(p).toFloat()
                  }
              }

              val pins = ArrayList<Pin>()
              var accent = col("#7cff3a")
              private val f = floatArrayOf(0f, 1f, 0f)
              private val r = FloatArray(3)
              private val u = FloatArray(3)
              private val bp = Paint().apply { isAntiAlias = false; style = Paint.Style.FILL }
              private val tp = tpaint(Fonts.vt, 15f, Color.WHITE, Paint.Align.CENTER)
              private var lastInv = 0L

              init { reset() }

              fun reset() {
                  pins.clear()
                  for (i in 0 until 8) pins.add(Pin(i * 45f, 0f))
                  for (i in 0 until 6) pins.add(Pin(i * 60f + 30f, 45f))
                  for (i in 0 until 6) pins.add(Pin(i * 60f + 30f, -45f))
                  pins.add(Pin(0f, 90f)); pins.add(Pin(0f, -90f))
                  invalidate()
              }

              fun doneCount(): Int = pins.count { it.done }
              fun total(): Int = pins.size

              fun setDir(x: Float, y: Float, z: Float) {
                  f[0] = x; f[1] = y; f[2] = z
                  val now = SystemClock.uptimeMillis()
                  if (now - lastInv > 33) { lastInv = now; invalidate() }
              }

              private fun dot(a: FloatArray, b: FloatArray) = a[0] * b[0] + a[1] * b[1] + a[2] * b[2]

              fun angleTo(p: Pin): Float = Math.toDegrees(acos(dot(f, p.v).coerceIn(-1f, 1f).toDouble())).toFloat()

              fun nearestPending(): Pin? {
                  var best: Pin? = null; var ba = 999f
                  for (p in pins) if (!p.done) { val a = angleTo(p); if (a < ba) { ba = a; best = p } }
                  return best
              }

              private fun basis() {
                  // up = world Z with the forward component removed; right = forward x up
                  var ux = 0f; var uy = 0f; var uz = 1f
                  val d = f[2]
                  ux -= d * f[0]; uy -= d * f[1]; uz -= d * f[2]
                  var l = sqrt(ux * ux + uy * uy + uz * uz)
                  if (l < .05f) { ux = 0f; uy = 1f; uz = 0f; val d2 = f[1]; ux -= d2 * f[0]; uy -= d2 * f[1]; uz -= d2 * f[2]; l = sqrt(ux * ux + uy * uy + uz * uz) }
                  u[0] = ux / l; u[1] = uy / l; u[2] = uz / l
                  r[0] = f[1] * u[2] - f[2] * u[1]
                  r[1] = f[2] * u[0] - f[0] * u[2]
                  r[2] = f[0] * u[1] - f[1] * u[0]
              }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(dp(190).toInt(), dp(190).toInt()) }

              private fun disc(c: Canvas, cx: Float, cy: Float, rad: Float, color: Int) {
                  bp.color = color
                  val q = dp(2)
                  var y = -rad
                  while (y < rad) {
                      val yy = y + q / 2
                      val hw = sqrt(max(0f, rad * rad - yy * yy))
                      c.drawRect(cx - hw, cy + y, cx + hw, cy + y + q, bp)
                      y += q
                  }
              }

              private fun dotAt(c: Canvas, x: Float, y: Float, s: Float, color: Int) { bp.color = color; c.drawRect(x - s, y - s, x + s, y + s, bp) }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  val cx = w / 2; val cy = h / 2; val R = min(w, h) / 2 - dp(5)
                  basis()
                  disc(c, cx, cy, R + dp(3), Color.BLACK)
                  disc(c, cx, cy, R, 0xCC0C1420.toInt())
                  // lat / lon grid as chunky dots
                  val gp = IntArray(1)
                  for (latI in -2..2) {
                      val lat = Math.toRadians(latI * 30.0)
                      var a = 0
                      while (a < 360) {
                          val yw = Math.toRadians(a.toDouble())
                          grid(c, cx, cy, R, (sin(yw) * cos(lat)).toFloat(), (cos(yw) * cos(lat)).toFloat(), sin(lat).toFloat())
                          a += 6
                      }
                  }
                  for (lonI in 0 until 12) {
                      val yw = Math.toRadians(lonI * 30.0)
                      var la = -84
                      while (la <= 84) {
                          val lat = Math.toRadians(la.toDouble())
                          grid(c, cx, cy, R, (sin(yw) * cos(lat)).toFloat(), (cos(yw) * cos(lat)).toFloat(), sin(lat).toFloat())
                          la += 6
                      }
                  }
                  val next = nearestPending()
                  for (p in pins) {
                      val dd = dot(p.v, f)
                      if (dd < -.1f) continue
                      val sx = cx + dot(p.v, r) * R; val sy = cy - dot(p.v, u) * R
                      val sz = dp(if (p === next) 6 else 4)
                      dotAt(c, sx, sy, sz + dp(1.5f), Color.BLACK)
                      dotAt(c, sx, sy, sz, if (p.done) col("#5fb02f") else if (p === next) col("#fcdb5a") else col("#d8d8d8"))
                  }
                  // crosshair
                  bp.color = accent
                  val q = dp(2)
                  c.drawRect(cx - dp(12), cy - q / 2, cx - dp(4), cy + q / 2, bp); c.drawRect(cx + dp(4), cy - q / 2, cx + dp(12), cy + q / 2, bp)
                  c.drawRect(cx - q / 2, cy - dp(12), cx + q / 2, cy - dp(4), bp); c.drawRect(cx - q / 2, cy + dp(4), cx + q / 2, cy + dp(12), bp)
                  shText(c, doneCount().toString() + "/" + total(), cx, h - dp(2), tp, dp(1.5f))
              }

              private fun grid(c: Canvas, cx: Float, cy: Float, R: Float, x: Float, y: Float, z: Float) {
                  val d = x * f[0] + y * f[1] + z * f[2]
                  if (d < 0f) return
                  val sx = cx + (x * r[0] + y * r[1] + z * r[2]) * R
                  val sy = cy - (x * u[0] + y * u[1] + z * u[2]) * R
                  bp.color = 0x44FFFFFF
                  c.drawRect(sx - dp(.75f), sy - dp(.75f), sx + dp(.75f), sy + dp(.75f), bp)
              }
          }
