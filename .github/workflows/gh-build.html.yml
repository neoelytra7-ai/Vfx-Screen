<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GH Build Runner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--bd:#2a2f3a;--tx:#e6e8ee;--mu:#8b93a7;--ac:#7c9cff;--ok:#3ecf8e;--er:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f5f6f9;--card:#fff;--bd:#dde1ea;--tx:#161a23;--mu:#6a7388;--ac:#3b5bdb;--ok:#12a064;--er:#d63939}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif;padding:16px}
main{max-width:760px;margin:auto;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h1{font-size:18px;margin:0 0 2px}.mu{color:var(--mu);font-size:12px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:26px;text-align:center;cursor:pointer;color:var(--mu)}
#drop.on{border-color:var(--ac);color:var(--ac)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}
button:disabled{opacity:.5;cursor:default}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{display:flex;gap:8px;align-items:center;color:var(--mu)}
li b{width:18px;text-align:center}
li.run{color:var(--tx)}li.ok{color:var(--ok)}li.er{color:var(--er)}
pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:50vh;overflow:auto}
#err pre{border-color:var(--er)}
a{color:var(--ac)}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>GH Build Runner</h1>
    <div class="mu">Upload yml → commit → build → error langsung tampil / debug.zip langsung terunduh.</div>
    <div class="row">
      <div><label>Repo (owner/repo)</label><input id="repo" placeholder="user/Vfx-Screen"></div>
      <div><label>Branch</label><input id="br" value="main"></div>
    </div>
    <label>Token GitHub (scope: repo + workflow)</label>
    <input id="tok" type="password" placeholder="ghp_… / github_pat_…">
    <div class="mu" style="margin-top:6px">Tersimpan hanya di browser ini (localStorage).</div>
  </div>

  <div class="card">
    <div id="drop">Drop file .yml di sini atau klik untuk pilih</div>
    <input id="file" type="file" accept=".yml,.yaml" hidden>
    <div id="fn" class="mu" style="margin-top:8px"></div>
  </div>

  <div class="card" id="prog" hidden>
    <ol id="steps"></ol>
    <div id="done" style="margin-top:10px"></div>
  </div>

  <div class="card" id="err" hidden>
    <b style="color:var(--er)">Main error</b>
    <pre id="errtx"></pre>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="g" id="cp">Copy error</button>
      <a id="runlink" target="_blank" rel="noopener" style="align-self:center">Buka run di GitHub</a>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
['repo','br','tok'].forEach(k=>{const v=LS.get('ghb_'+k);if(v)$(k).value=v;$(k).addEventListener('input',()=>LS.set('ghb_'+k,$(k).value.trim()))});

let file=null;
const drop=$('drop'),fi=$('file');
drop.onclick=()=>fi.click();
fi.onchange=()=>pick(fi.files[0]);
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',ev=>pick(ev.dataTransfer.files[0]));

const STEPS=['Commit yml','Tunggu workflow mulai','Build berjalan','Ambil hasil'];
function ui(){ $('steps').innerHTML=STEPS.map((s,i)=>`<li id="s${i}"><b>○</b>${s}</li>`).join(''); }
function st(i,cls,txt){const el=$('s'+i);el.className=cls;el.innerHTML=`<b>${cls==='ok'?'✓':cls==='er'?'✕':cls==='run'?'…':'○'}</b>${txt||STEPS[i]}`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(path,opt={},raw){
  let r;try{r=await fetch(path.startsWith('http')?path:'https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+$('tok').value.replace(/[^\x21-\x7e]/g,''),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}})}catch(e){throw new Error(e.message+' | Network/CORS gagal di: '+path.replace(/\?.*/,'')+'\nCek: dibuka lokal (file://) bukan lewat preview Claude, internet, adblock/VPN.')}
  if(raw)return r;
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(`${r.status} ${m||r.statusText} (${path})`)}
  return r.status===204?null:r.json();
}
function b64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

async function pick(f){
  if(!f)return;
  file=f;$('fn').textContent=f.name+' · '+(f.size/1024).toFixed(0)+' KB';
  const repo=$('repo').value.trim(),br=$('br').value.trim()||'main';
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!$('tok').value.trim()){alert('Isi repo & token dulu.');return}
  $('prog').hidden=false;$('err').hidden=true;$('done').innerHTML='';ui();
  try{await run(f,repo,br)}catch(e){
    const i=STEPS.findIndex((_,k)=>$('s'+k).className==='run');
    if(i>=0)st(i,'er',STEPS[i]+' — gagal');
    showErr(String(e.message||e),null);
  }
}

async function run(f,repo,br){
  const wf=f.name.replace(/\.ya?ml$/i,'').replace(/[^\w.-]+/g,'-').replace(/^-+|-+$/g,'')+'.yml';
  const path='.github/workflows/'+wf;
  // 1. commit
  st(0,'run');
  let sha;
  try{sha=(await api(`/repos/${repo}/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}?ref=${br}`)).sha}catch(e){if(!/^404/.test(e.message))throw e}
  const put=await api(`/repos/${repo}/contents/${path}`,{method:'PUT',body:JSON.stringify({message:'ci: update '+wf,content:b64(await f.arrayBuffer()),branch:br,...(sha?{sha}:{})})});
  const head=put.commit.sha;
  st(0,'ok');
  // 2. cari run
  st(1,'run');
  let rn=null;const t0=Date.now();let dispatched=false;
  while(!rn){
    const j=await api(`/repos/${repo}/actions/runs?head_sha=${head}&per_page=5`);
    rn=j.workflow_runs[0]||null;
    if(!rn){
      if(!dispatched&&Date.now()-t0>25000){
        try{await api(`/repos/${repo}/actions/workflows/${wf}/dispatches`,{method:'POST',body:JSON.stringify({ref:br})});dispatched=true;st(1,'run','Trigger manual (workflow_dispatch)…')}catch(e){}
      }
      if(dispatched){
        const j2=await api(`/repos/${repo}/actions/runs?branch=${br}&per_page=5`);
        rn=j2.workflow_runs.find(x=>new Date(x.created_at)>=new Date(t0-5000))||null;
      }
      if(!rn&&Date.now()-t0>120000)throw new Error('Workflow run tidak muncul. Cek trigger "on:" di yml & branch.');
      if(!rn)await sleep(3000);
    }
  }
  $('runlink').href=rn.html_url;
  st(1,'ok');
  // 3. tunggu build
  st(2,'run');
  while(true){
    rn=await api(`/repos/${repo}/actions/runs/${rn.id}`);
    try{
      const jb=(await api(`/repos/${repo}/actions/runs/${rn.id}/jobs`)).jobs[0];
      const cur=jb&&jb.steps&&jb.steps.find(s=>s.status==='in_progress');
      if(cur)st(2,'run','Build berjalan · '+cur.name);
    }catch(e){}
    if(rn.status==='completed')break;
    await sleep(5000);
  }
  // 4. hasil
  st(3,'run');
  if(rn.conclusion==='success'){
    st(2,'ok');
    await download(repo,rn);
    st(3,'ok');
  }else{
    st(2,'er','Build '+rn.conclusion);
    const msg=await mainError(repo,rn);
    st(3,'ok');
    showErr(msg,rn.html_url);
  }
}

async function download(repo,rn){
  const arts=(await api(`/repos/${repo}/actions/runs/${rn.id}/artifacts`)).artifacts;
  if(arts.length){
    const r=await api(`/repos/${repo}/actions/artifacts/${arts[0].id}/zip`,{},true);
    if(!r.ok)throw new Error('Download artifact gagal: '+r.status);
    dl(await r.blob(),'debug.zip');
    $('done').innerHTML='<span style="color:var(--ok)">Sukses — debug.zip terunduh (artifact '+arts[0].name+').</span>';
    return;
  }
  // fallback: asset release yang dibuat workflow (mis. nightly)
  const rels=(await api(`/repos/${repo}/releases?per_page=5`)).filter(x=>x.target_commitish===rn.head_sha||new Date(x.created_at)>=new Date(rn.run_started_at));
  const rel=rels[0];
  if(!rel||!rel.assets.length){$('done').innerHTML='<span style="color:var(--ok)">Build sukses</span>, tapi tidak ada artifact/release asset untuk diunduh.';return}
  const z=new JSZip();
  for(const a of rel.assets){
    const r=await api(`/repos/${repo}/releases/assets/${a.id}`,{headers:{Accept:'application/octet-stream'}},true);
    if(!r.ok)throw new Error('Download asset gagal: '+a.name);
    z.file(a.name,await r.blob());
  }
  dl(await z.generateAsync({type:'blob'}),'debug.zip');
  $('done').innerHTML='<span style="color:var(--ok)">Sukses — debug.zip terunduh ('+rel.assets.map(a=>a.name).join(', ')+').</span>';
}

async function mainError(repo,rn){
  const jobs=(await api(`/repos/${repo}/actions/runs/${rn.id}/jobs`)).jobs;
  const jb=jobs.find(j=>j.conclusion==='failure')||jobs[0];
  const fs=jb.steps.find(s=>s.conclusion==='failure');
  const r=await api(`/repos/${repo}/actions/jobs/${jb.id}/logs`,{},true);
  if(!r.ok)return `Job gagal di step "${fs?fs.name:'?'}" (log tidak bisa diambil: ${r.status}).`;
  const L=(await r.text()).split('\n').map(l=>l.replace(/^\d{4}-\d\d-\d\dT[\d:.]+Z ?/,''));
  const out=[];
  // 1) error Kotlin/Java compiler
  const ke=[...new Set(L.filter(l=>/^(e: |.*\.kt:\d+:\d+ |.*error: )/.test(l)&&!/^\s*$/.test(l)).map(l=>l.replace(/file:\/\/\/.*?\/(Vfx-Screen|work)\/[^/]+\//,'')))].slice(0,8);
  if(ke.length)out.push(ke.join('\n'));
  // 2) blok "What went wrong"
  const w=L.findIndex(l=>l.includes('What went wrong'));
  if(w>=0)out.push(L.slice(w,w+5).join('\n'));
  // 3) ##[error]
  if(!out.length){
    const ge=L.filter(l=>l.startsWith('##[error]')).slice(0,5);
    if(ge.length)out.push(ge.join('\n'));
    else out.push(L.slice(-25).join('\n'));
  }
  return (fs?`Step gagal: ${fs.name}\n\n`:'')+out.join('\n\n');
}

function showErr(msg,link){
  $('err').hidden=false;$('errtx').textContent=msg;
  $('runlink').style.display=link?'':'none';if(link)$('runlink').href=link;
  $('err').scrollIntoView({behavior:'smooth'});
}
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('errtx').textContent);$('cp').textContent='Copied ✓';setTimeout(()=>$('cp').textContent='Copy error',1500)}catch(e){}};
</script>
</body>
</html>
