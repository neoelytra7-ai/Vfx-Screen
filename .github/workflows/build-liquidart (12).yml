      - name: Build debug APK
        run: cd liquidart && gradle assembleDebug --no-daemon --console=plain > /tmp/b.log 2>&1
      - name: Compile errors
        if: failure()
        run: |
          grep -m20 '^e: ' /tmp/b.log | sed 's#file://[^ ]*/liquid/##' | cut -c1-240 || true
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidArt-debug-apk
          path: liquidart/app/build/outputs/apk/debug/*.apk
