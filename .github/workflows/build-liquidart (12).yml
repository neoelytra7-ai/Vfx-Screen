          if(b>0f){val rr=diag*b*b*1.15f;drawCircle(Color.White.copy(.45f*(1f-b)),rr,Offset(cx,cy),style=Stroke(3f));drawCircle(Color.Black,rr,Offset(cx,cy),blendMode=BlendMode.Clear)}}
          Text("LiquidArt",Modifier.align(Alignment.Center).offset(y=(-64).dp),color=Color.White.copy(alpha=ta),fontSize=34.sp,letterSpacing=(10f*(1f-ta)+2f).sp)}}
          @Composable fun App(){
          LaunchedEffect(Unit){if(Cur.inp["splash"]==0f){Cur.splash=false;Cur.boot=99;Cur.menu=true}}
          LaunchedEffect(Cur.msg){if(Cur.msg.isNotEmpty()){delay(2500);Cur.msg=""}}
