          T(BLENDS[i].first,15,Modifier.fillMaxWidth().clickable{Cur.layers.getOrNull(Cur.sel)?.mode=i;Cur.pm=false;if(Cur.lay["excl"]==1f)Cur.pl=true;Cur.rq()}.padding(9.dp))}}}
          Glass(6,Cur.hud&&ui&&!Cur.edit,Modifier.align(Alignment.TopCenter).offset{IntOffset(0,(.16f*Cur.sh).roundToInt())},rad=26f){Hud()}
          Glass(8,Cur.hs&&ui&&!Cur.edit&&!Cur.pc,Modifier.align(Alignment.TopCenter).offset{IntOffset(0,(.27f*Cur.sh).roundToInt())},rad=24f){
          Row(Modifier.padding(horizontal=12.dp,vertical=4.dp),verticalAlignment=Alignment.CenterVertically){T("Selection active",13);Chip("Invert",false){Cur.q{Cur.r?.selInvert()}};Chip("Deselect",false){Cur.q{Cur.r?.deselect()}}}}
          Glass(7,Cur.edit,Modifier.align(Alignment.BottomCenter).padding(bottom=96.dp),rad=26f){
          EditBar()}
          Glass(10,Cur.pc&&ui,Modifier.align(Alignment.TopCenter).offset{IntOffset(0,(.285f*Cur.sh).roundToInt())},rad=30f){ColorFloat()}
