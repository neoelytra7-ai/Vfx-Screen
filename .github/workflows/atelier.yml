          uniform vec3 uEye; uniform vec3 uRight; uniform vec3 uUp; uniform vec3 uFwd;
          uniform float uTanF; uniform float uAspect; uniform vec2 uJit; uniform vec2 uRes;
          uniform int uSteps; uniform int uMode; uniform int uGround; uniform int uTopOn; uniform int uBotOn; uniform int uShoeOn; uniform int uSkirtOn;
          uniform sampler2D uPrev; uniform float uW; uniform vec3 uCenter; uniform int uPelvisBone; uniform int uEyeBone0; uniform int uEyeBone1;
          uniform vec3 uSkin; uniform vec3 uLipC; uniform vec3 uBrowC; uniform vec3 uHairC; uniform vec3 uEyeC; uniform vec3 uBg1; uniform vec3 uBg2;
          uniform vec3 uLdir[3]; uniform vec3 uLcol[3]; uniform float uAmb; uniform float uShadowSoft; uniform float uGloss;
          uniform vec4 uCA[3]; uniform vec4 uCB[3]; uniform vec4 uCC[3];
          uniform vec3 uSeg[16]; uniform float uSegOn[4];
          uniform vec3 uHem; uniform vec3 uHemN; uniform vec3 uWaist; uniform vec3 uNeck; uniform float uNeckR;
          uniform vec4 uFold[5]; uniform vec3 uFoldDir[5];
          uniform vec4 uSkirt; uniform vec3 uShoeP[2]; uniform vec3 uShoeN[2];
          out vec4 fragColor;

          float hash13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
          float sdCap(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a; vec3 ba = b - a; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0); return length(pa - ba * h) - r; }
          float remTube(vec3 p, int i, float r) {
              if (uSegOn[i] < 0.5) return 1000.0;
              vec3 a0 = uSeg[4 * i]; vec3 b0 = uSeg[4 * i + 1]; vec3 a1 = uSeg[4 * i + 2]; vec3 b1 = uSeg[4 * i + 3];
              float r0 = max(sdCap(p, a0, b0, r), -dot(p - a0, normalize(b0 - a0)));
              float r1 = max(sdCap(p, a1, b1, r), -dot(p - a1, normalize(b1 - a1)));
              return min(r0, r1);
          }
          float wrinkle(vec3 p, int idx) {
              float amp = uCC[idx].y; float fr = uCC[idx].z;
              if (amp <= 0.0) return 0.0;
              float w = amp * 0.0022 * sin(dot(p, vec3(37.0, 53.0, 41.0)) * fr * 0.1) * sin(dot(p, vec3(-43.0, 29.0, 47.0)) * fr * 0.1);
              for (int i = 0; i < 5; i++) {
                  float m = uFold[i].w * smoothstep(0.15, 0.0, length(p - uFold[i].xyz));
                  w += amp * 0.006 * m * sin(dot(p - uFold[i].xyz, uFoldDir[i]) * fr * 2.2 + float(i));
              }
              return w;
          }
          float topD(vec3 p, float dt) {
              float d = dt - uCC[0].x - wrinkle(p, 0);
              d = max(d, -dot(p - uHem, uHemN));
              d = max(d, -(length((p - uNeck) * vec3(1.0, 1.0, 0.85)) - uNeckR));
              d = max(d, -remTube(p, 0, 0.07));
              d = max(d, -remTube(p, 1, 0.07));
              return d;
          }
          float botD(vec3 p, float db) {
              float d = db - uCC[1].x - wrinkle(p, 1);
              d = max(d, dot(p - uWaist, uHemN));
              d = max(d, -remTube(p, 2, 0.095));
              d = max(d, -remTube(p, 3, 0.095));
              return d;
          }
          float skirtD(vec3 p) {
              vec3 q = toLocal(p, uPelvisBone);
              float L = uSkirt.x; float yy = 0.075 - q.y; float t = clamp(yy / L, 0.0, 1.0);
              float rho = length(vec3(q.x, 0.0, q.z)); float ang = atan(q.x, q.z);
              float R = 0.16 + uCC[1].x + uSkirt.y * t * t + uSkirt.z * 0.012 * sin(ang * 16.0) * t;
              float d = abs(rho - R) - uSkirt.w;
              d = max(d, max(-yy, yy - L));
              return d - wrinkle(p, 1);
          }
          float shoeD(vec3 p, float ds) {
              float d = ds - uCC[2].x;
              float d0 = length(p - uShoeP[0]); float d1 = length(p - uShoeP[1]);
              if (d0 < d1) d = max(d, dot(p - uShoeP[0], uShoeN[0])); else d = max(d, dot(p - uShoeP[1], uShoeN[1]));
              return d;
          }
          float mapAll(vec3 p) {
              Hit h = evalBody(p);
              float d = min(h.skin, min(h.hair, h.eye));
              if (uTopOn > 0) d = min(d, topD(p, h.top));
              if (uBotOn > 0) { if (uSkirtOn > 0) d = min(d, skirtD(p)); else d = min(d, botD(p, h.bot)); }
              if (uShoeOn > 0) d = min(d, shoeD(p, h.shoe));
              return d;
          }
          vec3 calcN(vec3 p) {
              vec2 e = vec2(1.0, -1.0) * 0.0006;
              return normalize(e.xyy * mapAll(p + e.xyy) + e.yyx * mapAll(p + e.yyx) + e.yxy * mapAll(p + e.yxy) + e.xxx * mapAll(p + e.xxx));
          }
          float softShadow(vec3 ro, vec3 rd, float k) {
              float res = 1.0; float t = 0.02;
              for (int i = 0; i < 28; i++) {
                  float h = mapAll(ro + rd * t);
                  res = min(res, k * h / t);
                  t += clamp(h, 0.01, 0.12);
                  if (res < 0.001 || t > 2.5) break;
              }
              return clamp(res, 0.0, 1.0);
          }
          float calcAO(vec3 p, vec3 n) {
              float occ = 0.0; float sc = 1.0;
              for (int i = 1; i <= 5; i++) { float h = 0.012 * float(i) * float(i) * 0.6; occ += (h - mapAll(p + n * h)) * sc; sc *= 0.7; }
              return clamp(1.0 - 3.2 * occ, 0.0, 1.0);
          }
          vec3 hsv(float h, float s, float v) { vec3 k = abs(fract(vec3(h) + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0); return v * mix(vec3(1.0), clamp(k - 1.0, 0.0, 1.0), s); }
          vec3 clothCol(int i, vec3 p) {
              vec3 c1 = uCA[i].xyz; vec3 c2 = uCB[i].xyz; float sc = uCB[i].w; int pat = int(uCA[i].w + 0.5); float m = 0.0;
              vec3 q = p * sc;
              if (pat == 1) m = step(0.5, fract(q.y * 6.0));
              else if (pat == 2) m = step(0.5, fract(q.x * 6.0 + q.z * 6.0));
              else if (pat == 3) m = abs(step(0.5, fract(q.x * 5.0)) - step(0.5, fract(q.y * 5.0)));
              else if (pat == 4) { vec2 g = fract(vec2(q.x + q.z, q.y) * 6.0) - 0.5; m = step(length(g), 0.22); }
              return mix(c1, c2, m);
          }
          vec3 lightAll(vec3 p, vec3 n, vec3 rd, vec3 alb, float spec, float shin, float sss, float ao, float shadowOn) {
              vec3 col = alb * uAmb * mix(vec3(0.55, 0.6, 0.7), vec3(1.0), n.y * 0.5 + 0.5) * ao;
              for (int i = 0; i < 3; i++) {
                  vec3 l = normalize(uLdir[i]);
                  float nl = dot(n, l);
                  float wrap = sss;
                  float dif = clamp((nl + wrap) / (1.0 + wrap), 0.0, 1.0);
                  float sh = 1.0;
                  if (i == 0 && shadowOn > 0.5) sh = softShadow(p + n * 0.004, l, uShadowSoft);
                  vec3 h = normalize(l - rd);
                  float sp = pow(clamp(dot(n, h), 0.0, 1.0), shin) * spec * step(0.0, nl);
                  float fr = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 4.0);
                  vec3 sc = vec3(1.0, 0.35, 0.25) * sss * pow(clamp(1.0 - abs(nl), 0.0, 1.0), 3.0) * 0.5;
                  col += uLcol[i] * (alb * (dif + sc) * sh * (0.5 + 0.5 * ao) + sp * sh) + uLcol[i] * fr * spec * 0.15 * ao;
              }
              return col;
          }
          vec3 shadeSurf(vec3 p, vec3 rd, out float ok) {
              ok = 1.0;
              Hit h = evalBody(p);
              float dSk = min(h.skin, min(h.hair, h.eye));
              float dT = uTopOn > 0 ? topD(p, h.top) : 1000.0;
              float dB = 1000.0;
              if (uBotOn > 0) dB = (uSkirtOn > 0) ? skirtD(p) : botD(p, h.bot);
              float dS = uShoeOn > 0 ? shoeD(p, h.shoe) : 1000.0;
              float dm = min(min(dSk, dT), min(dB, dS));
              vec3 n = calcN(p);
              float ao = calcAO(p, n);
              if (uMode == 3) return n * 0.5 + 0.5;
              vec3 col;
              if (dm == dT) {
                  vec3 alb = clothCol(0, p);
                  float wv = 0.5 + 0.5 * sin(p.x * 900.0) * sin(p.y * 900.0);
                  n = normalize(n + 0.08 * vec3(sin(p.y * 700.0), sin(p.z * 700.0), sin(p.x * 700.0)) * wv);
                  col = lightAll(p, n, rd, alb * (0.95 + 0.05 * wv), 0.15 * uCC[0].w, 20.0, 0.1, ao, 1.0);
                  col += uCC[0].w * pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0) * alb * 0.35;
              } else if (dm == dB) {
                  vec3 alb = clothCol(1, p);
                  n = normalize(n + 0.06 * vec3(sin(p.y * 700.0), sin(p.z * 700.0), sin(p.x * 700.0)));
                  col = lightAll(p, n, rd, alb, 0.12 * uCC[1].w, 20.0, 0.1, ao, 1.0);
                  col += uCC[1].w * pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0) * alb * 0.35;
              } else if (dm == dS) {
                  vec3 alb = clothCol(2, p);
                  col = lightAll(p, n, rd, alb, 0.3, 30.0, 0.05, ao, 1.0);
              } else if (dm == h.hair) {
                  vec3 T = normalize(vec3(0.0, -1.0, 0.0) - n * dot(n, vec3(0.0, -1.0, 0.0)));
                  col = vec3(0.0);
                  for (int i = 0; i < 3; i++) {
                      vec3 l = normalize(uLdir[i]); vec3 hh = normalize(l - rd);
                      float th = dot(T, hh); float sp = pow(sqrt(max(1.0 - th * th, 0.0)), 60.0) * uGloss;
                      col += uLcol[i] * (uHairC * max(dot(n, l) * 0.6 + 0.4, 0.0) + vec3(sp) * 0.6 * uHairC + vec3(sp) * 0.15);
