                  }
                  c.waist = floatArrayOf(p0[0] + (p1[0] - p0[0]) * 0.65f, p0[1] + (p1[1] - p0[1]) * 0.65f, p0[2] + (p1[2] - p0[2]) * 0.65f)
                  val drop = P.g("neck_drop"); val cw = B.W[bi["chest"]!!]
                  val lx = 0f; val ly = 0.15f - 0.09f * drop; val lz = 0.03f + 0.06f * drop
                  c.neck = floatArrayOf(cw[9] + cw[0] * lx + cw[1] * ly + cw[2] * lz, cw[10] + cw[3] * lx + cw[4] * ly + cw[5] * lz, cw[11] + cw[6] * lx + cw[7] * ly + cw[8] * lz)
                  c.neckR = P.g("neckline")
                  var fi = 0
                  fun fold(pos: FloatArray, d: FloatArray, bend: Float) {
                      for (k in 0..2) { c.foldP[fi * 4 + k] = pos[k]; c.foldD[fi * 3 + k] = d[k] }
                      c.foldP[fi * 4 + 3] = bend.coerceIn(0f, 1f); fi++
