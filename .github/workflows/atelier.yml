name: Build Atelier
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write sources
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Atelier"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.atelier.figure"
              compileSdk = 34
              defaultConfig { applicationId = "com.atelier.figure"; minSdk = 29; targetSdk = 34; versionCode = 1; versionName = "1.0"; ndk { abiFilters += listOf("arm64-v8a") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <application android:label="Atelier Figure" android:largeHeap="true" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/atelier/figure/Defs.kt)
          cat > app/src/main/java/com/atelier/figure/Defs.kt <<'EOF'
          package com.atelier.figure

          import android.content.Context
          import java.util.concurrent.ConcurrentHashMap

          class Prm(val k: String, val t: String, val lo: Float, val hi: Float, val d: Float, val sw: Boolean = false)

          object P {
              val v = ConcurrentHashMap<String, Float>()
              private var prefs: android.content.SharedPreferences? = null
              fun g(k: String): Float = v[k] ?: Defs.def[k] ?: 0f
              fun i(k: String): Int = g(k).toInt()
              fun s(k: String, x: Float) { v[k] = x; prefs?.edit()?.putFloat(k, x)?.apply() }
              fun init(c: Context) {
                  prefs = c.getSharedPreferences("atelier", Context.MODE_PRIVATE)
                  for ((k, x) in prefs!!.all) if (x is Float) v[k] = x
              }
              fun reset(keys: List<String>) { val e = prefs?.edit(); for (k in keys) { v.remove(k); e?.remove(k) }; e?.apply() }
          }

          object Defs {
              const val SLIDERS = "abs_def,ankle_th,arm_len,belly,bicep_def,bone_def,brow,bust,bust_h,bust_sep,calf_def,calf_th,cheek,chest_d,chest_w,chin,delt_def,ear_size,eye_h,eye_sep,eye_size,face_len,face_w,fat,finger_len,finger_th,foot_len,foot_w,forearm_def,forearm_len,forearm_th,glute,hair_len,hair_vol,ham_def,hand_size,head_size,height,hip_d,hip_w,jaw_w,knee_sz,lat_def,leg_len,lip_full,lip_w,mouth_h,muscle,neck_len,neck_th,nose_br,nose_len,nose_tip,nose_w,obl_def,pec_def,quad_def,ribcage,shin_len,shoulder_w,thigh_gap,thigh_len,thigh_th,torso_len,trap_def,tricep_def,upperarm_th,waist_d,waist_w,wrist_th"
              const val BONES = "root,pelvis,spine1,spine2,chest,neck,head,jaw,eyeL,eyeR,clavL,uarmL,farmL,handL,fL_idx0,fL_idx1,fL_idx2,fL_mid0,fL_mid1,fL_mid2,fL_rng0,fL_rng1,fL_rng2,fL_pnk0,fL_pnk1,fL_pnk2,fL_thm0,fL_thm1,fL_thm2,thighL,shinL,footL,toeL,clavR,uarmR,farmR,handR,fR_idx0,fR_idx1,fR_idx2,fR_mid0,fR_mid1,fR_mid2,fR_rng0,fR_rng1,fR_rng2,fR_pnk0,fR_pnk1,fR_pnk2,fR_thm0,fR_thm1,fR_thm2,thighR,shinR,footR,toeR"
              private fun nice(k: String) = k.replace('_', ' ').replaceFirstChar { it.uppercase() }
              private fun sl(vararg n: String) = n.map { Prm(it, nice(it), -1f, 1f, 0f) }
              private fun p(k: String, t: String, lo: Float, hi: Float, d: Float, sw: Boolean = false) = Prm(k, t, lo, hi, d, sw)

              val JOINTS = listOf("pelvis", "spine1", "spine2", "chest", "neck", "head", "clavL", "clavR", "uarmL", "uarmR", "farmL", "farmR", "handL", "handR", "thighL", "thighR", "shinL", "shinR", "footL", "footR", "toeL", "toeR")
              val FLEX_SIGN = mapOf("uarm" to -1f, "farm" to -1f, "hand" to -1f, "thigh" to -1f, "foot" to -1f, "toe" to -1f)
              fun jointRange(j: String): FloatArray = when {
                  j.startsWith("farm") -> floatArrayOf(-10f, 150f, -90f, 90f, -30f, 30f)
                  j.startsWith("shin") -> floatArrayOf(-10f, 150f, -40f, 40f, -10f, 10f)
                  j.startsWith("thigh") -> floatArrayOf(-120f, 60f, -60f, 60f, -50f, 60f)
                  j.startsWith("uarm") -> floatArrayOf(-80f, 180f, -90f, 90f, -30f, 150f)
                  j.startsWith("hand") -> floatArrayOf(-70f, 70f, -60f, 60f, -40f, 40f)
                  j.startsWith("foot") -> floatArrayOf(-45f, 45f, -30f, 30f, -30f, 30f)
                  j.startsWith("toe") -> floatArrayOf(-30f, 60f, -5f, 5f, -10f, 10f)
                  j.startsWith("clav") -> floatArrayOf(-20f, 20f, -10f, 10f, -20f, 30f)
                  else -> floatArrayOf(-60f, 60f, -60f, 60f, -45f, 45f)
              }
              val POSE_PRESETS: LinkedHashMap<String, Map<String, Float>> = linkedMapOf(
                  "A-pose" to emptyMap<String, Float>(),
                  "T-pose" to mapOf("j_uarmL_z" to 72f, "j_uarmR_z" to 72f),
                  "Contrapposto" to mapOf("j_pelvis_z" to 6f, "j_spine1_z" to -4f, "j_chest_z" to -3f, "j_head_z" to 4f, "j_thighL_x" to 4f, "j_thighL_z" to 4f, "j_shinL_x" to 8f, "j_thighR_z" to -3f, "j_uarmL_z" to 4f, "j_farmL_x" to 25f, "j_farmR_x" to 12f, "root_y" to -0.01f),
                  "Walk" to mapOf("j_uarmL_x" to 25f, "j_farmL_x" to 35f, "j_uarmR_x" to -20f, "j_farmR_x" to 15f, "j_thighL_x" to 28f, "j_shinL_x" to 10f, "j_thighR_x" to -18f, "j_shinR_x" to 35f, "j_spine1_y" to 6f, "j_chest_y" to -8f, "j_pelvis_y" to -6f, "j_head_y" to 5f),
                  "Sit" to mapOf("j_thighL_x" to 90f, "j_thighR_x" to 90f, "j_shinL_x" to 90f, "j_shinR_x" to 90f, "root_y" to -0.44f, "j_uarmL_x" to 25f, "j_uarmR_x" to 25f, "j_farmL_x" to 75f, "j_farmR_x" to 75f, "j_spine2_x" to 6f),
                  "Arms up" to mapOf("j_uarmL_x" to 175f, "j_uarmR_x" to 175f, "j_farmL_x" to 8f, "j_farmR_x" to 8f, "j_head_x" to -10f),
                  "Dynamic" to mapOf("j_spine1_x" to 14f, "j_chest_y" to 20f, "j_uarmL_x" to 90f, "j_uarmL_z" to 30f, "j_farmL_x" to 50f, "j_uarmR_x" to -40f, "j_thighL_x" to 55f, "j_shinL_x" to 70f, "j_thighR_x" to -25f, "j_shinR_x" to 20f, "root_y" to -0.04f)
              )
              val TABS: LinkedHashMap<String, List<Prm>> = linkedMapOf(
                  "Body" to sl("height", "torso_len", "shoulder_w", "chest_w", "chest_d", "ribcage", "waist_w", "waist_d", "belly", "hip_w", "hip_d", "glute", "bust", "bust_sep", "bust_h", "fat", "neck_len", "neck_th", "arm_len", "forearm_len", "upperarm_th", "forearm_th", "wrist_th", "hand_size", "finger_len", "finger_th", "leg_len", "thigh_len", "shin_len", "thigh_th", "thigh_gap", "calf_th", "knee_sz", "ankle_th", "foot_len", "foot_w"),
                  "Muscle" to sl("muscle", "delt_def", "pec_def", "trap_def", "lat_def", "abs_def", "obl_def", "bicep_def", "tricep_def", "forearm_def", "quad_def", "ham_def", "calf_def", "bone_def"),
                  "Face" to sl("head_size", "face_w", "face_len", "jaw_w", "chin", "cheek", "brow", "eye_size", "eye_sep", "eye_h", "nose_len", "nose_w", "nose_tip", "nose_br", "lip_full", "lip_w", "mouth_h", "ear_size") +
                      listOf(p("jaw_open", "Mouth open", 0f, 30f, 0f), p("gazeX", "Gaze left/right", -30f, 30f, 0f), p("gazeY", "Gaze up/down", -25f, 25f, 0f)),
                  "Hair" to sl("hair_len", "hair_vol") + listOf(p("hair_h", "Hair hue", 0f, 1f, 0.07f), p("hair_s", "Hair saturation", 0f, 1f, 0.6f), p("hair_v", "Hair value", 0f, 1f, 0.35f), p("hair_gloss", "Hair gloss", 0f, 2f, 1f)),
                  "Skin" to listOf(p("skin_tone", "Skin tone", 0f, 1f, 0.25f), p("skin_red", "Blush / warmth", 0f, 1f, 0.25f), p("lip_s", "Lip color", 0f, 1f, 0.5f), p("brow_dark", "Brow darkness", 0f, 1f, 0.5f),
                      p("eyec_h", "Iris hue", 0f, 1f, 0.58f), p("eyec_s", "Iris saturation", 0f, 1f, 0.6f), p("eyec_v", "Iris value", 0f, 1f, 0.55f), p("skin_gloss", "Skin sheen", 0f, 2f, 1f)),
                  "Outfit" to listOf(
                      p("top_on", "Top", 0f, 1f, 1f, true), p("top_sleeve", "Sleeve length", 0f, 1.05f, 0.25f), p("top_hem", "Hem height", -0.6f, 1f, 0.12f), p("neckline", "Neckline size", 0.04f, 0.15f, 0.085f), p("neck_drop", "Neckline drop", 0f, 1f, 0.3f),
                      p("top_loose", "Top looseness", 0f, 0.05f, 0.008f), p("top_h", "Top hue", 0f, 1f, 0.58f), p("top_s", "Top saturation", 0f, 1f, 0.5f), p("top_v", "Top value", 0f, 1f, 0.8f),
                      p("top_pat", "Top pattern", 0f, 4f, 0f), p("top_pat_sc", "Pattern scale", 0.5f, 3f, 1f), p("top_h2", "Pattern hue", 0f, 1f, 0.08f), p("top_s2", "Pattern saturation", 0f, 1f, 0.3f), p("top_v2", "Pattern value", 0f, 1f, 0.95f),
                      p("top_sheen", "Top sheen", 0f, 1f, 0.4f), p("top_wr", "Top wrinkles", 0f, 2f, 0.8f),
                      p("bot_on", "Bottom", 0f, 1f, 1f, true), p("skirt_on", "Skirt instead of pants", 0f, 1f, 0f, true), p("bot_len", "Pants length", 0f, 1.05f, 0.3f), p("bot_loose", "Bottom looseness", 0f, 0.05f, 0.004f),
                      p("skirt_len", "Skirt length", 0.1f, 0.75f, 0.32f), p("skirt_flare", "Skirt flare", 0f, 0.35f, 0.12f), p("pleat", "Pleats", 0f, 1f, 0.4f),
                      p("bot_h", "Bottom hue", 0f, 1f, 0.62f), p("bot_s", "Bottom saturation", 0f, 1f, 0.45f), p("bot_v", "Bottom value", 0f, 1f, 0.35f), p("bot_pat", "Bottom pattern", 0f, 4f, 0f), p("bot_sheen", "Bottom sheen", 0f, 1f, 0.2f), p("bot_wr", "Bottom wrinkles", 0f, 2f, 0.8f),
                      p("shoe_on", "Shoes", 0f, 1f, 0f, true), p("shoe_h", "Shoe hue", 0f, 1f, 0.0f), p("shoe_s", "Shoe saturation", 0f, 1f, 0.05f), p("shoe_v", "Shoe value", 0f, 1f, 0.9f), p("wr_freq", "Fold frequency", 0.5f, 3f, 1f)),
                  "Light" to listOf(p("key_az", "Key azimuth", -180f, 180f, 35f), p("key_el", "Key elevation", 0f, 90f, 42f), p("key_int", "Key intensity", 0f, 5f, 2.6f), p("fill_az", "Fill azimuth", -180f, 180f, -70f), p("fill_int", "Fill intensity", 0f, 3f, 0.6f),
                      p("rim_az", "Rim azimuth", -180f, 180f, 160f), p("rim_int", "Rim intensity", 0f, 4f, 1.4f), p("amb", "Ambient", 0f, 1.5f, 0.45f), p("shadow_soft", "Shadow softness (lower = softer)", 2f, 30f, 8f),
                      p("bg_h", "Background hue", 0f, 1f, 0.6f), p("bg_s", "Background saturation", 0f, 1f, 0.15f), p("bg_v", "Background brightness", 0.02f, 1f, 0.3f), p("ground", "Floor", 0f, 1f, 1f, true)),
                  "Render" to listOf(p("mode", "Mode: 0 shaded 1 clay 2 anatomy 3 normals 4 toon", 0f, 4f, 0f), p("exposure", "Exposure", -2f, 2f, 0f), p("vignette", "Vignette", 0f, 1f, 0.3f), p("fov", "Field of view", 10f, 60f, 28f),
                      p("spp", "Max samples (quality)", 4f, 256f, 64f), p("steps", "March steps", 40f, 160f, 110f), p("preview_scale", "Interactive resolution", 0.3f, 1f, 0.5f))
              )
              val def: Map<String, Float> = TABS.values.flatten().associate { it.k to it.d }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/atelier/figure/Rig.kt)
          cat > app/src/main/java/com/atelier/figure/Rig.kt <<'EOF'
          package com.atelier.figure

          import android.content.Context
          import android.graphics.Color
          import kotlin.math.*

          class Built(val tex: FloatArray, val ng: Int, val primBase: Int, val boneBase: Int, val W: Array<FloatArray>)

          class Cloth {
              val seg = FloatArray(48); val segOn = FloatArray(4)
              var hem = FloatArray(3); var hemN = FloatArray(3); var waist = FloatArray(3); var neck = FloatArray(3); var neckR = 0.09f
              val foldP = FloatArray(20); val foldD = FloatArray(15); val shoeP = FloatArray(6); val shoeN = FloatArray(6)
          }

          class Rig(ctx: Context) {
              private val sNames = Defs.SLIDERS.split(",")
              private val sIdx = sNames.withIndex().associate { it.value to it.index }
              val names = Defs.BONES.split(",")
              val bi = names.withIndex().associate { it.value to it.index }
              class B(val parent: Int, val off: FloatArray, val rot: FloatArray, val lx: FloatArray, val ly: FloatArray)
              class PR(val bone: Int, val group: Int, val mat: Int, val ell: Boolean, val a: FloatArray, val b: FloatArray, val ra: Float, val rb: Float,
                       val sx: Float, val sz: Float, val k: Float, val m: Array<FloatArray>)
              private val bones = ArrayList<B>()
              private val prims = ArrayList<PR>()
              private val gLayer = ArrayList<Int>()
              private val gCf = ArrayList<Int>()

              private fun pm(s: String): FloatArray {
                  if (s == "-") return FloatArray(0)
                  val o = ArrayList<Float>()
                  for (t in s.split(';')) { val q = t.split(':'); o.add(q[0].toFloat()); o.add(q[1].toFloat()) }
                  return o.toFloatArray()
              }

              init {
                  for (line in ctx.assets.open("figure.spec").bufferedReader().readLines()) {
                      val t = line.trim().split(' ')
                      when (t[0]) {
                          "B" -> bones.add(B(t[1].toInt(), floatArrayOf(t[2].toFloat(), t[3].toFloat(), t[4].toFloat()), floatArrayOf(t[5].toFloat(), t[6].toFloat(), t[7].toFloat()), pm(t[8]), pm(t[9])))
                          "G" -> { gLayer.add(t[1].toInt()); gCf.add(t[2].toInt()) }
                          "P" -> prims.add(PR(t[1].toInt(), t[2].toInt(), t[3].toInt(), t[4] == "1",
                              floatArrayOf(t[5].toFloat(), t[6].toFloat(), t[7].toFloat()), floatArrayOf(t[8].toFloat(), t[9].toFloat(), t[10].toFloat()),
                              t[11].toFloat(), t[12].toFloat(), t[13].toFloat(), t[14].toFloat(), t[15].toFloat(),
                              arrayOf(pm(t[16]), pm(t[17]), pm(t[18]), pm(t[19]), pm(t[20]), pm(t[21]))))
                      }
                  }
                  prims.sortBy { it.group }
              }

              private fun fac(m: FloatArray, s: FloatArray): Float { var f = 1f; var i = 0; while (i < m.size) { f += m[i + 1] * s[m[i].toInt()]; i += 2 }; return f }
              private fun rx(a: Float) = floatArrayOf(1f, 0f, 0f, 0f, cos(a), -sin(a), 0f, sin(a), cos(a))
              private fun ry(a: Float) = floatArrayOf(cos(a), 0f, sin(a), 0f, 1f, 0f, -sin(a), 0f, cos(a))
              private fun rz(a: Float) = floatArrayOf(cos(a), -sin(a), 0f, sin(a), cos(a), 0f, 0f, 0f, 1f)
              private fun mm(a: FloatArray, b: FloatArray): FloatArray {
                  val o = FloatArray(9)
                  for (i in 0..2) for (j in 0..2) { var s = 0f; for (k in 0..2) s += a[i * 3 + k] * b[k * 3 + j]; o[i * 3 + j] = s }
                  return o
              }
              private fun mv(a: FloatArray, v: FloatArray) = floatArrayOf(a[0] * v[0] + a[1] * v[1] + a[2] * v[2], a[3] * v[0] + a[4] * v[1] + a[5] * v[2], a[6] * v[0] + a[7] * v[1] + a[8] * v[2])
              private val D2R = (PI / 180.0).toFloat()

              fun poseAngles(): FloatArray {
                  val a = FloatArray(names.size * 3)
                  for (j in Defs.JOINTS) {
                      val b = bi[j] ?: continue
                      val right = j.endsWith("R")
                      val base = if (j.endsWith("L") || j.endsWith("R")) j.dropLast(1) else j
                      val fs = Defs.FLEX_SIGN[base] ?: 1f
                      a[b * 3] = P.g("j_${j}_x") * fs
                      a[b * 3 + 1] = P.g("j_${j}_y") * (if (right) -1f else 1f)
                      a[b * 3 + 2] = P.g("j_${j}_z") * (if (right) -1f else 1f)
                  }
                  val fing = mapOf("idx" to 0.8f, "mid" to 0.25f, "rng" to -0.35f, "pnk" to -0.9f)
                  for (sd in listOf("L", "R")) {
                      val sg = if (sd == "L") 1f else -1f
                      val curl = P.g("curl$sd"); val spread = P.g("spread$sd")
                      for ((fn, sc) in fing) for (s in 0..2) {
                          val b = bi["f${sd}_$fn$s"] ?: continue
                          a[b * 3 + 2] = -sg * curl * floatArrayOf(1f, 0.9f, 0.7f)[s]
                          if (s == 0) a[b * 3] = spread * sc
                      }
                      for (s in 0..2) { val b = bi["f${sd}_thm$s"] ?: continue; a[b * 3 + 2] = -sg * curl * 0.35f; if (s == 0) a[b * 3] = -curl * 0.15f }
                  }
                  bi["jaw"]?.let { a[it * 3] = P.g("jaw_open") }
                  for (e in listOf("eyeL", "eyeR")) bi[e]?.let { a[it * 3 + 1] = P.g("gazeX"); a[it * 3] = -P.g("gazeY") }
                  bi["root"]?.let { a[it * 3 + 1] = P.g("root_ry") }
                  return a
              }

              fun build(): Built {
                  val S = FloatArray(sNames.size) { P.g(sNames[it]) }
                  val gs = 1f + 0.12f * S[sIdx["height"]!!]
                  val ang = poseAngles()
                  val nb = bones.size
                  val W = Array(nb) { FloatArray(12) }
                  for (i in 0 until nb) {
                      val b = bones[i]
                      var off = floatArrayOf(b.off[0] * fac(b.lx, S) * gs, b.off[1] * fac(b.ly, S) * gs, b.off[2] * gs)
                      if (i == 0) off = floatArrayOf(P.g("root_x"), P.g("root_y"), P.g("root_z"))
                      val rr = mm(rz(b.rot[2] * D2R), mm(ry(b.rot[1] * D2R), rx(b.rot[0] * D2R)))
                      val rp = mm(rz(ang[i * 3 + 2] * D2R), mm(rx(ang[i * 3] * D2R), ry(ang[i * 3 + 1] * D2R)))
                      val rl = mm(rr, rp)
                      if (b.parent < 0) { for (k in 0..8) W[i][k] = rl[k]; for (k in 0..2) W[i][9 + k] = off[k] }
                      else {
                          val pw = W[b.parent]
                          val pr = pw.copyOfRange(0, 9)
                          val o = mv(pr, off)
                          val r = mm(pr, rl)
                          for (k in 0..8) W[i][k] = r[k]
                          for (k in 0..2) W[i][9 + k] = pw[9 + k] + o[k]
                      }
                  }
                  val ng = gLayer.size
                  val per = Array(ng) { ArrayList<PR>() }
                  for (p in prims) per[p.group].add(p)
                  val primTex = ArrayList<Float>()
                  val gdata = FloatArray(ng * 8)
                  for (g in 0 until ng) {
                      val start = primTex.size / 16
                      var cx = FloatArray(0); val rad = ArrayList<Float>(); val cs = ArrayList<FloatArray>()
                      for (p in per[g]) {
                          val fx = fac(p.m[3], S); val fy = fac(p.m[4], S); val fz = fac(p.m[5], S)
                          val a = floatArrayOf(p.a[0] * fx * gs, p.a[1] * fy * gs, p.a[2] * fz * gs)
                          val fr = fac(p.m[0], S); val frw = fac(p.m[1], S); val frd = fac(p.m[2], S)
                          val k = p.k * gs * (1f + 0.5f * S[sIdx["fat"]!!])
                          val t0: FloatArray; val t1: FloatArray; val t2: FloatArray
                          val c: FloatArray; val r: Float
                          if (p.ell) {
                              val rxx = p.ra * fr * frw * gs; val ryy = p.rb * fr * gs; val rzz = p.sx * fr * frd * gs
