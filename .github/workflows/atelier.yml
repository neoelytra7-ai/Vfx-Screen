              private fun u1fv(p: Int, n: String, a: FloatArray) = GLES30.glUniform1fv(loc(p, n), a.size, a, 0)

              private fun drawSample(w: Int, h: Int, aspect: Float, nS: Int, from: Int, to: Int, y0: Int, sh: Int) {
                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, fbo[to])
                  GLES30.glViewport(0, 0, w, h)
                  setScene(w, h, aspect, nS)
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE1); GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, acc[from]); u1i(scene, "uPrev", 1)
                  u1f(scene, "uW", 1f / (nS + 1))
                  if (sh > 0) { GLES30.glEnable(GLES30.GL_SCISSOR_TEST); GLES30.glScissor(0, y0, w, sh) }
                  GLES30.glBindVertexArray(vao)
                  GLES30.glDrawArrays(GLES30.GL_TRIANGLES, 0, 3)
                  if (sh > 0) GLES30.glDisable(GLES30.GL_SCISSOR_TEST)
              }

              private fun blitTo(fb: Int, tex: Int, w: Int, h: Int) {
                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, fb); GLES30.glViewport(0, 0, w, h)
                  GLES30.glUseProgram(blit)
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE0); GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex); u1i(blit, "uTex", 0)
                  u1f(blit, "uExp", P.g("exposure")); u1f(blit, "uVig", P.g("vignette"))
                  GLES30.glBindVertexArray(vao); GLES30.glDrawArrays(GLES30.GL_TRIANGLES, 0, 3)
              }

              override fun onDrawFrame(g: GL10?) {
                  if (scene == 0 || blit == 0 || built == null) { GLES30.glClearColor(0.05f, 0.06f, 0.08f, 1f); GLES30.glClear(GLES30.GL_COLOR_BUFFER_BIT); return }
                  if (dataDirty) uploadData()
                  val moving = SystemClock.uptimeMillis() - lastChange < 260
                  val sc = if (moving) P.g("preview_scale") else 1f
                  val w = max(64, (vw * sc).toInt()); val h = max(64, (vh * sc).toInt())
                  ensureAcc(w, h)
                  if (resetN) { n = 0; resetN = false }
                  val maxN = P.g("spp").toInt()
                  if (n < maxN || moving) {
                      drawSample(w, h, vw.toFloat() / vh, n, cur, 1 - cur, 0, 0)
                      cur = 1 - cur; n++
                  }
                  blitTo(0, acc[cur], vw, vh)
                  if (n < maxN) gv.requestRender() else if (moving) gv.postDelayed({ gv.requestRender() }, 280)
              }

              /** Offscreen high-quality render. Runs strips per sample so a single GPU call stays short. */
              fun export(w: Int, h: Int, spp: Int): Bitmap? {
                  val latch = CountDownLatch(1); var out: Bitmap? = null
                  gv.queueEvent {
                      try {
                          val t = IntArray(3); val f = IntArray(3)
                          GLES30.glGenTextures(3, t, 0); GLES30.glGenFramebuffers(3, f, 0)
                          for (i in 0..1) {
                              GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, t[i])
                              GLES30.glTexImage2D(GLES30.GL_TEXTURE_2D, 0, GLES30.GL_RGBA16F, w, h, 0, GLES30.GL_RGBA, GLES30.GL_HALF_FLOAT, null)
                              GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_MIN_FILTER, GLES30.GL_LINEAR); GLES30.glTexParameteri(GLES30.GL_TEXTURE_2D, GLES30.GL_TEXTURE_MAG_FILTER, GLES30.GL_LINEAR)
                              GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, f[i]); GLES30.glFramebufferTexture2D(GLES30.GL_FRAMEBUFFER, GLES30.GL_COLOR_ATTACHMENT0, GLES30.GL_TEXTURE_2D, t[i], 0)
                          }
                          GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, t[2])
                          GLES30.glTexImage2D(GLES30.GL_TEXTURE_2D, 0, GLES30.GL_RGBA8, w, h, 0, GLES30.GL_RGBA, GLES30.GL_UNSIGNED_BYTE, null)
                          GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, f[2]); GLES30.glFramebufferTexture2D(GLES30.GL_FRAMEBUFFER, GLES30.GL_COLOR_ATTACHMENT0, GLES30.GL_TEXTURE_2D, t[2], 0)
                          if (dataDirty) uploadData()
                          // swap internal accumulators for the export ones
                          val sa = acc.copyOf(); val sf = fbo.copyOf()
                          acc[0] = t[0]; acc[1] = t[1]; fbo[0] = f[0]; fbo[1] = f[1]
                          var c = 0
                          for (s in 0 until spp) {
                              var y = 0
                              while (y < h) {
                                  val sh = min(96, h - y)
                                  drawSample(w, h, w.toFloat() / h, s, c, 1 - c, y, sh)
                                  GLES30.glFinish(); y += sh
                              }
                              c = 1 - c
                              onProgress?.invoke((s + 1) * 100 / spp)
                          }
                          blitTo(f[2], acc[c], w, h)
                          val buf = ByteBuffer.allocateDirect(w * h * 4).order(ByteOrder.nativeOrder())
                          GLES30.glReadPixels(0, 0, w, h, GLES30.GL_RGBA, GLES30.GL_UNSIGNED_BYTE, buf)
                          val px = IntArray(w * h)
                          for (yy in 0 until h) { val row = (h - 1 - yy) * w * 4; for (x in 0 until w) { val o = row + x * 4
                              px[yy * w + x] = (255 shl 24) or ((buf.get(o).toInt() and 255) shl 16) or ((buf.get(o + 1).toInt() and 255) shl 8) or (buf.get(o + 2).toInt() and 255) } }
                          out = Bitmap.createBitmap(px, w, h, Bitmap.Config.ARGB_8888)
                          acc[0] = sa[0]; acc[1] = sa[1]; fbo[0] = sf[0]; fbo[1] = sf[1]
                          GLES30.glDeleteTextures(3, t, 0); GLES30.glDeleteFramebuffers(3, f, 0)
                          GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, 0)
                          resetN = true
                      } catch (e: Throwable) { err("Export: ${e.message}") }
                      latch.countDown()
                  }
                  gv.requestRender()
                  latch.await(600, TimeUnit.SECONDS)
                  gv.dirty()
                  return out
              }
          }
