                      val c = Color.HSVToColor(floatArrayOf((h % 1f) * 360f, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f)))
                      return floatArrayOf((Color.red(c) / 255f).pow(2.2f), (Color.green(c) / 255f).pow(2.2f), (Color.blue(c) / 255f).pow(2.2f))
                  }
              }
