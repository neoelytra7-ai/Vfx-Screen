          // ---- shared between GLSL (app) and C++ (verifier). Restricted subset: no swizzles except via V3().
          struct Hit { float skin; float hair; float eye; float top; float bot; float shoe; float idSkin; float idTop; };

          float smin(float a, float b, float k) {
              if (k <= 0.0) return min(a, b);
              float h = max(k - abs(a - b), 0.0) / k;
              return min(a, b) - h * h * k * 0.25;
          }

          float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
              vec3 ba = b - a;
              float l2 = dot(ba, ba);
              float rr = r1 - r2;
              float a2 = l2 - rr * rr;
              float il2 = 1.0 / l2;
              vec3 pa = p - a;
              float y = dot(pa, ba);
              float z = y - l2;
              vec3 xx = pa * l2 - ba * y;
              float x2 = dot(xx, xx);
              float y2 = y * y * l2;
              float z2 = z * z * l2;
              float k = sign(rr) * rr * rr * x2;
              if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
              if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
              return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
          }

          float sdEllipsoid(vec3 p, vec3 r) {
              float k0 = length(vec3(p.x / r.x, p.y / r.y, p.z / r.z));
              float k1 = length(vec3(p.x / (r.x * r.x), p.y / (r.y * r.y), p.z / (r.z * r.z)));
              return k0 * (k0 - 1.0) / max(k1, 1e-6);
          }

          vec4 fetchGroup(int g, int k) { return D(g * 2 + k); }
          vec4 fetchPrim(int i, int k) { return D(uPrimBase + i * 4 + k); }
          vec4 fetchBone(int b, int k) { return D(uBoneBase + b * 3 + k); }

          vec3 toLocal(vec3 p, int b) {
              vec4 r0 = fetchBone(b, 0);
              vec4 r1 = fetchBone(b, 1);
              vec4 r2 = fetchBone(b, 2);
              return vec3(dot(V3(r0), p) + r0.w, dot(V3(r1), p) + r1.w, dot(V3(r2), p) + r2.w);
          }

          float evalPrim(vec3 q, vec4 t0, vec4 t1, vec4 t2) {
              if (t2.w < 0.5) {
                  float sx = t2.x;
                  float sz = t2.y;
                  vec3 a = vec3(t0.x / sx, t0.y, t0.z / sz);
                  vec3 b = vec3(t1.x / sx, t1.y, t1.z / sz);
                  vec3 qs = vec3(q.x / sx, q.y, q.z / sz);
                  return sdRoundCone(qs, a, b, t0.w, t1.w) * min(min(sx, sz), 1.0);
              }
              vec3 c = V3(t0);
              return sdEllipsoid(q - c, vec3(t0.w, t1.w, t2.x));
          }

          Hit evalBody(vec3 p) {
              Hit h;
              h.skin = 1000.0; h.hair = 1000.0; h.eye = 1000.0; h.top = 1000.0; h.bot = 1000.0; h.shoe = 1000.0;
              h.idSkin = 0.0; h.idTop = 0.0;
              float bestS = 1000.0;
              for (int g = 0; g < uNG; g++) {
                  vec4 gb = fetchGroup(g, 0);
                  vec4 gi = fetchGroup(g, 1);
                  float dg = length(p - V3(gb)) - gb.w;
                  int layer = int(gi.z + 0.5);
                  int cf = int(gi.w + 0.5);
                  if (dg > 0.10) {
                      if (layer == 0) {
                          h.skin = min(h.skin, dg);
                          if ((cf & 1) != 0) h.top = min(h.top, dg);
                          if ((cf & 2) != 0) h.bot = min(h.bot, dg);
                          if ((cf & 4) != 0) h.shoe = min(h.shoe, dg);
                      } else if (layer == 1) {
                          h.hair = min(h.hair, dg);
                      } else {
                          h.eye = min(h.eye, dg);
                      }
                      continue;
                  }
                  int start = int(gi.x + 0.5);
                  int cnt = int(gi.y + 0.5);
                  for (int j = 0; j < cnt; j++) {
                      int pi = start + j;
                      vec4 t0 = fetchPrim(pi, 0);
                      vec4 t1 = fetchPrim(pi, 1);
                      vec4 t2 = fetchPrim(pi, 2);
                      vec4 t3 = fetchPrim(pi, 3);
                      vec3 q = toLocal(p, int(t3.x + 0.5));
                      float d = evalPrim(q, t0, t1, t2);
                      float k = t2.z;
                      if (layer == 0) {
                          h.skin = smin(h.skin, d, k);
                          if (d < bestS) { bestS = d; h.idSkin = t3.z; }
                          if ((cf & 1) != 0) h.top = smin(h.top, d, k * uClothK);
                          if ((cf & 2) != 0) h.bot = smin(h.bot, d, k * uClothK);
                          if ((cf & 4) != 0) h.shoe = smin(h.shoe, d, k * uClothK);
                      } else if (layer == 1) {
                          h.hair = smin(h.hair, d, k);
                      } else {
                          h.eye = min(h.eye, d);
                      }
                  }
              }
              return h;
          }

          float evalBones(vec3 p) {
              float d = 1000.0;
              for (int g = uNG; g < uNGall; g++) {
                  vec4 gb = fetchGroup(g, 0);
                  vec4 gi = fetchGroup(g, 1);
                  float dg = length(p - V3(gb)) - gb.w;
                  if (dg > 0.06) { d = min(d, dg); continue; }
                  int start = int(gi.x + 0.5);
                  int cnt = int(gi.y + 0.5);
                  for (int j = 0; j < cnt; j++) {
                      int pi = start + j;
                      vec4 t0 = fetchPrim(pi, 0);
                      vec4 t1 = fetchPrim(pi, 1);
                      vec4 t2 = fetchPrim(pi, 2);
                      vec4 t3 = fetchPrim(pi, 3);
                      d = smin(d, evalPrim(toLocal(p, int(t3.x + 0.5)), t0, t1, t2), t2.z);
                  }
              }
              return d;
          }
          EOF
