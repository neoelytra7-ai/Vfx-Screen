              private fun chain(c: Cloth, idx: Int, s: FloatArray, e: FloatArray, w: FloatArray, t: Float, on: Boolean) {
                  val u1 = nrm(sub(e, s)); val u2 = nrm(sub(w, e)); val l1 = len(sub(e, s)); val l2 = len(sub(w, e))
                  c.segOn[idx] = if (on && t < 1f) 1f else 0f
