                  for (s in listOf("L", "R")) { row(Prm("curl$s", "Fingers curl $s", 0f, 90f, 0f)); row(Prm("spread$s", "Fingers spread $s", -15f, 25f, 0f)) }
                  row(Prm("root_x", "Move left/right", -1f, 1f, 0f)); row(Prm("root_y", "Move up/down", -0.9f, 0.6f, 0f)); row(Prm("root_z", "Move forward/back", -1f, 1f, 0f)); row(Prm("root_ry", "Turn body", -180f, 180f, 0f))
                  val b = btn("Mirror pose (swap left and right)") {
                      for (n in Defs.JOINTS) if (n.endsWith("L")) {
                          val m = n.dropLast(1) + "R"
                          for (ax in listOf("x", "y", "z")) { val a = P.g("j_${n}_$ax"); val c = P.g("j_${m}_$ax"); P.s("j_${n}_$ax", c); P.s("j_${m}_$ax", a) }
                      }
                      for (k in listOf("curl", "spread")) { val a = P.g(k + "L"); P.s(k + "L", P.g(k + "R")); P.s(k + "R", a) }
                      apply(); show("Pose")
                  }
                  panel.addView(b, lp(MP, WC).apply { topMargin = dp(12) })
              }

              private fun exportTab() {
                  panel.addView(tv("Export image", 16f, cText, true).apply { setPadding(0, dp(10), 0, dp(6)) })
                  val sizes = listOf("1080 px", "2048 px", "3072 px", "4096 px"); val spps = listOf("Fast 24", "Good 64", "Max 160")
                  panel.addView(tv("Size (long side)", 13f, cMuted).apply { setPadding(0, dp(4), 0, dp(4)) })
                  panel.addView(chips(sizes, { sizes[expRes] }) { expRes = sizes.indexOf(it) })
                  panel.addView(tv("Quality (samples)", 13f, cMuted).apply { setPadding(0, dp(12), 0, dp(4)) })
                  panel.addView(chips(spps, { spps[expSpp] }) { expSpp = spps.indexOf(it) })
                  panel.addView(btn("Render and save PNG") {
                      val long = intArrayOf(1080, 2048, 3072, 4096)[expRes]; val spp = intArrayOf(24, 64, 160)[expSpp]
                      val a = view.width.toFloat() / view.height.coerceAtLeast(1)
                      val w = if (a < 1f) (long * a).toInt() and 1.inv() else long; val h = if (a < 1f) long else (long / a).toInt() and 1.inv()
                      statusTv.text = "Rendering ${w}x$h …"
                      Thread {
                          val bmp = view.r.export(w, h, spp)
                          val ok = bmp != null && save(bmp)
                          ui.post { statusTv.text = if (ok) "Saved to Pictures/Atelier" else "Export failed" }
                      }.start()
                  }, lp(MP, WC).apply { topMargin = dp(16) })
                  panel.addView(tv("Tip: set Render > Mode to Clay or Toon first for line-art style references.", 12f, cMuted).apply { setPadding(0, dp(12), 0, 0) })
              }

              private fun save(b: Bitmap): Boolean {
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "Atelier_${System.currentTimeMillis()}.png"); cv.put(MediaStore.MediaColumns.MIME_TYPE, "image/png")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Atelier")
                  val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return false
                  contentResolver.openOutputStream(uri)?.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  return true
              }
          }
