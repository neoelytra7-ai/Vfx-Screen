                  val bg = Rig.lin(P.g("bg_h"), P.g("bg_s"), P.g("bg_v")); u3(p, "uBg1", floatArrayOf(bg[0] * 1.4f, bg[1] * 1.4f, bg[2] * 1.4f)); u3(p, "uBg2", floatArrayOf(bg[0] * 0.5f, bg[1] * 0.5f, bg[2] * 0.5f))
                  u1f(p, "uGloss", P.g("skin_gloss")); u1f(p, "uAmb", P.g("amb")); u1f(p, "uShadowSoft", P.g("shadow_soft"))
                  fun dir(az: Float, el: Float): FloatArray { val a = az * PI.toFloat() / 180f; val e = el * PI.toFloat() / 180f; return floatArrayOf(cos(e) * sin(a), sin(e), cos(e) * cos(a)) }
                  val k = dir(P.g("key_az"), P.g("key_el")); val f = dir(P.g("fill_az"), 15f); val rm = dir(P.g("rim_az"), 35f)
