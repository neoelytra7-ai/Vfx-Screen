          cat > app/src/main/java/com/mosslocal/app/ForestGL.kt <<'EOF'
          package com.mosslocal.app

          import android.content.Context
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10

          private const val VERT = """
          attribute vec2 aPos;
          void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
          """

          // Everything is procedural: sky + sun + god rays, 3 parallax conifer layers, a river with
          // perspective-correct flow, ripple-distorted planar reflections (blurred, Fresnel-weighted),
          // 3 layers of wind-swept foreground grass, fireflies, drifting light beams.
          private const val FRAG = """
          #ifdef GL_FRAGMENT_PRECISION_HIGH
          precision highp float;
          #else
          precision mediump float;
          #endif
          uniform vec2 uRes;
          uniform float uTime;
          uniform vec3 uTouch;
          uniform float uBusy;
          uniform float uScroll;

          float hash11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
          float hash21(vec2 p) {
            vec3 p3 = fract(vec3(p.x, p.y, p.x) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }
          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash21(i);
            float b = hash21(i + vec2(1.0, 0.0));
            float c = hash21(i + vec2(0.0, 1.0));
            float d = hash21(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }
          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 4; i++) {
              v += a * noise(p);
              p = p * 2.03 + vec2(17.0, 9.0);
              a *= 0.5;
            }
            return v;
          }

          float treeLine(float x, float y, float base, float height, float freq, float seed) {
            float cx = x * freq;
            float id = floor(cx);
            float fx = fract(cx) - 0.5;
            float r = hash11(id * 1.37 + seed);
            float hh = height * (0.55 + 0.9 * r);
            float yy = (y - base) / hh;
            if (yy < 0.0 || yy > 1.0) return 0.0;
            fx += sin(uTime * 0.7 + id * 2.0 + yy * 2.5) * 0.035 * yy;
            float tier = 0.5 + 0.5 * sin(yy * 20.0 + r * 6.0);
            float w = (1.0 - yy) * (0.30 + 0.12 * tier);
            return 1.0 - smoothstep(w - 0.03, w, abs(fx));
          }

          vec3 sky(vec2 uv, float hor, float t) {
            float asp = uRes.x / uRes.y;
            float h = clamp((uv.y - hor) / (1.0 - hor), 0.0, 1.0);
            vec3 top = vec3(0.03, 0.14, 0.19);
            vec3 mid = vec3(0.20, 0.48, 0.47);
            vec3 low = vec3(1.0, 0.80, 0.50);
            vec3 c = mix(low, mid, smoothstep(0.0, 0.35, h));
            c = mix(c, top, smoothstep(0.25, 1.0, h));
            vec2 sp = vec2(0.70, hor + 0.14);
            vec2 dv = (uv - sp) * vec2(asp, 1.0);
            float d = length(dv);
            c += vec3(1.0, 0.82, 0.52) * exp(-d * 6.5) * 0.85;
            c += vec3(1.0, 0.92, 0.75) * (1.0 - smoothstep(0.030, 0.046, d));
            float ang = atan(dv.y, dv.x);
            float rays = pow(0.5 + 0.5 * sin(ang * 13.0 + t * 0.12 + noise(vec2(ang * 3.0, t * 0.08)) * 3.0), 3.0);
            c += vec3(1.0, 0.84, 0.58) * rays * exp(-d * 3.0) * 0.20;
            float cl = fbm(vec2(uv.x * asp * 2.2 + t * 0.015, uv.y * 5.0));
            c = mix(c, vec3(1.0, 0.93, 0.82), smoothstep(0.55, 0.85, cl) * 0.20 * smoothstep(0.0, 0.3, h));
            return c;
          }

          vec3 world(vec2 uv, float hor, float t) {
            float asp = uRes.x / uRes.y;
            float x = uv.x * asp;
            vec3 col = sky(uv, hor, t);
            vec3 fog = vec3(0.70, 0.82, 0.72);
            float hills = hor + 0.06 + 0.04 * sin(x * 2.6 + 1.0) + 0.025 * sin(x * 6.1 + 2.0);
            float hm = 1.0 - smoothstep(hills - 0.004, hills + 0.004, uv.y);
            col = mix(col, mix(fog, vec3(0.16, 0.34, 0.34), 0.5), hm);
            float t1 = treeLine(x, uv.y, hor - 0.01, 0.20, 22.0, 1.0);
            col = mix(col, mix(fog, vec3(0.10, 0.28, 0.29), 0.62), t1);
            float t2 = treeLine(x + 3.3, uv.y, hor - 0.01, 0.27, 14.0, 7.0);
            col = mix(col, mix(fog, vec3(0.05, 0.20, 0.21), 0.80), t2);
            float t3 = treeLine(x + 7.1, uv.y, hor - 0.02, 0.38, 7.5, 13.0);
            col = mix(col, vec3(0.015, 0.09, 0.10), t3);
            col = mix(col, fog * vec3(1.0, 0.96, 0.86), exp(-abs(uv.y - hor) * 9.0) * 0.38);
            return col;
          }

          vec3 water(vec2 uv, float hor, float t) {
            float asp = uRes.x / uRes.y;
            float depth = clamp((hor - uv.y) / hor, 0.0, 1.0);
            float wz = 1.0 / (0.10 + depth * 1.2);
            float wx = (uv.x - 0.5) * asp * wz * 2.0;
            vec2 q = vec2(wx * 1.4, wz * 2.2 + t * 0.9);
            float e = 0.06;
            float h0 = fbm(q);
            float hx = fbm(q + vec2(e, 0.0));
            float hy = fbm(q + vec2(0.0, e));
            vec2 grad = vec2(hx - h0, hy - h0) / e;

            vec2 rv = (uv - vec2(uTouch.x, uTouch.y)) * vec2(asp, 1.8);
            float rd = length(rv);
            float dd = (rd - uTouch.z * 0.35) * 9.0;
            float ring = exp(-dd * dd) * exp(-uTouch.z * 1.3);
            float ripple = sin(rd * 80.0 - uTouch.z * 22.0) * ring;

            float amp = 0.25 + depth;
            vec2 ruv = vec2(
              uv.x + grad.x * 0.035 * amp + ripple * 0.012,
              hor + (hor - uv.y) * 0.82 + grad.y * 0.012 * amp + ripple * 0.008
            );
            vec3 r1 = world(ruv, hor, t);
            vec3 r2 = world(ruv + vec2(0.012 * amp, 0.006), hor, t);
            vec3 r3 = world(ruv + vec2(-0.012 * amp, 0.006), hor, t);
            vec3 refl = (r1 * 2.0 + r2 + r3) * 0.25;
            refl *= vec3(0.80, 0.92, 0.88);

            float cosT = clamp(0.12 + depth * 0.9, 0.0, 1.0);
            float fres = 0.25 + 0.65 * pow(1.0 - cosT, 3.0);
            vec3 deep = mix(vec3(0.03, 0.22, 0.21), vec3(0.01, 0.09, 0.10), depth);
            float caus = pow(fbm(q * 2.0 + vec2(0.0, t * 0.35)), 3.0);
            deep += vec3(0.10, 0.32, 0.26) * caus * (0.3 + depth) * 0.5;
            vec3 col = mix(deep, refl, fres);

            float spark = pow(smoothstep(0.62, 1.0, noise(q * 5.0 + vec2(0.0, t * 0.6))), 5.0)
                        * exp(-abs(uv.x - 0.70) * 2.6) * (1.1 - depth * 0.5);
            col += vec3(1.0, 0.90, 0.70) * spark * 1.1;
            float foam = smoothstep(0.64, 0.82, fbm(q * 3.2 + vec2(0.0, t * 0.9))) * 0.10 * (0.2 + depth);
            col += vec3(0.85, 1.0, 0.95) * foam;
            return col;
          }

          float grassLayer(vec2 uv, float freq, float baseY, float hmax, float seed, float speed, out float shade) {
            float asp = uRes.x / uRes.y;
            float cx = uv.x * asp * freq;
            float id = floor(cx);
            float fx = fract(cx) - 0.5;
            float r = hash11(id * 1.91 + seed);
            float edge = abs(uv.x - 0.5) * 2.0;
            float env = 0.30 + 0.70 * pow(edge, 1.6);
            float hh = hmax * env * (0.45 + r);
            float yy = (uv.y - baseY) / hh;
            shade = clamp(yy, 0.0, 1.0);
            if (yy < 0.0 || yy > 1.0) return 0.0;
            float gust = noise(vec2(uv.x * 2.5 - uTime * 0.55 * speed, uTime * 0.15));
            float bend = (sin(uTime * 1.5 * speed + id * 0.7) * 0.08 + (gust - 0.5) * 0.55) * yy * yy;
            float td = uv.x - uTouch.x;
            float push = exp(-abs(td) * 7.0) * exp(-uTouch.z * 1.4) * sign(td) * 0.30 * step(uv.y, 0.5);
            bend += push * yy * yy;
            float hw = max((1.0 - yy) * 0.17 * (0.6 + 0.8 * r), 0.002);
            return 1.0 - smoothstep(hw * 0.6, hw, abs(fx - bend));
          }

          vec3 gcol(float sh, float layer) {
            vec3 baseC = vec3(0.02, 0.11, 0.07);
            vec3 tipC = mix(vec3(0.45, 0.82, 0.34), vec3(0.16, 0.42, 0.18), layer);
            vec3 c = mix(baseC, tipC, pow(sh, 0.8));
            c += vec3(1.0, 0.78, 0.35) * pow(sh, 4.0) * 0.35 * (1.0 - layer * 0.6);
            return c;
          }

          void main() {
            vec2 uv = gl_FragCoord.xy / uRes;
            float asp = uRes.x / uRes.y;
            float t = uTime;
            float hor = 0.60 + 0.15 * uScroll;
            vec3 col;
            if (uv.y >= hor) col = world(uv, hor, t); else col = water(uv, hor, t);

            float beam = smoothstep(0.50, 0.90, noise(vec2((uv.x + uv.y * 0.45) * asp * 5.0, t * 0.04)));
            col += vec3(1.0, 0.88, 0.60) * beam * 0.10 * uv.y;

            float sh;
            float g = grassLayer(uv, 40.0, -0.02, 0.12, 3.0, 1.3, sh);
            col = mix(col, gcol(sh, 0.0), g);
            g = grassLayer(uv, 22.0, -0.03, 0.20, 9.0, 1.0, sh);
            col = mix(col, gcol(sh, 0.4), g);
            g = grassLayer(uv, 9.0, -0.05, 0.34, 21.0, 0.8, sh);
            col = mix(col, gcol(sh, 1.0), g);

            for (int i = 0; i < 16; i++) {
              float fi = float(i);
              vec2 c = vec2(hash11(fi * 3.1), 0.12 + 0.75 * hash11(fi * 7.7));
              c.x += 0.06 * sin(t * 0.4 + fi * 2.0) + 0.03 * sin(t * 1.1 + fi);
              c.y += 0.05 * sin(t * 0.5 + fi * 1.7);
              float d = length((uv - c) * vec2(asp, 1.0));
              float tw = 0.5 + 0.5 * sin(t * (1.5 + hash11(fi) * 2.0) + fi * 5.0);
              col += vec3(0.80, 1.0, 0.40) * (0.0009 / (d * d + 0.0009)) * tw * (0.6 + uBusy * 1.4) * 0.35;
            }

            col *= 1.0 + uBusy * 0.10 * sin(t * 3.0);
            col = mix(col, col * vec3(0.95, 1.08, 0.92), uBusy * 0.4);
            vec2 vc = (uv - 0.5) * vec2(asp * 1.4, 1.0);
            float vig = 1.0 - smoothstep(0.25, 1.05, length(vc));
            col *= mix(0.62, 1.0, vig);
            col = pow(clamp(col, 0.0, 1.0), vec3(0.92));
            gl_FragColor = vec4(col, 1.0);
          }
          """

          class ForestRenderer(private val onError: (String) -> Unit) : GLSurfaceView.Renderer {
              @Volatile var scroll = 0f
              @Volatile var busy = 0f
              @Volatile var touchX = 0.5f
              @Volatile var touchY = 0.3f
              @Volatile var touchNs = 0L
              private var prog = 0
              private var w = 1
              private var h = 1
              private var t0 = 0L
              private var sBusy = 0f
              private var quad: FloatBuffer? = null
              private var locRes = 0
              private var locTime = 0
              private var locTouch = 0
              private var locBusy = 0
              private var locScroll = 0
              private var locPos = 0

              private fun compile(type: Int, src: String): Int {
                  val s = GLES20.glCreateShader(type)
                  GLES20.glShaderSource(s, src)
                  GLES20.glCompileShader(s)
                  val ok = IntArray(1)
                  GLES20.glGetShaderiv(s, GLES20.GL_COMPILE_STATUS, ok, 0)
                  if (ok[0] == 0) {
                      val msg = GLES20.glGetShaderInfoLog(s)
                      GLES20.glDeleteShader(s)
                      throw RuntimeException(msg)
                  }
                  return s
              }

              override fun onSurfaceCreated(gl: GL10?, cfg: EGLConfig?) {
                  t0 = System.nanoTime()
                  val fb = ByteBuffer.allocateDirect(8 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                  fb.put(floatArrayOf(-1f, -1f, 1f, -1f, -1f, 1f, 1f, 1f))
                  fb.position(0)
                  quad = fb
                  try {
                      val vs = compile(GLES20.GL_VERTEX_SHADER, VERT)
                      val fs = compile(GLES20.GL_FRAGMENT_SHADER, FRAG)
                      val p = GLES20.glCreateProgram()
                      GLES20.glAttachShader(p, vs)
                      GLES20.glAttachShader(p, fs)
                      GLES20.glLinkProgram(p)
                      val ok = IntArray(1)
                      GLES20.glGetProgramiv(p, GLES20.GL_LINK_STATUS, ok, 0)
                      if (ok[0] == 0) throw RuntimeException(GLES20.glGetProgramInfoLog(p))
                      prog = p
                      locRes = GLES20.glGetUniformLocation(p, "uRes")
                      locTime = GLES20.glGetUniformLocation(p, "uTime")
                      locTouch = GLES20.glGetUniformLocation(p, "uTouch")
                      locBusy = GLES20.glGetUniformLocation(p, "uBusy")
                      locScroll = GLES20.glGetUniformLocation(p, "uScroll")
                      locPos = GLES20.glGetAttribLocation(p, "aPos")
                  } catch (e: Exception) {
                      prog = 0
                      onError("Forest shader failed: " + e.message)
                  }
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  w = width
                  h = height
                  GLES20.glViewport(0, 0, width, height)
              }

              override fun onDrawFrame(gl: GL10?) {
                  if (prog == 0) {
                      GLES20.glClearColor(0.03f, 0.10f, 0.07f, 1f)
                      GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)
                      return
                  }
                  val now = System.nanoTime()
                  val t = ((now - t0) / 1e9).toFloat()
                  sBusy += (busy - sBusy) * 0.06f
                  val tn = touchNs
                  val age = if (tn == 0L) 99f else Math.min(99f, ((now - tn) / 1e9).toFloat())
                  GLES20.glUseProgram(prog)
                  GLES20.glUniform2f(locRes, w.toFloat(), h.toFloat())
                  GLES20.glUniform1f(locTime, t)
                  GLES20.glUniform3f(locTouch, touchX, touchY, age)
                  GLES20.glUniform1f(locBusy, sBusy)
                  GLES20.glUniform1f(locScroll, scroll)
                  GLES20.glEnableVertexAttribArray(locPos)
                  GLES20.glVertexAttribPointer(locPos, 2, GLES20.GL_FLOAT, false, 0, quad)
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
              }
          }

          /** Renders at half resolution and a capped frame rate so it never fights the AI engine for the GPU. */
          class ForestGL(ctx: Context, onError: (String) -> Unit) : GLSurfaceView(ctx) {
              val renderer = ForestRenderer(onError)
              @Volatile var fps = 30
              private var running = false
              private var last = 0L
              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val n = System.nanoTime()
                      if (n - last >= 1_000_000_000L / fps) {
                          last = n
                          requestRender()
                      }
                      postOnAnimation(this)
                  }
              }

              init {
                  setEGLContextClientVersion(2)
                  preserveEGLContextOnPause = true
                  setRenderer(renderer)
                  renderMode = RENDERMODE_WHEN_DIRTY
              }

              override fun onResume() {
                  super.onResume()
                  running = true
                  postOnAnimation(tick)
              }

              override fun onPause() {
                  running = false
                  removeCallbacks(tick)
                  super.onPause()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  if (w > 0 && h > 0) holder.setFixedSize(maxOf(2, w / 2), maxOf(2, h / 2))
              }
          }
          EOF

      - name: Build signed release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Show the real error (only if the build failed)
        if: failure()
        run: |
          {
            echo "### Build failed - first errors"
            echo '```'
            grep -E -A3 '^e: |What went wrong|error:' build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log + generated sources (only if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            build.log
            app/src/main/java
            app/src/main/AndroidManifest.xml
            app/build.gradle.kts
          retention-days: 7

      - name: Verify and name the APK
        run: |
          APK="MossLocal-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" > cert.txt
          head -3 cert.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsdcli.so' || { echo "::error::sd-cli missing from APK"; exit 1; }
          sha256sum "$APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release (tag = v<versionCode>, used by in-app updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MossLocal ${{ env.VERSION_NAME }}
          files: |
            MossLocal-${{ env.VERSION_NAME }}.apk
            SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: MossLocal-apk
          path: MossLocal-*.apk
          retention-days: 14
