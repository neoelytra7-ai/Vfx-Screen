              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  val a = ev.actionMasked
                  if (a == MotionEvent.ACTION_DOWN || (a == MotionEvent.ACTION_MOVE && ev.eventTime - lastPoke > 140)) {
                      lastPoke = ev.eventTime
                      val loc = IntArray(2)
                      glView.getLocationOnScreen(loc)
                      if (glView.width > 0 && glView.height > 0) {
                          val r = glView.renderer
                          r.touchX = ((ev.rawX - loc[0]) / glView.width).coerceIn(0f, 1f)
                          r.touchY = (1f - (ev.rawY - loc[1]) / glView.height).coerceIn(0f, 1f)
                          r.touchNs = System.nanoTime()
                      }
                  }
                  return super.dispatchTouchEvent(ev)
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
                  if (soundOn) ambience.start()
              }

              override fun onPause() {
                  glView.onPause()
                  ambience.stop()
                  super.onPause()
              }

              override fun onDestroy() {
                  cancel = true
                  proc?.destroyForcibly()
                  ambience.stop()
                  super.onDestroy()
              }

              private fun refreshSpinner(keep: Int) {
                  val names = presets.map { (if (validModel(presetFile(it))) "\u2713 " else "\u2193 ") + it.label } +
                      "Custom / MOSS-Image (advanced)"
                  spinner.adapter = ForestAdapter(names)
                  spinner.setSelection(keep.coerceIn(0, names.size - 1))
              }

              private fun showImage(bmp: Bitmap?) {
                  if (bmp == null) return
                  placeholder.visibility = View.GONE
                  img.visibility = View.VISIBLE
                  img.setImageBitmap(bmp)
                  img.alpha = 0f; img.scaleX = 0.94f; img.scaleY = 0.94f
                  img.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(700)
                      .setInterpolator(DecelerateInterpolator()).start()
              }

              // ---------- model sanity ----------
              private fun validModel(f: File): Boolean {
                  if (!f.exists() || f.length() < 1_000_000) return false
                  return try {
                      f.inputStream().use { i ->
                          val h = ByteArray(8)
                          if (i.read(h) < 8) false
                          else if (f.name.endsWith(".gguf")) String(h, 0, 4, Charsets.US_ASCII) == "GGUF"
                          else {
                              var n = 0L
                              for (k in 7 downTo 0) n = (n shl 8) or (h[k].toLong() and 0xff)
                              n in 2L..100_000_000L
                          }
                      }
                  } catch (e: Exception) { false }
              }

              private fun modelArgs(idx: Int): List<String>? =
                  if (idx < presets.size) {
                      val f = presetFile(presets[idx])
                      if (validModel(f)) listOf("-m", f.absolutePath) else null
                  } else {
                      if (listOf(dit, te, vae).all { validModel(it) })
                          listOf("--diffusion-model", dit.absolutePath, "--llm", te.absolutePath, "--vae", vae.absolutePath)
                      else null
                  }

              // ---------- generate ----------
              private fun generate(idx: Int, text: String, sizeIn: Int, steps: Int, cfg: String, extra: String) {
                  if (busy) { log("Already running."); return }
                  val margs = modelArgs(idx)
                  if (margs == null) { log("Model not downloaded yet. Tap 'Download selected model'."); return }
                  var size = (sizeIn.coerceIn(256, 1536) / 64) * 64
                  val free = availMemMb()
                  val need = if (idx < presets.size) presets[idx].mb + 600 else 3500
                  if (free in 0 until need.toLong()) {
                      log("Low RAM: $free MB free, this model wants ~$need MB. Close other apps.")
                      if (size > 512) { size = 512; log("Forcing 512px.") }
                  }
                  cancel = false
                  setBusy(true)
                  val out = File(cacheDir, "out.png").also { it.delete() }
                  val t0 = System.currentTimeMillis()
                  try {
                      val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                      val cmd = mutableListOf(bin.absolutePath)
                      cmd += margs
                      cmd += listOf("-p", text, "-W", "$size", "-H", "$size", "--steps", "$steps",
                          "--cfg-scale", cfg, "-o", out.absolutePath, "-v")
                      cmd += extra.split(" ").filter { it.isNotBlank() }
                      log("RUN: " + cmd.joinToString(" "))
                      val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                      pb.environment()["LD_LIBRARY_PATH"] = libEnv
                      val p = pb.start(); proc = p
                      var gpu = false
                      val gpuRe = Regex("opencl|adreno", RegexOption.IGNORE_CASE)
                      p.inputStream.bufferedReader().forEachLine { line ->
                          if (!gpu && gpuRe.containsMatchIn(line)) gpu = true
                          log(line)
                      }
                      val code = p.waitFor()
                      log("exit=$code | " + ((System.currentTimeMillis() - t0) / 1000) + " s")
                      log("Backend: " + if (gpu) "GPU (OpenCL/Adreno detected)" else "CPU only (no OpenCL/Adreno line in engine output)")
                      if (out.exists()) {
                          val bmp = BitmapFactory.decodeFile(out.absolutePath)
                          ui.post { showImage(bmp) }
                          saveToGallery(out)
                          ambience.chime()
                      } else if (cancel) log("Stopped.")
                      else if (code == 137 || code == 9) log("Android killed the engine (out of memory). Close other apps or pick the Q4_0 model.")
                      else log("No image produced. Open the log above, or run Self-test.")
                  } catch (e: Exception) { log("ERR: $e") }
                  finally { proc = null; setBusy(false) }
              }

              private fun saveToGallery(f: File) {
                  try {
                      val name = "moss_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".png"
                      val v = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/MossLocal")
                      }
                      val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return
                      contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { it.copyTo(o) } }
                      log("Saved to Pictures/MossLocal/$name")
                  } catch (e: Exception) { log("Gallery save failed: $e") }
              }

              // ---------- self-test ----------
              private fun selfTest() {
                  if (busy) { log("Busy."); return }
                  setBusy(true); cancel = false
                  try {
                      val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                      log("Engine: exists=${bin.exists()} size=${bin.length() / 1024} KB executable=${bin.canExecute()}")
                      log("Free RAM ${availMemMb()} MB | free disk ${freeDiskMb()} MB")
                      presets.forEach { log("${it.id}: " + if (validModel(presetFile(it))) "downloaded" else "not downloaded") }
                      val pb = ProcessBuilder(bin.absolutePath, "--help").redirectErrorStream(true)
                      pb.environment()["LD_LIBRARY_PATH"] = libEnv
                      val p = pb.start(); proc = p
                      val txt = p.inputStream.bufferedReader().readText()
                      p.waitFor()
                      log("Help output: ${txt.lines().size} lines")
                      listOf("-m", "--sampling-method", "--vae-tiling", "--diffusion-model", "--llm")
                          .forEach { log("flag $it: " + if (txt.contains(it)) "supported" else "NOT in this engine build") }
                      log("'lcm' sampler listed: " + txt.contains("lcm", ignoreCase = true))
                      log("MOSS mentioned in engine help: " + txt.contains("moss", ignoreCase = true))
                  } catch (e: Exception) { log("Self-test failed: $e") }
                  finally { proc = null; setBusy(false) }
              }

              // ---------- downloads: resumable, retrying, validated, with progress ----------
              private fun downloadSelected(idx: Int, a: String, b: String, c: String) {
                  if (busy) { log("Busy."); return }
                  setBusy(true); cancel = false
                  try {
                      val jobs = if (idx < presets.size) listOf(presets[idx].url to presetFile(presets[idx]))
                                 else listOf(a to dit, b to te, c to vae)
                      jobs.forEach { (u, f) ->
                          if (cancel) return@forEach
                          if (u.isBlank()) { log("No URL for ${f.name}"); return@forEach }
                          if (!u.startsWith("https://")) { log("URL for ${f.name} must start with https://"); return@forEach }
                          if (validModel(f)) { log("${f.name} already OK"); return@forEach }
                          var ok = false
                          for (attempt in 1..4) {
                              if (cancel) break
                              try { download(u, f); ok = true; break }
                              catch (e: Exception) {
                                  if (cancel) break
                                  log("${f.name} attempt $attempt failed: $e")
                                  try { Thread.sleep(2000L * attempt) } catch (ie: InterruptedException) { }
                              }
                          }
                          if (ok && !validModel(f)) { log("${f.name} is not a valid model file. Deleted."); f.delete() }
                          if (ok && validModel(f)) ambience.chime()
                      }
                      log(if (cancel) "Download cancelled. Progress kept; tap again to resume." else "Download step finished.")
                  } finally {
                      setBusy(false)
                      ui.post { status.text = ""; bar.progress = 0; refreshSpinner(idx) }
                  }
              }

              private fun download(u: String, dest: File) {
                  val part = File(dest.path + ".part")
                  val have = if (part.exists()) part.length() else 0L
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 30000; c.readTimeout = 60000; c.instanceFollowRedirects = true
                  if (have > 0) c.setRequestProperty("Range", "bytes=$have-")
                  val code = c.responseCode
                  if (code == 416) { part.renameTo(dest); return }
                  if (code !in 200..299) throw RuntimeException("HTTP $code")
                  val append = code == 206
                  val total = if (append) have + c.contentLengthLong else c.contentLengthLong
                  val need = (if (total > 0) total else 0L) - (if (append) have else 0L)
                  val free = StatFs(modelDir.path).availableBytes
                  if (need > free - (200L shl 20)) throw RuntimeException("Not enough storage: need ${need shr 20} MB, free ${free shr 20} MB")
                  log("Downloading ${dest.name} (${total shr 20} MB)")
                  RandomAccessFile(part, "rw").use { raf ->
                      if (append) raf.seek(have) else raf.setLength(0)
                      var done = if (append) have else 0L
                      var lastUi = 0L
                      c.inputStream.use { inp ->
                          val buf = ByteArray(1 shl 20)
                          while (true) {
                              if (cancel) throw RuntimeException("cancelled")
                              val n = inp.read(buf); if (n < 0) break
                              raf.write(buf, 0, n); done += n
                              if (done - lastUi > (2L shl 20)) { lastUi = done; setProgress(done, total, dest.name) }
                          }
                      }
                  }
                  if (total > 0 && part.length() != total) throw RuntimeException("incomplete (${part.length()} of $total bytes)")
                  dest.delete()
                  if (!part.renameTo(dest)) throw RuntimeException("could not finalize file")
                  log("${dest.name} done")
              }

              private fun setProgress(done: Long, total: Long, name: String) {
                  ui.post {
                      if (total > 0) { bar.max = 1000; bar.progress = (done * 1000 / total).toInt() }
                      status.text = "$name: ${done shr 20} / ${total shr 20} MB"
                  }
              }

              // ---------- in-place self update from GitHub Releases ----------
              private fun sha256(f: File): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  f.inputStream().use { i ->
                      val b = ByteArray(1 shl 16)
                      while (true) { val n = i.read(b); if (n < 0) break; md.update(b, 0, n) }
                  }
                  return md.digest().joinToString("") { "%02x".format(it) }
              }

              private fun httpText(u: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000; c.readTimeout = 30000; c.instanceFollowRedirects = true
                  return c.inputStream.bufferedReader().readText()
              }

              private fun selfUpdate() {
                  if (busy) { log("Wait until the current job ends."); return }
                  try {
                      if (!packageManager.canRequestPackageInstalls()) {
                          log("Allow 'Install unknown apps' for MossLocal, then tap Update again.")
                          ui.post { startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName"))) }
                          return
                      }
                      val c = URL("https://api.github.com/repos/${BuildConfig.REPO_SLUG}/releases/latest").openConnection() as HttpURLConnection
                      c.connectTimeout = 15000; c.readTimeout = 30000
                      c.setRequestProperty("Accept", "application/vnd.github+json")
                      when (c.responseCode) {
                          200 -> { }
                          404 -> { log("No release found (repo is private, or nothing published yet)."); return }
                          403, 429 -> { log("GitHub rate limit reached. Try again later."); return }
                          else -> { log("Update check failed: HTTP ${c.responseCode}"); return }
                      }
                      val j = JSONObject(c.inputStream.bufferedReader().readText())
                      val remote = j.getString("tag_name").removePrefix("v").toIntOrNull()
                      if (remote == null) { log("Unrecognised release tag."); return }
                      if (remote <= BuildConfig.VERSION_CODE) { log("Up to date (build ${BuildConfig.VERSION_CODE})."); return }
                      var apkUrl = ""; var apkName = ""; var sumsUrl = ""
                      val assets = j.getJSONArray("assets")
                      for (i in 0 until assets.length()) {
                          val a = assets.getJSONObject(i); val n = a.getString("name")
                          if (n.endsWith(".apk")) { apkUrl = a.getString("browser_download_url"); apkName = n }
                          if (n == "SHA256SUMS.txt") sumsUrl = a.getString("browser_download_url")
                      }
                      if (apkUrl.isEmpty()) { log("Release has no APK."); return }
                      log("Downloading build $remote ...")
                      val apk = File(externalCacheDir, "update.apk"); apk.delete()
                      val d = URL(apkUrl).openConnection() as HttpURLConnection
                      d.connectTimeout = 30000; d.readTimeout = 60000; d.instanceFollowRedirects = true
                      d.inputStream.use { i -> apk.outputStream().use { o -> i.copyTo(o) } }
                      if (sumsUrl.isNotEmpty()) {
                          val expected = httpText(sumsUrl).lines().firstOrNull { it.contains(apkName) }
                              ?.trim()?.split(Regex("\\s+"))?.firstOrNull()
                          if (expected == null || !expected.equals(sha256(apk), ignoreCase = true)) {
                              apk.delete(); log("Checksum mismatch - update rejected."); return
                          }
                          log("Checksum OK.")
                      } else log("Warning: release has no checksum file.")
                      val uri = FileProvider.getUriForFile(this, "com.mosslocal.app.files", apk)
                      val inst = Intent(Intent.ACTION_VIEW).setDataAndType(uri, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      log("Installing over the current app. Models and settings are kept.")
                      ui.post { startActivity(inst) }
                  } catch (e: Exception) { log("Update failed: $e") }
              }
          }
