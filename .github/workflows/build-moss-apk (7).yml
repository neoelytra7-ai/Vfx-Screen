# Save as: .github/workflows/build-moss-apk.yml
#
# MossLocal: Android app that runs diffusion models on-device via stable-diffusion.cpp
# (Adreno GPU through OpenCL, CPU NEON/i8mm fallback). Built-in one-tap model downloads:
# DreamShaper-7 LCM, SD-Turbo, SD 1.5 (Q4_0/Q8_0). 'Custom' slot is kept for MOSS-Image GGUFs.
# UI: live OpenGL forest (waving grass, flowing river with reflections, fireflies, touch ripples)
# plus a procedurally synthesized forest soundscape. No extra assets or downloads.
#
# NO SECRETS NEEDED. The signing key is created on the first run and kept in the repo cache.
# A weekly keep-alive job touches that cache so GitHub never evicts it (7-day rule).
# If the key were ever lost, the build STOPS instead of silently making a new one
# (a new key would block in-place updates). Override with allow_new_key=true.
#
# Optional: set KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS secrets to use your own key.
#
# UPDATES: same applicationId + same key + increasing versionCode (= run number) => Android
# installs the new APK OVER the old one. Models are stored outside the APK and survive updates.
# (Uninstalling the app deletes them.) The app's "Update app" button reads the latest Release,
# verifies its SHA-256, then hands it to Android's installer.
# NOTE: the in-app updater needs a PUBLIC repo (private repos return 404 to anonymous requests).

name: Build MossLocal APK

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 0"                               # weekly: only runs the keep-alive job
  workflow_dispatch:
    inputs:
      sd_cpp_ref:
        description: "stable-diffusion.cpp branch/tag/commit"
        default: "master"
      extra_args:
        description: "Default extra sd-cli args shipped in the app (editable in-app)"
        default: "--diffusion-fa --offload-to-cpu --vae-tiling"
      allow_new_key:
        description: "Allow creating a NEW signing key (breaks in-place updates of installed apps)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moss-apk
  cancel-in-progress: false

env:
  SD_CPP_REF: ${{ inputs.sd_cpp_ref || 'master' }}
  EXTRA_ARGS: ${{ inputs.extra_args || '--diffusion-fa --offload-to-cpu --vae-tiling' }}
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}
  REPO_SLUG: ${{ github.repository }}

jobs:
  keepalive:
    name: Keep signing key cache alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        id: k
        with:
          path: ~/.moss-key
          key: moss-signing-key-v1
      - run: |
          if [ "${{ steps.k.outputs.cache-hit }}" = "true" ]; then
            echo "Signing key cache is alive."
          else
            echo "::warning::Signing key cache NOT found. Next build will refuse to make a new key unless allow_new_key=true."
          fi

  native:
    name: Build sd-cli (arm64, OpenCL/Adreno + NEON)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake git

      - name: Fetch stable-diffusion.cpp
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp
          git checkout "$SD_CPP_REF"
          git submodule update --init --recursive
          echo "SD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check this ref knows MOSS-Image
        run: |
          if grep -rIil "moss" sdcpp/src sdcpp/docs sdcpp/README.md 2>/dev/null | head -1 | grep -q .; then
            echo "MOSS references found in sd.cpp source."
          else
            echo "::warning::No 'moss' reference found in stable-diffusion.cpp at $SD_COMMIT. MOSS-Image will not load until sd.cpp supports it."
          fi

      - name: Build OpenCL headers + ICD stub (link-time only)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          TC="$NDK/build/cmake/android.toolchain.cmake"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git
          cmake -S OpenCL-Headers -B oh -DCMAKE_INSTALL_PREFIX="$HOME/ocl"
          cmake --build oh --target install
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git
          cmake -S OpenCL-ICD-Loader -B ol -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 \
            -DANDROID_STL=c++_static \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$HOME/ocl/include" \
            -DCMAKE_INSTALL_PREFIX="$HOME/ocl" -DCMAKE_BUILD_TYPE=Release
          cmake --build ol --target install

      - name: Compile sd-cli
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S sdcpp -B sdcpp/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON -DGGML_OPENCL_EMBED_KERNELS=ON \
            -DOpenCL_INCLUDE_DIR="$HOME/ocl/include" -DOpenCL_LIBRARY="$HOME/ocl/lib/libOpenCL.so" \
            -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_EXAMPLES=ON
          cmake --build sdcpp/build --target sd-cli || cmake --build sdcpp/build --target sd
          BIN=$(find sdcpp/build -type f \( -name sd-cli -o -name sd \) | head -1)
          test -n "$BIN"
          mkdir -p out
          cp "$BIN" out/libsdcli.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/libsdcli.so
          ls -l out
          grep -rhoE '"--[a-z0-9-]+"' sdcpp/examples 2>/dev/null | sort -u > out/cli_flags.txt || true
          { echo "### sd.cpp commit \`$SD_COMMIT\`"; echo "Supported CLI flags:"; echo '```'; cat out/cli_flags.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sdcli
          path: out/libsdcli.so
          retention-days: 7

  apk:
    name: Scaffold, build, sign, release
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - uses: actions/download-artifact@v4
        with: { name: sdcli, path: native }

      - name: Sanitize extra args (quotes would break the generated Kotlin)
        run: |
          CLEAN=$(printf '%s' "$EXTRA_ARGS" | tr -d '"\\$`\n\r')
          echo "EXTRA_ARGS=$CLEAN" >> "$GITHUB_ENV"

      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.moss-key
          key: moss-signing-key-v1

      - name: Prepare signing key
        env:
          KS_B64_SECRET: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          ALLOW_NEW_KEY: ${{ inputs.allow_new_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.moss-key
          if [ -n "$KS_B64_SECRET" ]; then
            echo "$KS_B64_SECRET" | base64 -d > ~/.moss-key/release.jks
            PW="$KS_PASS_SECRET"; AL="$KS_ALIAS_SECRET"
            echo "Using key from repo secrets."
          elif [ -f ~/.moss-key/release.jks ] && [ -f ~/.moss-key/pass.txt ]; then
            PW=$(cat ~/.moss-key/pass.txt); AL=moss
            echo "Using key restored from cache."
          else
            if [ "$ALLOW_NEW_KEY" != "true" ] && [ -n "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 2>/dev/null)" ]; then
              echo "::error::Signing key is missing but releases already exist. A new key would block in-place updates of installed apps. Re-run with allow_new_key=true only if you accept uninstall/reinstall."
              exit 1
            fi
            PW=$(openssl rand -hex 24); AL=moss
            keytool -genkeypair -keystore ~/.moss-key/release.jks -alias moss \
              -storepass "$PW" -keypass "$PW" -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=MossLocal, O=MossLocal, C=ID"
            echo "$PW" > ~/.moss-key/pass.txt
            echo "::notice::New signing key created and cached."
          fi
          echo "::add-mask::$PW"
          echo "KS_PATH=$HOME/.moss-key/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PW" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$AL" >> "$GITHUB_ENV"

      - name: Scaffold Android project
        run: |
          mkdir -p app/src/main/{java/com/mosslocal/app,res/xml,res/values,res/drawable,res/mipmap-anydpi-v26,jniLibs/arm64-v8a}
          cp native/libsdcli.so app/src/main/jniLibs/arm64-v8a/libsdcli.so

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MossLocal"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx3g" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          fun env(k: String) = System.getenv(k) ?: ""
          android {
              namespace = "com.mosslocal.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mosslocal.app"      // never change: identity used for updates
                  minSdk = 29
                  targetSdk = 34
                  versionCode = (System.getenv("VERSION_CODE") ?: "1").toInt()
                  versionName = System.getenv("VERSION_NAME") ?: "1.0.0"
                  ndk { abiFilters += "arm64-v8a" }
                  buildConfigField("String", "EXTRA_ARGS", "\"" + env("EXTRA_ARGS") + "\"")
                  buildConfigField("String", "REPO_SLUG", "\"" + env("REPO_SLUG") + "\"")
              }
              buildFeatures { buildConfig = true }
              lint { checkReleaseBuilds = false; abortOnError = false }
              signingConfigs {
                  create("release") {
                      storeFile = file(env("KS_PATH"))
                      storePassword = env("KS_PASS")
                      keyAlias = env("KS_ALIAS")
                      keyPassword = env("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }   // extract .so so the binary can be exec'd
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-feature android:glEsVersion="0x00020000" android:required="true"/>
              <application android:label="MossLocal" android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:allowBackup="false" android:largeHeap="true"
                  android:usesCleartextTraffic="false">
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider"
                      android:authorities="com.mosslocal.app.files" android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <paths><external-cache-path name="updates" path="."/></paths>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="ic_bg">#101820</color></resources>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7C5CFF" android:pathData="M30,54 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M42,64 L42,44 L54,56 L66,44 L66,64 L61,64 L61,53 L54,60 L47,53 L47,64 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/mosslocal/app/MainActivity.kt <<'EOF'
          package com.mosslocal.app

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.view.animation.DecelerateInterpolator
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.core.content.FileProvider
          import org.json.JSONObject
          import java.io.File
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          data class Preset(
              val id: String, val label: String, val url: String, val mb: Int,
              val steps: Int, val cfg: String, val extra: String
          )

          class MainActivity : Activity() {
              private val ui = Handler(Looper.getMainLooper())
              private val ambience = Ambience()
              private lateinit var glView: ForestGL
              private lateinit var prefs: SharedPreferences
              private lateinit var logView: TextView
              private lateinit var img: ImageView
              private lateinit var placeholder: TextView
              private lateinit var gen: Button
              private lateinit var soundBtn: Button
              private lateinit var spinner: Spinner
              private lateinit var status: TextView
              private lateinit var bar: ProgressBar
              private lateinit var customBox: LinearLayout
              @Volatile private var proc: Process? = null
              @Volatile private var busy = false
              @Volatile private var cancel = false
              private var lastSel = -1
              private var lastPoke = 0L
              private var calm = false
              private var soundOn = true

              // Single-file GGUF models (CLIP + UNet + VAE inside) that stable-diffusion.cpp can run on the GPU (OpenCL).
              private val presets = listOf(
                  Preset("dreamshaper_lcm", "DreamShaper-7 LCM - realistic, 4 steps (2.1 GB)",
                      "https://huggingface.co/darkmaniac7/TokForge-DreamShaper-LCM-GGUF/resolve/main/dreamshaper-7-lcm-f16.gguf",
                      2100, 4, "1.5", "--sampling-method lcm --vae-tiling"),
                  Preset("sd_turbo", "SD-Turbo - fastest, 1 step (2.0 GB)",
                      "https://huggingface.co/Green-Sky/SD-Turbo-GGUF/resolve/main/sd_turbo-f16-q8_0.gguf",
                      2020, 1, "1.0", "--vae-tiling"),
                  Preset("sd15_q4", "Stable Diffusion 1.5 Q4_0 - lowest RAM (1.75 GB)",
                      "https://huggingface.co/gpustack/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-Q4_0.gguf",
                      1750, 20, "7.0", "--vae-tiling"),
                  Preset("sd15_q8", "Stable Diffusion 1.5 Q8_0 - better quality (1.9 GB)",
                      "https://huggingface.co/gpustack/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-Q8_0.gguf",
                      1880, 20, "7.0", "--vae-tiling")
              )
              private val customIdx get() = presets.size

              // Models live outside the APK -> survive app updates (deleted only on uninstall)
              private val modelDir get() = File(getExternalFilesDir(null), "models").apply { mkdirs() }
              private fun presetFile(p: Preset) = File(modelDir, "model_${p.id}.gguf")
              private val dit get() = File(modelDir, "moss_dit.gguf")
              private val te get() = File(modelDir, "qwen35_te.gguf")
              private val vae get() = File(modelDir, "flux2_vae.safetensors")
              private val logFile get() = File(getExternalFilesDir(null), "last-log.txt")
              private val libEnv = "/vendor/lib64:/system/lib64:/vendor/lib64/egl"

              private fun log(s: String) {
                  try { logFile.appendText(s + "\n") } catch (e: Exception) { }
                  ui.post {
                      logView.append(s + "\n")
                      if (logView.length() > 20000) logView.text = logView.text.toString().takeLast(12000)
                  }
              }

              private fun applyFps() {
                  glView.fps = if (busy) 10 else if (calm) 15 else 30
              }

              private fun setBusy(b: Boolean) {
                  busy = b
                  ui.post {
                      gen.isEnabled = !b
                      gen.alpha = if (b) 0.6f else 1f
                      gen.text = if (b) "Working in the forest\u2026" else "Generate"
                      glView.renderer.busy = if (b) 1f else 0f
                      ambience.intensity = if (b) 1f else 0f
                      applyFps()
                  }
              }

              private fun availMemMb(): Long = try {
                  File("/proc/meminfo").readLines().first { it.startsWith("MemAvailable") }
                      .filter { it.isDigit() }.toLong() / 1024
              } catch (e: Exception) { -1L }

              private fun freeDiskMb(): Long = StatFs(modelDir.path).availableBytes shr 20

              private inner class ForestAdapter(names: List<String>) :
                  ArrayAdapter<String>(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, names) {
                  override fun getView(pos: Int, cv: View?, parent: ViewGroup): View {
                      val v = super.getView(pos, cv, parent) as TextView
                      v.setTextColor(Pal.text); v.textSize = 14f
                      return v
                  }
                  override fun getDropDownView(pos: Int, cv: View?, parent: ViewGroup): View {
                      val v = super.getDropDownView(pos, cv, parent) as TextView
                      v.setTextColor(Pal.text); v.textSize = 14f
                      v.setBackgroundColor(0xF00A2216.toInt())
                      v.setPadding(dp(16), dp(14), dp(16), dp(14))
                      return v
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  calm = prefs.getBoolean("calm", false)
                  soundOn = prefs.getBoolean("sound", true)
                  ambience.volume = prefs.getInt("vol", 60) / 100f
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Pal.dark
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  try { logFile.writeText("") } catch (e: Exception) { }
                  File(externalCacheDir, "update.apk").delete()

                  glView = ForestGL(this) { msg -> log(msg) }

                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT
                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), 0, dp(16), dp(48))
                  }
                  val scroll = ScrollView(this).apply {
                      addView(content)
                      isVerticalScrollBarEnabled = false
                      overScrollMode = View.OVER_SCROLL_NEVER
                  }
                  val frame = FrameLayout(this)
                  frame.addView(glView, FrameLayout.LayoutParams(mp, mp))
                  frame.addView(scroll, FrameLayout.LayoutParams(mp, mp))

                  soundBtn = pill(this, "", 2).apply {
                      minHeight = dp(40); minimumHeight = dp(40); textSize = 13f
                      setPadding(dp(16), 0, dp(16), 0)
                      background = android.graphics.drawable.RippleDrawable(
                          ColorStateList.valueOf(0x55FFFFFF), glass(this@MainActivity, 20, 0x77051A10), null
                      )
                  }
                  frame.addView(soundBtn, FrameLayout.LayoutParams(wc, dp(40)).apply {
                      gravity = Gravity.TOP or Gravity.END
                      marginEnd = dp(16); topMargin = dp(36)
                  })
                  setContentView(frame)

                  fun labeled(label: String, v: View): LinearLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(TextView(this@MainActivity).apply {
                          text = label; textSize = 11f; setTextColor(Pal.sub); setPadding(dp(4), 0, 0, dp(4))
                      })
                      addView(v)
                  }
                  fun row(vararg vs: View): LinearLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      vs.forEachIndexed { i, v ->
                          addView(v, LinearLayout.LayoutParams(0, wc, 1f).apply { if (i > 0) leftMargin = dp(10) })
                      }
                  }

                  // ---- hero ----
                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.BOTTOM
                      minimumHeight = dp(300)
                      setPadding(dp(8), dp(56), dp(8), dp(22))
                  }
                  hero.addView(TextView(this).apply {
                      text = "MossLocal"; textSize = 42f; setTextColor(Pal.text)
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      setShadowLayer(18f, 0f, 3f, 0xAA000000.toInt())
                  })
                  hero.addView(TextView(this).apply {
