          package com.mosslocal.app

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Process
          import java.util.Random
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.sin

          /**
           * Procedural forest soundscape, synthesized live (nothing to download):
           * stereo river (pink noise, band-limited, burbling), gusting wind, leaf rustle,
           * birds with panning, water drops, and a soft chime when an image finishes.
           */
          class Ambience {
              @Volatile var volume = 0.6f
              @Volatile var intensity = 0f
              @Volatile private var wantOn = false
              @Volatile private var chimePending = false
              @Volatile private var gain = 0.0
              private var loopRunning = false

              @Synchronized fun start() {
                  wantOn = true
                  if (!loopRunning) {
                      loopRunning = true
                      val t = Thread { loop() }
                      t.name = "ambience"
                      t.isDaemon = true
                      t.start()
                  }
              }

              @Synchronized fun stop() { wantOn = false }

              fun chime() { chimePending = true }

              @Synchronized private fun tryExit(): Boolean {
                  if (!wantOn && gain < 0.002) { loopRunning = false; return true }
                  return false
              }

              private class Voice(val type: Int) {
                  var phase = 0.0
                  var f0 = 0.0
                  var f1 = 0.0
                  var len = 1
                  var pos = 0
                  var amp = 0.0
                  var pan = 0.5
                  var notesLeft = 0
                  var gap = 0
                  var done = false
              }

              private fun loop() {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_AUDIO)
                  val sr = 32000
                  val minBuf = AudioTrack.getMinBufferSize(sr, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT)
                  val track = try {
                      AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(sr)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_STEREO)
                                  .build()
                          )
                          .setBufferSizeInBytes(maxOf(minBuf, 16384))
                          .setTransferMode(AudioTrack.MODE_STREAM)
                          .build()
                  } catch (e: Exception) {
                      synchronized(this) { loopRunning = false }
                      return
                  }
                  track.play()

                  val rnd = Random(7)
                  val n = 1024
                  val out = ShortArray(n * 2)
                  val twoPi = 2.0 * PI
                  val pk = Array(2) { DoubleArray(7) }
                  val hpS = DoubleArray(2)
                  val lpS = DoubleArray(2)
                  val leafS = DoubleArray(2)
                  val aHp = 1.0 - exp(-twoPi * 180.0 / sr)
                  val aLp = 1.0 - exp(-twoPi * 3500.0 / sr)
                  val aLeaf = 1.0 - exp(-twoPi * 2500.0 / sr)
                  val ph = doubleArrayOf(0.0, 1.7, 3.1, 4.4)
                  var w1 = 0.0
                  var w2 = 0.0
                  var wA = 0.05
                  var gust = 0.4
                  var gustT = 0.4
                  val voices = ArrayList<Voice>()
                  var nextBird = sr * 2L
                  var nextDrop = sr * 4L
                  var ts = 0L
                  var running = true

                  while (running) {
                      for (i in 0 until n) {
                          if (ts % 64L == 0L) {
                              val fc = 220.0 + 700.0 * gust
                              wA = 1.0 - exp(-twoPi * fc / sr)
                          }
                          if (ts % (sr * 3L) == 0L) {
                              val r0 = rnd.nextDouble()
                              val inten = intensity.toDouble()
                              gustT = (0.12 + 0.88 * r0 * r0) * (1.0 - 0.4 * inten) + 0.4 * inten
                          }
                          gust += (gustT - gust) * 0.00004

                          // river: decorrelated stereo pink noise, band-limited, burbling
                          val tt = ts.toDouble() / sr
                          var rl = 0.0
                          var rr = 0.0
                          for (c in 0..1) {
                              val white = rnd.nextDouble() * 2.0 - 1.0
                              val s = pk[c]
                              s[0] = 0.99886 * s[0] + white * 0.0555179
                              s[1] = 0.99332 * s[1] + white * 0.0750759
                              s[2] = 0.96900 * s[2] + white * 0.1538520
                              s[3] = 0.86650 * s[3] + white * 0.3104856
                              s[4] = 0.55000 * s[4] + white * 0.5329522
                              s[5] = -0.7616 * s[5] - white * 0.0168980
                              val pink = (s[0] + s[1] + s[2] + s[3] + s[4] + s[5] + s[6] + white * 0.5362) * 0.11
                              s[6] = white * 0.115926
                              hpS[c] += aHp * (pink - hpS[c])
                              val hp = pink - hpS[c]
                              lpS[c] += aLp * (hp - lpS[c])
                              val mod = 0.72 + 0.16 * sin(twoPi * 3.1 * tt + ph[c]) + 0.12 * sin(twoPi * 7.3 * tt + ph[c + 2])
                              val v = lpS[c] * mod * 3.0
                              if (c == 0) rl = v else rr = v
                          }

                          // wind + leaf rustle
                          val wn = rnd.nextDouble() * 2.0 - 1.0
                          w1 += wA * (wn - w1)
                          w2 += wA * (w1 - w2)
                          val wind = w2 * 7.0 * (0.20 + 0.9 * gust)
                          var ll = 0.0
                          var lr = 0.0
                          for (c in 0..1) {
                              val x = rnd.nextDouble() * 2.0 - 1.0
                              leafS[c] += aLeaf * (x - leafS[c])
                              val leaf = (x - leafS[c]) * gust * gust * 0.10
                              if (c == 0) ll = leaf else lr = leaf
                          }
                          var l = rl * 0.55 + wind * 0.9 + ll
                          var r = rr * 0.55 + wind * 0.9 + lr

                          // scheduled events
                          if (ts >= nextBird) {
                              val v = Voice(0)
                              v.notesLeft = 2 + rnd.nextInt(4)
                              v.f0 = 2200.0 + rnd.nextDouble() * 3000.0
                              v.f1 = (v.f0 * (0.7 + 0.9 * rnd.nextDouble())).coerceIn(1500.0, 7000.0)
                              v.len = (sr * (0.05 + 0.07 * rnd.nextDouble())).toInt()
                              v.amp = 0.10 + 0.12 * rnd.nextDouble()
                              v.pan = rnd.nextDouble()
                              voices.add(v)
                              nextBird = ts + (sr * (1.2 + 5.0 * rnd.nextDouble())).toLong()
                          }
                          if (ts >= nextDrop) {
                              val v = Voice(1)
                              v.f0 = 500.0 + rnd.nextDouble() * 500.0
                              v.f1 = v.f0 * 0.35
                              v.len = (sr * 0.14).toInt()
                              v.amp = 0.16
                              v.pan = rnd.nextDouble()
                              voices.add(v)
                              nextDrop = ts + (sr * (2.0 + 6.0 * rnd.nextDouble())).toLong()
                          }
                          if (chimePending) {
                              chimePending = false
                              val v = Voice(2)
                              v.f0 = 659.0
                              v.len = (sr * 2.2).toInt()
                              v.amp = 0.16
                              v.pan = 0.5
                              voices.add(v)
                          }

                          for (v in voices) {
                              if (v.done) continue
                              var s = 0.0
                              when (v.type) {
                                  0 -> {
                                      if (v.pos < v.len) {
                                          val p = v.pos.toDouble() / v.len
                                          val f = v.f0 + (v.f1 - v.f0) * p + 70.0 * sin(twoPi * 30.0 * tt)
                                          v.phase += twoPi * f / sr
                                          val env = sin(PI * p)
                                          s = (sin(v.phase) + 0.25 * sin(2.0 * v.phase)) * env * env * v.amp
                                          v.pos++
                                          if (v.pos >= v.len) {
                                              v.gap = (sr * (0.04 + 0.08 * rnd.nextDouble())).toInt()
                                              v.notesLeft--
                                          }
                                      } else if (v.notesLeft <= 0) {
                                          v.done = true
                                      } else {
                                          v.gap--
                                          if (v.gap <= 0) {
                                              v.f0 = (v.f1 * (0.85 + 0.35 * rnd.nextDouble())).coerceIn(1800.0, 6000.0)
                                              v.f1 = (v.f0 * (0.7 + 0.9 * rnd.nextDouble())).coerceIn(1500.0, 7000.0)
                                              v.len = (sr * (0.05 + 0.07 * rnd.nextDouble())).toInt()
                                              v.pos = 0
                                          }
                                      }
                                  }
                                  1 -> {
                                      if (v.pos < v.len) {
                                          val p = v.pos.toDouble() / v.len
                                          val f = v.f0 + (v.f1 - v.f0) * p
                                          v.phase += twoPi * f / sr
                                          s = sin(v.phase) * (1.0 - exp(-v.pos / 30.0)) * exp(-6.0 * p) * v.amp
                                          v.pos++
                                      } else {
                                          v.done = true
                                      }
                                  }
                                  else -> {
                                      if (v.pos < v.len) {
                                          val p = v.pos.toDouble() / v.len
                                          v.phase += twoPi * v.f0 / sr
                                          s = (sin(v.phase) + 0.5 * sin(v.phase * 2.0) + 0.3 * sin(v.phase * 3.0)) *
                                              exp(-3.4 * p) * v.amp * (1.0 - exp(-v.pos / 60.0))
                                          v.pos++
                                      } else {
                                          v.done = true
                                      }
                                  }
                              }
                              l += s * cos(v.pan * PI / 2.0)
                              r += s * sin(v.pan * PI / 2.0)
                          }

                          val target = if (wantOn) 1.0 else 0.0
                          gain += (target - gain) * (if (wantOn) 0.00004 else 0.0004)
                          val vol = volume * gain
                          l = l / (1.0 + abs(l))
                          r = r / (1.0 + abs(r))
                          out[i * 2] = (l * vol * 30000.0).toInt().toShort()
                          out[i * 2 + 1] = (r * vol * 30000.0).toInt().toShort()
                          ts++
                      }
                      voices.removeAll { it.done }
                      if (track.write(out, 0, out.size) < 0) running = false
                      if (tryExit()) running = false
                  }
                  synchronized(this) { loopRunning = false }
                  try { track.stop() } catch (e: Exception) { }
                  track.release()
              }
          }
