          package dev.sysx

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import org.json.JSONArray

          class MainActivity : Activity() {
            private val h = Handler(Looper.getMainLooper())
            private lateinit var host: FrameLayout; private lateinit var liveTv: TextView; private lateinit var lg: TextView
            private val tabs = ArrayList<View>()
            private val tick = object : Runnable {
              override fun run() {
                if (liveTv.isShown) liveTv.text = S.live(this@MainActivity)
                if (lg.isShown) lg.text = Auto.logText()
                h.postDelayed(this, 1000)
              }
            }
            private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
            private fun mono() = TextView(this).apply { typeface = Typeface.MONOSPACE; textSize = 11f; setTextColor(0xFFCDE3F5.toInt()); setPadding(dp(10), dp(10), dp(10), dp(10)) }
            private fun et(hint: String, v: String) = EditText(this).apply { this.hint = hint; setText(v); setTextColor(0xFFE6EEF5.toInt()); setHintTextColor(0xFF6B7C8C.toInt()); textSize = 12f }
            private fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; isAllCaps = false; setOnClickListener { f() } }

            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
              val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(0xFF0B0F14.toInt()) }
              host = FrameLayout(this); root.addView(host, LinearLayout.LayoutParams(-1, 0, 1f))
              val bar = LinearLayout(this)
              liveTv = mono(); lg = mono()
              tabs += infoTab(); tabs += autoTab(); tabs += benchTab(); tabs += liveTab()
              val names = listOf("Info", "Auto", "Bench", "Live")
              tabs.forEachIndexed { i, v ->
                host.addView(v); v.visibility = if (i == 0) View.VISIBLE else View.GONE
                bar.addView(btn(names[i]) { tabs.forEachIndexed { j, w -> w.visibility = if (i == j) View.VISIBLE else View.GONE } }, LinearLayout.LayoutParams(0, -2, 1f))
              }
              root.addView(bar); setContentView(root)
            }
            override fun onResume() { super.onResume(); h.post(tick) }
            override fun onPause() { super.onPause(); h.removeCallbacks(tick) }

            private fun infoTab(): View {
              val t = mono().apply { text = "Collecting…"; setTextIsSelectable(true) }
              Thread { val s = Info.build(this); runOnUiThread { t.text = s } }.start()
              return ScrollView(this).apply { addView(t) }
            }

            private fun benchTab(): View {
              val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(10), dp(10), dp(10), dp(10)) }
              val out = mono(); var running = false
              col.addView(btn("▶ Run full benchmark (~20 s)") {
                if (running) return@btn; running = true
                Thread { try { Bench.run(this) { s -> runOnUiThread { out.text = s } } } finally { running = false } }.start()
              })
              col.addView(out); return ScrollView(this).apply { addView(col) }
            }

            private fun liveTab(): View {
              val p = getSharedPreferences("sx", 0)
              val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(10), dp(10), dp(10), dp(10)) }
              col.addView(btn("Toggle floating overlay") {
                if (!Settings.canDrawOverlays(this)) startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                else { p.edit().putBoolean("overlay", !p.getBoolean("overlay", false)).apply(); Core.sync(this) }
              })
              col.addView(liveTv); return ScrollView(this).apply { addView(col) }
            }

            private fun autoTab(): View {
              val p = getSharedPreferences("sx", 0)
              val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(10), dp(10), dp(10), dp(10)) }
              fun hd(t: String) = col.addView(TextView(this).apply { text = t; setTextColor(0xFF4FC3F7.toInt()); textSize = 14f; setPadding(0, dp(12), 0, dp(4)) })
              val key = et("Anthropic API key (stored only on this device)", p.getString("key", "")!!)
              val ask = et("Describe a rule or widget in plain English", "")
              val rules = et("Rules JSON", p.getString("rules", "[]")!!).apply { typeface = Typeface.MONOSPACE; minLines = 8; gravity = Gravity.TOP }
              val wt = et("Widget template", p.getString("wtxt", S.DEF_W)!!).apply { minLines = 3; gravity = Gravity.TOP }
              val st = mono()
              val sw = Switch(this).apply {
                text = "Run automations in background"; setTextColor(0xFFFFFFFF.toInt()); isChecked = p.getBoolean("engine", false)
                setOnCheckedChangeListener { _, v -> p.edit().putBoolean("engine", v).apply(); Core.sync(this@MainActivity) }
              }
              hd("AI"); col.addView(key); col.addView(ask)
              col.addView(btn("✨ Generate rule with AI") {
                p.edit().putString("key", key.text.toString().trim()).apply(); st.text = "Thinking…"
                Thread {
                  val r = try { Result.success(Auto.genRule(key.text.toString().trim(), ask.text.toString())) } catch (e: Throwable) { Result.failure(e) }
                  runOnUiThread {
                    r.onSuccess { o ->
                      val a = try { JSONArray(rules.text.toString()) } catch (e: Throwable) { JSONArray() }
                      a.put(o); rules.setText(a.toString(2)); p.edit().putString("rules", a.toString()).apply(); st.text = "Rule added: ${o.optString("name")}"
                    }.onFailure { st.text = "Error: ${it.message}" }
                  }
                }.start()
              })
              col.addView(btn("✨ Generate widget text with AI") {
                p.edit().putString("key", key.text.toString().trim()).apply(); st.text = "Thinking…"
                Thread {
                  val r = try { Result.success(Auto.genWidget(key.text.toString().trim(), ask.text.toString())) } catch (e: Throwable) { Result.failure(e) }
                  runOnUiThread { r.onSuccess { wt.setText(it); st.text = "Template ready, tap Save widget" }.onFailure { st.text = "Error: ${it.message}" } }
                }.start()
              })
              hd("Rules (editable JSON, full manual control)"); col.addView(rules)
              col.addView(btn("💾 Save rules") {
                try { val a = JSONArray(rules.text.toString()); p.edit().putString("rules", a.toString()).apply(); st.text = "Saved ${a.length()} rules" } catch (e: Throwable) { st.text = "Invalid JSON: ${e.message}" }
              })
              col.addView(sw)
              hd("Home-screen widget (long-press home > Widgets > SysX)"); col.addView(wt)
              col.addView(btn("💾 Save widget") { p.edit().putString("wtxt", wt.text.toString()).apply(); StatsWidget.update(this); st.text = "Widget updated" })
              col.addView(st); hd("Rule log"); col.addView(lg)
              return ScrollView(this).apply { addView(col) }
            }
          }
