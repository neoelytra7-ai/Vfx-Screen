          package dev.sysx

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.TextView

          class Core : Service() {
            private val h = Handler(Looper.getMainLooper()); private var tv: TextView? = null; private var tick = 0
            private val loop = object : Runnable {
              override fun run() {
                val p = getSharedPreferences("sx", 0)
                if (p.getBoolean("overlay", false) && Settings.canDrawOverlays(this@Core)) showOv() else hideOv()
                tv?.text = S.live(this@Core)
                if (p.getBoolean("engine", false) && tick % 5 == 0) Thread { try { Auto.tick(this@Core) } catch (e: Throwable) { Auto.log("err ${e.message}") } }.start()
                tick++; if (tick % 10 == 0) StatsWidget.update(this@Core)
                h.postDelayed(this, 1000)
              }
            }
            override fun onBind(i: Intent?): IBinder? = null
            override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
              getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("sx", "SysX", NotificationManager.IMPORTANCE_LOW))
              val n = Notification.Builder(this, "sx").setContentTitle("SysX running").setSmallIcon(android.R.drawable.stat_notify_sync).build()
              if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE) else startForeground(1, n)
              h.removeCallbacks(loop); h.post(loop); return START_STICKY
            }
            private fun showOv() {
              if (tv != null) return
              val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              val t = TextView(this).apply { typeface = Typeface.MONOSPACE; textSize = 8.5f; setTextColor(0xFF9CFFB0.toInt()); setBackgroundColor(0xB0000000.toInt()); setPadding(10, 6, 10, 6) }
              val lp = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
              lp.gravity = Gravity.TOP or Gravity.START; lp.x = 0; lp.y = 80
              var dx = 0f; var dy = 0f; var sx = 0; var sy = 0
              t.setOnTouchListener { _, e ->
                when (e.action) {
                  MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y }
                  MotionEvent.ACTION_MOVE -> { lp.x = sx + (e.rawX - dx).toInt(); lp.y = sy + (e.rawY - dy).toInt(); wm.updateViewLayout(t, lp) }
                }; true
              }
              wm.addView(t, lp); tv = t
            }
            private fun hideOv() { tv?.let { try { (getSystemService(Context.WINDOW_SERVICE) as WindowManager).removeView(it) } catch (e: Throwable) {} }; tv = null }
            override fun onDestroy() { h.removeCallbacksAndMessages(null); hideOv(); super.onDestroy() }
            companion object {
              fun sync(c: Context) {
                val p = c.getSharedPreferences("sx", 0); val i = Intent(c, Core::class.java)
                if (p.getBoolean("overlay", false) || p.getBoolean("engine", false)) c.startForegroundService(i) else c.stopService(i)
              }
            }
          }
