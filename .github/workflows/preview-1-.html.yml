<!DOCTYPE html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>*{margin:0}html,body{height:100%;overflow:hidden;background:#6fb2f0}canvas,#gr,#vg,#gn{position:fixed;pointer-events:none}canvas{will-change:transform}#gr,#vg{inset:0}
#vg{background:radial-gradient(ellipse 85% 80% at 50% 45%,transparent 60%,rgba(5,25,65,.35))}
#gr{background:linear-gradient(165deg,rgba(255,200,120,.12),transparent 45%,rgba(20,100,190,.1))}
#gn{left:-20%;top:-20%;width:140%;height:140%;opacity:.07;background-size:64px;image-rendering:pixelated}</style></head>
<body><div id=gr></div><div id=vg></div><div id=gn></div><script>
const M=Math,R=M.random,$=i=>document.getElementById(i),IW=innerWidth,IH=innerHeight,U=IW/100,UH=IH/100,K=IW/360;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=M.imul(a^a>>>15,1|a);t=t+M.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const cl=(v,a,b)=>v<a?a:v>b?b:v,sm=(a,b,k,d)=>a+(b-a)*(1-M.exp(-k*d)),ss=v=>(v=cl(v,0,1))*v*(3-2*v);
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mx=(a,b,t)=>{a=hx(a);b=hx(b);return`rgb(${a.map((v,i)=>v+(b[i]-v)*t|0)})`};
const pk=(a,b,m)=>{m=cl(m,0,1);return((255<<24)|((a[2]+(b[2]-a[2])*m|0)<<16)|((a[1]+(b[1]-a[1])*m|0)<<8)|(a[0]+(b[0]-a[0])*m|0))>>>0};
/* layer: nama, lebar vw, tinggi vh, ukuran 1 pixel (css px), parallax F, zoom-couple Kz, warp-couple Kw. px=pixelated, tanpa px = halus (blur/bokeh) */
const LY={};
function L(n,w,h,dim,F,Kz,Kw,o){o=o||{};const d=dim*K,c=document.createElement('canvas'),l=o.l!=null?o.l:-(w-100)/2,t=o.t!=null?o.t:-(h-100)/2;
c.style.cssText=`left:${l}vw;top:${t}vh;width:${w}vw;height:${h}vh;`+(o.org?`transform-origin:${o.org};`:'')+(o.px?'image-rendering:pixelated':'');
c.width=M.ceil(w*U/d);c.height=M.ceil(h*UH/d);$('gr').before(c);
return LY[n]={c,x:c.getContext('2d'),w:c.width,h:c.height,F,Kz,Kw,dr:o.dr||0,sk:o.sk||0,ub:U/d}}
L('sky',120,110,5,.04,.2,-.04,{px:1});L('c1',260,70,6,.1,.3,-.05,{l:-15,t:-5,dr:.9,px:1});L('c2',260,80,5,.2,.5,-.07,{l:-15,t:-5,dr:1.8,px:1});
L('hl',130,115,5,.35,.7,-.02,{px:1});L('hb',130,115,16,.35,.7,-.02);L('mid',140,120,4,1,1,.14,{px:1});L('mb',140,120,16,1,1,.14);
L('rays',140,140,12,.12,.2,0);L('fb',170,130,12,2.2,2.6,.5,{org:'50% 100%',sk:1});L('fs',170,130,4,2.2,2.6,.5,{org:'50% 100%',sk:1,px:1});
L('pt',120,110,4,1.2,1.3,.7,{px:1});L('bk',120,110,6,1.4,1.6,.9);

/* ===== pixel art, di-bake sekali ===== */
const GR=['#5da13a','#6bb344','#4f8f30','#79c24e','#5a9c38'];
const rg=(x,cx,cy,r,st)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,r);st.forEach(([o,c])=>g.addColorStop(o,c));x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r)};
const disc=(x,cx,cy,r,c)=>{x.fillStyle=c;for(let dy=-r;dy<=r;dy++){const w=M.round(M.sqrt(r*r-dy*dy));x.fillRect(cx-w,cy+dy,2*w+1,1)}};
function bakeSky(){const{x,w,h}=LY.sky;
for(let y=0;y<h;y++){x.fillStyle=mx('#2c76dc','#c2e5ff',M.floor(cl(y/(h*.6),0,1)*9)/9);x.fillRect(0,y,w,1)}
const sx=w*.7|0,sy=h*.2|0;x.fillStyle='rgba(255,246,200,.07)';for(let r=30;r>10;r-=3)x.fillRect(sx-r,sy-r,2*r,2*r);
x.fillStyle='#ffe98a';x.fillRect(sx-7,sy-7,14,14);x.fillStyle='#fffbd0';x.fillRect(sx-5,sy-5,10,10);x.fillStyle='#fff';x.fillRect(sx-3,sy-3,6,6)}
function bakeCl(n,sd,cnt,hh,yr){const{x,w,h}=LY[n],r=mul(sd),tile=w/2;
for(let i=0;i<cnt;i++){const cx=r()*tile|0,cy=h*(yr[0]+r()*(yr[1]-yr[0]))|0,L=10+(r()*16|0),b=(r()*.4+.5)*L|0;
for(const t of[0,tile]){x.fillStyle='#fff';x.fillRect(cx+t+(L*.2|0),cy,L*.55|0,hh);x.fillRect(cx+t+b,cy+hh*.5|0,L*.3|0,hh);
x.fillStyle='#f1f6fd';x.fillRect(cx+t,cy+hh,L,hh);x.fillStyle='#d3e0f1';x.fillRect(cx+t+(L*.05|0),cy+2*hh,L*.9|0,hh)}}}
const tree=(x,cx,by,r)=>{x.fillStyle='#5b3d22';x.fillRect(cx,by-4,2,4);x.fillStyle='#2f7a2a';x.fillRect(cx-3,by-8,8,3);x.fillRect(cx-2,by-10,6,2);x.fillStyle='#3e9234';x.fillRect(cx-2,by-9,3,1);
for(let i=0;i<9;i++){x.fillStyle=r()<.5?'#4eae3c':'#256a22';x.fillRect(cx-3+(r()*8|0),by-10+(r()*5|0),1,1)}};
function bakeHills(){const o=LY.hl,x=o.x,w=o.w,h=o.h,r=mul(9);
const fill=(c,f)=>{x.fillStyle=c;for(let i=0;i<w;i++){const y=f(i)|0;x.fillRect(i,y,1,h-y)}};
const f1=i=>h*.5-(M.sin(i*.06+1)*.5+M.sin(i*.15)*.3+.8)*h*.05;fill('#a3c4ea',f1);x.fillStyle='#c4dcf4';for(let i=0;i<w;i++)x.fillRect(i,f1(i)|0,1,1);
const f2=i=>(h*.575-(M.sin(i*.045+4)*.5+M.sin(i*.11)*.3+.8)*h*.022)|0;fill('#5f9e55',f2);x.fillStyle='#78b862';for(let i=0;i<w;i++)x.fillRect(i,f2(i),1,1);
for(let i=0;i<22;i++){const cx=r()*w|0;tree(x,cx,f2(cx)+1,r)}
x.fillStyle='rgba(232,245,255,.1)';for(let k=0;k<4;k++)x.fillRect(0,(h*.5|0)+k*3,w,h*.14|0);
const f3=i=>(h*.625-(M.sin(i*.07+2)*.5+.5)*h*.012)|0;
for(let i=0;i<w;i++){const y=f3(i);for(let j=y;j<h;j++){x.fillStyle=GR[(((i/5|0)*7+(j/5|0)*13)%5+(r()<.15?1:0))%5];x.fillRect(i,j,1,1)}x.fillStyle='#8fd45a';x.fillRect(i,y,1,1)}
for(let b=0;b<8;b++){x.fillStyle='rgba(10,40,10,.06)';x.fillRect(0,h*(.64+b*.045)|0,w,h)}
const g=LY.hb;g.x.drawImage(o.c,0,0,g.w,g.h)}
function bakeRays(){const o=LY.rays,x=o.x,w=o.w,h=o.h,a=120*M.PI/180,dx=M.sin(a),dy=-M.cos(a),Ln=M.abs(w*dx)+M.abs(h*dy),P=w*.2,np=M.ceil(Ln/P)+2,T=np*P,sx=w/2-dx*Ln/2-dx*P,sy=h/2-dy*Ln/2-dy*P,g=x.createLinearGradient(sx,sy,sx+dx*T,sy+dy*T),C='255,248,215';
for(let i=0;i<np;i++){const q=i*P;g.addColorStop(q/T,`rgba(${C},0)`);g.addColorStop((q+.45*P)/T,`rgba(${C},0)`);g.addColorStop((q+.65*P)/T,`rgba(${C},.17)`);g.addColorStop((q+.9*P)/T,`rgba(${C},0)`)}
x.fillStyle=g;x.fillRect(0,0,w,h);x.globalCompositeOperation='destination-in';rg(x,.671*w,.264*h,w*.75,[[0,'rgba(0,0,0,1)'],[.6,'rgba(0,0,0,.35)'],[1,'rgba(0,0,0,0)']]);x.globalCompositeOperation='source-over'}
/* foreground: fs = pixel tajam, fb = versi resolusi rendah (halus => out-of-focus). Gambar sama, ukuran dalam unit relatif */
function drawFore(o){const x=o.x,w=o.w,h=o.h,r=mul(77),vw=o.ub,P=[['#143c0e','#2f7a22','#7ecb3e'],['#1a4a12','#3a8c28','#a4dc52'],['#10340c','#27701c','#68b838']];
for(let i=0;i<80;i++){const bx=r()*w,by=h*(.9+r()*.1),ht=h*(.05+r()*r()*.2),ln=((bx-w/2)/w*.5+(r()-.5)*.25)*ht,bw=M.max(1,M.round(vw*(1+r()*1.6))),C=P[r()*3|0];
for(let k=0;k<ht;k++){const q=k/ht,ww=M.max(1,M.round(bw*(1-q*.75)));x.fillStyle=q<.4?C[0]:q<.75?C[1]:C[2];x.fillRect((bx+ln*q*q)|0,(by-k)|0,ww,1)}}
const FC=[['#d93a2b','#2a1a10'],['#ffd23a','#fff08a'],['#f4f4f4','#ffcf33'],['#f080b0','#fff0a0'],['#d93a2b','#2a1a10'],['#ffd23a','#fff08a']];
for(let i=0;i<6;i++){const fx=w*(.22+r()*.56),by=h*.97,ht=h*(.14+r()*.16),ln=(r()-.5)*ht*.3,F=FC[i],rr=M.max(2,M.round(vw*(3+r()*2)));
for(let k=0;k<ht;k++){const q=k/ht;x.fillStyle='#2a7a1f';x.fillRect((fx+ln*q*q)|0,(by-k)|0,M.max(1,M.round(vw*.9)),1)}
const X=(fx+ln)|0,Y=(by-ht)|0;disc(x,X,Y,rr,F[0]);disc(x,X,Y,M.max(1,rr*.45|0),F[1])}
for(let b=0;b<7;b++){x.fillStyle='rgba(6,30,8,.1)';x.fillRect(0,h*(.72+b*.04)|0,w,h)}}

/* ===== midground: rumput & bunga pixel (1 putImageData/frame, angin per-blade) ===== */
const TN=[['#2f6a1a','#5fae2a','#a6e84f'],['#3a7a20','#6fc032','#b9f06a'],['#276016','#4f9c24','#8fd640']].map(a=>a.map(hx)),HZ=hx('#b4dcc8'),CS=pk(hx('#3a7a20'),HZ,0);
const FLC=[['#ffc93a','#ffe58a'],['#ff9a2e','#ffc27a'],['#e8452c','#ff8a6a'],['#f4f1e6','#ffd84a'],['#e58ab5','#f7c0d8']];
let MB=[],FL=[],mi,mu,MW,MH,WN=1;
const wf=(x,t)=>WN*(.55+.45*M.sin(t*.7+x*.05)+.25*M.sin(t*1.9+x*.13));
function mkMid(){const o=LY.mid,r=mul(5),w=o.w,h=o.h;MW=w;MH=h;mi=o.x.createImageData(w,h);mu=new Uint32Array(mi.data.buffer);
for(let i=0,n=M.ceil(w*1.8);i<n;i++){const y=h*(.6+.39*M.pow(r(),1.25)),s=(y/h-.6)/.39,T=TN[r()*3|0],m=(1-s)*.5;
MB.push({x:r()*w|0,y:y|0,h:(2+s*9)*(.7+r()*.6),p:r()*6.28,c:[pk(T[0],HZ,m),pk(T[1],HZ,m),pk(T[2],HZ,m)]})}
MB.sort((a,b)=>a.y-b.y);
for(let i=0,n=M.ceil(w/5);i<n;i++){const y=h*(.64+.35*M.pow(r(),1.2)),s=(y/h-.6)/.39,f=FLC[r()*5|0];
FL.push({x:r()*w|0,y:y|0,h:(4+s*11)*(.8+r()*.5),p:r()*6.28,c0:pk(hx(f[0]),HZ,(1-s)*.35),c1:pk(hx(f[1]),HZ,(1-s)*.35),w:f[0]=='#f4f1e6'})}
FL.sort((a,b)=>a.y-b.y)}
const px1=(x,y,c)=>{if(x>=0&&y>=0&&x<MW&&y<MH)mu[y*MW+x]=c},rc=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px1(x+i,y+j,c)};
function drawMid(t){mu.fill(0);
for(const b of MB){const A=(1+b.h*.25)*wf(b.x,t)+M.sin(t*2.4+b.p)*.5;for(let k=0,n=b.h|0;k<n;k++){const f=k/b.h;px1(b.x+(A*f*f|0),b.y-k,f<.4?b.c[0]:f<.75?b.c[1]:b.c[2])}}
for(const f of FL){const A=(1+f.h*.22)*wf(f.x,t)+M.sin(t*2+f.p)*.5,n=f.h|0;for(let k=0;k<n;k++){const q=k/n;px1(f.x+(A*q*q|0),f.y-k,CS)}
const X=f.x+(A|0),Y=f.y-n;rc(X-1,Y-2,3,1,f.c0);rc(X-2,Y-1,5,3,f.c0);rc(X-1,Y+2,3,1,f.c0);rc(X,Y-1,1,2,f.c1);if(f.w)px1(X,Y,pk(hx('#ffd84a'),HZ,0))}
LY.mid.x.putImageData(mi,0,0)}

/* ===== bokeh + debu pixel ===== */
const SP=['255,246,210','255,225,150','205,236,255'].map(c=>{const s=document.createElement('canvas');s.width=s.height=48;rg(s.getContext('2d'),24,24,24,[[0,`rgba(${c},.35)`],[.7,`rgba(${c},.45)`],[.9,`rgba(${c},.9)`],[1,`rgba(${c},0)`]]);return s});
let BK=[],PT=[];function mkBok(){const o=LY.bk,r=mul(21),u=o.ub;BK=Array.from({length:22},()=>({x:r()*o.w,y:r()*o.h,r:u*(2+r()*4),a:.1+r()*.22,p:r()*6.28,vx:.4+r()*1.2,vy:-(.2+r()*.6),c:r()*3|0}));
const q=LY.pt;PT=Array.from({length:46},(_,i)=>({x:r()*q.w,y:r()*q.h,vx:2+r()*5,vy:-1+r()*2,p:r()*6.28,lf:i%6==0,c:i%6==0?['#7dc83c','#a6e84f','#f7c0d8'][i%3]:['#fff3c4','#ffe08a','#ffffff'][i%3]}))}
function drawBok(t,dt,k){const o=LY.bk,x=o.x;x.clearRect(0,0,o.w,o.h);x.globalCompositeOperation='lighter';
for(const b of BK){b.x+=(b.vx+wf(b.x,t)*b.vx*.6)*dt;b.y+=b.vy*dt;if(b.x>o.w+b.r*4)b.x=-b.r*4;if(b.y<-b.r*4)b.y=o.h+b.r*4;
const r=b.r*(1+3.2*k),a=b.a*(.6+.4*M.sin(t*.7+b.p))*(1+.9*k);x.globalAlpha=M.min(1,a);x.drawImage(SP[b.c],b.x-r,b.y-r,2*r,2*r)}
x.globalAlpha=1;x.globalCompositeOperation='source-over'}
function drawPt(t,dt){const o=LY.pt,x=o.x;x.clearRect(0,0,o.w,o.h);for(const p of PT){p.x+=(p.vx*(.5+wf(p.x,t)*.6))*dt;p.y+=(p.vy+M.sin(t*1.5+p.p)*1.5+(p.lf?3:0))*dt;if(p.x>o.w+2)p.x=-2;if(p.y<-2)p.y=o.h;if(p.y>o.h+2)p.y=-2;
x.globalAlpha=p.lf?1:.45+.45*M.sin(t*3+p.p);x.fillStyle=p.c;x.fillRect(p.x|0,p.y|0,p.lf?2:1,p.lf?2:1)}x.globalAlpha=1}

/* ===== kamera sinematik ===== */
let tx=0,ty=0,ox=.5,TX=0,TY=0,OX=.5,DXt=0,DX=0,drag=0,lx=0,wb=0,w0=0,fa=0,paused=0,run=0,last=performance.now(),fc=0,gap=33,lf=0;const LT={},OP={};
const op=(k,v)=>{v=+v.toFixed(2);if(OP[k]!==v){OP[k]=v;LY[k].c.style.opacity=v}};
function frame(now){
const dt=cl((now-last)/1000,.001,.1),t=now/1000;last=now;fc++;
TX=sm(TX,tx,5,dt);TY=sm(TY,ty,5,dt);OX=sm(OX,ox,3,dt);DX=sm(DX,drag?DXt:0,drag?9:.6,dt);wb*=M.exp(-dt*1.1);WN=sm(WN,1+wb,3,dt);
const wp=cl((now-w0)/4200,0,1),wk=M.pow(1-wp,3);fa=ss((wp-.08)/.62);   /* wk: warp FOV 1→0 | fa: rack-focus 0→1 */
const X=M.sin(t*.11)*5+M.sin(t*.047+1)*2+TX*3.2-(OX-.5)*12+DX+wk*wk*3.5+M.sin(t*3.1+M.sin(t*.7)*2)*.05,
Y=M.sin(t*.07)*1.1+TY*1.4-wk*wk*4+M.sin(t*2.3+1)*.04,
ro=M.sin(t*.13)*.22+TX*.5+wk*1.2+M.sin(t*1.7)*.04,Z=1.04+.03*M.sin(t*.045)+wb*.01;
for(const k in LY){const o=LY[k],s=1+(Z-1)*o.Kz+wk*o.Kw,dx=X*o.F*U-(o.dr?(t*o.dr%130)*U:0),r2=o.F>0?ro*M.min(o.F,1):0,
str=`translate3d(${dx.toFixed(1)}px,${(Y*o.F*UH).toFixed(1)}px,0) rotate(${r2.toFixed(3)}deg) scale(${s.toFixed(4)})`+(o.sk?` skewX(${(M.sin(t*.9+X*.1)*.9*WN).toFixed(2)}deg)`:'');if(LT[k]!==str){LT[k]=str;o.c.style.transform=str}}
op('hb',1-fa);op('mb',1-fa);op('fb',1-fa);op('fs',fa);op('rays',.75+.25*M.sin(t*.3));
drawMid(t);if(fa<.995){const m=LY.mb;m.x.clearRect(0,0,m.w,m.h);m.x.drawImage(LY.mid.c,0,0,m.w,m.h)}
drawBok(t,dt,1-fa);drawPt(t,dt);if(fc%4==0)$('gn').style.transform=`translate(${R()*64|0}px,${R()*64|0}px)`;
const fast=wp<1||drag||wb>.25;gap=fast?16:33;if(fast!==lf){lf=fast;window.A&&A.f(fast?60:30)}}
function loop(now){if(paused){run=0;return}const t0=performance.now();frame(now);setTimeout(()=>requestAnimationFrame(loop),M.max(0,gap-(performance.now()-t0)-6))}
const go=()=>{if(!run){run=1;requestAnimationFrame(loop)}};
window.W={s(a,b,c){tx=a;ty=b;ox=c},
p(x,y,a){if(a==0){drag=1;DXt=DX;lx=x;wb=M.min(1.2,wb+.7)}else if(a==2&&drag){DXt=cl(DXt+(x-lx)*-40,-9,9);lx=x}else if(a==1||a==3)drag=0},
wake(){w0=performance.now();wb=1;paused=0;go()},z(){paused=1}};
addEventListener('pointerdown',e=>W.p(e.clientX/IW,e.clientY/IH,0));
addEventListener('pointermove',e=>{if(drag)W.p(e.clientX/IW,e.clientY/IH,2);else if(!window.A)W.s((e.clientX/IW-.5)*2,(e.clientY/IH-.5)*2,.5)});
addEventListener('pointerup',()=>W.p(0,0,1));
{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),d=x.createImageData(64,64);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=R()<.5?0:255;d.data[i+3]=R()*255}x.putImageData(d,0,0);$('gn').style.backgroundImage=`url(${c.toDataURL()})`}
bakeSky();bakeCl('c1',3,9,2,[.12,.6]);bakeCl('c2',8,5,3,[.15,.7]);bakeHills();bakeRays();drawFore(LY.fs);drawFore(LY.fb);mkMid();mkBok();W.wake();
</script></body></html>
