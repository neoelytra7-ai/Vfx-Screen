                  rightBox.gravity = Gravity.CENTER_VERTICAL
                  val hudBox = LinearLayout(this); hudBox.orientation = LinearLayout.VERTICAL
                  val r1 = LinearLayout(this); r1.orientation = LinearLayout.HORIZONTAL; r1.gravity = Gravity.CENTER_VERTICAL
                  tvLv = txt(17f, col("#7cff3a")); tvLv.text = "LV 1"
                  xpBar = StepBar(this)
                  r1.addView(tvLv, lpL(px(44), -2))
                  r1.addView(xpBar, lpL(0, px(12), 1f))
                  tvQuest = txt(13f, Color.WHITE); tvQuest.maxLines = 1; tvQuest.ellipsize = android.text.TextUtils.TruncateAt.END
                  hudBox.addView(r1, lpL(-1, -2)); hudBox.addView(tvQuest, lpL(-1, -2))
                  val gear = PixelButton(this, "", "cfg")
                  gear.onTap = { toggleDrawer() }
                  rightBox.addView(hudBox, lpL(px(128), -2))
                  rightBox.addView(gear, lpL(px(40), px(38)).also { it.leftMargin = px(6) })
                  headerBox.addView(rightBox, FrameLayout.LayoutParams(-2, px(56), Gravity.END or Gravity.BOTTOM).also { it.rightMargin = px(8) })
                  root.addView(headerBox, FrameLayout.LayoutParams(-1, px(56), Gravity.TOP))

                  fx = FxLayer(this)
                  root.addView(fx, FrameLayout.LayoutParams(-1, -1))
                  splash = SplashView(this, biome)
                  splash.onDone = { coach() }
                  root.addView(splash, FrameLayout.LayoutParams(-1, -1))
                  setContentView(root)

                  root.setOnApplyWindowInsetsListener { _, ins ->
                      topInset = ins.systemWindowInsetTop; botInset = ins.systemWindowInsetBottom
                      (headerBox.layoutParams as FrameLayout.LayoutParams).height = px(56) + topInset
                      headerBox.requestLayout()
                      (vf.layoutParams as FrameLayout.LayoutParams).topMargin = px(56) + topInset
                      (ctxRow.layoutParams as FrameLayout.LayoutParams).topMargin = px(56 + 8) + topInset
                      (drawer.layoutParams as FrameLayout.LayoutParams).topMargin = px(56) + topInset
                      vf.requestLayout(); ctxRow.requestLayout(); drawer.requestLayout()
                      bottom.setPadding(px(8), px(10), px(8), px(6) + botInset)
                      fx.topInset = topInset + dp(8)
                      ins
                  }
                  bottom.addOnLayoutChangeListener { v, _, _, _, _, _, _, _, _ ->
                      floatCol.translationY = -v.height.toFloat()
                      fx.achY = v.height.toFloat() + dp(70)
                  }
              }

              private fun coach() {
                  val sp = getSharedPreferences("micam_ui", Context.MODE_PRIVATE)
                  if (sp.getBoolean("coach", false)) return
                  sp.edit().putBoolean("coach", true).apply()
                  fx.toast("Tap a chip to tune", "ISO · SHUTTER · FOCUS · WB · EV — hold = AUTO/MAN", "ae")
                  ui.postDelayed({ fx.toast("Tap the viewfinder to focus", "Pinch or tap 1 · 2 · 5 to zoom", "af") }, 3200)
                  ui.postDelayed({ fx.toast("Drag AWAY from a ruler", "FINE mode: ×0.5 · ×0.2 · ×0.08", "star") }, 6400)
              }

              // ============================================================ ruler (the one granular control)
              private fun isoR(): Range<Int> = cam.isoRange ?: Range(50, 3200)
              private fun expR(): Range<Long> = cam.expRange ?: Range(100_000L, 1_000_000_000L)
              private fun l2(x: Double) = ln(x) / ln(2.0)
              private fun isoStops() = max(.5, l2(isoR().upper.toDouble() / isoR().lower))
              private fun isoOf(v: Float): Int = (isoR().lower * 2.0.pow(v * isoStops())).roundToInt().coerceIn(isoR().lower, isoR().upper)
              private fun isoV(i: Int): Float = (l2(i.toDouble() / isoR().lower) / isoStops()).toFloat().coerceIn(0f, 1f)
              private fun expLo() = max(expR().lower, 125_000L)
              private fun expHi() = min(expR().upper, 1_000_000_000L)
              private fun expStops() = max(.5, l2(expHi().toDouble() / expLo()))
              private fun expOf(v: Float): Long = (expLo() * 2.0.pow(v * expStops())).toLong().coerceIn(expR().lower, expR().upper)
              private fun expV(n: Long): Float = (l2(n.toDouble() / expLo()) / expStops()).toFloat().coerceIn(0f, 1f)
              private fun shutText(n: Long): String { val s = n / 1e9; return if (s >= .4) String.format("%.1fs", s) else "1/" + (1.0 / s).roundToInt() }
              private fun focusText(v: Float): String {
                  val d = v * cam.minFocus
                  return if (cam.minFocus <= 0f) "FIXED" else if (d < .05f) "∞" else String.format("%.0fcm", 100f / d)
              }
              private fun zr(): Range<Float> = cam.zoomRange ?: Range(1f, 1f)
              private fun zoomOf(v: Float): Float { val r = zr(); return (r.lower * (r.upper / r.lower).toDouble().pow(v.toDouble())).toFloat() }
              private fun zoomV(z: Float): Float { val r = zr(); return if (r.upper <= r.lower) 0f else (ln((z / r.lower).toDouble()) / ln((r.upper / r.lower).toDouble())).toFloat().coerceIn(0f, 1f) }
              private fun wbText(s: Float): String = if (abs(s) < .03f) "BASE" else (if (s > 0) "WARM " else "COOL ") + (abs(s) * 100).toInt()

              private fun onChip(i: Int) { if (chips.selected == i) closeRuler() else openRuler(PARAMS[i]) }

              private fun openRuler(pid: String) {
                  if (drawerOpen) toggleDrawer()
                  curParam = pid
                  chips.selected = PARAMS.indexOf(pid)
                  val p = cam.p
                  val l = cam.last
                  when (pid) {
                      "ISO" -> { ruler.bind("ISO", "iso", (3 * isoStops()).roundToInt()) { "ISO " + isoOf(it) }; ruler.set(isoV(if (p.autoExp) (l?.get(CaptureResult.SENSOR_SENSITIVITY) ?: p.iso) else p.iso), false) }
                      "SS" -> { ruler.bind("SHUTTER", "shut", (3 * expStops()).roundToInt()) { shutText(expOf(it)) }; ruler.set(expV(if (p.autoExp) (l?.get(CaptureResult.SENSOR_EXPOSURE_TIME) ?: p.expNs) else p.expNs), false) }
                      "FOCUS" -> { ruler.bind("FOCUS", "af", if (cam.minFocus > 0f) 24 else 0) { focusText(it) }; ruler.set(if (p.autoFocus) ((l?.get(CaptureResult.LENS_FOCUS_DISTANCE) ?: 0f) / max(cam.minFocus, .01f)).coerceIn(0f, 1f) else p.focus, false) }
                      "WB" -> { ruler.bind("WB", "wb", 20) { wbText((it - .5f) * 2f) }; ruler.set(.5f + p.wbShift / 2f, false) }
                      "EV" -> { ruler.bind("EXPOSURE", "ev", 18) { String.format("%+.1f EV", -3f + 6f * it) }; ruler.set((p.ev + 3f) / 6f, false) }
                      "ZOOM" -> { ruler.bind("ZOOM", "zoom", 0) { String.format("%.1fx", zoomOf(it)) }; ruler.set(zoomV(p.zoom), false) }
                      "PWR" -> { ruler.bind("HDR POWER", "hdr", 10) { (it * 100).toInt().toString() + "%" }; ruler.set(p.hdrPower, false) }
                  }
                  ruler.accent = biome.go
                  syncAutoBtn()
                  if (rulerBox.visibility != View.VISIBLE) {
                      rulerBox.visibility = View.VISIBLE
                      rulerBox.alpha = 0f; rulerBox.translationY = dp(24)
                      rulerBox.animate().alpha(1f).translationY(0f).setDuration(240).setInterpolator(OvershootInterpolator(1.2f)).start()
                  }
              }

              private fun closeRuler() {
                  curParam = null
                  chips.selected = -1
                  rulerBox.animate().alpha(0f).translationY(dp(24)).setDuration(160).withEndAction { if (curParam == null) rulerBox.visibility = View.GONE }.start()
              }

              private fun onRuler(v: Float) {
                  val p = cam.p
                  when (curParam) {
                      "ISO" -> { if (p.autoExp) enterManualExp(); p.iso = isoOf(v); cam.refresh() }
                      "SS" -> { if (p.autoExp) enterManualExp(); p.expNs = expOf(v); cam.refresh() }
                      "FOCUS" -> { if (p.autoFocus) enterManualFocus(); p.focus = v; cam.refresh() }
                      "WB" -> { if (p.autoWb) enterManualWb(); p.wbShift = (v - .5f) * 2f; cam.refresh() }
                      "EV" -> { p.ev = -3f + 6f * v; cam.refresh() }
                      "ZOOM" -> { cam.setZoom(zoomOf(v)); pills.zoom = cam.p.zoom; overlay.zoomText = String.format("%.1fx", cam.p.zoom); overlay.showZoom(); if (cam.p.zoom >= 5f) game.event("zoom5") }
                      "PWR" -> { p.hdrPower = v; btnPwr.label("PWR " + (v * 100).toInt() + "%") }
                  }
                  updateChips(); syncAutoBtn()
              }

              private fun syncAutoBtn() {
                  val p = cam.p
                  when (curParam) {
                      "ISO", "SS" -> { btnAuto.visibility = View.VISIBLE; btnAuto.label("AUTO"); btnAuto.on = p.autoExp }
                      "EV" -> { btnAuto.visibility = View.VISIBLE; btnAuto.label(if (p.autoExp) "AE ON" else "→ AE"); btnAuto.on = p.autoExp }
                      "FOCUS" -> { btnAuto.visibility = View.VISIBLE; btnAuto.label("AUTO"); btnAuto.on = p.autoFocus }
                      "WB" -> { btnAuto.visibility = View.VISIBLE; btnAuto.label("AUTO"); btnAuto.on = p.autoWb }
                      else -> btnAuto.visibility = View.GONE
                  }
              }

              private fun toggleAuto(pid: String) {
                  when (pid) {
                      "ISO", "SS", "EV" -> if (cam.p.autoExp) enterManualExp() else { cam.p.autoExp = true; cam.refresh() }
                      "FOCUS" -> if (cam.p.autoFocus) enterManualFocus() else { cam.p.autoFocus = true; cam.refresh() }
                      "WB" -> if (cam.p.autoWb) enterManualWb() else { cam.p.autoWb = true; cam.refresh() }
                  }
                  if (curParam == pid) openRuler(pid)
                  updateChips(); syncAutoBtn()
              }

              private fun enterManualExp() {
                  val l = cam.last
                  l?.get(CaptureResult.SENSOR_SENSITIVITY)?.let { cam.p.iso = it }
                  l?.get(CaptureResult.SENSOR_EXPOSURE_TIME)?.let { cam.p.expNs = it }
                  cam.p.autoExp = false; cam.refresh()
              }
              private fun enterManualFocus() {
                  val fd = cam.last?.get(CaptureResult.LENS_FOCUS_DISTANCE)
                  if (fd != null && cam.minFocus > 0f) cam.p.focus = (fd / cam.minFocus).coerceIn(0f, 1f)
                  cam.p.autoFocus = false; cam.p.region = null; cam.refresh()
              }
              private fun enterManualWb() { cam.captureWbBase(); cam.p.wbShift = 0f; cam.p.autoWb = false; cam.refresh() }

              private fun updateChips() {
                  val p = cam.p; val l = cam.last
                  val iso: Int? = if (p.autoExp) l?.get(CaptureResult.SENSOR_SENSITIVITY) else p.iso
                  val ex: Long? = if (p.autoExp) l?.get(CaptureResult.SENSOR_EXPOSURE_TIME) else p.expNs
                  chips.values[0] = iso?.toString() ?: "—"
                  chips.values[1] = ex?.let { shutText(it) } ?: "—"
                  chips.values[2] = if (p.autoFocus) "AF" else focusText(p.focus)
                  chips.values[3] = if (p.autoWb) "AUTO" else wbText(p.wbShift).replace("WARM ", "W").replace("COOL ", "C")
                  chips.values[4] = if (p.autoExp) String.format("%+.1f", p.ev) else "—"
                  chips.autos[0] = p.autoExp; chips.autos[1] = p.autoExp; chips.autos[2] = p.autoFocus; chips.autos[3] = p.autoWb; chips.autos[4] = p.autoExp
                  chips.invalidate()
              }

              // ============================================================ zoom / lens / mode / biome
              private fun presetsFor(): List<Float> {
                  val r = cam.zoomRange ?: return emptyList()
                  val out = ArrayList<Float>()
                  if (r.lower < .95f) out.add((r.lower * 10).roundToInt() / 10f)
                  out.add(1f)
                  for (z in floatArrayOf(2f, 5f, 10f)) if (z <= r.upper + .01f) out.add(z)
                  return out
              }

              private fun pickZoom(z: Float) {
                  cam.setZoom(z)
                  pills.zoom = cam.p.zoom
                  overlay.zoomText = String.format("%.1fx", cam.p.zoom); overlay.showZoom()
                  game.event("zoom"); if (z >= 5f) game.event("zoom5")
                  if (curParam == "ZOOM") ruler.set(zoomV(cam.p.zoom))
              }

              private fun pinch(s: Float) {
                  cam.setZoom(cam.p.zoom * s)
                  pills.zoom = cam.p.zoom
                  overlay.zoomText = String.format("%.1fx", cam.p.zoom); overlay.showZoom()
                  if (curParam == "ZOOM") ruler.set(zoomV(cam.p.zoom), false)
                  if (cam.p.zoom >= 5f) game.event("zoom5")
              }

              private fun setMode(i: Int) {
                  mode = modes[i]
                  if (curParam == "PWR" && mode != Mode.HDR) closeRuler()
                  applyModeUi()
                  bg.panTo(i * 70f + lensIdx * 25f)
                  tryStart()
              }

              private fun applyModeUi() {
                  val i = modes.indexOf(mode)
                  hotL.selected = if (i < 2) i else -1
                  hotR.selected = if (i >= 2) i - 2 else -1
                  btnProc.visibility = if (mode == Mode.RAW) View.VISIBLE else View.GONE
                  btnStack.visibility = if (mode == Mode.RAW) View.VISIBLE else View.GONE
                  btnPwr.visibility = if (mode == Mode.HDR) View.VISIBLE else View.GONE
                  btnHlg.visibility = if (mode == Mode.VIDEO) View.VISIBLE else View.GONE
                  btnFps.visibility = if (mode == Mode.VIDEO) View.VISIBLE else View.GONE
                  shutter.text = "●"
                  shutter.kind = if (mode == Mode.VIDEO) PixelButton.Kind.RED else PixelButton.Kind.GREEN
                  shutter.invalidate()
              }

              private fun cycleLens() {
                  if (lenses.isEmpty()) return
                  lensIdx = (lensIdx + 1) % lenses.size
                  pills.lensLabel = lenses[lensIdx].label
                  game.event("lens")
                  bg.panTo(modes.indexOf(mode) * 70f + lensIdx * 25f)
                  tryStart()
              }

              private fun cycleBiome() {
                  applyBiome(Biomes.list[(Biomes.list.indexOf(biome) + 1) % Biomes.list.size], true)
                  fx.toast("Biome: " + biome.name, "Tap the fox to change the world", "fox")
              }

              private fun applyBiome(b: Biome, fxOn: Boolean) {
                  biome = b
                  bg.setBiome(b); header.biome = b
                  headerBox.setBackgroundColor(b.h1)
                  xpBar.color = b.xp
                  overlay.accent = b.go
                  chips.accent = b.go
                  ruler.accent = b.go
                  for ((i, bt) in biomeBtns.withIndex()) bt.on = Biomes.list[i] === b
                  if (fxOn) { Sfx.coin(); Hap.click() }
              }

              private fun toggleDrawer() {
                  drawerOpen = !drawerOpen
                  Sfx.tick(); Hap.tick()
                  if (drawerOpen) {
                      if (curParam != null) closeRuler()
                      drawer.visibility = View.VISIBLE
                      drawer.translationY = -dp(260)
                      drawer.animate().translationY(0f).setDuration(280).setInterpolator(OvershootInterpolator(1.1f)).start()
                  } else {
                      drawer.animate().translationY(-dp(260)).setDuration(200).withEndAction { if (!drawerOpen) drawer.visibility = View.GONE }.start()
                  }
              }

              // ============================================================ shutter
              private fun onShutter() {
                  if (mode != Mode.VIDEO) { Sfx.shutter(); Hap.heavy(); overlay.doFlash() } else { Sfx.rec(); Hap.double() }
                  cam.shoot()
              }

              // ============================================================ CamUi
              override fun status(s: String) { runOnUiThread { tvStatus.text = s } }
              override fun readout(s: String) { runOnUiThread { overlay.readText = s; updateChips() } }
              override fun busy(b: Boolean) {
                  runOnUiThread {
                      isBusy = b
                      shutter.isEnabled = !b; shutter.alpha = if (b) .55f else 1f
                      if (!b) { overlay.crack = 0f; progBar.set(0f) }
                  }
              }
              override fun progress(f: Float, label: String) {
                  runOnUiThread { progBar.set(f); overlay.crack = if (isBusy) f.coerceIn(0f, 1f) else 0f; if (label.isNotEmpty()) tvStatus.text = label }
              }
              override fun aspect(pw: Int, ph: Int) {
                  runOnUiThread {
                      val w = resources.displayMetrics.widthPixels
                      val lp = vf.layoutParams as FrameLayout.LayoutParams
                      lp.width = w; lp.height = (w.toFloat() * pw / ph).toInt()
                      vf.layoutParams = lp
                  }
              }
              override fun recording(b: Boolean) {
                  runOnUiThread {
                      shutter.text = if (b) "■" else "●"; shutter.invalidate()
                      if (b) { recSec = 0; overlay.recSeconds = 0; ui.postDelayed(recTick, 1000) } else { ui.removeCallbacks(recTick); overlay.recSeconds = -1; overlay.invalidate() }
                  }
              }
              private val recTick = object : Runnable { override fun run() { recSec++; overlay.recSeconds = recSec; ui.postDelayed(this, 1000) } }

              override fun saved(kind: String) {
                  runOnUiThread {
                      game.event(kind, biome.id)
                      Sfx.done(); Hap.heavy()
                      fx.previewRect?.let { fx.burst(it.centerX(), it.centerY(), biome.go, 18) }
                      val label = when (kind) { "raw" -> "RAW DNG saved"; "stack" -> "RAW+ stack saved"; "sr" -> "Super-Res saved"; "hdr" -> "HDR+ saved"; "video" -> "Video saved"; else -> "" }
                      if (label.isNotEmpty()) fx.toast(label, "Pictures/MiCamPro · Movies/MiCamPro", if (kind == "video") "video" else "star")
                      progBar.set(0f); overlay.crack = 0f
                  }
              }
              override fun hdrFallback() { runOnUiThread { btnHlg.on = false; fx.toast("HLG10 not accepted", "Fell back to SDR HEVC", "no") } }
              override fun ready() {
                  runOnUiThread {
                      pills.presets = presetsFor()
                      pills.zoom = cam.p.zoom
                      if (lenses.isNotEmpty()) pills.lensLabel = lenses[lensIdx].label
                      btnFps.visibility = if (mode == Mode.VIDEO && cam.fps60Ok) View.VISIBLE else View.GONE
                      btnHlg.visibility = if (mode == Mode.VIDEO && cam.hdrVideoOk) View.VISIBLE else View.GONE
                      btnHlg.on = cam.p.hdrVideo && cam.hdrVideoOk
                      btnPwr.label("PWR " + (cam.p.hdrPower * 100).toInt() + "%")
                      updateChips()
                      curParam?.let { openRuler(it) }
                  }
              }

              // ============================================================ Game.Listener
              override fun onGain(text: String) {
                  runOnUiThread { Sfx.coin(); fx.floatText(text, resources.displayMetrics.widthPixels * .25f, resources.displayMetrics.heightPixels * .45f, biome.go) }
              }
              override fun onLevel(lv: Int) {
                  runOnUiThread { Sfx.lvl(); Hap.double(); fx.banner("LEVEL UP!", "LV $lv", col("#fcdb5a")); fx.burst(resources.displayMetrics.widthPixels / 2f, resources.displayMetrics.heightPixels * .32f, col("#fcdb5a"), 26) }
              }
              override fun onAch(title: String, sub: String) { runOnUiThread { Sfx.ach(); Hap.heavy(); fx.ach(title, sub) } }
              override fun onQuest(text: String) { runOnUiThread { fx.banner(text, "", biome.go) } }
              override fun onHud() {
                  runOnUiThread {
                      tvLv.text = "LV " + game.lv
                      xpBar.set(game.xp / game.need(game.lv).toFloat())
                      tvQuest.text = game.questText()
                      tvQuestFull.text = "QUEST: " + game.questText() + "   ·   XP " + game.xp + "/" + game.need(game.lv)
                  }
              }

              // ============================================================ TextureView
              override fun onSurfaceTextureAvailable(st: SurfaceTexture, w: Int, h: Int) { cam.texture = st; texReady = true; tryStart() }
              override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, w: Int, h: Int) {}
              override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean { cam.texture = null; texReady = false; return true }
              override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}
          }
          EOF

      - name: Fetch pixel fonts (Pixelify Sans + VT323, OFL) - app falls back to monospace if this fails
        run: |
          mkdir -p _gen/app/src/main/assets/fonts
          curl -fsSL -o _gen/app/src/main/assets/fonts/VT323-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/vt323/VT323-Regular.ttf" || echo "VT323 download failed"
          curl -fsSL -o _gen/app/src/main/assets/fonts/PixelifySans.ttf "https://github.com/google/fonts/raw/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf" || echo "Pixelify download failed"
          ls -la _gen/app/src/main/assets/fonts

      - name: Build APK (debug + release)
        working-directory: _gen
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: MiCamPro-apk
          path: _gen/app/build/outputs/apk/**/*.apk
