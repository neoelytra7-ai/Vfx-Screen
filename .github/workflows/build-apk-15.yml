name: Build MiCam Pro APK

# One file = whole project. The heredocs below write every Android source file (Kotlin / Camera2)
# when CI runs, then Gradle builds the APK.
# Put it at: .github/workflows/build-apk.yml -> push -> Actions tab -> Artifacts.
# v2: Foxle pixel theme, RAW+ stack, HDR+ burst pipeline, realtime HLG10 encoder.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project (heredocs)
        run: |
          set -e
          mkdir -p _gen/app/src/main/java/com/micampro _gen/app/src/main/assets/fonts
          cd _gen
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MiCamPro"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.micampro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.micampro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera.any" />
              <application
                  android:label="MiCam Pro"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/micampro/Pixel.kt <<'EOF'
          package com.micampro

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Choreographer
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.min
          import kotlin.math.sin

          object Dp { var d = 1f }
          fun dp(v: Number): Float = v.toFloat() * Dp.d

          /** CSS-style #rgb / #rrggbb / #rrggbbaa -> ARGB int */
          fun col(s: String): Int {
              val h = s.removePrefix("#")
              fun b(i: Int) = h.substring(i, i + 2).toInt(16)
              return when (h.length) {
                  3 -> Color.argb(255, h[0].digitToInt(16) * 17, h[1].digitToInt(16) * 17, h[2].digitToInt(16) * 17)
                  6 -> Color.argb(255, b(0), b(2), b(4))
                  8 -> Color.argb(b(6), b(0), b(2), b(4))
                  else -> Color.MAGENTA
              }
          }

          fun withA(c: Int, a: Float): Int = Color.argb((a.coerceIn(0f, 1f) * 255).toInt(), Color.red(c), Color.green(c), Color.blue(c))
          fun mix(a: Int, b: Int, t: Float): Int = Color.argb(
              (Color.alpha(a) + (Color.alpha(b) - Color.alpha(a)) * t).toInt(),
              (Color.red(a) + (Color.red(b) - Color.red(a)) * t).toInt(),
              (Color.green(a) + (Color.green(b) - Color.green(a)) * t).toInt(),
              (Color.blue(a) + (Color.blue(b) - Color.blue(a)) * t).toInt()
          )

          // ------------------------------------------------------------------ fonts / frame clock / spring
          object Fonts {
              var px: Typeface = Typeface.MONOSPACE
              var vt: Typeface = Typeface.MONOSPACE
              fun init(ctx: Context) {
                  try { vt = Typeface.createFromAsset(ctx.assets, "fonts/VT323-Regular.ttf") } catch (e: Exception) { }
                  try {
                      val t = Typeface.createFromAsset(ctx.assets, "fonts/PixelifySans.ttf")
                      px = Typeface.create(t, 700, false)
                  } catch (e: Exception) { px = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD) }
              }
          }

          object Anim : Choreographer.FrameCallback {
              interface Tick { fun tick(dt: Float) }
              private val subs = ArrayList<Tick>()
              private var last = 0L
              private var running = false
              fun add(t: Tick) {
                  if (!subs.contains(t)) subs.add(t)
                  if (!running) { running = true; last = 0L; Choreographer.getInstance().postFrameCallback(this) }
              }
              fun remove(t: Tick) { subs.remove(t) }
              override fun doFrame(ns: Long) {
                  val dt = if (last == 0L) 0.008f else min(0.05f, (ns - last) / 1e9f)
                  last = ns
                  for (i in subs.indices.reversed()) if (i < subs.size) subs[i].tick(dt)
                  if (subs.isEmpty()) running = false else Choreographer.getInstance().postFrameCallback(this)
              }
          }

          /** Critically-ish damped spring; slightly under-damped by default so things overshoot like cubic-bezier(.3,1.6,.5,1). */
          class Spring(start: Float = 0f, private val k: Float = 320f, private val d: Float = 21f) {
              var x = start
              var t = start
              private var v = 0f
              fun step(dt: Float) {
                  var left = dt
                  while (left > 0f) { // sub-step for stability at low fps
                      val h = min(left, 0.008f)
                      v += (-k * (x - t) - d * v) * h
                      x += v * h
                      left -= h
                  }
              }
              fun snap(to: Float) { x = to; t = to; v = 0f }
              fun kick(impulse: Float) { v += impulse }
              val settled: Boolean get() = abs(x - t) < 0.0015f && abs(v) < 0.02f
          }

          // ------------------------------------------------------------------ palette + icons
          object Pal {
              val m: HashMap<Char, Int> = hashMapOf(
                  'k' to col("#000"), 'o' to col("#e8802a"), 'w' to col("#fff"), 'g' to col("#5fb02f"), 'd' to col("#8a5a2b"),
                  'y' to col("#fcdb5a"), 's' to col("#7a7a7a"), 'b' to col("#4a7fd4"), 'r' to col("#d6403a"),
                  'l' to col("#c9c9c9"), 'p' to col("#9b59c9")
              )
          }

          object Icons {
              private val G: HashMap<String, Array<String>> = hashMapOf(
                  "no" to arrayOf("r......r", ".r....r.", "..r..r..", "...rr...", "...rr...", "..r..r..", ".r....r.", "r......r"),
                  "fox" to arrayOf("o......o", "oo....oo", "oooooooo", "owkoowko", "oooooooo", "owwoowwo", ".owwwwo.", "..okko.."),
                  "star" to arrayOf("...yy...", "...yy...", "yyyyyyyy", ".yyyyyy.", "..yyyy..", ".yyyyyy.", ".yy..yy.", "y......y"),
                  "cfg" to arrayOf("...ll...", "l.llll.l", "llllllll", "lll..lll", "lll..lll", "llllllll", "l.llll.l", "...ll..."),
                  "raw" to arrayOf("rgrgrgrg", "gbgbgbgb", "rgrgrgrg", "gbgbgbgb", "rgrgrgrg", "gbgbgbgb", "rgrgrgrg", "gbgbgbgb"),
                  "sr" to arrayOf("..lll...", ".l...l..", "l..y..l.", "l.yyy.l.", "l..y..l.", ".l...l..", "..lll.s.", "......ss"),
                  "hdr" to arrayOf("...y....", "y..y..y.", ".y.y.y..", "..yyy...", "yyyyyyyy", ".yyyyyy.", "bbbbbbbb", "b.b.b.b."),
                  "video" to arrayOf("kkkkkkkk", "kbbbbbbk", "kbwbbbbk", "kbwwbbbk", "kbwwwbbk", "kbwwbbbk", "kbwbbbbk", "kkkkkkkk"),
                  "lens" to arrayOf("..kkkk..", ".kbbbbk.", "kbwbbbbk", "kbbbbbbk", "kbbbbbbk", "kbbbbbbk", ".kbbbbk.", "..kkkk.."),
                  "ae" to arrayOf("y..y..y.", ".y.yyy..", "..yyyy..", "yyyyyyyy", "..yyyy..", ".yyyyyy.", "y..y..y.", "...y...."),
                  "af" to arrayOf("..rrrr..", ".r....r.", "r..rr..r", "r.rrrr.r", "r.rrrr.r", "r..rr..r", ".r....r.", "..rrrr.."),
                  "wb" to arrayOf("...bb...", "..bbbb..", ".bbwbbb.", ".bbbbbb.", ".bbbbbb.", "..bbbb..", "...bb...", "........"),
                  "grid" to arrayOf("l..l..l.", "llllllll", "l..l..l.", "l..l..l.", "llllllll", "l..l..l.", "l..l..l.", "llllllll"),
                  "hist" to arrayOf("......y.", "....y.y.", "..y.y.y.", "..y.y.y.", "y.y.y.y.", "y.y.y.y.", "yyyyyyyy", "........"),
                  "stack" to arrayOf("..bbbb..", ".bbwwbb.", "bbbbbbbb", "..bbbb..", ".bbwwbb.", "bbbbbbbb", "..bbbb..", "........"),
                  "zoom" to arrayOf("........", ".lllll..", "l.....l.", "l..y..l.", "l.yyy.l.", "l..y..l.", ".lllll.s", "......ss"),
                  "ev" to arrayOf("..yyyy..", ".y....y.", "y..yy..y", "y.yyyy.y", "y..yy..y", ".y....y.", "..yyyy..", "........"),
                  "iso" to arrayOf("kkkkkkkk", "kwwkwwwk", "kkwkwkkk", "kkwkwwwk", "kkwkkkwk", "kwwkwwwk", "kkkkkkkk", "........"),
                  "shut" to arrayOf("..llll..", ".l....l.", "l..ll..l", "l..ll..l", "l..l...l", ".l....l.", "..llll..", "........"),
                  "gold" to arrayOf("..yyyy..", ".yywwyy.", "yyywyyyy", "yyyyyyyy", "yyyyyyyy", "yyyyyyyy", ".yyyyyy.", "..yyyy..")
              )
              private val cache = HashMap<String, Bitmap>()
              fun has(n: String) = G.containsKey(n)
              fun get(n: String): Bitmap = cache.getOrPut(n) { build(G[n] ?: G["no"]!!) }

              private fun build(g: Array<String>): Bitmap {
                  val bmp = Bitmap.createBitmap(10, 10, Bitmap.Config.ARGB_8888)
                  fun on(i: Int, y: Int) = y in g.indices && i in 0 until g[y].length && Pal.m.containsKey(g[y][i])
                  for (y in -1..8) for (i in -1..8) {
                      if (!on(i, y) && (on(i - 1, y) || on(i + 1, y) || on(i, y - 1) || on(i, y + 1))) bmp.setPixel(i + 1, y + 1, Color.BLACK)
                  }
                  for (y in 0 until 8) for (i in 0 until 8) if (on(i, y)) bmp.setPixel(i + 1, y + 1, Pal.m[g[y][i]]!!)
                  return bmp
              }

              private val ip = Paint().apply { isFilterBitmap = false; isAntiAlias = false }
              private val src = android.graphics.Rect(0, 0, 10, 10)
              private val dst = android.graphics.RectF()
              fun draw(c: Canvas, n: String, x: Float, y: Float, size: Float, alpha: Float = 1f) {
                  dst.set(x, y, x + size, y + size)
                  ip.alpha = (alpha * 255).toInt()
                  c.drawBitmap(get(n), src, dst, ip)
              }
          }

          object Bevel {
              private val p = Paint()
              fun draw(c: Canvas, l: Float, t: Float, r: Float, b: Float, base: Int, hi: Int, lo: Int,
                       border: Int = Color.BLACK, bw: Float = dp(3), inset: Float = dp(3)) {
                  p.style = Paint.Style.FILL
                  p.color = border; c.drawRect(l, t, r, b, p)
                  p.color = base; c.drawRect(l + bw, t + bw, r - bw, b - bw, p)
                  p.color = hi
                  c.drawRect(l + bw, t + bw, r - bw, t + bw + inset, p); c.drawRect(l + bw, t + bw, l + bw + inset, b - bw, p)
                  p.color = lo
                  c.drawRect(l + bw, b - bw - inset, r - bw, b - bw, p); c.drawRect(r - bw - inset, t + bw, r - bw, b - bw, p)
              }
          }

          // ------------------------------------------------------------------ biomes (ported from Foxle)
          class Biome(
              val id: String, val name: String, th: Array<String>, sky: Array<String>, ambC: String, val ambK: Float,
              val fg: Array<String>, val flowers: Array<String>, val partCols: Array<String>, val partSize: IntArray,
              val partDur: FloatArray, val partDx: Int, val leaf: Boolean
          ) {
              val h1 = col(th[0]); val h2 = col(th[1]); val st = col(th[2]); val go = col(th[3])
              val gr = col(th[4]); val xp = col(th[5]); val row = col(th[6])
              val skyA = col(sky[0]); val skyB = col(sky[1]); val skyC = col(sky[2])
              val amb = col(ambC)
              val accent = st
          }

          object Biomes {
              val list: List<Biome> = listOf(
                  Biome("overworld", "Overworld", arrayOf("#7a5230", "#6a4627", "#5fb02f", "#fcdb5a", "#5fb02f", "#7cff3a", "#161616"),
                      arrayOf("#3d8cd6", "#8fcdf5", "#d3f0ff"), "#fffbd0", 22f / 14f,
                      arrayOf("#4f351d", "#3d8a2a", "#5aab3c", "#4c9a33"), arrayOf("#e84a4a", "#fcdb5a"),
                      arrayOf("#fffbd0", "#ffffff", "#d6f0a8"), intArrayOf(3, 6), floatArrayOf(16f, 28f), 90, true),
                  Biome("lushcave", "Lush", arrayOf("#2f5a2a", "#26491f", "#e86fb0", "#ffb347", "#8fd14f", "#9dff5a", "#0d170d"),
                      arrayOf("#050d08", "#0c2416", "#14381f"), "#b6ff7a", 1f,
                      arrayOf("#10291c", "#2c6b4b", "#4aa04a", "#8fd14f"), arrayOf("#e86fb0", "#ffb347"),
                      arrayOf("#c8ff8a", "#ff9ad0", "#8fffd0"), intArrayOf(4, 7), floatArrayOf(16f, 30f), 50, false),
                  Biome("netherworld", "Nether", arrayOf("#6b1d1d", "#581414", "#ff6a1a", "#ffb02e", "#e0481f", "#ff7b2e", "#1c0d0d"),
                      arrayOf("#1a0404", "#5a1408", "#a8300c"), "#ff9a3a", 6f / 14f,
                      arrayOf("#3a0e0e", "#762525", "#a8300c", "#ff6a1a"), arrayOf("#ffb02e"),
                      arrayOf("#ff8a2a", "#ffc24a", "#ff5a1a"), intArrayOf(3, 6), floatArrayOf(6f, 12f), 70, false),
                  Biome("endworld", "End", arrayOf("#2f2a4a", "#25213c", "#b44cff", "#e0a8ff", "#a35cff", "#c86bff", "#140f1d"),
                      arrayOf("#030108", "#120826", "#1f0e3d"), "#c86bff", 12f / 14f,
                      arrayOf("#8d885a", "#d8d49a", "#7a1fb0", "#b44cff"), arrayOf("#e040ff"),
                      arrayOf("#d27bff", "#ffffff", "#a35cff"), intArrayOf(3, 6), floatArrayOf(10f, 20f), 60, false)
              )
              fun byTime(h: Int): Biome = list[when { h in 5..9 -> 0; h in 10..15 -> 1; h in 16..19 -> 2; else -> 3 }]
              fun byId(id: String): Biome = list.firstOrNull { it.id == id } ?: list[0]
          }

          /** rect painter that wraps horizontally (seamless tiling) */
          class Pix(private val c: Canvas, private val sw: Int) {
              private val p = Paint().apply { isAntiAlias = false; style = Paint.Style.FILL }
              operator fun invoke(x: Number, y: Number, w: Number, h: Number, color: String) {
                  p.color = col(color)
                  val a = Math.round(x.toFloat()); val yy = Math.round(y.toFloat())
                  for (o in intArrayOf(-sw, 0, sw)) c.drawRect((a + o).toFloat(), yy.toFloat(), (a + o) + w.toFloat(), yy + h.toFloat(), p)
              }
          }

          object Scene {
              const val SW = 360
              const val SH = 180
              const val U = 6
              const val FH = 48
              private var sd = 1L
              private fun rn(): Float { sd = sd * 16807L % 2147483647L; return sd / 2147483647f }

              private fun hill(r: Pix, b: Number, a: Number, k: Number, p: Number, t: String, f: String, e: String? = null): IntArray {
                  val n = SW / U
                  val ys = IntArray(n)
                  val bb = b.toFloat(); val aa = a.toFloat(); val kk = k.toFloat(); val pp = p.toFloat()
                  for (i in 0 until n) {
                      val y = Math.round((bb + aa * sin(6.283f * kk * i / n + pp) + aa * .5f * sin(6.283f * (2 * kk + 1) * i / n + pp * 2)) / U) * U
                      ys[i] = y
                      r(i * U, y, U, U, t)
                      r(i * U, y + U, U, SH, f)
                      if (e != null && i % 3 == 1) r(i * U + 1, y + U + 2, 3, 3, e)
                  }
                  return ys
              }

              private fun tree(r: Pix, x: Int, y: Int, t: String, a: String, b: String) {
                  r(x, y - 4 * U, U, 4 * U, t); r(x - U, y - 7 * U, 3 * U, 3 * U, a); r(x - 2 * U, y - 6 * U, 5 * U, U, a)
                  r(x, y - 8 * U, U, U, a); r(x - U + 2, y - 7 * U + 2, 5, 5, b); r(x + U, y - 5 * U, 5, 5, b)
              }

              private fun clo(r: Pix, x: Int, y: Int, w: Int) {
                  r(x, y, w, 6, "#fff"); r(x + 6, y - 6, w - 14, 6, "#fff"); r(x + 2, y + 6, w - 4, 3, "#0000001a")
              }

              private fun ceil(r: Pix, a: Int, b: Int, c1: String, c2: String) {
                  for (i in 0 until 60) { val l = a + (i * 41 % 6) * b; r(i * U, 0, U, l, c1); r(i * U, l, U, 5, c2) }
              }

              private val DR: Map<String, List<(Pix) -> Unit>> by lazy {
                  mapOf(
                      "overworld" to listOf<(Pix) -> Unit>(
                          { r ->
                              r(236, 20, 22, 22, "#fff3a8"); r(232, 16, 30, 30, "#fff3a822")
                              for (a in listOf(intArrayOf(20, 60, 40), intArrayOf(110, 34, 30), intArrayOf(180, 70, 44), intArrayOf(290, 46, 36))) clo(r, a[0], a[1], a[2])
                              hill(r, 128, 16, 2, 1, "#a5d6b8", "#a5d6b8")
                          },
                          { r ->
                              val y = hill(r, 114, 12, 3, .5f, "#5aab3c", "#7b5a35", "#6a4a2a")
                              for (i in intArrayOf(6, 17, 31, 44, 53)) tree(r, i * U, y[i], "#6b4a26", "#3f8f2e", "#57ad3f")
                              val n = SW / U
                              for (i in 0 until n) {
                                  val w = Math.round((136 + 4 * sin(6.283f * 2 * i / n + 1) + 2 * sin(6.283f * 5 * i / n)) / 3) * 3
                                  r(i * U, w - 3, U, 3, "#d9c27a"); r(i * U, w, U, 9, "#2f7fd0"); r(i * U, w, U, 3, "#4aa3e8"); r(i * U, w + 9, U, 3, "#d9c27a")
                                  if (i % 5 == 2) r(i * U + 1, w + 3, 4, 2, "#9ad4ff")
                                  if (i % 7 == 4) r(i * U + 2, w + 6, 3, 2, "#6dbcf5")
                              }
                          },
                          { r ->
                              val ys = hill(r, 160, 6, 4, 2, "#3d8a2a", "#4f351d", "#3e2a16")
                              for (i in ys.indices) {
                                  r(i * U + 1, ys[i] - 4, 2, 4, "#4c9a33")
                                  if (i % 9 == 3) r(i * U + 2, ys[i] - 6, 3, 3, if (i % 2 == 1) "#e84a4a" else "#fcdb5a")
                              }
                          }),
                      "lushcave" to listOf<(Pix) -> Unit>(
                          { r -> ceil(r, 8, 10, "#183a29", "#245a3e"); for (x in intArrayOf(60, 170, 280)) r(x, 0, 16, SH, "#b6ff7a12") },
                          { r ->
                              ceil(r, 14, 9, "#1f4d36", "#2c6b4b")
                              val y = hill(r, 140, 8, 3, 0, "#3c8a45", "#173a28", "#10291c")
                              for (i in intArrayOf(8, 25, 41, 52)) tree(r, i * U, y[i], "#5a4630", "#4aa04a", "#e86fb0")
                          },
                          { r ->
                              val xs = intArrayOf(20, 64, 119, 175, 222, 268, 331)
                              for (k in xs.indices) {
                                  val x = xs[k]; val l = 40 + k * 13 % 50
                                  r(x, 0, 2, l, "#3f7a2a"); r(x + 2, 10, 3, 2, "#3f7a2a")
                                  var y = 16
                                  while (y < l) { r(x - 3, y - 2, 9, 9, "#ffb34726"); r(x - 1, y, 5, 5, "#ffb347"); r(x, y + 1, 2, 2, "#fff2b0"); y += 22 }
                              }
                              hill(r, 166, 4, 4, 1, "#1c4a2c", "#0d241a", "#091a12")
                          }),
                      "netherworld" to listOf<(Pix) -> Unit>(
                          { r -> r(0, 118, SW, 62, "#ff5a1a2e"); r(0, 134, SW, 46, "#ff7a2a40"); hill(r, 112, 20, 2, .7f, "#4a1212", "#4a1212") },
                          { r ->
                              ceil(r, 10, 9, "#5c1a1a", "#7a2424")
                              for (x in intArrayOf(90, 250)) { r(x, 0, 8, 150, "#ff6a1a"); r(x + 2, 0, 3, 150, "#ffd36a") }
                              r(50, 96, 6, 52, "#1b0b30"); r(74, 96, 6, 52, "#1b0b30"); r(50, 92, 30, 6, "#1b0b30")
                              r(56, 98, 18, 50, "#b030ff99"); r(60, 104, 4, 36, "#e9a8ff88")
                              hill(r, 150, 8, 3, 1, "#762525", "#4e1515", "#3a0e0e")
                          },
                          { r ->
                              for (x in intArrayOf(30, 150, 260)) { r(x - 4, 0, 20, 30, "#ffd36a14"); r(x, 0, 12, 16, "#ffd36a"); r(x + 2, 16, 8, 9, "#ffb02e") }
                              hill(r, 168, 4, 4, 0, "#2a0a0a", "#1a0606", "#120404")
                          }),
                      "endworld" to listOf<(Pix) -> Unit>(
                          { r ->
                              for (i in 0 until 70) { val x = (rn() * SW).toInt(); val y = (rn() * 140).toInt(); r(x, y, 2, 2, if (rn() > .7f) "#fff" else "#b9a6ff77") }
                              r(130, 50, 80, 80, "#7a3cd014"); r(150, 70, 40, 40, "#a56bff14")
                          },
                          { r ->
                              for (a in listOf(intArrayOf(30, 110, 70), intArrayOf(200, 90, 90), intArrayOf(310, 125, 50))) {
                                  val x = a[0]; val y = a[1]; val w = a[2]
                                  r(x, y, w, 6, "#d8d49a"); r(x + 8, y + 6, w - 16, 6, "#bdb87e"); r(x + 18, y + 12, w - 36, 6, "#8a8658")
                                  r(x + w / 2 - 2, y - 16, 4, 16, "#9b6bc9"); r(x + w / 2 - 8, y - 22, 16, 6, "#c9a0e6")
                              }
                              for (x in intArrayOf(110, 270)) { r(x, 64, 12, 120, "#0e0a1a"); r(x, 64, 2, 120, "#2d2150"); r(x - 3, 44, 18, 22, "#ff4d9a1a"); r(x + 2, 48, 8, 14, "#ff4d9a") }
                          },
                          { r ->
                              hill(r, 164, 4, 3, 0, "#d8d49a", "#aaa56e", "#8d885a")
                              r(250, 126, 3, 38, "#0a0a0a"); r(257, 126, 3, 38, "#0a0a0a"); r(249, 92, 12, 34, "#121212"); r(250, 80, 10, 12, "#121212")
                              r(251, 85, 3, 2, "#e040ff"); r(256, 85, 3, 2, "#e040ff"); r(244, 94, 3, 38, "#121212"); r(262, 94, 3, 38, "#121212")
                          })
                  )
              }

              private val layerCache = HashMap<String, List<Bitmap>>()
              private val fgCache = HashMap<String, Bitmap>()

              fun layers(b: Biome): List<Bitmap> = layerCache.getOrPut(b.id) {
                  DR[b.id]!!.mapIndexed { i, f ->
                      sd = (11 + i).toLong()
                      val bmp = Bitmap.createBitmap(SW, SH, Bitmap.Config.ARGB_8888)
                      f(Pix(Canvas(bmp), SW)); bmp
                  }
              }

              fun foreground(b: Biome): Bitmap = fgCache.getOrPut(b.id) {
                  sd = (41 + b.id.length).toLong()
                  val bmp = Bitmap.createBitmap(SW, FH, Bitmap.Config.ARGB_8888)
                  val r = Pix(Canvas(bmp), SW)
                  val c1 = b.fg[0]; val c2 = b.fg[1]; val b1 = b.fg[2]; val b2 = b.fg[3]
                  r(0, FH - 2, SW, 2, c1); r(0, FH - 3, SW, 1, c2)
                  for (i in 0 until SW / 3) if (rn() < .5f) { val h = 1 + (rn() * 3).toInt(); r(i * 3, FH - 3 - h, 2, h, if (rn() < .5f) b1 else b2) }
                  for (i in 0 until 6) r(((rn() * SW / 3).toInt()) * 3, FH - 6, 2, 2, b.flowers[i % b.flowers.size])
                  bmp
              }
          }

          // ------------------------------------------------------------------ 8-bit sfx + haptics
          object Sfx {
              @Volatile var on = true
              private const val SR = 22050
              private val h = Handler(Looper.getMainLooper())

              private class N(val f: Float, val d: Float, val type: Int, val v: Float, val at: Float)

              private fun play(vararg ns: N) {
                  if (!on) return
                  try {
                      var total = 0f
                      for (n in ns) total = maxOf(total, n.at + n.d)
                      val len = (total * SR).toInt() + 1
                      val buf = FloatArray(len)
                      for (n in ns) {
                          val s0 = (n.at * SR).toInt(); val cnt = (n.d * SR).toInt()
                          for (i in 0 until cnt) {
                              val t = i / SR.toFloat()
                              val ph = (n.f * t) % 1f
                              val w = when (n.type) { 0 -> if (ph < .5f) 1f else -1f; 1 -> 4f * abs(ph - .5f) - 1f; else -> 2f * ph - 1f }
                              val env = exp(-6.9f * t / n.d)
                              if (s0 + i < len) buf[s0 + i] += w * env * n.v
                          }
                      }
                      val pcm = ShortArray(len) { (buf[it].coerceIn(-1f, 1f) * 32000).toInt().toShort() }
                      val at = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_GAME).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(SR).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(pcm.size * 2).setTransferMode(AudioTrack.MODE_STATIC).build()
                      at.write(pcm, 0, pcm.size)
                      at.play()
                      h.postDelayed({ try { at.release() } catch (e: Exception) { } }, (total * 1000).toLong() + 250)
                  } catch (e: Exception) { }
              }

              fun tick() = play(N(660f, .04f, 0, .05f, 0f))
              fun detent() = play(N(1100f, .02f, 1, .06f, 0f))
              fun coin() = play(N(988f, .07f, 0, .05f, 0f), N(1319f, .18f, 0, .05f, .07f))
              fun hit() = play(N(120f, .18f, 2, .08f, 0f), N(80f, .2f, 0, .06f, .05f))
              fun shutter() = play(N(2400f, .015f, 0, .08f, 0f), N(900f, .05f, 0, .07f, .02f), N(500f, .06f, 2, .04f, .05f))
              fun done() = play(N(784f, .08f, 1, .07f, 0f), N(1175f, .2f, 1, .07f, .08f))
              fun lvl() = play(N(523f, .16f, 0, .06f, 0f), N(659f, .16f, 0, .06f, .1f), N(784f, .16f, 0, .06f, .2f), N(1047f, .16f, 0, .06f, .3f))
              fun ach() = play(N(784f, .14f, 1, .07f, 0f), N(988f, .14f, 1, .07f, .08f), N(1175f, .14f, 1, .07f, .16f), N(1568f, .14f, 1, .07f, .24f))
              fun over() = play(N(392f, .22f, 2, .06f, 0f), N(330f, .22f, 2, .06f, .16f), N(262f, .22f, 2, .06f, .32f), N(196f, .22f, 2, .06f, .48f))
              fun rec() = play(N(880f, .06f, 0, .05f, 0f), N(1320f, .12f, 0, .05f, .07f))
          }

          object Hap {
              @Volatile var on = true
              private var v: Vibrator? = null
              @Suppress("DEPRECATION")
              fun init(ctx: Context) { v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator }
              private fun fx(id: Int) { if (on) try { v?.vibrate(VibrationEffect.createPredefined(id)) } catch (e: Exception) { } }
              fun tick() = fx(VibrationEffect.EFFECT_TICK)
              fun click() = fx(VibrationEffect.EFFECT_CLICK)
              fun heavy() = fx(VibrationEffect.EFFECT_HEAVY_CLICK)
              fun double() = fx(VibrationEffect.EFFECT_DOUBLE_CLICK)
          }
