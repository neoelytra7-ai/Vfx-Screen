                              minFocus = c.get(CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE) ?: 0f
                              val f = c.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS)?.firstOrNull() ?: 5f
                              val sw = c.get(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE)?.width ?: 7f
                              ultra = f * 36f / sw < 20f
                              hdrVideoOk = hdrSupported(c)
                              p.zoom = zoomRange?.let { max(it.lower, min(it.upper, p.zoom)) } ?: 1f
                              p.region = null
                              mgr.openCamera(id, exec, object : CameraDevice.StateCallback() {
                                  override fun onOpened(camera: CameraDevice) {
                                      if (g != gen) { camera.close(); return }
                                      dev = camera; createSession()
                                  }
                                  override fun onDisconnected(camera: CameraDevice) { camera.close(); if (dev === camera) dev = null }
                                  override fun onError(camera: CameraDevice, error: Int) {
                                      camera.close(); if (dev === camera) dev = null
                                      ui.busy(false)
                                      ui.status("Camera error $error – lens not exposed to 3rd-party apps?")
                                  }
                              })
                          } catch (e: Exception) { ui.status("Open failed: ${e.message}") }
                      }, 300)
                  }
              }

              fun close() { synchronized(this) { gen++ }; hd.post { closeInternal() } }

              private fun closeInternal() {
                  if (recording) { recording = false; try { encoder?.end() } catch (e: Exception) { }; recFile?.delete(); ui.recording(false) }
                  try { sess?.close() } catch (e: Exception) { }
                  try { dev?.close() } catch (e: Exception) { }
                  try { reader?.close() } catch (e: Exception) { }
                  try { encoder?.release() } catch (e: Exception) { }
                  try { prevSurface?.release() } catch (e: Exception) { }
                  sess = null; dev = null; reader = null; encoder = null; prevSurface = null; previewB = null
                  pending = null
              }

              private fun hdrSupported(c: CameraCharacteristics): Boolean {
                  if (Build.VERSION.SDK_INT < 33) return false
                  val prof = c.get(CameraCharacteristics.REQUEST_AVAILABLE_DYNAMIC_RANGE_PROFILES) ?: return false
                  return prof.supportedProfiles.contains(DynamicRangeProfiles.HLG10)
              }

              private fun pickPreview(map: StreamConfigurationMap, cap: Size, maxW: Int): Size {
                  val list = map.getOutputSizes(SurfaceTexture::class.java).filter { it.width <= maxW }
                  val ratio = cap.width.toFloat() / cap.height
                  return list.filter { abs(it.width.toFloat() / it.height - ratio) < 0.02f }.maxByOrNull { it.width * it.height }
                      ?: list.maxByOrNull { it.width * it.height }!!
              }

              private fun createSession() {
                  val d = dev ?: return
                  val c = chars ?: return
                  val map = c.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP) ?: return
                  val tex = texture ?: run { ui.status("No preview surface yet"); return }
                  val area = { s: Size -> s.width.toLong() * s.height }
                  val outs = ArrayList<OutputConfiguration>()
                  val cap: Size
                  when (mode) {
                      Mode.RAW -> {
                          cap = map.getOutputSizes(ImageFormat.RAW_SENSOR)?.maxByOrNull(area)
                              ?: run { ui.status("This lens has no RAW output – use SR / HDR+"); return }
                          reader = ImageReader.newInstance(cap.width, cap.height, ImageFormat.RAW_SENSOR, 10)
                      }
                      Mode.SR, Mode.HDR -> {
                          cap = map.getOutputSizes(ImageFormat.YUV_420_888).maxByOrNull(area)!!
                          reader = ImageReader.newInstance(cap.width, cap.height, ImageFormat.YUV_420_888, (if (mode == Mode.SR) Cfg.SR_FRAMES else Cfg.HDR_SHORTS + 1) + 2)
                      }
                      Mode.VIDEO -> {
                          val vs = runCatching { map.getOutputSizes(MediaCodec::class.java) }.getOrNull() ?: map.getOutputSizes(SurfaceTexture::class.java)
                          videoSize = vs.filter { it.width <= 3840 && it.width * 9 == it.height * 16 }.maxByOrNull(area) ?: vs.maxByOrNull(area)!!
                          cap = videoSize
                          fps60Ok = runCatching { map.getOutputMinFrameDuration(MediaCodec::class.java, videoSize) in 1L..17_000_000L }.getOrDefault(false)
                      }
                  }
                  reader?.setOnImageAvailableListener({ r ->
                      val img = r.acquireNextImage()
                      if (img != null) { val pd = pending; if (pd == null) img.close() else pd.addImage(img) }
                  }, wh)

                  val ps = pickPreview(map, cap, if (mode == Mode.VIDEO) 1280 else 1920)
                  tex.setDefaultBufferSize(ps.width, ps.height)
                  prevSurface?.release()
                  val surf = Surface(tex)
                  prevSurface = surf
                  ui.aspect(ps.width, ps.height)
                  outs.add(OutputConfiguration(surf))
                  reader?.let { outs.add(OutputConfiguration(it.surface)) }

                  sessionHdr = false
                  if (mode == Mode.VIDEO) {
                      val fps = if (p.fps >= 60 && fps60Ok) 60 else 30
                      p.fps = fps
                      val bitrate = if (videoSize.width >= 3840) (if (fps >= 60) 140_000_000 else 100_000_000) else 50_000_000
                      var enc: VideoEncoder? = null
                      if (p.hdrVideo && hdrVideoOk) {
                          try { enc = VideoEncoder(videoSize.width, videoSize.height, fps, bitrate, true); sessionHdr = true }
                          catch (e: Exception) { ui.status("HEVC Main10 unavailable → SDR") }
                      }
                      if (enc == null) {
                          try { enc = VideoEncoder(videoSize.width, videoSize.height, fps, bitrate, false) }
                          catch (e: Exception) { ui.status("Encoder failed: ${e.message}"); return }
                      }
                      encoder = enc
                      val oc = OutputConfiguration(enc.surface)
                      if (sessionHdr && Build.VERSION.SDK_INT >= 33) oc.setDynamicRangeProfile(DynamicRangeProfiles.HLG10)
                      outs.add(oc)
                  }

                  d.createCaptureSession(
                      SessionConfiguration(SessionConfiguration.SESSION_REGULAR, outs, exec, object : CameraCaptureSession.StateCallback() {
                          override fun onConfigured(s: CameraCaptureSession) {
                              sess = s
                              rebuildRepeating()
                              ui.status("Ready · $mode" + (if (mode == Mode.VIDEO) (if (sessionHdr) " · HLG10 HEVC ${videoSize.width}x${videoSize.height}@${p.fps}" else " · SDR HEVC") else ""))
                              ui.ready()
                          }
                          override fun onConfigureFailed(s: CameraCaptureSession) {
                              if (sessionHdr) {
                                  // 10-bit stream combo rejected: drop to SDR automatically
                                  p.hdrVideo = false
                                  ui.hdrFallback()
                                  try { encoder?.release() } catch (e: Exception) { }
                                  encoder = null
                                  hd.post { createSession() }
                              } else ui.status("Session config failed (stream combo unsupported on this lens)")
                          }
                      })
                  )
              }

              // ---------------------------------------------------------------- request building
              private val previewCb = object : CameraCaptureSession.CaptureCallback() {
                  private var n = 0
                  override fun onCaptureCompleted(session: CameraCaptureSession, request: CaptureRequest, result: TotalCaptureResult) {
                      last = result
                      if (++n % 6 == 0) {
                          val iso = result.get(CaptureResult.SENSOR_SENSITIVITY)
                          val ex = result.get(CaptureResult.SENSOR_EXPOSURE_TIME)
                          val fd = result.get(CaptureResult.LENS_FOCUS_DISTANCE)
                          val es = if (ex == null) "?" else { val s = ex / 1e9; if (s >= 0.5) String.format(Locale.US, "%.1fs", s) else "1/" + (1.0 / s).roundToInt() }
                          ui.readout("ISO ${iso ?: "?"} · $es · " + (fd?.let { String.format(Locale.US, "%.2fD", it) } ?: "?") + " · " + String.format(Locale.US, "%.1fx", p.zoom))
                      }
                  }
              }

              private fun sup(key: CameraCharacteristics.Key<IntArray>, v: Int): Boolean = chars?.get(key)?.contains(v) == true
              private fun cap(v: Int): Boolean = sup(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES, v)

              private fun rebuildRepeating() {
                  val d = dev ?: return
                  val s = sess ?: return
                  val b = d.createCaptureRequest(if (mode == Mode.VIDEO) CameraDevice.TEMPLATE_RECORD else CameraDevice.TEMPLATE_PREVIEW)
                  b.addTarget(prevSurface ?: return)
                  if (mode == Mode.VIDEO && recording) encoder?.let { b.addTarget(it.surface) }
                  applyParams(b, if (mode == Mode.VIDEO) 2 else 0)
                  previewB = b
                  try { s.setRepeatingRequest(b.build(), previewCb, hd) } catch (e: Exception) { ui.status("Preview error: ${e.message}") }
              }

              fun refresh() { hd.post { rebuildRepeating() } }

              fun captureWbBase() {
                  val l = last ?: return
                  p.baseGains = l.get(CaptureResult.COLOR_CORRECTION_GAINS)
                  p.baseCcm = l.get(CaptureResult.COLOR_CORRECTION_TRANSFORM)
              }

              fun setZoom(z: Float) {
                  val r = zoomRange ?: return
                  p.zoom = max(r.lower, min(r.upper, z))
                  refresh()
              }

              fun focusAt(nx: Float, ny: Float) {
                  hd.post {
                      val c = chars ?: return@post
                      val act = c.get(CameraCharacteristics.SENSOR_INFO_ACTIVE_ARRAY_SIZE) ?: return@post
                      val so = c.get(CameraCharacteristics.SENSOR_ORIENTATION) ?: 90
                      val u: Float; val v: Float
                      when (so) {
                          90 -> { u = ny; v = 1f - nx }
                          270 -> { u = 1f - ny; v = nx }
                          180 -> { u = 1f - nx; v = 1f - ny }
                          else -> { u = nx; v = ny }
                      }
                      val z = max(1f, p.zoom)
                      val cw = act.width() / z; val ch = act.height() / z
                      val x = act.left + act.width() / 2f + (u - .5f) * cw
                      val y = act.top + act.height() / 2f + (v - .5f) * ch
                      val half = (act.width() * 0.06f).toInt()
                      val rx = (x.toInt() - half).coerceIn(act.left, act.right - 2 * half - 1)
                      val ry = (y.toInt() - half).coerceIn(act.top, act.bottom - 2 * half - 1)
                      p.region = MeteringRectangle(rx, ry, 2 * half, 2 * half, 1000)
                      p.autoFocus = true
                      val b = previewB ?: return@post
                      applyParams(b, if (mode == Mode.VIDEO) 2 else 0)
                      if (mode != Mode.VIDEO) {
                          try {
                              b.set(CaptureRequest.CONTROL_AF_TRIGGER, CameraMetadata.CONTROL_AF_TRIGGER_START)
                              sess?.capture(b.build(), null, hd)
                              b.set(CaptureRequest.CONTROL_AF_TRIGGER, CameraMetadata.CONTROL_AF_TRIGGER_IDLE)
                          } catch (e: Exception) { }
                      }
                      try { sess?.setRepeatingRequest(b.build(), previewCb, hd) } catch (e: Exception) { }
                  }
              }

              private fun noProcess(b: CaptureRequest.Builder) {
                  if (sup(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES, CameraMetadata.NOISE_REDUCTION_MODE_OFF))
                      b.set(CaptureRequest.NOISE_REDUCTION_MODE, CameraMetadata.NOISE_REDUCTION_MODE_OFF)
                  if (sup(CameraCharacteristics.EDGE_AVAILABLE_EDGE_MODES, CameraMetadata.EDGE_MODE_OFF))
                      b.set(CaptureRequest.EDGE_MODE, CameraMetadata.EDGE_MODE_OFF)
                  if (sup(CameraCharacteristics.HOT_PIXEL_AVAILABLE_HOT_PIXEL_MODES, CameraMetadata.HOT_PIXEL_MODE_OFF))
                      b.set(CaptureRequest.HOT_PIXEL_MODE, CameraMetadata.HOT_PIXEL_MODE_OFF)
                  if (sup(CameraCharacteristics.SHADING_AVAILABLE_MODES, CameraMetadata.SHADING_MODE_OFF))
                      b.set(CaptureRequest.SHADING_MODE, CameraMetadata.SHADING_MODE_OFF)
                  if (sup(CameraCharacteristics.DISTORTION_CORRECTION_AVAILABLE_MODES, CameraMetadata.DISTORTION_CORRECTION_MODE_OFF))
                      b.set(CaptureRequest.DISTORTION_CORRECTION_MODE, CameraMetadata.DISTORTION_CORRECTION_MODE_OFF)
                  if (sup(CameraCharacteristics.TONEMAP_AVAILABLE_TONE_MAP_MODES, CameraMetadata.TONEMAP_MODE_GAMMA_VALUE)) {
                      b.set(CaptureRequest.TONEMAP_MODE, CameraMetadata.TONEMAP_MODE_GAMMA_VALUE)
                      b.set(CaptureRequest.TONEMAP_GAMMA, 2.2f)
                  }
              }

              /** STILL ONLY – these are far too heavy for a 4K10-bit record or 60Hz preview stream */
              private fun quality(b: CaptureRequest.Builder) {
                  if (sup(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES, CameraMetadata.NOISE_REDUCTION_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.NOISE_REDUCTION_MODE, CameraMetadata.NOISE_REDUCTION_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.EDGE_AVAILABLE_EDGE_MODES, CameraMetadata.EDGE_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.EDGE_MODE, CameraMetadata.EDGE_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.HOT_PIXEL_AVAILABLE_HOT_PIXEL_MODES, CameraMetadata.HOT_PIXEL_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.HOT_PIXEL_MODE, CameraMetadata.HOT_PIXEL_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.SHADING_AVAILABLE_MODES, CameraMetadata.SHADING_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.SHADING_MODE, CameraMetadata.SHADING_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.DISTORTION_CORRECTION_AVAILABLE_MODES, CameraMetadata.DISTORTION_CORRECTION_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.DISTORTION_CORRECTION_MODE, CameraMetadata.DISTORTION_CORRECTION_MODE_HIGH_QUALITY)
              }

              private fun common(b: CaptureRequest.Builder) {
                  if (Build.VERSION.SDK_INT >= 30 && zoomRange != null) b.set(CaptureRequest.CONTROL_ZOOM_RATIO, p.zoom)
                  if (sup(CameraCharacteristics.LENS_INFO_AVAILABLE_OPTICAL_STABILIZATION, CameraMetadata.LENS_OPTICAL_STABILIZATION_MODE_ON))
                      b.set(CaptureRequest.LENS_OPTICAL_STABILIZATION_MODE, CameraMetadata.LENS_OPTICAL_STABILIZATION_MODE_ON)
              }

              /** kind: 0 = preview, 1 = still (RAW), 2 = record */
              private fun applyParams(b: CaptureRequest.Builder, kind: Int) {
                  val c = chars ?: return
                  b.set(CaptureRequest.CONTROL_MODE, CameraMetadata.CONTROL_MODE_AUTO)
                  common(b)
                  if (!p.autoExp && cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_SENSOR)) {
                      b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_OFF)
                      b.set(CaptureRequest.SENSOR_SENSITIVITY, p.iso)
                      b.set(CaptureRequest.SENSOR_EXPOSURE_TIME, p.expNs)
                      b.set(CaptureRequest.SENSOR_FRAME_DURATION, if (kind == 2) 1_000_000_000L / p.fps else max(p.expNs, 33_333_333L))
                  } else {
                      b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON)
                      val step = c.get(CameraCharacteristics.CONTROL_AE_COMPENSATION_STEP)?.toFloat() ?: 0f
                      if (step > 0f) b.set(CaptureRequest.CONTROL_AE_EXPOSURE_COMPENSATION, (p.ev / step).roundToInt())
                  }
                  if (!p.autoFocus && minFocus > 0f) {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_OFF)
                      b.set(CaptureRequest.LENS_FOCUS_DISTANCE, p.focus * minFocus)
                  } else {
                      b.set(CaptureRequest.CONTROL_AF_MODE, if (kind == 2) CameraMetadata.CONTROL_AF_MODE_CONTINUOUS_VIDEO else CameraMetadata.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                      val rg = p.region
                      if (rg != null) {
                          if ((c.get(CameraCharacteristics.CONTROL_MAX_REGIONS_AF) ?: 0) > 0) b.set(CaptureRequest.CONTROL_AF_REGIONS, arrayOf(rg))
                          if ((c.get(CameraCharacteristics.CONTROL_MAX_REGIONS_AE) ?: 0) > 0) b.set(CaptureRequest.CONTROL_AE_REGIONS, arrayOf(rg))
                      }
                  }
                  val bg = p.baseGains
                  val bc = p.baseCcm
                  if (!p.autoWb && bg != null && bc != null && cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_POST_PROCESSING)) {
                      val f = 2.0.pow(p.wbShift.toDouble()).toFloat()
                      b.set(CaptureRequest.CONTROL_AWB_MODE, CameraMetadata.CONTROL_AWB_MODE_OFF)
                      b.set(CaptureRequest.COLOR_CORRECTION_MODE, CameraMetadata.COLOR_CORRECTION_MODE_TRANSFORM_MATRIX)
                      b.set(CaptureRequest.COLOR_CORRECTION_GAINS, RggbChannelVector(bg.red * f, bg.greenEven, bg.greenOdd, bg.blue / f))
                      b.set(CaptureRequest.COLOR_CORRECTION_TRANSFORM, bc)
                  } else b.set(CaptureRequest.CONTROL_AWB_MODE, CameraMetadata.CONTROL_AWB_MODE_AUTO)

                  val raw = mode == Mode.RAW && p.rawNoProc
                  when (kind) {
                      0 -> if (raw) noProcess(b)
                      1 -> {
                          if (raw) noProcess(b) else quality(b)
                          if (sup(CameraCharacteristics.STATISTICS_INFO_AVAILABLE_LENS_SHADING_MAP_MODES, CameraMetadata.STATISTICS_LENS_SHADING_MAP_MODE_ON))
                              b.set(CaptureRequest.STATISTICS_LENS_SHADING_MAP_MODE, CameraMetadata.STATISTICS_LENS_SHADING_MAP_MODE_ON)
                      }
                      2 -> {
                          val ranges = c.get(CameraCharacteristics.CONTROL_AE_AVAILABLE_TARGET_FPS_RANGES)
                          val r = ranges?.firstOrNull { it.lower == p.fps && it.upper == p.fps } ?: ranges?.filter { it.upper == p.fps }?.maxByOrNull { it.lower }
                          if (r != null) b.set(CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, r)
                      }
                  }
              }

              // ---------------------------------------------------------------- shooting
              fun shoot() {
                  hd.post {
                      val s = sess ?: return@post
                      val d = dev ?: return@post
                      if (mode != Mode.VIDEO && pending != null) return@post
                      when (mode) {
                          Mode.RAW -> shootRaw(s, d)
                          Mode.SR -> shootBurst(s, d, FloatArray(Cfg.SR_FRAMES), 0)
                          Mode.HDR -> shootHdr(s, d)
                          Mode.VIDEO -> toggleRecord()
                      }
                  }
              }

              private fun burstCb(pd: Pending) = object : CameraCaptureSession.CaptureCallback() {
                  override fun onCaptureCompleted(session: CameraCaptureSession, request: CaptureRequest, result: TotalCaptureResult) { pd.addResult(result) }
                  override fun onCaptureFailed(session: CameraCaptureSession, request: CaptureRequest, failure: CaptureFailure) {
                      ui.status("Capture failed (${failure.reason})"); pd.abort()
                  }
              }

              private fun lockExposure(b: CaptureRequest.Builder, base: TotalCaptureResult) {
                  b.set(CaptureRequest.CONTROL_MODE, CameraMetadata.CONTROL_MODE_AUTO)
                  common(b)
                  b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_OFF)
                  if (cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_POST_PROCESSING)) {
                      val g = base.get(CaptureResult.COLOR_CORRECTION_GAINS)
                      val t = base.get(CaptureResult.COLOR_CORRECTION_TRANSFORM)
                      if (g != null && t != null) {
                          b.set(CaptureRequest.CONTROL_AWB_MODE, CameraMetadata.CONTROL_AWB_MODE_OFF)
                          b.set(CaptureRequest.COLOR_CORRECTION_MODE, CameraMetadata.COLOR_CORRECTION_MODE_TRANSFORM_MATRIX)
                          b.set(CaptureRequest.COLOR_CORRECTION_GAINS, g)
                          b.set(CaptureRequest.COLOR_CORRECTION_TRANSFORM, t)
                      }
                  }
                  if (minFocus > 0f) {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_OFF)
                      base.get(CaptureResult.LENS_FOCUS_DISTANCE)?.let { b.set(CaptureRequest.LENS_FOCUS_DISTANCE, it) }
                  }
              }

              /** exact, known tone curve so the merge can linearise 8-bit YUV reliably */
              private fun knownCurve(b: CaptureRequest.Builder) {
                  if (sup(CameraCharacteristics.TONEMAP_AVAILABLE_TONE_MAP_MODES, CameraMetadata.TONEMAP_MODE_GAMMA_VALUE)) {
                      b.set(CaptureRequest.TONEMAP_MODE, CameraMetadata.TONEMAP_MODE_GAMMA_VALUE)
                      b.set(CaptureRequest.TONEMAP_GAMMA, 2.2f)
                  } else if (sup(CameraCharacteristics.TONEMAP_AVAILABLE_TONE_MAP_MODES, CameraMetadata.TONEMAP_MODE_PRESET_CURVE)) {
                      b.set(CaptureRequest.TONEMAP_MODE, CameraMetadata.TONEMAP_MODE_PRESET_CURVE)
                      b.set(CaptureRequest.TONEMAP_PRESET_CURVE, CameraMetadata.TONEMAP_PRESET_CURVE_SRGB)
                  }
              }

              private fun shootRaw(s: CameraCaptureSession, d: CameraDevice) {
                  val rd = reader ?: return
                  val c = chars ?: return
                  val n = max(1, min(8, p.stack))
                  val base = last
                  val reqs = ArrayList<CaptureRequest>()
                  for (k in 0 until n) {
                      val b = d.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE)
                      b.addTarget(rd.surface)
                      applyParams(b, 1)
                      if (n > 1 && base != null && cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_SENSOR)) {
                          // identical exposure for every frame of the stack
                          lockExposure(b, base)
                          b.set(CaptureRequest.SENSOR_EXPOSURE_TIME, base.get(CaptureResult.SENSOR_EXPOSURE_TIME) ?: p.expNs)
                          b.set(CaptureRequest.SENSOR_SENSITIVITY, base.get(CaptureResult.SENSOR_SENSITIVITY) ?: p.iso)
                          if (mode == Mode.RAW && p.rawNoProc) noProcess(b)
                      }
                      reqs.add(b.build())
                  }
                  val pd = Pending(n, Mode.RAW, 0, c, jpegRot(c))
                  pending = pd; pf = 0f
                  ui.busy(true)
                  ui.status(if (n > 1) "RAW+ stack ×$n – hold still…" else "Capturing RAW…")
                  if (n == 1) s.capture(reqs[0], burstCb(pd), hd) else s.captureBurst(reqs, burstCb(pd), hd)
              }

              private fun shootHdr(s: CameraCaptureSession, d: CameraDevice) {
                  val hi = sceneHi; val lo = sceneLo
                  val evS = when { hi > .15f -> -2.5f; hi > .06f -> -2f; hi > .015f -> -1.5f; else -> -1f }
                  val evL = if (lo > .25f) 2.5f else 1.5f
                  val evs = FloatArray(Cfg.HDR_SHORTS + 1) { if (it < Cfg.HDR_SHORTS) evS else evL }
                  shootBurst(s, d, evs, Cfg.HDR_SHORTS)
              }

              private fun shootBurst(s: CameraCaptureSession, d: CameraDevice, evs: FloatArray, shorts: Int) {
                  val base = last ?: run { ui.status("Preview not ready yet"); return }
                  val rd = reader ?: return
                  val c = chars ?: return
                  if (!cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_SENSOR)) { ui.status("Lens lacks manual sensor control (needed for SR/HDR+)"); return }
                  val e0 = base.get(CaptureResult.SENSOR_EXPOSURE_TIME) ?: return
                  val i0 = base.get(CaptureResult.SENSOR_SENSITIVITY) ?: return
                  val ir = isoRange ?: return
                  val er = expRange ?: return
                  val reqs = ArrayList<CaptureRequest>()
                  for (ev in evs) {
                      val k = 2.0.pow(ev.toDouble())
                      val tot = e0.toDouble() * i0 * k
                      val tmax = max(e0, if (ev > 0.5f) 50_000_000L else 33_000_000L)
                      val et = min((e0 * k).toLong(), tmax).coerceIn(er.lower, er.upper)
                      val iso = (tot / et).roundToInt().coerceIn(ir.lower, ir.upper)
                      val b = d.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE)
                      b.addTarget(rd.surface)
                      lockExposure(b, base)
                      knownCurve(b)
                      quality(b)
                      b.set(CaptureRequest.SENSOR_EXPOSURE_TIME, et)
                      b.set(CaptureRequest.SENSOR_SENSITIVITY, iso)
                      b.set(CaptureRequest.SENSOR_FRAME_DURATION, max(et, 33_333_333L))
                      reqs.add(b.build())
                  }
                  val pd = Pending(reqs.size, mode, shorts, c, jpegRot(c))
                  pending = pd; pf = 0f
                  ui.busy(true)
                  ui.status("Capturing ${reqs.size} frames – hold still…")
                  s.captureBurst(reqs, burstCb(pd), hd)
              }

              private fun toggleRecord() {
                  val e = encoder ?: return
                  if (!recording) {
                      val dir = ctx.getExternalFilesDir(null) ?: ctx.cacheDir
                      val f = File(dir, "rec_${stamp()}.mp4")
                      recFile = f
                      val audio = ctx.checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                      val rt = chars?.get(CameraCharacteristics.SENSOR_INFO_TIMESTAMP_SOURCE) == CameraMetadata.SENSOR_INFO_TIMESTAMP_SOURCE_REALTIME
                      e.begin(f.absolutePath, audio, rt)
                      recording = true
                      rebuildRepeating()
                      ui.recording(true)
                      ui.status("● REC ${videoSize.width}x${videoSize.height}@${p.fps}" + (if (sessionHdr) " HLG10" else ""))
                  } else {
                      recording = false
                      rebuildRepeating()
                      ui.recording(false)
                      val f = recFile
                      val hdr = sessionHdr
                      ui.status("Finalising…")
                      wh.post {
                          try {
                              e.end()
                              if (f != null && f.exists() && f.length() > 0) {
                                  ui.status("Saving ${f.length() / 1_000_000} MB…")
                                  if (Store.publishVideo(ctx, f, "VID_${stamp()}.mp4")) { ui.saved("video"); if (hdr) ui.saved("hlg") }
                                  else ui.status("Could not save video")
                              } else ui.status("Recording was empty")
                          } catch (t: Throwable) { ui.status("Video save failed: ${t.message}") }
                      }
                  }
              }

              // ---------------------------------------------------------------- results
              private inner class Pending(val n: Int, val kind: Mode, val shorts: Int, val c: CameraCharacteristics, val rot: Int) {
                  val frames = ArrayList<Frame>()
                  val raws = ArrayList<RawFrame>()
                  val results = ArrayList<TotalCaptureResult>()
                  private var fired = false
                  private var got = 0

                  @Synchronized fun addImage(img: Image) {
                      try {
                          if (kind == Mode.RAW) raws.add(RawFrame.from(img))
                          else { val f = Frame.from(img); f.ts = img.timestamp; frames.add(f) }
                      } finally { img.close() }
                      got++
                      ui.progress(.25f * got / n, "Frame $got/$n")
                      check()
                  }

                  @Synchronized fun addResult(r: TotalCaptureResult) { results.add(r); check() }
                  fun abort() { pending = null; ui.busy(false) }

                  private fun check() {
                      val ni = if (kind == Mode.RAW) raws.size else frames.size
                      if (!fired && ni >= n && results.size >= n) {
                          fired = true
                          Thread {
                              Process.setThreadPriority(Process.THREAD_PRIORITY_FOREGROUND)
                              try {
                                  when (kind) { Mode.RAW -> processRaw(this); Mode.SR -> processSr(this); Mode.HDR -> processHdr(this); else -> { } }
                              } catch (t: Throwable) {
                                  ui.status("Processing failed: ${t.javaClass.simpleName} ${t.message}")
                              } finally { pending = null; ui.busy(false) }
                          }.start()
                      }
                  }
              }

              private fun bump(msg: String) { pf = min(.95f, max(pf, .25f) + .09f); ui.progress(pf, msg); ui.status(msg) }

              private fun stamp(): String = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())

              private fun jpegRot(c: CameraCharacteristics): Int {
                  val so = c.get(CameraCharacteristics.SENSOR_ORIENTATION) ?: 90
                  return (so + deviceOri + 360) % 360
              }

              private fun exifOri(rot: Int): Int = when (rot) { 90 -> 6; 180 -> 3; 270 -> 8; else -> 1 }

              private fun processRaw(pd: Pending) {
                  val res = pd.results[0]
                  val c = pd.c
                  val f0 = pd.raws[0]
                  val buf: ByteBuffer
                  val kind: String
                  if (pd.raws.size == 1) { buf = f0.buf; kind = "raw" }
                  else {
                      val bp = c.get(CameraCharacteristics.SENSOR_BLACK_LEVEL_PATTERN)
                      val black = IntArray(4) { bp?.getOffsetForIndex(it and 1, it shr 1) ?: 0 }
                      val dyn = res.get(CaptureResult.SENSOR_DYNAMIC_BLACK_LEVEL)
                      if (dyn != null && dyn.size >= 4) for (i in 0 until 4) black[i] = dyn[i].roundToInt()
                      val white = c.get(CameraCharacteristics.SENSOR_INFO_WHITE_LEVEL) ?: 1023
                      val np = res.get(CaptureResult.SENSOR_NOISE_PROFILE)
                      val noise = if (np != null && np.size >= 4) FloatArray(8) { i -> (if (i % 2 == 0) np[i / 2].first else np[i / 2].second).toFloat() } else null
                      buf = RawStack.merge(pd.raws, black, white, noise) { bump(it) }
                      kind = "stack"
                  }
                  bump("Writing DNG…")
                  val uri = Store.create(ctx, "RAW_${stamp()}.dng", "image/x-adobe-dng", false) ?: throw IllegalStateException("cannot create file")
                  ctx.contentResolver.openOutputStream(uri)!!.use { out ->
                      val dng = DngCreator(c, res)
                      dng.setOrientation(exifOri(pd.rot))
                      buf.rewind()
                      dng.writeByteBuffer(out, Size(f0.w, f0.h), buf, 0L)
                      dng.close()
                  }
                  ui.progress(1f, "Done")
                  ui.saved(kind)
              }

              private fun tag(pd: Pending) {
                  val map = HashMap<Long, TotalCaptureResult>()
                  for (r in pd.results) r.get(CaptureResult.SENSOR_TIMESTAMP)?.let { map[it] = r }
                  for (i in pd.frames.indices) {
                      val r = map[pd.frames[i].ts] ?: pd.results[min(i, pd.results.size - 1)]
                      pd.frames[i].expNs = r.get(CaptureResult.SENSOR_EXPOSURE_TIME) ?: 0L
                      pd.frames[i].iso = r.get(CaptureResult.SENSOR_SENSITIVITY) ?: 100
                  }
              }

              private fun processSr(pd: Pending) {
                  tag(pd)
                  val bmp = SuperRes.run(pd.frames, 2, if (ultra) 1.1f else 0.7f, if (ultra) 1.0f else 0.25f) { bump(it) }
                  pd.frames.clear()
                  bump("Encoding JPEG…")
                  saveJpeg(bmp, "SR_${stamp()}.jpg", pd.rot)
                  bmp.recycle()
                  ui.progress(1f, "Done")
                  ui.saved("sr")
              }

              private fun processHdr(pd: Pending) {
                  tag(pd)
                  val bmp = HdrPlus.run(pd.frames, pd.shorts, p.hdrPower) { bump(it) }
                  pd.frames.clear()
                  bump("Encoding JPEG…")
                  saveJpeg(bmp, "HDR_${stamp()}.jpg", pd.rot)
                  bmp.recycle()
                  ui.progress(1f, "Done")
                  ui.saved("hdr")
              }

              private fun saveJpeg(bmp: Bitmap, name: String, rot: Int) {
                  val uri = Store.create(ctx, name, "image/jpeg", false) ?: throw IllegalStateException("cannot create file")
                  ctx.contentResolver.openOutputStream(uri)!!.use { bmp.compress(Bitmap.CompressFormat.JPEG, 97, it) }
                  try {
                      ctx.contentResolver.openFileDescriptor(uri, "rw")?.use { pfd ->
                          val ex = ExifInterface(pfd.fileDescriptor)
                          ex.setAttribute(ExifInterface.TAG_ORIENTATION, exifOri(rot).toString())
                          ex.saveAttributes()
                      }
                  } catch (e: Exception) { }
              }
          }
