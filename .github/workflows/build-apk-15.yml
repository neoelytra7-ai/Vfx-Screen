          // ------------------------------------------------------------------ splash
          class SplashView(ctx: Context, private val biome: Biome) : AView(ctx) {
              var onDone: (() -> Unit)? = null
              private var t = 0f
              private var fade = 0f
              private var closing = false
              private val big = tpaint(Fonts.px, 64f, Color.WHITE)
              private val ps = tpaint(Fonts.px, 22f, Color.WHITE, Paint.Align.CENTER)
              private val bp = Paint()
              private val letters = "MICAM"
              init { wake() }
              override fun step(dt: Float): Boolean {
                  t += dt
                  if (t > 3.2f && !closing) close()
                  if (closing) { fade += dt * 2f; alpha = (1f - fade).coerceIn(0f, 1f); if (fade >= 1f) { visibility = View.GONE; onDone?.invoke(); return false } }
                  return true
              }
              private fun close() { if (closing) return; closing = true; Sfx.coin(); Hap.click() }
              override fun onTouchEvent(e: MotionEvent): Boolean { if (e.actionMasked == MotionEvent.ACTION_UP && t > .8f) close(); return true }
              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  bp.color = col("#ef323d"); c.drawRect(0f, 0f, w, h, bp)
                  c.save()
                  val cy = h * .38f
                  val lw = big.measureText(letters) + dp(4) * (letters.length - 1)
                  var x = (w - lw) / 2
                  for (i in letters.indices) {
                      val a = ((t - i * .12f) / .5f).coerceIn(0f, 1f)
                      val yy = cy - (1f - (1f - (1f - a) * (1f - a))) * dp(90) + (if (a >= 1f) 0f else 0f)
                      big.alpha = (a * 255).toInt()
                      shText(c, letters[i].toString(), x, yy, big, dp(5), col("#9c1822"))
                      x += big.measureText(letters[i].toString()) + dp(4)
                  }
                  c.restore()
                  val wob = if ((t * 2).toInt() % 2 == 0) -6f else 6f
                  c.save(); c.rotate(wob, w / 2, cy + dp(70) + dp(28)); Icons.draw(c, "fox", w / 2 - dp(28), cy + dp(70), dp(56)); c.restore()
                  val lwid = min(w * .6f, dp(240)); val lx = (w - lwid) / 2; val ly = cy + dp(150)
                  bp.color = Color.WHITE; c.drawRect(lx, ly, lx + lwid, ly + dp(16), bp)
                  bp.color = col("#ef323d"); c.drawRect(lx + dp(3), ly + dp(3), lx + lwid - dp(3), ly + dp(13), bp)
                  val p = ((t - .3f) / 2.2f).coerceIn(0f, 1f)
                  bp.color = Color.WHITE; c.drawRect(lx + dp(5), ly + dp(5), lx + dp(5) + (lwid - dp(10)) * ((p * 14).toInt() / 14f), ly + dp(11), bp)
                  if (p >= 1f && (t * 2).toInt() % 2 == 0) shText(c, "▶ PRESS START", w / 2, ly + dp(52), ps, dp(3), col("#9c1822"))
                  shText(c, "RAW · SR · HDR+ · HLG", w / 2, ly + dp(80), tpaint(Fonts.vt, 18f, 0xCCFFFFFF.toInt(), Paint.Align.CENTER), dp(1.5f), col("#9c1822"))
              }
          }


          // ------------------------------------------------------------------ pro chips (ISO / SS / FOCUS / WB / EV)
          class ProChips(ctx: Context, private val names: List<String>, private val icons: List<String>) : AView(ctx) {
              val values = Array(names.size) { "" }
              val autos = BooleanArray(names.size) { true }
              var selected = -1
                  set(v) { field = v; for (i in lift.indices) lift[i].t = if (i == v) 1f else 0f; wake() }
              var onTap: ((Int) -> Unit)? = null
              var onLong: ((Int) -> Unit)? = null
              var accent = col("#fcdb5a")
              private val lift = List(names.size) { Spring(0f, 420f, 18f) }
              private val press = List(names.size) { Spring(1f, 520f, 26f) }
              private val lp = tpaint(Fonts.vt, 13f, col("#c9c9c9"))
              private val vp = tpaint(Fonts.vt, 19f, Color.WHITE, Paint.Align.CENTER)
              private val ap = tpaint(Fonts.px, 10f, col("#7cff3a"), Paint.Align.RIGHT)
              private val bp = Paint()
              private var down = -1
              private var longFired = false
              private val longRun = Runnable { if (down >= 0) { longFired = true; Hap.click(); Sfx.coin(); onLong?.invoke(down) } }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(resolveSize(dp(300).toInt(), w), dp(58).toInt()) }

              override fun step(dt: Float): Boolean {
                  var act = false
                  for (sp in lift) { sp.step(dt); if (!sp.settled) act = true }
                  for (sp in press) { sp.step(dt); if (!sp.settled) act = true }
                  return act
              }

              private fun cw(): Float = (width - dp(4) * (names.size - 1)) / names.size

              override fun onDraw(c: Canvas) {
                  val cw = cw(); val gap = dp(4); val ch = dp(44)
                  for (i in names.indices) {
                      val x = i * (cw + gap); val l = lift[i].x
                      val y = dp(10) - l * dp(7)
                      val s = (1f + .05f * l) * press[i].x
                      c.save(); c.scale(s, s, x + cw / 2, y + ch / 2)
                      if (l > .5f) { bp.color = accent; c.drawRect(x - dp(3), y - dp(3), x + cw + dp(3), y + ch + dp(3), bp) }
                      val manual = !autos[i]
                      if (manual) Bevel.draw(c, x, y, x + cw, y + ch, col("#3d3410"), col("#fcdb5a"), col("#2a2306"), col("#000000"), dp(3), dp(2))
                      else Bevel.draw(c, x, y, x + cw, y + ch, col("#3c3c3c"), col("#8b8b8b"), col("#333333"), col("#1a1a1a"), dp(3), dp(2))
                      Icons.draw(c, icons[i], x + dp(6), y + dp(5), dp(13))
                      lp.textAlign = Paint.Align.LEFT
                      shText(c, names[i], x + dp(21), y + dp(15), lp, dp(1f))
                      ap.color = if (manual) col("#fcdb5a") else col("#7cff3a")
                      shText(c, if (manual) "M" else "A", x + cw - dp(6), y + dp(15), ap, dp(1f))
                      shText(c, values[i], x + cw / 2, y + ch - dp(7), vp, dp(1.5f))
                      c.restore()
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val i = (e.x / (cw() + dp(4))).toInt()
                  val idx = if (i in names.indices && e.y > dp(2)) i else -1
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { down = idx; longFired = false; if (idx >= 0) { press[idx].t = .9f; wake(); postDelayed(longRun, 420) }; return true }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          if (down >= 0) { press[down].t = 1f; press[down].kick(2f) }
                          if (idx >= 0 && idx == down && !longFired) { Hap.tick(); Sfx.tick(); onTap?.invoke(idx) }
                          down = -1; wake()
                      }
                      MotionEvent.ACTION_CANCEL -> { removeCallbacks(longRun); if (down >= 0) press[down].t = 1f; down = -1; wake() }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ zoom / lens pills
          class ZoomPills(ctx: Context) : AView(ctx) {
              var presets: List<Float> = emptyList()
                  set(v) { field = v; invalidate() }
              var zoom = 1f
                  set(v) { field = v; invalidate() }
              var lensLabel = "lens"
                  set(v) { field = v; invalidate() }
              var onPick: ((Float) -> Unit)? = null
              var onLens: (() -> Unit)? = null
              var onLong: (() -> Unit)? = null
              private val tp = tpaint(Fonts.vt, 17f, Color.WHITE, Paint.Align.CENTER)
              private val rects = ArrayList<RectF>()
              private val kinds = ArrayList<Int>() // -1 = lens, else preset index, -2 = current value chip
              private var down = -1
              private var longFired = false
              private val longRun = Runnable { longFired = true; Hap.click(); onLong?.invoke() }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(resolveSize(dp(300).toInt(), w), dp(40).toInt()) }
              override fun step(dt: Float): Boolean = false

              private fun activeIdx(): Int {
                  var best = -1; var bd = 1f
                  for (i in presets.indices) { val d = kotlin.math.abs(ln(zoom / presets[i])); if (d < bd) { bd = d; best = i } }
                  return if (bd < .09f) best else -1
              }

              private fun label(z: Float): String = if (z < 1f || z != z.toInt().toFloat()) String.format("%.1f", z) else z.toInt().toString()

              override fun onDraw(c: Canvas) {
                  rects.clear(); kinds.clear()
                  val act = activeIdx()
                  val items = ArrayList<Pair<Int, String>>()
                  items.add(Pair(-1, lensLabel))
                  for (i in presets.indices) items.add(Pair(i, label(presets[i]) + (if (i == act) "x" else "")))
                  if (act < 0 && presets.isNotEmpty()) items.add(Pair(-2, String.format("%.1fx", zoom)))
                  val h = dp(30); val gap = dp(4)
                  var total = 0f
                  val ws = FloatArray(items.size) { i -> if (items[i].first == -1) dp(58) else dp(40) }
                  for (w in ws) total += w
                  total += gap * (items.size - 1)
                  var x = (width - total) / 2
                  val y = (height - h) / 2
                  for ((i, it) in items.withIndex()) {
                      val r = RectF(x, y, x + ws[i], y + h); rects.add(r); kinds.add(it.first)
                      val on = it.first == act || it.first == -2
                      if (on) Bevel.draw(c, r.left, r.top, r.right, r.bottom, col("#7a6a1a"), col("#fcdb5a"), col("#4a3f0a"), Color.BLACK, dp(2), dp(2))
                      else Bevel.draw(c, r.left, r.top, r.right, r.bottom, col("#2c2c2c"), col("#7a7a7a"), col("#222222"), Color.BLACK, dp(2), dp(2))
                      if (it.first == -1) {
                          Icons.draw(c, "lens", r.left + dp(5), r.top + dp(6), dp(17))
                          tp.textAlign = Paint.Align.LEFT; tp.textSize = dp(13); shText(c, it.second.removePrefix("cam"), r.left + dp(25), r.top + h / 2 + dp(4), tp, dp(1f))
                      } else {
                          tp.textAlign = Paint.Align.CENTER; tp.textSize = dp(17); shText(c, it.second, r.centerX(), r.top + h / 2 + dp(5), tp, dp(1.5f))
                      }
                      x += ws[i] + gap
                  }
              }

              private fun hit(e: MotionEvent): Int { for (i in rects.indices) if (rects[i].contains(e.x, e.y)) return i; return -1 }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { down = hit(e); longFired = false; postDelayed(longRun, 450); return true }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          val i = hit(e)
                          if (!longFired && i >= 0 && i == down) {
                              Hap.tick(); Sfx.tick()
                              when (val k = kinds[i]) { -1 -> onLens?.invoke(); -2 -> { }; else -> onPick?.invoke(presets[k]) }
                          }
                          down = -1
                      }
                      MotionEvent.ACTION_CANCEL -> { removeCallbacks(longRun); down = -1 }
                  }
                  return true
              }
          }
