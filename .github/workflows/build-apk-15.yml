          package com.micampro

          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.MediaRecorder
          import android.os.Bundle
          import android.os.Process
          import android.os.SystemClock
          import android.view.Surface
          import java.nio.ByteBuffer
          import kotlin.math.max

          /**
           * HEVC encoder fed by a Camera2 surface. Tuned for real-time capture:
           *  - KEY_PRIORITY=0 (real-time) + KEY_OPERATING_RATE: the default priority is "best effort" and is what makes
           *    high-bitrate 10-bit HLG recordings stutter.
           *  - muxes to a local file (no FUSE write path); Camera publishes it to MediaStore afterwards.
           *  - encoder idles (no camera frames) until the repeating request targets its surface.
           */
          class VideoEncoder(w: Int, h: Int, fps: Int, bitrate: Int, val hdr: Boolean) {
              private val vc: MediaCodec = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_HEVC)
              lateinit var surface: Surface
                  private set
              @Volatile private var vFormat: MediaFormat? = null
              @Volatile private var sink: Sink? = null
              @Volatile private var running = true
              private var pendPath: String? = null
              private var pendAudio = false
              private var pendRealtime = true
              private val th: Thread

              init {
                  try {
                      val f = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_HEVC, w, h)
                      f.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
                      f.setInteger(MediaFormat.KEY_BIT_RATE, bitrate)
                      f.setInteger(MediaFormat.KEY_FRAME_RATE, fps)
                      f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                      f.setInteger(MediaFormat.KEY_BITRATE_MODE, MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR)
                      f.setInteger(MediaFormat.KEY_PRIORITY, 0)
                      f.setInteger(MediaFormat.KEY_OPERATING_RATE, fps)
                      try { f.setInteger(MediaFormat.KEY_MAX_B_FRAMES, 0) } catch (e: Exception) { }
                      try { f.setInteger(MediaFormat.KEY_LATENCY, 1) } catch (e: Exception) { }
                      if (hdr) {
                          f.setInteger(MediaFormat.KEY_PROFILE, MediaCodecInfo.CodecProfileLevel.HEVCProfileMain10)
                          f.setInteger(MediaFormat.KEY_COLOR_STANDARD, MediaFormat.COLOR_STANDARD_BT2020)
                          f.setInteger(MediaFormat.KEY_COLOR_TRANSFER, MediaFormat.COLOR_TRANSFER_HLG)
                          f.setInteger(MediaFormat.KEY_COLOR_RANGE, MediaFormat.COLOR_RANGE_LIMITED)
                      }
                      vc.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      surface = vc.createInputSurface()
                      vc.start()
                  } catch (e: Exception) {
                      try { vc.release() } catch (e2: Exception) { }
                      throw e
                  }
                  th = Thread { Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_DISPLAY); drain() }
                  th.start()
              }

              private fun drain() {
                  val info = MediaCodec.BufferInfo()
                  while (running) {
                      val i = try { vc.dequeueOutputBuffer(info, 20_000) } catch (e: Exception) { break }
                      if (i == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          vFormat = vc.outputFormat
                          startPending()
                      } else if (i >= 0) {
                          val b = vc.getOutputBuffer(i)
                          if (b != null && info.size > 0 && (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0) sink?.video(b, info)
                          vc.releaseOutputBuffer(i, false)
                      }
                  }
              }

              @Synchronized private fun startPending() {
                  val p = pendPath ?: return
                  val f = vFormat ?: return
                  pendPath = null
                  try { sink = Sink(p, f, pendAudio, pendRealtime) } catch (e: Exception) { sink = null }
              }

              /** returns immediately; the muxer is created once the encoder has produced its output format */
              @Synchronized fun begin(path: String, audio: Boolean, realtimeClock: Boolean) {
                  pendPath = path; pendAudio = audio; pendRealtime = realtimeClock
                  if (vFormat != null) startPending()
              }

              fun end() {
                  synchronized(this) { pendPath = null }
                  val s = sink
                  sink = null
                  s?.finish()
              }

              fun release() {
                  end()
                  running = false
                  try { th.join(1000) } catch (e: Exception) { }
                  try { vc.stop() } catch (e: Exception) { }
                  try { vc.release() } catch (e: Exception) { }
                  try { surface.release() } catch (e: Exception) { }
              }

              private inner class Sink(path: String, vf: MediaFormat, audio: Boolean, private val realtime: Boolean) {
                  private val muxer = MediaMuxer(path, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  private val vTrack = muxer.addTrack(vf)
                  private var aTrack = -1
                  private var started = false
                  private var t0 = -1L
                  private val lock = Any()
                  @Volatile private var stopping = false
                  private var needAudio = audio
                  private var rec: AudioRecord? = null
                  private var ac: MediaCodec? = null
                  private var at: Thread? = null

                  init {
                      if (needAudio) {
                          try { startAudio() } catch (e: Exception) {
                              needAudio = false
                              try { rec?.release() } catch (e2: Exception) { }
                              try { ac?.release() } catch (e2: Exception) { }
                              rec = null; ac = null
                          }
                      }
                      if (!needAudio) tryStart()
                  }

                  private fun nowUs(): Long = (if (realtime) SystemClock.elapsedRealtimeNanos() else System.nanoTime()) / 1000

                  private fun tryStart() {
                      synchronized(lock) {
                          if (started) return
                          if (needAudio && aTrack < 0) return
                          muxer.start()
                          started = true
                          try { vc.setParameters(Bundle().apply { putInt(MediaCodec.PARAMETER_KEY_REQUEST_SYNC_FRAME, 0) }) } catch (e: Exception) { }
                      }
                  }

                  private fun startAudio() {
                      val rate = 48000
                      val min = AudioRecord.getMinBufferSize(rate, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT)
                      val r = AudioRecord(MediaRecorder.AudioSource.MIC, rate, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT, min * 4)
                      if (r.state != AudioRecord.STATE_INITIALIZED) { r.release(); throw IllegalStateException("AudioRecord init failed") }
                      val f = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, rate, 2)
                      f.setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                      f.setInteger(MediaFormat.KEY_BIT_RATE, 256_000)
                      f.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384)
                      val c = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                      c.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      c.start()
                      rec = r; ac = c
                      r.startRecording()
                      val t = Thread { Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO); audioLoop(r, c) }
                      at = t
                      t.start()
                  }

                  private fun audioLoop(r: AudioRecord, c: MediaCodec) {
                      val info = MediaCodec.BufferInfo()
                      var lastPts = 0L
                      while (!stopping) {
                          val i = c.dequeueInputBuffer(5000)
                          if (i >= 0) {
                              val b = c.getInputBuffer(i)!!
                              b.clear()
                              val n = r.read(b, b.capacity())
                              if (n > 0) {
                                  var pts = nowUs() - n / 4 * 1_000_000L / 48000
                                  if (pts <= lastPts) pts = lastPts + 1
                                  lastPts = pts
                                  c.queueInputBuffer(i, 0, n, pts, 0)
                              } else c.queueInputBuffer(i, 0, 0, lastPts + 1, 0)
                          }
                          while (true) {
                              val o = c.dequeueOutputBuffer(info, 0)
                              if (o == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                                  synchronized(lock) { aTrack = muxer.addTrack(c.outputFormat) }
                                  tryStart()
                              } else if (o >= 0) {
                                  val b = c.getOutputBuffer(o)
                                  if (b != null && info.size > 0 && (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0) audioSample(b, info)
                                  c.releaseOutputBuffer(o, false)
                              } else break
                          }
                      }
                  }

                  fun video(b: ByteBuffer, info: MediaCodec.BufferInfo) {
                      synchronized(lock) {
                          if (!started) return
                          if (t0 < 0) {
                              if ((info.flags and MediaCodec.BUFFER_FLAG_KEY_FRAME) == 0) return
                              t0 = info.presentationTimeUs
                          }
                          val o = MediaCodec.BufferInfo()
                          o.set(info.offset, info.size, max(0L, info.presentationTimeUs - t0), info.flags)
                          b.position(info.offset)
                          b.limit(info.offset + info.size)
                          muxer.writeSampleData(vTrack, b, o)
                      }
                  }

                  private fun audioSample(b: ByteBuffer, info: MediaCodec.BufferInfo) {
                      synchronized(lock) {
                          if (!started || t0 < 0 || aTrack < 0) return
                          if (info.presentationTimeUs < t0) return
                          val o = MediaCodec.BufferInfo()
                          o.set(info.offset, info.size, info.presentationTimeUs - t0, info.flags)
                          b.position(info.offset)
                          b.limit(info.offset + info.size)
                          muxer.writeSampleData(aTrack, b, o)
                      }
                  }

                  fun finish() {
                      stopping = true
                      try { at?.join(2000) } catch (e: Exception) { }
                      try { rec?.stop() } catch (e: Exception) { }
                      try { rec?.release() } catch (e: Exception) { }
                      try { ac?.stop() } catch (e: Exception) { }
                      try { ac?.release() } catch (e: Exception) { }
                      synchronized(lock) {
                          if (started) { started = false; try { muxer.stop() } catch (e: Exception) { } }
                          try { muxer.release() } catch (e: Exception) { }
                      }
                  }
              }
          }
