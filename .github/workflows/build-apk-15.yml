          package com.micampro

          import android.graphics.Bitmap
          import java.util.stream.IntStream
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.exp
          import kotlin.math.floor
          import kotlin.math.ln
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow

          /**
           * Multi-frame super-resolution: tile-wise sub-pixel alignment, robust kernel splatting
           * of every frame's native samples onto a [scale]x grid (luma), chroma from the sharpest frame.
           */
          object SuperRes {
              private fun sharp(y: ByteArray, w: Int, h: Int): Long {
                  var s = 0L
                  var r = 0
                  while (r < h) {
                      var c = 0
                      while (c < w - 1) {
                          s += abs((y[r * w + c].toInt() and 0xFF) - (y[r * w + c + 1].toInt() and 0xFF))
                          c += 3
                      }
                      r += 3
                  }
                  return s
              }

              fun run(frames: List<Frame>, scale: Int, sharpen: Float, edge: Float, log: (String) -> Unit): Bitmap {
                  val w = frames[0].w
                  val h = frames[0].h
                  var ri = 0
                  var bestS = -1L
                  for (i in frames.indices) {
                      val s = sharp(frames[i].y, w, h)
                      if (s > bestS) { bestS = s; ri = i }
                  }
                  val ref = frames[ri]
                  val warps = arrayOfNulls<Warp>(frames.size)
                  for (i in frames.indices) {
                      if (i == ri) continue
                      log("Aligning frame ${i + 1}/${frames.size}…")
                      warps[i] = Align.estimate(ref.y, frames[i].y, w, h, true)
                  }
                  val bw = w * scale
                  val bh = h * scale
                  val bmp = Bitmap.createBitmap(bw, bh, Bitmap.Config.ARGB_8888)
                  val sh = 96
                  val n = (bh + sh - 1) / sh
                  log("Merging ${frames.size} frames → ${bw}x$bh …")
                  val finalRi = ri
                  IntStream.range(0, n).parallel().forEach { s ->
                      strip(frames, finalRi, warps, scale, s * sh, min((s + 1) * sh, bh), sharpen, edge, bmp)
                  }
                  return bmp
              }

              private fun strip(
                  frames: List<Frame>, ri: Int, warps: Array<Warp?>, s: Int,
                  ya: Int, yb: Int, sharpen: Float, edge: Float, bmp: Bitmap
              ) {
                  val ref = frames[ri]
                  val w = ref.w
                  val h = ref.h
                  val ow = w * s
                  val oh = h * s
                  val pad = 2
                  val rows = (yb - ya) + 2 * pad
                  val oy0 = ya - pad
                  val num = FloatArray(ow * rows)
                  val den = FloatArray(ow * rows)
                  val sv = FloatArray(2)
                  val rMin = (oy0 - 2f) / s - 1
                  val rMax = (oy0 + rows + 2f) / s + 1

                  for (fi in frames.indices) {
                      val f = frames[fi]
                      val wp = warps[fi]
                      val isRef = fi == ri
                      val vmin = max(0, floor(rMin + (wp?.minDy ?: 0f)).toInt() - 6)
                      val vmax = min(h - 1, ceil(rMax + (wp?.maxDy ?: 0f)).toInt() + 6)
                      for (v in vmin..vmax) {
                          val rowOff = v * w
                          for (u in 0 until w) {
                              var sx = 0f
                              var sy = 0f
                              if (wp != null) {
                                  wp.eval(u.toFloat(), v.toFloat(), sv)
                                  sx = sv[0]; sy = sv[1]
                              }
                              val rx = u - sx
                              val ry = v - sy
                              val oy = (ry + 0.5f) * s - 0.5f - oy0
                              if (oy < -1.5f || oy > rows - 1 + 1.5f) continue
                              val ox = (rx + 0.5f) * s - 0.5f
                              if (ox < -1.5f || ox > ow - 1 + 1.5f) continue
                              val c = (f.y[rowOff + u].toInt() and 0xFF).toFloat()
                              var wt = 1f
                              if (!isRef) {
                                  val d = abs(c - Px.bil(ref.y, w, h, rx, ry))
                                  val t = d / 28f
                                  if (t >= 1f) continue
                                  wt = 1f - t * t
                              }
                              val xa = ceil(ox - 1.5f).toInt()
                              val xb = floor(ox + 1.5f).toInt()
                              val y1 = ceil(oy - 1.5f).toInt()
                              val y2 = floor(oy + 1.5f).toInt()
                              for (yy in max(y1, 0)..min(y2, rows - 1)) {
                                  val wy = 1f - abs(yy - oy) / 1.5f
                                  if (wy <= 0f) continue
                                  for (xx in max(xa, 0)..min(xb, ow - 1)) {
                                      val wx = 1f - abs(xx - ox) / 1.5f
                                      if (wx <= 0f) continue
                                      val k = wt * wx * wy
                                      val idx = yy * ow + xx
                                      num[idx] += k * c
                                      den[idx] += k
                                  }
                              }
                          }
                      }
                  }

                  val lam = 0.25f
                  val yl = FloatArray(ow * rows)
                  for (r in 0 until rows) {
                      val ryy = (oy0 + r + 0.5f) / s - 0.5f
                      for (x in 0 until ow) {
                          val rxx = (x + 0.5f) / s - 0.5f
                          val i = r * ow + x
                          val up = Px.bil(ref.y, w, h, rxx, ryy)
                          yl[i] = (num[i] + lam * up) / (den[i] + lam)
                      }
                  }

                  val out = IntArray(ow * (yb - ya))
                  val cw = w / 2
                  val ch = h / 2
                  for (r in pad until pad + (yb - ya)) {
                      val gy = oy0 + r
                      val ny = (gy - oh * 0.5f) / (oh * 0.5f)
                      for (x in 0 until ow) {
                          val x1 = max(x - 1, 0)
                          val x2 = min(x + 1, ow - 1)
                          var bl = 0f
                          for (rr in r - 1..r + 1) {
                              val o = rr * ow
                              bl += yl[o + x1] + yl[o + x] + yl[o + x2]
                          }
                          bl /= 9f
                          val nx = (x - ow * 0.5f) / (ow * 0.5f)
                          val r2 = (nx * nx + ny * ny) * 0.5f
                          val amt = sharpen * (1f + edge * r2)
                          val yc = yl[r * ow + x]
                          val yv = yc + amt * (yc - bl)
                          val cxp = (x + 0.5f) / (2f * s) - 0.5f
                          val cyp = (gy + 0.5f) / (2f * s) - 0.5f
                          val cb = Px.bil(ref.cb, cw, ch, cxp, cyp) - 128f
                          val cr = Px.bil(ref.cr, cw, ch, cxp, cyp) - 128f
                          val rr = yv + 1.402f * cr
                          val gg = yv - 0.344136f * cb - 0.714136f * cr
                          val bb = yv + 1.772f * cb
                          out[(r - pad) * ow + x] = (0xFF shl 24) or (Px.c8(rr) shl 16) or (Px.c8(gg) shl 8) or Px.c8(bb)
                      }
                  }
                  synchronized(bmp) { bmp.setPixels(out, 0, ow, 0, ya, ow, yb - ya) }
              }
          }
