          cat > app/src/main/java/com/micampro/Ui.kt <<'EOF'
          package com.micampro

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.ln
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin

          fun tpaint(face: Typeface, sp: Float, color: Int = Color.WHITE, align: Paint.Align = Paint.Align.LEFT): Paint {
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              p.typeface = face; p.textSize = dp(sp); p.color = color; p.textAlign = align
              return p
          }

          fun shText(c: Canvas, s: String, x: Float, y: Float, p: Paint, off: Float = dp(2), shade: Int = 0xCC000000.toInt()) {
              val old = p.color
              p.color = shade; c.drawText(s, x + off, y + off, p)
              p.color = old; c.drawText(s, x, y, p)
          }

          abstract class AView(ctx: Context) : View(ctx), Anim.Tick {
              abstract fun step(dt: Float): Boolean
              override fun tick(dt: Float) { if (!step(dt)) Anim.remove(this); invalidate() }
              fun wake() { Anim.add(this) }
              override fun onDetachedFromWindow() { Anim.remove(this); super.onDetachedFromWindow() }
          }

          // ------------------------------------------------------------------ parallax background
          class ParallaxView(ctx: Context) : AView(ctx) {
              private var biome = Biomes.list[0]
              private var layers: List<Bitmap> = emptyList()
              private var fgBmp: Bitmap? = null
              private val bp = Paint().apply { isFilterBitmap = false; isAntiAlias = false }
              private val sky = Paint()
              private val vig = Paint()
              private val vig2 = Paint()
              private val pp = Paint().apply { style = Paint.Style.FILL }
              private val dst = RectF()
              private var cx = 0f
              private var tx = 0f
              private var ph = 0f
              private var acc = 0f
              private val PM = floatArrayOf(.2f, .5f, 1f)
              private val PD = floatArrayOf(6f, 10f, 0f)
              private val rnd = java.util.Random(11)

              private class P(var x: Float, var y: Float, val s: Float, val v: Float, val dx: Float, val c: Int, val down: Boolean, val a: Float)
              private val parts = ArrayList<P>()

              fun setBiome(b: Biome) {
                  biome = b
                  layers = Scene.layers(b)
                  fgBmp = Scene.foreground(b)
                  rebuild()
                  wake()
              }

              fun panTo(x: Float) { tx = x; wake() }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { rebuild() }

              private fun rebuild() {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  sky.shader = LinearGradient(0f, 0f, 0f, h, intArrayOf(biome.skyA, biome.skyB, biome.skyC), floatArrayOf(0f, .58f, 1f), Shader.TileMode.CLAMP)
                  vig.shader = RadialGradient(w / 2, h * .3f, max(w, h) * .95f, intArrayOf(0, 0xAA000000.toInt()), floatArrayOf(.45f, 1f), Shader.TileMode.CLAMP)
                  vig2.shader = LinearGradient(0f, 0f, 0f, h, intArrayOf(0, 0, 0x77000000), floatArrayOf(0f, .55f, 1f), Shader.TileMode.CLAMP)
                  parts.clear()
                  val n = (w / dp(19)).toInt().coerceIn(10, 26)
                  for (i in 0 until n) {
                      val leaf = biome.leaf && i % 5 == 0
                      val sz = dp(biome.partSize[0] + rnd.nextInt(biome.partSize[1] - biome.partSize[0] + 1))
                      val dur = biome.partDur[0] + rnd.nextFloat() * (biome.partDur[1] - biome.partDur[0])
                      val c = if (leaf) col(arrayOf("#6fbf3c", "#e0b83a", "#c97a2a")[rnd.nextInt(3)]) else col(biome.partCols[rnd.nextInt(biome.partCols.size)])
                      parts.add(P(rnd.nextFloat() * w, rnd.nextFloat() * h, sz, h / dur, (rnd.nextFloat() - .5f) * dp(biome.partDx), c, leaf, .85f))
                  }
                  for (i in 0 until 12) {
                      val dur = (9 + rnd.nextInt(9)) / biome.ambK
                      parts.add(P(rnd.nextFloat() * w, rnd.nextFloat() * h, dp(3 + rnd.nextInt(3)), h / dur, (rnd.nextFloat() - .5f) * dp(90), biome.amb, false, .85f))
                  }
              }

              override fun step(dt: Float): Boolean {
                  cx += (tx - cx) * (1f - exp(-dt * 5f))
                  ph += dt
                  val h = height.toFloat()
                  for (p in parts) {
                      if (p.down) p.y += p.v * dt else p.y -= p.v * dt
                      p.x += p.dx / (h / p.v) * dt * (if (p.down) 1f else -.4f)
                      if (p.y < -dp(14)) { p.y = h + dp(8); p.x = rnd.nextFloat() * width }
                      if (p.y > h + dp(14)) { p.y = -dp(8); p.x = rnd.nextFloat() * width }
                  }
                  acc += dt
                  if (acc < 1f / 58f) return true
                  acc = 0f
                  return true
              }

              override fun tick(dt: Float) { step(dt); if (acc == 0f) invalidate() }

              private fun tiled(c: Canvas, b: Bitmap, off: Float, y0: Float, tw: Float, th: Float) {
                  var x = -off
                  while (x < width) { dst.set(x, y0, x + tw, y0 + th); c.drawBitmap(b, null, dst, bp); x += tw }
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  c.drawRect(0f, 0f, w, h, sky)
                  val ks = h / Scene.SH
                  val tw = Scene.SW * ks
                  for (i in layers.indices) {
                      val off = (((cx * ks * PM[i] + ph * PD[i]) % tw) + tw) % tw
                      tiled(c, layers[i], off, 0f, tw, h)
                  }
                  fgBmp?.let {
                      val fh = Scene.FH * ks
                      val off = (((cx * ks * 1.6f) % tw) + tw) % tw
                      tiled(c, it, off, h - fh, tw, fh)
                  }
                  for (p in parts) {
                      val t = (p.y / h).coerceIn(0f, 1f)
                      val fade = (if (p.down) min(t / .1f, (1f - t) / .1f) else min((1f - t) / .12f, t / .12f)).coerceIn(0f, 1f)
                      pp.color = withA(p.c, .22f * fade * p.a)
                      c.drawRect(p.x - p.s, p.y - p.s, p.x + p.s * 2, p.y + p.s * 2, pp)
                      pp.color = withA(p.c, fade * p.a)
                      c.drawRect(p.x, p.y, p.x + p.s, p.y + p.s, pp)
                  }
                  c.drawRect(0f, 0f, w, h, vig)
                  c.drawRect(0f, 0f, w, h, vig2)
              }
          }

          // ------------------------------------------------------------------ living header
          class HeaderView(ctx: Context) : AView(ctx) {
              var biome: Biome = Biomes.list[0]
                  set(v) { field = v; build() }
              var title = "MiCam"
              var splash = "100% pixel!"
              var onFoxTap: (() -> Unit)? = null
              private val bp = Paint()
              private val tt = tpaint(Fonts.px, 26f)
              private val sp = tpaint(Fonts.vt, 18f, col("#fcdb5a"))
              private val rnd = java.util.Random(5)
              private var t = 0f
              private var acc = 0f
              private val hop = Spring(0f, 400f, 14f)
              private class HP(var x: Float, var y: Float, val v: Float, val p: Float)
              private class B(var x: Float, var y: Float, var vx: Float, var vy: Float, var l: Float)
              private val hps = ArrayList<HP>()
              private val bursts = ArrayList<B>()
              private var hw = 1
              private var hh = 1
              private var u = 3f

              init { Fonts.px.let { tt.typeface = it }; wake() }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { u = dp(3); hw = max(1, (w / u).toInt() + 1); hh = max(1, (h / u).toInt() + 1); build() }

              private fun build() {
                  hps.clear()
                  val n = when (biome.id) { "overworld" -> 12; "lushcave" -> 14; "netherworld" -> 16; else -> 22 }
                  for (i in 0 until n) hps.add(HP(rnd.nextFloat() * hw, rnd.nextFloat() * hh, .4f + rnd.nextFloat() * .6f, rnd.nextFloat() * 6.28f))
              }

              override fun step(dt: Float): Boolean {
                  t += dt
                  hop.step(dt)
                  for (b in bursts) { b.x += b.vx * dt * 18f; b.y += b.vy * dt * 18f; b.vy += .06f * dt * 18f; b.l -= .035f * dt * 18f }
                  bursts.removeAll { it.l <= 0f }
                  acc += dt
                  return true
              }

              override fun tick(dt: Float) { step(dt); if (acc >= .055f) { acc = 0f; invalidate() } else if (hop.settled.not()) invalidate() }

              private fun rr(c: Canvas, x: Float, y: Float, w: Float, h: Float, color: Int, a: Float = 1f) {
                  bp.color = withA(color, a)
                  c.drawRect(x.toInt() * u, y.toInt() * u, (x.toInt() + w) * u, (y.toInt() + h) * u, bp)
              }

              private fun rr(c: Canvas, x: Float, y: Float, w: Float, h: Float, css: String, a: Float = 1f) = rr(c, x, y, w, h, col(css), a)

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  val sq = dp(8)
                  var yy = 0
                  while (yy * sq < h) {
                      var xx = 0
                      while (xx * sq < w) {
                          bp.color = if ((xx + yy) % 2 == 0) biome.h1 else biome.h2
                          c.drawRect(xx * sq, yy * sq, (xx + 1) * sq, (yy + 1) * sq, bp)
                          xx++
                      }
                      yy++
                  }
                  bp.color = biome.st; c.drawRect(0f, 0f, w, dp(5), bp)
                  // critters (ported from Foxle header canvas)
                  for ((i, p) in hps.withIndex()) {
                      when (biome.id) {
                          "overworld" -> {
                              if (i < 3) { val x = ((p.x + t * 4 * p.v) % (hw + 24)) - 12; val y = 4f + i * 5; rr(c, x, y, 10f, 2f, "#fff", .3f); rr(c, x + 2, y - 1, 6f, 1f, "#fff", .3f) }
                              else if (i < 6) {
                                  val x = (p.x + t * 6 * p.v) % hw; val y = hh * .5f + sin(t * 2 + p.p) * hh * .3f
                                  val f = if (sin(t * 14 + p.p) > 0) 2f else 1f
                                  rr(c, x - f, y, f, 1f, "#ffd36a"); rr(c, x + 1, y, f, 1f, "#ffd36a"); rr(c, x, y, 1f, 2f, "#3a2a10")
                              } else {
                                  val hgt = 2f + i % 3; val sw = if (sin(t * 2 + p.p) > 0) 1f else 0f
                                  rr(c, p.x + sw, 2f, 1f, hgt, biome.st, .85f); rr(c, p.x, 2f, 1f, hgt - 1, biome.st, .85f)
                              }
                          }
                          "lushcave" -> {
                              if (i < 5) {
                                  val l = 4 + (i * 3) % 8
                                  for (y in 0 until l) rr(c, p.x + sin(t + p.p + y * .35f), 2f + y, 1f, 1f, "#4aa04a")
                                  rr(c, p.x - 1, 2f + l, 2f, 2f, biome.st)
                              } else {
                                  val a = .35f + .65f * abs(sin(t * 1.3f + p.p))
                                  rr(c, p.x + sin(t * .5f + p.p) * 4, p.y + sin(t * .7f + p.p) * 3, 2f, 2f, biome.go, a)
                              }
                          }
                          "netherworld" -> {
                              if (i == 0) rr(c, 0f, hh - 3f, hw.toFloat(), 3f, "#ff5a1a", .18f + .1f * sin(t * 2))
                              if (i < 9) {
                                  val y = hh - ((t * 6 * p.v + p.p * 3) % (hh + 4))
                                  rr(c, p.x, y, 2f, 2f, "#ff7a2a", .75f); rr(c, p.x, y, 1f, 1f, "#ffd36a")
                              } else rr(c, p.x + sin(t + p.p) * 3, hh - ((t * 10 * p.v + p.p * 5) % hh), 1f, 1f, "#ffb02e", .85f)
                          }
                          else -> {
                              if (i < 18) rr(c, p.x, p.y, 1f, 1f, if (i % 3 != 0) "#fff" else "#c86bff", .3f + .7f * abs(sin(t * 1.5f + p.p)))
                              else {
                                  val q = (t * .25f + p.p) % 1f
                                  val a = if (q < .15f) sin(q / .15f * Math.PI.toFloat()) else 0f
                                  rr(c, p.x, p.y, 2f, 1f, "#e040ff", a); rr(c, p.x + 4, p.y, 2f, 1f, "#e040ff", a)
                              }
                              if (i == 0) {
                                  val s = (t % 9f) / .8f
                                  if (s < 1f) for (k in 0 until 6) rr(c, s * hw * 1.1f - k * 2, s * hh * .8f + k * .6f, 1f, 1f, "#fff", 1f - k / 6f)
                              }
                          }
                      }
                  }
                  for (b in bursts) rr(c, b.x, b.y, 2f, 2f, biome.go, max(0f, b.l))
                  // brand
                  val fy = dp(9) - hop.x * dp(10)
                  c.save(); c.rotate(sin(t * 2.1f) * 4f, dp(24), fy + dp(14))
                  Icons.draw(c, "fox", dp(10), fy, dp(30))
                  c.restore()
                  shText(c, title, dp(48), dp(36), tt, dp(3), 0x66000000)
                  val pulse = 1f + .06f * sin(t * 5.2f)
                  c.save(); c.rotate(-12f, dp(104), dp(20)); c.scale(pulse, pulse, dp(104), dp(20))
                  shText(c, splash, dp(104), dp(20), sp, dp(2), col("#3f3a10"))
                  c.restore()
                  bp.color = Color.BLACK; c.drawRect(0f, h - dp(4), w, h, bp)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (e.actionMasked == MotionEvent.ACTION_DOWN) return true
                  if (e.actionMasked == MotionEvent.ACTION_UP) {
                      val x = e.x / u; val y = e.y / u
                      for (i in 0 until 16) bursts.add(B(x, y, (rnd.nextFloat() - .5f) * 2f, -.2f - rnd.nextFloat() * 1.2f, 1f))
                      hop.kick(9f); hop.t = 0f
                      onFoxTap?.invoke()
                      wake()
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ bevel button
          class PixelButton(ctx: Context, var text: String = "", var icon: String? = null) : AView(ctx) {
              enum class Kind { NORMAL, GREEN, RED }
              var kind = Kind.NORMAL
                  set(v) { field = v; invalidate() }
              var on = false
                  set(v) { field = v; invalidate() }
              var onTap: (() -> Unit)? = null
              var onLong: (() -> Unit)? = null
              var sizeSp = 15f
              private val sc = Spring(1f, 520f, 26f)
              private val tp = tpaint(Fonts.vt, 15f, Color.WHITE, Paint.Align.LEFT)
              private var pressed = false
              private var longFired = false
              private val longRun = Runnable { if (pressed) { longFired = true; Hap.click(); onLong?.invoke() } }

              fun label(t: String) { text = t; invalidate() }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(resolveSize(dp(72).toInt(), w), resolveSize(dp(38).toInt(), h)) }

              override fun step(dt: Float): Boolean { sc.step(dt); return !sc.settled }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  c.save(); c.scale(sc.x, sc.x, w / 2, h / 2)
                  val (base, hi, lo) = when {
                      on -> Triple(col("#7a6a1a"), col("#fcdb5a"), col("#4a3f0a"))
                      kind == Kind.GREEN -> Triple(col("#2b6b12"), col("#5fb02f"), col("#1a4a08"))
                      kind == Kind.RED -> Triple(col("#6e2a2a"), col("#a85a5a"), col("#3a1010"))
                      else -> Triple(col("#3c3c3c"), col("#8b8b8b"), col("#333333"))
                  }
                  Bevel.draw(c, 0f, 0f, w, h, base, hi, lo)
                  tp.textSize = dp(sizeSp)
                  tp.alpha = if (isEnabled) 255 else 110
                  val isz = min(h - dp(14), dp(22))
                  val tw = if (text.isEmpty()) 0f else tp.measureText(text)
                  val ic = icon
                  val gap = if (ic != null && text.isNotEmpty()) dp(5) else 0f
                  val total = (if (ic != null) isz else 0f) + gap + tw
                  var x = (w - total) / 2
                  if (ic != null) { Icons.draw(c, ic, x, (h - isz) / 2, isz, if (isEnabled) 1f else .4f); x += isz + gap }
                  if (text.isNotEmpty()) shText(c, text, x, h / 2 + tp.textSize * .32f, tp, dp(1.5f))
                  c.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!isEnabled) return false
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { pressed = true; longFired = false; sc.t = .92f; wake(); if (onLong != null) postDelayed(longRun, 420); parent?.requestDisallowInterceptTouchEvent(true) }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          val inside = e.x in 0f..width.toFloat() && e.y in 0f..height.toFloat()
                          if (pressed && inside && !longFired) { Sfx.tick(); Hap.tick(); onTap?.invoke() }
                          pressed = false; sc.t = 1f; sc.kick(2f); wake()
                      }
                      MotionEvent.ACTION_CANCEL -> { removeCallbacks(longRun); pressed = false; sc.t = 1f; wake() }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ granular pixel slider
          class PixelSlider(ctx: Context, var label: String, var icon: String, var steps: Int, var fmt: (Float) -> String) : AView(ctx) {
              fun bind(l: String, ic: String, st: Int, f: (Float) -> String) { label = l; icon = ic; steps = st; fmt = f; lastIdx = -1; invalidate() }
              var value = 0.5f
                  private set
              var onChange: ((Float) -> Unit)? = null
              var onFine: (() -> Unit)? = null
              var armed = true
              private val thumb = Spring(.5f, 380f, 24f)
              private val grow = Spring(1f, 500f, 24f)
              private val lp = tpaint(Fonts.vt, 17f)
              private val vp = tpaint(Fonts.vt, 18f, col("#fcdb5a"), Paint.Align.RIGHT)
              private val fp = tpaint(Fonts.px, 11f, col("#7cff3a"), Paint.Align.CENTER)
              private val bp = Paint()
              private var fine = 1f
              private var lastX = 0f
              private var y0 = 0f
              private var drag = false
              private var lastIdx = -1
              var accent = col("#fcdb5a")
              var fineUsed = false

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(resolveSize(dp(200).toInt(), w), dp(46).toInt()) }

              fun set(v: Float, animate: Boolean = true) {
                  value = v.coerceIn(0f, 1f)
                  thumb.t = value
                  if (!animate) thumb.snap(value)
                  wake()
              }

              override fun step(dt: Float): Boolean { thumb.step(dt); grow.step(dt); return !(thumb.settled && grow.settled) }

              private fun tl() = dp(14)
              private fun tr() = width - dp(14)

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val a = if (armed) 1f else .45f
                  Icons.draw(c, icon, dp(4), dp(1), dp(19), a)
                  lp.alpha = (255 * a).toInt()
                  shText(c, label, dp(27), dp(15), lp, dp(1.5f))
                  shText(c, fmt(value), w - dp(6), dp(15), vp, dp(1.5f))
                  val ty = dp(23); val th = dp(14)
                  bp.color = col("#444444"); c.drawRect(tl() - dp(5), ty - dp(2), tr() + dp(5), ty + th + dp(2), bp)
                  bp.color = Color.BLACK; c.drawRect(tl() - dp(3), ty, tr() + dp(3), ty + th, bp)
                  bp.color = col("#1a1a1a"); c.drawRect(tl(), ty + dp(3), tr(), ty + th - dp(3), bp)
                  val fx = tl() + (tr() - tl()) * thumb.x.coerceIn(0f, 1f)
                  var x = tl()
                  while (x < fx) {
                      bp.color = withA(accent, a); c.drawRect(x, ty + dp(3), min(x + dp(8), fx), ty + th - dp(3), bp)
                      bp.color = withA(mix(accent, Color.BLACK, .45f), a); c.drawRect(min(x + dp(8), fx), ty + dp(3), min(x + dp(10), fx), ty + th - dp(3), bp)
                      x += dp(10)
                  }
                  if (steps in 2..60) {
                      bp.color = withA(Color.WHITE, .35f * a)
                      for (i in 0..steps) {
                          val px = tl() + (tr() - tl()) * i / steps
                          val big = steps <= 12 || i % 3 == 0
                          c.drawRect(px - dp(.5f), ty + th + dp(2), px + dp(.5f), ty + th + dp(if (big) 6 else 4), bp)
                      }
                  }
                  val s = grow.x
                  val cx = fx; val cy = ty + th / 2
                  c.save(); c.scale(s, s, cx, cy)
                  Bevel.draw(c, cx - dp(7), cy - dp(13), cx + dp(7), cy + dp(13), col("#c6c6c6"), Color.WHITE, col("#6a6a6a"), if (drag) accent else Color.BLACK, dp(2), dp(2))
                  bp.color = col("#6a6a6a"); c.drawRect(cx - dp(1), cy - dp(6), cx + dp(1), cy + dp(6), bp)
                  c.restore()
                  if (drag && fine < .99f) shText(c, "FINE x" + (if (fine >= .1f) String.format("%.2f", fine) else "0.08"), w / 2, ty + th + dp(10), fp, dp(1.5f))
              }

              private fun setFrom(v: Float, user: Boolean) {
                  var nv = v.coerceIn(0f, 1f)
                  if (steps > 0 && fine > .99f) nv = (nv * steps).roundToInt() / steps.toFloat()
                  value = nv
                  thumb.t = nv
                  if (steps > 0) {
                      val idx = (nv * steps).roundToInt()
                      if (idx != lastIdx) { lastIdx = idx; if (user) { Hap.tick(); Sfx.detent() } }
                  }
                  wake()
                  if (user) onChange?.invoke(nv)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          parent?.requestDisallowInterceptTouchEvent(true)
                          drag = true; grow.t = 1.18f; fine = 1f; lastX = e.x; y0 = e.y
                          val tx = tl() + (tr() - tl()) * value
                          if (abs(e.x - tx) > dp(22)) setFrom((e.x - tl()) / (tr() - tl()), true)
                          wake()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dy = abs(e.y - y0)
                          val nf = when { dy < dp(36) -> 1f; dy < dp(80) -> .5f; dy < dp(130) -> .2f; else -> .08f }
                          if (nf < 1f && !fineUsed) { fineUsed = true; onFine?.invoke() }
                          if (nf != fine) { fine = nf; Hap.tick() }
                          setFrom(value + (e.x - lastX) / (tr() - tl()) * fine, true)
                          lastX = e.x
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { drag = false; grow.t = 1f; fine = 1f; wake() }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ hotbar (modes)
          class Hotbar(ctx: Context, private val labels: List<String>, private val icons: List<String>, private val numOffset: Int = 0, private val align: Int = 0) : AView(ctx) {
              var selected = -1
                  set(v) { field = v; for (i in lift.indices) lift[i].t = if (i == v) 1f else 0f; wake() }
              var onSelect: ((Int) -> Unit)? = null
              private val lift = List(labels.size) { Spring(0f, 420f, 17f) }
              private val press = List(labels.size) { Spring(1f, 520f, 26f) }
              private val lp = tpaint(Fonts.vt, 13f, Color.WHITE, Paint.Align.CENTER)
              private val np = tpaint(Fonts.vt, 13f, Color.WHITE, Paint.Align.RIGHT)
              private val bp = Paint()
              private var down = -1

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(resolveSize(dp(240).toInt(), w), dp(70).toInt()) }

              override fun step(dt: Float): Boolean {
                  var act = false
                  for (s in lift) { s.step(dt); if (!s.settled) act = true }
                  for (s in press) { s.step(dt); if (!s.settled) act = true }
                  return act
              }

              private fun slotW(): Float = min(dp(64), (width - dp(4) * (labels.size - 1)) / labels.size)
              private fun left(): Float {
                  val tot = slotW() * labels.size + dp(4) * (labels.size - 1)
                  return when (align) { 1 -> width - tot - dp(2); 2 -> dp(2); else -> (width - tot) / 2 }
              }

              override fun onDraw(c: Canvas) {
                  val sw = slotW(); val gap = dp(4); val x0 = left()
                  for (i in labels.indices) {
                      val x = x0 + i * (sw + gap); val l = lift[i].x
                      val y = dp(12) - l * dp(8) + (1f - l) * 0f
                      val s = (1f + .12f * l) * press[i].x
                      c.save(); c.scale(s, s, x + sw / 2, y + sw / 2)
                      if (l > .5f) { bp.color = Color.WHITE; c.drawRect(x - dp(3), y - dp(3), x + sw + dp(3), y + sw + dp(3), bp) }
                      Bevel.draw(c, x, y, x + sw, y + sw, col("#3c3c3c"), col("#8b8b8b"), col("#333333"), col("#1a1a1a"))
                      val bob = if (i == selected) sin(System.nanoTime() / 1e9f * 10f) * dp(1.5f) else 0f
                      Icons.draw(c, icons[i], x + sw * .17f, y + sw * .1f + bob, sw * .66f)
                      shText(c, labels[i], x + sw / 2, y + sw - dp(4), lp, dp(1.5f))
                      shText(c, (i + 1 + numOffset).toString(), x + sw - dp(5), y + dp(14), np, dp(1.5f))
                      c.restore()
                  }
                  if (lift.any { it.x > .5f }) postInvalidateOnAnimation()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val sw = slotW(); val gap = dp(4); val x0 = left()
                  val i = ((e.x - x0) / (sw + gap)).toInt()
                  val idx = if (e.x >= x0 && i in labels.indices && e.y > dp(4)) i else -1
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { down = idx; if (idx >= 0) { press[idx].t = .88f; wake() }; return true }
                      MotionEvent.ACTION_UP -> {
                          if (down >= 0) { press[down].t = 1f; press[down].kick(2f) }
                          if (idx >= 0 && idx == down && idx != selected) { selected = idx; Hap.click(); Sfx.coin(); onSelect?.invoke(idx) }
                          down = -1; wake()
                      }
                      MotionEvent.ACTION_CANCEL -> { if (down >= 0) press[down].t = 1f; down = -1; wake() }
                  }
                  return true
              }
          }

          // ------------------------------------------------------------------ stepped bar (xp / progress)
          class StepBar(ctx: Context) : AView(ctx) {
              var color = col("#7cff3a")
              private val sp = Spring(0f, 120f, 18f)
              private val bp = Paint()
              fun set(f: Float, animate: Boolean = true) { sp.t = f.coerceIn(0f, 1f); if (!animate) sp.snap(sp.t); wake() }
              override fun step(dt: Float): Boolean { sp.step(dt); return !sp.settled }
              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(resolveSize(dp(120).toInt(), w), dp(14).toInt()) }
              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  bp.color = col("#444444"); c.drawRect(0f, 0f, w, h, bp)
                  bp.color = Color.BLACK; c.drawRect(dp(2), dp(2), w - dp(2), h - dp(2), bp)
                  bp.color = col("#1a1a1a"); c.drawRect(dp(4), dp(4), w - dp(4), h - dp(4), bp)
                  val fx = dp(4) + (w - dp(8)) * sp.x.coerceIn(0f, 1f)
                  var x = dp(4)
                  while (x < fx) {
                      bp.color = color; c.drawRect(x, dp(4), min(x + dp(8), fx), h - dp(4), bp)
                      bp.color = mix(color, Color.BLACK, .45f); c.drawRect(min(x + dp(8), fx), dp(4), min(x + dp(10), fx), h - dp(4), bp)
                      x += dp(10)
                  }
              }
          }

          // ------------------------------------------------------------------ preview overlay
          class PreviewOverlay(ctx: Context) : AView(ctx) {
              var grid = false
              var level = true
              var showHist = true
              var roll = 0f
              var hist = FloatArray(48)
              var zoomText = ""
              var readText = ""
              var recSeconds = -1
              var crack = 0f
              var accent = col("#fcdb5a")
              var onTapAt: ((Float, Float) -> Unit)? = null
              var onPinch: ((Float) -> Unit)? = null
              var onFlashDone: (() -> Unit)? = null
              private val bp = Paint()
              private val lp = Paint().apply { strokeWidth = dp(1.5f); style = Paint.Style.STROKE }
              private val tp = tpaint(Fonts.vt, 18f)
              private val flash = Spring(0f, 60f, 12f)
              private val ret = Spring(1.6f, 340f, 20f)
              private var retX = -1f
              private var retY = -1f
              private var retLife = 0f
              private var zoomLife = 0f
              private var t = 0f
              private val crackPts = ArrayList<FloatArray>()
              private val rnd = java.util.Random(3)

              private val sg = ScaleGestureDetector(ctx, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(d: ScaleGestureDetector): Boolean { onPinch?.invoke(d.scaleFactor); return true }
              })
              private val gd = GestureDetector(ctx, object : GestureDetector.SimpleOnGestureListener() {
                  override fun onDown(e: MotionEvent): Boolean = true
                  override fun onSingleTapUp(e: MotionEvent): Boolean {
                      retX = e.x; retY = e.y; ret.snap(2.2f); ret.t = 1f; retLife = 1.3f
                      Hap.tick(); onTapAt?.invoke(e.x / width, e.y / height); wake(); return true
                  }
              })

              fun doFlash() { flash.snap(.85f); flash.t = 0f; wake() }
              fun showZoom() { zoomLife = 1.4f; wake() }
              fun focusOk() { retLife = 1.0f }

              override fun step(dt: Float): Boolean {
                  t += dt
                  flash.step(dt); ret.step(dt)
                  if (retLife > 0f) retLife -= dt
                  if (zoomLife > 0f) zoomLife -= dt
                  return true
              }

              private var acc = 0f
              override fun tick(dt: Float) {
                  step(dt); acc += dt
                  val busy = retLife > 0f || zoomLife > 0f || !flash.settled || recSeconds >= 0 || crack > 0f
                  if (busy || acc > .2f) { acc = 0f; invalidate() }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean { sg.onTouchEvent(e); if (!sg.isInProgress) gd.onTouchEvent(e); return true }

              init { wake() }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (grid) {
                      lp.color = withA(Color.WHITE, .32f)
                      for (i in 1..2) { c.drawLine(w * i / 3, 0f, w * i / 3, h, lp); c.drawLine(0f, h * i / 3, w, h * i / 3, lp) }
                  }
                  if (level) {
                      val ok = abs(roll) < 1.2f
                      lp.color = if (ok) col("#7cff3a") else withA(Color.WHITE, .8f); lp.strokeWidth = dp(2)
                      c.save(); c.rotate(-roll, w / 2, h / 2)
                      c.drawLine(w / 2 - dp(54), h / 2, w / 2 - dp(18), h / 2, lp); c.drawLine(w / 2 + dp(18), h / 2, w / 2 + dp(54), h / 2, lp)
                      c.restore()
                      lp.strokeWidth = dp(1.5f)
                  }
                  if (retLife > 0f) {
                      val s = dp(34) * ret.x; val a = min(1f, retLife * 2f)
                      bp.color = withA(accent, a); val q = dp(3); val L = s * .5f
                      for (sx in intArrayOf(-1, 1)) for (sy in intArrayOf(-1, 1)) {
                          val cx = retX + sx * s; val cy = retY + sy * s
                          c.drawRect(min(cx, cx - sx * L), cy - q / 2, max(cx, cx - sx * L), cy + q / 2, bp)
                          c.drawRect(cx - q / 2, min(cy, cy - sy * L), cx + q / 2, max(cy, cy - sy * L), bp)
                      }
                  }
                  if (showHist) {
                      val bw = dp(96); val bh = dp(40); val x0 = w - bw - dp(10); val y0 = dp(34)
                      bp.color = 0x99000000.toInt(); c.drawRect(x0 - dp(2), y0 - dp(2), x0 + bw + dp(2), y0 + bh + dp(2), bp)
                      val n = hist.size; val cw = bw / n
                      for (i in 0 until n) {
                          val v = hist[i].coerceIn(0f, 1f)
                          bp.color = if (i >= n - 2) col("#ff5a5a") else if (i < 2) col("#5a8aff") else withA(Color.WHITE, .85f)
                          c.drawRect(x0 + i * cw, y0 + bh * (1f - v), x0 + (i + 1) * cw - dp(.5f), y0 + bh, bp)
                      }
                  }
                  if (readText.isNotEmpty()) { tp.textAlign = Paint.Align.RIGHT; tp.textSize = dp(15); shText(c, readText, w - dp(10), dp(22), tp, dp(1.5f)) }
                  if (zoomLife > 0f && zoomText.isNotEmpty()) { tp.textAlign = Paint.Align.CENTER; shText(c, zoomText, w / 2, dp(40), tp.also { it.textSize = dp(26) }, dp(2)) }
                  if (recSeconds >= 0) {
                      if ((t * 2).toInt() % 2 == 0) { bp.color = col("#ff3a3a"); c.drawRect(dp(12), dp(14), dp(24), dp(26), bp) }
                      tp.textAlign = Paint.Align.LEFT; tp.textSize = dp(20)
                      shText(c, String.format("%02d:%02d", recSeconds / 60, recSeconds % 60), dp(32), dp(26), tp, dp(1.5f))
                  }
                  if (crack > 0f) {
                      if (crackPts.isEmpty()) {
                          var x = w / 2; var y = h / 2
                          for (i in 0 until 70) { x += (rnd.nextInt(3) - 1) * dp(6) * 1.4f; y += (rnd.nextInt(3) - 1) * dp(6) * 1.4f; crackPts.add(floatArrayOf(x, y)) }
                      }
                      val n = (crackPts.size * crack).toInt()
                      for (i in 0 until n) { val p = crackPts[i]; bp.color = 0x99000000.toInt(); c.drawRect(p[0], p[1], p[0] + dp(5), p[1] + dp(5), bp); bp.color = 0x55FFFFFF; c.drawRect(p[0], p[1], p[0] + dp(2), p[1] + dp(2), bp) }
                      bp.color = withA(Color.BLACK, .35f * crack); c.drawRect(0f, 0f, w, h, bp)
                  } else if (crackPts.isNotEmpty()) crackPts.clear()
                  if (flash.x > .01f) { bp.color = withA(Color.WHITE, flash.x); c.drawRect(0f, 0f, w, h, bp) }
              }
          }

          // ------------------------------------------------------------------ fx layer (toast / banner / achievement / floats / bursts / CRT)
          class FxLayer(ctx: Context) : AView(ctx) {
              var crt = true
                  set(v) { field = v; invalidate() }
              var previewRect: RectF? = null
              var topInset = dp(30)
              var achY = dp(170)
              private val bp = Paint()
              private val tt = tpaint(Fonts.vt, 21f, col("#fcdb5a"))
              private val tx = tpaint(Fonts.vt, 19f)
              private val big = tpaint(Fonts.px, 46f, Color.WHITE, Paint.Align.CENTER)
              private val sub = tpaint(Fonts.px, 17f, Color.WHITE, Paint.Align.CENTER)
              private val fp = tpaint(Fonts.px, 18f, col("#7cff3a"))
              private val rnd = java.util.Random(9)
              private var crtShader: BitmapShader? = null
              private val crtP = Paint()
              private val vigP = Paint()

              private class Toast(val title: String, val text: String, val icon: String, var life: Float, val y: Spring)
              private class Banner(val t: String, val s: String, val c: Int, var age: Float)
              private class Ach(val t: String, val s: String, var life: Float, val y: Spring)
              private class Fl(val s: String, val x: Float, val y: Float, var age: Float, val c: Int)
              private class Pt(var x: Float, var y: Float, var vx: Float, var vy: Float, var l: Float, val c: Int, val sz: Float)
              private var toast: Toast? = null
              private var banner: Banner? = null
              private var ach: Ach? = null
              private val floats = ArrayList<Fl>()
              private val pts = ArrayList<Pt>()

              init {
                  isClickable = false
                  val bm = Bitmap.createBitmap(1, 3, Bitmap.Config.ARGB_8888)
                  bm.setPixel(0, 0, 0); bm.setPixel(0, 1, 0); bm.setPixel(0, 2, 0x30000000)
                  crtShader = BitmapShader(bm, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                  val m = Matrix(); m.setScale(dp(1f), dp(1f)); crtShader!!.setLocalMatrix(m)
                  crtP.shader = crtShader; crtP.isFilterBitmap = false
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  vigP.shader = RadialGradient(w / 2f, h / 2f, max(w, h) * .75f, intArrayOf(0, 0xAA000000.toInt()), floatArrayOf(.55f, 1f), Shader.TileMode.CLAMP)
              }

              fun toast(title: String, text: String, icon: String = "star") {
                  val sp = Spring(-dp(80), 360f, 17f); sp.t = topInset
                  toast = Toast(title, text, icon, 2.4f, sp); wake()
              }
              fun banner(t: String, s: String, c: Int) { banner = Banner(t, s, c, 0f); wake() }
              fun ach(t: String, s: String) { val sp = Spring(height + dp(80), 360f, 18f); sp.t = height - achY; ach = Ach(t, s, 3f, sp); wake() }
              fun floatText(s: String, x: Float, y: Float, c: Int) { floats.add(Fl(s, x, y, 0f, c)); wake() }
              fun burst(x: Float, y: Float, c: Int, n: Int = 14) {
                  for (i in 0 until n) pts.add(Pt(x, y, (rnd.nextFloat() - .5f) * dp(420), -rnd.nextFloat() * dp(380) - dp(80), 1f, c, dp(3 + rnd.nextInt(4))))
                  wake()
              }

              override fun step(dt: Float): Boolean {
                  toast?.let { it.y.step(dt); it.life -= dt; if (it.life < 0f && it.y.t != -dp(80)) it.y.t = -dp(80); if (it.life < -.6f) toast = null }
                  banner?.let { it.age += dt; if (it.age > 1.7f) banner = null }
                  ach?.let { it.y.step(dt); it.life -= dt; if (it.life < 0f && it.y.t != height + dp(80)) it.y.t = height + dp(80); if (it.life < -.7f) ach = null }
                  floats.forEach { it.age += dt }; floats.removeAll { it.age > 1.1f }
                  for (p in pts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += dp(900) * dt; p.l -= dt * 1.1f }
                  pts.removeAll { it.l <= 0f }
                  return toast != null || banner != null || ach != null || floats.isNotEmpty() || pts.isNotEmpty()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean = false

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (crt) {
                      c.save()
                      previewRect?.let { c.clipOutRect(it) }
                      c.drawRect(0f, 0f, w, h, crtP)
                      c.drawRect(0f, 0f, w, h, vigP)
                      c.restore()
                  }
                  for (p in pts) { bp.color = withA(p.c, p.l); c.drawRect(p.x, p.y, p.x + p.sz, p.y + p.sz, bp) }
                  for (f in floats) {
                      val a = 1f - f.age / 1.1f
                      fp.color = withA(f.c, a)
