          package com.micampro

          import android.media.Image
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.stream.IntStream
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          /** RAW16 frame in native (direct) memory so a burst doesn't eat the Java heap. */
          class RawFrame(val w: Int, val h: Int, val buf: ByteBuffer) {
              var ts: Long = 0
              fun at(i: Int): Int = buf.getShort(i * 2).toInt() and 0xFFFF

              companion object {
                  fun from(img: Image): RawFrame {
                      val w = img.width
                      val h = img.height
                      val p = img.planes[0]
                      val rs = p.rowStride
                      val src = p.buffer.duplicate()
                      val out = ByteBuffer.allocateDirect(w * h * 2).order(ByteOrder.LITTLE_ENDIAN)
                      for (r in 0 until h) {
                          src.limit(min(src.capacity(), r * rs + w * 2))
                          src.position(r * rs)
                          out.put(src)
                      }
                      out.rewind()
                      val f = RawFrame(w, h, out)
                      f.ts = img.timestamp
                      return f
                  }
              }
          }

          /**
           * HDR+ merge stage on the Bayer mosaic:
           * tile alignment (integer, even shifts so the CFA phase is preserved) on sqrt-luma,
           * then per-4x4-block robust temporal averaging using the sensor noise model (SENSOR_NOISE_PROFILE).
           * Output is a RAW16 buffer you can hand to DngCreator.writeByteBuffer().
           */
          object RawStack {
              private fun lum(f: RawFrame, black: Float, white: Int): ByteArray {
                  val w = f.w; val h = f.h; val hw = w / 2; val hh = h / 2
                  val out = ByteArray(hw * hh)
                  val rng = max(1f, white - black)
                  IntStream.range(0, hh).parallel().forEach { y ->
                      for (x in 0 until hw) {
                          val i = (2 * y) * w + 2 * x
                          val s = (f.at(i) + f.at(i + 1) + f.at(i + w) + f.at(i + w + 1)) / 4f
                          val v = ((s - black) / rng).coerceIn(0f, 1f)
                          out[y * hw + x] = (sqrt(v) * 255f).toInt().toByte()
                      }
                  }
                  return out
              }

              private fun sharp(y: ByteArray, w: Int, h: Int): Long {
                  var s = 0L
                  var r = 0
                  while (r < h) {
                      var c = 0
                      while (c < w - 1) { s += abs((y[r * w + c].toInt() and 0xFF) - (y[r * w + c + 1].toInt() and 0xFF)); c += 2 }
                      r += 2
                  }
                  return s
              }

              /** noise: [S0,O0,S1,O1,S2,O2,S3,O3] in normalised units (var = S*x + O), or null for a generic phone model */
              fun merge(frames: List<RawFrame>, black: IntArray, white: Int, noise: FloatArray?, log: (String) -> Unit): ByteBuffer {
                  val w = frames[0].w; val h = frames[0].h; val hw = w / 2; val hh = h / 2
                  val bAvg = (black[0] + black[1] + black[2] + black[3]) / 4f
                  val lums = frames.map { lum(it, bAvg, white) }
                  var ri = 0
                  var best = -1L
                  for (i in frames.indices) { val s = sharp(lums[i], hw, hh); if (s > best) { best = s; ri = i } }
                  val ref = frames[ri]
                  val warps = arrayOfNulls<Warp>(frames.size)
                  for (i in frames.indices) {
                      if (i == ri) continue
                      log("RAW align ${i + 1}/${frames.size}…")
                      warps[i] = Align.estimate(lums[ri], lums[i], hw, hh, true, false)
                  }
                  val S = FloatArray(4) { noise?.get(it * 2) ?: .002f }
                  val O = FloatArray(4) { noise?.get(it * 2 + 1) ?: .000005f }
                  val rngs = FloatArray(4) { max(1f, (white - black[it]).toFloat()) }
                  val out = ByteBuffer.allocateDirect(w * h * 2).order(ByteOrder.LITTLE_ENDIAN)
                  val rd = ref.buf.duplicate().order(ByteOrder.LITTLE_ENDIAN)
                  rd.rewind(); out.put(rd); out.rewind()
                  log("RAW merge ${frames.size} frames…")
                  val bw = w / 4; val bh = h / 4
                  val nOthers = frames.size
                  IntStream.range(0, bh).parallel().forEach { by ->
                      val acc = FloatArray(16)
                      for (bx in 0 until bw) {
                          val x0 = bx * 4; val y0 = by * 4
                          java.util.Arrays.fill(acc, 0f)
                          var wsum = 0f
                          for (i in 0 until nOthers) {
                              val wp = warps[i] ?: continue
                              val tx = min(wp.tw - 1, ((x0 + 2) shr 1) / wp.tile)
                              val ty = min(wp.th - 1, ((y0 + 2) shr 1) / wp.tile)
                              val sx = 2 * wp.dx[ty * wp.tw + tx].roundToInt()
                              val sy = 2 * wp.dy[ty * wp.tw + tx].roundToInt()
                              if (x0 + sx < 0 || x0 + 3 + sx >= w || y0 + sy < 0 || y0 + 3 + sy >= h) continue
                              val f = frames[i]
                              var z = 0f
                              for (dy in 0 until 4) for (dx in 0 until 4) {
                                  val xi = x0 + dx; val yi = y0 + dy
                                  val ci = ((yi and 1) shl 1) or (xi and 1)
                                  val r = ref.at(yi * w + xi).toFloat()
                                  val c = f.at((yi + sy) * w + xi + sx).toFloat()
                                  val vr = max(0f, (r - black[ci]) / rngs[ci])
                                  val vc = max(0f, (c - black[ci]) / rngs[ci])
                                  val v = (S[ci] * (vr + vc) + 2f * O[ci]) * rngs[ci] * rngs[ci]
                                  val d = r - c
                                  z += d * d / max(v, 1e-3f)
                              }
                              val m = z / 16f
                              val wt = ((6f - m) / 4f).coerceIn(0f, 1f)
                              if (wt <= 0f) continue
                              wsum += wt
                              var k = 0
                              for (dy in 0 until 4) for (dx in 0 until 4) { acc[k++] += wt * f.at((y0 + dy + sy) * w + x0 + dx + sx) }
                          }
                          if (wsum > 0f) {
                              var k = 0
                              for (dy in 0 until 4) for (dx in 0 until 4) {
                                  val idx = (y0 + dy) * w + x0 + dx
                                  val v = (ref.at(idx) + acc[k++]) / (1f + wsum)
                                  out.putShort(idx * 2, v.roundToInt().coerceIn(0, 65535).toShort())
                              }
                          }
                      }
                  }
                  return out
              }
          }
