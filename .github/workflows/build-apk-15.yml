          package com.micampro

          import android.media.Image
          import java.util.stream.IntStream
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          object Px {
              fun bil(a: ByteArray, w: Int, h: Int, x: Float, y: Float): Float {
                  val xc = x.coerceIn(0f, (w - 1).toFloat())
                  val yc = y.coerceIn(0f, (h - 1).toFloat())
                  val x0 = xc.toInt(); val y0 = yc.toInt()
                  val x1 = min(x0 + 1, w - 1); val y1 = min(y0 + 1, h - 1)
                  val fx = xc - x0; val fy = yc - y0
                  val p00 = (a[y0 * w + x0].toInt() and 0xFF).toFloat()
                  val p10 = (a[y0 * w + x1].toInt() and 0xFF).toFloat()
                  val p01 = (a[y1 * w + x0].toInt() and 0xFF).toFloat()
                  val p11 = (a[y1 * w + x1].toInt() and 0xFF).toFloat()
                  return (p00 * (1 - fx) + p10 * fx) * (1 - fy) + (p01 * (1 - fx) + p11 * fx) * fy
              }

              fun c8(v: Float): Int = (v + 0.5f).toInt().coerceIn(0, 255)
          }

          /** One YUV420 frame (full-range BT.601), planes de-strided. */
          class Frame(val w: Int, val h: Int, val y: ByteArray, val cb: ByteArray, val cr: ByteArray) {
              var expNs: Long = 0
              var iso: Int = 100
              var ts: Long = 0
              val gain: Double get() = expNs.toDouble() * iso

              companion object {
                  fun from(img: Image): Frame {
                      val w = img.width
                      val h = img.height
                      val y = plane(img.planes[0], w, h)
                      val cb = plane(img.planes[1], w / 2, h / 2)
                      val cr = plane(img.planes[2], w / 2, h / 2)
                      return Frame(w, h, y, cb, cr)
                  }

                  private fun plane(p: Image.Plane, pw: Int, ph: Int): ByteArray {
                      val out = ByteArray(pw * ph)
                      val b = p.buffer
                      val rs = p.rowStride
                      val ps = p.pixelStride
                      if (ps == 1) {
                          for (r in 0 until ph) {
                              b.position(r * rs)
                              b.get(out, r * pw, pw)
                          }
                      } else {
                          for (r in 0 until ph) {
                              val base = r * rs
                              val o = r * pw
                              for (c in 0 until pw) out[o + c] = b.get(base + c * ps)
                          }
                      }
                      return out
                  }
              }
          }

          /** Per-tile translation field: cur(x+dx, y+dy) ~= ref(x, y). */
          class Warp(val tile: Int, val tw: Int, val th: Int, val dx: FloatArray, val dy: FloatArray) {
              val minDy: Float = dy.minOrNull() ?: 0f
              val maxDy: Float = dy.maxOrNull() ?: 0f

              fun eval(x: Float, y: Float, o: FloatArray) {
                  if (tw == 1 && th == 1) { o[0] = dx[0]; o[1] = dy[0]; return }
                  val fx = ((x - tile / 2f) / tile).coerceIn(0f, (tw - 1).toFloat())
                  val fy = ((y - tile / 2f) / tile).coerceIn(0f, (th - 1).toFloat())
                  val ix = fx.toInt(); val iy = fy.toInt()
                  val ax = fx - ix; val ay = fy - iy
                  val ix1 = min(ix + 1, tw - 1); val iy1 = min(iy + 1, th - 1)
                  val a = iy * tw + ix; val b = iy * tw + ix1
                  val c = iy1 * tw + ix; val d = iy1 * tw + ix1
                  o[0] = (dx[a] * (1 - ax) + dx[b] * ax) * (1 - ay) + (dx[c] * (1 - ax) + dx[d] * ax) * ay
                  o[1] = (dy[a] * (1 - ax) + dy[b] * ax) * (1 - ay) + (dy[c] * (1 - ax) + dy[d] * ax) * ay
              }
          }

          object Align {
              private fun down(src: ByteArray, w: Int, h: Int, f: Int): Triple<ByteArray, Int, Int> {
                  val dw = w / f
                  val dh = h / f
                  val out = ByteArray(dw * dh)
                  IntStream.range(0, dh).parallel().forEach { y ->
                      for (x in 0 until dw) {
                          var s = 0
                          for (j in 0 until f) {
                              val row = (y * f + j) * w + x * f
                              for (i in 0 until f) s += src[row + i].toInt() and 0xFF
                          }
                          out[y * dw + x] = (s / (f * f)).toByte()
                      }
                  }
                  return Triple(out, dw, dh)
              }

              private fun search(a: ByteArray, b: ByteArray, w: Int, h: Int, cx: Int, cy: Int, r: Int, step: Int): IntArray {
                  val m = max(abs(cx), abs(cy)) + r + 1
                  if (w <= 2 * m + 8 || h <= 2 * m + 8) return intArrayOf(cx, cy)
                  var best = Long.MAX_VALUE
                  var bx = cx
                  var by = cy
                  for (sy in cy - r..cy + r) {
                      for (sx in cx - r..cx + r) {
                          var s = 0L
                          var y = m
                          while (y < h - m) {
                              val ra = y * w
                              val rb = (y + sy) * w + sx
                              var x = m
                              while (x < w - m) {
                                  s += abs((a[ra + x].toInt() and 0xFF) - (b[rb + x].toInt() and 0xFF))
                                  x += step
                              }
                              y += step
                          }
                          if (s < best) { best = s; bx = sx; by = sy }
                      }
                  }
                  return intArrayOf(bx, by)
              }

              /** Coarse-to-fine global translation (full-res pixels). */
              fun global(ref: ByteArray, cur: ByteArray, w: Int, h: Int): IntArray {
                  val (r8, w8, h8) = down(ref, w, h, 8)
                  val (c8, _, _) = down(cur, w, h, 8)
                  val s8 = search(r8, c8, w8, h8, 0, 0, 12, 1)
                  val (r2, w2, h2) = down(ref, w, h, 2)
                  val (c2, _, _) = down(cur, w, h, 2)
                  val s2 = search(r2, c2, w2, h2, s8[0] * 4, s8[1] * 4, 4, 2)
                  return search(ref, cur, w, h, s2[0] * 2, s2[1] * 2, 2, 4)
              }

              private fun sad(ref: ByteArray, cur: ByteArray, w: Int, h: Int, x0: Int, y0: Int, t: Int, sx: Int, sy: Int, masked: Boolean): Float {
                  var s = 0
                  var n = 0
                  var y = y0
                  val ye = min(y0 + t, h)
                  val xe = min(x0 + t, w)
                  while (y < ye) {
                      val yy = y + sy
                      if (yy in 0 until h) {
                          var x = x0
                          while (x < xe) {
                              val xx = x + sx
                              if (xx in 0 until w) {
                                  val a = ref[y * w + x].toInt() and 0xFF
                                  val b = cur[yy * w + xx].toInt() and 0xFF
                                  if (!masked || (b != 0 && a in 12..243)) { s += abs(a - b); n++ }
                              }
                              x += 2
                          }
                      }
                      y += 2
                  }
                  return if (n < 16) 1e9f else s.toFloat() / n
              }

              private fun parab(m: Float, c: Float, p: Float): Float {
                  if (m > 1e8f || p > 1e8f) return 0f
                  val d = m - 2 * c + p
                  return if (d > 1e-3f) ((m - p) / (2 * d)).coerceIn(-0.5f, 0.5f) else 0f
              }

              private fun tileShifts(ref: ByteArray, cur: ByteArray, w: Int, h: Int, g: IntArray, masked: Boolean): Warp {
                  val t = 32
                  val tw = (w + t - 1) / t
                  val th = (h + t - 1) / t
                  val dx = FloatArray(tw * th)
                  val dy = FloatArray(tw * th)
                  IntStream.range(0, th).parallel().forEach { ty ->
                      for (tx in 0 until tw) {
                          val x0 = tx * t
                          val y0 = ty * t
                          var best = Float.MAX_VALUE
                          var worst = 0f
                          var bx = g[0]
                          var by = g[1]
                          for (sy in g[1] - 3..g[1] + 3) {
                              for (sx in g[0] - 3..g[0] + 3) {
                                  val s = sad(ref, cur, w, h, x0, y0, t, sx, sy, masked)
                                  if (s < best) { best = s; bx = sx; by = sy }
                                  if (s > worst && s < 1e8f) worst = s
                              }
                          }
                          var fx = bx.toFloat()
                          var fy = by.toFloat()
                          if (best > 1e8f || worst - best < 1.5f) {
                              fx = g[0].toFloat(); fy = g[1].toFloat()
                          } else {
                              val sl = sad(ref, cur, w, h, x0, y0, t, bx - 1, by, masked)
                              val sr = sad(ref, cur, w, h, x0, y0, t, bx + 1, by, masked)
                              val su = sad(ref, cur, w, h, x0, y0, t, bx, by - 1, masked)
                              val sd = sad(ref, cur, w, h, x0, y0, t, bx, by + 1, masked)
                              fx += parab(sl, best, sr)
                              fy += parab(su, best, sd)
                          }
                          dx[ty * tw + tx] = fx
                          dy[ty * tw + tx] = fy
                      }
                  }
                  return Warp(t, tw, th, dx, dy)
              }

              fun estimate(ref: ByteArray, cur: ByteArray, w: Int, h: Int, useTiles: Boolean, masked: Boolean = false): Warp {
                  val g = global(ref, cur, w, h)
                  return if (useTiles) tileShifts(ref, cur, w, h, g, masked)
                  else Warp(max(w, h), 1, 1, floatArrayOf(g[0].toFloat()), floatArrayOf(g[1].toFloat()))
              }
          }
