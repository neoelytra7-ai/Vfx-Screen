name: AI High-Performance GPU Pipeline (SD 8 Gen 1)
on:
  push: {branches: [main], tags: ['v*']}
  workflow_dispatch:
concurrency: {group: "ai-gpu-apk-${{github.ref}}", cancel-in-progress: true}
permissions: {contents: write}
env: {N: AiGpuPro}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      
      # Gunakan action resmi ini agar sdkmanager, android-sdk, ndk, & cmake siap dan terbaca path-nya
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake via SDKManager
        run: |
          echo "Setting up Android SDK / NDK for native GPU compute..."
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: src
        run: |
          cat > settings.gradle.kts <<'EOF_SRC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AiGpuPro"
          include(":app")
          EOF_SRC
          cat > build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_SRC
          cat > gradle.properties <<'EOF_SRC'
          org.gradle.jvmargs=-Xmx6g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_SRC
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "dev.aipro"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.aipro"; minSdk = 26; targetSdk = 35
                  versionCode = (findProperty("versionCode") as String?)?.toInt() ?: 1
                  versionName = findProperty("versionName") as String? ?: "dev"
                  
                  // Paksa arsitektur khusus Snapdragon 8 Gen 1 (ARMv9 64-bit murni)
                  ndk {
                      abiFilters.add("arm64-v8a")
                  }
                  externalNativeBuild {
                      cmake {
                          cppFlags("-O3 -flto -std=c++17")
                          arguments("-DANDROID_STL=c++_shared")
                      }
                  }
              }
              buildTypes { 
                  release { 
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt")) 
                  } 
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true; cmake = true }
              externalNativeBuild {
                  cmake {
                      path("src/main/cpp/CMakeLists.txt")
                      version("3.22.1")
                  }
              }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
          }
          EOF_SRC
          
          # Buat Native C++ Hook untuk Akselerasi GPU (Vulkan/OpenCL Interface)
          mkdir -p app/src/main/cpp
          cat > app/src/main/cpp/CMakeLists.txt <<'EOF_SRC'
          cmake_minimum_required(VERSION 3.22.1)
          project(aigpu_native)
          add_library(aigpu_native SHARED native-lib.cpp)
          find_library(log-lib log)
          find_library(gles-lib GLESv3)
          find_library(vulkan-lib vulkan)
          target_link_libraries(aigpu_native ${log-lib} ${gles-lib} ${vulkan-lib})
          EOF_SRC

          cat > app/src/main/cpp/native-lib.cpp <<'EOF_SRC'
          #include <jni.h>
          #include <android/log.h>
          #include <vulkan/vulkan.h>
          #define LOG_TAG "AiGpuNative"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          extern "C" JNIEXPORT jstring JNICALL
          Java_dev_aipro_MainActivity_initVulkanGpu(JNIEnv* env, jobject /*this*/) {
              uint32_t instanceVersion = 0;
              if (vkEnumerateInstanceVersion(&instanceVersion) == VK_SUCCESS) {
                  LOGI("Vulkan supported on Snapdragon 8 Gen 1! Version: %d", instanceVersion);
                  return env->NewStringUTF("Vulkan Compute Acceleration Active (Adreno 730)");
              }
              return env->NewStringUTF("Vulkan Fallback / CPU Mode");
          }
          EOF_SRC

          mkdir -p app/src/main/AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="AI GPU Pro" android:allowBackup="false" android:theme="@android:style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC

          mkdir -p app/src/main/kotlin/dev/aipro
          cat > app/src/main/kotlin/dev/aipro/MainActivity.kt <<'EOF_SRC'
          package dev.aipro

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              init {
                  System.loadLibrary("aigpu_native")
              }

              private external fun initVulkanGpu(): String

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val gpuStatus = try { initVulkanGpu() } catch (e: Exception) { "GPU Init Error: ${e.message}" }

                  setContent {
                      Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                          Column(
                              modifier = Modifier.fillMaxSize().padding(24.dp),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text("Snapdragon 8 Gen 1 (Adreno 730)", fontSize = 16.sp, color = MaterialTheme.colorScheme.secondary)
                              Spacer(modifier = Modifier.height(8.dp))
                              Text("Full GPU AI Engine", fontSize = 22.sp, style = MaterialTheme.typography.titleLarge)
                              Spacer(modifier = Modifier.height(24.dp))
                              Card(modifier = Modifier.fillMaxWidth().padding(8.dp)) {
                                  Box(modifier = Modifier.padding(16.dp), contentAlignment = Alignment.Center) {
                                      Text(gpuStatus, fontSize = 14.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF_SRC
      - uses: actions/cache@v4
        with: {path: ~/ks, key: "ks-${{github.repository}}"}
      - env:
          B: ${{secrets.KS_B64}}
          P: ${{secrets.KS_PASS || 'ci-dev-key'}}
          A: ${{secrets.KS_ALIAS || 'k'}}
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          V=0.$(date -u +%y%m%d).$GITHUB_RUN_NUMBER
          gradle -q :app:assembleRelease -PversionCode=$((1000+GITHUB_RUN_NUMBER)) -PversionName=$V
          mkdir -p ~/ks dist; K=~/ks/k.jks
          [ -n "$B" ] && echo "$B"|base64 -d >$K
          [ -f $K ] || keytool -genkeypair -keyalg RSA -keysize 3072 -validity 36500 -keystore $K -alias $A -storepass "$P" -keypass "$P" -dname CN=$N
          T=$(ls -d $ANDROID_HOME/build-tools/*|sort -V|tail -1)
          $T/zipalign -fp 4 app/build/outputs/apk/release/*.apk a.apk
          $T/apksigner sign --ks $K --ks-key-alias $A --ks-pass env:P --key-pass env:P --out dist/$N-$V.apk a.apk
          echo "V=$V" >>$GITHUB_ENV
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{github.token}}"}
        run: |
          R=nightly F=-p; [ $GITHUB_REF_TYPE = tag ] && R=$GITHUB_REF_NAME F=
          [ $R = nightly ] && gh release delete nightly --cleanup-tag -y || true
          gh release create $R dist/* -t "$N $V" -n "build $GITHUB_RUN_NUMBER" --target $GITHUB_SHA $F
