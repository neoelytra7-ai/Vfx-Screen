# SLIME - overlay slime hidup (soft-body) untuk Android 11, tanpa root.
# Taruh di: .github/workflows/build-slime.yml  -> Actions -> build-slime -> Run workflow
# Hasil: artifact "debug" (debug.zip) berisi app-debug.apk. Kalau gagal, lihat log step Build.
# Semua source masuk folder slime/ supaya tidak bentrok dengan app lain di repo.
# Revisi: tiap file = satu step bernama "FILE <nama>". Ganti isi step itu saja.
name: build-slime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slime.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: "FILE gradle config"
        shell: bash
        run: |
          mkdir -p slime
          cat > slime/settings.gradle <<'SLIME_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Slime'
          include ':app'
          SLIME_EOF
          mkdir -p slime
          cat > slime/build.gradle <<'SLIME_EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          SLIME_EOF
          mkdir -p slime
          cat > slime/gradle.properties <<'SLIME_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          SLIME_EOF
          mkdir -p slime/app
          cat > slime/app/build.gradle <<'SLIME_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'app.slime'
              compileSdk 34

              defaultConfig {
                  applicationId 'app.slime'
                  minSdk 30
                  targetSdk 30
                  versionCode 1
                  versionName '0.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          SLIME_EOF

      - name: "FILE manifest dan resource"
        shell: bash
        run: |
          mkdir -p slime/app/src/main
          cat > slime/app/src/main/AndroidManifest.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SlimeService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/slime_service" />
                  </service>
              </application>
          </manifest>
          SLIME_EOF
          mkdir -p slime/app/src/main/res/xml
          cat > slime/app/src/main/res/xml/slime_service.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled|typeWindowContentChanged|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="30"
              android:description="@string/svc_desc"
              android:settingsActivity="app.slime.MainActivity" />
          SLIME_EOF
          mkdir -p slime/app/src/main/res/values
          cat > slime/app/src/main/res/values/strings.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Slime</string>
              <string name="svc_desc">Overlay slime hidup. Hanya membaca posisi dan ukuran elemen layar (bounds), tidak membaca isi teks.</string>
          </resources>
          SLIME_EOF

      - name: "FILE Tuning.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/Tuning.kt <<'SLIME_EOF'
          package app.slime

          import android.content.SharedPreferences

          object Tuning {
              class P(
                  val group: String,
                  val key: String,
                  val def: Float,
                  val min: Float,
                  val max: Float,
                  val label: String,
                  val steps: List<String>? = null
              )

              val GROUPS = listOf("KARAKTER", "FISIKA JELLY", "SCROLL", "PERILAKU", "HIBURAN", "KEKUATAN", "EFEK & JEJAK", "SUARA")

              val ALL = listOf(
                  P("KARAKTER", "eyeStyle", 1f, 0f, 2f, "Gaya mata", listOf("Bulat putih", "Lonjong hitam", "Feline")),
                  P("KARAKTER", "iris", 48f, 0f, 360f, "Warna iris (feline)"),
                  P("KARAKTER", "hue", 130f, 0f, 360f, "Warna badan (hue)"),
                  P("KARAKTER", "radius", 34f, 18f, 70f, "Ukuran (dp)"),
                  P("KARAKTER", "eye", 1f, 0.6f, 1.6f, "Ukuran mata"),

                  P("FISIKA JELLY", "shape", 420f, 80f, 900f, "Kekakuan bentuk"),
                  P("FISIKA JELLY", "edge", 500f, 100f, 1200f, "Kekakuan tepi"),
                  P("FISIKA JELLY", "damp", 7f, 2f, 30f, "Redaman jelly"),
                  P("FISIKA JELLY", "pressure", 60f, 0f, 160f, "Tekanan volume"),
                  P("FISIKA JELLY", "gravity", 900f, 400f, 2000f, "Gravitasi (dp/s2)"),
                  P("FISIKA JELLY", "jump", 1f, 0.5f, 1.6f, "Kekuatan lompat"),

                  P("SCROLL", "scrollMode", 2f, 0f, 2f, "Reaksi scroll", listOf("Mati (abaikan scroll)", "Cuma kaget", "Ikut scroll")),
                  P("SCROLL", "stretch", 1f, 0f, 2f, "Stretch saat scroll"),
                  P("SCROLL", "scrollLag", 12f, 4f, 40f, "Kecepatan ikut scroll (tinggi = cepat)"),

                  P("PERILAKU", "wander", 3f, 0.8f, 10f, "Jeda antar aksi (detik)"),
                  P("HIBURAN", "show", 1f, 0f, 2f, "Frekuensi pertunjukan"),
                  P("HIBURAN", "talk", 1f, 0f, 2f, "Bubble bicara (0 = diam)"),
                  P("HIBURAN", "silly", 1f, 0f, 2f, "Tingkat absurd"),
                  P("PERILAKU", "lowBias", 1.5f, 0f, 2.5f, "Kecenderungan ke bawah"),
                  P("PERILAKU", "zoneTop", 45f, 0f, 90f, "Zona gerak: batas atas (% layar)"),
                  P("PERILAKU", "homeBias", 1.5f, 0f, 3f, "Betah di rumah (0 = bebas keliling)"),
                  P("PERILAKU", "topLimit", 6f, 0f, 25f, "Langit-langit fisik (%)"),
                  P("PERILAKU", "floor", 0f, 0f, 120f, "Margin lantai (dp)"),

                  P("KEKUATAN", "boxAuto", 0.5f, 0f, 2f, "Summon kotak otomatis"),
                  P("KEKUATAN", "boxW", 110f, 60f, 240f, "Lebar kotak (dp)"),
                  P("KEKUATAN", "boxLife", 14f, 4f, 40f, "Durasi kotak (detik)"),

                  P("EFEK & JEJAK", "fx", 1f, 0f, 2f, "Jumlah partikel"),
                  P("EFEK & JEJAK", "ground", 0.6f, 0f, 1.5f, "Grounding hijau (intensitas)"),
                  P("EFEK & JEJAK", "groundTime", 4f, 0.5f, 12f, "Lama jejak grounding (detik)"),

                  P("SUARA", "volume", 0.6f, 0f, 1f, "Volume"),
                  P("SUARA", "pitch", 1f, 0.6f, 1.6f, "Nada suara"),
                  P("SUARA", "stereo", 0.85f, 0f, 1f, "Lebar stereo (posisi suara)"),
                  P("SUARA", "dyn", 0.85f, 0f, 1f, "Dinamika volume (fisika)")
              )

              var eyeStyle = 1f
              var iris = 48f
              var hue = 130f
              var radius = 34f
              var eye = 1f
              var shape = 420f
              var edge = 500f
              var damp = 7f
              var pressure = 60f
              var gravity = 900f
              var jump = 1f
              var stretch = 1f
              var scrollLag = 12f
              var wander = 3f
              var silly = 1f
              var lowBias = 1.5f
              var zoneTop = 45f
              var scrollMode = 2f
              var show = 1f
              var talk = 1f
              var topLimit = 6f
              var floor = 0f
              var boxAuto = 0.5f
              var boxW = 110f
              var boxLife = 14f
              var fx = 1f
              var ground = 0.6f
              var groundTime = 4f
              var volume = 0.6f
              var pitch = 1f
              var stereo = 0.85f
              var dyn = 0.85f
              var homeBias = 1.5f
              var homeX = 85f

              val eyeStyleI: Int get() = (eyeStyle + 0.5f).toInt().coerceIn(0, 2)
              val scrollModeI: Int get() = (scrollMode + 0.5f).toInt().coerceIn(0, 2)

              fun load(sp: SharedPreferences) {
                  fun g(k: String): Float {
                      val p = ALL.first { it.key == k }
                      return sp.getFloat(k, p.def)
                  }
                  eyeStyle = g("eyeStyle")
                  iris = g("iris")
                  hue = g("hue")
                  radius = g("radius")
                  eye = g("eye")
                  shape = g("shape")
                  edge = g("edge")
                  damp = g("damp")
                  pressure = g("pressure")
                  gravity = g("gravity")
                  jump = g("jump")
                  stretch = g("stretch")
                  scrollLag = g("scrollLag")
                  wander = g("wander")
                  silly = g("silly")
                  lowBias = g("lowBias")
                  topLimit = g("topLimit")
                  zoneTop = g("zoneTop")
                  scrollMode = g("scrollMode")
                  show = g("show")
                  talk = g("talk")
                  floor = g("floor")
                  boxAuto = g("boxAuto")
                  boxW = g("boxW")
                  boxLife = g("boxLife")
                  fx = g("fx")
                  ground = g("ground")
                  groundTime = g("groundTime")
                  volume = g("volume")
                  pitch = g("pitch")
                  stereo = g("stereo")
                  dyn = g("dyn")
                  homeBias = g("homeBias")
                  homeX = sp.getFloat("homeX", 85f)
              }
          }
          SLIME_EOF

      - name: "FILE SlimePhysics.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimePhysics.kt <<'SLIME_EOF'
          package app.slime

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          class Plat(@JvmField var l: Float, @JvmField var t: Float, @JvmField var r: Float, @JvmField var b: Float)

          /** Soft-body slime: N titik di keliling, pegas tepi + shape matching + tekanan volume. */
          class SlimePhysics {
              companion object {
                  const val N = 18
              }

              val px = FloatArray(N)
              val py = FloatArray(N)
              val vx = FloatArray(N)
              val vy = FloatArray(N)
              private val oy = FloatArray(N)
              private val ax = FloatArray(N)
              private val ay = FloatArray(N)
              private val rx = FloatArray(N) { cos(2.0 * PI * it / N).toFloat() }
              private val ry = FloatArray(N) { sin(2.0 * PI * it / N).toFloat() }

              var W = 0f
              var H = 0f
              var density = 1f
              var radius = 60f
              var cx = 0f
              var cy = 0f
              var cvx = 0f
              var cvy = 0f
              var scaleX = 1f
              var scaleY = 1f
              var lean = 0f
              var pushX = 0f
              var pushY = 0f
              var floorY = 0f
              var ceilY = 0f
              var zoneY = 0f
              var contacts = 0
              var onPlat = false
              var impact = 0f
              var bonk = 0f
              var inited = false

              /** Selisih tampilan vs fisika (lag scroll). Meluruh halus; dipakai view untuk stretch. */
              var vox = 0f
              var voy = 0f

              var platforms: List<Plat> = emptyList()
              private var scanList: List<Plat> = emptyList()
              private var extra: List<Plat> = emptyList()
              private var stand: Plat? = null

              val grounded: Boolean get() = contacts >= 2

              fun reset(x: Float, y: Float) {
                  radius = Tuning.radius * density
                  for (i in 0 until N) {
                      px[i] = x + rx[i] * radius
                      py[i] = y + ry[i] * radius
                      vx[i] = 0f
                      vy[i] = 0f
                      oy[i] = py[i]
                  }
                  cx = x
                  cy = y
                  inited = true
              }

              fun launch(sx: Float, sy: Float) {
                  for (i in 0 until N) {
                      vx[i] = sx
                      vy[i] = sy * (1f - 0.12f * ry[i])
                  }
                  contacts = 0
                  onPlat = false
                  stand = null
              }

              fun kick(dvx: Float, dvy: Float) {
                  for (i in 0 until N) {
                      vx[i] += dvx
                      vy[i] += dvy
                  }
              }

              fun bottom(): Float {
                  var m = py[0]
                  for (i in 1 until N) if (py[i] > m) m = py[i]
                  return m
              }

              fun top(): Float {
                  var m = py[0]
                  for (i in 1 until N) if (py[i] < m) m = py[i]
                  return m
              }

              /** Elemen layar yang sedang diinjak (bukan kotak summon). */
              fun standing(): Plat? {
                  val s = stand
                  return if (s != null && onPlat && scanList.contains(s)) s else null
              }

              fun setExtra(e: List<Plat>) {
                  extra = e
                  platforms = scanList + extra
              }

              private fun shiftPoints(dx: Float, dy0: Float, soft: Float) {
                  var dy = dy0
                  if (dy < 0f) {
                      val room = max(0f, top() - ceilY - 1f)
                      if (-dy > room) dy = -room
                  }
                  for (i in 0 until N) {
                      val up = ((cy - py[i]) / radius).coerceIn(0f, 1f)
                      val f = 1f - soft * up
                      px[i] += dx * f
                      py[i] += dy * f
                      oy[i] += dy * f
                  }
                  vox += dx
                  voy += dy
              }

              /** Scan baru dari aksesibilitas: lacak platform yang sedang diinjak supaya ikut bergeser. */
              fun updatePlatforms(n: List<Plat>) {
                  val s = stand
                  if (Tuning.scrollModeI == 2 && s != null && onPlat && scanList.contains(s)) {
                      var best: Plat? = null
                      var bd = 1e9f
                      for (p in n) {
                          if (abs(p.l - s.l) > 6f * density) continue
                          if (abs(p.r - s.r) > 6f * density) continue
                          if (abs((p.b - p.t) - (s.b - s.t)) > 8f * density) continue
                          val dd = abs(p.t - s.t)
                          if (dd < bd) {
                              bd = dd
                              best = p
                          }
                      }
                      val b = best
                      if (b != null && bd > 1f && bd < 700f * density) {
                          shiftPoints(b.l - s.l, b.t - s.t, 0.25f)
                      }
                      stand = b
                  }
                  scanList = n
                  platforms = scanList + extra
              }

              /** Event scroll dengan delta: geser platform di area yang di-scroll, slime ikut kalau berdiri di situ. */
              fun shiftRegion(l: Float, t: Float, r: Float, b: Float, dx: Float, dy: Float) {
                  for (pl in scanList) {
                      val mx = (pl.l + pl.r) * 0.5f
                      val my = (pl.t + pl.b) * 0.5f
                      if (mx >= l && mx <= r && my >= t && my <= b) {
                          pl.l += dx
                          pl.r += dx
                          pl.t += dy
                          pl.b += dy
                      }
                  }
                  if (onPlat && cx >= l && cx <= r && cy >= t && cy <= b) {
                      shiftPoints(dx, dy, 0.4f)
                  }
              }

              fun step(frameDt: Float) {
                  if (!inited) return
                  val k = exp(-Tuning.scrollLag * frameDt)
                  val lim = 3f * radius
                  vox = (vox * k).coerceIn(-lim, lim)
                  voy = (voy * k).coerceIn(-lim, lim)
                  val dt = frameDt * 0.5f
                  sub(dt)
                  sub(dt)
              }

              private fun sub(dt: Float) {
                  val d = density
                  radius += (Tuning.radius * d - radius) * min(1f, dt * 6f)
                  val R = radius
                  floorY = H - Tuning.floor * d
                  ceilY = H * Tuning.topLimit * 0.01f
                  zoneY = H * Tuning.zoneTop * 0.01f
                  val g = Tuning.gravity * d

                  var sx = 0f
                  var sy = 0f
                  var svx = 0f
                  var svy = 0f
                  for (i in 0 until N) {
                      sx += px[i]
                      sy += py[i]
                      svx += vx[i]
                      svy += vy[i]
                  }
                  cx = sx / N
                  cy = sy / N
                  cvx = svx / N
                  cvy = svy / N

                  var a2 = 0f
                  for (i in 0 until N) {
                      val j = (i + 1) % N
                      a2 += px[i] * py[j] - px[j] * py[i]
                  }
                  val twoPi = (2.0 * PI).toFloat()
                  val restA = 0.5f * N * R * R * sin(twoPi / N)
                  val rel = ((restA - abs(a2) * 0.5f) / restA).coerceIn(-0.6f, 1.2f)
                  val kS = Tuning.shape
                  val kE = Tuning.edge
                  val c = Tuning.damp
                  val pf = Tuning.pressure * rel * R
                  val L = 2f * R * sin(PI.toFloat() / N)

                  for (i in 0 until N) {
                      ax[i] = 0f
                      ay[i] = 0f
                  }
                  for (i in 0 until N) {
                      val j = (i + 1) % N
                      val dx = px[j] - px[i]
                      val dy = py[j] - py[i]
                      val dl = sqrt(dx * dx + dy * dy) + 0.001f
                      val f = (dl - L) * kE / dl
                      ax[i] += f * dx
                      ay[i] += f * dy
                      ax[j] -= f * dx
                      ay[j] -= f * dy
                  }
                  for (i in 0 until N) {
                      val tx = cx + (rx[i] * scaleX - lean * ry[i]) * R
                      val ty = cy + ry[i] * R * scaleY
                      val ex = px[i] - cx
                      val ey = py[i] - cy
                      val el = sqrt(ex * ex + ey * ey) + 0.001f
                      ax[i] += (tx - px[i]) * kS + ex / el * pf - (vx[i] - cvx) * c + pushX
                      ay[i] += (ty - py[i]) * kS + ey / el * pf - (vy[i] - cvy) * c + g + pushY
                  }

                  val vmax = 4200f * d
                  val tol = 22f * d
                  val depth = 60f * d
                  val fr = min(1f, 16f * dt)
                  contacts = 0
                  onPlat = false
                  var imp = 0f
                  var bon = 0f
                  var lastStand: Plat? = null

                  for (i in 0 until N) {
                      vx[i] = (vx[i] + ax[i] * dt).coerceIn(-vmax, vmax)
                      vy[i] = (vy[i] + ay[i] * dt).coerceIn(-vmax, vmax)
                      oy[i] = py[i]
                      px[i] += vx[i] * dt
                      py[i] += vy[i] * dt

                      if (px[i] < 0f) {
                          px[i] = 0f
                          if (vx[i] < 0f) vx[i] *= -0.2f
                      } else if (px[i] > W) {
                          px[i] = W
                          if (vx[i] > 0f) vx[i] *= -0.2f
                      }
                      if (py[i] < ceilY) {
                          py[i] = ceilY
                          if (vy[i] < 0f) {
                              if (-vy[i] > bon) bon = -vy[i]
                              vy[i] = -vy[i] * 0.25f
                          }
                      }

                      var top = Float.MAX_VALUE
                      var chosen: Plat? = null
                      if (py[i] > floorY) top = floorY
                      if (vy[i] > -60f * d) {
                          val x = px[i]
                          val y = py[i]
                          for (pl in platforms) {
                              if (x < pl.l || x > pl.r || pl.t >= top || pl.t < zoneY) continue
                              if (y >= pl.t && (y <= pl.t + depth || oy[i] <= pl.t + tol)) {
                                  top = pl.t
                                  chosen = pl
                              }
                          }
                      }
                      if (top != Float.MAX_VALUE) {
                          val v = vy[i]
                          if (v > 0f) {
                              if (v > imp) imp = v
                              vy[i] = if (v > 450f * d) -v * 0.12f else 0f
                          }
                          py[i] = top
                          vx[i] *= (1f - fr)
                          contacts++
                          if (chosen != null) {
                              onPlat = true
                              lastStand = chosen
                          }
                      }
                  }
                  if (imp > 650f * d) {
                      for (k in 0 until N) if (vy[k] > 0f) vy[k] *= 0.55f
                  }
                  if (imp > impact) impact = imp
                  if (bon > bonk) bonk = bon
                  if (lastStand != null) stand = lastStand
              }
          }
          SLIME_EOF

      - name: "FILE SlimeFx.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeFx.kt <<'SLIME_EOF'
          package app.slime

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Typeface
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.random.Random

          /** Partikel slimy: tetesan, genangan, gelembung, kilau, hati, huruf z. */
          class SlimeFx {
              companion object {
                  const val M = 220
                  const val DROP = 1
                  const val PUDDLE = 2
                  const val BUBBLE = 3
                  const val SPARK = 4
                  const val HEART = 5
                  const val ZZ = 6
                  const val NOTE = 7
              }

              var density = 1f
              var muted = false
              var width = 1f

              private val kind = IntArray(M)
              private val x = FloatArray(M)
              private val y = FloatArray(M)
              private val vx = FloatArray(M)
              private val vy = FloatArray(M)
              private val life = FloatArray(M)
              private val maxLife = FloatArray(M)
              private val size = FloatArray(M)
              private var cursor = 0
              private var time = 0f

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply { typeface = Typeface.DEFAULT_BOLD }
              private val path = Path()
              private val rect = RectF()
              private val hsv = FloatArray(3)

              private fun rf(a: Float, b: Float): Float = a + Random.nextFloat() * (b - a)

              private fun pan(px: Float): Float = ((px / max(1f, width)) * 2f - 1f).coerceIn(-1f, 1f)

              private fun on(): Boolean = Tuning.fx >= 0.05f

              private fun cnt(n: Int): Int = if (!on()) 0 else max(1, (n * Tuning.fx).roundToInt())

              private fun col(a: Int, s: Float, v: Float): Int {
                  hsv[0] = Tuning.hue
                  hsv[1] = s
                  hsv[2] = v
                  return Color.HSVToColor(a.coerceIn(0, 255), hsv)
              }

              private fun slot(): Int {
                  for (k in 0 until M) {
                      cursor = (cursor + 1) % M
                      if (kind[cursor] == 0) return cursor
                  }
                  cursor = (cursor + 1) % M
                  return cursor
              }

              private fun add(k: Int, px: Float, py: Float, pvx: Float, pvy: Float, sz: Float, lf: Float) {
                  val i = slot()
                  kind[i] = k
                  x[i] = px
                  y[i] = py
                  vx[i] = pvx
                  vy[i] = pvy
                  size[i] = sz
                  life[i] = lf
                  maxLife[i] = lf
              }

              /** Kipas tetesan. ang: 0=kanan, -90=atas, 90=bawah (derajat). */
              fun fan(px: Float, py: Float, n: Int, speed: Float, ang: Float, spread: Float, sz: Float) {
                  for (k in 0 until cnt(n)) {
                      val a = (ang + rf(-spread, spread)) * (PI.toFloat() / 180f)
                      val sp = speed * rf(0.4f, 1f)
                      add(DROP, px + rf(-3f, 3f), py, cos(a) * sp, sin(a) * sp, sz * rf(0.5f, 1.2f), rf(1.4f, 2.2f))
                  }
              }

              fun ring(px: Float, py: Float, n: Int, speed: Float, sz: Float) {
                  fan(px, py, n, speed, 0f, 180f, sz)
              }

              fun drop(px: Float, py: Float, pvx: Float, pvy: Float, sz: Float) {
                  if (on()) add(DROP, px, py, pvx, pvy, sz, rf(1.4f, 2.2f))
              }

              fun splat(px: Float, py: Float, w: Float) {
                  if (on()) add(PUDDLE, px, py, 0f, 0f, w, rf(1.1f, 1.9f))
              }

              fun bubble(px: Float, py: Float) {
                  if (on()) add(BUBBLE, px, py, rf(-20f, 20f) * density, -rf(60f, 110f) * density, rf(5f, 10f) * density, rf(1.6f, 2.4f))
              }

              fun spark(px: Float, py: Float) {
                  if (on()) add(SPARK, px, py, rf(-60f, 60f) * density, -rf(30f, 110f) * density, rf(3f, 6f) * density, rf(0.5f, 0.9f))
              }

              fun heart(px: Float, py: Float) {
                  if (on()) add(HEART, px, py, rf(-25f, 25f) * density, -rf(50f, 90f) * density, rf(5f, 8f) * density, rf(1.2f, 1.8f))
              }

              fun note(px: Float, py: Float) {
                  if (on()) add(NOTE, px, py, rf(-30f, 30f) * density, -rf(45f, 80f) * density, rf(4f, 6f) * density, 1.7f)
              }

              fun z(px: Float, py: Float) {
                  if (on()) add(ZZ, px, py, rf(8f, 25f) * density, -rf(25f, 40f) * density, rf(8f, 12f) * density, 2f)
              }

              private fun surface(px: Float, oy: Float, ny: Float, plats: List<Plat>, floorY: Float): Float {
                  var best = Float.MAX_VALUE
                  if (ny >= floorY) best = floorY
                  for (pl in plats) {
                      if (px < pl.l || px > pl.r || pl.t >= best) continue
                      if (oy <= pl.t + 2f && ny >= pl.t) best = pl.t
                  }
                  return best
              }

              fun update(dt: Float, g: Float, plats: List<Plat>, floorY: Float) {
                  time += dt
                  for (m in marks) m.life -= dt
                  marks.removeAll { it.life <= 0f }
                  for (i in 0 until M) {
                      if (kind[i] == 0) continue
                      life[i] -= dt
                      if (life[i] <= 0f) {
                          if (kind[i] == BUBBLE && !muted) Sfx.play(Snd.POP, min(1f, size[i] / (10f * density)), pan(x[i]))
                          kind[i] = 0
                          continue
                      }
                      when (kind[i]) {
                          DROP -> {
                              vy[i] += g * dt
                              vx[i] *= (1f - 0.5f * dt)
                              val oy = y[i]
                              x[i] += vx[i] * dt
                              y[i] += vy[i] * dt
                              if (vy[i] > 0f) {
                                  val top = surface(x[i], oy, y[i], plats, floorY)
                                  if (top != Float.MAX_VALUE) {
                                      val sz = size[i]
                                      kind[i] = 0
                                      if (!muted && Random.nextFloat() < 0.3f) {
                                          val kd = sqrt(size[i] / (4f * density)) * min(1f, vy[i] / (700f * density))
                                          Sfx.play(Snd.DRIP, min(1f, kd), pan(x[i]))
                                      }
                                      if (Random.nextFloat() < 0.7f) add(PUDDLE, x[i], top, 0f, 0f, sz * rf(1.5f, 2.6f), rf(0.9f, 1.6f))
                                  }
                              }
                          }
                          BUBBLE, HEART, ZZ, NOTE -> {
                              x[i] += (vx[i] + sin(time * 5f + i) * 14f * density) * dt
                              y[i] += vy[i] * dt
                          }
                          SPARK -> {
                              x[i] += vx[i] * dt
                              y[i] += vy[i] * dt
                              vy[i] += g * 0.1f * dt
                          }
                          else -> {}
                      }
                  }
              }

              private class Mark(var p: Plat, var life: Float)

              private val marks = ArrayList<Mark>()

              private fun near(a: Plat, b: Plat): Boolean {
                  val t = 4f * density
                  return abs(a.l - b.l) < t && abs(a.r - b.r) < t && abs(a.t - b.t) < t && abs(a.b - b.b) < t
              }

              /** Elemen yang sedang diinjak diberi grounding hijau faint yang memudar setelah ditinggal. */
              fun markGround(p: Plat) {
                  if (Tuning.ground < 0.02f) return
                  for (m in marks) {
                      if (m.p === p || near(m.p, p)) {
                          m.p = p
                          m.life = Tuning.groundTime
                          return
                      }
                  }
                  if (marks.size >= 24) marks.removeAt(0)
                  marks.add(Mark(p, Tuning.groundTime))
              }

              /** Setelah scan baru, arahkan tanda ke objek platform yang baru (ukuran sama, posisi terdekat). */
              fun retarget(n: List<Plat>) {
                  val tol = 6f * density
                  for (m in marks) {
                      val o = m.p
                      var best: Plat? = null
                      var bd = 1e9f
                      for (q in n) {
                          if (abs(q.l - o.l) > tol || abs(q.r - o.r) > tol) continue
                          if (abs((q.b - q.t) - (o.b - o.t)) > tol) continue
                          val dd = abs(q.t - o.t)
                          if (dd < bd) {
                              bd = dd
                              best = q
                          }
                      }
                      if (best != null && bd < 700f * density) m.p = best
                  }
              }

              private fun drawMarks(c: Canvas) {
                  val d = density
                  for (m in marks) {
                      val f = (m.life / max(0.2f, Tuning.groundTime)).coerceIn(0f, 1f)
                      val a = f * Tuning.ground.coerceAtMost(1.5f) * (0.88f + 0.12f * sin(time * 3f))
                      val p = m.p
                      rect.set(p.l, p.t, p.r, p.b)
                      val rr = 6f * d
                      fill.color = col((90f * a).toInt(), 0.7f, 1f)
                      c.drawRoundRect(rect, rr, rr, fill)
                  }
              }

              fun shiftRegion(l: Float, t: Float, r: Float, b: Float, dx: Float, dy: Float) {
                  for (i in 0 until M) {
                      if (kind[i] == PUDDLE && x[i] >= l && x[i] <= r && y[i] >= t && y[i] <= b) {
                          x[i] += dx
                          y[i] += dy
                      }
                  }
              }

              /** back=true: genangan di belakang badan; false: sisanya di depan. */
              fun draw(c: Canvas, back: Boolean) {
                  if (back) drawMarks(c)
                  for (i in 0 until M) {
                      val k = kind[i]
                      if (k == 0) continue
                      if ((k == PUDDLE) != back) continue
                      val f = life[i] / maxLife[i]
                      when (k) {
                          PUDDLE -> {
                              val s = size[i] * (0.65f + 0.35f * f)
                              fill.color = col((min(1f, f * 1.6f) * 150f).toInt(), 0.65f, 1f)
                              rect.set(x[i] - s, y[i] - s * 0.34f, x[i] + s, y[i] + s * 0.06f)
                              c.drawOval(rect, fill)
                          }
                          DROP -> {
                              val cl = col((min(1f, life[i] / 0.35f) * 235f).toInt(), 0.6f, 1f)
                              fill.color = cl
                              line.color = cl
                              line.strokeWidth = size[i] * 1.5f
                              c.drawLine(x[i] - vx[i] * 0.022f, y[i] - vy[i] * 0.022f, x[i], y[i], line)
                              c.drawCircle(x[i], y[i], size[i], fill)
                          }
                          BUBBLE -> {
                              val a = (min(1f, f * 3f) * 170f).toInt()
                              val pop = life[i] < 0.14f
                              val r = size[i] * (if (pop) 1f + (0.14f - life[i]) * 8f else 1f)
                              line.strokeWidth = 1.6f * density
                              line.color = Color.argb(if (pop) a / 2 else a, 255, 255, 255)
                              c.drawCircle(x[i], y[i], r, line)
                              fill.color = Color.argb(a / 2, 255, 255, 255)
                              c.drawCircle(x[i] - r * 0.35f, y[i] - r * 0.35f, r * 0.18f, fill)
                          }
                          SPARK -> {
                              val s = size[i] * (0.5f + 0.5f * min(1f, f * 2f))
                              val a = (min(1f, f * 3f) * 255f).toInt()
                              fill.color = Color.argb(a, 255, 255, 235)
                              val px = x[i]
                              val py = y[i]
                              path.reset()
                              path.moveTo(px, py - s)
                              path.lineTo(px + s * 0.28f, py - s * 0.28f)
                              path.lineTo(px + s, py)
                              path.lineTo(px + s * 0.28f, py + s * 0.28f)
                              path.lineTo(px, py + s)
                              path.lineTo(px - s * 0.28f, py + s * 0.28f)
                              path.lineTo(px - s, py)
                              path.lineTo(px - s * 0.28f, py - s * 0.28f)
                              path.close()
                              c.drawPath(path, fill)
                          }
                          HEART -> {
                              val s = size[i]
                              val px = x[i]
                              val py = y[i]
                              fill.color = Color.argb((min(1f, f * 2.5f) * 255f).toInt(), 255, 92, 147)
                              path.reset()
                              path.moveTo(px, py + s * 0.9f)
                              path.cubicTo(px - s * 1.6f, py - s * 0.1f, px - s * 0.9f, py - s * 1.4f, px, py - s * 0.5f)
                              path.cubicTo(px + s * 0.9f, py - s * 1.4f, px + s * 1.6f, py - s * 0.1f, px, py + s * 0.9f)
                              path.close()
                              c.drawPath(path, fill)
                          }
                          NOTE -> {
                              val s = size[i]
                              val a = (min(1f, f * 2.5f) * 255f).toInt()
                              fill.color = Color.argb(a, 255, 240, 160)
                              line.color = Color.argb(a, 255, 240, 160)
                              line.strokeWidth = s * 0.35f
                              rect.set(x[i] - s, y[i] - s * 0.7f, x[i] + s, y[i] + s * 0.7f)
                              c.drawOval(rect, fill)
                              c.drawLine(x[i] + s * 0.85f, y[i], x[i] + s * 0.85f, y[i] - s * 3f, line)
                              c.drawLine(x[i] + s * 0.85f, y[i] - s * 3f, x[i] + s * 2f, y[i] - s * 2.2f, line)
                          }
                          ZZ -> {
                              text.textSize = size[i] * 2f
                              text.color = Color.argb((min(1f, f * 2.5f) * 255f).toInt(), 235, 245, 255)
                              c.drawText("z", x[i], y[i], text)
                          }
                          else -> {}
                      }
                  }
              }
          }
          SLIME_EOF

      - name: "FILE SlimeAudio.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeAudio.kt <<'SLIME_EOF'
          package app.slime

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.SystemClock
          import java.util.Random
          import java.util.concurrent.LinkedBlockingQueue
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.sqrt

          enum class Snd(val gapMs: Int) {
              LAND(50), JUMP(80), SQUISH(110), DRIP(60), POP(40), BLUB(90), BLOOP_DOWN(300), SNEEZE(600),
              HIC(200), GIGGLE(250), EEP(700), SPLAT(120), THUMP(130), DING(90), SQUEAK(200), GURGLE(400),
              SNORE(500), SNIFF(120), BONK(150), SUMMON(500),
              KICK(100), SNARE(100), HAT(60), NOTE(150), CLICK(200), TADA(300),
              SLIDE(140), STRETCH(160)
          }

          /**
           * Suara slime prosedural (tanpa file audio), stereo, posisinya mengikuti lokasi kejadian di layar.
           *
           * Model fisika yang dipakai:
           * - Gelembung udara dalam cairan kental: frekuensi Minnaert f = 3.26 / r (r dalam meter),
           *   redaman d = 0.043 f + 0.0014 f^1.5 dan glide naik (van den Doel, "Physically based models
           *   for liquid sounds"). Amplitudo naik dengan ukuran gelembung.
           * - Benturan badan lunak: pulsa setengah sinus selama waktu kontak + getaran badan yang meluruh.
           * - Pecahnya selaput basah: letupan acak (proses Poisson) dengan laju yang meluruh.
           * - Gesekan/tarikan lengket: noise lewat filter resonan yang pusatnya bergerak.
           * - Volume dinamis: amplitudo mengikuti energi kejadian (k dari kecepatan/massa di simulasi).
           * - Lokasi: panning daya-sama + beda waktu antar telinga (<= ~0.6 ms) + bayangan kepala
           *   (telinga jauh sedikit teredam). Ada pantulan ruang singkat.
           */
          object Sfx {
              private const val RATE = 22050

              private class Req(val s: Snd, val k: Float, val vol: Float, val pitch: Float, val size: Float, val pan: Float)

              private class Voice(
                  val s: FloatArray,
                  val gain: Float,
                  val gl: Float,
                  val gr: Float,
                  val delay: Int,
                  val farLeft: Boolean,
                  val a: Float
              ) {
                  var pos = 0
                  var lp = 0f
              }

              private val q = LinkedBlockingQueue<Req>()
              private val last = LongArray(Snd.values().size)
              private val rnd = Random()

              @Volatile private var running = false
              private var track: AudioTrack? = null
              private var worker: Thread? = null

              fun start() {
                  if (running) return
                  try {
                      val minBuf = AudioTrack.getMinBufferSize(
                          RATE, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT
                      )
                      val t = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_GAME)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setSampleRate(RATE)
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_STEREO)
                                  .build()
                          )
                          .setBufferSizeInBytes(max(minBuf, 4096) * 2)
                          .setTransferMode(AudioTrack.MODE_STREAM)
                          .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                          .build()
                      t.play()
                      track = t
                      running = true
                      val w = Thread { loop(t) }
                      w.isDaemon = true
                      w.start()
                      worker = w
                  } catch (e: Throwable) {
                      running = false
                  }
              }

              fun stop() {
                  if (!running) return
                  running = false
                  q.offer(Req(Snd.POP, -1f, 0f, 1f, 1f, 0f))
                  try {
                      track?.stop()
                      track?.release()
                  } catch (e: Throwable) {
                  }
                  track = null
                  worker = null
              }

              /**
               * k = intensitas fisik 0..1 (energi benturan, kecepatan, ukuran tetesan), pan = -1 kiri .. 1 kanan
               * (posisi x kejadian di layar).
               */
              fun play(s: Snd, k: Float = 0.6f, pan: Float = 0f) {
                  if (!running) return
                  val master = Tuning.volume
                  if (master < 0.02f) return
                  val now = SystemClock.uptimeMillis()
                  if (now - last[s.ordinal] < s.gapMs) return
                  last[s.ordinal] = now
                  if (q.size > 14) return
                  val kk = k.coerceIn(0f, 1f)
                  val loud = 0.08f + 0.92f * kk.pow(0.75f)
                  val vol = master * (1f - Tuning.dyn + Tuning.dyn * loud)
                  q.offer(Req(s, kk, vol, Tuning.pitch, max(0.4f, Tuning.radius / 34f), pan.coerceIn(-1f, 1f)))
              }

              private fun at(a: FloatArray, i: Int): Float = if (i >= 0 && i < a.size) a[i] else 0f

              private fun loop(t: AudioTrack) {
                  val chunk = 512
                  val mixL = FloatArray(chunk)
                  val mixR = FloatArray(chunk)
                  val out = ShortArray(chunk * 2)
                  val active = ArrayList<Voice>()
                  try {
                      while (running) {
                          if (active.isEmpty()) {
                              val r = q.take()
                              if (!running) break
                              spawn(active, r)
                          }
                          while (true) {
                              val r = q.poll() ?: break
                              spawn(active, r)
                          }
                          java.util.Arrays.fill(mixL, 0f)
                          java.util.Arrays.fill(mixR, 0f)
                          val iter = active.iterator()
                          while (iter.hasNext()) {
                              val v = iter.next()
                              for (i in 0 until chunk) {
                                  val idx = v.pos + i
                                  val near = at(v.s, idx)
                                  val far = at(v.s, idx - v.delay)
                                  v.lp += v.a * (far - v.lp)
                                  if (v.farLeft) {
                                      mixL[i] += v.lp * v.gl * v.gain
                                      mixR[i] += near * v.gr * v.gain
                                  } else {
                                      mixL[i] += near * v.gl * v.gain
                                      mixR[i] += v.lp * v.gr * v.gain
                                  }
                              }
                              v.pos += chunk
                              if (v.pos >= v.s.size + v.delay + 4) iter.remove()
                          }
                          for (i in 0 until chunk) {
                              val l = mixL[i].coerceIn(-3f, 3f)
                              val r = mixR[i].coerceIn(-3f, 3f)
                              out[2 * i] = ((l * (27f + l * l) / (27f + 9f * l * l)) * 30000f).toInt().toShort()
                              out[2 * i + 1] = ((r * (27f + r * r) / (27f + 9f * r * r)) * 30000f).toInt().toShort()
                          }
                          t.write(out, 0, chunk * 2)
                      }
                  } catch (e: Throwable) {
                  }
              }

              private fun spawn(active: ArrayList<Voice>, r: Req) {
                  if (r.k < 0f) return
                  if (active.size >= 12) active.removeAt(0)
                  val buf = synth(r)
                  if (buf.isEmpty()) return
                  val pn = r.pan * Tuning.stereo
                  val ang = (pn + 1f) * (PI.toFloat() / 4f)
                  val delay = (abs(pn) * 14f).toInt()
                  val fc = 12000f - 10000f * abs(pn).pow(0.7f)
                  val a = 1f - exp(-2f * PI.toFloat() * fc / RATE)
                  active.add(Voice(buf, r.vol * 0.9f, cos(ang), sin(ang), delay, pn > 0f, a))
              }

              // ---------- blok bangunan sintesis ----------

              private fun rf(a: Float, b: Float): Float = a + rnd.nextFloat() * (b - a)
              private fun lerp(a: Float, b: Float, t: Float): Float = a + (b - a) * t

              private class Buf(sec: Float) {
                  val d = FloatArray((sec * RATE).toInt())
                  var used = 0
                  fun add(src: FloatArray, atSec: Float) {
                      val o = (atSec * RATE).toInt()
                      for (i in src.indices) {
                          val j = o + i
                          if (j >= d.size) break
                          d[j] += src[i]
                      }
                      used = max(used, min(d.size, o + src.size))
                  }
              }

              /** Gelembung: sinus meluruh dengan glide naik (van den Doel). */
              private fun bubble(f0: Float, dur: Float, amp: Float, glide: Float): FloatArray {
                  val dm = 0.043f * f0 + 0.0014f * f0 * sqrt(f0)
                  val xi = (0.13f * dm + 0.0072f * dm * sqrt(dm)) * glide
                  val n = (dur * RATE).toInt()
                  val o = FloatArray(n)
                  var ph = 0.0
                  for (i in 0 until n) {
                      val t = i.toFloat() / RATE
                      val f = f0 * (1f + xi * t)
                      ph += 2.0 * PI * f / RATE
                      val att = min(1f, i / 24f)
                      o[i] = (amp * exp(-dm * t) * att * sin(ph)).toFloat()
                  }
                  return o
              }

              private fun ping(f: Float, dur: Float, amp: Float, tau: Float): FloatArray {
                  val n = (dur * RATE).toInt()
                  val o = FloatArray(n)
                  for (i in 0 until n) {
                      val t = i.toFloat() / RATE
                      o[i] = amp * exp(-t / tau) * sin(2f * PI.toFloat() * f * t)
                  }
                  return o
              }

              /** Pulsa kontak benturan benda lunak: setengah sinus selama waktu kontak. */
              private fun halfSine(dur: Float, amp: Float): FloatArray {
                  val n = max(2, (dur * RATE).toInt())
                  return FloatArray(n) { (amp * sin(PI * it / n)).toFloat() }
              }

              /** Sapuan nada dengan peluruhan eksponensial dan vibrato opsional. */
              private fun sweep(f1: Float, f2: Float, dur: Float, amp: Float, tau: Float, vib: Float = 0f): FloatArray {
                  val n = (dur * RATE).toInt()
                  val o = FloatArray(n)
                  var ph = 0.0
                  for (i in 0 until n) {
                      val u = i.toFloat() / n
                      val t = i.toFloat() / RATE
                      val f = (f1 + (f2 - f1) * u) * (1f + vib * sin(2f * PI.toFloat() * 6f * t))
                      ph += 2.0 * PI * f / RATE
                      val env = exp(-t / tau) * min(1f, i / 30f) * min(1f, (n - i) / 60f)
                      o[i] = (amp * env * sin(ph)).toFloat()
                  }
                  return o
              }

              /** Noise band-pass. tau > 0: meluruh; tau < 0: membengkak (hirup napas). */
              private fun noise(dur: Float, lo: Float, hi: Float, amp: Float, tau: Float): FloatArray {
                  val n = (dur * RATE).toInt()
                  val o = FloatArray(n)
                  val a1 = exp(-2f * PI.toFloat() * hi / RATE)
                  val a2 = exp(-2f * PI.toFloat() * lo / RATE)
                  var l1 = 0f
                  var l2 = 0f
                  for (i in 0 until n) {
                      val x = rnd.nextFloat() * 2f - 1f
                      l1 = (1f - a1) * x + a1 * l1
                      l2 = (1f - a2) * l1 + a2 * l2
                      val bp = l1 - l2
                      val t = i.toFloat() / RATE
                      val u = i.toFloat() / n
                      val env = if (tau > 0f) exp(-t / tau) else u * u
                      o[i] = amp * 6f * bp * env * min(1f, i / 30f) * min(1f, (n - i) / 40f)
                  }
                  return o
              }

              /** Noise lewat filter resonan yang pusatnya bergerak (gesekan, tarikan lengket). */
              private fun moveBand(f1: Float, f2: Float, dur: Float, amp: Float, damp: Float): FloatArray {
                  val n = (dur * RATE).toInt()
                  val o = FloatArray(n)
                  var low = 0f
                  var band = 0f
                  for (i in 0 until n) {
                      val u = i.toFloat() / n
                      val fc = f1 + (f2 - f1) * u
                      val f = 2f * sin(PI.toFloat() * min(fc, 2500f) / RATE)
                      val x = rnd.nextFloat() * 2f - 1f
                      low += f * band
                      val high = x - low - damp * band
                      band += f * high
                      o[i] = amp * 4f * band * sin(PI.toFloat() * u)
                  }
                  return o
              }

              /** Pecahnya selaput basah: letupan kecil acak dengan laju meluruh. */
              private fun crackle(b: Buf, t0: Float, dur: Float, rate0: Float, tau: Float, fLo: Float, fHi: Float, amp: Float) {
                  val n = (dur * RATE).toInt()
                  for (i in 0 until n) {
                      val t = i.toFloat() / RATE
                      val rate = rate0 * exp(-t / tau)
                      if (rnd.nextFloat() < rate / RATE) {
                          b.add(ping(rf(fLo, fHi), rf(0.003f, 0.009f), amp * rf(0.4f, 1f), 0.003f), t0 + t)
                      }
                  }
              }

              /** Segerombol gelembung acak; radius (m) menentukan nada lewat f = 3.26 / r. */
              private fun wet(b: Buf, n: Int, t0: Float, span: Float, minRad: Float, maxRad: Float, wp: Float) {
                  for (i in 0 until n) {
                      val rad = rf(minRad, max(minRad + 0.0005f, maxRad))
                      val f = ((3.26f / rad) * wp).coerceIn(180f, 3000f)
                      val amp = rf(0.12f, 0.3f) * (rad / 0.006f).pow(0.8f).coerceIn(0.5f, 1.6f)
                      b.add(bubble(f, rf(0.05f, 0.14f), amp, rf(0.7f, 1.3f)), t0 + rf(0f, span))
                  }
              }

              /** Pantulan ruang singkat (3 tap) supaya tidak terdengar kering. */
              private fun finish(b: Buf): FloatArray {
                  val n = b.used
                  val tail = (0.06f * RATE).toInt()
                  val out = FloatArray(n + tail)
                  if (n <= 0) return FloatArray(0)
                  for (i in 0 until n) out[i] = b.d[i]
                  val taps = intArrayOf((0.011f * RATE).toInt(), (0.023f * RATE).toInt(), (0.041f * RATE).toInt())
                  val gains = floatArrayOf(0.16f, 0.09f, 0.05f)
                  for (t in taps.indices) {
                      for (i in 0 until n) {
                          val j = i + taps[t]
                          if (j < out.size) out[j] += b.d[i] * gains[t]
                      }
                  }
                  return out
              }

              private fun synth(r: Req): FloatArray {
                  val k = r.k
                  val sz = r.size
                  val wp = r.pitch
                  val ps = r.pitch / sqrt(sz)
                  val b = Buf(2.0f)
                  when (r.s) {
                      Snd.LAND -> {
                          val tc = 0.022f * (1.2f - 0.4f * k)
                          b.add(halfSine(tc, 0.5f + 0.3f * k), 0f)
                          b.add(sweep(lerp(120f, 190f, k) * ps, 55f * ps, 0.2f, 0.55f, 0.06f), 0f)
                          b.add(noise(0.1f, 250f, 2600f, 0.35f, 0.035f), 0.002f)
                          crackle(b, 0.01f, 0.22f, 200f + 700f * k, 0.06f, 1500f, 6000f, 0.12f)
                          wet(b, 3 + (16f * k).toInt(), 0.005f, 0.05f + 0.12f * k, 0.002f * sz, (0.004f + 0.008f * k) * sz, wp)
                      }
                      Snd.JUMP -> {
                          b.add(sweep(160f * ps, lerp(420f, 700f, k) * ps, 0.15f, 0.35f, 0.08f), 0f)
                          b.add(moveBand(500f, 2200f, 0.1f, 0.2f, 0.25f), 0.01f)
                          crackle(b, 0f, 0.12f, 400f, 0.05f, 2000f, 6000f, 0.1f)
                          wet(b, 2 + (2f * k).toInt(), 0.03f, 0.08f, 0.002f * sz, 0.005f * sz, wp)
                      }
                      Snd.SQUISH -> {
                          b.add(moveBand(180f, 420f, 0.12f, 0.3f, 0.3f), 0f)
                          wet(b, 2 + (3f * k).toInt(), 0f, 0.12f, 0.008f * sz, 0.016f * sz, wp)
                      }
                      Snd.DRIP -> {
                          val f = lerp(2000f, 850f, k) * wp / sqrt(sz) * rf(0.95f, 1.05f)
                          b.add(ping(f * 2.2f, 0.006f, 0.25f, 0.002f), 0f)
                          b.add(bubble(f, 0.14f, 0.4f, 1.6f), 0.004f)
                          b.add(bubble(f * 1.5f, 0.08f, 0.15f, 1.2f), 0.03f)
                      }
                      Snd.POP -> {
                          b.add(ping(rf(2200f, 3800f) * wp, 0.04f, 0.45f, 0.012f), 0f)
                          b.add(noise(0.02f, 2000f, 6000f, 0.25f, 0.008f), 0f)
                      }
                      Snd.BLUB -> {
                          b.add(bubble(rf(450f, 900f) * wp / sqrt(sz), 0.1f, 0.3f, 2.2f), 0f)
                      }
                      Snd.BLOOP_DOWN -> {
                          b.add(sweep(520f * ps, 190f * ps, 0.55f, 0.28f, 0.35f, 0.03f), 0f)
                      }
                      Snd.SNEEZE -> {
                          b.add(noise(0.8f, 600f, 3500f, 0.14f, -1f), 0f)
                          b.add(noise(0.14f, 700f, 5000f, 0.5f, 0.05f), 0.82f)
                          b.add(sweep(900f * ps, 400f * ps, 0.12f, 0.2f, 0.06f), 0.82f)
                          crackle(b, 0.84f, 0.2f, 500f, 0.07f, 1500f, 6000f, 0.1f)
                          wet(b, 6, 0.86f, 0.15f, 0.003f * sz, 0.01f * sz, wp)
                      }
                      Snd.HIC -> {
                          b.add(sweep(300f * ps, 520f * ps, 0.07f, 0.35f, 0.05f), 0f)
                          b.add(sweep(120f * ps, 70f * ps, 0.08f, 0.3f, 0.04f), 0f)
                      }
                      Snd.GIGGLE -> {
                          for (i in 0 until 4) {
                              val f = rf(520f, 800f) * ps * (1f + 0.08f * i)
                              b.add(sweep(f, f * 1.15f, 0.06f, 0.3f, 0.05f, 0.02f), 0.085f * i)
                          }
                      }
                      Snd.EEP -> {
                          b.add(sweep(650f * ps, 1500f * ps, 0.1f, 0.3f, 0.12f, 0.04f), 0f)
                      }
                      Snd.SPLAT -> {
                          b.add(noise(0.14f, 250f, 2200f, 0.45f, 0.05f), 0f)
                          crackle(b, 0f, 0.2f, 500f, 0.07f, 1500f, 6000f, 0.12f)
                          wet(b, 5 + (3f * k).toInt(), 0f, 0.1f, 0.003f * sz, 0.012f * sz, wp)
                      }
                      Snd.THUMP -> {
                          b.add(sweep(95f * ps, 55f * ps, 0.12f, 0.55f, 0.06f), 0f)
                          b.add(sweep(95f * ps, 55f * ps, 0.12f, 0.4f, 0.06f), 0.18f)
                      }
                      Snd.DING -> {
                          b.add(sweep(1320f * ps, 1320f * ps, 0.3f, 0.15f, 0.12f), 0f)
                          b.add(sweep(1980f * ps, 1980f * ps, 0.3f, 0.08f, 0.1f), 0.01f)
                      }
                      Snd.SQUEAK -> {
                          b.add(sweep(rf(900f, 1300f) * ps, rf(1500f, 2100f) * ps, 0.09f, 0.13f, 0.1f, 0.05f), 0f)
                          b.add(noise(0.09f, 1000f, 3000f, 0.05f, 0.1f), 0f)
                      }
                      Snd.GURGLE -> {
                          wet(b, 8, 0f, 0.7f, 0.007f * sz, 0.016f * sz, wp)
                      }
                      Snd.SNORE -> {
                          b.add(noise(0.5f, 80f, 400f, 0.35f, -1f), 0f)
                          b.add(noise(0.35f, 60f, 300f, 0.25f, 0.12f), 0.5f)
                      }
                      Snd.SNIFF -> {
                          b.add(noise(0.04f, 1800f, 5500f, 0.22f, 0.02f), 0f)
                          b.add(noise(0.04f, 1800f, 5500f, 0.2f, 0.02f), 0.07f)
                          b.add(noise(0.04f, 1800f, 5500f, 0.18f, 0.02f), 0.13f)
                      }
                      Snd.BONK -> {
                          b.add(halfSine(0.006f, 0.6f), 0f)
                          b.add(sweep(220f * ps, 110f * ps, 0.1f, 0.5f, 0.04f), 0f)
                          b.add(noise(0.05f, 500f, 2500f, 0.3f, 0.02f), 0f)
                      }
                      Snd.KICK -> {
                          b.add(sweep(150f * ps, 45f * ps, 0.18f, 0.7f, 0.07f), 0f)
                      }
                      Snd.SNARE -> {
                          b.add(noise(0.14f, 800f, 6000f, 0.45f, 0.05f), 0f)
                          b.add(sweep(220f * ps, 180f * ps, 0.1f, 0.3f, 0.05f), 0f)
                      }
                      Snd.HAT -> {
                          b.add(noise(0.05f, 5000f, 9000f, 0.22f, 0.015f), 0f)
                      }
                      Snd.NOTE -> {
                          val idx = (k * 7f + 0.5f).toInt().coerceIn(0, 6)
                          val semi = intArrayOf(0, 2, 4, 7, 9, 12, 14)[idx]
                          val f = 392f * 2f.pow(semi / 12f) * ps
                          b.add(sweep(f, f * 1.01f, 0.24f, 0.3f, 0.12f, 0.015f), 0f)
                          b.add(sweep(f * 2f, f * 2f, 0.15f, 0.07f, 0.06f), 0f)
                      }
                      Snd.CLICK -> {
                          b.add(noise(0.012f, 1500f, 8000f, 0.6f, 0.004f), 0f)
                          b.add(noise(0.018f, 700f, 3000f, 0.4f, 0.006f), 0.07f)
                      }
                      Snd.TADA -> {
                          b.add(sweep(523f * ps, 523f * ps, 0.4f, 0.2f, 0.2f), 0f)
                          b.add(sweep(659f * ps, 659f * ps, 0.35f, 0.18f, 0.2f), 0.07f)
                          b.add(sweep(784f * ps, 784f * ps, 0.5f, 0.18f, 0.25f), 0.14f)
                      }
                      Snd.SLIDE -> {
                          b.add(moveBand(250f + 500f * k, 600f + 900f * k, 0.14f, 0.25f + 0.2f * k, 0.3f), 0f)
                          crackle(b, 0f, 0.12f, 150f + 300f * k, 0.1f, 1200f, 4500f, 0.08f)
                          wet(b, 2, 0f, 0.1f, 0.006f * sz, 0.014f * sz, wp)
                      }
                      Snd.STRETCH -> {
                          val f = (900f + 1400f * k) * ps
                          b.add(sweep(f, f * 1.08f, 0.18f, 0.12f + 0.12f * k, 0.15f, 0.04f), 0f)
                          b.add(moveBand(f, f * 1.2f, 0.15f, 0.06f, 0.1f), 0f)
                      }
                      Snd.SUMMON -> {
                          b.add(sweep(300f * ps, 900f * ps, 0.35f, 0.3f, 0.3f, 0.05f), 0f)
                          b.add(sweep(1200f * ps, 1800f * ps, 0.4f, 0.1f, 0.25f), 0.05f)
                          for (i in 0 until 5) b.add(bubble(rf(500f, 1400f) * ps * (1f + 0.15f * i), 0.09f, 0.2f, 1.5f), 0.05f * i)
                      }
                  }
                  return finish(b)
              }
          }
          SLIME_EOF

      - name: "FILE SlimeBrain.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeBrain.kt <<'SLIME_EOF'
          package app.slime

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.random.Random

          enum class Expr { NORMAL, HAPPY, SLEEP, ANGRY, DIZZY, CROSS, HEART, COOL }
          enum class Mouth { SMILE, O, FLAT, YAWN, TONGUE, WAVY, GRIN, NONE }

          /** Satu klip animasi: dur detik, w bobot, kind jenis, tick(u 0..1, dt) memodifikasi pose. */
          class Clip(
              val name: String,
              val dur: Float,
              val w: Float,
              val kind: Int,
              val tick: (Float, Float) -> Unit
          )

          /** Otak slime: lompat ke elemen UI, puluhan klip animasi absurd, mood/energi, kaget saat scroll. */
          class SlimeBrain(private val p: SlimePhysics, private val fx: SlimeFx) {
              companion object {
                  const val CALM = 0
                  const val ACTIVE = 1
                  const val SILLY = 2
                  const val SLEEPY = 3
                  const val SHOW = 4
              }

              enum class S { IDLE, WIND, AIR, LAND, CLIP }

              var state = S.IDLE
              var muted = false
              var boxCount = 0
              var summonHook: ((Float) -> Unit)? = null

              // wajah (dibaca view)
              var expr = Expr.NORMAL
              var mouth = Mouth.SMILE
              var blink = 0f
              var wide = 0f
              var sleepy = 0f
              var squint = 0f
              var blush = 0f
              var glow = 0f
              var lookX = 0f
              var lookY = 0f
              var clock = 0f

              // pose per frame
              private var sx = 1f
              private var sy = 1f
              private var lean = 0f
              private var pushX = 0f
              private var pushY = 0f
              private var sleepT = 0f
              private var squintT = 0f

              private var t = 0f
              private var idleLeft = 1.5f
              private var windDur = 0.3f
              private var wiggle = false
              private var planned = false
              private var jvx = 0f
              private var jvy = 0f
              private var jtx = 0f
              private var jty = 0f
              private var jT = 0.5f
              private var air = 0f
              private var loose = 0f
              private var blinkIn = 2f
              private var lookIn = 1f
              private var tlx = 0f
              private var tly = 0f
              private var energy = 0.7f
              private var scrollBurst = 0f
              private var highTime = 0f
              private var trailT = 0f
              private var cur: Clip? = null
              private var lastClip: Clip? = null
              private var cA = 0f
              private var cB = -1
              private var cDir = 1f
              private var cS = false
              private val floorPlat = Plat(0f, 0f, 0f, 0f)

              private val d: Float get() = p.density
              private val R: Float get() = p.radius

              private fun rf(a: Float, b: Float): Float = a + Random.nextFloat() * (b - a)
              private fun hump(u: Float): Float = sin(u * PI.toFloat())
              private fun ease(u: Float): Float {
                  val k = u.coerceIn(0f, 1f)
                  return k * k * (3f - 2f * k)
              }
              private fun pulse(u: Float, a: Float, b: Float): Float =
                  if (u < a || u > b) 0f else sin((u - a) / (b - a) * PI.toFloat())

              /** true tiap kali u melewati kelipatan period (detik) di klip berdurasi dur. */
              private fun tickEvery(u: Float, dur: Float, period: Float): Boolean {
                  val k = (u * dur / period).toInt()
                  if (k > cB) {
                      cB = k
                      return true
                  }
                  return false
              }

              private fun go(s: S) {
                  state = s
                  t = 0f
                  if (s == S.WIND) snd(Snd.SQUISH, 0.6f)
              }

              private fun snd(s: Snd, k: Float = 0.6f, atX: Float = p.cx) {
                  if (muted) return
                  Sfx.play(s, k, ((atX / max(1f, p.W)) * 2f - 1f).coerceIn(-1f, 1f))
              }

              var speech: String? = null
              var speechT = 0f
              var speechDur = 2.4f
              private var sayGap = 0f
              private var airOk = 0f
              private var battery = 100
              private var charging = false
              private var scrollSession = 0f
              private var quietT = 0f
              private var greeted = false
              private var wantNudge = false
              private var hourNow = 12
              private var hourT = 0f
              private var awayT = 0f
              private var appearT = 1f
              private var forceDir = 0f
              private var welcome: String? = null
              val energyLevel: Float get() = energy

              private val chatter = listOf(
                  "plop~", "hehe", "wkwkwk", "uwaaa", "boing boing!", "ada yg mau liat trik?",
                  "aku lagi nyantai nih", "semangat ya!", "kamu keren hari ini", "minum air dulu gih",
                  "jangan lupa napas~", "lagi ngapain?", "psst... aku di sini lho"
              )

              private fun say(text: String, chance: Float = 1f, force: Boolean = false) {
                  if (muted || Tuning.talk < 0.05f) return
                  if (!force && sayGap > 0f) return
                  if (Random.nextFloat() > chance) return
                  speech = text
                  speechT = 0f
                  speechDur = 1.7f + text.length * 0.055f
                  sayGap = 5f / max(0.3f, Tuning.talk)
              }

              private fun greeting(): String {
                  val h = java.util.Calendar.getInstance().get(java.util.Calendar.HOUR_OF_DAY)
                  return when {
                      h in 5..10 -> "pagi~ semangat ya!"
                      h in 11..14 -> "udah makan siang belum?"
                      h in 15..17 -> "sore~ dikit lagi, semangat!"
                      h in 18..22 -> "malem~ santai dulu yuk"
                      else -> "udah malem, jangan begadang ya"
                  }
              }

              /** Dari service: kondisi baterai. Slime ikut lemas kalau tipis dan senang kalau dicas. */
              fun setEnv(level: Int, chg: Boolean) {
                  if (chg && !charging) {
                      say("nyam, listrik!", 1f, true)
                      energy = min(1f, energy + 0.2f)
                  }
                  if (!chg && level in 0..15 && (battery > 15 || charging)) {
                      say("baterai tipis...\ncas dulu yuk", 1f, true)
                  }
                  battery = level
                  charging = chg
              }

              private fun homeX(): Float = p.W * Tuning.homeX * 0.01f

              /** Arah acak yang condong ke rumah kalau sedang jauh darinya. */
              private fun homeDir(): Float {
                  val away = homeX() - p.cx
                  if (abs(away) > R * 2f && Random.nextFloat() < min(0.9f, 0.25f + 0.25f * Tuning.homeBias)) {
                      return if (away > 0f) 1f else -1f
                  }
                  return if (Random.nextBoolean()) 1f else -1f
              }

              /** Ingatan: energi terakhir dan berapa lama tidak bertemu (ms, -1 = pertama kali). */
              fun restore(en: Float, awayMs: Long) {
                  energy = en.coerceIn(0.2f, 1f)
                  if (awayMs in 0L..(20L * 60_000L)) {
                      greeted = true
                  } else if (awayMs > 3L * 3_600_000L) {
                      welcome = "wah, akhirnya balik~"
                  }
              }

              /** Muncul di tempatnya: membesar dari kecil, bukan jatuh dari atas. */
              fun popIn() {
                  appearT = 0f
                  fx.ring(p.cx, p.cy, 12, 260f * d, 2.6f * d)
                  snd(Snd.POP, 0.5f)
              }

              private fun hop(vx: Float, vy: Float) {
                  p.kick(vx, vy)
                  airOk = 2f * abs(vy) / (Tuning.gravity * d) + 0.35f
              }

              /** Lompatan tertinggi yang tidak menembus zona gerak atas. */
              private fun hopCap(): Float {
                  val g = Tuning.gravity * d
                  val room = p.cy - (p.zoneY + R)
                  return if (room > 0f) max(sqrt(2f * g * room), 260f * d) else 260f * d
              }

              /** true sekali saja per klip (untuk suara pembuka). */
              private fun once(): Boolean {
                  if (cS) return false
                  cS = true
                  return true
              }

              val clipCount: Int get() = clips.size

              private val clips: List<Clip> = listOf(
                  Clip("yawn", 2.0f, 1f, SLEEPY) { u, _ ->
                      if (once()) {
                          snd(Snd.BLOOP_DOWN, 0.5f)
                          say("hoaaam~", 0.7f)
                      }
                      val k = pulse(u, 0.1f, 0.9f)
                      sy *= 1f + 0.2f * k
                      sx *= 1f - 0.1f * k
                      expr = Expr.SLEEP
                      mouth = if (k > 0.2f) Mouth.YAWN else Mouth.SMILE
                      sleepT = 0.6f
                  },
                  Clip("jiggle", 1.2f, 1f, CALM) { u, _ ->
                      lean = sin(u * 30f) * 0.3f * (1f - u)
                      sx *= 1f + 0.08f * sin(u * 30f + 1f)
                      expr = Expr.HAPPY
                      mouth = Mouth.GRIN
                  },
                  Clip("boing", 1.5f, 1f, ACTIVE) { u, _ ->
                      if (tickEvery(u, 1.5f, 0.5f) && p.grounded) {
                          hop(0f, -560f * d)
                          snd(Snd.JUMP, 0.5f)
                          fx.fan(p.cx, p.bottom(), 4, 250f * d, -90f, 80f, 2.4f * d)
                      }
                      expr = Expr.HAPPY
                      mouth = Mouth.GRIN
                  },
                  Clip("stretchUp", 1.5f, 1f, CALM) { u, _ ->
                      val k = hump(u)
                      sy *= 1f + 0.35f * k
                      sx *= 1f - 0.15f * k
                      tly = -1f
                      lookIn = 1f
                      mouth = Mouth.O
                  },
                  Clip("puddle", 2.6f, 0.7f, SILLY) { u, _ ->
                      if (once()) {
