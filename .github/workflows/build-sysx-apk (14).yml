                head.addView(Ui.txt(a, title, 13f, Th.TXT, true), LinearLayout.LayoutParams(0, -2, 1f))
                head.addView(Ui.txt(a, "${rows.size}", 11f, Th.DIM).apply { setPadding(0, 0, Th.dpi(10), 0) }); head.addView(chev)
                card.addView(head); card.addView(body)
