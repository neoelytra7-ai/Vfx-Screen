          /** Theme studio: every look-and-feel option in one place. Changes are saved as you go; Apply restyles the app. */
          class ThemeSheet(private val a: MainActivity) {
            val panel = LinearLayout(a)
            val grab: View
            private val rad = Th.dp(26f)
            private val col = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL }
            private val p = Th.p()
            private val swatches = ArrayList<View>()
            private val swatchCols = ArrayList<Pair<Int, Int>>()

            init {
              panel.orientation = LinearLayout.VERTICAL
              panel.setPadding(Th.dpi(18), Th.dpi(6), Th.dpi(18), Th.dpi(16)); panel.isClickable = true
              panel.background = GradientDrawable().apply {
                setColor(0xFA11141D.toInt()); cornerRadii = floatArrayOf(rad, rad, rad, rad, 0f, 0f, 0f, 0f); setStroke(Th.dpi(1), 0x33FFFFFF)
              }
              grab = FrameLayout(a).apply {
                addView(View(a).apply { background = Th.glass(2f, 0x55FFFFFF, 0x00000000) }, FrameLayout.LayoutParams(Th.dpi(40), Th.dpi(4), Gravity.CENTER))
              }
              panel.addView(grab, LinearLayout.LayoutParams(-1, Th.dpi(22)))

              val head = LinearLayout(a).apply { gravity = Gravity.CENTER_VERTICAL }
              head.addView(Ui.txt(a, "Theme studio", 20f, Th.TXT, true), LinearLayout.LayoutParams(0, -2, 1f))
              head.addView(Ui.pill(a, "Reset") { reset() })
              panel.addView(head)
              panel.addView(Ui.txt(a, "Pick a look, then tap Apply. Everything here is saved on this device.", 12f, Th.DIM), Ui.lp(top = 4))

              val sc = ScrollView(a).apply { isVerticalScrollBarEnabled = false; overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS; addView(col, FrameLayout.LayoutParams(-1, -2)) }
              panel.addView(sc, LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = Th.dpi(6) })
              build()
              panel.addView(Ui.btn(a, "Apply") { Th.load(); Ai.studio = true; a.recreate() }, Ui.lp(top = 10))
            }

            fun sheetHeight(): Int = (a.resources.displayMetrics.heightPixels * 0.88f).toInt()

            private fun reset() {
              val e = p.edit()
              for (k in listOf("acc2", "hue", "sat", "accmode", "base", "cardstyle", "rscale", "cop", "edge", "dens", "uifont", "datafont", "tscale", "numw", "labw", "bgstyle", "navstyle", "spd", "feel", "titlestyle")) e.remove(k)
              e.apply(); Th.load(); Ai.studio = true; a.recreate()
            }

            private fun group(title: String): LinearLayout {
              val c = Ui.card(a, 14); c.addView(Ui.h(a, title)); col.addView(c, Ui.lp(top = 12)); return c
            }

            private fun pick(c: LinearLayout, label: String, key: String, names: List<String>, def: Int) {
              c.addView(Ui.txt(a, label, 13f, Th.DIM), Ui.lp(top = 12))
              c.addView(Ui.scrollChoice(a, names, p.getInt(key, def)) { p.edit().putInt(key, it).apply() }, Ui.lp(top = 6))
            }

            private fun sld(c: LinearLayout, label: String, key: String, mn: Float, mx: Float, step: Float, def: Float, fmt: (Float) -> String, after: () -> Unit = {}) {
              val lab = Ui.txt(a, label + "   " + fmt(p.getFloat(key, def)), 13f, Th.DIM)
              c.addView(lab, Ui.lp(top = 12))
              c.addView(Slider(a, mn, mx, p.getFloat(key, def), step, fmt) { v -> p.edit().putFloat(key, v).apply(); lab.text = label + "   " + fmt(v); after() }, Ui.lp(h = Th.dpi(44), top = 2))
            }

            private fun swatchBg(c1: Int, c2: Int, on: Boolean) = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c1, c2)).apply {
              shape = GradientDrawable.OVAL
              if (on) setStroke(Th.dpi(3), 0xFFFFFFFF.toInt()) else setStroke(Th.dpi(1), 0x33FFFFFF)
            }

            private fun paint() {
              val cur = p.getInt("acc2", 0)
              swatchCols[Th.CUSTOM] = Th.customColors()
              swatches.forEachIndexed { i, v -> v.background = swatchBg(swatchCols[i].first, swatchCols[i].second, i == cur) }
            }

            private fun build() {
              val cl = group("Color")
              cl.addView(Ui.txt(a, "Accent", 13f, Th.DIM), Ui.lp(top = 8))
              val row = LinearLayout(a)
              for (i in 0..Th.CUSTOM) {
                val cc = if (i < Th.CUSTOM) Pair(Th.accents[i].second, Th.accents[i].third) else Th.customColors()
                swatchCols.add(cc)
                val v = View(a)
                swatches.add(v)
                Th.fx(v) { p.edit().putInt("acc2", i).apply(); paint() }
                row.addView(v, LinearLayout.LayoutParams(Th.dpi(40), Th.dpi(40)).apply { marginEnd = Th.dpi(10) })
              }
              cl.addView(HorizontalScrollView(a).apply { isHorizontalScrollBarEnabled = false; addView(row) }, Ui.lp(top = 8))
              sld(cl, "Custom hue", "hue", 0f, 360f, 2f, 48f, { "%.0f°".format(it) }) { p.edit().putInt("acc2", Th.CUSTOM).apply(); paint() }
              sld(cl, "Custom saturation", "sat", .3f, 1f, .01f, .85f, { "%.0f%%".format(it * 100) }) { p.edit().putInt("acc2", Th.CUSTOM).apply(); paint() }
              pick(cl, "Accent mode", "accmode", listOf("Gradient", "Solid", "Reverse"), 0)
              pick(cl, "Base palette", "base", Th.bases.map { it.first }, 2)
              paint()

              val sf = group("Surfaces")
              pick(sf, "Card style", "cardstyle", listOf("Glass", "Solid", "Outline", "Flat"), 0)
              sld(sf, "Roundness", "rscale", .2f, 2f, .1f, 1f, { "×%.1f".format(it) })
              sld(sf, "Card opacity", "cop", .4f, 2f, .1f, 1f, { "×%.1f".format(it) })
              sld(sf, "Edge light", "edge", 0f, 2f, .1f, 1f, { "×%.1f".format(it) })
              sld(sf, "Density", "dens", .75f, 1.35f, .05f, 1f, { "×%.2f".format(it) })

              val ty = group("Type")
              pick(ty, "Interface font", "uifont", Fonts.UI.map { it.first }, 1)
              pick(ty, "Data font", "datafont", Fonts.DATA.map { it.first }, 1)
              sld(ty, "Text size", "tscale", .85f, 1.3f, .05f, 1f, { "×%.2f".format(it) })
              sld(ty, "Number weight", "numw", 100f, 700f, 25f, 300f, { "%.0f".format(it) })
              sld(ty, "Label weight", "labw", 300f, 800f, 20f, 560f, { "%.0f".format(it) })

              val bg = group("Background and layout")
              pick(bg, "Background", "bgstyle", listOf("Plain", "Glow", "Aurora (animated)", "Grid", "Dots (reactive)", "Lines"), 4)
              pick(bg, "Navigation", "navstyle", listOf("Floating", "Docked", "Icons only"), 2)
              pick(bg, "Title", "titlestyle", listOf("Gradient", "Solid", "Hidden"), 0)

              val mo = group("Motion")
              sld(mo, "Animation speed", "spd", .5f, 1.8f, .1f, 1f, { "×%.1f".format(it) })
              pick(mo, "Motion feel", "feel", listOf("Bouncy", "Fluid", "Snappy"), 0)
            }
          }
          EOF

          cat > app/src/main/java/dev/sysx/Icons.kt <<'EOF'
          package dev.sysx

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.view.View

          /** One consistent line-icon family: drawn in a 24-unit box, round caps and joins, soft inner fills. */
          object Icons {
            const val INFO = 0
            const val AUTO = 1
            const val BENCH = 2
            const val LIVE = 3
            const val OVERLAY = 4
            const val SPARK = 5
            const val GEAR = 6
            const val SEND = 7

            private val st = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND; strokeJoin = Paint.Join.ROUND }
            private val fl = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
            private val path = Path()
            private val rect = RectF()

            fun draw(cv: Canvas, k: Int, cx: Float, cy: Float, sz: Float, color: Int, sw: Float = 1.8f) {
              val u = sz / 24f
              cv.save(); cv.translate(cx - sz / 2f, cy - sz / 2f); cv.scale(u, u)
              st.color = color; st.strokeWidth = sw
              fl.color = Th.alpha(color, 60)
              when (k) {
                INFO -> {
                  rect.set(6f, 6f, 18f, 18f); cv.drawRoundRect(rect, 2.6f, 2.6f, fl); cv.drawRoundRect(rect, 2.6f, 2.6f, st)
                  for (p in floatArrayOf(9.5f, 12f, 14.5f)) {
                    cv.drawLine(p, 3f, p, 6f, st); cv.drawLine(p, 18f, p, 21f, st)
                    cv.drawLine(3f, p, 6f, p, st); cv.drawLine(18f, p, 21f, p, st)
                  }
                  fl.color = color; rect.set(10f, 10f, 14f, 14f); cv.drawRoundRect(rect, 1f, 1f, fl)
                }
                AUTO -> {
                  path.reset(); path.moveTo(13.4f, 2.8f); path.lineTo(5.2f, 13.4f); path.lineTo(11f, 13.4f)
                  path.lineTo(10.2f, 21.2f); path.lineTo(18.8f, 10.4f); path.lineTo(13f, 10.4f); path.close()
                  cv.drawPath(path, fl); cv.drawPath(path, st)
                }
                BENCH -> {
                  rect.set(3f, 4f, 21f, 22f); cv.drawArc(rect, 150f, 240f, false, st)
                  cv.drawLine(12f, 13f, 16.6f, 8.4f, st)
                  fl.color = color; cv.drawCircle(12f, 13f, 1.9f, fl)
                }
                LIVE -> {
                  path.reset(); path.moveTo(3f, 13f); path.lineTo(7f, 13f); path.lineTo(10f, 5f); path.lineTo(14f, 19f); path.lineTo(17f, 11f); path.lineTo(21f, 11f)
                  cv.drawPath(path, st)
                }
                OVERLAY -> {
                  rect.set(3f, 4f, 15.5f, 15f); cv.drawRoundRect(rect, 2.4f, 2.4f, st)
                  rect.set(8.5f, 9f, 21f, 20f); cv.drawRoundRect(rect, 2.4f, 2.4f, fl); cv.drawRoundRect(rect, 2.4f, 2.4f, st)
                }
                SPARK -> {
                  path.reset(); path.moveTo(12f, 3f)
                  path.cubicTo(12.8f, 8.5f, 15.5f, 11.2f, 21f, 12f); path.cubicTo(15.5f, 12.8f, 12.8f, 15.5f, 12f, 21f)
                  path.cubicTo(11.2f, 15.5f, 8.5f, 12.8f, 3f, 12f); path.cubicTo(8.5f, 11.2f, 11.2f, 8.5f, 12f, 3f); path.close()
                  cv.drawPath(path, fl); cv.drawPath(path, st)
                }
                GEAR -> {
                  cv.drawCircle(12f, 12f, 3f, st); cv.drawCircle(12f, 12f, 7f, st)
                  for (i in 0 until 8) {
                    val a = i * Math.PI / 4.0; val c = Math.cos(a).toFloat(); val s = Math.sin(a).toFloat()
                    cv.drawLine(12f + 7f * c, 12f + 7f * s, 12f + 9.8f * c, 12f + 9.8f * s, st)
                  }
                }
                SEND -> {
                  path.reset(); path.moveTo(20.5f, 3.5f); path.lineTo(3.5f, 10.8f); path.lineTo(10.4f, 13.6f); path.lineTo(13.2f, 20.5f); path.close()
                  cv.drawPath(path, fl); cv.drawPath(path, st); cv.drawLine(10.4f, 13.6f, 20.5f, 3.5f, st)
                }
              }
              cv.restore()
            }
          }

          class IconView(c: Context, private val kind: Int) : View(c) {
            var tint: Int = Th.TXT
            override fun onDraw(cv: Canvas) {
              Icons.draw(cv, kind, width / 2f, height / 2f, Math.min(width, height) * .5f, tint)
            }
          }
          EOF

          if [ -z "$SYSX_API" ]; then
            echo "::warning::Repository variable SYSX_API is not set - AI sign-in is disabled in this build"
            SYSX_API="https://sysx-ai.example.workers.dev"
          fi
          sed -i "s|__SYSX_API__|${SYSX_API%/}|g" app/src/main/java/dev/sysx/Ai.kt
          mkdir -p app/src/main/assets/fonts
          GF="https://github.com/google/fonts/raw/main/ofl"
          fetch_font() {
            curl -fsSL --retry 3 -o "app/src/main/assets/fonts/$2" "$GF/$1" || true
            if [ ! -s "app/src/main/assets/fonts/$2" ]; then rm -f "app/src/main/assets/fonts/$2"; echo "::warning::font $2 not downloaded, the app falls back to the system font"; fi
          }
          fetch_font "spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" SpaceGrotesk.ttf
          fetch_font "jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" JetBrainsMono.ttf
          fetch_font "sora/Sora%5Bwght%5D.ttf" Sora.ttf
          fetch_font "exo2/Exo2%5Bwght%5D.ttf" Exo2.ttf
          fetch_font "orbitron/Orbitron%5Bwght%5D.ttf" Orbitron.ttf
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M0,0h108v108h-108z">
              <aapt:attr name="android:fillColor">
                <gradient android:type="radial" android:centerX="54" android:centerY="44" android:gradientRadius="86">
                  <item android:color="#FF202026" android:offset="0"/>
                  <item android:color="#FF050507" android:offset="1"/>
                </gradient>
              </aapt:attr>
            </path>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M35.6,72.4 A26,26 0 1 1 72.4,72.4" android:strokeColor="#33FFFFFF" android:strokeWidth="5" android:strokeLineCap="round" android:fillColor="#00000000"/>
            <path android:pathData="M35.6,72.4 A26,26 0 1 1 77.6,43" android:strokeWidth="5" android:strokeLineCap="round" android:fillColor="#00000000">
              <aapt:attr name="android:strokeColor">
                <gradient android:type="linear" android:startX="30" android:startY="76" android:endX="80" android:endY="40">
                  <item android:color="#FFFFB300" android:offset="0"/>
                  <item android:color="#FFFFE14D" android:offset="1"/>
                </gradient>
              </aapt:attr>
            </path>
            <path android:pathData="M36,55 H44 L49,43 L56,67 L62,49 L66,55 H72" android:strokeColor="#FFFFFFFF" android:strokeWidth="3.6" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
            <path android:pathData="M74.2,43 a3.4,3.4 0 1 0 6.8,0 a3.4,3.4 0 1 0 -6.8,0" android:fillColor="#FFFFE14D"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_launcher_mono.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M35.6,72.4 A26,26 0 1 1 77.6,43" android:strokeColor="#FFFFFFFF" android:strokeWidth="5" android:strokeLineCap="round" android:fillColor="#00000000"/>
            <path android:pathData="M36,55 H44 L49,43 L56,67 L62,49 L66,55 H72" android:strokeColor="#FFFFFFFF" android:strokeWidth="3.6" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
            <path android:pathData="M74.2,43 a3.4,3.4 0 1 0 6.8,0 a3.4,3.4 0 1 0 -6.8,0" android:fillColor="#FFFFFFFF"/>
          </vector>
          EOF
          for n in ic_launcher ic_launcher_round; do
            cat > app/src/main/res/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_bg"/>
            <foreground android:drawable="@drawable/ic_launcher_fg"/>
            <monochrome android:drawable="@drawable/ic_launcher_mono"/>
          </adaptive-icon>
          EOF
          done

      - name: Build release APK
        working-directory: sysx
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp sysx/app/build/outputs/apk/release/app-release.apk SysX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SysX-apk
          path: SysX.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SysX.apk
