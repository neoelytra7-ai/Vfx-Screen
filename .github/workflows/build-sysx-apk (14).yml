                background = GradientDrawable().apply { setColor(0xFA11141D.toInt()); cornerRadii = floatArrayOf(r, r, r, r, 0f, 0f, 0f, 0f); setStroke(Th.dpi(1), 0x33FFFFFF) }
              }
