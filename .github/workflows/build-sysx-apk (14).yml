          cat > app/src/main/java/dev/sysx/PBench.kt <<'EOF'
          package dev.sysx

          import android.content.Intent
          import android.os.Build
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.atomic.AtomicBoolean

          class PBench(a: MainActivity) : Page(a) {
            private val col = LinearLayout(a)
            override val root: View = Ui.scroll(a, col)
            private val ring = Ring(a); private val radar = Radar(a)
            private val status = Ui.txt(a, "Pick what to test, then run", 12.5f, Th.DIM).apply { gravity = Gravity.CENTER }
            private val badge = Ui.txt(a, "", 12f, Th.DIM, true).apply { gravity = Gravity.CENTER }
            private val notesTx = Ui.txt(a, "", 12f, Th.DIM)
            private val cats = LinkedHashSet<String>(BR.CATS)
            private var scale = 1.0; private var samples = 5; private var running = false; private var stressing = false
            private val cancel = AtomicBoolean(false)
            private val estimate = Ui.txt(a, "", 12f, Th.DIM)
            private val resBox = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL }
            private val resLines = ArrayList<String>()
            private val hist = Spark(a, "SCORE HISTORY", "", 0f)
            private val histTxt = Ui.txt(a, "", 11f, Th.DIM, mono = true)
            private val stressSp = Spark(a, "STRESS · relative performance", "%", 0f, 110f)
            private val stressTx = Ui.txt(a, "Runs all cores for 30 s and measures thermal throttling.", 12f, Th.DIM)
            private val stopBtn = Ui.pill(a, "Stop") { cancel.set(true) }
            private var lastTotal = 0; private var lastSummary: BR.Summary? = null

            init {
              val hero = Ui.card(a, 12)
              hero.addView(ring, LinearLayout.LayoutParams(-1, Th.dpi(200)))
              hero.addView(status)
              hero.addView(badge, Ui.lp(top = 4))
              hero.addView(radar, Ui.lp(h = Th.dpi(210), top = 6))
              Ui.add(col, hero, 6)
              ring.set(0f, "0", "", "SCORE")
              radar.set(BR.CATS, BR.CATS.map { 0f })

              val cc = Ui.card(a, 12); cc.addView(Ui.h(a, "Test suites"))
              cc.addView(Ui.grid(a, BR.CATS.map { c -> Ui.chip(a, c, true) { on -> if (on) cats.add(c) else cats.remove(c); est() } }, 3), Ui.lp(top = 6))
              cc.addView(Ui.txt(a, "Accuracy", 13f, Th.DIM), Ui.lp(top = 12))
              cc.addView(Ui.choice(a, listOf("Quick", "Standard", "Precise", "Extreme"), 1) { i -> samples = intArrayOf(3, 5, 9, 15)[i]; est() }, Ui.lp(top = 6))
              val lab = Ui.txt(a, "Window length  ×1.00", 13f, Th.DIM)
              cc.addView(lab, Ui.lp(top = 12))
              cc.addView(Slider(a, .5f, 2f, 1f, .25f, { "×%.2f".format(it) }) { v -> scale = v.toDouble(); lab.text = "Window length  ×%.2f".format(v); est() }, Ui.lp(h = Th.dpi(46)))
              cc.addView(estimate, Ui.lp(top = 4))
              cc.addView(Ui.btn(a, "Run benchmark") { run() }, Ui.lp(top = 10))
              stopBtn.visibility = View.GONE
              cc.addView(stopBtn, Ui.lp(top = 8))
              Ui.add(col, cc)
              est()

              Ui.add(col, resBox, 12)
              notesTx.visibility = View.GONE
              Ui.add(col, notesTx, 8)

              val sc = Ui.card(a, 12); sc.addView(Ui.h(a, "Throttle / stability test"))
              sc.addView(stressSp, Ui.lp(h = Th.dpi(96), top = 6)); sc.addView(stressTx, Ui.lp(top = 6))
              sc.addView(Ui.pill(a, "Start 30 s stress test") { stress() }, Ui.lp(top = 10))
              Ui.add(col, sc)

              val hc = Ui.card(a, 12); hc.addView(hist, Ui.lp(h = Th.dpi(96))); hc.addView(histTxt, Ui.lp(top = 8))
              val hb = LinearLayout(a)
              hb.addView(Ui.pill(a, "↗ Share") { share() }, LinearLayout.LayoutParams(0, -2, 1f).apply { marginEnd = Th.dpi(8) })
              hb.addView(Ui.pill(a, "Clear history") { Th.p().edit().remove("bhist").apply(); loadHist(); a.toast("History cleared") }, LinearLayout.LayoutParams(0, -2, 1f))
              hc.addView(hb, Ui.lp(top = 10)); Ui.add(col, hc)
              loadHist()
            }

            private fun est() {
              val n = BR.ALL.count { it.cat in cats }
              val sec = n * (samples + 2.5) * 0.32 * scale + n * 0.4
              estimate.text = "$n tests · about ${if (sec < 90) "${sec.toInt()} s" else "%.1f min".format(sec / 60)} · more samples = tighter spread"
            }

            private fun fv(v: Double) = if (v >= 1000) "%.0f".format(v) else if (v >= 100) "%.1f".format(v) else "%.2f".format(v)

            private fun histArr(): JSONArray = try { JSONArray(Th.p().getString("bhist", "[]")) } catch (e: Throwable) { JSONArray() }
            private fun loadHist() {
              val h = histArr(); hist.load((0 until h.length()).map { h.getJSONObject(it).optInt("s").toFloat() })
              val f = SimpleDateFormat("MMM d HH:mm", Locale.US)
              histTxt.text = if (h.length() == 0) "No runs yet" else (h.length() - 1 downTo maxOf(0, h.length() - 5)).joinToString("\n") {
                val o = h.getJSONObject(it)
                "${f.format(Date(o.optLong("t")))}   ${o.optInt("s")}" + (if (o.has("a")) "  ·  1T ${o.optInt("a")}  ·  nT ${o.optInt("m")}" else "")
              } + "\nbest ${(0 until h.length()).maxOf { h.getJSONObject(it).optInt("s") }}"
            }

            private fun addRow(r: BR.Res) {
              val st = r.st
              val tags = (if (st.throttled) "  ▼ clocks dropped" else "") + (if (st.cached) "  ≈ cached" else "")
              val line = r.t.name.padEnd(24) + (if (st.v > 0) fv(st.v) + " " + r.t.unit + "  ±" + "%.1f".format(st.cov) + "%" else "n/a") + tags
              resLines.add(line)
              val row = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL; background = Th.panel(16f); setPadding(Th.dpi(14), Th.dpi(10), Th.dpi(14), Th.dpi(12)) }
              val top = LinearLayout(a).apply { gravity = Gravity.CENTER_VERTICAL }
              top.addView(Ui.txt(a, r.t.name, 13.5f, Th.TXT, true), LinearLayout.LayoutParams(0, -2, 1f))
              top.addView(Ui.num(a, if (st.v > 0) fv(st.v) else "n/a", 18f, Th.a1))
              if (st.v > 0) top.addView(Ui.txt(a, " " + r.t.unit, 11f, Th.DIM), LinearLayout.LayoutParams(-2, -2).apply { topMargin = Th.dpi(4) })
              val grade = if (st.cov < 2.0) 0xFF7DE0A0.toInt() else if (st.cov < 5.0) 0xFFFFD166.toInt() else 0xFFFF7A6B.toInt()
              val sub = if (st.v > 0) "±" + "%.1f".format(st.cov) + "%   " + fv(st.lo) + " – " + fv(st.hi) + "   " + st.n + " samples" + tags else "not supported on this device"
              val m = Meter(a)
              row.addView(top)
              row.addView(Ui.txt(a, sub, 11f, if (st.v > 0) grade else Th.DIM), Ui.lp(top = 2))
              row.addView(m, Ui.lp(h = Th.dpi(8), top = 8)); resBox.addView(row, Ui.lp(top = 8))
              if (Th.anim) { row.alpha = 0f; row.translationX = Th.dp(40f); row.animate().alpha(1f).translationX(0f).setDuration(Th.d(420)).setInterpolator(Th.EMPH).start() }
              m.post { m.set((r.ratio / 1.5).toFloat()) }
            }

            private fun run() {
              if (running || stressing) return
              if (cats.isEmpty()) { a.toast("Select at least one suite"); return }
              running = true; cancel.set(false); resBox.removeAllViews(); resLines.clear(); notesTx.visibility = View.GONE; badge.text = ""
              stopBtn.visibility = View.VISIBLE
              a.window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              val sel = LinkedHashSet(cats); val sc = scale; val sm = samples
              Thread {
                var sum: BR.Summary? = null
                try {
                  sum = BR.run(a, sel, sm, sc, { n, f -> a.runOnUiThread { ring.set(f, "${(f * 100).toInt()}", "%", n.uppercase().take(18)); status.text = "Running · $n" } }, { res -> a.runOnUiThread { addRow(res) } }, { cancel.get() })
                } catch (e: Throwable) { a.runOnUiThread { status.text = "Error: ${e.message}" } }
                val done = sum
                a.runOnUiThread { finish(done) }
              }.start()
            }

            private fun finish(sm: BR.Summary?) {
              running = false; stopBtn.visibility = View.GONE
              if (!Th.p().getBoolean("keepon", false)) a.window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              if (sm == null) return
              lastSummary = sm; lastTotal = sm.total
              ring.set((sm.total / 2000f).coerceAtMost(1f), "${sm.total}", "", "SCORE")
              radar.set(BR.CATS, BR.CATS.map { ((sm.cats[it] ?: 0) / 1500f).coerceIn(0f, 1.1f) })
              status.text = (if (sm.single > 0) "Single ${sm.single}" else "") + (if (sm.multi > 0) "  ·  Multi ${sm.multi}" else "") +
                (if (sm.scaling > 0) "  ·  ${"%.1f".format(sm.scaling)}× scaling" else "") + (if (cancel.get()) "  ·  stopped" else "")
              badge.text = "Confidence ${sm.grade}  ·  ±${"%.1f".format(sm.avgCov)}% run-to-run"
              badge.setTextColor(if (sm.grade == "A") 0xFF7DE0A0.toInt() else if (sm.grade == "B") 0xFFFFD166.toInt() else 0xFFFF7A6B.toInt())
              if (sm.notes.isNotEmpty()) { notesTx.text = sm.notes.joinToString("\n\n") { "• $it" }; notesTx.visibility = View.VISIBLE }
              if (sm.total > 0 && !cancel.get()) {
                val h = histArr(); h.put(JSONObject().put("t", System.currentTimeMillis()).put("s", sm.total).put("a", sm.single).put("m", sm.multi))
                while (h.length() > 20) h.remove(0)
                Th.p().edit().putString("bhist", h.toString()).apply(); loadHist()
              }
              Th.hap(ring, true); a.toast("Score ${sm.total}")
            }

            private fun stress() {
              if (running || stressing) return
              stressing = true; stressSp.load(emptyList()); a.window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              Thread {
                val sum = try { BR.stress(a, 30) { rel, t, mhz, left -> a.runOnUiThread { stressSp.push(rel * 100); stressTx.text = "${left}s left · ${Th.temp(t)} · ${mhz} MHz" } } } catch (e: Throwable) { "Error: ${e.message}" }
                a.runOnUiThread { stressTx.text = sum; stressing = false; if (!Th.p().getBoolean("keepon", false)) a.window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); Th.hap(stressSp, true) }
              }.start()
            }

            private fun share() {
              val s = lastSummary
              val head = "SysX benchmark — ${Build.MODEL}\nScore $lastTotal" + (if (s != null) "  (1T ${s.single} · nT ${s.multi} · confidence ${s.grade} ±${"%.1f".format(s.avgCov)}%)" else "")
              val t = head + "\n" + resLines.joinToString("\n")
              a.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, t), "Share results"))
            }

            override fun onShow() { Ui.stagger(col) }
          }
