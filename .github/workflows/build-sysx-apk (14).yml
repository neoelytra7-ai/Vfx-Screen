            }

            /** Drag the handle down to dismiss; the sheet follows the finger and flings away. */
            private fun dragClose(handle: View, panel: View) {
              var y0 = 0f; var ly = 0f; var lt = 0L; var vy = 0f
              handle.setOnTouchListener { _, e ->
                val scrim = (sheet as? FrameLayout)?.getChildAt(0)
                when (e.actionMasked) {
                  MotionEvent.ACTION_DOWN -> { (panel.tag as? Spring)?.stop(); panel.animate().cancel(); y0 = e.rawY; ly = e.rawY; lt = e.eventTime; vy = 0f }
                  MotionEvent.ACTION_MOVE -> {
                    val d = e.rawY - y0
                    panel.translationY = if (d > 0f) d else d * .12f
                    scrim?.alpha = 1f - (d / panel.height.coerceAtLeast(1)).coerceIn(0f, 1f) * .8f
                    val dt = (e.eventTime - lt).coerceAtLeast(1L)
                    vy = vy * .6f + ((e.rawY - ly) / dt * 1000f) * .4f; ly = e.rawY; lt = e.eventTime
                  }
                  MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                    if (e.actionMasked == MotionEvent.ACTION_UP && (panel.translationY > panel.height * .3f || vy > 1400f)) closeSheet()
                    else {
                      val back = Spring(panel.translationY, 420f, 34f, 0.3f) { z -> panel.translationY = z }
                      panel.tag = back; back.to(0f, vy.coerceIn(-2500f, 2500f))
                      scrim?.animate()?.alpha(1f)?.setDuration(Th.d(220))?.start()
                    }
                  }
                }
                true
              }
            }

            fun showTheme() {
              if (sheet != null) return
              val root = FrameLayout(this)
              val scrim = View(this).apply { setBackgroundColor(0xB0000000.toInt()); alpha = 0f; setOnClickListener { closeSheet() } }
              root.addView(scrim, FrameLayout.LayoutParams(-1, -1))
              val ui = ThemeSheet(this)
