                val up = Spring(ui.panel.height.toFloat(), 380f, 40f, 0.3f) { z -> ui.panel.translationY = z }
                ui.panel.tag = up; up.to(0f)
                if (prefill != null) ui.ask(prefill)
              }
            }

            private fun showSettings() {
              if (sheet != null) return
              val p = Th.p()
              val root = FrameLayout(this)
              val scrim = View(this).apply { setBackgroundColor(0xB0000000.toInt()); alpha = 0f; setOnClickListener { closeSheet() } }
              root.addView(scrim, FrameLayout.LayoutParams(-1, -1))
