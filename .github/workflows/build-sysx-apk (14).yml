          package dev.sysx

          import android.graphics.Typeface
          import android.os.Build

          /**
           * Techy typefaces, downloaded into assets at build time (variable fonts, so any weight is available).
           * If a file is missing the system font is used, so the app never depends on the download.
           */
          object Fonts {
            val UI = listOf("System" to "", "Space Grotesk" to "SpaceGrotesk.ttf", "Sora" to "Sora.ttf", "Exo 2" to "Exo2.ttf", "Orbitron" to "Orbitron.ttf")
            val DATA = listOf("System mono" to "", "JetBrains Mono" to "JetBrainsMono.ttf", "Space Grotesk" to "SpaceGrotesk.ttf")
            private val cache = HashMap<String, Typeface>()

            private fun load(file: String, w: Int): Typeface? = try {
              Typeface.Builder(Th.app.assets, "fonts/" + file).setFontVariationSettings("'wght' " + w).setWeight(w).build()
            } catch (e: Throwable) { null }

            private fun sys(mono: Boolean, w: Int): Typeface {
              val base = if (mono) Typeface.MONOSPACE else Typeface.SANS_SERIF
              return if (Build.VERSION.SDK_INT >= 28) Typeface.create(base, w, false)
              else if (mono) (if (w >= 600) Typeface.create(Typeface.MONOSPACE, Typeface.BOLD) else Typeface.MONOSPACE)
              else Typeface.create(if (w >= 500) "sans-serif-medium" else "sans-serif", Typeface.NORMAL)
            }

            private fun pick(file: String, mono: Boolean, w: Int): Typeface {
              val wt = w.coerceIn(100, 900)
              val key = file + ":" + mono + ":" + wt
              val hit = cache[key]
              if (hit != null) return hit
              val tf = (if (file.isEmpty()) null else load(file, wt)) ?: sys(mono, wt)
              cache[key] = tf
              return tf
            }

            fun ui(w: Int): Typeface = pick(UI[Th.uiFont.coerceIn(0, UI.size - 1)].second, false, w)
            fun data(w: Int): Typeface = pick(DATA[Th.dataFont.coerceIn(0, DATA.size - 1)].second, true, w)
            fun num(): Typeface = data(Th.numW)
          }
