              a.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, "SysX report — ${Build.MODEL}\n$report"), "Share report"))
            }

            override fun onShow() { if (loaded) Ui.stagger(col) else Ui.stagger(col) }
          }
