              val dt = RandomAccessFile(f, "r").use { r ->
                val t0 = System.nanoTime()
                for (i in 0 until ops) { s = s * 1103515245 + 12345; r.seek(((s ushr 8) % 24000).toLong() * 4096); r.read(b) }
                (System.nanoTime() - t0) / 1e9
              }
              sink = b[1].toLong()
              return ops / dt
            }

            private fun storageStat(f: (Context, Long) -> Double, cached: Boolean): (Context, Int, Long) -> Stat? = { c, n, ms ->
              val xs = ArrayList<Double>(); f(c, ms)
              for (i in 0 until Math.min(Math.max(3, n), 5)) xs.add(f(c, ms))
              val s = stat(xs, false, cached); s
            }

            // ---------------------------------------------------------------- the suite
            val ALL: List<T> = listOf(
              T("int", "Integer", "CPU", "M iter/s", 200.0, false, { _, ms -> intT(ms) }),
              T("flt", "Floating point", "CPU", "M iter/s", 25.0, false, { _, ms -> fltT(ms) }),
              T("mat", "Matrix multiply", "CPU", "GFLOPS", 2.5, false, { _, ms -> matT(ms) }),
              T("sort", "Sort 200k ints", "CPU", "M keys/s", 60.0, false, { _, ms -> sortT(ms) }),
              T("mandel", "Mandelbrot", "CPU", "M iter/s", 220.0, false, { _, ms -> mandelT(ms) }),
              T("sieve", "Prime sieve", "CPU", "M nums/s", 200.0, false, { _, ms -> sieveT(ms) }),
              T("json", "JSON parse", "CPU", "MB/s", 30.0, false, { _, ms -> jsonT(ms) }),

              T("intN", "Integer all cores", "Multi", "M iter/s", 900.0, false, { _, ms -> multi(ms) { intT(it) } }),
              T("fltN", "Float all cores", "Multi", "M iter/s", 110.0, false, { _, ms -> multi(ms) { fltT(it) } }),
              T("sortN", "Sort all cores", "Multi", "M keys/s", 250.0, false, { _, ms -> multi(ms) { sortT(it) } }),
              T("mandelN", "Mandelbrot all cores", "Multi", "M iter/s", 1000.0, false, { _, ms -> multi(ms) { mandelT(it) } }),

              T("memR", "Memory read", "Memory", "GB/s", 8.0, false, { _, ms -> memRead(ms) }),
              T("memW", "Memory write", "Memory", "GB/s", 10.0, false, { _, ms -> memWrite(ms) }),
              T("memC", "Memory copy", "Memory", "GB/s", 12.0, false, { _, ms -> memCopy(ms) }),
              T("latL1", "Latency L1 (16 KB)", "Memory", "ns", 1.6, true, latT(16 * 1024)),
              T("latL2", "Latency L2 (256 KB)", "Memory", "ns", 4.5, true, latT(256 * 1024)),
              T("latL3", "Latency L3 (6 MB)", "Memory", "ns", 14.0, true, latT(6 * 1024 * 1024)),
              T("latM", "Latency RAM (48 MB)", "Memory", "ns", 120.0, true, latT(48 * 1024 * 1024)),

              T("aes", "AES-128 CBC", "Crypto", "MB/s", 900.0, false, { _, ms -> aesT(ms) }),
              T("sha", "SHA-256", "Crypto", "MB/s", 600.0, false, { _, ms -> shaT(ms) }),
              T("crc", "CRC32", "Crypto", "MB/s", 3000.0, false, { _, ms -> crcT(ms) }),
              T("zip", "Deflate", "Crypto", "MB/s", 30.0, false, { _, ms -> zipT(ms) }),

              T("gpuA", "Shader ALU (1024²)", "GPU", "fps", 40.0, false, { _, _ -> 0.0 }, gpuStat(ALU, 1024, 2, false, 0.5)),
              T("gpuF", "Fill rate (2048²)", "GPU", "Gpix/s", 3.0, false, { _, _ -> 0.0 }, gpuStat(FILL, 2048, 6, true, 2048.0 * 2048.0 / 1e9)),

              T("sw", "Write sequential", "Storage", "MB/s", 250.0, false, { c, ms -> stoSeqWrite(c, ms) }, storageStat({ c, ms -> stoSeqWrite(c, ms) }, false)),
              T("sr", "Read sequential (cached)", "Storage", "MB/s", 1500.0, false, { c, ms -> stoSeqRead(c, ms) }, storageStat({ c, ms -> stoSeqRead(c, ms) }, true)),
              T("rw", "Random 4K write + sync", "Storage", "IOPS", 1500.0, false, { c, ms -> stoRandWrite(c, ms) }, storageStat({ c, ms -> stoRandWrite(c, ms) }, false)),
              T("rr", "Random 4K read (cached)", "Storage", "IOPS", 100000.0, false, { c, ms -> stoRandRead(c, ms) }, storageStat({ c, ms -> stoRandRead(c, ms) }, true))
            )

            private fun gm(xs: List<Double>): Double = if (xs.isEmpty()) 0.0 else Math.exp(xs.map { Math.log(Math.max(it, 1e-6)) }.average())

            /**
             * samples: windows measured per test. win: window length multiplier. Returns the full summary.
             */
            fun run(c: Context, sel: Set<String>, samples: Int, win: Double, prog: (String, Float) -> Unit, res: (Res) -> Unit, cancel: () -> Boolean): Summary {
              android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_DISPLAY)
              val notes = ArrayList<String>()
              val pm = c.getSystemService(Context.POWER_SERVICE) as PowerManager
              if (pm.isPowerSaveMode) notes.add("Battery saver was on, which caps the CPU. Turn it off for a true score.")
              val tests = ALL.filter { it.cat in sel }
              val ms = (320 * win).toLong().coerceAtLeast(120L)
              val out = ArrayList<Res>(); var throttled = 0
              chains.clear()
              for ((i, t) in tests.withIndex()) {
                if (cancel()) break
                prog(t.name, i / tests.size.toFloat())
                val st = t.custom?.invoke(c, samples, ms) ?: measure(samples, ms, cancel) { w -> t.run(c, w) }
                if (st.throttled) throttled++
                val ratio = if (st.v <= 0.0) 0.0 else if (t.lower) t.ref / st.v else st.v / t.ref
                val r = Res(t, st, ratio); out.add(r); res(r)
                if (t.id == "latM") chains.clear()
              }
              chains.clear()
              File(c.cacheDir, "sx_seq.bin").delete(); File(c.cacheDir, "sx_rnd.bin").delete()
              prog("Done", 1f)

              val w = mapOf("CPU" to 3.0, "Multi" to 3.0, "Memory" to 1.5, "Crypto" to 1.0, "GPU" to 1.5, "Storage" to 1.0)
              val cs = LinkedHashMap<String, Int>()
              for (cat in CATS) { val rs = out.filter { it.t.cat == cat && it.ratio > 0.0 }.map { it.ratio }; if (rs.isNotEmpty()) cs[cat] = (gm(rs) * 1000).toInt() }
              var sw = 0.0; var sl = 0.0
              for ((k, v) in cs) { val wt = w[k] ?: 1.0; sw += wt; sl += wt * Math.log(Math.max(v, 1).toDouble()) }
              val total = if (sw > 0.0) Math.exp(sl / sw).toInt() else 0
              val single = (gm(out.filter { it.t.cat == "CPU" && it.ratio > 0.0 }.map { it.ratio }) * 1000).toInt()
              val multi = (gm(out.filter { it.t.cat == "Multi" && it.ratio > 0.0 }.map { it.ratio }) * 1000).toInt()
              fun valOf(id: String) = out.firstOrNull { it.t.id == id }?.st?.v ?: 0.0
              val sc = listOf(valOf("intN") / Math.max(valOf("int"), 1e-9), valOf("fltN") / Math.max(valOf("flt"), 1e-9)).filter { it > 0.0 && valOf("int") > 0.0 && valOf("flt") > 0.0 }
              val scaling = if (sc.isEmpty()) 0.0 else sc.average()
              val covs = out.filter { !it.st.cached }.map { it.st.cov }
              val avg = if (covs.isEmpty()) 0.0 else covs.average()
              val grade = if (avg < 2.0) "A" else if (avg < 4.0) "B" else if (avg < 8.0) "C" else "D"
              if (throttled > 0) notes.add(throttled.toString() + " test" + (if (throttled > 1) "s" else "") + " ran while the CPU clocks dropped more than 18%. Let the phone cool and run again for a cleaner number.")
              if (out.any { it.st.cached }) notes.add("Read tests marked cached are served from RAM by the OS, so they measure the cache path rather than the flash chip.")
              return Summary(total, cs, single, multi, scaling, grade, avg, notes, out)
            }

            fun stress(c: Context, secs: Int, cb: (Float, Double, Long, Int) -> Unit): String {
              val ops = AtomicLong(); val stop = AtomicBoolean(false)
              val ts = (0 until S.n).map {
                Thread { var x = 1L; while (!stop.get()) { for (i in 0 until 200000) { x = x * 6364136223846793005L + 1442695040888963407L; x = x xor (x ushr 29) }; ops.addAndGet(200000) }; sink = x }.also { it.start() }
              }
              var last = 0L; var base = 0.0; val rels = ArrayList<Float>(); var peak = 0L; var lastF = 0L; val t0 = S.tmax(); var tmx = t0
              for (s in 1..secs) {
                Thread.sleep(1000); val o = ops.get(); val d = (o - last).toDouble(); last = o
                if (s <= 2 && d > base) base = d
                val rel = if (base > 0) (d / base).toFloat() else 1f; rels.add(rel)
                val mhz = S.freqs().maxOrNull() ?: 0L; if (mhz > peak) peak = mhz; lastF = mhz
                val tc = S.tmax(); if (tc > tmx) tmx = tc
                cb(rel, tc, mhz, secs - s)
              }
              stop.set(true); ts.forEach { it.join() }
              val tail = rels.takeLast(5).average(); val worst = rels.minOrNull() ?: 1f
              return "Sustained ${"%.0f".format(tail * 100)}% of peak (worst ${"%.0f".format(worst * 100)}%) · throttle ${"%.0f".format(Math.max(0.0, (1 - tail) * 100))}%\n" +
                "Peak ${peak}MHz → end ${lastF}MHz · temp ${Th.temp(t0)} → ${Th.temp(tmx)}"
            }
          }
          EOF

