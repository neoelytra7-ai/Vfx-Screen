              root.addView(ui.panel, FrameLayout.LayoutParams(-1, ui.sheetHeight(), Gravity.BOTTOM))
              frame.addView(root, FrameLayout.LayoutParams(-1, -1)); sheet = root
              scrim.animate().alpha(1f).setDuration(Th.d(250)).start()
              ui.panel.visibility = View.INVISIBLE
              ui.panel.post {
                ui.panel.translationY = ui.panel.height.toFloat(); ui.panel.visibility = View.VISIBLE
                val up = Spring(ui.panel.height.toFloat(), 380f, 40f, 0.3f) { z -> ui.panel.translationY = z }
                ui.panel.tag = up; up.to(0f)
              }
            }

