name: Build SysX APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        env:
          SYSX_API: ${{ vars.SYSX_API }}
        run: |
          set -e
          mkdir -p sysx/app/src/main/java/dev/sysx sysx/app/src/main/res/layout sysx/app/src/main/res/xml
          cd sysx

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SysX"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "dev.sysx"
            compileSdk = 34
            defaultConfig { applicationId = "dev.sysx"; minSdk = 26; targetSdk = 34; versionCode = 4; versionName = "4.0" }
            buildTypes { release { isMinifyEnabled = false; signingConfig = signingConfigs.getByName("debug") } }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <application android:name=".App" android:label="SysX" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:allowBackup="false"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize" android:launchMode="singleTask" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="sysx" android:host="auth"/>
                </intent-filter>
              </activity>
              <service android:name=".Core" android:exported="false" android:foregroundServiceType="specialUse">
                <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="system monitoring and automation"/>
              </service>
              <receiver android:name=".StatsWidget" android:exported="false">
                <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
              </receiver>
            <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp" android:minHeight="110dp" android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget" android:resizeMode="horizontal|vertical"/>
          EOF

          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root" android:layout_width="match_parent" android:layout_height="match_parent"
              android:padding="10dp" android:background="#D90F1419">
            <TextView android:id="@+id/w_txt" android:layout_width="match_parent" android:layout_height="wrap_content"
                android:textColor="#E6FFFFFF" android:textSize="12sp" android:typeface="monospace"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/dev/sysx/S.kt <<'EOF'
          package dev.sysx

          import android.app.ActivityManager
          import android.content.*
          import android.net.*
          import android.opengl.*
          import android.os.*
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*

          object S {
            const val DEF_W = "🔋 {battery}%  {temp}°C\nRAM free {ramfree} MB\nCPU {cpu} MHz  🌡 {thermal}°C\n↓{down} ↑{up} KB/s\n{time}"
            fun rd(p: String): String? = try { File(p).readText().trim() } catch (e: Throwable) { null }
            val n get() = Runtime.getRuntime().availableProcessors()
            fun cpu(i: Int, f: String) = rd("/sys/devices/system/cpu/cpu$i/cpufreq/$f")
            fun freqs() = (0 until n).map { (cpu(it, "scaling_cur_freq")?.toLongOrNull() ?: 0L) / 1000 }
            fun maxf() = (0 until n).map { (cpu(it, "cpuinfo_max_freq")?.toLongOrNull() ?: 0L) / 1000 }
            fun ram(c: Context): Pair<Long, Long> {
              val m = ActivityManager.MemoryInfo()
              (c.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager).getMemoryInfo(m)
              return Pair(m.availMem, m.totalMem)
            }
            fun mi(): Map<String, Long> = (rd("/proc/meminfo") ?: "").lines().mapNotNull {
              val p = it.split(Regex("[: ]+")); if (p.size >= 2) p[0] to (p[1].toLongOrNull() ?: 0L) else null
            }.toMap()
            fun bat(c: Context): Intent? = c.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
            fun batPct(c: Context): Int { val i = bat(c) ?: return -1; return i.getIntExtra("level", 0) * 100 / i.getIntExtra("scale", 100).coerceAtLeast(1) }
            fun batTemp(c: Context): Double = (bat(c)?.getIntExtra("temperature", 0) ?: 0) / 10.0
            fun charging(c: Context): Boolean = (bat(c)?.getIntExtra("plugged", 0) ?: 0) != 0
            fun currentMa(c: Context): Double {
              val bm = c.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
              val v = bm.getLongProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW).toDouble()
              return if (Math.abs(v) > 20000) v / 1000 else v
            }
            fun thermal(): List<Pair<String, Double>> {
              val out = ArrayList<Pair<String, Double>>()
              File("/sys/class/thermal").listFiles()?.filter { it.name.startsWith("thermal_zone") }?.sortedBy { it.name.length * 1000 + it.name.hashCode() % 1000 }?.forEach {
                val t = rd(it.path + "/temp")?.toDoubleOrNull() ?: return@forEach
                out.add(Pair(rd(it.path + "/type") ?: it.name, if (Math.abs(t) > 1000) t / 1000 else t))
              }
              return out
            }
            fun tmax() = thermal().map { it.second }.filter { it in 1.0..150.0 }.maxOrNull() ?: 0.0
            var lrx = 0L; var ltx = 0L; var lt = 0L; var cache = Pair(0.0, 0.0)
            fun net(): Pair<Double, Double> {
              val t = System.nanoTime(); val dt = (t - lt) / 1e9
              if (lt != 0L && dt < 0.8) return cache
              val rx = TrafficStats.getTotalRxBytes(); val tx = TrafficStats.getTotalTxBytes()
              cache = if (lt == 0L || dt <= 0) Pair(0.0, 0.0) else Pair((rx - lrx) / dt / 1024, (tx - ltx) / dt / 1024)
              lrx = rx; ltx = tx; lt = t; return cache
            }
            fun wifi(c: Context): Boolean {
              val cm = c.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
              return cm.getNetworkCapabilities(cm.activeNetwork)?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ?: false
            }
            fun stor(): Pair<Long, Long> { val s = StatFs(Environment.getDataDirectory().path); return Pair(s.availableBytes, s.totalBytes) }
            fun gb(b: Long) = "%.2f".format(b / 1073741824.0)
            fun up(): String { val s = SystemClock.elapsedRealtime() / 1000; return "%dd %02d:%02d:%02d".format(s / 86400, s % 86400 / 3600, s % 3600 / 60, s % 60) }
            fun bar(p: Int): String { val k = (p / 10).coerceIn(0, 10); return "█".repeat(k) + "░".repeat(10 - k) }
            fun minutes(): Int { val c = Calendar.getInstance(); return c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE) }

            fun live(c: Context): String {
              val f = freqs(); val m = maxf(); val sb = StringBuilder()
              sb.append("⏱ ${SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())}  up ${up()}\n")
              for (i in 0 until n) {
                val p = if (m[i] > 0) (f[i] * 100 / m[i]).toInt() else 0
                sb.append("CPU$i ${f[i].toString().padStart(4)}MHz ${bar(p)} $p%\n")
              }
              val (a, t) = ram(c); val mm = mi()
              sb.append("RAM ${(t - a) / 1048576}/${t / 1048576}MB ${bar(((t - a) * 100 / t).toInt())}\n")
              val st = mm["SwapTotal"] ?: 0L; val sf = mm["SwapFree"] ?: 0L
              if (st > 0) sb.append("SWAP ${(st - sf) / 1024}/${st / 1024}MB\n")
              val i = bat(c); val ma = currentMa(c); val v = i?.getIntExtra("voltage", 0) ?: 0
              sb.append("BAT ${batPct(c)}% ${batTemp(c)}°C ${v}mV ${"%.0f".format(ma)}mA ${"%.2f".format(Math.abs(ma) * v / 1e6)}W ${if (charging(c)) "⚡" else ""}\n")
              val th = thermal().filter { it.second in 1.0..150.0 }.distinctBy { it.first }.take(5)
              sb.append("TEMP max ${"%.1f".format(tmax())}°C\n")
              th.forEach { sb.append("  ${it.first.take(14)} ${"%.1f".format(it.second)}°C\n") }
              val (d, u) = net(); sb.append("NET ↓${"%.0f".format(d)} ↑${"%.0f".format(u)} KB/s ${if (wifi(c)) "WiFi" else "Mobile"}\n")
              val (fr, to) = stor(); sb.append("STO free ${gb(fr)}/${gb(to)}GB")
              return sb.toString()
            }

            fun tpl(c: Context, t: String): String {
              val f = freqs().filter { it > 0 }; val (d, u) = net()
              return t.replace("{battery}", batPct(c).toString()).replace("{temp}", batTemp(c).toString())
                .replace("{ramfree}", (ram(c).first / 1048576).toString()).replace("{cpu}", (if (f.isEmpty()) 0 else f.average().toInt()).toString())
                .replace("{thermal}", "%.0f".format(tmax())).replace("{down}", "%.0f".format(d)).replace("{up}", "%.0f".format(u))
                .replace("{time}", SimpleDateFormat("HH:mm", Locale.US).format(Date()))
            }

            fun <T> gl(w: Int, f: () -> T): T? {
              val d = EGL14.eglGetDisplay(EGL14.EGL_DEFAULT_DISPLAY); val v = IntArray(2)
              var ctx: EGLContext? = null; var sf: EGLSurface? = null
              return try {
                EGL14.eglInitialize(d, v, 0, v, 1)
                val cfg = arrayOfNulls<EGLConfig>(1); val k = IntArray(1)
                EGL14.eglChooseConfig(d, intArrayOf(EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT, EGL14.EGL_SURFACE_TYPE, EGL14.EGL_PBUFFER_BIT, EGL14.EGL_NONE), 0, cfg, 0, 1, k, 0)
                ctx = EGL14.eglCreateContext(d, cfg[0], EGL14.EGL_NO_CONTEXT, intArrayOf(EGL14.EGL_CONTEXT_CLIENT_VERSION, 2, EGL14.EGL_NONE), 0)
                sf = EGL14.eglCreatePbufferSurface(d, cfg[0], intArrayOf(EGL14.EGL_WIDTH, w, EGL14.EGL_HEIGHT, w, EGL14.EGL_NONE), 0)
                EGL14.eglMakeCurrent(d, sf, sf, ctx); f()
              } catch (e: Throwable) { null } finally {
                try {
                  EGL14.eglMakeCurrent(d, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_CONTEXT)
                  sf?.let { EGL14.eglDestroySurface(d, it) }; ctx?.let { EGL14.eglDestroyContext(d, it) }; EGL14.eglTerminate(d)
                } catch (e: Throwable) {}
              }
            }
          }
          EOF

          cat > app/src/main/java/dev/sysx/Info.kt <<'EOF'
          package dev.sysx

          import android.app.ActivityManager
          import android.content.Context
          import android.content.pm.PackageManager
          import android.hardware.Sensor
          import android.hardware.SensorManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.hardware.display.DisplayManager
          import android.media.MediaCodecList
          import android.net.ConnectivityManager
          import android.opengl.GLES20
          import android.os.*
          import java.io.File
          import java.util.*

          object Info {
            fun build(c: Context): String {
              val b = StringBuilder()
              fun h(t: String) { b.append("\n━━ $t ━━\n") }
              fun l(k: String, v: Any?) { b.append(k.padEnd(17)).append(v).append('\n') }

              h("DEVICE")
              l("Model", Build.MODEL); l("Manufacturer", Build.MANUFACTURER); l("Brand", Build.BRAND); l("Device", Build.DEVICE)
              l("Product", Build.PRODUCT); l("Board", Build.BOARD); l("Hardware", Build.HARDWARE); l("Bootloader", Build.BOOTLOADER)
              l("Build ID", Build.DISPLAY); l("Fingerprint", Build.FINGERPRINT); l("Type/Tags", "${Build.TYPE} / ${Build.TAGS}")

              h("SOC / CPU")
              if (Build.VERSION.SDK_INT >= 31) { l("SoC vendor", Build.SOC_MANUFACTURER); l("SoC model", Build.SOC_MODEL) }
              l("ABIs", Build.SUPPORTED_ABIS.joinToString()); l("Cores", S.n)
              (S.rd("/proc/cpuinfo") ?: "").lines().filter { it.startsWith("Hardware") || it.startsWith("model name") || it.startsWith("Features") }.distinct().forEach { b.append(it.take(160)).append('\n') }
              val gov = S.cpu(0, "scaling_available_governors"); if (gov != null) l("Governors", gov)
              for (i in 0 until S.n) {
                l("cpu$i", "${(S.cpu(i, "cpuinfo_min_freq")?.toLongOrNull() ?: 0) / 1000}-${(S.cpu(i, "cpuinfo_max_freq")?.toLongOrNull() ?: 0) / 1000} MHz  now ${(S.cpu(i, "scaling_cur_freq")?.toLongOrNull() ?: 0) / 1000}  ${S.cpu(i, "scaling_governor") ?: ""}")
              }

              h("GPU / GRAPHICS")
              val ai = (c.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager)
              l("GLES version", ai.deviceConfigurationInfo.glEsVersion)
              l("GL", S.gl(1) { "${GLES20.glGetString(GLES20.GL_VENDOR)} | ${GLES20.glGetString(GLES20.GL_RENDERER)} | ${GLES20.glGetString(GLES20.GL_VERSION)}" } ?: "n/a")
              val pm = c.packageManager
              l("Vulkan", if (pm.hasSystemFeature(PackageManager.FEATURE_VULKAN_HARDWARE_VERSION)) "yes (0x${Integer.toHexString(pm.systemAvailableFeatures.firstOrNull { it.name == PackageManager.FEATURE_VULKAN_HARDWARE_VERSION }?.version ?: 0)})" else "no")

              h("MEMORY")
              val (a, t) = S.ram(c); val mm = S.mi()
              l("Total RAM", "${t / 1048576} MB"); l("Available", "${a / 1048576} MB"); l("App class", "${ai.memoryClass} MB (large ${ai.largeMemoryClass} MB)")
              listOf("MemFree", "Cached", "Buffers", "SwapTotal", "SwapFree", "Dirty", "Mapped").forEach { l(it, "${(mm[it] ?: 0) / 1024} MB") }

              h("STORAGE")
              val (fr, to) = S.stor(); l("Data", "${S.gb(fr)} free / ${S.gb(to)} GB")
              l("External", "${S.gb(Environment.getExternalStorageDirectory().freeSpace)} free / ${S.gb(Environment.getExternalStorageDirectory().totalSpace)} GB")

              h("DISPLAY")
              val dm = c.resources.displayMetrics
              l("Resolution", "${dm.widthPixels}x${dm.heightPixels}"); l("Density", "${dm.densityDpi} dpi (x${dm.density})"); l("xdpi/ydpi", "${dm.xdpi}/${dm.ydpi}")
              val d = (c.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager).getDisplay(0)
              l("Refresh", "${d.refreshRate} Hz"); l("Modes", d.supportedModes.joinToString { "${it.physicalWidth}x${it.physicalHeight}@${"%.0f".format(it.refreshRate)}" })
              l("Wide gamut", d.isWideColorGamut); l("HDR types", d.hdrCapabilities?.supportedHdrTypes?.joinToString() ?: "none")

              h("BATTERY")
              val i = S.bat(c); val bm = c.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
              l("Level", "${S.batPct(c)}%"); l("Temp", "${S.batTemp(c)} °C"); l("Voltage", "${i?.getIntExtra("voltage", 0)} mV"); l("Tech", i?.getStringExtra("technology"))
              val st = arrayOf("?", "unknown", "charging", "discharging", "not charging", "full"); val hl = arrayOf("?", "unknown", "good", "overheat", "dead", "overvolt", "failure", "cold")
              l("Status", st.getOrElse(i?.getIntExtra("status", 0) ?: 0) { "?" }); l("Health", hl.getOrElse(i?.getIntExtra("health", 0) ?: 0) { "?" })
              l("Plugged", when (i?.getIntExtra("plugged", 0)) { 1 -> "AC"; 2 -> "USB"; 4 -> "Wireless"; else -> "no" })
              l("Current", "${"%.0f".format(S.currentMa(c))} mA"); l("Charge counter", "${bm.getLongProperty(BatteryManager.BATTERY_PROPERTY_CHARGE_COUNTER) / 1000} mAh")
              listOf("charge_full_design", "charge_full", "cycle_count").forEach { k -> S.rd("/sys/class/power_supply/battery/$k")?.let { l(k, it) } }

              h("THERMAL ZONES")
              S.thermal().forEach { l(it.first.take(16), "${"%.1f".format(it.second)} °C") }

              h("NETWORK")
              val cm = c.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
              val k = cm.getNetworkCapabilities(cm.activeNetwork)
              l("Down/Up", "${k?.linkDownstreamBandwidthKbps} / ${k?.linkUpstreamBandwidthKbps} kbps"); l("WiFi", S.wifi(c))

              h("OS / KERNEL")
              l("Android", "${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})"); l("Security patch", Build.VERSION.SECURITY_PATCH)
              l("Kernel", System.getProperty("os.version")); l("Arch", System.getProperty("os.arch")); l("VM", System.getProperty("java.vm.version"))
              l("Uptime", S.up()); l("Locale/TZ", "${Locale.getDefault()} / ${TimeZone.getDefault().id}")

              h("CAMERAS")
              try {
                val cam = c.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                for (id in cam.cameraIdList) {
                  val ch = cam.getCameraCharacteristics(id); val px = ch.get(CameraCharacteristics.SENSOR_INFO_PIXEL_ARRAY_SIZE)
                  l("cam $id", "${if (ch.get(CameraCharacteristics.LENS_FACING) == 0) "front" else "back"} ${px?.width}x${px?.height} (${"%.1f".format((px?.width ?: 0) * (px?.height ?: 0) / 1e6)}MP) f=${ch.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS)?.joinToString()} ap=${ch.get(CameraCharacteristics.LENS_INFO_AVAILABLE_APERTURES)?.joinToString()} flash=${ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE)}")
                }
              } catch (e: Throwable) { l("error", e.message) }

              h("SENSORS")
              val sm = c.getSystemService(Context.SENSOR_SERVICE) as SensorManager
              sm.getSensorList(Sensor.TYPE_ALL).forEach { l(it.type.toString(), "${it.name} (${it.vendor}) max=${it.maximumRange} res=${it.resolution} ${it.power}mA") }

              h("HW CODECS")
              MediaCodecList(MediaCodecList.ALL_CODECS).codecInfos.filter { it.isHardwareAccelerated && !it.isSoftwareOnly }.forEach { l(if (it.isEncoder) "enc" else "dec", "${it.name} ${it.supportedTypes.joinToString()}") }

              h("SYSTEM FEATURES")
              b.append(pm.systemAvailableFeatures.mapNotNull { it.name?.removePrefix("android.hardware.")?.removePrefix("android.software.") }.sorted().joinToString(", "))
              return b.toString()
            }
          }
          EOF

          cat > app/src/main/java/dev/sysx/Bench.kt <<'EOF'
          package dev.sysx

          import android.content.Context
          import android.opengl.GLES20
          import java.io.*
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import javax.crypto.Cipher
          import javax.crypto.spec.IvParameterSpec
          import javax.crypto.spec.SecretKeySpec

          object Bench {
            @Volatile var sink = 0L
            private fun loop(ms: Long, chunk: Int, body: () -> Unit): Double {
              var n = 0L; val t = System.nanoTime(); val e = t + ms * 1_000_000
              while (System.nanoTime() < e) { body(); n += chunk }
              return n / ((System.nanoTime() - t) / 1e9) / 1e6
            }
            fun intB(ms: Long): Double { var x = 1L; val r = loop(ms, 100000) { for (i in 0 until 100000) { x = x * 6364136223846793005L + 1442695040888963407L; x = x xor (x ushr 29) } }; sink = x; return r }
            fun fltB(ms: Long): Double { var x = 1.0; val r = loop(ms, 20000) { for (i in 0 until 20000) { x = Math.sqrt(x * 1.000001 + i) + Math.sin(x) * 0.5 } }; sink = x.toLong(); return r }
            fun multi(ms: Long, f: (Long) -> Double): Double {
              val r = DoubleArray(S.n); val ts = (0 until S.n).map { i -> Thread { r[i] = f(ms) }.also { it.start() } }
              ts.forEach { it.join() }; return r.sum()
            }
            fun mem(ms: Long): Double {
              val a = ByteArray(32 shl 20); val b = ByteArray(32 shl 20); var bytes = 0L; val t = System.nanoTime(); val e = t + ms * 1_000_000
              while (System.nanoTime() < e) { System.arraycopy(a, 0, b, 0, a.size); bytes += a.size.toLong() * 2 }
              sink = b[5].toLong(); return bytes / ((System.nanoTime() - t) / 1e9) / 1e9
            }
            fun lat(): Double {
              val n = 1 shl 22; val a = IntArray(n) { it }; val r = java.util.Random(7)
              for (i in n - 1 downTo 1) { val j = r.nextInt(i); val t = a[i]; a[i] = a[j]; a[j] = t }
              var p = 0; val steps = 4_000_000; val t = System.nanoTime(); for (s in 0 until steps) p = a[p]
              sink = p.toLong(); return (System.nanoTime() - t).toDouble() / steps
            }
            fun aes(ms: Long): Double {
              val ci = Cipher.getInstance("AES/CBC/NoPadding"); ci.init(Cipher.ENCRYPT_MODE, SecretKeySpec(ByteArray(16), "AES"), IvParameterSpec(ByteArray(16)))
              val d = ByteArray(1 shl 20); var b = 0L; val t = System.nanoTime(); val e = t + ms * 1_000_000
              while (System.nanoTime() < e) { ci.update(d); b += d.size }
              return b / ((System.nanoTime() - t) / 1e9) / 1e6
            }
            fun zip(ms: Long): Double {
              val r = java.util.Random(2); val d = ByteArray(2 shl 20) { (r.nextInt(16) + 65).toByte() }; val out = ByteArray(4 shl 20)
              var b = 0L; val t = System.nanoTime(); val e = t + ms * 1_000_000
              while (System.nanoTime() < e) { val df = java.util.zip.Deflater(6); df.setInput(d); df.finish(); while (!df.finished()) df.deflate(out); df.end(); b += d.size }
