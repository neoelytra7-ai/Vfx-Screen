          private fun P(f: Paint.() -> Unit) = Paint(Paint.ANTI_ALIAS_FLAG).apply(f)
          private fun med() = Fonts.ui(Th.labW)

          /** Slowly drifting aurora blobs behind everything. */
          class Aurora(c: Context) : View(c) {
            private val ps = List(4) { P { } }
            private var t = 0f
            private var lastDraw = 0L
            private val bgp = P { color = Th.BG }
            private val gp = P { style = Paint.Style.STROKE; strokeWidth = Th.dp(1f); color = 0x10FFFFFF }
            private val dotp = P { style = Paint.Style.FILL; color = 0x26FFFFFF }
            private val ringp = P { style = Paint.Style.FILL }
            private val streak = P { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
            private var va: ValueAnimator? = null
            // reactive dots: a springy parallax follows tabs and scrolling, and a ripple leaves the nav on every tab change
            private var ox = 0f; private var oy = 0f; private var tgtY = 0f; private var rv = 1f; private var rcx = 0f; private var rcy = 0f
            private fun kick() { if (Th.bgStyle == 4) invalidate() }
            private val sx = Spring(0f, 110f, 15f, 0.05f) { v -> ox = v; kick() }
            private val sy = Spring(0f, 90f, 14f, 0.05f) { v -> oy = v; kick() }
            private val rp = Spring(0f, 26f, 9f, 0.002f) { v -> rv = v; kick() }
            fun page(pos: Float) { if (Th.bgStyle == 4) sx.to(-pos * Th.dp(90f)) }
            fun scroll(dy: Int) { if (Th.bgStyle != 4) return; tgtY -= dy * .45f; sy.to(tgtY) }
            fun pulse(cx: Float, cy: Float) { if (Th.bgStyle != 4) return; rcx = cx; rcy = cy; rp.snap(0f); rp.to(1f) }
            private fun recolor() {
              val r = maxOf(width, height) * .6f
              if (r <= 0f) return
              ps.forEachIndexed { i, p ->
                val col = when (i) { 0 -> Th.a1; 1 -> Th.a2; 2 -> 0xFF3B5BFF.toInt(); else -> Th.a1 }
                p.shader = RadialGradient(0f, 0f, r, Th.alpha(col, 64), Th.alpha(col, 0), Shader.TileMode.CLAMP)
              }
            }
            override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { recolor(); bgp.shader = LinearGradient(0f, 0f, 0f, h.toFloat(), Th.BG2, Th.BG, Shader.TileMode.CLAMP) }
            override fun onVisibilityAggregated(v: Boolean) {
              super.onVisibilityAggregated(v)
              va?.cancel()
              if (v && Th.anim && Th.aurora) {
                va = ValueAnimator.ofFloat(0f, 6.2832f).apply {
                  duration = 40000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
                  addUpdateListener { t = it.animatedValue as Float; val nw = android.os.SystemClock.uptimeMillis(); if (nw - lastDraw >= 32L) { lastDraw = nw; invalidate() } }; start()
                }
              }
            }
            override fun onDraw(cv: Canvas) {
              cv.drawPaint(bgp)
              val w = width.toFloat(); val h = height.toFloat()
              when (Th.bgStyle) {
                1, 2 -> ps.forEachIndexed { i, p ->
                  val x = w * (.5f + .45f * Math.sin((t * (if (i % 2 == 0) 1 else 2) + i * 1.9f).toDouble()).toFloat())
                  val y = h * (.5f + .45f * Math.cos((t * (if (i % 2 == 0) 2 else 1) + i * 2.3f).toDouble()).toFloat())
                  cv.save(); cv.translate(x, y); cv.drawCircle(0f, 0f, maxOf(w, h) * .6f, p); cv.restore()
                }
                3 -> { val s = Th.dp(34f); var x = 0f; while (x <= w) { cv.drawLine(x, 0f, x, h, gp); x += s }; var y = 0f; while (y <= h) { cv.drawLine(0f, y, w, y, gp); y += s } }
                4 -> {
                  val s = Th.dp(22f); val r0 = Th.dp(1.3f)
                  val vy = sy.velocity; val len = Math.min(Math.abs(vy) * .018f, Th.dp(16f))
                  val ex = ((ox % s) + s) % s; val ey = ((oy % s) + s) % s
                  val wave = (1f - rv).coerceIn(0f, 1f)
                  val rr = rv * Math.max(w, h) * 1.15f; val band = Th.dp(70f)
                  streak.strokeWidth = r0 * 2f; streak.color = 0x2EFFFFFF
                  var y = ey - s
                  while (y <= h + s) {
                    var x = ex - s
                    while (x <= w + s) {
                      var drawn = false
                      if (wave > 0.01f) {
                        val dx = x - rcx; val dy = y - rcy
                        val d = Math.abs(Math.sqrt((dx * dx + dy * dy).toDouble()).toFloat() - rr)
                        if (d < band) {
                          val f = (1f - d / band) * wave
                          ringp.color = Th.alpha(Th.a1, (50 + 190 * f).toInt())
                          cv.drawCircle(x, y - f * Th.dp(4f), r0 * (1f + 1.8f * f), ringp); drawn = true
                        }
                      }
                      if (!drawn) { if (len > 2f) cv.drawLine(x, y, x, y + (if (vy > 0f) -len else len), streak) else cv.drawCircle(x, y, r0, dotp) }
                      x += s
                    }
                    y += s
                  }
                }
                5 -> { val s = Th.dp(6f); var y = 0f; while (y <= h) { cv.drawLine(0f, y, w, y, gp); y += s } }
              }
            }
          }

          /** Animated gradient gauge. */
          class Ring(c: Context) : View(c) {
            private var shown = 0f
            private var big = "0"; private var unit = ""; private var label = ""
            private var ca = Th.a1; private var cb = Th.a2
            private val track = P { style = Paint.Style.STROKE; color = 0x22FFFFFF; strokeCap = Paint.Cap.ROUND }
            private val arc = P { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
            private val glow = P { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND; alpha = 55 }
            private val tp = P { color = Th.TXT; typeface = Fonts.num(); letterSpacing = -.02f }
            private val up = P { color = Th.DIM; typeface = med() }
            private val lb = P { color = Th.DIM; textAlign = Paint.Align.CENTER; typeface = med(); letterSpacing = .12f }
            private var sh: Shader? = null
            private val sp = Spring(0f, 150f, 21f, 0.0005f) { v -> shown = v; invalidate() }
            private fun rebuild() { if (width > 0) sh = SweepGradient(width / 2f, height / 2f, intArrayOf(ca, cb, cb), floatArrayOf(0f, .75f, 1f)) }
            override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { rebuild() }
            fun set(f: Float, big: String, unit: String, label: String, a: Int = Th.a1, b: Int = Th.a2) {
              this.big = big; this.unit = unit; this.label = label
              if (a != ca || b != cb) { ca = a; cb = b; rebuild() }
              sp.to(f.coerceIn(0f, 1f))
            }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val h = height.toFloat(); val s = minOf(w, h)
              val sw = s * .085f; val r = s / 2 - sw * 1.4f; val cx = w / 2; val cy = h / 2
              track.strokeWidth = sw; arc.strokeWidth = sw; glow.strokeWidth = sw * 2.3f
              val rect = RectF(cx - r, cy - r, cx + r, cy + r)
              cv.drawArc(rect, 135f, 270f, false, track)
              if (shown > .004f && sh != null) {
                cv.save(); cv.rotate(135f, cx, cy)
                arc.shader = sh; glow.shader = sh
                cv.drawArc(rect, 0f, 270f * shown, false, glow)
                cv.drawArc(rect, 0f, 270f * shown, false, arc)
                cv.restore()
              }
              tp.textSize = s * .31f; up.textSize = s * .10f; lb.textSize = s * .075f
              val bw = tp.measureText(big); val uw = up.measureText(unit)
              val x0 = cx - (bw + uw) / 2
              cv.drawText(big, x0, cy + s * .08f, tp)
              cv.drawText(unit, x0 + bw + 2f, cy + s * .08f, up)
              cv.drawText(label, cx, cy + r * .86f, lb)
            }
          }

          /** Smooth scrolling sparkline with pulse dot. */
          class Spark(c: Context, private val title: String, private val unit: String = "", private val lo: Float? = null,
                      private val hi: Float? = null, private val fmt: (Float) -> String = { "%.0f".format(it) }) : View(c) {
            private val n = 60
            private val pts = ArrayList<Float>()
            private var off = 0f; private var pulse = 0f
            private var va: ValueAnimator? = null; private var pv: ValueAnimator? = null
            private val line = P { style = Paint.Style.STROKE; strokeWidth = Th.dp(2.2f); strokeCap = Paint.Cap.ROUND; strokeJoin = Paint.Join.ROUND }
            private val fill = P { style = Paint.Style.FILL }
            private val dot = P { color = Th.TXT }
            private val ring = P { style = Paint.Style.STROKE; strokeWidth = Th.dp(1.5f) }
            private val tl = P { color = Th.DIM; textSize = Th.dp(10.5f); letterSpacing = .08f; typeface = med() }
            private val tv = P { color = Th.TXT; textSize = Th.dp(17f); textAlign = Paint.Align.RIGHT; typeface = Fonts.num() }
            private val path = Path(); private val fp = Path()
            fun load(l: List<Float>) { pts.clear(); pts.addAll(l.takeLast(n + 1)); invalidate() }
            fun push(v: Float) {
              pts.add(v); if (pts.size > n + 1) pts.removeAt(0)
              if (!Th.anim) { invalidate(); return }
              va?.cancel()
              va = ValueAnimator.ofFloat(1f, 0f).apply {
                duration = 900; interpolator = LinearInterpolator()
                addUpdateListener { off = it.animatedValue as Float; invalidate() }; start()
              }
            }
            override fun onVisibilityAggregated(v: Boolean) {
              super.onVisibilityAggregated(v)
              pv?.cancel()
              if (v && Th.anim) pv = ValueAnimator.ofFloat(0f, 1f).apply {
                duration = 1500; repeatCount = ValueAnimator.INFINITE
                addUpdateListener { pulse = it.animatedValue as Float; invalidate() }; start()
              }
            }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val h = height.toFloat(); val top = Th.dp(28f); val bot = h - Th.dp(6f)
              cv.drawText(title, 0f, Th.dp(13f), tl)
              if (pts.isEmpty()) return
              cv.drawText(fmt(pts.last()) + unit, w, Th.dp(16f), tv)
              var mn = lo ?: (pts.minOrNull() ?: 0f); var mx = hi ?: (pts.maxOrNull() ?: 1f)
              if (mx - mn < 1e-3f) { mx += 1f; mn -= 1f }
              if (lo == null) mn -= (mx - mn) * .12f
              if (hi == null) mx += (mx - mn) * .12f
              val step = w / (n - 1); val sz = pts.size
              fun X(i: Int) = w + (i - (sz - 1)) * step + off * step
              fun Y(v: Float) = bot - (v - mn) / (mx - mn) * (bot - top)
              path.reset()
              for (i in 0 until sz) {
                val x = X(i); val y = Y(pts[i])
                if (i == 0) path.moveTo(x, y) else { val px = X(i - 1); val py = Y(pts[i - 1]); path.quadTo(px, py, (px + x) / 2, (py + y) / 2) }
              }
              path.lineTo(X(sz - 1), Y(pts[sz - 1]))
              fp.set(path); fp.lineTo(X(sz - 1), bot); fp.lineTo(X(0), bot); fp.close()
              line.shader = LinearGradient(0f, 0f, w, 0f, Th.a2, Th.a1, Shader.TileMode.CLAMP)
              fill.shader = LinearGradient(0f, top, 0f, bot, Th.alpha(Th.a1, 80), Th.alpha(Th.a1, 0), Shader.TileMode.CLAMP)
              cv.save(); cv.clipRect(0f, 0f, w, h); cv.drawPath(fp, fill); cv.drawPath(path, line); cv.restore()
              val ex = X(sz - 1); val ey = Y(pts[sz - 1])
              ring.color = Th.alpha(Th.a1, ((1f - pulse) * 190).toInt())
              cv.drawCircle(ex, ey, Th.dp(4f) + pulse * Th.dp(9f), ring)
              cv.drawCircle(ex, ey, Th.dp(3.5f), dot)
            }
          }

          /** Per-core vertical bars. */
          class Bars(c: Context) : View(c) {
            private var from = FloatArray(0); private var to = FloatArray(0); private var cur = FloatArray(0)
            private var lab = listOf<String>(); private var top = listOf<String>()
            private val bp = P { style = Paint.Style.FILL }
            private val bg = P { color = 0x14FFFFFF }
            private val tp = P { color = Th.DIM; textSize = Th.dp(9f); textAlign = Paint.Align.CENTER }
            private var va: ValueAnimator? = null
            fun set(f: List<Float>, l: List<String>, t: List<String>) {
              lab = l; top = t
              from = if (cur.size == f.size) cur.copyOf() else FloatArray(f.size)
              to = f.toFloatArray(); cur = from.copyOf(); va?.cancel()
              if (!Th.anim) { cur = to.copyOf(); invalidate(); return }
              va = ValueAnimator.ofFloat(0f, 1f).apply {
                duration = 600; interpolator = DecelerateInterpolator(2f)
                addUpdateListener { val k = it.animatedValue as Float; for (i in cur.indices) cur[i] = from[i] + (to[i] - from[i]) * k; invalidate() }; start()
              }
            }
            override fun onDraw(cv: Canvas) {
              val n = cur.size; if (n == 0) return
              val w = width.toFloat(); val h = height.toFloat(); val gap = Th.dp(6f)
              val bw = (w - gap * (n - 1)) / n; val bt = Th.dp(14f); val bb = h - Th.dp(16f)
              for (i in 0 until n) {
                val x = i * (bw + gap)
                cv.drawRoundRect(RectF(x, bt, x + bw, bb), Th.dp(5f), Th.dp(5f), bg)
                val bh = (bb - bt) * cur[i].coerceIn(0f, 1f).coerceAtLeast(.025f)
                bp.shader = LinearGradient(0f, bb - bh, 0f, bb, Th.a2, Th.a1, Shader.TileMode.CLAMP)
                cv.drawRoundRect(RectF(x, bb - bh, x + bw, bb), Th.dp(5f), Th.dp(5f), bp)
                cv.drawText(top.getOrElse(i) { "" }, x + bw / 2, bt - Th.dp(3f), tp)
                cv.drawText(lab.getOrElse(i) { "" }, x + bw / 2, h - Th.dp(3f), tp)
              }
            }
          }

          /** Radar chart. */
          class Radar(c: Context) : View(c) {
            private var labels = listOf<String>(); private var to = FloatArray(0); private var cur = FloatArray(0)
            private var va: ValueAnimator? = null
            private val grid = P { style = Paint.Style.STROKE; color = 0x22FFFFFF; strokeWidth = Th.dp(1f) }
            private val fill = P { style = Paint.Style.FILL }
            private val edge = P { style = Paint.Style.STROKE; strokeWidth = Th.dp(2f); strokeJoin = Paint.Join.ROUND }
            private val dotP = P { color = Th.TXT }
            private val tp = P { color = Th.DIM; textSize = Th.dp(10.5f); textAlign = Paint.Align.CENTER }
            fun set(l: List<String>, v: List<Float>) {
              labels = l; val from = if (cur.size == v.size) cur.copyOf() else FloatArray(v.size)
              to = v.toFloatArray(); cur = from.copyOf(); va?.cancel()
              if (!Th.anim) { cur = to.copyOf(); invalidate(); return }
              va = ValueAnimator.ofFloat(0f, 1f).apply {
                duration = 900; interpolator = OvershootInterpolator(1.1f)
                addUpdateListener { val k = it.animatedValue as Float; for (i in cur.indices) cur[i] = from[i] + (to[i] - from[i]) * k; invalidate() }; start()
              }
            }
            override fun onDraw(cv: Canvas) {
              val n = labels.size; if (n < 3) return
              val w = width.toFloat(); val h = height.toFloat(); val cx = w / 2; val cy = h / 2; val r = minOf(w, h) / 2 - Th.dp(24f)
              fun ang(i: Int) = Math.toRadians(-90.0 + 360.0 * i / n)
              for (k in 1..4) {
                val pa = Path()
                for (i in 0 until n) { val x = cx + (r * k / 4 * Math.cos(ang(i))).toFloat(); val y = cy + (r * k / 4 * Math.sin(ang(i))).toFloat(); if (i == 0) pa.moveTo(x, y) else pa.lineTo(x, y) }
                pa.close(); cv.drawPath(pa, grid)
              }
              val poly = Path()
              for (i in 0 until n) {
                cv.drawLine(cx, cy, cx + (r * Math.cos(ang(i))).toFloat(), cy + (r * Math.sin(ang(i))).toFloat(), grid)
                val v = cur.getOrElse(i) { 0f }.coerceIn(0f, 1.1f)
                val x = cx + (r * v * Math.cos(ang(i))).toFloat(); val y = cy + (r * v * Math.sin(ang(i))).toFloat()
                if (i == 0) poly.moveTo(x, y) else poly.lineTo(x, y)
                cv.drawText(labels[i], cx + ((r + Th.dp(14f)) * Math.cos(ang(i))).toFloat(), cy + ((r + Th.dp(14f)) * Math.sin(ang(i))).toFloat() + Th.dp(4f), tp)
              }
              poly.close()
              fill.shader = RadialGradient(cx, cy, r, Th.alpha(Th.a2, 40), Th.alpha(Th.a1, 130), Shader.TileMode.CLAMP)
              edge.shader = LinearGradient(0f, 0f, w, h, Th.a1, Th.a2, Shader.TileMode.CLAMP)
              cv.drawPath(poly, fill); cv.drawPath(poly, edge)
              for (i in 0 until n) { val v = cur.getOrElse(i) { 0f }.coerceIn(0f, 1.1f); cv.drawCircle(cx + (r * v * Math.cos(ang(i))).toFloat(), cy + (r * v * Math.sin(ang(i))).toFloat(), Th.dp(3.5f), dotP) }
            }
          }

          /** Animated horizontal meter. */
          class Meter(c: Context) : View(c) {
            private var shown = 0f
            private val sp = Spring(0f, 130f, 20f, 0.0005f) { v -> shown = v; invalidate() }
            private val bg = P { color = 0x1AFFFFFF }; private val fg = P { }
            fun set(f: Float) {
              sp.to(f.coerceIn(0f, 1f))
            }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val h = height.toFloat(); val r = h / 2
              cv.drawRoundRect(RectF(0f, 0f, w, h), r, r, bg)
              if (shown > 0f) { fg.shader = LinearGradient(0f, 0f, w, 0f, Th.a1, Th.a2, Shader.TileMode.CLAMP); cv.drawRoundRect(RectF(0f, 0f, maxOf(h, w * shown), h), r, r, fg) }
            }
          }

          /** Gradient switch with overshoot knob. */
          class Toggle(c: Context, initial: Boolean = false, private val cb: (Boolean) -> Unit = {}) : View(c) {
            var on = initial; private set
            private var t = if (initial) 1f else 0f
            private val sp = Spring(t, 520f, 30f, 0.002f) { v -> t = v; invalidate() }
            private val base = P { color = 0x33FFFFFF }; private val onp = P { }; private val knob = P { color = 0xFFFFFFFF.toInt() }
            override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(Th.dpi(50), Th.dpi(30)) }
            fun set(v: Boolean, notify: Boolean = true) {
              on = v; sp.to(if (v) 1f else 0f)
              if (notify) cb(v)
            }
            override fun onTouchEvent(e: MotionEvent): Boolean {
              if (e.actionMasked == MotionEvent.ACTION_UP) { set(!on); Th.hap(this, true) }
              return true
            }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val h = height.toFloat(); val r = h / 2
              cv.drawRoundRect(RectF(0f, 0f, w, h), r, r, base)
              onp.shader = LinearGradient(0f, 0f, w, 0f, Th.a1, Th.a2, Shader.TileMode.CLAMP); onp.alpha = (t.coerceIn(0f, 1f) * 255).toInt()
              cv.drawRoundRect(RectF(0f, 0f, w, h), r, r, onp)
              val kr = r - Th.dp(3.5f); val kx = r + t * (w - 2 * r); val st = Math.min(Math.abs(sp.velocity) * Th.dp(5f), Th.dp(9f))
              cv.drawRoundRect(RectF(kx - kr - st, r - kr, kx + kr + st, r + kr), kr, kr, knob)
            }
          }

          /** Slider with glowing thumb and value bubble. */
          class Slider(c: Context, private val min: Float, private val max: Float, v: Float, private val step: Float = 1f,
                       private val fmt: (Float) -> String = { "%.0f".format(it) }, private val cb: (Float) -> Unit) : View(c) {
            var value = v; private set
            private var press = 0f; private var shown = (v - min) / (max - min)
            private val ps = Spring(0f, 520f, 34f, 0.002f) { s -> press = s; invalidate() }
            private val ss = Spring((v - min) / (max - min), 600f, 40f, 0.0005f) { s -> shown = s; invalidate() }
            private val tr = P { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND; color = 0x26FFFFFF }
            private val fl = P { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
            private val th = P { color = 0xFFFFFFFF.toInt() }
            private val gl = P { }
            private val bub = P { }
            private val bt = P { color = 0xFF06101A.toInt(); textSize = Th.dp(11f); textAlign = Paint.Align.CENTER; typeface = med() }
            override fun onMeasure(w: Int, h: Int) { setMeasuredDimension(MeasureSpec.getSize(w), Th.dpi(46)) }
            private fun anim(to: Float) { ps.to(to) }
            private fun upd(x: Float) {
              val l = Th.dp(14f); val r = width - l
              val f = ((x - l) / (r - l)).coerceIn(0f, 1f)
              var nv = Math.round((min + f * (max - min)) / step) * step
              nv = nv.coerceIn(min, max)
              if (nv != value) { value = nv; cb(nv); Th.hap(this); ss.to((nv - min) / (max - min)); invalidate() }
            }
            override fun onTouchEvent(e: MotionEvent): Boolean {
              when (e.actionMasked) {
                MotionEvent.ACTION_DOWN -> { parent?.requestDisallowInterceptTouchEvent(true); anim(1f); upd(e.x) }
                MotionEvent.ACTION_MOVE -> upd(e.x)
                MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> anim(0f)
              }
              return true
            }
            override fun onDraw(cv: Canvas) {
              val l = Th.dp(14f); val r = width - l; val y = height * .66f; val sw = Th.dp(5f)
              tr.strokeWidth = sw; fl.strokeWidth = sw
              val f = shown.coerceIn(0f, 1f); val x = l + (r - l) * f
              cv.drawLine(l, y, r, y, tr)
              fl.shader = LinearGradient(l, 0f, r, 0f, Th.a1, Th.a2, Shader.TileMode.CLAMP)
              cv.drawLine(l, y, x, y, fl)
              val tr2 = Th.dp(9f) + press * Th.dp(3f)
              gl.color = Th.alpha(Th.mix(Th.a1, Th.a2, f), (60 + press * 60).toInt())
              cv.drawCircle(x, y, tr2 * 1.9f, gl)
              cv.drawCircle(x, y, tr2, th)
              if (press > .01f) {
                val s = fmt(value); val bw = bt.measureText(s) + Th.dp(16f); val by = y - tr2 - Th.dp(8f) - press * Th.dp(6f)
                bub.color = Th.alpha(Th.mix(Th.a1, Th.a2, f), (press * 255).toInt()); bt.alpha = (press * 255).toInt()
                cv.drawRoundRect(RectF(x - bw / 2, by - Th.dp(22f), x + bw / 2, by), Th.dp(10f), Th.dp(10f), bub)
                cv.drawText(s, x, by - Th.dp(7f), bt)
              }
            }
          }

          /** Floating nav bar. The pill is a spring; dragging scrubs the pages under your finger. */
          class NavBar(c: Context, private val items: List<Pair<String, String>>, private val onSel: (Int) -> Unit) : View(c) {
            var sel = 0; private set
            var onScrub: (Float) -> Unit = {}
            private var px = 0f
            private val sp = Spring(0f, 300f, 26f, 0.001f) { v -> px = v; onScrub(v); invalidate() }
            private val pill = P { style = Paint.Style.FILL }
            private val pst = P { style = Paint.Style.STROKE; strokeWidth = Th.dp(1f) }
            private val ip = P { textAlign = Paint.Align.CENTER }
            private val lp = P { textAlign = Paint.Align.CENTER; typeface = med() }
            private var downX = 0f; private var moved = false; private var lastI = 0
            init { background = Th.panel(if (Th.navStyle == 1) 0f else 28f, 0xE61B2030.toInt(), 0xE60B0E17.toInt()) }
            fun select(i: Int) {
              val changed = i != sel
              sel = i; sp.to(i.toFloat())
              if (changed) Th.hap(this, true)
              onSel(i)
            }
            private fun idx(x: Float): Int { val pad = Th.dp(6f); return ((x - pad) / ((width - 2 * pad) / items.size)).toInt().coerceIn(0, items.size - 1) }
            override fun onTouchEvent(e: MotionEvent): Boolean {
              val pad = Th.dp(6f); val iw = (width - 2 * pad) / items.size
              when (e.actionMasked) {
                MotionEvent.ACTION_DOWN -> { parent?.requestDisallowInterceptTouchEvent(true); downX = e.x; moved = false; lastI = idx(e.x) }
                MotionEvent.ACTION_MOVE -> {
                  if (!moved && Math.abs(e.x - downX) > Th.dp(10f)) { moved = true; sp.stop() }
                  if (moved) {
                    val p = ((e.x - pad) / iw - .5f).coerceIn(0f, (items.size - 1).toFloat())
                    sp.snap(p)
                    val r = Math.round(p)
                    if (r != lastI) { lastI = r; Th.hap(this) }
                  }
                }
                MotionEvent.ACTION_UP -> select(if (moved) Math.round(px).coerceIn(0, items.size - 1) else idx(e.x))
                MotionEvent.ACTION_CANCEL -> select(sel)
              }
              return true
            }
            override fun onDraw(cv: Canvas) {
              val n = items.size; val pad = Th.dp(6f); val iw = (width - 2 * pad) / n; val h = height.toFloat()
              val l = pad + px * iw
              val st = Math.min(Math.abs(sp.velocity) * .05f, .3f) * iw
              val rect = RectF(l + Th.dp(2f) - st * .5f, pad, l + iw - Th.dp(2f) + st * .5f, h - pad)
              pill.shader = LinearGradient(l, 0f, l + iw, 0f, Th.alpha(Th.a1, 70), Th.alpha(Th.a2, 70), Shader.TileMode.CLAMP)
              pst.shader = LinearGradient(l, 0f, l + iw, 0f, Th.alpha(Th.a1, 150), Th.alpha(Th.a2, 150), Shader.TileMode.CLAMP)
              cv.drawRoundRect(rect, Th.dp(22f), Th.dp(22f), pill); cv.drawRoundRect(rect, Th.dp(22f), Th.dp(22f), pst)
              items.forEachIndexed { i, item ->
                val prox = Math.max(0f, 1f - Math.abs(px - i)); val cx = pad + iw * (i + .5f)
                val ic = Th.mix(Th.DIM, Th.a1, prox)
                if (Th.navStyle == 2) {
                  Icons.draw(cv, i, cx, h * .5f, Th.dp(25f) * (1f + .14f * prox), ic, 1.9f + .3f * prox)
                } else {
                  Icons.draw(cv, i, cx, h * .5f - Th.dp(6f) - prox * Th.dp(1.5f), Th.dp(23f) * (1f + .12f * prox), ic, 1.9f)
                  lp.color = Th.mix(Th.DIM, Th.TXT, prox); lp.textSize = Th.dp(10f)
                  cv.drawText(item.second, cx, h - Th.dp(11f), lp)
                }
              }
            }
          }

