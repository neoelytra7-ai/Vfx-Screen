          package dev.sysx

          import android.animation.ObjectAnimator
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.animation.ValueAnimator
          import android.graphics.drawable.GradientDrawable
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.view.Gravity
          import android.view.View
          import android.view.animation.LinearInterpolator
          import android.view.inputmethod.EditorInfo
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          /** Bottom sheet where the user just describes what they want. */
          class AiSheet(private val a: MainActivity) {
            val panel = LinearLayout(a)
            val grab: View
            private val rad = Th.dp(26f)
            private val chatCol = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL }
            private val chatScroll = ScrollView(a).apply { isVerticalScrollBarEnabled = false; overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS }
            private val authBox = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL }
            private val inputRow = LinearLayout(a).apply { gravity = Gravity.CENTER_VERTICAL }
            private val input = Ui.field(a, "Describe what you want…", "", 1)
            private val quota = Ui.txt(a, "", 10.5f, Th.DIM)
            private val acct = Ui.txt(a, "", 11f, Th.DIM)
            private val signOut: TextView
            private val exRow: HorizontalScrollView
            private var busy = false

            private val examples = listOf(
              "Tiny neon gamer HUD with cpu and temps",
              "Warn me when it gets hot while charging",
              "Minimal widget with battery and time",
              "Make the whole app pink",
              "Quiet phone every night"
            )

            init {
              panel.orientation = LinearLayout.VERTICAL
              panel.setPadding(Th.dpi(18), Th.dpi(6), Th.dpi(18), Th.dpi(16)); panel.isClickable = true
              panel.background = GradientDrawable().apply {
                setColor(0xFA11141D.toInt()); cornerRadii = floatArrayOf(rad, rad, rad, rad, 0f, 0f, 0f, 0f); setStroke(Th.dpi(1), 0x33FFFFFF)
              }
              grab = FrameLayout(a).apply {
                addView(View(a).apply { background = Th.glass(2f, 0x55FFFFFF, 0x00000000) }, FrameLayout.LayoutParams(Th.dpi(40), Th.dpi(4), Gravity.CENTER))
              }
              panel.addView(grab, LinearLayout.LayoutParams(-1, Th.dpi(22)))

              signOut = Ui.pill(a, "Sign out") { Ai.logout(); a.toast("Signed out"); render() }
              val head = LinearLayout(a).apply { gravity = Gravity.CENTER_VERTICAL }
              head.addView(Ui.txt(a, "Ask SysX", 20f, Th.TXT, true), LinearLayout.LayoutParams(0, -2, 1f))
              head.addView(acct, LinearLayout.LayoutParams(-2, -2).apply { marginEnd = Th.dpi(8) })
              head.addView(signOut)
              panel.addView(head)
              panel.addView(Ui.txt(a, "Describe it in your own words: rules, widget, overlay, colours. SysX AI sees your live stats and what is set up right now.", 12f, Th.DIM), Ui.lp(top = 4))

              chatScroll.addView(chatCol, FrameLayout.LayoutParams(-1, -2))
              panel.addView(chatScroll, LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = Th.dpi(8) })

              if (Ai.configured) {
                authBox.addView(Ui.txt(a, "Sign in to use Claude for free", 16f, Th.TXT, true))
                authBox.addView(Ui.txt(a, "Light daily use is included. Requests go through the SysX server to Claude. Your session stays on this device.", 12f, Th.DIM), Ui.lp(top = 6))
                authBox.addView(Ui.btn(a, "Continue with Google") { Ai.login(a) }, Ui.lp(top = 12))
                authBox.addView(Ui.txt(a, "Or connect your own Claude key", 12f, Th.DIM), Ui.lp(top = 16))
              } else {
                authBox.addView(Ui.txt(a, "Connect Claude", 16f, Th.TXT, true))
                authBox.addView(Ui.txt(a, "Paste a Claude API key. It stays on this device and is only ever sent to Anthropic. Usage is billed to your own Claude Console account.", 12f, Th.DIM), Ui.lp(top = 6))
              }
              val keyField = Ui.field(a, "sk-ant-…", "", 1)
              authBox.addView(keyField, Ui.lp(top = 8))
              val kr = LinearLayout(a)
              kr.addView(Ui.pill(a, "Get a key") { a.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://console.anthropic.com/settings/keys"))) }, LinearLayout.LayoutParams(0, -2, 1f).apply { marginEnd = Th.dpi(8) })
              kr.addView(Ui.pill(a, "Paste") {
                val t = (a.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).primaryClip?.getItemAt(0)?.text?.toString()
                if (t != null) keyField.setText(t.trim())
              }, LinearLayout.LayoutParams(0, -2, 1f))
              authBox.addView(kr, Ui.lp(top = 8))
              authBox.addView(Ui.btn(a, "Connect key") {
                if (Ai.setKey(keyField.text.toString())) { keyField.setText(""); a.toast("Connected"); render() } else a.toast("That does not look like a Claude API key")
              }, Ui.lp(top = 10))
              panel.addView(authBox, Ui.lp(top = 10))

              val er = LinearLayout(a)
              examples.forEach { e -> er.addView(Ui.pill(a, e) { ask(e) }, LinearLayout.LayoutParams(-2, -2).apply { marginEnd = Th.dpi(8) }) }
              exRow = HorizontalScrollView(a).apply { isHorizontalScrollBarEnabled = false; addView(er) }
              panel.addView(exRow, Ui.lp(top = 8))

              val send = IconView(a, Icons.SEND).apply {
                tint = 0xFF06101A.toInt()
                background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(Th.a1, Th.a2)).apply { cornerRadius = Th.dp(21f) }
              }
              Th.fx(send) { ask(input.text.toString()) }
              input.imeOptions = EditorInfo.IME_ACTION_SEND
              input.setOnEditorActionListener { _, id, _ ->
                if (id == EditorInfo.IME_ACTION_SEND) { ask(input.text.toString()); true } else false
              }
              inputRow.addView(input, LinearLayout.LayoutParams(0, -2, 1f).apply { marginEnd = Th.dpi(8) })
              inputRow.addView(send, LinearLayout.LayoutParams(Th.dpi(42), Th.dpi(42)))
              panel.addView(inputRow, Ui.lp(top = 10))
              panel.addView(quota, Ui.lp(top = 6))

              for (m in Ai.chat) { if (m.user) bubbleUser(m.text, false) else bubbleAi(m.text, m.chips, false) }
              render()
            }

            fun sheetHeight(): Int = (a.resources.displayMetrics.heightPixels * 0.78f).toInt()

            /** Show the right half of the sheet for the current sign-in state. */
            fun render() {
              val on = Ai.signedIn
              authBox.visibility = if (on) View.GONE else View.VISIBLE
              chatScroll.visibility = if (on) View.VISIBLE else View.GONE
              inputRow.visibility = if (on) View.VISIBLE else View.GONE
              quota.visibility = if (on) View.VISIBLE else View.GONE
              signOut.visibility = if (on) View.VISIBLE else View.GONE
              exRow.visibility = if (on && Ai.chat.isEmpty()) View.VISIBLE else View.GONE
              acct.text = if (on) (if (Ai.usingKey) "Own key" else Ai.email) else ""
              quota.text = Ai.quota()
              if (on && chatCol.childCount == 0) bubbleAi("What should I change? Describe how you want it to look, or what should happen and when.", emptyList(), true)
            }

            /** Send a message (also used by the example chips on the other tabs). */
            fun ask(raw: String) {
              val q = raw.trim()
              if (q.isEmpty() || busy) return
              if (!Ai.signedIn) { input.setText(q); a.toast("Sign in first"); return }
              input.setText("")
              Ai.chat.add(Ai.Msg(true, q)); bubbleUser(q, true)
              exRow.visibility = View.GONE
              busy = true
              val wait = Ui.txt(a, "Thinking…", 13f, Th.DIM)
              wait.setPadding(Th.dpi(14), Th.dpi(10), Th.dpi(14), Th.dpi(10)); wait.background = Th.glass(18f)
              chatCol.addView(wait, LinearLayout.LayoutParams(-2, -2).apply { topMargin = Th.dpi(8) })
              pop(wait, true); down()
              val pulse: ObjectAnimator = Ui.pulse(wait)
              val tab = a.tabName()
              Thread {
                val res = try { Result.success(Ai.ask(a, tab, q)) } catch (e: Throwable) { Result.failure(e) }
                a.runOnUiThread {
                  pulse.cancel(); chatCol.removeView(wait); busy = false
                  res.onSuccess { rep ->
                    val chips = try { Ai.applyReply(a, rep.json) } catch (e: Throwable) { listOf("Could not apply: " + (e.message ?: "error")) }
                    a.reloadPages()
                    val say = rep.say.ifBlank { if (chips.isEmpty()) "Nothing to change yet. Tell me a bit more about what you want." else "Done." }
                    Ai.chat.add(Ai.Msg(false, say, chips)); while (Ai.chat.size > 40) Ai.chat.removeAt(0)
                    bubbleAi(say, chips, true); quota.text = Ai.quota(); Th.hap(panel, true)
                    if (Ai.recreate) { Ai.recreate = false; Ai.reopen = true; panel.postDelayed({ a.recreate() }, 1300) }
                  }.onFailure { e ->
                    val msg = "Problem: " + (e.message ?: "something went wrong")
                    Ai.chat.add(Ai.Msg(false, msg)); bubbleAi(msg, emptyList(), true); render()
                  }
                }
              }.start()
            }

            private fun bubbleUser(t: String, anim: Boolean) {
              val big = Th.dp(18f); val small = Th.dp(4f)
              val v = Ui.txt(a, t, 14f, 0xFF06101A.toInt(), true)
              v.setPadding(Th.dpi(14), Th.dpi(10), Th.dpi(14), Th.dpi(10))
              v.background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(Th.a1, Th.a2)).apply {
                cornerRadii = floatArrayOf(big, big, big, big, small, small, big, big)
              }
              chatCol.addView(v, LinearLayout.LayoutParams(-2, -2).apply { gravity = Gravity.END; topMargin = Th.dpi(8); marginStart = Th.dpi(48) })
              pop(v, anim); down()
            }

            private fun bubbleAi(t: String, chips: List<String>, anim: Boolean) {
              val big = Th.dp(18f); val small = Th.dp(4f)
              val box = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL }
              val tv = Ui.txt(a, t, 14f, Th.TXT)
              tv.setPadding(Th.dpi(14), Th.dpi(10), Th.dpi(14), Th.dpi(10))
              tv.background = GradientDrawable().apply {
                setColor(0x1CFFFFFF); cornerRadii = floatArrayOf(big, big, big, big, big, big, small, small); setStroke(Th.dpi(1), 0x26FFFFFF)
              }
              box.addView(tv)
              if (chips.isNotEmpty()) {
                val row = LinearLayout(a)
                for (c in chips) {
                  val ch = Ui.txt(a, c, 11f, Th.a1, true)
                  ch.setPadding(Th.dpi(10), Th.dpi(5), Th.dpi(10), Th.dpi(5)); ch.background = Th.glass(12f, 0x14FFFFFF, Th.alpha(Th.a1, 110))
                  row.addView(ch, LinearLayout.LayoutParams(-2, -2).apply { marginEnd = Th.dpi(6) })
                }
                val hs = HorizontalScrollView(a).apply { isHorizontalScrollBarEnabled = false; addView(row) }
                box.addView(hs, Ui.lp(top = 6))
              }
              chatCol.addView(box, LinearLayout.LayoutParams(-2, -2).apply { topMargin = Th.dpi(8); marginEnd = Th.dpi(36) })
              pop(box, anim); down()
              if (anim) type(tv, t)
            }

            private fun pop(v: View, anim: Boolean) {
              if (!anim || !Th.anim) return
              v.alpha = 0f; v.translationY = Th.dp(16f); v.scaleX = .96f; v.scaleY = .96f
              v.animate().alpha(1f).translationY(0f).scaleX(1f).scaleY(1f).setDuration(380).setInterpolator(Th.EMPH).withLayer().start()
            }

            private fun down() { chatScroll.postDelayed({ chatScroll.smoothScrollTo(0, 100000) }, 80) }

            /** Reveals text by colouring the unread part transparent, so the bubble never changes size. */
            private fun type(tv: TextView, full: String) {
              if (!Th.anim || full.length < 2) return
              val hidden = SpannableString(full)
              hidden.setSpan(ForegroundColorSpan(0x00000000), 0, full.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
              tv.text = hidden
              val va = ValueAnimator.ofInt(0, full.length)
              va.duration = (full.length * 16L).coerceIn(250L, 1600L); va.interpolator = LinearInterpolator()
              va.addUpdateListener { an ->
                val n = an.animatedValue as Int
                if (n >= full.length) tv.text = full
                else {
                  val s = SpannableString(full)
                  s.setSpan(ForegroundColorSpan(0x00000000), n, full.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  tv.text = s
                }
              }
              va.start()
            }
          }
