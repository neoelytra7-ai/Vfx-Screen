          object Hist {
            const val N = 90
            val cpu = CopyOnWriteArrayList<Float>(); val ram = CopyOnWriteArrayList<Float>(); val bat = CopyOnWriteArrayList<Float>(); val temp = CopyOnWriteArrayList<Float>()
            val tmax = CopyOnWriteArrayList<Float>(); val down = CopyOnWriteArrayList<Float>(); val up = CopyOnWriteArrayList<Float>(); val cur = CopyOnWriteArrayList<Float>()
            var f: List<Long> = emptyList(); var m: List<Long> = emptyList(); var avg = 0; var cpuPct = 0f
            var ramPct = 0f; var ramUsedMb = 0L; var ramTotMb = 0L; var batPct = 0; var batTemp = 0.0; var tmaxV = 0.0
            var downV = 0.0; var upV = 0.0; var curMa = 0.0; var volt = 0; var charging = false
            var zones: List<Pair<String, Double>> = emptyList()
            var seq = 0
            private var last = 0L
            private fun add(l: MutableList<Float>, v: Float) { l.add(v); if (l.size > N) l.removeAt(0) }
            @Synchronized fun sample(c: Context) {
              val now = SystemClock.elapsedRealtime(); if (now - last < 700) return; last = now
              f = S.freqs(); m = S.maxf()
              val on = f.filter { it > 0 }; avg = if (on.isEmpty()) 0 else on.average().toInt()
              val pr = f.indices.filter { m.getOrElse(it) { 0L } > 0 && f[it] > 0 }.map { f[it] * 100f / m[it] }
              cpuPct = if (pr.isEmpty()) 0f else pr.average().toFloat()
              val (a, t) = S.ram(c); ramTotMb = t / 1048576; ramUsedMb = (t - a) / 1048576; ramPct = (t - a) * 100f / t
              batPct = S.batPct(c); batTemp = S.batTemp(c); charging = S.charging(c); curMa = S.currentMa(c)
              volt = S.bat(c)?.getIntExtra("voltage", 0) ?: 0
              zones = S.thermal().filter { it.second in 1.0..150.0 }; tmaxV = zones.map { it.second }.maxOrNull() ?: 0.0
              val (d, u) = S.net(); downV = d; upV = u
              add(cpu, cpuPct); add(ram, ramPct); add(bat, batPct.toFloat()); add(temp, Th.cv(batTemp).toFloat())
              add(tmax, Th.cv(tmaxV).toFloat()); add(down, d.toFloat()); add(up, u.toFloat()); add(cur, curMa.toFloat())
              seq++
            }
          }
