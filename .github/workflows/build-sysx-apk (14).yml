            }

            private fun filter(q0: String) {
              val q = q0.trim().lowercase()
              for (s in secs) {
                if (q.isEmpty()) { s.rows.forEach { it.first.visibility = View.VISIBLE }; s.card.visibility = View.VISIBLE; s.body.visibility = if (s.open) View.VISIBLE else View.GONE; continue }
                val titleHit = s.title.lowercase().contains(q); var any = false
                for ((v, t) in s.rows) { val hit = titleHit || t.contains(q); v.visibility = if (hit) View.VISIBLE else View.GONE; if (hit) any = true }
                s.card.visibility = if (any) View.VISIBLE else View.GONE; s.body.visibility = View.VISIBLE
                s.body.layoutParams = s.body.layoutParams.also { it.height = -2 }
              }
            }

