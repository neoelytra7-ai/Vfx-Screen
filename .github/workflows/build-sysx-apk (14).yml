          cat > app/src/main/java/dev/sysx/Fluid.kt <<'EOF'
          package dev.sysx

          import android.graphics.Canvas
          import android.graphics.ColorFilter
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.Drawable
          import android.view.Choreographer

          /**
           * A damped spring driven by the display's frame clock. Retargeting mid-flight keeps the current
           * velocity, so interrupted motion bends instead of snapping. Call from the main thread only.
           */
          class Spring(x0: Float, k0: Float = 420f, c0: Float = 30f, private val eps: Float = 0.002f, private val on: (Float) -> Unit) {
            // stiff springs (c0 >= 36) are critically damped on purpose: sheets must never overshoot
            private val k = k0 * Th.spd * Th.spd
            private val c = c0 * Th.spd * (if (c0 >= 36f) 1f else Th.damp)
            private var x = x0
            private var v = 0f
            private var tgt = x0
            private var run = false
            private var last = 0L
            val velocity: Float get() = v
            val value: Float get() = x

            private val cb = object : Choreographer.FrameCallback {
              override fun doFrame(t: Long) {
                if (!run) return
                if (last == 0L) last = t
                var left = ((t - last) / 1e9f).coerceIn(0f, 0.034f)
                last = t
                while (left > 0f) {
                  val s = if (left < 0.004f) left else 0.004f
                  v += (-k * (x - tgt) - c * v) * s
                  x += v * s
                  left -= s
                }
                if (Math.abs(v) < eps * 25f && Math.abs(x - tgt) < eps) {
                  x = tgt; v = 0f; run = false; on(x)
                  return
                }
                on(x)
                Choreographer.getInstance().postFrameCallback(this)
              }
            }

            fun to(t: Float, vel: Float = v) {
              tgt = t
              if (!Th.anim) { x = t; v = 0f; run = false; on(x); return }
              v = vel
              if (!run) { run = true; last = 0L; Choreographer.getInstance().postFrameCallback(cb) }
            }

            fun snap(t: Float) { x = t; tgt = t; v = 0f; on(x) }
            fun stop() { run = false; v = 0f }
          }

          /** Soft surface: a top-lit vertical fill and a hairline edge that is brightest where light would hit. */
          class PanelDrawable(private val r: Float, private val top: Int, private val bot: Int, private val e0: Int = 0x55FFFFFF, private val e1: Int = 0x10FFFFFF) : Drawable() {
            private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
            private val edge = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = Math.max(1f, Th.dp(1f)) }
            private val rect = RectF()

            override fun onBoundsChange(b: Rect) {
              val y0 = b.top.toFloat(); val y1 = b.bottom.toFloat()
              fill.shader = LinearGradient(0f, y0, 0f, y1, top, bot, Shader.TileMode.CLAMP)
              edge.shader = LinearGradient(0f, y0, 0f, y1, e0, e1, Shader.TileMode.CLAMP)
            }

            override fun draw(c: Canvas) {
              val h = edge.strokeWidth / 2f
              rect.set(bounds.left + h, bounds.top + h, bounds.right - h, bounds.bottom - h)
              c.drawRoundRect(rect, r, r, fill)
              c.drawRoundRect(rect, r, r, edge)
            }

            override fun setAlpha(a: Int) { fill.alpha = a; edge.alpha = a }
            override fun setColorFilter(cf: ColorFilter?) { fill.colorFilter = cf; edge.colorFilter = cf }
            @Suppress("DEPRECATION")
            override fun getOpacity(): Int = PixelFormat.TRANSLUCENT
          }
