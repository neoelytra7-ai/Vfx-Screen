            }

            fun tabName(): String = listOf("Info", "Auto", "Bench", "Live", "Overlay").getOrElse(cur) { "Info" }
            fun reloadPages() { pages.forEach { it.reload() } }

            private fun handleIntent(i: Intent?) {
              if (Ai.handle(i)) {
                setIntent(Intent())
                toast("Signed in" + (if (Ai.email.isNotBlank()) " as " + Ai.email else ""))
