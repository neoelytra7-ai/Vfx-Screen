          cat > app/src/main/java/dev/sysx/Ai.kt <<'EOF'
          package dev.sysx

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.*

          class AiErr(msg: String) : Exception(msg)

          /** Sign-in + Claude access through the SysX proxy. No API key ever lives on the device. */
          object Ai {
            const val API = "__SYSX_API__"
            @Volatile var reopen = false
            @Volatile var recreate = false
            @Volatile var studio = false

            class Msg(val user: Boolean, val text: String, val chips: List<String> = emptyList())
            class Reply(val say: String, val json: JSONObject)

            val chat = ArrayList<Msg>()
            private val hist = ArrayList<Pair<String, String>>()

            private fun p() = Th.p()
            val configured: Boolean get() = !API.startsWith("__") && !API.contains("example.workers.dev")
            val usingKey: Boolean get() = (p().getString("akey", "") ?: "").isNotBlank()
            val signedIn: Boolean get() = (p().getString("tok", "") ?: "").isNotBlank() || usingKey
            val email: String get() = p().getString("email", "") ?: ""
            val left: Int get() = p().getInt("ai_left", -1)
            val limit: Int get() = p().getInt("ai_limit", -1)
            fun setKey(k: String): Boolean {
              val t = k.trim()
              if (!t.startsWith("sk-ant-") || t.length < 20) return false
              p().edit().putString("akey", t).apply()
              return true
            }
            fun quota(): String = if (usingKey) "Using your own Claude key" else if (left >= 0 && limit > 0) "$left of $limit free requests left today" else "Free daily requests included"

            fun login(c: Context) {
              c.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("$API/auth/start")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
            }

            fun logout() {
              p().edit().remove("tok").remove("email").remove("akey").remove("ai_left").remove("ai_limit").apply()
              synchronized(hist) { hist.clear() }
            }

            /** Called with the sysx://auth?t=...&e=... link the sign-in page hands back. */
            fun handle(i: Intent?): Boolean {
              val d = i?.data ?: return false
              if (d.scheme != "sysx" || d.host != "auth") return false
              val t = d.getQueryParameter("t") ?: return false
              p().edit().putString("tok", t).putString("email", d.getQueryParameter("e") ?: "").remove("ai_left").apply()
              return true
            }

            private const val DOC = """You are SysX AI, the assistant built into the SysX Android app. SysX has five things you can change: automation RULES (run in the background while the engine is on), the HOME-SCREEN WIDGET text, the floating OVERLAY HUD, the app ACCENT colour, and the automation ENGINE switch. The user describes what they want in plain words, often visually ("tiny neon gamer HUD", "red warning when it is hot", "make it calmer"). The app's CURRENT STATE is at the end of this message. Change it to match what they describe.

          Reply with ONLY one JSON object, no markdown and no text outside it. Use only the keys you need:
          {"say":"one or two short friendly sentences: what you changed, or the answer to a question",
           "rules":[rule,...],
           "remove":["exact name of an existing rule",...],
           "widget":"template text",
           "overlay":{key:value,...},
           "overlay_on":true,
           "engine":true,
           "accent":"Yellow"}

          How to work:
          - Use the CURRENT STATE. Follow-ups such as "smaller", "same but pink", "remove the night one", "make it 45 degrees" refer to what already exists. Change only what is needed. For the overlay send only the keys that change.
          - To edit an existing rule, send the full rule again with the same name; it replaces the old one.
          - When you add rules and the engine is off, also send "engine":true so they actually run.
          - Turn visual words into settings. neon, gamer, minimal, clean, dark, glass, bold, big, tiny map to col, bg, alpha, radius, size, pad, font, compact, border and which modules are on. Pick sensible values yourself instead of asking questions.
          - If the request is a question or small talk about the phone, answer it in "say" using the live numbers. If something cannot be done with the lists below, say so briefly and offer the closest option.
          - Never invent rule types, action types, overlay keys, variables or accent names. Keep "say" under 170 characters. Reply in the language the user writes in.

          RULES
          Rule: {"name":str,"enabled":true,"cooldown":seconds,"edge":bool,"hold":seconds,"when":{"all":[cond...],"any":[cond...]},"do":[action...]}
          edge=true fires only when the condition turns true (not repeatedly). hold=N requires the condition to stay true N seconds. Default cooldown 300.
          cond = {"t":TYPE,"v":VALUE,"not":false}. TYPE: battery_lt, battery_gt (percent), temp_gt, temp_lt (battery C), thermal_gt (hottest sensor C), charging (true/false), ram_free_lt (MB), wifi (bool), mobile (bool), time_after, time_before (HH:MM), time_between ("22:00-06:00"), day ("mon,tue" or "weekdays" or "weekend"), net_down_gt, net_up_gt (KB/s), storage_free_lt (GB), uptime_gt (hours), screen_on (bool), cpu_freq_gt (avg MHz), current_gt (battery mA magnitude), volume_lt (music percent), headphones (bool), airplane (bool).
          action = {"a":TYPE,"v":VALUE}. TYPE: notify, toast, speak (text), vibrate (ms or pattern like "200,100,200"), torch (on/off/blink), volume (percent; optional "s":"music|ring|alarm|notification|system"), sound, copy (text), open_url, open_app (package), widget (home widget text), overlay (on/off/toggle), overlay_preset (Minimal|Gamer|Full|Battery|Thermal|Glass|Pulse), http (url; optional "m":"POST","body":json-string), log (text).
          Text may use {battery} {temp} {ramfree} {cpu} {thermal} {down} {up} {time}.

          WIDGET
          Template text, max 6 short lines, no markdown. Variables: {battery} {temp} {ramfree} {cpu} {thermal} {down} {up} {time}. Emojis allowed.

          OVERLAY
          Booleans: clock, uptime, cpu (per core), cpuavg, bars, ram, swap, bat, pwr, temp, zones (sensor list), net, sto, disp, gpu, compact (single line), border, drag, through (click-through), snap, shadow, bold (bold labels), labels (show labels), secs (clock seconds), h12 (12-hour clock), warn (turn values red past the alert limits).
          Numbers: size (6-16 text size), talpha (20-100 text opacity), ls (0-10 letter spacing), lh (0-12 extra line spacing), alpha (0-100 background opacity), bgfade (0-100 fade toward the bottom), radius (0-30), pad (0-24), w (0 = auto, or 80-420 fixed width), align (0 left, 1 center, 2 right; needs a fixed width), bw (1-4 border width), balpha (10-100 border strength), bcol (border colour: -1 follows the label colour, or a colour index), shr (0-8 shadow blur), interval (250-5000 ms), nzones (1-10), dec (0-2 temperature decimals), sep (compact separator: 0 dot, 1 bar, 2 slash, 3 bullet), gap (1-4 spaces around the separator), warnt (35-70 C temperature alert), batlow (5-50 battery alert percent), ramhi (50-95 RAM alert percent), col (label colour: 0 Mint, 1 Cyan, 2 Amber, 3 Pink, 4 White, 5 Accent, 6 Coral, 7 Lime, 8 Violet, 9 Ice), vcol (value colour, same indexes, -1 = default white), bg (0 Black, 1 Navy, 2 Violet, 3 Forest, 4 Slate, 5 Crimson, 6 Teal, 7 Graphite), font (0 data font, 1 interface font), fw (100-800 font weight), nfmt (network: 0 KB/s, 1 Mbps, 2 auto), ramfmt (0 used/total MB, 1 percent, 2 free MB, 3 used/total GB), tunit (0 follow app, 1 C, 2 F), zsort (0 hottest first, 1 name, 2 as listed), zlen (4-24 sensor name length), lcase (0 UPPER, 1 lower, 2 Capitalized).
          More booleans: date (date row), ghz (CPU in GHz), ndown, nup (network directions), batv (battery voltage), tmax, tbat (parts of the temp row), zshort (short sensor names), ltab (align values in a column).
          To choose exact thermal sensors put "zsel":["exact sensor name",...] inside the overlay object (empty array = hottest N). To choose CPU cores put "csel":[0,1,...] (empty = all). Sensor and core lists are in the state below.

          ACCENT
          One of: Yellow, Lemon, Amber, Citrus, Lime, Jade, Mint, Glacier, Cobalt, Orchid, Magenta, Coral, Ember, Crimson, Brass, Ice, Graphite."""

            private fun f1(x: Double) = String.format(Locale.US, "%.1f", x)
            private fun f0(x: Double) = String.format(Locale.US, "%.0f", x)

            /** Everything the model needs to know about the phone and the app right now. */
            private fun state(c: Context, tab: String): String {
              val ov = JSONObject()
              for ((k, d) in Ov.DEF) {
                if (k == "x" || k == "y") continue
                if (d is Boolean) ov.put(k, Ov.b(k)) else ov.put(k, Ov.n(k).toInt())
              }
              val rules = try { Auto.rules().toString() } catch (e: Throwable) { "[]" }
              val h = Hist
              val power = if (h.charging) "charging" else "on battery"
              val live = "battery " + h.batPct + "% " + power + ", battery temp " + f1(h.batTemp) + "C, hottest sensor " + f0(h.tmaxV) + "C, RAM free " + (h.ramTotMb - h.ramUsedMb) + " MB of " + h.ramTotMb + ", CPU avg " + h.avg + " MHz, net down " + f0(h.downV) + " KB/s up " + f0(h.upV) + " KB/s"
              val wt = p().getString("wtxt", S.DEF_W) ?: S.DEF_W
              val now = SimpleDateFormat("EEE HH:mm", Locale.US).format(Date())
              val eng = if (p().getBoolean("engine", false)) "on" else "off"
              return "Device: " + Build.MANUFACTURER + " " + Build.MODEL + ", Android " + Build.VERSION.RELEASE + ". Now: " + now + ". The user is on the \"" + tab + "\" tab.\n" +
                "Live: " + live + "\n" +
                "Automation engine: " + eng + "\n" +
                "Accent: " + (if (Th.idx < Th.accents.size) Th.accents[Th.idx].first else "Custom") + "\n" +
                "Widget template: " + JSONObject.quote(wt) + "\n" +
                "Overlay (shown=" + p().getBoolean("overlay", false) + "): " + ov.toString() + "\n" +
                "Thermal sensors available: " + (try { S.thermal().map { it.first }.distinct().joinToString(", ").take(700) } catch (e: Throwable) { "" }) + "\n" +
                "Selected sensors: " + Ov.zsel().joinToString(", ") + "; selected cores: " + Ov.csel().sorted().joinToString(",") + "\n" +
                "Rules: " + rules.take(3500)
            }

            private fun post(system: String, ask: String): String {
              val own = p().getString("akey", "") ?: ""
              if (own.isBlank() && !configured) throw AiErr("No AI server is set for this build. Connect your own Claude key instead.")
              val msgs = JSONArray()
              synchronized(hist) {
                for (pr in hist) {
                  msgs.put(JSONObject().put("role", "user").put("content", pr.first))
                  msgs.put(JSONObject().put("role", "assistant").put("content", pr.second))
                }
              }
              msgs.put(JSONObject().put("role", "user").put("content", ask))
              val body = JSONObject().put("system", system).put("messages", msgs)
              if (own.isNotBlank()) body.put("model", "claude-haiku-5-5").put("max_tokens", 1200)
              val cn = URL(if (own.isNotBlank()) "https://api.anthropic.com/v1/messages" else API + "/ai").openConnection() as HttpURLConnection
              try {
                cn.requestMethod = "POST"; cn.connectTimeout = 15000; cn.readTimeout = 60000; cn.doOutput = true
                if (own.isNotBlank()) { cn.setRequestProperty("x-api-key", own); cn.setRequestProperty("anthropic-version", "2023-06-01") }
                else cn.setRequestProperty("authorization", "Bearer " + (p().getString("tok", "") ?: ""))
                cn.setRequestProperty("content-type", "application/json")
                cn.outputStream.use { it.write(body.toString().toByteArray()) }
                val code = cn.responseCode
                val s = (if (code < 400) cn.inputStream else cn.errorStream)?.bufferedReader()?.readText() ?: ""
                cn.getHeaderField("x-sysx-left")?.toIntOrNull()?.let { p().edit().putInt("ai_left", it).apply() }
                cn.getHeaderField("x-sysx-limit")?.toIntOrNull()?.let { p().edit().putInt("ai_limit", it).apply() }
                if (code == 401) { logout(); throw AiErr(if (own.isNotBlank()) "Claude rejected that key. Connect it again." else "Your session expired. Sign in again.") }
                if (code >= 400) {
                  val m = try { val j = JSONObject(s); j.optJSONObject("error")?.optString("message") ?: j.optString("error") } catch (e: Throwable) { "" }
                  throw AiErr(if (m.isNotBlank()) m else "Server error ($code)")
                }
                return JSONObject(s).getJSONArray("content").getJSONObject(0).getString("text")
              } finally {
                cn.disconnect()
              }
            }

            /** Blocking: call from a background thread. */
            fun ask(c: Context, tab: String, text: String): Reply {
              val raw = post(DOC + "\n\nCURRENT STATE\n" + state(c, tab), text)
              val a = raw.indexOf('{'); val b = raw.lastIndexOf('}')
              val j = try { JSONObject(raw.substring(a, b + 1)) } catch (e: Throwable) { throw AiErr("The AI answered in an unexpected format. Try rephrasing.") }
              synchronized(hist) { hist.add(Pair(text, raw)); while (hist.size > 3) hist.removeAt(0) }
              return Reply(j.optString("say", ""), j)
            }

            /** UI thread: applies whatever the model returned and lists what changed. */
            fun applyReply(c: Context, j: JSONObject): List<String> {
              val out = ArrayList<String>()

              val rm = j.optJSONArray("remove")
              if (rm != null) {
                val names = HashSet<String>()
                for (i in 0 until rm.length()) names.add(rm.optString(i))
                val src = Auto.rules(); val keep = JSONArray(); var n = 0
                for (i in 0 until src.length()) {
                  val r = src.optJSONObject(i) ?: continue
                  if (names.contains(r.optString("name"))) n++ else keep.put(r)
                }
                if (n > 0) { Auto.save(keep); out.add("Removed " + n + (if (n > 1) " rules" else " rule")) }
              }

              var nr: JSONArray? = j.optJSONArray("rules")
              if (nr == null) { val one = j.optJSONObject("rules"); if (one != null) nr = JSONArray().put(one) }
              if (nr != null) {
                val cur = Auto.rules(); var add = 0; var rep = 0
                for (i in 0 until nr.length()) {
                  val r = nr.optJSONObject(i) ?: continue
                  if (!r.has("when") || !r.has("do")) continue
                  if (!r.has("enabled")) r.put("enabled", true)
                  val nm = r.optString("name", "rule")
                  var at = -1
                  for (k in 0 until cur.length()) { if (cur.optJSONObject(k)?.optString("name") == nm) at = k }
                  if (at >= 0) { cur.put(at, r); rep++ } else { cur.put(r); add++ }
                }
                if (add > 0) out.add("Added " + add + (if (add > 1) " rules" else " rule"))
                if (rep > 0) out.add("Updated " + rep + (if (rep > 1) " rules" else " rule"))
                if (add + rep > 0) Auto.save(cur)
              }

              val w = j.optString("widget", "")
              if (w.isNotBlank()) { p().edit().putString("wtxt", w).apply(); StatsWidget.update(c); out.add("Widget") }

              val o = j.optJSONObject("overlay")
              if (o != null) {
                val za = o.optJSONArray("zsel")
                if (za != null) { p().edit().putString("ov_zsel", (0 until za.length()).map { za.optString(it) }.filter { it.isNotBlank() }.joinToString("|")).apply(); out.add("Sensors") }
                val ca = o.optJSONArray("csel")
                if (ca != null) { p().edit().putString("ov_csel", (0 until ca.length()).map { ca.optInt(it, -1) }.filter { it >= 0 }.joinToString(",")).apply(); out.add("Cores") }
              }
              if (o != null && o.length() > 0) { Ov.applyJson(o); out.add("Overlay style") }

              if (j.has("overlay_on")) {
                val on = j.optBoolean("overlay_on", false)
                p().edit().putBoolean("overlay", on).apply(); Core.sync(c)
                out.add(if (on) "Overlay on" else "Overlay off")
                if (on && !Settings.canDrawOverlays(c)) out.add("Allow display over apps in the Overlay tab")
              }

              if (j.has("engine")) {
                val on = j.optBoolean("engine", false)
                p().edit().putBoolean("engine", on).apply(); Core.sync(c)
                out.add(if (on) "Engine on" else "Engine off")
              }

              val ac = j.optString("accent", "")
              if (ac.isNotBlank()) {
                val ix = Th.accents.indexOfFirst { it.first.equals(ac, true) }
                if (ix >= 0 && ix != Th.idx) {
                  p().edit().putInt("acc2", ix).apply(); Th.load()
                  out.add("Accent " + Th.accents[ix].first)
                  recreate = true
                }
              }
              return out
            }
          }
