          # ======================= LIST =======================
          func ftype(n: String) -> String:
            var e := n.get_extension().to_lower()
            for k in EXT:
              if e in EXT[k]:
                return k
            return "file"

          func fmt(b: int) -> String:
            if b < 1000:
              return "%d B" % b
            if b < 1000000:
              return "%d KB" % int(b / 1000)
            if b < 1000000000:
              return "%.1f MB" % (b / 1e6)
            return "%.1f GB" % (b / 1e9)

          func _cmp(x: Dictionary, y: Dictionary) -> bool:
            if x.d != y.d:
              return x.d
            if sortk == 1 and x.s != y.s:
              return x.s > y.s
            if sortk == 2 and x.t != y.t:
              return x.t < y.t
            return x.n.naturalnocasecmp_to(y.n) < 0

          func view() -> Array:
            var a: Array = []
            for e in ents:
              if query == "" or e.n.to_lower().contains(query):
                a.append(e)
            a.sort_custom(_cmp)
            return a

          func load_dir(p: String) -> void:
            cur = p
            if scan_t != null and scan_t.is_started():
              scan_t.wait_to_finish()
            scan_t = Thread.new()
            scan_t.start(_scan.bind(p))

          func _scan(p: String) -> void:
            var out: Array = []
            var d := DirAccess.open(p)
            if d != null:
              d.include_hidden = true
              for n in d.get_directories():
                out.append({"n": n, "d": true, "s": 0, "t": "folder"})
              for n in d.get_files():
                var s := 0
                var f := FileAccess.open(p.path_join(n), FileAccess.READ)
                if f != null:
                  s = f.get_length()
                  f.close()
                out.append({"n": n, "d": false, "s": s, "t": ftype(n)})
            call_deferred("_show", p, out)

          func _show(p: String, out: Array) -> void:
            if p != cur:
              return
            ents = out
            sel.clear()
            limit = 400
            sc.scroll_vertical = 0
            rebuild()
            crumb.text = cur.replace(ROOT, "Storage")
            var da := DirAccess.open(ROOT)
            if da != null:
              lvl.text = "%d GB bebas" % int(da.get_space_left() / 1073741824.0)

          func open(p: String) -> void:
            query = ""
            qe.text = ""
            load_dir(p)

          func up() -> void:
            if cur != ROOT:
              open(cur.get_base_dir())

          func back() -> void:
            if not sel.is_empty():
              sel.clear()
              sync_sel()
            elif qe.visible:
              qe.visible = false
              query = ""
              rebuild()
            elif cur != ROOT:
              open(cur.get_base_dir())
            else:
              get_tree().quit()

          func rebuild() -> void:
            for c in vb.get_children():
              c.queue_free()
            rows.clear()
            vw = view()
            for i in mini(vw.size(), limit):
              add_row(vw[i], i)
            if vw.size() > limit:
              var b := Button.new()
              b.text = "Tampilkan lebih (%d lagi)" % (vw.size() - limit)
              b.pressed.connect(func(): limit += 400; rebuild())
              vb.add_child(b)
            if vw.is_empty():
              var l := Label.new()
              l.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
              l.add_theme_font_size_override("font_size", 30)
              if ents.is_empty() and cur == ROOT and query == "":
                l.text = "Belum ada akses file\nTap tombol di bawah"
                vb.add_child(l)
                var pb := Button.new()
                pb.text = "Beri akses 'Semua file'"
                pb.pressed.connect(func(): OS.request_permissions())
                vb.add_child(pb)
              else:
                l.text = "Kosong...\nPasang blok baru (slot 1)"
                vb.add_child(l)
            sync_cnt()

          func add_row(e: Dictionary, i: int) -> void:
            var r := PanelContainer.new()
            r.mouse_filter = Control.MOUSE_FILTER_PASS
            r.custom_minimum_size = Vector2(0, 52)
            var h := HBoxContainer.new()
            h.mouse_filter = Control.MOUSE_FILTER_IGNORE
            h.add_theme_constant_override("separation", 10)
            r.add_child(h)
            h.add_child(tex_rect(e.t, 36))
            var n := Label.new()
            n.text = e.n
            n.clip_text = true
            n.text_overrun_behavior = TextServer.OVERRUN_TRIM_ELLIPSIS
            n.add_theme_font_size_override("font_size", 28)
            fl(n)
            h.add_child(n)
            var m := Label.new()
            m.text = "folder" if e.d else fmt(e.s)
            m.modulate = Color(.62, .62, .62)
            h.add_child(m)
            var ck := Panel.new()
            ck.custom_minimum_size = Vector2(22, 22)
            ck.mouse_filter = Control.MOUSE_FILTER_IGNORE
            h.add_child(ck)
            r.gui_input.connect(_row_input.bind(i))
            vb.add_child(r)
            rows.append(r)
            style_row(i)
            if i < 12:
              r.modulate.a = 0.0
              create_tween().tween_property(r, "modulate:a", 1.0, 0.18).set_delay(i * 0.02)

          func style_row(i: int) -> void:
            if i >= rows.size() or i >= vw.size():
              return
            var r: PanelContainer = rows[i]
            var on: bool = sel.has(vw[i].n)
            var s := StyleBoxFlat.new()
            s.bg_color = Color(acc.r * .25, acc.g * .25, acc.b * .25, .92) if on else Color(.07, .07, .07, .8)
            s.set_border_width_all(3)
            s.border_color = acc if on else Color.BLACK
            s.set_content_margin_all(7)
            r.add_theme_stylebox_override("panel", s)
            var ck: Panel = r.get_child(0).get_child(3)
            var c := StyleBoxFlat.new()
            c.bg_color = acc if on else Color.BLACK
            c.set_border_width_all(3)
            c.border_color = Color.WHITE if on else Color("555555")
            ck.add_theme_stylebox_override("panel", c)

          func sync_cnt() -> void:
            cnt.text = "%d dipilih" % sel.size()
            cnt.visible = sel.size() > 0

          func sync_sel() -> void:
            for i in rows.size():
              style_row(i)
            sync_cnt()

          func tog(i: int) -> void:
            if i >= vw.size():
              return
            var n: String = vw[i].n
            if sel.has(n):
              sel.erase(n)
            else:
              sel[n] = true
            style_row(i)
            sync_cnt()

          func _row_input(e: InputEvent, i: int) -> void:
            if e is InputEventMouseButton and e.button_index == MOUSE_BUTTON_LEFT:
              if e.pressed:
                pp = e.global_position
                lp_id += 1
                var id := lp_id
                get_tree().create_timer(0.45).timeout.connect(func(): _lp(id, i))
              elif pp.x >= 0:
                pp = Vector2(-1, -1)
                lp_id += 1
                _tap(i)
            elif e is InputEventMouseMotion and pp.x >= 0 and e.global_position.distance_to(pp) > 14.0:
              pp = Vector2(-1, -1)
              lp_id += 1

          func _lp(id: int, i: int) -> void:
            if id == lp_id and pp.x >= 0 and i < vw.size():
              pp = Vector2(-1, -1)
              tog(i)
              Input.vibrate_handheld(15)

          func _tap(i: int) -> void:
            if i >= vw.size():
              return
            var e: Dictionary = vw[i]
            if not sel.is_empty():
              tog(i)
            elif e.d:
              open(cur.path_join(e.n))
            else:
              toast(e.n, fmt(e.s) + " · " + e.t)

          # ======================= AKSI =======================
          func sel_paths() -> Array:
            var a: Array = []
            for n in sel:
              a.append(cur.path_join(n))
            return a

          func act(i: int) -> void:
            Input.vibrate_handheld(12)
            var b: Button = hot[i]
            b.pivot_offset = b.size / 2
            var tw := create_tween()
            tw.tween_property(b, "scale", Vector2(.82, .82), .06)
            tw.tween_property(b, "scale", Vector2.ONE, .14).set_trans(Tween.TRANS_BACK).set_ease(Tween.EASE_OUT)
            var items := sel_paths()
            match i:
              0:
                var n := uniq(cur, "Folder Baru")
                if DirAccess.make_dir_recursive_absolute(cur.path_join(n)) == OK:
                  toast("Blok dipasang", n)
                  load_dir(cur)
                else:
                  toast("Gagal", "Tidak ada izin tulis")
              1, 2:
                if not items.is_empty():
                  clip = {"mode": "copy" if i == 1 else "move", "items": items}
                  sel.clear()
                  sync_sel()
                  toast("Disalin" if i == 1 else "Diambil", "%d item · buka folder tujuan, tap lagi" % items.size())
                elif not clip.is_empty():
                  job(clip.mode, clip.items, cur)
                  clip = {}
                else:
                  toast("Tangan kosong", "Tahan lama untuk memilih")
              3:
                if items.is_empty():
                  toast("Tangan kosong", "Pilih item dulu")
                else:
                  job("zip", items, cur)
              4:
                if items.is_empty():
                  toast("Tangan kosong", "Pilih item dulu")
                else:
                  pend_del = items
                  dlg.dialog_text = "Hapus permanen %d item?" % items.size()
                  dlg.popup_centered()
              5:
                qe.visible = not qe.visible
                if qe.visible:
                  qe.grab_focus()
                else:
                  query = ""
                  qe.text = ""
                  rebuild()
              6:
                sortk = (sortk + 1) % 3
                rebuild()
                toast("Urut: " + SORTN[sortk], "Folder selalu di atas")
              7:
                if sel.size() == vw.size():
                  sel.clear()
                else:
                  for e in vw:
                    sel[e.n] = true
                sync_sel()
              8:
                var tot := 0
                for e in ents:
                  tot += e.s
                toast(cur.get_file() if cur != ROOT else "Storage", "%d item · %s" % [ents.size(), fmt(tot)])

          func _ex(p: String) -> bool:
            return FileAccess.file_exists(p) or DirAccess.dir_exists_absolute(p)

          func uniq(d: String, n: String) -> String:
            if not _ex(d.path_join(n)):
              return n
            var b := n.get_basename()
            var x := n.get_extension()
            var k := 1
            while true:
              var m := "%s (%d)%s" % [b, k, ("." + x) if x != "" else ""]
              if not _ex(d.path_join(m)):
                return m
              k += 1
            return n

          func job(kind: String, items: Array, dest: String) -> void:
            if busy:
              toast("Sibuk", "Tunggu proses selesai")
              return
            busy = true
            done_n = 0
            tot_n = 1
            xp.value = 0
            toast("Memproses...", "%d item" % items.size())
            if job_t != null and job_t.is_started():
              job_t.wait_to_finish()
            job_t = Thread.new()
            job_t.start(_run_job.bind(kind, items, dest))

          func _run_job(kind: String, items: Array, dest: String) -> void:
            var t := 0
            for p in items:
              t += _count(p)
            tot_n = maxi(t, 1)
            var err := ""
            match kind:
              "copy", "move":
                for p in items:
                  var dst: String = dest.path_join(uniq(dest, p.get_file()))
                  if kind == "move" and DirAccess.rename_absolute(p, dst) == OK:
                    _tick()
                  else:
                    _cp(p, dst)
                    if kind == "move":
                      _rm(p)
              "zip":
                err = _zip(items, dest.path_join(uniq(dest, "arsip.zip")))
              "del":
                for p in items:
                  _rm(p)
            call_deferred("_job_done", kind, err)

          func _job_done(kind: String, err: String) -> void:
            if job_t != null and job_t.is_started():
              job_t.wait_to_finish()
            busy = false
            xp.value = 100
            create_tween().tween_property(xp, "value", 0.0, 0.8).set_delay(0.4)
            sel.clear()
            if err != "":
              toast("Gagal", err)
            else:
              toast({"copy": "Ditempel", "move": "Dipindah", "zip": "Dikompres", "del": "Dihancurkan"}[kind], "Selesai")
            load_dir(cur)

          func _tick() -> void:
            done_n += 1
            if done_n % 4 == 0:
              call_deferred("_prog")

          func _prog() -> void:
            xp.value = 100.0 * done_n / tot_n

          func _count(p: String) -> int:
            if not DirAccess.dir_exists_absolute(p):
              return 1
            var n := 1
            var d := DirAccess.open(p)
            if d == null:
              return n
            d.include_hidden = true
            for s in d.get_directories():
              n += _count(p.path_join(s))
            n += d.get_files().size()
            return n

          func _cp(src: String, dst: String) -> void:
            if DirAccess.dir_exists_absolute(src):
              DirAccess.make_dir_recursive_absolute(dst)
              var d := DirAccess.open(src)
              if d == null:
                return
              d.include_hidden = true
              for n in d.get_directories():
                _cp(src.path_join(n), dst.path_join(n))
              for n in d.get_files():
                _cp(src.path_join(n), dst.path_join(n))
            else:
              DirAccess.copy_absolute(src, dst)
              _tick()

          func _rm(p: String) -> void:
            if DirAccess.dir_exists_absolute(p):
              var d := DirAccess.open(p)
              if d != null:
                d.include_hidden = true
                for n in d.get_directories():
                  _rm(p.path_join(n))
                for n in d.get_files():
                  DirAccess.remove_absolute(p.path_join(n))
                  _tick()
            DirAccess.remove_absolute(p)

          func _zip(items: Array, out: String) -> String:
            var z := ZIPPacker.new()
            if z.open(out) != OK:
              return "Tidak bisa membuat zip"
            for p in items:
              _zadd(z, p, p.get_file())
            z.close()
            return ""

          func _zadd(z: ZIPPacker, p: String, rel: String) -> void:
            if DirAccess.dir_exists_absolute(p):
              var d := DirAccess.open(p)
              if d == null:
                return
              d.include_hidden = true
              for n in d.get_directories():
                _zadd(z, p.path_join(n), rel + "/" + n)
              for n in d.get_files():
                _zadd(z, p.path_join(n), rel + "/" + n)
            else:
              z.start_file(rel)
              z.write_file(FileAccess.get_file_as_bytes(p))
              z.close_file()
              _tick()
          EOF

          python3 - <<'PY'
          import zlib, struct
          g = ["o......o", "oo....oo", "oooooooo", "owkoowko", "oooooooo", "owwoowwo", ".owwwwo.", "..okko.."]
          C = {'o': (232, 128, 42), 'w': (255, 255, 255), 'k': (0, 0, 0)}
          cells, px = 12, 16
          raw = b''
          for y in range(cells * px):
              cy = y // px
              row = b'\x00'
              for x in range(cells * px):
                  cx = x // px
                  col = (95, 176, 47) if cy == 0 else (122, 82, 48)
                  fy, fx = cy - 2, cx - 2
                  if 0 <= fy < 8 and 0 <= fx < 8 and g[fy][fx] in C:
                      col = C[g[fy][fx]]
                  row += bytes(col)
              raw += row
          def ch(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          w = cells * px
          png = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, w, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw, 9)) + ch(b'IEND', b'')
          open('gd/icon.png', 'wb').write(png)
          PY

          curl -fsSL -o $P/VT323.ttf https://github.com/google/fonts/raw/main/ofl/vt323/VT323-Regular.ttf || echo "font gagal diunduh, pakai font default"
          ls -la $P

      - name: Cache Godot + templates
        id: gcache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VER }}-android-v1

      - name: Download Godot + Android templates
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          set -e
          B=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}-stable
          mkdir -p ~/godot-bin /tmp/tpl
          curl -fsSL -o /tmp/g.zip $B/Godot_v${GODOT_VER}-stable_linux.x86_64.zip
          unzip -q -o /tmp/g.zip -d ~/godot-bin
          curl -fsSL -o /tmp/t.tpz $B/Godot_v${GODOT_VER}-stable_export_templates.tpz
          unzip -q -o /tmp/t.tpz 'templates/android*' 'templates/version.txt' -d /tmp/tpl
          D=~/.local/share/godot/export_templates/${GODOT_VER}.stable
          mkdir -p $D
          mv /tmp/tpl/templates/* $D/
          ls -la $D

      - name: Android SDK + keystore + editor settings
        run: |
          set -e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "build-tools;30.0.3" "platforms;android-34" 2>&1 | tail -n 15 || true
          keytool -genkeypair -keystore $HOME/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 9999 -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -keystore $HOME/release.jks -storepass foxlhub -keypass foxlhub \
            -alias k -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Foxle"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VER}.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          done

      - name: Preflight check
        run: |
          echo "JAVA_HOME=$JAVA_HOME"; ls "$JAVA_HOME/bin" | grep -E '^(java|javac|keytool|jarsigner)$' || echo "!! JDK tools missing"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/platform-tools/adb" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || echo "!! SDK tools missing"
          T=~/.local/share/godot/export_templates/${GODOT_VER}.stable
          ls -la "$T"
          test -f "$T/android_debug.apk" && test -f "$T/android_release.apk" || echo "!! android templates missing"
          ls -la $HOME/debug.keystore $HOME/release.jks
          ls ~/.config/godot; cat ~/.config/godot/editor_settings-${GODOT_VER}.tres

      - name: Import + Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: k
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: foxlhub
        run: |
          G=$(ls ~/godot-bin/Godot_v*linux.x86_64 | head -n1)
          chmod +x "$G"
          "$G" --version
          timeout 300 "$G" --headless --path gd --import || true
          OUT=$GITHUB_WORKSPACE/out/FoxleGodot.apk
          "$G" --headless --verbose --path gd --export-release "Android" "$OUT" || \
          "$G" --headless --verbose --path gd --export-debug "Android" "$OUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: FoxleGodot
          path: out/FoxleGodot.apk
          if-no-files-found: error
