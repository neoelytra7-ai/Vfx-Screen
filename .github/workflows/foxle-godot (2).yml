name: Build Foxle Godot APK

on:
  push:
    paths: ['.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: foxle-godot
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VER: '4.3'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project (heredoc)
        run: |
          set -e
          P=gd
          mkdir -p $P out

          cat > $P/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Foxle"
          run/main_scene="res://main.tscn"
          config/icon="res://icon.png"
          config/quit_on_go_back=false

          [display]
          window/size/viewport_width=540
          window/size/viewport_height=1170
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"
          window/handheld/orientation=1

          [input_devices]
          sensors/enable_accelerometer=true
          sensors/enable_gravity=true

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          textures/canvas_textures/default_texture_filter=0
          textures/vram_compression/import_etc2_astc=true
          environment/defaults/default_clear_color=Color(0, 0, 0, 1)
          EOF

          cat > $P/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://main.gd" id="1"]

          [node name="Main" type="Node"]
          script = ExtResource("1")
          EOF

          cat > $P/export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="app.foxl.godot"
          package/name="Foxle"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/custom_permissions=PackedStringArray()
          permissions/manage_external_storage=true
          permissions/read_external_storage=true
          permissions/write_external_storage=true
          permissions/vibrate=true
          permissions/internet=false
          EOF

          cat > $P/main.gd <<'EOF'
          extends Node

          const ROOT := "/storage/emulated/0"
          const THEMES := ["overworld", "lush", "nether", "end"]
          const TN := {"overworld": "Overworld", "lush": "Lush", "nether": "Nether", "end": "End"}
          const SORTN := ["nama", "ukuran", "tipe"]
          const EXT := {
            "image": ["jpg", "jpeg", "png", "gif", "webp", "bmp"],
            "music": ["mp3", "ogg", "wav", "flac", "m4a", "aac"],
            "zip": ["zip", "rar", "7z", "gz", "tar"],
            "apk": ["apk"],
            "code": ["kt", "java", "js", "ts", "html", "css", "json", "yml", "yaml", "py", "xml", "sh", "c", "cpp", "md", "gd"]
          }
          const G := {
            "fox": ["o......o", "oo....oo", "oooooooo", "owkoowko", "oooooooo", "owwoowwo", ".owwwwo.", "..okko.."],
            "folder": ["........", ".yyy....", "yyyyyyyy", "yoooooyy", "yoooooyy", "yoooooyy", "yoooooyy", "dddddddd"],
            "file": ["lllll...", "lwwwwl..", "lwwwwll.", "lwwwwwwl", "lwsssswl", "lwwwwwwl", "lwsssswl", "llllllll"],
            "image": ["kkkkkkkk", "kbbbbwbk", "kbbbbbbk", "kbgbbbbk", "kgggbggk", "kggggggk", "kddddddk", "kkkkkkkk"],
            "zip": ["pppyypp.", "pppllppp", "pppyyppp", "pppllppp", "pppyyppp", "pppllppp", "pppyyppp", "pppllppp"],
            "music": ["...yyyyy", "...y...y", "...y...y", "...y...y", ".yyy.yyy", "yyyy.yyy", ".yy...y.", "........"],
            "apk": ["..g..g..", "...gg...", ".gggggg.", "ggwggwgg", "gggggggg", "gggggggg", ".gg..gg.", "........"],
            "code": ["......b.", ".....b..", "....b...", "...b....", "....b...", ".....b..", "......b.", "........"],
            "nw": ["...gg...", "...gg...", "...gg...", "gggggggg", "gggggggg", "...gg...", "...gg...", "...gg..."],
            "cp": ["lllll...", "l...l...", "l.lllll.", "l.l...l.", "lll...l.", "..l...l.", "..lllll.", "........"],
            "mv": ["........", "...y....", "...yy...", "yyyyyyy.", "yyyyyyy.", "...yy...", "...y....", "........"],
            "del": ["..ssss..", "rrrrrrrr", ".rwrwrr.", ".rrwrwr.", ".rwrwrr.", ".rrwrwr.", ".rrrrrr.", "........"],
            "find": ["..lll...", ".l...l..", ".l...l..", "..lll...", "....l...", ".....y..", "......y.", "........"],
            "sort": ["yyyyyyyy", "........", "yyyyyy..", "........", "yyyy....", "........", "yy......", "........"],
            "all": ["........", "......g.", ".....gg.", "g...gg..", "gg.gg...", ".ggg....", "..g.....", "........"],
            "inf": ["...bb...", "........", "..bbb...", "...bb...", "...bb...", "...bb...", "..bbbb..", "........"],
            "cfg": ["...ll...", "l.llll.l", "llllllll", "lll..lll", "lll..lll", "llllllll", "l.llll.l", "...ll..."]
          }
          const HB := ["nw", "cp", "mv", "zip", "del", "find", "sort", "all", "inf"]

          var PAL := {"k": Color("000000"), "o": Color("e8802a"), "w": Color("ffffff"), "g": Color("5fb02f"), "d": Color("8a5a2b"), "y": Color("fcdb5a"), "s": Color("7a7a7a"), "b": Color("4a7fd4"), "r": Color("d6403a"), "l": Color("c9c9c9"), "p": Color("9b59c9")}
          var ACC := {"overworld": Color("fcdb5a"), "lush": Color("ffb347"), "nether": Color("ffb02e"), "end": Color("e0a8ff")}
          var TOPC := {"overworld": Color("7a5230"), "lush": Color("2f5a2a"), "nether": Color("6b1d1d"), "end": Color("2f2a4a")}
          var GRS := {"overworld": Color("5fb02f"), "lush": Color("e86fb0"), "nether": Color("ff6a1a"), "end": Color("b44cff")}
          # blok: [warna1, warna2, emisi, unshaded]
          var BL := {
            "grass": [Color("4f9a28"), Color("7ad13e"), 0.0, false],
            "dirt": [Color("6a4627"), Color("8a5a2b"), 0.0, false],
            "wood": [Color("5a3b1c"), Color("7a5230"), 0.0, false],
            "leaf": [Color("2f6b1f"), Color("4fa334"), 0.0, false],
            "moss": [Color("2d5a22"), Color("4a8a34"), 0.0, false],
            "cave": [Color("1d2a1f"), Color("34503a"), 0.0, false],
            "glow": [Color("ffb347"), Color("fff0a0"), 2.2, false],
            "nrack": [Color("5a1a1a"), Color("8a2a2a"), 0.0, false],
            "gstone": [Color("e0a030"), Color("ffe080"), 1.8, false],
            "ember": [Color("ff6a00"), Color("ffd060"), 2.5, true],
            "endst": [Color("d8d49a"), Color("f0ecb8"), 0.0, false],
            "obs": [Color("140a24"), Color("2a1448"), 0.0, false],
            "crys": [Color("ff4fd8"), Color("ffb0f0"), 2.5, true],
            "cloud": [Color("ffffff"), Color("dcecff"), 0.0, true],
            "sun": [Color("fff2a0"), Color("ffe060"), 1.0, true],
            "star": [Color("ffffff"), Color("c8b0ff"), 1.0, true]
          }

          var fnt: Font
          var thm := Theme.new()
          var ui: Control
          var vb: VBoxContainer
          var sc: ScrollContainer
          var crumb: Label
          var cnt: Label
          var lvl: Label
          var xp: ProgressBar
          var qe: LineEdit
          var top_p: PanelContainer
          var strip: ColorRect
          var toast_p: PanelContainer
          var toast_t: Label
          var toast_x: Label
          var dlg: ConfirmationDialog
          var ender: CPUParticles2D
          var hot: Array = []
          var top_pad := 0
          var bot_pad := 0

          var cur := ROOT
          var ents: Array = []
          var vw: Array = []
          var rows: Array = []
          var sel := {}
          var clip := {}
          var sortk := 0
          var query := ""
          var limit := 400
          var mode := 0
          var th := "overworld"
          var acc := Color("fcdb5a")
          var icons := {}
          var mats := {}
          var busy := false
          var scan_t: Thread
          var job_t: Thread
          var done_n := 0
          var tot_n := 1
          var ttw: Tween
          var pend_del: Array = []
          var pp := Vector2(-1, -1)
          var lp_id := 0

          var env: Environment
          var cam: Camera3D
          var world: Node3D
          var clouds_n: Node3D
          var spin: Array = []
          var cbase := Vector3(0, 9, 14)
          var ctar := Vector3(0, 3, -12)
          var par := Vector2.ZERO
          var scr := 0.0
          var t_acc := 0.0
          var nz := FastNoiseLite.new()
          var rng := RandomNumberGenerator.new()

          # ======================= START =======================
          func _ready() -> void:
            Engine.max_fps = 60
            if ResourceLoader.exists("res://VT323.ttf"):
              fnt = load("res://VT323.ttf")
            else:
              fnt = ThemeDB.fallback_font
            thm.default_font = fnt
            thm.default_font_size = 26
            thm.set_color("font_shadow_color", "Label", Color(0, 0, 0, .8))
            thm.set_constant("shadow_offset_x", "Label", 2)
            thm.set_constant("shadow_offset_y", "Label", 2)
            var cf := ConfigFile.new()
            if cf.load("user://foxle.cfg") == OK:
              mode = int(cf.get_value("s", "mode", 0))
            make_env()
            build_ui()
            var spl := make_splash()
            await get_tree().process_frame
            await get_tree().process_frame
            apply_mode()
            get_tree().on_request_permissions_result.connect(func(_p, _g): load_dir(cur))
            OS.request_permissions()
            load_dir(ROOT)
            await get_tree().create_timer(1.5).timeout
            var tw := create_tween()
            tw.tween_property(spl, "modulate:a", 0.0, 0.45)
            tw.tween_callback(spl.get_parent().queue_free)

          func _notification(what: int) -> void:
            if what == NOTIFICATION_WM_GO_BACK_REQUEST:
              back()
            elif what == NOTIFICATION_APPLICATION_FOCUS_IN and ui != null:
              load_dir(cur)

          func _input(e: InputEvent) -> void:
            if e is InputEventMouseButton and e.pressed and e.button_index == MOUSE_BUTTON_LEFT and ender != null:
              ender.position = e.position
              ender.restart()
              ender.emitting = true

          func theme_key() -> String:
            if mode > 0:
              return THEMES[mode - 1]
            var h: int = Time.get_datetime_dict_from_system()["hour"]
            if h >= 5 and h < 10:
              return "overworld"
            if h >= 10 and h < 16:
              return "lush"
            if h >= 16 and h < 20:
              return "nether"
            return "end"

          func apply_mode() -> void:
            th = theme_key()
            build_world(th)
            skin()

          # ======================= 3D =======================
          func make_env() -> void:
            env = Environment.new()
            env.background_mode = Environment.BG_COLOR
            env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
            env.fog_enabled = true
            var we := WorldEnvironment.new()
            we.environment = env
            add_child(we)
            cam = Camera3D.new()
            cam.fov = 62
            cam.far = 220
            add_child(cam)
            cam.current = true

          func mk_tex(c1: Color, c2: Color, sd: int) -> ImageTexture:
            var img := Image.create(16, 16, false, Image.FORMAT_RGBA8)
            var r := RandomNumberGenerator.new()
            r.seed = sd
            for y in 16:
              for x in 16:
                img.set_pixel(x, y, c1.lerp(c2, float(r.randi() % 3) * 0.5))
            img.generate_mipmaps()
            return ImageTexture.create_from_image(img)

          func M(k: String) -> StandardMaterial3D:
            if mats.has(k):
              return mats[k]
            var b: Array = BL[k]
            var t := mk_tex(b[0], b[1], hash(k))
            var m := StandardMaterial3D.new()
            m.albedo_texture = t
            m.texture_filter = BaseMaterial3D.TEXTURE_FILTER_NEAREST_WITH_MIPMAPS
            if b[2] > 0.0:
              m.emission_enabled = true
              m.emission = Color.WHITE
              m.emission_texture = t
              m.emission_energy_multiplier = b[2]
            if b[3]:
              m.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
            mats[k] = m
            return m

          func add_blocks(m: Material, pts: Array, s: float = 1.0) -> void:
            if pts.is_empty():
              return
            var mm := MultiMesh.new()
            mm.transform_format = MultiMesh.TRANSFORM_3D
            var box := BoxMesh.new()
            box.size = Vector3(s, s, s)
            box.material = m
            mm.mesh = box
            mm.instance_count = pts.size()
            for i in pts.size():
              mm.set_instance_transform(i, Transform3D(Basis(), pts[i]))
            var mi := MultiMeshInstance3D.new()
            mi.multimesh = mm
            world.add_child(mi)

          func slab(m: Material, size: Vector3, pos: Vector3) -> MeshInstance3D:
            var mi := MeshInstance3D.new()
            var b := BoxMesh.new()
            b.size = size
            b.material = m
            mi.mesh = b
            mi.position = pos
            world.add_child(mi)
            return mi

          func tiled(k: String, sx: float, sz: float) -> StandardMaterial3D:
            var m: StandardMaterial3D = M(k).duplicate()
            m.uv1_scale = Vector3(sx, sz, 1)
            return m

          func sunlight(e: float, rot: Vector3) -> void:
            var l := DirectionalLight3D.new()
            l.light_energy = e
            l.rotation_degrees = rot
            world.add_child(l)

          func omni(p: Vector3, c: Color, e: float, r: float) -> void:
            var l := OmniLight3D.new()
            l.position = p
            l.light_color = c
            l.light_energy = e
            l.omni_range = r
            world.add_child(l)

          func setenv(sky: Color, fog: Color, dens: float, amb: Color, ambe: float) -> void:
            env.background_color = sky
            env.fog_light_color = fog
            env.fog_density = dens
            env.ambient_light_color = amb
            env.ambient_light_energy = ambe

          func terrain(top: Material, side: Material, amp: float, base: float, hmin: int = -99) -> Dictionary:
            var H := {}
            for x in range(-18, 19):
              for z in range(-36, 7):
                H[Vector2i(x, z)] = maxi(hmin, int(round(base + nz.get_noise_2d(x * 1.0, z * 1.0) * amp)))
            var tp: Array = []
            var sd: Array = []
            for k in H:
              var h: int = H[k]
              var lo := h
              for o in [Vector2i(1, 0), Vector2i(-1, 0), Vector2i(0, 1), Vector2i(0, -1)]:
                lo = mini(lo, int(H.get(k + o, h)))
              tp.append(Vector3(k.x, h, k.y))
              for y in range(lo, h):
                sd.append(Vector3(k.x, y, k.y))
            add_blocks(top, tp)
            add_blocks(side, sd)
            return H

          func build_world(t: String) -> void:
            if world != null:
              world.queue_free()
            world = Node3D.new()
            add_child(world)
            spin.clear()
            clouds_n = null
            nz.seed = hash(t)
            nz.frequency = 0.09
            rng.seed = hash(t) + 1
            par = Vector2.ZERO
            match t:
              "overworld":
                setenv(Color("7ab8ff"), Color("a8d4ff"), 0.012, Color("b8d8ff"), 0.9)
                sunlight(1.1, Vector3(-50, -30, 0))
                cbase = Vector3(0, 9, 14)
                ctar = Vector3(0, 3, -12)
                var H := terrain(M("grass"), M("dirt"), 4.0, 3.0)
                var tr: Array = []
                var lf: Array = []
                for i in 16:
                  var x := rng.randi_range(-16, 16)
                  var z := rng.randi_range(-32, 0)
                  var h := int(H.get(Vector2i(x, z), 0)) + 1
                  for y in 3:
                    tr.append(Vector3(x, h + y, z))
                  for dx in range(-1, 2):
                    for dz in range(-1, 2):
                      for dy in [3, 4]:
                        if not (dx == 0 and dz == 0 and dy == 3):
                          lf.append(Vector3(x + dx, h + dy, z + dz))
                  lf.append(Vector3(x, h + 5, z))
                add_blocks(M("wood"), tr)
                add_blocks(M("leaf"), lf)
                slab(M("sun"), Vector3(7, 7, 1), Vector3(-26, 28, -75))
                clouds_n = Node3D.new()
                world.add_child(clouds_n)
                for i in 10:
                  var mi := MeshInstance3D.new()
                  var b := BoxMesh.new()
                  b.size = Vector3(rng.randf_range(5, 9), 1.2, rng.randf_range(3, 5))
                  b.material = M("cloud")
                  mi.mesh = b
                  mi.position = Vector3(rng.randf_range(-40, 40), rng.randf_range(16, 22), rng.randf_range(-62, -10))
                  clouds_n.add_child(mi)
              "lush":
                setenv(Color("04100a"), Color("0b2a14"), 0.03, Color("2a5a3a"), 0.8)
                sunlight(0.25, Vector3(-60, 20, 0))
                cbase = Vector3(0, 6, 12)
                ctar = Vector3(0, 6, -14)
                terrain(M("moss"), M("cave"), 3.0, 2.0)
                slab(tiled("cave", 22, 22), Vector3(40, 2, 46), Vector3(0, 16, -15))
                var st: Array = []
                var gl: Array = []
                for i in 120:
                  var x := rng.randi_range(-17, 17)
                  var z := rng.randi_range(-34, 4)
                  var L := rng.randi_range(1, 4)
                  for k in L:
                    st.append(Vector3(x, 14 - k, z))
                  if rng.randf() < 0.5:
                    gl.append(Vector3(x, 13 - L, z))
                add_blocks(M("cave"), st)
                add_blocks(M("glow"), gl, 0.6)
                omni(Vector3(-8, 9, -8), Color("ffa52e"), 2.5, 16)
                omni(Vector3(8, 9, -18), Color("ffa52e"), 2.5, 16)
                omni(Vector3(0, 8, 2), Color("7cff3a"), 1.5, 14)
              "nether":
                setenv(Color("1a0404"), Color("4a0c04"), 0.022, Color("7a2a1a"), 0.9)
                sunlight(0.2, Vector3(-60, 20, 0))
                cbase = Vector3(0, 8, 14)
                ctar = Vector3(0, 2, -14)
                terrain(M("nrack"), M("nrack"), 5.0, 3.0, 0)
                var sh := Shader.new()
                sh.code = "shader_type spatial;\nuniform sampler2D tx : source_color, filter_nearest, repeat_enable;\nvoid fragment() {\n vec2 uv = UV * 14.0; float t = TIME * 0.08;\n float a = texture(tx, uv + vec2(t, t * 0.7)).r;\n float b = texture(tx, uv * 1.3 - vec2(t * 0.6, t)).r;\n float f = clamp(a * b * 2.4, 0.0, 1.0);\n ALBEDO = mix(vec3(0.5, 0.05, 0.0), vec3(1.0, 0.75, 0.1), f);\n EMISSION = ALBEDO * 1.5;\n}\n"
                var sm := ShaderMaterial.new()
                sm.shader = sh
                sm.set_shader_parameter("tx", mk_tex(Color.BLACK, Color.WHITE, 5))
                var pl := MeshInstance3D.new()
                var pm := PlaneMesh.new()
                pm.size = Vector2(90, 90)
                pm.material = sm
                pl.mesh = pm
                pl.position = Vector3(0, 0.8, -14)
                world.add_child(pl)
                slab(tiled("nrack", 22, 22), Vector3(40, 2, 46), Vector3(0, 18, -15))
                var gs: Array = []
                for i in 26:
                  var x := rng.randi_range(-17, 17)
                  var z := rng.randi_range(-34, 4)
                  for k in rng.randi_range(1, 3):
                    gs.append(Vector3(x, 16 - k, z))
                add_blocks(M("gstone"), gs)
                omni(Vector3(0, 3, -10), Color("ff5a10"), 4.0, 26)
                omni(Vector3(-10, 3, -24), Color("ff5a10"), 3.0, 20)
                var pe := CPUParticles3D.new()
                var bm := BoxMesh.new()
                bm.size = Vector3(0.12, 0.12, 0.12)
                bm.material = M("ember")
                pe.mesh = bm
                pe.amount = 70
                pe.lifetime = 6.0
                pe.emission_shape = CPUParticles3D.EMISSION_SHAPE_BOX
                pe.emission_box_extents = Vector3(22, 1, 22)
                pe.direction = Vector3(0, 1, 0)
                pe.spread = 20.0
                pe.initial_velocity_min = 1.5
                pe.initial_velocity_max = 4.0
                pe.gravity = Vector3.ZERO
                pe.position = Vector3(0, 1, -14)
                world.add_child(pe)
              "end":
                setenv(Color("05020c"), Color("1a0a30"), 0.012, Color("6a4a9a"), 0.8)
                sunlight(0.5, Vector3(-40, 30, 0))
                cbase = Vector3(0, 7, 11)
                ctar = Vector3(0, 4, -14)
                island(Vector3(0, 0, -14), 12)
                for i in 7:
                  island(Vector3(rng.randf_range(-24, 24), rng.randf_range(-6, 8), rng.randf_range(-44, -26)), rng.randi_range(2, 4))
                var ob: Array = []
                for i in 8:
                  var a := i * TAU / 8.0
                  var px := int(round(cos(a) * 9.0))
                  var pz := int(round(sin(a) * 9.0 - 14.0))
                  var hg := rng.randi_range(7, 14)
                  for y in range(1, hg):
                    ob.append(Vector3(px, y, pz))
                  var cr := slab(M("crys"), Vector3(1, 1, 1), Vector3(px, hg + 1.5, pz))
                  spin.append(cr)
                  omni(Vector3(px, hg + 2, pz), Color("ff4fd8"), 1.2, 9)
                add_blocks(M("obs"), ob)
                var sp: Array = []
                for i in 170:
                  var d := Vector3(rng.randf_range(-1, 1), rng.randf_range(-0.1, 1), rng.randf_range(-1, -0.2)).normalized()
                  sp.append(d * rng.randf_range(60, 95))
                add_blocks(M("star"), sp, 0.35)

          func island(c: Vector3, r: int) -> void:
            var p: Array = []
            for x in range(-r, r + 1):
              for z in range(-r, r + 1):
                var d := sqrt(float(x * x + z * z))
                if d <= r:
                  var dep := int((r - d) * 0.55)
                  for y in range(-dep, 1):
                    p.append(c + Vector3(x, y, z))
            add_blocks(M("endst"), p)

          func _process(dt: float) -> void:
            if cam == null or world == null:
              return
            t_acc += dt
            var g := Input.get_gravity()
            if g.length() < 0.5:
              g = Input.get_accelerometer()
            var tgt := Vector2.ZERO
            if g.length() > 0.5:
              tgt = Vector2(clampf(-g.x / 6.0, -1.0, 1.0), clampf(g.z / 6.0, -1.0, 1.0))
            else:
              var vs := get_viewport().get_visible_rect().size
              tgt = (get_viewport().get_mouse_position() / vs - Vector2(.5, .5)) * 2.0
            par = par.lerp(tgt, minf(dt * 3.0, 1.0))
            var drift := Vector3(sin(t_acc * .25) * .8, sin(t_acc * .17) * .3, 0)
            cam.position = cbase + Vector3(par.x * 2.6, -par.y * 1.4, 0) + drift + Vector3(0, scr * .5, -scr)
            cam.look_at(ctar + Vector3(par.x * 1.2, par.y * .6, 0))
            if clouds_n != null:
              for c in clouds_n.get_children():
                c.position.x += dt * 0.8
                if c.position.x > 45:
                  c.position.x = -45
            for s in spin:
              s.rotation.y += dt * 1.2
              s.rotation.x += dt * 0.6

          # ======================= UI =======================
          func icon(n: String) -> ImageTexture:
            if icons.has(n):
              return icons[n]
            var g: Array = G[n]
            var img := Image.create(10, 10, false, Image.FORMAT_RGBA8)
            for y in 8:
              for x in 8:
                var ch: String = g[y][x]
                if PAL.has(ch):
                  img.set_pixel(x + 1, y + 1, PAL[ch])
            var edge: Array = []
            for y in 10:
              for x in 10:
                if img.get_pixel(x, y).a == 0.0:
                  for d in [Vector2i(1, 0), Vector2i(-1, 0), Vector2i(0, 1), Vector2i(0, -1)]:
                    var q: Vector2i = Vector2i(x, y) + d
                    if q.x >= 0 and q.y >= 0 and q.x < 10 and q.y < 10 and img.get_pixel(q.x, q.y).a > 0.0:
                      edge.append(Vector2i(x, y))
                      break
            for e in edge:
              img.set_pixel(e.x, e.y, Color.BLACK)
            var t := ImageTexture.create_from_image(img)
            icons[n] = t
            return t

          func bevel(mid: Color, hi: Color, lo: Color) -> StyleBoxTexture:
            var img := Image.create(12, 12, false, Image.FORMAT_RGBA8)
            img.fill(mid)
            for i in 12:
              for k in 3:
                img.set_pixel(i, k, hi)
                img.set_pixel(k, i, hi)
              for k in 3:
                img.set_pixel(i, 11 - k, lo)
                img.set_pixel(11 - k, i, lo)
            for i in 12:
              for e in [0, 11]:
                img.set_pixel(i, e, Color.BLACK)
                img.set_pixel(e, i, Color.BLACK)
            var s := StyleBoxTexture.new()
            s.texture = ImageTexture.create_from_image(img)
            s.set_texture_margin_all(4)
            s.set_content_margin_all(8)
            return s

