          cat > settings.gradle.kts <<'PHOTOSEEK_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PhotoSeek"
          include(":app")
          PHOTOSEEK_EOF

          echo "Project digenerate:"; find . -name "*.kt" -o -name "*.kts" -o -name "*.xml" | grep -v build/ | sort

      - name: Download vocab BPE CLIP (untuk tokenizer teks)
        run: |
          curl -fsSL -o app/src/main/assets/bpe_simple_vocab_16e6.txt.gz \
            https://raw.githubusercontent.com/openai/CLIP/main/clip/bpe_simple_vocab_16e6.txt.gz
          ls -l app/src/main/assets

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSeek-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
