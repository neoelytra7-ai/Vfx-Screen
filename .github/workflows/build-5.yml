# PhotoSeek: pencari foto pakai deskripsi visual (MobileCLIP2-S0 + ONNX Runtime, on-device)
# Taruh file ini di .github/workflows/build.yml di repo kosong, lalu Actions > Build APK > Run workflow.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cek URL model (gagal cepat kalau 404)
        run: |
          set -e
          B=https://huggingface.co/plhery/mobileclip2-onnx/resolve/main/onnx/s0
          for f in vision_model.onnx text_model.onnx; do
            code=$(curl -sL -o /dev/null -I -w '%{http_code}' "$B/$f")
            size=$(curl -sIL "$B/$f" | grep -i '^content-length' | tail -1 | tr -d '\r')
            echo "$f -> HTTP $code | $size"
            [ "$code" = "200" ] || { echo "::error::$f tidak ketemu"; exit 1; }
          done

      - name: Generate project via heredoc
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets app/src/main/kotlin/dev/photoseek

          cat > app/build.gradle.kts <<'PHOTOSEEK_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "dev.photoseek"
              compileSdk = 35

              defaultConfig {
                  applicationId = "dev.photoseek"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              sourceSets["main"].java.srcDirs("src/main/kotlin")
              androidResources { noCompress += listOf("gz") }
          }

          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.22.0")
          }
          PHOTOSEEK_EOF

          cat > app/src/main/AndroidManifest.xml <<'PHOTOSEEK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:allowBackup="false"
                  android:label="PhotoSeek"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PHOTOSEEK_EOF

          cat > app/src/main/kotlin/dev/photoseek/Clip.kt <<'PHOTOSEEK_EOF'
          package dev.photoseek

          import ai.onnxruntime.OnnxJavaType
          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OnnxValue
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import ai.onnxruntime.TensorInfo
          import ai.onnxruntime.providers.NNAPIFlags
          import android.content.Context
          import android.graphics.Bitmap
          import java.io.File
          import java.nio.FloatBuffer
          import java.nio.IntBuffer
          import java.nio.LongBuffer
          import java.util.EnumSet
          import java.util.zip.GZIPInputStream
          import kotlin.math.sqrt

          const val SZ = 256   // input MobileCLIP2-S0
          const val DIM = 512  // embedding dim
          const val CTX = 77   // panjang token teks

          /** CLIP BPE tokenizer (port dari openai/CLIP simple_tokenizer). */
          class ClipTokenizer(ctx: Context) {
              private val enc = HashMap<String, Int>()
              private val ranks = HashMap<String, Int>()
              private val cache = HashMap<String, List<String>>()
              private val byteEnc = LinkedHashMap<Int, Char>()
              private val pat = Regex(
                  "<\\|startoftext\\|>|<\\|endoftext\\|>|'s|'t|'re|'ve|'m|'ll|'d|\\p{L}+|\\p{N}|[^\\s\\p{L}\\p{N}]+"
              )

              init {
                  val bs = ArrayList<Int>()
                  for (c in '!'.code..'~'.code) bs.add(c)
                  for (c in 0xA1..0xAC) bs.add(c)
                  for (c in 0xAE..0xFF) bs.add(c)
                  val cs = ArrayList<Int>(bs)
                  var n = 0
                  for (b in 0 until 256) if (b !in bs) { bs.add(b); cs.add(256 + n); n++ }
                  for (i in bs.indices) byteEnc[bs[i]] = cs[i].toChar()

                  val vocab = ArrayList<String>()
                  for (ch in byteEnc.values) vocab.add(ch.toString())
                  val base = ArrayList<String>(vocab)
                  for (v in base) vocab.add(v + "</w>")

                  val lines = GZIPInputStream(ctx.assets.open("bpe_simple_vocab_16e6.txt.gz"))
                      .bufferedReader(Charsets.UTF_8).readText().split("\n")
                  val merges = lines.subList(1, 49152 - 256 - 2 + 1)
                  for ((i, m) in merges.withIndex()) {
                      ranks[m] = i
                      vocab.add(m.replace(" ", ""))
                  }
                  vocab.add("<|startoftext|>")
                  vocab.add("<|endoftext|>")
                  for ((i, v) in vocab.withIndex()) enc[v] = i
              }

              private fun bpe(token: String): List<String> {
                  cache[token]?.let { return it }
                  var word = ArrayList<String>()
                  for (i in 0 until token.length - 1) word.add(token[i].toString())
                  word.add(token.last().toString() + "</w>")
                  while (word.size > 1) {
                      var best = Int.MAX_VALUE
                      var bi = -1
                      for (i in 0 until word.size - 1) {
                          val r = ranks[word[i] + " " + word[i + 1]] ?: continue
                          if (r < best) { best = r; bi = i }
                      }
                      if (bi < 0) break
                      val a = word[bi]
                      val b = word[bi + 1]
                      val nw = ArrayList<String>()
                      var i = 0
                      while (i < word.size) {
                          if (i < word.size - 1 && word[i] == a && word[i + 1] == b) { nw.add(a + b); i += 2 }
                          else { nw.add(word[i]); i++ }
                      }
                      word = nw
                  }
                  cache[token] = word
                  return word
              }

              fun encode(text: String): IntArray {
                  val clean = text.replace(Regex("\\s+"), " ").trim().lowercase()
                  val ids = ArrayList<Int>()
                  ids.add(49406)
                  for (m in pat.findAll(clean)) {
                      val sb = StringBuilder()
                      for (b in m.value.toByteArray(Charsets.UTF_8)) sb.append(byteEnc[b.toInt() and 0xFF]!!)
                      for (t in bpe(sb.toString())) ids.add(enc[t] ?: 0)
                  }
                  ids.add(49407)
                  val out = IntArray(CTX)
                  for (i in 0 until minOf(ids.size, CTX)) out[i] = ids[i]
                  if (ids.size > CTX) out[CTX - 1] = 49407
                  return out
              }
          }

          /** Thumbnail (Bitmap) -> tensor CHW float [0,1], center-crop 256x256. */
          fun preprocess(src: Bitmap): FloatArray {
              var b = src
              if (b.config == Bitmap.Config.HARDWARE) b = b.copy(Bitmap.Config.ARGB_8888, false)
              val side = minOf(b.width, b.height)
              val sq = Bitmap.createBitmap(b, (b.width - side) / 2, (b.height - side) / 2, side, side)
              val sc = if (side != SZ) Bitmap.createScaledBitmap(sq, SZ, SZ, true) else sq
              val px = IntArray(SZ * SZ)
              sc.getPixels(px, 0, SZ, 0, 0, SZ, SZ)
              val plane = SZ * SZ
              val out = FloatArray(3 * plane)
              for (i in 0 until plane) {
                  val p = px[i]
                  out[i] = ((p shr 16) and 255) / 255f
                  out[plane + i] = ((p shr 8) and 255) / 255f
                  out[2 * plane + i] = (p and 255) / 255f
              }
              return out
          }

          class ClipEngine(private val dir: File, private val tok: ClipTokenizer) {
              private val env = OrtEnvironment.getEnvironment()
              private var txt: OrtSession? = null
              var accel = "CPU"
              private val vis: OrtSession

              init {
                  val path = File(dir, "vision_model.onnx").absolutePath
                  var s: OrtSession? = null
                  try {
                      val o = OrtSession.SessionOptions()
                      o.addNnapi(EnumSet.of(NNAPIFlags.USE_FP16))
                      val t = env.createSession(path, o)
                      infer(t, FloatArray(3 * SZ * SZ)) // tes: kalau NNAPI gagal, jatuh ke CPU
                      s = t
                      accel = "NNAPI (GPU/NPU)"
                  } catch (e: Throwable) {
                      s = null
                  }
                  if (s == null) {
                      val o = OrtSession.SessionOptions()
                      o.setIntraOpNumThreads(4)
                      s = env.createSession(path, o)
                  }
                  vis = s!!
              }

              fun embedImage(arr: FloatArray): FloatArray = infer(vis, arr)

              @Synchronized
              fun embedText(q: String): FloatArray {
                  val s = txt ?: run {
                      val o = OrtSession.SessionOptions()
                      o.setIntraOpNumThreads(4)
                      env.createSession(File(dir, "text_model.onnx").absolutePath, o).also { txt = it }
                  }
                  val ids = tok.encode(q)
                  val name = s.inputNames.first()
                  val is64 = (s.inputInfo[name]!!.info as TensorInfo).type == OnnxJavaType.INT64
                  val shape = longArrayOf(1, CTX.toLong())
                  val t = if (is64)
                      OnnxTensor.createTensor(env, LongBuffer.wrap(LongArray(CTX) { ids[it].toLong() }), shape)
                  else
                      OnnxTensor.createTensor(env, IntBuffer.wrap(ids), shape)
                  return t.use { tensor ->
                      s.run(mapOf(name to tensor)).use { r -> pick(r) }
                  }
              }

              private fun infer(s: OrtSession, arr: FloatArray): FloatArray {
                  val shape = longArrayOf(1, 3, SZ.toLong(), SZ.toLong())
                  return OnnxTensor.createTensor(env, FloatBuffer.wrap(arr), shape).use { t ->
                      s.run(mapOf(s.inputNames.first() to t)).use { r -> pick(r) }
                  }
              }

              private fun pick(r: OrtSession.Result): FloatArray {
                  var v: OnnxValue = r[0]
                  for (e in r) if (e.key.contains("embed")) v = e.value
                  val a = v.value
                  val f: FloatArray = when (a) {
                      is FloatArray -> a
                      is Array<*> -> a[0] as FloatArray
                      else -> error("output model tidak dikenal")
                  }
                  var n = 0f
                  for (x in f) n += x * x
                  val inv = 1f / sqrt(n + 1e-12f)
                  return FloatArray(f.size) { f[it] * inv }
              }
          }
          PHOTOSEEK_EOF

          cat > app/src/main/kotlin/dev/photoseek/MainActivity.kt <<'PHOTOSEEK_EOF'
          package dev.photoseek

          import android.Manifest
          import android.app.Activity
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.util.LruCache
          import android.util.Size
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.inputmethod.EditorInfo
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.ArrayBlockingQueue
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean

          private const val MODEL_BASE =
              "https://huggingface.co/plhery/mobileclip2-onnx/resolve/main/onnx/s0/"

          private class Item(val id: Long, val arr: FloatArray?)

          private class Sq(c: Context) : ImageView(c) {
              override fun onMeasure(w: Int, h: Int) = super.onMeasure(w, w)
          }

          class MainActivity : Activity() {
              private val ui = Handler(Looper.getMainLooper())
              private lateinit var status: TextView
              private lateinit var input: EditText
              private lateinit var btnIndex: Button
              private lateinit var thumbs: ThumbAdapter
              private val results = ArrayList<Long>()

              private var engine: ClipEngine? = null
              private var index: VecIndex? = null
              private var curStop: AtomicBoolean? = null

              private val perm
                  get() = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_IMAGES
                  else Manifest.permission.READ_EXTERNAL_STORAGE

              private fun uriOf(id: Long): Uri =
                  ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id)

              private fun setStatus(s: String) { ui.post { status.text = s } }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 8)
                  }
                  status = TextView(this).apply { text = "Mulai..."; textSize = 13f }
                  input = EditText(this).apply {
                      hint = "mis: kucing oranye di pantai"
                      setSingleLine()
                      imeOptions = EditorInfo.IME_ACTION_SEARCH
                      setOnEditorActionListener { _, _, _ -> doSearch(); true }
                  }
                  val btnSearch = Button(this).apply { text = "Cari"; setOnClickListener { doSearch() } }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(input, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      addView(btnSearch)
                  }
                  btnIndex = Button(this).apply { text = "Mulai index"; setOnClickListener { toggleIndex() } }
                  thumbs = ThumbAdapter()
                  val grid = GridView(this).apply {
                      numColumns = 3
                      horizontalSpacing = 4
                      verticalSpacing = 4
                      adapter = thumbs
                      setOnItemClickListener { _, _, pos, _ -> openPhoto(results[pos]) }
                  }
                  root.addView(status)
                  root.addView(row)
                  root.addView(btnIndex)
                  root.addView(grid, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)

                  if (checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED) boot()
                  else requestPermissions(arrayOf(perm), 1)
              }

              override fun onRequestPermissionsResult(rc: Int, p: Array<out String>, g: IntArray) {
                  super.onRequestPermissionsResult(rc, p, g)
                  if (g.isNotEmpty() && g[0] == PackageManager.PERMISSION_GRANTED) boot()
                  else setStatus("Izin foto ditolak, app butuh akses galeri.")
              }

              private fun boot() {
                  Thread {
                      try {
                          val dir = File(filesDir, "m").apply { mkdirs() }
                          fetch(MODEL_BASE + "vision_model.onnx", File(dir, "vision_model.onnx"), "vision")
                          fetch(MODEL_BASE + "text_model.onnx", File(dir, "text_model.onnx"), "text")
                          setStatus("Memuat model...")
                          val tok = ClipTokenizer(this)
                          val eng = ClipEngine(dir, tok)
                          val idx = VecIndex(File(filesDir, "index.bin"))
                          engine = eng
                          index = idx
                          setStatus("Siap | ${eng.accel} | ${idx.size} foto terindeks")
                      } catch (e: Throwable) {
                          setStatus("Gagal: $e")
                      }
                  }.start()
              }

              private fun fetch(url: String, dest: File, label: String) {
                  if (dest.exists() && dest.length() > 0) return
                  val tmp = File(dest.path + ".part")
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  if (c.responseCode != 200) error("HTTP ${c.responseCode} untuk $url")
                  val total = c.contentLengthLong
                  c.inputStream.use { i ->
                      FileOutputStream(tmp).use { o ->
                          val buf = ByteArray(1 shl 16)
                          var done = 0L
                          var last = 0L
                          while (true) {
                              val n = i.read(buf)
                              if (n < 0) break
                              o.write(buf, 0, n)
                              done += n
                              if (done - last > 1_000_000) {
                                  last = done
                                  setStatus("Unduh model $label: ${done / 1_000_000} / ${total / 1_000_000} MB")
                              }
                          }
                      }
                  }
                  tmp.renameTo(dest)
              }

              private fun toggleIndex() {
                  val stop = curStop
                  if (stop != null && !stop.get()) { stop.set(true); return }
                  val idx = index ?: return
                  val eng = engine ?: return
                  val flag = AtomicBoolean(false)
                  curStop = flag
                  btnIndex.text = "Stop"
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  Thread {
                      val todo = ArrayList<Long>()
                      contentResolver.query(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          arrayOf(MediaStore.Images.Media._ID), null, null,
                          MediaStore.Images.Media.DATE_ADDED + " DESC"
                      )?.use { c ->
                          val col = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                          while (c.moveToNext()) {
                              val id = c.getLong(col)
                              if (!idx.has(id)) todo.add(id)
                          }
                      }
                      val total = todo.size
                      val q = ArrayBlockingQueue<Item>(24)
                      val pool = Executors.newFixedThreadPool(3)
                      for (id in todo) pool.execute {
                          var arr: FloatArray? = null
                          try {
                              if (!flag.get()) {
                                  // thumbnail dari MediaStore (cache sistem / EXIF thumb), BUKAN foto asli
                                  val bmp = contentResolver.loadThumbnail(uriOf(id), Size(SZ, SZ), null)
                                  arr = preprocess(bmp)
                                  bmp.recycle()
                              }
                          } catch (_: Throwable) {
                          }
                          q.put(Item(id, arr))
                      }

                      val t0 = System.nanoTime()
                      var lastUi = t0
                      var done = 0
                      var err = ""
                      for (n in 0 until total) {
                          val item = q.take()
                          val a = item.arr
                          if (a != null && !flag.get()) {
                              try { idx.add(item.id, eng.embedImage(a)) } catch (e: Throwable) { err = e.toString() }
                          }
                          done++
                          val now = System.nanoTime()
                          if (now - lastUi > 500_000_000L) {
                              lastUi = now
                              val rate = done / ((now - t0) / 1e9)
                              setStatus(String.format("Index %d/%d | %.1f img/s | %s %s", done, total, rate, eng.accel, err))
                          }
                      }
                      pool.shutdown()
                      val sec = (System.nanoTime() - t0) / 1e9
                      setStatus(String.format("Selesai: %d foto terindeks | %.1f img/s | %s %s", idx.size, total / maxOf(sec, 0.001), eng.accel, err))
                      flag.set(true)
                      ui.post {
                          btnIndex.text = "Mulai index"
                          window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      }
                  }.start()
              }

              private fun doSearch() {
                  val text = input.text.toString().trim()
                  val eng = engine
                  val idx = index
                  if (text.isEmpty() || eng == null || idx == null) return
                  Thread {
                      try {
                          val ids = idx.search(eng.embedText(text), 60)
                          ui.post {
                              results.clear()
                              results.addAll(ids)
                              thumbs.notifyDataSetChanged()
                              status.text = "${ids.size} hasil untuk \"$text\" dari ${idx.size} foto"
                          }
                      } catch (e: Throwable) {
                          setStatus("Cari gagal: $e")
                      }
                  }.start()
              }

              private fun openPhoto(id: Long) {
                  try {
                      startActivity(
                          Intent(Intent.ACTION_VIEW).setDataAndType(uriOf(id), "image/*")
                              .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      )
                  } catch (_: Throwable) {
                  }
              }

              private inner class ThumbAdapter : BaseAdapter() {
                  private val cache = LruCache<Long, Bitmap>(200)
                  private val pool = Executors.newFixedThreadPool(2)
                  override fun getCount() = results.size
                  override fun getItem(p: Int): Any = results[p]
                  override fun getItemId(p: Int) = results[p]
                  override fun getView(p: Int, cv: View?, parent: ViewGroup): View {
                      val iv = (cv as? Sq) ?: Sq(this@MainActivity).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(0xFFDDDDDD.toInt())
                      }
                      val id = results[p]
                      iv.tag = id
                      val hit = cache.get(id)
                      if (hit != null) iv.setImageBitmap(hit)
                      else {
                          iv.setImageBitmap(null)
                          pool.execute {
                              try {
                                  val b = contentResolver.loadThumbnail(uriOf(id), Size(256, 256), null)
                                  cache.put(id, b)
                                  ui.post { if (iv.tag == id) iv.setImageBitmap(b) }
                              } catch (_: Throwable) {
                              }
                          }
                      }
                      return iv
                  }
              }
          }
          PHOTOSEEK_EOF

          cat > app/src/main/kotlin/dev/photoseek/VecIndex.kt <<'PHOTOSEEK_EOF'
          package dev.photoseek

          import java.io.File
          import java.io.FileOutputStream
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.util.PriorityQueue

          /** Index vektor flat: [id:long][512 x float] per record, append-only. */
          class VecIndex(private val file: File) {
              private var ids = LongArray(1024)
              private var vecs = FloatArray(1024 * DIM)
              private val seen = HashSet<Long>()
              private var out: FileOutputStream? = null
              var size = 0
                  private set

              init {
                  val rec = 8 + DIM * 4
                  if (file.exists()) {
                      val valid = file.length() / rec * rec
                      if (valid != file.length()) RandomAccessFile(file, "rw").use { it.setLength(valid) }
                      val bb = ByteBuffer.wrap(file.readBytes())
                      while (bb.remaining() >= rec) {
                          val id = bb.getLong()
                          val v = FloatArray(DIM) { bb.getFloat() }
                          add(id, v, false)
                      }
                  }
              }

              @Synchronized fun has(id: Long) = seen.contains(id)

              @Synchronized
              fun add(id: Long, v: FloatArray, persist: Boolean = true) {
                  if (!seen.add(id)) return
                  if (size == ids.size) {
                      ids = ids.copyOf(size * 2)
                      vecs = vecs.copyOf(size * 2 * DIM)
                  }
                  ids[size] = id
                  System.arraycopy(v, 0, vecs, size * DIM, DIM)
                  size++
                  if (persist) {
                      val bb = ByteBuffer.allocate(8 + DIM * 4).putLong(id)
                      for (x in v) bb.putFloat(x)
                      val o = out ?: FileOutputStream(file, true).also { out = it }
                      o.write(bb.array())
                  }
              }

              @Synchronized
              fun search(q: FloatArray, k: Int): List<Long> {
                  val heap = PriorityQueue<Pair<Float, Int>>(k + 1, compareBy<Pair<Float, Int>> { it.first })
                  for (i in 0 until size) {
                      var s = 0f
                      val o = i * DIM
                      for (j in 0 until DIM) s += q[j] * vecs[o + j]
                      if (heap.size < k) heap.add(s to i)
                      else if (s > heap.peek()!!.first) { heap.poll(); heap.add(s to i) }
                  }
                  return heap.sortedByDescending { it.first }.map { ids[it.second] }
              }
          }
          PHOTOSEEK_EOF

