# Sonara - builds the Android app from the heredocs below, signs it with a persistent key,
# publishes the APK as a GitHub Release, and the app updates itself from that release.
#
# Setup: put this file at .github/workflows/build.yml and push. That is all.
# Optional: add secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS to use your own key
# (recommended for public repos).
name: Build Sonara APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonara-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: "Write settings.gradle.kts"
        run: |
          mkdir -p "$(dirname android/settings.gradle.kts)"
          cat > android/settings.gradle.kts <<'SONARA_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Sonara"
          include(":app")
          SONARA_EOF

      - name: "Write build.gradle.kts"
        run: |
          mkdir -p "$(dirname android/build.gradle.kts)"
          cat > android/build.gradle.kts <<'SONARA_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          SONARA_EOF

      - name: "Write gradle.properties"
        run: |
          mkdir -p "$(dirname android/gradle.properties)"
          cat > android/gradle.properties <<'SONARA_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          SONARA_EOF

      - name: "Write app/build.gradle.kts"
        run: |
          mkdir -p "$(dirname android/app/build.gradle.kts)"
          cat > android/app/build.gradle.kts <<'SONARA_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val vCode = (findProperty("vcode") as String?)?.toIntOrNull() ?: 1
          val vName = (findProperty("vname") as String?) ?: "1.0.$vCode"
          val repoSlug = (findProperty("repoSlug") as String?) ?: "owner/repo"

          android {
              namespace = "app.sonara"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.sonara"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = vCode
                  versionName = vName
                  buildConfigField("String", "REPO", "\"$repoSlug\"")
              }

              signingConfigs {
                  create("ci") {
                      val ks = System.getenv("KS_PATH")
                      if (ks != null) {
                          storeFile = file(ks)
                          storePassword = System.getenv("KS_PASS")
                          keyAlias = System.getenv("KS_ALIAS")
                          keyPassword = System.getenv("KS_KEY_PASS")
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = if (System.getenv("KS_PATH") != null) {
                          signingConfigs.getByName("ci")
                      } else {
                          signingConfigs.getByName("debug")
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              val bom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(bom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          SONARA_EOF

      - name: "Write app/proguard-rules.pro"
        run: |
          mkdir -p "$(dirname android/app/proguard-rules.pro)"
          cat > android/app/proguard-rules.pro <<'SONARA_EOF'
          # Sonara: no reflection, default R8 rules are enough.
          -dontwarn kotlinx.coroutines.**
          SONARA_EOF

      - name: "Write app/src/main/AndroidManifest.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/AndroidManifest.xml)"
          cat > android/app/src/main/AndroidManifest.xml <<'SONARA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Sonara">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode|density|fontScale|locale|layoutDirection"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HostService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".SpeakerService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          SONARA_EOF

      - name: "Write app/src/main/res/values/strings.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/res/values/strings.xml)"
          cat > android/app/src/main/res/values/strings.xml <<'SONARA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Sonara</string>
              <string name="need_mic">Microphone permission is needed to capture system audio</string>
              <string name="need_capture">Screen-capture permission is needed to capture system audio</string>
          </resources>
          SONARA_EOF

      - name: "Write app/src/main/res/values/themes.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/res/values/themes.xml)"
          cat > android/app/src/main/res/values/themes.xml <<'SONARA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="sonara_bg">#FF07080F</color>
              <style name="Theme.Sonara" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/sonara_bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          SONARA_EOF

      - name: "Write app/src/main/res/xml/file_paths.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/res/xml/file_paths.xml)"
          cat > android/app/src/main/res/xml/file_paths.xml <<'SONARA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="updates" path="updates/" />
          </paths>
          SONARA_EOF

      - name: "Write app/src/main/res/drawable/ic_launcher_bg.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/res/drawable/ic_launcher_bg.xml)"
          cat > android/app/src/main/res/drawable/ic_launcher_bg.xml <<'SONARA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:startColor="#FF3B2A9E"
                          android:endColor="#FF07080F" />
                  </aapt:attr>
              </path>
          </vector>
          SONARA_EOF

      - name: "Write app/src/main/res/drawable/ic_launcher_fg.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/res/drawable/ic_launcher_fg.xml)"
          cat > android/app/src/main/res/drawable/ic_launcher_fg.xml <<'SONARA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFFFF"
