      - name: "Write app/src/main/java/app/sonara/Updater.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/Updater.kt)"
          cat > android/app/src/main/java/app/sonara/Updater.kt <<'SONARA_EOF'
          package app.sonara

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.atomic.AtomicBoolean

          /**
           * Self-update from the newest GitHub Release of this repository.
           * The CI signs every build with the same persistent key, so Android installs it in place (data kept).
           * Tag format is "build-<versionCode>"; the release name carries the human version.
           */
          object Updater {
              private class Info(val tag: String, val name: String, val code: Int, val url: String, val notes: String, val size: Long)

              @Volatile private var info: Info? = null
              private val busy = AtomicBoolean(false)

              suspend fun check(silent: Boolean) = withContext<Unit>(Dispatchers.IO) {
                  if (BuildConfig.REPO == "owner/repo") return@withContext
                  if (!busy.compareAndSet(false, true)) return@withContext
                  if (!silent) AppState.update.value = UpdateUi(UpStatus.CHECKING)
                  try {
                      val c = URL("https://api.github.com/repos/${BuildConfig.REPO}/releases/latest").openConnection() as HttpURLConnection
                      c.setRequestProperty("Accept", "application/vnd.github+json")
                      c.setRequestProperty("User-Agent", "Sonara")
                      c.connectTimeout = 8000
                      c.readTimeout = 8000
                      if (c.responseCode != 200) throw IllegalStateException("GitHub HTTP ${c.responseCode}")
                      val j = JSONObject(c.inputStream.bufferedReader().use { it.readText() })
                      val tag = j.getString("tag_name")
                      val code = Regex("(\\d+)$").find(tag)?.value?.toIntOrNull() ?: 0
                      val assets = j.getJSONArray("assets")
                      var url = ""
                      var size = 0L
                      for (i in 0 until assets.length()) {
                          val a = assets.getJSONObject(i)
                          if (a.getString("name").endsWith(".apk")) {
                              url = a.getString("browser_download_url")
                              size = a.optLong("size", 0L)
                              break
                          }
                      }
                      val name = j.optString("name", tag).ifBlank { tag }
                      if (code > BuildConfig.VERSION_CODE && url.isNotEmpty()) {
                          info = Info(tag, name, code, url, j.optString("body", ""), size)
                          AppState.update.value = UpdateUi(UpStatus.AVAILABLE, latest = name, notes = j.optString("body", ""))
                      } else if (!silent || AppState.update.value.status == UpStatus.CHECKING) {
                          AppState.update.value = UpdateUi(UpStatus.UPTODATE)
                      }
                  } catch (e: Exception) {
                      if (!silent) AppState.update.value = UpdateUi(UpStatus.ERROR, msg = e.message ?: "Update check failed")
                  } finally {
                      busy.set(false)
                  }
              }

              suspend fun downloadAndInstall(ctx: Context) = withContext<Unit>(Dispatchers.IO) {
                  val i = info ?: return@withContext
                  try {
                      AppState.update.value = UpdateUi(UpStatus.DOWNLOADING, latest = i.name)
                      val dir = File(ctx.cacheDir, "updates").apply {
                          mkdirs()
                          listFiles()?.forEach { it.delete() }
                      }
                      val f = File(dir, "Sonara-${i.tag}.apk")
                      val c = URL(i.url).openConnection() as HttpURLConnection
                      c.connectTimeout = 10000
                      c.readTimeout = 15000
                      c.setRequestProperty("User-Agent", "Sonara")
                      val total = if (c.contentLengthLong > 0) c.contentLengthLong else i.size
                      c.inputStream.use { ins ->
                          f.outputStream().use { out ->
                              val buf = ByteArray(64 * 1024)
                              var done = 0L
                              var lastP = -1
                              while (true) {
                                  val n = ins.read(buf)
                                  if (n < 0) break
                                  out.write(buf, 0, n)
                                  done += n
                                  if (total > 0) {
                                      val p = (done * 100 / total).toInt()
                                      if (p != lastP) {
                                          lastP = p
                                          AppState.update.value = UpdateUi(UpStatus.DOWNLOADING, latest = i.name, progress = done.toFloat() / total)
                                      }
                                  }
                              }
                          }
                      }
                      AppState.update.value = UpdateUi(UpStatus.READY, latest = i.name)
                      withContext(Dispatchers.Main) { install(ctx, f) }
                  } catch (e: Exception) {
                      AppState.update.value = UpdateUi(UpStatus.ERROR, msg = e.message ?: "Download failed")
                  }
              }

              fun install(ctx: Context, f: File) {
                  if (!ctx.packageManager.canRequestPackageInstalls()) {
                      ctx.startActivity(
                          Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + ctx.packageName))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                      return
                  }
                  val uri = FileProvider.getUriForFile(ctx, ctx.packageName + ".files", f)
                  ctx.startActivity(
                      Intent(Intent.ACTION_VIEW)
                          .setDataAndType(uri, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/ui/Theme.kt"
        run: |
