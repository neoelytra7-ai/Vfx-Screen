          cat > android/app/src/main/java/app/sonara/ui/Theme.kt <<'SONARA_EOF'
          package app.sonara.ui

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import app.sonara.core.Role

          /** Palette: deep ink base, one hue per speaker role so every phone is recognisable at a glance. */
          object C {
              val bg = Color(0xFF07080F)
              val ink = Color(0xFF0A0B14)
              val text = Color(0xFFEEF0FA)
              val muted = Color(0xFF8E93AE)
              val violet = Color(0xFF8B7CFF)
              val cyan = Color(0xFF3DE3FF)
              val pink = Color(0xFFFF6BD6)
              val green = Color(0xFF4ADE80)
              val amber = Color(0xFFFFB84D)
              val red = Color(0xFFFF6B6B)
              val brand = Brush.linearGradient(listOf(violet, cyan))
          }

          fun roleColor(r: Role): Color = when (r) {
              Role.STEREO -> C.cyan
              Role.LEFT -> C.violet
              Role.RIGHT -> C.pink
              Role.MONO -> C.amber
              Role.SUB -> C.green
          }

          fun roleTitle(r: Role): String = when (r) {
              Role.STEREO -> "Full stereo"
              Role.LEFT -> "Left channel"
              Role.RIGHT -> "Right channel"
              Role.MONO -> "Mono, both channels"
              Role.SUB -> "Subwoofer"
          }

          @Composable
          fun SonaraTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = C.violet,
                      secondary = C.cyan,
                      tertiary = C.pink,
                      background = C.bg,
                      surface = C.bg,
                      onPrimary = C.ink,
                      onSurface = C.text,
                      onBackground = C.text
                  ),
                  content = content
              )
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/ui/Widgets.kt"
        run: |
