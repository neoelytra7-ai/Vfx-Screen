          cat > android/app/src/main/java/app/sonara/AppState.kt <<'SONARA_EOF'
          package app.sonara

          import app.sonara.core.Cfg
          import app.sonara.core.HostEngine
          import app.sonara.core.SpeakerEngine
          import kotlinx.coroutines.flow.MutableStateFlow

          /** One visualizer frame: spectrum bands plus left/right peak levels (0..1). */
          class Viz(val bands: FloatArray = FloatArray(28), val l: Float = 0f, val r: Float = 0f)

          data class PeerUi(
              val id: Int,
              val name: String,
              val ip: String,
              val cfg: Cfg,
              val errUs: Int,
              val bufMs: Int,
              val lost: Int,
              val rttMs: Float,
              val playing: Boolean
          )

          data class HostUi(
              val running: Boolean = false,
              val ip: String = "-",
              val peers: List<PeerUi> = emptyList(),
              val latencyMs: Int = 220,
              val click: Boolean = false,
              val kbps: Int = 0,
              val error: String? = null
          )

          data class FoundHost(val name: String, val ip: String)

          enum class SpStatus { OFF, SEARCHING, JOINING, SYNCING, PLAYING }

          data class SpeakerUi(
              val status: SpStatus = SpStatus.OFF,
              val hosts: List<FoundHost> = emptyList(),
              val hostName: String = "",
              val cfg: Cfg = Cfg(),
              val errUs: Int = 0,
              val bufMs: Int = 0,
              val lost: Int = 0,
              val under: Int = 0,
              val rttMs: Float = 0f,
              val localVol: Float = 1f,
              val boost: Boolean = false,
              val error: String? = null
          )

          enum class UpStatus { IDLE, CHECKING, UPTODATE, AVAILABLE, DOWNLOADING, READY, ERROR }

          data class UpdateUi(
              val status: UpStatus = UpStatus.IDLE,
              val latest: String = "",
              val notes: String = "",
              val progress: Float = 0f,
              val msg: String = ""
          )

          object AppState {
              val host = MutableStateFlow(HostUi())
              val hostViz = MutableStateFlow(Viz())
              val speaker = MutableStateFlow(SpeakerUi())
              val speakerViz = MutableStateFlow(Viz())
              val update = MutableStateFlow(UpdateUi())

              @Volatile var hostEngine: HostEngine? = null
              @Volatile var speakerEngine: SpeakerEngine? = null
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/Notif.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/Notif.kt)"
          cat > android/app/src/main/java/app/sonara/Notif.kt <<'SONARA_EOF'
          package app.sonara

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings

          object Notif {
              private const val CH = "sonara"
              const val ID_HOST = 11
              const val ID_SPK = 12
              const val ACTION_STOP = "app.sonara.STOP"

              fun ensure(ctx: Context) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CH, "Sonara", NotificationManager.IMPORTANCE_LOW))
              }

              @Suppress("DEPRECATION")
              fun build(ctx: Context, title: String, text: String, svc: Class<*>): Notification {
                  val open = PendingIntent.getActivity(
                      ctx, 0,
                      Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val stop = PendingIntent.getService(
                      ctx, 1,
                      Intent(ctx, svc).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(ctx, CH)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setOngoing(true)
                      .setContentIntent(open)
                      .addAction(0, "Stop", stop)
                      .build()
              }

              fun deviceName(ctx: Context): String {
                  val n = try {
                      Settings.Global.getString(ctx.contentResolver, "device_name")
                  } catch (e: Exception) {
                      null
                  }
                  return (n?.takeIf { it.isNotBlank() } ?: Build.MODEL).take(32)
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/HostService.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/HostService.kt)"
          cat > android/app/src/main/java/app/sonara/HostService.kt <<'SONARA_EOF'
          package app.sonara

          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import app.sonara.core.HostEngine
          import app.sonara.core.Locks

          class HostService : Service() {
              private var engine: HostEngine? = null
              private var locks: Locks? = null
              private val handler = Handler(Looper.getMainLooper())
              private val ticker = object : Runnable {
                  override fun run() {
                      val n = AppState.host.value.peers.size
                      val text = if (n == 0) "Waiting for speakers..." else "$n speaker(s) connected"
                      getSystemService(android.app.NotificationManager::class.java)
                          .notify(Notif.ID_HOST, Notif.build(this@HostService, "Sonara is broadcasting", text, HostService::class.java))
                      handler.postDelayed(this, 3000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == Notif.ACTION_STOP) {
                      shutdown()
                      return START_NOT_STICKY
                  }
                  if (engine != null) return START_NOT_STICKY

                  Notif.ensure(this)
                  startForeground(
                      Notif.ID_HOST,
                      Notif.build(this, "Sonara is broadcasting", "Waiting for speakers...", HostService::class.java),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                  )

                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>("data")
                  if (data == null) {
                      shutdown()
                      return START_NOT_STICKY
                  }

                  val projection: MediaProjection = try {
                      getSystemService(MediaProjectionManager::class.java).getMediaProjection(code, data)
                  } catch (e: Exception) {
                      AppState.host.value = AppState.host.value.copy(error = "Screen-capture permission was rejected: ${e.message}")
                      shutdown()
                      return START_NOT_STICKY
                  }
                  projection.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          engine?.stop()
                      }
                  }, handler)

                  locks = Locks(this, "sonara-host").also { it.acquire() }
                  val eng = HostEngine(projection, Notif.deviceName(this))
                  eng.onStopped = { handler.post { shutdown() } }
                  engine = eng
                  AppState.hostEngine = eng
                  if (!eng.start()) {
                      shutdown()
                      return START_NOT_STICKY
                  }
                  handler.postDelayed(ticker, 3000)
                  return START_NOT_STICKY
              }

              private fun shutdown() {
                  handler.removeCallbacks(ticker)
                  engine?.stop()
                  engine = null
                  AppState.hostEngine = null
                  locks?.release()
                  locks = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(ticker)
                  engine?.stop()
                  AppState.hostEngine = null
                  locks?.release()
                  super.onDestroy()
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/SpeakerService.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/SpeakerService.kt)"
          cat > android/app/src/main/java/app/sonara/SpeakerService.kt <<'SONARA_EOF'
          package app.sonara

          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import app.sonara.core.Locks
          import app.sonara.core.SpeakerEngine

          class SpeakerService : Service() {
              private var engine: SpeakerEngine? = null
              private var locks: Locks? = null
              private val handler = Handler(Looper.getMainLooper())
              private val ticker = object : Runnable {
                  override fun run() {
                      val ui = AppState.speaker.value
                      val text = when (ui.status) {
                          SpStatus.PLAYING -> "Playing as ${ui.cfg.role.label}"
                          SpStatus.OFF -> "Idle"
                          SpStatus.SEARCHING -> "Looking for a broadcaster..."
                          else -> "Syncing..."
                      }
                      getSystemService(NotificationManager::class.java)
                          .notify(Notif.ID_SPK, Notif.build(this@SpeakerService, "Sonara speaker", text, SpeakerService::class.java))
                      handler.postDelayed(this, 3000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == Notif.ACTION_STOP) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (engine == null) {
                      Notif.ensure(this)
                      startForeground(
                          Notif.ID_SPK,
                          Notif.build(this, "Sonara speaker", "Looking for a broadcaster...", SpeakerService::class.java),
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK
                      )
                      locks = Locks(this, "sonara-spk").also { it.acquire() }
                      val eng = SpeakerEngine(Notif.deviceName(this), getSharedPreferences("sonara", MODE_PRIVATE))
                      engine = eng
                      AppState.speakerEngine = eng
                      eng.start()
                      handler.postDelayed(ticker, 3000)
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  handler.removeCallbacks(ticker)
                  engine?.stop()
                  engine = null
                  AppState.speakerEngine = null
                  locks?.release()
                  super.onDestroy()
              }
          }
