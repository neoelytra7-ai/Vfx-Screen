          private fun ms1(us: Int): String = "%.1f".format(abs(us) / 1000f)

          @Composable
          fun TopBar(title: String, onBack: () -> Unit, trailing: @Composable () -> Unit = {}) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  Box(
                      Modifier
                          .size(42.dp)
                          .clip(CircleShape)
                          .background(Color.White.copy(alpha = 0.07f))
                          .clickable(onClick = onBack),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Rounded.ArrowBack, "Back", tint = C.text, modifier = Modifier.size(22.dp))
                  }
                  Spacer(Modifier.width(14.dp))
                  Text(title, color = C.text, fontSize = 22.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                  trailing()
              }
          }

          @Composable
          private fun LiveBadge() {
              val t = rememberInfiniteTransition(label = "live")
              val a by t.animateFloat(0.35f, 1f, infiniteRepeatable(tween(800), RepeatMode.Reverse), label = "a")
              Row(
                  Modifier
                      .clip(RoundedCornerShape(50))
                      .background(C.red.copy(alpha = 0.16f))
                      .padding(horizontal = 12.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.size(8.dp).clip(CircleShape).background(C.red.copy(alpha = a)))
                  Spacer(Modifier.width(8.dp))
                  Text("Live", color = C.red, fontSize = 13.sp, fontWeight = FontWeight.ExtraBold)
              }
          }

          @Composable
          private fun Screen(content: @Composable () -> Unit) {
              Column(
                  Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .statusBarsPadding()
                      .navigationBarsPadding()
                      .padding(horizontal = 20.dp, vertical = 14.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) { content() }
          }

          @Composable
          private fun Note(text: String, color: Color) {
              Row(
                  Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(14.dp))
                      .background(color.copy(alpha = 0.12f))
                      .padding(12.dp)
              ) { Text(text, color = color, fontSize = 13.sp) }
          }

          @Composable
          private fun Tip(text: String) {
              Row(verticalAlignment = Alignment.Top) {
                  Icon(Icons.Rounded.Check, null, tint = C.green, modifier = Modifier.size(18.dp).padding(top = 2.dp))
                  Spacer(Modifier.width(10.dp))
                  Text(text, color = C.muted, fontSize = 13.sp, lineHeight = 18.sp)
              }
          }

          // ------------------------------------------------------------------ Home

          @Composable
          fun HomeScreen(onHost: () -> Unit, onSpeaker: () -> Unit, onCheck: () -> Unit, onInstall: () -> Unit) {
              val up by AppState.update.collectAsState()
              Screen {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Logo(Modifier.size(44.dp))
                      Spacer(Modifier.width(12.dp))
                      Column {
                          Text("Sonara", color = C.text, fontSize = 26.sp, fontWeight = FontWeight.ExtraBold)
                          Text("Many phones. One stereo system.", color = C.muted, fontSize = 13.sp)
                      }
                  }

                  Glass(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(20.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                          Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              PhoneChip("L", C.violet)
                              Flow(Modifier.weight(1f).padding(horizontal = 8.dp), C.violet)
                              PhoneChip("Host", C.cyan, big = true)
                              Flow(Modifier.weight(1f).padding(horizontal = 8.dp), C.pink)
                              PhoneChip("R", C.pink)
                          }
                          Text(
                              "Everything your phone plays, from any app, split into true left and right and sent to two other phones.",
                              color = C.text, fontSize = 15.sp, lineHeight = 21.sp
                          )
                      }
                  }

                  ActionCard("Broadcast from this phone", "Capture all system audio and stream it", Icons.Rounded.Cast, listOf(C.violet, C.cyan), onHost)
                  ActionCard("Use this phone as a speaker", "Join a broadcaster as left, right, mono or sub", Icons.Rounded.Speaker, listOf(C.pink, C.amber), onSpeaker)

                  Glass(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                          Text("How it works", color = C.text, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Step(1, "Put all phones on the same Wi-Fi, or on one phone's hotspot.")
                          Step(2, "On the phone you play music from, tap Broadcast.")
                          Step(3, "On the other phones, tap Use as speaker. The first becomes left, the second right.")
                      }
                  }

                  UpdateCard(up, onCheck, onInstall)

                  Text(
                      "Version ${BuildConfig.VERSION_NAME}",
                      color = C.muted, fontSize = 12.sp, textAlign = TextAlign.Center, modifier = Modifier.fillMaxWidth()
                  )
              }
          }

          @Composable
          private fun ActionCard(title: String, subtitle: String, icon: ImageVector, colors: List<Color>, onClick: () -> Unit) {
              Glass(Modifier.fillMaxWidth().clickable(onClick = onClick)) {
                  Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      IconTile(icon, colors)
                      Spacer(Modifier.width(16.dp))
                      Column(Modifier.weight(1f)) {
                          Text(title, color = C.text, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          Text(subtitle, color = C.muted, fontSize = 13.sp)
                      }
                      Icon(Icons.Rounded.ChevronRight, null, tint = C.muted)
                  }
              }
          }

          @Composable
          private fun Step(n: Int, text: String) {
              Row(verticalAlignment = Alignment.Top) {
                  Box(
                      Modifier.size(24.dp).clip(CircleShape).background(C.violet.copy(alpha = 0.25f)),
                      contentAlignment = Alignment.Center
                  ) { Text("$n", color = C.text, fontSize = 12.sp, fontWeight = FontWeight.Bold) }
                  Spacer(Modifier.width(12.dp))
                  Text(text, color = C.muted, fontSize = 14.sp, lineHeight = 20.sp)
              }
          }

          @Composable
          private fun UpdateCard(up: UpdateUi, onCheck: () -> Unit, onInstall: () -> Unit) {
              Glass(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(
                              Icons.Rounded.SystemUpdate, null,
                              tint = if (up.status == UpStatus.AVAILABLE) C.amber else C.muted,
                              modifier = Modifier.size(26.dp)
                          )
                          Spacer(Modifier.width(14.dp))
                          Column(Modifier.weight(1f)) {
                              val (title, sub) = when (up.status) {
                                  UpStatus.IDLE -> "Updates" to "Version ${BuildConfig.VERSION_NAME}"
                                  UpStatus.CHECKING -> "Checking for updates" to "Contacting GitHub..."
                                  UpStatus.UPTODATE -> "You're up to date" to "Version ${BuildConfig.VERSION_NAME}"
                                  UpStatus.AVAILABLE -> "Update available" to up.latest
                                  UpStatus.DOWNLOADING -> "Downloading ${(up.progress * 100).toInt()}%" to up.latest
                                  UpStatus.READY -> "Ready to install" to "Confirm the system prompt"
                                  UpStatus.ERROR -> "Update failed" to up.msg
                              }
                              Text(title, color = C.text, fontSize = 15.sp, fontWeight = FontWeight.SemiBold)
                              Text(sub, color = C.muted, fontSize = 12.sp, maxLines = 2, overflow = TextOverflow.Ellipsis)
                          }
                          if (up.status == UpStatus.IDLE || up.status == UpStatus.UPTODATE || up.status == UpStatus.ERROR) {
                              Pill(if (up.status == UpStatus.ERROR) "Retry" else "Check", onClick = onCheck)
                          }
                      }
                      if (up.status == UpStatus.DOWNLOADING) ProgressBar(up.progress, Modifier.fillMaxWidth())
                      if (up.status == UpStatus.AVAILABLE || up.status == UpStatus.READY) {
                          GradientButton(
                              if (up.status == UpStatus.READY) "Install now" else "Download and install",
                              Modifier.fillMaxWidth(),
                              Icons.Rounded.Download,
                              listOf(C.amber, C.pink)
                          ) { onInstall() }
                      }
                  }
              }
          }

          // ------------------------------------------------------------------ Host

          @Composable
          fun HostScreen(onBack: () -> Unit, onStart: () -> Unit) {
              val ui by AppState.host.collectAsState()
              Screen {
                  TopBar("Broadcast", onBack) { if (ui.running) LiveBadge() }
                  if (!ui.running) HostIdle(ui, onStart) else HostLive(ui)
              }
          }

          @Composable
          private fun HostIdle(ui: HostUi, onStart: () -> Unit) {
              val ip = remember { Net.localIp() }
              Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                  Glass(Modifier.fillMaxWidth()) {
                      Column(
                          Modifier.fillMaxWidth().padding(22.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          Radar(Modifier.size(190.dp), C.violet) {
                              Box(Modifier.size(78.dp).clip(CircleShape).background(C.brand), contentAlignment = Alignment.Center) {
                                  Icon(Icons.Rounded.Cast, null, tint = C.ink, modifier = Modifier.size(36.dp))
                              }
                          }
                          Text("Ready to broadcast", color = C.text, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          Text(
                              "Everything this phone plays will be split into channels and sent to your other phones over Wi-Fi.",
                              color = C.muted, fontSize = 14.sp, textAlign = TextAlign.Center, lineHeight = 20.sp
                          )
                          if (ip == "-") {
                              Note("No Wi-Fi network found. Join a Wi-Fi network or turn on this phone's hotspot first.", C.amber)
                          } else {
                              Pill("Wi-Fi  $ip", color = C.cyan)
                          }
                          ui.error?.let { Note(it, C.red) }
                          GradientButton("Start broadcasting", Modifier.fillMaxWidth(), Icons.Rounded.PlayArrow) { onStart() }
                      }
                  }
                  Glass(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Tip("Android shows a screen-capture prompt. That is how Android lets an app hear other apps. No video is recorded.")
                          Tip("Turn this phone's own volume down. It plays instantly, while the speakers play a fraction later to stay in sync.")
                          Tip("A few apps, such as Netflix and some banking apps, block capture and will stay silent.")
                      }
                  }
              }
          }

          @Composable
          private fun HostLive(ui: HostUi) {
              Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                  VizCard(ui)

                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("Speakers", color = C.text, fontSize = 18.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                      val hasL = ui.peers.any { it.cfg.role == Role.LEFT }
                      val hasR = ui.peers.any { it.cfg.role == Role.RIGHT }
                      if (hasL && hasR) Pill("Swap left and right", color = C.cyan) { AppState.hostEngine?.swapLR() }
                  }

                  if (ui.peers.isEmpty()) {
                      Glass(Modifier.fillMaxWidth()) {
                          Column(
                              Modifier.fillMaxWidth().padding(20.dp),
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              Radar(Modifier.size(140.dp), C.cyan) {
                                  Icon(Icons.Rounded.Wifi, null, tint = C.cyan, modifier = Modifier.size(30.dp))
                              }
                              Text("Waiting for speakers", color = C.text, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                              Text(
                                  "On your other phones open Sonara and tap Use as speaker. If they cannot find this phone, enter ${ui.ip} manually.",
                                  color = C.muted, fontSize = 13.sp, textAlign = TextAlign.Center, lineHeight = 18.sp
                              )
                          }
                      }
                  } else {
                      ui.peers.forEach { p -> androidx.compose.runtime.key(p.id) { PeerCard(p) } }
                  }

                  TuningCard(ui)

                  GradientButton(
                      "Stop broadcasting", Modifier.fillMaxWidth(), Icons.Rounded.Stop, listOf(C.red, C.pink)
                  ) { AppState.hostEngine?.stop() }
              }
          }

          @Composable
          private fun VizCard(ui: HostUi) {
              val viz by AppState.hostViz.collectAsState()
              Glass(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Visualizer(viz, Modifier.fillMaxWidth().height(120.dp))
                      Meter("L", viz.l)
                      Meter("R", viz.r)
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text("This phone  ${ui.ip}", color = C.muted, fontSize = 12.sp)
                          Text("${ui.kbps} kbps", color = C.muted, fontSize = 12.sp)
                      }
                  }
              }
          }

          @Composable
          private fun PeerCard(p: PeerUi) {
              var vol by remember(p.id) { mutableStateOf(p.cfg.volume.toFloat()) }
              val health = when {
                  !p.playing -> C.amber
                  abs(p.errUs) < 1500 -> C.green
                  abs(p.errUs) < 4000 -> C.amber
                  else -> C.red
              }
              val status = if (!p.playing) "Syncing..." else "In sync  ±${ms1(p.errUs)} ms  ·  ping ${"%.0f".format(p.rttMs)} ms"
              val col = roleColor(p.cfg.role)
              Glass(Modifier.fillMaxWidth(), tint = col) {
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          RoleBadge(p.cfg.role.short, 50.dp, col, pulse = p.playing && !p.cfg.muted)
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Text(p.name, color = C.text, fontSize = 16.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(Modifier.size(7.dp).clip(CircleShape).background(health))
                                  Spacer(Modifier.width(6.dp))
                                  Text(status, color = C.muted, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                          }
                          Box(
                              Modifier
                                  .size(40.dp)
                                  .clip(CircleShape)
                                  .background(Color.White.copy(alpha = 0.07f))
                                  .clickable { AppState.hostEngine?.setMute(p.id, !p.cfg.muted) },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  if (p.cfg.muted) Icons.Rounded.VolumeOff else Icons.Rounded.VolumeUp, "Mute",
                                  tint = if (p.cfg.muted) C.red else C.text, modifier = Modifier.size(20.dp)
                              )
                          }
                      }

                      Segmented(Role.values().map { it.label }, p.cfg.role.ordinal, { AppState.hostEngine?.setRole(p.id, Role.values()[it]) })

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Volume", color = C.muted, fontSize = 13.sp, modifier = Modifier.width(60.dp))
                          SonaraSlider(vol, { vol = it; AppState.hostEngine?.setVolume(p.id, it.toInt()) }, 0f..100f, Modifier.weight(1f))
                          Text("${vol.toInt()}%", color = C.text, fontSize = 13.sp, modifier = Modifier.width(42.dp), textAlign = TextAlign.End)
                      }

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text("Delay", color = C.muted, fontSize = 13.sp, modifier = Modifier.width(60.dp))
                          Pill("-10") { AppState.hostEngine?.setTrim(p.id, p.cfg.trimMs - 10) }
                          Spacer(Modifier.width(6.dp))
                          Pill("-1") { AppState.hostEngine?.setTrim(p.id, p.cfg.trimMs - 1) }
                          Text(
                              "${if (p.cfg.trimMs > 0) "+" else ""}${p.cfg.trimMs} ms",
                              color = C.text, fontSize = 14.sp, fontWeight = FontWeight.SemiBold,
                              textAlign = TextAlign.Center, modifier = Modifier.weight(1f)
                          )
                          Pill("+1") { AppState.hostEngine?.setTrim(p.id, p.cfg.trimMs + 1) }
                          Spacer(Modifier.width(6.dp))
                          Pill("+10") { AppState.hostEngine?.setTrim(p.id, p.cfg.trimMs + 10) }
                      }
                  }
              }
          }

          @Composable
          private fun TuningCard(ui: HostUi) {
              var lat by remember { mutableStateOf(ui.latencyMs.toFloat()) }
              Glass(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(Icons.Rounded.GraphicEq, null, tint = C.cyan, modifier = Modifier.size(20.dp))
                          Spacer(Modifier.width(10.dp))
                          Text("Sync buffer", color = C.text, fontSize = 15.sp, fontWeight = FontWeight.SemiBold, modifier = Modifier.weight(1f))
                          Text("${lat.toInt()} ms", color = C.cyan, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                      }
                      SonaraSlider(lat, { lat = it; AppState.hostEngine?.setLatency(it.toInt()) }, 80f..600f)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("Fast" to 120, "Balanced" to 220, "Stable" to 400).forEach { (name, ms) ->
                              Pill(name, color = if (lat.toInt() == ms) C.cyan else C.muted) {
                                  lat = ms.toFloat()
                                  AppState.hostEngine?.setLatency(ms)
                              }
                          }
                      }
                      Text("A bigger buffer survives weak Wi-Fi. A smaller one reacts faster when you pause or skip.", color = C.muted, fontSize = 12.sp, lineHeight = 17.sp)
                      SwitchRow(
                          "Sync test click",
                          "Replaces the audio with a click so you can line up each speaker's delay by ear.",
                          ui.click
                      ) { AppState.hostEngine?.setClick(it) }
                  }
              }
          }

          // ------------------------------------------------------------------ Speaker

          @Composable
          fun SpeakerScreen(onBack: () -> Unit) {
              val ctx = LocalContext.current
              DisposableEffect(Unit) {
                  ContextCompat.startForegroundService(ctx, Intent(ctx, SpeakerService::class.java))
                  onDispose { ctx.stopService(Intent(ctx, SpeakerService::class.java)) }
              }
              val ui by AppState.speaker.collectAsState()
              Screen {
                  TopBar("Speaker", onBack)
                  when (ui.status) {
                      SpStatus.OFF -> Glass(Modifier.fillMaxWidth()) {
                          Column(Modifier.fillMaxWidth().padding(22.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                              Text("Starting the listener...", color = C.text, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                              ui.error?.let { Note(it, C.red) }
                              GradientButton("Start listening", Modifier.fillMaxWidth(), Icons.Rounded.Speaker) {
                                  ContextCompat.startForegroundService(ctx, Intent(ctx, SpeakerService::class.java))
                              }
                          }
                      }
                      SpStatus.SEARCHING -> SpeakerSearch(ui)
                      else -> SpeakerLive(ui)
                  }
              }
          }

          @Composable
          private fun SpeakerSearch(ui: SpeakerUi) {
              var manual by rememberSaveable { mutableStateOf("") }
              Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                  Glass(Modifier.fillMaxWidth()) {
                      Column(
                          Modifier.fillMaxWidth().padding(22.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Radar(Modifier.size(190.dp), C.pink) {
                              Box(
                                  Modifier.size(70.dp).clip(CircleShape).background(androidx.compose.ui.graphics.Brush.linearGradient(listOf(C.pink, C.amber))),
                                  contentAlignment = Alignment.Center
                              ) { Icon(Icons.Rounded.Speaker, null, tint = C.ink, modifier = Modifier.size(32.dp)) }
                          }
                          Text("Looking for a broadcaster", color = C.text, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                          Text(
                              "Start Broadcast on the phone you play music from. Both phones must be on the same Wi-Fi or hotspot.",
                              color = C.muted, fontSize = 13.sp, textAlign = TextAlign.Center, lineHeight = 18.sp
                          )
                      }
                  }

                  ui.error?.let { Note(it, C.red) }

                  ui.hosts.forEach { h ->
                      Glass(Modifier.fillMaxWidth().clickable { AppState.speakerEngine?.join(h.ip) }) {
                          Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                              IconTile(Icons.Rounded.Cast, listOf(C.violet, C.cyan), 44.dp)
                              Spacer(Modifier.width(14.dp))
                              Column(Modifier.weight(1f)) {
                                  Text(h.name, color = C.text, fontSize = 16.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(h.ip, color = C.muted, fontSize = 12.sp)
                              }
                              Pill("Join", color = C.cyan)
                          }
                      }
                  }

                  Glass(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Text("Can't see it? Enter the address shown on the broadcaster.", color = C.muted, fontSize = 13.sp)
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              OutlinedTextField(
                                  value = manual,
                                  onValueChange = { manual = it.trim() },
                                  label = { Text("Broadcaster IP") },
                                  singleLine = true,
                                  shape = RoundedCornerShape(16.dp),
                                  keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Uri),
                                  modifier = Modifier.weight(1f),
                                  colors = OutlinedTextFieldDefaults.colors(
                                      focusedTextColor = C.text,
                                      unfocusedTextColor = C.text,
                                      cursorColor = C.cyan,
                                      focusedBorderColor = C.violet,
                                      unfocusedBorderColor = Color.White.copy(alpha = 0.2f),
                                      focusedLabelColor = C.violet,
                                      unfocusedLabelColor = C.muted
                                  )
                              )
                              Spacer(Modifier.width(10.dp))
                              Pill("Join", color = C.cyan) { if (manual.isNotEmpty()) AppState.speakerEngine?.join(manual) }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun SpeakerLive(ui: SpeakerUi) {
              val viz by AppState.speakerViz.collectAsState()
              var vol by remember { mutableStateOf(ui.localVol) }
              val col = roleColor(ui.cfg.role)
              val inSync = ui.status == SpStatus.PLAYING
              Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                  Glass(Modifier.fillMaxWidth(), tint = col) {
                      Column(
                          Modifier.fillMaxWidth().padding(22.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          RoleBadge(ui.cfg.role.short, 112.dp, col, pulse = inSync && !ui.cfg.muted)
                          Text(roleTitle(ui.cfg.role), color = C.text, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          Text("from ${ui.hostName}", color = C.muted, fontSize = 14.sp)
                          Pill(
                              if (inSync) "In sync  ±${ms1(ui.errUs)} ms" else "Syncing with the broadcaster...",
                              color = if (inSync) C.green else C.amber
                          )
                          if (ui.cfg.muted) Note("The broadcaster muted this speaker.", C.amber)
                      }
                  }

                  Glass(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Visualizer(viz, Modifier.fillMaxWidth().height(96.dp), col, C.cyan)
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Stat("Buffer", "${ui.bufMs} ms")
                              Stat("Ping", "${"%.0f".format(ui.rttMs)} ms")
                              Stat("Lost", "${ui.lost}")
                              Stat("Underruns", "${ui.under}")
                          }
                      }
                  }

                  Glass(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Rounded.VolumeUp, null, tint = C.cyan, modifier = Modifier.size(20.dp))
                              Spacer(Modifier.width(10.dp))
                              SonaraSlider(vol, { vol = it; AppState.speakerEngine?.setLocalVolume(it) }, 0f..1f, Modifier.weight(1f))
                              Text("${(vol * 100).toInt()}%", color = C.text, fontSize = 13.sp, modifier = Modifier.width(42.dp), textAlign = TextAlign.End)
                          }
                          SwitchRow("Loudness boost", "Extra gain with a soft limiter, for small phone speakers.", ui.boost) {
                              AppState.speakerEngine?.setBoost(it)
                          }
                      }
                  }

                  GradientButton("Disconnect", Modifier.fillMaxWidth(), Icons.Rounded.Bolt, listOf(C.red, C.pink)) {
                      AppState.speakerEngine?.leave()
                  }
              }
          }

          @Composable
          private fun Stat(label: String, value: String) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  Text(value, color = C.text, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                  Text(label, color = C.muted, fontSize = 11.sp)
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/MainActivity.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/MainActivity.kt)"
          cat > android/app/src/main/java/app/sonara/MainActivity.kt <<'SONARA_EOF'
          package app.sonara

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color as AColor
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.Crossfade
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.rememberCoroutineScope
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.core.content.ContextCompat
          import app.sonara.ui.Aurora
          import app.sonara.ui.HomeScreen
          import app.sonara.ui.HostScreen
          import app.sonara.ui.SonaraTheme
          import app.sonara.ui.SpeakerScreen
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {
              private var pendingHost = false

              private val permLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      if (pendingHost) {
                          pendingHost = false
                          if (hasMic()) launchProjection() else toast(getString(R.string.need_mic))
                      }
                  }

              private val projLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      val d = r.data
                      if (r.resultCode == RESULT_OK && d != null) {
                          ContextCompat.startForegroundService(
                              this,
                              Intent(this, HostService::class.java).putExtra("code", r.resultCode).putExtra("data", d)
                          )
                      } else {
                          toast(getString(R.string.need_capture))
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(AColor.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(AColor.TRANSPARENT)
                  )
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      permLauncher.launch(arrayOf(Manifest.permission.POST_NOTIFICATIONS))
                  }

                  setContent {
                      SonaraTheme {
                          var screen by rememberSaveable { mutableStateOf("home") }
                          val scope = rememberCoroutineScope()
                          BackHandler(enabled = screen != "home") { screen = "home" }
                          LaunchedEffect(Unit) { Updater.check(silent = true) }

                          Box(Modifier.fillMaxSize()) {
                              Aurora()
                              Crossfade(targetState = screen, label = "nav") { s ->
                                  when (s) {
                                      "host" -> HostScreen(onBack = { screen = "home" }, onStart = { startHost() })
                                      "speaker" -> SpeakerScreen(onBack = { screen = "home" })
                                      else -> HomeScreen(
                                          onHost = { screen = "host" },
                                          onSpeaker = { screen = "speaker" },
                                          onCheck = { scope.launch { Updater.check(silent = false) } },
                                          onInstall = { scope.launch { Updater.downloadAndInstall(this@MainActivity) } }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }

              private fun hasMic() =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()

              private fun startHost() {
                  if (AppState.hostEngine != null) return
                  val need = buildList<String> {
                      if (!hasMic()) add(Manifest.permission.RECORD_AUDIO)
                      if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                      ) add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (need.isNotEmpty()) {
                      pendingHost = true
                      permLauncher.launch(need.toTypedArray())
                  } else {
                      launchProjection()
                  }
              }

              private fun launchProjection() {
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  projLauncher.launch(mpm.createScreenCaptureIntent())
              }
          }
          SONARA_EOF

      - name: Compute version
        run: |
          VCODE=$(( ($(date +%s) - 1704067200) / 60 ))
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"
          echo "VNAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p signing
          if [ -n "$KS_B64" ]; then
            echo "Using the keystore from repository secrets"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            {
              echo "KS_PATH=$RUNNER_TEMP/app.jks"
              echo "KS_PASS=$KS_PASSWORD"
              echo "KS_KEY_PASS=$KS_PASSWORD"
              echo "KS_ALIAS=${KS_ALIAS_SECRET:-sonara}"
            } >> "$GITHUB_ENV"
          else
            if [ ! -f signing/app.jks ]; then
              echo "First run: generating a persistent signing key"
              keytool -genkeypair -noprompt -keystore signing/app.jks -storetype PKCS12 \
                -storepass sonara-ci-key -keypass sonara-ci-key -alias sonara \
                -keyalg RSA -keysize 3072 -validity 36500 \
                -dname "CN=Sonara, O=Sonara, C=ID"
              echo "NEW_KEY=1" >> "$GITHUB_ENV"
            fi
            {
              echo "KS_PATH=$GITHUB_WORKSPACE/signing/app.jks"
              echo "KS_PASS=sonara-ci-key"
              echo "KS_KEY_PASS=sonara-ci-key"
              echo "KS_ALIAS=sonara"
            } >> "$GITHUB_ENV"
          fi

      - name: Save signing key to the repo (first run only)
        if: env.NEW_KEY == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/app.jks
          git commit -m "chore: persistent signing key so updates install in place [skip ci]"
          git push

      - name: Build release APK
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace assembleRelease \
            -Pvcode="$VCODE" -Pvname="$VNAME" -PrepoSlug="$GITHUB_REPOSITORY"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Sonara-${VNAME}.apk"
          (cd dist && sha256sum "Sonara-${VNAME}.apk" > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VCODE }}
          name: Sonara ${{ env.VNAME }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            Install this APK over the previous version. It is signed with the same key, so it updates in place and keeps your settings.
            Already installed? Sonara checks this page on launch and offers the update itself.
