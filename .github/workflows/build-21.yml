          cat > android/app/src/main/java/app/sonara/ui/Widgets.kt <<'SONARA_EOF'
          package app.sonara.ui

          import androidx.compose.animation.animateColorAsState
          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.RepeatMode
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.spring
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.interaction.collectIsPressedAsState
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.BoxScope
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.ColumnScope
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.fillMaxHeight
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.matchParentSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.layout.width
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Icon
          import androidx.compose.material3.Slider
          import androidx.compose.material3.SliderDefaults
          import androidx.compose.material3.Switch
          import androidx.compose.material3.SwitchDefaults
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.PathEffect
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.platform.LocalHapticFeedback
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import app.sonara.Viz
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin
          import kotlin.math.sqrt

          /** Slowly drifting colour fields behind everything. */
          @Composable
          fun Aurora(modifier: Modifier = Modifier) {
              val t = rememberInfiniteTransition(label = "aurora")
              val a by t.animateFloat(0f, 1f, infiniteRepeatable(tween(26000, easing = LinearEasing)), label = "a")
              Canvas(modifier.fillMaxSize()) {
                  drawRect(C.bg)
                  val ang = a * 2f * PI.toFloat()
                  val w = size.width
                  val h = size.height
                  fun blob(cx: Float, cy: Float, r: Float, c: Color, al: Float) {
                      drawCircle(
                          Brush.radialGradient(listOf(c.copy(alpha = al), Color.Transparent), center = Offset(cx, cy), radius = r),
                          radius = r,
                          center = Offset(cx, cy)
                      )
                  }
                  blob(w * (0.15f + 0.12f * cos(ang)), h * (0.10f + 0.05f * sin(ang)), w * 1.0f, C.violet, 0.30f)
                  blob(w * (0.95f + 0.08f * sin(ang * 2f)), h * (0.45f + 0.08f * cos(ang)), w * 0.9f, C.cyan, 0.15f)
                  blob(w * (0.30f + 0.10f * sin(ang)), h * (0.95f + 0.04f * cos(ang * 2f)), w * 1.1f, C.pink, 0.13f)
              }
          }

          /** Frosted surface with a light-catching edge. */
          @Composable
          fun Glass(
              modifier: Modifier = Modifier,
              corner: Dp = 24.dp,
              tint: Color = Color.White,
              content: @Composable ColumnScope.() -> Unit
          ) {
              val shape = RoundedCornerShape(corner)
              Column(
                  Modifier
                      .clip(shape)
                      .then(modifier)
                      .background(Brush.verticalGradient(listOf(tint.copy(alpha = 0.09f), tint.copy(alpha = 0.035f))))
                      .border(
                          1.dp,
                          Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.22f), Color.White.copy(alpha = 0.05f))),
                          shape
                      ),
                  content = content
              )
          }

          @Composable
          fun GradientButton(
              text: String,
              modifier: Modifier = Modifier,
              icon: ImageVector? = null,
              colors: List<Color> = listOf(C.violet, C.cyan),
              enabled: Boolean = true,
              onClick: () -> Unit
          ) {
              val shape = RoundedCornerShape(20.dp)
              val interaction = remember { MutableInteractionSource() }
              val pressed by interaction.collectIsPressedAsState()
              val scale by animateFloatAsState(if (pressed) 0.97f else 1f, spring(dampingRatio = 0.6f), label = "press")
              val haptic = LocalHapticFeedback.current
              Row(
                  modifier
                      .scale(scale)
                      .clip(shape)
                      .background(Brush.horizontalGradient(colors), alpha = if (enabled) 1f else 0.35f)
                      .clickable(interaction, null, enabled = enabled) {
                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                          onClick()
                      }
                      .padding(horizontal = 22.dp, vertical = 16.dp),
                  horizontalArrangement = Arrangement.Center,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (icon != null) {
                      Icon(icon, null, tint = C.ink, modifier = Modifier.size(22.dp))
                      Spacer(Modifier.width(10.dp))
                  }
                  Text(text, color = C.ink, fontWeight = FontWeight.Bold, fontSize = 16.sp)
              }
          }

          /** Small tappable chip. */
          @Composable
          fun Pill(text: String, modifier: Modifier = Modifier, color: Color = C.muted, onClick: (() -> Unit)? = null) {
              val shape = RoundedCornerShape(50)
              val base = modifier.clip(shape).background(color.copy(alpha = 0.14f))
              val m = if (onClick != null) base.clickable { onClick() } else base
              Box(m.padding(horizontal = 12.dp, vertical = 7.dp), contentAlignment = Alignment.Center) {
                  Text(text, color = if (color == C.muted) C.text else color, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
              }
          }

          @Composable
          fun Segmented(options: List<String>, selected: Int, onSelect: (Int) -> Unit, modifier: Modifier = Modifier) {
              val haptic = LocalHapticFeedback.current
              Row(
                  modifier
                      .clip(RoundedCornerShape(14.dp))
                      .background(Color.White.copy(alpha = 0.06f))
                      .padding(3.dp)
              ) {
                  options.forEachIndexed { i, label ->
                      val on = i == selected
                      val bg by animateColorAsState(if (on) C.violet else Color.Transparent, label = "seg")
                      Box(
                          Modifier
                              .weight(1f)
                              .clip(RoundedCornerShape(11.dp))
                              .background(bg)
                              .clickable {
                                  haptic.performHapticFeedback(HapticFeedbackType.TextHandleMove)
                                  onSelect(i)
                              }
                              .padding(vertical = 9.dp),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(label, color = if (on) C.ink else C.muted, fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                      }
                  }
              }
          }

          @Composable
          fun RoleBadge(text: String, sz: Dp, color: Color, pulse: Boolean = false) {
              val t = rememberInfiniteTransition(label = "badge")
              val p by t.animateFloat(0f, 1f, infiniteRepeatable(tween(1800, easing = LinearEasing)), label = "p")
              Box(Modifier.size(sz), contentAlignment = Alignment.Center) {
                  if (pulse) {
                      Canvas(Modifier.matchParentSize()) {
                          val r = this.size.minDimension / 2
                          drawCircle(color.copy(alpha = (1f - p) * 0.5f), radius = r * (0.8f + 0.2f * p), style = Stroke(2.dp.toPx()))
                      }
                  }
                  Box(
                      Modifier
                          .size(sz * 0.8f)
                          .clip(CircleShape)
                          .background(Brush.linearGradient(listOf(color, color.copy(alpha = 0.45f)))),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(text, color = C.ink, fontWeight = FontWeight.ExtraBold, fontSize = (sz.value * 0.30f).sp)
                  }
              }
          }

          /** Expanding rings, used while searching and while waiting for speakers. */
          @Composable
          fun Radar(modifier: Modifier = Modifier, color: Color = C.cyan, content: @Composable BoxScope.() -> Unit = {}) {
              val t = rememberInfiniteTransition(label = "radar")
              val p by t.animateFloat(0f, 1f, infiniteRepeatable(tween(2800, easing = LinearEasing)), label = "p")
              Box(modifier, contentAlignment = Alignment.Center) {
                  Canvas(Modifier.matchParentSize()) {
                      val maxR = this.size.minDimension / 2
                      for (k in 0 until 3) {
                          val q = (p + k / 3f) % 1f
                          drawCircle(
                              color.copy(alpha = (1f - q) * 0.45f),
                              radius = maxR * (0.3f + 0.7f * q),
                              style = Stroke(width = 2.dp.toPx())
                          )
                      }
                      drawCircle(
                          Brush.radialGradient(listOf(color.copy(alpha = 0.22f), Color.Transparent), radius = maxR * 0.55f),
                          radius = maxR * 0.55f
                      )
                  }
                  content()
              }
          }

          /** Mirrored spectrum bars with falling peak caps. */
          @Composable
          fun Visualizer(viz: Viz, modifier: Modifier = Modifier, a: Color = C.violet, b: Color = C.cyan) {
              val peaks = remember { FloatArray(64) }
              Canvas(modifier) {
                  val n = viz.bands.size
                  val gap = 3.dp.toPx()
                  val bw = (size.width - gap * (n - 1)) / n
                  val base = size.height * 0.74f
                  val rad = CornerRadius(bw / 2, bw / 2)
                  for (i in 0 until n) {
                      val v = viz.bands[i].coerceIn(0f, 1f)
                      peaks[i] = max(v, peaks[i] - 0.015f)
                      val h = max(bw, v * base)
                      val x = i * (bw + gap)
                      drawRoundRect(
                          Brush.verticalGradient(listOf(b, a), startY = base - h, endY = base),
                          Offset(x, base - h), Size(bw, h), rad
                      )
                      val rh = h * 0.35f
                      drawRoundRect(
                          Brush.verticalGradient(listOf(a.copy(alpha = 0.30f), Color.Transparent), startY = base + gap, endY = base + gap + rh),
                          Offset(x, base + gap), Size(bw, rh), rad
                      )
                      val py = base - max(bw, peaks[i] * base) - bw * 1.4f
                      drawRoundRect(Color.White.copy(alpha = 0.75f), Offset(x, py), Size(bw, bw * 0.55f), CornerRadius(bw * 0.27f))
                  }
              }
          }

          @Composable
          fun Meter(label: String, level: Float, modifier: Modifier = Modifier) {
              val v by animateFloatAsState(sqrt(level.coerceIn(0f, 1f)), tween(60), label = "meter")
              Row(modifier, verticalAlignment = Alignment.CenterVertically) {
                  Text(label, color = C.muted, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(16.dp))
                  Box(
                      Modifier
                          .weight(1f)
                          .height(6.dp)
                          .clip(CircleShape)
                          .background(Color.White.copy(alpha = 0.08f))
                  ) {
                      Box(
                          Modifier
                              .fillMaxWidth(v)
                              .fillMaxHeight()
                              .clip(CircleShape)
                              .background(Brush.horizontalGradient(listOf(C.cyan, C.violet, C.pink)))
                      )
                  }
              }
          }

          @Composable
          fun PhoneChip(label: String, accent: Color, big: Boolean = false) {
              val w = if (big) 74.dp else 56.dp
              val h = if (big) 128.dp else 98.dp
              val shape = RoundedCornerShape(16.dp)
              Box(
                  Modifier
                      .size(w, h)
                      .clip(shape)
                      .background(Brush.verticalGradient(listOf(accent.copy(alpha = 0.30f), accent.copy(alpha = 0.06f))))
                      .border(1.5.dp, Brush.verticalGradient(listOf(accent, accent.copy(alpha = 0.2f))), shape),
                  contentAlignment = Alignment.Center
              ) {
                  Text(label, color = Color.White, fontWeight = FontWeight.ExtraBold, fontSize = if (big) 15.sp else 20.sp)
                  Box(
                      Modifier
                          .align(Alignment.TopCenter)
                          .padding(top = 6.dp)
                          .size(width = 16.dp, height = 3.dp)
                          .clip(CircleShape)
                          .background(Color.White.copy(alpha = 0.35f))
                  )
              }
          }

          /** Dashed line whose dashes travel, showing audio flowing between phones. */
          @Composable
          fun Flow(modifier: Modifier = Modifier, color: Color) {
              val t = rememberInfiniteTransition(label = "flow")
              val p by t.animateFloat(0f, 1f, infiniteRepeatable(tween(1200, easing = LinearEasing)), label = "p")
              Canvas(modifier.height(8.dp)) {
                  val eff = PathEffect.dashPathEffect(floatArrayOf(6.dp.toPx(), 8.dp.toPx()), -p * 14.dp.toPx())
                  drawLine(color, Offset(0f, size.height / 2), Offset(size.width, size.height / 2), 2.5.dp.toPx(), StrokeCap.Round, eff)
              }
          }

          @Composable
          fun Logo(modifier: Modifier = Modifier) {
              Canvas(modifier) {
                  val c = center
                  val r = size.minDimension / 2
                  val sw = r * 0.14f
                  drawCircle(Color.White, radius = r * 0.16f, center = c)
                  fun arc(rad: Float, start: Float, col: Color) {
                      drawArc(
                          col, start, 90f, false,
                          Offset(c.x - rad, c.y - rad), Size(rad * 2, rad * 2),
                          style = Stroke(sw, cap = StrokeCap.Round)
                      )
                  }
                  arc(r * 0.46f, -45f, C.cyan)
                  arc(r * 0.78f, -45f, C.violet)
                  arc(r * 0.46f, 135f, C.pink)
                  arc(r * 0.78f, 135f, C.violet)
              }
          }

          @Composable
          fun IconTile(icon: ImageVector, colors: List<Color>, sz: Dp = 52.dp) {
              Box(
                  Modifier
                      .size(sz)
                      .clip(RoundedCornerShape(16.dp))
                      .background(Brush.linearGradient(colors)),
                  contentAlignment = Alignment.Center
              ) {
                  Icon(icon, null, tint = C.ink, modifier = Modifier.size(sz * 0.5f))
              }
          }

          @Composable
          fun ProgressBar(fraction: Float, modifier: Modifier = Modifier) {
              val f by animateFloatAsState(fraction.coerceIn(0f, 1f), tween(200), label = "prog")
              Box(modifier.height(8.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.10f))) {
                  Box(Modifier.fillMaxWidth(f).fillMaxHeight().clip(CircleShape).background(C.brand))
              }
          }

          @Composable
          fun SonaraSlider(value: Float, onChange: (Float) -> Unit, range: ClosedFloatingPointRange<Float>, modifier: Modifier = Modifier) {
              Slider(
                  value = value,
                  onValueChange = onChange,
                  valueRange = range,
                  modifier = modifier,
                  colors = SliderDefaults.colors(
                      thumbColor = C.cyan,
                      activeTrackColor = C.violet,
                      inactiveTrackColor = Color.White.copy(alpha = 0.14f)
                  )
              )
          }

          @Composable
          fun SwitchRow(title: String, subtitle: String, checked: Boolean, onChange: (Boolean) -> Unit) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                  Column(Modifier.weight(1f)) {
                      Text(title, color = C.text, fontSize = 15.sp, fontWeight = FontWeight.SemiBold)
                      Text(subtitle, color = C.muted, fontSize = 12.sp)
                  }
                  Switch(
                      checked = checked,
                      onCheckedChange = onChange,
                      colors = SwitchDefaults.colors(
                          checkedThumbColor = C.ink,
                          checkedTrackColor = C.cyan,
                          uncheckedThumbColor = C.muted,
                          uncheckedTrackColor = Color.White.copy(alpha = 0.08f),
                          uncheckedBorderColor = Color.White.copy(alpha = 0.2f)
                      )
                  )
              }
          }
          SONARA_EOF

