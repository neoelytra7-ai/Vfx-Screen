      - name: "Write app/src/main/res/mipmap-anydpi/ic_launcher.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/res/mipmap-anydpi/ic_launcher.xml)"
          cat > android/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'SONARA_EOF'
