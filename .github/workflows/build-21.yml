      - name: "Write app/src/main/java/app/sonara/core/Proto.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/core/Proto.kt)"
          cat > android/app/src/main/java/app/sonara/core/Proto.kt <<'SONARA_EOF'
          package app.sonara.core

          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          enum class Role(val id: Int, val label: String, val short: String) {
              STEREO(0, "Stereo", "ST"),
              LEFT(1, "Left", "L"),
              RIGHT(2, "Right", "R"),
              MONO(3, "Mono", "M"),
              SUB(4, "Sub", "SW");

              companion object {
                  fun of(id: Int): Role = values().firstOrNull { it.id == id } ?: STEREO
              }
          }

          /** Per-speaker configuration, owned by the host and mirrored to the speaker. */
          data class Cfg(
              val role: Role = Role.STEREO,
              val volume: Int = 100,
              val trimMs: Int = 0,
              val latencyMs: Int = 220,
              val muted: Boolean = false
          )

          object Proto {
              const val PORT_HOST = 47100
              const val PORT_SPK = 47101
              const val RATE = 48000
              const val FRAME = 240                 // frames per packet = 5 ms
              const val FRAME_NS = 5_000_000L
              const val AUDIO_HDR = 23

              const val T_DISCOVER = 1
              const val T_ANNOUNCE = 2
              const val T_JOIN = 3
              const val T_ACK = 4
              const val T_LEAVE = 5
              const val T_TREQ = 6
              const val T_TRSP = 7
              const val T_AUDIO = 8

              fun buf(type: Int, size: Int): ByteBuffer =
                  ByteBuffer.allocate(size).order(ByteOrder.LITTLE_ENDIAN)
                      .put(0x53.toByte()).put(0x59.toByte()).put(1.toByte()).put(type.toByte())

              fun valid(d: ByteArray, len: Int): Boolean =
                  len >= 4 && d[0] == 0x53.toByte() && d[1] == 0x59.toByte() && d[2] == 1.toByte()

              fun type(d: ByteArray): Int = d[3].toInt() and 0xFF
          }

          fun ByteBuffer.putStr(s: String): ByteBuffer {
              val b = s.toByteArray(Charsets.UTF_8)
              val n = minOf(b.size, 48)
              put(n.toByte())
              put(b, 0, n)
              return this
          }

          fun ByteBuffer.getStr(): String {
              val n = get().toInt() and 0xFF
              val b = ByteArray(n)
              get(b)
              return String(b, Charsets.UTF_8)
          }

          fun ByteBuffer.putCfg(c: Cfg): ByteBuffer {
              put(c.role.id.toByte())
              put(c.volume.toByte())
              putShort(c.trimMs.toShort())
              putShort(c.latencyMs.toShort())
              put((if (c.muted) 1 else 0).toByte())
              return this
          }

          fun ByteBuffer.getCfg(): Cfg {
              val r = Role.of(get().toInt())
              val v = get().toInt() and 0xFF
              val t = getShort().toInt()
              val l = getShort().toInt()
              val m = get().toInt() != 0
              return Cfg(r, v, t, l, m)
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/core/Net.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/core/Net.kt)"
          cat > android/app/src/main/java/app/sonara/core/Net.kt <<'SONARA_EOF'
          package app.sonara.core

          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.InterfaceAddress
          import java.net.NetworkInterface
          import java.util.Collections

          object Net {
              private fun addrs(): List<InterfaceAddress> = try {
                  Collections.list(NetworkInterface.getNetworkInterfaces())
                      .filter { it.isUp && !it.isLoopback }
                      .flatMap { it.interfaceAddresses }
              } catch (e: Exception) {
                  emptyList()
              }

              /** Directed broadcast addresses of every active IPv4 interface (Wi-Fi and hotspot). */
              fun broadcasts(): List<InetAddress> = addrs().mapNotNull { it.broadcast }.distinct()

              fun localIp(): String = addrs().map { it.address }
                  .firstOrNull { it is Inet4Address && it.isSiteLocalAddress }?.hostAddress ?: "-"
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/core/ClockSync.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/core/ClockSync.kt)"
          cat > android/app/src/main/java/app/sonara/core/ClockSync.kt <<'SONARA_EOF'
          package app.sonara.core

          /**
           * Estimates hostTime = localTime + offsetNs with an NTP-style ping/pong.
           * Of the last 8 samples the one with the smallest RTT wins (least queueing delay),
           * then the result is low-pass filtered to avoid steps.
           */
          class ClockSync {
              private val offs = LongArray(8)
              private val rtts = LongArray(8)
              private var idx = 0

              @Volatile var count = 0
                  private set
              @Volatile var offsetNs = 0L
                  private set
              @Volatile var rttNs = 0L
                  private set
              @Volatile var valid = false
                  private set

              @Synchronized
              fun reset() {
                  idx = 0
                  count = 0
                  valid = false
                  offsetNs = 0L
                  rttNs = 0L
              }

              @Synchronized
              fun update(t0: Long, t1: Long, t3: Long) {
                  val rtt = t3 - t0
                  if (rtt <= 0L || rtt > 400_000_000L) return
                  offs[idx] = t1 - (t0 + rtt / 2)
                  rtts[idx] = rtt
                  idx = (idx + 1) % offs.size
                  if (count < offs.size) count++
                  var best = 0
                  for (i in 0 until count) if (rtts[i] < rtts[best]) best = i
                  val target = offs[best]
                  offsetNs = if (!valid) target else offsetNs + ((target - offsetNs) * 0.2).toLong()
                  rttNs = rtts[best]
                  valid = true
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/core/Spectrum.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/core/Spectrum.kt)"
          cat > android/app/src/main/java/app/sonara/core/Spectrum.kt <<'SONARA_EOF'
          package app.sonara.core

          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.ln
          import kotlin.math.log10
          import kotlin.math.max
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.sqrt

          /** Small radix-2 FFT that turns the last N mono samples into log-spaced, smoothed bands (0..1). */
          class Spectrum(private val n: Int = 1024, val bands: Int = 28) {
              private val re = FloatArray(n)
              private val im = FloatArray(n)
              private val ring = FloatArray(n)
              private var w = 0
              private val win = FloatArray(n) { (0.5 - 0.5 * cos(2.0 * PI * it / (n - 1))).toFloat() }
              private val cs = FloatArray(n / 2) { cos(2.0 * PI * it / n).toFloat() }
              private val sn = FloatArray(n / 2) { (-sin(2.0 * PI * it / n)).toFloat() }
              private val lo = IntArray(bands)
              private val hi = IntArray(bands)
              private val tilt = FloatArray(bands)
              private val out = FloatArray(bands)

              init {
                  val binHz = Proto.RATE.toDouble() / n
                  val f0 = 45.0
                  val f1 = 16000.0
                  for (i in 0 until bands) {
                      val a = f0 * (f1 / f0).pow(i.toDouble() / bands)
                      val b = f0 * (f1 / f0).pow((i + 1).toDouble() / bands)
                      lo[i] = max(1, (a / binHz).toInt())
                      hi[i] = max(lo[i], (b / binHz).toInt())
                      tilt[i] = (4.0 * ln(sqrt(a * b) / 800.0) / ln(2.0)).toFloat()
                  }
              }

              fun push(mono: Float) {
                  ring[w] = mono
                  w = (w + 1) % n
              }

              fun compute(): FloatArray {
                  for (i in 0 until n) {
                      re[i] = ring[(w + i) % n] * win[i]
                      im[i] = 0f
                  }
                  fft()
                  val scale = 4f / n
                  for (b in 0 until bands) {
                      var m = 0f
                      for (k in lo[b]..hi[b]) {
                          val mag = sqrt(re[k] * re[k] + im[k] * im[k])
                          if (mag > m) m = mag
                      }
                      val db = 20f * log10(m * scale + 1e-7f) + tilt[b]
                      val v = ((db + 78f) / 60f).coerceIn(0f, 1f)
                      out[b] = if (v > out[b]) v else out[b] * 0.82f + v * 0.18f
                  }
                  return out.copyOf()
              }

              private fun fft() {
                  var j = 0
                  for (i in 1 until n) {
                      var bit = n shr 1
                      while ((j and bit) != 0) {
                          j = j xor bit
                          bit = bit shr 1
                      }
                      j = j xor bit
                      if (i < j) {
                          val tr = re[i]; re[i] = re[j]; re[j] = tr
                          val ti = im[i]; im[i] = im[j]; im[j] = ti
                      }
                  }
                  var len = 2
                  while (len <= n) {
                      val half = len shr 1
                      val step = n / len
                      var i = 0
                      while (i < n) {
                          var k = 0
                          for (m in 0 until half) {
                              val wr = cs[k]
                              val wi = sn[k]
                              val a = i + m
                              val b = a + half
                              val xr = re[b] * wr - im[b] * wi
                              val xi = re[b] * wi + im[b] * wr
                              re[b] = re[a] - xr
                              im[b] = im[a] - xi
                              re[a] += xr
                              im[a] += xi
                              k += step
                          }
                          i += len
                      }
                      len = len shl 1
                  }
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/core/Locks.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/core/Locks.kt)"
          cat > android/app/src/main/java/app/sonara/core/Locks.kt <<'SONARA_EOF'
          package app.sonara.core

          import android.annotation.SuppressLint
          import android.content.Context
          import android.net.wifi.WifiManager
          import android.os.PowerManager

          /**
           * Keeps the radio and CPU in their fastest state while streaming:
           * WIFI_MODE_FULL_LOW_LATENCY disables Wi-Fi power-save batching (the main source of audio jitter).
           */
          @SuppressLint("WakelockTimeout")
          class Locks(ctx: Context, tag: String) {
              private val wm = ctx.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
              private val pm = ctx.applicationContext.getSystemService(Context.POWER_SERVICE) as PowerManager
              private val wifi = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_LOW_LATENCY, "$tag:wifi")
                  .apply { setReferenceCounted(false) }
              private val cpu = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "$tag:cpu")
                  .apply { setReferenceCounted(false) }
              private val mc = wm.createMulticastLock("$tag:mc")
                  .apply { setReferenceCounted(false) }

              fun acquire() {
                  runCatching { wifi.acquire() }
                  runCatching { cpu.acquire() }
                  runCatching { mc.acquire() }
              }

              fun release() {
                  runCatching { if (wifi.isHeld) wifi.release() }
                  runCatching { if (cpu.isHeld) cpu.release() }
                  runCatching { if (mc.isHeld) mc.release() }
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/core/HostEngine.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/core/HostEngine.kt)"
          cat > android/app/src/main/java/app/sonara/core/HostEngine.kt <<'SONARA_EOF'
          package app.sonara.core

          import android.annotation.SuppressLint
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.os.Process
          import android.os.SystemClock
          import app.sonara.AppState
          import app.sonara.PeerUi
          import app.sonara.Viz
          import kotlinx.coroutines.flow.update
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.SocketTimeoutException
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.concurrent.thread
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.sin
          import kotlin.random.Random

          /**
           * Captures everything the phone plays (AudioPlaybackCapture), stamps each 5 ms block with a
           * drift-corrected presentation time and streams it to every speaker, pre-split per role
           * (Left / Right / Mono / Sub send one channel only, so the radio carries half the data).
           */
          @SuppressLint("MissingPermission")
          class HostEngine(private val projection: MediaProjection, private val hostName: String) {

              private class Peer(val id: Int, val order: Int, var name: String, var addr: InetAddress, var port: Int) {
                  @Volatile var cfg = Cfg()
                  @Volatile var seen = SystemClock.elapsedRealtime()
                  @Volatile var errUs = 0
                  @Volatile var bufMs = 0
                  @Volatile var lost = 0
                  @Volatile var playing = false
                  @Volatile var rttMs = 0f
              }

              private val peers = ConcurrentHashMap<Int, Peer>()
              private val session = Random.nextInt()
              private val stopped = AtomicBoolean(false)
              private var sock: DatagramSocket? = null
              private var orderCounter = 0
              private val ip = Net.localIp()

              @Volatile private var running = false
              @Volatile private var latencyMs = 220
              @Volatile private var click = false
              @Volatile private var kbps = 0
              @Volatile private var sentBytes = 0L
              @Volatile var onStopped: (() -> Unit)? = null

              // ---------------------------------------------------------------- public API

              fun start(): Boolean {
                  try {
                      sock = DatagramSocket(null).apply {
                          reuseAddress = true
                          broadcast = true
                          soTimeout = 500
                          try { trafficClass = 0xB8 } catch (ignored: Exception) {}
                          bind(InetSocketAddress(Proto.PORT_HOST))
                      }
                  } catch (e: Exception) {
                      AppState.host.update { it.copy(running = false, error = "Port ${Proto.PORT_HOST} is not available: ${e.message}") }
                      return false
                  }
                  running = true
                  AppState.host.update { it.copy(error = null) }
                  thread(name = "sonara-rx", isDaemon = true) { rxLoop() }
                  thread(name = "sonara-cap", isDaemon = true) { captureLoop() }
                  publish()
                  return true
              }

              fun stop() {
                  if (!stopped.compareAndSet(false, true)) return
                  running = false
                  try { sock?.close() } catch (ignored: Exception) {}
                  try { projection.stop() } catch (ignored: Exception) {}
                  peers.clear()
                  AppState.host.update { it.copy(running = false, peers = emptyList(), kbps = 0) }
                  onStopped?.invoke()
              }

              fun setRole(id: Int, r: Role) = edit(id) { it.copy(role = r) }
              fun setVolume(id: Int, v: Int) = edit(id) { it.copy(volume = v.coerceIn(0, 100)) }
              fun setTrim(id: Int, ms: Int) = edit(id) { it.copy(trimMs = ms.coerceIn(-150, 400)) }
              fun setMute(id: Int, m: Boolean) = edit(id) { it.copy(muted = m) }

              fun swapLR() {
                  val l = peers.values.firstOrNull { it.cfg.role == Role.LEFT }
                  val r = peers.values.firstOrNull { it.cfg.role == Role.RIGHT }
                  if (l != null && r != null) {
                      l.cfg = l.cfg.copy(role = Role.RIGHT)
                      r.cfg = r.cfg.copy(role = Role.LEFT)
                      publish()
                  }
              }

              fun setLatency(ms: Int) {
                  latencyMs = ms.coerceIn(60, 800)
                  publish()
              }

              fun setClick(on: Boolean) {
                  click = on
                  publish()
              }

              // ---------------------------------------------------------------- internals

              private fun edit(id: Int, f: (Cfg) -> Cfg) {
                  peers[id]?.let { it.cfg = f(it.cfg) }
                  publish()
              }

              private fun freeRole(): Role {
                  val used = peers.values.map { it.cfg.role }
                  return when {
                      Role.LEFT !in used -> Role.LEFT
                      Role.RIGHT !in used -> Role.RIGHT
                      else -> Role.STEREO
                  }
              }

              private fun publish() {
                  val list = peers.values.sortedBy { it.order }.map {
                      PeerUi(it.id, it.name, it.addr.hostAddress ?: "", it.cfg, it.errUs, it.bufMs, it.lost, it.rttMs, it.playing)
                  }
                  AppState.host.update {
                      it.copy(running = running, ip = ip, peers = list, latencyMs = latencyMs, click = click, kbps = kbps)
                  }
              }

              private fun fail(msg: String) {
                  AppState.host.update { it.copy(error = msg) }
                  stop()
              }

              private fun send(b: ByteBuffer, to: InetSocketAddress) {
                  try {
                      sock?.send(DatagramPacket(b.array(), b.position(), to))
                  } catch (ignored: Exception) {
                  }
              }

              private fun announce() {
                  val b = Proto.buf(Proto.T_ANNOUNCE, 64).putStr(hostName)
                  for (a in Net.broadcasts()) send(b, InetSocketAddress(a, Proto.PORT_SPK))
              }

              // ---------------------------------------------------------------- control channel

              private fun rxLoop() {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_AUDIO)
                  val buf = ByteArray(1500)
                  val p = DatagramPacket(buf, buf.size)
                  var lastHk = SystemClock.elapsedRealtime()
                  while (running) {
                      var got = false
                      try {
                          p.length = buf.size
                          sock!!.receive(p)
                          got = true
                      } catch (ignored: SocketTimeoutException) {
                      } catch (ignored: Exception) {
                          if (!running) break
                          Thread.sleep(50)
                      }
                      val rx = System.nanoTime()
                      if (got) {
                          try { handle(p, rx) } catch (ignored: Exception) {}
                      }
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastHk >= 1000) {
                          housekeeping(now, now - lastHk)
                          lastHk = now
                      }
                  }
              }

              private fun handle(p: DatagramPacket, rx: Long) {
                  val d = p.data
                  val len = p.length
                  if (!Proto.valid(d, len)) return
                  val b = ByteBuffer.wrap(d, 4, len - 4).order(ByteOrder.LITTLE_ENDIAN)
                  when (Proto.type(d)) {
                      Proto.T_DISCOVER -> {
                          send(Proto.buf(Proto.T_ANNOUNCE, 64).putStr(hostName), InetSocketAddress(p.address, p.port))
                      }
                      Proto.T_JOIN -> {
                          val id = b.getInt()
                          val nm = b.getStr()
                          val old = peers.values.firstOrNull { it.addr == p.address && it.port == p.port && it.id != id }
                          if (old != null) peers.remove(old.id)
                          val peer = peers.getOrPut(id) {
                              Peer(id, orderCounter++, nm, p.address, p.port).also { it.cfg = old?.cfg ?: Cfg(role = freeRole()) }
                          }
                          peer.name = nm
                          peer.addr = p.address
                          peer.port = p.port
                          peer.seen = SystemClock.elapsedRealtime()
                          val ack = Proto.buf(Proto.T_ACK, 40).putInt(id).putInt(session)
                          ack.putCfg(peer.cfg.copy(latencyMs = latencyMs))
                          send(ack, InetSocketAddress(p.address, p.port))
                          publish()
                      }
                      Proto.T_TREQ -> {
                          val id = b.getInt()
                          val t0 = b.getLong()
                          val peer = peers[id] ?: return
                          peer.errUs = b.getInt()
                          peer.bufMs = b.getShort().toInt()
                          peer.lost = b.getInt()
                          peer.playing = b.get().toInt() != 0
                          peer.rttMs = b.getShort() / 10f
                          peer.addr = p.address
                          peer.port = p.port
                          peer.seen = SystemClock.elapsedRealtime()
                          val rsp = Proto.buf(Proto.T_TRSP, 40).putLong(t0).putLong(rx)
                          rsp.putCfg(peer.cfg.copy(latencyMs = latencyMs))
                          send(rsp, InetSocketAddress(p.address, p.port))
                      }
                      Proto.T_LEAVE -> {
                          peers.remove(b.getInt())
                          publish()
                      }
                  }
              }

              private fun housekeeping(now: Long, dtMs: Long) {
                  val iter = peers.values.iterator()
                  while (iter.hasNext()) {
                      if (now - iter.next().seen > 6000) iter.remove()
                  }
                  kbps = ((sentBytes * 8) / max(1L, dtMs)).toInt()
                  sentBytes = 0L
                  announce()
                  publish()
              }

              // ---------------------------------------------------------------- capture + stream

              private fun fill(bb: ByteBuffer, role: Role, blk: ShortArray, seq: Int, pts: Long) {
                  val ch = if (role == Role.STEREO) 2 else 1
                  bb.clear()
                  bb.put(0x53.toByte()).put(0x59.toByte()).put(1.toByte()).put(Proto.T_AUDIO.toByte())
                  bb.putInt(session).putInt(seq).putLong(pts).put(ch.toByte()).putShort(Proto.FRAME.toShort())
                  when (role) {
                      Role.STEREO -> for (i in 0 until Proto.FRAME * 2) bb.putShort(blk[i])
                      Role.LEFT -> for (i in 0 until Proto.FRAME) bb.putShort(blk[2 * i])
                      Role.RIGHT -> for (i in 0 until Proto.FRAME) bb.putShort(blk[2 * i + 1])
                      else -> for (i in 0 until Proto.FRAME) bb.putShort(((blk[2 * i] + blk[2 * i + 1]) shr 1).toShort())
                  }
              }

              private fun captureLoop() {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO)
                  val rec = try {
                      val capCfg = AudioPlaybackCaptureConfiguration.Builder(projection)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                          .build()
                      val fmt = AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(Proto.RATE)
                          .setChannelMask(AudioFormat.CHANNEL_IN_STEREO)
                          .build()
                      val min = AudioRecord.getMinBufferSize(Proto.RATE, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT)
                      AudioRecord.Builder()
                          .setAudioFormat(fmt)
                          .setBufferSizeInBytes(max(min, Proto.FRAME * 4 * 16))
                          .setAudioPlaybackCaptureConfig(capCfg)
                          .build()
                  } catch (e: Throwable) {
                      fail("Could not capture audio: ${e.message}")
                      return
                  }
                  try {
                      rec.startRecording()
                  } catch (e: Throwable) {
                      rec.release()
                      fail("Could not start recording: ${e.message}")
                      return
                  }

                  val blk = ShortArray(Proto.FRAME * 2)
                  val spec = Spectrum()
                  val out = ByteArray(Proto.AUDIO_HDR + Proto.FRAME * 4)
                  val bb = ByteBuffer.wrap(out).order(ByteOrder.LITTLE_ENDIAN)
                  val dp = DatagramPacket(out, out.size)
                  var n = 0L
                  var base = 0L
                  var seq = 0
                  var pkL = 0
                  var pkR = 0
                  var clickCtr = 0L

                  try {
                      while (running) {
                          var got = 0
                          while (got < blk.size && running) {
                              val r = rec.read(blk, got, blk.size - got, AudioRecord.READ_BLOCKING)
                              if (r < 0) {
                                  fail("Audio capture stopped (code $r)")
                                  return
                              }
                              got += r
                          }
                          if (!running) break

                          // Presentation time: frame-counted timeline, slowly steered by a PLL to the wall clock.
                          val now = System.nanoTime()
                          if (n == 0L) base = now - Proto.FRAME_NS
                          val err = (now - Proto.FRAME_NS) - (base + n * Proto.FRAME_NS)
                          base += if (abs(err) > 40_000_000L) err else (err * 0.002).toLong()
                          val pts = base + n * Proto.FRAME_NS

                          if (click) {
                              for (i in 0 until Proto.FRAME) {
                                  val p = (clickCtr % 48000L).toInt()
                                  clickCtr++
                                  val s = if (p < 480) {
                                      (sin(2.0 * PI * 1000.0 * p / 48000.0) * 0.7 * 32767.0 * (1.0 - p / 480.0)).toInt().toShort()
                                  } else {
                                      0.toShort()
                                  }
                                  blk[2 * i] = s
                                  blk[2 * i + 1] = s
                              }
                          }

                          for (i in 0 until Proto.FRAME) {
                              val l = blk[2 * i].toInt()
                              val r = blk[2 * i + 1].toInt()
                              spec.push((l + r) / 65536f)
                              if (abs(l) > pkL) pkL = abs(l)
                              if (abs(r) > pkR) pkR = abs(r)
                          }

                          for (peer in peers.values) {
                              fill(bb, peer.cfg.role, blk, seq, pts)
                              dp.setData(out, 0, bb.position())
                              dp.address = peer.addr
                              dp.port = peer.port
                              try {
                                  sock?.send(dp)
                                  sentBytes += bb.position() + 28
                              } catch (ignored: Exception) {
                              }
                          }

                          n++
                          seq++
                          if (n % 6L == 0L) {
                              AppState.hostViz.value = Viz(spec.compute(), pkL / 32768f, pkR / 32768f)
                              pkL = 0
                              pkR = 0
                          }
                      }
                  } finally {
                      try { rec.stop() } catch (ignored: Exception) {}
                      rec.release()
                  }
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/core/SpeakerEngine.kt"
        run: |
          mkdir -p "$(dirname android/app/src/main/java/app/sonara/core/SpeakerEngine.kt)"
          cat > android/app/src/main/java/app/sonara/core/SpeakerEngine.kt <<'SONARA_EOF'
          package app.sonara.core

          import android.content.SharedPreferences
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTimestamp
          import android.media.AudioTrack
          import android.os.Process
          import android.os.SystemClock
          import app.sonara.AppState
          import app.sonara.FoundHost
          import app.sonara.SpStatus
          import app.sonara.Viz
          import kotlinx.coroutines.flow.update
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.SocketTimeoutException
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.atomic.AtomicReferenceArray
          import kotlin.concurrent.thread
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.tanh
          import kotlin.random.Random

          /** Second-order low-pass (RBJ cookbook), used twice in series for the Sub role (Linkwitz-Riley 24 dB/oct). */
          private class Biquad(fc: Float, q: Float) {
              private val b0: Float
              private val b1: Float
              private val b2: Float
              private val a1: Float
              private val a2: Float
              private var z1 = 0f
              private var z2 = 0f

              init {
                  val w0 = 2.0 * PI * fc / Proto.RATE
                  val alpha = sin(w0) / (2.0 * q)
                  val c = cos(w0)
                  val a0 = 1.0 + alpha
                  b0 = (((1.0 - c) / 2.0) / a0).toFloat()
                  b1 = ((1.0 - c) / a0).toFloat()
                  b2 = b0
                  a1 = ((-2.0 * c) / a0).toFloat()
                  a2 = ((1.0 - alpha) / a0).toFloat()
              }

              fun process(x: Float): Float {
                  val y = b0 * x + z1
                  z1 = b1 * x - a1 * y + z2
                  z2 = b2 * x - a2 * y
                  return y
              }

              fun reset() {
                  z1 = 0f
                  z2 = 0f
              }
          }

          /**
           * Receives the stream and plays every 5 ms block at an exact moment on the local clock:
           *   playTime = blockPts - (hostClock - localClock) + latency + trim
           * The time at which a frame really leaves the DAC is read back from AudioTrack.getTimestamp(),
           * and the difference is trimmed with sub-sample resampling so that two phones stay aligned
           * to well under a millisecond of each other without audible pitch artefacts.
           */
          class SpeakerEngine(private val name: String, private val prefs: SharedPreferences) {

              private class Pkt(val seq: Int, val pts: Long, val data: ShortArray, val ch: Int)
              private class Ref(val seq: Int, val pts: Long)
              private class Found(val name: String, val ip: String, val seen: Long)

              private val myId = Random.nextInt()
              private var sock: DatagramSocket? = null
              private val ring = AtomicReferenceArray<Pkt>(1024)
              private val hosts = ConcurrentHashMap<String, Found>()
              private val clock = ClockSync()
              private val spec = Spectrum()

              @Volatile private var running = false
              @Volatile private var host: InetSocketAddress? = null
              @Volatile private var hostName = ""
              @Volatile private var joined = false
              @Volatile private var session = 0
              @Volatile private var cfg = Cfg()
              @Volatile private var ref: Ref? = null
              @Volatile private var latestSeq = -1
              @Volatile private var lastAudioMs = 0L
              @Volatile private var lastRspMs = 0L
              @Volatile private var status = SpStatus.SEARCHING
              @Volatile private var errUs = 0
              @Volatile private var bufMs = 0
              @Volatile private var lost = 0
              @Volatile private var under = 0
              @Volatile private var rttMs = 0f
              @Volatile private var playing = false
              @Volatile private var autoJoin = true
              @Volatile private var errorMsg: String? = null
              @Volatile private var autoIp: String? = prefs.getString("last_host", null)
              @Volatile private var localVol = 1f
              @Volatile private var boost = false

              // DSP scratch (play thread only)
              private val inL = FloatArray(Proto.FRAME)
              private val inR = FloatArray(Proto.FRAME)
              private val lastL = FloatArray(Proto.FRAME)
              private val lastR = FloatArray(Proto.FRAME)
              private val outBuf = ShortArray(2 * (Proto.FRAME + 8))
              private val lp1 = Biquad(110f, 0.7071f)
              private val lp2 = Biquad(110f, 0.7071f)
              private var wasSub = false
              private var peakL = 0f
              private var peakR = 0f

              // ---------------------------------------------------------------- public API

              fun start() {
                  try {
                      sock = DatagramSocket(null).apply {
                          reuseAddress = true
                          broadcast = true
                          soTimeout = 400
                          try { trafficClass = 0xB8 } catch (ignored: Exception) {}
                          bind(InetSocketAddress(Proto.PORT_SPK))
                      }
                  } catch (e: Exception) {
                      errorMsg = "Port ${Proto.PORT_SPK} is not available: ${e.message}"
                      publish()
                      return
                  }
                  running = true
                  thread(name = "sonara-srx", isDaemon = true) { rxLoop() }
                  thread(name = "sonara-sctl", isDaemon = true) { ctlLoop() }
                  thread(name = "sonara-play", isDaemon = true) { playLoop() }
                  publish()
              }

              fun stop() {
                  if (!running && sock == null) return
                  leave()
                  running = false
                  try { sock?.close() } catch (ignored: Exception) {}
                  sock = null
                  AppState.speaker.value = app.sonara.SpeakerUi()
              }

              fun join(ip: String) {
                  try {
                      host = InetSocketAddress(InetAddress.getByName(ip), Proto.PORT_HOST)
                  } catch (e: Exception) {
                      errorMsg = "Invalid address: $ip"
                      publish()
                      return
                  }
                  errorMsg = null
                  autoJoin = true
                  hostName = hosts[ip]?.name ?: ip
                  joined = false
                  resetStream()
                  status = SpStatus.JOINING
                  publish()
              }

              fun leave() {
                  val h = host
                  if (h != null && joined) send(Proto.buf(Proto.T_LEAVE, 8).putInt(myId), h)
                  host = null
                  joined = false
                  autoJoin = false
                  resetStream()
                  status = SpStatus.SEARCHING
                  publish()
              }

              fun setLocalVolume(v: Float) {
                  localVol = v.coerceIn(0f, 1f)
                  publish()
              }

              fun setBoost(on: Boolean) {
                  boost = on
                  publish()
              }

              // ---------------------------------------------------------------- helpers

              private fun resetStream() {
                  for (i in 0 until ring.length()) ring.set(i, null)
                  latestSeq = -1
                  ref = null
                  playing = false
                  errUs = 0
                  bufMs = 0
                  lost = 0
                  under = 0
                  clock.reset()
              }

              private fun publish() {
                  val now = SystemClock.elapsedRealtime()
                  val list = hosts.values.filter { now - it.seen < 6000 }.sortedBy { it.name }.map { FoundHost(it.name, it.ip) }
                  AppState.speaker.update {
                      it.copy(
                          status = if (running) status else SpStatus.OFF,
                          hosts = list, hostName = hostName, cfg = cfg, errUs = errUs, bufMs = bufMs,
                          lost = lost, under = under, rttMs = rttMs, localVol = localVol, boost = boost, error = errorMsg
                      )
                  }
              }

              private fun send(b: ByteBuffer, to: InetSocketAddress) {
                  try {
                      sock?.send(DatagramPacket(b.array(), b.position(), to))
                  } catch (ignored: Exception) {
                  }
              }

              private fun discover() {
                  val b = Proto.buf(Proto.T_DISCOVER, 64).putStr(name)
                  for (a in Net.broadcasts()) send(b, InetSocketAddress(a, Proto.PORT_HOST))
                  try { send(b, InetSocketAddress(InetAddress.getByName("255.255.255.255"), Proto.PORT_HOST)) } catch (ignored: Exception) {}
              }

              // ---------------------------------------------------------------- network threads

              private fun rxLoop() {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_AUDIO)
                  val buf = ByteArray(2048)
                  val p = DatagramPacket(buf, buf.size)
                  while (running) {
                      try {
                          p.length = buf.size
                          sock!!.receive(p)
                      } catch (e: SocketTimeoutException) {
                          continue
                      } catch (e: Exception) {
                          if (!running) break
                          Thread.sleep(50)
                          continue
                      }
                      val rx = System.nanoTime()
                      try { handle(p, rx) } catch (ignored: Exception) {}
                  }
              }

              private fun handle(p: DatagramPacket, rx: Long) {
                  val d = p.data
                  val len = p.length
                  if (!Proto.valid(d, len)) return
                  val b = ByteBuffer.wrap(d, 4, len - 4).order(ByteOrder.LITTLE_ENDIAN)
                  when (Proto.type(d)) {
                      Proto.T_ANNOUNCE -> {
                          val ip = p.address.hostAddress ?: return
                          hosts[ip] = Found(b.getStr(), ip, SystemClock.elapsedRealtime())
                          if (host == null && autoJoin && ip == autoIp) join(ip)
                      }
                      Proto.T_ACK -> {
                          if (b.getInt() != myId) return
                          val s = b.getInt()
                          if (s != session) {
                              resetStream()
                              session = s
                          }
                          cfg = b.getCfg()
                          lastRspMs = SystemClock.elapsedRealtime()
                          joined = true
                          status = SpStatus.SYNCING
                          prefs.edit().putString("last_host", p.address.hostAddress).apply()
                          autoIp = p.address.hostAddress
                      }
                      Proto.T_TRSP -> {
                          val t0 = b.getLong()
                          val t1 = b.getLong()
                          cfg = b.getCfg()
                          clock.update(t0, t1, rx)
                          rttMs = clock.rttNs / 1_000_000f
                          lastRspMs = SystemClock.elapsedRealtime()
                      }
                      Proto.T_AUDIO -> onAudio(b)
                  }
              }

              private fun onAudio(b: ByteBuffer) {
                  if (b.getInt() != session) return
                  val seq = b.getInt()
                  val pts = b.getLong()
                  val ch = b.get().toInt()
                  val n = b.getShort().toInt()
                  if (n != Proto.FRAME || ch < 1 || ch > 2) return
                  val data = ShortArray(n * ch)
                  b.asShortBuffer().get(data)
                  ring.set(seq and 1023, Pkt(seq, pts, data, ch))
                  if (latestSeq == -1 || seq - latestSeq > 0) {
                      latestSeq = seq
                      ref = Ref(seq, pts)
                  }
                  lastAudioMs = SystemClock.elapsedRealtime()
              }

              private fun ctlLoop() {
                  var tDisc = 0L
                  var tJoin = 0L
                  var tReq = 0L
                  var tPub = 0L
                  while (running) {
                      val now = SystemClock.elapsedRealtime()
                      val h = host
                      if (h == null) {
                          if (now - tDisc > 1200) {
                              discover()
                              tDisc = now
                          }
                      } else if (!joined) {
                          if (now - tJoin > 700) {
                              send(Proto.buf(Proto.T_JOIN, 64).putInt(myId).putStr(name), h)
                              tJoin = now
                          }
                      } else {
                          val every = if (clock.count < 8) 120L else 1000L
                          if (now - tReq > every) {
                              val b = Proto.buf(Proto.T_TREQ, 40)
                              b.putInt(myId).putLong(System.nanoTime())
                              b.putInt(errUs).putShort(bufMs.coerceIn(0, 30000).toShort()).putInt(lost)
                              b.put((if (playing) 1 else 0).toByte())
                              b.putShort((rttMs * 10f).toInt().coerceIn(0, 30000).toShort())
                              send(b, h)
                              tReq = now
                          }
                          if (now - lastRspMs > 5000) {
                              joined = false
                              playing = false
                              status = SpStatus.JOINING
                          }
                      }
                      if (now - tPub > 250) {
                          publish()
                          tPub = now
                      }
                      Thread.sleep(30)
                  }
              }

              // ---------------------------------------------------------------- playout

              private fun playLoop() {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO)
                  while (running) {
                      val fresh = SystemClock.elapsedRealtime() - lastAudioMs < 1000
                      if (joined && ref != null && clock.valid && latestSeq >= 0 && fresh) {
                          try { playback() } catch (e: Exception) { Thread.sleep(200) }
                      } else {
                          Thread.sleep(20)
                      }
                  }
              }

              private fun decode(p: Pkt, sub: Boolean) {
                  val n = Proto.FRAME
                  if (p.ch == 2) {
                      for (i in 0 until n) {
                          inL[i] = p.data[2 * i] / 32768f
                          inR[i] = p.data[2 * i + 1] / 32768f
                      }
                  } else {
                      for (i in 0 until n) {
                          val v = p.data[i] / 32768f
                          inL[i] = v
                          inR[i] = v
                      }
                  }
                  if (sub) {
                      if (!wasSub) { lp1.reset(); lp2.reset() }
                      for (i in 0 until n) {
                          val v = lp2.process(lp1.process((inL[i] + inR[i]) * 0.5f))
                          inL[i] = v
                          inR[i] = v
                      }
                  }
                  wasSub = sub
                  System.arraycopy(inL, 0, lastL, 0, n)
                  System.arraycopy(inR, 0, lastR, 0, n)
              }

              private fun soft(x: Float): Float {
                  val a = abs(x)
                  if (a < 0.6f) return x
                  val y = 0.6f + 0.4f * tanh((a - 0.6f) / 0.4f)
                  return if (x < 0f) -y else y
              }

              /** Linear-interpolating resampler: reads [start, start+len) and writes nOut stereo frames into outBuf. */
              private fun render(sl: FloatArray, sr: FloatArray, start: Int, len: Int, nOut: Int, g0: Float, g1: Float, limit: Boolean) {
                  val step = if (nOut > 1) (len - 1).toFloat() / (nOut - 1) else 0f
                  val last = start + len - 1
                  for (j in 0 until nOut) {
                      val pos = start + j * step
                      val i0 = pos.toInt()
                      val fr = pos - i0
                      val i1 = min(i0 + 1, last)
                      var l = sl[i0] + (sl[i1] - sl[i0]) * fr
                      var r = sr[i0] + (sr[i1] - sr[i0]) * fr
                      val g = g0 + (g1 - g0) * (j.toFloat() / nOut)
                      l *= g
                      r *= g
                      if (limit) {
                          l = soft(l)
                          r = soft(r)
                      }
                      l = l.coerceIn(-1f, 1f)
                      r = r.coerceIn(-1f, 1f)
                      if (abs(l) > peakL) peakL = abs(l)
                      if (abs(r) > peakR) peakR = abs(r)
                      outBuf[2 * j] = (l * 32767f).toInt().toShort()
                      outBuf[2 * j + 1] = (r * 32767f).toInt().toShort()
                  }
              }

              private fun playback() {
                  val minBuf = AudioTrack.getMinBufferSize(Proto.RATE, AudioFormat.CHANNEL_OUT_STEREO, AudioFormat.ENCODING_PCM_16BIT)
                  val track = try {
                      AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(Proto.RATE)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_STEREO)
                                  .build()
                          )
                          .setTransferMode(AudioTrack.MODE_STREAM)
                          .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                          .setBufferSizeInBytes(max(minBuf, 1920 * 4))
                          .build()
                  } catch (e: Throwable) {
                      errorMsg = "Could not open audio output: ${e.message}"
                      Thread.sleep(800)
                      return
                  }

                  val ts = AudioTimestamp()
                  val frameNs = 1e9 / Proto.RATE
                  val hard = 480.0
                  var written = 0L
                  var errF = 0.0
                  var nextSeq = latestSeq
                  var loss = 0
                  var gain = 0f
                  var good = 0
                  var blocks = 0

                  fun playAt(): Long =
                      if (track.getTimestamp(ts)) {
                          ts.nanoTime + ((written - ts.framePosition) * 1_000_000_000L) / Proto.RATE
                      } else {
                          val head = track.playbackHeadPosition.toLong() and 0xFFFFFFFFL
                          System.nanoTime() + ((written - head) * 1_000_000_000L) / Proto.RATE + 30_000_000L
                      }

                  fun emit(n: Int): Boolean {
                      val r = track.write(outBuf, 0, n * 2, AudioTrack.WRITE_BLOCKING)
                      if (r < 0) return false
                      written += n
                      return true
                  }

                  try {
                      track.play()
                      while (running && joined && SystemClock.elapsedRealtime() - lastAudioMs < 3000) {
                          val r = ref ?: break
                          val c = cfg
                          val lat = c.latencyMs * 1_000_000L
                          val trim = max(c.trimMs, -(c.latencyMs - 40)) * 1_000_000L
                          val pk = ring.get(nextSeq and 1023)?.takeIf { it.seq == nextSeq }
                          val pts = pk?.pts ?: (r.pts + (nextSeq - r.seq) * Proto.FRAME_NS)
                          val target = pts - clock.offsetNs + lat + trim
                          val e = (playAt() - target) / frameNs            // frames; positive = we are late

                          if (e < -hard) {                                  // too early: pad exact amount of silence
                              val n = min(Proto.FRAME, (-e).toInt())
                              outBuf.fill(0.toShort(), 0, n * 2)
                              if (!emit(n)) break
                              errF = 0.0
                              gain = 0f
                              continue
                          }
                          if (e > hard) {                                   // too late: drop this block
                              nextSeq++
                              errF = 0.0
                              continue
                          }

                          errF = errF * 0.9 + e * 0.1
                          var k = 0
                          if (pk != null) {
                              if (errF > 24.0) {
                                  k = if (errF > 120.0) 2 else 1
                              } else if (errF < -24.0) {
                                  k = if (errF < -120.0) -2 else -1
                              }
                          }
                          errF -= k
                          val nOut = Proto.FRAME - k
                          val v = c.volume / 100f
                          val tg = if (c.muted) 0f else v * v * localVol * localVol

                          if (pk != null) {
                              decode(pk, c.role == Role.SUB)
                              loss = 0
                              good++
                              render(inL, inR, 0, Proto.FRAME, nOut, gain, tg, boost)
                              gain = tg
                              if (!emit(nOut)) break
                          } else {
                              lost++
                              loss++
                              if (loss == 1) {
                                  render(lastL, lastR, 0, Proto.FRAME, Proto.FRAME, gain, 0f, false)
                              } else {
                                  outBuf.fill(0.toShort(), 0, Proto.FRAME * 2)
                              }
                              gain = 0f
                              if (!emit(Proto.FRAME)) break
                          }
                          nextSeq++

                          for (j in 0 until nOut) spec.push((outBuf[2 * j] + outBuf[2 * j + 1]) / 65536f)
                          blocks++
                          if (blocks % 8 == 0) {
                              AppState.speakerViz.value = Viz(spec.compute(), peakL, peakR)
                              peakL = 0f
                              peakR = 0f
                              errUs = (errF * frameNs / 1000.0).toInt()
                              bufMs = max(0, latestSeq - nextSeq) * 5
                              under = track.underrunCount
                          }
                          if (good > 40 && abs(errF) < 200.0 && !playing) {
                              playing = true
                              status = SpStatus.PLAYING
                          }
                      }
                  } finally {
                      playing = false
                      if (joined && running) status = SpStatus.SYNCING
                      try { track.stop() } catch (ignored: Exception) {}
                      track.release()
                  }
              }
          }
          SONARA_EOF

      - name: "Write app/src/main/java/app/sonara/AppState.kt"
