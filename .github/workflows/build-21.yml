      - name: "Write app/src/main/res/mipmap-anydpi/ic_launcher_round.xml"
        run: |
          mkdir -p "$(dirname android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml)"
          cat > android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml <<'SONARA_EOF'
