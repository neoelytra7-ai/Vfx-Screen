name: Cinema Sky APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build APK
        run: |
          set -e
          A=$ANDROID_HOME
          BT=$A/build-tools/$(ls $A/build-tools|grep -E '^[0-9.]+$'|sort -V|tail -1)
          AJ=$A/platforms/$(ls $A/platforms|grep -E '^android-[0-9]+$'|sort -V|tail -1)/android.jar
          K=$GITHUB_WORKSPACE/wp.keystore
          if [ ! -f $K ]; then
            keytool -genkeypair -keystore $K -alias k -keyalg RSA -keysize 2048 -validity 36500 -storepass wallpaper -keypass wallpaper -dname "CN=Sky,O=Sky,C=ID"
            (git config user.name bot && git config user.email bot@x && git add wp.keystore && git commit -qm "ci: keystore" && git push -q) || echo "::warning::keystore gagal di-push, update berikutnya tidak bisa menimpa"
          fi
          mkdir -p /tmp/b/{s/x/sky,res/xml,res/values,o,d,out} && cd /tmp/b
          cat > M.xml <<'X'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="x.sky">
          <uses-feature android:name="android.software.live_wallpaper" android:required="true"/>
          <application android:label="Cinema Sky" android:allowBackup="false">
          <activity android:name=".Main" android:exported="true" android:theme="@android:style/Theme.NoDisplay">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <service android:name=".WP" android:exported="true" android:label="Cinema Sky" android:permission="android.permission.BIND_WALLPAPER">
          <intent-filter><action android:name="android.service.wallpaper.WallpaperService"/></intent-filter>
          <meta-data android:name="android.service.wallpaper" android:resource="@xml/wp"/></service>
          </application></manifest>
          X
          cat > res/xml/wp.xml <<'X'
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android" android:description="@string/d"/>
          X
          cat > res/values/s.xml <<'X'
          <resources><string name="d">Minecraft pixel sky, cinematic pan</string></resources>
          X
          cat > s/x/sky/WP.java <<'X'
          package x.sky;
          import android.graphics.*;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.*;
          import android.service.wallpaper.WallpaperService;
          import android.view.*;
          import java.util.*;

          public class WP extends WallpaperService{
           public Engine onCreateEngine(){return new E();}
           static float S(double a){return (float)Math.sin(a);}
           static float cl(float v,float a,float b){return v<a?a:v>b?b:v;}
           static float sm(float a,float b,float k,float d){return a+(b-a)*(1-(float)Math.exp(-k*d));}
           static float ss(float v){v=cl(v,0,1);return v*v*(3-2*v);}
           static int mix(int a,int b,float t){t=cl(t,0,1);int r=0xff000000;for(int s=0;s<=16;s+=8){int x=(a>>s)&255,y=(b>>s)&255;r|=((int)(x+(y-x)*t))<<s;}return r;}
           static class B{int x,y,c0,c1,c2;float h,p;boolean w;}
           static class K{float x,y,r,a,p,vx,vy;int c;boolean lf;}
           static final int[] GR={0xff5da13a,0xff6bb344,0xff4f8f30,0xff79c24e,0xff5a9c38};
           static final int[][] TN={{0xff2f6a1a,0xff5fae2a,0xffa6e84f},{0xff3a7a20,0xff6fc032,0xffb9f06a},{0xff276016,0xff4f9c24,0xff8fd640}};
           static final int[][] FLC={{0xffffc93a,0xffffe58a},{0xffff9a2e,0xffffc27a},{0xffe8452c,0xffff8a6a},{0xfff4f1e6,0xffffd84a},{0xffe58ab5,0xfff7c0d8}};
           static final int HZ=0xffb4dcc8;

           class E extends Engine implements Runnable,SensorEventListener{
            Handler hd=new Handler(Looper.getMainLooper());SensorManager sm;Sensor ac;
            boolean on,ready,sv,drag;int W,H,gap=33,mw,mh;
            float P,tx,ty,ox=.5f,TX,TY,OX=.5f,DXt,DX,lx,wb,WN=1,wk,fa,X,Y,ro,Z;long w0,last;String err;
            Paint pn=new Paint(),pf=new Paint(),pp=new Paint(),pg=new Paint(),pv=new Paint(),pr=new Paint();Matrix m=new Matrix();
            Bitmap sky,c1,c2,hl,hb,mid,mb,fs,fb;Canvas mbC;Rect rs=new Rect(),rd=new Rect();int[] mu;
            ArrayList<B> bl=new ArrayList<B>(),fl=new ArrayList<B>();ArrayList<K> bk=new ArrayList<K>(),pt=new ArrayList<K>();Path rays=new Path();

            public void onCreate(SurfaceHolder s){super.onCreate(s);setTouchEventsEnabled(true);
             pf.setFilterBitmap(true);pn.setFilterBitmap(false);
             try{sm=(SensorManager)getSystemService(SENSOR_SERVICE);ac=sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);}catch(Throwable e){}}

            /* ---------- helpers ---------- */
            Bitmap bm(float wv,float hv){return Bitmap.createBitmap(Math.max(1,(int)Math.ceil(wv*W/100f/P)),Math.max(1,(int)Math.ceil(hv*H/100f/P)),Bitmap.Config.ARGB_8888);}
            void R(Canvas c,int col,int x,int y,int w,int h){pp.setStyle(Paint.Style.FILL);pp.setColor(col);c.drawRect(x,y,x+w,y+h,pp);}
            void disc(Canvas c,int col,int cx,int cy,int r){for(int dy=-r;dy<=r;dy++){int w=Math.round((float)Math.sqrt(r*r-dy*dy));R(c,col,cx-w,cy+dy,2*w+1,1);}}
            float wf(float x,float t){return WN*(.55f+.45f*S(t*.7+x*.05)+.25f*S(t*1.9+x*.13));}

            /* ---------- bake pixel art (sekali) ---------- */
            void bakeSky(){Canvas c=new Canvas(sky);int w=sky.getWidth(),h=sky.getHeight();
             for(int y=0;y<h;y++){float f=cl(y/(h*.6f),0,1);R(c,mix(0xff2c76dc,0xffc2e5ff,(float)Math.floor(f*9)/9f),0,y,w,1);}
             int sx=(int)(w*.7f),sy=(int)(h*.2f);for(int r=30;r>10;r-=3)R(c,0x12fff6c8,sx-r,sy-r,2*r,2*r);
             R(c,0xffffe98a,sx-7,sy-7,14,14);R(c,0xfffffbd0,sx-5,sy-5,10,10);R(c,0xffffffff,sx-3,sy-3,6,6);}
            void bakeCl(Bitmap b,long sd,int cnt,int hh,float y0,float y1,float lm){Canvas c=new Canvas(b);Random r=new Random(sd);int w=b.getWidth(),h=b.getHeight(),tile=w/2;
             for(int i=0;i<cnt;i++){int cx=r.nextInt(tile),cy=(int)(h*(y0+r.nextFloat()*(y1-y0))),L=(int)((16+r.nextInt(30))*lm),bb=(int)((r.nextFloat()*.4f+.5f)*L);
              for(int t=0;t<=tile;t+=tile){
               R(c,0xffffffff,cx+t+(int)(L*.2f),cy,(int)(L*.55f),hh);R(c,0xffffffff,cx+t+bb,cy+hh/2,(int)(L*.3f),hh);
               R(c,0xfff1f6fd,cx+t,cy+hh,L,hh);R(c,0xffd3e0f1,cx+t+(int)(L*.05f),cy+2*hh,(int)(L*.9f),hh);}}}
            void tree(Canvas c,int cx,int by,Random r){R(c,0xff5b3d22,cx,by-4,2,4);R(c,0xff2f7a2a,cx-3,by-8,8,3);R(c,0xff2f7a2a,cx-2,by-10,6,2);R(c,0xff3e9234,cx-2,by-9,3,1);
             for(int i=0;i<9;i++)R(c,r.nextFloat()<.5f?0xff4eae3c:0xff256a22,cx-3+r.nextInt(8),by-10+r.nextInt(5),1,1);}
            void bakeHills(){Canvas c=new Canvas(hl);int w=hl.getWidth(),h=hl.getHeight();Random r=new Random(9);int[] f2=new int[w];
             for(int i=0;i<w;i++){int y=(int)(h*.5f-(S(i*.06+1)*.5f+S(i*.15)*.3f+.8f)*h*.05f);R(c,0xffa3c4ea,i,y,1,h-y);R(c,0xffc4dcf4,i,y,1,1);}
             for(int i=0;i<w;i++){f2[i]=(int)(h*.575f-(S(i*.045+4)*.5f+S(i*.11)*.3f+.8f)*h*.022f);R(c,0xff5f9e55,i,f2[i],1,h-f2[i]);R(c,0xff78b862,i,f2[i],1,1);}
             for(int i=0;i<22;i++){int cx=r.nextInt(w);tree(c,cx,f2[cx]+1,r);}
             for(int k=0;k<4;k++)R(c,0x1ae8f5ff,0,(int)(h*.5f)+k*3,w,(int)(h*.14f));
             for(int i=0;i<w;i++){int y=(int)(h*.625f-(S(i*.07+2)*.5f+.5f)*h*.012f);
              for(int j=y;j<h;j++)R(c,GR[(((i/5)*7+(j/5)*13)%5+(r.nextFloat()<.15f?1:0))%5],i,j,1,1);R(c,0xff8fd45a,i,y,1,1);}
             for(int b=0;b<8;b++)R(c,0x0f0a280a,0,(int)(h*(.64f+b*.045f)),w,h);}
            void bakeFore(){Canvas c=new Canvas(fs);int w=fs.getWidth(),h=fs.getHeight();Random r=new Random(77);float vw=W/100f/P;
             int[][] PL={{0xff143c0e,0xff2f7a22,0xff7ecb3e},{0xff1a4a12,0xff3a8c28,0xffa4dc52},{0xff10340c,0xff27701c,0xff68b838}};
             for(int i=0;i<80;i++){float bx=r.nextFloat()*w,by=h*(.9f+r.nextFloat()*.1f),ht=h*(.05f+r.nextFloat()*r.nextFloat()*.2f);
              float ln=((bx-w/2f)/w*.5f+(r.nextFloat()-.5f)*.25f)*ht;int bw=Math.max(1,Math.round(vw*(1+r.nextFloat()*1.6f)));int[] C=PL[r.nextInt(3)];
              for(int k=0;k<ht;k++){float q=k/ht;int ww=Math.max(1,Math.round(bw*(1-q*.75f)));R(c,q<.4f?C[0]:q<.75f?C[1]:C[2],(int)(bx+ln*q*q),(int)(by-k),ww,1);}}
             int[][] FC={{0xffd93a2b,0xff2a1a10},{0xffffd23a,0xfffff08a},{0xfff4f4f4,0xffffcf33},{0xfff080b0,0xfffff0a0},{0xffd93a2b,0xff2a1a10},{0xffffd23a,0xfffff08a}};
             for(int i=0;i<6;i++){float fx=w*(.22f+r.nextFloat()*.56f),by=h*.97f,ht=h*(.14f+r.nextFloat()*.16f),ln=(r.nextFloat()-.5f)*ht*.3f;int rr=Math.max(2,Math.round(vw*(3+r.nextFloat()*2)));
              for(int k=0;k<ht;k++){float q=k/ht;R(c,0xff2a7a1f,(int)(fx+ln*q*q),(int)(by-k),Math.max(1,Math.round(vw*.9f)),1);}
              int hx=(int)(fx+ln),hy=(int)(by-ht);disc(c,FC[i][0],hx,hy,rr);disc(c,FC[i][1],hx,hy,Math.max(1,(int)(rr*.45f)));}
             for(int b=0;b<7;b++)R(c,0x1a061e08,0,(int)(h*(.72f+b*.04f)),w,h);}

            /* ---------- midground rumput (dinamis, angin per-blade) ---------- */
            void mkMid(){Random r=new Random(5);bl.clear();fl.clear();
             for(int i=0,n=(int)(mw*1.8f);i<n;i++){B b=new B();float y=mh*(.6f+.39f*(float)Math.pow(r.nextFloat(),1.25)),s=(y/mh-.6f)/.39f,mm=(1-s)*.5f;int[] T=TN[r.nextInt(3)];
              b.x=r.nextInt(mw);b.y=(int)y;b.h=(2+s*9)*(.7f+r.nextFloat()*.6f);b.p=r.nextFloat()*6.28f;b.c0=mix(T[0],HZ,mm);b.c1=mix(T[1],HZ,mm);b.c2=mix(T[2],HZ,mm);bl.add(b);}
             Comparator<B> cp=new Comparator<B>(){public int compare(B a,B b){return a.y-b.y;}};Collections.sort(bl,cp);
             for(int i=0,n=mw/5;i<n;i++){B b=new B();float y=mh*(.64f+.35f*(float)Math.pow(r.nextFloat(),1.2)),s=(y/mh-.6f)/.39f;int[] f=FLC[r.nextInt(5)];
              b.x=r.nextInt(mw);b.y=(int)y;b.h=(4+s*11)*(.8f+r.nextFloat()*.5f);b.p=r.nextFloat()*6.28f;b.c0=mix(f[0],HZ,(1-s)*.35f);b.c1=mix(f[1],HZ,(1-s)*.35f);b.w=f[0]==0xfff4f1e6;fl.add(b);}
             Collections.sort(fl,cp);}
            void px(int x,int y,int c){if(x>=0&&y>=0&&x<mw&&y<mh)mu[y*mw+x]=c;}
            void rc(int x,int y,int w,int h,int c){for(int j=0;j<h;j++)for(int i=0;i<w;i++)px(x+i,y+j,c);}
            void drawMid(float t){Arrays.fill(mu,0);int cs=mix(0xff3a7a20,HZ,0);
             for(B b:bl){float A=(1+b.h*.25f)*wf(b.x,t)+S(t*2.4+b.p)*.5f;for(int k=0,n=(int)b.h;k<n;k++){float f=k/b.h;px(b.x+(int)(A*f*f),b.y-k,f<.4f?b.c0:f<.75f?b.c1:b.c2);}}
             for(B f:fl){float A=(1+f.h*.22f)*wf(f.x,t)+S(t*2+f.p)*.5f;int n=(int)f.h;for(int k=0;k<n;k++){float q=(float)k/n;px(f.x+(int)(A*q*q),f.y-k,cs);}
              int X=f.x+(int)A,Y=f.y-n;rc(X-1,Y-2,3,1,f.c0);rc(X-2,Y-1,5,3,f.c0);rc(X-1,Y+2,3,1,f.c0);rc(X,Y-1,1,2,f.c1);if(f.w)px(X,Y,0xffffd84a);}
             mid.setPixels(mu,0,mw,0,0,mw,mh);}

            /* ---------- bokeh & debu ---------- */
            void mkBok(){Random r=new Random(21);bk.clear();pt.clear();
             for(int i=0;i<22;i++){K k=new K();k.x=r.nextFloat()*W;k.y=r.nextFloat()*H;k.r=W*(.012f+.03f*r.nextFloat());k.a=.1f+r.nextFloat()*.22f;k.p=r.nextFloat()*6.28f;k.vx=4+r.nextFloat()*10;k.vy=-(2+r.nextFloat()*6);k.c=r.nextInt(3);bk.add(k);}
             for(int i=0;i<46;i++){K k=new K();k.x=r.nextFloat()*W;k.y=r.nextFloat()*H;k.vx=(2+r.nextFloat()*5)*P;k.vy=(-1+r.nextFloat()*2)*P;k.p=r.nextFloat()*6.28f;k.lf=i%6==0;
              k.c=k.lf?new int[]{0xff7dc83c,0xffa6e84f,0xfff7c0d8}[i%3]:new int[]{0xfffff3c4,0xffffe08a,0xffffffff}[i%3];pt.add(k);}}
            void drawBok(Canvas c,float t,float dt,float k){int[] col={0xfffff6d2,0xffffe196,0xffcdecff};float ox=X*1.4f*W/100f,oy=Y*1.4f*H/100f;
             for(K b:bk){b.x+=(b.vx+wf(b.x*.1f,t)*b.vx*.6f)*dt;b.y+=b.vy*dt;if(b.x>W+b.r*5)b.x=-b.r*5;if(b.y<-b.r*5)b.y=H+b.r*5;
              float r=b.r*(1+3.2f*k),a=Math.min(1f,b.a*(.6f+.4f*S(t*.7+b.p))*(1+.9f*k));
              pp.setColor(col[b.c]);pp.setStyle(Paint.Style.FILL);pp.setAlpha((int)(a*160));c.drawCircle(b.x+ox,b.y+oy,r,pp);
              pp.setStyle(Paint.Style.STROKE);pp.setStrokeWidth(Math.max(1f,r*.12f));pp.setAlpha((int)(a*255));c.drawCircle(b.x+ox,b.y+oy,r,pp);}
             pp.setStyle(Paint.Style.FILL);float px=X*1.2f*W/100f,py=Y*1.2f*H/100f;
             for(K p:pt){p.x+=p.vx*(.5f+wf(p.x*.1f,t)*.6f)*dt;p.y+=(p.vy+(S(t*1.5+p.p)*1.5f+(p.lf?3:0))*P)*dt;
              if(p.x>W+P*2)p.x=-P*2;if(p.y<-P*2)p.y=H;if(p.y>H+P*2)p.y=-P*2;
              pp.setColor(p.c);pp.setAlpha(p.lf?255:(int)((.45f+.45f*S(t*3+p.p))*255));float s=p.lf?P*2:P;float xx=(float)Math.floor((p.x+px)/P)*P,yy=(float)Math.floor((p.y+py)/P)*P;c.drawRect(xx,yy,xx+s,yy+s,pp);}}

            /* ---------- layer draw: parallax + zoom + warp FOV + roll + sway ---------- */
            void dl(Canvas c,Bitmap b,int d,float F,float kz,float kw,float xv,float yv,boolean bot,boolean smooth,float al,float ddx,float sk){
             float s=P*d*(1+(Z-1)*kz+wk*kw),bw=b.getWidth()*P*d,bh=b.getHeight()*P*d,sw=b.getWidth()*s,sh=b.getHeight()*s;
             float x0=xv*W/100f+(bw-sw)/2f+X*F*W/100f-ddx,y0=bot?H*1.15f-sh+Y*F*H/100f:yv*H/100f+(bh-sh)/2f+Y*F*H/100f;
             m.setScale(s,s);m.postTranslate(x0,y0);if(sk!=0)m.postSkew(sk,0,W/2f,H*1.15f);
             if(F>0){float rr=ro*Math.min(F,1f);if(rr!=0)m.postRotate(rr,W/2f,H/2f);}
             Paint p=smooth?pf:pn;p.setAlpha((int)(cl(al,0,1)*255));c.drawBitmap(b,m,p);}

            void render(Canvas c){
             long now=SystemClock.uptimeMillis();float t=now/1000f,dt=cl((now-last)/1000f,.001f,.1f);last=now;
             TX=sm(TX,tx,5,dt);TY=sm(TY,ty,5,dt);OX=sm(OX,ox,3,dt);DX=sm(DX,drag?DXt:0,drag?9:.6f,dt);wb*=(float)Math.exp(-dt*1.1f);WN=sm(WN,1+wb,3,dt);
             float wp=cl((now-w0)/4200f,0,1);wk=(float)Math.pow(1-wp,3);fa=ss((wp-.08f)/.62f);
             X=S(t*.11)*5+S(t*.047+1)*2+TX*3.2f-(OX-.5f)*12+DX+wk*wk*3.5f+S(t*3.1+S(t*.7)*2)*.05f;
             Y=S(t*.07)*1.1f+TY*1.4f-wk*wk*4+S(t*2.3+1)*.04f;
             ro=S(t*.13)*.22f+TX*.5f+wk*1.2f+S(t*1.7)*.04f;Z=1.04f+.03f*S(t*.045)+wb*.01f;
             gap=(wp<1||drag||wb>.25f)?16:33;
             drawMid(t);
             if(fa<.995f){pf.setAlpha(255);mbC.drawColor(0,PorterDuff.Mode.CLEAR);rs.set(0,0,mw,mh);rd.set(0,0,mb.getWidth(),mb.getHeight());mbC.drawBitmap(mid,rs,rd,pf);}
             c.drawColor(0xff6fb2f0);
             dl(c,sky,1,.04f,.2f,-.04f,-10,-5,false,false,1,0,0);
             dl(c,c1,1,.1f,.3f,-.05f,-15,-5,false,false,1,(t*.9f%130)*W/100f,0);
             dl(c,c2,1,.2f,.5f,-.07f,-15,-5,false,false,1,(t*1.8f%130)*W/100f,0);
             dl(c,hl,1,.35f,.7f,-.02f,-15,-7.5f,false,false,1,0,0);
             if(fa<.995f)dl(c,hb,3,.35f,.7f,-.02f,-15,-7.5f,false,true,1-fa,0,0);
             dl(c,mid,1,1,1,.14f,-20,-10,false,false,1,0,0);
             if(fa<.995f)dl(c,mb,4,1,1,.14f,-20,-10,false,true,1-fa,0,0);
             c.save();c.translate(X*.12f*W/100f+S(t*.08)*W*.03f,Y*.12f*H/100f);pr.setAlpha((int)((.07f+.03f*S(t*.3))*255));c.drawPath(rays,pr);c.restore();
             float sk=S(t*.9+X*.1)*.0157f*WN;
             if(fa<.995f)dl(c,fb,3,2.2f,2.6f,.5f,-35,-15,true,true,1-fa,0,sk);
             if(fa>.005f)dl(c,fs,1,2.2f,2.6f,.5f,-35,-15,true,false,fa,0,sk);
             drawBok(c,t,dt,1-fa);
             c.drawRect(0,0,W,H,pg);c.drawRect(0,0,W,H,pv);}

            /* ---------- lifecycle ---------- */
            void build(){ready=false;err=null;
             sky=bm(120,110);c1=bm(260,70);c2=bm(260,80);hl=bm(130,115);mid=bm(140,120);fs=bm(170,130);
             bakeSky();bakeCl(c1,3,9,2,.12f,.6f,1f);bakeCl(c2,8,5,3,.15f,.7f,1.5f);bakeHills();bakeFore();
             hb=Bitmap.createScaledBitmap(hl,Math.max(1,hl.getWidth()/3),Math.max(1,hl.getHeight()/3),true);
             fb=Bitmap.createScaledBitmap(fs,Math.max(1,fs.getWidth()/3),Math.max(1,fs.getHeight()/3),true);
             mw=mid.getWidth();mh=mid.getHeight();mu=new int[mw*mh];mb=Bitmap.createBitmap(Math.max(1,mw/4),Math.max(1,mh/4),Bitmap.Config.ARGB_8888);mbC=new Canvas(mb);
             mkMid();mkBok();
             rays.reset();float sx=W*.74f,sy=H*.17f,L=H*1.8f;for(int k=0;k<6;k++){float a=2.09f-.7f+k*.28f,w=.035f;
              rays.moveTo(sx,sy);rays.lineTo(sx+L*(float)Math.cos(a-w),sy+L*(float)Math.sin(a-w));rays.lineTo(sx+L*(float)Math.cos(a+w),sy+L*(float)Math.sin(a+w));rays.close();}
             pr.setColor(0xffffe9b0);
             pg.setShader(new LinearGradient(0,0,W,H,new int[]{0x20ffc878,0x00ffffff,0x1a1464be},new float[]{0,.45f,1},Shader.TileMode.CLAMP));
             pv.setShader(new RadialGradient(W/2f,H*.45f,H*.75f,new int[]{0,0,0x59051941},new float[]{0,.62f,1},Shader.TileMode.CLAMP));
