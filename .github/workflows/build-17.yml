name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KS_PASS || 'infinitepath' }}
      KS_ALIAS: ${{ secrets.KS_ALIAS || 'key' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate native Android project (heredoc)
        run: |
          set -e
          P=android/app/src/main
          mkdir -p $P/java/com/infinitepath/app $P/res/xml $P/res/values $P/res/drawable $P/res/mipmap-anydpi android/app

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "InfinitePath"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          val verCode = (project.findProperty("verCode") as String?)?.toIntOrNull() ?: 1
          val ghRepo = (project.findProperty("ghRepo") as String?) ?: "owner/repo"
          android {
              namespace = "com.infinitepath.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.infinitepath.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = verCode
                  versionName = "1.0.$verCode"
                  buildConfigField("String", "GH_REPO", "\"$ghRepo\"")
              }
              buildFeatures { buildConfig = true }
              signingConfigs {
                  create("rel") {
                      storeFile = file(System.getenv("KS_FILE") ?: "../../ci.jks")
                      storePassword = System.getenv("KS_PASS") ?: "infinitepath"
                      keyAlias = System.getenv("KS_ALIAS") ?: "key"
                      keyPassword = System.getenv("KS_PASS") ?: "infinitepath"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("rel")
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:label="Infinite Path"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fp"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > $P/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="dl" path="Download/" />
          </paths>
          EOF

          cat > $P/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat > $P/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#1B2A49</color>
          </resources>
          EOF

          cat > $P/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFD54A"
                  android:pathData="M54,30m-10,0a10,10 0,1 1,20 0a10,10 0,1 1,-20 0" />
              <path android:fillColor="#2E9E72"
                  android:pathData="M22,78L44,46L58,64L68,52L86,78Z" />
          </vector>
          EOF

          cat > $P/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > $P/java/com/infinitepath/app/World.kt <<'EOF'
          package com.infinitepath.app

          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sqrt

          class TreeInfo(val kind: Int, val h: Int, val th: Int)

          class MeshData(val cx: Int, val cz: Int, val gen: Int, val v: FloatBuffer, val n: Int, val w: FloatBuffer?, val wn: Int)

          class BakeCfg(val spp: Int, val bounce: Int, val sun: Float, val sky: Float, val sunAz: Float, val sunEl: Float)

          private val ALBD: Array<FloatArray> = arrayOf(
              floatArrayOf(0f, 0f, 0f), floatArrayOf(.24f, .50f, .15f), floatArrayOf(.76f, .70f, .50f), floatArrayOf(.45f, .43f, .40f),
              floatArrayOf(.92f, .94f, .96f), floatArrayOf(.40f, .30f, .20f), floatArrayOf(.36f, .25f, .14f), floatArrayOf(.14f, .42f, .11f)
          ).map { c -> floatArrayOf(Math.pow(c[0].toDouble(), 2.2).toFloat(), Math.pow(c[1].toDouble(), 2.2).toFloat(), Math.pow(c[2].toDouble(), 2.2).toFloat()) }.toTypedArray()

          private val HT: Array<FloatArray> = intArrayOf(2, 3, 5, 7).map { b ->
              FloatArray(64) { i -> var f = 1f; var r = 0f; var k = i + 1; while (k > 0) { f /= b; r += f * (k % b); k /= b }; r }
          }.toTypedArray()

          private class Grid(val x0: Int, val z0: Int, val gx: Int, val gh: Int) {
              val d = ByteArray(gx * gx * gh)
          }

          private class Tracer(val g: Grid) {
              var hx = 0f; var hy = 0f; var hz = 0f; var nx = 0f; var ny = 0f; var nz = 0f
              fun tr(ox: Float, oy: Float, oz: Float, dx: Float, dy: Float, dz: Float): Int {
                  var x = floor(ox).toInt(); var y = floor(oy).toInt(); var z = floor(oz).toInt()
                  val sx = if (dx > 0f) 1 else -1; val sy = if (dy > 0f) 1 else -1; val sz = if (dz > 0f) 1 else -1
                  val ax = if (dx != 0f) abs(1f / dx) else 1e30f; val ay = if (dy != 0f) abs(1f / dy) else 1e30f; val az = if (dz != 0f) abs(1f / dz) else 1e30f
                  var mx = if (dx != 0f) (if (dx > 0f) x + 1 - ox else ox - x) * ax else 1e30f
                  var my = if (dy != 0f) (if (dy > 0f) y + 1 - oy else oy - y) * ay else 1e30f
                  var mz = if (dz != 0f) (if (dz > 0f) z + 1 - oz else oz - z) * az else 1e30f
                  var t = 0f
                  for (i in 0 until 150) {
                      if (mx < my && mx < mz) { x += sx; t = mx; mx += ax; nx = -sx.toFloat(); ny = 0f; nz = 0f }
                      else if (my < mz) { y += sy; t = my; my += ay; nx = 0f; ny = -sy.toFloat(); nz = 0f }
                      else { z += sz; t = mz; mz += az; nx = 0f; ny = 0f; nz = -sz.toFloat() }
                      if (y < 0 || y >= g.gh || x < 0 || x >= g.gx || z < 0 || z >= g.gx) return 0
                      val id = g.d[x + g.gx * (z + g.gx * y)].toInt()
                      if (id != 0) { hx = ox + dx * t; hy = oy + dy * t; hz = oz + dz * t; return id }
                  }
                  return 0
              }
          }

          private class Baker(val tr: Tracer, val cfg: BakeCfg) {
              var ar = 0f; var ag = 0f; var ab = 0f
              val s0 = (cos(cfg.sunEl) * sin(cfg.sunAz)); val s1 = sin(cfg.sunEl); val s2 = (cos(cfg.sunEl) * cos(cfg.sunAz))
              val sc0 = 1.3f * cfg.sun; val sc1 = 1.1f * cfg.sun; val sc2 = .85f * cfg.sun
              val pa = FloatArray(3); val pb = FloatArray(3)
              private var seed = 1234567
              init {
                  var ux = 0f; var uy = 1f; var uz = 0f
                  if (abs(s1) > .9f) { ux = 1f; uy = 0f }
                  var a0 = uy * s2 - uz * s1; var a1 = uz * s0 - ux * s2; var a2 = ux * s1 - uy * s0
                  val l = sqrt(a0 * a0 + a1 * a1 + a2 * a2); a0 /= l; a1 /= l; a2 /= l
                  pa[0] = a0; pa[1] = a1; pa[2] = a2
                  pb[0] = s1 * a2 - s2 * a1; pb[1] = s2 * a0 - s0 * a2; pb[2] = s0 * a1 - s1 * a0
              }
              fun rnd(): Float { seed = seed xor (seed shl 13); seed = seed xor (seed ushr 17); seed = seed xor (seed shl 5); return (seed and 0xFFFFFF) / 16777216f }
              private fun hs(x: Float, y: Float, z: Float): Float { val v = sin(x * 127.1f + y * 311.7f + z * 74.7f) * 43758.547f; return v - floor(v) }

              private fun sunTest(px: Float, py: Float, pz: Float, a: Float, b: Float, c: Float, r: Float, g: Float, bl: Float, ua: Float, ub: Float) {
                  var lx = s0 + pa[0] * ua + pb[0] * ub; var ly = s1 + pa[1] * ua + pb[1] * ub; var lz = s2 + pa[2] * ua + pb[2] * ub
                  val l = sqrt(lx * lx + ly * ly + lz * lz); lx /= l; ly /= l; lz /= l
                  val d = a * lx + b * ly + c * lz
                  if (d <= 0f) return
                  if (tr.tr(px, py, pz, lx, ly, lz) == 0) { ar += r * sc0 * d; ag += g * sc1 * d; ab += bl * sc2 * d }
              }

              /** cahaya (HDR) untuk satu permukaan; out[0..2] */
              fun quad(px: Float, py: Float, pz: Float, n0: Float, n1: Float, n2: Float, out: FloatArray) {
                  var ux = 1f; var uy = 0f; var uz = 0f
                  if (abs(n0) > .9f) { ux = 0f; uy = 1f }
                  var t0 = uy * n2 - uz * n1; var t1 = uz * n0 - ux * n2; var t2 = ux * n1 - uy * n0
                  val tl = sqrt(t0 * t0 + t1 * t1 + t2 * t2); t0 /= tl; t1 /= tl; t2 /= tl
                  var w0 = n1 * t2 - n2 * t1; var w1 = n2 * t0 - n0 * t2; var w2 = n0 * t1 - n1 * t0
                  val k0 = hs(px * 1.7f + 3.1f, pz * 2.3f + 5.7f, py * .9f + 1.3f); val k1 = hs(px * 2.9f + 7.7f, pz * 1.1f + 2.1f, py * 1.7f + 8.8f)
                  val k2 = hs(px * 3.3f + 1.9f, pz * 2.7f + 4.4f, py * .7f + 6.1f); val k3 = hs(px * 1.3f + 9.1f, pz * 3.7f + .3f, py * 2.1f + 3.3f)
                  var sr = 0f; var sg = 0f; var sb = 0f
                  val ox0 = px + n0 * .02f; val oy0 = py + n1 * .02f; val oz0 = pz + n2 * .02f
                  for (s in 0 until cfg.spp) {
                      ar = 0f; ag = 0f; ab = 0f
                      val q = s and 63
                      var a1 = HT[2][q] + k2; a1 -= floor(a1); var a2 = HT[3][q] + k3; a2 -= floor(a2)
                      val rd = sqrt(a1) * .045f; val an = a2 * 6.2832f
                      sunTest(ox0, oy0, oz0, n0, n1, n2, 1f, 1f, 1f, cos(an) * rd, sin(an) * rd)
                      var ox = ox0; var oy = oy0; var oz = oz0; var m0 = n0; var m1 = n1; var m2 = n2
                      var r = 1f; var g = 1f; var bl = 1f
                      var tt0 = t0; var tt1 = t1; var tt2 = t2; var ww0 = w0; var ww1 = w1; var ww2 = w2
                      for (k in 0 until cfg.bounce) {
                          val r1: Float; val r2: Float
                          if (k == 0) { var u1 = HT[0][q] + k0; u1 -= floor(u1); var u2 = HT[1][q] + k1; u2 -= floor(u2); r1 = u1; r2 = u2 }
                          else {
                              r1 = rnd(); r2 = rnd()
                              var ux2 = 1f; var uy2 = 0f; var uz2 = 0f
                              if (abs(m0) > .9f) { ux2 = 0f; uy2 = 1f }
                              tt0 = uy2 * m2 - uz2 * m1; tt1 = uz2 * m0 - ux2 * m2; tt2 = ux2 * m1 - uy2 * m0
                              val l = sqrt(tt0 * tt0 + tt1 * tt1 + tt2 * tt2); tt0 /= l; tt1 /= l; tt2 /= l
                              ww0 = m1 * tt2 - m2 * tt1; ww1 = m2 * tt0 - m0 * tt2; ww2 = m0 * tt1 - m1 * tt0
                          }
                          val ph = 6.2832f * r1; val rr = sqrt(r2); val aa = rr * cos(ph); val bb = rr * sin(ph); val cc = sqrt(1f - r2)
                          val d0 = aa * tt0 + bb * ww0 + cc * m0; val d1 = aa * tt1 + bb * ww1 + cc * m1; val d2 = aa * tt2 + bb * ww2 + cc * m2
                          val id = tr.tr(ox, oy, oz, d0, d1, d2)
                          if (id == 0) {
                              val q2 = sqrt(max(d1, 0f))
                              ar += r * (.8f - .55f * q2) * cfg.sky; ag += g * (.86f - .4f * q2) * cfg.sky; ab += bl * (.97f - .07f * q2) * cfg.sky
                              break
                          }
                          val al = ALBD[id]; r *= al[0]; g *= al[1]; bl *= al[2]
                          m0 = tr.nx; m1 = tr.ny; m2 = tr.nz
                          ox = tr.hx + tr.nx * .002f; oy = tr.hy + tr.ny * .002f; oz = tr.hz + tr.nz * .002f
                          sunTest(ox, oy, oz, tr.nx, tr.ny, tr.nz, r, g, bl, (rnd() - .5f) * .08f, (rnd() - .5f) * .08f)
                      }
                      sr += ar; sg += ag; sb += ab
                  }
                  val inv = 1f / max(1, cfg.spp)
                  out[0] = min(sr * inv, 8f); out[1] = min(sg * inv, 8f); out[2] = min(sb * inv, 8f)
              }
          }

          private class FB {
              var a = FloatArray(1 shl 15)
              var n = 0
              var qs = IntArray(1024)
              var qm = FloatArray(1024 * 9)
              var nq = 0
              fun add(x: Float, y: Float, z: Float, r: Float, g: Float, b: Float) {
                  if (n + 6 > a.size) a = a.copyOf(a.size * 2)
                  a[n] = x; a[n + 1] = y; a[n + 2] = z; a[n + 3] = r; a[n + 4] = g; a[n + 5] = b
                  n += 6
              }

              /** quad dengan normal eksplisit; warna = albedo (ruang tampilan), dikonversi ke linear dan dikali cahaya hasil bake */
              fun quad(
                  x0: Float, y0: Float, z0: Float, x1: Float, y1: Float, z1: Float,
                  x2: Float, y2: Float, z2: Float, x3: Float, y3: Float, z3: Float,
                  r: Float, g: Float, b: Float, nx: Float, ny: Float, nz: Float
              ) {
                  if (nq + 1 > qs.size) { qs = qs.copyOf(qs.size * 2); qm = qm.copyOf(qm.size * 2) }
                  qs[nq] = n
                  val o = nq * 9
                  qm[o] = (x0 + x2) * .5f; qm[o + 1] = (y0 + y2) * .5f; qm[o + 2] = (z0 + z2) * .5f
                  qm[o + 3] = nx; qm[o + 4] = ny; qm[o + 5] = nz
                  qm[o + 6] = Math.pow(r.coerceIn(0f, 1f).toDouble(), 2.2).toFloat(); qm[o + 7] = Math.pow(g.coerceIn(0f, 1f).toDouble(), 2.2).toFloat(); qm[o + 8] = Math.pow(b.coerceIn(0f, 1f).toDouble(), 2.2).toFloat()
                  nq++
                  add(x0, y0, z0, r, g, b); add(x1, y1, z1, r, g, b); add(x2, y2, z2, r, g, b)
                  add(x0, y0, z0, r, g, b); add(x2, y2, z2, r, g, b); add(x3, y3, z3, r, g, b)
              }

              fun rawQuad(
                  x0: Float, y0: Float, z0: Float, x1: Float, y1: Float, z1: Float,
                  x2: Float, y2: Float, z2: Float, x3: Float, y3: Float, z3: Float, r: Float, g: Float, b: Float
              ) {
                  add(x0, y0, z0, r, g, b); add(x1, y1, z1, r, g, b); add(x2, y2, z2, r, g, b)
                  add(x0, y0, z0, r, g, b); add(x2, y2, z2, r, g, b); add(x3, y3, z3, r, g, b)
              }

              fun box(x0: Float, y0: Float, z0: Float, x1: Float, y1: Float, z1: Float, r: Float, g: Float, b: Float) {
                  quad(x0, y1, z0, x1, y1, z0, x1, y1, z1, x0, y1, z1, r, g, b, 0f, 1f, 0f)
                  quad(x0, y0, z0, x1, y0, z0, x1, y1, z0, x0, y1, z0, r, g, b, 0f, 0f, -1f)
                  quad(x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1, r, g, b, 0f, 0f, 1f)
                  quad(x0, y0, z0, x0, y0, z1, x0, y1, z1, x0, y1, z0, r, g, b, -1f, 0f, 0f)
                  quad(x1, y0, z0, x1, y0, z1, x1, y1, z1, x1, y1, z0, r, g, b, 1f, 0f, 0f)
              }

              fun buf(): FloatBuffer {
                  val bb = ByteBuffer.allocateDirect(n * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                  bb.put(a, 0, n); bb.flip()
                  return bb
              }
          }

          class World(var seed: Int = 1) {
              val sea = 14
              val CS = 16
              private val none = TreeInfo(0, 0, 0)
              private val tc = ConcurrentHashMap<Long, TreeInfo>()
              @Volatile var treeMul = 1f
              fun clearCaches() { tc.clear() }

              private fun hash(x: Int, z: Int, s: Int): Int {
                  var n = x * 374761393 + z * 668265263 + s * 1274126177 + seed * 362437
                  n = (n xor (n ushr 13)) * 1274126177
                  return n xor (n ushr 16)
              }

              private fun hf(x: Int, z: Int, s: Int): Float = (hash(x, z, s) and 0xFFFFFF) / 16777215f

              private fun vn(x: Float, z: Float, s: Int): Float {
                  val xi = floor(x).toInt(); val zi = floor(z).toInt()
                  val fx = x - xi; val fz = z - zi
                  val u = fx * fx * (3f - 2f * fx); val v = fz * fz * (3f - 2f * fz)
                  val a = hf(xi, zi, s); val b = hf(xi + 1, zi, s); val c = hf(xi, zi + 1, s); val d = hf(xi + 1, zi + 1, s)
                  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v
              }

              private fun fbm(x: Float, z: Float, o: Int, s: Int): Float {
                  var a = 0f; var amp = .5f; var f = 1f; var t = 0f
                  for (i in 0 until o) { a += vn(x * f, z * f, s + i) * amp; t += amp; amp *= .5f; f *= 2f }
                  return a / t
              }

              fun height(x: Int, z: Int): Int {
                  val n = fbm(x * .011f, z * .011f, 5, 1)
                  val r = 1f - abs(fbm(x * .02f + 50f, z * .02f, 3, 9) * 2f - 1f)
                  val m = fbm(x * .004f, z * .004f, 2, 20)
                  val e = (n * .7f + r * r * .5f * m).coerceIn(0f, 1.2f)
                  return (2f + e.pow(1.5f) * 48f).toInt()
              }

              fun hg(x: Float, z: Float): Float = height(floor(x).toInt(), floor(z).toInt()) + 1f

              fun tree(x: Int, z: Int): TreeInfo? {
                  val k = (x.toLong() shl 32) xor (z.toLong() and 0xffffffffL)
                  val c = tc[k]
                  if (c != null) return if (c === none) null else c
                  val h = height(x, z)
                  var t: TreeInfo? = null
                  if (h > sea + 1 && h < 38) {
                      val dens = (if (fbm(x * .03f, z * .03f, 2, 5) > .5f) .05f else .008f) * treeMul
                      if (hf(x, z, 77) < dens) t = TreeInfo(1, h, 4 + (hf(x, z, 78) * 4).toInt())
                      else if (hf(x, z, 79) < .012f * treeMul) t = TreeInfo(2, h, 0)
                  }
                  if (tc.size > 300000) tc.clear()
                  tc[k] = t ?: none
                  return t
              }

              /** jarak bebas ke permukaan terdekat (di luar radius r); o = arah dorong keluar */
              fun clr(x: Float, y: Float, z: Float, r: Float, o: FloatArray): Float {
                  var top = -1e9f
                  val x0 = floor(x - r * .5f).toInt(); val x1 = floor(x + r * .5f).toInt()
                  val z0 = floor(z - r * .5f).toInt(); val z1 = floor(z + r * .5f).toInt()
                  for (a in x0..x1) for (b in z0..z1) top = max(top, height(a, b) + 1f)
                  top = max(top, sea + 1f)
                  var best = y - top - r
                  o[0] = 0f; o[1] = 1f; o[2] = 0f
                  if (y > 37f + r) return best
                  val ax = floor(x - 6.7f).toInt(); val bx = floor(x + 6.7f).toInt()
                  val az = floor(z - 6.7f).toInt(); val bz = floor(z + 6.7f).toInt()
                  for (tx in ax..bx) for (tz in az..bz) {
                      val t = tree(tx, tz) ?: continue
                      val dx = x - (tx + .5f); val dz = z - (tz + .5f)
                      if (t.kind == 1) {
                          var dy = y - (t.h + t.th + .9f)
                          var l = sqrt(dx * dx + dy * dy + dz * dz)
                          var d = l - 4.3f - r
                          if (d < best) { best = d; if (l < 1e-4f) l = 1f; o[0] = dx / l; o[1] = dy / l; o[2] = dz / l }
                          val qy = min(t.h + t.th + 1f, max(t.h + 1f, y))
                          dy = y - qy
                          l = sqrt(dx * dx + dy * dy + dz * dz)
                          d = l - .9f - r
                          if (d < best) { best = d; if (l < 1e-4f) l = 1f; o[0] = dx / l; o[1] = dy / l; o[2] = dz / l }
                      } else {
                          val dy = y - (t.h + 1f)
                          var l = sqrt(dx * dx + dy * dy + dz * dz)
                          val d = l - 2f - r
                          if (d < best) { best = d; if (l < 1e-4f) l = 1f; o[0] = dx / l; o[1] = dy / l; o[2] = dz / l }
                      }
                  }
                  return best
              }

              private fun topColor(h: Int, x: Int, z: Int, c: FloatArray) {
                  val j = hf(x, z, 5) * .08f
                  when {
                      h <= sea + 1 -> { c[0] = .76f; c[1] = .70f; c[2] = .50f }
                      h > 42 -> { c[0] = .92f; c[1] = .94f; c[2] = .96f }
                      h > 30 -> { c[0] = .45f; c[1] = .43f; c[2] = .40f }
                      else -> { val t = (h - sea) / 18f; c[0] = .20f + .10f * t; c[1] = .46f + .08f * t; c[2] = .12f + .06f * t }
                  }
                  c[0] += j; c[1] += j; c[2] += j
              }

              /** jarak ray ke permukaan (tanah/laut) untuk fokus otomatis */
              fun rayDist(ox: Float, oy: Float, oz: Float, dx: Float, dy: Float, dz: Float, maxD: Float): Float {
                  var t = 1f
                  while (t < maxD) {
                      val x = ox + dx * t; val y = oy + dy * t; val z = oz + dz * t
                      if (y < max(hg(x, z), sea + 1f)) return t
                      t += max(1f, t * .04f)
                  }
                  return maxD
              }

              private inline fun treeBoxes(x: Int, z: Int, t: TreeInfo, cb: (Float, Float, Float, Float, Float, Float, Float, Float, Float, Int) -> Unit) {
                  val xf = x.toFloat(); val zf = z.toFloat(); val yb = t.h + 1f
                  val j = hf(x, z, 6) * .12f
                  if (t.kind == 1) {
                      cb(xf + .15f, yb, zf + .15f, xf + .85f, yb + t.th, zf + .85f, .36f, .25f, .14f, 6)
                      val cy = yb + t.th
                      cb(xf - 1.5f, cy - 2f, zf - 1.5f, xf + 2.5f, cy, zf + 2.5f, .12f + j, .38f + j, .10f, 7)
                      cb(xf - 2.5f, cy - 1f, zf - 2.5f, xf + 3.5f, cy + 1f, zf + 3.5f, .14f + j, .42f + j, .11f, 7)
                      cb(xf - 1.5f, cy + 1f, zf - 1.5f, xf + 2.5f, cy + 3f, zf + 2.5f, .16f + j, .46f + j, .12f, 7)
                      cb(xf, cy + 3f, zf, xf + 1f, cy + 4f, zf + 1f, .18f + j, .5f + j, .13f, 7)
                  } else {
                      cb(xf - .6f, yb, zf - .6f, xf + 1.6f, yb + 1.6f, zf + 1.6f, .15f + j, .40f + j, .10f, 7)
                  }
              }

              private fun topId(h: Int): Int = if (h <= sea + 1) 2 else if (h > 42) 4 else if (h > 30) 3 else 1

              private fun fillGrid(g: Grid) {
                  for (lx in 0 until g.gx) for (lz in 0 until g.gx) {
                      val h = height(g.x0 + lx, g.z0 + lz)
                      val ti = topId(h).toByte(); val bi: Byte = if (h > 30) 3 else 5
                      val top = min(h, g.gh - 1)
                      for (y in 0..top) g.d[lx + g.gx * (lz + g.gx * y)] = if (y == h) ti else bi
                  }
                  for (wx in g.x0 - 4 until g.x0 + g.gx + 4) for (wz in g.z0 - 4 until g.z0 + g.gx + 4) {
                      val t = tree(wx, wz) ?: continue
                      treeBoxes(wx, wz, t) { x0, y0, z0, x1, y1, z1, _, _, _, id ->
                          val ix0 = max(0, floor(x0).toInt() - g.x0); val ix1 = min(g.gx - 1, ceil(x1).toInt() - 1 - g.x0)
                          val iz0 = max(0, floor(z0).toInt() - g.z0); val iz1 = min(g.gx - 1, ceil(z1).toInt() - 1 - g.z0)
                          val iy0 = max(0, floor(y0).toInt()); val iy1 = min(g.gh - 1, ceil(y1).toInt() - 1)
                          for (iy in iy0..iy1) for (iz in iz0..iz1) for (ix in ix0..ix1) g.d[ix + g.gx * (iz + g.gx * iy)] = id.toByte()
                      }
                  }
              }

              fun build(cx: Int, cz: Int, gen: Int, cfg: BakeCfg): MeshData {
                  val fb = FB()
                  val c = FloatArray(3)
                  val x0 = cx * CS; val z0 = cz * CS
                  var anyWater = false
                  for (lx in 0 until CS) for (lz in 0 until CS) {
                      val x = x0 + lx; val z = z0 + lz
                      val h = height(x, z)
                      if (h <= sea) anyWater = true
                      topColor(h, x, z, c)
                      if (h < sea) { c[0] *= .55f; c[1] *= .65f; c[2] *= .7f }
                      val y = h + 1f
                      val xf = x.toFloat(); val zf = z.toFloat()
                      fb.quad(xf, y, zf, xf + 1, y, zf, xf + 1, y, zf + 1, xf, y, zf + 1, c[0], c[1], c[2], 0f, 1f, 0f)
                      val sr = if (h > 30) .40f else .38f; val sg = if (h > 30) .38f else .28f; val sb = if (h > 30) .36f else .18f
                      val nh0 = height(x, z - 1); val nh1 = height(x, z + 1); val nh2 = height(x - 1, z); val nh3 = height(x + 1, z)
                      if (nh0 < h) { val yb = nh0 + 1f; fb.quad(xf, yb, zf, xf + 1, yb, zf, xf + 1, y, zf, xf, y, zf, sr, sg, sb, 0f, 0f, -1f) }
                      if (nh1 < h) { val yb = nh1 + 1f; fb.quad(xf, yb, zf + 1, xf + 1, yb, zf + 1, xf + 1, y, zf + 1, xf, y, zf + 1, sr, sg, sb, 0f, 0f, 1f) }
                      if (nh2 < h) { val yb = nh2 + 1f; fb.quad(xf, yb, zf, xf, yb, zf + 1, xf, y, zf + 1, xf, y, zf, sr, sg, sb, -1f, 0f, 0f) }
                      if (nh3 < h) { val yb = nh3 + 1f; fb.quad(xf + 1, yb, zf, xf + 1, yb, zf + 1, xf + 1, y, zf + 1, xf + 1, y, zf, sr, sg, sb, 1f, 0f, 0f) }
                  }
                  for (x in x0 until x0 + CS) for (z in z0 until z0 + CS) {
                      val t = tree(x, z) ?: continue
                      treeBoxes(x, z, t) { a, b, cc, d, e, f, r, g, bl, _ -> fb.box(a, b, cc, d, e, f, r, g, bl) }
                  }
                  // ---- bake GI: path tracing per permukaan di grid voxel lokal ----
                  val PAD = 28
                  val grid = Grid(x0 - PAD, z0 - PAD, CS + 2 * PAD, 80)
                  fillGrid(grid)
                  val bk = Baker(Tracer(grid), cfg)
                  val L = FloatArray(3)
                  for (q in 0 until fb.nq) {
                      val o = q * 9
                      val ar = fb.qm[o + 6]; val ag = fb.qm[o + 7]; val ab = fb.qm[o + 8]
                      if (cfg.spp > 0) bk.quad(fb.qm[o] - grid.x0, fb.qm[o + 1], fb.qm[o + 2] - grid.z0, fb.qm[o + 3], fb.qm[o + 4], fb.qm[o + 5], L)
                      else { val k = .5f + .5f * max(fb.qm[o + 4], 0f); L[0] = k; L[1] = k; L[2] = k }
                      val r = ar * L[0]; val g = ag * L[1]; val b = ab * L[2]
                      val base = fb.qs[q]
                      for (v in 0 until 6) { val k = base + v * 6 + 3; fb.a[k] = r; fb.a[k + 1] = g; fb.a[k + 2] = b }
                  }
                  var wb: FloatBuffer? = null; var wn = 0
                  if (anyWater) {
                      val w = FB(); val y = sea + 1f - .08f
                      val xa = x0.toFloat(); val za = z0.toFloat(); val xb = xa + CS; val zb = za + CS
                      w.rawQuad(xa, y, za, xb, y, za, xb, y, zb, xa, y, zb, .02f, .10f, .16f)
                      wb = w.buf(); wn = w.n / 6
                  }
                  return MeshData(cx, cz, gen, fb.buf(), fb.n / 6, wb, wn)
              }
          }
          EOF

          cat > $P/java/com/infinitepath/app/Cinematic.kt <<'EOF'
          package com.infinitepath.app

          import java.util.Random
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.atan
          import kotlin.math.atan2
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.floor
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.tan

          fun lp(a: Float, b: Float, t: Float) = a + (b - a) * t
          fun ss(a: Float, b: Float, x: Float): Float { val t = ((x - a) / (b - a)).coerceIn(0f, 1f); return t * t * (3f - 2f * t) }

          fun crp(P: List<FloatArray>, s: Float, o: FloatArray) {
              val n = P.size - 1
              val f = s.coerceIn(0f, 1f) * n
              val i = min(n - 1, floor(f).toInt())
              val t = f - i
              val p0 = P[max(0, i - 1)]; val p1 = P[i]; val p2 = P[i + 1]; val p3 = P[min(n, i + 2)]
              val t2 = t * t; val t3 = t2 * t
              for (j in 0..2) o[j] = .5f * (2f * p1[j] + (-p0[j] + p2[j]) * t + (2f * p0[j] - 5f * p1[j] + 4f * p2[j] - p3[j]) * t2 + (-p0[j] + 3f * p1[j] - 3f * p2[j] + p3[j]) * t3)
          }

          class Path(val P: List<FloatArray>) {
              private val M = max(8, (P.size - 1) * 24)
              private val pos = Array(M + 1) { FloatArray(3) }
              private val cum = FloatArray(M + 1)
              val len: Float

              init {
                  val o = FloatArray(3)
                  for (i in 0..M) {
                      crp(P, i / M.toFloat(), o)
                      System.arraycopy(o, 0, pos[i], 0, 3)
                      if (i > 0) cum[i] = cum[i - 1] + hypot(hypot(o[0] - pos[i - 1][0], o[1] - pos[i - 1][1]), o[2] - pos[i - 1][2])
                  }
                  len = max(cum[M], 1e-3f)
              }

              fun at(s: Float, out: FloatArray) {
                  val L = s.coerceIn(0f, 1f) * len
                  var a = 0; var b = M
                  while (b - a > 1) { val m = (a + b) shr 1; if (cum[m] <= L) a = m else b = m }
                  val f = (L - cum[a]) / max(1e-6f, cum[b] - cum[a])
                  for (j in 0..2) out[j] = pos[a][j] + (pos[b][j] - pos[a][j]) * f
              }
          }

          class Ev(val k: Int, val t: Float, val w: Float, val a: Float = 0f, val ox: Float = 0f, val oy: Float = 0f, val oz: Float = 0f, val f: Float = 0f, val s: Float = 0f)

          class Shot(
              val path: Path, val T: List<FloatArray>, val sp: FloatArray, val fov: Float, val dur: Float, val ease: Int,
              val bank: Float, val shake: Float, val camR: Float, val dolly: Float, val z0: Float, val z1: Float,
              val dtc: Float, val ev: List<Ev>, val tag: String, val name: String, val ax: Float, val az: Float,
              val ptsX: FloatArray, val ptsZ: FloatArray,
              val fm: Int, val fn: Float, val fa: Float, val ldB: Float, val mbB: Float, val caB: Float
          )

          class Pose {
              var x = 0f; var y = 0f; var z = 0f; var yaw = 0f; var pit = 0f; var roll = 0f; var fov = 1f
              var ld = 0f; var zb = 0f; var ca = 0f; var mbK = 1f; var dofK = 1f; var evK = 1f; var blK = 1f; var vig = 0f; var focus = 0f
              fun resetLens() { ld = 0f; zb = 0f; ca = 0f; mbK = 1f; dofK = 1f; evK = 1f; blK = 1f; vig = 0f; focus = 0f }
          }

          class Planner(private val w: World) {
              private val co = FloatArray(3)
              private val names1 = arrayOf("Hutan", "Lembah", "Punggung", "Pesisir", "Kabut", "Fajar", "Senja", "Sungai", "Padang", "Bukit")
              private val names2 = arrayOf("Sunyi", "Emas", "Biru", "Purba", "Lengang", "Hijau", "Perak", "Jauh")
              private val rigNames = arrayOf("ORBIT", "HELIX", "SERPENTINE", "FPV", "ARC DOLLY", "ROCKET", "TOP-DOWN SPIRAL", "VERTIGO", "RIDGE-REVEAL")
              private val hist = ArrayList<Int>()

              private fun smH(x: Float, z: Float): Float {
                  var s = 0f
                  for (a in -2..2) for (b in -2..2) s += w.hg(x + a * 6f, z + b * 6f)
                  return s / 25f
              }

              private fun base(x: Float, z: Float) = max(smH(x, z), w.sea + 1f)

              private fun mkA(n: Int, f: (Float) -> FloatArray): MutableList<FloatArray> {
                  val l = ArrayList<FloatArray>()
                  for (i in 0 until n) l.add(f(i / (n - 1).toFloat()))
                  return l
              }

              private fun relax(P: List<FloatArray>, r: Float, mg: Float, it: Int) {
                  fun push(p: FloatArray, m: Float) {
                      val d = w.clr(p[0], p[1], p[2], r, co)
                      if (d < m) { val f = (m - d) * .75f; p[0] += co[0] * f; p[1] += co[1] * f; p[2] += co[2] * f }
                  }
                  val n = P.size
                  for (k in 0 until it) {
                      for (i in 0 until n) push(P[i], mg)
                      if (k < it - 1) for (i in 1 until n - 1) {
                          val p = P[i]; val a = P[i - 1]; val b = P[i + 1]
                          for (j in 0..2) p[j] += ((a[j] + b[j]) * .5f - p[j]) * .3f
                      }
                  }
                  for (k in 0 until 4) for (i in 0 until n) push(P[i], mg * .6f)
              }

              private fun pathMin(pa: Path, r: Float): Float {
                  var m = 1e9f
                  val n = max(40, ceil(pa.len / 1.8f).toInt())
                  val o = FloatArray(3)
                  for (i in 0..n) { pa.at(i / n.toFloat(), o); val d = w.clr(o[0], o[1], o[2], r, co); if (d < m) m = d }
                  return m
              }

              fun make(i: Int, seed: Int, prevX: Float, prevZ: Float): Shot {
                  val r = Random((i * 7919L + seed * 131L + 17L))
                  fun rf() = r.nextFloat()
                  // pilih rig, hindari pengulangan
                  var ri: Int
                  do { ri = r.nextInt(rigNames.size) } while (hist.contains(ri))
                  hist.add(ri); if (hist.size > 3) hist.removeAt(0)
                  val ang = rf() * 6.283f; val ds = 140f + rf() * 220f
                  val bx = prevX + cos(ang) * ds; val bz = prevZ + sin(ang) * ds
                  var best = -1e9f; var X = bx; var Z = bz
                  for (k in 0 until 14) {
                      val x = bx + (rf() - .5f) * 160f; val z = bz + (rf() - .5f) * 160f; val h = w.hg(x, z)
                      val s = if (ri == 2 || ri == 3 || ri == 5 || ri == 8) abs(w.hg(x + 40, z) - w.hg(x - 40, z)) + abs(w.hg(x, z + 40) - w.hg(x, z - 40)) + h * .3f
                      else h - abs(w.hg(x + 25, z) - h) * 2f
                      if (s > best) { best = s; X = x; Z = z }
                  }
                  val hd = rf() * 6.283f; val fx = cos(hd); val fz = sin(hd); val qx = -fz; val qz = fx
                  val h0 = w.hg(X, Z); val ph = rf() * 6.283f
                  var P: MutableList<FloatArray> = ArrayList(); var T: MutableList<FloatArray> = ArrayList()
                  var fov = 1f; var bank = .5f; var shake = .4f; var camR = 1.15f; var dolly = 0f; var ease = -1; var dk = 1f
                  var sp = floatArrayOf(X, h0 + 4f, Z)
                  when (ri) {
                      0 -> { // ORBIT
                          val R0 = 26f + rf() * 40f; val R1 = R0 * (.55f + rf() * 1.1f); val t0 = rf() * 6.283f
                          val sw = (1.3f + rf() * 3.2f) * (if (rf() < .5f) 1f else -1f); val a0 = 5f + rf() * 16f; val a1 = a0 + (rf() - .35f) * 34f
                          val sj = 2f + rf() * 9f; val wb = 1f + rf() * 2f; sp = floatArrayOf(X, h0 + sj, Z)
                          P = mkA(16) { t -> val R = lp(R0, R1, t); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(a0, a1, t) + sin(t * 6.283f * wb) * 4f, z) }
                          T = mkA(5) { t -> floatArrayOf(X + sin(t * 3 + ph) * 3, sp[1] + cos(t * 2) * 2, Z + cos(t * 3) * 3) }
                          fov = .9f; bank = .55f; shake = .4f
                      }
                      1 -> { // HELIX
                          val up = rf() < .7f; val R0 = 14f + rf() * 20f; val R1 = R0 + 30f + rf() * 40f; val t0 = rf() * 6.283f
                          val sw = (2f + rf() * 3.4f) * (if (rf() < .5f) 1f else -1f); val a0 = 3f + rf() * 3f; val a1 = 45f + rf() * 60f
                          sp = floatArrayOf(X, h0 + 3f + rf() * 6f, Z)
                          P = mkA(20) { t -> val q = if (up) t else 1 - t; val R = lp(R0, R1, q); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(a0, a1, q * q * (3 - 2 * q)), z) }
                          T = mkA(4) { t -> floatArrayOf(X, sp[1] + t * 6f, Z) }
                          fov = .95f; bank = .35f; shake = .3f; ease = 3
                      }
                      2, 3 -> { // SERPENTINE / FPV
                          val fpv = ri == 3
                          val L = if (fpv) 220f + rf() * 110f else 130f + rf() * 120f
                          val A = if (fpv) 18f + rf() * 24f else 10f + rf() * 26f
                          val cy = if (fpv) 1.5f + rf() * 1.3f else .9f + rf() * .9f
                          val p0 = rf() * 6.283f; val a0 = if (fpv) 4f + rf() * 5f else 10f + rf() * 30f; val da = (rf() - .5f) * 20f
                          val pf = { t: Float ->
                              val d = t * L; val sw = sin(p0 + t * 6.283f * cy) * A * min(1f, t * 4f + .3f)
                              val x = X + fx * d + qx * sw; val z = Z + fz * d + qz * sw
                              floatArrayOf(x, base(x, z) + a0 + (if (fpv) sin(t * 9 + p0) * 2.5f else da * t), z)
                          }
                          P = mkA(if (fpv) 26 else 18, pf)
                          val la = if (fpv) .07f else .16f
                          T = mkA(if (fpv) 26 else 18) { t -> val q = pf(t + la); floatArrayOf(q[0], if (fpv) q[1] + 1.5f else q[1] - (q[1] - base(q[0], q[2])) * .55f, q[2]) }
                          fov = if (fpv) 1.5f + rf() * .25f else 1.05f; bank = if (fpv) 1.5f else .9f; shake = if (fpv) .7f else .45f
                          if (fpv) { dk = .68f; ease = 2 }
                          sp = floatArrayOf(X + fx * L * .5f, h0 + 4f, Z + fz * L * .5f)
                      }
                      4 -> { // ARC DOLLY (tele)
                          val R = 22f + rf() * 26f; val t0 = rf() * 6.283f; val sw = (.8f + rf() * .7f) * (if (rf() < .5f) 1f else -1f); val a0 = 3.5f + rf() * 7f
                          sp = floatArrayOf(X, h0 + 2f + rf() * 8f, Z)
                          P = mkA(8) { t -> val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + a0 + sin(t * 3) * 1.2f, z) }
                          T = mkA(4) { t -> floatArrayOf(X + sin(t * 2) * 1.5f, sp[1], Z + cos(t * 2) * 1.5f) }
                          fov = .32f + rf() * .2f; bank = .25f; shake = .55f
                      }
                      5 -> { // ROCKET
                          val R0 = 10f + rf() * 10f; val R1 = R0 + 14f + rf() * 20f; val t0 = rf() * 6.283f; val sw = (1.2f + rf() * 1.4f) * (if (rf() < .5f) 1f else -1f); val top = 80f + rf() * 40f
                          sp = floatArrayOf(X, h0 + 4f, Z)
                          P = mkA(14) { t -> val R = lp(R0, R1, t); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(2.5f, top, t * t * (3 - 2 * t)), z) }
                          T = mkA(4) { t -> floatArrayOf(X, sp[1] - t * 2, Z) }
                          fov = 1.1f; bank = .2f; shake = .25f; ease = 3
                      }
                      6 -> { // TOP-DOWN SPIRAL
                          val t0 = rf() * 6.283f; val sw = (2.5f + rf() * 2.6f) * (if (rf() < .5f) 1f else -1f); val R0 = 26f + rf() * 20f; val R1 = R0 + 30f + rf() * 30f
                          val a0 = 90f + rf() * 40f; val a1 = 26f + rf() * 14f; val hz = rf() * 6.283f
                          P = mkA(20) { t -> val R = lp(R0, R1, t); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(a0, a1, t), z) }
                          T = mkA(5) { t -> val q = ss(.15f, 1f, t); floatArrayOf(X + cos(hz) * 120f * q, h0 + lp(0f, 24f, q), Z + sin(hz) * 120f * q) }
                          fov = 1f; bank = .3f; shake = .2f; ease = 3
                      }
                      7 -> { // VERTIGO (dolly zoom)
                          val d0 = 18f + rf() * 10f; val d1 = d0 * (2.3f + rf() * .9f); val inn = rf() < .5f; val a0 = 5f + rf() * 4f
                          val bl = (if (rf() < .5f) 1f else -1f) * (8f + rf() * 6f); val ds2 = if (inn) d1 else d0; val de = if (inn) d0 else d1; val f0 = .6f + rf() * .3f
                          sp = floatArrayOf(X, h0 + 6f + rf() * 8f, Z)
                          P = mkA(7) { t -> val d = lp(ds2, de, t); val x = X - fx * d + qx * sin(t * 3.1416f) * bl; val z = Z - fz * d + qz * sin(t * 3.1416f) * bl; floatArrayOf(x, base(x, z) + a0 + t * 3f, z) }
                          T = mkA(3) { floatArrayOf(sp[0], sp[1], sp[2]) }
                          fov = f0; bank = .15f; shake = .25f; dolly = tan(f0 / 2f) * (if (inn) d1 else d0); ease = 3
                      }
                      else -> { // RIDGE-REVEAL
                          val sg = if (rf() < .5f) 1f else -1f
                          val ax = X - fx * 20f; val az = Z - fz * 20f; val bx2 = X + fx * 70f; val bz2 = Z + fz * 70f
                          val lat = sg * (25f + rf() * 20f); val cx = (ax + bx2) / 2 + qx * lat; val cz = (az + bz2) / 2 + qz * lat; val h1 = 22f + rf() * 14f
                          fun bzr(a: Float, b: Float, d: Float, t: Float) = (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * d
                          P = mkA(14) { t -> val x = bzr(ax, cx, bx2, t); val z = bzr(az, cz, bz2, t); floatArrayOf(x, base(x, z) + lp(2.4f, h1, t * t * (3 - 2 * t)), z) }
                          T = mkA(6) { t -> val x = lp(ax + fx * 60f, bx2 + fx * 170f, t); val z = lp(az + fz * 60f, bz2 + fz * 170f, t); floatArrayOf(x, base(x, z) + lp(8f, -4f, t), z) }
                          fov = 1f; bank = .5f; shake = .35f; ease = 3
                          sp = floatArrayOf(bx2 + fx * 60f, h0, bz2 + fz * 60f)
                      }
                  }
                  // ---- validasi: relaksasi + swept-sphere; naikkan jalur kalau perlu ----
                  camR = 1.15f * Cfg["cinClr"].coerceAtLeast(.5f)
                  var ok = false
                  var cp = P
                  for (att in 0 until 7) {
                      if (att > 0) cp = P.map { it.copyOf() }.toMutableList()
                      val lift = if (att >= 3) (att - 2) * 9f else 0f
                      if (lift > 0) for (p in cp) p[1] += lift
                      relax(cp, camR, camR * .8f + .9f, 10)
                      val pa = Path(cp)
                      if (pathMin(pa, camR) >= .12f) { P = cp as MutableList<FloatArray>; ok = true; break }
                  }
