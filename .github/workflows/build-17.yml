              private fun fillPanel() {
                  panel.removeAllViews()
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(0xE6101820.toInt())
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(24, 24, 24, 48)
                  var cat = ""
                  for (s in Cfg.specs) {
                      if (s.cat != cat) {
                          cat = s.cat
                          val h = TextView(this)
