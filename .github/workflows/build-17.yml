                  if (allFb.isNotEmpty()) G.glDeleteFramebuffers(allFb.size, allFb.toIntArray(), 0)
                  if (allTex.isNotEmpty()) G.glDeleteTextures(allTex.size, allTex.toIntArray(), 0)
                  allFb.clear(); allTex.clear(); bl.clear(); ae.clear()
              }

              private fun buildRT(w: Int, h: Int): Boolean {
                  val ifmt = if (hdr) G.GL_RGBA16F else G.GL_RGBA8
                  val type = if (hdr) G.GL_HALF_FLOAT else G.GL_UNSIGNED_BYTE
                  stT = mkTex(w, h, ifmt, G.GL_RGBA, type, G.GL_LINEAR)
                  depT = mkTex(w, h, G.GL_DEPTH_COMPONENT24, G.GL_DEPTH_COMPONENT, G.GL_UNSIGNED_INT, G.GL_NEAREST)
                  stF = mkFB(stT, depT); if (!fbOk()) return false
                  for (i in 0..1) { htT[i] = mkTex(w, h, ifmt, G.GL_RGBA, type, G.GL_LINEAR); htF[i] = mkFB(htT[i], 0); if (!fbOk()) return false }
                  gT = mkTex(max(2, w shr 1), max(2, h shr 1), G.GL_R8, G.GL_RED, G.GL_UNSIGNED_BYTE, G.GL_LINEAR); gF = mkFB(gT, 0); if (!fbOk()) return false
                  for (chain in 0..1) {
                      var bw = w; var bh = h
                      for (i in 0 until 6) {
                          bw = max(2, bw shr 1); bh = max(2, bh shr 1)
                          val t = mkTex(bw, bh, ifmt, G.GL_RGBA, type, G.GL_LINEAR); val f = mkFB(t, 0); if (!fbOk()) return false
                          (if (chain == 0) bl else ae).add(Lv(t, f, bw, bh))
                      }
                  }
                  return true
              }

              private fun ensureRT(w: Int, h: Int) {
                  if (rtW == w && rtH == h) return
                  freeRT()
                  var ok = buildRT(w, h)
                  if (!ok && hdr) { hdr = false; freeRT(); ok = buildRT(w, h) }
                  rtW = w; rtH = h; hi = 0; rst = true
                  hs = if (hdr) 1f else .25f
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, 0)
              }

              private fun bt(i: Int, t: Int) { G.glActiveTexture(G.GL_TEXTURE0 + i); G.glBindTexture(G.GL_TEXTURE_2D, t) }
              private fun tri() = G.glDrawArrays(G.GL_TRIANGLES, 0, 3)

              // ---------- streaming ----------
              private fun key(cx: Int, cz: Int) = (cx.toLong() shl 32) or (cz.toLong() and 0xffffffffL)
              private fun kx(k: Long) = (k shr 32).toInt()
              private fun kz(k: Long) = k.toInt()

              private fun addRing(set: HashMap<Long, Float>, cx: Int, cz: Int, r: Int) {
                  for (dx in -r..r) for (dz in -r..r) {
                      val d = hypot(dx.toFloat(), dz.toFloat())
                      if (d > r) continue
                      val k = key(cx + dx, cz + dz); val o = set[k]
                      if (o == null || d < o) set[k] = d
                  }
              }

              private fun dropChunk(c: Chunk) {
                  G.glDeleteBuffers(1, intArrayOf(c.vbo), 0)
                  if (c.wvbo != 0) G.glDeleteBuffers(1, intArrayOf(c.wvbo), 0)
              }

              private fun regen() {
                  genId++
                  for (c in chunks.values) dropChunk(c)
                  chunks.clear(); pending.clear(); done.clear(); wantKey = Long.MIN_VALUE
                  world.seed = Cfg["seed"].toInt(); world.treeMul = Cfg["tree"]; world.clearCaches()
                  planner = Planner(world)
                  rst = true
                  if (cin) { cur = null; nx = null; fut = null; wasCin = false }
              }

              private fun updateWanted(now: Long) {
                  val rad = radius
                  val cx = floor(px / 16f).toInt(); val cz = floor(pz / 16f).toInt()
                  val k = key(cx, cz)
                  if (k == wantKey && now - wantStamp < 700) return
                  wantKey = k; wantStamp = now
                  val set = HashMap<Long, Float>()
                  addRing(set, cx, cz, rad)
                  val n = nx
                  if (n != null) for (i in n.ptsX.indices) addRing(set, floor(n.ptsX[i] / 16f).toInt(), floor(n.ptsZ[i] / 16f).toInt(), if (i == 0) 7 else 4)
                  wanted = set.entries.sortedBy { it.value }.map { it.key }
                  val keep = set.keys
                  val iter = chunks.entries.iterator()
                  while (iter.hasNext()) {
                      val e = iter.next()
                      if (!keep.contains(e.key)) { dropChunk(e.value); iter.remove() }
                  }
              }

              private fun pump() {
                  var budget = 8
                  val cfg = BakeCfg(Cfg["spp"].toInt(), Cfg["bounce"].toInt(), Cfg["sun"], Cfg["sky"], Cfg["sunAz"], Cfg["sunEl"])
                  val g = genId
                  for (k in wanted) {
                      if (budget <= 0 || pending.size >= 10) break
                      if (chunks.containsKey(k) || pending.contains(k)) continue
                      pending.add(k); budget--
                      val cx = kx(k); val cz = kz(k)
                      exec.execute { try { done.add(world.build(cx, cz, g, cfg)) } catch (e: Throwable) { } }
                  }
                  var up = 3
                  while (up > 0) {
                      val m = done.poll() ?: break
                      val k = key(m.cx, m.cz)
                      if (m.gen != genId) continue
                      pending.remove(k)
                      if (!wanted.contains(k)) continue
                      val b = IntArray(2)
                      G.glGenBuffers(2, b, 0)
                      G.glBindBuffer(G.GL_ARRAY_BUFFER, b[0])
                      G.glBufferData(G.GL_ARRAY_BUFFER, m.n * 24, m.v, G.GL_STATIC_DRAW)
                      var wv = 0
                      if (m.w != null && m.wn > 0) {
                          G.glBindBuffer(G.GL_ARRAY_BUFFER, b[1])
                          G.glBufferData(G.GL_ARRAY_BUFFER, m.wn * 24, m.w, G.GL_STATIC_DRAW)
                          wv = b[1]
                      } else G.glDeleteBuffers(1, intArrayOf(b[1]), 0)
                      chunks[k] = Chunk(b[0], m.n, wv, m.wn)
                      up--
                  }
              }

              private fun ready(s: Shot): Boolean {
                  val cx = floor(s.ptsX[0] / 16f).toInt(); val cz = floor(s.ptsZ[0] / 16f).toInt()
                  var tot = 0; var ok = 0
                  for (dx in -6..6) for (dz in -6..6) if (hypot(dx.toFloat(), dz.toFloat()) <= 6f) { tot++; if (chunks.containsKey(key(cx + dx, cz + dz))) ok++ }
                  return ok >= tot * .98f
              }

              // ---------- kamera ----------
              private fun freeStep(dt: Float) {
                  yaw -= lookDX * .0045f; pit = (pit - lookDY * .0045f).coerceIn(-1.45f, 1.45f); lookDX = 0f; lookDY = 0f
                  val f = -moveY; val r = moveX; val sp = 16f
                  px += (-sin(yaw) * f + cos(yaw) * r) * sp * dt
                  pz += (-cos(yaw) * f - sin(yaw) * r) * sp * dt
                  val tgt = world.hg(px, pz) + 3f
                  py += (tgt - py) * min(1f, dt * 5f)
                  val d = world.clr(px, py, pz, .8f, co)
                  if (d < 0f) { px += co[0] * -d; py += co[1] * -d; pz += co[2] * -d }
                  roll += (0f - roll) * min(1f, dt * 4f); fov += (Cfg["fov"] - fov) * min(1f, dt * 4f)
                  pose.resetLens()
              }

              private fun cut() {
                  cur = nx; nx = null; ct = 0f; fade = 1f; shotNo++; rst = true
                  val c = cur!!
                  anchX = c.ax; anchZ = c.az
                  val n = shotNo; val a = anchX; val b = anchZ; val sd = Cfg["seed"].toInt()
                  val pl = planner
                  fut = exec.submit(Callable<Shot> { pl.make(n, sd, a, b) })
                  if (Cfg["cinTitle"] > .5f) act.showTitle("SCENE " + String.format("%02d", shotNo) + " — " + c.tag, c.name)
                  wantKey = Long.MIN_VALUE
              }

              private fun cinStep(dt: Float) {
                  if (!wasCin) {
                      wasCin = true; cur = null; nx = null; shotNo = 0; anchX = px; anchZ = pz; waitT = 0f
                      val a = anchX; val b = anchZ; val sd = Cfg["seed"].toInt(); val pl = planner
                      fut = exec.submit(Callable<Shot> { pl.make(0, sd, a, b) })
                  }
                  val f = fut
                  if (f != null && f.isDone) {
                      try { nx = f.get() } catch (e: Exception) { nx = null }
                      fut = null; wantKey = Long.MIN_VALUE
                  }
                  val c = cur
                  if (c == null) {
                      val n = nx ?: return
                      waitT += dt
                      rig.pose(n, 0f, waitT, dt, pose); apply()
                      if (ready(n) || waitT > 14f) cut()
                      return
                  }
                  ct += dt
                  fade = max(0f, fade - dt / max(.1f, Cfg["cinXf"]))
                  val u = min(1f, ct / c.dur)
                  rig.pose(c, rig.ease(u, c.ease), ct, dt, pose); apply()
                  val x = fade * Cfg["cinLens"]
                  pose.ld += x * .55f; pose.zb += x * .5f; pose.ca += x * .9f; pose.evK *= 1f + x * .5f
                  val n = nx
                  if (n != null && ct >= c.dur && (ready(n) || ct > c.dur + 8f)) cut()
              }

              private fun apply() { px = pose.x; py = pose.y; pz = pose.z; yaw = pose.yaw; pit = pose.pit; roll = pose.roll; fov = pose.fov }

              fun setCinematic(on: Boolean) {
                  cin = on
                  if (!on) { wasCin = false; cur = null; nx = null; fut = null; fade = 0f; roll = 0f; wantKey = Long.MIN_VALUE; act.hideTitle() }
              }

              private fun halton(i: Int, b: Int): Float { var f = 1f; var r = 0f; var k = i; while (k > 0) { f /= b; r += f * (k % b); k /= b }; return r }

              // ---------- frame ----------
              override fun onDrawFrame(gl: GL10?) {
                  val t = System.nanoTime()
                  val dt = min(.05f, (t - last) / 1e9f); last = t
                  val nowS = (t / 1000000L % 100000000L) / 1000f
                  fps += (1f / max(dt, 1e-3f) - fps) * .05f
                  if (seenWorld != Cfg.worldGen) { seenWorld = Cfg.worldGen; regen() }
                  if (cin) cinStep(dt) else { wasCin = false; freeStep(dt) }
                  updateWanted(t / 1000000L); pump()

                  val post = Cfg["post"] > .5f
                  val taa = post && Cfg["taa"] > .5f
                  val scale = Cfg["scale"].coerceIn(.3f, 1f)
                  val rw = max(16, (sw * scale).toInt()); val rh = max(16, (sh * scale).toInt())
                  ensureRT(rw, rh)
                  if (cin && cur != null && ct < .05f) rst = true

                  val cp = cos(pit); val sp = sin(pit)
                  val fw = floatArrayOf(-sin(yaw) * cp, sp, -cos(yaw) * cp)
                  val r0 = floatArrayOf(cos(yaw), 0f, -sin(yaw)); val u0 = floatArrayOf(sin(yaw) * sp, cp, cos(yaw) * sp)
                  val cr = cos(roll); val sr = sin(roll)
                  val rv = FloatArray(3) { r0[it] * cr + u0[it] * sr }; val uv = FloatArray(3) { u0[it] * cr - r0[it] * sr }
                  val e = floatArrayOf(px, py, pz)
                  fun dot(a: FloatArray, b: FloatArray) = a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
                  val z = floatArrayOf(-fw[0], -fw[1], -fw[2])
                  view[0] = rv[0]; view[1] = uv[0]; view[2] = z[0]; view[3] = 0f
                  view[4] = rv[1]; view[5] = uv[1]; view[6] = z[1]; view[7] = 0f
                  view[8] = rv[2]; view[9] = uv[2]; view[10] = z[2]; view[11] = 0f
                  view[12] = -dot(rv, e); view[13] = -dot(uv, e); view[14] = -dot(z, e); view[15] = 1f
                  val asp = rw / rh.toFloat()
                  Matrix.perspectiveM(proj, 0, Math.toDegrees(fov.toDouble()).toFloat(), asp, .1f, 1500f)
                  Matrix.multiplyMM(vp0, 0, proj, 0, view, 0)
                  if (taa) {
                      val j = (frameNo % 8) + 1
                      proj[8] += (halton(j, 2) - .5f) * 2f / rw; proj[9] += (halton(j, 3) - .5f) * 2f / rh
                  }
                  Matrix.multiplyMM(mvp, 0, proj, 0, view, 0)
                  val tn = tan(fov / 2f); val thx = tn * asp

                  val az = Cfg["sunAz"]; val el = Cfg["sunEl"]
                  val sd = floatArrayOf(cos(el) * sin(az), sin(el), cos(el) * cos(az))
                  val sunK = Cfg["sun"]
                  val sc = floatArrayOf(1.3f * sunK, 1.1f * sunK, .85f * sunK)

                  // ---- pass 1: scene -> HDR ----
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, stF)
                  G.glViewport(0, 0, rw, rh)
                  G.glDepthMask(true)
                  G.glClearColor(0f, 0f, 0f, 1f)
                  G.glClear(G.GL_COLOR_BUFFER_BIT or G.GL_DEPTH_BUFFER_BIT)
                  G.glDisable(G.GL_DEPTH_TEST)
                  G.glUseProgram(progSky)
                  u3v(progSky, "R", rv); u3v(progSky, "U", uv); u3v(progSky, "F", fw); u3v(progSky, "sd", sd); u3v(progSky, "sc", sc)
                  u2(progSky, "th", thx, tn); u1(progSky, "tm", nowS); u1(progSky, "cld", Cfg["cloud"]); u1(progSky, "hs", hs)
                  tri()
                  G.glEnable(G.GL_DEPTH_TEST); G.glDepthFunc(G.GL_LESS)
                  G.glUseProgram(progScene)
                  um(progScene, "m", mvp); u3(progScene, "cp", px, py, pz)
                  u3v(progScene, "sd", sd); u3v(progScene, "sc", sc)
                  u1(progScene, "e", Cfg["exp"]); u1(progScene, "fg", Cfg["fog"]); u1(progScene, "hs", hs)
                  val uAlpha = loc(progScene, "alpha")
                  G.glEnableVertexAttribArray(0); G.glEnableVertexAttribArray(1)
                  G.glUniform1f(uAlpha, 1f)
                  var drawn = 0
                  for ((k, c) in chunks) {
                      val vx = kx(k) * 16f + 8f - px; val vz = kz(k) * 16f + 8f - pz
                      if (vx * fw[0] + vz * fw[2] < -28f && hypot(vx, vz) > 40f) continue
                      G.glBindBuffer(G.GL_ARRAY_BUFFER, c.vbo)
                      G.glVertexAttribPointer(0, 3, G.GL_FLOAT, false, 24, 0); G.glVertexAttribPointer(1, 3, G.GL_FLOAT, false, 24, 12)
                      G.glDrawArrays(G.GL_TRIANGLES, 0, c.n); drawn++
                  }
                  G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_SRC_ALPHA, G.GL_ONE_MINUS_SRC_ALPHA); G.glDepthMask(false)
                  G.glUniform1f(uAlpha, .7f)
                  for (c in chunks.values) {
                      if (c.wvbo == 0) continue
                      G.glBindBuffer(G.GL_ARRAY_BUFFER, c.wvbo)
                      G.glVertexAttribPointer(0, 3, G.GL_FLOAT, false, 24, 0); G.glVertexAttribPointer(1, 3, G.GL_FLOAT, false, 24, 12)
                      G.glDrawArrays(G.GL_TRIANGLES, 0, c.wn)
                  }
                  G.glDepthMask(true); G.glDisable(G.GL_BLEND); G.glDisable(G.GL_DEPTH_TEST)

                  // ---- pass 2: TAA ----
                  var src = stT
                  if (taa) {
                      val wi = 1 - hi
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, htF[wi]); G.glViewport(0, 0, rw, rh)
                      G.glUseProgram(pTaa)
                      bt(0, stT); bt(1, htT[hi]); bt(2, depT)
                      u1i(pTaa, "cu", 0); u1i(pTaa, "hi", 1); u1i(pTaa, "dp", 2)
                      u3(pTaa, "cp", px, py, pz); u3v(pTaa, "R", rv); u3v(pTaa, "U", uv); u3v(pTaa, "F", fw)
                      u2(pTaa, "th", thx, tn); u2(pTaa, "px", 1f / rw, 1f / rh)
                      um(pTaa, "pv", if (havePrev) prevVP else vp0); u1(pTaa, "rst", if (rst || !havePrev) 1f else 0f)
                      tri(); hi = wi; rst = false; src = htT[wi]
                  } else rst = true

                  // ---- pass 3: bloom ----
                  val bI = if (post) Cfg["bloom"] * pose.blK else 0f
                  if (bI > 0f) {
                      G.glUseProgram(pBP); bt(0, src); u1i(pBP, "s", 0); u2(pBP, "px", 1f / rw, 1f / rh); u1(pBP, "th", Cfg["bloomTh"]); u1(pBP, "hs", hs)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, bl[0].f); G.glViewport(0, 0, bl[0].w, bl[0].h); tri()
                      G.glUseProgram(pBD); u1i(pBD, "s", 0)
                      for (i in 1 until bl.size) {
                          bt(0, bl[i - 1].t); u2(pBD, "px", 1f / bl[i - 1].w, 1f / bl[i - 1].h)
                          G.glBindFramebuffer(G.GL_FRAMEBUFFER, bl[i].f); G.glViewport(0, 0, bl[i].w, bl[i].h); tri()
                      }
                      G.glUseProgram(pBU); u1i(pBU, "s", 0)
                      G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_ONE, G.GL_ONE)
                      for (i in bl.size - 1 downTo 1) {
                          bt(0, bl[i].t); u2(pBU, "hp", .5f / bl[i].w, .5f / bl[i].h)
                          G.glBindFramebuffer(G.GL_FRAMEBUFFER, bl[i - 1].f); G.glViewport(0, 0, bl[i - 1].w, bl[i - 1].h); tri()
                      }
                      G.glDisable(G.GL_BLEND)
                  }

                  // ---- auto-eksposur: rata-rata luminansi dari rantai downsample (tiap 4 frame) ----
                  if (Cfg["aeOn"] > .5f && post) {
                      if (frameNo % 4 == 0 && hdr) {
                          G.glUseProgram(pBD); u1i(pBD, "s", 0)
                          bt(0, src); u2(pBD, "px", 1f / rw, 1f / rh)
                          G.glBindFramebuffer(G.GL_FRAMEBUFFER, ae[0].f); G.glViewport(0, 0, ae[0].w, ae[0].h); tri()
                          for (i in 1 until ae.size) {
                              bt(0, ae[i - 1].t); u2(pBD, "px", 1f / ae[i - 1].w, 1f / ae[i - 1].h)
                              G.glBindFramebuffer(G.GL_FRAMEBUFFER, ae[i].f); G.glViewport(0, 0, ae[i].w, ae[i].h); tri()
                          }
                          val lv = ae[ae.size - 1]
                          val rwid = min(lv.w, 8); val rhei = min(lv.h, 8)
                          rdBuf.clear()
                          G.glReadPixels(0, 0, rwid, rhei, G.GL_RGBA, G.GL_FLOAT, rdBuf)
                          var s = 0f
                          val n = rwid * rhei
                          for (i in 0 until n) s += rdBuf.get(i * 4) * .2126f + rdBuf.get(i * 4 + 1) * .7152f + rdBuf.get(i * 4 + 2) * .0722f
                          val la = max(s / max(1, n) / hs, .02f)
                          val tf = min(Cfg["aeMax"], max(Cfg["aeMin"], (Cfg["aeKey"] / la).pow(Cfg["aeStr"])))
                          val tau = if (tf > aeF) Cfg["aeUp"] else Cfg["aeDown"]
                          aeF += (tf - aeF) * (1f - exp(-dt * 4f / max(.05f, tau)))
                      }
                  } else aeF += (1f - aeF) * min(1f, dt * 2f)

                  // fokus
                  val dofOn = post && Cfg["dof"] > 0f
                  if (dofOn) {
                      val tf = if (pose.focus > 0f) pose.focus else world.rayDist(px, py, pz, fw[0], fw[1], fw[2], 150f)
                      val rate = if (pose.focus > 0f) 8f else 5f
                      focus += (tf - focus) * (1f - exp(-dt * rate))
                  }
                  val sfw = dot(sd, fw); val fd = max(.05f, sfw)
                  val sunX = dot(sd, rv) / (fd * thx) * .5f + .5f; val sunY = dot(sd, uv) / (fd * tn) * .5f + .5f
                  val svv = ((sfw + .05f) * 3f).coerceIn(0f, 1f)
                  val shaftOn = post && Cfg["shaft"] > 0f && svv > 0f
                  if (shaftOn) {
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, gF); G.glViewport(0, 0, max(2, rw shr 1), max(2, rh shr 1))
                      G.glUseProgram(pGod); bt(0, depT); u1i(pGod, "dp", 0); u2(pGod, "sun", sunX, sunY); u1(pGod, "tm", nowS); tri()
                  }

                  // ---- pass 4: komposit sinematik -> layar ----
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, 0)
                  G.glViewport(0, 0, sw, sh)
                  G.glUseProgram(pComp)
                  bt(0, src); bt(1, bl[0].t); bt(2, depT); bt(3, gT); bt(4, dum2)
                  G.glActiveTexture(G.GL_TEXTURE5); G.glBindTexture(G.GL_TEXTURE_3D, dum3)
                  bt(6, dum2)
                  u1i(pComp, "cs", 0); u1i(pComp, "bl", 1); u1i(pComp, "dp", 2); u1i(pComp, "gr", 3); u1i(pComp, "cvT", 4); u1i(pComp, "rl", 5); u1i(pComp, "xf", 6)
                  u3(pComp, "cp", px, py, pz); u3v(pComp, "R", rv); u3v(pComp, "U", uv); u3v(pComp, "F", fw)
                  u2(pComp, "th", thx, tn); u2(pComp, "px", 1f / rw, 1f / rh); u2(pComp, "sun", sunX, sunY)
                  um(pComp, "pv", if (havePrev) prevVP else vp0); u3(pComp, "sc3", 1.2f, 1f, .75f)
                  u1(pComp, "hsI", 1f / hs); u1(pComp, "asp", sw / sh.toFloat()); u1(pComp, "tm", nowS)
                  u1(pComp, "bI", bI); u1(pComp, "shf", if (shaftOn) Cfg["shaft"] else 0f); u1(pComp, "sv", svv)
                  u1(pComp, "dof", if (dofOn) Cfg["dof"] * pose.dofK else 0f); u1(pComp, "fo", focus)
                  u1(pComp, "mb", if (post) Cfg["mblur"] * pose.mbK else 0f)
                  u1(pComp, "shp", if (post) Cfg["sharp"] else 0f); u1(pComp, "ca", if (post) Cfg["ca"] + pose.ca else 0f)
                  u1(pComp, "gr_", if (post) Cfg["grade"] else 0f); u1(pComp, "sat", if (post) Cfg["sat"] else 1f); u1(pComp, "con", if (post) Cfg["con"] else 1f)
                  u1(pComp, "cex", (if (post) Cfg["cex"] else 1f) * aeF * pose.evK)
                  u1(pComp, "vig", if (post) max(0f, Cfg["vig"] + pose.vig) else 0f); u1(pComp, "gn", if (post) Cfg["grain"] else 0f)
                  u1(pComp, "lt", if (post && (Cfg["letter"] > .5f || cin)) 1f else 0f); u1(pComp, "fx", if (taa) 0f else 1f)
                  u1(pComp, "xfk", 0f); u1(pComp, "ldk", if (post) pose.ld else 0f); u1(pComp, "zb", if (post) pose.zb else 0f)
                  u1(pComp, "gOn", 0f); u1(pComp, "gRef", 0f); u1(pComp, "gAmt", 0f); u1(pComp, "gStk", 0f); u1(pComp, "gCv", 0f); u1(pComp, "gHsl", 0f)
                  tri()
                  if (cin && fade > 0f) {
                      G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_SRC_ALPHA, G.GL_ONE_MINUS_SRC_ALPHA)
                      G.glUseProgram(progFade)
