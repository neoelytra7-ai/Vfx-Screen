                      T = mkA(3) { floatArrayOf(X, h0 + 4f, Z) }
                      relax(P, camR, camR * .8f + .9f, 30); fov = .9f; dolly = 0f; sp = floatArrayOf(X, h0 + 4f, Z)
                  }
                  val pa = Path(P)
                  // ---- program lensa & event ----
                  val ev = ArrayList<Ev>(); val tag = StringBuilder(rigNames[ri])
                  var z0 = 1f; var z1 = 1f
                  if (dolly == 0f) {
                      when (r.nextInt(5)) {
                          0 -> { z0 = 1.1f + rf() * .1f; z1 = .72f + rf() * .1f; tag.append(" · PUSH-IN") }
                          1 -> { z0 = .78f + rf() * .1f; z1 = 1.15f + rf() * .1f; tag.append(" · PULL-OUT") }
                          2 -> { z0 = 1.25f; z1 = 1.25f; tag.append(" · WIDE") }
                          else -> {}
                      }
                  } else tag.append(" · DOLLY-ZOOM")
                  val wild = Cfg["cinWild"].coerceIn(0f, 1f); val lensK = Cfg["cinLens"]
                  val nE = (rf() * wild * 3.2f).toInt() + (if (ri == 3) 1 else 0)
                  for (k in 0 until nE) {
                      val t = .18f + rf() * .64f
                      when (r.nextInt(7)) {
                          6 -> { ev.add(Ev(5, t, .03f + rf() * .03f, a = 1f + rf() * 1.5f)); tag.append(" · FLASH") }
                          0, 1 -> { ev.add(Ev(0, t, .035f + rf() * .03f, a = .7f + rf() * .5f)); tag.append(" · CRASH-ZOOM") }
                          2 -> { val a = (if (rf() < .5f) 1f else -1f) * (1.2f + rf() * 1.2f); val dd = 45f + rf() * 70f
                              ev.add(Ev(1, t, .05f + rf() * .03f, ox = cos(a + ph) * dd, oy = (rf() - .35f) * 20f, oz = sin(a + ph) * dd)); tag.append(" · WHIP-PAN") }
                          3 -> { ev.add(Ev(2, t, .03f + rf() * .03f, a = .03f + rf() * .05f, f = 25f + rf() * 20f, s = rf() * 6.28f)); tag.append(" · JOLT") }
                          4 -> { ev.add(Ev(3, t, .12f + rf() * .1f, a = (if (rf() < .5f) 1f else -1f) * (.17f + rf() * .3f))); tag.append(" · DUTCH") }
                          else -> if (ri == 3 || ri == 5 || rf() < .12f) { ev.add(Ev(4, t, .07f + rf() * .04f, a = (if (rf() < .5f) 1f else -1f) * 6.283f)); tag.append(" · BARREL-ROLL") }
                      }
                  }
                  val dtc = Cfg["cinRoll"] * if (rf() < .3f * wild + .05f) (if (rf() < .5f) 1f else -1f) * (.08f + rf() * .18f) else 0f
                  if (ease < 0) ease = r.nextInt(5)
                  val np = min(8, max(5, ceil(pa.len / 45f).toInt()))
                  val px = FloatArray(np); val pz = FloatArray(np); val o = FloatArray(3)
                  for (k in 0 until np) { pa.at(k / (np - 1).toFloat(), o); px[k] = o[0]; pz[k] = o[2] }
                  var fm = if (ri == 4 || ri == 7) 1 else 0
                  if (fm == 0 && rf() < .35f * wild + .1f) fm = 3 + r.nextInt(2)
                  if (fm == 3) tag.append(" · RACK-FOCUS") else if (fm == 4) tag.append(" · FOCUS-PULL")
