                      lab.text = s.label + ": " + fmtV(s, Cfg[s.key])
                      val sb = SeekBar(this)
                      sb.max = Math.round((s.max - s.min) / s.step)
                      sb.progress = Math.round((Cfg[s.key] - s.min) / s.step)
                      sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(b: SeekBar?, p: Int, u: Boolean) {
                              if (!u) return
                              val v = s.min + p * s.step
