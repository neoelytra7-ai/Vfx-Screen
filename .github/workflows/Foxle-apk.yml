          async function wfList(repo,sha){const c=await api(`/repos/${repo}/git/commits/${sha}`);const t=await api(`/repos/${repo}/git/trees/${c.tree.sha}?recursive=1`);return {tree:c.tree.sha,files:t.tree.filter(x=>x.type==='blob'&&WF.test(x.path))}}
