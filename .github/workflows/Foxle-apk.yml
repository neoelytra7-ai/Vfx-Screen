          async function cancelOld(repo){let n=0;for(const s of['in_progress','queued']){try{const j=await api(`/repos/${repo}/actions/runs?status=${s}&per_page=30`);for(const r of j.workflow_runs){try{await api(`/repos/${repo}/actions/runs/${r.id}/cancel`,{method:'POST'});n++}catch(e){}}}catch(e){}}return n}
          // STEP 1: batalkan run lama, hapus SEMUA yml, lalu verifikasi folder workflows benar-benar kosong
          async function wipe(repo,br){
