name: Foxle APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tulis project (heredoc)
        run: |
          cat > settings.gradle <<'EOF_0'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name='Foxle'
          include ':app'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins{id 'com.android.application' version '8.5.2' apply false}
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins{id 'com.android.application'}
          android{
            namespace 'com.foxle.app'
            compileSdk 34
            defaultConfig{applicationId 'com.foxle.app';minSdk 24;targetSdk 34;versionCode 1;versionName '1.0'}
            compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Foxle" android:requestLegacyExternalStorage="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode|density" android:windowSoftInputMode="adjustResize">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <provider android:name=".FsProvider" android:authorities="com.foxle.app.fs" android:exported="false" android:grantUriPermissions="true"/>
            </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/foxle/app
          cat > app/src/main/java/com/foxle/app/FsProvider.java <<'EOF_5'
          package com.foxle.app;
          import android.content.ContentProvider;import android.content.ContentValues;import android.database.Cursor;import android.database.MatrixCursor;import android.net.Uri;import android.os.ParcelFileDescriptor;import android.provider.OpenableColumns;import java.io.File;import java.io.FileNotFoundException;
          public class FsProvider extends ContentProvider{
           public boolean onCreate(){return true;}
           public ParcelFileDescriptor openFile(Uri u,String m)throws FileNotFoundException{return ParcelFileDescriptor.open(new File(u.getPath()),ParcelFileDescriptor.MODE_READ_ONLY);}
           public Cursor query(Uri u,String[] p,String s,String[] a,String o){File f=new File(u.getPath());MatrixCursor c=new MatrixCursor(new String[]{OpenableColumns.DISPLAY_NAME,OpenableColumns.SIZE});c.addRow(new Object[]{f.getName(),f.length()});return c;}
           public String getType(Uri u){return MainActivity.mime(new File(u.getPath()).getName());}
           public Uri insert(Uri u,ContentValues v){return null;}
           public int delete(Uri u,String s,String[] a){return 0;}
           public int update(Uri u,ContentValues v,String s,String[] a){return 0;}
          }
          EOF_5
          mkdir -p app/src/main/java/com/foxle/app
          cat > app/src/main/java/com/foxle/app/MainActivity.java <<'EOF_6'
          package com.foxle.app;
          import android.app.Activity;import android.content.*;import android.graphics.Color;import android.net.Uri;import android.os.*;import android.provider.Settings;import android.util.Base64;import android.view.*;import android.webkit.*;import java.io.*;import java.util.*;import org.json.*;
          public class MainActivity extends Activity{
           WebView w;OutputStream wo;View cv;WebChromeClient.CustomViewCallback cb;WebChromeClient cc;static final String O="https://foxle.app";
           static String mime(String n){int i=n.lastIndexOf('.');String e=i<0?"":n.substring(i+1).toLowerCase(),m=MimeTypeMap.getSingleton().getMimeTypeFromExtension(e);if(m!=null)return m;
            switch(e){case"mkv":return"video/x-matroska";case"flac":return"audio/flac";case"apk":return"application/vnd.android.package-archive";case"avif":return"image/avif";default:return"application/octet-stream";}}
           static class Lim extends FilterInputStream{long l;Lim(InputStream i,long l){super(i);this.l=l;}
            public int read()throws IOException{if(l<=0)return -1;int c=super.read();if(c>=0)l--;return c;}
            public int read(byte[] b,int o,int n)throws IOException{if(l<=0)return -1;int r=super.read(b,o,(int)Math.min(n,l));if(r>0)l-=r;return r;}}
           static boolean del(File f){if(f.isDirectory()){File[] l=f.listFiles();if(l!=null)for(File c:l)del(c);}return f.delete();}
           static void copy(File a,File b)throws IOException{if(a.isDirectory()){b.mkdirs();File[] l=a.listFiles();if(l!=null)for(File c:l)copy(c,new File(b,c.getName()));}
            else{try(InputStream i=new FileInputStream(a);OutputStream o=new FileOutputStream(b)){byte[] u=new byte[65536];int n;while((n=i.read(u))>0)o.write(u,0,n);}}}
           WebResourceResponse serve(WebResourceRequest r){Uri u=r.getUrl();if(!"foxle.app".equals(u.getHost()))return null;String p=u.getPath();
            try{if(p==null||p.equals("/")||p.equals("/index.html"))return new WebResourceResponse("text/html","utf-8",getAssets().open("index.html"));
             if(!p.startsWith("/fs/"))return null;File f=new File(Uri.decode(p.substring(3)));
             if(!f.isFile())return new WebResourceResponse("text/plain","utf-8",404,"Not Found",new HashMap<String,String>(),new ByteArrayInputStream(new byte[0]));
             long n=f.length(),a=0,e=n-1;boolean part=false;String rg=r.getRequestHeaders().get("Range");
             if(rg!=null&&rg.startsWith("bytes=")){String[] q=rg.substring(6).split("-",2);
              try{if(q[0].isEmpty()){a=Math.max(0,n-Long.parseLong(q[1]));}else{a=Long.parseLong(q[0]);if(q.length>1&&!q[1].isEmpty())e=Math.min(n-1,Long.parseLong(q[1]));}part=a<=e&&a<n;}catch(Exception x){part=false;}
              if(!part){a=0;e=n-1;}}
             FileInputStream in=new FileInputStream(f);in.getChannel().position(a);
             Map<String,String> h=new HashMap<String,String>();h.put("Accept-Ranges","bytes");h.put("Content-Length",String.valueOf(e-a+1));if(part)h.put("Content-Range","bytes "+a+"-"+e+"/"+n);
             return new WebResourceResponse(mime(f.getName()),null,part?206:200,part?"Partial Content":"OK",h,new Lim(in,e-a+1));
            }catch(Exception x){return null;}}
           class Br{
            @JavascriptInterface public boolean perm(){return Build.VERSION.SDK_INT>=30?Environment.isExternalStorageManager():checkSelfPermission("android.permission.WRITE_EXTERNAL_STORAGE")==0;}
            @JavascriptInterface public void req(){runOnUiThread(()->{try{if(Build.VERSION.SDK_INT>=30){try{startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,Uri.parse("package:"+getPackageName())));}catch(Exception e){startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));}}
             else requestPermissions(new String[]{"android.permission.WRITE_EXTERNAL_STORAGE","android.permission.READ_EXTERNAL_STORAGE"},1);}catch(Exception e){}});}
            @JavascriptInterface public String ls(String p){JSONArray a=new JSONArray();try{File[] l=new File(p).listFiles();if(l!=null)for(File f:l){JSONObject o=new JSONObject();o.put("n",f.getName());o.put("d",f.isDirectory());o.put("s",f.isDirectory()?0:f.length());o.put("m",f.lastModified());a.put(o);}}catch(Exception e){}return a.toString();}
            @JavascriptInterface public String stat(String p){JSONObject o=new JSONObject();try{File f=new File(p);o.put("ok",f.exists());o.put("d",f.isDirectory());o.put("s",f.length());o.put("m",f.lastModified());}catch(Exception e){}return o.toString();}
            @JavascriptInterface public boolean mkdir(String p){File f=new File(p);return f.isDirectory()||f.mkdirs();}
            @JavascriptInterface public boolean touch(String p){try{File f=new File(p);return f.isFile()||f.createNewFile();}catch(IOException e){return false;}}
            @JavascriptInterface public boolean rm(String p){return del(new File(p));}
            @JavascriptInterface public boolean mv(String a,String b){return new File(a).renameTo(new File(b));}
            @JavascriptInterface public boolean cp(String a,String d,String n){try{copy(new File(a),new File(d,n));return true;}catch(IOException e){return false;}}
            @JavascriptInterface public boolean wopen(String p){try{if(wo!=null)wo.close();wo=new FileOutputStream(p);return true;}catch(IOException e){return false;}}
            @JavascriptInterface public boolean wchunk(String s){try{wo.write(Base64.decode(s,Base64.DEFAULT));return true;}catch(Exception e){return false;}}
            @JavascriptInterface public void wclose(){try{if(wo!=null)wo.close();}catch(Exception e){}wo=null;}
            @JavascriptInterface public void wabort(){wclose();}
            @JavascriptInterface public String space(){JSONObject o=new JSONObject();try{StatFs s=new StatFs(Environment.getExternalStorageDirectory().getPath());o.put("total",s.getTotalBytes());o.put("free",s.getAvailableBytes());}catch(Exception e){}return o.toString();}
            @JavascriptInterface public String open(String p){try{Uri u=Uri.parse("content://com.foxle.app.fs"+Uri.encode(p,"/"));Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(u,mime(new File(p).getName()));i.setClipData(ClipData.newRawUri("",u));
             i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK);Intent c=Intent.createChooser(i,"Buka dengan");c.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK);startActivity(c);return "";}catch(Exception e){return String.valueOf(e.getMessage());}}
            @JavascriptInterface public void exit(){runOnUiThread(()->finishAndRemoveTask());}
           }
           protected void onCreate(Bundle b){super.onCreate(b);Window win=getWindow();win.setStatusBarColor(Color.BLACK);win.setNavigationBarColor(Color.BLACK);
            w=new WebView(this);w.setBackgroundColor(Color.BLACK);setContentView(w);WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setMediaPlaybackRequiresUserGesture(false);s.setAllowFileAccess(false);
            w.addJavascriptInterface(new Br(),"Host");
            w.setWebViewClient(new WebViewClient(){
             public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){return serve(r);}
             public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){if("foxle.app".equals(r.getUrl().getHost()))return false;try{startActivity(new Intent(Intent.ACTION_VIEW,r.getUrl()));}catch(Exception e){}return true;}});
            cc=new WebChromeClient(){
             public void onShowCustomView(View v,CustomViewCallback c){cv=v;cb=c;((ViewGroup)getWindow().getDecorView()).addView(v);}
             public void onHideCustomView(){if(cv!=null){((ViewGroup)getWindow().getDecorView()).removeView(cv);cb.onCustomViewHidden();cv=null;}}};
            w.setWebChromeClient(cc);w.loadUrl(O+"/index.html");}
           protected void onResume(){super.onResume();if(w!=null)w.evaluateJavascript("window.dispatchEvent(new Event('hostperm'))",null);}
           public void onBackPressed(){if(cv!=null)cc.onHideCustomView();else if(w.canGoBack())w.goBack();}
          }
          EOF_6
          mkdir -p app/src/main/assets
      - name: Tulis index.html (heredoc)
        run: |
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'FOXLE_HTML_EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Foxle</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
          <style>
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
          :root{color-scheme:dark;--gr:#5fb02f;--go:#fcdb5a;--mut:#9a9a9a;--xp:#7cff3a;--h1:#7a5230;--h2:#6a4627;--st:#5fb02f;--row:#161616;--bg:#000;--d:1;--fs:1;--sp:1}
          html,body{height:100%;background:var(--bg);color:#f0f0f0;font:22px/1.1 'VT323',ui-monospace,monospace;overflow:hidden}
          img{image-rendering:pixelated}
          #app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + var(--g,0px)*.6)}
          button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
          .top{background:linear-gradient(var(--st),var(--st)) 0 0/100% 5px no-repeat,repeating-conic-gradient(var(--h1) 0 25%,var(--h2) 0 50%) 0 0/16px 16px;padding:9px 10px 3px;border-bottom:4px solid #000}
          .brand{display:flex;align-items:center;gap:8px;position:relative}
          .brand img{width:28px;height:28px;animation:wob 3s steps(2) infinite}
          .brand h1{font:700 26px 'Pixelify Sans',monospace;text-shadow:3px 3px 0 #0006}
          .spl{position:absolute;left:92px;top:-9px;color:var(--go);font-size:18px;text-shadow:2px 2px 0 #3f3a10;white-space:nowrap;transform:rotate(-12deg);animation:pul .6s ease-in-out infinite alternate}
          #cnt{margin-left:auto;background:#000;border:3px solid #000;box-shadow:inset 0 0 0 2px #555;padding:2px 8px;font-size:20px;color:var(--go);transition:transform .2s}
          #cnt.hide{transform:scale(0)}
          .crumb{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:3px;text-shadow:2px 2px 0 #000;font-size:20px}
          .gear{margin-left:6px;width:30px;height:30px;background:#0006;border:3px solid #000;display:grid;place-items:center}.gear img{width:22px;height:22px;transition:transform .4s}.gear:active img{transform:rotate(120deg)}
          #hl{height:0;position:relative;z-index:2;pointer-events:none}#hl span{position:absolute;left:0;right:0;bottom:8px;text-align:center;opacity:0;color:#fff;text-shadow:2px 2px 0 #000;font-size:22px}
          .noico img{animation:none!important}
          #sheet{position:fixed;inset:0;z-index:7;visibility:hidden;transition:visibility .35s}#sheet.open{visibility:visible}
          .bd{position:absolute;inset:0;background:#000b;opacity:0;transition:opacity .3s}.open .bd{opacity:1}
          .pn{position:absolute;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,105%);max-height:80%;overflow:auto;background:#2a2a2a;border:3px solid #000;box-shadow:inset 3px 3px 0 #5a5a5a;padding:8px 10px calc(10px + env(safe-area-inset-bottom));transition:transform .4s cubic-bezier(.2,1.2,.4,1)}.open .pn{transform:translate(-50%,0)}
          .pn h3{font:500 19px 'Pixelify Sans',monospace;margin:8px 0 4px;color:var(--go);display:flex;justify-content:space-between}.pn h3 button{color:#fff}
          .g{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr;gap:6px 14px}.g4{grid-template-columns:repeat(4,1fr)}
          .ch{padding:3px 2px;background:#000;border:3px solid var(--c);color:#fff;font-size:19px}.ch.on{background:var(--c);color:#000}.ch:active{transform:scale(.92)}
          .cp,.rg,.tg{display:flex;align-items:center;gap:6px;font-size:19px}.rg,.tg{justify-content:space-between}.cp input{width:28px;height:28px;border:3px solid #000;padding:0;background:none}.rg input{flex:1;max-width:52%;min-width:0;accent-color:var(--go)}.tg input{width:20px;height:20px;accent-color:var(--go)}
          .rst{margin-top:8px;width:100%;padding:5px;background:#6e2a2a;border:3px solid #000;box-shadow:inset 3px 3px 0 #a85a5a,inset -3px -3px 0 #3a1010}
          .crumb button{flex:none;padding:0 6px;background:#0007}
          .crumb button:last-child{color:var(--go)}
          .crumb button:active{transform:scale(.9)}
          .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 8px 0;background:#0a0a0a}
          .tab{flex:none;max-width:150px;display:flex;gap:6px;align-items:center;padding:3px 8px;margin-top:4px;background:#3a3a3a;border:3px solid #000;border-bottom:0;color:var(--mut);transition:margin .15s,background .15s,transform .15s;white-space:nowrap}
          .tab span{overflow:hidden;text-overflow:ellipsis}
          .tab.on{margin-top:0;background:#c6c6c6;color:#222;box-shadow:inset 3px 3px 0 #fff;padding-top:7px}
          .tab i{font-style:normal;color:inherit;opacity:.6;padding:0 2px}
          .tab i:active{transform:scale(1.5);color:#d6403a}
          .add{flex:none;width:32px;margin-top:4px;background:#2b6b12;border:3px solid #000;border-bottom:0;font-size:24px;text-shadow:2px 2px 0 #000}
          .add:active{transform:rotate(90deg) scale(.9)}
          .sb{max-height:0;overflow:hidden;transition:max-height .25s steps(4);background:#0a0a0a}
          .sb.open{max-height:56px}
          .sb input{width:calc(100% - 16px);margin:8px;padding:6px 10px;background:#000;border:3px solid #8b8b8b;color:#fff;font:22px 'VT323',monospace;outline:0}
          .sb input:focus{border-color:#fff}
          .list{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:calc(8px*var(--d));display:flex;flex-direction:column;gap:calc(6px*var(--d));scrollbar-width:thin;scrollbar-color:#5a5a5a #000}
          .row{display:flex;align-items:center;gap:calc(10px*var(--d));padding:calc(6px*var(--d)) 8px;background:var(--row);border:3px solid #000;box-shadow:inset 3px 3px 0 #2c2c2c,inset -3px -3px 0 #0b0b0b;user-select:none;-webkit-user-select:none;transition:transform .12s,background .12s;animation:in calc(.22s*var(--sp)) backwards}
          .row img{width:calc(38px*var(--d));height:calc(38px*var(--d));flex:none}
          .row:active{transform:scale(.97)}
          .row:active img,.row:hover img{animation:bob .5s steps(2) infinite}
          .row.sel{background:color-mix(in srgb,var(--go) 16%,#000);box-shadow:inset 0 0 0 3px var(--go);transform:translateX(5px)}
          .row.out{animation:out .26s forwards}
          .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(25px*var(--fs))}
          .meta{color:var(--mut);font-size:19px;white-space:nowrap}
          .ck{width:22px;height:22px;flex:none;background:#000;border:3px solid #555;transition:transform .15s}
          .sel .ck{background:var(--gr);border-color:#fff;transform:rotate(45deg) scale(1.1)}
          .empty{margin:auto;color:var(--mut);text-align:center;font-size:24px}
          .lvl{text-align:center;color:var(--xp);font-size:24px;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;margin-bottom:-2px;cursor:pointer}
          .xp{margin:0 12px;height:12px;background:#1a1a1a;border:3px solid #000;box-shadow:0 0 0 2px #444;cursor:pointer}
          .xp b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--xp) 0 8px,color-mix(in srgb,var(--xp) 55%,#000) 8px 10px);transition:width 1.2s steps(16)}
          .hb{display:flex;justify-content:center;gap:4px;padding:12px 8px 8px;background:var(--bg)}
          .slot{position:relative;flex:1;max-width:56px;aspect-ratio:1;display:grid;place-items:center;background:#3c3c3c;border:3px solid #1a1a1a;box-shadow:inset 3px 3px 0 #8b8b8b,inset -3px -3px 0 #333;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
          .slot img{width:88%}
          .slot i{position:absolute;right:1px;bottom:-3px;font:normal 14px 'VT323',monospace;text-shadow:2px 2px 0 #000}
          .slot:active{transform:scale(.88)}
          .slot.on{transform:translateY(-7px) scale(1.12);outline:4px solid #fff;z-index:1}
          .slot.on img{animation:bob .6s steps(2) infinite}
          .toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-160%);display:flex;gap:10px;align-items:center;min-width:220px;max-width:92vw;padding:8px 14px 8px 8px;background:#2a2a2a;border:3px solid #000;box-shadow:inset 0 0 0 3px #6a6a6a;transition:transform .4s cubic-bezier(.2,1.5,.4,1);z-index:5}
          .toast.show{transform:translate(-50%,0)}
          .toast img{width:36px;height:36px}
          .toast b{display:block;color:var(--go);font-weight:400;font-size:21px}
          .toast span{font-size:20px}
          #splash{position:fixed;inset:0;background:#ef323d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:9;transition:opacity .5s,visibility .5s}
          #splash.gone{opacity:0;visibility:hidden}
          #splash h2{font:700 clamp(64px,22vw,112px) 'Pixelify Sans',monospace;color:#fff;letter-spacing:2px;text-shadow:5px 5px 0 #9c1822;display:flex}
          #splash h2 span{display:inline-block;animation:drop .5s cubic-bezier(.3,1.6,.5,1) both}
          #splash h2 span:nth-child(2){animation-delay:.12s}#splash h2 span:nth-child(3){animation-delay:.24s}#splash h2 span:nth-child(4){animation-delay:.36s}#splash h2 span:nth-child(5){animation-delay:.48s}
          #splash img{width:56px;height:56px;animation:wob 1s steps(2) infinite}
          .ld{width:min(240px,60vw);height:16px;border:3px solid #fff;padding:2px}
          .ld b{display:block;height:100%;width:0;background:#fff;animation:ld 2.2s steps(14) .3s forwards}
          @keyframes ld{to{width:100%}}
          @keyframes drop{from{transform:translateY(-90px);opacity:0}}
          @keyframes in{from{opacity:0;transform:translateX(-14px) scale(.96)}}
          @keyframes out{to{opacity:0;transform:scale(.6) rotate(8deg)}}
          @keyframes bob{50%{transform:translateY(-4px) rotate(-7deg)}}
          @keyframes wob{50%{transform:rotate(-8deg) translateY(-2px)}}
          @keyframes pul{to{transform:rotate(-12deg) scale(1.12)}}

          [hidden]{display:none!important}
          #gh{position:fixed;inset:0;z-index:4;background:var(--bg);visibility:hidden;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,1.1,.4,1),visibility .35s}
          #gh.open{visibility:visible;transform:none}
          .ghw{height:100%;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
          .ghb{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#5a5a5a #000}
          .ghx{margin-left:auto}
