# Simpan sebagai: .github/workflows/rootrec.yml
# Jalankan: Actions > "Build RootRec" > Run workflow (atau push file ini ke main)
# Update APK: run ulang workflow -> versionCode naik otomatis (run_number),
#             signing key stabil -> APK baru bisa di-install menimpa yang lama.
# Opsional (disarankan): set secrets KEYSTORE_B64, KS_PASS, KS_ALIAS supaya key
#             tidak bergantung pada cache GitHub (cache bisa expire).
#             base64 -w0 rr.jks  -> simpan sebagai secret KEYSTORE_B64

name: Build RootRec

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  KS_PASS: ${{ secrets.KS_PASS || 'rootrec-ci' }}
  KS_ALIAS: ${{ secrets.KS_ALIAS || 'rr' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore keystore cache
        uses: actions/cache@v4
        with:
          path: ~/ks
          key: rr-keystore-v1

      - name: Keystore (stabil supaya APK bisa di-update)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/ks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/ks/rr.jks"
          elif [ ! -f "$HOME/ks/rr.jks" ]; then
            keytool -genkeypair -keystore "$HOME/ks/rr.jks" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=RootRec"
          fi
          echo "KS_PATH=$HOME/ks/rr.jks" >> "$GITHUB_ENV"

      - name: Generate project (heredoc)
        run: |
          mkdir -p rr/app/src/main/java/com/rootrec
          cd rr

          cat > settings.gradle <<'GRADLE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'RootRec'
          include ':app'
          GRADLE_EOF

          cat > build.gradle <<'GRADLE_EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          GRADLE_EOF

          cat > gradle.properties <<'GRADLE_EOF'
          org.gradle.jvmargs=-Xmx2g
          GRADLE_EOF

          cat > app/build.gradle <<'GRADLE_EOF'
          plugins { id 'com.android.application' }

          def ci = System.getenv()

          android {
              namespace 'com.rootrec'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.rootrec'
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(ci['GITHUB_RUN_NUMBER'] ?: '1')
                  versionName "1." + (ci['GITHUB_RUN_NUMBER'] ?: '0')
                  buildConfigField 'String', 'REPO', '"' + (ci['GITHUB_REPOSITORY'] ?: '') + '"'
              }
              buildFeatures { buildConfig true }
              signingConfigs {
                  release {
                      storeFile file(ci['KS_PATH'] ?: 'none.jks')
                      storePassword ci['KS_PASS']
                      keyAlias ci['KS_ALIAS'] ?: 'rr'
                      keyPassword ci['KS_PASS']
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          GRADLE_EOF

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="RootRec"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          cat > app/src/main/java/com/rootrec/MainActivity.java <<'JAVA_EOF'
          package com.rootrec;

          import android.app.Activity;
          import android.content.Intent;
          import android.media.MediaCodecInfo;
          import android.media.MediaCodecList;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              static final String STOP = "/data/local/tmp/rr.stop";
              static final String LOG = "/data/local/tmp/rr.log";
              final Handler ui = new Handler(Looper.getMainLooper());
              final List<String> mimes = new ArrayList<>();
              final List<String> names = new ArrayList<>();
              final List<String> labels = new ArrayList<>();
              LinearLayout root;
              Spinner engine, codec;
              EditText size, mbps, fps, seg, disp, dir, extra;
              CheckBox secure;
              TextView out;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  loadEncoders();
                  ScrollView sv = new ScrollView(this);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int p = (int) (16 * getResources().getDisplayMetrics().density);
                  root.setPadding(p, p * 2, p, p);
                  sv.addView(root);
                  setContentView(sv);

                  text("RootRec v" + BuildConfig.VERSION_NAME);
                  engine = spinner("Engine", new String[]{
                          "screenrecord bawaan (AVC only)",
                          "Server root + MediaCodec (HEVC/AVC)"});
                  engine.setSelection(1);
                  codec = spinner("Codec / encoder", labels.toArray(new String[0]));
                  size = field("Resolusi WxH (kosong = native)", "", false);
                  mbps = field("Bitrate (Mbps)", "20", true);
                  fps = field("FPS maks (engine Server)", "60", true);
                  seg = field("Panjang segmen detik (0 = 1 file; screenrecord maks 180)", "180", true);
                  disp = field("Display ID (kosong = default)", "", true);
                  dir = field("Folder output", "/sdcard/Movies/RootRec", false);
                  extra = field("Extra. Server: mode=cbr|vbr kf=2 limit=600. screenrecord: flag mentah", "", false);
                  secure = new CheckBox(this);
                  secure.setText("Secure display (ikut layer FLAG_SECURE, engine Server)");
                  secure.setChecked(true);
                  root.addView(secure);
                  button("START", v -> start());
                  button("STOP", v -> stop());
                  button("PROBE (cek device)", v -> probe());
                  button("CEK UPDATE", v -> startActivity(new Intent(Intent.ACTION_VIEW,
                          Uri.parse("https://github.com/" + BuildConfig.REPO + "/releases/latest"))));
                  out = text("");
                  out.setTextIsSelectable(true);
              }

              TextView text(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setPadding(0, 12, 0, 4);
                  root.addView(t);
                  return t;
              }

              Spinner spinner(String label, String[] items) {
                  text(label);
                  Spinner s = new Spinner(this);
                  s.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, items));
                  root.addView(s);
                  return s;
              }

              EditText field(String label, String def, boolean num) {
                  text(label);
                  EditText e = new EditText(this);
                  e.setText(def);
                  e.setSingleLine(true);
                  if (num) e.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  root.addView(e);
                  return e;
              }

              void button(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setOnClickListener(l);
                  root.addView(b);
              }

              void loadEncoders() {
                  mimes.add("video/hevc"); names.add(""); labels.add("HEVC (auto)");
                  mimes.add("video/avc"); names.add(""); labels.add("AVC (auto)");
                  for (MediaCodecInfo i : new MediaCodecList(MediaCodecList.ALL_CODECS).getCodecInfos()) {
                      if (!i.isEncoder()) continue;
                      for (String t : i.getSupportedTypes()) {
                          String m = t.toLowerCase();
                          if (m.equals("video/hevc") || m.equals("video/avc")) {
                              mimes.add(m);
                              names.add(i.getName());
                              labels.add((m.endsWith("hevc") ? "HEVC | " : "AVC | ") + i.getName());
                          }
                      }
                  }
              }

              String sh(String cmd) {
                  try {
                      Process p = new ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start();
                      BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      StringBuilder sb = new StringBuilder();
                      String l;
                      while ((l = r.readLine()) != null) sb.append(l).append('\n');
                      p.waitFor();
                      return sb.toString();
                  } catch (Exception e) {
                      return "ERR (root tidak tersedia?): " + e + "\n";
                  }
              }

              void async(final String cmd, final String prefix) {
                  new Thread(() -> {
                      String r = sh(cmd);
                      ui.post(() -> out.setText(prefix + r));
                  }).start();
              }

              void tailLater() {
                  ui.postDelayed(() -> async("tail -n 15 " + LOG, "Log:\n"), 2500);
              }

              void start() {
                  int e = engine.getSelectedItemPosition();
                  int c = codec.getSelectedItemPosition();
                  String mime = mimes.get(c), name = names.get(c);
                  String o = dir.getText().toString().trim();
                  String sz = size.getText().toString().trim();
                  String ex = extra.getText().toString().trim();
                  String d = disp.getText().toString().trim();
                  long br;
                  int sg, fp;
                  try {
                      br = (long) (Double.parseDouble(mbps.getText().toString().trim()) * 1000000);
                      sg = Integer.parseInt(seg.getText().toString().trim());
                      fp = Integer.parseInt(fps.getText().toString().trim());
                  } catch (Exception x) {
                      out.setText("Angka tidak valid");
                      return;
                  }
                  if (o.isEmpty() || o.contains("'")) { out.setText("Folder output tidak valid"); return; }
                  if (!sz.isEmpty() && !sz.matches("\\d+x\\d+")) { out.setText("Resolusi harus WxH"); return; }

                  if (e == 0) {
                      if (mime.equals("video/hevc")) {
                          out.setText("screenrecord bawaan hard-code AVC. Pakai engine Server untuk HEVC.");
                          return;
                      }
                      StringBuilder a = new StringBuilder();
                      if (!sz.isEmpty()) a.append(" --size ").append(sz);
                      a.append(" --bit-rate ").append(br);
                      a.append(" --time-limit ").append(Math.max(1, Math.min(sg == 0 ? 180 : sg, 180)));
                      if (!d.isEmpty()) a.append(" --display-id ").append(d);
                      if (!name.isEmpty()) a.append(" --codec-name ").append(name);
                      if (!ex.isEmpty()) a.append(' ').append(ex);
                      String sc = "S=" + STOP + "; L=" + LOG + "\n"
                              + "rm -f $S; mkdir -p '" + o + "'; : > $L\n"
                              + "f=0\n"
                              + "while [ ! -f $S ]; do\n"
                              + "  t=$(date +%s)\n"
                              + "  screenrecord" + a + " '" + o + "/rec_'$(date +%Y%m%d_%H%M%S)'.mp4' >>$L 2>&1\n"
                              + "  if [ $(( $(date +%s) - t )) -lt 3 ]; then f=$((f+1)); else f=0; fi\n"
                              + "  [ $f -ge 3 ] && break\n"
                              + "done\n"
                              + "echo done >>$L\n";
                      File f = new File(getFilesDir(), "rr.sh");
                      try {
                          FileWriter w = new FileWriter(f);
                          w.write(sc);
                          w.close();
                      } catch (Exception x) {
                          out.setText("Gagal tulis script: " + x);
                          return;
                      }
                      async("nohup sh " + f.getAbsolutePath() + " >/dev/null 2>&1 </dev/null &",
                              "screenrecord loop jalan...\n");
                  } else {
                      String args = "out='" + o + "' stop=" + STOP + " mime=" + mime
                              + " br=" + br + " fps=" + fp + " seg=" + sg
                              + " secure=" + (secure.isChecked() ? 1 : 0)
                              + (sz.isEmpty() ? "" : " size=" + sz)
                              + (name.isEmpty() ? "" : " codec=" + name)
                              + (d.isEmpty() ? "" : " display=" + d)
                              + (ex.isEmpty() ? "" : " " + ex);
                      String apk = getApplicationInfo().sourceDir;
                      async("rm -f " + STOP + "; : > " + LOG + "; CLASSPATH=" + apk
                              + " nohup app_process /system/bin com.rootrec.Server " + args
                              + " >>" + LOG + " 2>&1 </dev/null &", "Server dijalankan...\n");
                  }
                  tailLater();
              }

              void stop() {
                  async("touch " + STOP + "; pkill -2 -x screenrecord; sleep 2; tail -n 12 " + LOG,
                          "Stop dikirim.\n");
              }

              void probe() {
                  final StringBuilder sb = new StringBuilder("Encoder terdeteksi:\n");
                  for (String l : labels) sb.append("  ").append(l).append('\n');
                  sb.append('\n');
                  async("id; getprop ro.product.model; getprop ro.build.version.release; "
                          + "getprop ro.build.version.sdk; echo; screenrecord --help 2>&1 | head -40",
                          sb.toString());
              }
          }
          JAVA_EOF

          cat > app/src/main/java/com/rootrec/Server.java <<'JAVA_EOF'
          package com.rootrec;

          import android.graphics.Rect;
          import android.media.MediaCodec;
          import android.media.MediaCodecInfo;
          import android.media.MediaFormat;
          import android.media.MediaMuxer;
          import android.os.IBinder;
          import android.view.Surface;
          import java.io.File;
          import java.nio.ByteBuffer;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          /** Dijalankan sebagai root lewat app_process. Capture layar -> MediaCodec (HEVC/AVC) -> MP4. */
          public class Server {
              static final Map<String, String> kv = new HashMap<>();
              static MediaMuxer mux;
              static int track;
              static String dir, tag;

              static String g(String k, String d) {
                  String v = kv.get(k);
                  return (v == null || v.isEmpty()) ? d : v;
              }

              static void newMux(MediaFormat fmt) throws Exception {
                  String name = dir + "/rec_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date())
                          + "_" + tag + ".mp4";
                  mux = new MediaMuxer(name, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4);
                  track = mux.addTrack(fmt);
                  mux.start();
                  System.out.println("FILE " + name);
              }

              public static void main(String[] args) {
                  try {
                      run(args);
                  } catch (Throwable t) {
                      System.out.println("FATAL: " + t);
                      t.printStackTrace(System.out);
                      System.out.println("Kalau NoSuchMethod/SecurityException: API SurfaceControl di ROM ini beda "
                              + "(umum di Android 14+). Pakai engine screenrecord (AVC) sebagai gantinya.");
                  }
              }

              static void run(String[] args) throws Exception {
                  for (String a : args) {
                      int i = a.indexOf('=');
                      if (i > 0) kv.put(a.substring(0, i), a.substring(i + 1));
                  }
                  dir = g("out", "/sdcard/Movies/RootRec");
                  String stop = g("stop", "/data/local/tmp/rr.stop");
                  String mime = g("mime", "video/hevc");
                  String codec = g("codec", "");
                  int bitrate = Integer.parseInt(g("br", "20000000"));
                  int fps = Integer.parseInt(g("fps", "60"));
                  int seg = Integer.parseInt(g("seg", "0"));
                  int limit = Integer.parseInt(g("limit", "0"));
                  int displayId = Integer.parseInt(g("display", "0"));
                  boolean secure = g("secure", "1").equals("1");
                  tag = mime.endsWith("hevc") ? "hevc" : "avc";
                  new File(dir).mkdirs();

                  // Info display (hidden API via reflection)
                  Object dmg = Class.forName("android.hardware.display.DisplayManagerGlobal")
                          .getMethod("getInstance").invoke(null);
                  Object info = dmg.getClass().getMethod("getDisplayInfo", int.class).invoke(dmg, displayId);
                  int dw = info.getClass().getField("logicalWidth").getInt(info);
                  int dh = info.getClass().getField("logicalHeight").getInt(info);
                  int layerStack = info.getClass().getField("layerStack").getInt(info);

                  int w = dw, h = dh;
                  String sz = g("size", "");
                  if (!sz.isEmpty()) {
                      String[] p = sz.split("x");
                      w = Integer.parseInt(p[0]);
                      h = Integer.parseInt(p[1]);
                  }
                  w &= ~7;
                  h &= ~7;
                  System.out.println("START mime=" + mime + " " + w + "x" + h + " br=" + bitrate
                          + " fps=" + fps + " secure=" + secure + " codec=" + (codec.isEmpty() ? "auto" : codec));

                  MediaFormat f = MediaFormat.createVideoFormat(mime, w, h);
                  f.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                  f.setInteger(MediaFormat.KEY_BIT_RATE, bitrate);
                  f.setInteger(MediaFormat.KEY_FRAME_RATE, fps);
                  f.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, Integer.parseInt(g("kf", "2")));
                  f.setLong("repeat-previous-frame-after", 100000L);
                  String mode = g("mode", "");
                  if (mode.equals("cbr")) {
                      f.setInteger(MediaFormat.KEY_BITRATE_MODE, MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_CBR);
                  } else if (mode.equals("vbr")) {
                      f.setInteger(MediaFormat.KEY_BITRATE_MODE, MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR);
                  }

                  MediaCodec enc = codec.isEmpty() ? MediaCodec.createEncoderByType(mime)
                          : MediaCodec.createByCodecName(codec);
                  enc.configure(f, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                  Surface surface = enc.createInputSurface();
                  enc.start();

                  // Mirror layar ke surface encoder. secure=true -> layer FLAG_SECURE ikut ter-capture (butuh root).
                  Class<?> sc = Class.forName("android.view.SurfaceControl");
                  IBinder disp = (IBinder) sc.getMethod("createDisplay", String.class, boolean.class)
                          .invoke(null, "rootrec", secure);
                  sc.getMethod("openTransaction").invoke(null);
                  try {
                      sc.getMethod("setDisplaySurface", IBinder.class, Surface.class).invoke(null, disp, surface);
                      sc.getMethod("setDisplayProjection", IBinder.class, int.class, Rect.class, Rect.class)
                              .invoke(null, disp, 0, new Rect(0, 0, dw, dh), new Rect(0, 0, w, h));
                      sc.getMethod("setDisplayLayerStack", IBinder.class, int.class).invoke(null, disp, layerStack);
                  } finally {
                      sc.getMethod("closeTransaction").invoke(null);
                  }

                  MediaCodec.BufferInfo bi = new MediaCodec.BufferInfo();
                  File stopFile = new File(stop);
                  long t0 = System.currentTimeMillis();
                  long segStartUs = -1;
                  boolean stopping = false, eos = false;
                  try {
                      while (!eos) {
                          if (!stopping && (stopFile.exists()
                                  || (limit > 0 && System.currentTimeMillis() - t0 > limit * 1000L))) {
                              enc.signalEndOfInputStream();
                              stopping = true;
                          }
                          int idx = enc.dequeueOutputBuffer(bi, 100000);
                          if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              newMux(enc.getOutputFormat());
                          } else if (idx >= 0) {
                              ByteBuffer buf = enc.getOutputBuffer(idx);
                              boolean cfg = (bi.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0;
                              if (!cfg && bi.size > 0 && mux != null && buf != null) {
                                  boolean key = (bi.flags & MediaCodec.BUFFER_FLAG_KEY_FRAME) != 0;
                                  if (seg > 0 && key && segStartUs >= 0
                                          && bi.presentationTimeUs - segStartUs >= seg * 1000000L) {
                                      mux.stop();
                                      mux.release();
                                      newMux(enc.getOutputFormat());
                                      segStartUs = bi.presentationTimeUs;
                                  }
                                  if (segStartUs < 0) segStartUs = bi.presentationTimeUs;
                                  buf.position(bi.offset);
                                  buf.limit(bi.offset + bi.size);
                                  mux.writeSampleData(track, buf, bi);
                              }
                              enc.releaseOutputBuffer(idx, false);
                              if ((bi.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) eos = true;
                          }
                      }
                  } finally {
                      try { enc.stop(); enc.release(); } catch (Throwable ignored) { }
                      try { if (mux != null) { mux.stop(); mux.release(); } } catch (Throwable ignored) { }
                      try { sc.getMethod("destroyDisplay", IBinder.class).invoke(null, disp); } catch (Throwable ignored) { }
                      System.out.println("DONE");
                  }
              }
          }
          JAVA_EOF

      - name: Build APK
        working-directory: rr
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp rr/app/build/outputs/apk/release/app-release.apk "RootRec-v1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RootRec-apk
          path: RootRec-v1.${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: RootRec v1.${{ github.run_number }}
          files: RootRec-v1.${{ github.run_number }}.apk
          make_latest: true
