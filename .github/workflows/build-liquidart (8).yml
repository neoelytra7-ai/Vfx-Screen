           // ---- lasso: tool 3 fills/erases the shape instantly; tool 4 builds a selection mask (brush + liquify are clipped to it) ----
           fun up(f:FloatArray){val fbuf=ByteBuffer.allocateDirect(f.size*4).order(ByteOrder.nativeOrder()).asFloatBuffer();fbuf.put(f);fbuf.position(0)
