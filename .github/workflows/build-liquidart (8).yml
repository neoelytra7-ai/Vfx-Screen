             if(hypot(cx-sx0,cy-sy0)>14f||abs(d-sd0)>14f)tapMoved=true
             if(a==MotionEvent.ACTION_POINTER_UP){if(!tapMoved&&e.eventTime-tapT<260){if(maxP>=3)Cur.q{Cur.r?.redo()} else Cur.q{Cur.r?.undo()}};g=false;return true}
