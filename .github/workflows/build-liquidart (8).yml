           fun fillColor(){val c=Cur.col();G.glUniform3f(G.glGetUniformLocation(pfl,"uCol"),Color.red(c)/255f,Color.green(c)/255f,Color.blue(c)/255f)}
           fun lassoFill(erase:Boolean){val L=cur()?:return;if(lpts.size<6)return;if(L.has)bake(L);ensure(L)
            var x0=1e9f;var y0=1e9f;var x1=-1e9f;var y1=-1e9f;var i=0
