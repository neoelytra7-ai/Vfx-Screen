            return floatArrayOf(c*vx+s*vy+h,-s*vx+c*vy+h)}
           fun pt(k:Int,e:MotionEvent,h:Int){
            val x=if(h<0)e.x else e.getHistoricalX(h);val y=if(h<0)e.y else e.getHistoricalY(h)
            val st=e.getToolType(0)==MotionEvent.TOOL_TYPE_STYLUS
