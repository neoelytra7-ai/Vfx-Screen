             2->{if(!st)return;walk(x,y,p,t);flush();cur()?.let{commit(it)};psb=sb.copyOf();st=false}}}
           fun walk(nx:Float,ny:Float,p:Float,t:Float){
            val dx=nx-lx;val dy=ny-ly;val d=hypot(dx,dy);if(d<1e-3f)return;dir=Math.toDegrees(atan2(dy,dx).toDouble()).toFloat()
            val sp=max(.5f,g("spacing")*g("size"));var s=sp-carry
            while(s<=d){dab(lx+dx/d*s,ly+dy/d*s,p,t);s+=sp}
            carry=d-(s-sp);path+=d;lx=nx;ly=ny}
           fun dab(x:Float,y:Float,p:Float,t:Float){
