          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import kotlin.math.*

          class MainActivity:ComponentActivity(),SensorEventListener{
           override fun onCreate(s:Bundle?){super.onCreate(s);ld("th",Cur.th);ld("br",Cur.b);ld("pos",Cur.pos,true)
            Cur.dir=java.io.File(cacheDir,"hist").apply{deleteRecursively();mkdirs()}
            WindowCompat.setDecorFitsSystemWindows(window,false)
            WindowInsetsControllerCompat(window,window.decorView).apply{hide(WindowInsetsCompat.Type.systemBars());systemBarsBehavior=WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE}
            window.attributes=window.attributes.apply{layoutInDisplayCutoutMode=WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;preferredRefreshRate=120f}
            val cf=java.io.File(filesDir,"crash.txt")
            Thread.setDefaultUncaughtExceptionHandler{_,e->try{cf.writeText(e.stackTraceToString().take(6000))}catch(_:Throwable){};android.os.Process.killProcess(android.os.Process.myPid())}
            setContent{var err by remember{mutableStateOf<String?>(if(cf.exists())cf.readText() else null)}
             val m=err
             if(m!=null)Column(Modifier.fillMaxSize().background(Color.Black).padding(16.dp).verticalScroll(rememberScrollState())){
              Text("Crash report - screenshot this:",color=Color.White,fontSize=16.sp);Text(m,color=Color.White,fontSize=10.sp);Text("[ tap here to continue ]",color=Color.White,fontSize=16.sp,modifier=Modifier.clickable{cf.delete();err=null}.padding(20.dp))}
             else App()}}
           fun ld(n:String,m:MutableMap<String,Float>,all:Boolean=false){getSharedPreferences("liquid",0).getString(n,"")?.split(";")?.forEach{val p=it.split("=");val v=if(p.size==2)p[1].toFloatOrNull() else null;if(v!=null&&(all||m.containsKey(p[0]))){m[p[0]]=v}}}
           fun sv(n:String,m:Map<String,Float>){getSharedPreferences("liquid",0).edit().putString(n,m.entries.joinToString(";"){"${it.key}=${it.value}"}).apply()}
           override fun onResume(){super.onResume();(getSystemService(SENSOR_SERVICE) as SensorManager).let{it.registerListener(this,it.getDefaultSensor(Sensor.TYPE_ACCELEROMETER),SensorManager.SENSOR_DELAY_GAME)}}
           override fun onPause(){super.onPause();sv("th",Cur.th);sv("br",Cur.b);sv("pos",Cur.pos);(getSystemService(SENSOR_SERVICE) as SensorManager).unregisterListener(this)}
           override fun onSensorChanged(e:SensorEvent){val nx=Cur.lx+(-e.values[0]/9.8f-Cur.lx)*.1f;val ny=Cur.ly+(-e.values[1]/9.8f-Cur.ly)*.1f;val ch=abs(nx-Cur.lx)+abs(ny-Cur.ly);Cur.lx=nx;Cur.ly=ny;if(ch>.004f&&Glass.m.isNotEmpty())Cur.rq()}
           override fun onAccuracyChanged(s:Sensor?,a:Int){}}

          val LocalInk=compositionLocalOf{Color.White}
          @Composable fun T(s:String,sz:Int=13,m:Modifier=Modifier)=Text(s,m,color=LocalInk.current,fontSize=sz.sp)

          // ---- procedural icons: everything is drawn from paths; `on` (0..1) animates the shape, Cur.ph drives continuous motion ----
          @Composable fun Ico(k:String,on:Float,ink:Color,sz:Dp=24.dp){
           Canvas(Modifier.size(sz)){
            val u=size.width/24f;val ph=Cur.ph;val st=Stroke(2f*u,cap=StrokeCap.Round,join=StrokeJoin.Round)
            fun P(x:Float,y:Float)=Offset(x*u,y*u)
            fun ln(a:Float,b:Float,c:Float,d:Float,w:Float=2f)=drawLine(ink,P(a,b),P(c,d),w*u,StrokeCap.Round)
            fun pth(f:Path.()->Unit)=drawPath(Path().apply(f),ink,style=st)
            fun dash(a:Float)=Stroke(2f*u,cap=StrokeCap.Round,pathEffect=PathEffect.dashPathEffect(floatArrayOf(3.2f*u,2.6f*u),ph*u*12f*a))
            when(k){
             "brush"->rotate(-16f*on,P(12f,12f)){ln(7f,17f,17f,7f,3.4f);drawCircle(ink,(1.8f+1.2f*on)*u,P(6f,18f));if(on>.3f)ln(18.5f,4f,20.5f,2f,1.4f)}
             "eraser"->rotate(-30f+18f*on,P(12f,12f)){drawRoundRect(ink,P(5f,8.5f),Size(14f*u,7f*u),CornerRadius(2f*u),style=st);ln(11f,8.5f,11f,15.5f,1.6f)}
             "liquify"->for(row in 0..1){val pa=Path();for(i in 0..24){val x=3f+i*.75f;val y=9f+row*6f+2.4f*sin(i*.45f+ph*6.28f*on+row);if(i==0)pa.moveTo(x*u,y*u) else pa.lineTo(x*u,y*u)};drawPath(pa,ink,style=st)}
             "lasso"->{drawOval(ink,P(4f,6f),Size(16f*u,11f*u),style=dash(on));ln(8f,16f,7f,20.5f,1.8f);drawCircle(ink,1.3f*u,P(7f,20.5f))}
             "select"->{drawRect(ink,P(4f,5f),Size(16f*u,14f*u),style=dash(on));drawCircle(ink,1.4f*u,P(12f,12f))}
             "layers"->for(i in 0..2){val dy=(i-1)*(3.2f+on*2.2f);pth{moveTo(12f*u,(9f+dy)*u);lineTo(20f*u,(12.5f+dy)*u);lineTo(12f*u,(16f+dy)*u);lineTo(4f*u,(12.5f+dy)*u);close()}}
             "sliders"->for(i in 0..2){val y=7f+i*5f;ln(4f,y,20f,y,1.6f);val kx=6f+((i*7+3)%10)+on*(if(i%2==0)6f else -4f);drawCircle(ink,2.2f*u,P(kx.coerceIn(5f,19f),y))}
             "drop"->{pth{moveTo(12f*u,3.5f*u);cubicTo(12f*u,3.5f*u,5.5f*u,11f*u,5.5f*u,15f*u);cubicTo(5.5f*u,18.6f*u,8.4f*u,21f*u,12f*u,21f*u);cubicTo(15.6f*u,21f*u,18.5f*u,18.6f*u,18.5f*u,15f*u);cubicTo(18.5f*u,11f*u,12f*u,3.5f*u,12f*u,3.5f*u);close()};ln(9.5f,14.5f,9.5f,16.5f+on*2f,1.6f)}
             "undo","redo"->scale(if(k=="redo")-1f else 1f,1f,P(12f,12f)){pth{moveTo(9f*u,7f*u);lineTo(4f*u,12f*u);lineTo(9f*u,17f*u)};pth{moveTo(4f*u,12f*u);lineTo(14f*u,12f*u);cubicTo(19f*u,12f*u,19f*u,19f*u,13f*u,19f*u)}}
             "reset"->{drawCircle(ink,6f*u,P(12f,12f),style=st);drawCircle(ink,1.6f*u,P(12f,12f));ln(12f,2.5f,12f,5.5f);ln(12f,18.5f,12f,21.5f);ln(2.5f,12f,5.5f,12f);ln(18.5f,12f,21.5f,12f)}
             "orb"->{drawCircle(ink,(8f-3f*on)*u,P(12f,12f),style=st);drawCircle(ink,(2.2f+1.6f*on)*u,P(12f,12f))}
             "check"->pth{moveTo(5f*u,12.5f*u);lineTo(10f*u,17.5f*u);lineTo(19f*u,7f*u)}
             "plus"->{ln(12f,5f,12f,19f);ln(5f,12f,19f,12f)}
             "minus"->ln(5f,12f,19f,12f)
             "x"->{ln(6f,6f,18f,18f);ln(18f,6f,6f,18f)}
             "chev"->rotate(180f*on,P(12f,12f)){pth{moveTo(6f*u,9f*u);lineTo(12f*u,15f*u);lineTo(18f*u,9f*u)}}
             "up"->pth{moveTo(6f*u,15f*u);lineTo(12f*u,9f*u);lineTo(18f*u,15f*u)}
             "down"->pth{moveTo(6f*u,9f*u);lineTo(12f*u,15f*u);lineTo(18f*u,9f*u)}
             "eye"->{drawOval(ink,P(3f,7.5f),Size(18f*u,9f*u),style=st);drawCircle(ink,2.4f*u,P(12f,12f));if(on>.5f)ln(3f,20f,21f,4f)}
             "lock"->{drawRoundRect(ink,P(5.5f,11f),Size(13f*u,9f*u),CornerRadius(2f*u),style=if(on>.5f)Fill else st);drawArc(ink,180f,180f,false,P(8f,5.5f),Size(8f*u,9f*u),style=st)}
             else->{}
            }}}

          // A glass panel = one blob in the GL liquid-glass pass. Spring-driven size gives jelly open/close; nearby blobs melt together.
          @Composable fun Glass(id:Int,open:Boolean,mod:Modifier,rad:Float=34f,sq:Float=1f,content:@Composable BoxScope.()->Unit){
           val sc by animateFloatAsState(if(open)1f else 0f,spring(1f-.65f*(Cur.th["bounce"]?:.5f),230f),label="g")
           val ink by animateColorAsState(if(Glass.light[id]==true)Color.Black else Color.White,label="i")
           var r by remember{mutableStateOf(Rect.Zero)}
           DisposableEffect(id){onDispose{Glass.m.remove(id)}}
           if(sc>.02f){
            SideEffect{if(r.width>0f)Glass.m[id]=floatArrayOf(r.center.x,r.center.y,r.width/2*sc*sq,r.height/2*sc*sq,min(rad*sc,min(r.width,r.height)/2*sc));Cur.rq()}
            Box(mod.onGloballyPositioned{r=it.boundsInWindow()}.graphicsLayer{scaleX=sc*sq;scaleY=sc*sq;alpha=min(1f,sc*1.4f)}){CompositionLocalProvider(LocalInk provides ink){content()}}
           }else SideEffect{Glass.m.remove(id);Cur.rq()}}

          val IDS=listOf("brush","eraser","liquify","lasso","select","undo","redo","layers","brushp","theme","reset","orb")
          val DEFP=mapOf("brush" to (.27f to .045f),"eraser" to (.385f to .045f),"liquify" to (.5f to .045f),"lasso" to (.615f to .045f),"select" to (.73f to .045f),
           "undo" to (.2f to .105f),"redo" to (.315f to .105f),"layers" to (.5f to .105f),"brushp" to (.615f to .105f),"theme" to (.73f to .105f),"reset" to (.845f to .105f),"orb" to (.93f to .045f))

          // Every icon is its own movable glass blob: long-press any icon to enter layout mode, drag it anywhere, tap the orb to finish.
          @Composable fun IB(id:String,k:String,on:Boolean=false,en:Boolean=true,f:()->Unit){
           val i=IDS.indexOf(id);val dn=LocalDensity.current;val px=with(dn){40.dp.toPx()};val h=LocalHapticFeedback.current
           val fx=Cur.pos[id+".x"]?:DEFP[id]!!.first;val fy=Cur.pos[id+".y"]?:DEFP[id]!!.second
           val oa by animateFloatAsState(if(on)1f else 0f,spring(.55f,260f),label="o")
           var pr by remember{mutableStateOf(false)}
           val sq by animateFloatAsState(if(pr).82f else 1f,spring(.3f,420f),label="p")
           Glass(100+i,!Cur.focus||id=="orb",Modifier.offset{IntOffset((fx*Cur.sw-px/2).roundToInt(),(fy*Cur.sh-px/2).roundToInt())}.size(40.dp)
            .graphicsLayer{rotationZ=if(Cur.edit)sin(Cur.ph*18f+i)*3f else 0f}
            .pointerInput(Cur.edit){if(Cur.edit)detectDragGestures{c,d->c.consume();val sw=max(1,Cur.sw).toFloat();val sh=max(1,Cur.sh).toFloat()
              Cur.pos[id+".x"]=(((Cur.pos[id+".x"]?:DEFP[id]!!.first)*sw+d.x)/sw).coerceIn(.03f,.97f);Cur.pos[id+".y"]=(((Cur.pos[id+".y"]?:DEFP[id]!!.second)*sh+d.y)/sh).coerceIn(.02f,.97f);Cur.rq()}
             else detectTapGestures(onPress={pr=true;h.performHapticFeedback(HapticFeedbackType.TextHandleMove);tryAwaitRelease();pr=false},onTap={f();Cur.rq()},onLongPress={Cur.edit=true;h.performHapticFeedback(HapticFeedbackType.LongPress)})},
            rad=20f,sq=sq){Box(Modifier.fillMaxSize(),Alignment.Center){Ico(k,oa,LocalInk.current.copy(alpha=if(en)1f else .35f),24.dp)}}}

          @Composable fun SL(n:String,v:Float,r:ClosedFloatingPointRange<Float>,f:(Float)->Unit){
           val h=LocalHapticFeedback.current;val ink=LocalInk.current
           Row(verticalAlignment=Alignment.CenterVertically){T(n,12,Modifier.width(96.dp))
            Slider(v,{if(abs(it-v)>(r.endInclusive-r.start)*.03f)h.performHapticFeedback(HapticFeedbackType.TextHandleMove);f(it);Cur.rq()},Modifier.weight(1f),valueRange=r,
             colors=SliderDefaults.colors(thumbColor=ink,activeTrackColor=ink.copy(.85f),inactiveTrackColor=ink.copy(.25f)))
            T("%.2f".format(v),11,Modifier.width(44.dp))}}
          @Composable fun Chip(s:String,on:Boolean,f:()->Unit){val ink=LocalInk.current;T(s,13,Modifier.clickable{f();Cur.rq()}.background(if(on)ink.copy(.2f)else Color.Transparent,RoundedCornerShape(50)).padding(horizontal=10.dp,vertical=5.dp))}
          @Composable fun MiniB(k:String,on:Float,f:()->Unit){val ink=LocalInk.current;val a by animateFloatAsState(on,spring(.6f,300f),label="m")
           Box(Modifier.size(34.dp).clip(CircleShape).clickable{f();Cur.rq()},Alignment.Center){Ico(k,a,ink,18.dp)}}
          @Composable fun PH(t:String,c:Boolean,tg:()->Unit,x:()->Unit){Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically){T(t,15,Modifier.weight(1f));MiniB("chev",if(c)0f else 1f,tg);MiniB("x",0f,x)}}

          @Composable fun BrushPanel(){
           val gs=when(Cur.tool){2->listOf("Liquify");3->listOf("Lasso");4->listOf("Select");else->listOf("Shape","Flow","Dynamics","Stroke","Texture","Color")}
           var tab by remember{mutableStateOf("Shape")};val tb=if(tab in gs)tab else gs[0]
           Column(Modifier.animateContentSize(spring(.85f,380f)).padding(14.dp).fillMaxWidth()){
            PH(when(Cur.tool){0->"Brush  ·  ${Cur.b["size"]!!.roundToInt()}px";1->"Eraser";2->"Liquify";3->"Lasso";else->"Select"},Cur.cb,{Cur.cb=!Cur.cb},{Cur.pb=false})
            if(!Cur.cb){
             if(gs.size>1)Row(Modifier.horizontalScroll(rememberScrollState())){gs.forEach{Chip(it,it==tb){tab=it}}}
             if(tb=="Liquify"){Row(Modifier.horizontalScroll(rememberScrollState())){listOf("Push","Twirl R","Twirl L","Bloat","Pucker","Restore","Smooth").forEachIndexed{i,n->Chip(n,Cur.lq==i){Cur.lq=i}}}
              Row(Modifier.horizontalScroll(rememberScrollState())){Chip("Bake on release",Cur.bk){Cur.bk=!Cur.bk}
               Chip("Bake layer",false){Cur.q{Cur.layers.getOrNull(Cur.sel)?.let{Cur.r?.bake(it)}}};Chip("Bake all",false){Cur.q{Cur.layers.forEach{Cur.r?.bake(it)}}}}}
             if(tb=="Lasso"){Row(Modifier.horizontalScroll(rememberScrollState())){Chip("Freehand",Cur.ls==0){Cur.ls=0;Cur.q{Cur.r?.lpts?.clear()}};Chip("Polygon",Cur.ls==1){Cur.ls=1;Cur.q{Cur.r?.lpts?.clear()}}
               Chip("Fill",Cur.le==0){Cur.le=0};Chip("Erase",Cur.le==1){Cur.le=1};if(Cur.ls==1)Chip("Close shape",false){Cur.q{Cur.r?.closePoly()}}}}
             if(tb=="Select"){
              Row(Modifier.horizontalScroll(rememberScrollState())){Chip("Freehand",Cur.ls==0){Cur.ls=0;Cur.q{Cur.r?.lpts?.clear()}};Chip("Polygon",Cur.ls==1){Cur.ls=1;Cur.q{Cur.r?.lpts?.clear()}}
               Chip("New",Cur.lm==0){Cur.lm=0};Chip("Add",Cur.lm==1){Cur.lm=1};Chip("Subtract",Cur.lm==2){Cur.lm=2}}
              Row(Modifier.horizontalScroll(rememberScrollState())){Chip("Invert",false){Cur.q{Cur.r?.selInvert()}};Chip("Deselect",false){Cur.q{Cur.r?.deselect()}};Chip("Fill",false){Cur.q{Cur.r?.fillSel(false)}};Chip("Clear",false){Cur.q{Cur.r?.fillSel(true)}}
               if(Cur.ls==1)Chip("Close shape",false){Cur.q{Cur.r?.closePoly()}}}}
             Column(Modifier.heightIn(max=190.dp).verticalScroll(rememberScrollState())){
              if(tb=="Color"){SL("Hue",Cur.hue,0f..360f){Cur.hue=it};SL("Saturation",Cur.sat,0f..1f){Cur.sat=it};SL("Value",Cur.vl,0f..1f){Cur.vl=it}
               Box(Modifier.fillMaxWidth().height(22.dp).background(Color(Cur.col()),RoundedCornerShape(11.dp)))}
              DEFS.filter{it.g==tb}.forEach{d->SL(d.n,Cur.b[d.k]!!,d.lo..d.hi){Cur.b[d.k]=it}}}}}}

          @Composable fun Layers(){
           fun mv(d:Int){val i=Cur.sel;val j=i+d;if(j in Cur.layers.indices){Cur.layers.add(j,Cur.layers.removeAt(i));Cur.sel=j}}
           Column(Modifier.animateContentSize(spring(.85f,380f)).padding(12.dp).width(250.dp)){
            PH("Layers",Cur.cl,{Cur.cl=!Cur.cl},{Cur.pl=false})
            if(!Cur.cl){
             Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){
              MiniB("plus",0f){Cur.layers.add(Layer("Layer ${Cur.layers.size}"));Cur.sel=Cur.layers.lastIndex}
              MiniB("minus",0f){if(Cur.layers.size>1){val l=Cur.layers.removeAt(Cur.sel);Cur.r?.trash?.add(l);Cur.q{Cur.r?.forget(l)};Cur.sel=Cur.sel.coerceAtMost(Cur.layers.lastIndex)}}
              MiniB("up",0f){mv(1)};MiniB("down",0f){mv(-1)}}
             LazyColumn(Modifier.heightIn(max=190.dp)){items(Cur.layers.indices.reversed().toList()){i->
              val l=Cur.layers.getOrNull(i)
              if(l!=null)Row(Modifier.fillMaxWidth().clickable{Cur.sel=i}.background(if(i==Cur.sel)LocalInk.current.copy(.18f)else Color.Transparent,RoundedCornerShape(12.dp)).padding(start=8.dp),verticalAlignment=Alignment.CenterVertically){
               T(l.name,13,Modifier.weight(1f));MiniB("liquify",if(l.liq)1f else 0f){l.liq=!l.liq};MiniB("lock",if(l.lock)1f else 0f){l.lock=!l.lock};MiniB("eye",if(l.vis)0f else 1f){l.vis=!l.vis}}}}
             Cur.layers.getOrNull(Cur.sel)?.let{l->SL("Opacity",l.op,0f..1f){l.op=it};Chip("Blend: "+BLENDS[l.mode].first,true){Cur.pm=true}}}}}

          @Composable fun ThemePanel(){
           Column(Modifier.animateContentSize(spring(.85f,380f)).padding(14.dp).width(420.dp)){
            PH("Glass & layout",Cur.ct,{Cur.ct=!Cur.ct},{Cur.pt=false})
            if(!Cur.ct){
             Row(Modifier.horizontalScroll(rememberScrollState())){PRESETS.keys.forEach{n->Chip(n,false){PRESETS[n]!!.forEachIndexed{i,v->Cur.th[THEME[i].k]=v}}}}
             Row(Modifier.horizontalScroll(rememberScrollState())){Chip("Move icons",Cur.edit){Cur.edit=!Cur.edit;Cur.pt=false};Chip("Reset layout",false){Cur.pos.clear()}}
             Column(Modifier.heightIn(max=280.dp).verticalScroll(rememberScrollState())){THEME.forEach{d->SL(d.n,Cur.th[d.k]!!,d.lo..d.hi){Cur.th[d.k]=it}}}}}}

          @Composable fun App(){
           LaunchedEffect(Cur.tool,Cur.edit){while(Cur.tool>=2||Cur.edit){withFrameNanos{Cur.ph=((it/1_000_000L)%1_000_000L)/1000f}}}
           Box(Modifier.fillMaxSize().onSizeChanged{Cur.sw=it.width;Cur.sh=it.height}){
            AndroidView({CanvasView(it)},Modifier.fillMaxSize())
            Glass(2,Cur.pl&&!Cur.focus,Modifier.align(Alignment.CenterEnd).padding(end=12.dp)){Layers()}
            Glass(3,Cur.pb&&!Cur.focus,Modifier.align(Alignment.BottomCenter).padding(12.dp).fillMaxWidth(.96f)){BrushPanel()}
            Glass(5,Cur.pt&&!Cur.focus,Modifier.align(Alignment.Center)){ThemePanel()}
            Glass(4,Cur.pm,Modifier.align(Alignment.Center)){LazyColumn(Modifier.padding(14.dp).width(230.dp).height(380.dp)){items(BLENDS.size){i->
             T(BLENDS[i].first,15,Modifier.fillMaxWidth().clickable{Cur.layers.getOrNull(Cur.sel)?.mode=i;Cur.pm=false;Cur.rq()}.padding(9.dp))}}}
            IB("brush","brush",Cur.tool==0){Cur.tool=0};IB("eraser","eraser",Cur.tool==1){Cur.tool=1};IB("liquify","liquify",Cur.tool==2){Cur.tool=2}
            IB("lasso","lasso",Cur.tool==3){Cur.tool=3};IB("select","select",Cur.tool==4){Cur.tool=4}
            IB("undo","undo",false,Cur.hu>0){Cur.q{Cur.r?.undo()}};IB("redo","redo",false,Cur.hr>0){Cur.q{Cur.r?.redo()}}
            IB("layers","layers",Cur.pl){Cur.pl=!Cur.pl};IB("brushp","sliders",Cur.pb){Cur.pb=!Cur.pb};IB("theme","drop",Cur.pt){Cur.pt=!Cur.pt}
            IB("reset","reset"){Cur.px=0f;Cur.py=0f;Cur.rot=0f;Cur.sc=(Cur.view?.let{min(it.width,it.height)*.9f/Cur.n}?:.4f);Cur.vd=true}
            IB("orb",if(Cur.edit)"check" else "orb",Cur.focus){if(Cur.edit)Cur.edit=false else Cur.focus=!Cur.focus}
           }}
          EOF_6
      - name: Build debug APK
        run: cd liquidart && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidArt-debug-apk
          path: liquidart/app/build/outputs/apk/debug/*.apk
