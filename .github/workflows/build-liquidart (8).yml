           fun flush(){if(dn==0)return
            fb(stk[1],N,N);G.glEnable(G.GL_BLEND);G.glBlendFunc(G.GL_ONE,G.GL_ONE_MINUS_SRC_ALPHA);G.glUseProgram(pd)
            uf(pd,"uSize",N.toFloat(),N.toFloat());uf(pd,"uHard",g("hard"));uf(pd,"uEdge",g("edge"));uf(pd,"uGrain",g("grain"))
