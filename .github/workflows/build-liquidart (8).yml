             0->{lpts.clear();lpts.add(x);lpts.add(y)}
             1->{val n=lpts.size;if(n>=2&&n<8000&&hypot(x-lpts[n-2],y-lpts[n-1])>3f){lpts.add(x);lpts.add(y);rasterLasso()}}
