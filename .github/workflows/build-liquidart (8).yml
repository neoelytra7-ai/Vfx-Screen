            var sz=g("size")*(1f+g("pSize")*(lp(g("minSize"),1f,pr)-1f))*(1f+g("vSize")*v)*(1f-g("sizeJ")*rn())
            if(g("taper")>0f)sz*=min(1f,.2f+.8f*path/g("taper"))
