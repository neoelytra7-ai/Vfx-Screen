          package com.lumen.studio

          object RootSh {
              fun run(cmd: String): String = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", "($cmd) 2>&1"))
                  val s = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  s
              } catch (e: Exception) { "" }
          }

          /** Optional root performance boost for the heavy AI jobs (Snapdragon 8 Gen 1: CPU + Adreno governors). */
          object Turbo {
              private var cpuGov = ""
              private var gpuGov = ""
              private var active = false

              @Synchronized fun on() {
                  if (Fx.i("turbo") == 0 || active) return
                  val out = RootSh.run("cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor; cat /sys/class/kgsl/kgsl-3d0/devfreq/governor").lines()
                  cpuGov = out.getOrNull(0)?.trim() ?: ""
                  gpuGov = out.getOrNull(1)?.trim() ?: ""
                  RootSh.run("for c in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/scaling_governor; do echo performance > \$c; done; echo performance > /sys/class/kgsl/kgsl-3d0/devfreq/governor")
                  active = true
              }

              @Synchronized fun off() {
                  if (!active) return
                  if (cpuGov.isNotEmpty() && !cpuGov.contains(" ")) RootSh.run("for c in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/scaling_governor; do echo $cpuGov > \$c; done")
                  if (gpuGov.isNotEmpty() && !gpuGov.contains(" ")) RootSh.run("echo $gpuGov > /sys/class/kgsl/kgsl-3d0/devfreq/governor")
                  active = false
              }
          }
