              private fun pushAll() {
                  val g = gl ?: return
                  src?.let { g.r.setImage(it) }
                  val d = depth
                  if (d != null) g.r.setDepth(d, dw, dh) else g.r.setDepth(null, 0, 0)
                  val m = maskOut
                  if (m != null) g.r.setMask(m, mw, mh) else g.r.setMask(null, 0, 0)
                  g.r.setLut(lutArr, lutN)
                  pushParams()
              }

              private fun pushParams() {
                  val g = gl ?: return
                  g.r.pv = Fx.glArray()
                  g.r.showDepth = Fx.i("show_depth") == 1
                  g.r.maskMode = Fx.i("mask_mode")
                  g.brushOn = Fx.i("brush_on") == 1
                  g.requestRender()
              }

              private fun onParam(k: String) {
                  pushParams()
                  if (k.startsWith("cut_") && k != "cut_model" && k != "cut_decon") { ui.removeCallbacks(refineTask); ui.postDelayed(refineTask, 120) }
                  else if (k.startsWith("hm_")) { ui.removeCallbacks(composeTask); ui.postDelayed(composeTask, 150) }
                  else if (k == "px_tilt") { if (Fx.i("px_tilt") == 1) startSensor() else stopSensor() }
              }

              // ------------------------------------------------------------------ tool panels
              private fun showTool(name: String) {
                  curTool = name
                  refreshers.clear()
                  panel.removeAllViews()
                  for ((n, c) in toolChips) {
                      val on = n == name
                      c.background = rr(if (on) cAccent else 0x14FFFFFF, 16)
                      c.setTextColor(if (on) Color.WHITE else cMuted)
                  }
                  when (name) {
                      "Looks" -> looksPanel()
                      "HSL" -> hslPanel()
                      "Models" -> modelsPanel(panel)
                      else -> {
                          val items = Fx.tools[name] ?: emptyList()
                          val keys = items.filter { it !is Ac }.map { it.key }
                          if (keys.isNotEmpty()) panelHeader(name, keys)
                          for (s in items) buildRow(panel, s)
                      }
                  }
              }

