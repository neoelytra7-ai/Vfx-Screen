                  sv.addView(panel)
                  sv.background = rr(cCard, 22)
                  root.addView(sv, lp(MP, (resources.displayMetrics.heightPixels * 0.36f).toInt()))

                  f.addView(root, FrameLayout.LayoutParams(MP, MP))
