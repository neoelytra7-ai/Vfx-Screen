          package com.lumen.studio

          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.net.Uri
          import android.provider.MediaStore
          import java.io.File
          import java.io.InputStream
          import java.nio.ByteBuffer
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          object Img {
              fun decode(ctx: Context, uri: Uri, maxDim: Int): Bitmap {
                  val cr = ctx.contentResolver
                  val o = BitmapFactory.Options()
                  o.inJustDecodeBounds = true
                  cr.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o) }
                  var ss = 1
                  while (max(o.outWidth, o.outHeight) / (ss * 2) >= maxDim) ss *= 2
                  val o2 = BitmapFactory.Options()
                  o2.inSampleSize = ss
                  o2.inPreferredConfig = Bitmap.Config.ARGB_8888
                  var bmp = cr.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o2) }!!
                  val orient = try {
                      cr.openInputStream(uri)!!.use { ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL) }
                  } catch (e: Exception) { ExifInterface.ORIENTATION_NORMAL }
                  val m = Matrix()
                  when (orient) {
                      ExifInterface.ORIENTATION_ROTATE_90 -> m.postRotate(90f)
                      ExifInterface.ORIENTATION_ROTATE_180 -> m.postRotate(180f)
                      ExifInterface.ORIENTATION_ROTATE_270 -> m.postRotate(270f)
                      ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> m.postScale(-1f, 1f)
                      ExifInterface.ORIENTATION_FLIP_VERTICAL -> m.postScale(1f, -1f)
                  }
                  if (!m.isIdentity) bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                  return scaleMax(bmp, maxDim)
              }

              fun scaleMax(b: Bitmap, maxDim: Int): Bitmap {
                  val l = max(b.width, b.height)
                  if (l <= maxDim) return b
                  val s = maxDim.toFloat() / l
                  return Bitmap.createScaledBitmap(b, max(1, (b.width * s).roundToInt()), max(1, (b.height * s).roundToInt()), true)
              }

              fun bufToBitmap(buf: ByteBuffer, w: Int, h: Int): Bitmap {
                  val px = IntArray(w * h)
                  for (y in 0 until h) {
                      val row = (h - 1 - y) * w * 4
                      for (x in 0 until w) {
                          val o = row + x * 4
                          val r = buf.get(o).toInt() and 255
                          val g = buf.get(o + 1).toInt() and 255
                          val b = buf.get(o + 2).toInt() and 255
                          val a = buf.get(o + 3).toInt() and 255
                          px[y * w + x] = (a shl 24) or (r shl 16) or (g shl 8) or b
                      }
                  }
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  bmp.setPixels(px, 0, w, 0, 0, w, h)
                  return bmp
              }

              fun save(ctx: Context, bmp: Bitmap, png: Boolean, q: Int): Uri? {
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "Lumen_${System.currentTimeMillis()}." + (if (png) "png" else "jpg"))
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, if (png) "image/png" else "image/jpeg")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Lumen")
                  cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                  val uri = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                  ctx.contentResolver.openOutputStream(uri)?.use { bmp.compress(if (png) Bitmap.CompressFormat.PNG else Bitmap.CompressFormat.JPEG, q, it) }
                  cv.clear(); cv.put(MediaStore.MediaColumns.IS_PENDING, 0)
                  ctx.contentResolver.update(uri, cv, null, null)
                  return uri
              }

              fun saveVideo(ctx: Context, f: File): Uri? {
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "Lumen_${System.currentTimeMillis()}.mp4")
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/Lumen")
                  val uri = ctx.contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                  ctx.contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { it.copyTo(o) } }
                  return uri
              }

              fun saveText(ctx: Context, name: String, text: String): Uri? {
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/Lumen")
                  val uri = ctx.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: return null
                  ctx.contentResolver.openOutputStream(uri)?.use { it.write(text.toByteArray()) }
                  return uri
              }

              /** Parses an Adobe .cube 3D LUT. Returns RGB floats (red fastest) and the grid size. */
              fun parseCube(ins: InputStream): Pair<FloatArray, Int>? {
                  var n = 0
                  val vals = ArrayList<Float>()
                  ins.bufferedReader().forEachLine { raw ->
                      val l = raw.trim()
                      if (l.isEmpty() || l.startsWith("#") || l.startsWith("TITLE")) return@forEachLine
                      if (l.startsWith("LUT_3D_SIZE")) { n = l.split(Regex("\\s+"))[1].toInt(); return@forEachLine }
                      val t = l.split(Regex("\\s+"))
                      if (t.size >= 3 && (t[0][0].isDigit() || t[0][0] == '-' || t[0][0] == '.')) {
                          val a = t[0].toFloatOrNull(); val b = t[1].toFloatOrNull(); val c = t[2].toFloatOrNull()
                          if (a != null && b != null && c != null) { vals.add(a); vals.add(b); vals.add(c) }
                      }
                  }
                  if (n < 2 || vals.size < n * n * n * 3) return null
                  return Pair(vals.toFloatArray(), n)
              }

              // ------------------------------------------------------------ float image helpers
              fun box(src: FloatArray, w: Int, h: Int, r: Int): FloatArray {
                  if (r <= 0) return src.copyOf()
                  val tmp = FloatArray(src.size)
                  val out = FloatArray(src.size)
                  for (y in 0 until h) {
                      val o = y * w
                      var sum = 0f
                      for (x in 0..min(r, w - 1)) sum += src[o + x]
                      for (x in 0 until w) {
                          val x0 = max(0, x - r); val x1 = min(w - 1, x + r)
                          tmp[o + x] = sum / (x1 - x0 + 1)
                          val add = x + r + 1
                          if (add < w) sum += src[o + add]
                          val rem = x - r
                          if (rem >= 0) sum -= src[o + rem]
                      }
                  }
                  for (x in 0 until w) {
                      var sum = 0f
                      for (y in 0..min(r, h - 1)) sum += tmp[y * w + x]
                      for (y in 0 until h) {
                          val y0 = max(0, y - r); val y1 = min(h - 1, y + r)
                          out[y * w + x] = sum / (y1 - y0 + 1)
                          val add = y + r + 1
                          if (add < h) sum += tmp[add * w + x]
                          val rem = y - r
                          if (rem >= 0) sum -= tmp[rem * w + x]
                      }
                  }
                  return out
              }

              fun resizeF(s: FloatArray, sw: Int, sh: Int, dw: Int, dh: Int): FloatArray {
                  if (sw == dw && sh == dh) return s.copyOf()
                  val o = FloatArray(dw * dh)
                  for (y in 0 until dh) {
                      val fy = ((y + 0.5f) * sh / dh - 0.5f).coerceIn(0f, (sh - 1).toFloat())
                      val y0 = fy.toInt(); val y1 = min(sh - 1, y0 + 1); val ty = fy - y0
                      for (x in 0 until dw) {
                          val fx = ((x + 0.5f) * sw / dw - 0.5f).coerceIn(0f, (sw - 1).toFloat())
                          val x0 = fx.toInt(); val x1 = min(sw - 1, x0 + 1); val tx = fx - x0
                          val a = s[y0 * sw + x0] * (1 - tx) + s[y0 * sw + x1] * tx
                          val b = s[y1 * sw + x0] * (1 - tx) + s[y1 * sw + x1] * tx
                          o[y * dw + x] = a * (1 - ty) + b * ty
                      }
                  }
                  return o
              }

              fun gray(b: Bitmap, w: Int, h: Int): FloatArray {
                  val s = if (b.width == w && b.height == h) b else Bitmap.createScaledBitmap(b, w, h, true)
                  val px = IntArray(w * h)
                  s.getPixels(px, 0, w, 0, 0, w, h)
                  return FloatArray(w * h) {
                      val p = px[it]
                      (0.299f * ((p shr 16) and 255) + 0.587f * ((p shr 8) and 255) + 0.114f * (p and 255)) / 255f
                  }
              }

              fun guided(I: FloatArray, p: FloatArray, w: Int, h: Int, r: Int, eps: Float): FloatArray {
                  val n = w * h
                  val mI = box(I, w, h, r)
                  val mp = box(p, w, h, r)
                  val mIp = box(FloatArray(n) { I[it] * p[it] }, w, h, r)
                  val mII = box(FloatArray(n) { I[it] * I[it] }, w, h, r)
                  val a = FloatArray(n)
                  val b = FloatArray(n)
                  for (i in 0 until n) {
                      val cov = mIp[i] - mI[i] * mp[i]
                      val v = mII[i] - mI[i] * mI[i]
                      a[i] = cov / (v + eps)
                      b[i] = mp[i] - a[i] * mI[i]
                  }
                  val ma = box(a, w, h, r)
                  val mb = box(b, w, h, r)
                  return FloatArray(n) { ma[it] * I[it] + mb[it] }
              }

              /** Turns a raw matte into a final 8-bit alpha using the cutout refinement controls. */
              fun refine(base: FloatArray, w: Int, h: Int, guide: FloatArray?, smooth: Int, contrast: Float, shift: Int, feather: Int): ByteArray {
                  var a = base
                  if (smooth > 0 && guide != null) {
                      a = guided(guide, a, w, h, smooth, 1e-3f)
                      for (i in a.indices) a[i] = a[i].coerceIn(0f, 1f)
                  }
                  if (shift != 0) {
                      val bl = box(box(a, w, h, abs(shift)), w, h, max(1, abs(shift) / 2))
                      val out = FloatArray(a.size)
                      for (i in a.indices) {
                          val t = if (shift > 0) ((bl[i] - 0.08f) / 0.3f) else ((bl[i] - 0.55f) / 0.35f)
                          out[i] = t.coerceIn(0f, 1f)
                      }
                      a = out
                  }
                  val lo = 0.45f * contrast
                  val hi = 1f - lo
                  if (contrast > 0.01f) {
                      val out = FloatArray(a.size)
                      for (i in a.indices) out[i] = ((a[i] - lo) / (hi - lo)).coerceIn(0f, 1f)
                      a = out
                  }
                  if (feather > 0) a = box(box(a, w, h, feather), w, h, max(1, feather / 2))
                  return ByteArray(a.size) { (a[it].coerceIn(0f, 1f) * 255f + 0.5f).toInt().toByte() }
              }
          }
