          package dev.canvas

          import android.content.Context
          import android.opengl.GLSurfaceView
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.ViewConfiguration
          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.hypot

          /**
           * Touch policy: a stroke does NOT start on finger-down. It starts once the finger moved past a
           * slop distance or was held ~90 ms. A second finger = pan / zoom / free rotate (nothing is drawn).
           * If a second finger lands right after a stroke began (<250 ms) the stroke is rolled back.
           */
          class CanvasView(c: Context, private val e: Engine) : GLSurfaceView(c) {
              private var draw = false
              private var pend = false
              private var pan = false
              private var moved = false
              private var t0 = 0L
              private var downT = 0L
              private var strokeT = 0L
              private var fx = 0f; private var fy = 0f
              private var mx = 0f; private var my = 0f; private var md = 1f; private var ma = 0f
              private val slop = ViewConfiguration.get(c).scaledTouchSlop * 1.4f
              private val buf = ArrayList<FloatArray>()
              private val pi = Math.PI.toFloat()

              init {
                  setEGLContextClientVersion(3)
                  setEGLConfigChooser(8, 8, 8, 0, 0, 0) // no depth/stencil/alpha: less memory
                  preserveEGLContextOnPause = true
                  setRenderer(e)
                  renderMode = RENDERMODE_WHEN_DIRTY    // zero idle GPU cost
              }

              fun gl(f: () -> Unit) { queueEvent(Runnable { f() }); requestRender() }

              private fun send(a: Int, x: Float, y: Float, p: Float) {
                  val cx = e.cx(x, y); val cy = e.cy(x, y)
                  queueEvent(Runnable { if (a == 0) e.begin(cx, cy, p) else e.move(cx, cy, p) })
              }
              private fun press(t: MotionEvent, v: Float) = if (t.getToolType(0) == MotionEvent.TOOL_TYPE_STYLUS) v else 1f
              private fun end() = queueEvent(Runnable { e.end() })

              private fun start() {
                  pend = false; draw = true; strokeT = SystemClock.uptimeMillis()
                  for ((i, q) in buf.withIndex()) send(if (i == 0) 0 else 1, q[0], q[1], q[2])
                  buf.clear()
              }

              private fun sync(t: MotionEvent) {
                  mx = (t.getX(0) + t.getX(1)) / 2; my = (t.getY(0) + t.getY(1)) / 2
                  md = hypot(t.getX(0) - t.getX(1), t.getY(0) - t.getY(1)).coerceAtLeast(1f)
                  ma = atan2(t.getY(1) - t.getY(0), t.getX(1) - t.getX(0))
              }

              override fun onTouchEvent(t: MotionEvent): Boolean {
                  when (t.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          draw = false; pan = false; moved = false; pend = true; downT = t.eventTime; fx = t.x; fy = t.y
                          buf.clear(); buf.add(floatArrayOf(t.x, t.y, press(t, t.pressure)))
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          if (pend) { pend = false; buf.clear() }              // pinch: the first finger never drew
                          else if (draw) {
                              draw = false
                              if (SystemClock.uptimeMillis() - strokeT < 250) queueEvent(Runnable { e.abort() }) else end()
                          }
                          pan = true; moved = false; sync(t); t0 = t.eventTime
                      }
                      MotionEvent.ACTION_MOVE ->
                          if (pan && t.pointerCount > 1) {
                              val x = (t.getX(0) + t.getX(1)) / 2; val y = (t.getY(0) + t.getY(1)) / 2
                              val d = hypot(t.getX(0) - t.getX(1), t.getY(0) - t.getY(1)).coerceAtLeast(1f)
                              val an = atan2(t.getY(1) - t.getY(0), t.getX(1) - t.getX(0))
                              var da = an - ma
                              while (da > pi) da -= 2f * pi
                              while (da < -pi) da += 2f * pi
                              if (abs(x - mx) + abs(y - my) + abs(d - md) + abs(da) * md * .5f > 14f) moved = true
                              if (moved) { e.gesture(mx, my, x, y, d / md, da); mx = x; my = y; md = d; ma = an }
                          } else if (pend) {
                              for (h in 0 until t.historySize) buf.add(floatArrayOf(t.getHistoricalX(h), t.getHistoricalY(h), press(t, t.getHistoricalPressure(h))))
                              buf.add(floatArrayOf(t.x, t.y, press(t, t.pressure)))
                              if (hypot(t.x - fx, t.y - fy) > slop || t.eventTime - downT >= 90) start()
                          } else if (draw) {
                              for (h in 0 until t.historySize) send(1, t.getHistoricalX(h), t.getHistoricalY(h), press(t, t.getHistoricalPressure(h)))
                              send(1, t.x, t.y, press(t, t.pressure))
                          }
                      MotionEvent.ACTION_POINTER_UP -> {
                          // quick 2-finger tap = undo, 3-finger tap = redo
                          if (!moved && t0 > 0 && t.eventTime - t0 < 260) {
                              if (t.pointerCount == 2) gl { e.undo() } else if (t.pointerCount == 3) gl { e.redo() }
                              t0 = 0
                          }
                          if (t.pointerCount <= 2) pan = false
                      }
                      MotionEvent.ACTION_UP -> {
                          if (pend) {                                           // a tap = a single dab
                              if (!pan && buf.isNotEmpty()) { val q = buf[0]; send(0, q[0], q[1], q[2]); end() }
                              pend = false; buf.clear()
                          } else if (draw) end()
                          draw = false; pan = false
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          if (draw) queueEvent(Runnable { e.abort() })
                          draw = false; pend = false; pan = false; buf.clear()
                      }
                  }
                  requestRender(); return true
              }
          }
