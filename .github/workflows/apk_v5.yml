          class Cfg(val w: Int, val h: Int, val paper: Int, val pat: Int, val layers: Int, val budget: Int)

          val ASP = listOf("1:1" to 1f, "4:3" to 4f / 3f, "3:2" to 1.5f, "16:9" to 16f / 9f, "3:4" to .75f, "2:3" to 2f / 3f, "9:16" to 9f / 16f)
          val PAPERS = listOf(0xFFFFFFFFL, 0xFFFFF4E0L, 0xFFFFE3EEL, 0xFFDFF7EAL, 0xFFE3F1FFL, 0xFF1A141CL, 0x00FFFFFFL)
