          // ───────────────────────── procedural icons (no assets, drawn + animated in code) ─────────────────────────
          enum class Ik { BR, ER, SM, BL, DG, BN, LQ, FL, GR, LN, RC, OV, PK, MV, UN, RE, LY, CO, BS, MN, SV, SY, EY, EN, PL, MI, DP, TR, UP, DN, MG, CX, CV, OK, TH, FX, CP, HM, LK, IM, GD, DC, LS, GS }

          /** ph = animation phase 0..1 (looping while active, one-shot on tap). */
          fun DrawScope.ic(k: Ik, c: Color, c2: Color, ph: Float) {
              val u = size.minDimension / 24f
              val sw = 2.1f * u
              val tau = 6.2832f
              val w = sin(ph * tau)
              val st = Stroke(sw, cap = StrokeCap.Round, join = StrokeJoin.Round)
              fun o(x: Float, y: Float) = Offset(x * u, y * u)
              fun l(a: Float, b: Float, x: Float, y: Float, col: Color = c) = drawLine(col, o(a, b), o(x, y), sw, StrokeCap.Round)
              fun dot(x: Float, y: Float, r: Float, col: Color = c2) = drawCircle(col, r * u, o(x, y))
              fun ring(x: Float, y: Float, r: Float, col: Color = c) = drawCircle(col, r * u, o(x, y), style = st)
              fun poly(vararg p: Float, close: Boolean = true, fill: Color? = null) {
                  val pa = Path(); pa.moveTo(p[0] * u, p[1] * u)
                  var i = 2
                  while (i < p.size) { pa.lineTo(p[i] * u, p[i + 1] * u); i += 2 }
                  if (close) pa.close()
                  if (fill != null) drawPath(pa, fill)
                  drawPath(pa, c, style = st)
              }
              when (k) {
                  Ik.BR -> { l(19f, 5f, 10f, 14f); dot(8f, 16f + w * .6f, 3.6f); dot(19f, 19f, 1.2f + w * .3f) }
                  Ik.ER -> { poly(5f, 15f, 13f, 6f, 19f, 11f, 12f, 20f, fill = c2.copy(alpha = .35f)); l(9f, 11f, 15f, 16f, c2); dot(4f + (w + 1f) * 2f, 5f, 1f) }
                  Ik.SM -> {
                      val pa = Path(); pa.moveTo(3f * u, 17f * u); pa.cubicTo(8f * u, 6f * u, 14f * u, 22f * u, 21f * u, 9f * u)
                      drawPath(pa, c, style = st); dot(8f + w * 2f, 14f, 3f)
                  }
                  Ik.BL -> { dot(12f, 12f, 3.2f); ring(12f, 12f, 6.5f + w * .7f); ring(12f, 12f, 10f + w * .5f, c.copy(alpha = .45f)) }
                  Ik.DG -> {
                      dot(12f, 12f, 4f)
                      for (i in 0..7) { val a = (i * 45f + ph * 45f) * 0.01745f; l(12f + cos(a) * 7f, 12f + sin(a) * 7f, 12f + cos(a) * 10f, 12f + sin(a) * 10f) }
                  }
                  Ik.BN -> {
                      poly(12f, 3f + w * .5f, 18f, 11f, 17f, 18f, 12f, 21f, 7f, 18f, 6f, 11f, fill = c2.copy(alpha = .5f))
                      poly(12f, 12f, 14f, 16f, 12f, 19f, 10f, 16f, fill = c2)
                  }
                  Ik.LQ -> for (j in 0..1) {
                      val pa = Path()
                      for (i in 0..16) {
                          val x = 3f + i * 1.125f
                          val y = (if (j == 0) 9f else 15f) + 2.6f * sin((i / 16f + ph * (if (j == 0) 1f else -1f)) * tau)
                          if (i == 0) pa.moveTo(x * u, y * u) else pa.lineTo(x * u, y * u)
                      }
                      drawPath(pa, if (j == 0) c else c2, style = st)
                  }
                  Ik.FL -> { poly(4f, 12f, 11f, 5f, 18f, 12f, 11f, 19f, fill = c2.copy(alpha = .4f)); l(4f, 12f, 18f, 12f); dot(20f, 17f + w * .8f, 2.2f) }
                  Ik.GR -> for (i in 0..4) drawRect(c.copy(alpha = ((i + 1) / 5f) * (.75f + .25f * sin((ph + i / 5f) * tau))), o(4f + i * 3.2f, 5f), Size(2.6f * u, 14f * u))
                  Ik.LN -> { l(5f, 19f, 19f, 5f); ring(5f, 19f, 2f); ring(19f, 5f, 2f); dot(5f + 14f * ph, 19f - 14f * ph, 1.5f) }
                  Ik.RC -> { drawRoundRect(c, o(5f, 6f), Size(14f * u, 12f * u), CornerRadius(2.5f * u), style = st); dot(5f, 6f, 1.5f); dot(19f, 18f, 1.5f) }
                  Ik.OV -> { drawOval(c, o(4f, 6f), Size(16f * u, 12f * u), style = st); dot(12f, 12f, 1.5f + w * .4f) }
                  Ik.PK -> { l(6f, 18f, 15f, 9f); dot(17f, 7f, 3.2f); dot(5f, 19f, 1.3f + w * .4f, c) }
                  Ik.MV -> {
                      val g = 2.5f + w * .5f
                      l(12f, 3f, 12f, 21f); l(3f, 12f, 21f, 12f)
                      l(12f, 3f, 12f - g, 3f + g); l(12f, 3f, 12f + g, 3f + g); l(12f, 21f, 12f - g, 21f - g); l(12f, 21f, 12f + g, 21f - g)
                      l(3f, 12f, 3f + g, 12f - g); l(3f, 12f, 3f + g, 12f + g); l(21f, 12f, 21f - g, 12f - g); l(21f, 12f, 21f - g, 12f + g)
                  }
                  Ik.UN -> rotate(-w * 20f, o(12f, 12f)) {
                      val pa = Path(); pa.moveTo(19f * u, 19f * u); pa.cubicTo(19f * u, 11f * u, 14f * u, 9f * u, 6f * u, 9f * u)
                      drawPath(pa, c, style = st); l(6f, 9f, 10f, 5f); l(6f, 9f, 10f, 13f)
                  }
                  Ik.RE -> scale(-1f, 1f, o(12f, 12f)) { ic(Ik.UN, c, c2, ph) }
                  Ik.LY -> for (i in 0..2) {
                      val cy = 7f + i * 5f * (1f + .15f * w)
                      poly(12f, cy - 3.5f, 20f, cy, 12f, cy + 3.5f, 4f, cy, fill = if (i == 2) c2.copy(alpha = .5f) else null)
                  }
                  Ik.CO -> {
                      ring(12f, 12f, 9f)
                      val cs = listOf(c, c2, Color.White)
                      for (i in 0..2) { val a = (i * 120f + ph * 120f) * 0.01745f; dot(12f + cos(a) * 4.5f, 12f + sin(a) * 4.5f, 1.8f, cs[i]) }
                  }
                  Ik.BS -> for (i in 0..2) { val y = 6f + i * 6f; l(4f, y, 20f, y, c.copy(alpha = .5f)); dot(8f + i * 4f + w * 2f, y, 2.4f) }
                  Ik.MN -> for (i in 0..2) dot(6f + i * 6f, 12f + sin((ph + i * .2f) * tau) * 2.5f, 1.9f, c)
                  Ik.SV -> { l(12f, 4f + w * .8f, 12f, 15f); l(12f, 15f, 8f, 11f); l(12f, 15f, 16f, 11f); poly(5f, 16f, 5f, 20f, 19f, 20f, 19f, 16f, close = false) }
                  Ik.SY -> {
                      for (i in 0..4) l(12f, 3f + i * 4.5f, 12f, 5f + i * 4.5f)
                      poly(4f, 8f + w * .5f, 9f, 12f, 4f, 16f - w * .5f, fill = c2.copy(alpha = .4f))
                      poly(20f, 8f + w * .5f, 15f, 12f, 20f, 16f - w * .5f, fill = c2.copy(alpha = .4f))
                  }
                  Ik.EY -> { drawOval(c, o(3f, 7f), Size(18f * u, 10f * u), style = st); dot(12f, 12f, 3f + w * .3f) }
                  Ik.EN -> { drawOval(c.copy(alpha = .5f), o(3f, 7f), Size(18f * u, 10f * u), style = st); l(4f, 20f, 20f, 4f) }
                  Ik.PL -> { l(12f, 5f, 12f, 19f); l(5f, 12f, 19f, 12f) }
                  Ik.MI -> l(5f, 12f, 19f, 12f)
                  Ik.DP -> {
                      drawRoundRect(c, o(8f, 8f), Size(12f * u, 12f * u), CornerRadius(3f * u), style = st)
                      drawRoundRect(c2, o(4f, 4f), Size(12f * u, 12f * u), CornerRadius(3f * u), style = st)
                  }
                  Ik.TR -> {
                      val lift = (w + 1f) * .8f
                      poly(7f, 9f, 8f, 20f, 16f, 20f, 17f, 9f, close = false); l(5f, 7f - lift, 19f, 7f - lift); l(10f, 4f - lift, 14f, 4f - lift)
                  }
                  Ik.UP -> { l(12f, 19f, 12f, 5f); l(12f, 5f, 6f, 11f); l(12f, 5f, 18f, 11f) }
                  Ik.DN -> { l(12f, 5f, 12f, 19f); l(12f, 19f, 6f, 13f); l(12f, 19f, 18f, 13f) }
                  Ik.MG -> { l(12f, 3f, 12f, 14f); l(12f, 14f, 7f, 9f); l(12f, 14f, 17f, 9f); l(5f, 19f, 19f, 19f) }
                  Ik.CX -> rotate(ph * 90f, o(12f, 12f)) {
                      poly(12f, 3f, 14f, 10f, 21f, 12f, 14f, 14f, 12f, 21f, 10f, 14f, 3f, 12f, 10f, 10f, fill = c2.copy(alpha = .5f))
                  }
                  Ik.CV -> rotate(ph * 180f, o(12f, 12f)) { l(7f, 10f, 12f, 15f); l(12f, 15f, 17f, 10f) }
                  Ik.OK -> { l(5f, 12f, 10f, 17f); l(10f, 17f, 19f, 7f) }
                  Ik.TH -> {
                      for (i in 0..5) { val a = (i * 60f + ph * 60f) * 0.01745f; dot(12f + cos(a) * 5.5f, 12f + sin(a) * 5.5f, 3.2f, if (i % 2 == 0) c else c2) }
                      dot(12f, 12f, 2.6f, Color.White)
                  }
                  Ik.FX -> {
                      l(4f, 20f, 14f, 10f)
                      rotate(ph * 90f, o(17f, 7f)) { poly(17f, 2f, 18.5f, 5.5f, 22f, 7f, 18.5f, 8.5f, 17f, 12f, 15.5f, 8.5f, 12f, 7f, 15.5f, 5.5f, fill = c2.copy(alpha = .6f)) }
                      dot(7f, 8f, 1.2f + w * .4f); dot(19f, 18f, 1f - w * .3f)
                  }
                  Ik.CP -> {
                      ring(12f, 12f, 9f)
                      rotate(ph * 360f, o(12f, 12f)) { poly(12f, 5f, 14.5f, 12f, 12f, 10.5f, 9.5f, 12f, fill = c2); l(12f, 13.5f, 12f, 18f, c.copy(alpha = .5f)) }
                  }
                  Ik.HM -> { poly(4f, 12f, 12f, 4f, 20f, 12f, close = false); poly(6f, 11f, 6f, 20f, 18f, 20f, 18f, 11f, close = false); l(10.5f, 20f, 10.5f, 15f); l(13.5f, 20f, 13.5f, 15f) }
                  Ik.LK -> {
                      drawRoundRect(c, o(6f, 11f), Size(12f * u, 9f * u), CornerRadius(2f * u), style = st)
                      drawArc(c, 180f, 180f, false, o(8f, 4f), Size(8f * u, 10f * u), style = st); dot(12f, 15.5f, 1.3f)
                  }
                  Ik.IM -> {
                      drawRoundRect(c, o(3f, 5f), Size(18f * u, 14f * u), CornerRadius(3f * u), style = st)
                      dot(9f, 10f, 1.8f + w * .3f); poly(4f, 18f, 10f, 12f, 14f, 16f, 17f, 13f, 20f, 18f, close = false)
                  }
                  Ik.GD -> {
                      for (i in 1..2) { l(3f + i * 6f, 4f, 3f + i * 6f, 20f, c.copy(alpha = .7f)); l(4f, 3f + i * 6f, 20f, 3f + i * 6f, c.copy(alpha = .7f)) }
                      dot(12f + w * 2f, 12f, 1.6f)
                  }
                  Ik.DC -> rotate(w * 12f, o(12f, 12f)) {
                      drawRoundRect(c, o(4f, 4f), Size(16f * u, 16f * u), CornerRadius(4f * u), style = st)
                      dot(9f, 9f, 1.4f, c); dot(15f, 15f, 1.4f, c); dot(12f, 12f, 1.4f, c2)
                  }
                  Ik.LS -> {
                      for (k in 0..5) drawArc(c, k * 60f + 8f, 38f, false, o(4f, 6f), Size(16f * u, 12f * u), style = st)
                      dot(18f + w * 1.5f, 18.5f, 1.8f, c2); l(17f, 15f, 18.5f, 17f, c2)
                  }
                  Ik.GS -> { for (i in 0..2) for (j in 0..2) dot(6f + i * 6f, 6f + j * 6f, 1.7f + (if (i == 1 && j == 1) w else 0f)) }
                  else -> {}
              }
          }

          // ───────────────────────── cute building blocks ─────────────────────────
          @Composable
          fun Tx(s: String, c: Color = T.ink, mod: Modifier = Modifier, sz: Float = T.fs) =
              Text(s, modifier = mod, color = c, fontSize = sz.sp, fontFamily = FONTS[T.fnt.toInt().coerceIn(0, FONTS.size - 1)], letterSpacing = T.ls.sp, maxLines = 1)

          @Composable
          fun Modifier.touch(f: (Float, Float) -> Unit): Modifier {
              val u by rememberUpdatedState(f)
              return pointerInput(Unit) {
                  awaitPointerEventScope {
                      while (true) {
                          val c = awaitPointerEvent().changes[0]
                          if (c.pressed) {
                              u((c.position.x / size.width).coerceIn(0f, 1f), (c.position.y / size.height).coerceIn(0f, 1f))
                              c.consume()
                          }
                      }
                  }
              }
          }

          /** Squishy bubble: spring squish + tilt on press, expanding ring + sparkles on tap, looping phase while [anim]. */
          @Composable
          fun Bub(sz: Float, on: Boolean, en: Boolean = true, anim: Boolean = on, pad: Float = .42f, f: () -> Unit, draw: DrawScope.(Float) -> Unit) {
              val src = remember { MutableInteractionSource() }
              val pr by src.collectIsPressedAsState()
              val sq by animateFloatAsState(if (pr) .82f else 1f, spring(.35f, 600f), label = "sq")
              val tl by animateFloatAsState(if (pr) -7f else 0f, spring(.35f, 400f), label = "tl")
              val pop = remember { Animatable(0f) }
              val scope = rememberCoroutineScope()
              val hf = LocalHapticFeedback.current
              // the phase is a State read only inside the draw lambda: animating never recomposes the bubble
              val phS: State<Float> = if (anim && T.an > .01f)
                  rememberInfiniteTransition(label = "ph").animateFloat(0f, 1f, infiniteRepeatable(tween(1800, easing = LinearEasing)), label = "p")
              else remember { derivedStateOf { pop.value } }
              val ac = T.ac; val ac2 = T.ac2; val bgc = if (on) T.ac else T.panel2
              Canvas(
                  Modifier.size(d(sz)).graphicsLayer { scaleX = 1f + (1f - sq) * .9f; scaleY = sq; rotationZ = tl; alpha = if (en) 1f else .3f }
                      .clickable(interactionSource = src, indication = null, enabled = en) {
                          if (T.hap > .5f) hf.performHapticFeedback(HapticFeedbackType.TextHandleMove)
                          scope.launch { pop.snapTo(0f); pop.animateTo(1f, tween(450)) }; f()
                      }
              ) {
                  val r = size.minDimension / 2f
                  val cr = CornerRadius(r * (.6f + .38f * T.bsh.coerceIn(.2f, 1f)))
                  val bs = Size(r * 1.84f, r * 1.84f)
                  val tl0 = Offset(r * .08f, r * .08f)
                  drawRoundRect(Color.Black.copy(alpha = .30f * T.sdw), Offset(r * .08f, r * .16f), bs, cr)
                  drawRoundRect(if (on) ac else Color(0xFF8CC8F0).copy(alpha = .26f), tl0, bs, cr)
                  drawRoundRect(Color(0xFF2149AA).copy(alpha = .9f), tl0, bs, cr, style = Stroke(maxOf(2f, r * .07f)))
                  val ga = (.4f + T.gls).coerceAtMost(1f)
                  rotate(-25f, Offset(r * 1.3f, r * .38f)) { drawOval(Color.White.copy(alpha = .85f * ga), Offset(r * 1.04f, r * .26f), Size(r * .52f, r * .24f)) }
                  drawCircle(Color.White.copy(alpha = .85f * ga), r * .07f, Offset(r * 1.72f, r * .78f))
                  val pv = pop.value
                  if (pv > 0f && pv < 1f) {
                      drawCircle(ac2.copy(alpha = (1f - pv) * .8f), r * (.95f + .55f * pv), Offset(r, r), style = Stroke(2.5f))
                      for (i in 0..5) {
                          val a = i * 1.0472f + .4f; val rr = r * (1f + .5f * pv)
                          drawCircle(ac.copy(alpha = 1f - pv), 2.4f, Offset(r + cos(a) * rr, r + sin(a) * rr))
                      }
                  }
                  inset(r * pad) { draw(phS.value) }
              }
          }

          @Composable
          fun IB(k: Ik, on: Boolean = false, en: Boolean = true, sz: Float = 44f, anim: Boolean = on, f: () -> Unit) {
              val ac2 = T.ac2
              Bub(sz, on, en, anim, .42f, f) { ph -> ic(k, if (on) T.dk else T.ink, if (on) Color.White else ac2, ph) }
          }

          @Composable
          fun Pill(s: String, on: Boolean = false, k: Ik? = null, ph: Float = 0f, f: () -> Unit) {
              val src = remember { MutableInteractionSource() }
              val pr by src.collectIsPressedAsState()
              val sq by animateFloatAsState(if (pr) .9f else 1f, spring(.4f, 500f), label = "pl")
              val fg = if (on) T.dk else T.ink
              val ac2 = T.ac2
              Row(
                  Modifier.graphicsLayer { scaleX = 1f + (1f - sq) * .9f; scaleY = sq }.clip(RoundedCornerShape(50)).background(if (on) T.ac else T.panel2)
                      .border(d(1.2f), Color(0xFF2B54B8).copy(alpha = if (on) .9f else .5f), RoundedCornerShape(50))
                      .clickable(interactionSource = src, indication = null, onClick = f).padding(horizontal = d(11f), vertical = d(7f)),
                  verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))
              ) {
                  if (k != null) Canvas(Modifier.size(d(16f))) { ic(k, fg, ac2, ph) }
                  Tx(s, fg)
              }
          }

          /** Slider whose knob is a little face (with haptic ticks). */
          @Composable
          fun CS(t: Float, mod: Modifier = Modifier, on: (Float) -> Unit) {
              val ac = T.ac; val ac2 = T.ac2; val tr = T.panel2
              val hf = LocalHapticFeedback.current
              val q = remember { IntArray(1) }
              Box(
                  Modifier.then(mod).height(d(28f)).drawBehind {
                      val h = size.height; val r = h / 2f
                      val x = r + (size.width - 2f * r) * t.coerceIn(0f, 1f)
                      val cr = CornerRadius(h * .25f)
                      drawRoundRect(tr, Offset(0f, h * .25f), Size(size.width, h * .5f), cr)
                      drawRoundRect(Brush.horizontalGradient(listOf(ac2, ac), 0f, x.coerceAtLeast(1f)), Offset(0f, h * .25f), Size(x, h * .5f), cr)
                      drawCircle(Color.White, r * .92f, Offset(x, r))
                      drawCircle(T.dk, r * .09f, Offset(x - r * .28f, r * .86f)); drawCircle(T.dk, r * .09f, Offset(x + r * .28f, r * .86f))
                      drawArc(T.dk, 20f, 140f, false, Offset(x - r * .2f, r * .92f), Size(r * .4f, r * .26f), style = Stroke(r * .08f, cap = StrokeCap.Round))
                      drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x - r * .52f, r * 1.08f)); drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x + r * .52f, r * 1.08f))
                  }.touch { xx, _ ->
                      val k = (xx * 24f).toInt()
                      if (k != q[0]) { q[0] = k; if (T.hap > .5f) hf.performHapticFeedback(HapticFeedbackType.TextHandleMove) }
                      on(xx)
                  }
              )
          }

          @Composable
          fun R2(p: PP) {
              val rv = U.rev
              val v = p.g()
              val t = if (p.log) ln(v / p.lo) / ln(p.hi / p.lo) else (v - p.lo) / (p.hi - p.lo)
              fun set(x: Float) { p.s(x.coerceIn(p.lo, p.hi)); U.bump() }
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))) {
                  Tx(p.n, T.ink.copy(alpha = .8f), Modifier.width(d(64f)), 10f)
                  IB(Ik.MI, sz = 30f) { set(v - p.st) }
                  CS(t, Modifier.weight(1f)) { x -> set(if (p.log) p.lo * (p.hi / p.lo).pow(x) else p.lo + x * (p.hi - p.lo)) }
                  IB(Ik.PL, sz = 30f) { set(v + p.st) }
                  Tx("%.2f".format(v), mod = Modifier.width(d(48f)))
              }
          }

          fun DrawScope.drawEars(ac: Color, ac2: Color, s: Float, ear: Int) {
              val inn = ac2.copy(alpha = .7f)
              when (ear) {
                  1 -> for (sd in 0..1) {
                      val x = if (sd == 0) .22f else .78f; val dx = if (sd == 0) 1f else -1f
                      val pa = Path(); pa.moveTo(s * (x - .12f * dx), s * .3f); pa.lineTo(s * (x - .02f * dx), s * .02f); pa.lineTo(s * (x + .13f * dx), s * .22f); pa.close(); drawPath(pa, ac)
                      val pb = Path(); pb.moveTo(s * (x - .06f * dx), s * .26f); pb.lineTo(s * (x - .01f * dx), s * .1f); pb.lineTo(s * (x + .07f * dx), s * .22f); pb.close(); drawPath(pb, inn)
                  }
                  2 -> for (sd in 0..1) {
                      val x = if (sd == 0) .3f else .7f
                      drawOval(ac, Offset(s * (x - .07f), 0f), Size(s * .14f, s * .34f)); drawOval(inn, Offset(s * (x - .035f), s * .05f), Size(s * .07f, s * .22f))
                  }
                  else -> {
                      drawCircle(ac, s * .13f, Offset(s * .24f, s * .2f)); drawCircle(ac, s * .13f, Offset(s * .76f, s * .2f))
                      drawCircle(inn, s * .06f, Offset(s * .24f, s * .2f)); drawCircle(inn, s * .06f, Offset(s * .76f, s * .2f))
                  }
              }
          }

          /** tier accessories: 1 leaf, 4 unicorn horn, 5 crown (2/3 reuse the bunny / cat ears). */
          fun DrawScope.drawAcc(acc: Int, s: Float, ac2: Color) {
              when (acc) {
                  1 -> {
                      val g = Color(0xFF7BE495)
                      for (sd in 0..1) rotate(if (sd == 0) -35f else 35f, Offset(s * .5f, s * .17f)) { drawOval(g, Offset(s * (if (sd == 0) .36f else .5f), s * .05f), Size(s * .14f, s * .09f)) }
                      drawLine(g, Offset(s * .5f, s * .17f), Offset(s * .5f, s * .1f), s * .025f, StrokeCap.Round)
                  }
                  4 -> {
                      val pa = Path(); pa.moveTo(s * .5f, 0f); pa.lineTo(s * .43f, s * .2f); pa.lineTo(s * .57f, s * .2f); pa.close()
                      drawPath(pa, Color(0xFFFFD86B)); drawCircle(Color.White, s * .02f, Offset(s * .56f, s * .05f))
                  }
                  5 -> {
                      val pa = Path(); pa.moveTo(s * .32f, s * .2f); pa.lineTo(s * .34f, s * .04f); pa.lineTo(s * .42f, s * .13f); pa.lineTo(s * .5f, 0f)
                      pa.lineTo(s * .58f, s * .13f); pa.lineTo(s * .66f, s * .04f); pa.lineTo(s * .68f, s * .2f); pa.close()
                      drawPath(pa, Color(0xFFFFD86B)); drawCircle(ac2, s * .02f, Offset(s * .5f, s * .14f))
                  }
              }
          }

          // ───────────────────────── panels ─────────────────────────
          @Composable
          fun ToolsPanel(cur: Tool, pick: (Tool) -> Unit) {
              Tool.values().toList().chunked(5).forEach { row ->
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      row.forEach { t ->
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              IB(Ik.valueOf(t.code), t == cur, sz = 46f) { pick(t) }
                              Tx(TN[t.ordinal], if (t == cur) T.ac else T.ink.copy(alpha = .7f), sz = 9f)
                          }
                      }
                  }
              }
          }

          @Composable
          fun BrushPanel(e: Engine) {
              val rv = U.rev
              var more by remember { mutableStateOf(false) }
              val ps = penParams(e)
              BrushPreview(e)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PRESETS.forEach { (n, vals) -> Pill(n) { e.pen.load(vals); U.bump() } }
              }
              R2(ps[0]); R2(ps[1])
              val pg by animateFloatAsState(if (more) 1f else 0f, spring(.6f, 300f), label = "more")
              Pill(if (more) "LESS" else "MORE", more, Ik.CV, pg) { more = !more }
              if (more) {
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Pill("FOLLOW", e.pen.follow) { e.pen.follow = !e.pen.follow; U.bump() }
                      SYM.forEachIndexed { i, s -> Pill(s, e.symMode == i) { e.symMode = i; U.bump() } }
                  }
                  ps.drop(2).forEach { R2(it) }
              }
          }

          @Composable
          fun ColorPanel(e: Engine, feel: (Int, String) -> Unit) {
              val rv = U.rev
              val hc = Color(android.graphics.Color.HSVToColor(floatArrayOf(U.hh, 1f, 1f)))
              fun ap() { val c = U.col(); if (U.tgt == 0) e.pen.color = c else e.pen.color2 = c; U.bump() }
              Row(horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  Pill("FG", U.tgt == 0) { U.tgt = 0; U.from(e.pen.color) }
                  Pill("BG", U.tgt == 1) { U.tgt = 1; U.from(e.pen.color2) }
                  Pill("SWAP", false, Ik.SY) {
                      val t = e.pen.color; e.pen.color = e.pen.color2; e.pen.color2 = t
                      U.from(if (U.tgt == 0) e.pen.color else e.pen.color2); U.bump()
                  }
                  Tx("#%06X".format(U.col() and 0xFFFFFF))
              }
              Box(
                  Modifier.fillMaxWidth().height(d(150f)).clip(rs(.8f)).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.White, hc)))
                      drawRect(Brush.verticalGradient(listOf(Color.Transparent, Color.Black)))
                      drawCircle(Color.White, radius = 10f, center = Offset(U.ss * size.width, (1f - U.bb) * size.height), style = Stroke(3.5f))
                  }.touch { x, y -> U.ss = x; U.bb = 1f - y; ap() }
              )
              Box(
                  Modifier.fillMaxWidth().height(d(26f)).clip(RoundedCornerShape(50)).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.Red, Color.Yellow, Color.Green, Color.Cyan, Color.Blue, Color.Magenta, Color.Red)))
                      drawCircle(Color.White, size.height / 2f - 2f, Offset(U.hh / 360f * size.width, size.height / 2f), style = Stroke(4f))
                  }.touch { x, _ -> U.hh = x * 360f; ap() }
              )
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                  PASTEL.forEach { c ->
                      Bub(36f, false, anim = false, pad = .26f, f = { U.from(Color(c).toArgb()); ap(); feel(1, "pretty!") }) {
                          drawCircle(Color(c), size.minDimension / 2f)
                      }
                  }
              }
              Recents { c -> U.from(c); ap(); feel(1, "back again!") }
              Harmony { c -> U.from(c); ap(); feel(1, "in tune!") }
          }

          @Composable
          fun LayerPanel(e: Engine, v: CanvasView, feel: (Int, String) -> Unit) {
              var pickBlend by remember { mutableIntStateOf(-1) }
              if (pickBlend >= 0 && pickBlend < e.info.size) {
                  val bi = pickBlend
                  BlendList(e.info[bi].blend, e.advOk, { pickBlend = -1 }) { m -> v.gl { e.setBlend(bi, m) }; pickBlend = -1; feel(1, BLEND_N[m].lowercase()) }
                  return
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  IB(Ik.PL, sz = 40f) { v.gl { e.addLayer() }; feel(1, "new layer!") }
                  IB(Ik.DP, sz = 40f) { v.gl { e.dupLayer() } }
                  IB(Ik.TR, sz = 40f) { v.gl { e.delLayer() }; feel(4, "bye layer") }
                  IB(Ik.UP, sz = 40f) { v.gl { e.moveLayer(1) } }
                  IB(Ik.DN, sz = 40f) { v.gl { e.moveLayer(-1) } }
                  IB(Ik.MG, sz = 40f) { v.gl { e.mergeDown() } }
                  IB(Ik.CX, sz = 40f) { v.gl { e.clearLayer() }; feel(1, "squeaky clean") }
              }
              e.info.indices.reversed().forEach { i ->
                  val l = e.info[i]
                  Row(
                      Modifier.fillMaxWidth().clip(rs(.6f)).background(if (i == e.curUi) T.ac.copy(alpha = .16f) else Color.Transparent)
                          .clickable { v.gl { e.select(i) } }.padding(d(3f)),
                      verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))
                  ) {
                      Tx("L" + (i + 1), if (i == e.curUi) T.ac else T.ink, Modifier.width(d(28f)))
                      IB(if (l.show) Ik.EY else Ik.EN, l.show, sz = 34f, anim = false) { v.gl { e.setShow(i, !l.show) } }
                      Pill(BLEND_N[l.blend.coerceIn(0, BLEND_N.size - 1)], l.blend != 0, Ik.FX) { pickBlend = i }
                      CS(l.alpha, Modifier.weight(1f)) { x -> v.gl { e.setAlpha(i, x) } }
                  }
              }
          }

          @Composable
          fun MenuPanel(
              e: Engine, sym: () -> Unit, save: () -> Unit, theme: () -> Unit, hide: () -> Unit, img: () -> Unit, guide: () -> Unit,
              inspire: () -> Unit, proj: () -> Unit, saveHome: () -> Unit, home: () -> Unit
          ) {
              val rv = U.rev
              var sure by remember { mutableStateOf(false) }
              if (sure) {
                  Tx("leave this canvas?", T.ac, sz = 10f)
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                      Pill("SAVE & LEAVE", true, Ik.SV) { saveHome() }
                      Pill("LEAVE WITHOUT SAVING", false, Ik.HM) { home() }
                      Pill("STAY") { sure = false }
                  }
              } else {
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                      Pill("SYM " + SYM[e.symMode], e.symMode != 0, Ik.SY) { sym() }
                      Pill("GUIDE " + GUIDE_N[e.guide], e.guide != 0, Ik.GD) { guide() }
                      Pill("IMAGE", false, Ik.IM) { img() }
                      Pill("PROJECT", false, Ik.LY) { proj() }
                      Pill("EXPORT PNG", false, Ik.SV) { save() }
                      Pill("IDEA", false, Ik.DC) { inspire() }
                      Pill("STYLE", false, Ik.TH) { theme() }
                      Pill(if (e.rotLock) "ROT LOCKED" else "ROT FREE", e.rotLock, Ik.LK) { e.rotLock = !e.rotLock; U.bump() }
                      Pill("HIDE", false, Ik.CV) { hide() }
                      Pill("HOME", false, Ik.HM) { sure = true }
                  }
              }
          }

          @Composable
          fun ThemePanel(done: () -> Unit) {
              val rv = U.rev
              var grp by remember { mutableIntStateOf(0) }
              val gs = themeGroups()
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  THEME_PRESETS.forEach { v ->
                      Bub(38f, false, anim = false, pad = .2f, f = { applyPreset(v); U.bump() }) {
                          drawCircle(T.hsv(v[0], v[1], v[2]), size.minDimension / 2f)
                          drawCircle(T.hsv(v[8], v[9], .9f), size.minDimension * .2f, Offset(size.width * .7f, size.height * .3f))
                      }
                  }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  gs.forEachIndexed { i, g -> Pill(g.first, grp == i) { grp = i } }
                  Pill("DICE", false, Ik.DC) { surprise(); U.bump() }
                  Pill("DONE", true, Ik.OK, f = done)
              }
              if (grp == 4) {
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      PAT_NAMES.forEachIndexed { i, n -> Pill(n, T.pat.toInt() == i) { T.pat = i.toFloat(); U.bump() } }
                  }
              }
              if (grp == 2) FontPick()
              if (grp == 5) LayoutPanel() else gs[grp].second.forEach { R2(it) }
          }

          fun saveBmp(ctx: Context, b: Bitmap) {
              val n = "Canvas_" + System.currentTimeMillis() + ".png"
              var ok = true
              try {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val cv = ContentValues()
                      cv.put(MediaStore.Images.Media.DISPLAY_NAME, n)
                      cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                      cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Canvas")
                      val u = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv)!!
                      ctx.contentResolver.openOutputStream(u)!!.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  } else {
                      val f = java.io.File(ctx.getExternalFilesDir(Environment.DIRECTORY_PICTURES), n)
                      f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  }
              } catch (x: Exception) { ok = false }
              Handler(Looper.getMainLooper()).post {
                  Toast.makeText(ctx, if (ok) "saved " + n else "save failed", Toast.LENGTH_LONG).show()
              }
          }

          // ───────────────────────── app ─────────────────────────
          @Composable
          fun Compass(e: Engine, v: CanvasView, onReset: () -> Unit) {
              val moved by remember { derivedStateOf { e.rot != 0f || e.zoom != 1f } }
              AnimatedVisibility(visible = moved, enter = scaleIn(spring(.5f, 400f)) + fadeIn(), exit = scaleOut() + fadeOut()) {
                  Bub(40f, false, anim = false, pad = .24f, f = { e.resetView(); v.requestRender(); onReset() }) { ic(Ik.CP, T.ink, T.ac2, e.rot / 6.2832f) }
              }
          }

          @Composable
          fun App(e: Engine, pid: String, onHome: () -> Unit) {
              val ctx = LocalContext.current
              val density = LocalDensity.current
              val v = remember { CanvasView(ctx, e) }
              val rv = U.rev
              val sig = T.sig()
              val scope = rememberCoroutineScope()
              var tool by remember { mutableStateOf(Tool.BRUSH) }
              var panel by remember { mutableIntStateOf(0) }   // 0 none 1 tools 2 brush 3 color 4 layers 5 menu 6 style 7 fx
              var last by remember { mutableIntStateOf(1) }
              var hud by remember { mutableStateOf(true) }
              var mood by remember { mutableIntStateOf(0) }
              var say by remember { mutableStateOf("") }
              var sayOn by remember { mutableStateOf(false) }
              var backT by remember { mutableLongStateOf(0L) }
              var conf by remember { mutableIntStateOf(0) }
              var held by remember { mutableStateOf(false) }
              var dragO by remember { mutableStateOf(Offset.Zero) }
              var thumbs by remember { mutableStateOf<List<ImageBitmap>>(emptyList()) }
              val job = remember { arrayOfNulls<Job>(1) }
              fun feel(m: Int, s: String, ms: Long = 1500L) {
                  job[0]?.cancel(); mood = m; say = s; sayOn = true
                  job[0] = scope.launch { delay(ms); mood = 0; sayOn = false }
              }
              fun saveProj(then: () -> Unit) {
                  feel(2, "saving project...", 8000L)
                  v.gl {
                      val ok = e.saveProject(Proj.dir(ctx, pid))
                      Handler(Looper.getMainLooper()).post { feel(if (ok) 3 else 4, if (ok) "project saved!" else "save failed :(", 1800L); if (ok) conf++; then() }
                  }
              }
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { u ->
                  if (u != null) {
                      feel(2, "importing...")
                      Thread {
                          val b = decodeImg(ctx, u, 2048)
                          if (b != null) v.gl { e.importImage(b) }
                      }.start()
                  }
              }
              SideEffect {
                  T.push(e); v.requestRender(); if (panel != 0) last = panel
                  if (T.fol > .5f) {
                      val hs = FloatArray(3); android.graphics.Color.colorToHSV(e.pen.color, hs)
                      if (hs[1] > .08f && abs(T.fh - hs[0]) > 1f) T.fh = hs[0]
                  }
              }
              LaunchedEffect(Unit) {
                  e.onPick = { c -> U.tgt = 0; U.from(c); U.bump() }
                  e.onThumbs = { list -> thumbs = list.map { it.asImageBitmap() } }
                  U.from(e.pen.color)
                  feel(1, "hi~ let's draw!")
              }
              LaunchedEffect(e.busy) { if (e.busy && (panel == 1 || panel == 5)) panel = 0 }
              LaunchedEffect(e.busy) {
                  if (e.busy) U.pushHist(e.pen.color)
                  else ctx.getSharedPreferences("t", 0).edit().putString("hist", U.hist.joinToString(",")).apply()
              }
              LaunchedEffect(panel) { if (panel == 7) v.gl { e.fxOpen(); e.fxThumbs(72) } else v.gl { e.fxClose() } }
              BackHandler {
                  if (panel != 0) panel = 0
                  else if (!hud) hud = true
                  else {
                      val n = System.currentTimeMillis()
                      if (n - backT < 2000) { if (e.edits > 0 || Proj.dir(ctx, pid).exists()) saveProj { onHome() } else onHome() } else { backT = n; feel(4, "back again to save & leave") }
                  }
              }
              val m = if (!hud) 5 else if (e.busy) 2 else mood
              val side = T.dks > .5f
              val left = T.dkx < .5f
              val top = !side && T.dky > .5f
              val dax by animateFloatAsState(T.dkx * 2f - 1f, spring(.75f, 260f), label = "dax")
              val day by animateFloatAsState(if (top) -1f else 1f, spring(.8f, 220f), label = "day")
              val dockA by animateFloatAsState(if (e.busy) .08f else 1f, label = "dock")

              // hold the toolbar, then drag it: sideways = stick to that edge as a vertical bar, back toward the middle = bottom bar again
              val hold = Modifier.holdDrag(
                  onStart = { held = true; dragO = Offset.Zero },
                  onMove = { dv -> dragO = dragO + dv },
                  onEnd = {
                      val thr = density.density * 70f
                      val dx = dragO.x; val dy = dragO.y
                      val sd = T.dks > .5f; val lf = T.dkx < .5f
                      if (!sd) {
                          if (dx > thr) { T.dks = 1f; T.dkx = 1f }
                          else if (dx < -thr) { T.dks = 1f; T.dkx = 0f }
                          else if (dy < -thr) { T.dky = 1f }
                          else if (dy > thr) { T.dky = 0f }
                      } else {
                          if ((lf && dx > thr * 1.2f) || (!lf && dx < -thr * 1.2f)) { T.dks = 0f; T.dkx = .5f; T.dky = 0f }
                      }
                      held = false; dragO = Offset.Zero
                      T.save(ctx.getSharedPreferences("t", 0)); feel(1, "docked!")
                  }
              )

              Box(Modifier.fillMaxSize()) {
                  AndroidView({ v }, Modifier.fillMaxSize())
                  Guides(e, e.symMode, e.symN, e.guide, e.busy)
                  LassoOverlay(e, e.lassoN)
                  StringOverlay(e, tool)
                  if (!hud) {
                      Box(Modifier.align(Alignment.BottomStart).navigationBarsPadding().padding(d(10f))) { Mascot(5, 52f) { hud = true; feel(1, "hi!") } }
                  } else {
                      Row(Modifier.align(Alignment.TopStart).statusBarsPadding().padding(d(10f)), horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                          IB(Ik.UN, en = e.canUndo, anim = false) { v.gl { e.undo() }; feel(4, "oops!") }
                          IB(Ik.RE, en = e.canRedo, anim = false) { v.gl { e.redo() }; feel(1, "again!") }
                      }
                      Column(
                          Modifier.align(Alignment.TopEnd).statusBarsPadding().padding(d(10f)),
                          horizontalAlignment = Alignment.End, verticalArrangement = Arrangement.spacedBy(d(4f))
                      ) {
                          Compass(e, v) { feel(1, "reset view") }
                          ViewChip(e)
                      }
                      val panelUi: @Composable () -> Unit = {
                          AnimatedVisibility(
                              visible = panel != 0,
                              enter = fadeIn() + scaleIn(spring(.55f, 380f), initialScale = .9f, transformOrigin = TransformOrigin(.5f, if (top) 0f else 1f)) + expandVertically(),
                              exit = fadeOut() + scaleOut(targetScale = .92f, transformOrigin = TransformOrigin(.5f, if (top) 0f else 1f)) + shrinkVertically()
                          ) {
                              Column(
                                  Modifier.fillMaxWidth().padding(vertical = d(6f)).heightIn(max = d(360f)).glass(key = if (panel != 0) panel else last)
                                      .animateContentSize().verticalScroll(rememberScrollState()).padding(d(10f)),
                                  verticalArrangement = Arrangement.spacedBy(d(8f))
                              ) {
                                  when (if (panel != 0) panel else last) {
                                      1 -> ToolsPanel(tool) { t -> tool = t; e.tool = t; e.inv = false; U.bump(); feel(1, SAY[t.ordinal]); panel = 0 }
                                      2 -> BrushPanel(e)
                                      3 -> ColorPanel(e) { a, b -> feel(a, b) }
                                      4 -> LayerPanel(e, v) { a, b -> feel(a, b) }
                                      5 -> MenuPanel(
                                          e,
                                          sym = { e.symMode = (e.symMode + 1) % 5; U.bump(); feel(1, "sym " + SYM[e.symMode]) },
                                          save = { v.gl { val b = e.snapshot(); Thread { saveBmp(ctx, b) }.start() }; feel(3, "saved!"); conf++; panel = 0 },
                                          theme = { panel = 6 },
                                          hide = { hud = false; panel = 0 },
                                          img = {
                                              if (e.info.size >= e.maxLayers) feel(4, "layer limit!") else picker.launch("image/*")
                                              panel = 0
                                          },
                                          guide = { e.guide = (e.guide + 1) % GUIDE_N.size; U.bump(); feel(1, "guide " + GUIDE_N[e.guide].lowercase()) },
                                          inspire = { feel(1, idea(), 4200L) },
                                          proj = { saveProj { } },
                                          saveHome = { saveProj { onHome() } },
                                          home = { onHome() }
                                      )
                                      6 -> ThemePanel { T.save(ctx.getSharedPreferences("t", 0)); panel = 0; feel(3, "so cute!") }
                                      else -> FxPanel(e, v, thumbs, { panel = 0; feel(3, "sparkly!") }, { panel = 0 })
                                  }
                              }
                          }
                      }
                      val sayUi: @Composable () -> Unit = {
                          Box(Modifier.fillMaxWidth(), contentAlignment = BiasAlignment(dax, 0f)) {
                              AnimatedVisibility(visible = sayOn, enter = scaleIn(spring(.5f, 500f)) + fadeIn(), exit = fadeOut() + scaleOut()) {
                                  Tx(say, T.dk, Modifier.padding(bottom = d(4f)).clip(RoundedCornerShape(50)).background(T.ac).padding(horizontal = d(12f), vertical = d(5f)))
                              }
                          }
                      }
                      val barUi: @Composable () -> Unit = { SizeBar(e, tool) { t -> tool = t; e.tool = t; U.bump() } }
                      val dockItems: @Composable () -> Unit = {
                          Mascot(m, 46f) { panel = if (panel == 5) 0 else 5 }
                          IB(Ik.valueOf(tool.code), true, sz = 44f, anim = !e.busy) { panel = if (panel == 1) 0 else 1 }
                          val nz = (ln(e.pen.size) / ln(1000f)).coerceIn(0f, 1f)
                          val hd = e.pen.hardness.coerceIn(0f, .97f)
                          Bub(44f, panel == 2, anim = false, pad = .2f, f = { panel = if (panel == 2) 0 else 2 }) {
                              val col = if (panel == 2) T.dk else T.ink
                              drawCircle(Brush.radialGradient(0f to col, hd to col, 1f to col.copy(alpha = 0f)), size.minDimension / 2f * (.35f + .65f * nz))
                          }
                          Bub(44f, panel == 3, anim = false, pad = .24f, f = { panel = if (panel == 3) 0 else 3; U.from(if (U.tgt == 0) e.pen.color else e.pen.color2) }) {
                              val s2 = size.minDimension
                              drawCircle(Color(e.pen.color2), s2 * .3f, Offset(s2 * .66f, s2 * .66f))
                              drawCircle(Color.White, s2 * .36f, Offset(s2 * .4f, s2 * .4f))
                              drawCircle(Color(e.pen.color), s2 * .29f, Offset(s2 * .4f, s2 * .4f))
                          }
                          Box {
                              IB(Ik.LY, panel == 4, sz = 44f, anim = false) { panel = if (panel == 4) 0 else 4 }
                              Tx("" + e.info.size, T.dk, Modifier.align(Alignment.BottomEnd).clip(CircleShape).background(T.ac2).padding(horizontal = d(5f)), 9f)
                          }
                          IB(Ik.FX, panel == 7, sz = 44f, anim = false) { panel = if (panel == 7) 0 else 7 }
                      }
                      val dockRow: @Composable () -> Unit = {
                          Box(Modifier.fillMaxWidth(), contentAlignment = BiasAlignment(dax, 0f)) {
                              Row(
                                  Modifier.graphicsLayer { translationX = dragO.x; translationY = dragO.y }.then(hold)
                                      .glass(RoundedCornerShape(50), key = tool.ordinal * 10 + panel).padding(d(6f)),
                                  horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically
                              ) { dockItems() }
                          }
                      }
                      if (held) {
                          Box(Modifier.align(Alignment.CenterStart).fillMaxHeight(.45f).width(d(20f)).clip(RoundedCornerShape(50)).background(T.ac.copy(alpha = .4f)))
                          Box(Modifier.align(Alignment.CenterEnd).fillMaxHeight(.45f).width(d(20f)).clip(RoundedCornerShape(50)).background(T.ac.copy(alpha = .4f)))
                      }
                      if (side) {
                          Box(
                              Modifier.align(if (left) Alignment.CenterStart else Alignment.CenterEnd).padding(horizontal = d(6f))
                                  .graphicsLayer { translationX = dragO.x; translationY = dragO.y; alpha = dockA }.then(hold)
                          ) {
                              Column(
                                  Modifier.glass(RoundedCornerShape(50), key = tool.ordinal * 10 + panel).padding(d(6f)),
                                  verticalArrangement = Arrangement.spacedBy(d(6f)), horizontalAlignment = Alignment.CenterHorizontally
                              ) { dockItems() }
                          }
                      }
                      Column(
                          Modifier.align(BiasAlignment(0f, day)).fillMaxWidth()
                              .then(if (top) Modifier.statusBarsPadding().padding(top = d(54f)) else Modifier.navigationBarsPadding())
                              .padding(start = if (side && left) d(70f) else d(8f), end = if (side && !left) d(70f) else d(8f), top = d(8f), bottom = d(8f))
                              .graphicsLayer { alpha = dockA }
                      ) {
                          if (top) { dockRow(); barUi(); panelUi(); sayUi() } else { sayUi(); panelUi(); barUi(); if (!side) dockRow() }
                      }
                  }
                  Confetti(conf, Modifier.fillMaxSize())
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Fx.kt <<'EOF_SRC'
          package dev.canvas

          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.layout.ContentScale

          class FxP(val n: String, val lo: Float, val hi: Float, val d: Float)
          class Fx(val n: String, val cat: Int, val m: Int, val ps: List<FxP>)

          val FXC = listOf("COLOR", "STYLE", "DISTORT", "BLUR", "LOOKS")
          private fun p(n: String, lo: Float, hi: Float, d: Float) = FxP(n, lo, hi, d)

          /** 46 filters. m = shader mode (100+ = multi-pass recipes built in Engine.fxPlan). */
          val FXS = listOf(
              Fx("BRIGHT", 0, 1, listOf(p("BRIGHT", -1f, 1f, 0f), p("CONTRAST", 0f, 2f, 1f))),
              Fx("HUE/SAT", 0, 2, listOf(p("HUE", -180f, 180f, 0f), p("SAT", 0f, 2f, 1f), p("VALUE", 0f, 2f, 1f))),
              Fx("WARMTH", 0, 3, listOf(p("TEMP", -1f, 1f, .4f), p("TINT", -1f, 1f, 0f))),
              Fx("LEVELS", 0, 4, listOf(p("GAMMA", .2f, 3f, 1f), p("BLACK", 0f, 1f, 0f), p("WHITE", 0f, 1f, 1f))),
              Fx("INVERT", 0, 5, listOf(p("AMOUNT", 0f, 1f, 1f))),
              Fx("SEPIA", 0, 6, listOf(p("AMOUNT", 0f, 1f, 1f), p("SEPIA", 0f, 1f, 1f))),
              Fx("DUOTONE", 0, 7, listOf(p("MIX", 0f, 1f, 1f))),
              Fx("TRITONE", 0, 8, listOf(p("MIX", 0f, 1f, 1f))),
              Fx("POSTER", 0, 9, listOf(p("LEVELS", 2f, 16f, 5f))),
              Fx("THRESH", 0, 10, listOf(p("LEVEL", 0f, 1f, .5f), p("SOFT", 0f, .5f, .02f))),
              Fx("VIGNETTE", 0, 11, listOf(p("AMOUNT", 0f, 1f, .6f), p("RADIUS", .1f, 1f, .35f), p("SOFT", .05f, 1f, .5f))),
              Fx("CHROMA", 0, 12, listOf(p("SHIFT", 0f, 30f, 6f))),
              Fx("SOLAR", 0, 13, listOf(p("LEVEL", 0f, 1f, .5f))),
              Fx("PIXEL", 1, 14, listOf(p("SIZE", 2f, 64f, 8f))),
