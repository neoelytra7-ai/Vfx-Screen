# Slime Canvas 5.0 (glass slime, per-layer liquify, stacked sliders + limits, stabilizer, lasso erase outline, project saves, gallery home)
# Single-file pipeline: this YAML contains the whole Android app (Kotlin) + build + sign + release.
# Edit the source blocks in the 'src' step and push: every push builds an updatable APK.
name: apk
on:
  push:
  workflow_dispatch:
concurrency: {group: "apk-${{github.ref}}", cancel-in-progress: true}
permissions: {contents: write}
env: {N: Canvas}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - name: src
        run: |
          cat > settings.gradle.kts <<'EOF_SRC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Canvas"
          include(":app")
          EOF_SRC
          cat > build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_SRC
          cat > gradle.properties <<'EOF_SRC'
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_SRC
          cat > .gitignore <<'EOF_SRC'
          build/
          .gradle/
          local.properties
          *.jks
          EOF_SRC
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "dev.canvas"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.canvas"; minSdk = 24; targetSdk = 35
                  versionCode = (findProperty("versionCode") as String?)?.toInt() ?: 1
                  versionName = findProperty("versionName") as String? ?: "dev"
              }
              buildTypes { release { isMinifyEnabled = true; isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt")) } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
          }
          EOF_SRC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <application android:label="Mochi Canvas" android:icon="@mipmap/ic_launcher" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0" android:color="#FFC2DC" />
                          <item android:offset="1" android:color="#C9B6FF" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:fillColor="#40FFFFFF" android:pathData="M12,22 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0 z" />
              <path android:fillColor="#33FFFFFF" android:pathData="M86,78 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 z" />
              <path android:fillColor="#33FFFFFF" android:pathData="M18,88 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0 z" />
              <path android:fillColor="#40FFFFFF" android:pathData="M90,16 l1.2,3.8 l3.8,1.2 l-3.8,1.2 l-1.2,3.8 l-1.2,-3.8 l-3.8,-1.2 l3.8,-1.2 z" />
          </vector>
          EOF_SRC
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FF8FBC" android:pathData="M30,38 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 z" />
              <path android:fillColor="#FF8FBC" android:pathData="M60,38 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 z" />
              <path android:fillColor="#FFD0E2" android:pathData="M34.5,38 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0 z" />
              <path android:fillColor="#FFD0E2" android:pathData="M64.5,38 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0 z" />
              <path android:fillColor="#FF9EC4" android:pathData="M27,60 a27,23 0 1,0 54,0 a27,23 0 1,0 -54,0 z" />
              <path android:fillColor="#66FFFFFF" android:pathData="M35,48 a8,4 0 1,0 16,0 a8,4 0 1,0 -16,0 z" />
              <path android:fillColor="#99FF6F9C" android:pathData="M31,67 a5,3.2 0 1,0 10,0 a5,3.2 0 1,0 -10,0 z" />
              <path android:fillColor="#99FF6F9C" android:pathData="M67,67 a5,3.2 0 1,0 10,0 a5,3.2 0 1,0 -10,0 z" />
              <path android:fillColor="#2A1722" android:pathData="M41.8,59 a3.2,3.2 0 1,0 6.4,0 a3.2,3.2 0 1,0 -6.4,0 z" />
              <path android:fillColor="#2A1722" android:pathData="M59.8,59 a3.2,3.2 0 1,0 6.4,0 a3.2,3.2 0 1,0 -6.4,0 z" />
              <path android:fillColor="#FFFFFF" android:pathData="M44.9,58 a1.1,1.1 0 1,0 2.2,0 a1.1,1.1 0 1,0 -2.2,0 z" />
              <path android:fillColor="#FFFFFF" android:pathData="M62.9,58 a1.1,1.1 0 1,0 2.2,0 a1.1,1.1 0 1,0 -2.2,0 z" />
              <path
                  android:fillColor="#00000000"
                  android:pathData="M49,66 q5,5 10,0"
                  android:strokeColor="#2A1722"
                  android:strokeLineCap="round"
                  android:strokeWidth="2.4" />
              <path android:fillColor="#FFFFFF" android:pathData="M76,24 l1.8,5.2 l5.2,1.8 l-5.2,1.8 l-1.8,5.2 l-1.8,-5.2 l-5.2,-1.8 l5.2,-1.8 z" />
              <path android:fillColor="#FFFFFF" android:pathData="M27,74 l1.2,3.8 l3.8,1.2 l-3.8,1.2 l-1.2,3.8 l-1.2,-3.8 l-3.8,-1.2 l3.8,-1.2 z" />
          </vector>
          EOF_SRC
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF_SRC
          mkdir -p app/src/main/res/mipmap-anydpi
          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_bg" />
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/MainActivity.kt <<'EOF_SRC'
          package dev.canvas

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalContext
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  T.load(getSharedPreferences("t", 0))
                  U.loadHist(getSharedPreferences("t", 0))
                  GV.load(getSharedPreferences("t", 0))
                  setContent { Root() }
              }
          }

          @Composable
          fun Root() {
              val ctx = LocalContext.current
              val st = remember { BenchState().also { it.res = loadBench(ctx) } }
              var eng by remember { mutableStateOf<Engine?>(null) }
              var pid by remember { mutableStateOf("") }
              val e = eng
              if (e == null) Home(
                  st,
                  { c -> pid = Proj.newId(); eng = Engine(c.w, c.h, c.paper, c.pat, c.layers, c.budget) },
                  { m -> pid = m.id; eng = Engine(m.w, m.h, m.paper, m.pat, m.layers, m.budget).also { it.pending = Proj.dir(ctx, m.id) } }
              )
              else App(e, pid) { eng = null }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Engine.kt <<'EOF_SRC'
          package dev.canvas

          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.opengl.GLES30 as G
          import android.opengl.GLSurfaceView
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.IntBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.*
          import kotlin.random.Random

          enum class Tool(val code: String) {
              BRUSH("BR"), ERASER("ER"), SMUDGE("SM"), BLUR("BL"), DODGE("DG"), BURN("BN"), LIQUIFY("LQ"),
              FILL("FL"), GRAD("GR"), LINE("LN"), RECT("RC"), OVAL("OV"), PICK("PK"), MOVE("MV"), LASSO("LS")
          }

          class Pen {
              var size = 24f; var opacity = 1f; var hardness = .8f; var spacing = .08f
              var round = 1f; var angle = 0f; var follow = false
              var scatter = 0f; var sizeJit = 0f; var opJit = 0f
              var grain = 0f; var grainScale = 2f; var smooth = .2f
              var pCurve = 1f; var pSize = .7f; var pOp = 0f
              var blurR = 2f; var tol = 24f; var vel = 0f; var stab = .35f; var stabMode = 0f; var catchUp = 1f
              var color = 0xFF141414.toInt(); var color2 = 0xFFFFFFFF.toInt()
              fun load(v: FloatArray) {
                  size = v[0]; opacity = v[1]; hardness = v[2]; spacing = v[3]; round = v[4]; angle = v[5]; scatter = v[6]
                  sizeJit = v[7]; opJit = v[8]; grain = v[9]; grainScale = v[10]; smooth = v[11]; pSize = v[12]; pOp = v[13]; vel = v.getOrElse(14) { 0f }
              }
          }

          class LI(val show: Boolean, val alpha: Float, val blend: Int)
          class Layer(val tex: Int, val fbo: Int) { var show = true; var alpha = 1f; var blend = 0 }

          private class P(val id: Int) {
              private val m = HashMap<String, Int>()
              fun u(n: String) = m.getOrPut(n) { G.glGetUniformLocation(id, n) }
          }
          private class Step(val l: Layer) { val t = HashMap<Int, Int>() }

          private const val PIF = 3.1415927f
          private const val TS = 256        // undo tile size (copy-on-write, only touched tiles are stored)
          private const val BUDGET = 160    // max stored tiles (~40 MB) across the undo stack

          private const val VS = """#version 300 es
          uniform vec4 uR;out vec2 vP,vU;
          void main(){vec2 p=vec2(float(gl_VertexID&1),float(gl_VertexID>>1))*2.-1.;vP=p;vU=p*.5+.5;gl_Position=vec4(uR.xy+p*uR.zw,0,1);}"""

          // stamp: hardness, roundness, angle, grain (canvas-fixed noise), kind (0 paint, 1 dodge/burn)
          private const val FS_B = """#version 300 es
          precision highp float;in vec2 vP;uniform vec4 uC,uQ;uniform vec2 uG;out vec4 o;
          float hs(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
          void main(){float c=cos(uQ.z),s=sin(uQ.z);vec2 q=vec2(c*vP.x+s*vP.y,-s*vP.x+c*vP.y);q.y/=uQ.y;
          float a=(1.-smoothstep(uQ.x,1.,length(q)))*uC.a;a*=1.-uQ.w*hs(floor(gl_FragCoord.xy/uG.x));
          o=uG.y<.5?vec4(uC.rgb*a,a):vec4(vec3(a*.3),0.);}"""

          // smudge (mode 0) / blur (mode 1) reading a scratch copy of the layer
          private const val FS_S = """#version 300 es
          precision highp float;in vec2 vP;uniform sampler2D uT;uniform vec2 uSz,uD;uniform vec4 uQ;uniform float uM,uS,uBr;out vec4 o;
          void main(){vec2 uv=gl_FragCoord.xy/uSz;vec4 src=texture(uT,uv);float a=(1.-smoothstep(uQ.x,1.,length(vP)))*uS;vec4 r;
          if(uM<.5)r=texture(uT,uv-uD/uSz);else{r=vec4(0.);for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++)r+=texture(uT,uv+vec2(float(i),float(j))*uBr/uSz);r/=9.;}
          o=mix(src,r,a);}"""

          private const val FS_G = """#version 300 es
          precision highp float;uniform vec2 uA,uB;uniform vec4 uC1,uC2;out vec4 o;
          void main(){vec2 d=uB-uA;float t=clamp(dot(gl_FragCoord.xy-uA,d)/dot(d,d),0.,1.);o=mix(uC1,uC2,t);}"""

          // composite: layer sampled through shared 16-bit displacement map + optional move offset
          private const val FS_C = """#version 300 es
          precision highp float;in vec2 vU;uniform sampler2D uL,uD;uniform vec2 uSz,uO;uniform float uA,uW,uRng;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          void main(){vec2 uv=vU-uO/uSz;if(uW>0.)uv+=dec(texture(uD,vU))/uSz;
          if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.){o=vec4(0.);return;}o=texture(uL,uv)*uA;}"""

          // liquify: mode 0 push, 1 pinch, 2 bloat, 3 swirl
          private const val FS_L = """#version 300 es
          precision highp float;uniform sampler2D uD;uniform vec2 uSz,uC,uV;uniform float uRad,uS,uRng,uM;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          vec4 enc(vec2 v){vec2 q=floor((clamp(v/uRng,-1.,1.)*.5+.5)*65535.+.5);vec2 h=floor(q/256.);vec2 l=q-h*256.;return vec4(h.x,l.x,h.y,l.y)/255.;}
          void main(){vec2 c=dec(texture(uD,gl_FragCoord.xy/uSz));vec2 dr=gl_FragCoord.xy-uC;float L=length(dr);float d=L/uRad;float f=max(1.-d*d,0.);f*=f;
          vec2 n=L>0.?dr/L:vec2(0.);float k=length(uV);vec2 dd;
          if(uM<.5)dd=-uV;else if(uM<1.5)dd=n*k;else if(uM<2.5)dd=-n*k;else dd=vec2(-n.y,n.x)*k;
          if(uM>3.5)o=enc(c*(1.-clamp(f*uS*.5,0.,1.)));else o=enc(c+dd*f*uS);}"""

          private const val FS_BL = """#version 300 es
          precision highp float;in vec2 vU;uniform sampler2D uL,uD,uB;uniform vec2 uSz,uO;uniform float uA,uW,uRng;uniform int uBm;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          float lum(vec3 c){return dot(c,vec3(.3,.59,.11));}
          vec3 clipc(vec3 c){float l=lum(c);float n=min(min(c.r,c.g),c.b);float x=max(max(c.r,c.g),c.b);
          if(n<0.)c=l+(c-l)*l/max(l-n,1e-5);if(x>1.)c=l+(c-l)*(1.-l)/max(x-l,1e-5);return c;}
          vec3 setlum(vec3 c,float l){return clipc(c+(l-lum(c)));}
          float satf(vec3 c){return max(max(c.r,c.g),c.b)-min(min(c.r,c.g),c.b);}
          vec3 setsat(vec3 c,float s){float mn=min(min(c.r,c.g),c.b);float mx=max(max(c.r,c.g),c.b);return mx>mn?(c-mn)*s/(mx-mn):vec3(0.);}
          vec3 hrot(vec3 c,float a){float cs=cos(a);float sn=sin(a);
          float y=dot(c,vec3(.299,.587,.114));float i1=dot(c,vec3(.596,-.274,-.322));float q1=dot(c,vec3(.211,-.523,.312));
          float i2=i1*cs-q1*sn;float q2=i1*sn+q1*cs;
          return clamp(vec3(y+.956*i2+.621*q2,y-.272*i2-.647*q2,y-1.106*i2+1.703*q2),0.,1.);}
          vec3 bl(int m,vec3 b,vec3 s){
          float E=1e-4;
          if(m==4)return mix(2.*b*s,1.-2.*(1.-b)*(1.-s),step(.5,b));
          if(m==5){vec3 d=mix(((16.*b-12.)*b+4.)*b,sqrt(b),step(.25,b));return mix(b-(1.-2.*s)*b*(1.-b),b+(2.*s-1.)*(d-b),step(.5,s));}
          if(m==6)return mix(2.*b*s,1.-2.*(1.-b)*(1.-s),step(.5,s));
          if(m==7){vec3 bu=1.-(1.-b)/max(2.*s,vec3(E));vec3 dg=b/max(1.-2.*(s-.5),vec3(E));return clamp(mix(bu,dg,step(.5,s)),0.,1.);}
          if(m==8)return clamp(b+2.*s-1.,0.,1.);
          if(m==9)return mix(min(b,2.*s),max(b,2.*s-1.),step(.5,s));
          if(m==10)return step(1.,b+s);
          if(m==11)return min(b,s);
          if(m==12)return max(b,s);
          if(m==13)return clamp(b/max(1.-s,vec3(E)),0.,1.);
          if(m==14)return clamp(1.-(1.-b)/max(s,vec3(E)),0.,1.);
          if(m==15)return max(b+s-1.,0.);
          if(m==16)return lum(b)<lum(s)?b:s;
          if(m==17)return lum(b)>lum(s)?b:s;
          if(m==18)return abs(b-s);
          if(m==19)return b+s-2.*b*s;
          if(m==20)return max(b-s,0.);
          if(m==21)return clamp(b/max(s,vec3(E)),0.,1.);
          if(m==22)return setlum(setsat(s,satf(b)),lum(b));
          if(m==23)return setlum(setsat(b,satf(s)),lum(b));
          if(m==24)return setlum(s,lum(b));
          if(m==25)return setlum(b,lum(s));
          if(m==26)return 1.-abs(1.-b-s);
          if(m==27)return clamp(b*b/max(1.-s,vec3(E)),0.,1.);
          if(m==28)return clamp(s*s/max(1.-b,vec3(E)),0.,1.);
          if(m==29)return clamp(1.-(1.-b)*(1.-b)/max(s,vec3(E)),0.,1.);
          if(m==30)return clamp(1.-(1.-s)*(1.-s)/max(b,vec3(E)),0.,1.);
          if(m==31)return min(b,s)-max(b,s)+1.;
          if(m==32)return(b+s)*.5;
          if(m==33)return .5-.25*cos(3.14159265*s)-.25*cos(3.14159265*b);
          if(m==34)return sqrt(b*s);
          if(m==35)return 2.*b*s/max(b+s,vec3(E));
          if(m==36)return(1.-2.*s)*b*b+2.*s*b;
          if(m==37)return clamp(mix(.5*b/max(1.-s,vec3(E)),1.-.5*(1.-s)/max(b,vec3(E)),step(1.,b+s)),0.,1.);
          if(m==38)return clamp(mix(.5*s/max(1.-b,vec3(E)),1.-.5*(1.-b)/max(s,vec3(E)),step(1.,b+s)),0.,1.);
          if(m==39)return pow(b,max(s,vec3(E)));
          if(m==40)return pow(b,1./max(s,vec3(E)));
          if(m==41)return clamp(.63662*atan(b/max(1.-s,vec3(E))),0.,1.);
          if(m>=42&&m<=44){ivec3 xi=ivec3(b*255.+.5);ivec3 yi=ivec3(s*255.+.5);ivec3 ri=m==42?(xi^yi):(m==43?(xi&yi):(xi|yi));return vec3(ri)/255.;}
          if(m==45)return hrot(b,(lum(s)-.5)*6.2832);
          if(m==46)return hrot(s,lum(b)*6.2832);
          if(m==47)return vec3(s.r,b.g,b.b);
          if(m==48)return vec3(b.r,s.g,b.b);
          if(m==49)return vec3(b.r,b.g,s.b);
          if(m==50)return floor(b*s*5.+.5)/5.;
