          fun greet(): String {
              val h = java.util.Calendar.getInstance().get(java.util.Calendar.HOUR_OF_DAY)
              return if (h < 5) "still up? cozy night doodles~" else if (h < 12) "good morning! draw time?" else if (h < 18) "hi hi! let's make art" else "evening sketch session?"
          }

          fun hsvInt(h: Float, s: Float, v: Float): Int =
              android.graphics.Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f)))

          /** Decode a picked image (down-sampled to roughly [mx] px, EXIF-rotated). Call off the main thread. */
          fun decodeImg(ctx: Context, u: Uri, mx: Int): Bitmap? {
              return try {
                  val o = BitmapFactory.Options(); o.inJustDecodeBounds = true
                  ctx.contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o) }
                  var ss = 1
                  while (kotlin.math.max(o.outWidth, o.outHeight) / ss > mx) ss *= 2
                  val o2 = BitmapFactory.Options(); o2.inSampleSize = ss
                  val b = ctx.contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o2) } ?: return null
                  val ori = try {
                      ctx.contentResolver.openInputStream(u)?.use { s -> android.media.ExifInterface(s).getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1) } ?: 1
                  } catch (t: Throwable) { 1 }
                  val deg = if (ori == 6) 90f else if (ori == 3) 180f else if (ori == 8) 270f else 0f
                  if (deg == 0f) b else {
                      val m = Matrix(); m.postRotate(deg)
                      Bitmap.createBitmap(b, 0, 0, b.width, b.height, m, true)
                  }
              } catch (t: Throwable) { null }
          }

          /** Animated 0..1 loop as a State (read it inside draw / graphicsLayer lambdas so nothing recomposes per frame). */
          @Composable
          fun loopState(ms: Int, label: String): State<Float> =
              if (T.an > .01f) rememberInfiniteTransition(label = label).animateFloat(0f, 1f, infiniteRepeatable(tween(ms, easing = LinearEasing)), label = label)
              else remember { mutableFloatStateOf(0f) }

          // ───────────────────────── liquid-glass surface ─────────────────────────
          /** Panel surface: tinted glass, top sheen, gradient hairline border, and a one-shot light sweep whenever [key] changes. */
          @Composable
          fun Modifier.glass(sh: Shape = rs(), key: Any = Unit): Modifier {
              val sw = remember { Animatable(1f) }
              LaunchedEffect(key) { if (T.an > .01f) { sw.snapTo(0f); sw.animateTo(1f, tween(1000)) } }
              val ac = T.ac; val ac2 = T.ac2; val pn = T.panel; val gl = T.gls
              return this.clip(sh).background(pn).drawBehind {
                  val w = size.width; val h = size.height
                  drawRect(Brush.verticalGradient(listOf(Color.White.copy(alpha = .05f + .09f * gl), Color.Transparent), 0f, h * .6f))
                  val p = sw.value
                  if (p > 0f && p < 1f) {
                      val x = -w * .35f + w * 1.7f * p
                      drawRect(Brush.linearGradient(listOf(Color.Transparent, Color.White.copy(alpha = .18f * (1f - p)), Color.Transparent), Offset(x, 0f), Offset(x + w * .3f, h * .7f)))
                  }
              }.border(1.dp, Brush.linearGradient(listOf(ac2.copy(alpha = .55f), ac.copy(alpha = .1f), ac2.copy(alpha = .35f))), sh)
          }

          // ───────────────────────── sparkles / confetti ─────────────────────────
          class Spark(var x: Float, var y: Float, var vx: Float, var vy: Float, var life: Float, val kind: Int, val hue: Int, val sz: Float)

          class SparkSys(val g: Float, val k: Float) {
              val list = ArrayList<Spark>()
              var tick by mutableIntStateOf(0)
              var alive by mutableStateOf(false)
              fun burst(x: Float, y: Float, n: Int, spread: Float, up: Float) {
                  val r = kotlin.random.Random
                  for (i in 0 until n) {
                      if (list.size > 180) list.removeAt(0)
                      val a = r.nextFloat() * 6.2832f; val sp = r.nextFloat() * spread
                      list.add(Spark(x, y, cos(a) * sp, sin(a) * sp - up, 1.1f + r.nextFloat() * .8f, r.nextInt(3), r.nextInt(2), (6f + r.nextFloat() * 8f) * k))
                  }
                  alive = true
              }
              fun step(dt: Float) {
                  val iter = list.iterator()
                  while (iter.hasNext()) {
                      val s = iter.next()
                      s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += g * dt
                      if (s.life <= 0f) iter.remove()
                  }
                  tick++
              }
          }

          suspend fun runSparks(sys: SparkSys) {
              var last = 0L
              while (sys.list.isNotEmpty()) {
                  withFrameNanos { n ->
                      val dt = if (last == 0L) .016f else ((n - last) / 1000000000f).coerceAtMost(.05f)
                      last = n; sys.step(dt)
                  }
              }
              sys.alive = false
          }

          fun DrawScope.drawSparks(sys: SparkSys, a1: Color, a2: Color) {
              val t = sys.tick
              if (t < 0) return
              for (s in sys.list) {
                  val c = (if (s.hue == 0) a1 else a2).copy(alpha = s.life.coerceIn(0f, 1f))
                  if (s.kind == 0) drawCircle(c, s.sz * .5f, Offset(s.x, s.y))
                  else if (s.kind == 1) dropAt(c, s.x, s.y, s.sz * .5f)
                  else starAt(c, s.x, s.y, s.sz * .5f)
              }
          }

          /** Home background: a trail of hearts / stars / dots follows the finger (never consumes touches). */
          @Composable
          fun SparkBox(mod: Modifier, content: @Composable BoxScope.() -> Unit) {
              val sys = remember { SparkSys(120f, 1.4f) }
              val a1 = T.ac; val a2 = T.ac2
              LaunchedEffect(sys.alive) { if (sys.alive) runSparks(sys) }
              Box(
                  mod.pointerInput(Unit) {
                      awaitPointerEventScope {
                          while (true) {
                              val ev = awaitPointerEvent(PointerEventPass.Initial)
                              val c = ev.changes.firstOrNull()
                              if (c != null && c.pressed && T.an > .01f) sys.burst(c.position.x, c.position.y, 2, 90f, 40f)
                          }
                      }
                  }
              ) {
                  content()
                  Canvas(Modifier.fillMaxSize()) { drawSparks(sys, a1, a2) }
              }
          }

          /** Fountain of hearts / stars from the bottom whenever [trigger] changes. */
          @Composable
          fun Confetti(trigger: Int, mod: Modifier) {
              val sys = remember { SparkSys(650f, 2.2f) }
              val a1 = T.ac; val a2 = T.ac2
              BoxWithConstraints(mod) {
                  val wp = constraints.maxWidth.toFloat(); val hp = constraints.maxHeight.toFloat()
                  LaunchedEffect(trigger) {
                      if (trigger > 0 && T.an > .01f) { for (k in 0 until 4) sys.burst(wp * (.2f + .2f * k), hp * .82f, 16, 380f, 650f) }
                  }
                  LaunchedEffect(sys.alive) { if (sys.alive) runSparks(sys) }
                  Canvas(Modifier.fillMaxSize()) { drawSparks(sys, a1, a2) }
              }
          }

          // ───────────────────────── canvas guides: symmetry axes + composition grids ─────────────────────────
          val GUIDE_N = listOf("OFF", "THIRDS", "GRID", "GOLDEN", "DIAG")

          @Composable
          fun Guides(e: Engine, sym: Int, n: Int, grid: Int, busy: Boolean) {
              val fade by animateFloatAsState(if (busy) .25f else 1f, label = "gd")
              if (sym == 0 && grid == 0) return
              val ac2 = T.ac2
              Canvas(Modifier.fillMaxSize()) {
                  val vr = e.vrev
                  if (vr < 0) return@Canvas
                  val z = e.zoom; val r = e.rot
                  val wv = e.vw.toFloat(); val hv = e.vh.toFloat()
                  val cw = e.W.toFloat(); val ch = e.H.toFloat()
                  val s = minOf(wv / cw, hv / ch) * z
                  val cr = cos(r); val sr = sin(r)
                  val ox = wv / 2f + e.px; val oy = hv / 2f + e.py
                  fun pt(cx: Float, cy: Float): Offset {
                      val u = (cx - cw / 2f) * s; val v = (ch / 2f - cy) * s
                      return Offset(ox + cr * u - sr * v, oy + sr * u + cr * v)
                  }
                  val dash = PathEffect.dashPathEffect(floatArrayOf(16f, 12f), 0f)
                  fun ln2(a: Offset, b: Offset, c: Color, w: Float, dashed: Boolean) =
                      drawLine(c, a, b, strokeWidth = w, cap = StrokeCap.Round, pathEffect = if (dashed) dash else null)
                  val col = ac2.copy(alpha = .8f * fade)
                  if (sym == 1 || sym == 3) ln2(pt(cw / 2f, -ch), pt(cw / 2f, 2f * ch), col, 3f, true)
                  if (sym == 2 || sym == 3) ln2(pt(-cw, ch / 2f), pt(2f * cw, ch / 2f), col, 3f, true)
                  if (sym == 4) {
                      val rr = hypot(cw, ch)
                      val c0 = pt(cw / 2f, ch / 2f)
                      for (k in 0 until n) {
                          val t = 6.2832f * k / n
                          ln2(c0, pt(cw / 2f + rr * cos(t), ch / 2f + rr * sin(t)), col, 3f, true)
                      }
                      drawCircle(col, 7f, c0)
                  }
                  val gc = Color.White.copy(alpha = .4f * fade)
                  if (grid == 1) {
                      for (i in 1..2) {
                          ln2(pt(cw * i / 3f, 0f), pt(cw * i / 3f, ch), gc, 2f, false)
                          ln2(pt(0f, ch * i / 3f), pt(cw, ch * i / 3f), gc, 2f, false)
                      }
                  } else if (grid == 2) {
                      val g = maxOf(cw, ch) / 8f
                      var x = g
                      while (x < cw - 1f) { ln2(pt(x, 0f), pt(x, ch), gc, 1.5f, false); x += g }
                      var y = g
                      while (y < ch - 1f) { ln2(pt(0f, y), pt(cw, y), gc, 1.5f, false); y += g }
                  } else if (grid == 3) {
                      val k = .381966f
                      ln2(pt(cw * k, 0f), pt(cw * k, ch), gc, 2f, false); ln2(pt(cw * (1f - k), 0f), pt(cw * (1f - k), ch), gc, 2f, false)
                      ln2(pt(0f, ch * k), pt(cw, ch * k), gc, 2f, false); ln2(pt(0f, ch * (1f - k)), pt(cw, ch * (1f - k)), gc, 2f, false)
                  } else if (grid == 4) {
                      ln2(pt(0f, 0f), pt(cw, ch), gc, 2f, false); ln2(pt(0f, ch), pt(cw, 0f), gc, 2f, false)
                      ln2(pt(cw / 2f, 0f), pt(cw / 2f, ch), gc, 1.5f, false); ln2(pt(0f, ch / 2f), pt(cw, ch / 2f), gc, 1.5f, false)
                  }
              }
          }

          @Composable
          fun ViewChip(e: Engine) {
              val moved by remember { derivedStateOf { e.rot != 0f || e.zoom != 1f } }
              AnimatedVisibility(visible = moved, enter = fadeIn(), exit = fadeOut()) {
                  val deg = ((e.rot * 57.2958f) % 360f + 360f) % 360f
                  Tx(
                      "%d%%  %d\u00B0".format((e.zoom * 100f).toInt(), deg.toInt()), T.dk,
                      Modifier.clip(RoundedCornerShape(50)).background(T.ac.copy(alpha = .92f)).padding(horizontal = d(9f), vertical = d(3f)), 9f
                  )
              }
          }

          // ───────────────────────── edge sliders: size (left) and opacity (right) with live preview ─────────────────────────
          @Composable
          fun VBar(t: Float, h: Float, onT: (Float) -> Unit, onDown: (Boolean) -> Unit) {
              val ac = T.ac; val ac2 = T.ac2; val tr = T.panel2; val dk = T.dk
              val cb by rememberUpdatedState(onT)
              val db by rememberUpdatedState(onDown)
              val hf = LocalHapticFeedback.current
              val q = remember { IntArray(1) }
              Box(
                  Modifier.width(d(30f)).height(d(h)).systemGestureExclusion().drawBehind {
                      val w = size.width; val hh = size.height; val r = w / 2f
                      val y = hh - r - (hh - 2f * r) * t.coerceIn(0f, 1f)
                      val cr = CornerRadius(w * .22f)
                      drawRoundRect(tr.copy(alpha = .85f), Offset(w * .3f, 0f), Size(w * .4f, hh), cr)
                      drawRoundRect(Brush.verticalGradient(listOf(ac, ac2), y, hh), Offset(w * .3f, y), Size(w * .4f, hh - y), cr)
                      drawCircle(Color.White, r * .92f, Offset(r, y))
                      drawCircle(dk, r * .09f, Offset(r - r * .28f, y - r * .12f)); drawCircle(dk, r * .09f, Offset(r + r * .28f, y - r * .12f))
                      drawArc(dk, 20f, 140f, false, Offset(r - r * .2f, y - r * .06f), Size(r * .4f, r * .26f), style = androidx.compose.ui.graphics.drawscope.Stroke(r * .08f, cap = StrokeCap.Round))
                  }.pointerInput(Unit) {
                      awaitPointerEventScope {
                          while (true) {
                              val c = awaitPointerEvent().changes[0]
                              if (c.pressed) {
                                  db(true)
                                  val x = (1f - c.position.y / size.height).coerceIn(0f, 1f)
                                  val k = (x * 20f).toInt()
                                  if (k != q[0]) { q[0] = k; if (T.hap > .5f) hf.performHapticFeedback(HapticFeedbackType.TextHandleMove) }
                                  cb(x); c.consume()
                              } else db(false)
                          }
                      }
                  }
              )
          }

          @Composable
          fun BarPreview(e: Engine, mode: Int) {
              val p = e.pen
              val s = minOf(e.vw.toFloat() / e.W, e.vh.toFloat() / e.H) * e.zoom
              val col = Color(p.color)
              Column(Modifier.padding(horizontal = d(6f)).glass(rs(.8f)).padding(d(8f)), horizontalAlignment = Alignment.CenterHorizontally) {
                  Canvas(Modifier.size(d(84f))) {
                      val c = Offset(size.width / 2f, size.height / 2f)
                      val maxR = size.minDimension / 2f
                      if (mode == 1) {
                          drawRect(Color(0xFF3A3A3A), Offset(0f, 0f), Size(size.width / 2f, size.height))
                          drawRect(Color(0xFFEEEEEE), Offset(size.width / 2f, 0f), Size(size.width / 2f, size.height))
                      }
                      val rr = if (mode == 0) (p.size * .5f * s).coerceIn(1.5f, maxR) else maxR * .8f
                      val hd = p.hardness.coerceIn(0f, .97f)
                      val a = if (mode == 1) p.opacity else 1f
                      drawCircle(Brush.radialGradient(0f to col.copy(alpha = a), hd to col.copy(alpha = a), 1f to col.copy(alpha = 0f), center = c, radius = rr), rr, c)
                  }
                  Tx(if (mode == 0) "%d px".format(p.size.toInt()) else "%d%%".format((p.opacity * 100f).toInt()), T.ink, sz = 10f)
              }
          }

          @Composable
          fun BoxScope.EdgeBars(e: Engine, busy: Boolean) {
              var dl by remember { mutableStateOf(false) }
              var dr by remember { mutableStateOf(false) }
              val fade by animateFloatAsState(if (busy) .15f else 1f, label = "eb")
              val p = e.pen
              val st = (ln(p.size.coerceAtLeast(1f)) / ln(1000f)).coerceIn(0f, 1f)
              Row(Modifier.align(Alignment.CenterStart).padding(start = d(6f)).graphicsLayer { alpha = fade }, verticalAlignment = Alignment.CenterVertically) {
                  VBar(st, 190f, { x -> p.size = 1000f.pow(x); U.bump() }, { dl = it })
                  if (dl) BarPreview(e, 0)
              }
              Row(Modifier.align(Alignment.CenterEnd).padding(end = d(6f)).graphicsLayer { alpha = fade }, verticalAlignment = Alignment.CenterVertically) {
                  if (dr) BarPreview(e, 1)
                  VBar(p.opacity.coerceIn(0f, 1f), 190f, { x -> p.opacity = x.coerceAtLeast(.01f); U.bump() }, { dr = it })
              }
          }

          /** Swipe the little grip to throw the dock to another edge / side. */
          @Composable
          fun Grip(onFling: (Float, Float) -> Unit) {
              val ac2 = T.ac2
              val cb by rememberUpdatedState(onFling)
              Canvas(
                  Modifier.size(d(16f), d(36f)).pointerInput(Unit) {
                      var ax = 0f; var ay = 0f
                      detectDragGestures(
                          onDragStart = { ax = 0f; ay = 0f },
                          onDragEnd = { cb(ax, ay) },
                          onDragCancel = { }
                      ) { c, a -> c.consume(); ax += a.x; ay += a.y }
                  }
              ) {
                  for (i in 0..2) for (j in 0..1) drawCircle(ac2.copy(alpha = .75f), size.width * .12f, Offset(size.width * (.3f + .4f * j), size.height * (.25f + .25f * i)))
              }
          }

          // ───────────────────────── brush preview (live stroke made from the current brush settings) ─────────────────────────
          @Composable
          fun BrushPreview(e: Engine) {
              val rv = U.rev
              val p = e.pen
              val col = Color(p.color)
              val lum = col.red * .3f + col.green * .59f + col.blue * .11f
              val bg = if (lum > .55f) T.panel2.copy(alpha = 1f) else Color(0xFFEDE7EE)
              Canvas(Modifier.fillMaxWidth().height(d(54f)).clip(rs(.6f)).background(bg)) {
                  val w = size.width; val h = size.height
                  val maxR = h * .4f
                  val vr = (ln(p.size.coerceAtLeast(1f)) / ln(1000f) * maxR).coerceAtLeast(1.5f)
                  val x0 = w * .08f; val x1 = w * .92f
                  val span = x1 - x0
                  val step = maxOf(1.2f, vr * 2f * p.spacing, span / 200f)
                  val hd = p.hardness.coerceIn(0f, .97f)
                  var x = x0; var i = 0
                  while (x <= x1 && i < 400) {
                      val tt = (x - x0) / span
                      val pr = sin(tt * 3.1416f).coerceAtLeast(0f).pow(p.pCurve.coerceAtLeast(.05f))
                      val y = h / 2f + sin(tt * 6.2832f) * h * .22f
                      val jr = 1f - p.sizeJit * (((i * 7919) % 100) / 100f)
                      val r = (vr * (1f - p.pSize + p.pSize * pr) * jr).coerceAtLeast(.8f)
                      val a = (p.opacity * (1f - p.pOp + p.pOp * pr)).coerceIn(0f, 1f)
                      val sc = p.scatter * r
                      val ox = if (p.scatter > 0f) (((i * 104729) % 100) / 50f - 1f) * sc else 0f
                      val oy = if (p.scatter > 0f) (((i * 15485863) % 100) / 50f - 1f) * sc else 0f
                      val c = Offset(x + ox, y + oy)
                      drawCircle(Brush.radialGradient(0f to col.copy(alpha = a), hd to col.copy(alpha = a), 1f to col.copy(alpha = 0f), center = c, radius = r), r, c)
                      x += step; i++
                  }
              }
          }

          // ───────────────────────── smart color: harmonies + recent colors ─────────────────────────
          val HARM_N = listOf("COMP", "ANALOG", "TRIAD", "SPLIT", "TETRAD", "SHADES")

          @Composable
          fun Harmony(pick: (Int) -> Unit) {
              val rv = U.rev
              var mode by remember { mutableIntStateOf(0) }
              Tx("HARMONY", T.ac, sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  HARM_N.forEachIndexed { i, n -> Pill(n, mode == i) { mode = i } }
              }
              val h = U.hh; val s = U.ss; val b = U.bb
              val cols = ArrayList<Int>()
              if (mode == 5) {
                  for (k in 0..6) cols.add(hsvInt(h, s, .15f + .85f * k / 6f))
              } else {
                  val offs = if (mode == 0) floatArrayOf(0f, 180f) else if (mode == 1) floatArrayOf(-30f, 0f, 30f) else if (mode == 2) floatArrayOf(0f, 120f, 240f)
                      else if (mode == 3) floatArrayOf(0f, 150f, 210f) else floatArrayOf(0f, 90f, 180f, 270f)
                  for (o in offs) {
                      cols.add(hsvInt(h + o, s * .55f, 1f))
                      cols.add(hsvInt(h + o, s, b.coerceAtLeast(.6f)))
                      cols.add(hsvInt(h + o, (s + .15f).coerceAtMost(1f), b * .55f))
                  }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                  cols.forEach { c -> Bub(32f, false, anim = false, pad = .2f, f = { pick(c) }) { drawCircle(Color(c), size.minDimension / 2f) } }
              }
          }

          @Composable
          fun Recents(pick: (Int) -> Unit) {
              if (U.hist.isEmpty()) return
              Tx("RECENT", T.ac, sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                  U.hist.toList().forEach { c -> Bub(30f, false, anim = false, pad = .2f, f = { pick(c) }) { drawCircle(Color(c), size.minDimension / 2f) } }
              }
          }

          // ───────────────────────── style panel extras: font picker + layout ─────────────────────────
          val FONT_N = listOf("ROUND", "MONO", "SERIF", "SCRIPT", "CASUAL", "NARROW", "HEAVY", "THIN", "ITALIC", "BOLDMONO")

          @Composable
          fun FontPick() {
              val cur = T.fnt.toInt()
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  FONTS.forEachIndexed { i, f ->
                      Text(
                          "Aa " + FONT_N[i].lowercase(), color = if (cur == i) T.dk else T.ink, fontSize = (T.fs + 2f).sp, fontFamily = f, maxLines = 1,
                          modifier = Modifier.clip(RoundedCornerShape(50)).background(if (cur == i) T.ac else T.panel2)
                              .clickable { T.fnt = i.toFloat(); U.bump() }.padding(horizontal = d(11f), vertical = d(7f))
                      )
                  }
              }
          }

          @Composable
          fun LayoutPanel() {
              val rv = U.rev
              val ctx = LocalContext.current
              fun save() { T.save(ctx.getSharedPreferences("t", 0)); U.bump() }
              val side = (T.dkx * 2f + .5f).toInt().coerceIn(0, 2)
              Tx("Hold the toolbar, then drag it to the left or right edge (or set it here).", T.ink.copy(alpha = .7f), sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Pill(if (T.dky > .5f) "DOCK TOP" else "DOCK BOTTOM", true, Ik.UP) { T.dky = if (T.dky > .5f) 0f else 1f; save() }
                  Pill(listOf("SIDE LEFT", "SIDE CENTER", "SIDE RIGHT")[side], true, Ik.MV) { T.dkx = ((side + 1) % 3) / 2f; save() }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Pill("SIDE DOCK", T.dks > .5f, Ik.MV) { T.dks = if (T.dks > .5f) 0f else 1f; save() }
                  Pill("HAPTIC", T.hap > .5f, Ik.MN) { T.hap = if (T.hap > .5f) 0f else 1f; U.bump() }
                  Pill("COLOR FOLLOW", T.fol > .5f, Ik.CO) { T.fol = if (T.fol > .5f) 0f else 1f; U.bump() }
                  Pill("SLIME REFLECT", T.srf > .5f, Ik.FX) { T.srf = if (T.srf > .5f) 0f else 1f; U.bump() }
              }
          }

          fun surprise() {
              val r = kotlin.random.Random
              val h = r.nextFloat() * 360f
              val sh = listOf(30f, 60f, 120f, 150f, 180f, -30f, -60f, -120f)[r.nextInt(8)]
              val bh = (((h + (r.nextFloat() - .5f) * 40f) % 360f) + 360f) % 360f
              val ph = (((h + sh * .5f) % 360f) + 360f) % 360f
              applyPreset(floatArrayOf(h, .3f + r.nextFloat() * .35f, .9f + r.nextFloat() * .1f, sh, bh, .35f + r.nextFloat() * .35f, r.nextFloat() * .05f,
                  (1 + r.nextInt(13)).toFloat(), ph, .3f + r.nextFloat() * .3f, .25f + r.nextFloat() * .15f, .4f + r.nextFloat() * .3f, 28f + r.nextFloat() * 60f))
          }
