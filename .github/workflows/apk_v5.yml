          val SAYS = listOf("hi! i'm your slime", "let's draw something cute", "tap tap tap~", "i believe in your art!", "snacks first?", "psst... try the fx")

          fun r256(x: Float): Int = max(256, ((x + 128f) / 256f).toInt() * 256)
          fun dimsOf(long: Int, ratio: Float): Pair<Int, Int> = if (ratio >= 1f) Pair(long, r256(long / ratio)) else Pair(r256(long * ratio), long)
          fun layersCap(w: Int, h: Int, ramMb: Int): Int {
              val lm = w * h * 4f / 1048576f
              val budget = (ramMb * .22f).coerceIn(150f, 1400f)
              return (budget / lm - 4f).toInt().coerceIn(3, 32)
          }
          fun rawText(i: Int, v: Float): String = when (i) {
              0 -> "%.1f Gpx/s".format(v / 1000f)
              1 -> "%.0f k/s".format(v)
              2 -> "%.0f Mpx/s".format(v)
              3 -> "%.0f MB/s".format(v)
              4 -> "%.0f M/s".format(v)
              else -> "%.1f GB".format(v)
          }

          fun DrawScope.heartAt(c: Color, x: Float, y: Float, r: Float) {
              drawCircle(c, r * .55f, Offset(x - r * .5f, y - r * .2f)); drawCircle(c, r * .55f, Offset(x + r * .5f, y - r * .2f))
              val p = Path(); p.moveTo(x - r * 1.02f, y); p.lineTo(x, y + r); p.lineTo(x + r * 1.02f, y); p.close(); drawPath(p, c)
          }
          fun DrawScope.starAt(c: Color, x: Float, y: Float, r: Float) {
              val p = Path(); p.moveTo(x, y - r * 1.4f); p.lineTo(x + r * .35f, y - r * .35f); p.lineTo(x + r * 1.4f, y); p.lineTo(x + r * .35f, y + r * .35f)
              p.lineTo(x, y + r * 1.4f); p.lineTo(x - r * .35f, y + r * .35f); p.lineTo(x - r * 1.4f, y); p.lineTo(x - r * .35f, y - r * .35f); p.close(); drawPath(p, c)
          }

          /** Drifting hearts / stars / bubbles; loops seamlessly (integer speeds). Animation is read in the draw phase only. */
          @Composable
          fun Floaters(mod: Modifier) {
              val ts = loopState(50000, "fl")
              val a1 = T.ac; val a2 = T.ac2
              Canvas(mod) {
                  val t = ts.value
                  for (i in 0 until 26) {
                      val h1 = ((i * 7919) % 1000) / 1000f; val h2 = ((i * 104729) % 997) / 997f
                      val k = 1 + i % 3
                      val x = size.width * h2 + sin(t * 6.2832f * (2 + i % 3) + i) * 14f
                      val y = size.height * (1f - ((h1 + t * k) % 1f))
                      val r = 6f + h2 * 14f
                      val c = (if (i % 2 == 0) a1 else a2).copy(alpha = .14f + h1 * .14f)
                      when (i % 4) {
                          0 -> drawCircle(c, r, Offset(x, y))
                          1 -> drawCircle(c, r, Offset(x, y), style = Stroke(2.5f))
                          2 -> dropAt(c, x, y, r)
                          else -> starAt(c, x, y, r)
                      }
                  }
              }
          }

