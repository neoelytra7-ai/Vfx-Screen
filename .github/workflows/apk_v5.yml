          package dev.canvas

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.size
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.StrokeJoin
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.graphics.drawscope.DrawScope
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.clipPath
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.graphics.drawscope.translate
          import androidx.compose.ui.input.pointer.pointerInput
          import kotlinx.coroutines.delay
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          // Rimuru-style slime: translucent dome, dark-blue outline, flat (cel) shading, a darker core seen through the shell.
          private val SH_FILL = Color(0xFFC6E5FA)
          private val SH_DARK = Color(0xFFA6CFEF)
          private val SH_EDGE = Color(0xFF2149AA)
          private val CORE = Color(0xFF8FAFE0)
          private val CORE_SH = Color(0xFF7597D0)
          private val CORE_LT = Color(0xFFB9D0F0)

          /**
           * 2D soft body: 24 surface nodes joined by structural + bending springs, a weak shape-memory spring (keeps the dome),
           * gas pressure that keeps the enclosed area (= volume) constant, gravity, a floor with friction, and a finger poke.
           * The inner "core" follows the shell with a lag, which fakes refraction parallax through the shell.
           */
          class SlimeBody {
              val n = 24
              private val top = 15
              private val rx = FloatArray(n); private val ry = FloatArray(n)
              val x = FloatArray(n); val y = FloatArray(n)
              private val vx = FloatArray(n); private val vy = FloatArray(n)
              private val fx = FloatArray(n); private val fy = FloatArray(n)
              val cx = FloatArray(n); val cy = FloatArray(n)
              private val bump = FloatArray(n)
              private val rl = FloatArray(n); private val rl2 = FloatArray(n)
              private var a0 = 1f
              var tick by mutableIntStateOf(0)
              var mood = 0
              var pressing = false
              var pxp = 0f; var pyp = 0f
              var pxSize = 1f
              private var time = 0f
              private var hopT = 1.5f
              private var seed = 12345

              init {
                  for (i in 0 until top) {
                      val th = 3.14159265f * i / (top - 1)
                      rx[i] = cos(th); ry[i] = -1.4f * sin(th)
                      val q = (th - 2.0f) / .45f
                      bump[i] = exp(-q * q)
                  }
                  val nb = n - top
                  for (k in 0 until nb) { rx[top + k] = -1f + 2f * (k + 1) / (nb + 1); ry[top + k] = 0f }
                  for (i in 0 until n) {
                      val j = (i + 1) % n; val k = (i + 2) % n
                      rl[i] = hypot(rx[j] - rx[i], ry[j] - ry[i]); rl2[i] = hypot(rx[k] - rx[i], ry[k] - ry[i])
                  }
                  a0 = abs(area(rx, ry))
                  rest()
              }

              private fun area(px: FloatArray, py: FloatArray): Float {
                  var a = 0f
                  for (i in 0 until n) { val j = (i + 1) % n; a += px[i] * py[j] - px[j] * py[i] }
                  return a * .5f
              }

              private fun rnd(): Float {
                  seed = seed xor (seed shl 13); seed = seed xor (seed ushr 17); seed = seed xor (seed shl 5)
                  return (seed and 0xFFFF) / 65535f - .5f
              }

              fun rest() {
                  for (i in 0 until n) { x[i] = rx[i]; y[i] = ry[i]; vx[i] = 0f; vy[i] = 0f; cx[i] = coreX(i, 0f); cy[i] = coreY(i) }
              }

              private fun coreX(i: Int, mx: Float) = mx + (x[i] - mx) * .70f - .06f
              private fun coreY(i: Int) = y[i] * .66f - .08f - .30f * bump[i]

              /** a small upward kick for every node: the slime really jumps and lands */
              fun boing(power: Float) { for (i in 0 until n) vy[i] -= power }

              fun step(dtIn: Float) {
                  val dt = min(dtIn, 1f / 30f)
                  time += dt
                  if (mood == 1) {
                      hopT -= dt
                      if (hopT <= 0f) { boing(7.5f); hopT = 1.7f + .6f * (rnd() + .5f) }
                  }
                  val h = dt / 4f
                  for (s in 0 until 4) sub(h)
                  var mx = 0f
                  for (i in 0 until n) mx += x[i]
                  mx /= n
                  val k = 1f - exp(-dt * 12f)
                  for (i in 0 until n) {
                      cx[i] += (coreX(i, mx) - cx[i]) * k
                      cy[i] += (coreY(i) - cy[i]) * k
                  }
                  tick++
              }

              private fun spring(a: Int, b: Int, rest: Float, k: Float, c: Float) {
                  val dx = x[b] - x[a]; val dy = y[b] - y[a]; val l = hypot(dx, dy)
                  if (l < 1e-6f) return
                  val ux = dx / l; val uy = dy / l
                  val f = k * (l - rest) + c * ((vx[b] - vx[a]) * ux + (vy[b] - vy[a]) * uy)
                  fx[a] += f * ux; fy[a] += f * uy; fx[b] -= f * ux; fy[b] -= f * uy
              }

              private fun sub(h: Float) {
                  for (i in 0 until n) { fx[i] = 0f; fy[i] = 18f }
                  for (i in 0 until n) { spring(i, (i + 1) % n, rl[i], 380f, 7f); spring(i, (i + 2) % n, rl2[i], 140f, 3f) }
                  var cxm = 0f
                  for (i in 0 until n) cxm += x[i]
                  cxm /= n
                  for (i in 0 until n) {
                      fx[i] += 150f * (cxm + rx[i] - x[i]) - 3f * vx[i]
                      fy[i] += 150f * (ry[i] - y[i]) - 3f * vy[i]
                  }
                  val a = area(x, y); val sg = if (a < 0f) 1f else -1f
                  val sleepy = mood == 5
                  val tgt = a0 * (1f + (if (sleepy) .03f else .018f) * sin(time * (if (sleepy) 1.4f else 2.4f)))
                  val p = 200f * (tgt / max(abs(a), .2f) - 1f)
                  for (i in 0 until n) {
                      val j = (i + 1) % n
                      val ex = x[j] - x[i]; val ey = y[j] - y[i]
                      val nx = -ey * sg * .5f * p; val ny = ex * sg * .5f * p
                      fx[i] += nx; fy[i] += ny; fx[j] += nx; fy[j] += ny
                  }
                  if (pressing) {
                      for (i in 0 until n) {
                          val dx = x[i] - pxp; val dy = y[i] - pyp; val d = hypot(dx, dy)
                          if (d < .9f && d > 1e-5f) {
                              val w = (1f - d / .9f) * (1f - d / .9f)
                              fx[i] += dx / d * 60f * w; fy[i] += 240f * w
                          }
                      }
                  }
                  if (mood == 2) for (i in 0 until n) { fx[i] += rnd() * 60f; fy[i] += rnd() * 60f }
                  for (i in 0 until n) {
                      vx[i] += fx[i] * h; vy[i] += fy[i] * h
                      vx[i] *= 1f - h; vy[i] *= 1f - h
                      x[i] += vx[i] * h; y[i] += vy[i] * h
                      if (y[i] > 0f) {
                          y[i] = 0f
                          if (vy[i] > 0f) vy[i] = -vy[i] * .1f
                          vx[i] *= 1f - min(1f, 14f * h)
                      }
                  }
              }
          }

          /** teardrop (replaces the old hearts in sparkles / floaters) */
          fun DrawScope.dropAt(c: Color, x: Float, y: Float, r: Float) {
              val p = Path()
              p.moveTo(x, y - r * 1.3f)
              p.cubicTo(x + r * .2f, y - r * .6f, x + r, y - r * .1f, x + r, y + r * .35f)
              p.cubicTo(x + r, y + r * .95f, x - r, y + r * .95f, x - r, y + r * .35f)
              p.cubicTo(x - r, y - r * .1f, x - r * .2f, y - r * .6f, x, y - r * 1.3f)
              p.close()
              drawPath(p, c)
          }

          private fun ringPath(px: FloatArray, py: FloatArray, n: Int, ox: Float, oy: Float, s: Float): Path {
              val p = Path()
              fun gx(i: Int) = ox + px[((i % n) + n) % n] * s
              fun gy(i: Int) = oy + py[((i % n) + n) % n] * s
              p.moveTo(gx(0), gy(0))
              for (i in 0 until n) {
                  val c1x = gx(i) + (gx(i + 1) - gx(i - 1)) / 6f; val c1y = gy(i) + (gy(i + 1) - gy(i - 1)) / 6f
                  val c2x = gx(i + 1) - (gx(i + 2) - gx(i)) / 6f; val c2y = gy(i + 1) - (gy(i + 2) - gy(i)) / 6f
                  p.cubicTo(c1x, c1y, c2x, c2y, gx(i + 1), gy(i + 1))
              }
              p.close()
              return p
          }

          private fun shift(c: Color, d: Float): Color {
              if (abs(d) < 1f) return c
              val hsv = FloatArray(3)
              android.graphics.Color.colorToHSV(c.toArgb(), hsv)
              hsv[0] = ((hsv[0] + d) % 360f + 360f) % 360f
              return Color(android.graphics.Color.HSVToColor(hsv))
          }

          private fun DrawScope.drawSlime(b: SlimeBody, s0: Float, mood: Int, blink: Boolean, acc: Int) {
              val hd = T.mh
              val shF = shift(SH_FILL, hd); val shD = shift(SH_DARK, hd); val shE = shift(SH_EDGE, hd)
              val s = s0 / 2.3f; val ox = s0 / 2f; val oy = s0 * .9f
              var minX = 1e9f; var maxX = -1e9f; var minY = 1e9f
              for (i in 0 until b.n) { minX = min(minX, b.x[i]); maxX = max(maxX, b.x[i]); minY = min(minY, b.y[i]) }
              val left = ox + minX * s; val bw = (maxX - minX) * s
              val topPx = oy + minY * s; val bh = oy - topPx
              val lw = max(2f, s * .045f)
              drawOval(Color.Black.copy(alpha = .16f), Offset(left + bw * .05f, oy - s * .05f), Size(bw * .9f, s * .16f))
              val shell = ringPath(b.x, b.y, b.n, ox, oy, s)
              // pure glass: a see-through body with a slightly denser rim band (flat cel steps, nothing inside)
              drawPath(shell, shD.copy(alpha = .55f))
              clipPath(shell) { translate(-s * .05f, -s * .06f) { drawPath(shell, shF.copy(alpha = .42f)) } }
              if (T.srf > .5f) {
                  // optional: a cel-shaded reflection of the surroundings (sky, accent-colored ground with a horizon that wobbles with the body)
                  clipPath(shell) {
                      val hy = topPx + bh * .5f
                      drawRect(Color.White.copy(alpha = .13f), Offset(left, topPx), Size(bw, hy - topPx))
                      val gp = Path()
                      gp.moveTo(left, hy)
                      for (i in 0..8) { val u = i / 8f; gp.lineTo(left + bw * u, hy + sin(u * 6.2832f + b.cx[3] * 3f) * bh * .035f) }
                      gp.lineTo(left + bw, oy); gp.lineTo(left, oy); gp.close()
                      drawPath(gp, T.ac.copy(alpha = .3f))
                      drawRect(Color.White.copy(alpha = .12f), Offset(left + bw * .16f, topPx), Size(bw * .06f, bh))
                      drawRect(Color.White.copy(alpha = .08f), Offset(left + bw * .26f, topPx), Size(bw * .03f, bh))
                  }
              }
              // little eyes (thin creases on the lower third of the glass)
              val ey = topPx + bh * .64f
              val sk = Stroke(lw * .75f, cap = StrokeCap.Round)
              val ec = shE.copy(alpha = .8f)
              for (side in 0..1) {
                  val ex = left + bw * (if (side == 0) .32f else .68f)
                  val dir = if (side == 0) 1f else -1f
                  val l = bw * .07f
                  if (blink || mood == 5) {
                      drawArc(ec, 20f, 140f, false, Offset(ex - l * .6f, ey - l * .15f), Size(l * 1.2f, l * .7f), style = sk)
                  } else when (mood) {
                      1 -> drawArc(ec, 200f, 140f, false, Offset(ex - l * .6f, ey - l * .25f), Size(l * 1.2f, l * .8f), style = sk)
                      3 -> heartAt(Color(0xFFFF7FA8), ex, ey, l * .55f)
                      4 -> drawLine(ec, Offset(ex - dir * l, ey + l * .35f), Offset(ex + dir * l * .6f, ey - l * .25f), lw * .75f, StrokeCap.Round)
                      2 -> drawLine(ec, Offset(ex - l, ey), Offset(ex + l, ey), lw * 1.0f, StrokeCap.Round)
                      else -> drawLine(ec, Offset(ex - dir * l, ey - l * .1f), Offset(ex + dir * l * .7f, ey + l * .28f), lw * .75f, StrokeCap.Round)
                  }
              }
              drawPath(shell, shE, style = Stroke(lw, cap = StrokeCap.Round, join = StrokeJoin.Round))
              val hx = left + bw * .765f; val hy2 = topPx + bh * .2f
              rotate(-22f, Offset(hx, hy2)) { drawOval(Color.White.copy(alpha = .93f), Offset(hx - bw * .12f, hy2 - bh * .075f), Size(bw * .24f, bh * .15f)) }
              drawCircle(Color.White.copy(alpha = .93f), max(2f, bw * .03f), Offset(left + bw * .905f, topPx + bh * .5f))
              if (acc != 0) translate(0f, topPx - s0 * .1f) { drawAcc(acc, s0, T.ac2) }
              if (mood == 5) {
                  val z = s0 * .78f; val zy = s0 * .08f; val q = s0 * .1f
                  drawLine(shE, Offset(z, zy), Offset(z + q, zy), lw * .7f, StrokeCap.Round)
                  drawLine(shE, Offset(z + q, zy), Offset(z, zy + q), lw * .7f, StrokeCap.Round)
                  drawLine(shE, Offset(z, zy + q), Offset(z + q, zy + q), lw * .7f, StrokeCap.Round)
              }
          }

          // ───────────────────────── mascot: menu button + mood display ─────────────────────────
          @Composable
          fun Mascot(mood: Int, sz: Float, acc: Int = 0, f: () -> Unit) {
              val body = remember { SlimeBody() }
              val anim = T.an > .01f
              body.mood = mood
              var blink by remember { mutableStateOf(false) }
              LaunchedEffect(anim) { if (anim) while (true) { delay((2200L..4600L).random()); blink = true; delay(130); blink = false } }
              LaunchedEffect(anim) {
                  if (anim) {
                      var last = 0L
                      while (true) withFrameNanos { n ->
                          val dt = if (last == 0L) .016f else (n - last) / 1000000000f
                          last = n; body.step(dt)
                      }
                  } else { body.rest(); body.tick++ }
              }
              Canvas(
                  Modifier.size(d(sz)).pointerInput(Unit) {
                      detectTapGestures(
                          onPress = { o ->
                              val s = body.pxSize / 2.3f
                              body.pxp = (o.x - body.pxSize / 2f) / s; body.pyp = (o.y - body.pxSize * .9f) / s
                              body.pressing = true
                              tryAwaitRelease()
                              body.pressing = false
                          },
                          onTap = { body.boing(3.5f); f() }
                      )
                  }
              ) {
                  val t = body.tick
                  if (t < 0) return@Canvas
                  body.pxSize = size.minDimension
                  drawSlime(body, size.minDimension, mood, blink, acc)
              }
          }
          EOF_SRC
          cat > app/src/main/kotlin/dev/canvas/Projects.kt <<'EOF_SRC'
          package dev.canvas

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.BitmapFactory
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.RoundRect
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.PathEffect
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.drawscope.DrawScope
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.clipPath
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.IntSize
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.File
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          // ───────────────────────── project files: filesDir/projects/<id>/{meta.json, L0.png.., thumb.png} ─────────────────────────
          class ProjMeta(val id: String, val w: Int, val h: Int, val paper: Int, val pat: Int, val layers: Int, val budget: Int, val time: Long)

          object Proj {
              fun root(ctx: Context): File { val f = File(ctx.filesDir, "projects"); f.mkdirs(); return f }
              fun dir(ctx: Context, id: String): File = File(root(ctx), id)
              fun newId(): String = java.lang.Long.toString(System.currentTimeMillis(), 36)
              fun list(ctx: Context): List<ProjMeta> {
                  val out = ArrayList<ProjMeta>()
                  val ds = root(ctx).listFiles() ?: return out
                  for (d in ds) {
                      val mf = File(d, "meta.json")
                      if (!mf.exists()) continue
                      try {
                          val j = JSONObject(mf.readText())
                          out.add(ProjMeta(d.name, j.getInt("w"), j.getInt("h"), j.getInt("paper"), j.getInt("pat"), j.getInt("maxLayers"), j.getInt("budget"), j.getLong("time")))
                      } catch (t: Throwable) { }
                  }
                  out.sortByDescending { it.time }
                  return out
              }
              fun delete(ctx: Context, id: String) { dir(ctx, id).deleteRecursively() }
          }

          // ───────────────────────── gallery view settings ─────────────────────────
          object GV {
              var cols by mutableIntStateOf(3)
              var rows by mutableIntStateOf(3)
              var mode by mutableIntStateOf(0)          // 0 grid, 1 spider web, 2 scatter, 3 bento (big / little)
              var gap by mutableFloatStateOf(8f)
              var page by mutableIntStateOf(0)
              fun cap(): Int = if (mode == 3) max(1, (cols * rows * .65f).toInt()) else cols * rows
              fun load(p: SharedPreferences) {
                  cols = p.getInt("g_cols", 3); rows = p.getInt("g_rows", 3); mode = p.getInt("g_mode", 0); gap = p.getFloat("g_gap", 8f)
              }
              fun save(p: SharedPreferences) {
                  p.edit().putInt("g_cols", cols).putInt("g_rows", rows).putInt("g_mode", mode).putFloat("g_gap", gap).apply()
              }
          }
          val GV_N = listOf("GRID", "WEB", "SCATTER", "BENTO")

          // ───────────────────────── layouts ─────────────────────────
          class Cell(val pts: FloatArray, val cx: Float, val cy: Float, val w: Float, val h: Float, val rot: Float, val kind: Int)   // kind 0 rounded rect, 1 quad, 2 card
          class GLay(val cells: List<Cell>, val verts: FloatArray?, val vc: Int, val vr: Int)

          private fun hs(a: Int, b: Int, c: Int): Float {
              var h = (a * 73856093) xor (b * 19349663) xor (c * 83492791)
              h = h xor (h ushr 13); h *= 1274126177; h = h xor (h ushr 16)
              return (h and 0xFFFF) / 65535f
          }

          fun galleryLayout(mode: Int, W: Float, H: Float, cols: Int, rows: Int, gap: Float, n: Int): GLay {
              val cells = ArrayList<Cell>()
              val cw = max(8f, (W - gap * (cols + 1)) / cols); val ch = max(8f, (H - gap * (rows + 1)) / rows)
              if (mode == 1) {                       // spider web: a jittered net, every project is one mesh of it
                  val vc = cols + 1; val vr = rows + 1
                  val v = FloatArray(vc * vr * 2)
                  val ox = 6f; val oy = 6f
                  val sx = (W - 2f * ox) / cols; val sy = (H - 2f * oy) / rows
                  for (r in 0 until vr) for (c in 0 until vc) {
                      var x = ox + c * sx; var y = oy + r * sy
                      if (c in 1 until cols) x += (hs(r, c, 1) - .5f) * .6f * sx      // border vertices only slide along the border
                      if (r in 1 until rows) y += (hs(r, c, 2) - .5f) * .6f * sy
                      v[(r * vc + c) * 2] = x; v[(r * vc + c) * 2 + 1] = y
                  }
                  for (i in 0 until n) {
                      val c = i % cols; val r = i / cols
                      if (r >= rows) break
                      val a = (r * vc + c) * 2; val b = (r * vc + c + 1) * 2; val d = ((r + 1) * vc + c + 1) * 2; val e = ((r + 1) * vc + c) * 2
                      val q = floatArrayOf(v[a], v[a + 1], v[b], v[b + 1], v[d], v[d + 1], v[e], v[e + 1])
                      val mx = (q[0] + q[2] + q[4] + q[6]) / 4f; val my = (q[1] + q[3] + q[5] + q[7]) / 4f
                      var rad = 0f
                      for (k in 0..3) rad += hypot(q[k * 2] - mx, q[k * 2 + 1] - my)
                      rad /= 4f
                      val sh = if (rad > 1f) (1f - (gap * .5f + 2f) / rad).coerceIn(.4f, 1f) else 1f
                      var mnx = 1e9f; var mxx = -1e9f; var mny = 1e9f; var mxy = -1e9f
                      for (k in 0..3) {
                          q[k * 2] = mx + (q[k * 2] - mx) * sh; q[k * 2 + 1] = my + (q[k * 2 + 1] - my) * sh
                          mnx = min(mnx, q[k * 2]); mxx = max(mxx, q[k * 2]); mny = min(mny, q[k * 2 + 1]); mxy = max(mxy, q[k * 2 + 1])
                      }
                      cells.add(Cell(q, (mnx + mxx) / 2f, (mny + mxy) / 2f, mxx - mnx, mxy - mny, 0f, 1))
                  }
                  return GLay(cells, v, vc, vr)
              }
              if (mode == 2) {                       // scatter: tilted, overlapping polaroids
                  for (i in 0 until n) {
                      val c = i % cols; val r = i / cols
                      if (r >= rows) break
                      val bx = gap + c * (cw + gap) + cw / 2f; val by = gap + r * (ch + gap) + ch / 2f
                      val sz = min(cw, ch) * 1.18f
                      cells.add(Cell(floatArrayOf(), bx + (hs(i, 3, 1) - .5f) * .35f * cw, by + (hs(i, 3, 2) - .5f) * .35f * ch, sz, sz, (hs(i, 3, 3) - .5f) * 22f, 2))
                  }
                  return GLay(cells, null, 0, 0)
              }
              if (mode == 3) {                       // bento: some tiles big, most little
                  val occ = BooleanArray(cols * rows)
                  fun free(c: Int, r: Int, w: Int, h: Int): Boolean {
                      if (c + w > cols || r + h > rows) return false
                      for (yy in r until r + h) for (xx in c until c + w) if (occ[yy * cols + xx]) return false
                      return true
                  }
                  for (i in 0 until n) {
                      var pc = -1; var pr = -1
                      for (idx in 0 until cols * rows) if (!occ[idx]) { pc = idx % cols; pr = idx / cols; break }
                      if (pc < 0) break
                      var w = 1; var h = 1
                      if (i % 5 == 0 && free(pc, pr, 2, 2)) { w = 2; h = 2 } else if (i % 3 == 1 && free(pc, pr, 2, 1)) { w = 2 }
                      for (yy in pr until pr + h) for (xx in pc until pc + w) occ[yy * cols + xx] = true
                      val x = gap + pc * (cw + gap); val y = gap + pr * (ch + gap)
                      val tw = w * cw + (w - 1) * gap; val th = h * ch + (h - 1) * gap
                      cells.add(Cell(floatArrayOf(), x + tw / 2f, y + th / 2f, tw, th, 0f, 0))
                  }
                  return GLay(cells, null, 0, 0)
              }
              for (i in 0 until n) {                 // plain grid
                  val c = i % cols; val r = i / cols
                  if (r >= rows) break
                  cells.add(Cell(floatArrayOf(), gap + c * (cw + gap) + cw / 2f, gap + r * (ch + gap) + ch / 2f, cw, ch, 0f, 0))
              }
              return GLay(cells, null, 0, 0)
          }

          private fun cellPath(c: Cell): Path {
              val p = Path()
              if (c.kind == 1) {
                  p.moveTo(c.pts[0], c.pts[1])
                  for (k in 1..3) p.lineTo(c.pts[k * 2], c.pts[k * 2 + 1])
                  p.close()
              } else {
                  val rad = min(c.w, c.h) * .12f
                  p.addRoundRect(RoundRect(c.cx - c.w / 2f, c.cy - c.h / 2f, c.cx + c.w / 2f, c.cy + c.h / 2f, rad, rad))
              }
              return p
          }

          private fun hit(c: Cell, x: Float, y: Float): Boolean {
              var px = x; var py = y
              if (c.rot != 0f) {
                  val a = -c.rot * 0.0174533f; val dx = x - c.cx; val dy = y - c.cy
                  px = c.cx + dx * cos(a) - dy * sin(a); py = c.cy + dx * sin(a) + dy * cos(a)
              }
              if (c.kind == 1) {
                  var inside = false
                  var j = 3
                  for (i in 0..3) {
                      val xi = c.pts[i * 2]; val yi = c.pts[i * 2 + 1]; val xj = c.pts[j * 2]; val yj = c.pts[j * 2 + 1]
                      if ((yi > py) != (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi + 1e-6f) + xi) inside = !inside
                      j = i
                  }
                  return inside
              }
              return kotlin.math.abs(px - c.cx) <= c.w / 2f && kotlin.math.abs(py - c.cy) <= c.h / 2f
          }

          private fun DrawScope.drawCrop(img: ImageBitmap, x: Float, y: Float, w: Float, h: Float) {
              val iw = img.width.toFloat(); val ih = img.height.toFloat()
              val k = max(w / iw, h / ih)
              val sw = w / k; val sh = h / k
              drawImage(
                  img, IntOffset(((iw - sw) / 2f).toInt(), ((ih - sh) / 2f).toInt()), IntSize(max(1, sw.toInt()), max(1, sh.toInt())),
                  IntOffset(x.toInt(), y.toInt()), IntSize(max(1, w.toInt()), max(1, h.toInt()))
              )
          }

          private fun DrawScope.drawGallery(lay: GLay, shown: List<ProjMeta>, thumbs: Map<String, ImageBitmap>, mode: Int) {
              val ac = T.ac; val ac2 = T.ac2; val edge = Color(0xFF2149AA)
              val dash = PathEffect.dashPathEffect(floatArrayOf(14f, 10f), 0f)
              for ((i, c) in lay.cells.withIndex()) {
                  val p = shown.getOrNull(i)
                  val img = if (p != null) thumbs[p.id + "_" + p.time] else null
                  rotate(c.rot, Offset(c.cx, c.cy)) {
                      val x = c.cx - c.w / 2f; val y = c.cy - c.h / 2f
                      if (c.kind == 2 && p != null) {
                          drawRect(Color.Black.copy(alpha = .3f), Offset(x + 4f, y + 6f), Size(c.w, c.h))
                          drawRect(Color(0xFFF4FAFF), Offset(x, y), Size(c.w, c.h))
                          val ins = c.w * .06f
                          if (img != null) drawCrop(img, x + ins, y + ins, c.w - 2f * ins, c.h - ins * 3.2f)
                          else drawRect(T.panel2, Offset(x + ins, y + ins), Size(c.w - 2f * ins, c.h - ins * 3.2f))
                      } else {
                          val path = cellPath(c)
                          if (p != null) {
                              clipPath(path) { if (img != null) drawCrop(img, x, y, c.w, c.h) else drawRect(T.panel2, Offset(x, y), Size(c.w, c.h)) }
                              if (mode != 1) drawPath(path, edge.copy(alpha = .85f), style = Stroke(2.5f))
                          } else if (i == shown.size) {
                              drawPath(path, ac.copy(alpha = .12f))
                              drawPath(path, ac.copy(alpha = .8f), style = Stroke(2.5f, pathEffect = dash))
                              val r = min(c.w, c.h) * .16f
                              drawLine(ac, Offset(c.cx - r, c.cy), Offset(c.cx + r, c.cy), 5f, StrokeCap.Round)
                              drawLine(ac, Offset(c.cx, c.cy - r), Offset(c.cx, c.cy + r), 5f, StrokeCap.Round)
                          } else {
                              drawPath(path, ac.copy(alpha = .05f))
                              drawPath(path, ac.copy(alpha = .22f), style = Stroke(1.5f, pathEffect = dash))
                          }
                      }
                  }
              }
              val v = lay.verts
              if (v != null) {                       // the web itself: strands sag toward the middle, dew drops sit on the knots
                  val mx = size.width / 2f; val my = size.height / 2f
                  val strand = Path()
                  fun edge2(a: Int, b: Int) {
                      val x1 = v[a * 2]; val y1 = v[a * 2 + 1]; val x2 = v[b * 2]; val y2 = v[b * 2 + 1]
                      val mxx = (x1 + x2) / 2f; val myy = (y1 + y2) / 2f
                      val len = hypot(x2 - x1, y2 - y1)
                      val tx = mx - mxx; val ty = my - myy; val tl = hypot(tx, ty) + 1e-4f
                      strand.moveTo(x1, y1)
                      strand.quadraticBezierTo(mxx + tx / tl * len * .09f, myy + ty / tl * len * .09f, x2, y2)
                  }
                  for (r in 0 until lay.vr) for (c in 0 until lay.vc) {
                      val a = r * lay.vc + c
                      if (c + 1 < lay.vc) edge2(a, a + 1)
                      if (r + 1 < lay.vr) edge2(a, a + lay.vc)
                  }
                  drawPath(strand, Color.White.copy(alpha = .75f), style = Stroke(2.2f, cap = StrokeCap.Round))
                  drawPath(strand, ac2.copy(alpha = .55f), style = Stroke(1.1f, cap = StrokeCap.Round))
                  for (k in 0 until lay.vr * lay.vc) {
                      val x = v[k * 2]; val y = v[k * 2 + 1]
                      drawCircle(Color(0xFFC6E5FA).copy(alpha = .85f), 5f, Offset(x, y))
                      drawCircle(edge.copy(alpha = .7f), 5f, Offset(x, y), style = Stroke(1.3f))
                      drawCircle(Color.White, 1.6f, Offset(x - 1.6f, y - 1.8f))
                  }
              }
          }

          @Composable
          fun ProjGallery(mod: Modifier, items: List<ProjMeta>, onOpen: (ProjMeta) -> Unit, onNew: () -> Unit, onDelete: (ProjMeta) -> Unit) {
              val ctx = LocalContext.current
              val rv = U.rev
              val cap = GV.cap()
              val pages = max(1, (items.size + cap - 1) / cap)
              if (GV.page >= pages) GV.page = pages - 1
              val page = GV.page
              val shown = items.drop(page * cap).take(cap)
              var opts by remember { mutableStateOf(false) }
              var del by remember { mutableStateOf<ProjMeta?>(null) }
              val thumbs = remember { mutableStateMapOf<String, ImageBitmap>() }
              LaunchedEffect(shown.map { it.id + it.time }) {
                  for (p in shown) {
                      val key = p.id + "_" + p.time
                      if (!thumbs.containsKey(key)) {
                          val bm = withContext(Dispatchers.IO) { BitmapFactory.decodeFile(File(Proj.dir(ctx, p.id), "thumb.png").path) }
                          if (bm != null) thumbs[key] = bm.asImageBitmap()
                      }
                  }
              }
              Column(mod.glass(rs(.9f)).padding(d(8f)), verticalArrangement = Arrangement.spacedBy(d(6f))) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Tx("PROJECTS", T.ac, sz = 12f)
                      Tx(items.size.toString() + " saved", T.ink.copy(alpha = .6f), sz = 9f)
                      Spacer(Modifier.weight(1f))
                      if (pages > 1) {
                          Pill("<", false) { if (page > 0) GV.page = page - 1 }
                          Tx((page + 1).toString() + "/" + pages, T.ink, sz = 10f)
                          Pill(">", false) { if (page < pages - 1) GV.page = page + 1 }
                      }
                      IB(Ik.GS, opts, sz = 34f, anim = false) { opts = !opts }
                  }
                  if (opts) {
                      Column(Modifier.fillMaxWidth().glass(rs(.7f)).padding(d(10f)), verticalArrangement = Arrangement.spacedBy(d(6f))) {
                          Tx("GALLERY VIEW", T.ac, sz = 10f)
                          Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                              GV_N.forEachIndexed { i, n -> Pill(n, GV.mode == i) { GV.mode = i; GV.page = 0 } }
                          }
                          R2(PP("COLUMNS", 1f, 6f, 1f, false, { GV.cols.toFloat() }, { GV.cols = (it + .5f).toInt().coerceIn(1, 6); GV.page = 0 }))
                          R2(PP("ROWS", 1f, 8f, 1f, false, { GV.rows.toFloat() }, { GV.rows = (it + .5f).toInt().coerceIn(1, 8); GV.page = 0 }))
                          R2(PP("GAP", 0f, 24f, 1f, false, { GV.gap }, { GV.gap = it }))
                          Pill("DONE", true, Ik.OK) { opts = false; GV.save(ctx.getSharedPreferences("t", 0)) }
                      }
                  }
                  Box(Modifier.weight(1f).fillMaxWidth()) {
                      Canvas(
                          Modifier.fillMaxSize().pointerInput(shown, GV.mode, GV.cols, GV.rows, GV.gap) {
                              detectTapGestures(
                                  onTap = { o ->
                                      val lay = galleryLayout(GV.mode, size.width.toFloat(), size.height.toFloat(), GV.cols, GV.rows, GV.gap * density, cap)
                                      var k = lay.cells.size - 1
                                      while (k >= 0) {
                                          if (hit(lay.cells[k], o.x, o.y)) {
                                              val p = shown.getOrNull(k)
                                              if (p != null) onOpen(p) else if (k == shown.size) onNew()
                                              k = -1
                                          }
                                          k--
                                      }
                                  },
                                  onLongPress = { o ->
                                      val lay = galleryLayout(GV.mode, size.width.toFloat(), size.height.toFloat(), GV.cols, GV.rows, GV.gap * density, cap)
                                      var k = lay.cells.size - 1
                                      while (k >= 0) {
                                          if (hit(lay.cells[k], o.x, o.y)) { val p = shown.getOrNull(k); if (p != null) del = p; k = -1 }
                                          k--
                                      }
                                  }
                              )
                          }
                      ) {
                          val lay = galleryLayout(GV.mode, size.width, size.height, GV.cols, GV.rows, GV.gap * density, cap)
                          drawGallery(lay, shown, thumbs, GV.mode)
                      }
                  }
                  val dp = del
                  if (dp != null) {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                          Tx("delete this project?", T.ink, sz = 10f)
                          Pill("DELETE", true, Ik.UN) { onDelete(dp); del = null }
                          Pill("KEEP") { del = null }
                      }
                  }
              }
          }
