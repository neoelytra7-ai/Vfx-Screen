          @Composable
          fun FxCard(name: String, thumb: ImageBitmap?, on: Boolean, f: () -> Unit) {
              Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(d(4f))) {
                  Box(
                      Modifier.size(d(66f)).clip(rs(.7f)).background(T.panel2).border(d(2f), if (on) T.ac else Color(0xFF2149AA).copy(alpha = .6f), rs(.7f)).clickable { f() }
                  ) {
                      if (thumb != null) Image(thumb, null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                      else Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Ic(Ik.DC) }
                  }
                  Pill(name, on, f = f)
              }
          }

          @Composable
          fun Ic(k: Ik) {
              val c = T.ink; val c2 = T.ac2
              androidx.compose.foundation.Canvas(Modifier.size(d(24f))) { ic(k, c, c2, 0f) }
          }

          @Composable
          fun FxPanel(e: Engine, v: CanvasView, thumbs: List<ImageBitmap>, apply: () -> Unit, cancel: () -> Unit) {
              val rv = U.rev
              var sel by remember { mutableIntStateOf(-1) }
              val vals = remember { mutableStateListOf(0f, 0f, 0f, 0f) }
              if (!e.fxOk) { Tx("fx shaders are not supported on this gpu :("); return }
              fun pick(i: Int) {
                  sel = i
                  for (k in 0 until 4) vals[k] = FXS[i].ps.getOrNull(k)?.d ?: 0f
                  val a = vals.toFloatArray(); v.gl { e.fxSet(i, a) }
              }
              fun dice() {
                  val i = FXS.indices.random(); pick(i)
                  FXS[i].ps.forEachIndexed { k, q -> vals[k] = (q.d + (kotlin.random.Random.nextFloat() - .5f) * (q.hi - q.lo) * .6f).coerceIn(q.lo, q.hi) }
                  val a = vals.toFloatArray(); v.gl { e.fxSet(i, a) }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(8f)), verticalAlignment = Alignment.Top) {
                  FxCard("DICE", null, false) { dice() }
                  FXS.forEachIndexed { i, f -> FxCard(f.n, thumbs.getOrNull(i), sel == i) { pick(i) } }
              }
              if (sel >= 0) {
                  FXS[sel].ps.forEachIndexed { k, q ->
                      R2(PP(q.n, q.lo, q.hi, (q.hi - q.lo) / 100f, false, { vals[k] }, { x -> vals[k] = x; val a = vals.toFloatArray(); v.gl { e.fxSet(sel, a) } }))
                  }
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Pill("APPLY", true, Ik.OK) { v.gl { e.fxApply() }; apply() }
                      Pill("RESET") { pick(sel) }
                      Pill("CANCEL") { cancel() }
                  }
              }
          }
