          // ───────────────────────── blend modes (ids match FS_BL in Engine) ─────────────────────────
          val BLEND_N = listOf(
              "NORMAL", "MULTIPLY", "SCREEN", "ADD",
              "OVERLAY", "SOFT LIGHT", "HARD LIGHT", "VIVID LIGHT", "LINEAR LIGHT", "PIN LIGHT", "HARD MIX",
              "DARKEN", "LIGHTEN", "COLOR DODGE", "COLOR BURN", "LINEAR BURN", "DARKER COLOR", "LIGHTER COLOR",
              "DIFFERENCE", "EXCLUSION", "SUBTRACT", "DIVIDE",
              "HUE", "SATURATION", "COLOR", "LUMINOSITY",
              "NEGATION", "REFLECT", "GLOW", "FREEZE", "HEAT", "PHOENIX", "AVERAGE", "INTERPOLATE",
              "GEOMETRIC", "HARMONIC", "PEGTOP", "SOFT DODGE", "SOFT BURN", "GAMMA LIGHT", "GAMMA DARK", "ARCTANGENT",
              "BIT XOR", "BIT AND", "BIT OR",
              "PRISM", "SPECTRAL", "RED ONLY", "GREEN ONLY", "BLUE ONLY",
              "CEL MULTIPLY", "CEL LIGHT", "LUMA CUT", "MOIRE", "WAVE", "FRACTAL", "INVERT BY", "LUMA MASK", "CONTRAST BY", "SATURATE BY",
              "CLIP", "BEHIND", "ERASE", "MASK", "ALPHA XOR", "REPLACE"
          )
          val BLEND_G = listOf(
              "BASIC" to (0..3), "CONTRAST" to (4..10), "DARKEN / LIGHTEN" to (11..17), "DIFFERENCE" to (18..21), "COLOR" to (22..25),
              "BREAKTHROUGH MATH" to (26..41), "BITWISE" to (42..44), "HUE & CHANNELS" to (45..49), "CEL & PATTERN" to (50..59), "ALPHA TOOLS" to (60..65)
          )

          @Composable
          fun BlendList(cur: Int, advOk: Boolean, close: () -> Unit, pick: (Int) -> Unit) {
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                  Tx("BLEND MODE", T.ac)
                  Tx(BLEND_N.size.toString() + " modes", T.ink.copy(alpha = .6f), sz = 9f)
                  Pill("BACK", false, Ik.UN) { close() }
              }
              if (!advOk) Tx("this gpu cannot do advanced blends, they draw as normal", T.ink.copy(alpha = .6f), sz = 9f)
              BLEND_G.forEach { g ->
                  Tx(g.first, T.ac2, sz = 9f)
                  g.second.toList().chunked(2).forEach { row ->
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                          row.forEach { m -> Pill(BLEND_N[m], cur == m) { pick(m) } }
                      }
                  }
              }
          }

          // ───────────────────────── slime toggle switch ─────────────────────────
          @Composable
          fun SlimeSwitch(label: String, on: Boolean, f: () -> Unit) {
              val k by animateFloatAsState(if (on) 1f else 0f, spring(.45f, 420f), label = "sw")
              val ac = T.ac; val ink = T.ink
              Row(
                  Modifier.clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { f() },
                  verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))
              ) {
                  Canvas(Modifier.size(d(42f), d(24f))) {
                      val w = size.width; val h = size.height; val r = h / 2f
                      drawRoundRect(if (on) ac.copy(alpha = .6f) else Color(0xFF8CC8F0).copy(alpha = .25f), Offset(0f, 0f), size, CornerRadius(r))
                      drawRoundRect(Color(0xFF2149AA).copy(alpha = .85f), Offset(0f, 0f), size, CornerRadius(r), style = Stroke(2f))
                      val kk = k.coerceIn(-.2f, 1.2f)
                      val cxk = r + (w - 2f * r) * kk
                      val mv = abs(k - (if (on) 1f else 0f)).coerceIn(0f, 1f)      // moving = stretched like a drop
                      val kw = r * .84f * (1f + mv * .9f); val kh = r * .84f * (1f - mv * .25f)
                      drawOval(Color(0xFFC6E5FA), Offset(cxk - kw, r - kh), Size(kw * 2f, kh * 2f))
                      drawOval(Color(0xFF2149AA), Offset(cxk - kw, r - kh), Size(kw * 2f, kh * 2f), style = Stroke(2f))
                      drawCircle(Color.White.copy(alpha = .9f), r * .17f, Offset(cxk - kw * .35f, r - kh * .35f))
                  }
                  Tx(label, if (on) T.ac else ink.copy(alpha = .75f), sz = 9f)
              }
          }

          // ───────────────────────── stacked size / opacity / stabilizer bar, right above the toolbar ─────────────────────────
          @Composable
          fun ValChip(txt: String, on: Boolean, f: () -> Unit) {
              Tx(
                  txt, if (on) T.dk else T.ink,
                  Modifier.width(d(54f)).clip(RoundedCornerShape(50)).background(if (on) T.ac else T.panel2).clickable { f() }.padding(horizontal = d(6f), vertical = d(3f)), 10f
              )
          }

          @Composable
          fun SizeBar(e: Engine, tool: Tool, setTool: (Tool) -> Unit) {
              val rv = U.rev
              val ctx = LocalContext.current
              val p = e.pen
              var sub by remember { mutableIntStateOf(0) }       // 0 closed, 1 size limits, 2 opacity limits, 3 stabilizer options
              val smin = T.smin.coerceAtLeast(1f); val smax = maxOf(T.smax, smin + 1f)
              val omin = T.omin; val omax = maxOf(T.omax, omin + .01f)
              val t1 = (ln(p.size.coerceIn(smin, smax) / smin) / ln(smax / smin)).coerceIn(0f, 1f)
              val t2 = ((p.opacity - omin) / (omax - omin)).coerceIn(0f, 1f)
              val free = tool == Tool.BRUSH || tool == Tool.ERASER || tool == Tool.SMUDGE || tool == Tool.BLUR || tool == Tool.DODGE || tool == Tool.BURN
              val cap = if (tool == Tool.BRUSH || tool == Tool.ERASER) "ERASER" else if (tool == Tool.LIQUIFY) "RESTORE" else if (tool == Tool.LASSO) "ERASE" else ""
              val on = if (tool == Tool.ERASER) true else e.inv
              val col = Color(p.color)
              val ac = T.ac; val ink = Color(0xFF2149AA)
              Column(
                  Modifier.fillMaxWidth().padding(vertical = d(4f)).glass(rs(.9f)).padding(horizontal = d(12f), vertical = d(8f)),
                  verticalArrangement = Arrangement.spacedBy(d(6f))
              ) {
                  if (sub == 1) {
                      Tx("SIZE LIMITS", T.ac, sz = 10f)
                      R2(PP("MIN", 1f, 200f, 1f, false, { T.smin }, { x -> T.smin = x; if (p.size < x) p.size = x; if (T.smax < x + 1f) T.smax = x + 1f }))
                      R2(PP("MAX", 10f, 4000f, 10f, true, { T.smax }, { x -> T.smax = x; if (p.size > x) p.size = x; if (T.smin > x - 1f) T.smin = maxOf(1f, x - 1f) }))
                  } else if (sub == 2) {
                      Tx("OPACITY LIMITS", T.ac, sz = 10f)
                      R2(PP("MIN", .01f, .9f, .01f, false, { T.omin }, { x -> T.omin = x; if (p.opacity < x) p.opacity = x; if (T.omax < x + .01f) T.omax = x + .01f }))
                      R2(PP("MAX", .1f, 1f, .01f, false, { T.omax }, { x -> T.omax = x; if (p.opacity > x) p.opacity = x; if (T.omin > x - .01f) T.omin = maxOf(.01f, x - .01f) }))
                  } else if (sub == 3) {
                      Tx("STABILIZER", T.ac, sz = 10f)
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                          Pill("SMOOTH", p.stabMode < .5f) { p.stabMode = 0f; U.bump() }
                          Pill("STRING", p.stabMode > .5f) { p.stabMode = 1f; U.bump() }
                          Pill("CATCH UP", p.catchUp > .5f) { p.catchUp = if (p.catchUp > .5f) 0f else 1f; U.bump() }
                      }
                  }
                  if (sub != 0) Pill("DONE", true, Ik.OK) { sub = 0; T.save(ctx.getSharedPreferences("t", 0)) }
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(d(6f))) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                              Canvas(Modifier.size(d(22f))) {
                                  val c = Offset(size.width / 2f, size.height / 2f)
                                  val r = (size.minDimension / 2f) * (.2f + .8f * t1)
                                  drawCircle(col.copy(alpha = p.opacity.coerceIn(.15f, 1f)), r, c)
                                  drawCircle(ink, r, c, style = Stroke(2f))
                              }
                              CS(t1, Modifier.weight(1f)) { x -> p.size = smin * (smax / smin).pow(x); U.bump() }
                              ValChip("%d".format(p.size.toInt()), sub == 1) { sub = if (sub == 1) 0 else 1 }
                          }
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                              Canvas(Modifier.size(d(22f))) {
                                  val c = Offset(size.width / 2f, size.height / 2f); val r = size.minDimension / 2f - 1.5f
                                  drawCircle(ink, r, c, style = Stroke(2f))
                                  drawCircle(ac.copy(alpha = p.opacity.coerceIn(.1f, 1f)), r - 2f, c)
                              }
                              CS(t2, Modifier.weight(1f)) { x -> p.opacity = omin + x * (omax - omin); U.bump() }
                              ValChip("%d%%".format((p.opacity * 100f).toInt()), sub == 2) { sub = if (sub == 2) 0 else 2 }
                          }
                          if (free) Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                              Canvas(Modifier.size(d(22f))) {
                                  val pa = Path()
                                  for (i in 0..12) { val u = i / 12f; val px = size.width * u; val py = size.height * (.5f + .3f * sin(u * 6.2832f) * (1f - p.stab * .8f)); if (i == 0) pa.moveTo(px, py) else pa.lineTo(px, py) }
                                  drawPath(pa, ink, style = Stroke(2.5f, cap = StrokeCap.Round, join = StrokeJoin.Round))
                              }
                              CS(p.stab.coerceIn(0f, 1f), Modifier.weight(1f)) { x -> p.stab = x; U.bump() }
                              ValChip("%d%%".format((p.stab * 100f).toInt()), sub == 3) { sub = if (sub == 3) 0 else 3 }
                          }
                      }
                      Column(Modifier.padding(start = d(10f)), horizontalAlignment = Alignment.End, verticalArrangement = Arrangement.spacedBy(d(8f))) {
                          if (tool == Tool.LASSO) Pill(if (e.lassoMode == 0) "FILL" else "LINE", e.lassoMode == 1) { e.lassoMode = 1 - e.lassoMode; U.bump() }
                          if (cap.isNotEmpty()) SlimeSwitch(cap, on) {
                              if (tool == Tool.ERASER) { setTool(Tool.BRUSH); e.inv = false } else e.inv = !e.inv
                              U.bump()
                          }
                      }
                  }
              }
          }

          /** pulled-string stabilizer: shows the string between your finger and the brush while you draw */
          @Composable
          fun StringOverlay(e: Engine, tool: Tool) {
              val free = tool == Tool.BRUSH || tool == Tool.ERASER || tool == Tool.SMUDGE || tool == Tool.BLUR || tool == Tool.DODGE || tool == Tool.BURN
              val on = e.busy && free && e.pen.stab > .005f && e.pen.stabMode > .5f
              if (!on) return
              val ac = T.ac
              Canvas(Modifier.fillMaxSize()) {
                  val rv = e.strRev
                  if (rv < 0) return@Canvas
                  val s = minOf(e.vw.toFloat() / e.W, e.vh.toFloat() / e.H) * e.zoom
                  val cr = cos(e.rot); val sr = sin(e.rot)
                  val ox = e.vw / 2f + e.px; val oy = e.vh / 2f + e.py
                  fun sx(cx: Float, cy: Float): Offset {
                      val u = (cx - e.W / 2f) * s; val v = (e.H / 2f - cy) * s
                      return Offset(ox + cr * u - sr * v, oy + sr * u + cr * v)
                  }
                  val a = sx(e.bgx, e.bgy); val b = sx(e.fgx, e.fgy)
                  drawLine(Color(0xFF2149AA), a, b, 4f, StrokeCap.Round)
                  drawLine(Color.White.copy(alpha = .9f), a, b, 1.8f, StrokeCap.Round)
                  drawCircle(Color.White, 10f, b); drawCircle(Color(0xFF2149AA), 10f, b, style = Stroke(2.5f)); drawCircle(ac, 4.5f, b)
              }
          }

          // ───────────────────────── hold + drag (long press, then drag) without stealing normal taps ─────────────────────────
          fun Modifier.holdDrag(onStart: () -> Unit, onMove: (Offset) -> Unit, onEnd: () -> Unit): Modifier = this.pointerInput(Unit) {
              awaitEachGesture {
                  val down = awaitFirstDown(requireUnconsumed = false, pass = PointerEventPass.Initial)
                  val slop = viewConfiguration.touchSlop
                  val res = withTimeoutOrNull(420L) {
                      var go = true
                      while (go) {
                          val ev = awaitPointerEvent(PointerEventPass.Initial)
                          val c = ev.changes.firstOrNull { it.id == down.id }
                          if (c == null || !c.pressed || (c.position - down.position).getDistance() > slop) go = false
                      }
                      false
                  }
                  if (res == null) {
                      onStart()
                      var go = true
                      while (go) {
                          val ev = awaitPointerEvent(PointerEventPass.Initial)
                          val c = ev.changes.firstOrNull { it.id == down.id }
                          if (c == null) {
                              go = false
                          } else {
                              ev.changes.forEach { it.consume() }
                              if (!c.pressed) go = false else onMove(c.positionChange())
                          }
                      }
                      onEnd()
                  }
              }
          }

          // ───────────────────────── lasso preview: marching ants + tinted fill ─────────────────────────
          @Composable
          fun LassoOverlay(e: Engine, n: Int) {
              if (n < 2) return
              val ac = T.ac
              val ph = loopState(900, "ants")
              Canvas(Modifier.fillMaxSize()) {
                  val vr = e.vrev
                  if (vr < 0) return@Canvas
                  val pts = e.lasso.toFloatArray()
                  val cnt = pts.size / 2
                  if (cnt < 2) return@Canvas
                  val s = minOf(e.vw.toFloat() / e.W, e.vh.toFloat() / e.H) * e.zoom
                  val cr = cos(e.rot); val sr = sin(e.rot)
                  val ox = e.vw / 2f + e.px; val oy = e.vh / 2f + e.py
                  val path = Path()
                  for (i in 0 until cnt) {
                      val u = (pts[i * 2] - e.W / 2f) * s; val v = (e.H / 2f - pts[i * 2 + 1]) * s
                      val gx = ox + cr * u - sr * v; val gy = oy + sr * u + cr * v
                      if (i == 0) path.moveTo(gx, gy) else path.lineTo(gx, gy)
                  }
                  val fillP = Path()
                  fillP.addPath(path)
                  fillP.close()
                  drawPath(fillP, ac.copy(alpha = .16f))
                  drawPath(path, Color.White, style = Stroke(3.5f, cap = StrokeCap.Round, join = StrokeJoin.Round))
                  drawPath(path, Color(0xFF2149AA), style = Stroke(3.5f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(14f, 12f), ph.value * 52f)))
              }
          }
