              var smax by mutableFloatStateOf(1000f)
              var omin by mutableFloatStateOf(.01f)  // opacity slider limits
              var omax by mutableFloatStateOf(1f)
              val hue: Float get() = if (fol > .5f) fh else ah
              fun hsv(h: Float, s: Float, v: Float): Color =
                  Color(android.graphics.Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f))))
              fun rgb(h: Float, s: Float, v: Float): FloatArray {
                  val c = android.graphics.Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f)))
                  return floatArrayOf(android.graphics.Color.red(c) / 255f, android.graphics.Color.green(c) / 255f, android.graphics.Color.blue(c) / 255f)
              }
              val ac: Color get() = hsv(hue, sat, av)
              val ac2: Color get() = hsv(hue + sh, sat, av)
              val panel: Color get() = hsv(hue, .35f, .11f).copy(alpha = pa)
              val panel2: Color get() = hsv(hue, .3f, .2f)
              val ink = Color(0xFFEAF6FF)
              val dk = Color(0xFF0F2563)
              fun sig(): Float = bgv + bgh + bgs + pat + psz + ph + ps + pv + pam + plx
              fun push(e: Engine) {
                  e.bg = rgb(bgh, bgs, minOf(bgv, .09f)); e.patC = rgb(ph, ps, minOf(pv, .4f))
                  e.pat = pat.toInt(); e.patSz = psz; e.patAmt = pam; e.plx = 0f
              }
              fun load(p: SharedPreferences) {
                  if (p.getInt("tv", 0) < 2) { p.edit().putInt("tv", 2).apply(); return }   // first run of the slime theme: start from its defaults
                  for (q in themeParams()) q.s(p.getFloat("t_" + q.n, q.g()))
              }
              fun save(p: SharedPreferences) { val ed = p.edit(); for (q in themeParams()) ed.putFloat("t_" + q.n, q.g()); ed.apply() }
          }

