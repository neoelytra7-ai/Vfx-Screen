          // ───────────────────────── small helpers ─────────────────────────
          val IDEA_A = listOf("sleepy", "tiny", "fluffy", "galactic", "grumpy", "sparkly", "shy", "royal", "jelly", "cozy", "wobbly", "midnight")
          val IDEA_B = listOf("cloud", "dumpling", "fox", "robot", "cactus", "whale", "mushroom", "ghost", "bunny", "dragon", "teapot", "comet")
          val IDEA_C = listOf("eating ramen", "riding a bike", "reading a book", "making tea", "surfing", "dancing", "stargazing", "baking cookies", "playing guitar", "lost in a maze")
          val IDEA_D = listOf("on the moon", "in a tiny forest", "under the sea", "at a night market", "in a cozy cafe", "on a rainy rooftop", "inside a snow globe", "in candy land")

          /** A random drawing prompt: "a sleepy cloud eating ramen on the moon". */
          fun idea(): String {
              val r = kotlin.random.Random
              return "a " + IDEA_A[r.nextInt(IDEA_A.size)] + " " + IDEA_B[r.nextInt(IDEA_B.size)] + " " +
