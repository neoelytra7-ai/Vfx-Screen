          @Composable
          fun Home(st: BenchState, onStart: (Cfg) -> Unit, onOpen: (ProjMeta) -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var sheet by remember { mutableIntStateOf(0) }       // 0 none, 1 new canvas, 2 style, 3 device
              var lastS by remember { mutableIntStateOf(1) }
              var mood by remember { mutableIntStateOf(0) }
              var say by remember { mutableStateOf(greet()) }
              var projects by remember { mutableStateOf<List<ProjMeta>>(emptyList()) }
              val res = st.res
              val ram = remember { (ramGb(ctx) * 1024f).toInt() }
              val fl = loopState(3000, "fl2")
              fun rerun() {
                  for (i in 0 until 6) st.bars[i] = 0f
                  st.stage = 0; st.res = null; st.key++; st.running = true
              }
              SideEffect { if (sheet != 0) lastS = sheet }
              LaunchedEffect(Unit) { projects = withContext(Dispatchers.IO) { Proj.list(ctx) } }
              LaunchedEffect(Unit) { if (st.res == null && !st.running) rerun() }
              LaunchedEffect(st.running) {
                  if (st.running) {
                      mood = 2; say = "measuring your device..."
                      delay(15000)
                      if (st.running) { st.res = fallbackRes(ctx); st.running = false }
                  } else {
                      val r0 = st.res
                      if (r0 != null) { mood = 3; say = "you're a " + TIERS[r0.tier].name.lowercase() + "!"; delay(2600); mood = 0 }
                  }
              }
              SparkBox(Modifier.fillMaxSize().background(Color.Black)) {
                  Floaters(Modifier.fillMaxSize())
                  if (st.running) key(st.key) {
                      AndroidView({ BenchView(ctx, st) { r -> st.res = r; st.running = false; saveBench(ctx, r) } }, Modifier.size(2.dp))
                  }
                  Column(
                      Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().padding(horizontal = d(12f), vertical = d(8f)),
                      verticalArrangement = Arrangement.spacedBy(d(8f))
                  ) {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(10f))) {
                          Box(Modifier.graphicsLayer { translationY = sin(fl.value * 6.2832f) * 4f * density }) {
                              Mascot(mood, 92f, if (res != null) intArrayOf(1, 2, 3, 4, 5)[res.tier] else 0) {
                                  say = SAYS[(System.currentTimeMillis() % SAYS.size).toInt()]; mood = 1
                                  scope.launch { delay(1300); mood = if (st.running) 2 else 0 }
                              }
                          }
                          Column(verticalArrangement = Arrangement.spacedBy(d(4f))) {
                              ArtTitle()
                              Tx(say, T.dk, Modifier.clip(RoundedCornerShape(50)).background(T.ac).padding(horizontal = d(10f), vertical = d(3f)), 9f)
                              if (res != null && !st.running) Tx(TIERS[res.tier].name + " tier  -  " + res.score + "/100", T.ac2, sz = 9f)
                          }
                      }
                      ProjGallery(
                          Modifier.weight(1f).fillMaxWidth(), projects, onOpen, { sheet = 1 },
                          { p -> Proj.delete(ctx, p.id); projects = projects.filter { it.id != p.id } }
                      )
                      AnimatedVisibility(
                          visible = sheet != 0,
                          enter = fadeIn() + scaleIn(spring(.55f, 380f), initialScale = .92f, transformOrigin = TransformOrigin(.5f, 1f)) + expandVertically(),
                          exit = fadeOut() + scaleOut(targetScale = .94f, transformOrigin = TransformOrigin(.5f, 1f)) + shrinkVertically()
                      ) {
                          Column(
                              Modifier.fillMaxWidth().heightIn(max = d(380f)).glass(key = lastS).animateContentSize().verticalScroll(rememberScrollState()).padding(d(12f)),
                              verticalArrangement = Arrangement.spacedBy(d(8f))
                          ) {
                              if (lastS == 1) NewCanvas(res, ram, onStart)
                              else if (lastS == 2) ThemePanel { T.save(ctx.getSharedPreferences("t", 0)); sheet = 0 }
                              else BenchCard(st) { rerun() }
                          }
                      }
                      Row(
                          Modifier.fillMaxWidth().glass(RoundedCornerShape(50)).padding(horizontal = d(14f), vertical = d(8f)),
                          horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically
                      ) {
                          ToolBtn(Ik.TH, "STYLE", sheet == 2) { sheet = if (sheet == 2) 0 else 2 }
                          ToolBtn(Ik.PL, "NEW", sheet == 1) { sheet = if (sheet == 1) 0 else 1 }
                          ToolBtn(Ik.DC, "IDEA", false) { say = idea(); mood = 1; scope.launch { delay(2800); mood = if (st.running) 2 else 0 } }
                          ToolBtn(Ik.CP, "DEVICE", sheet == 3) { sheet = if (sheet == 3) 0 else 3 }
                      }
                  }
              }
          }
          EOF_SRC
      - uses: actions/cache@v4
        with: {path: ~/ks, key: "ks-${{github.repository}}"}
      - env:
          B: ${{secrets.KS_B64}}
          P: ${{secrets.KS_PASS || 'ci-dev-key'}}
          A: ${{secrets.KS_ALIAS || 'k'}}
        run: |
          V=0.$(date -u +%y%m%d).$GITHUB_RUN_NUMBER
          gradle -q :app:assembleRelease -PversionCode=$((1000+GITHUB_RUN_NUMBER)) -PversionName=$V
          mkdir -p ~/ks dist; K=~/ks/k.jks
          [ -n "$B" ] && echo "$B"|base64 -d >$K
          [ -f $K ] || keytool -genkeypair -keystore $K -alias $A -keyalg RSA -keysize 3072 -validity 36500 -storepass "$P" -keypass "$P" -dname CN=$N
          T=$(ls -d $ANDROID_HOME/build-tools/*|sort -V|tail -1)
          $T/zipalign -fp 4 app/build/outputs/apk/release/*.apk a.apk
          $T/apksigner sign --ks $K --ks-key-alias $A --ks-pass env:P --key-pass env:P --out dist/$N-$V.apk a.apk
          echo "V=$V" >>$GITHUB_ENV
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{github.token}}"}
        run: |
          R=nightly F=-p; [ $GITHUB_REF_TYPE = tag ] && R=$GITHUB_REF_NAME F=
          [ $R = nightly ] && gh release delete nightly --cleanup-tag -y || true
          gh release create $R dist/* -t "$N $V" -n "build $GITHUB_RUN_NUMBER" --target $GITHUB_SHA $F
