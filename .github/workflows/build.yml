name: Build VoxClone APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/checkout@v4
      - name: Signing key (created once, committed, reused so updates install over the old app)
        run: |
          if [ ! -f hexnpu.keystore ]; then
            keytool -genkeypair -keystore hexnpu.keystore -storepass hexnpu123 -keypass hexnpu123 -alias hexnpu -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=HexNPU"
            git config user.name github-actions; git config user.email actions@github.com
            git add hexnpu.keystore; git commit -m "Add signing key [skip ci]"; git push
          fi
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          P=app/src/main/java/com/example/voxclone
          mkdir -p $P app/src/main
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VoxClone"
          include(":app")
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.voxclone"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.voxclone"; minSdk = 29; targetSdk = 34
                  versionCode = (System.getenv("VC") ?: "1").toInt(); versionName = "1." + (System.getenv("VC") ?: "0")
                  ndk { abiFilters += "arm64-v8a" }
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              signingConfigs { create("rel") { storeFile = rootProject.file("hexnpu.keystore"); storePassword = "hexnpu123"; keyAlias = "hexnpu"; keyPassword = "hexnpu123" } }
              buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("rel") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true; pickFirsts += "**/libc++_shared.so" } }
          }
          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.23.2")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application android:label="VoxClone" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/Tts.kt <<'EOF'
          package com.example.voxclone

          import ai.onnxruntime.*
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Context
          import android.media.*
          import android.net.Uri
          import android.provider.MediaStore
          import java.io.DataOutputStream
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.text.Normalizer
          import java.util.Random
          import java.util.concurrent.LinkedBlockingQueue
          import kotlin.math.abs
          import kotlin.math.sqrt

          /** Pocket TTS (Kyutai, CC BY 4.0), ONNX export by Ryan2025A. ~100M params, zero-shot voice cloning, runs on CPU. */
          object Models {
              private const val BASE = "https://huggingface.co/Ryan2025A/pocket-tts-onnx/resolve/main/"
              /** 0 encoder, 1 text conditioner, 2 flow LM main, 3 flow net, 4 mimi decoder, 5 tokenizer */
              fun files(int8: Boolean) = listOf("onnx/mimi_encoder.onnx", "onnx/text_conditioner.onnx",
                  if (int8) "onnx/flow_lm_main_int8.onnx" else "onnx/flow_lm_main.onnx",
                  if (int8) "onnx/flow_lm_flow_int8.onnx" else "onnx/flow_lm_flow.onnx",
                  if (int8) "onnx/mimi_decoder_int8.onnx" else "onnx/mimi_decoder.onnx", "tokenizer.model")
              fun local(ctx: Context, remote: String) = File(File(ctx.filesDir, "pocket"), remote.substringAfterLast('/'))
              fun ready(ctx: Context, int8: Boolean) = files(int8).all { local(ctx, it).length() > 0 }

              fun download(ctx: Context, int8: Boolean, onP: (String, Float) -> Unit) {
                  for (r in files(int8)) {
                      val f = local(ctx, r); if (f.length() > 0) continue
                      f.parentFile?.mkdirs()
                      val c = URL(BASE + r).openConnection() as HttpURLConnection
                      c.connectTimeout = 20000; c.readTimeout = 30000
                      val total = c.contentLengthLong; val part = File(f.path + ".part"); var last = -1
                      c.inputStream.use { i -> part.outputStream().use { o ->
                          val b = ByteArray(1 shl 16); var n = 0L
                          while (true) {
                              val k = i.read(b); if (k < 0) break
                              o.write(b, 0, k); n += k
                              val p = if (total > 0) (n * 100 / total).toInt() else 0
                              if (p != last) { last = p; onP(f.name, p / 100f) }
                          }
                      } }
                      part.renameTo(f)
                  }
              }
          }

          /** Minimal SentencePiece (unigram + BPE) reader, so no native library is needed. */
          class SP(bytes: ByteArray) {
              private val pieces = ArrayList<String>(); private val scores = ArrayList<Float>(); private val types = ArrayList<Int>()
              private var modelType = 1; private var addDummy = true; private var removeExtra = true; private var escape = true
              private val map = HashMap<String, Int>(); private var unk = 0; private val byteIds = IntArray(256) { -1 }; private var maxLen = 1; private var minScore = 0f

              private class R(val b: ByteArray, var p: Int, val end: Int) {
                  fun more() = p < end
                  fun varint(): Long { var r = 0L; var s = 0; while (true) { val x = b[p++].toInt() and 255; r = r or ((x and 127).toLong() shl s); if (x < 128) break; s += 7 }; return r }
                  fun skip(w: Int) { when (w) { 0 -> varint(); 1 -> p += 8; 2 -> { val n = varint().toInt(); p += n }; 5 -> p += 4 } }
              }

              init {
                  val top = R(bytes, 0, bytes.size)
                  while (top.more()) {
                      val t = top.varint(); val f = (t shr 3).toInt(); val w = (t and 7).toInt()
                      if (w != 2) { top.skip(w); continue }
                      val n = top.varint().toInt(); val sub = R(bytes, top.p, top.p + n); top.p += n
                      when (f) {
                          1 -> { var s = ""; var sc = 0f; var ty = 1
                              while (sub.more()) { val tt = sub.varint(); val ff = (tt shr 3).toInt(); val ww = (tt and 7).toInt()
                                  when { ff == 1 && ww == 2 -> { val l = sub.varint().toInt(); s = String(bytes, sub.p, l, Charsets.UTF_8); sub.p += l }
                                      ff == 2 && ww == 5 -> { sc = ByteBuffer.wrap(bytes, sub.p, 4).order(ByteOrder.LITTLE_ENDIAN).float; sub.p += 4 }
                                      ff == 3 && ww == 0 -> ty = sub.varint().toInt()
                                      else -> sub.skip(ww) } }
                              pieces.add(s); scores.add(sc); types.add(ty) }
                          2 -> while (sub.more()) { val tt = sub.varint(); val ff = (tt shr 3).toInt(); val ww = (tt and 7).toInt(); if (ff == 3 && ww == 0) modelType = sub.varint().toInt() else sub.skip(ww) }
                          3 -> while (sub.more()) { val tt = sub.varint(); val ff = (tt shr 3).toInt(); val ww = (tt and 7).toInt()
                              if (ww == 0 && ff == 3) addDummy = sub.varint() != 0L else if (ww == 0 && ff == 4) removeExtra = sub.varint() != 0L else if (ww == 0 && ff == 5) escape = sub.varint() != 0L else sub.skip(ww) }
                      }
                  }
                  for (i in pieces.indices) {
                      val ty = types[i]
                      if (ty == 2) unk = i
                      if (ty == 6) { val h = pieces[i].removePrefix("<0x").removeSuffix(">"); h.toIntOrNull(16)?.let { byteIds[it] = i } }
                      if (ty == 1 || ty == 4) { map[pieces[i]] = i; maxLen = maxOf(maxLen, pieces[i].length); minScore = minOf(minScore, scores[i]) }
                  }
              }

              private fun unkIds(ch: String): List<Int> {
                  val bs = ch.toByteArray(Charsets.UTF_8)
                  return if (bs.all { byteIds[it.toInt() and 255] >= 0 }) bs.map { byteIds[it.toInt() and 255] } else listOf(unk)
              }

              fun encode(text: String): LongArray {
                  var t = Normalizer.normalize(text, Normalizer.Form.NFKC)
                  if (removeExtra) t = t.trim().replace(Regex("\\s+"), " ")
                  if (addDummy) t = " $t"
                  if (escape) t = t.replace(' ', '\u2581')
                  val out = ArrayList<Int>()
                  if (modelType == 2) {
                      val sym = t.map { it.toString() }.toMutableList()
                      while (sym.size > 1) {
                          var bi = -1; var bs = -1e30f
                          for (i in 0 until sym.size - 1) { val id = map[sym[i] + sym[i + 1]]; if (id != null && scores[id] > bs) { bs = scores[id]; bi = i } }
                          if (bi < 0) break
                          sym[bi] = sym[bi] + sym[bi + 1]; sym.removeAt(bi + 1)
                      }
                      for (s in sym) { val id = map[s]; if (id != null) out.add(id) else out.addAll(unkIds(s)) }
                  } else {
                      val n = t.length; val best = FloatArray(n + 1) { -1e30f }; val prev = IntArray(n + 1); val pid = IntArray(n + 1); best[0] = 0f
                      for (i in 0 until n) {
                          if (best[i] < -1e29f) continue
                          for (l in 1..minOf(maxLen, n - i)) {
                              val id = map[t.substring(i, i + l)] ?: continue
                              val s = best[i] + scores[id]
                              if (s > best[i + l]) { best[i + l] = s; prev[i + l] = i; pid[i + l] = id }
                          }
                          if (map[t.substring(i, i + 1)] == null) { val s = best[i] + minScore - 10f; if (s > best[i + 1]) { best[i + 1] = s; prev[i + 1] = i; pid[i + 1] = -1 } }
                      }
                      val rev = ArrayList<Int>(); var p = n
                      while (p > 0) { val q = prev[p]; if (pid[p] >= 0) rev.add(pid[p]) else rev.addAll(unkIds(t.substring(q, p)).reversed()); p = q }
                      out.addAll(rev.reversed())
                  }
                  return LongArray(out.size) { out[it].toLong() }
              }
          }

          class VoiceData(val id: String, val n: Int, val emb: FloatArray)
          class Voice(val id: String, val name: String, val sec: Float)

          object Store {
              private fun dir(ctx: Context) = File(ctx.filesDir, "voices").apply { mkdirs() }
              fun list(ctx: Context): List<Voice> {
                  val f = File(dir(ctx), "index.tsv"); if (!f.exists()) return emptyList()
                  return f.readLines().mapNotNull { l -> val p = l.split('\t'); if (p.size >= 3) Voice(p[0], p[1], p[2].toFloatOrNull() ?: 0f) else null }
              }
              fun save(ctx: Context, name: String, sec: Float, d: VoiceData) {
                  val bb = ByteBuffer.allocate(4 + d.emb.size * 4).order(ByteOrder.LITTLE_ENDIAN); bb.putInt(d.n); for (x in d.emb) bb.putFloat(x)
                  File(dir(ctx), d.id + ".emb").writeBytes(bb.array())
                  File(dir(ctx), "index.tsv").appendText(d.id + "\t" + name.replace('\t', ' ').replace('\n', ' ') + "\t" + sec + "\n")
              }
              fun load(ctx: Context, id: String): VoiceData {
                  val b = File(dir(ctx), "$id.emb").readBytes(); val bb = ByteBuffer.wrap(b).order(ByteOrder.LITTLE_ENDIAN)
                  val n = bb.int; val e = FloatArray(n * 1024); bb.asFloatBuffer().get(e); return VoiceData(id, n, e)
              }
              fun delete(ctx: Context, id: String) {
                  File(dir(ctx), "$id.emb").delete()
                  val f = File(dir(ctx), "index.tsv"); if (f.exists()) f.writeText(f.readLines().filter { !it.startsWith("$id\t") }.joinToString("") { it + "\n" })
              }
          }

          class Engine(private val ctx: Context, int8: Boolean, private val threads: Int) : AutoCloseable {
              private val env = OrtEnvironment.getEnvironment()
              private val F = Models.files(int8)
              private fun open(i: Int): OrtSession {
                  val o = OrtSession.SessionOptions(); o.setIntraOpNumThreads(threads); o.setInterOpNumThreads(1)
                  return env.createSession(Models.local(ctx, F[i]).path, o)
              }
              private val enc = open(0); private val txtc = open(1); private val main = open(2); private val flow = open(3); private val dec = open(4)
              private val tok = SP(Models.local(ctx, F[5]).readBytes())
              private var vId: String? = null; private var vRes: OrtSession.Result? = null; private var vEmb: OnnxTensor? = null
              private var vState: Map<String, OnnxTensor> = emptyMap()
              @Volatile private var decErr: Throwable? = null

              private fun f32(shape: LongArray, d: FloatArray): OnnxTensor {
                  val b = ByteBuffer.allocateDirect(d.size * 4).order(ByteOrder.nativeOrder()).asFloatBuffer(); b.put(d); b.rewind()
                  return OnnxTensor.createTensor(env, b, shape)
              }
              private fun i64(shape: LongArray, d: LongArray): OnnxTensor {
                  val b = ByteBuffer.allocateDirect(d.size * 8).order(ByteOrder.nativeOrder()).asLongBuffer(); b.put(d); b.rewind()
                  return OnnxTensor.createTensor(env, b, shape)
              }
              private fun floats(v: OnnxValue): FloatArray { val fb = (v as OnnxTensor).floatBuffer; return FloatArray(fb.remaining()).also { fb.get(it) } }

              /** Zero-filled state tensors; dynamic dims start at 0, exactly like the reference implementation. */
              private fun initState(s: OrtSession): HashMap<String, OnnxTensor> {
                  val m = HashMap<String, OnnxTensor>()
                  for ((name, ni) in s.inputInfo) {
                      if (!name.startsWith("state_")) continue
                      val ti = ni.info as TensorInfo
                      val shape = ti.shape.map { if (it < 0) 0L else it }.toLongArray()
                      val n = shape.fold(1L) { a, b -> a * b }.toInt()
                      m[name] = when (ti.type) {
                          OnnxJavaType.INT64 -> i64(shape, LongArray(n))
                          OnnxJavaType.BOOL -> OnnxTensor.createTensor(env, ByteBuffer.allocateDirect(n), shape, OnnxJavaType.BOOL)
                          else -> f32(shape, FloatArray(n))
                      }
                  }
                  return m
              }

              private fun runMain(extra: Map<String, OnnxTensor>, state: MutableMap<String, OnnxTensor>): OrtSession.Result {
                  val inputs = HashMap<String, OnnxTensor>(extra); inputs.putAll(state)
                  val r = main.run(inputs); val names = main.outputNames.toList()
                  for (i in names.indices) if (names[i].startsWith("out_state_")) state["state_" + names[i].removePrefix("out_state_")] = r.get(i) as OnnxTensor
                  return r
              }

              fun encodeVoice(id: String, pcm24k: FloatArray): VoiceData {
                  val a = f32(longArrayOf(1, 1, pcm24k.size.toLong()), pcm24k)
                  val r = enc.run(mapOf("audio" to a)); val d = floats(r.get(0)); r.close(); a.close()
                  return VoiceData(id, d.size / 1024, d)
              }

              /** The heavy voice-conditioning pass runs once per voice; its KV state is reused for every sentence. */
              private fun voiceState(v: VoiceData): Map<String, OnnxTensor> {
                  if (vId == v.id) return vState
                  vRes?.close(); vEmb?.close(); vRes = null; vId = null
                  val emb = f32(longArrayOf(1, v.n.toLong(), 1024), v.emb)
                  val st = initState(main); val init = st.values.toList()
                  val seq = f32(longArrayOf(1, 0, 32), FloatArray(0))
                  val r = runMain(mapOf("sequence" to seq, "text_embeddings" to emb), st)
                  init.forEach { it.close() }; seq.close()
                  vRes = r; vEmb = emb; vId = v.id; vState = st
                  return st
              }

              private fun textEmb(ids: LongArray): OnnxTensor {
                  val idt = i64(longArrayOf(1, ids.size.toLong()), ids)
                  val r = txtc.run(mapOf("token_ids" to idt)); val t = r.get(0) as OnnxTensor
                  val sh = t.info.shape; val data = floats(t)
                  val out = f32(if (sh.size == 2) longArrayOf(1, sh[0], sh[1]) else sh, data)
                  r.close(); idt.close(); return out
              }

              private fun prep(t0: String): String {
                  var t = t0.trim(); if (t.isEmpty()) return t
                  if (t.last().isLetterOrDigit()) t += "."
                  if (!t[0].isUpperCase()) t = t[0].uppercaseChar() + t.substring(1)
                  return t
              }

              private fun split(text: String): List<String> {
                  val out = ArrayList<String>(); var cur = ""
                  for (s in text.trim().split(Regex("(?<=[.!?])\\s+")).filter { it.isNotBlank() }) {
                      if (cur.isNotEmpty() && cur.length + s.length > 220) { out.add(cur); cur = s } else cur = if (cur.isEmpty()) s else "$cur $s"
                  }
                  if (cur.isNotEmpty()) out.add(cur)
                  return out
              }

              /** Returns generated frames (80 ms each). [emit] receives 24 kHz mono float audio as soon as it is decoded. */
              fun speak(v: VoiceData, text: String, temp: Float, lsd: Int, cancel: () -> Boolean, emit: (FloatArray) -> Unit, onFrame: (Int) -> Unit): Int {
                  val base = voiceState(v); var frames = 0
                  for (part in split(text)) {
                      if (cancel()) break
                      val done = frames
                      frames += chunk(base, tok.encode(prep(part)), temp, lsd, cancel, emit) { onFrame(done + it) }
                      emit(FloatArray(3600))
                  }
                  return frames
              }

              private fun chunk(base: Map<String, OnnxTensor>, ids: LongArray, temp: Float, lsd: Int, cancel: () -> Boolean, emit: (FloatArray) -> Unit, onFrame: (Int) -> Unit): Int {
                  val textT = textEmb(ids)
                  val state = HashMap<String, OnnxTensor>(base)
                  val emptySeq = f32(longArrayOf(1, 0, 32), FloatArray(0)); val emptyTxt = f32(longArrayOf(1, 0, 1024), FloatArray(0))
                  val sT = (0 until lsd).map { f32(longArrayOf(1, 1), floatArrayOf(it.toFloat() / lsd)) }
                  val tT = (0 until lsd).map { f32(longArrayOf(1, 1), floatArrayOf((it + 1f) / lsd)) }
                  val q = LinkedBlockingQueue<FloatArray>(); decErr = null
                  val dt = Thread { decodeLoop(q, emit) }; dt.start()
                  val rnd = Random(); val std = if (temp > 0f) sqrt(temp) else 0f; val h = 1f / lsd
                  var curr = f32(longArrayOf(1, 1, 32), FloatArray(32) { Float.NaN })
                  var prev: OrtSession.Result? = null; var frames = 0; var eosStep = -1
                  try {
                      prev = runMain(mapOf("sequence" to emptySeq, "text_embeddings" to textT), state)
                      for (step in 0 until 500) {
                          if (cancel()) break
                          val r = runMain(mapOf("sequence" to curr, "text_embeddings" to emptyTxt), state)
                          prev?.close(); prev = r
                          val cond = r.get(0) as OnnxTensor
                          if (floats(r.get(1))[0] > -4f && eosStep < 0) eosStep = step
                          if (eosStep >= 0 && step >= eosStep + 3) break
                          val x = FloatArray(32) { (rnd.nextGaussian() * std).toFloat() }
                          for (j in 0 until lsd) {
                              val xt = f32(longArrayOf(1, 32), x)
                              val fr = flow.run(mapOf("c" to cond, "s" to sT[j], "t" to tT[j], "x" to xt))
                              val o = floats(fr.get(0)); for (i in 0 until 32) x[i] += o[i] * h
                              fr.close(); xt.close()
                          }
                          q.put(x.copyOf()); frames++; onFrame(frames)
                          curr.close(); curr = f32(longArrayOf(1, 1, 32), x)
                      }
                  } finally {
                      q.put(FloatArray(0)); dt.join()
                      prev?.close(); curr.close(); emptySeq.close(); emptyTxt.close(); textT.close(); sT.forEach { it.close() }; tT.forEach { it.close() }
                  }
                  decErr?.let { throw it }
                  return frames
              }

              private fun decodeLoop(q: LinkedBlockingQueue<FloatArray>, emit: (FloatArray) -> Unit) {
                  val st = initState(dec); val init = st.values.toList(); var first = true
                  var prev: OrtSession.Result? = null; val buf = ArrayList<FloatArray>(); var sent = 0; var firstChunk = true
                  fun flush(n: Int) {
                      val c = FloatArray(n * 32); for (i in 0 until n) System.arraycopy(buf[sent + i], 0, c, i * 32, 32)
                      val lt = f32(longArrayOf(1, n.toLong(), 32), c)
                      val inputs = HashMap<String, OnnxTensor>(st); inputs["latent"] = lt
                      val r = dec.run(inputs); val names = dec.outputNames.toList()
                      for (i in names.indices) if (names[i].startsWith("out_state_")) st["state_" + names[i].removePrefix("out_state_")] = r.get(i) as OnnxTensor
                      if (first) { init.forEach { it.close() }; first = false }
                      prev?.close(); prev = r; lt.close()
                      emit(floats(r.get(0))); sent += n
                  }
                  try {
                      while (true) {
                          val x = q.take(); if (x.isEmpty()) break
                          buf.add(x); val need = if (firstChunk) 3 else 12
                          if (buf.size - sent >= need) { flush(need); firstChunk = false }
                      }
                      if (sent < buf.size) flush(buf.size - sent)
                  } catch (e: Throwable) { decErr = e } finally { prev?.close() }
              }

              override fun close() { vRes?.close(); vEmb?.close(); enc.close(); txtc.close(); main.close(); flow.close(); dec.close() }
          }

          /** Streams audio to the speaker, optionally while it is still being generated, and keeps a copy for saving. */
          class Sink(private val live: Boolean) {
              private val sr = 24000
              private val track: AudioTrack
              private val pending = ArrayList<FloatArray>(); private var pendingN = 0; private var started = false
              val all = ArrayList<FloatArray>()
              init {
                  val min = AudioTrack.getMinBufferSize(sr, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_FLOAT)
                  track = AudioTrack.Builder()
                      .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                      .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_FLOAT).setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                      .setBufferSizeInBytes(maxOf(min, sr * 4 * 2)).setTransferMode(AudioTrack.MODE_STREAM).build()
              }
              private fun w(a: FloatArray) { track.write(a, 0, a.size, AudioTrack.WRITE_BLOCKING) }
              fun put(a: FloatArray) {
                  all.add(a)
                  if (!live) return
                  if (started) { w(a); return }
                  pending.add(a); pendingN += a.size
                  if (pendingN >= sr * 12 / 10) { track.play(); started = true; pending.forEach { w(it) }; pending.clear() }
              }
              fun finish() { if (!started) { track.play(); started = true; pending.forEach { w(it) }; pending.clear(); if (!live) all.forEach { w(it) } } }
              fun stop() { try { track.pause(); track.flush(); track.release() } catch (_: Throwable) {} }
              fun release() { try { track.stop(); track.release() } catch (_: Throwable) {} }
              fun merged(): FloatArray { val n = all.sumOf { it.size }; val o = FloatArray(n); var p = 0; for (a in all) { System.arraycopy(a, 0, o, p, a.size); p += a.size }; return o }
          }

          object AudioIn {
              private const val SR = 24000
              private const val MAX = SR * 15

              fun resample(x: FloatArray, from: Int): FloatArray {
                  if (from == SR) return x
                  val n = (x.size.toLong() * SR / from).toInt(); val out = FloatArray(n); val r = from.toDouble() / SR
                  for (i in 0 until n) {
                      val a = i * r
                      if (r > 1.0) { val k0 = a.toInt(); val k1 = minOf(((i + 1) * r).toInt() + 1, x.size); var s = 0f; for (k in k0 until k1) s += x[k]; out[i] = s / maxOf(k1 - k0, 1) }
                      else { val k = a.toInt(); val f = (a - k).toFloat(); val x0 = x[minOf(k, x.size - 1)]; val x1 = x[minOf(k + 1, x.size - 1)]; out[i] = x0 + (x1 - x0) * f }
                  }
                  return out
              }

              fun finish(x: FloatArray, sr: Int): FloatArray {
                  var o = resample(x, sr); if (o.size > MAX) o = o.copyOf(MAX)
                  var pk = 0f; for (v in o) pk = maxOf(pk, abs(v))
                  if (pk > 1e-4f) { val g = 0.9f / pk; for (i in o.indices) o[i] *= g }
                  return o
              }

              fun decode(ctx: Context, uri: Uri): FloatArray {
                  val ex = MediaExtractor(); ex.setDataSource(ctx, uri, null)
                  var ti = -1; var fmt: MediaFormat? = null
                  for (i in 0 until ex.trackCount) { val f = ex.getTrackFormat(i); if ((f.getString(MediaFormat.KEY_MIME) ?: "").startsWith("audio/")) { ti = i; fmt = f; break } }
                  if (ti < 0 || fmt == null) throw IllegalArgumentException("No audio track in that file")
                  ex.selectTrack(ti)
                  var sr = fmt.getInteger(MediaFormat.KEY_SAMPLE_RATE); var ch = fmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                  val codec = MediaCodec.createDecoderByType(fmt.getString(MediaFormat.KEY_MIME)!!); codec.configure(fmt, null, null, 0); codec.start()
                  val pcm = ArrayList<ShortArray>(); var total = 0; val info = MediaCodec.BufferInfo(); var inDone = false; var outDone = false
                  while (!outDone && total < sr * 20 * ch) {
                      if (!inDone) {
                          val ii = codec.dequeueInputBuffer(10000)
                          if (ii >= 0) {
                              val ib = codec.getInputBuffer(ii)!!; val n = ex.readSampleData(ib, 0)
                              if (n < 0) { codec.queueInputBuffer(ii, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM); inDone = true }
                              else { codec.queueInputBuffer(ii, 0, n, ex.sampleTime, 0); ex.advance() }
                          }
                      }
                      val oi = codec.dequeueOutputBuffer(info, 10000)
                      if (oi >= 0) {
                          val ob = codec.getOutputBuffer(oi)!!; ob.position(info.offset); ob.limit(info.offset + info.size)
                          val sb = ob.order(ByteOrder.nativeOrder()).asShortBuffer(); val a = ShortArray(sb.remaining()); sb.get(a)
                          pcm.add(a); total += a.size; codec.releaseOutputBuffer(oi, false)
                          if (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) outDone = true
                      } else if (oi == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          val nf = codec.outputFormat; sr = nf.getInteger(MediaFormat.KEY_SAMPLE_RATE); ch = nf.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      }
                  }
                  codec.stop(); codec.release(); ex.release()
                  val mono = FloatArray(total / ch); var p = 0; var k = 0
                  for (a in pcm) for (s in a) { if (k % ch == 0 && p < mono.size) { mono[p] = s / 32768f; p++ }; k++ }
                  return finish(mono, sr)
              }
          }

          /** Microphone capture at 48 kHz (always supported), reduced to 24 kHz for the model. Auto-stops at 15 s. */
          class Rec(private val onLevel: (Float) -> Unit, private val onDone: (FloatArray) -> Unit) {
              @Volatile private var run = false
              @SuppressLint("MissingPermission")
              fun start() {
                  run = true
                  Thread {
                      val sr = 48000; val min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      val ar = AudioRecord(MediaRecorder.AudioSource.MIC, sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, maxOf(min, sr))
                      val all = ArrayList<ShortArray>(); var n = 0; val buf = ShortArray(sr / 20)
                      ar.startRecording()
                      while (run && n < sr * 15) {
                          val k = ar.read(buf, 0, buf.size); if (k <= 0) continue
                          all.add(buf.copyOf(k)); n += k
                          var s = 0.0; for (i in 0 until k) s += buf[i] * buf[i].toDouble()
                          onLevel((sqrt(s / k) / 8000.0).toFloat().coerceIn(0f, 1f))
                      }
                      ar.stop(); ar.release(); run = false
                      val f = FloatArray(n); var p = 0; for (a in all) for (v in a) f[p++] = v / 32768f
                      onDone(AudioIn.finish(f, sr))
                  }.start()
              }
              fun stop() { run = false }
          }

          object Wav {
              fun save(ctx: Context, pcm: FloatArray): Uri? {
                  val v = ContentValues().apply {
                      put(MediaStore.Audio.Media.DISPLAY_NAME, "VoxClone_" + System.currentTimeMillis() + ".wav")
                      put(MediaStore.Audio.Media.MIME_TYPE, "audio/wav")
                      put(MediaStore.Audio.Media.RELATIVE_PATH, "Music/VoxClone")
                      put(MediaStore.Audio.Media.IS_PENDING, 1)
                  }
                  val u = ctx.contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, v) ?: return null
                  ctx.contentResolver.openOutputStream(u)?.use { os ->
                      val d = DataOutputStream(os); val n = pcm.size * 2
                      fun le(x: Int) { d.write(x and 255); d.write((x shr 8) and 255); d.write((x shr 16) and 255); d.write((x shr 24) and 255) }
                      d.writeBytes("RIFF"); le(36 + n); d.writeBytes("WAVEfmt "); le(16); d.write(1); d.write(0); d.write(1); d.write(0); le(24000); le(48000); d.write(2); d.write(0); d.write(16); d.write(0)
                      d.writeBytes("data"); le(n)
                      val bb = ByteBuffer.allocate(n).order(ByteOrder.LITTLE_ENDIAN)
                      for (x in pcm) bb.putShort((x.coerceIn(-1f, 1f) * 32767f).toInt().toShort())
                      d.write(bb.array()); d.flush()
                  }
                  v.clear(); v.put(MediaStore.Audio.Media.IS_PENDING, 0); ctx.contentResolver.update(u, v, null, null)
                  return u
              }
          }
