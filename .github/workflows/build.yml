                          LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(EXAMPLES.size) { i -> Chip("Example ${i + 1}", false) { vm.text = EXAMPLES[i] } } }
                      }
                      Card {
                          Label("QUALITY")
                          SliderRow("Expressiveness", vm.temp, 0.1f..1.2f, fmt = { "%.2f".format(it) }) { vm.temp = it; vm.save() }
                          SliderRow("Detail steps", vm.steps.toFloat(), 1f..10f, 8, fmt = { it.toInt().toString() }) { vm.steps = it.toInt(); vm.save() }
                          Text("More steps sound cleaner but are slower. Expressiveness adds variation; lower is steadier.", color = DIM, fontSize = 12.sp)
                      }
                      GradButton(if (vm.gen) "Stop" else "Generate", vm.text.isNotBlank()) { vm.speak() }
                      AnimatedVisibility(vm.gen || vm.out != null, enter = fadeIn() + expandVertically(spring(0.8f, 300f)), exit = fadeOut() + shrinkVertically()) {
                          Card {
                              val sec = vm.frames * 0.08f
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(Modifier.size(10.dp).graphicsLayer { alpha = if (vm.gen) pulse else 1f }.background(if (vm.gen) A2 else DIM, CircleShape))
                                  Text(if (vm.gen) "  Generating..." else "  Done", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.SemiBold, modifier = Modifier.weight(1f))
                                  val rtf = if (vm.wall > 0.2f) sec / vm.wall else 0f
                                  Text("${"%.1f".format(sec)}s audio  |  ${"%.2f".format(rtf)}x realtime", color = A2, fontSize = 12.sp)
                              }
                              val o = vm.out
                              if (o != null) {
                                  val bars = remember(o) { val n = 56; val step = maxOf(o.size / n, 1); List(n) { i -> var m = 0f; for (k in i * step until minOf((i + 1) * step, o.size)) m = maxOf(m, kotlin.math.abs(o[k])); m } }
                                  Bars(bars)
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { Pill("Play", true) { vm.play() }; Pill("Stop") { vm.stopPlay() }; Pill("Save WAV") { vm.exportWav(false) }; Pill("Share") { vm.exportWav(true) } }
                              }
                              if (vm.status.isNotEmpty()) Text(vm.status, color = DIM, fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          @Composable fun VoicesTab(vm: Vm) {
              val ctx = LocalContext.current
              var showConsent by remember { mutableStateOf(false) }; var after by remember { mutableStateOf(0) }; var name by remember { mutableStateOf("") }
              val permit = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { if (it) vm.startRec() }
              val pick = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { u -> if (u != null) vm.importAudio(u) }
              fun go(kind: Int) { if (!vm.consent) { after = kind; showConsent = true; return }
                  if (kind == 0) { if (ctx.checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) vm.startRec() else permit.launch(Manifest.permission.RECORD_AUDIO) } else pick.launch("audio/*") }
              val ring by rememberInfiniteTransition(label = "r").animateFloat(initialValue = 1f, targetValue = 1.35f, animationSpec = infiniteRepeatable(tween(800), RepeatMode.Reverse), label = "rr")
              Box(Modifier.fillMaxSize()) {
                  Page {
                      Header("Voices", "Teach the app a voice in seconds")
                      Card {
                          if (vm.recording) {
                              Text("Read this out loud, clearly:", color = DIM, fontSize = 13.sp)
                              Text(PROMPT, color = Color.White, fontSize = 17.sp)
                              Bars(vm.levels, h = 64.dp)
                              Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                                  Box(Modifier.size(84.dp).graphicsLayer { scaleX = ring; scaleY = ring; alpha = 0.35f }.background(GRAD, CircleShape))
                                  Box(Modifier.size(84.dp).pressable(0.92f) { vm.stopRec() }.clip(CircleShape).background(GRAD), contentAlignment = Alignment.Center) { Box(Modifier.size(26.dp).background(INK, RoundedCornerShape(6.dp))) }
                              }
                              Text("Tap to stop (auto-stops at 15 s)", color = DIM, fontSize = 12.sp, modifier = Modifier.align(Alignment.CenterHorizontally))
                          } else if (vm.pending != null) {
                              Text("Got ${"%.1f".format(vm.pending!!.size / 24000f)} seconds. Name this voice:", color = Color.White, fontSize = 15.sp)
                              Box(Modifier.fillMaxWidth().clip(RoundedCornerShape(14.dp)).background(BG).padding(14.dp)) {
                                  if (name.isEmpty()) Text("My voice", color = DIM)
                                  BasicTextField(name, { name = it }, singleLine = true, textStyle = TextStyle(color = Color.White, fontSize = 16.sp), cursorBrush = SolidColor(A2), modifier = Modifier.fillMaxWidth())
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { Pill("Save voice", true) { vm.addVoice(name); name = "" }; Pill("Discard") { vm.pending = null } }
                          } else {
                              Text("Add a voice", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                              Text("Best results: 8 to 15 seconds, one speaker, quiet room, no music. Only use your own voice, or someone who clearly agreed.", color = DIM, fontSize = 13.sp)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { Pill("Record", true) { go(0) }; Pill("Import file") { go(1) } }
                          }
                          if (vm.status.isNotEmpty()) Text(vm.status, color = A2, fontSize = 13.sp)
                      }
                      Label("SAVED VOICES")
                      if (vm.voices.isEmpty()) Text("Nothing yet.", color = DIM, fontSize = 14.sp)
                      vm.voices.forEach { v ->
                          Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(20.dp)).background(CARD).border(1.dp, if (v.id == vm.sel) A2 else EDGE, RoundedCornerShape(20.dp)).padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Box(Modifier.size(44.dp).background(GRAD, CircleShape), contentAlignment = Alignment.Center) { Text(v.name.take(1).uppercase(), color = INK, fontWeight = FontWeight.Bold, fontSize = 18.sp) }
                              Column(Modifier.weight(1f).padding(start = 12.dp)) { Text(v.name, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.SemiBold); Text("${"%.1f".format(v.sec)} s sample", color = DIM, fontSize = 12.sp) }
                              Pill(if (v.id == vm.sel) "Selected" else "Use") { vm.sel = v.id }
                              Spacer(Modifier.width(8.dp)); Pill("Delete") { vm.delete(v.id) }
                          }
                      }
                  }
                  AnimatedVisibility(showConsent, Modifier.fillMaxSize(), enter = fadeIn(), exit = fadeOut()) {
                      Box(Modifier.fillMaxSize().background(Color(0xCC000000)), contentAlignment = Alignment.Center) {
                          Card(Modifier.padding(24.dp)) {
                              Text("Before you clone a voice", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                              Text("Only clone your own voice, or a voice whose owner has clearly agreed. Do not use it to impersonate, deceive or defraud anyone, and do not present generated speech as a real recording. This is also a condition of the model's license.", color = DIM, fontSize = 14.sp)
                              GradButton("I understand and agree") { vm.consent = true; vm.save(); showConsent = false; go(after) }
                              Pill("Cancel") { showConsent = false }
                          }
                      }
                  }
              }
          }

          @Composable fun EngineTab(vm: Vm) {
              Page {
                  Header("Engine", "Pocket TTS, running 100% offline")
                  Card {
                      Label("MODEL PRECISION")
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { Chip("INT8 (fast, 200 MB)", vm.int8) { vm.setPrecision(true) }; Chip("FP32 (best, 475 MB)", !vm.int8) { vm.setPrecision(false) } }
                      val st = if (vm.engineReady) "Ready" else if (vm.downloaded) "Installed" else "Not installed"
                      Text("Status: $st", color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.SemiBold)
                      AnimatedVisibility(vm.busy && !vm.downloaded) {
                          Column { Text("${vm.dlName}  ${(vm.dlP * 100).toInt()}%", color = DIM, fontSize = 12.sp)
                              Box(Modifier.fillMaxWidth().height(6.dp).clip(CircleShape).background(EDGE)) { Box(Modifier.fillMaxWidth(vm.dlP).fillMaxHeight().background(GRAD)) } }
                      }
                      if (vm.status.isNotEmpty()) Text(vm.status, color = A2, fontSize = 13.sp)
                      if (!vm.downloaded) GradButton(if (vm.busy) "Downloading..." else "Download engine", !vm.busy) { vm.download() }
                  }
                  Card {
                      Label("PERFORMANCE")
                      SliderRow("CPU threads", vm.threads.toFloat(), 1f..8f, 6, fmt = { it.toInt().toString() }) { vm.applyThreads(it.toInt()) }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) { Text("Play while generating", color = Color.White, fontSize = 14.sp); Text("Off = wait until finished, never stutters", color = DIM, fontSize = 12.sp) }
                          Chip(if (vm.live) "Live" else "After", vm.live) { vm.live = !vm.live; vm.save() }
                      }
                  }
                  Card {
                      Label("ABOUT")
                      Text("Pocket TTS by Kyutai (CC BY 4.0), ONNX export by Ryan2025A, run with ONNX Runtime on your CPU. English only. Cloning needs only a few seconds of reference audio and nothing leaves your phone.", color = DIM, fontSize = 13.sp)
                      Text("Prohibited: cloning someone without their explicit consent, impersonation, fraud or misleading people with generated speech.", color = DIM, fontSize = 13.sp)
                  }
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon --stacktrace
        env:
          VC: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: VoxClone-debug, path: app/build/outputs/apk/debug/*.apk }
