          class Vm(private val app: Context) {
              private val prefs = app.getSharedPreferences("vox", 0)
              var tab by mutableIntStateOf(0)
              val voices = mutableStateListOf<Voice>()
              var sel by mutableStateOf<String?>(null)
              var int8 by mutableStateOf(prefs.getBoolean("int8", true))
              var consent by mutableStateOf(prefs.getBoolean("consent", false))
              var temp by mutableFloatStateOf(prefs.getFloat("temp", 0.7f))
              var steps by mutableIntStateOf(prefs.getInt("steps", 4))
              var live by mutableStateOf(prefs.getBoolean("live", true))
              var threads by mutableIntStateOf(prefs.getInt("threads", 4))
              var text by mutableStateOf("")
              var downloaded by mutableStateOf(Models.ready(app, prefs.getBoolean("int8", true)))
              var engineReady by mutableStateOf(false)
              var busy by mutableStateOf(false)
              var status by mutableStateOf("")
              var dlName by mutableStateOf(""); var dlP by mutableFloatStateOf(0f)
              var gen by mutableStateOf(false); var frames by mutableIntStateOf(0); var wall by mutableFloatStateOf(0f)
              var out by mutableStateOf<FloatArray?>(null)
              var pending by mutableStateOf<FloatArray?>(null)
              var recording by mutableStateOf(false)
              val levels = mutableStateListOf<Float>()
              @Volatile var cancel = false
              private var engine: Engine? = null
              private var sink: Sink? = null
              private var rec: Rec? = null

              init { refresh(); if (downloaded) loadEngine() }
              fun save() { prefs.edit().putBoolean("int8", int8).putBoolean("consent", consent).putFloat("temp", temp).putInt("steps", steps).putBoolean("live", live).putInt("threads", threads).apply() }
              fun refresh() { voices.clear(); voices.addAll(Store.list(app)); if (sel == null || voices.none { it.id == sel }) sel = voices.firstOrNull()?.id }

              fun setPrecision(v: Boolean) {
                  if (v == int8) return
                  int8 = v; save(); engineReady = false; engine?.close(); engine = null
                  downloaded = Models.ready(app, v); if (downloaded) loadEngine()
              }
              fun download() {
                  if (busy) return; busy = true; status = "Downloading voice engine..."
                  Thread {
                      try { Models.download(app, int8) { n, p -> dlName = n; dlP = p }; downloaded = true; busy = false; loadEngine() }
                      catch (e: Throwable) { status = "Download failed: ${e.message?.take(80)}"; busy = false }
                  }.start()
              }
              fun loadEngine() {
                  busy = true; status = "Loading models..."
                  Thread {
                      try { engine?.close(); engine = Engine(app, int8, threads); engineReady = true; status = "Engine ready" }
                      catch (e: Throwable) { status = "Load failed: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }
              fun applyThreads(n: Int) { threads = n; save(); if (downloaded && !gen) loadEngine() }

              fun startRec() {
                  levels.clear(); recording = true
                  rec = Rec({ l -> levels.add(l); if (levels.size > 56) levels.removeAt(0) }) { pcm -> recording = false; pending = pcm }
                  rec!!.start()
              }
              fun stopRec() { rec?.stop() }
              fun importAudio(uri: Uri) {
                  status = "Reading audio..."
                  Thread { try { pending = AudioIn.decode(app, uri); status = "" } catch (e: Throwable) { status = "Could not read audio: ${e.message?.take(80)}" } }.start()
              }
              fun addVoice(name: String) {
                  val pcm = pending ?: return; val e = engine ?: run { status = "Load the engine first (Engine tab)"; return }
                  busy = true; status = "Learning your voice..."
                  Thread {
                      try {
                          val d = e.encodeVoice(UUID.randomUUID().toString().take(8), pcm)
                          Store.save(app, name.ifBlank { "My voice" }, pcm.size / 24000f, d)
                          pending = null; refresh(); sel = d.id; status = "Voice saved"
                      } catch (x: Throwable) { status = "Failed: ${x.message?.take(100)}" }
                      busy = false
                  }.start()
              }
              fun delete(id: String) { Store.delete(app, id); refresh() }

              fun speak() {
                  val e = engine ?: return; val id = sel ?: return
                  if (gen) { cancel = true; return }
                  if (text.isBlank()) return
                  gen = true; cancel = false; frames = 0; wall = 0f; out = null; sink?.stop()
                  val s = Sink(live); sink = s; val t0 = System.nanoTime()
                  Thread {
                      try {
                          val v = Store.load(app, id)
                          e.speak(v, text, temp, steps, { cancel }, { s.put(it) }) { n -> frames = n; wall = (System.nanoTime() - t0) / 1e9f }
                          s.finish(); out = s.merged(); status = ""
                      } catch (x: Throwable) { status = "Generation failed: ${x.message?.take(120)}" }
                      wall = (System.nanoTime() - t0) / 1e9f; gen = false
                  }.start()
              }
              fun play() { val a = out ?: return; sink?.stop(); val s = Sink(true); sink = s; Thread { s.put(a); s.finish() }.start() }
              fun stopPlay() { sink?.stop() }
              fun exportWav(share: Boolean) {
                  val a = out ?: return
                  Thread {
                      val u = Wav.save(app, a)
                      if (u == null) status = "Save failed"
                      else if (share) app.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).setType("audio/wav").putExtra(Intent.EXTRA_STREAM, u).addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION), null).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      else status = "Saved to Music/VoxClone"
                  }.start()
              }
          }

