          cat > app/src/main/java/com/example/cineoverlay/RootFx.kt <<'EOF'
          package com.example.cineoverlay

          import java.util.concurrent.atomic.AtomicBoolean

          /** Root mode: sets SurfaceFlinger's global color matrix (what Night Light uses). Affects every pixel. */
          object RootFx {
              private val busy = AtomicBoolean(false)
              @Volatile private var mode = 0 // 1 = apply, 2 = reset

              fun applyAsync() = kick(1)
              fun resetAsync() = kick(2)

              private fun kick(m: Int) {
                  mode = m
                  if (busy.compareAndSet(false, true)) {
                      Thread {
                          var last = 0
                          while (mode != last) { last = mode; if (last == 1) apply() else reset() }
                          busy.set(false)
                      }.start()
                  }
              }

              private fun apply(): Boolean {
                  val s = Fx.i("rt_sat") / 100f
                  val c = Fx.i("rt_contrast") / 100f
                  val w = Fx.i("rt_warm") / 100f
                  val l = floatArrayOf(0.213f, 0.715f, 0.072f)
                  val gain = floatArrayOf(1f + 0.12f * w, 1f, 1f - 0.18f * w)
                  val m = Array(3) { FloatArray(3) }
                  for (r in 0..2) for (k in 0..2)
                      m[r][k] = (l[k] * (1 - s) + (if (r == k) s else 0f)) * c * gain[r]
                  val off = FloatArray(3) { (1 - c) / 2f * gain[it] }
                  val f = floatArrayOf(
                      m[0][0], m[1][0], m[2][0], 0f,
                      m[0][1], m[1][1], m[2][1], 0f,
                      m[0][2], m[1][2], m[2][2], 0f,
                      off[0], off[1], off[2], 1f)
                  return su("service call SurfaceFlinger 1015 i32 1 " + f.joinToString(" ") { "f $it" })
              }

              private fun reset() = su("service call SurfaceFlinger 1015 i32 0")

              private fun su(cmd: String): Boolean = try {
                  Runtime.getRuntime().exec(arrayOf("su", "-c", cmd)).waitFor() == 0
              } catch (e: Exception) { false }
          }
