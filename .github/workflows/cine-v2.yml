          cat > app/src/main/java/com/example/cineoverlay/MainActivity.kt <<'EOF'
          package com.example.cineoverlay

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var toggleBtn: Button
              private val gray = Color.parseColor("#9E9E9E")
              private val openSections = hashSetOf("Bokeh particles", "Bloom")

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Fx.init(this)
                  build()
              }

              override fun onResume() { super.onResume(); refreshBtn() }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun tv(t: String, size: Float, color: Int = Color.WHITE, bold: Boolean = false): TextView =
                  TextView(this).apply {
                      text = t; textSize = size; setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private fun build() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(40), dp(16), dp(32))
                  }
                  root.addView(tv("Cinematic Overlay", 24f, Color.WHITE, true))
                  root.addView(tv("Effects draw over every app. Changes apply live and are saved. Add the 'Cine overlay' tile to Quick Settings to toggle fast.", 12f, gray))

                  toggleBtn = Button(this)
                  toggleBtn.setOnClickListener { toggleService() }
                  root.addView(toggleBtn)

                  root.addView(tv("Presets", 16f, Color.WHITE, true).apply { setPadding(0, dp(12), 0, 0) })
                  val hs = HorizontalScrollView(this)
                  val row = LinearLayout(this)
                  for (name in Fx.presets.keys) {
                      val btn = Button(this)
                      btn.text = name; btn.isAllCaps = false
                      btn.setOnClickListener {
                          Fx.applyPreset(name)
                          if (Fx.i("rt_on") == 1) RootFx.applyAsync()
                          build()
                      }
                      row.addView(btn)
                  }
                  hs.addView(row)
                  root.addView(hs)

                  for ((title, items) in Fx.sections) {
                      val body = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                      val head = tv("", 17f, Color.parseColor("#80CBC4"), true)
                      head.setPadding(0, dp(22), 0, dp(4))
                      fun label() { head.text = (if (openSections.contains(title)) "▾  " else "▸  ") + title }
                      label()
                      body.visibility = if (openSections.contains(title)) View.VISIBLE else View.GONE
                      head.setOnClickListener {
                          if (openSections.contains(title)) openSections.remove(title) else openSections.add(title)
                          body.visibility = if (openSections.contains(title)) View.VISIBLE else View.GONE
                          label()
                      }
                      for (s in items) when (s) {
                          is Sl -> slider(body, s)
                          is Tg -> toggle(body, s)
                          is Ch -> choice(body, s)
                      }
                      root.addView(head)
                      root.addView(body)
                  }
                  setContentView(ScrollView(this).apply { addView(root) })
                  refreshBtn()
              }

              private fun slider(parent: LinearLayout, s: Sl) {
                  val lbl = tv("", 14f)
                  lbl.setPadding(0, dp(14), 0, 0)
                  lbl.text = "${s.title}: ${Fx.i(s.key)}${s.unit}"
                  parent.addView(lbl)
                  parent.addView(tv(s.desc, 11.5f, gray))
                  val sb = SeekBar(this)
                  sb.max = s.max - s.min
                  sb.progress = Fx.i(s.key) - s.min
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          if (!fromUser) return
                          val v = p + s.min
                          Fx.set(s.key, v)
                          lbl.text = "${s.title}: $v${s.unit}"
                          changed(s.key)
                      }
                      override fun onStartTrackingTouch(bar: SeekBar?) {}
                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  })
                  parent.addView(sb)
              }

              private fun toggle(parent: LinearLayout, s: Tg) {
                  val sw = Switch(this)
                  sw.text = s.title
                  sw.setTextColor(Color.WHITE)
                  sw.isChecked = Fx.i(s.key) == 1
                  sw.setPadding(0, dp(14), 0, 0)
                  sw.setOnCheckedChangeListener { _, on -> Fx.set(s.key, if (on) 1 else 0); changed(s.key) }
                  parent.addView(sw)
                  parent.addView(tv(s.desc, 11.5f, gray))
              }

              private fun choice(parent: LinearLayout, s: Ch) {
                  val lbl = tv(s.title, 14f)
                  lbl.setPadding(0, dp(14), 0, 0)
                  parent.addView(lbl)
                  parent.addView(tv(s.desc, 11.5f, gray))
                  val sp = Spinner(this)
                  sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, s.options)
                  sp.setSelection(Fx.i(s.key))
                  sp.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(a: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          if (pos != Fx.i(s.key)) { Fx.set(s.key, pos); changed(s.key) }
                      }
                      override fun onNothingSelected(a: AdapterView<*>?) {}
                  }
                  parent.addView(sp)
              }

              private fun changed(key: String) {
                  if (key == "rt_on") { if (Fx.i("rt_on") == 1) RootFx.applyAsync() else RootFx.resetAsync() }
                  else if (key.startsWith("rt_") && Fx.i("rt_on") == 1) RootFx.applyAsync()
              }

              private fun refreshBtn() {
                  if (!::toggleBtn.isInitialized) return
                  toggleBtn.text = if (FxService.running) "Stop overlay" else "Start overlay"
              }

              private fun toggleService() {
                  val i = Intent(this, FxService::class.java)
                  if (FxService.running) {
                      stopService(i)
                  } else {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          return
                      }
                      if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                      startForegroundService(i)
                  }
                  toggleBtn.postDelayed({ refreshBtn() }, 500)
              }
          }
