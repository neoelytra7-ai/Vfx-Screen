          package com.example.cineoverlay

          import android.content.Intent
          import android.provider.Settings
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class FxTile : TileService() {
              override fun onStartListening() { paint(FxService.running) }

              override fun onClick() {
                  val was = FxService.running
                  try {
                      if (was) stopService(Intent(this, FxService::class.java))
                      else if (Settings.canDrawOverlays(this)) startForegroundService(Intent(this, FxService::class.java))
                      else { openApp(); return }
                      paint(!was)
                  } catch (e: Exception) { openApp() }
              }

              @Suppress("DEPRECATION")
              private fun openApp() {
                  startActivityAndCollapse(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }

              private fun paint(on: Boolean) {
                  qsTile?.let { it.state = if (on) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE; it.updateTile() }
              }
          }
