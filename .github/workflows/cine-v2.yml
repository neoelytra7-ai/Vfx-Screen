name: Build APK v2
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/cineoverlay
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CineOverlay"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.cineoverlay"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.cineoverlay"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="CineOverlay" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FxService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Screen overlay visual effects"/>
                  </service>
                  <service android:name=".FxTile" android:exported="true"
                      android:label="Cine overlay"
                      android:icon="@android:drawable/ic_menu_view"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/cineoverlay/Fx.kt <<'EOF'
          package com.example.cineoverlay

          import android.content.Context
          import android.content.SharedPreferences

          sealed class S(val key: String, val title: String, val desc: String, val def: Int)
          class Sl(key: String, title: String, desc: String, def: Int, val min: Int, val max: Int, val unit: String = "") : S(key, title, desc, def)
          class Tg(key: String, title: String, desc: String, def: Boolean) : S(key, title, desc, if (def) 1 else 0)
          class Ch(key: String, title: String, desc: String, def: Int, val options: List<String>) : S(key, title, desc, def)

          object Fx {
              val sections: List<Pair<String, List<S>>> = listOf(
                  "Bokeh particles" to listOf<S>(
                      Tg("p_on", "Floating particles", "Master switch for the bokeh light particles.", true),
                      Sl("p_count", "Particle count", "How many lights float on screen. More looks richer but uses more battery.", 60, 0, 300),
                      Sl("p_size_min", "Smallest size", "Radius of the smallest particles.", 10, 3, 80, " dp"),
                      Sl("p_size_max", "Largest size", "Radius of the biggest particles. Sizes are randomly picked between smallest and largest.", 36, 6, 160, " dp"),
                      Sl("p_depth_spread", "Depth spread", "How far apart particles sit in depth. 0 puts everything on one plane, 100 uses the full range.", 100, 0, 100, "%"),
                      Sl("p_focus", "Focus depth", "Which depth is in sharp focus. 0 = nearest, 100 = farthest. Everything else melts into soft bokeh.", 50, 0, 100),
                      Sl("p_dof", "Depth of field", "How fast particles blur away from the focus depth. High = shallow focus like a wide-open lens.", 60, 0, 100),
                      Sl("p_dof_size", "Defocus size growth", "Out-of-focus particles swell in size like real lens bokeh.", 80, 0, 200, "%"),
                      Ch("p_shape", "Aperture shape", "Shape of blurry bokeh discs. Hexagon mimics a real camera aperture.", 2, listOf("Circle", "Pentagon", "Hexagon", "Heptagon", "Octagon")),
                      Sl("p_ring", "Bokeh ring", "Bright rim on blurry discs, the classic 'soap bubble' lens look.", 55, 0, 100, "%"),
                      Sl("p_fill", "Disc fill", "Brightness of a blurry disc's interior compared to its edge. Low = hollow rings.", 35, 0, 100, "%"),
                      Sl("p_opacity", "Overall opacity", "Master transparency of all particles.", 70, 5, 100, "%"),
                      Sl("p_bright_var", "Brightness variation", "Random difference in brightness between particles.", 50, 0, 100, "%"),
                      Sl("p_twinkle", "Twinkle amount", "How much particles slowly pulse and shimmer.", 30, 0, 100, "%"),
                      Sl("p_twinkle_speed", "Twinkle speed", "How fast the shimmer cycles.", 30, 1, 100)
                  ),
                  "Motion" to listOf<S>(
                      Sl("m_speed", "Drift speed", "How fast particles float. 0 freezes them.", 20, 0, 100),
                      Sl("m_angle", "Drift direction", "0° = right, 90° = up, 180° = left, 270° = down.", 90, 0, 360, "°"),
                      Sl("m_dir_var", "Direction randomness", "How much each particle's direction differs from the main one.", 40, 0, 180, "°"),
                      Sl("m_sway", "Sway", "Gentle side-to-side wobble while drifting.", 30, 0, 100, "%"),
                      Sl("m_sway_speed", "Sway speed", "How quickly the wobble cycles.", 30, 1, 100),
                      Sl("m_depth_speed", "Depth speed difference", "Near particles move faster than far ones (parallax motion).", 60, 0, 100, "%"),
                      Sl("m_parallax", "Tilt parallax", "Particles shift when you move or tilt the phone; near ones move more. Uses the accelerometer. 0 = off and saves battery.", 50, 0, 100, "%")
                  ),
                  "Particle color" to listOf<S>(
                      Ch("c_mode", "Color mode", "Palette used for the particles.", 1, listOf("Warm white", "Golden", "Teal & orange", "Pastel rainbow", "Cool blue", "Custom hue")),
                      Sl("c_hue", "Custom hue", "Only used when Color mode is 'Custom hue'. 0 red, 120 green, 240 blue.", 40, 0, 360, "°"),
                      Sl("c_sat", "Saturation", "Color strength. 0 = pure white lights.", 60, 0, 100, "%"),
                      Sl("c_hue_var", "Hue variation", "Random color drift between particles.", 20, 0, 100, "%")
                  ),
                  "Bloom" to listOf<S>(
                      Tg("b_on", "Bloom", "Master switch for all glow effects (particle glow, haze, leaks, streaks).", true),
                      Sl("b_glow", "Particle glow", "Soft halo around every particle.", 50, 0, 100, "%"),
                      Sl("b_glow_size", "Glow radius", "How far the halo spreads, relative to the particle.", 180, 50, 400, "%"),
                      Sl("b_haze", "Bloom haze", "A soft light veil over the screen that lifts blacks and makes everything feel hazy and glowing.", 20, 0, 100, "%"),
                      Sl("b_haze_temp", "Haze warmth", "0 = cool blue haze, 100 = warm amber haze.", 60, 0, 100),
                      Sl("b_leaks", "Light leaks", "Slow drifting colored glows near the edges, like film light leaks.", 25, 0, 100, "%"),
                      Sl("b_leak_speed", "Leak speed", "How fast the light leaks wander.", 20, 0, 100),
                      Sl("b_streak", "Anamorphic streaks", "Horizontal blue light streaks on bright, in-focus particles, like cinema lenses.", 25, 0, 100, "%"),
                      Sl("b_streak_len", "Streak length", "How long the streaks stretch.", 200, 50, 400, "%")
                  ),
                  "Cinematic look" to listOf<S>(
                      Sl("fx_vig", "Vignette", "Darkens the screen corners.", 45, 0, 100, "%"),
                      Sl("fx_vig_start", "Vignette start", "How far from the center the darkening begins. Lower = bigger vignette.", 55, 20, 90, "%"),
                      Sl("fx_grain", "Film grain", "Animated film noise.", 20, 0, 100, "%"),
                      Sl("fx_grain_size", "Grain size", "Size of each grain speck in pixels.", 2, 1, 6, " px"),
                      Sl("fx_grade", "Teal & orange grade", "Cinematic tint: teal in the top, orange in the bottom.", 25, 0, 100, "%"),
                      Sl("fx_grade_mid", "Grade split point", "Where the teal fades out and the orange fades in. Moves the neutral zone up or down.", 50, 10, 90, "%"),
                      Sl("fx_fringe", "Chromatic fringe", "Red and cyan color fringing on screen edges, like cheap lens aberration.", 30, 0, 100, "%"),
                      Sl("fx_fringe_start", "Fringe start", "How far from the center the fringing begins.", 70, 30, 90, "%"),
                      Sl("fx_letterbox", "Letterbox bars", "Black cinema bars on top and bottom, as a percent of screen height.", 0, 0, 30, "%"),
                      Sl("fx_scan", "Scanlines", "Retro CRT line pattern.", 0, 0, 100, "%"),
                      Sl("fx_scan_gap", "Scanline spacing", "Distance between scanlines.", 4, 2, 12, " dp"),
                      Sl("fx_flicker", "Film flicker", "Subtle random brightness flicker, like an old projector.", 0, 0, 100, "%")
                  ),
                  "Performance" to listOf<S>(
                      Sl("pf_fps", "Frame rate limit", "Lower saves battery. 30 is smooth enough for slow bokeh.", 30, 10, 60, " fps"),
                      Tg("pf_pause_off", "Pause when screen is off", "Stops all drawing while the display is off.", true),
                      Tg("pf_batt", "Low battery saver", "Drops to 15 fps when the battery is under 20% and not charging.", true),
                      Ch("pf_quality", "Particle sprite quality", "Resolution of the particle textures. Higher is crisper when huge, but uses more memory.", 1, listOf("Low (96px)", "Medium (128px)", "High (192px)"))
                  ),
                  "Root color grade" to listOf<S>(
                      Tg("rt_on", "Root color grade", "Changes the real color of every pixel on screen through SurfaceFlinger. Needs root. Works on top of the overlay effects.", false),
                      Sl("rt_sat", "Saturation", "100 = normal.", 115, 0, 200, "%"),
                      Sl("rt_contrast", "Contrast", "100 = normal.", 110, 50, 150, "%"),
                      Sl("rt_warm", "Warmth", "Negative = cooler, positive = warmer.", 20, -100, 100)
                  )
              )

              val presets: LinkedHashMap<String, Map<String, Int>> = linkedMapOf(
                  "Default" to emptyMap<String, Int>(),
                  "Dreamy bokeh" to mapOf("c_mode" to 3, "p_count" to 90, "p_size_max" to 60, "p_dof" to 80, "p_ring" to 40, "b_haze" to 35, "b_glow" to 70, "fx_vig" to 35, "fx_grain" to 10, "fx_grade" to 15),
                  "Cinematic night" to mapOf("c_mode" to 2, "p_count" to 45, "fx_grade" to 45, "fx_vig" to 60, "fx_grain" to 30, "b_streak" to 50, "fx_letterbox" to 8, "fx_fringe" to 40, "b_haze" to 15, "m_speed" to 12),
                  "Fireflies" to mapOf("c_mode" to 1, "p_count" to 35, "p_size_min" to 5, "p_size_max" to 18, "m_speed" to 10, "m_sway" to 60, "p_shape" to 0, "p_dof" to 30, "b_glow" to 95, "p_ring" to 0, "b_haze" to 5, "fx_vig" to 30, "fx_grain" to 0, "fx_fringe" to 0, "fx_grade" to 0, "p_twinkle" to 70),
                  "Subtle" to mapOf("p_count" to 25, "p_opacity" to 45, "b_haze" to 8, "b_glow" to 30, "b_streak" to 0, "b_leaks" to 0, "fx_vig" to 25, "fx_grain" to 10, "fx_grade" to 10, "fx_fringe" to 15),
                  "All off" to mapOf("p_on" to 0, "b_on" to 0, "fx_vig" to 0, "fx_grain" to 0, "fx_grade" to 0, "fx_fringe" to 0, "fx_letterbox" to 0, "fx_scan" to 0, "fx_flicker" to 0)
              )

              private val defs: Map<String, Int> = sections.flatMap { it.second }.associate { it.key to it.def }
              private val map = HashMap<String, Int>()
              private var prefs: SharedPreferences? = null
              @Volatile var version = 0

              fun init(c: Context) {
                  if (prefs != null) return
                  val p = c.applicationContext.getSharedPreferences("fx", Context.MODE_PRIVATE)
                  prefs = p
                  for (k in defs.keys) if (p.contains(k)) map[k] = p.getInt(k, 0)
                  version++
              }

              fun i(k: String): Int = map[k] ?: defs[k] ?: 0

              fun set(k: String, v: Int) {
                  map[k] = v
                  prefs?.edit()?.putInt(k, v)?.apply()
                  version++
              }

              fun applyPreset(name: String) {
                  map.clear()
                  val e = prefs?.edit()
                  e?.clear()
                  presets[name]?.forEach { (k, v) -> map[k] = v; e?.putInt(k, v) }
                  e?.apply()
                  version++
              }
          }
          EOF
          cat > app/src/main/java/com/example/cineoverlay/FxView.kt <<'EOF'
          package com.example.cineoverlay

          import android.content.*
          import android.graphics.*
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.BatteryManager
          import android.os.Build
          import android.view.View
          import kotlin.math.*
          import kotlin.random.Random

          class FxView(ctx: Context) : View(ctx), SensorEventListener {
              private companion object { const val LEVELS = 8; const val MAXP = 300 }

              private class P {
                  var x = Random.nextFloat(); var y = Random.nextFloat()
                  val d = Random.nextFloat(); val r = Random.nextFloat()
                  var ph = Random.nextFloat() * 6.28f; var ph2 = Random.nextFloat() * 6.28f
                  val hue = Random.nextFloat(); val br = Random.nextFloat()
                  val ang = Random.nextFloat() * 2f - 1f; val spd = 0.7f + Random.nextFloat() * 0.6f
                  var filter: ColorFilter? = null
              }

              private val dp = ctx.resources.displayMetrics.density
              private val ps = Array(MAXP) { P() }
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val sp = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val dst = RectF()
              private val streakFilter = PorterDuffColorFilter(Color.rgb(127, 176, 255), PorterDuff.Mode.SRC_IN)

              private var sprites: Array<Bitmap>? = null
              private var glow: Bitmap? = null
              private var spriteKey = ""
              private var cacheVer = -1; private var cw = 0; private var ch = 0
              private var gradeSh: Shader? = null; private var vigSh: Shader? = null
              private var fringeR: Shader? = null; private var fringeC: Shader? = null
              private var scanSh: Shader? = null; private var hazeSh: Shader? = null
              private val leakSh = arrayOfNulls<Shader>(3)
              private var gpts = FloatArray(0)

              private var t = 0f; private var chk = 0f; private var last = 0L
              private var tiltX = 0f; private var tiltY = 0f
              private var fastX = 0f; private var fastY = 0f; private var slowX = 0f; private var slowY = 0f
              private var sInit = false; private var sensorOn = false
              private var attached = false; private var paused = false; private var battLow = false
              private val sm = ctx.getSystemService(Context.SENSOR_SERVICE) as SensorManager

              private val rcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (i?.action == Intent.ACTION_SCREEN_OFF) {
                          if (Fx.i("pf_pause_off") == 1) { paused = true; removeCallbacks(tick); syncSensor() }
                      } else if (i?.action == Intent.ACTION_SCREEN_ON) {
                          if (paused) { paused = false; last = 0L; removeCallbacks(tick); post(tick); syncSensor() }
                      }
                  }
              }

              private val tick = object : Runnable {
                  override fun run() {
                      if (!attached || paused) return
                      val now = System.nanoTime()
                      val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.1f)
                      last = now
                      step(dt)
                      invalidate()
                      postDelayed(this, (1000L / effFps()).coerceAtLeast(8L))
                  }
              }

              private fun effFps(): Int {
                  val f = Fx.i("pf_fps").coerceIn(5, 60)
                  return if (Fx.i("pf_batt") == 1 && battLow) min(15, f) else f
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  attached = true
                  val f = IntentFilter(Intent.ACTION_SCREEN_OFF).apply { addAction(Intent.ACTION_SCREEN_ON) }
                  if (Build.VERSION.SDK_INT >= 33) context.registerReceiver(rcv, f, Context.RECEIVER_NOT_EXPORTED)
                  else context.registerReceiver(rcv, f)
                  readBattery(); syncSensor()
                  post(tick)
              }

              override fun onDetachedFromWindow() {
                  attached = false
                  removeCallbacks(tick)
                  try { context.unregisterReceiver(rcv) } catch (e: Exception) {}
                  if (sensorOn) { sm.unregisterListener(this); sensorOn = false }
                  super.onDetachedFromWindow()
              }

              private fun readBattery() {
                  val i = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED)) ?: return
                  val lv = i.getIntExtra(BatteryManager.EXTRA_LEVEL, 100) * 100 / max(1, i.getIntExtra(BatteryManager.EXTRA_SCALE, 100))
                  val st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                  battLow = lv < 20 && st != BatteryManager.BATTERY_STATUS_CHARGING && st != BatteryManager.BATTERY_STATUS_FULL
              }

              private fun syncSensor() {
                  val want = Fx.i("m_parallax") > 0 && Fx.i("p_on") == 1 && !paused && attached
                  if (want && !sensorOn) {
                      sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let {
                          sm.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME); sensorOn = true
                      }
                  } else if (!want && sensorOn) {
                      sm.unregisterListener(this); sensorOn = false; tiltX = 0f; tiltY = 0f; sInit = false
                  }
              }

              override fun onSensorChanged(e: SensorEvent) {
                  val x = (-e.values[0] / 9.81f).coerceIn(-1f, 1f)
                  val y = (e.values[1] / 9.81f).coerceIn(-1f, 1f)
                  if (!sInit) { fastX = x; slowX = x; fastY = y; slowY = y; sInit = true }
                  fastX += (x - fastX) * 0.15f; slowX += (x - slowX) * 0.01f
                  fastY += (y - fastY) * 0.15f; slowY += (y - slowY) * 0.01f
                  tiltX = fastX - slowX; tiltY = fastY - slowY
              }
              override fun onAccuracyChanged(s: Sensor?, a: Int) {}

              // ---------------- simulation ----------------
              private fun step(dt: Float) {
                  t += dt; chk += dt
                  if (chk > 1f) { chk = 0f; syncSensor(); readBattery() }
                  if (Fx.i("p_on") == 0 || width == 0) return
                  val w = width.toFloat(); val h = height.toFloat()
                  val cnt = Fx.i("p_count").coerceIn(0, MAXP)
                  val spd = Fx.i("m_speed") / 100f * 0.15f
                  val ang = Fx.i("m_angle").toFloat()
                  val dv = Fx.i("m_dir_var").toFloat()
                  val ds = Fx.i("m_depth_speed") / 100f
                  val sf = 0.3f + Fx.i("m_sway_speed") / 100f * 2f
                  val tf = 0.3f + Fx.i("p_twinkle_speed") / 100f * 4f
                  val m = 0.12f
                  for (k in 0 until cnt) {
                      val p = ps[k]
                      val pers = 1f + ds * (0.5f - p.d)
                      val a = Math.toRadians((ang + p.ang * dv).toDouble())
                      val v = spd * pers * p.spd * dt
                      p.x += (cos(a) * v * (h / w)).toFloat()
                      p.y -= (sin(a) * v).toFloat()
                      p.ph += dt * sf; p.ph2 += dt * tf
                      if (p.x > 1f + m) p.x -= 1f + 2f * m else if (p.x < -m) p.x += 1f + 2f * m
                      if (p.y > 1f + m) p.y -= 1f + 2f * m else if (p.y < -m) p.y += 1f + 2f * m
                  }
              }

              // ---------------- cached resources ----------------
              private fun shapePath(sides: Int, cx: Float, cy: Float, r: Float): Path {
                  val p = Path()
                  if (sides == 0) p.addCircle(cx, cy, r, Path.Direction.CW)
                  else {
                      for (i in 0 until sides) {
                          val a = (-PI / 2 + 2 * PI * i / sides).toFloat()
                          val x = cx + r * cos(a); val y = cy + r * sin(a)
                          if (i == 0) p.moveTo(x, y) else p.lineTo(x, y)
                      }
                      p.close()
                  }
                  return p
              }

              private fun buildSprites() {
                  val sz = intArrayOf(96, 128, 192)[Fx.i("pf_quality").coerceIn(0, 2)]
                  val sides = intArrayOf(0, 5, 6, 7, 8)[Fx.i("p_shape").coerceIn(0, 4)]
                  val ring = Fx.i("p_ring") / 100f
                  val fill = Fx.i("p_fill") / 100f
                  val r0 = sz * 0.30f
                  sprites = Array(LEVELS) { l ->
                      val soft = l / (LEVELS - 1f)
                      val bmp = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888)
                      val cv = Canvas(bmp)
                      val r = r0 * (0.5f + 0.5f * soft.pow(0.6f))
                      val path = shapePath(sides, sz / 2f, sz / 2f, r)
                      val p = Paint(Paint.ANTI_ALIAS_FLAG)
                      p.color = Color.WHITE
                      p.maskFilter = BlurMaskFilter(max(0.6f, 0.6f + soft * sz * 0.07f), BlurMaskFilter.Blur.NORMAL)
                      p.style = Paint.Style.FILL
                      p.alpha = (255 * (1f - soft * (1f - fill))).toInt().coerceIn(0, 255)
                      cv.drawPath(path, p)
                      if (soft > 0.12f && ring > 0f) {
                          p.style = Paint.Style.STROKE
                          p.strokeWidth = r * (0.06f + 0.10f * ring)
                          p.alpha = (255 * ring * min(1f, soft * 2f)).toInt().coerceIn(0, 255)
                          cv.drawPath(path, p)
                      }
                      bmp
                  }
                  val g = Bitmap.createBitmap(128, 128, Bitmap.Config.ARGB_8888)
                  val gp = Paint(Paint.ANTI_ALIAS_FLAG)
                  gp.shader = RadialGradient(64f, 64f, 64f,
                      intArrayOf(0xFFFFFFFF.toInt(), 0x55FFFFFF, 0x00FFFFFF), floatArrayOf(0f, 0.3f, 1f), Shader.TileMode.CLAMP)
                  Canvas(g).drawCircle(64f, 64f, 64f, gp)
                  glow = g
              }

              private fun colorFilterFor(p: P): ColorFilter {
                  val mode = Fx.i("c_mode"); val sat0 = Fx.i("c_sat") / 100f; val hv = Fx.i("c_hue_var") / 100f
                  var hue: Float; var sat: Float
                  when (mode) {
                      0 -> { hue = 40f; sat = sat0 * 0.25f }
                      1 -> { hue = 42f; sat = sat0 }
                      2 -> { hue = if (p.hue < 0.5f) 185f else 28f; sat = sat0 }
                      3 -> { hue = p.hue * 360f; sat = sat0 * 0.75f }
                      4 -> { hue = 210f; sat = sat0 }
                      else -> { hue = Fx.i("c_hue").toFloat(); sat = sat0 }
                  }
                  hue += (p.hue - 0.5f) * hv * 120f
                  hue = ((hue % 360f) + 360f) % 360f
                  val col = Color.HSVToColor(floatArrayOf(hue, sat.coerceIn(0f, 1f), 1f))
                  return PorterDuffColorFilter(col, PorterDuff.Mode.SRC_IN)
              }

              private fun rebuild() {
                  val ver = Fx.version
                  cw = width; ch = height
                  val w = cw.toFloat(); val h = ch.toFloat()
                  val r = hypot(w / 2f, h / 2f)

                  val key = "${Fx.i("p_shape")}|${Fx.i("p_ring")}|${Fx.i("p_fill")}|${Fx.i("pf_quality")}"
                  if (key != spriteKey || sprites == null) { buildSprites(); spriteKey = key }
                  for (p in ps) p.filter = colorFilterFor(p)

                  val ga = (Fx.i("fx_grade") * 0.9f).toInt().coerceIn(0, 255)
                  val mid = Fx.i("fx_grade_mid") / 100f
                  gradeSh = LinearGradient(0f, 0f, 0f, h,
                      intArrayOf(Color.argb(ga, 0, 110, 130), Color.argb(0, 128, 128, 128), Color.argb(ga, 255, 120, 30)),
                      floatArrayOf(0f, mid, 1f), Shader.TileMode.CLAMP)

                  val va = (Fx.i("fx_vig") * 2.4f).toInt().coerceIn(0, 240)
                  vigSh = RadialGradient(w / 2f, h / 2f, r, intArrayOf(0, 0, Color.argb(va, 0, 0, 0)),
                      floatArrayOf(0f, Fx.i("fx_vig_start") / 100f, 1f), Shader.TileMode.CLAMP)

                  val fa = (Fx.i("fx_fringe") * 1.6f).toInt().coerceIn(0, 200)
                  val off = w * 0.006f * (Fx.i("fx_fringe") / 50f)
                  val fs = Fx.i("fx_fringe_start") / 100f
                  fringeR = RadialGradient(w / 2f + off, h / 2f, r, intArrayOf(0, 0, Color.argb(fa, 255, 0, 40)),
                      floatArrayOf(0f, fs, 1f), Shader.TileMode.CLAMP)
                  fringeC = RadialGradient(w / 2f - off, h / 2f, r, intArrayOf(0, 0, Color.argb(fa, 0, 220, 255)),
                      floatArrayOf(0f, fs, 1f), Shader.TileMode.CLAMP)

                  scanSh = null
                  if (Fx.i("fx_scan") > 0) {
                      val gap = (Fx.i("fx_scan_gap") * dp).toInt().coerceAtLeast(2)
                      val b = Bitmap.createBitmap(1, gap, Bitmap.Config.ARGB_8888)
                      b.setPixel(0, 0, Color.argb((Fx.i("fx_scan") * 1.2f).toInt().coerceIn(0, 255), 0, 0, 0))
                      scanSh = BitmapShader(b, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                  }

                  val tmp = Fx.i("b_haze_temp") / 100f
                  val hc = Color.rgb((120 + 135 * tmp).toInt(), (170 + 20 * tmp).toInt(), (255 - 135 * tmp).toInt())
                  hazeSh = RadialGradient(w / 2f, h * 0.35f, w * 0.95f, hc, hc and 0x00FFFFFF, Shader.TileMode.CLAMP)

                  val lc = intArrayOf(Color.rgb(255, 120, 40), Color.rgb(255, 60, 140), Color.rgb(40, 180, 200))
                  for (i in 0..2) leakSh[i] = RadialGradient(0f, 0f, w * 0.75f, lc[i], lc[i] and 0x00FFFFFF, Shader.TileMode.CLAMP)

                  cacheVer = ver
              }

              // ---------------- drawing ----------------
              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (w == 0f) return
                  if (cacheVer != Fx.version || width != cw || height != ch) rebuild()

                  if (Fx.i("fx_grade") > 0) fillShader(c, gradeSh, w, h)
                  if (Fx.i("b_on") == 1) drawBloom(c, w, h)
                  if (Fx.i("p_on") == 1) drawParticles(c, w, h)
                  if (Fx.i("fx_fringe") > 0) { fillShader(c, fringeR, w, h); fillShader(c, fringeC, w, h) }
                  if (Fx.i("fx_vig") > 0) fillShader(c, vigSh, w, h)
                  if (Fx.i("fx_scan") > 0) fillShader(c, scanSh, w, h)

                  val gr = Fx.i("fx_grain")
                  if (gr > 0) {
                      val n = 300 + gr * 10
                      if (gpts.size < 2 * n) gpts = FloatArray(2 * n)
                      for (i in 0 until 2 * n step 2) { gpts[i] = Random.nextFloat() * w; gpts[i + 1] = Random.nextFloat() * h }
                      paint.shader = null; paint.strokeWidth = Fx.i("fx_grain_size").toFloat(); paint.strokeCap = Paint.Cap.SQUARE
                      val a = (15 + gr * 0.8f).toInt().coerceIn(0, 255)
                      paint.color = Color.argb(a, 255, 255, 255); c.drawPoints(gpts, 0, n, paint)
                      paint.color = Color.argb(a, 0, 0, 0); c.drawPoints(gpts, n, n, paint)
                  }

                  val fl = Fx.i("fx_flicker")
                  if (fl > 0) c.drawColor(Color.argb((Random.nextFloat() * fl * 0.12f).toInt().coerceIn(0, 255), 0, 0, 0))

                  val lb = Fx.i("fx_letterbox")
                  if (lb > 0) {
                      val bar = h * lb / 100f
                      paint.shader = null; paint.color = Color.BLACK
                      c.drawRect(0f, 0f, w, bar, paint); c.drawRect(0f, h - bar, w, h, paint)
                  }
              }

              private fun fillShader(c: Canvas, s: Shader?, w: Float, h: Float) {
                  paint.shader = s; paint.alpha = 255
                  c.drawRect(0f, 0f, w, h, paint)
                  paint.shader = null
              }

              private fun drawBloom(c: Canvas, w: Float, h: Float) {
                  val haze = Fx.i("b_haze") / 100f
                  if (haze > 0f) {
                      val tmp = Fx.i("b_haze_temp") / 100f
                      c.drawColor(Color.argb((haze * 70).toInt(), (120 + 135 * tmp).toInt(), (170 + 20 * tmp).toInt(), (255 - 135 * tmp).toInt()))
                      paint.shader = hazeSh; paint.alpha = (haze * 140).toInt().coerceIn(0, 255)
                      c.drawRect(0f, 0f, w, h, paint)
                      paint.shader = null; paint.alpha = 255
                  }
                  val lk = Fx.i("b_leaks") / 100f
                  if (lk > 0f) {
                      val sp2 = 0.05f + Fx.i("b_leak_speed") / 100f * 0.5f
                      for (i in 0..2) {
                          val x = w * (0.5f + 0.6f * cos(t * sp2 + i * 2.1f))
                          val y = h * (0.5f + 0.55f * sin(t * sp2 * 0.7f + i * 1.7f))
                          paint.shader = leakSh[i]; paint.alpha = (lk * 110).toInt().coerceIn(0, 255)
                          c.save(); c.translate(x, y); c.drawCircle(0f, 0f, w * 0.75f, paint); c.restore()
                      }
                      paint.shader = null; paint.alpha = 255
                  }
              }

              private fun drawParticles(c: Canvas, w: Float, h: Float) {
                  val spr = sprites ?: return
                  val gl = glow ?: return
                  val cnt = Fx.i("p_count").coerceIn(0, MAXP)
                  val focus = Fx.i("p_focus") / 100f
                  val dofK = Fx.i("p_dof") / 100f * 8f
                  val spread = Fx.i("p_depth_spread") / 100f
                  val sMin = Fx.i("p_size_min") * dp
                  val sMax = max(sMin, Fx.i("p_size_max") * dp)
                  val dofSize = Fx.i("p_dof_size") / 100f
                  val opac = Fx.i("p_opacity") / 100f
                  val bvar = Fx.i("p_bright_var") / 100f
                  val tw = Fx.i("p_twinkle") / 100f
                  val par = Fx.i("m_parallax") / 100f
                  val sway = Fx.i("m_sway") / 100f
                  val bloom = Fx.i("b_on") == 1
                  val glowA = if (bloom) Fx.i("b_glow") / 100f else 0f
                  val glowS = Fx.i("b_glow_size") / 100f
                  val stk = if (bloom) Fx.i("b_streak") / 100f else 0f
                  val stkL = Fx.i("b_streak_len") / 100f

                  for (k in 0 until cnt) {
                      val p = ps[k]
                      val d = (0.5f + (p.d - 0.5f) * spread).coerceIn(0f, 1f)
                      val blurF = (abs(d - focus) * dofK).coerceIn(0f, 1f)
                      val lvl = (blurF * (LEVELS - 1)).roundToInt().coerceIn(0, LEVELS - 1)
                      val persp = 1.25f - 0.5f * d
                      val rad = (sMin + (sMax - sMin) * p.r) * persp * (1f + blurF * dofSize)
                      val px = (p.x + sin(p.ph) * sway * 0.03f + tiltX * par * (1f - d) * 0.25f) * w
                      val py = (p.y + tiltY * par * (1f - d) * 0.25f) * h
                      if (px < -rad * 3 || px > w + rad * 3 || py < -rad * 3 || py > h + rad * 3) continue
                      val twk = 1f - tw * (0.5f + 0.5f * sin(p.ph2))
                      val a = (opac * twk * (1f - bvar * p.br) * (1f - 0.45f * blurF)).coerceIn(0f, 1f)

                      sp.colorFilter = p.filter
                      if (glowA > 0f) {
                          sp.alpha = (a * glowA * 0.6f * 255).toInt().coerceIn(0, 255)
                          val g = rad * 1.5f * glowS
                          dst.set(px - g, py - g, px + g, py + g)
                          c.drawBitmap(gl, null, dst, sp)
                      }
                      sp.alpha = (a * 255).toInt().coerceIn(0, 255)
                      val e = rad * 1.667f
                      dst.set(px - e, py - e, px + e, py + e)
                      c.drawBitmap(spr[lvl], null, dst, sp)

                      if (stk > 0f && blurF < 0.5f && p.br < 0.4f) {
                          sp.colorFilter = streakFilter
                          sp.alpha = (a * stk * 0.7f * 255).toInt().coerceIn(0, 255)
                          val l = rad * 3f * stkL; val hh = rad * 0.3f
                          dst.set(px - l, py - hh, px + l, py + hh)
                          c.drawBitmap(gl, null, dst, sp)
                      }
                  }
                  sp.colorFilter = null
              }
          }
