          package com.lumen.studio

          import android.graphics.Bitmap
          import java.util.Random
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.ln
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          /** CPU mirror of the "fitted block" in the fragment shader. Keep both in sync. */
          object GradeCpu {
              const val N = 43
              val KEYS: List<String> = listOf("exposure", "contrast", "highlights", "shadows", "whites", "blacks", "temp", "tint", "vibrance", "saturation") +
                  (0..7).map { "hue_$it" } + (0..7).map { "sat_$it" } + (0..7).map { "lum_$it" } +
                  listOf("sh_r", "sh_g", "sh_b", "md_r", "md_g", "md_b", "hi_r", "hi_g", "hi_b")
              private val CEN = doubleArrayOf(0.0, 30.0, 60.0, 120.0, 180.0, 240.0, 280.0, 320.0)

              private fun ss(a: Double, b: Double, x: Double): Double { val t = min(1.0, max(0.0, (x - a) / (b - a))); return t * t * (3 - 2 * t) }
              private fun cl(x: Double) = min(1.0, max(0.0, x))
              private fun lum(r: Double, g: Double, b: Double) = 0.2126 * r + 0.7152 * g + 0.0722 * b

              fun apply(r0: Double, g0: Double, b0: Double, t: DoubleArray, o: DoubleArray) {
                  var r = r0; var g = g0; var b = b0
                  val ex = Math.pow(2.0, t[0]); r *= ex; g *= ex; b *= ex
                  r *= 1 + 0.25 * t[6]; b *= 1 - 0.25 * t[6]
                  g *= 1 - 0.15 * t[7]; r *= 1 + 0.05 * t[7]; b *= 1 + 0.05 * t[7]
                  val l0 = lum(r, g, b)
                  val ws0 = 1 - ss(0.0, 0.5, l0); val wh0 = ss(0.5, 1.0, l0)
                  val m1 = 1 + t[3] * 0.6 * ws0 + t[2] * 0.4 * wh0
                  r *= m1; g *= m1; b *= m1
                  val m2 = 1 + t[4] * 0.25 * ss(0.6, 1.0, l0)
                  r *= m2; g *= m2; b *= m2
                  val bk = t[5] * 0.08 * (1 - ss(0.0, 0.3, l0))
                  r += bk; g += bk; b += bk
                  val ct = 1 + t[1] * 0.9
                  r = cl((r - 0.5) * ct + 0.5); g = cl((g - 0.5) * ct + 0.5); b = cl((b - 0.5) * ct + 0.5)
                  val l1 = lum(r, g, b)
                  val mx = max(r, max(g, b)); val mn = min(r, min(g, b))
                  val s0 = (mx - mn) / (mx + 1e-4)
                  val k = 1 + t[9] + t[8] * (1 - s0)
                  r = cl(l1 + (r - l1) * k); g = cl(l1 + (g - l1) * k); b = cl(l1 + (b - l1) * k)
                  // rgb -> hsv
                  val vmax = max(r, max(g, b)); val vmin = min(r, min(g, b)); val d = vmax - vmin
                  var h = 0.0
                  if (d > 1e-10) {
                      h = when (vmax) {
                          r -> ((g - b) / d).let { if (it < 0) it + 6 else it }
                          g -> (b - r) / d + 2
                          else -> (r - g) / d + 4
                      } / 6.0
                  }
                  var s = d / (vmax + 1e-10); var v = vmax
                  val hd = h * 360.0
                  var dh = 0.0; var ds = 0.0; var dl = 0.0
                  for (i in 0..7) {
                      var dist = abs(hd - CEN[i]); dist = min(dist, 360 - dist)
                      val w = max(0.0, 1 - dist / 45.0)
                      dh += w * t[10 + i]; ds += w * t[18 + i]; dl += w * t[26 + i]
                  }
                  val sw = ss(0.0, 0.2, s)
                  h += dh * 0.1 * sw; h -= Math.floor(h)
                  s = cl(s * (1 + ds)); v = cl(v * (1 + dl * 0.6))
                  // hsv -> rgb
                  val hh = h * 6; val ii = Math.floor(hh).toInt() % 6; val ff = hh - Math.floor(hh)
                  val p = v * (1 - s); val q = v * (1 - s * ff); val tt = v * (1 - s * (1 - ff))
                  when (ii) {
                      0 -> { r = v; g = tt; b = p }
                      1 -> { r = q; g = v; b = p }
                      2 -> { r = p; g = v; b = tt }
                      3 -> { r = p; g = q; b = v }
                      4 -> { r = tt; g = p; b = v }
                      else -> { r = v; g = p; b = q }
                  }
                  val l3 = lum(r, g, b)
                  val ws3 = 1 - ss(0.0, 0.5, l3); val wh3 = ss(0.5, 1.0, l3); val wm3 = 1 - ws3 - wh3
                  r += (t[34] * ws3 + t[37] * wm3 + t[40] * wh3) * 0.25
                  g += (t[35] * ws3 + t[38] * wm3 + t[41] * wh3) * 0.25
                  b += (t[36] * ws3 + t[39] * wm3 + t[42] * wh3) * 0.25
                  o[0] = cl(r); o[1] = cl(g); o[2] = cl(b)
              }
          }

          object Match {
              class Result(val theta: DoubleArray, val lut: FloatArray?, val lutN: Int, val rmse: Double)
              private const val LS = 2.5

              // ---------------------------------------------------------------- OKLab (a,b scaled by LS)
              private fun toLin(c: Double) = if (c <= 0.04045) c / 12.92 else Math.pow((c + 0.055) / 1.055, 2.4)
              private fun toSrgb(c0: Double): Double { val c = min(1.0, max(0.0, c0)); return if (c <= 0.0031308) c * 12.92 else 1.055 * Math.pow(c, 1 / 2.4) - 0.055 }

              fun rgbToLab(r: Double, g: Double, b: Double, o: DoubleArray) {
                  val lr = toLin(r); val lg = toLin(g); val lb = toLin(b)
                  val l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb)
                  val m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb)
                  val s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb)
                  o[0] = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s
                  o[1] = (1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s) * LS
                  o[2] = (0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s) * LS
              }

              fun labToRgb(L: Double, a0: Double, b0: Double, o: DoubleArray) {
                  val a = a0 / LS; val b = b0 / LS
                  val l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3.0)
                  val m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3.0)
                  val s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3.0)
                  o[0] = toSrgb(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s)
                  o[1] = toSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s)
                  o[2] = toSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)
              }

              private fun sample(bmp: Bitmap, maxDim: Int): DoubleArray {
                  val s = Img.scaleMax(bmp, maxDim)
                  val px = IntArray(s.width * s.height)
                  s.getPixels(px, 0, s.width, 0, 0, s.width, s.height)
                  val o = DoubleArray(px.size * 3)
                  for (i in px.indices) {
                      o[3 * i] = ((px[i] shr 16) and 255) / 255.0
                      o[3 * i + 1] = ((px[i] shr 8) and 255) / 255.0
                      o[3 * i + 2] = (px[i] and 255) / 255.0
                  }
                  return o
              }

              private fun toLabArr(rgb: DoubleArray): FloatArray {
                  val o = DoubleArray(3)
                  val out = FloatArray(rgb.size)
                  for (i in 0 until rgb.size / 3) {
                      rgbToLab(rgb[3 * i], rgb[3 * i + 1], rgb[3 * i + 2], o)
                      out[3 * i] = o[0].toFloat(); out[3 * i + 1] = o[1].toFloat(); out[3 * i + 2] = o[2].toFloat()
                  }
                  return out
              }

              // ---------------------------------------------------------------- iterative distribution transfer
              private fun randomRot(rnd: Random, m: Array<DoubleArray>) {
                  for (i in 0..2) {
                      for (k in 0..2) m[i][k] = rnd.nextGaussian()
                      for (j in 0 until i) {
                          var dot = 0.0
                          for (k in 0..2) dot += m[i][k] * m[j][k]
                          for (k in 0..2) m[i][k] -= dot * m[j][k]
                      }
                      var n = 0.0
                      for (k in 0..2) n += m[i][k] * m[i][k]
                      n = sqrt(n)
                      for (k in 0..2) m[i][k] /= n
                  }
              }

              private fun mapq(tq: FloatArray, rq: FloatArray, y: Float): Float {
                  val q = tq.size
                  if (y <= tq[0]) return rq[0] + (y - tq[0])
                  if (y >= tq[q - 1]) return rq[q - 1] + (y - tq[q - 1])
                  var lo = 0; var hi = q - 1
                  while (hi - lo > 1) { val mid = (lo + hi) ushr 1; if (tq[mid] <= y) lo = mid else hi = mid }
                  val d = tq[hi] - tq[lo]
                  if (d < 1e-9f) return rq[lo]
                  return rq[lo] + (rq[hi] - rq[lo]) * (y - tq[lo]) / d
              }

              private fun applyRot(p: FloatArray, rot: Array<DoubleArray>, tq: Array<FloatArray>, rq: Array<FloatArray>) {
                  val y = DoubleArray(3)
                  for (i in 0 until p.size / 3) {
                      val x0 = p[3 * i].toDouble(); val x1 = p[3 * i + 1].toDouble(); val x2 = p[3 * i + 2].toDouble()
                      for (a in 0..2) {
                          val v = (rot[a][0] * x0 + rot[a][1] * x1 + rot[a][2] * x2).toFloat()
                          y[a] = mapq(tq[a], rq[a], v).toDouble()
                      }
                      p[3 * i] = (rot[0][0] * y[0] + rot[1][0] * y[1] + rot[2][0] * y[2]).toFloat()
                      p[3 * i + 1] = (rot[0][1] * y[0] + rot[1][1] * y[1] + rot[2][1] * y[2]).toFloat()
                      p[3 * i + 2] = (rot[0][2] * y[0] + rot[1][2] * y[1] + rot[2][2] * y[2]).toFloat()
                  }
              }

              private fun idt(t: FloatArray, r: FloatArray, iters: Int, nodes: FloatArray?, seed: Long) {
                  val rnd = Random(seed)
                  val nt = t.size / 3; val nr = r.size / 3
                  val Q = 512
                  val pt = FloatArray(nt); val pr = FloatArray(nr)
                  val tq = Array(3) { FloatArray(Q) }; val rq = Array(3) { FloatArray(Q) }
                  val rot = Array(3) { DoubleArray(3) }
                  for (it in 0 until iters) {
                      if (it == 0) { for (i in 0..2) for (k in 0..2) rot[i][k] = if (i == k) 1.0 else 0.0 } else randomRot(rnd, rot)
                      for (ax in 0..2) {
                          val v = rot[ax]
                          for (i in 0 until nt) pt[i] = (v[0] * t[3 * i] + v[1] * t[3 * i + 1] + v[2] * t[3 * i + 2]).toFloat()
                          for (j in 0 until nr) pr[j] = (v[0] * r[3 * j] + v[1] * r[3 * j + 1] + v[2] * r[3 * j + 2]).toFloat()
                          java.util.Arrays.sort(pt); java.util.Arrays.sort(pr)
                          for (k in 0 until Q) {
                              tq[ax][k] = pt[(((k + 0.5) / Q) * nt).toInt().coerceIn(0, nt - 1)]
                              rq[ax][k] = pr[(((k + 0.5) / Q) * nr).toInt().coerceIn(0, nr - 1)]
                          }
                      }
                      applyRot(t, rot, tq, rq)
                      if (nodes != null) applyRot(nodes, rot, tq, rq)
                  }
              }

              // ---------------------------------------------------------------- Levenberg-Marquardt slider fit
              private fun solve(a: Array<DoubleArray>, b: DoubleArray, n: Int): DoubleArray? {
                  val m = Array(n) { i -> DoubleArray(n + 1) { j -> if (j < n) a[i][j] else b[i] } }
                  for (c in 0 until n) {
                      var piv = c
                      for (r in c + 1 until n) if (abs(m[r][c]) > abs(m[piv][c])) piv = r
                      if (abs(m[piv][c]) < 1e-12) return null
                      val tmp = m[c]; m[c] = m[piv]; m[piv] = tmp
                      for (r in c + 1 until n) {
                          val f = m[r][c] / m[c][c]
                          for (k in c..n) m[r][k] -= f * m[c][k]
                      }
                  }
                  val x = DoubleArray(n)
                  for (i in n - 1 downTo 0) {
                      var s = m[i][n]
                      for (k in i + 1 until n) s -= m[i][k] * x[k]
                      x[i] = s / m[i][i]
                  }
                  return x
              }

              private fun fit(xs: DoubleArray, ys: DoubleArray, progress: (String) -> Unit): Pair<DoubleArray, Double> {
                  val n = GradeCpu.N
                  val M = xs.size / 3; val m = M * 3
                  val th = DoubleArray(n)
                  val bound = DoubleArray(n) { if (it == 0) 2.5 else 1.0 }
                  val r0 = DoubleArray(m); val r1 = DoubleArray(m)
                  val J = Array(n) { DoubleArray(m) }
                  val o = DoubleArray(3); val lab = DoubleArray(3)
                  val regW = M * 0.0005
                  fun resid(t: DoubleArray, out: DoubleArray) {
                      for (i in 0 until M) {
                          GradeCpu.apply(xs[3 * i], xs[3 * i + 1], xs[3 * i + 2], t, o)
                          rgbToLab(o[0], o[1], o[2], lab)
                          out[3 * i] = lab[0] - ys[3 * i]; out[3 * i + 1] = lab[1] - ys[3 * i + 1]; out[3 * i + 2] = lab[2] - ys[3 * i + 2]
                      }
                  }
                  fun cost(r: DoubleArray, t: DoubleArray): Double {
                      var c = 0.0
                      for (v in r) c += v * v
                      for (v in t) c += regW * v * v
                      return c
                  }
                  var mu = 1e-2
                  val h = 1e-3
                  resid(th, r0)
                  var c0 = cost(r0, th)
                  for (iter in 0 until 30) {
                      progress("Fitting sliders ${iter * 100 / 30}%")
                      for (j in 0 until n) {
                          val save = th[j]
                          th[j] = save + h
                          resid(th, r1)
                          th[j] = save
                          for (i in 0 until m) J[j][i] = (r1[i] - r0[i]) / h
                      }
                      val jtj = Array(n) { DoubleArray(n) }
                      val g = DoubleArray(n)
                      for (a in 0 until n) {
                          for (b in a until n) {
                              var s = 0.0
                              val ja = J[a]; val jb = J[b]
                              for (i in 0 until m) s += ja[i] * jb[i]
                              jtj[a][b] = s; jtj[b][a] = s
                          }
                          var s = 0.0
                          for (i in 0 until m) s += J[a][i] * r0[i]
                          g[a] = s + regW * th[a]
                      }
                      var improved = false
                      for (tr in 0 until 7) {
                          val am = Array(n) { i -> DoubleArray(n) { j -> jtj[i][j] + (if (i == j) regW + mu * (jtj[i][i] + 1e-6) else 0.0) } }
                          val d = solve(am, DoubleArray(n) { -g[it] }, n)
                          if (d == null) { mu *= 10; continue }
                          val nt = DoubleArray(n) { min(bound[it], max(-bound[it], th[it] + d[it])) }
                          resid(nt, r1)
                          val c1 = cost(r1, nt)
                          if (c1 < c0) {
                              for (i in 0 until n) th[i] = nt[i]
                              System.arraycopy(r1, 0, r0, 0, m)
                              c0 = c1; mu = max(mu * 0.3, 1e-7); improved = true
                              break
                          } else mu *= 5
                      }
                      if (!improved) break
                  }
                  var ss = 0.0
                  for (v in r0) ss += v * v
                  return Pair(th, sqrt(ss / m))
              }

              // ---------------------------------------------------------------- public entry
              fun run(src: Bitmap, ref: Bitmap, iters: Int, refine: Boolean, progress: (String) -> Unit): Result {
                  progress("Sampling photos")
                  val tRgb = sample(src, 256)
                  val rRgb = sample(ref, 256)
                  val nt = tRgb.size / 3
                  val tl = toLabArr(tRgb)
                  val rl = toLabArr(rRgb)
                  val y = tl.copyOf()
                  progress("Matching color distribution")
                  idt(y, rl, iters, null, 11L)
                  val rnd = Random(5)
                  val M = min(nt, 4500)
                  val xs = DoubleArray(M * 3); val ys = DoubleArray(M * 3)
                  for (i in 0 until M) {
                      val k = if (M == nt) i else rnd.nextInt(nt)
                      for (c in 0..2) { xs[3 * i + c] = tRgb[3 * k + c]; ys[3 * i + c] = y[3 * k + c].toDouble() }
                  }
                  val (theta, rmse) = fit(xs, ys, progress)
                  if (!refine) return Result(theta, null, 0, rmse)
                  progress("Building LUT")
                  val o = DoubleArray(3); val lab = DoubleArray(3)
                  val g = FloatArray(nt * 3)
                  for (i in 0 until nt) {
                      GradeCpu.apply(tRgb[3 * i], tRgb[3 * i + 1], tRgb[3 * i + 2], theta, o)
                      rgbToLab(o[0], o[1], o[2], lab)
                      g[3 * i] = lab[0].toFloat(); g[3 * i + 1] = lab[1].toFloat(); g[3 * i + 2] = lab[2].toFloat()
                  }
                  val n = 33
                  val nodes = FloatArray(n * n * n * 3)
                  var idx = 0
                  for (b in 0 until n) for (gg in 0 until n) for (r in 0 until n) {
                      rgbToLab(r / (n - 1.0), gg / (n - 1.0), b / (n - 1.0), lab)
                      nodes[idx++] = lab[0].toFloat(); nodes[idx++] = lab[1].toFloat(); nodes[idx++] = lab[2].toFloat()
                  }
                  idt(g, rl, max(8, iters / 2), nodes, 23L)
                  val lut = FloatArray(nodes.size)
                  for (i in 0 until n * n * n) {
                      labToRgb(nodes[3 * i].toDouble(), nodes[3 * i + 1].toDouble(), nodes[3 * i + 2].toDouble(), o)
                      lut[3 * i] = o[0].toFloat(); lut[3 * i + 1] = o[1].toFloat(); lut[3 * i + 2] = o[2].toFloat()
                  }
                  return Result(theta, smooth(lut, n), n, rmse)
              }

              private fun smooth(l: FloatArray, n: Int): FloatArray {
                  val o = FloatArray(l.size)
                  for (b in 0 until n) for (g in 0 until n) for (r in 0 until n) {
                      for (c in 0..2) {
                          var s = 0f; var cnt = 0
                          for (db in -1..1) for (dg in -1..1) for (dr in -1..1) {
                              val rr = r + dr; val gg = g + dg; val bb = b + db
                              if (rr < 0 || gg < 0 || bb < 0 || rr >= n || gg >= n || bb >= n) continue
                              s += l[((bb * n + gg) * n + rr) * 3 + c]; cnt++
                          }
                          val i = ((b * n + g) * n + r) * 3 + c
                          o[i] = 0.5f * l[i] + 0.5f * (s / cnt)
                      }
                  }
                  return o
              }

              private fun sampleLut(lut: FloatArray, n: Int, r: Double, g: Double, b: Double, o: DoubleArray) {
                  val fr = min(max(r, 0.0), 1.0) * (n - 1); val fg = min(max(g, 0.0), 1.0) * (n - 1); val fb = min(max(b, 0.0), 1.0) * (n - 1)
                  val r0 = min(fr.toInt(), n - 2); val g0 = min(fg.toInt(), n - 2); val b0 = min(fb.toInt(), n - 2)
                  val tr = fr - r0; val tg = fg - g0; val tb = fb - b0
                  for (c in 0..2) {
                      var v = 0.0
                      for (db in 0..1) for (dg in 0..1) for (dr in 0..1) {
                          val w = (if (dr == 1) tr else 1 - tr) * (if (dg == 1) tg else 1 - tg) * (if (db == 1) tb else 1 - tb)
                          v += w * lut[(((b0 + db) * n + (g0 + dg)) * n + (r0 + dr)) * 3 + c]
                      }
                      o[c] = v
                  }
              }

              /** Bakes sliders + LUT into one .cube text. */
              fun bakeCube(theta: DoubleArray, lut: FloatArray?, ln: Int): String {
                  val n = 33
                  val sb = StringBuilder("TITLE \"Lumen match\"\nLUT_3D_SIZE $n\n")
                  val o = DoubleArray(3); val p = DoubleArray(3)
                  for (b in 0 until n) for (g in 0 until n) for (r in 0 until n) {
                      GradeCpu.apply(r / (n - 1.0), g / (n - 1.0), b / (n - 1.0), theta, o)
                      if (lut != null) { sampleLut(lut, ln, o[0], o[1], o[2], p); o[0] = p[0]; o[1] = p[1]; o[2] = p[2] }
                      sb.append(String.format(java.util.Locale.US, "%.6f %.6f %.6f\n", o[0], o[1], o[2]))
                  }
                  return sb.toString()
              }

              private fun wbFrom(mr: Double, mg: Double, mb: Double, k: Double): Map<String, Int> {
                  val t = ((mb - mr) / (0.25 * (mb + mr) + 1e-4) * k).coerceIn(-0.8, 0.8)
                  val ti = ((1.0 - (mr + mb) / (2.0 * (mg + 1e-4))) / 0.15 * k).coerceIn(-0.8, 0.8)
                  return mapOf("temp" to (t * 100).roundToInt(), "tint" to (ti * 100).roundToInt())
              }

              /** Gray-world white balance for the whole photo. */
              fun awb(src: Bitmap): Map<String, Int> {
                  val s = sample(src, 128)
                  val n = s.size / 3
                  var mr = 0.0; var mg = 0.0; var mb = 0.0
                  for (i in 0 until n) { mr += s[3 * i]; mg += s[3 * i + 1]; mb += s[3 * i + 2] }
                  return wbFrom(mr / n, mg / n, mb / n, 0.6)
              }

              /** White balance that makes the tapped spot neutral. */
              fun neutralAt(b: Bitmap, x: Int, y: Int): Map<String, Int> {
                  var r = 0.0; var g = 0.0; var bl = 0.0; var n = 0
                  for (dy in -4..4) for (dx in -4..4) {
                      val p = b.getPixel((x + dx).coerceIn(0, b.width - 1), (y + dy).coerceIn(0, b.height - 1))
                      r += ((p shr 16) and 255) / 255.0; g += ((p shr 8) and 255) / 255.0; bl += (p and 255) / 255.0; n++
                  }
                  return wbFrom(r / n, g / n, bl / n, 1.0)
              }

              /** Black and white points from the 0.5% / 99.5% luminance percentiles. */
              fun autoLevels(src: Bitmap): Map<String, Int> {
                  val s = sample(src, 128)
                  val n = s.size / 3
                  val ys = DoubleArray(n) { 0.2126 * s[3 * it] + 0.7152 * s[3 * it + 1] + 0.0722 * s[3 * it + 2] }
                  ys.sort()
                  val p1 = ys[(n * 0.005).toInt()]
                  val p99 = ys[min(n - 1, (n * 0.995).toInt())]
                  return mapOf("lv_black" to (p1 / 0.3 * 100).toInt().coerceIn(0, 100), "lv_white" to (p99 * 100).toInt().coerceIn(50, 100))
              }

              /** Histogram-driven starting point for exposure, contrast, white balance and vibrance. */
              fun auto(src: Bitmap): Map<String, Int> {
                  val s = sample(src, 128)
                  val n = s.size / 3
                  val ys = DoubleArray(n)
                  var mr = 0.0; var mb = 0.0
                  for (i in 0 until n) { ys[i] = 0.2126 * s[3 * i] + 0.7152 * s[3 * i + 1] + 0.0722 * s[3 * i + 2]; mr += s[3 * i]; mb += s[3 * i + 2] }
                  mr /= n; mb /= n
                  ys.sort()
                  val p1 = ys[(n * 0.01).toInt()]; val p50 = ys[n / 2]; val p99 = ys[min(n - 1, (n * 0.99).toInt())]
                  val ev = (ln(0.42 / max(p50, 0.02)) / ln(2.0) * 0.8).coerceIn(-1.5, 1.5)
                  val spread = max(p99 - p1, 0.2)
                  val contrast = ((0.9 / spread - 1.0) * 0.6).coerceIn(-0.2, 0.5)
                  val temp = ((mb - mr) / (mr + mb + 1e-3) * 2.0).coerceIn(-0.3, 0.3)
                  return mapOf("exposure" to (ev * 100).toInt(), "contrast" to (contrast * 100).toInt(), "temp" to (temp * 100).toInt(),
                      "vibrance" to 18, "highlights" to -10, "shadows" to 12)
              }
          }
