                  if (Fx.i("confirm_reset") == 1)
                      AlertDialog.Builder(this).setTitle("Reset all edits?").setMessage("App settings and cutouts are kept. You can undo this.")
                          .setPositiveButton("Reset") { _, _ -> go() }.setNegativeButton("Cancel", null).show()
