              // ------------------------------------------------------------------ core state
              fun init(c: Context) {
                  if (prefs != null) return
                  val p = c.applicationContext.getSharedPreferences("lm1", Context.MODE_PRIVATE)
                  prefs = p
                  for (k in defs.keys) if (p.contains(k)) map[k] = p.getInt(k, 0)
                  initHistory()
              }

              fun i(k: String): Int = map[k] ?: defs[k] ?: 0
              fun f(k: String): Float = i(k) / (divs[k] ?: 1f)
              fun isDefault(k: String): Boolean = i(k) == (defs[k] ?: 0)
              fun set(k: String, v: Int) { map[k] = v; prefs?.edit()?.putInt(k, v)?.apply() }
              fun find(k: String): S? = byKey[k]

              fun resetKeys(keys: List<String>) {
                  val e = prefs?.edit()
                  for (k in keys) { map.remove(k); e?.remove(k) }
                  e?.apply()
              }
              fun resetKey(k: String) = resetKeys(listOf(k))

              private fun editKeys(): List<String> = defs.keys.filter { !keepKeys.contains(it) && byKey[it] !is Ac }

              /** Reset every editing parameter, keeping app settings and viewing aids. */
              fun resetEdits() = resetKeys(editKeys())

              /** Apply a look. Below 100% only "amount" sliders are scaled (hues, choices and thresholds keep their value). */
              fun applyMap(m: Map<String, Int>, pct: Int = 100) {
                  resetEdits()
                  for ((k, v) in m) {
                      val s = byKey[k]
                      val nv = if (pct >= 100 || s !is Sl || s.unit == "°") v else s.def + Math.round((v - s.def) * pct / 100f)
                      set(k, nv)
                  }
                  if (pct < 100 && m.containsKey("film_stock")) set("film_amt", pct)
              }
              fun applyPreset(name: String, pct: Int = 100) { applyMap(presets[name] ?: emptyMap(), pct) }

              fun glArray(): FloatArray {
                  val a = FloatArray((glKeys.size + 3) / 4 * 4)
                  for ((n, k) in glKeys.withIndex()) a[n] = f(k)
                  return a
              }

              fun anyEdited(keys: List<String>): Boolean = keys.any { !keepKeys.contains(it) && !isDefault(it) }
              fun editedKeys(): List<String> = editKeys().filter { !isDefault(it) }

              // ------------------------------------------------------------------ strings
              fun str(k: String, d: String): String = prefs?.getString("s_$k", d) ?: d
              fun setStr(k: String, v: String) { prefs?.edit()?.putString("s_$k", v)?.apply() }

              // ------------------------------------------------------------------ history
              private val hist = ArrayList<HashMap<String, Int>>()
              private var hi = 0

              private fun snap(): HashMap<String, Int> {
                  val o = HashMap<String, Int>()
                  for (k in editKeys()) { val v = i(k); if (v != (defs[k] ?: 0)) o[k] = v }
                  return o
              }
              fun initHistory() { hist.clear(); hist.add(snap()); hi = 0 }
              fun commit() {
                  val s = snap()
                  if (hist.isNotEmpty() && hist[hi] == s) return
                  while (hist.size > hi + 1) hist.removeAt(hist.size - 1)
                  hist.add(s); hi++
                  if (hist.size > 80) { hist.removeAt(0); hi-- }
              }
              private fun restore(m: Map<String, Int>) {
                  resetEdits()
                  for ((k, v) in m) set(k, v)
              }
              fun snapshot(): Map<String, Int> = snap()
              fun applySnapshot(m: Map<String, Int>) = restore(m)
              fun canUndo(): Boolean = hi > 0
              fun canRedo(): Boolean = hi < hist.size - 1
              fun undo(): Boolean { if (!canUndo()) return false; hi--; restore(hist[hi]); return true }
              fun redo(): Boolean { if (!canRedo()) return false; hi++; restore(hist[hi]); return true }

              // ------------------------------------------------------------------ settings file
              fun dump(): String {
                  val sb = StringBuilder("LUMEN1\n")
                  for ((k, v) in snap().toSortedMap()) sb.append(k).append('=').append(v).append('\n')
                  return sb.toString()
              }
              /** Returns the number of parameters loaded, or -1 when the text is not a Lumen settings file. */
              fun load(text: String): Int {
                  val lines = text.lines()
                  if (lines.isEmpty() || lines[0].trim() != "LUMEN1") return -1
                  resetEdits()
                  var n = 0
                  for (l in lines.drop(1)) {
                      val p = l.split('=')
                      if (p.size != 2) continue
                      val v = p[1].trim().toIntOrNull() ?: continue
                      val k = p[0].trim()
                      if (defs.containsKey(k) && !keepKeys.contains(k) && byKey[k] !is Ac) { set(k, v); n++ }
                  }
                  return n
              }

              // ------------------------------------------------------------------ favorites
              fun favs(): List<String> = (prefs?.getString("favs", "") ?: "").split(',').filter { it.isNotEmpty() && byKey.containsKey(it) }
              fun isFav(k: String): Boolean = favs().contains(k)
              fun toggleFav(k: String): Boolean {
                  val l = favs().toMutableList()
                  val on = if (l.contains(k)) { l.remove(k); false } else { l.add(k); true }
                  prefs?.edit()?.putString("favs", l.joinToString(","))?.apply()
                  return on
              }

              // ------------------------------------------------------------------ saved looks
              fun customLooks(): LinkedHashMap<String, Map<String, Int>> {
                  val out = LinkedHashMap<String, Map<String, Int>>()
                  val raw = prefs?.getString("looks", "") ?: ""
                  if (raw.isEmpty()) return out
                  for (e in raw.split('\u0001')) {
                      val p = e.split('\u0002')
                      if (p.size != 2 || p[0].isEmpty()) continue
                      val m = LinkedHashMap<String, Int>()
                      for (kv in p[1].split(',')) {
                          val q = kv.split(':')
                          if (q.size == 2) { val v = q[1].toIntOrNull(); if (v != null && defs.containsKey(q[0])) m[q[0]] = v }
                      }
                      out[p[0]] = m
                  }
                  return out
              }
              private fun writeLooks(m: Map<String, Map<String, Int>>) {
                  val s = m.entries.joinToString("\u0001") { (n, v) -> n + "\u0002" + v.entries.joinToString(",") { it.key + ":" + it.value } }
                  prefs?.edit()?.putString("looks", s)?.apply()
              }
              fun saveLook(name: String) {
                  val clean = name.replace('\u0001', ' ').replace('\u0002', ' ').trim()
                  if (clean.isEmpty()) return
                  val all = customLooks()
                  all[clean] = snap()
                  writeLooks(all)
              }
              fun deleteLook(name: String) { val all = customLooks(); all.remove(name); writeLooks(all) }

              // ------------------------------------------------------------------ randomize
              fun randomize(strength: Float) {
                  resetEdits()
                  val r = Random(System.nanoTime())
                  fun rnd(k: String, lo: Int, hi2: Int) { if (r.nextFloat() < 0.75f) set(k, ((lo + r.nextFloat() * (hi2 - lo)) * strength).toInt()) }
                  rnd("exposure", -35, 35); rnd("contrast", -20, 35); rnd("highlights", -35, 15); rnd("shadows", -15, 35)
                  rnd("vibrance", -20, 45); rnd("saturation", -25, 25); rnd("temp", -40, 40); rnd("tint", -15, 15)
                  rnd("sh_r", -15, 15); rnd("sh_g", -15, 15); rnd("sh_b", -15, 25)
                  rnd("md_r", -8, 8); rnd("md_b", -8, 8); rnd("hi_r", -10, 22); rnd("hi_b", -12, 8)
                  rnd("clarity", -20, 30); rnd("glow", 0, 35); rnd("vig", -50, 0); rnd("grain", 0, 30); rnd("fade", 0, 25)
                  rnd("lift_black", 0, 25); rnd("scurve", -20, 40)
                  if (r.nextFloat() < 0.5f) { set("st_sh_h", r.nextInt(360)); set("st_sh_s", (10 + r.nextInt(35) * strength).toInt().coerceAtMost(100)) }
                  if (r.nextFloat() < 0.5f) { set("st_hi_h", r.nextInt(360)); set("st_hi_s", (10 + r.nextInt(35) * strength).toInt().coerceAtMost(100)) }
                  if (r.nextFloat() < 0.3f) set("film_stock", 1 + r.nextInt(7))
                  if (r.nextFloat() < 0.15f) { set("bw_amt", 100); set("bw_contrast", (r.nextInt(50)).coerceAtMost(100)) }
              }

              // ------------------------------------------------------------------ crop helpers
              fun cropAspect(): Float {
                  val r = when (i("crop_ratio")) {
                      0 -> 0f; 1 -> 1f; 2 -> 4f / 5f; 3 -> 5f / 4f; 4 -> 3f / 4f; 5 -> 4f / 3f
                      6 -> 2f / 3f; 7 -> 3f / 2f; 8 -> 9f / 16f; 9 -> 16f / 9f; 10 -> 2f; else -> 21f / 9f
                  }
                  return if (r == 0f) 0f else if (i("crop_swap") == 1) 1f / r else r
              }
              /** x, y, width, height of the crop box in image pixels. */
              fun cropRect(w: Int, h: Int): IntArray {
                  val ca = cropAspect()
                  if (ca <= 0f) return intArrayOf(0, 0, w, h)
                  val ia = w.toFloat() / h
                  var cw = w; var ch = h
                  if (ca > ia) ch = (w / ca).toInt() else cw = (h * ca).toInt()
                  cw = cw.coerceIn(1, w); ch = ch.coerceIn(1, h)
                  val x = ((w - cw) * (0.5f + i("crop_x") / 200f)).toInt().coerceIn(0, w - cw)
                  val y = ((h - ch) * (0.5f + i("crop_y") / 200f)).toInt().coerceIn(0, h - ch)
                  return intArrayOf(x, y, cw, ch)
              }
          }
