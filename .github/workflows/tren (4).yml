                          5 -> { val c = clip; if (c == null) snack("Nothing copied yet") else { Fx.applySnapshot(c); curLook = null; commitEdit(); afterBulk(); snack("Pasted") } }
                          6 -> resetAll()
                          7 -> AlertDialog.Builder(this).setTitle("Randomize").setItems(arrayOf("Subtle", "Medium", "Wild")) { _, s ->
                              Fx.randomize(floatArrayOf(0.5f, 1f, 1.6f)[s]); curLook = null; commitEdit(); afterBulk(); snack("Shuffled. Tap undo to go back")
