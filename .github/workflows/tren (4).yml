          package com.lumen.studio

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View

          /** Small translucent histogram drawn over the preview. data = red, green, blue, luma (each 64 bins, 0..1). */
          class HistView(ctx: Context) : View(ctx) {
              var data: Array<FloatArray>? = null
              var mode = 1
              private val bg = Paint().apply { color = 0x88000000.toInt() }
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(c: Canvas) {
                  val d = data ?: return
                  if (mode == 0) return
                  val w = width.toFloat(); val h = height.toFloat()
                  c.drawRoundRect(0f, 0f, w, h, 12f, 12f, bg)
                  val n = d[0].size
                  val bw = w / n
                  fun bars(a: FloatArray, col: Int) {
                      p.color = col
                      for (i in 0 until n) {
                          val bh = a[i] * (h - 8f)
                          c.drawRect(i * bw, h - 4f - bh, (i + 1) * bw, h - 4f, p)
                      }
                  }
                  if (mode == 1 || mode == 3) { bars(d[0], 0x66FF4444.toInt()); bars(d[1], 0x6644FF66.toInt()); bars(d[2], 0x664488FF.toInt()) }
                  if (mode == 2 || mode == 3) bars(d[3], 0x99FFFFFF.toInt())
              }
          }
