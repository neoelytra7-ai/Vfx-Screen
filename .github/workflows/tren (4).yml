              }

              // ------------------------------------------------------------------ tool panels
              private fun showTool(name: String) {
                  val changed = name != lastShownTool
                  lastShownTool = name
                  curTool = name
                  refreshers.clear()
                  panel.removeAllViews()
                  for ((n, c) in toolChips) {
                      val to = if (n == name) Color.WHITE else cMuted
                      if (c.currentTextColor != to) {
                          if (changed) ObjectAnimator.ofArgb(c, "textColor", c.currentTextColor, to).setDuration(240).start()
                          else c.setTextColor(to)
                      }
                  }
                  toolChips[name]?.let { moveIndicator(it, changed) }
                  when (name) {
                      "Looks" -> looksPanel()
                      "Favs" -> favsPanel()
                      "Search" -> searchPanel()
                      "HSL" -> hslPanel()
                      "Models" -> modelsPanel(panel)
                      else -> {
                          val items = Fx.tools[name] ?: emptyList()
                          val keys = items.filter { it !is Ac }.map { it.key }
                          if (keys.isNotEmpty()) panelHeader(name, keys)
                          for (s in items) buildRow(panel, s)
                      }
                  }
                  updateChips()
                  if (changed) { panelScroll?.scrollTo(0, 0); staggerIn() }
              }

              private fun panelHeader(title: String, keys: List<String>) {
                  val h = LinearLayout(this)
                  h.gravity = Gravity.CENTER_VERTICAL
                  h.setPadding(0, dp(10), 0, dp(2))
                  h.addView(tv(title, 16f, cText, true), lp(0, WC, 1f))
                  val r = tv("↺ Reset", 13f, cMuted).apply { setPadding(dp(12), dp(6), dp(4), dp(6)) }
                  r.setOnClickListener {
                      it.hap(HapticFeedbackConstants.VIRTUAL_KEY)
                      Fx.resetKeys(keys); commitEdit(); afterBulk()
                      snack("$title reset")
                  }
                  h.addView(r)
                  panel.addView(h, lp(MP, WC))
              }

              private fun paintLooks(animateName: String?) {
                  for ((n, c) in lookChips) {
                      val on = n == curLookName
                      c.background = if (on) GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(cAccent, cAccent2)).apply { cornerRadius = dp(14).toFloat() }
                                     else ripple(rr(0x14FFFFFF, 14), 14)
                      c.setTextColor(if (on) Color.WHITE else cText)
                      if (n == animateName) {
                          c.scaleX = 0.86f; c.scaleY = 0.86f
                          c.animate().scaleX(1f).scaleY(1f).setStartDelay(0).setDuration(380).setInterpolator(OvershootInterpolator(3.2f)).start()
                      }
                  }
              }

              private fun lookChip(name: String, map: Map<String, Int>, deletable: Boolean): TextView {
                  val c = tv(name, 13f, cText).apply { setPadding(dp(14), dp(9), dp(14), dp(9)); background = ripple(rr(0x14FFFFFF, 14), 14) }
                  press(c)
                  lookChips.add(name to c)
                  c.setOnClickListener {
                      it.hap(HapticFeedbackConstants.VIRTUAL_KEY)
                      curLook = map; curLookName = name
                      Fx.applyMap(map, lookPct); commitEdit(); afterBulk()
                      paintLooks(name); pulseOn(it); snack(name)
                  }
                  if (deletable) c.setOnLongClickListener {
                      AlertDialog.Builder(this).setTitle("Delete look?").setMessage(name)
                          .setPositiveButton("Delete") { _, _ -> Fx.deleteLook(name); showTool("Looks") }
                          .setNegativeButton("Cancel", null).show()
                      true
                  }
                  return c
              }

              private fun lookRow(title: String, items: List<Pair<String, Map<String, Int>>>, deletable: Boolean) {
                  panel.addView(tv(title, 11f, cMuted, true).apply { setPadding(dp(2), dp(12), 0, dp(4)) })
                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  val row = LinearLayout(this)
                  for ((n, m) in items) row.addView(lookChip(n, m, deletable), lp(WC, WC).apply { rightMargin = dp(8) })
                  hs.addView(row)
                  panel.addView(hs, lp(MP, WC))
              }

              private fun looksPanel() {
                  lookChips.clear()
                  panel.addView(tv("Looks", 16f, cText, true).apply { setPadding(0, dp(10), 0, dp(4)) })
                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val pill = tv("$lookPct%", 12f, cAccent2, true).apply { setPadding(dp(9), dp(3), dp(9), dp(3)); background = rr(tint(0x22), 10) }
                  top.addView(tv("Look strength", 14f), lp(0, WC, 1f))
                  top.addView(pill)
                  panel.addView(top, lp(MP, WC))
                  val fs = FluidSlider(this)
                  fs.configure(0, 100, 100, cAccent, cAccent2, cTrack) { "$it%" }
                  fs.setValue(lookPct, false)
                  fs.onChange = { v ->
                      lookPct = v; pill.text = "$v%"
                      val m = curLook
                      if (m != null) { Fx.applyMap(m, v); afterBulk() }
                  }
                  fs.onStop = { commitEdit() }
                  panel.addView(fs, lp(MP, WC))
                  val save = tv("+ Save current edits as a look", 13f, cAccent2, true).apply {
                      gravity = Gravity.CENTER; setPadding(0, dp(11), 0, dp(11))
                      background = ripple(rr(tint(0x14), 14, tint(0x33)), 14)
                  }
                  press(save)
                  save.setOnClickListener { saveLookDialog() }
                  panel.addView(save, lp(MP, WC).apply { topMargin = dp(6) })
                  val mine = Fx.customLooks()
                  if (mine.isNotEmpty()) lookRow("MY LOOKS  (long-press to delete)", mine.entries.map { it.key to it.value }, true)
                  for ((g, names) in Fx.presetGroups) lookRow(g.uppercase(Locale.US), names.mapNotNull { n -> Fx.presets[n]?.let { n to it } }, false)
                  paintLooks(null)
              }

              private fun favsPanel() {
                  panel.addView(tv("Favorites", 16f, cText, true).apply { setPadding(0, dp(10), 0, dp(4)) })
                  val l = Fx.favs()
                  if (l.isEmpty()) {
                      panel.addView(tv("Long-press the name of any setting to pin it here for quick access.", 13f, cMuted).apply { setPadding(0, dp(8), 0, dp(8)) })
                      return
                  }
                  for (k in l) {
                      val s = Fx.find(k) ?: continue
                      panel.addView(tv(tabOf(k), 10f, cMuted).apply { setPadding(0, dp(8), 0, 0) })
                      buildRow(panel, s)
                  }
              }

              private fun tabOf(k: String): String {
                  val e = Fx.tools.entries.firstOrNull { en -> en.value.any { it.key == k } }
                  if (e != null) return e.key
                  val b = k.substringAfterLast('_').toIntOrNull() ?: return ""
                  return "HSL " + BANDS[b.coerceIn(0, 7)]
              }

              private fun searchPanel() {
                  panel.addView(tv("Search settings", 16f, cText, true).apply { setPadding(0, dp(10), 0, dp(6)) })
                  val et = EditText(this)
                  et.hint = "e.g. grain, blur, curve, crop…"
                  et.setHintTextColor(cMuted); et.setTextColor(cText); et.textSize = 15f
                  et.background = rr(0x14FFFFFF, 14)
                  et.setPadding(dp(14), dp(10), dp(14), dp(10))
                  et.setSingleLine(true)
                  et.inputType = InputType.TYPE_CLASS_TEXT
                  val res = LinearLayout(this)
                  res.orientation = LinearLayout.VERTICAL
                  fun fill(q: String) {
                      res.removeAllViews(); refreshers.clear()
                      val w = q.trim().lowercase(Locale.US)
                      if (w.length < 2) return
                      var n = 0
                      for ((tab, items) in Fx.tools) for (s in items) {
                          if (s.title.lowercase(Locale.US).contains(w) || tab.lowercase(Locale.US).contains(w)) {
                              res.addView(tv(tab, 10f, cMuted).apply { setPadding(0, dp(8), 0, 0) })
                              buildRow(res, s)
                              n++
                              if (n >= 25) return
                          }
                      }
                      if (n == 0) res.addView(tv("No settings found", 13f, cMuted).apply { setPadding(0, dp(10), 0, 0) })
                  }
                  et.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) { fill(s?.toString() ?: "") }
                      override fun beforeTextChanged(a: CharSequence?, b: Int, c: Int, d: Int) {}
                      override fun onTextChanged(a: CharSequence?, b: Int, c: Int, d: Int) {}
                  })
                  panel.addView(et, lp(MP, WC))
                  panel.addView(res, lp(MP, WC))
              }

              private fun hslPanel() {
                  panel.addView(tv("HSL", 16f, cText, true).apply { setPadding(0, dp(10), 0, dp(8)) })
                  val cols = intArrayOf(0xFFEF4444.toInt(), 0xFFF97316.toInt(), 0xFFEAB308.toInt(), 0xFF22C55E.toInt(), 0xFF06B6D4.toInt(), 0xFF3B82F6.toInt(), 0xFFA855F7.toInt(), 0xFFEC4899.toInt())
                  val chipRow = LinearLayout(this)
                  val body = LinearLayout(this)
                  body.orientation = LinearLayout.VERTICAL
                  val dots = ArrayList<View>()
                  fun fill() {
                      body.removeAllViews()
                      refreshers.clear()
                      for (i in 0..7) {
                          dots[i].animate().scaleX(if (i == band) 1.25f else 1f).scaleY(if (i == band) 1.25f else 1f).alpha(if (i == band) 1f else 0.5f).setDuration(160).start()
                      }
                      body.addView(tv(BANDS[band], 14f, cols[band], true).apply { setPadding(0, dp(8), 0, 0) })
                      for (s in Fx.hsl) if (s.key.endsWith("_$band")) buildRow(body, s)
                  }
                  for (i in 0..7) {
                      val d = View(this)
                      d.background = rr(cols[i], 14)
                      d.setOnClickListener { it.hap(HapticFeedbackConstants.CLOCK_TICK); band = i; fill() }
                      dots.add(d)
                      chipRow.addView(d, lp(dp(30), dp(30)).apply { rightMargin = dp(10) })
                  }
                  panel.addView(chipRow)
                  panel.addView(body)
                  fill()
              }

              private fun buildRow(parent: LinearLayout, s: S) {
                  when (s) {
                      is Sl -> slider(parent, s)
                      is Tg -> toggle(parent, s)
                      is Ch -> choice(parent, s)
                      is Ac -> action(parent, s)
                  }
              }

              private fun spin(v: View) {
                  v.animate().rotationBy(-360f).setDuration(380).setInterpolator(DecelerateInterpolator()).start()
                  v.hap(HapticFeedbackConstants.VIRTUAL_KEY)
              }

              private fun favHook(t: TextView, key: String) {
                  if (Fx.isFav(key)) t.setTextColor(cAccent2)
                  t.setOnLongClickListener {
                      val on = Fx.toggleFav(key)
                      t.setTextColor(if (on) cAccent2 else cText)
                      t.hap(HapticFeedbackConstants.LONG_PRESS)
                      snack(if (on) "Pinned to Favorites" else "Removed from Favorites")
                      if (curTool == "Favs") showTool("Favs")
                      true
                  }
              }

              private fun slider(parent: LinearLayout, s: Sl) {
                  val wrap = LinearLayout(this)
                  wrap.orientation = LinearLayout.VERTICAL
                  wrap.setPadding(0, dp(8), 0, 0)
                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val pill = tv("", 12f, cAccent2, true).apply { setPadding(dp(9), dp(3), dp(9), dp(3)); background = rr(tint(0x22), 10) }
                  val reset = tv("↺", 19f, cMuted).apply { setPadding(dp(12), 0, dp(2), 0) }
                  val title = tv(s.title, 14f)
                  favHook(title, s.key)
                  top.addView(title, lp(0, WC, 1f))
                  top.addView(pill); top.addView(reset)
                  val fs = FluidSlider(this)
                  fs.configure(s.min, s.max, s.def, cAccent, cAccent2, cTrack) { s.show(it) }
                  fs.setValue(Fx.i(s.key), false)
                  fun upd() {
                      pill.text = s.show(Fx.i(s.key))
                      val nd = !Fx.isDefault(s.key)
                      pill.background = rr(if (nd) tint(0x44) else 0x14FFFFFF, 10)
                      reset.animate().alpha(if (nd) 1f else 0f).setStartDelay(0).setDuration(160).start()
                      reset.isClickable = nd
                  }
                  pill.text = s.show(Fx.i(s.key))
                  pill.background = rr(if (Fx.isDefault(s.key)) 0x14FFFFFF else tint(0x44), 10)
                  reset.alpha = if (Fx.isDefault(s.key)) 0f else 1f
                  reset.isClickable = !Fx.isDefault(s.key)
                  fs.onChange = { v -> Fx.set(s.key, v); pop(pill); upd(); onParam(s.key) }
                  fs.onTick = {
                      val now = SystemClock.uptimeMillis()
                      if (now - lastTick > 40) { lastTick = now; fs.hap(HapticFeedbackConstants.CLOCK_TICK) }
                  }
                  fs.onSnap = { lastTick = SystemClock.uptimeMillis(); fs.hap(HapticFeedbackConstants.LONG_PRESS) }
                  fs.onStop = { commitEdit() }
                  val refreshRow: () -> Unit = { fs.setValue(Fx.i(s.key), true); upd() }
                  refreshers.add(refreshRow)
                  pill.setOnClickListener { askValue(s) { v -> Fx.set(s.key, v); onParam(s.key); commitEdit(); refreshRow() } }
                  reset.setOnClickListener { spin(it); Fx.resetKey(s.key); onParam(s.key); commitEdit(); refreshRow() }
                  wrap.addView(top, lp(MP, WC))
                  wrap.addView(fs, lp(MP, WC))
                  parent.addView(wrap, lp(MP, WC))
              }

              private fun toggle(parent: LinearLayout, s: Tg) {
                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(0, dp(8), 0, dp(4))
                  val reset = tv("↺", 19f, cMuted).apply { setPadding(dp(4), 0, dp(12), 0) }
                  val sw = FluidSwitch(this)
                  sw.setAccent(cAccent2)
                  val title = tv(s.title, 14f)
                  favHook(title, s.key)
                  row.addView(title, lp(0, WC, 1f))
                  row.addView(reset); row.addView(sw)
                  sw.setChecked(Fx.i(s.key) == 1, false)
                  reset.alpha = if (Fx.isDefault(s.key)) 0f else 1f
                  reset.isClickable = !Fx.isDefault(s.key)
                  fun upd() {
                      val show = !Fx.isDefault(s.key)
                      reset.animate().alpha(if (show) 1f else 0f).setStartDelay(0).setDuration(160).start()
                      reset.isClickable = show
                  }
                  sw.onToggle = { on ->
                      Fx.set(s.key, if (on) 1 else 0)
                      sw.hapToggle(on)
                      upd(); onParam(s.key); commitEdit()
                  }
                  row.setOnClickListener { sw.flip() }
                  val refreshRow: () -> Unit = { sw.setChecked(Fx.i(s.key) == 1, true); upd() }
                  refreshers.add(refreshRow)
                  reset.setOnClickListener { spin(it); Fx.resetKey(s.key); onParam(s.key); commitEdit(); refreshRow() }
                  parent.addView(row, lp(MP, WC))
              }

              private fun choice(parent: LinearLayout, s: Ch) {
                  val wrap = LinearLayout(this)
                  wrap.orientation = LinearLayout.VERTICAL
                  wrap.setPadding(0, dp(10), 0, dp(4))
                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val reset = tv("↺", 19f, cMuted).apply { setPadding(dp(12), 0, dp(2), 0) }
                  val title = tv(s.title, 14f)
                  favHook(title, s.key)
                  top.addView(title, lp(0, WC, 1f))
                  top.addView(reset)
                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  val row = LinearLayout(this)
                  val items = ArrayList<TextView>()
                  fun paintChips(sel: Int, animate: Boolean) {
                      for ((k, c) in items.withIndex()) {
                          val on = k == sel
                          c.background = rr(if (on) cAccent else 0x14FFFFFF, 16)
                          c.setTextColor(if (on) Color.WHITE else cMuted)
                      }
                      if (animate && sel in items.indices) {
                          val c = items[sel]
                          c.scaleX = 0.88f; c.scaleY = 0.88f
                          c.animate().scaleX(1f).scaleY(1f).setDuration(280).setInterpolator(OvershootInterpolator(3f)).start()
                      }
                  }
                  fun upd() {
                      val show = !Fx.isDefault(s.key)
                      reset.animate().alpha(if (show) 1f else 0f).setDuration(160).start()
                      reset.isClickable = show
                  }
                  s.options.forEachIndexed { i, name ->
                      val c = tv(name, 13f, cMuted).apply { setPadding(dp(14), dp(8), dp(14), dp(8)) }
                      c.setOnClickListener {
                          Fx.set(s.key, i)
                          it.hap(HapticFeedbackConstants.VIRTUAL_KEY)
                          paintChips(i, true); upd(); onParam(s.key); commitEdit()
                      }
                      items.add(c)
                      row.addView(c, lp(WC, WC).apply { rightMargin = dp(8) })
                  }
                  paintChips(Fx.i(s.key), false)
                  reset.alpha = if (Fx.isDefault(s.key)) 0f else 1f
                  reset.isClickable = !Fx.isDefault(s.key)
                  val refreshRow: () -> Unit = { paintChips(Fx.i(s.key), true); upd() }
                  refreshers.add(refreshRow)
                  reset.setOnClickListener { spin(it); Fx.resetKey(s.key); onParam(s.key); commitEdit(); refreshRow() }
                  hs.addView(row)
                  wrap.addView(top, lp(MP, WC))
                  wrap.addView(hs, lp(MP, WC).apply { topMargin = dp(6) })
                  parent.addView(wrap, lp(MP, WC))
              }

              private fun action(parent: LinearLayout, s: Ac) {
                  val b = tv(s.title, 14f, cAccent2, true).apply {
                      gravity = Gravity.CENTER; setPadding(0, dp(13), 0, dp(13))
                      background = ripple(rr(tint(0x14), 14, tint(0x33)), 14)
                  }
                  press(b)
                  b.setOnClickListener { it.hap(HapticFeedbackConstants.VIRTUAL_KEY); pulseOn(it); act(s.key) }
                  parent.addView(b, lp(MP, WC).apply { topMargin = dp(10); bottomMargin = dp(4) })
              }

              // ------------------------------------------------------------------ models panel
              private fun modelsPanel(parent: LinearLayout) {
                  for (m in Models.list) {
                      val box = LinearLayout(this)
                      box.orientation = LinearLayout.VERTICAL
                      box.setPadding(0, dp(12), 0, dp(4))
                      box.addView(tv(m.name, 14f))
                      val ready = Models.ready(this, m.id)
                      val lbl = tv(if (ready) "Ready  •  ${m.mb} MB" else "Not downloaded  •  ${m.mb} MB", 12f, if (ready) cOk else cMuted)
                      lbl.setPadding(0, dp(2), 0, dp(6))
                      box.addView(lbl)
                      val btns = LinearLayout(this)
                      fun mini(t: String): TextView = tv(t, 13f, cAccent2, true).apply {
                          setPadding(dp(16), dp(9), dp(16), dp(9)); background = ripple(rr(tint(0x14), 12, tint(0x33)), 12)
                      }
                      val dl = mini(if (ready) "Re-download" else "Download"); press(dl)
                      dl.setOnClickListener {
                          it.hap(HapticFeedbackConstants.VIRTUAL_KEY)
                          lbl.setTextColor(cMuted); lbl.text = "Downloading 0%"
                          Thread {
                              val err = Models.download(this, m.id) { p -> ui.post { lbl.text = "Downloading $p%" } }
                              ui.post {
                                  if (err == null) { lbl.setTextColor(cOk); lbl.text = "Ready  •  ${m.mb} MB"; snack("${m.name} ready") }
                                  else { lbl.setTextColor(cWarn); lbl.text = "Failed: $err. Use Import instead." }
                              }
                          }.start()
                      }
                      val imp = mini("Import file"); press(imp)
                      imp.setOnClickListener { pendingModel = m.id; pick(R_MODEL, "*/*") }
                      btns.addView(dl, lp(WC, WC).apply { rightMargin = dp(8) })
                      btns.addView(imp)
                      box.addView(btns)
                      parent.addView(box, lp(MP, WC))
                  }
              }

              // ------------------------------------------------------------------ actions
              private fun armTap(mode: Int, msg: String) {
                  if (src == null) { snack("Open a photo first"); return }
                  tapMode = mode
                  snack(msg); status(msg)
              }

              private fun act(k: String) {
                  when (k) {
                      "act_auto" -> {
                          val s = src ?: return
                          Match.auto(s).forEach { (key, v) -> Fx.set(key, v) }
                          commitEdit(); afterBulk(); snack("Auto enhance applied")
                      }
                      "act_autolv" -> {
                          val s = src ?: return
                          Match.autoLevels(s).forEach { (key, v) -> Fx.set(key, v) }
                          commitEdit(); afterBulk(); snack("Levels set from the histogram")
                      }
                      "act_awb" -> {
                          val s = src ?: return
                          Match.awb(s).forEach { (key, v) -> Fx.set(key, v) }
                          commitEdit(); afterBulk(); snack("White balance corrected")
                      }
                      "act_wb_pick" -> armTap(1, "Tap a spot that should be neutral gray or white")
                      "act_focus_pick" -> { if (depth == null) snack("Generate a depth map first") else armTap(2, "Tap the subject that should be in focus") }
                      "act_light_pick" -> { if (depth == null) snack("Generate a depth map first") else armTap(3, "Tap where the light should come from") }
                      "act_rad_pick" -> armTap(4, "Tap the center of the radial filter")
                      "act_blur_pick" -> armTap(5, "Tap the center of the blur")
                      "act_flare_pick" -> armTap(6, "Tap where the flare should sit")
                      "act_lut" -> pick(R_LUT, "*/*")
                      "act_lut_clear" -> { lutArr = null; lutN = 0; gl?.r?.setLut(null, 0); pushParams(); snack("LUT removed") }
                      "act_depth" -> doDepth()
                      "act_play" -> togglePlay()
                      "act_video" -> doVideo()
                      "act_cut" -> doCutout()
                      "act_cut_clear" -> {
                          maskBase = null; maskOut = null; maskGuide = null
                          gl?.r?.setMask(null, 0, 0)
                          Fx.set("mask_mode", 0)
                          pushParams(); showTool(curTool); snack("Cutout cleared")
                      }
                      "act_png" -> exportPng()
                      "act_subject" -> { if (src == null) snack("Open a photo first") else pick(R_SUBJ) }
                      "act_apply" -> applyCompose()
                      "act_match" -> { if (src == null) snack("Open a photo first") else pick(R_REF) }
                      "act_cube" -> {
                          val r = matchRes
                          if (r == null) snack("Run a match first")
                          else ai.execute {
                              val uri = Img.saveText(this, "Lumen_match.cube", Match.bakeCube(r.theta, r.lut, r.lutN))
                              status(if (uri != null) "LUT saved to Download/Lumen" else "Save failed")
                          }
                      }
                      "act_cube_cur" -> {
                          val th = DoubleArray(GradeCpu.N) { Fx.f(GradeCpu.KEYS[it]).toDouble() }
                          val lut = lutArr; val ln = lutN
                          ai.execute {
                              val uri = Img.saveText(this, "Lumen_grade.cube", Match.bakeCube(th, lut, ln))
                              status(if (uri != null) "Grade saved to Download/Lumen (tone, color, HSL, balance and LUT)" else "Save failed")
                          }
                      }
                      "act_wm_text" -> askText("Watermark text", "Your name or @handle", Fx.str("wm_text", "")) { txt ->
                          Fx.setStr("wm_text", txt.trim())
                          if (txt.isNotBlank()) Fx.set("wm_on", 1)
                          refreshers.forEach { it() }
                          snack(if (txt.isBlank()) "Watermark text cleared" else "Watermark set")
                      }
                      "act_info" -> showInfo()
                      "act_summary" -> showSummary()
                  }
              }

              override fun onActivityResult(rc: Int, res: Int, data: Intent?) {
                  super.onActivityResult(rc, res, data)
                  val uri = data?.data ?: return
                  if (res != RESULT_OK) return
                  when (rc) {
                      R_MAIN -> {
                          snack("Loading photo…")
                          ai.execute {
                              try {
                                  val b = Img.decode(this, uri, maxRes())
                                  ui.post {
                                      src = b; depth = null; maskBase = null; maskOut = null; maskGuide = null
                                      subject = null; composeBase = null; lutArr = null; lutN = 0; matchRes = null
                                      Fx.resetEdits(); Fx.initHistory(); curLook = null
                                      if (!inEditor) showEditor() else { pushAll(); gl?.resetView(); showTool(curTool); revealImage() }
                                      status("${b.width} × ${b.height}")
                                  }
                              } catch (e: Throwable) { ui.post { snack("Could not open photo") } }
                          }
                      }
                      R_REF -> {
                          status("Loading reference…")
                          runAi {
                              val ref = Img.decode(this, uri, 1024)
                              doMatch(ref)
                          }
                      }
                      R_SUBJ -> {
                          status("Loading subject…")
                          runAi { doSubject(Img.decode(this, uri, 2048)) }
                      }
                      R_LUT -> ai.execute {
                          val p = contentResolver.openInputStream(uri)?.use { Img.parseCube(it) }
                          ui.post {
                              if (p == null) snack("Not a valid .cube LUT")
                              else { lutArr = p.first; lutN = p.second; gl?.r?.setLut(p.first, p.second); Fx.set("lut_amt", 100); pushParams(); showTool(curTool); snack("LUT loaded") }
                          }
                      }
                      R_PRESET -> ai.execute {
                          val txt = try { contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } } catch (e: Throwable) { null }
                          ui.post {
                              val n = if (txt == null) -1 else Fx.load(txt)
                              if (n < 0) snack("Not a Lumen settings file") else { curLook = null; commitEdit(); afterBulk(); snack("Loaded $n settings") }
                          }
                      }
                      R_MODEL -> ai.execute {
                          val err = Models.import(this, pendingModel, uri)
                          ui.post { snack(if (err == null) "Model imported" else "Import failed"); if (curTool == "Models") showTool("Models") }
                      }
                  }
              }

              // ---- cutout
              private fun doCutout() {
                  val s = src ?: run { snack("Open a photo first"); return }
                  val hq = Fx.i("cut_model") == 1
                  if (!Models.ready(this, if (hq) "isnet" else "u2netp")) { need(""); return }
                  status("Segmenting subject…")
                  runAi {
                      val a = Cutout.run(this, s, hq)
                      val d = Cutout.maskDims(s.width, s.height)
                      maskBase = a; mw = d[0]; mh = d[1]
                      maskGuide = Img.gray(s, mw, mh)
                      refineNow()
                      ui.post {
                          if (Fx.i("mask_mode") == 0) Fx.set("mask_mode", 1)
                          pushParams(); showTool(curTool)
                          status("Cutout ready. Refine below or brush to fix edges")
                      }
                  }
              }

              private fun refineNow() {
                  val b = maskBase ?: return
                  val o = Img.refine(b, mw, mh, maskGuide, Fx.i("cut_smooth"), Fx.i("cut_contrast") / 100f, Fx.i("cut_shift"), Fx.i("cut_feather"))
                  if (Fx.i("cut_invert") == 1) for (i in o.indices) o[i] = (255 - (o[i].toInt() and 255)).toByte()
                  maskOut = o
                  gl?.r?.setMask(o, mw, mh)
              }

              private fun brush(u: Float, v: Float, phase: Int) {
                  if (phase == 2) { ui.removeCallbacks(refineTask); ui.postDelayed(refineTask, 150); return }
                  val g = gl ?: return
                  val s = src ?: return
                  if (maskBase == null) {
                      val d = Cutout.maskDims(s.width, s.height)
                      mw = d[0]; mh = d[1]
                      maskBase = FloatArray(mw * mh) { 1f }
                      maskOut = ByteArray(mw * mh) { 255.toByte() }
                      maskGuide = Img.gray(s, mw, mh)
                      if (Fx.i("mask_mode") == 0) { Fx.set("mask_mode", 1); pushParams() }
                  }
                  val base = maskBase!!; val out = maskOut!!
                  val cx = u * mw; val cy = v * mh
                  val rm = max(1f, Fx.i("brush_size") / 2f * g.imgPerScreen() * mw / s.width)
                  val erase = Fx.i("brush_mode") == 0
                  val x0 = max(0, (cx - rm).toInt()); val x1 = min(mw - 1, (cx + rm).toInt() + 1)
                  val y0 = max(0, (cy - rm).toInt()); val y1 = min(mh - 1, (cy + rm).toInt() + 1)
                  for (y in y0..y1) for (x in x0..x1) {
                      val d = hypot(x - cx, y - cy)
                      if (d > rm) continue
                      val cov = ((1f - d / rm) / 0.35f).coerceIn(0f, 1f)
                      val i = y * mw + x
                      if (erase) base[i] = base[i] * (1f - cov) else base[i] = max(base[i], cov)
                      out[i] = (base[i] * 255f).toInt().toByte()
                  }
                  val now = SystemClock.uptimeMillis()
                  if (now - lastMaskUp > 40) { lastMaskUp = now; g.r.setMask(out.copyOf(), mw, mh) }
              }

              private fun exportPng() {
                  val s = src ?: return
                  val g = gl ?: return
                  if (maskBase == null) { snack("Cut out a subject first"); return }
                  status("Rendering cutout…")
                  runAi {
                      val w = g.r.imgW; val h = g.r.imgH
                      val buf = g.r.exportFrame(w, h, 0f, 0f, 0f, false, true)
                      if (buf == null) { status("Render failed"); return@runAi }
                      var bmp = Img.bufToBitmap(buf, w, h)
                      if (Fx.i("cut_decon") == 1 && max(w, h) <= 3072) bmp = Compose.decontaminateBitmap(bmp)
                      bmp = Img.postProcess(bmp)
                      val uri = Img.saveAs(this, bmp, 1, 100)
                      status(if (uri != null) "Saved PNG to Pictures/Lumen" else "Save failed")
                  }
              }

              // ---- depth + parallax
              private fun doDepth() {
                  val s = src ?: run { snack("Open a photo first"); return }
                  if (!Models.ready(this, "depth")) { need("depth"); return }
                  status("Estimating depth…")
                  runAi {
                      val r = Depth.run(this, s)
                      depth = r.data; dw = r.w; dh = r.h
                      gl?.r?.setDepth(r.data, r.w, r.h)
                      ui.post { pushParams(); status("Depth ready. Try Lens blur, Fog, Relight or Parallax") }
                  }
              }

              private val playTick: Runnable = object : Runnable {
                  override fun run() {
                      if (!playing) return
                      val g = gl ?: return
                      val t = ((SystemClock.uptimeMillis() - playT0) / 1000f / Fx.i("px_dur")) % 1f
                      val c = Video.camFx(Fx.i("px_preset"), t)
                      g.r.camX = c[0]; g.r.camY = c[1]; g.r.camZ = c[2]; g.r.camOn = true
                      g.requestRender()
                      ui.postDelayed(this, 16)
                  }
              }

              private fun togglePlay() {
                  if (depth == null) { snack("Generate a depth map first"); return }
                  if (playing) { stopPreview(); return }
                  playing = true; playT0 = SystemClock.uptimeMillis()
                  ui.post(playTick)
              }

              private fun stopPreview() {
                  playing = false
                  ui.removeCallbacks(playTick)
                  val g = gl ?: return
                  g.r.camOn = Fx.i("px_tilt") == 1 && depth != null
                  if (!g.r.camOn) { g.r.camX = 0f; g.r.camY = 0f; g.r.camZ = 0f }
                  g.requestRender()
              }

              private fun startSensor() {
                  val sm = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val a = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER) ?: return
                  sInit = false
                  sm.registerListener(this, a, SensorManager.SENSOR_DELAY_GAME)
              }

              private fun stopSensor() {
                  (getSystemService(Context.SENSOR_SERVICE) as SensorManager).unregisterListener(this)
                  if (!playing) { gl?.r?.camOn = false; gl?.requestRender() }
              }

              override fun onSensorChanged(e: SensorEvent) {
                  val x = (-e.values[0] / 9.81f).coerceIn(-1f, 1f)
                  val y = (e.values[1] / 9.81f).coerceIn(-1f, 1f)
                  if (!sInit) { fX = x; sX = x; fY = y; sY = y; sInit = true }
                  fX += (x - fX) * 0.15f; sX += (x - sX) * 0.01f
                  fY += (y - fY) * 0.15f; sY += (y - sY) * 0.01f
                  if (playing) return
                  val g = gl ?: return
                  g.r.camX = ((fX - sX) * 4f).coerceIn(-1f, 1f)
                  g.r.camY = ((fY - sY) * 4f).coerceIn(-1f, 1f)
                  g.r.camZ = 0f
                  g.r.camOn = depth != null
                  g.requestRender()
              }

              override fun onAccuracyChanged(s: Sensor?, a: Int) {}

              private fun doVideo() {
                  val g = gl ?: return
                  if (depth == null) { snack("Generate a depth map first"); return }
                  val long = if (Fx.i("px_res") == 1) 1920 else 1280
                  val iw = g.r.imgW; val ih = g.r.imgH
                  val s = long.toFloat() / max(iw, ih)
                  val w = max(2, (iw * s).roundToInt() and 1.inv())
                  val h = max(2, (ih * s).roundToInt() and 1.inv())
                  stopPreview()
                  status("Rendering video…")
                  runAi {
                      val uri = Video.export(this, g.r, w, h, intArrayOf(24, 30, 60)[Fx.i("px_fps").coerceIn(0, 2)], Fx.i("px_dur"), Fx.i("px_preset"), floatArrayOf(0.5f, 1f, 1.8f, 3f)[Fx.i("px_bitrate").coerceIn(0, 3)]) { p -> status("Rendering video $p%") }
                      status(if (uri != null) "Saved to Movies/Lumen" else "Video export failed")
                  }
              }

              // ---- reference grade matching
              private fun doMatch(ref: Bitmap) {
                  val s = src ?: return
                  val res = Match.run(s, ref, Fx.i("mt_iter"), Fx.i("mt_refine") == 1) { m -> status(m) }
                  matchRes = res
                  ui.post {
                      Fx.resetEdits()
                      for ((i, key) in GradeCpu.KEYS.withIndex()) {
                          val lim = if (key == "exposure") 300 else 100
                          Fx.set(key, (res.theta[i] * 100).roundToInt().coerceIn(-lim, lim))
                      }
                      if (res.lut != null) { lutArr = res.lut; lutN = res.lutN; gl?.r?.setLut(res.lut, res.lutN); Fx.set("lut_amt", 100) }
                      else { lutArr = null; lutN = 0; gl?.r?.setLut(null, 0) }
                      curLook = null; commitEdit(); afterBulk()
                      status("Matched. Sliders now hold the look (fit error ${"%.3f".format(res.rmse)}). Tweak any of them")
                  }
              }

              // ---- compose / harmonise
              private fun doSubject(bmp: Bitmap) {
                  val base = src ?: return
                  val hq = Fx.i("cut_model") == 1
                  if (!Models.ready(this, if (hq) "isnet" else "u2netp")) { need(""); return }
                  status("Cutting out subject…")
                  val a = Cutout.run(this, bmp, hq)
                  val d = Cutout.maskDims(bmp.width, bmp.height)
                  val guide = Img.gray(bmp, d[0], d[1])
                  val ab = Img.refine(a, d[0], d[1], guide, 4, 0.35f, 0, 1)
                  val af = FloatArray(ab.size) { (ab[it].toInt() and 255) / 255f }
                  subject = Compose.makeSubject(bmp, af, d[0], d[1], true)
                  composeBase = base
                  composePreviewNow()
                  ui.post { status("Subject placed. Move, scale and harmonise it, then tap Apply") }
              }

              private fun composePreviewNow() {
                  val base = composeBase ?: return
                  val sj = subject ?: return
                  val out = Compose.compose(Img.scaleMax(base, 1280), sj)
                  ui.post { gl?.r?.setImage(out) }
              }

              private fun applyCompose() {
                  val base = composeBase ?: run { snack("Pick a subject first"); return }
                  val sj = subject ?: return
                  status("Rendering composition…")
                  runAi {
                      val fin = Compose.compose(Img.scaleMax(base, 2048), sj)
                      src = fin; subject = null; composeBase = null
                      depth = null; maskBase = null; maskOut = null
                      ui.post { pushAll(); status("Composition applied") }
                  }
              }

              // ---- export
              private fun askExport() {
                  if (src == null) { snack("Open a photo first"); return }
                  if (subject != null) { snack("Apply the composition first"); return }
                  val fmts = arrayOf("JPEG", "PNG", "WebP")
                  val items = arrayOf("Export now (" + fmts[Fx.i("exp_fmt").coerceIn(0, 2)] + ", saved settings)", "JPEG", "PNG", "WebP")
                  AlertDialog.Builder(this).setTitle("Export").setItems(items) { _, which -> exportMain(which - 1) }.show()
              }

              /** fmtOv: -1 uses the saved format, otherwise 0 JPEG, 1 PNG, 2 WebP. */
              private fun exportMain(fmtOv: Int) {
                  val g = gl ?: return
                  status("Rendering full resolution…")
                  runAi {
                      var transparent = false
                      val old = g.r.maskMode
                      if (maskBase != null) {
                          if (old == 1) transparent = true
                          if (old == 0 || old == 6) g.r.maskMode = 0
                      }
                      val w = g.r.imgW; val h = g.r.imgH
                      val buf = g.r.exportFrame(w, h, 0f, 0f, 0f, false, transparent)
                      g.r.maskMode = old
                      if (buf == null) { status("Render failed"); return@runAi }
                      var bmp = Img.bufToBitmap(buf, w, h)
                      bmp = Img.postProcess(bmp)
                      var fmt = if (fmtOv >= 0) fmtOv else Fx.i("exp_fmt")
                      if (transparent) fmt = 1
                      val uri = Img.saveAs(this, bmp, fmt, Fx.i("jpg_q"))
                      status(if (uri != null) "Saved ${bmp.width} × ${bmp.height} to Pictures/Lumen" else "Save failed")
                      if (uri != null && Fx.i("exp_share") == 1) {
                          val mime = when (fmt) { 1 -> "image/png"; 2 -> "image/webp"; else -> "image/jpeg" }
                          ui.post { share(uri, mime) }
                      }
                  }
              }

