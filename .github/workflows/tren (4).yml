          package com.lumen.studio

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Matrix
          import android.graphics.Paint
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sqrt

          object Compose {
              class Subject(val bmp: Bitmap)

              /** Blur-fusion foreground colour estimation: removes the old background colour from semi-transparent edges. */
              fun decontaminate(r: FloatArray, g: FloatArray, b: FloatArray, a: FloatArray, w: Int, h: Int, rad: Int) {
                  val n = w * h
                  val ia = FloatArray(n) { 1f - a[it] }
                  val ba = Img.box(a, w, h, rad)
                  val bia = Img.box(ia, w, h, rad)
                  for (ch in arrayOf(r, g, b)) {
                      val bca = Img.box(FloatArray(n) { ch[it] * a[it] }, w, h, rad)
                      val bcia = Img.box(FloatArray(n) { ch[it] * ia[it] }, w, h, rad)
                      for (i in 0 until n) {
                          if (a[i] <= 0f) continue
                          val fg = bca[i] / max(ba[i], 1e-3f)
                          val bgc = bcia[i] / max(bia[i], 1e-3f)
                          ch[i] = (fg + a[i] * (ch[i] - a[i] * fg - (1f - a[i]) * bgc)).coerceIn(0f, 1f)
                      }
                  }
              }

              fun decontaminateBitmap(bmp: Bitmap): Bitmap {
                  val w = bmp.width; val h = bmp.height; val n = w * h
                  val px = IntArray(n)
                  bmp.getPixels(px, 0, w, 0, 0, w, h)
                  val a = FloatArray(n) { ((px[it] ushr 24) and 255) / 255f }
                  val r = FloatArray(n) { ((px[it] shr 16) and 255) / 255f }
                  val g = FloatArray(n) { ((px[it] shr 8) and 255) / 255f }
                  val b = FloatArray(n) { (px[it] and 255) / 255f }
                  decontaminate(r, g, b, a, w, h, 4)
                  for (i in 0 until n) {
                      px[i] = (px[i] and (255 shl 24)) or ((r[i] * 255f + 0.5f).toInt() shl 16) or ((g[i] * 255f + 0.5f).toInt() shl 8) or (b[i] * 255f + 0.5f).toInt()
                  }
                  val o = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  o.setPixels(px, 0, w, 0, 0, w, h)
                  return o
              }

              fun makeSubject(src: Bitmap, alpha: FloatArray, mw: Int, mh: Int, decon: Boolean): Subject {
                  val sc = Bitmap.createScaledBitmap(src, mw, mh, true)
                  val n = mw * mh
                  val px = IntArray(n)
                  sc.getPixels(px, 0, mw, 0, 0, mw, mh)
                  val r = FloatArray(n) { ((px[it] shr 16) and 255) / 255f }
                  val g = FloatArray(n) { ((px[it] shr 8) and 255) / 255f }
                  val b = FloatArray(n) { (px[it] and 255) / 255f }
                  if (decon) decontaminate(r, g, b, alpha, mw, mh, 4)
                  var x0 = mw; var y0 = mh; var x1 = 0; var y1 = 0
                  for (y in 0 until mh) for (x in 0 until mw) if (alpha[y * mw + x] > 0.03f) {
                      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y
                  }
                  if (x1 <= x0 || y1 <= y0) { x0 = 0; y0 = 0; x1 = mw - 1; y1 = mh - 1 }
                  val cw = x1 - x0 + 1; val ch = y1 - y0 + 1
                  val out = IntArray(cw * ch)
                  for (y in 0 until ch) for (x in 0 until cw) {
                      val i = (y + y0) * mw + (x + x0)
                      val a = (alpha[i].coerceIn(0f, 1f) * 255f + 0.5f).toInt()
                      out[y * cw + x] = (a shl 24) or ((r[i] * 255f + 0.5f).toInt() shl 16) or ((g[i] * 255f + 0.5f).toInt() shl 8) or (b[i] * 255f + 0.5f).toInt()
                  }
                  val bm = Bitmap.createBitmap(cw, ch, Bitmap.Config.ARGB_8888)
                  bm.setPixels(out, 0, cw, 0, 0, cw, ch)
                  return Subject(bm)
              }

              private fun ss(a: Float, b: Float, x: Float): Float { val t = ((x - a) / (b - a)).coerceIn(0f, 1f); return t * t * (3 - 2 * t) }

              /** Places the subject on the background, then harmonises colour, wraps light and casts a shadow. */
              fun compose(bg: Bitmap, sub: Subject): Bitmap {
                  val W = bg.width; val H = bg.height; val n = W * H
                  val sw = sub.bmp.width; val sh = sub.bmp.height
                  val sc = min(W.toFloat() / sw, H.toFloat() / sh) * Fx.i("hm_scale") / 100f * 0.8f
                  val m = Matrix()
                  m.postTranslate(-sw / 2f, -sh / 2f)
                  m.postScale(if (Fx.i("hm_flip") == 1) -sc else sc, sc)
                  m.postRotate(Fx.i("hm_rot").toFloat())
                  m.postTranslate(W * (0.5f + Fx.i("hm_x") / 200f), H * (0.5f + Fx.i("hm_y") / 200f))
                  val layer = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888)
                  Canvas(layer).drawBitmap(sub.bmp, m, Paint(Paint.FILTER_BITMAP_FLAG))
                  val lp = IntArray(n); layer.getPixels(lp, 0, W, 0, 0, W, H)
                  val bp = IntArray(n); bg.getPixels(bp, 0, W, 0, 0, W, H)
                  val A = FloatArray(n) { ((lp[it] ushr 24) and 255) / 255f }
                  val subSize = sc * max(sw, sh)

                  val fe = Fx.i("hm_feather")
                  val Af: FloatArray
                  if (fe > 0) {
                      val bl = Img.box(Img.box(A, W, H, fe), W, H, max(1, fe / 2))
                      Af = FloatArray(n) { A[it] * ss(0.35f, 1f, bl[it]) }
                  } else Af = A

                  // statistics: ring of background around the subject vs the subject itself
                  val ringR = max(4, (subSize * 0.25f).toInt())
                  val bA = Img.box(A, W, H, ringR)
                  val step = max(1, n / 60000)
                  val lab = DoubleArray(3)
                  val sB = DoubleArray(6); val sS = DoubleArray(6)  // sum x3, sum x^2 x3
                  var cB = 0; var cS = 0; var cAll = 0
                  val sAll = DoubleArray(6)
                  var i = 0
                  while (i < n) {
                      val p = bp[i]
                      Match.rgbToLab(((p shr 16) and 255) / 255.0, ((p shr 8) and 255) / 255.0, (p and 255) / 255.0, lab)
                      for (c in 0..2) { sAll[c] += lab[c]; sAll[3 + c] += lab[c] * lab[c] }
                      cAll++
                      if (bA[i] > 0.01f && A[i] < 0.02f) { for (c in 0..2) { sB[c] += lab[c]; sB[3 + c] += lab[c] * lab[c] }; cB++ }
                      if (A[i] > 0.5f) {
                          val q = lp[i]
                          Match.rgbToLab(((q shr 16) and 255) / 255.0, ((q shr 8) and 255) / 255.0, (q and 255) / 255.0, lab)
                          for (c in 0..2) { sS[c] += lab[c]; sS[3 + c] += lab[c] * lab[c] }
                          cS++
                      }
                      i += step
                  }
                  val useB = if (cB >= 200) sB else sAll
                  val nB = if (cB >= 200) cB else cAll
                  val mB = DoubleArray(3) { useB[it] / max(1, nB) }
                  val dB = DoubleArray(3) { sqrt(max(useB[3 + it] / max(1, nB) - mB[it] * mB[it], 1e-6)) }
                  val mS = DoubleArray(3) { sS[it] / max(1, cS) }
                  val dS = DoubleArray(3) { sqrt(max(sS[3 + it] / max(1, cS) - mS[it] * mS[it], 1e-6)) }
                  val doTransfer = cS > 50

                  // light wrap sources
                  val wr = max(3, (0.05f * max(W, H)).toInt())
                  val br = FloatArray(n) { ((bp[it] shr 16) and 255) / 255f }
                  val bgc = FloatArray(n) { ((bp[it] shr 8) and 255) / 255f }
                  val bb = FloatArray(n) { (bp[it] and 255) / 255f }
                  val wrR = Img.box(Img.box(br, W, H, wr), W, H, wr)
                  val wrG = Img.box(Img.box(bgc, W, H, wr), W, H, wr)
                  val wrB = Img.box(Img.box(bb, W, H, wr), W, H, wr)
                  val aE = Img.box(A, W, H, max(2, (subSize * 0.04f).toInt()))

                  // shadow
                  val dx = (Fx.i("hm_sh_x") / 100f * subSize).toInt()
                  val dy = (Fx.i("hm_sh_y") / 100f * subSize).toInt()
                  val shifted = FloatArray(n)
                  for (y in 0 until H) for (x in 0 until W) {
                      val sx = x - dx; val sy = y - dy
                      if (sx in 0 until W && sy in 0 until H) shifted[y * W + x] = A[sy * W + sx]
                  }
                  val sbr = max(2, (Fx.i("hm_sh_blur") / 100f * subSize * 0.5f).toInt())
                  val shadow = Img.box(Img.box(shifted, W, H, sbr), W, H, max(1, sbr / 2))
                  val shOp = Fx.i("hm_shadow") / 100f
                  val colorK = Fx.i("hm_color") / 100.0
                  val lightK = Fx.i("hm_light") / 100.0
                  val wrapK = Fx.i("hm_wrap") / 100f

                  val rgb = DoubleArray(3)
                  val out = IntArray(n)
                  for (k in 0 until n) {
                      var r0 = ((bp[k] shr 16) and 255) / 255f
                      var g0 = ((bp[k] shr 8) and 255) / 255f
                      var b0 = (bp[k] and 255) / 255f
                      val s = shadow[k] * shOp * 0.7f
                      r0 *= 1f - s; g0 *= 1f - s; b0 *= 1f - s
                      val a = Af[k]
                      if (a > 0.002f) {
                          val q = lp[k]
                          var sr = ((q shr 16) and 255) / 255f
                          var sg = ((q shr 8) and 255) / 255f
                          var sb = (q and 255) / 255f
                          if (doTransfer) {
                              Match.rgbToLab(sr.toDouble(), sg.toDouble(), sb.toDouble(), lab)
                              val gl = (dB[0] / dS[0]).coerceIn(0.75, 1.3)
                              val nl = (lab[0] - mS[0]) * gl + mB[0]
                              val ga = (dB[1] / dS[1]).coerceIn(0.6, 1.5)
                              val gb = (dB[2] / dS[2]).coerceIn(0.6, 1.5)
                              val na = (lab[1] - mS[1]) * ga + mB[1]
                              val nb = (lab[2] - mS[2]) * gb + mB[2]
                              Match.labToRgb(lab[0] + (nl - lab[0]) * lightK, lab[1] + (na - lab[1]) * colorK, lab[2] + (nb - lab[2]) * colorK, rgb)
                              sr = rgb[0].toFloat(); sg = rgb[1].toFloat(); sb = rgb[2].toFloat()
                          }
                          val e = ((1f - aE[k]) * 2f).coerceIn(0f, 1f) * wrapK * 0.7f
                          sr += (wrR[k] - sr) * e; sg += (wrG[k] - sg) * e; sb += (wrB[k] - sb) * e
                          r0 = r0 * (1f - a) + sr * a
                          g0 = g0 * (1f - a) + sg * a
                          b0 = b0 * (1f - a) + sb * a
                      }
                      out[k] = (255 shl 24) or ((r0.coerceIn(0f, 1f) * 255f + 0.5f).toInt() shl 16) or
                          ((g0.coerceIn(0f, 1f) * 255f + 0.5f).toInt() shl 8) or (b0.coerceIn(0f, 1f) * 255f + 0.5f).toInt()
                  }
                  val res = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888)
                  res.setPixels(out, 0, W, 0, 0, W, H)
                  return res
              }
          }
