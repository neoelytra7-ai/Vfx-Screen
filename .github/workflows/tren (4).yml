          class Sl(key: String, title: String, def: Int, val min: Int, val max: Int, val unit: String = "", val div: Float = 100f) : S(key, title, def) {
              /** Factor between the stored integer and the number shown to the user. */
              fun scale(): Float = when {
                  div == 10f -> 10f
                  unit == " EV" -> 100f
                  else -> 1f
              }
              fun show(v: Int): String = when {
                  div == 10f -> String.format(Locale.US, "%.1f%s", v / 10f, unit)
                  unit == " EV" -> String.format(Locale.US, "%.2f%s", v / 100f, unit)
                  else -> "$v$unit"
              }
          }
          class Tg(key: String, title: String, def: Boolean) : S(key, title, if (def) 1 else 0)
