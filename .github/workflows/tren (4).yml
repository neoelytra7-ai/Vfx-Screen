              private fun updateUndo() {
                  undoBtn?.animate()?.alpha(if (Fx.canUndo()) 1f else 0.35f)?.setStartDelay(0)?.setDuration(180)?.start()
                  redoBtn?.animate()?.alpha(if (Fx.canRedo()) 1f else 0.35f)?.setStartDelay(0)?.setDuration(180)?.start()
              }

              private fun commitEdit() { Fx.commit(); updateUndo() }

              /** Refresh everything after many parameters changed at once (look, undo, paste, reset…). */
              private fun afterBulk() {
                  pushParams()
                  refreshers.forEach { it() }
                  updateChips(); updateUndo()
                  if (maskBase != null) { ui.removeCallbacks(refineTask); ui.postDelayed(refineTask, 120) }
                  if (subject != null) { ui.removeCallbacks(composeTask); ui.postDelayed(composeTask, 150) }
              }

              private fun doUndo() { if (Fx.undo()) { afterBulk(); snack("Undo"); undoBtn?.let { nudge(it, -1); pulseOn(it) } } else { snack("Nothing to undo"); undoBtn?.let { nudge(it, 1) } } }
              private fun doRedo() { if (Fx.redo()) { afterBulk(); snack("Redo"); redoBtn?.let { nudge(it, 1); pulseOn(it) } } else { snack("Nothing to redo"); redoBtn?.let { nudge(it, -1) } } }

              private fun updateChips() {
                  var changed = false
                  for ((n, c) in toolChips) {
                      val keys = if (n == "HSL") Fx.hsl.map { it.key } else (Fx.tools[n]?.filter { it !is Ac }?.map { it.key } ?: emptyList())
                      val mod = keys.isNotEmpty() && Fx.anyEdited(keys)
                      val label = if (mod) "$n •" else n
                      if (c.text.toString() != label) { c.text = label; changed = true }
                  }
                  if (changed) toolChips[curTool]?.let { moveIndicator(it, false) }
              }

              private fun askValue(s: Sl, onSet: (Int) -> Unit) {
                  val et = EditText(this)
                  et.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_SIGNED or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  val sc = s.scale()
                  et.setText(if (sc == 1f) Fx.i(s.key).toString() else String.format(Locale.US, "%.2f", Fx.i(s.key) / sc))
                  et.setSelectAllOnFocus(true)
                  val box = FrameLayout(this)
                  box.setPadding(dp(22), dp(8), dp(22), 0)
                  box.addView(et)
                  AlertDialog.Builder(this).setTitle(s.title)
                      .setMessage("Range " + s.show(s.min) + " to " + s.show(s.max))
                      .setView(box)
                      .setPositiveButton("Set") { _, _ ->
                          val v = et.text.toString().toFloatOrNull()
                          if (v != null) onSet(Math.round(v * sc).coerceIn(s.min, s.max))
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun askText(title: String, hint: String, initial: String, onOk: (String) -> Unit) {
                  val et = EditText(this)
                  et.hint = hint; et.setText(initial); et.setSingleLine(true); et.setSelectAllOnFocus(true)
                  val box = FrameLayout(this)
                  box.setPadding(dp(22), dp(8), dp(22), 0)
                  box.addView(et)
                  AlertDialog.Builder(this).setTitle(title).setView(box)
                      .setPositiveButton("OK") { _, _ -> onOk(et.text.toString()) }
                      .setNegativeButton("Cancel", null).show()
              }

