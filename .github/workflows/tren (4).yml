              private fun showSummary() {
                  val keys = Fx.editedKeys()
                  if (keys.isEmpty()) { snack("No edits yet"); return }
                  val sb = StringBuilder()
                  for (k in keys) {
                      val s = Fx.find(k)
                      val v = when (s) {
                          is Sl -> s.show(Fx.i(k))
                          is Ch -> s.options.getOrElse(Fx.i(k)) { "?" }
                          is Tg -> if (Fx.i(k) == 1) "on" else "off"
                          else -> Fx.i(k).toString()
                      }
                      sb.append(tabOf(k)).append(" · ").append(s?.title ?: k).append(": ").append(v).append('\n')
                  }
                  AlertDialog.Builder(this).setTitle(keys.size.toString() + " edits").setMessage(sb.toString()).setPositiveButton("OK", null).show()
              }

              // ---- tap tools: white balance picker, focus picker, placement pickers, pixel inspector
              private fun depthPercentAt(u: Float, v: Float): Int? {
                  val d = depth ?: return null
                  if (dw <= 0 || dh <= 0) return null
                  val x = (u * (dw - 1)).toInt().coerceIn(0, dw - 1)
                  val y = (v * (dh - 1)).toInt().coerceIn(0, dh - 1)
                  var n = (d[y * dw + x].toInt() and 255) / 255.0
                  n = Math.pow(n, Fx.i("d_gamma") / 100.0)
                  n = ((n - 0.5) * (1.0 + Fx.i("d_contrast") / 100.0) + 0.5).coerceIn(0.0, 1.0)
                  if (Fx.i("d_inv") == 1) n = 1.0 - n
                  return (n * 100.0).roundToInt()
              }

              private fun handleTap(u: Float, v: Float) {
                  if (u < 0f || u > 1f || v < 0f || v > 1f) return
                  val s = src ?: return
                  val px = (u * (s.width - 1)).toInt().coerceIn(0, s.width - 1)
                  val py = (v * (s.height - 1)).toInt().coerceIn(0, s.height - 1)
                  val mode = tapMode
                  if (mode == 0) {
                      if (Fx.i("insp_on") == 1) {
                          val p = s.getPixel(px, py)
                          val r = (p shr 16) and 255; val g = (p shr 8) and 255; val b = p and 255
                          val hsv = FloatArray(3)
                          Color.colorToHSV(p, hsv)
                          var txt = String.format(Locale.US, "#%02X%02X%02X   R%d G%d B%d   H%.0f° S%.0f%% V%.0f%%", r, g, b, r, g, b, hsv[0], hsv[1] * 100f, hsv[2] * 100f)
                          val dp2 = depthPercentAt(u, v)
                          if (dp2 != null) txt += "   Depth $dp2"
                          snack(txt); status(txt)
                      }
                      return
                  }
                  tapMode = 0
                  when (mode) {
                      1 -> { Match.neutralAt(s, px, py).forEach { (k, vv) -> Fx.set(k, vv) }; commitEdit(); afterBulk(); snack("White balance set from the tapped spot") }
                      2 -> {
                          val n = depthPercentAt(u, v)
                          if (n == null) snack("Generate a depth map first")
                          else { Fx.set("dof_focus", n); Fx.set("px_focus", n); commitEdit(); afterBulk(); snack("Focus set to depth $n") }
                      }
                      3 -> { Fx.set("lx", ((u - 0.5f) * 200f).toInt()); Fx.set("ly", ((v - 0.5f) * 200f).toInt()); if (Fx.i("relight") == 0) Fx.set("relight", 60); commitEdit(); afterBulk(); snack("Light placed") }
                      4 -> { Fx.set("rad_x", ((u - 0.5f) * 200f).toInt()); Fx.set("rad_y", ((v - 0.5f) * 200f).toInt()); commitEdit(); afterBulk(); snack("Radial filter moved") }
                      5 -> { Fx.set("bl_cx", ((u - 0.5f) * 200f).toInt()); Fx.set("bl_cy", ((v - 0.5f) * 200f).toInt()); commitEdit(); afterBulk(); snack("Blur center set") }
                      6 -> { Fx.set("flare_x", ((u - 0.5f) * 200f).toInt()); Fx.set("flare_y", ((v - 0.5f) * 200f).toInt()); if (Fx.i("flare") == 0) Fx.set("flare", 50); commitEdit(); afterBulk(); snack("Flare placed") }
                  }
              }

              // ---- live histogram of the fully rendered preview (small offscreen render)
              private fun updateHist() {
                  val g = gl ?: return
                  val hv = histView ?: return
                  if (aiBusy || src == null || Fx.i("hist") == 0) return
                  val iw = g.r.imgW; val ih = g.r.imgH
                  val sc = 192f / max(iw, ih)
                  val w = max(8, (iw * sc).toInt()); val h = max(8, (ih * sc).toInt())
                  val buf = g.r.exportFrame(w, h, 0f, 0f, 0f, false, false) ?: return
                  val d = Array(4) { FloatArray(64) }
                  var o = 0
                  for (n in 0 until w * h) {
                      val r = buf.get(o).toInt() and 255
                      val gg = buf.get(o + 1).toInt() and 255
                      val b = buf.get(o + 2).toInt() and 255
                      d[0][r shr 2] += 1f; d[1][gg shr 2] += 1f; d[2][b shr 2] += 1f
                      d[3][((r * 54 + gg * 183 + b * 19) shr 8) shr 2] += 1f
                      o += 4
                  }
                  val lg = Fx.i("hist_log") == 1
                  for (a in d) {
                      var m = 1f
                      for (x in a) if (x > m) m = x
                      for (i in a.indices) a[i] = if (lg) ln(1f + a[i]) / ln(1f + m) else Math.sqrt((a[i] / m).toDouble()).toFloat()
                  }
                  ui.post { hv.data = d; hv.invalidate() }
              }

              // ------------------------------------------------------------------ fluid UI helpers
              private fun View.hapToggle(on: Boolean) {
                  if (Fx.i("haptics") != 1) return
                  val c = if (Build.VERSION.SDK_INT >= 30) (if (on) HapticFeedbackConstants.CONFIRM else HapticFeedbackConstants.REJECT) else HapticFeedbackConstants.VIRTUAL_KEY
                  performHapticFeedback(c)
              }

              private fun stopHomeAnims() { for (a in homeAnims) a.cancel(); homeAnims.clear() }

              /** Slide the highlight pill under the selected tab and keep that tab centred. */
              private fun moveIndicator(c: TextView, animate: Boolean) {
                  val ind = indicator ?: return
                  c.post {
                      val lpm = ind.layoutParams as FrameLayout.LayoutParams
                      val tx = c.left.toFloat()
                      val tw = max(c.width, dp(20))
                      lpm.height = c.height; lpm.topMargin = c.top
                      if (!animate || lpm.width <= 0) {
                          lpm.width = tw; ind.layoutParams = lpm; ind.translationX = tx
                      } else {
                          val fromW = lpm.width; val fromX = ind.translationX
                          val a = ValueAnimator.ofFloat(0f, 1f)
                          a.duration = 360
                          a.interpolator = OvershootInterpolator(0.8f)
                          a.addUpdateListener {
                              val k = it.animatedValue as Float
                              lpm.width = max(dp(20), (fromW + (tw - fromW) * k).toInt())
                              ind.translationX = fromX + (tx - fromX) * k
                              ind.layoutParams = lpm
                          }
                          a.start()
                      }
                      chipScroll?.let { s -> s.smoothScrollTo(max(0, (tx + tw / 2f - s.width / 2f).toInt()), 0) }
                  }
              }

              /** Rows rise in one after another when a different tool opens. */
              private fun staggerIn() {
                  val n = panel.childCount
                  for (i in 0 until n) {
                      val v = panel.getChildAt(i)
                      v.alpha = 0f; v.translationY = dp(18).toFloat()
                      v.animate().alpha(1f).translationY(0f).setStartDelay(min(i, 14) * 26L).setDuration(340)
                          .setInterpolator(DecelerateInterpolator(1.7f)).withEndAction { v.animate().setStartDelay(0) }.start()
                  }
              }

              private fun animateSheet(detent: Int) {
                  val sheet = sheetView ?: return
                  val target = (resources.displayMetrics.heightPixels * detents[detent]).toInt()
                  val from = sheet.layoutParams.height
                  val a = ValueAnimator.ofInt(from, target)
                  a.duration = 380
                  a.interpolator = DecelerateInterpolator(1.7f)
                  a.addUpdateListener {
                      val l = sheet.layoutParams
                      l.height = it.animatedValue as Int
                      sheet.layoutParams = l
                  }
                  a.start()
              }

              @Suppress("ClickableViewAccessibility")
              private fun wireGrabber(grab: View, pill: View, sheet: View) {
                  var downY = 0f
                  grab.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downY = e.rawY
                              pill.animate().scaleX(1.7f).setStartDelay(0).setDuration(140).start()
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dy = e.rawY - downY
                              sheet.translationY = if (dy < 0f) dy * 0.25f else dy * 0.5f
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              val dy = e.rawY - downY
                              val dd = resources.displayMetrics.density
                              pill.animate().scaleX(1f).setStartDelay(0).setDuration(240).setInterpolator(OvershootInterpolator(2f)).start()
                              var target = sheetDetent
                              if (abs(dy) < 8f * dd) target = (sheetDetent + 1) % detents.size
                              else if (dy < -36f * dd) target = min(sheetDetent + 1, detents.size - 1)
                              else if (dy > 36f * dd) target = max(sheetDetent - 1, 0)
                              sheetDetent = target
                              sheet.animate().translationY(0f).setStartDelay(0).setDuration(300).setInterpolator(OvershootInterpolator(1.5f)).start()
                              animateSheet(target)
                              grab.hap(HapticFeedbackConstants.CLOCK_TICK)
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun pulseOn(v: View) {
                  val p = pulseView ?: return
                  val a = IntArray(2); val b = IntArray(2)
                  v.getLocationInWindow(a); p.getLocationInWindow(b)
                  p.pulse(a[0] - b[0] + v.width / 2f, a[1] - b[1] + v.height / 2f, cAccent2)
              }

              private fun pulseAtTap() {
                  if (tapMode == 0 && Fx.i("insp_on") != 1) return
                  val g = gl ?: return
                  pulseView?.pulse(g.tapX + g.left, g.tapY + g.top, cAccent2)
              }

              private fun nudge(v: View, dir: Int) {
                  v.translationX = dir * dp(7).toFloat()
                  v.animate().translationX(0f).setStartDelay(0).setDuration(380).setInterpolator(OvershootInterpolator(3f)).start()
              }

              /** Dark curtain that fades away so a new photo eases in instead of popping. */
              private fun revealImage() {
                  val c = curtain ?: return
                  c.animate().cancel()
                  c.visibility = View.VISIBLE; c.alpha = 1f
                  c.animate().alpha(0f).setStartDelay(140).setDuration(650).setInterpolator(DecelerateInterpolator()).withEndAction { c.visibility = View.GONE }.start()
              }

          }
