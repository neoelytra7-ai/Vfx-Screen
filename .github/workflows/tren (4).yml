                  status("Rotating…")
                  ai.execute {
                      val m = Matrix()
                      m.postRotate(deg)
                      val b = Bitmap.createBitmap(s, 0, 0, s.width, s.height, m, true)
                      ui.post {
                          src = b; depth = null; maskBase = null; maskOut = null; maskGuide = null; subject = null; composeBase = null
                          pushAll(); gl?.resetView()
                          status("Rotated. Depth map and cutout were cleared, run them again if needed")
                      }
                  }
              }

              private fun showInfo() {
                  val s = src
                  val sb = StringBuilder()
                  if (s == null) sb.append("No photo open")
                  else {
                      val cr = Fx.cropRect(s.width, s.height)
                      val depthTxt = if (depth != null) "$dw × $dh" else "none"
                      val cutTxt = if (maskBase != null) "yes ($mw × $mh)" else "none"
                      val lutTxt = if (lutArr != null) "${lutN}³" else "none"
                      sb.append(String.format(Locale.US, "Working size: %d × %d (%.1f MP)\n", s.width, s.height, s.width * s.height / 1e6))
                      sb.append("Export crop: ").append(cr[2]).append(" × ").append(cr[3]).append('\n')
                      sb.append("Depth map: ").append(depthTxt).append('\n')
                      sb.append("Cutout: ").append(cutTxt).append('\n')
                      sb.append("LUT: ").append(lutTxt).append('\n')
