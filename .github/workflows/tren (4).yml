          package com.lumen.studio

          import android.content.Context
          import android.graphics.Bitmap
          import android.opengl.GLES30
          import android.opengl.GLSurfaceView
          import android.opengl.GLUtils
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10

          private const val VS_SRC = """
          uniform vec2 uView; uniform vec4 uXf; uniform vec4 uCam; uniform int uGrid;
          uniform sampler2D uDepth; uniform vec4 uFlags;
          out vec2 vUV;
          float depthV(vec2 uv) {
              float d = textureLod(uDepth, uv, 0.0).r;
              d = pow(clamp(d, 0.0, 1.0), P_d_gamma);
              d = clamp((d - 0.5) * (1.0 + P_d_contrast) + 0.5, 0.0, 1.0);
              return P_d_inv > 0.5 ? 1.0 - d : d;
          }
          const ivec2 OFF[6] = ivec2[6](ivec2(0,0), ivec2(1,0), ivec2(0,1), ivec2(1,0), ivec2(1,1), ivec2(0,1));
          void main() {
              int cell = gl_VertexID / 6;
              int corner = gl_VertexID - cell * 6;
              int cx = cell % uGrid;
              int cy = cell / uGrid;
              ivec2 o = OFF[corner];
              vec2 uv = vec2(float(cx + o.x), float(cy + o.y)) / float(uGrid);
              vec2 p = vec2(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
              if (uCam.w > 0.5 && uFlags.x > 0.5) {
                  float d = depthV(uv);
                  float dd = d - P_px_focus;
                  p += vec2(uCam.x, -uCam.y) * dd * P_px_strength * 0.35;
                  p *= 1.0 + uCam.z * dd * P_px_zoom;
                  p *= 1.0 + P_px_strength * 0.12;
              }
              gl_Position = vec4(p * uView * uXf.x + uXf.yz, 0.0, 1.0);
              vUV = uv;
          }
          """

          private const val FS_SRC = """
          uniform sampler2D uImg; uniform sampler2D uDepth; uniform sampler2D uMask; uniform sampler3D uLut;
          uniform vec2 uRes; uniform vec4 uFlags; uniform vec4 uMode; uniform vec4 uCrop; uniform float uExport;
          in vec2 vUV; out vec4 fragColor;

          float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
          float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
          float hash11(float p) { p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
          float vnoise(vec2 p) {
              vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
              float a = hash12(i); float b = hash12(i + vec2(1.0, 0.0));
              float c = hash12(i + vec2(0.0, 1.0)); float d = hash12(i + vec2(1.0, 1.0));
              return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }
          vec3 rgb2hsv(vec3 c) {
              vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
              vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
              vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
              float d = q.x - min(q.w, q.y);
              float e = 1.0e-10;
              return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
          }
          vec3 hsv2rgb(vec3 c) {
              vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
              vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
              return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
          }
          float depthAt(vec2 uv) {
              float d = textureLod(uDepth, uv, 0.0).r;
              d = pow(clamp(d, 0.0, 1.0), P_d_gamma);
              d = clamp((d - 0.5) * (1.0 + P_d_contrast) + 0.5, 0.0, 1.0);
              return P_d_inv > 0.5 ? 1.0 - d : d;
          }
          float bump(float x, float ctr) { return max(0.0, 1.0 - abs(x - ctr) / 0.25); }
          float bump2(float x, float ctr) { return max(0.0, 1.0 - abs(x - ctr) / 0.4); }
          vec2 rot2(vec2 p, float a) { float s = sin(a); float co = cos(a); return vec2(co * p.x - s * p.y, s * p.x + co * p.y); }
          float gl1(float d, float w) { return 1.0 - smoothstep(0.0, w, abs(d)); }

          // ---- geometry: straighten, zoom, keystone, offset, flips (output uv -> source uv)
          vec2 geoUV(vec2 q) {
              float asp = uRes.x / uRes.y;
              vec2 p = (q - 0.5) * vec2(asp, 1.0);
              p.x *= 1.0 + P_geo_vert * 0.7 * (q.y - 0.5);
              p.y *= 1.0 + P_geo_horiz * 0.7 * (q.x - 0.5);
              p.x /= max(1.0 + P_geo_aspect, 0.2);
              float ang = radians(P_geo_rot);
              float zoom = max(P_geo_zoom, 0.05);
              if (P_geo_fill > 0.5) {
                  float mxa = max(asp, 1.0 / asp);
                  zoom *= abs(cos(ang)) + abs(sin(ang)) * mxa;
              }
              p = rot2(p, ang) / zoom;
              p.x += P_geo_x * 0.5 * asp;
              p.y += P_geo_y * 0.5;
              if (P_flip_h > 0.5) p.x = -p.x;
              if (P_flip_v > 0.5) p.y = -p.y;
              return p / vec2(asp, 1.0) + 0.5;
          }

          // ---- creative warps
          vec2 warpUV(vec2 q) {
              float asp = uRes.x / uRes.y;
              int mir = int(P_mirror + 0.5);
              if (mir == 1) q.x = q.x > 0.5 ? 1.0 - q.x : q.x;
              else if (mir == 2) q.x = q.x < 0.5 ? 1.0 - q.x : q.x;
              else if (mir == 3) q.y = q.y > 0.5 ? 1.0 - q.y : q.y;
              else if (mir == 4) q.y = q.y < 0.5 ? 1.0 - q.y : q.y;
              else if (mir == 5) q = vec2(q.x > 0.5 ? 1.0 - q.x : q.x, q.y > 0.5 ? 1.0 - q.y : q.y);
              if (P_kal_n >= 2.0) {
                  vec2 p = (q - 0.5) * vec2(asp, 1.0);
                  float r = length(p);
                  float a = atan(p.y, p.x) + radians(P_kal_rot);
                  float seg = 6.2831853 / P_kal_n;
                  a = abs(mod(a, seg) - seg * 0.5);
                  p = vec2(cos(a), sin(a)) * r / max(P_kal_zoom, 0.1);
                  q = p / vec2(asp, 1.0) + 0.5;
              }
              if (P_swirl != 0.0) {
                  vec2 p = (q - 0.5) * vec2(asp, 1.0);
                  float r = length(p);
                  float rad = max(P_swirl_r, 0.02);
                  float k = clamp(1.0 - r / rad, 0.0, 1.0);
                  p = rot2(p, P_swirl * 6.0 * k * k);
                  q = p / vec2(asp, 1.0) + 0.5;
              }
              if (P_bulge != 0.0) {
                  vec2 p = (q - 0.5) * vec2(asp, 1.0);
                  float r = length(p);
                  float rad = max(P_bulge_r, 0.02);
                  float k = clamp(r / rad, 0.0, 1.0);
                  p *= 1.0 - P_bulge * 0.6 * (1.0 - k) * (1.0 - k);
                  q = p / vec2(asp, 1.0) + 0.5;
              }
              if (P_wave > 0.0) {
                  int wd = int(P_wave_dir + 0.5);
                  float ph = P_wave_phase * 6.2831853;
                  float qx = q.x; float qy = q.y;
                  if (wd != 1) q.x = qx + sin(qy * P_wave_freq * 6.2831853 + ph) * P_wave * 0.03;
                  if (wd != 0) q.y = qy + sin(qx * P_wave_freq * 6.2831853 + ph) * P_wave * 0.03;
              }
              float dsum = P_distort + P_crt_curve * 0.6;
              if (dsum != 0.0) {
                  vec2 p = (q - 0.5) * vec2(asp, 1.0);
                  p *= 1.0 + dsum * 0.6 * dot(p, p);
                  q = p / vec2(asp, 1.0) + 0.5;
              }
              if (P_vhs_amt > 0.0) {
                  float row = floor(q.y * uRes.y * 0.5);
                  q.x += (hash11(row * 0.37) - 0.5) * 0.006 * P_vhs_amt;
                  q.x += (1.0 - smoothstep(0.0, 0.03, abs(q.y - (0.15 + 0.7 * P_vhs_roll)))) * 0.04 * P_vhs_amt * P_vhs_roll;
              }
              if (P_pix > 0.0) {
                  float bs = 1.0 + P_pix * 60.0;
                  vec2 g = floor(q * uRes / bs) + 0.5;
                  q = g * bs / uRes;
              }
              return q;
          }

          float edgeMag(vec2 q, float k) {
              vec2 e = k / uRes;
              float tl = luma(texture(uImg, q + vec2(-e.x, -e.y)).rgb);
              float tc = luma(texture(uImg, q + vec2(0.0, -e.y)).rgb);
              float tr = luma(texture(uImg, q + vec2(e.x, -e.y)).rgb);
              float ml = luma(texture(uImg, q + vec2(-e.x, 0.0)).rgb);
              float mr = luma(texture(uImg, q + vec2(e.x, 0.0)).rgb);
              float bl = luma(texture(uImg, q + vec2(-e.x, e.y)).rgb);
              float bc = luma(texture(uImg, q + vec2(0.0, e.y)).rgb);
              float br = luma(texture(uImg, q + vec2(e.x, e.y)).rgb);
              float gx = (tr + 2.0 * mr + br) - (tl + 2.0 * ml + bl);
              float gy = (bl + 2.0 * bc + br) - (tl + 2.0 * tc + tr);
              return length(vec2(gx, gy));
          }

          vec3 localAdj(vec3 c, float m, float ev, float sat, float temp) {
              if (m <= 0.0) return c;
              c *= exp2(ev * m);
              float l = luma(c);
              c = mix(vec3(l), c, 1.0 + sat * m);
              c.r *= 1.0 + 0.25 * temp * m;
              c.b *= 1.0 - 0.25 * temp * m;
              return c;
          }

          vec3 filmLook(vec3 c, int id) {
              float l = luma(c);
              float sh = 1.0 - smoothstep(0.0, 0.55, l);
              float hi = smoothstep(0.45, 1.0, l);
              if (id == 1) {
                  c = mix(vec3(l), c, 0.92); c += vec3(0.03, 0.012, -0.02) * hi + vec3(0.0, 0.01, 0.02) * sh;
                  c = c * 0.96 + 0.025; c = (c - 0.5) * 0.94 + 0.5;
              } else if (id == 2) {
                  c = mix(vec3(l), c, 1.28); c = (c - 0.5) * 1.12 + 0.5; c += vec3(0.02, 0.0, -0.015) * hi;
              } else if (id == 3) {
                  c = mix(vec3(l), c, 0.95); c += vec3(-0.015, 0.02, 0.012) * sh + vec3(0.01, 0.0, 0.015) * hi; c = c * 0.95 + 0.03;
              } else if (id == 4) {
                  c = mix(vec3(l), c, 1.45); c = (c - 0.5) * 1.18 + 0.5; c += vec3(0.0, 0.0, 0.02) * sh;
              } else if (id == 5) {
                  c += vec3(-0.03, 0.01, 0.05) * sh + vec3(0.06, 0.015, -0.03) * hi;
                  c = mix(vec3(l), c, 1.05); c = (c - 0.5) * 1.06 + 0.5;
              } else if (id == 6) {
                  c = mix(vec3(l), c, 1.2); c.r *= 1.06; c.b *= 0.94; c = (c - 0.5) * 1.1 + 0.5;
              } else if (id == 7) {
                  c = mix(vec3(l), c, 0.85); c = c * 0.85 + 0.09; c += vec3(0.03, 0.01, -0.02) * hi + vec3(-0.01, 0.0, 0.04) * sh;
              } else if (id == 8) {
                  float g = clamp((l - 0.5) * 1.3 + 0.5, 0.0, 1.0); c = vec3(g);
              } else if (id == 9) {
                  c = mix(vec3(l), c, 0.88); c += vec3(0.05, 0.02, -0.04) * (0.5 + 0.5 * hi); c = c * 0.88 + 0.07; c.g *= 0.97;
              } else if (id == 10) {
                  c.r = clamp(c.r * 1.12 + (c.r - 0.5) * 0.35, 0.0, 1.0);
                  c.g = clamp(c.g * 1.02 + 0.02, 0.0, 1.0);
                  c.b = clamp(c.b * 0.78 + 0.1 + (0.5 - c.b) * 0.15, 0.0, 1.0);
                  c = mix(vec3(luma(c)), c, 1.2);
              } else if (id == 11) {
                  c = mix(c, vec3(l), 0.55); c = (c - 0.5) * 1.35 + 0.5;
              } else if (id == 12) {
                  float g = clamp((l - 0.45) * 1.6 + 0.5, 0.0, 1.0); c = vec3(g) * vec3(1.0, 0.98, 0.95);
              }
              return clamp(c, 0.0, 1.0);
          }

          float inkdot(vec2 p, float ang, float cell, float v) {
              float s = sin(ang); float co = cos(ang);
              vec2 r = vec2(co * p.x + s * p.y, -s * p.x + co * p.y) / cell;
              vec2 f = fract(r) - 0.5;
              float rad = sqrt(clamp(1.0 - v, 0.0, 1.0)) * 0.7071;
              return 1.0 - smoothstep(rad - 0.05, rad + 0.05, length(f));
          }

          const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

          void main() {
              float asp = uRes.x / uRes.y;
              vec2 g0 = geoUV(vUV);
              if (g0.x < 0.0 || g0.x > 1.0 || g0.y < 0.0 || g0.y > 1.0) { fragColor = vec4(0.039, 0.055, 0.078, 1.0); return; }
              vec2 uv = clamp(warpUV(g0), 0.0, 1.0);
              vec3 src = texture(uImg, uv).rgb;
              bool hasD = uFlags.x > 0.5;
              if (uMode.z > 0.5 && hasD) { fragColor = vec4(vec3(depthAt(uv)), 1.0); return; }
              if (uMode.y > 0.5) { fragColor = vec4(texture(uImg, vUV).rgb, 1.0); return; }

              // ---- lens-style source modifications
              if (P_ca > 0.0) {
                  vec2 dv = P_ca_type > 0.5 ? vec2(P_ca * 0.012, 0.0) : (uv - 0.5) * P_ca * 0.05;
                  src = vec3(texture(uImg, clamp(uv + dv, 0.0, 1.0)).r, src.g, texture(uImg, clamp(uv - dv, 0.0, 1.0)).b);
              }
              if (P_rgb_amt > 0.0) {
                  float ra = radians(P_rgb_ang);
                  vec2 off = vec2(cos(ra), sin(ra)) * P_rgb_amt * 0.03 * vec2(1.0, asp);
                  src = vec3(texture(uImg, clamp(uv + off, 0.0, 1.0)).r, src.g, texture(uImg, clamp(uv - off, 0.0, 1.0)).b);
              }
              if (P_gl_amt > 0.0) {
                  float rowB = floor(uv.y / max(P_gl_size * 0.08, 0.004));
                  float rnd = hash11(rowB + P_gl_seed * 37.0);
                  if (rnd > 1.0 - P_gl_amt * 0.5) {
                      float shf = (hash11(rowB * 1.7 + P_gl_seed) - 0.5) * 0.25 * P_gl_amt;
                      src = vec3(texture(uImg, clamp(vec2(uv.x + shf * 1.2, uv.y), 0.0, 1.0)).r,
                                 texture(uImg, clamp(vec2(uv.x + shf, uv.y), 0.0, 1.0)).g,
                                 texture(uImg, clamp(vec2(uv.x + shf * 0.8, uv.y), 0.0, 1.0)).b);
                  }
              }
              if (P_edge_soft > 0.0) {
                  float rr = length((uv - 0.5) * vec2(asp, 1.0)) * 1.2;
                  src = mix(src, textureLod(uImg, uv, 3.0).rgb, clamp(P_edge_soft * rr * rr * 1.5, 0.0, 1.0));
              }

              float dep = 0.5;
              if (hasD) dep = depthAt(uv);
              vec3 c = src;
              float coc = 0.0;
              if (hasD && P_dof > 0.0) coc = P_dof * 18.0 * smoothstep(0.0, 1.0, max(abs(dep - P_dof_focus) - P_dof_range * 0.5, 0.0) * 2.0);
              if (coc > 0.6) {
                  vec2 pxs = coc / uRes;
                  int dq = int(P_dof_q + 0.5);
                  int ns = dq == 0 ? 16 : (dq == 1 ? 24 : 48);
                  int sides = int(P_dof_shape + 0.5);
                  float nsd = sides == 1 ? 5.0 : (sides == 2 ? 6.0 : (sides == 3 ? 8.0 : 0.0));
                  float sector = nsd > 0.0 ? 6.2831853 / nsd : 1.0;
                  vec3 acc = vec3(0.0); float wsum = 0.0;
                  for (int i = 0; i < 48; i++) {
                      if (i >= ns) break;
                      float fi = float(i);
                      float ang = fi * 2.39996323;
                      float rad = sqrt((fi + 0.5) / float(ns));
                      if (nsd > 0.0) rad *= cos(sector * 0.5) / cos(mod(ang, sector) - sector * 0.5);
                      vec3 sm = texture(uImg, uv + vec2(cos(ang), sin(ang)) * rad * pxs).rgb;
                      float wt = 1.0 + pow(luma(sm), 4.0) * (4.0 + P_dof_boost * 16.0);
                      acc += sm * wt; wsum += wt;
                  }
                  c = acc / wsum;
              } else if (P_denoise > 0.0) {
                  vec2 px1 = 1.0 / uRes;
                  vec3 acc = c; float wsum = 1.0;
                  for (int i = 0; i < 8; i++) {
                      float ang = float(i) * 0.785398;
                      vec3 sm = texture(uImg, uv + vec2(cos(ang), sin(ang)) * (1.0 + P_denoise * 1.5) * px1).rgb;
                      vec3 df = sm - c;
                      float wt = exp(-dot(df, df) / (0.004 + 0.02 * P_denoise));
                      acc += sm * wt; wsum += wt;
                  }
                  c = acc / wsum;
              }

              // ---- creative blurs
              float blurR = P_blur * 14.0;
              if (P_tilt_amt > 0.0) {
                  vec2 pp = (vUV - 0.5) * vec2(asp, 1.0);
                  float dd;
                  if (P_tilt_mode > 0.5) dd = length(pp - vec2(P_bl_cx * 0.5 * asp, P_bl_cy * 0.5));
                  else {
                      float ta = radians(P_tilt_angle);
                      dd = abs(dot(pp, vec2(-sin(ta), cos(ta))) - P_tilt_pos * 0.5);
                  }
                  float tm = smoothstep(P_tilt_w * 0.5, P_tilt_w * 0.5 + 0.3, dd);
                  blurR += tm * P_tilt_amt * 22.0;
              }
              if (blurR > 0.4) {
                  int bq = int(P_blur_q + 0.5);
                  int nb = bq == 0 ? 12 : (bq == 1 ? 20 : 32);
                  vec2 pxb = blurR / uRes;
                  float lodb = clamp(log2(max(blurR, 1.0)) - 1.5, 0.0, 6.0);
                  vec3 acc = vec3(0.0);
                  for (int i = 0; i < 32; i++) {
                      if (i >= nb) break;
                      float fi = float(i);
                      float ang = fi * 2.39996323;
                      float rad = sqrt((fi + 0.5) / float(nb));
                      acc += textureLod(uImg, uv + vec2(cos(ang), sin(ang)) * rad * pxb, lodb).rgb;
                  }
                  c = mix(c, acc / float(nb), clamp(blurR / 2.0, 0.0, 1.0));
              }
              if (P_mb_len > 0.0) {
                  float ma = radians(P_mb_angle);
                  vec2 md = vec2(cos(ma), sin(ma) * asp) * P_mb_len * 0.08;
                  vec3 acc = vec3(0.0);
                  for (int i = 0; i < 16; i++) {
                      float t = float(i) / 15.0 - 0.5;
                      acc += texture(uImg, clamp(uv + md * t, 0.0, 1.0)).rgb;
                  }
                  c = acc / 16.0;
              }
              if (P_zb_amt > 0.0 || P_rb_amt > 0.0) {
                  vec2 ctr = vec2(0.5 + P_bl_cx * 0.5, 0.5 + P_bl_cy * 0.5);
                  vec3 acc = vec3(0.0);
                  for (int i = 0; i < 16; i++) {
                      float t = float(i) / 15.0;
                      vec2 d0 = uv - ctr;
                      vec2 d1 = vec2(d0.x * asp, d0.y);
                      d1 = rot2(d1, P_rb_amt * 0.25 * (t - 0.5));
                      d1.x /= asp;
                      acc += texture(uImg, clamp(ctr + d1 * (1.0 - P_zb_amt * 0.25 * t), 0.0, 1.0)).rgb;
                  }
                  c = acc / 16.0;
              }
              if (hasD && P_aa_amt > 0.0) {
                  float shd = (dep - P_dof_focus) * P_aa_amt * 0.03;
                  vec3 ca1 = texture(uImg, clamp(uv + vec2(shd, 0.0), 0.0, 1.0)).rgb;
                  vec3 ca2 = texture(uImg, clamp(uv - vec2(shd, 0.0), 0.0, 1.0)).rgb;
                  c = vec3(ca1.r, ca2.g, ca2.b);
              }

              // ---- fitted block (mirrored on the CPU by the grade matcher)
              c *= exp2(P_exposure);
              c.r *= 1.0 + 0.25 * P_temp; c.b *= 1.0 - 0.25 * P_temp;
              c.g *= 1.0 - 0.15 * P_tint; c.r *= 1.0 + 0.05 * P_tint; c.b *= 1.0 + 0.05 * P_tint;
              float l0 = luma(c);
              float ws0 = 1.0 - smoothstep(0.0, 0.5, l0);
              float wh0 = smoothstep(0.5, 1.0, l0);
              c *= 1.0 + P_shadows * 0.6 * ws0 + P_highlights * 0.4 * wh0;
              c *= 1.0 + P_whites * 0.25 * smoothstep(0.6, 1.0, l0);
              c += P_blacks * 0.08 * (1.0 - smoothstep(0.0, 0.3, l0));
              c = (c - 0.5) * (1.0 + P_contrast * 0.9) + 0.5;
              c = clamp(c, 0.0, 1.0);
              float l1 = luma(c);
              float mx = max(c.r, max(c.g, c.b));
              float mn = min(c.r, min(c.g, c.b));
              float s0 = (mx - mn) / (mx + 1.0e-4);
              float kk = 1.0 + P_saturation + P_vibrance * (1.0 - s0);
              c = clamp(mix(vec3(l1), c, kk), 0.0, 1.0);
              vec3 hsv = rgb2hsv(c);
              float hd = hsv.x * 360.0;
              float HUE[8] = float[8](P_hue_0, P_hue_1, P_hue_2, P_hue_3, P_hue_4, P_hue_5, P_hue_6, P_hue_7);
              float SAT[8] = float[8](P_sat_0, P_sat_1, P_sat_2, P_sat_3, P_sat_4, P_sat_5, P_sat_6, P_sat_7);
              float LUM[8] = float[8](P_lum_0, P_lum_1, P_lum_2, P_lum_3, P_lum_4, P_lum_5, P_lum_6, P_lum_7);
              float CEN[8] = float[8](0.0, 30.0, 60.0, 120.0, 180.0, 240.0, 280.0, 320.0);
              float dh = 0.0; float ds = 0.0; float dl = 0.0;
              for (int i = 0; i < 8; i++) {
                  float dist = abs(hd - CEN[i]);
                  dist = min(dist, 360.0 - dist);
                  float wgt = max(0.0, 1.0 - dist / 45.0);
                  dh += wgt * HUE[i]; ds += wgt * SAT[i]; dl += wgt * LUM[i];
              }
              float swt = smoothstep(0.0, 0.2, hsv.y);
              hsv.x = fract(hsv.x + dh * 0.1 * swt);
              hsv.y = clamp(hsv.y * (1.0 + ds), 0.0, 1.0);
              hsv.z = clamp(hsv.z * (1.0 + dl * 0.6), 0.0, 1.0);
              c = hsv2rgb(hsv);
              float l3 = luma(c);
              float ws3 = 1.0 - smoothstep(0.0, 0.5, l3);
              float wh3 = smoothstep(0.5, 1.0, l3);
              float wm3 = 1.0 - ws3 - wh3;
              c += vec3(P_sh_r, P_sh_g, P_sh_b) * 0.25 * ws3 + vec3(P_md_r, P_md_g, P_md_b) * 0.25 * wm3 + vec3(P_hi_r, P_hi_g, P_hi_b) * 0.25 * wh3;
              c = clamp(c, 0.0, 1.0);
              // ---- end fitted block

              if (P_hue_g != 0.0 || P_sat_sh != 0.0 || P_sat_hi != 0.0) {
                  vec3 hv = rgb2hsv(clamp(c, 0.0, 1.0));
                  hv.x = fract(hv.x + P_hue_g / 360.0);
                  hv.y = clamp(hv.y * (1.0 + P_sat_sh * (1.0 - smoothstep(0.0, 0.5, hv.z)) + P_sat_hi * smoothstep(0.5, 1.0, hv.z)), 0.0, 1.0);
                  c = hsv2rgb(hv);
              }

              c += P_bright * 0.25;
              if (P_scurve > 0.0) {
                  vec3 cc = clamp(c, 0.0, 1.0);
                  c = mix(c, cc * cc * (3.0 - 2.0 * cc), P_scurve);
              } else if (P_scurve < 0.0) {
                  vec3 cc = clamp(c, 0.0, 1.0);
                  vec3 inv = vec3(0.5) - sin(asin(clamp(vec3(1.0) - 2.0 * cc, -1.0, 1.0)) / 3.0);
                  c = mix(c, inv, -P_scurve);
              }
              float lvb = P_lv_black * 0.3;
              float lvw = max(P_lv_white, lvb + 0.05);
              c = (c - lvb) / (lvw - lvb);
              c = pow(max(c, vec3(0.0)), vec3(1.0 / max(P_lv_gamma, 0.1)));
              if (P_soft_clip > 0.0) {
                  vec3 over = max(c - 0.75, 0.0);
                  vec3 rolled = 0.75 + 0.25 * tanh(over * 4.0);
                  c = mix(c, min(c, vec3(0.75)) + (rolled - 0.75), P_soft_clip);
              }
              c = mix(c, c * 0.88 + 0.12, P_lift_black);

              c = c * (1.0 - P_fade * 0.2) + P_fade * 0.08;
              float lc = luma(c);
              float cv = P_c_dark * bump(lc, 0.1) + P_c_shadow * bump(lc, 0.3) + P_c_mid * bump(lc, 0.5) + P_c_light * bump(lc, 0.7) + P_c_high * bump(lc, 0.9);
              c += cv * 0.15;
              c.r += (P_rc_r_s * bump2(c.r, 0.15) + P_rc_r_m * bump2(c.r, 0.5) + P_rc_r_h * bump2(c.r, 0.85)) * 0.15;
              c.g += (P_rc_g_s * bump2(c.g, 0.15) + P_rc_g_m * bump2(c.g, 0.5) + P_rc_g_h * bump2(c.g, 0.85)) * 0.15;
              c.b += (P_rc_b_s * bump2(c.b, 0.15) + P_rc_b_m * bump2(c.b, 0.5) + P_rc_b_h * bump2(c.b, 0.85)) * 0.15;

              vec3 fine = src - textureLod(uImg, uv, P_sharp_rad).rgb;
              float smk = mix(1.0, smoothstep(0.0, 0.08, length(fine)), P_sharp_mask);
              c += fine * (P_texture * 1.2 + P_sharpen * 1.6 * smk);
              vec3 coarse = src - textureLod(uImg, uv, 4.0).rgb;
              float midm = 1.0 - abs(luma(c) * 2.0 - 1.0) * 0.6;
              c += coarse * P_clarity * 0.9 * midm;
              if (P_dehaze > 0.0) {
                  vec3 lo = textureLod(uImg, uv, 5.0).rgb;
                  float dk = min(lo.r, min(lo.g, lo.b));
                  float tr = clamp(1.0 - P_dehaze * dk * 0.95, 0.25, 1.0);
                  c = (c - 0.9 * (1.0 - tr)) / tr;
              } else if (P_dehaze < 0.0) {
                  c = mix(c, vec3(0.85), -P_dehaze * 0.35);
              }
              if (P_glow > 0.0 || P_halation > 0.0) {
                  vec3 g = textureLod(uImg, uv, 5.5).rgb;
                  vec3 gb = max(g - P_glow_thr, 0.0) / max(1.0 - P_glow_thr, 0.05);
                  c += gb * P_glow * 0.8 + gb * vec3(1.0, 0.3, 0.12) * P_halation * 0.8;
              }
              if (uFlags.z > 0.5 && P_lut_amt > 0.0) {
                  float n = uFlags.w;
                  vec3 uvw = clamp(c, 0.0, 1.0) * ((n - 1.0) / n) + 0.5 / n;
                  c = mix(c, texture(uLut, uvw).rgb, P_lut_amt);
              }

              // ---- color stage: mixer, B&W, split toning, duotone, film
              c = vec3(dot(c, vec3(P_mix_rr, P_mix_rg, P_mix_rb)), dot(c, vec3(P_mix_gr, P_mix_gg, P_mix_gb)), dot(c, vec3(P_mix_br, P_mix_bg, P_mix_bb)));
              if (P_bw_amt > 0.0) {
                  vec3 FW[6] = vec3[6](vec3(0.0), vec3(0.6, -0.2, -0.4), vec3(0.4, 0.0, -0.4), vec3(0.2, 0.3, -0.5), vec3(-0.3, 0.6, -0.3), vec3(-0.4, -0.1, 0.5));
                  int bf = int(P_bw_filter + 0.5);
                  vec3 bw = vec3(P_bw_r, P_bw_g, P_bw_b) + FW[clamp(bf, 0, 5)];
                  float gy = dot(c, bw);
                  gy = (gy - 0.5) * (1.0 + P_bw_contrast) + 0.5;
                  vec3 bwc = vec3(gy);
                  if (P_bw_tint_s > 0.0) {
                      vec3 tc = hsv2rgb(vec3(P_bw_tint_h / 360.0, 1.0, 1.0));
                      bwc += (tc - vec3(luma(tc))) * P_bw_tint_s * 0.6 * (0.3 + clamp(gy, 0.0, 1.0));
                  }
                  c = mix(c, bwc, P_bw_amt);
              }
              if (P_st_sh_s > 0.0 || P_st_hi_s > 0.0) {
                  float ls = luma(clamp(c, 0.0, 1.0));
                  float bal = P_st_bal * 0.4;
                  float wsh = 1.0 - smoothstep(bal, 0.6 + bal, ls);
                  float whi = smoothstep(0.4 + bal, 1.0 + bal, ls);
                  vec3 tsh = hsv2rgb(vec3(P_st_sh_h / 360.0, 1.0, 1.0));
                  vec3 thi = hsv2rgb(vec3(P_st_hi_h / 360.0, 1.0, 1.0));
                  c += (tsh - vec3(luma(tsh))) * P_st_sh_s * wsh * 0.5;
                  c += (thi - vec3(luma(thi))) * P_st_hi_s * whi * 0.5;
              }
              if (P_du_amt > 0.0) {
                  float gy = clamp(luma(clamp(c, 0.0, 1.0)) + P_du_bal, 0.0, 1.0);
                  vec3 cs = hsv2rgb(vec3(P_du_sh_h / 360.0, P_du_sh_s, 0.12));
                  vec3 chh = hsv2rgb(vec3(P_du_hi_h / 360.0, P_du_hi_s, 1.0));
                  vec3 duo = mix(cs, chh, gy);
                  if (P_du_md_amt > 0.0) {
                      vec3 cm = hsv2rgb(vec3(P_du_md_h / 360.0, P_du_md_s, 0.65));
                      vec3 tri = gy < 0.5 ? mix(cs, cm, gy * 2.0) : mix(cm, chh, gy * 2.0 - 1.0);
                      duo = mix(duo, tri, P_du_md_amt);
                  }
                  c = mix(c, duo, P_du_amt);
              }
              if (P_film_stock > 0.5) {
                  vec3 fl = filmLook(clamp(c, 0.0, 1.0), int(P_film_stock + 0.5));
                  fl = (fl - 0.5) * (1.0 + P_film_contrast) + 0.5;
                  fl.r *= 1.0 + 0.12 * P_film_warm;
                  fl.b *= 1.0 - 0.12 * P_film_warm;
                  c = mix(c, fl, P_film_amt);
              }

              // ---- stylize
              if (P_sk_amt > 0.0) {
                  float e = edgeMag(uv, 1.0);
                  float sk = 1.0 - smoothstep(P_sk_thr * 0.6, P_sk_thr * 0.6 + 0.25, e);
                  c = mix(c, vec3(sk), P_sk_amt);
              }
              if (P_emb_amt > 0.0) {
                  vec2 e1 = 1.5 / uRes;
                  float emb = luma(texture(uImg, uv + e1).rgb) - luma(texture(uImg, uv - e1).rgb);
                  c = mix(c, vec3(0.5 + emb * 2.0), P_emb_amt);
              }
              if (P_edge_amt > 0.0) {
                  float ed = clamp(edgeMag(uv, 1.0) * 3.0, 0.0, 1.0);
                  vec3 ecol = hsv2rgb(vec3(P_edge_hue / 360.0, 0.9, 1.0));
                  c = mix(c, c * 0.3 + ecol * ed * 1.5, P_edge_amt);
              }
              if (P_toon_amt > 0.0) {
                  float lv = max(P_toon_lv, 2.0);
                  vec3 qz = floor(clamp(c, 0.0, 1.0) * lv + 0.5) / lv;
                  float ed = clamp(edgeMag(uv, 1.0) * 3.0, 0.0, 1.0);
                  c = mix(c, qz * (1.0 - ed * 0.9), P_toon_amt);
              }
              if (P_post_lv >= 2.0) c = floor(clamp(c, 0.0, 1.0) * P_post_lv + 0.5) / P_post_lv;
              if (P_solar > 0.0) {
                  vec3 sv = mix(c, 1.0 - c, step(vec3(0.5), c));
                  c = mix(c, sv, P_solar);
              }
              if (P_thr_amt > 0.0) c = mix(c, vec3(step(P_thr_lv, luma(c))), P_thr_amt);
              if (P_inv_amt > 0.0) c = mix(c, 1.0 - c, P_inv_amt);
              if (P_sep_amt > 0.0) {
                  vec3 sp = vec3(dot(c, vec3(0.393, 0.769, 0.189)), dot(c, vec3(0.349, 0.686, 0.168)), dot(c, vec3(0.272, 0.534, 0.131)));
                  c = mix(c, sp, P_sep_amt);
              }
              if (P_xp_amt > 0.0) c = mix(c, filmLook(clamp(c, 0.0, 1.0), 10), P_xp_amt);
              if (P_pop_amt > 0.0) {
                  vec3 hp = rgb2hsv(clamp(c, 0.0, 1.0));
                  float dhp = abs(hp.x * 360.0 - P_pop_hue);
                  dhp = min(dhp, 360.0 - dhp);
                  float keep = 1.0 - smoothstep(P_pop_rng * 0.6, P_pop_rng, dhp);
                  c = mix(c, mix(vec3(luma(c)), c, keep), P_pop_amt);
              }

              // ---- depth grading and local adjustments
              if (hasD) {
                  float wn = smoothstep(P_d_pivot, 1.0, dep);
                  float wf = 1.0 - smoothstep(0.0, P_d_pivot, dep);
                  c = localAdj(c, wn, P_d_near_ev, P_d_near_sat, P_d_near_temp);
                  c = localAdj(c, wf, P_d_far_ev, P_d_far_sat, P_d_far_temp);
              }
              if (P_lin_ev != 0.0 || P_lin_sat != 0.0 || P_lin_temp != 0.0) {
                  vec2 pp = (vUV - 0.5) * vec2(asp, 1.0);
                  float la = radians(P_lin_angle);
                  float dd = dot(pp, vec2(-sin(la), cos(la))) - P_lin_pos * 0.5;
                  float fw2 = max(P_lin_feather, 0.02) * 0.6;
                  float m = smoothstep(-fw2, fw2, dd);
                  if (P_lin_inv > 0.5) m = 1.0 - m;
                  c = localAdj(c, m, P_lin_ev, P_lin_sat, P_lin_temp);
              }
              if (P_rad_ev != 0.0 || P_rad_sat != 0.0 || P_rad_temp != 0.0) {
                  vec2 pp = (vUV - 0.5) * vec2(asp, 1.0) - vec2(P_rad_x * 0.5 * asp, P_rad_y * 0.5);
                  float rs = max(P_rad_size, 0.02) * 0.8;
                  float f0 = rs * (1.0 - clamp(P_rad_feather, 0.0, 0.98));
                  float m = 1.0 - smoothstep(f0, rs + 0.002, length(pp));
                  if (P_rad_inv > 0.5) m = 1.0 - m;
                  c = localAdj(c, m, P_rad_ev, P_rad_sat, P_rad_temp);
              }
              if (uFlags.y > 0.5 && (P_mk_sub_ev != 0.0 || P_mk_sub_sat != 0.0 || P_mk_sub_temp != 0.0 || P_mk_bg_ev != 0.0 || P_mk_bg_sat != 0.0 || P_mk_bg_temp != 0.0 || P_mk_bg_blur > 0.0 || P_mk_bg_gray > 0.0 || P_mk_bg_tint > 0.0)) {
                  float am = texture(uMask, uv).r;
                  if (P_mk_inv > 0.5) am = 1.0 - am;
                  vec3 csub = localAdj(c, 1.0, P_mk_sub_ev, P_mk_sub_sat, P_mk_sub_temp);
                  vec3 cbg = c;
                  if (P_mk_bg_blur > 0.0) {
                      vec3 bl = textureLod(uImg, uv, P_mk_bg_blur * 5.5).rgb;
                      vec3 gr = clamp(c / max(src, vec3(0.03)), 0.0, 4.0);
                      cbg = mix(c, bl * gr, min(P_mk_bg_blur * 1.6, 1.0));
                  }
                  cbg = localAdj(cbg, 1.0, P_mk_bg_ev, P_mk_bg_sat, P_mk_bg_temp);
                  if (P_mk_bg_gray > 0.0) cbg = mix(cbg, vec3(luma(cbg)), P_mk_bg_gray);
                  if (P_mk_bg_tint > 0.0) {
                      vec3 tcb = hsv2rgb(vec3(P_mk_bg_hue / 360.0, 0.8, 1.0));
                      cbg = mix(cbg, vec3(luma(cbg)) * tcb * 1.5, P_mk_bg_tint * 0.7);
                  }
                  c = mix(cbg, csub, am);
              }
              if (hasD && P_fog > 0.0) {
                  float fg = P_fog * smoothstep(P_fog_start, 1.0, 1.0 - dep);
                  c = mix(c, vec3(P_fog_r, P_fog_g, P_fog_b), fg);
              }
              if (hasD && P_relight > 0.0) {
                  vec2 e = 2.0 / uRes;
                  float dx = depthAt(uv + vec2(e.x, 0.0)) - depthAt(uv - vec2(e.x, 0.0));
                  float dy = depthAt(uv + vec2(0.0, e.y)) - depthAt(uv - vec2(0.0, e.y));
                  vec3 nrm = normalize(vec3(-dx * 60.0, dy * 60.0, 1.0));
                  vec3 ldir = normalize(vec3(P_lx, -P_ly, P_lz));
                  float dif = max(dot(nrm, ldir), 0.0);
                  float lit = P_amb + (1.0 - P_amb) * dif * 1.6;
                  c *= mix(1.0, lit, P_relight);
              }

              // ---- light leaks, flare, retro texture
              if (P_leak > 0.0) {
                  float lang = radians(P_leak_pos);
                  vec2 anc = vec2(0.5) + 0.62 * vec2(cos(lang), sin(lang));
                  float ld = length((vUV - anc) * vec2(asp, 1.0));
                  float lg = exp(-ld * ld / (0.04 + P_leak_size * 0.35));
                  vec3 lcol = hsv2rgb(vec3(fract(P_leak_hue / 360.0 + ld * 0.12), 0.85, 1.0));
                  c = 1.0 - (1.0 - clamp(c, 0.0, 1.0)) * (1.0 - clamp(lcol * lg * P_leak * 0.9, 0.0, 1.0));
              }
              if (P_flare > 0.0) {
                  vec2 fp = vec2(0.5 + P_flare_x * 0.5, 0.5 + P_flare_y * 0.5);
                  vec2 dv2 = (vUV - fp) * vec2(asp, 1.0);
                  float fd = length(dv2);
                  vec3 fc = hsv2rgb(vec3(P_flare_hue / 360.0, 0.35, 1.0));
                  float core = exp(-fd * fd / (0.002 + P_flare_size * 0.02));
                  float halo = exp(-fd / (0.05 + P_flare_size * 0.25)) * 0.35;
                  float streak = exp(-abs(dv2.y) * 60.0) * exp(-abs(dv2.x) * 1.8) * P_flare_streak;
                  vec3 fl = fc * (core * 1.4 + halo + streak * 0.6);
                  for (int i = 1; i < 5; i++) {
                      float k = float(i) * 0.35 - 0.2;
                      vec2 gp = mix(fp, vec2(1.0) - fp, k);
                      float gd = length((vUV - gp) * vec2(asp, 1.0));
                      float gr2 = 0.03 + 0.012 * float(i);
                      fl += hsv2rgb(vec3(fract(P_flare_hue / 360.0 + float(i) * 0.17), 0.5, 1.0)) * (1.0 - smoothstep(gr2 * 0.5, gr2, gd)) * 0.12 * P_flare_ghost;
                  }
                  c = 1.0 - (1.0 - clamp(c, 0.0, 1.0)) * (1.0 - clamp(fl * P_flare, 0.0, 1.0));
              }
              if (P_ht_amt > 0.0) {
                  vec2 pp = vUV * uRes;
                  float cell = max(P_ht_size, 2.0);
                  vec3 cc = clamp(c, 0.0, 1.0);
                  vec3 ht;
                  if (P_ht_col > 0.5) ht = vec3(1.0 - inkdot(pp, 0.2618, cell, cc.r), 1.0 - inkdot(pp, 1.309, cell, cc.g), 1.0 - inkdot(pp, 0.0, cell, cc.b));
                  else ht = vec3(1.0 - inkdot(pp, radians(P_ht_angle), cell, luma(cc)));
                  c = mix(c, ht, P_ht_amt);
              }
              if (P_dith_amt > 0.0) {
                  ivec2 ip = ivec2(mod(floor(vUV * uRes), 4.0));
                  float th = (BAYER[ip.y * 4 + ip.x] + 0.5) / 16.0;
                  float lv2 = max(P_dith_lv, 2.0);
                  vec3 dq2 = floor(clamp(c, 0.0, 1.0) * (lv2 - 1.0) + th) / (lv2 - 1.0);
                  c = mix(c, dq2, P_dith_amt);
              }
              if (P_scan_amt > 0.0) {
                  float sy = vUV.y * uRes.y / max(P_scan_size, 1.0);
                  float sl = 0.5 + 0.5 * sin(sy * 6.2831853);
                  c *= 1.0 - P_scan_amt * 0.5 * (1.0 - sl);
              }
              if (P_scan_rgb > 0.0) {
                  float cxm = mod(floor(vUV.x * uRes.x / max(P_scan_size, 1.0)), 3.0);
                  vec3 mk = vec3(cxm < 0.5 ? 1.0 : 0.55, (cxm > 0.5 && cxm < 1.5) ? 1.0 : 0.55, cxm > 1.5 ? 1.0 : 0.55);
                  c *= mix(vec3(1.0), mk * 1.15, P_scan_rgb);
              }
              if (P_vhs_amt > 0.0) {
                  float vrow = floor(vUV.y * uRes.y * 0.5);
                  c += (hash12(vec2(floor(vUV.x * uRes.x * 0.25), vrow)) - 0.5) * 0.14 * P_vhs_amt;
                  c.r = mix(c.r, textureLod(uImg, clamp(uv + vec2(0.006 * P_vhs_amt, 0.0), 0.0, 1.0), 1.0).r, 0.6);
                  c = mix(c, vec3(luma(c)), 0.12 * P_vhs_amt);
              }
              if (P_dust_amt > 0.0) {
                  float cellD = 2.0 + P_dust_size * 14.0;
                  vec2 gpD = floor(vUV * uRes / cellD);
                  vec2 lcD = fract(vUV * uRes / cellD) - 0.5;
                  float hD = hash12(gpD + 91.0);
                  float radD = 0.15 + 0.3 * hash12(gpD + 3.0);
                  float spot = step(1.0 - P_dust_amt * 0.02, hD) * (1.0 - smoothstep(radD * 0.5, radD, length(lcD)));
                  float lightD = hash12(gpD + 7.0) > 0.5 ? 1.0 : 0.05;
                  c = mix(c, vec3(lightD), spot * 0.8);
              }
              if (P_scr_amt > 0.0) {
                  float sx = floor(vUV.x * uRes.x / 2.0);
                  float hs = hash11(sx * 1.37);
                  float seg = hash12(vec2(sx, floor(vUV.y * 6.0)));
                  if (hs > 1.0 - P_scr_amt * 0.03 && seg > 0.7) c += 0.18;
              }
              if (P_paper_amt > 0.0) {
                  float pn = vnoise(vUV * uRes / 3.0) * 0.5 + vnoise(vUV * uRes / 11.0) * 0.5;
                  c *= 1.0 - P_paper_amt * 0.18 * (1.0 - pn);
                  c = mix(c, c * vec3(1.0, 0.97, 0.9), P_paper_amt * 0.4);
              }

              // ---- vignette and grain
              if (P_vig != 0.0) {
                  float rnd2 = mix(1.0, asp, P_vig_round);
                  vec2 q = (vUV - 0.5 - vec2(P_vig_x, P_vig_y) * 0.5) * vec2(rnd2, 1.0);
                  float dd = length(q) / (0.5 * length(vec2(rnd2, 1.0)));
                  float vv = smoothstep(P_vig_size * 0.9, P_vig_size * 0.9 + 0.08 + P_vig_feather * 0.7, dd);
                  int vt = int(P_vig_tint + 0.5);
                  vec3 vtint = vt == 1 ? vec3(1.0, 0.86, 0.7) : (vt == 2 ? vec3(0.75, 0.88, 1.0) : (vt == 3 ? vec3(1.0, 0.92, 0.78) : vec3(1.0)));
                  c *= mix(vec3(1.0), vtint, clamp(-P_vig * vv, 0.0, 1.0)) * (1.0 + P_vig * vv * 0.95);
              }
              if (P_grain > 0.0) {
                  float gs = max(P_grain_size, 1.0);
                  vec2 gp = floor(vUV * uRes / gs);
                  float n1 = hash12(gp + 17.0);
                  float n2 = vnoise(vUV * uRes / (gs * 3.0));
                  float nz = mix(n1, mix(n1, n2, 0.6), P_grain_rough);
                  float gamt = P_grain * 0.22 * (1.0 - 0.5 * luma(c));
                  c += (nz - 0.5) * gamt;
                  if (P_grain_color > 0.0) c += (vec3(hash12(gp + 31.0), hash12(gp + 53.0), hash12(gp + 77.0)) - 0.5) * gamt * P_grain_color * 1.5;
              }

              // ---- cinema bars and frame
              if (P_bars_amt > 0.0) {
                  int br = int(P_bars_ratio + 0.5);
                  float ar = br == 0 ? 2.39 : (br == 1 ? 2.0 : (br == 2 ? 1.85 : (br == 3 ? 1.7778 : (br == 4 ? 1.3333 : 1.0))));
                  vec2 pa = abs(vUV - 0.5);
                  bool outside;
                  if (ar > asp) outside = pa.y > 0.5 * asp / ar; else outside = pa.x > 0.5 * ar / asp;
                  if (outside) c *= 1.0 - P_bars_amt;
              }
              if (P_frame_w > 0.0) {
                  float mnd = min(uRes.x, uRes.y);
                  float pxw = P_frame_w * 0.12 * mnd;
                  vec2 pxp = (vUV - 0.5) * uRes;
                  vec2 hs2 = 0.5 * uRes - pxw;
                  float rad3 = clamp(P_frame_round, 0.0, 1.0) * min(hs2.x, hs2.y);
                  vec2 qd = abs(pxp) - hs2 + rad3;
                  float sd = length(max(qd, 0.0)) + min(max(qd.x, qd.y), 0.0) - rad3;
                  int fcl = int(P_frame_col + 0.5);
                  vec3 fcol = fcl == 0 ? vec3(0.97) : (fcl == 1 ? vec3(0.03) : (fcl == 2 ? vec3(0.93, 0.89, 0.8) : (fcl == 3 ? vec3(0.5) : textureLod(uImg, vUV, 5.0).rgb * 0.9)));
                  if (P_frame_sh > 0.0 && sd < 0.0) c *= 1.0 - P_frame_sh * 0.55 * (1.0 - smoothstep(0.0, 0.03 * mnd, -sd));
                  c = mix(c, fcol, smoothstep(-0.75, 0.75, sd));
              }

              if (uFlags.y > 0.5 && uMode.x > 0.5) {
                  float a = texture(uMask, uv).r;
                  int m = int(uMode.x + 0.5);
                  if (m == 7) {
                      fragColor = vec4(clamp(c, 0.0, 1.0), a);
                      return;
                  } else if (m == 6) {
                      c = mix(c, vec3(1.0, 0.15, 0.3), (1.0 - a) * 0.55);
                  } else {
                      vec3 bg;
                      if (m == 1) {
                          float ch = mod(floor(gl_FragCoord.x / 14.0) + floor(gl_FragCoord.y / 14.0), 2.0);
                          bg = mix(vec3(0.62), vec3(0.88), ch);
                      } else if (m == 2) {
                          bg = vec3(1.0);
                      } else if (m == 3) {
                          bg = vec3(0.0);
                      } else if (m == 4) {
                          bg = vec3(0.0, 0.8, 0.2);
                      } else {
                          bg = textureLod(uImg, uv, 4.5).rgb * 0.8;
                      }
                      c = mix(bg, c, a);
                  }
              }

              c = clamp(c, 0.0, 1.0);

              // ---- on-screen aids (never part of an export)
              if (uExport < 0.5) {
                  if (uCrop.x > 0.0) {
                      vec2 csz = uCrop.x > asp ? vec2(1.0, asp / uCrop.x) : vec2(uCrop.x / asp, 1.0);
                      vec2 cmn = (1.0 - csz) * uCrop.yz;
                      vec2 cmx = cmn + csz;
                      bool inside = vUV.x >= cmn.x && vUV.x <= cmx.x && vUV.y >= cmn.y && vUV.y <= cmx.y;
                      if (!inside) c *= 1.0 - uCrop.w;
                  }
                  int gd = int(P_guide + 0.5);
                  if (gd > 0) {
                      vec2 fw = fwidth(vUV) * 1.2;
                      float thirds = max(max(gl1(vUV.x - 0.3333, fw.x), gl1(vUV.x - 0.6667, fw.x)), max(gl1(vUV.y - 0.3333, fw.y), gl1(vUV.y - 0.6667, fw.y)));
                      float diag = max(gl1((vUV.x - vUV.y) * 0.7, fw.x), gl1((vUV.x + vUV.y - 1.0) * 0.7, fw.x));
                      float ln = 0.0;
                      if (gd == 1) ln = thirds;
                      else if (gd == 2) ln = max(max(gl1(vUV.x - 0.382, fw.x), gl1(vUV.x - 0.618, fw.x)), max(gl1(vUV.y - 0.382, fw.y), gl1(vUV.y - 0.618, fw.y)));
                      else if (gd == 3) ln = diag;
                      else if (gd == 4) ln = max(gl1(vUV.x - 0.5, fw.x), gl1(vUV.y - 0.5, fw.y));
                      else if (gd == 5) ln = max(gl1((fract(vUV.x * 4.0 + 0.5) - 0.5) / 4.0, fw.x), gl1((fract(vUV.y * 4.0 + 0.5) - 0.5) / 4.0, fw.y));
                      else ln = max(thirds, diag);
                      c = mix(c, vec3(1.0), ln * P_guide_op * 0.8);
                  }
                  int cw = int(P_clip_warn + 0.5);
                  if (cw > 0) {
                      float mxc = max(c.r, max(c.g, c.b));
                      float mnc = min(c.r, min(c.g, c.b));
                      if ((cw == 1 || cw == 3) && mxc >= 0.985) c = mix(c, vec3(1.0, 0.1, 0.1), 0.85);
                      if ((cw == 2 || cw == 3) && mnc <= 0.015) c = mix(c, vec3(0.1, 0.3, 1.0), 0.85);
                  }
                  if (P_peak_on > 0.5) {
                      float pe = edgeMag(uv, 1.0);
                      if (pe > P_peak_thr) {
                          int pk = int(P_peak_col + 0.5);
                          vec3 pc = pk == 0 ? vec3(0.1, 1.0, 0.3) : (pk == 1 ? vec3(1.0, 0.15, 0.15) : (pk == 2 ? vec3(1.0, 0.9, 0.1) : vec3(1.0)));
                          c = mix(c, pc, 0.8);
                      }
                  }
                  if (P_split_on > 0.5) {
                      vec3 raw = texture(uImg, vUV).rgb;
                      if (vUV.x > P_split_pos) c = raw;
                      c = mix(c, vec3(1.0), 1.0 - smoothstep(0.0, fwidth(vUV.x) * 1.6, abs(vUV.x - P_split_pos)));
                  }
              }
              fragColor = vec4(c, 1.0);
          }
          """

          class GradeRenderer(private val gv: GradeView) : GLSurfaceView.Renderer {
              var onError: ((String) -> Unit)? = null
              private var prog = 0
              private val ul = HashMap<String, Int>()
              private val tex = IntArray(4)
              private var vao = 0
              private var hasImg = false
              var imgW = 1; private set
              var imgH = 1; private set
              private var hasDepth = false; private var hasMask = false; private var hasLut = false; private var lutN = 0

              @Volatile var pv: FloatArray = FloatArray(0)
              @Volatile var zoom = 1f
              @Volatile var panX = 0f
              @Volatile var panY = 0f
              @Volatile var camX = 0f
              @Volatile var camY = 0f
              @Volatile var camZ = 0f
              @Volatile var camOn = false
              @Volatile var compare = false
              @Volatile var showDepth = false
              @Volatile var maskMode = 0
              @Volatile var cropU = floatArrayOf(0f, 0.5f, 0.5f, 0f)
              @Volatile var time = 0f
              private var vw = 1; private var vh = 1

              private var pImg: Bitmap? = null
              private var pDepth: ByteArray? = null; private var pDW = 0; private var pDH = 0; private var clearDepth = false
              private var pMask: ByteArray? = null; private var pMW = 0; private var pMH = 0; private var clearMask = false
              private var pLut: FloatArray? = null; private var pLutN = 0
              private val lock = Any()

              private var exFbo = 0; private var exTex = 0; private var exW = 0; private var exH = 0
              private var exBuf: ByteBuffer? = null

              private fun err(m: String) { android.util.Log.e("Lumen", m); onError?.invoke(m) }

              fun setImage(b: Bitmap) { synchronized(lock) { pImg = b }; gv.requestRender() }
              fun setDepth(d: ByteArray?, w: Int, h: Int) { synchronized(lock) { if (d == null) clearDepth = true else { pDepth = d; pDW = w; pDH = h } }; gv.requestRender() }
              fun setMask(m: ByteArray?, w: Int, h: Int) { synchronized(lock) { if (m == null) clearMask = true else { pMask = m; pMW = w; pMH = h } }; gv.requestRender() }
              fun setLut(l: FloatArray?, n: Int) { synchronized(lock) { pLut = l; pLutN = n; if (l == null) hasLut = false }; gv.requestRender() }

              fun fitScale(w: Int, h: Int): FloatArray {
                  val va = w.toFloat() / h; val ia = imgW.toFloat() / imgH
                  return if (ia > va) floatArrayOf(1f, va / ia) else floatArrayOf(ia / va, 1f)
              }

              private fun header(): String {
                  val sb = StringBuilder("#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\nprecision highp sampler3D;\n")
                  for ((i, k) in Fx.glKeys.withIndex())
                      sb.append("#define P_").append(k).append(" P[").append(i / 4).append("].").append("xyzw"[i % 4]).append('\n')
                  sb.append("uniform vec4 P[").append((Fx.glKeys.size + 3) / 4).append("];\n")
                  return sb.toString()
              }

              private fun compile(type: Int, src: String): Int {
                  val s = GLES30.glCreateShader(type)
                  GLES30.glShaderSource(s, src)
                  GLES30.glCompileShader(s)
                  val ok = IntArray(1)
                  GLES30.glGetShaderiv(s, GLES30.GL_COMPILE_STATUS, ok, 0)
                  if (ok[0] == 0) { err("Shader error: " + GLES30.glGetShaderInfoLog(s)); return 0 }
                  return s
              }

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  val h = header()
                  val v = compile(GLES30.GL_VERTEX_SHADER, h + VS_SRC)
                  val f = compile(GLES30.GL_FRAGMENT_SHADER, h + FS_SRC)
                  if (v == 0 || f == 0) return
                  prog = GLES30.glCreateProgram()
                  GLES30.glAttachShader(prog, v); GLES30.glAttachShader(prog, f)
                  GLES30.glLinkProgram(prog)
                  val ok = IntArray(1)
                  GLES30.glGetProgramiv(prog, GLES30.GL_LINK_STATUS, ok, 0)
                  if (ok[0] == 0) { err("Link error: " + GLES30.glGetProgramInfoLog(prog)); prog = 0; return }
                  ul.clear()
                  val vaos = IntArray(1)
                  GLES30.glGenVertexArrays(1, vaos, 0); vao = vaos[0]
                  GLES30.glGenTextures(4, tex, 0)
                  GLES30.glPixelStorei(GLES30.GL_UNPACK_ALIGNMENT, 1)
                  for (i in 1..2) {
                      GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex[i])
                      GLES30.glTexImage2D(GLES30.GL_TEXTURE_2D, 0, GLES30.GL_R8, 1, 1, 0, GLES30.GL_RED, GLES30.GL_UNSIGNED_BYTE, ByteBuffer.allocateDirect(1))
                      setLinear(GLES30.GL_TEXTURE_2D, false)
                  }
                  GLES30.glBindTexture(GLES30.GL_TEXTURE_3D, tex[3])
                  GLES30.glTexImage3D(GLES30.GL_TEXTURE_3D, 0, GLES30.GL_RGB16F, 1, 1, 1, 0, GLES30.GL_RGB, GLES30.GL_FLOAT,
                      ByteBuffer.allocateDirect(12).order(ByteOrder.nativeOrder()).asFloatBuffer())
                  setLinear(GLES30.GL_TEXTURE_3D, false)
                  hasImg = false; hasDepth = false; hasMask = false; hasLut = false
                  exFbo = 0; exTex = 0; exW = 0
                  synchronized(lock) { if (pImg == null) pImg = lastImg }
              }

              private var lastImg: Bitmap? = null

              private fun setLinear(target: Int, mip: Boolean) {
                  GLES30.glTexParameteri(target, GLES30.GL_TEXTURE_MIN_FILTER, if (mip) GLES30.GL_LINEAR_MIPMAP_LINEAR else GLES30.GL_LINEAR)
                  GLES30.glTexParameteri(target, GLES30.GL_TEXTURE_MAG_FILTER, GLES30.GL_LINEAR)
                  GLES30.glTexParameteri(target, GLES30.GL_TEXTURE_WRAP_S, GLES30.GL_CLAMP_TO_EDGE)
                  GLES30.glTexParameteri(target, GLES30.GL_TEXTURE_WRAP_T, GLES30.GL_CLAMP_TO_EDGE)
                  if (target == GLES30.GL_TEXTURE_3D) GLES30.glTexParameteri(target, GLES30.GL_TEXTURE_WRAP_R, GLES30.GL_CLAMP_TO_EDGE)
              }

              private fun uploadPending() {
                  var img: Bitmap? = null; var d: ByteArray? = null; var m: ByteArray? = null; var lut: FloatArray? = null
                  var cd = false; var cm = false
                  var dw = 0; var dh = 0; var mw = 0; var mh = 0; var ln = 0
                  synchronized(lock) {
                      img = pImg; pImg = null
                      d = pDepth; pDepth = null; dw = pDW; dh = pDH; cd = clearDepth; clearDepth = false
                      m = pMask; pMask = null; mw = pMW; mh = pMH; cm = clearMask; clearMask = false
                      lut = pLut; pLut = null; ln = pLutN
                  }
                  GLES30.glPixelStorei(GLES30.GL_UNPACK_ALIGNMENT, 1)
                  val bi = img
                  if (bi != null) {
                      lastImg = bi
                      GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex[0])
                      GLUtils.texImage2D(GLES30.GL_TEXTURE_2D, 0, bi, 0)
                      GLES30.glGenerateMipmap(GLES30.GL_TEXTURE_2D)
                      setLinear(GLES30.GL_TEXTURE_2D, true)
                      imgW = bi.width; imgH = bi.height; hasImg = true
                  }
                  if (cd) hasDepth = false
                  val bd = d
                  if (bd != null) {
                      GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex[1])
                      GLES30.glTexImage2D(GLES30.GL_TEXTURE_2D, 0, GLES30.GL_R8, dw, dh, 0, GLES30.GL_RED, GLES30.GL_UNSIGNED_BYTE,
                          ByteBuffer.allocateDirect(bd.size).put(bd).also { it.position(0) })
                      setLinear(GLES30.GL_TEXTURE_2D, false)
                      hasDepth = true
                  }
                  if (cm) hasMask = false
                  val bm = m
                  if (bm != null) {
                      GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex[2])
                      GLES30.glTexImage2D(GLES30.GL_TEXTURE_2D, 0, GLES30.GL_R8, mw, mh, 0, GLES30.GL_RED, GLES30.GL_UNSIGNED_BYTE,
                          ByteBuffer.allocateDirect(bm.size).put(bm).also { it.position(0) })
                      setLinear(GLES30.GL_TEXTURE_2D, false)
                      hasMask = true
                  }
                  val bl = lut
                  if (bl != null && ln > 1) {
                      val fb: FloatBuffer = ByteBuffer.allocateDirect(bl.size * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                      fb.put(bl); fb.position(0)
                      GLES30.glBindTexture(GLES30.GL_TEXTURE_3D, tex[3])
                      GLES30.glTexImage3D(GLES30.GL_TEXTURE_3D, 0, GLES30.GL_RGB16F, ln, ln, ln, 0, GLES30.GL_RGB, GLES30.GL_FLOAT, fb)
                      setLinear(GLES30.GL_TEXTURE_3D, false)
                      lutN = ln; hasLut = true
                  }
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) { vw = width; vh = height }

              override fun onDrawFrame(gl: GL10?) {
                  if (prog != 0) uploadPending()
                  drawScene(vw, vh, 0, false, false)
              }

              private fun loc(n: String): Int = ul.getOrPut(n) { GLES30.glGetUniformLocation(prog, n) }

              private fun drawScene(w: Int, h: Int, fbo: Int, export: Boolean, transparent: Boolean) {
                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, fbo)
                  GLES30.glViewport(0, 0, w, h)
                  GLES30.glClearColor(0.039f, 0.055f, 0.078f, 1f)
                  GLES30.glClear(GLES30.GL_COLOR_BUFFER_BIT)
                  if (prog == 0 || !hasImg) return
                  GLES30.glDisable(GLES30.GL_DEPTH_TEST); GLES30.glDisable(GLES30.GL_BLEND); GLES30.glDisable(GLES30.GL_CULL_FACE)
                  GLES30.glUseProgram(prog)
                  val fit = if (export) floatArrayOf(1f, 1f) else fitScale(w, h)
                  val par = camOn && hasDepth
                  GLES30.glUniform2f(loc("uView"), fit[0], fit[1])
                  GLES30.glUniform4f(loc("uXf"), if (export) 1f else zoom, if (export) 0f else panX, if (export) 0f else panY, 0f)
                  GLES30.glUniform4f(loc("uCam"), camX, camY, camZ, if (par) 1f else 0f)
                  GLES30.glUniform1i(loc("uGrid"), if (par) 128 else 1)
                  GLES30.glUniform2f(loc("uRes"), imgW.toFloat(), imgH.toFloat())
                  GLES30.glUniform4f(loc("uFlags"), if (hasDepth) 1f else 0f, if (hasMask) 1f else 0f, if (hasLut) 1f else 0f, lutN.toFloat())
                  val mm = if (export && transparent) 7f else maskMode.toFloat()
                  GLES30.glUniform4f(loc("uMode"), mm, if (compare && !export) 1f else 0f, if (showDepth && !export) 1f else 0f, time)
                  val cu = cropU
                  GLES30.glUniform4f(loc("uCrop"), cu[0], cu[1], cu[2], cu[3])
                  GLES30.glUniform1f(loc("uExport"), if (export) 1f else 0f)
                  val p = pv
                  if (p.isNotEmpty()) GLES30.glUniform4fv(loc("P"), p.size / 4, p, 0)
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE0); GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex[0])
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE1); GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex[1])
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE2); GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, tex[2])
                  GLES30.glActiveTexture(GLES30.GL_TEXTURE3); GLES30.glBindTexture(GLES30.GL_TEXTURE_3D, tex[3])
                  GLES30.glUniform1i(loc("uImg"), 0); GLES30.glUniform1i(loc("uDepth"), 1)
                  GLES30.glUniform1i(loc("uMask"), 2); GLES30.glUniform1i(loc("uLut"), 3)
                  GLES30.glBindVertexArray(vao)
                  val g = if (par) 128 else 1
                  GLES30.glDrawArrays(GLES30.GL_TRIANGLES, 0, g * g * 6)
              }

              private fun ensureEx(w: Int, h: Int) {
                  if (exFbo != 0 && exW == w && exH == h) return
                  val t = IntArray(1); val f = IntArray(1)
                  if (exTex != 0) { t[0] = exTex; GLES30.glDeleteTextures(1, t, 0) }
                  if (exFbo != 0) { f[0] = exFbo; GLES30.glDeleteFramebuffers(1, f, 0) }
                  GLES30.glGenTextures(1, t, 0); exTex = t[0]
                  GLES30.glBindTexture(GLES30.GL_TEXTURE_2D, exTex)
                  GLES30.glTexImage2D(GLES30.GL_TEXTURE_2D, 0, GLES30.GL_RGBA8, w, h, 0, GLES30.GL_RGBA, GLES30.GL_UNSIGNED_BYTE, null)
                  setLinear(GLES30.GL_TEXTURE_2D, false)
                  GLES30.glGenFramebuffers(1, f, 0); exFbo = f[0]
                  GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, exFbo)
                  GLES30.glFramebufferTexture2D(GLES30.GL_FRAMEBUFFER, GLES30.GL_COLOR_ATTACHMENT0, GLES30.GL_TEXTURE_2D, exTex, 0)
                  exW = w; exH = h
                  exBuf = ByteBuffer.allocateDirect(w * h * 4).order(ByteOrder.nativeOrder())
              }

              /** Renders the full pipeline offscreen and returns RGBA bytes (bottom-up). Blocks the caller. */
              fun exportFrame(w: Int, h: Int, cx: Float, cy: Float, cz: Float, cam: Boolean, transparent: Boolean): ByteBuffer? {
                  val latch = CountDownLatch(1)
                  var out: ByteBuffer? = null
                  gv.queueEvent {
                      try {
                          uploadPending()
                          ensureEx(w, h)
                          val sOn = camOn; val sx = camX; val sy = camY; val sz = camZ
                          camOn = cam; camX = cx; camY = cy; camZ = cz
                          drawScene(w, h, exFbo, true, transparent)
                          val b = exBuf!!
                          b.clear()
                          GLES30.glReadPixels(0, 0, w, h, GLES30.GL_RGBA, GLES30.GL_UNSIGNED_BYTE, b)
                          b.rewind()
                          out = b
                          camOn = sOn; camX = sx; camY = sy; camZ = sz
                          GLES30.glBindFramebuffer(GLES30.GL_FRAMEBUFFER, 0)
                      } catch (e: Throwable) { err("Export error: ${e.message}") }
                      latch.countDown()
                  }
                  gv.requestRender()
                  latch.await(30, TimeUnit.SECONDS)
                  return out
              }
          }

          class GradeView(ctx: Context) : GLSurfaceView(ctx) {
              val r = GradeRenderer(this)
              var brushOn = false
              var onBrush: ((Float, Float, Int) -> Unit)? = null
              var onTap: ((Float, Float) -> Unit)? = null
              var tapX = 0f; var tapY = 0f
              private var downX = 0f; private var downY = 0f; private var downT = 0L; private var tapMoved = false
              private var lx = 0f; private var ly = 0f; private var multi = false
              private val sd = ScaleGestureDetector(ctx, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(d: ScaleGestureDetector): Boolean {
                      val nz = (r.zoom * d.scaleFactor).coerceIn(1f, 10f)
                      val fx = 2f * d.focusX / width - 1f; val fy = 1f - 2f * d.focusY / height
                      val k = nz / r.zoom
                      r.panX = fx - (fx - r.panX) * k; r.panY = fy - (fy - r.panY) * k
                      r.zoom = nz
                      requestRender()
                      return true
                  }
              })

              init {
                  setEGLContextClientVersion(3)
                  setEGLConfigChooser(8, 8, 8, 8, 0, 0)
                  setRenderer(r)
                  renderMode = RENDERMODE_WHEN_DIRTY
                  preserveEGLContextOnPause = true
              }

              fun resetView() { r.zoom = 1f; r.panX = 0f; r.panY = 0f; requestRender() }
              fun oneToOne() {
                  val s = r.fitScale(width, height)
                  r.zoom = (r.imgW / (width * s[0])).coerceIn(1f, 10f); r.panX = 0f; r.panY = 0f; requestRender()
              }

              fun toUv(x: Float, y: Float): FloatArray {
                  val s = r.fitScale(width, height)
                  val nx = 2f * x / width - 1f; val ny = 1f - 2f * y / height
                  val px = (nx - r.panX) / (s[0] * r.zoom); val py = (ny - r.panY) / (s[1] * r.zoom)
                  return floatArrayOf(px * 0.5f + 0.5f, 0.5f - py * 0.5f)
              }

              /** Image pixels covered by one screen pixel. */
              fun imgPerScreen(): Float {
                  val s = r.fitScale(width, height)
                  return r.imgW / (width * s[0] * r.zoom)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  sd.onTouchEvent(e)
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lx = e.x; ly = e.y; multi = false
                          downX = e.x; downY = e.y; downT = SystemClock.uptimeMillis(); tapMoved = false
                          if (brushOn) { val u = toUv(e.x, e.y); onBrush?.invoke(u[0], u[1], 0) }
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          if (brushOn && !multi) { onBrush?.invoke(0f, 0f, 2) }
                          multi = true
                          lx = e.getX(0); ly = e.getY(0)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (Math.abs(e.x - downX) > 18f || Math.abs(e.y - downY) > 18f) tapMoved = true
                          if (e.pointerCount == 1 && !multi) {
                              if (brushOn) { val u = toUv(e.x, e.y); onBrush?.invoke(u[0], u[1], 1) }
                              else pan(e.x - lx, e.y - ly)
                              lx = e.x; ly = e.y
                          } else if (e.pointerCount >= 2) {
                              val cx = (e.getX(0) + e.getX(1)) / 2f; val cy = (e.getY(0) + e.getY(1)) / 2f
                              if (lx != 0f || ly != 0f) pan(cx - lx, cy - ly)
                              lx = cx; ly = cy
                          }
                      }
                      MotionEvent.ACTION_POINTER_UP -> { lx = 0f; ly = 0f }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          if (brushOn && !multi) onBrush?.invoke(0f, 0f, 2)
                          if (e.actionMasked == MotionEvent.ACTION_UP && !multi && !tapMoved && !brushOn && SystemClock.uptimeMillis() - downT < 350L) {
                              tapX = e.x; tapY = e.y
                              val u = toUv(e.x, e.y)
                              onTap?.invoke(u[0], u[1])
                          }
                          multi = false
                      }
                  }
                  return true
              }

              private fun pan(dx: Float, dy: Float) {
                  if (r.zoom <= 1.001f) return
                  r.panX = (r.panX + 2f * dx / width).coerceIn(-r.zoom, r.zoom)
                  r.panY = (r.panY - 2f * dy / height).coerceIn(-r.zoom, r.zoom)
                  requestRender()
              }
          }
