              private fun buildReport(): String {
                  val sb = StringBuilder()
                  sb.append("MossMini report\n")
                  sb.append("app ").append(appVer).append(" | engine ").append(sdCommit.take(12)).append(" | built ").append(builtAt).append('\n')
                  sb.append("device ").append(Build.MANUFACTURER).append(' ').append(Build.MODEL).append(" | ").append(soc())
                      .append(" | android ").append(Build.VERSION.RELEASE).append('\n')
                  sb.append("ram total ").append(totalMemMb()).append(" MB, free ").append(availMemMb()).append(" MB | disk free ")
                      .append(freeDiskMb()).append(" MB\n")
                  sb.append("temp ").append(battTempC()).append(" C, thermal ").append(thermal()).append('\n')
                  sb.append("CI: ").append(testInfo).append('\n')
                  sb.append("proven flags: ").append(proven.joinToString(" ")).append('\n')
                  sb.append("last run: stage ").append(stage).append(" step ").append(stepNow).append('/').append(stepTotal)
                      .append(" | gpu ").append(gpuName.ifEmpty { "-" }).append(" openclSeen=").append(sawOcl)
                      .append(" | blockLoads ").append(blockLoads).append(" seg ").append(segTotal)
                      .append(" | rss ").append(rssNow).append(" peak ").append(rssPeak).append(" MB | cpu ").append(cpuPct)
                      .append("% gpu ").append(gpuPct).append("%\n")
                  sb.append("pack: ").append(pack.id).append(" | root mode: ").append(rootMode).append(" | ").append(rootInfo).append('\n')
                  sb.append("\n-- engine help (backend/memory lines)\n")
                  for (ln in helpText.split('\n')) {
                      val q = ln.lowercase(Locale.ROOT)
                      if (q.contains("backend") || q.contains("flash") || q.contains("segment") || q.contains("vram") ||
                          q.contains("offload") || q.contains("tiling") || q.contains("graph")) sb.append(ln.trim()).append('\n')
                  }
                  sb.append("\n-- checks\n")
                  for (x in items) sb.append(listOf("[ok]", "[warn]", "[FAIL]", "[info]")[x.level.coerceIn(0, 3)]).append(' ').append(x.text).append('\n')
                  sb.append("\n-- attempts\n")
                  for (a in attempts) sb.append(a.label).append(" | exit ").append(a.code).append(" | ").append(a.secs).append("s | peak ")
                      .append(a.peakMb).append(" MB | ").append(a.note).append('\n')
                  if (diagText.isNotEmpty()) sb.append("\n-- diagnosis\n").append(diagText).append('\n')
                  val snap = synchronized(logs) { ArrayList(logs) }
                  sb.append("\n-- stage transitions\n")
                  for (e in snap.filter { e -> e.src == 0 && e.text.startsWith("stage") }) sb.append(e.text).append('\n')
                  sb.append("\n-- warnings and errors (last 40)\n")
                  for (e in snap.filter { e -> e.lvl >= 2 }.takeLast(40)) sb.append(e.text).append('\n')
                  sb.append("\n-- log tail (last 120 lines)\n")
                  for (e in snap.takeLast(120)) sb.append(e.text).append('\n')
                  val s = sb.toString()
                  return if (s.length > 60000) s.takeLast(60000) else s
              }

              // =====================================================================
              //  rendering (UI thread only)
              // =====================================================================
              private fun sampleProc(now: Long) {
                  gpuPct = readGpuPct()
                  val pid = enginePid
                  if (pid <= 0) return
                  val s = readProc(pid)
                  if (s[0] >= 0) {
                      rssNow = s[0]
                      if (s[0] > rssPeak) rssPeak = s[0]
                  }
                  if (s[1] > rssPeak) rssPeak = s[1]
                  if (s[2] >= 0) {
                      if (lastReadT == 0L) {
                          lastReadMb = s[2]
                          lastReadT = now
                      } else {
                          val dt = (now - lastReadT) / 1000.0
                          if (dt > 0.3) {
                              diskRate = ((s[2] - lastReadMb) / dt).toLong().coerceAtLeast(0L)
                              lastReadMb = s[2]
                              lastReadT = now
                          }
                      }
                  }
                  if (s[3] >= 0) {
                      if (lastCpuT > 0L && now > lastCpuT && lastCpuTicks >= 0L) {
                          cpuPct = ((s[3] - lastCpuTicks) * 1000L / (now - lastCpuT)).coerceAtLeast(0L)
                      }
                      lastCpuTicks = s[3]
                      lastCpuT = now
                  }
              }

              private fun hintText(silentS: Long): String {
                  val runS = (System.currentTimeMillis() - runStart) / 1000
                  val cpuBound = curKind == "gpu" && cpuPct >= 200 && gpuPct in 0..10 && runS > 30
                  val cpuMsg = "Engine CPU " + cpuPct + "%, GPU " + gpuPct + "%: the heavy work is running on the CPU, so GPU mode is not accelerating this model. Expect it to be slow."
                  if (silentS < 25) return if (cpuBound) cpuMsg else ""
                  val live = "engine CPU " + cpuPct + "%" + (if (gpuPct >= 0) ", GPU " + gpuPct + "%" else "")
                  val what = when {
                      stage <= 0 && diskRate >= 1 -> "Loading weights from storage ($diskRate MB/s)."
                      stage <= 0 -> "No output and no disk reads: GPU kernels may be building (first run 1-3 min)."
                      stage == 2 && stepNow == 0 -> "Waiting for the first sampling step (the slowest one)."
                      stage == 3 -> "Final compute; this engine prints nothing here."
                      else -> "Quiet."
                  }
                  val verdict = when {
                      cpuBound -> " The heavy work is on the CPU, not the GPU, so it will be slow."
                      cpuPct >= 20 || gpuPct >= 10 || diskRate >= 1 -> " It is working."
                      gpuPct >= 0 -> " Looks idle; if this lasts over 2 min it may be stuck."
                      else -> " CPU is idle and GPU load is unreadable here, so it may still be computing on the GPU."
                  }
                  return "Quiet for " + silentS + "s. " + what + " (" + live + ")" + verdict
              }

              private fun renderHero(now: Long, running: Boolean, dling: Boolean) {
                  var chipT = "IDLE"
                  var chipC = Pal.sub
                  var title = ""
                  var sub = ""
                  var stg = -1
                  var fail = false
                  var frac = 0f
                  var indet = false
                  when {
                      running -> {
                          chipT = "RUNNING"
                          chipC = Pal.warn
                          stg = stage.coerceIn(0, 4)
                          title = when (stg) {
                              0 -> "Loading models"
                              1 -> "Encoding prompt"
                              2 -> if (stepTotal > 0) "Sampling  $stepNow / $stepTotal" else "Starting sampler"
                              3 -> "Decoding image"
                              else -> "Saving"
                          }
                          sub = "\u25B8 " + lastLine
                          if (stg == 2 && stepTotal > 0) frac = stepNow.toFloat() / stepTotal else indet = true
                      }
                      dling -> {
                          chipT = "DOWNLOADING"
                          chipC = Pal.info
                          title = "Fetching model files"
                          sub = dlInfo
                          frac = overallFrac()
                      }
                      hs == 2 -> {
                          chipT = "DONE"
                          chipC = Pal.g1
                          stg = 5
                          title = "Image ready"
                          sub = doneInfo
                          frac = 1f
                      }
                      hs == 3 -> {
                          chipT = "FAILED"
                          chipC = Pal.err
                          stg = failStage.coerceIn(0, 4)
                          fail = true
                          title = "Generation failed"
                          sub = "See the diagnosis below"
                      }
                      ready -> {
                          chipT = "READY"
                          chipC = Pal.g1
                          title = "Ready to generate"
                          sub = items.size.toString() + " checks passed \u00B7 engine " + sdCommit.take(8)
                      }
                      else -> {
                          chipT = "BLOCKED"
                          chipC = Pal.warn
                          title = "Setup needed"
                          sub = items.firstOrNull { x -> x.level == 2 }?.text ?: "checking\u2026"
                      }
                  }
                  heroChip.text = chipT
                  heroChip.recolor(chipC)
                  heroTitle.text = title
                  heroSub.text = sub
                  strip.stage = stg
                  strip.failed = fail
                  heroBar.indeterminate = indet
                  heroBar.frac = frac
                  heroBar.color = if (fail) Pal.err else if (hs == 2 && !running) Pal.g1 else Pal.g2
                  heroBeat.text = if (busy) (if (beat) "\u25CF live" else "\u25CB live") else ""

                  if (running || dling || hs == 2) {
                      val k = curKind.uppercase(Locale.ROOT)
                      var mt = if (k.isEmpty()) "" else k
                      if (gpuName.isNotEmpty()) mt += " \u00B7 " + gpuName
                      if (mt.isNotEmpty()) mt += " \u00B7 " + tierNames[curTier.coerceIn(0, 2)]
                      if (rootActive) mt += " \u00B7 root"
                      if (attemptTotal > 1) mt += " \u00B7 try $attemptIdx/$attemptTotal"
                      if (mt.isNotEmpty() && !dling) {
                          heroMode.text = mt
                          heroMode.recolor(if (curKind == "gpu") Pal.info else Pal.sub)
                          heroMode.visibility = View.VISIBLE
                      } else heroMode.visibility = View.GONE
                  } else heroMode.visibility = View.GONE

                  val silent = if (running) (now - lastOutMs) / 1000 else 0L
                  val hint = if (running) hintText(silent) else ""
                  heroHint.text = hint
                  heroHint.visibility = if (hint.isEmpty()) View.GONE else View.VISIBLE

                  // action button
                  val showAct = !busy && !ready && hs != 3
                  heroAction.visibility = if (showAct) View.VISIBLE else View.GONE
                  if (showAct) {
                      val filesBad = files.indices.any { i -> fLevel[i] != 0 }
                      heroAction.text = if (filesBad) "Go to model files" else "Open checks"
                  }

                  // diagnosis + attempts
                  val sbd = StringBuilder()
                  if (hs == 3 && diagText.isNotEmpty() && !running) sbd.append(diagText)
                  if (attempts.isNotEmpty()) {
                      if (sbd.isNotEmpty()) sbd.append("\n\n")
                      sbd.append("Attempts\n")
                      for ((i, a) in attempts.withIndex()) {
                          sbd.append(i + 1).append(". ").append(a.label.substringBefore(" (")).append("  exit ").append(a.code)
                              .append("  ").append(fmtDur(a.secs)).append("  peak ").append(a.peakMb).append(" MB\n    ").append(a.note).append('\n')
                      }
                  }
                  if (sbd.isEmpty()) {
                      heroDiagBox.visibility = View.GONE
                  } else {
                      heroDiagBox.visibility = View.VISIBLE
                      heroDiag.text = sbd.toString().trimEnd()
                      val tone = if (hs == 3) 1 else 0
                      if (tone != diagTone) {
                          diagTone = tone
                          val c = if (tone == 1) Pal.err else Pal.warn
                          heroDiagBox.background = rounded(this, 14, (c and 0xFFFFFF) or 0x1A000000, (c and 0xFFFFFF) or 0x55000000)
                      }
                  }

                  // stats
                  val el = ((if (running) now else if (runEnd > 0L) runEnd else now) - runStart) / 1000
                  if (running || hs == 2 || hs == 3) {
                      sElapsed.value.text = fmtDur(el)
                      sStep.value.text = if (stepTotal > 0) "$stepNow/$stepTotal" else "-"
                      sSpeed.value.text = if (secIt > 0.0) String.format(Locale.US, "%.1fs", secIt) else "-"
                      sEta.value.text = if (running && stage == 2 && stepTotal > 0 && secIt > 0.0) "~" + fmtDur(((stepTotal - stepNow) * secIt).toLong()) else "-"
                      sRam.value.text = if (rssNow > 0) rssNow.toString() + "M" else "-"
                      sPeak.value.text = if (rssPeak > 0) rssPeak.toString() + "M" else "-"
                  }
                  val free = availMemMb()
                  sFree.value.text = if (free >= 0) free.toString() + "M" else "-"
                  sFree.value.setTextColor(if (free in 0..600) Pal.err else if (free in 0..1200) Pal.warn else Pal.text)
                  sCpu.value.text = if (running) (cpuPct.toString() + "%" + (if (gpuPct >= 0) "/" + gpuPct + "%" else "")) else "-"

                  // temperature chip
                  val tc = battTempC()
                  val th = thermal()
                  if (tc > 0f) {
                      val hot = th >= 3 || tc >= 45f
                      val warm = th >= 2 || tc >= 40f
                      heroTemp.text = String.format(Locale.US, "%.0f\u00B0C", tc) + (if (th >= 2) " \u00B7 hot" else "")
                      heroTemp.recolor(if (hot) Pal.err else if (warm) Pal.warn else Pal.g2)
                      heroTemp.visibility = View.VISIBLE
                  } else heroTemp.visibility = View.GONE
              }

              private fun renderFiles(dling: Boolean) {
                  for (i in files.indices) {
                      rowState[i].text = fText[i]
                      rowState[i].setTextColor(if (fLevel[i] == 0) Pal.g1 else if (fLevel[i] == 1) Pal.warn else Pal.err)
                      rowBar[i].frac = fFrac[i]
                      rowBar[i].color = if (fLevel[i] == 0) Pal.g1 else if (fLevel[i] == 1) Pal.warn else Pal.err
                  }
                  val ok = fLevel.count { l -> l == 0 }
                  cFiles.setBadge("$ok / ${files.size} verified", if (ok == files.size) Pal.g1 else Pal.warn)
                  val total = files.sumOf { m -> m.size }
                  dlSummary.text = if (dling) dlInfo else "${files.size} files \u00B7 " + fmtSize(total) + " \u00B7 resumable"
                  dlBar.frac = overallFrac()
                  dlBar.color = if (ok == files.size) Pal.g1 else Pal.warn

                  val st = if (busy && phase == "dl") 1 else if (busy) 2 else 0
                  if (st != btnDlState) {
                      btnDlState = st
                      btnDl.text = if (st == 1) "Stop" else "Download + verify all"
                      btnDl.paint(if (st == 1) 3 else 1)
                      btnDl.alpha = if (st == 2) 0.45f else 1f
                      btnDl.isEnabled = st != 2
                  }
              }

              private fun renderGenButton() {
                  val st = if (busy && phase == "gen") 2 else if (!busy && ready) 0 else 1
                  if (st != btnGenState) {
                      btnGenState = st
                      btnGen.text = if (st == 2) "Stop" else "Generate"
                      btnGen.paint(if (st == 2) 3 else 0)
                      btnGen.alpha = if (st == 1) 0.4f else 1f
                      btnGen.isEnabled = st != 1
                  }
                  if (!busy && ready) cCreate.setBadge("ready", Pal.g1)
                  else if (busy && phase == "gen") cCreate.setBadge("running", Pal.warn)
                  else cCreate.setBadge("blocked", Pal.warn)
              }

              private fun renderLog() {
                  val snap = synchronized(logs) { logDirty = false; ArrayList(logs) }
                  val sel = snap.filter { e ->
                      when (logFilter) {
                          0 -> e.lvl >= 1
                          1 -> e.lvl >= 2
                          2 -> true
                          else -> e.src == 0
                      }
                  }.takeLast(300)
                  val sb = SpannableStringBuilder()
                  for (e in sel) {
                      val col = when {
                          e.lvl >= 3 -> Pal.err
                          e.lvl == 2 -> Pal.warn
                          e.lvl == 0 -> Pal.dim
                          e.src == 0 -> Pal.info
                          else -> Pal.sub
                      }
                      val s = sb.length
                      sb.append(clock.format(Date(e.t))).append(' ').append(e.text).append('\n')
                      sb.setSpan(ForegroundColorSpan(col), s, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  }
                  val atBottom = logScroll.scrollY + logScroll.height >= logView.height - dp(48)
                  logView.text = sb
                  if (atBottom) logScroll.post { logScroll.scrollTo(0, logView.height) }
              }

              private fun renderAll() {
                  val now = System.currentTimeMillis()
                  beat = !beat
                  val running = busy && phase == "gen"
                  val dling = busy && phase == "dl"
                  if (running) sampleProc(now)
                  syncDl()
                  renderHero(now, running, dling)
                  renderFiles(dling)
                  renderGenButton()
                  if (logDirty) renderLog()
              }

