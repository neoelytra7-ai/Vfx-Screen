      - name: "Write Ui.kt"
        run: |
          cat > app/src/main/java/com/mossmini/app/Ui.kt <<'EOF'
          package com.mossmini.app

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.text.InputType
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale

          object Pal {
              val bg = 0xFF060C09.toInt()
              val surface = 0xFF0D1812.toInt()
              val surface2 = 0xFF15261C.toInt()
              val text = 0xFFEAF5E4.toInt()
              val sub = 0xFF9DB9A0.toInt()
              val dim = 0xFF5F7A66.toInt()
              val stroke = 0x33B9E6A8
              val field = 0x66000000
              val g1 = 0xFF8EE07A.toInt()
              val g2 = 0xFF2FB38A.toInt()
              val gold1 = 0xFFF2D36B.toInt()
              val gold2 = 0xFFE59A4B.toInt()
              val warn = 0xFFF2C14B.toInt()
              val err = 0xFFFF7B72.toInt()
              val info = 0xFF7CC4FF.toInt()
              val dark = 0xFF06150D.toInt()
              val danger1 = 0xFFE5857A.toInt()
              val danger2 = 0xFFC2544A.toInt()
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()
          fun Context.dpf(v: Int): Float = v * resources.displayMetrics.density

          fun rounded(ctx: Context, radiusDp: Int, fill: Int, stroke: Int = 0): GradientDrawable =
              GradientDrawable().apply {
                  setColor(fill)
                  cornerRadius = ctx.dpf(radiusDp)
                  if (stroke != 0) setStroke(ctx.dp(1), stroke)
              }

          fun tv(
              ctx: Context, text: String = "", sizeSp: Float = 13f, color: Int = Pal.text,
              mono: Boolean = false, bold: Boolean = false
          ): TextView =
              TextView(ctx).apply {
                  this.text = text
                  textSize = sizeSp
                  setTextColor(color)
                  if (mono) typeface = Typeface.MONOSPACE
                  else if (bold) typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  includeFontPadding = false
              }

          fun TextView.recolor(color: Int) {
              setTextColor(color)
              background = rounded(context, 10, (color and 0xFFFFFF) or 0x26000000, (color and 0xFFFFFF) or 0x55000000)
          }

          fun chip(ctx: Context, text: String, color: Int = Pal.g1): TextView =
              tv(ctx, text, 11f, color, bold = true).apply {
                  setPadding(ctx.dp(10), ctx.dp(5), ctx.dp(10), ctx.dp(5))
                  recolor(color)
              }

          fun fieldView(
              ctx: Context, hint: String, value: String,
              numeric: Boolean = false, decimal: Boolean = true,
              multiline: Boolean = false, compact: Boolean = false
          ): EditText =
              EditText(ctx).apply {
                  this.hint = hint
                  setText(value)
                  setTextColor(Pal.text)
                  setHintTextColor(Pal.dim)
                  textSize = if (compact) 14f else 15f
                  background = rounded(ctx, 14, Pal.field, Pal.stroke)
                  if (compact) {
                      setPadding(ctx.dp(8), ctx.dp(10), ctx.dp(8), ctx.dp(10))
                      gravity = Gravity.CENTER
                      setSingleLine()
                  } else {
                      setPadding(ctx.dp(14), ctx.dp(12), ctx.dp(14), ctx.dp(12))
                  }
                  if (numeric) {
                      inputType = if (decimal) InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                      else InputType.TYPE_CLASS_NUMBER
                      setSelectAllOnFocus(true)
                  } else if (multiline) {
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                      minLines = 2
                  }
              }

          fun labeled(ctx: Context, label: String, v: View): LinearLayout =
              LinearLayout(ctx).apply {
                  orientation = LinearLayout.VERTICAL
                  addView(tv(ctx, label.uppercase(Locale.ROOT), 9.5f, Pal.dim, bold = true).apply { letterSpacing = 0.1f })
                  addView(v, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      .apply { topMargin = ctx.dp(5) })
              }

          /** kind: 0 = green, 1 = gold, 2 = ghost outline, 3 = danger */
          fun Button.paint(kind: Int) {
              val c1: Int
              val c2: Int
              val tc: Int
              when (kind) {
                  0 -> { c1 = Pal.g1; c2 = Pal.g2; tc = Pal.dark }
                  1 -> { c1 = Pal.gold1; c2 = Pal.gold2; tc = Pal.dark }
                  3 -> { c1 = Pal.danger1; c2 = Pal.danger2; tc = Pal.dark }
                  else -> { c1 = 0x00000000; c2 = 0x00000000; tc = Pal.text }
              }
              val bg = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(c1, c2)).apply {
                  cornerRadius = context.dpf(18)
                  if (kind == 2) setStroke(context.dp(1), Pal.stroke)
              }
              setTextColor(tc)
              background = RippleDrawable(ColorStateList.valueOf(0x55FFFFFF), bg, null)
          }

          fun pill(ctx: Context, label: String, kind: Int = 0, compact: Boolean = false): Button =
              Button(ctx).apply {
                  text = label
                  isAllCaps = false
                  textSize = if (compact) 13f else 16f
                  typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  stateListAnimator = null
                  val h = ctx.dp(if (compact) 42 else 56)
                  minHeight = h
                  minimumHeight = h
                  setPadding(ctx.dp(if (compact) 14 else 20), 0, ctx.dp(if (compact) 14 else 20), 0)
                  paint(kind)
                  setOnTouchListener { v, e ->
                      if (e.actionMasked == MotionEvent.ACTION_DOWN) {
                          v.animate().scaleX(0.97f).scaleY(0.97f).setDuration(90).start()
                      } else if (e.actionMasked == MotionEvent.ACTION_UP || e.actionMasked == MotionEvent.ACTION_CANCEL) {
                          v.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                      }
                      false
                  }
              }

          fun LinearLayout.put(
              v: View, topDp: Int = 10,
              w: Int = ViewGroup.LayoutParams.MATCH_PARENT,
              h: Int = ViewGroup.LayoutParams.WRAP_CONTENT
          ) {
              addView(v, LinearLayout.LayoutParams(w, h).apply { topMargin = context.dp(topDp) })
          }

          fun LinearLayout.putW(v: View, weight: Float, leftDp: Int = 0, topDp: Int = 0) {
              addView(v, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, weight).apply {
                  leftMargin = context.dp(leftDp)
                  topMargin = context.dp(topDp)
              })
          }

          /** A titled card with a status badge on the right. */
          class Card(ctx: Context, title: String) {
              val root = LinearLayout(ctx)
              val badge = tv(ctx, "", 10.5f, Pal.sub, bold = true)

              init {
                  root.orientation = LinearLayout.VERTICAL
                  root.background = rounded(ctx, 22, Pal.surface, Pal.stroke)
                  root.setPadding(ctx.dp(16), ctx.dp(14), ctx.dp(16), ctx.dp(16))
                  val head = LinearLayout(ctx)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(
                      tv(ctx, title.uppercase(Locale.ROOT), 11f, Pal.g1, bold = true).apply { letterSpacing = 0.14f },
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  badge.visibility = View.GONE
                  head.addView(badge)
                  root.addView(head)
              }

              fun setBadge(text: String, color: Int) {
                  badge.text = text
                  badge.setPadding(root.context.dp(8), root.context.dp(3), root.context.dp(8), root.context.dp(3))
                  badge.recolor(color)
                  badge.visibility = View.VISIBLE
              }

              fun put(v: View, topDp: Int = 10, h: Int = ViewGroup.LayoutParams.WRAP_CONTENT) = root.put(v, topDp, h = h)
          }

          /** Thin progress bar: determinate or an animated sweep. */
          class BarView(ctx: Context) : View(ctx) {
              private val track = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0x24FFFFFF }
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private var phase = 0f

              var frac: Float = 0f
                  set(v) { field = v.coerceIn(0f, 1f); invalidate() }
              var indeterminate: Boolean = false
                  set(v) { field = v; invalidate() }
              var color: Int = Pal.g1
                  set(v) { field = v; invalidate() }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val r = h / 2f
                  rect.set(0f, 0f, w, h)
                  c.drawRoundRect(rect, r, r, track)
                  fill.color = color
                  if (indeterminate) {
                      phase = (phase + 0.014f) % 1f
                      val seg = w * 0.32f
                      val x = -seg + (w + seg) * phase
                      rect.set(maxOf(0f, x), 0f, minOf(w, x + seg), h)
                      if (rect.width() > 0f) c.drawRoundRect(rect, r, r, fill)
                      postInvalidateOnAnimation()
                  } else if (frac > 0f) {
                      rect.set(0f, 0f, maxOf(h, w * frac), h)
                      c.drawRoundRect(rect, r, r, fill)
                  }
              }
          }

          /** Pipeline strip: Load > Encode > Sample > Decode > Save. stage == names.size means all done. */
          class StageStrip(ctx: Context, private val names: List<String>) : View(ctx) {
              var stage: Int = -1
                  set(v) { field = v; invalidate() }
              var failed: Boolean = false
                  set(v) { field = v; invalidate() }
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val t = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  textSize = ctx.dpf(10)
              }

              override fun onMeasure(wSpec: Int, hSpec: Int) {
                  setMeasuredDimension(MeasureSpec.getSize(wSpec), context.dp(44))
              }

              override fun onDraw(c: Canvas) {
                  val n = names.size
                  if (n == 0) return
                  val cell = width.toFloat() / n
                  val cy = context.dpf(11)
                  val r = context.dpf(6)
                  p.strokeWidth = context.dpf(2)
                  for (i in 0 until n - 1) {
                      p.color = if (i < stage) Pal.g1 else 0x33FFFFFF
                      c.drawLine(cell * i + cell / 2 + r, cy, cell * (i + 1) + cell / 2 - r, cy, p)
                  }
                  for (i in 0 until n) {
                      val cx = cell * i + cell / 2
                      val col = when {
                          failed && i == stage -> Pal.err
                          i < stage -> Pal.g1
                          i == stage -> Pal.warn
                          else -> 0x33FFFFFF
                      }
                      p.style = Paint.Style.FILL
                      p.color = col
                      c.drawCircle(cx, cy, if (i == stage) r + context.dpf(2) else r, p)
                      t.color = if (i <= stage) Pal.text else Pal.dim
                      c.drawText(names[i], cx, context.dpf(36), t)
                  }
              }
          }

          /** A number with a tiny caption under it. */
          class Stat(ctx: Context, label: String, valueColor: Int = Pal.text) {
              val view = LinearLayout(ctx)
              val value = tv(ctx, "-", 15f, valueColor, mono = true)

              init {
                  view.orientation = LinearLayout.VERTICAL
                  view.addView(value)
                  view.addView(
                      tv(ctx, label.uppercase(Locale.ROOT), 9f, Pal.dim, bold = true).apply { letterSpacing = 0.1f },
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          .apply { topMargin = ctx.dp(3) }
                  )
              }
          }

          fun statRow(ctx: Context, vararg s: Stat): LinearLayout =
              LinearLayout(ctx).apply {
                  orientation = LinearLayout.HORIZONTAL
                  for (x in s) putW(x.view, 1f)
              }

          /** Segmented control. */
          class Seg(ctx: Context, options: List<String>, var onChange: (Int) -> Unit = {}) {
              val view = LinearLayout(ctx)
              private val cells = ArrayList<TextView>()
              var selected: Int = 0
                  private set

              init {
                  view.orientation = LinearLayout.HORIZONTAL
                  view.background = rounded(ctx, 14, Pal.field, Pal.stroke)
                  view.setPadding(ctx.dp(3), ctx.dp(3), ctx.dp(3), ctx.dp(3))
                  options.forEachIndexed { i, o ->
                      val t = tv(ctx, o, 13f, Pal.sub, bold = true)
                      t.gravity = Gravity.CENTER
                      t.setPadding(0, ctx.dp(10), 0, ctx.dp(10))
                      t.setOnClickListener { select(i, true) }
                      cells.add(t)
                      view.addView(t, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  select(0, false)
              }

              fun select(i: Int, fire: Boolean = true) {
                  selected = i
                  cells.forEachIndexed { k, t ->
                      if (k == i) {
                          t.setTextColor(Pal.dark)
                          t.background = rounded(t.context, 11, Pal.g1)
                      } else {
                          t.setTextColor(Pal.sub)
                          t.background = null
                      }
                  }
                  if (fire) onChange(i)
              }
          }
          EOF

