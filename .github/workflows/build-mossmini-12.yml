          package com.mossmini.app

          import android.app.ActivityManager
          import android.content.Context
          import android.os.StatFs
          import java.io.File
          import java.util.Locale

          /** Shared between the three screens so two heavy engines never run at once. */
          object Run {
              @Volatile var imageBusy = false
              @Volatile var chatBusy = false
          }

          object Sys {
              fun availMemMb(): Long = try {
                  File("/proc/meminfo").readLines().first { it.startsWith("MemAvailable") }
                      .filter { it.isDigit() }.toLong() / 1024
              } catch (e: Exception) { -1L }

              fun totalMemMb(ctx: Context): Long = try {
                  val mi = ActivityManager.MemoryInfo()
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  am.getMemoryInfo(mi)
                  mi.totalMem shr 20
              } catch (e: Exception) { -1L }

              fun freeDiskMb(dir: File): Long = try { StatFs(dir.path).availableBytes shr 20 } catch (e: Exception) { -1L }

              fun fmtSize(b: Long): String =
                  if (b >= (1L shl 30)) String.format(Locale.US, "%.2f GB", b / 1073741824.0)
                  else (b shr 20).toString() + " MB"

              fun fmtDur(s: Long): String {
                  val t = if (s < 0L) 0L else s
                  val h = t / 3600
                  val m = (t % 3600) / 60
                  val sec = t % 60
                  return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, sec)
                  else String.format(Locale.US, "%d:%02d", m, sec)
              }

              fun pidOf(p: Process): Int {
                  try { return (p.javaClass.getMethod("pid").invoke(p) as Number).toInt() } catch (e: Exception) { }
                  try {
                      val f = p.javaClass.getDeclaredField("pid")
                      f.isAccessible = true
                      return f.getInt(p)
                  } catch (e: Exception) { }
                  return -1
              }

              /** returns [rssMb, peakMb, readMb, cpuTicks], -1 when unavailable */
              fun readProc(pid: Int): LongArray {
                  var rss = -1L
                  var hwm = -1L
                  var rd = -1L
                  var cpu = -1L
                  try {
                      File("/proc/$pid/status").forEachLine { ln ->
                          if (ln.startsWith("VmRSS:")) rss = ln.filter { c -> c.isDigit() }.toLong() / 1024
                          else if (ln.startsWith("VmHWM:")) hwm = ln.filter { c -> c.isDigit() }.toLong() / 1024
                      }
                  } catch (e: Exception) { }
                  try {
                      File("/proc/$pid/io").forEachLine { ln ->
                          if (ln.startsWith("read_bytes:")) rd = ln.substringAfter(':').trim().toLong() shr 20
                      }
                  } catch (e: Exception) { }
                  try {
                      val st = File("/proc/$pid/stat").readText()
                      val parts = st.substring(st.lastIndexOf(')') + 2).split(' ')
                      cpu = parts[11].toLong() + parts[12].toLong()
                  } catch (e: Exception) { }
                  return longArrayOf(rss, hwm, rd, cpu)
              }

              fun readGpuPct(): Int {
                  try {
                      val t = File("/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage").readText().trim()
                      val d = t.filter { c -> c.isDigit() }
                      if (d.isNotEmpty()) return d.toInt().coerceIn(0, 100)
                  } catch (e: Exception) { }
                  try {
                      val p = File("/sys/class/kgsl/kgsl-3d0/gpubusy").readText().trim().split(' ').filter { x -> x.isNotEmpty() }
                      if (p.size >= 2) {
                          val tt = p[1].toLong()
                          if (tt > 0) return (p[0].toLong() * 100 / tt).toInt().coerceIn(0, 100)
                      }
                  } catch (e: Exception) { }
                  return -1
              }
          }
