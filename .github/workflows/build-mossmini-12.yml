              private fun group(content: LinearLayout, kind: String, label: String, emptyNote: String) {
                  val h = tv(this, label.uppercase(), 11f, Pal.dim, bold = true)
                  h.letterSpacing = 0.14f
                  content.put(h, 22)
                  val list = mf.packs.filter { p -> p.kind == kind }
                  if (list.isEmpty()) {
                      content.put(tv(this, emptyNote, 12f, Pal.sub), 8)
                      return
                  }
                  for (p in list) content.put(packCard(p).root, 10)
              }

              private fun packCard(p: Pack): Card {
                  val c = Card(this, p.title)
                  c.put(tv(this, p.desc, 12f, Pal.sub), 10)
                  val chips = LinearLayout(this)
                  chips.orientation = LinearLayout.HORIZONTAL
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT
                  fun add(text: String, color: Int) {
                      chips.addView(chip(this, text, color), LinearLayout.LayoutParams(wc, wc).apply { rightMargin = dp(6) })
                  }
                  add(if (p.kind == "image") "IMAGE" else "CHAT", Pal.info)
                  if (p.quant.isNotEmpty()) add(p.quant, Pal.sub)
                  when (p.gpu) {
                      "good" -> add("GPU-friendly", Pal.g1)
                      "mixed" -> add("partly GPU", Pal.warn)
                      else -> add("CPU-heavy", Pal.err)
                  }
                  if (p.vision) add("vision", Pal.gold1)
                  add(Sys.fmtSize(p.totalBytes), Pal.sub)
                  if (p.license.isNotEmpty()) add(p.license, Pal.dim)
                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  hs.addView(chips)
                  c.put(hs, 10)
                  val st = tv(this, "", 11.5f, Pal.sub, mono = true)
                  c.put(st, 10)
                  val bar = BarView(this)
                  c.put(bar, 8, h = dp(5))
                  val fl = tv(this, "", 10.5f, Pal.dim, mono = true)
                  c.put(fl, 8)
                  val br = LinearLayout(this)
                  br.orientation = LinearLayout.HORIZONTAL
                  val bDl = pill(this, "Download", 1, compact = true)
                  val bSel = pill(this, "Use", 0, compact = true)
                  val bDel = pill(this, "Delete", 2, compact = true)
                  br.putW(bDl, 1.3f)
                  br.putW(bSel, 1f, leftDp = 8)
                  br.putW(bDel, 1f, leftDp = 8)
                  c.put(br, 12)
                  bDl.setOnClickListener { onDownload(p) }
                  bSel.setOnClickListener { Catalog.select(this, p); refresh() }
                  bDel.setOnClickListener { confirmDelete(p) }
                  rows.add(Row(p, c, st, bar, bDl, bSel, bDel, fl))
                  return c
              }

              private fun build() {
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT
                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.setPadding(dp(14), dp(14), dp(14), dp(40))
                  val root = ScrollView(this)
                  root.setBackgroundColor(Pal.bg)
                  root.fitsSystemWindows = true
                  root.addView(content, ViewGroup.LayoutParams(mp, wc))

                  val title = tv(this, "Models", 30f, Pal.text)
                  title.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  content.addView(title)
