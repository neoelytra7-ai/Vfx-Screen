                  chatView.setPadding(dp(10), dp(8), dp(10), dp(8))
                  chatScroll = ScrollView(this)
                  chatScroll.background = rounded(this, 12, Pal.field)
                  chatScroll.setOnTouchListener { v, _ ->
                      v.parent.requestDisallowInterceptTouchEvent(true)
                      false
                  }
                  chatScroll.addView(chatView, ViewGroup.LayoutParams(mp, wc))
                  cc.put(chatScroll, 12, h = dp(360))
                  imgChip = chip(this, "image attached \u00B7 tap to remove", Pal.gold1)
                  imgChip.visibility = View.GONE
                  imgChip.setOnClickListener { pendingImage = null; imgChip.visibility = View.GONE }
                  cc.root.addView(imgChip, LinearLayout.LayoutParams(wc, wc).apply { topMargin = dp(8) })
                  input = fieldView(this, "Message", "", multiline = true)
                  cc.put(input, 10)
                  val sr = LinearLayout(this)
                  sr.orientation = LinearLayout.HORIZONTAL
                  btnSend = pill(this, "Send", 0, compact = true)
                  btnSend.setOnClickListener { if (streaming) stopReq = true else send() }
                  btnImg = pill(this, "Attach image", 2, compact = true)
                  btnImg.visibility = View.GONE
                  btnImg.setOnClickListener {
                      val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      i.addCategory(Intent.CATEGORY_OPENABLE)
                      i.type = "image/*"
                      startActivityForResult(i, 91)
                  }
                  val bClear = pill(this, "Clear", 2, compact = true)
                  bClear.setOnClickListener { if (!streaming) { msgs.clear(); renderChat(true) } }
                  sr.putW(btnSend, 1.3f)
                  sr.putW(btnImg, 1.3f, leftDp = 8)
                  sr.putW(bClear, 1f, leftDp = 8)
                  cc.put(sr, 10)
                  content.put(cc.root, 14)

                  val cl = Card(this, "Engine log")
                  logView = tv(this, "", 10.5f, Pal.sub, mono = true)
                  cl.put(logView, 12)
                  val bCopy = pill(this, "Copy log", 2, compact = true)
                  bCopy.setOnClickListener {
                      val cmg = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cmg.setPrimaryClip(ClipData.newPlainText("MossMini chat log", synchronized(engLog) { engLog.joinToString("\n") }))
                  }
                  cl.put(bCopy, 10)
                  content.put(cl.root, 14)
                  setContentView(root)
                  renderChat(true)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req != 91 || res != RESULT_OK || data == null) return
                  val u = data.data ?: return
                  thread { loadImage(u) }
              }

              private fun loadImage(u: Uri) {
                  try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      contentResolver.openInputStream(u)?.use { s -> BitmapFactory.decodeStream(s, null, o) }
                      var sample = 1
                      while (maxOf(o.outWidth, o.outHeight) / sample > 1280) sample *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = sample
                      val bmp = contentResolver.openInputStream(u)?.use { s -> BitmapFactory.decodeStream(s, null, o2) }
                      if (bmp == null) { addLog("Could not read that image."); return }
                      val bo = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.JPEG, 85, bo)
                      pendingImage = Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP)
                      ui.post { imgChip.visibility = View.VISIBLE }
                  } catch (e: Exception) { addLog("Image load failed: $e") }
              }

              // ------------------------------------------------------------ log + render
              private fun addLog(s: String) {
                  synchronized(engLog) {
                      engLog.add(s)
                      if (engLog.size > 400) engLog.subList(0, 100).clear()
                      logDirty = true
                  }
              }

              private fun renderChat(force: Boolean) {
                  val now = System.currentTimeMillis()
                  if (!force && now - lastRender < 120) return
                  lastRender = now
                  val sb = SpannableStringBuilder()
                  val p = pack
                  for (m in msgs) {
                      val who = if (m.role == "user") "You" else (p?.title?.substringBefore(" - ") ?: "Model")
                      val s0 = sb.length
                      sb.append(who).append(if (m.img != null) "  [image]" else "").append('\n')
                      sb.setSpan(ForegroundColorSpan(if (m.role == "user") Pal.info else Pal.g1), s0, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      if (m.think.isNotEmpty()) {
                          val s1 = sb.length
                          sb.append("thinking: ").append(m.think.trim()).append('\n')
                          sb.setSpan(ForegroundColorSpan(Pal.dim), s1, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      }
                      sb.append(m.text).append("\n\n")
                  }
                  val atBottom = chatScroll.scrollY + chatScroll.height >= chatView.height - dp(60)
                  chatView.text = if (msgs.isEmpty()) "Load a model, then say something." else sb
                  if (atBottom || force) chatScroll.post { chatScroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun renderStats() {
                  val running = state == 2 || state == 1
                  when (state) {
                      0 -> { heroChip.text = "UNLOADED"; heroChip.recolor(Pal.sub) }
                      1 -> { heroChip.text = "LOADING"; heroChip.recolor(Pal.warn) }
                      2 -> { heroChip.text = if (streaming) "THINKING" else "READY"; heroChip.recolor(Pal.g1) }
                      else -> { heroChip.text = "FAILED"; heroChip.recolor(Pal.err) }
                  }
                  val p = pack
                  heroTitle.text = when (state) {
                      0 -> "Model not loaded"
                      1 -> "Loading " + (p?.title?.substringBefore(" - ") ?: "")
                      2 -> if (streaming) "Generating\u2026" else "Ready to chat"
                      else -> "Server failed"
                  }
                  val sub = StringBuilder()
                  if (state == 3) sub.append(lastFail)
                  else {
                      sub.append(if (segGpu.selected == 0) "GPU requested" else "CPU only")
                      if (gpuName.isNotEmpty()) sub.append(" \u00B7 ").append(gpuName)
                      if (offload.isNotEmpty()) sub.append(" \u00B7 layers on GPU ").append(offload)
                      if (Root.active) sub.append(" \u00B7 root " + (if (rootMode >= 2) "strict" else "boost"))
                  }
                  heroSub.text = sub.toString()
                  btnLoad.text = if (state == 1) "Cancel loading" else if (state == 2) "Unload model" else "Load model"
                  btnLoad.paint(if (state == 1 || state == 2) 3 else 0)
                  btnSend.text = if (streaming) "Stop" else "Send"
                  btnSend.paint(if (streaming) 3 else 0)
                  btnSend.isEnabled = state == 2
                  btnSend.alpha = if (state == 2) 1f else 0.4f
                  sTok.value.text = if (tokS > 0.0) String.format(Locale.US, "%.1f", tokS) else "-"
                  var rss = -1L
                  if (pid > 0 && running) rss = Sys.readProc(pid)[0]
                  sRam.value.text = if (rss > 0) rss.toString() + "M" else "-"
                  val free = Sys.availMemMb()
                  sFree.value.text = if (free >= 0) free.toString() + "M" else "-"
                  sFree.value.setTextColor(if (free in 0..600) Pal.err else if (free in 0..1200) Pal.warn else Pal.text)
                  val g = Sys.readGpuPct()
                  sGpu.value.text = if (g >= 0 && running) "$g%" else "-"
                  if (logDirty) {
                      val snap = synchronized(engLog) { logDirty = false; engLog.takeLast(10) }
                      logView.text = snap.joinToString("\n")
                  }
                  renderChat(false)
              }

              // ------------------------------------------------------------ server
              private fun hasFlag(f: String): Boolean = mf.llamaFlags.contains(f)

              private fun freePort(): Int = try { ServerSocket(0).use { s -> s.localPort } } catch (e: Exception) { 18089 }

              private fun loadModel() {
                  val p = pack ?: return
                  if (state == 1 || state == 2) return
                  if (Run.imageBusy) { addLog("An image run is active. Stop it first (RAM)."); return }
                  if (!Store.installed(this, p)) { addLog("Download this model first (Models tab)."); return }
                  val bin = File(applicationInfo.nativeLibraryDir, "libllamaserver.so")
                  if (!mf.llamaAvail || !bin.exists()) { addLog("This build has no chat engine (llama.cpp build or CI check failed)."); return }
                  val prefs = Store.prefs(this)
                  prefs.edit().putInt("chat_ctx_i", segCtx.selected).putInt("chat_gpu_i", segGpu.selected)
                      .putBoolean("chat_think", cbThink.isChecked).putString("chat_sys", sysPrompt.text.toString()).apply()
                  state = 1
                  lastFail = ""
                  tokS = 0.0
                  gpuName = ""
                  offload = ""
                  Run.chatBusy = true
                  thread { startServer(p, bin) }
              }

              private fun startServer(p: Pack, bin: File) {
                  synchronized(this) { if (!workHeld) { workHeld = true; WorkService.begin(this, "Chat server \u00B7 " + p.title.substringBefore(" - ")) } }
                  try {
                      if (rootMode > 0) {
                          try { Root.pre(this, rootMode) { s -> addLog(s) } } catch (e: Exception) { addLog("Root failed: $e") }
                      }
                      port = freePort()
                      val ctxN = listOf(2048, 4096, 8192)[segCtx.selected]
                      val cmd = ArrayList<String>()
                      cmd.add(bin.absolutePath)
                      val model = p.model ?: throw RuntimeException("pack has no model file")
                      cmd.add("-m"); cmd.add(Store.file(this, model).absolutePath)
                      val mm = p.mmproj
                      if (mm != null && hasFlag("--mmproj")) { cmd.add("--mmproj"); cmd.add(Store.file(this, mm).absolutePath) }
                      cmd.add("--host"); cmd.add("127.0.0.1")
                      cmd.add("--port"); cmd.add(port.toString())
                      cmd.add("-c"); cmd.add(ctxN.toString())
                      cmd.add("-ngl"); cmd.add(if (segGpu.selected == 0) "99" else "0")
                      cmd.add("-t"); cmd.add("4")
                      if (hasFlag("--jinja")) cmd.add("--jinja")
                      if (hasFlag("--no-webui")) cmd.add("--no-webui")
                      if (hasFlag("--parallel")) { cmd.add("--parallel"); cmd.add("1") }
                      if (hasFlag("--chat-template-kwargs")) {
                          cmd.add("--chat-template-kwargs")
                          cmd.add(if (cbThink.isChecked) "{\"enable_thinking\":true}" else "{\"enable_thinking\":false}")
                      }
                      addLog("RUN: " + cmd.joinToString(" "))
                      val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                      pb.environment()["LD_LIBRARY_PATH"] = libEnv
                      val pr = pb.start()
                      proc = pr
                      pid = Sys.pidOf(pr)
                      if (rootMode > 0 && Root.active && pid > 0) Root.pin(this, pid, rootMode) { s -> addLog(s) }
                      val offRe = Regex("""offloaded\s+(\d+)/(\d+)\s+layers""")
                      val adRe = Regex("""Adreno\s*\(?TM\)?\s*\d+""")
                      thread {
                          try {
                              pr.inputStream.bufferedReader().forEachLine { ln ->
                                  val t = ln.trim()
                                  if (t.isNotEmpty()) {
                                      val m = offRe.find(t)
                                      if (m != null) offload = m.groupValues[1] + "/" + m.groupValues[2]
                                      val a = adRe.find(t)
                                      if (a != null) gpuName = a.value
                                      if (!t.startsWith("srv ") || t.contains("error") || t.contains("listening") || t.contains("loaded")) addLog(t.take(220))
                                  }
                              }
                          } catch (e: Exception) { }
                      }
                      val t0 = System.currentTimeMillis()
                      var ok = false
                      while (state == 1 && System.currentTimeMillis() - t0 < 15 * 60 * 1000L) {
                          if (!pr.isAlive) break
                          if (healthy()) { ok = true; break }
                          try { Thread.sleep(700) } catch (e: InterruptedException) { }
                      }
                      if (ok && state == 1) {
                          state = 2
                          addLog("Server ready after " + ((System.currentTimeMillis() - t0) / 1000) + " s on port $port")
                          thread {
                              val code = try { pr.waitFor() } catch (e: Exception) { -1 }
                              if (state == 2) {
                                  lastFail = diagnose(code)
                                  state = 3
                                  addLog("Server stopped: $lastFail")
                                  cleanup()
                              }
                          }
                      } else if (state == 1) {
                          val code = if (pr.isAlive) -1 else try { pr.exitValue() } catch (e: Exception) { -1 }
                          lastFail = if (pr.isAlive) "Server did not become ready in 15 minutes." else diagnose(code)
                          state = 3
                          try { pr.destroyForcibly() } catch (e: Exception) { }
                          addLog("Load failed: $lastFail")
                          cleanup()
                      }
                  } catch (e: Exception) {
                      lastFail = "Could not start the engine: $e"
                      state = 3
                      addLog(lastFail)
                      cleanup()
                  }
              }

              private fun diagnose(code: Int): String {
                  val sig = when (code) { 9, 137, 265, -9 -> 9; 4, 132, 260, -4 -> 4; 11, 139, 267, -11 -> 11; 6, 134, 262, -6 -> 6; else -> 0 }
                  val txt = synchronized(engLog) { engLog.takeLast(60).joinToString("\n").lowercase(Locale.ROOT) }
                  return when {
                      sig == 9 -> "Android killed the server (out of memory). Free RAM now " + Sys.availMemMb() + " MB. Use Strict root mode, a smaller context, or a smaller model."
                      sig == 4 -> "Illegal CPU instruction: this build targets ARMv8.6. Share the log."
                      sig == 11 || sig == 6 -> "Server crashed (signal $sig), often the OpenCL driver. Set Engine = CPU and load again."
                      txt.contains("out of memory") || txt.contains("failed to allocate") -> "Memory allocation failed. Smaller context or model, or Engine = CPU."
                      txt.contains("unknown model architecture") -> "This llama.cpp build does not know the model architecture. Rebuild with a newer llama_cpp_ref."
                      txt.contains("failed to load model") || txt.contains("error loading") -> "The model file could not be loaded. Re-verify it in Models."
                      else -> "Server exited with code $code."
                  }
              }

              private fun healthy(): Boolean {
                  return try {
                      val c = URL("http://127.0.0.1:$port/health").openConnection() as HttpURLConnection
                      c.connectTimeout = 800
                      c.readTimeout = 1500
                      val ok = c.responseCode == 200
                      c.disconnect()
                      ok
                  } catch (e: Exception) { false }
              }

              private fun cleanup() {
                  pid = -1
                  proc = null
                  Run.chatBusy = false
                  streaming = false
                  if (Root.active) { try { Root.post(this) { s -> addLog(s) } } catch (e: Exception) { } }
                  releaseWork()
              }

              private fun releaseWork() {
                  var rel = false
                  synchronized(this) { if (workHeld) { workHeld = false; rel = true } }
                  if (rel) WorkService.end(this)
              }

              private fun stopServer(userAction: Boolean) {
                  val pr = proc
                  stopReq = true
                  try { conn?.disconnect() } catch (e: Exception) { }
                  if (pr != null) {
                      try { pr.destroyForcibly(); pr.waitFor() } catch (e: Exception) { }
                  }
                  if (state != 0 && userAction) addLog("Model unloaded.")
                  state = 0
                  cleanup()
                  System.gc()
              }

              // ------------------------------------------------------------ chat
              private fun send() {
                  if (state != 2 || streaming) return
                  val t = input.text.toString().trim()
                  val img = pendingImage
                  if (t.isEmpty() && img == null) return
                  msgs.add(Msg("user", if (t.isEmpty()) "Describe this image." else t, "", img))
                  msgs.add(Msg("assistant", ""))
                  input.setText("")
                  pendingImage = null
                  imgChip.visibility = View.GONE
                  renderChat(true)
                  streaming = true
                  stopReq = false
                  thread { stream() }
              }

              private fun stream() {
                  val reply = msgs[msgs.size - 1]
                  try {
                      val arr = JSONArray()
                      val sys = sysPrompt.text.toString().trim()
                      if (sys.isNotEmpty()) arr.put(JSONObject().put("role", "system").put("content", sys))
                      for (i in 0 until msgs.size - 1) {
                          val m = msgs[i]
                          if (m.role == "user" && m.img != null) {
                              val parts = JSONArray()
                              parts.put(JSONObject().put("type", "text").put("text", m.text))
                              parts.put(JSONObject().put("type", "image_url")
                                  .put("image_url", JSONObject().put("url", "data:image/jpeg;base64," + m.img)))
                              arr.put(JSONObject().put("role", "user").put("content", parts))
                          } else {
                              arr.put(JSONObject().put("role", m.role).put("content", m.text))
                          }
                      }
                      val body = JSONObject().put("messages", arr).put("stream", true).put("temperature", 0.7)
                          .put("max_tokens", 2048).put("cache_prompt", true)
                      val c = URL("http://127.0.0.1:$port/v1/chat/completions").openConnection() as HttpURLConnection
                      conn = c
                      c.requestMethod = "POST"
                      c.connectTimeout = 5000
                      c.readTimeout = 10 * 60 * 1000
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      c.outputStream.use { o -> o.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      if (c.responseCode != 200) {
                          val err = try { c.errorStream?.bufferedReader()?.readText() ?: "" } catch (e: Exception) { "" }
                          throw RuntimeException("HTTP " + c.responseCode + " " + err.take(300))
                      }
                      val t0 = System.currentTimeMillis()
                      var chunks = 0
                      c.inputStream.bufferedReader(Charsets.UTF_8).use { rd ->
                          while (true) {
                              if (stopReq) break
                              val line = rd.readLine() ?: break
                              if (!line.startsWith("data:")) continue
                              val payload = line.substring(5).trim()
                              if (payload == "[DONE]") break
                              val j = JSONObject(payload)
                              val ch = j.optJSONArray("choices")
                              if (ch != null && ch.length() > 0) {
                                  val d = ch.getJSONObject(0).optJSONObject("delta")
                                  if (d != null) {
                                      val tx = d.optString("content", "")
                                      val th = d.optString("reasoning_content", "")
                                      if (tx.isNotEmpty() && tx != "null") { reply.text += tx; chunks++ }
                                      if (th.isNotEmpty() && th != "null") { reply.think += th; chunks++ }
                                  }
                              }
                              val el = (System.currentTimeMillis() - t0) / 1000.0
                              if (el > 0.5 && chunks > 0) tokS = chunks / el
                              ui.post { renderChat(false) }
                          }
                      }
                      val tm = System.currentTimeMillis()
                      if (stopReq) reply.text += "  [stopped]"
                      addLog(String.format(Locale.US, "reply: %d chunks, %.1f tok/s, %d s", chunks, tokS, (tm - t0) / 1000))
                  } catch (e: Exception) {
                      if (!stopReq) {
                          reply.text += "\n[error: " + e.message + "]"
                          addLog("chat error: $e")
                      }
                  } finally {
                      conn = null
                      streaming = false
                      stopReq = false
                      ui.post { renderChat(true) }
                  }
              }
          }
          EOF

      - name: "Write root scripts"
        run: |
          cat > app/src/main/assets/root_lib.sh <<'EOF'
          #!/system/bin/sh
          # MossMini root helpers. The app prepends this file to root_pre.sh / root_run.sh / root_free.sh.
          MODE=@MODE@
          KEEP="@KEEP@"
          APPPID=@APPPID@

          memav() { set -- $(grep MemAvailable /proc/meminfo); echo $(( $2 / 1024 )); }

          # is_keep PACKAGE: 0 = protected (core Android, vendor core, keep list), 1 = may be stopped
          is_keep() {
            case "$1" in
              com.android.chrome|com.android.vending) ;;
              android|android.*|com.android.*|com.qualcomm.*|com.qti.*|org.codeaurora.*|vendor.*) return 0 ;;
              com.google.android.permissioncontroller|com.google.android.networkstack|com.google.android.providers.*) return 0 ;;
              com.google.android.documentsui|com.google.android.ext.services|com.google.android.captiveportallogin) return 0 ;;
              com.google.android.cellbroadcastreceiver|com.google.android.inputmethod.*) return 0 ;;
            esac
            for k in $KEEP; do [ "$1" = "$k" ] && return 0; done
            return 1
          }

          load_pkgs() { PKGS=" $(pm list packages 2>/dev/null | sed 's/^package://' | tr '\n' ' ') "; }

          # pkg_of PROCESSNAME: prints the installed package that owns this process name (gms.persistent -> gms)
          pkg_of() {
            P="${1%%:*}"
            while [ -n "$P" ]; do
              case "$PKGS" in *" $P "*) echo "$P"; return 0 ;; esac
              case "$P" in *.*) P="${P%.*}" ;; *) return 1 ;; esac
            done
            return 1
          }

          # victims: packages that own an app-UID process (u0_a123 ...) and are not protected
          victims() {
            ps -A -o USER,PID,NAME 2>/dev/null | while read U PD NM; do
              case "$U" in u[0-9]*_a[0-9]*) ;; *) continue ;; esac
              case "$NM" in *.*) ;; *) continue ;; esac
              PK=$(pkg_of "$NM") || continue
              is_keep "$PK" && continue
              echo "$PK"
            done | sort -u
          }

          # stop_victims: force-stop them all, prints how many
          stop_victims() {
            N=0
            for PK in $(victims); do
              am force-stop "$PK" >/dev/null 2>&1
              N=$((N+1))
            done
            echo $N
          }
          EOF
          cat > app/src/main/assets/root_pre.sh <<'EOF'
          # MossMini root boost/strict: runs once before the engine starts. Every change is written to a restore script first.
          R=/data/local/tmp/mossmini_restore.sh
          echo "#!/system/bin/sh" > $R
          B=$(memav)
          echo "free RAM before: $B MB"
          SDK=$(getprop ro.build.version.sdk)

          # 1) Android 12+ phantom-process killer: it can SIGKILL native child processes such as the engine
          if [ "${SDK:-0}" -ge 31 ]; then
            P=$(settings get global settings_enable_monitor_phantom_procs 2>/dev/null)
            if [ -z "$P" ] || [ "$P" = "null" ]; then
              echo "settings delete global settings_enable_monitor_phantom_procs" >> $R
            else
              echo "settings put global settings_enable_monitor_phantom_procs $P" >> $R
            fi
            settings put global settings_enable_monitor_phantom_procs false 2>/dev/null
            D=$(device_config get activity_manager max_phantom_processes 2>/dev/null)
            if [ -z "$D" ] || [ "$D" = "null" ]; then
              echo "device_config delete activity_manager max_phantom_processes" >> $R
            else
              echo "device_config put activity_manager max_phantom_processes $D" >> $R
            fi
            device_config set_sync_disabled_for_tests persistent 2>/dev/null
            device_config put activity_manager max_phantom_processes 2147483647 2>/dev/null
            echo "device_config set_sync_disabled_for_tests none" >> $R
            echo "phantom-process killer: off while the engine runs"
          fi

          # 2) strict: stop every app process that is not core Android / keyboard / launcher / keep list
          if [ "$MODE" -ge 2 ]; then
            load_pkgs
            K1=$(stop_victims)
            echo "strict: force-stopped $K1 app package(s)"
            K2=$(stop_victims)
            echo "strict: second pass stopped $K2 more"
            am kill-all >/dev/null 2>&1
            sync
            echo 3 > /proc/sys/vm/drop_caches 2>/dev/null
          fi
          am kill-all >/dev/null 2>&1
          echo 1 > /proc/sys/vm/compact_memory 2>/dev/null

          # 3) protect this app from the kernel/lmkd
          echo -900 > /proc/$APPPID/oom_score_adj 2>/dev/null

          # 4) less zram swapping while the engine runs
          SW=$(cat /proc/sys/vm/swappiness 2>/dev/null)
          if [ -n "$SW" ]; then
            echo "echo $SW > /proc/sys/vm/swappiness" >> $R
            echo 20 > /proc/sys/vm/swappiness 2>/dev/null
            echo "swappiness: $SW -> $(cat /proc/sys/vm/swappiness)"
          fi

          # 5) CPU governors
          for P in /sys/devices/system/cpu/cpufreq/policy*; do
            [ -f $P/scaling_governor ] || continue
            grep -qw performance $P/scaling_available_governors 2>/dev/null || continue
            G=$(cat $P/scaling_governor)
            echo "echo $G > $P/scaling_governor" >> $R
            echo performance > $P/scaling_governor 2>/dev/null
            echo "cpu $(basename $P): $G -> $(cat $P/scaling_governor)"
          done

          # 6) GPU governor (Adreno)
          K=/sys/class/kgsl/kgsl-3d0/devfreq
          if [ -f $K/governor ]; then
            G=$(cat $K/governor)
            echo "echo $G > $K/governor" >> $R
            echo performance > $K/governor 2>/dev/null
            echo "gpu governor: $G -> $(cat $K/governor)"
          fi
          chmod 755 $R
          A=$(memav)
          echo "free RAM after: $A MB"
          echo "restore script: $R"
          EOF
          cat > app/src/main/assets/root_run.sh <<'EOF'
          # MossMini root guard: protect and pin the engine process, and (strict) keep apps from coming back.
          PID=@PID@
          MASK=@MASK@
          G=/data/local/tmp/mossmini_guard.log
          : > $G
          echo -900 > /proc/$PID/oom_score_adj 2>/dev/null
          renice -n -8 -p $PID >/dev/null 2>&1
          if [ "$MODE" -ge 2 ]; then load_pkgs; fi
          TICK=0
          KILLED=0
          while [ -d /proc/$PID ]; do
            for T in /proc/$PID/task/*; do
              taskset -p $MASK ${T##*/} >/dev/null 2>&1
            done
            echo -900 > /proc/$APPPID/oom_score_adj 2>/dev/null
            TICK=$((TICK+1))
            if [ "$MODE" -ge 2 ] && [ $((TICK % 3)) -eq 0 ]; then
              X=$(stop_victims)
              if [ "${X:-0}" -gt 0 ]; then
                KILLED=$((KILLED+X))
                echo "$(date +%H:%M:%S) stopped $X respawned package(s), free $(memav) MB" >> $G
              fi
            fi
            sleep 2
          done
          echo "guard finished: stopped $KILLED respawned package(s) in total" >> $G
          EOF
          cat > app/src/main/assets/root_free.sh <<'EOF'
          # MossMini one-shot "free RAM now"
          B=$(memav)
          if [ "$MODE" -ge 2 ]; then
            load_pkgs
            K1=$(stop_victims)
            echo "force-stopped $K1 app package(s)"
          fi
          am kill-all >/dev/null 2>&1
          sync
          echo 3 > /proc/sys/vm/drop_caches 2>/dev/null
          echo 1 > /proc/sys/vm/compact_memory 2>/dev/null
          echo "free RAM: $B -> $(memav) MB"
          EOF
          cat > app/src/main/assets/root_post.sh <<'EOF'
          #!/system/bin/sh
          R=/data/local/tmp/mossmini_restore.sh
          G=/data/local/tmp/mossmini_guard.log
          sleep 2
          if [ -f $G ]; then tail -n 12 $G; rm -f $G; fi
          if [ -f $R ]; then
            sh $R
            rm -f $R
            echo "clocks, swappiness and phantom-process killer restored"
          else
            echo "nothing to restore"
          fi
          EOF

      - name: Build signed release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Show the real error (only if the build failed)
        if: failure()
        run: |
          {
            echo "### Build failed - first errors"
            echo '```'
            grep -E -A3 '^e: |What went wrong|error:' build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log + generated sources (only if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            build.log
            app/src/main/java
            app/build.gradle.kts
          retention-days: 7

      - name: "Verify and name the APK"
        run: |
          APK="MossMini-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" > cert.txt
          head -3 cert.txt
          unzip -l "$APK" > apk_list.txt
          grep -q 'lib/arm64-v8a/libsdcli.so' apk_list.txt || { echo "::error::sd-cli missing from APK"; exit 1; }
          grep -q 'lib/arm64-v8a/libllamaserver.so' apk_list.txt && echo "chat engine is in the APK" || echo "::notice::chat engine is NOT in this APK (optional jobs failed or were disabled)"
          grep -q 'assets/manifest.json' apk_list.txt || { echo "::error::manifest.json missing from APK"; exit 1; }
          sha256sum "$APK" > SHA256SUMS.txt
          {
            echo "### APK"
            echo "| file | size | native engine |"
            echo "|---|---|---|"
            echo "| $APK | $(du -h "$APK" | cut -f1) | $(unzip -lv "$APK" | awk '/libsdcli.so/{print $1" B"}') |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt
          python3 - <<'PY'
          import json
          m = json.load(open("manifest/manifest.json"))
          lines = ["MossMini 2: image + chat/vision models on your phone GPU, model manager, background downloads, strict root RAM mode.", "",
                   "- stable-diffusion.cpp commit: `%s`" % m["sd_commit"],
                   "- llama.cpp commit: `%s` (%s)" % (m["llama_commit"][:12], "in this build" if m["llama"]["available"] else "NOT in this build"),
                   "- Image proof in CI (%s): %s" % (m["smoke_pack"], m["smoke"]),
                   "- Chat engine check: %s" % m["llama"]["info"],
                   "- Optional flags proven in CI: %s" % (" ".join(m.get("proven_flags", [])) or "none"),
                   "", "Models the app can download (every file is SHA-256 checked on the phone):"]
          for p in m["packs"]:
              tot = sum(f["size"] for f in p["files"])
              lines.append("")
              lines.append("**%s** (`%s`, %s, %d MB) - %s" % (p["title"], p["id"], p["kind"], tot >> 20,
                           "CI end-to-end" if p.get("tested") == "ci-e2e" else "files, hashes and headers verified in CI"))
              for f in p["files"]:
                  lines.append("- `%s` - %d MB - `%s`" % (f["name"], f["size"] >> 20, f["sha256"]))
          open("release_notes.md", "w").write("\n".join(lines) + "\n")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mini-v${{ github.run_number }}
          name: MossMini ${{ env.VERSION_NAME }}
          body_path: release_notes.md
          files: |
            MossMini-${{ env.VERSION_NAME }}.apk
            SHA256SUMS.txt
          make_latest: false

      - uses: actions/upload-artifact@v4
        with:
          name: MossMini-apk
          path: MossMini-*.apk
          retention-days: 14
