                                  lastDone = done
                                  lastT = now
                                  val p = done.toFloat() / expected
                                  set(m.id, 0.85f * p, "downloading " + (p * 100).toInt() + "%", 1)
                                  val eta = if (rate > 1.0) remaining() / rate else 0.0
                                  info = String.format(Locale.US, "%.1f MB/s \u00B7 ETA %s \u00B7 %s left", rate / 1048576.0, Sys.fmtDur(eta.toLong()), Sys.fmtSize(remaining()))
                              }
                          }
                      }
                  }
                  if (part.length() != expected) throw RuntimeException("incomplete: " + part.length() + " of " + expected + " bytes")
                  dest.delete()
                  if (!part.renameTo(dest)) throw RuntimeException("could not finalize file")
              }
          }

          /** Foreground service: keeps the process alive for downloads, image runs and the chat server. */
          class WorkService : Service() {
              companion object {
                  const val CH = "mossmini_work"
                  const val NID = 7
                  private val lock = Any()
                  private var users = 0
                  @Volatile var text = ""

                  fun begin(ctx: Context, label: String) {
                      val app = ctx.applicationContext
                      synchronized(lock) {
                          users++
                          if (label.isNotEmpty()) text = label
                      }
                      try {
                          val i = Intent(app, WorkService::class.java)
                          if (Build.VERSION.SDK_INT >= 26) app.startForegroundService(i) else app.startService(i)
                      } catch (e: Exception) { }
                  }

                  fun end(ctx: Context) {
                      val app = ctx.applicationContext
                      val stop = synchronized(lock) {
                          if (users > 0) users--
                          users == 0
                      }
                      if (stop) {
                          try { app.stopService(Intent(app, WorkService::class.java)) } catch (e: Exception) { }
                      }
                  }

                  fun reset() { synchronized(lock) { users = 0 } }
              }

              private val h = Handler(Looper.getMainLooper())
              private var wake: PowerManager.WakeLock? = null
              private var wifi: WifiManager.WifiLock? = null

              private val tick = object : Runnable {
                  override fun run() {
                      try { nm().notify(NID, build()) } catch (e: Exception) { }
                      h.postDelayed(this, 1000)
                  }
              }

              private fun nm(): NotificationManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm().createNotificationChannel(NotificationChannel(CH, "MossMini background work", NotificationManager.IMPORTANCE_LOW))
                  }
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val w = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "MossMini:service")
                      w.setReferenceCounted(false)
                      w.acquire(6L * 60 * 60 * 1000)
                      wake = w
                  } catch (e: Exception) { }
                  try {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      val wl = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "MossMini:wifi")
                      wl.setReferenceCounted(false)
                      wl.acquire()
                      wifi = wl
                  } catch (e: Exception) { }
              }

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  if (i != null && i.action == "stop") Dl.cancelAll()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NID, build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      else startForeground(NID, build())
                  } catch (e: Exception) { }
                  h.removeCallbacks(tick)
                  h.postDelayed(tick, 1000)
                  return START_NOT_STICKY
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  if (!Dl.active) {
                      WorkService.reset()
                      stopSelf()
                  }
                  super.onTaskRemoved(rootIntent)
              }

              private fun build(): Notification {
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, CH) else Notification.Builder(this)
                  val dl = Dl.active
                  b.setSmallIcon(android.R.drawable.stat_sys_download)
                  b.setContentTitle(if (dl) "MossMini \u00B7 downloading" else "MossMini \u00B7 working")
                  val body = if (dl) Dl.info else text
                  b.setContentText(if (body.isEmpty()) "running" else body)
                  b.setOngoing(true)
                  b.setOnlyAlertOnce(true)
                  if (dl) b.setProgress(100, (Dl.overall() * 100).toInt(), false)
                  val open = Intent(this, MainActivity::class.java)
                  open.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  b.setContentIntent(PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
                  if (dl) {
                      val stop = Intent(this, WorkService::class.java)
                      stop.action = "stop"
                      b.addAction(android.R.drawable.ic_menu_close_clear_cancel, "Stop",
                          PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT))
                  }
                  return b.build()
              }

              override fun onDestroy() {
                  h.removeCallbacks(tick)
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
                  try { if (wifi?.isHeld == true) wifi?.release() } catch (e: Exception) { }
                  try { stopForeground(Service.STOP_FOREGROUND_REMOVE) } catch (e: Exception) { }
                  super.onDestroy()
              }
          }
