                  storBar = BarView(this)
                  cs.put(storBar, 8, h = dp(6))
                  batText = tv(this, "", 11f, Pal.dim)
                  cs.put(batText, 10)
                  val bBat = pill(this, "Allow unrestricted background", 2, compact = true)
                  bBat.setOnClickListener {
                      try {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                          i.data = Uri.parse("package:" + packageName)
                          startActivity(i)
                      } catch (e: Exception) {
                          Toast.makeText(this, "Open Settings > Apps > MossMini > Battery and choose Unrestricted.", Toast.LENGTH_LONG).show()
                      }
                  }
                  cs.put(bBat, 8)
                  content.put(cs.root, 14)

                  dlCard = Card(this, "Downloading")
                  dlText = tv(this, "", 12f, Pal.sub, mono = true)
                  dlCard.put(dlText, 12)
                  dlBar = BarView(this)
                  dlCard.put(dlBar, 8, h = dp(6))
