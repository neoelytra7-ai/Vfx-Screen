# MossMini 2 - one workflow, one APK: image generation + chat/vision on the phone GPU.
#
# What changed vs v1 (image-only):
#   * MODEL CATALOG: every model is a "pack" (image packs use stable-diffusion.cpp, chat packs use llama.cpp).
#     The `catalog` job resolves every pack at a PINNED Hugging Face revision, records sizes and SHA-256
#     (from the HF API, no 5 GB downloads), and probes each file's header. A pack that cannot be resolved
#     is skipped with a reason in the run summary; it never breaks the build.
#     Add your own models with a `catalog_extra.json` in the repo root (same shape as the packs in catalog.py).
#   * FAST BY DEFAULT: no model is downloaded or run in CI. Packs get "files + hashes + headers verified"
#     and the app labels them that way. Tick run_smoke_test to also run ONE image pack (smoke_pack) end to end.
#     Compiled engines are cached per commit: an app-only change skips both native compiles.
#     (Bump the -v1 cache salt in the two 'Reuse the compiled engine' steps when you change compiler flags.)
#   * CHAT ENGINE (llama.cpp, OpenCL/Adreno) is built and checked as OPTIONAL jobs (continue-on-error):
#     if they fail, the APK still ships with the image side exactly as before.
#   * Background downloads run in a foreground service; model manager screen; strict root RAM mode.
#
# GPU note: Adreno OpenCL kernels are optimized for Q4_0 / Q8_0 / MXFP4. K-quants and IQ-quants run, but
# mostly on the CPU. That is why the new packs use Q4_0.
#
# Manual run options: run_smoke_test, smoke_pack, sd_cpp_ref, llama_cpp_ref, build_llama.

name: Build MossMini APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mossmini
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 2.0.${{ github.run_number }}
  REQ_FLAGS: "--diffusion-model --llm --vae --tokenizer --backend --params-backend --cfg-scale --steps"
  COMMON_FLAGS: "--params-backend te=disk,diffusion=disk,vae=cpu"

jobs:
  keepalive:
    name: Keep signing key cache alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        id: k
        with:
          path: ~/.mossmini-key
          key: mossmini-signing-key-v1
      - run: |
          if [ "${{ steps.k.outputs.cache-hit }}" = "true" ]; then
            echo "Signing key cache is alive."
          else
            echo "::warning::Signing key cache NOT found. The next build will refuse to make a new key unless allow_new_key=true."
          fi

  prep:
    name: Pin exact versions (sd.cpp + llama.cpp commits)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sd_commit: ${{ steps.r.outputs.sd_commit }}
      llama_commit: ${{ steps.r.outputs.llama_commit }}
    steps:
      - name: Restore signing key cache (fail-fast check)
        uses: actions/cache/restore@v4
        with:
          path: ~/.mossmini-key
          key: mossmini-signing-key-v1

      - name: "Fail fast if the signing key is unavailable"
        env:
          KS_B64_SECRET: ${{ secrets.KEYSTORE_B64 }}
          ALLOW_NEW_KEY: ${{ inputs.allow_new_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$KS_B64_SECRET" ]; then
            echo "Signing key: repo secrets."
          elif [ -f ~/.mossmini-key/release.jks ] && [ -f ~/.mossmini-key/pass.txt ]; then
            echo "Signing key: restored from cache."
          elif [ "$ALLOW_NEW_KEY" = "true" ]; then
            echo "::notice::No signing key found. A NEW one will be created (allow_new_key=true). Uninstall the old app first."
          elif gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null | grep -q 'mini-v'; then
            echo "::error::Signing key is gone (cache expired) but MossMini releases already exist. Stopping now, before the slow jobs. Re-run with allow_new_key=true only if you accept uninstall/reinstall, or add the KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS secrets."
            exit 1
          else
            echo "First release: a new signing key will be created."
          fi

      - name: Resolve versions
        id: r
        env:
          SD_REF: ${{ inputs.sd_cpp_ref || 'master' }}
          LL_REF: ${{ inputs.llama_cpp_ref || 'master' }}
        run: |
          set -e
          resolve() {
            C=$(git ls-remote "$1" "refs/heads/$2" | head -1 | cut -f1)
            if [ -z "$C" ]; then C=$(git ls-remote "$1" "refs/tags/$2" | head -1 | cut -f1); fi
            if [ -z "$C" ]; then C="$2"; fi
            echo "$C"
          }
          SDC=$(resolve https://github.com/leejet/stable-diffusion.cpp "$SD_REF")
          LLC=$(resolve https://github.com/ggml-org/llama.cpp "$LL_REF")
          echo "sd_commit=$SDC" >> "$GITHUB_OUTPUT"
          echo "llama_commit=$LLC" >> "$GITHUB_OUTPUT"
          {
            echo "### Pinned versions"
            echo "- stable-diffusion.cpp: \`$SDC\`"
            echo "- llama.cpp: \`$LLC\`"
          } >> "$GITHUB_STEP_SUMMARY"

  catalog:
    name: Resolve model catalog (pinned HF revisions, sizes, SHA-256)
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRED_PACKS: moss_q2k ${{ inputs.smoke_pack || 'moss_q2k' }}
    steps:
      - uses: actions/checkout@v4

      - name: Write resolver
        run: |
          cat > catalog.py <<'EOF'
          #!/usr/bin/env python3
          # MossMini catalog resolver.
          #
          # For every model "pack" it finds the exact files on Hugging Face at a PINNED revision and records
          # size + SHA-256 WITHOUT downloading the big files: the HF tree API already knows the LFS SHA-256.
          # Each file is probed with a 16-byte range request (GGUF / safetensors / JSON header check) so a
          # renamed, gated or deleted file is caught here, in CI, not on your phone.
          #
          # A pack whose files cannot be resolved is SKIPPED with a reason (it never breaks the build), except
          # the packs listed in REQUIRED_PACKS. You can add your own packs with a catalog_extra.json file in the
          # repo root (same shape as the entries of PACKS below).
          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          HF = "https://huggingface.co"
          UA = {"User-Agent": "mossmini-ci/2"}
          COMMON = os.environ.get("COMMON_FLAGS", "--params-backend te=disk,diffusion=disk,vae=cpu").split()
          REQUIRED = [x for x in os.environ.get("REQUIRED_PACKS", "moss_q2k").replace(",", " ").split() if x]
          MIB = 1 << 20


          def _open(url, headers=None, tries=5):
              h = dict(UA)
              h.update(headers or {})
              last = None
              for i in range(tries):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=90)
                  except urllib.error.HTTPError as e:
                      if e.code in (401, 403, 404):
                          raise
                      last = e
                  except Exception as e:  # network hiccup
                      last = e
                  time.sleep(2 * (i + 1))
              raise last


          def get_json(url):
              with _open(url) as r:
                  return json.loads(r.read().decode("utf-8")), r.headers


          REVS = {}
          TREES = {}


          def rev_of(repo):
              if repo not in REVS:
                  j, _ = get_json("%s/api/models/%s" % (HF, repo))
                  sha = j.get("sha")
                  if not sha:
                      raise RuntimeError("no revision for " + repo)
                  REVS[repo] = sha
              return REVS[repo]


          def tree_of(repo):
              if repo in TREES:
                  return TREES[repo]
              url = "%s/api/models/%s/tree/%s?recursive=true" % (HF, repo, rev_of(repo))
              out = []
              while url:
                  j, hdr = get_json(url)
                  out.extend([e for e in j if e.get("type") == "file"])
                  url = None
                  for part in (hdr.get("Link") or "").split(","):
                      if 'rel="next"' in part:
                          url = part.split(";")[0].strip().strip("<>")
              TREES[repo] = out
              return out


          def find(repo, spec):
              ents = tree_of(repo)
              if spec.get("path"):
                  for e in ents:
                      if e["path"] == spec["path"]:
                          return e
                  return None
              want = [w.lower() for w in spec.get("match", [])]
              bad = [w.lower() for w in spec.get("exclude", [])]
              ext = spec.get("ext", "")
              hits = []
              for e in ents:
                  b = e["path"].split("/")[-1].lower()
                  if ext and not b.endswith(ext):
                      continue
                  if all(w in b for w in want) and not any(w in b for w in bad):
                      hits.append(e)
              if not hits:
                  return None
              pref = [p.lower() for p in spec.get("prefer", [])]

              def key(e):
                  b = e["path"].split("/")[-1].lower()
                  pi = next((i for i, p in enumerate(pref) if p in b), len(pref))
                  return (pi, e.get("size", 0), e["path"])

              hits.sort(key=key)
              return hits[0]


          def kind_of(name):
              n = name.lower()
              if n.endswith(".gguf"):
                  return "gguf"
              if n.endswith(".safetensors"):
                  return "safetensors"
              if n.endswith(".json"):
                  return "json"
              return "bin"


          def probe(url, kind):
              with _open(url, {"Range": "bytes=0-15"}) as r:
                  b = r.read(16)
              if kind == "gguf":
                  return b[:4] == b"GGUF"
              if kind == "safetensors":
                  if len(b) < 9:
                      return False
                  n = int.from_bytes(b[:8], "little")
                  return 0 < n < (1 << 28) and b[8:9] == b"{"
              if kind == "json":
                  return b[:1] == b"{"
              return len(b) > 0


          def hash_download(url):
              h = hashlib.sha256()
              n = 0
              with _open(url) as r:
                  while True:
                      chunk = r.read(1 << 20)
                      if not chunk:
                          break
                      h.update(chunk)
                      n += len(chunk)
              return h.hexdigest(), n


          def resolve_file(fs, notes):
              for c in fs["cands"]:
                  repo = c["repo"]
                  try:
                      e = find(repo, c)
                  except Exception as ex:
                      notes.append("%s: %s" % (repo, ex))
                      continue
                  if not e:
                      notes.append("%s: nothing matches %s" % (repo, c.get("path") or c.get("match")))
                      continue
                  rev = rev_of(repo)
                  path = e["path"]
                  url = "%s/%s/resolve/%s/%s" % (HF, repo, rev, urllib.parse.quote(path))
                  name = path.split("/")[-1]
                  try:
                      if not probe(url, kind_of(name)):
                          notes.append("%s/%s: header check failed" % (repo, path))
                          continue
                  except Exception as ex:
                      notes.append("%s/%s: not downloadable (%s)" % (repo, path, ex))
                      continue
                  size = e.get("size") or 0
                  lfs = e.get("lfs")
                  if lfs and lfs.get("oid"):
                      sha = lfs["oid"]
                      size = lfs.get("size", size)
                  elif size and size > (64 * MIB):
                      notes.append("%s/%s: no SHA-256 from the API" % (repo, path))
                      continue
                  else:
                      sha, size = hash_download(url)
                  return {"name": name, "url": url, "size": int(size), "sha256": sha, "repo": repo, "rev": rev}
              return None


          SEEN = {}        # (sha, size) -> file dict   (same bytes = same local file, even across packs)
          USED_IDS = {}    # id -> (sha, size)
          USED_NAMES = {}  # local name -> (sha, size)


          def build(spec):
              notes = []
              files = []
              for fs in spec["files"]:
                  r = resolve_file(fs, notes)
                  if r is None:
                      if fs.get("optional"):
                          continue
                      return None, notes
                  key = (r["sha256"], r["size"])
                  if key in SEEN:
                      base = SEEN[key]
                  else:
                      fid = fs.get("id") or ("%s_%s" % (spec["id"], fs["role"]))
                      if fid in USED_IDS and USED_IDS[fid] != key:
                          fid = "%s_%s" % (spec["id"], fs["role"])
                      n = 2
                      while fid in USED_IDS and USED_IDS[fid] != key:
                          fid = "%s_%d" % (fid, n)
                          n += 1
                      name = r["name"]
                      if name in USED_NAMES and USED_NAMES[name] != key:
                          name = "%s__%s" % (spec["id"], name)
                      USED_IDS[fid] = key
                      USED_NAMES[name] = key
                      base = {"id": fid, "name": name, "url": r["url"], "size": r["size"],
                              "sha256": r["sha256"], "repo": r["repo"]}
                      SEEN[key] = base
                  m = dict(base)
                  m["flag"] = fs["flag"]
                  m["role"] = fs["role"]
                  files.append(m)
              return files, notes


          def finish(spec, files):
              kind = spec["kind"]
              p = {
                  "id": spec["id"], "title": spec["title"], "kind": kind, "desc": spec.get("desc", ""),
                  "quant": spec.get("quant", ""), "gpu": spec.get("gpu", "mixed"),
                  "license": spec.get("license", ""), "note": spec.get("note", ""),
                  "steps": spec.get("steps", 20), "cfg": spec.get("cfg", 1.0),
                  "files": files, "vision": any(f["role"] == "mmproj" for f in files),
              }
              big = max([f["size"] for f in files if f["role"] in ("diffusion", "llm", "model")] or [0])
              total = sum(f["size"] for f in files)
              if kind == "image":
                  # same streaming layout as MOSS: text encoder + VAE on the CPU, weights streamed from disk
                  p["ram_mb"] = int(big * 0.75 / MIB) + 1500
                  p["profiles"] = [
                      {"name": "GPU mode (OpenCL for the diffusion model, CPU text encoder, weights streamed from disk)",
                       "kind": "gpu", "flags": ["--backend", "te=cpu,vae=cpu"] + COMMON},
                      {"name": "CPU mode (the exact mode tested in CI)", "kind": "cpu",
                       "flags": ["--backend", "cpu"] + COMMON},
                  ]
              else:
                  p["ram_mb"] = int(total * 1.1 / MIB) + 700
                  p["profiles"] = []
              return p


          PACKS = [
              {
                  "id": "moss_q2k", "kind": "image", "title": "MOSS-Image SFT - Q2_K (smallest)",
                  "desc": "Your proven default. Tiny K/I-quants, so a lot of the math lands on the CPU: slow but light on RAM.",
                  "quant": "Q2_K + IQ2", "gpu": "cpu", "license": "see model cards", "steps": 20, "cfg": 3.0,
                  "files": [
                      {"id": "dit", "role": "diffusion", "flag": "--diffusion-model",
                       "cands": [{"repo": "leejet/MOSS-Image-SFT-GGUF", "path": "MOSS-Image-SFT-Q2_K.gguf"}]},
                      {"id": "te", "role": "llm", "flag": "--llm",
                       "cands": [{"repo": "unsloth/Qwen3.5-9B-GGUF", "path": "Qwen3.5-9B-UD-IQ2_XXS.gguf"}]},
                      {"id": "vae", "role": "vae", "flag": "--vae",
                       "cands": [{"repo": "Comfy-Org/MOSS-Image", "path": "vae/flux2-vae.safetensors"}]},
                      {"id": "tok", "role": "tokenizer", "flag": "--tokenizer",
                       "cands": [{"repo": "OpenMOSS-Team/MOSS-Image-Base", "path": "tokenizer/tokenizer.json"}]},
                  ],
              },
              {
                  "id": "moss_turbo_q4_0", "kind": "image", "title": "MOSS-Image SFT Turbo - Q4_0 (8 steps)",
                  "desc": "Same text encoder and VAE as above (shared, downloaded once). The diffusion model is Q4_0, which the Adreno GPU kernels are optimized for.",
                  "quant": "Q4_0 DiT + IQ2 text encoder", "gpu": "mixed", "license": "see model cards", "steps": 8, "cfg": 1.0,
                  "files": [
                      {"id": "dit_turbo", "role": "diffusion", "flag": "--diffusion-model",
                       "cands": [{"repo": "molbal/MOSS-Image-GGUF", "path": "moss_image_sft_turbo-Q4_0.gguf"}]},
                      {"id": "te", "role": "llm", "flag": "--llm",
                       "cands": [{"repo": "unsloth/Qwen3.5-9B-GGUF", "path": "Qwen3.5-9B-UD-IQ2_XXS.gguf"}]},
                      {"id": "vae", "role": "vae", "flag": "--vae",
                       "cands": [{"repo": "Comfy-Org/MOSS-Image", "path": "vae/flux2-vae.safetensors"}]},
                      {"id": "tok", "role": "tokenizer", "flag": "--tokenizer",
                       "cands": [{"repo": "OpenMOSS-Team/MOSS-Image-Base", "path": "tokenizer/tokenizer.json"}]},
                  ],
              },
              {
                  "id": "zimage_turbo_q4_0", "kind": "image", "title": "Z-Image-Turbo - Q4_0 (8 steps)",
                  "desc": "Alibaba Tongyi 6B turbo model. Q4_0 diffusion model on the GPU, Qwen3-4B text encoder on the CPU, weights streamed from disk like MOSS. CFG 1, 8 steps.",
                  "quant": "Q4_0", "gpu": "good", "license": "Apache-2.0", "steps": 8, "cfg": 1.0,
                  "files": [
                      {"id": "zimg_dit", "role": "diffusion", "flag": "--diffusion-model",
                       "cands": [{"repo": "leejet/Z-Image-Turbo-GGUF", "path": "z_image_turbo-Q4_0.gguf"},
                                 {"repo": "JoyFusionAI/gguf-z-image", "path": "z_image_turbo-Q4_0.gguf"}]},
                      {"id": "zimg_te", "role": "llm", "flag": "--llm",
                       "cands": [{"repo": "JoyFusionAI/gguf-components", "match": ["qwen3-4b-instruct-2507", "q4_0"], "ext": ".gguf"},
                                 {"repo": "unsloth/Qwen3-4B-Instruct-2507-GGUF", "match": ["qwen3-4b-instruct-2507-q4_0"], "ext": ".gguf"},
                                 {"repo": "unsloth/Qwen3-4B-Instruct-2507-GGUF", "path": "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"}]},
                      {"id": "flux1_ae", "role": "vae", "flag": "--vae",
                       "cands": [{"repo": "black-forest-labs/FLUX.1-schnell", "path": "ae.safetensors"},
                                 {"repo": "Comfy-Org/z_image_turbo", "path": "split_files/vae/ae.safetensors"}]},
                  ],
              },
              {
                  "id": "flux2_klein_q4_0", "kind": "image", "title": "FLUX.2 klein 4B - Q4_0 (4 steps)",
                  "desc": "Black Forest Labs 4B distilled model (Apache-2.0). Smallest of the new models and shares the FLUX.2 VAE with MOSS. CFG 1, 4 steps.",
                  "quant": "Q4_0", "gpu": "good", "license": "Apache-2.0", "steps": 4, "cfg": 1.0,
                  "files": [
                      {"id": "klein_dit", "role": "diffusion", "flag": "--diffusion-model",
                       "cands": [{"repo": "leejet/FLUX.2-klein-4B-GGUF", "match": ["klein", "4b", "q4_0"], "exclude": ["base"], "ext": ".gguf"},
                                 {"repo": "unsloth/FLUX.2-klein-4B-GGUF", "match": ["klein", "4b", "q4_0"], "exclude": ["base"], "ext": ".gguf"},
                                 {"repo": "Zimo4165/SIGN-models", "path": "flux-2-klein-4b-Q4_0.gguf"}]},
                      {"id": "klein_te", "role": "llm", "flag": "--llm",
                       "cands": [{"repo": "unsloth/Qwen3-4B-GGUF", "match": ["qwen3-4b-q4_0"], "ext": ".gguf"},
                                 {"repo": "unsloth/Qwen3-4B-GGUF", "path": "Qwen3-4B-Q4_K_M.gguf"}]},
                      {"id": "vae", "role": "vae", "flag": "--vae",
                       "cands": [{"repo": "Comfy-Org/flux2-dev", "path": "split_files/vae/flux2-vae.safetensors"},
                                 {"repo": "Comfy-Org/MOSS-Image", "path": "vae/flux2-vae.safetensors"}]},
                  ],
              },
              {
                  "id": "chat_qwen3_0_6b_q8_0", "kind": "chat", "title": "Qwen3 0.6B - Q8_0 (instant)",
                  "desc": "Tiny and fast. Good for testing that chat + GPU work, and for very low RAM.",
                  "quant": "Q8_0", "gpu": "good", "license": "Apache-2.0",
                  "files": [{"id": "q06_model", "role": "model", "flag": "-m",
                             "cands": [{"repo": "unsloth/Qwen3-0.6B-GGUF", "match": ["qwen3-0.6b-q8_0"], "ext": ".gguf"},
                                       {"repo": "Qwen/Qwen3-0.6B-GGUF", "match": ["q8_0"], "ext": ".gguf"}]}],
              },
              {
                  "id": "chat_llama32_3b_q4_0", "kind": "chat", "title": "Llama 3.2 3B Instruct - Q4_0",
                  "desc": "Most compatible small model. Plain attention, so every layer can use the GPU.",
                  "quant": "Q4_0", "gpu": "good", "license": "Llama 3.2 community license",
                  "files": [{"id": "ll32_model", "role": "model", "flag": "-m",
                             "cands": [{"repo": "bartowski/Llama-3.2-3B-Instruct-GGUF", "path": "Llama-3.2-3B-Instruct-Q4_0.gguf"}]}],
              },
              {
                  "id": "chat_qwen3_4b_q4_0", "kind": "chat", "title": "Qwen3 4B Instruct 2507 - Q4_0",
                  "desc": "Strong 4B all-rounder. Also the text encoder family used by Z-Image and FLUX.2 klein.",
                  "quant": "Q4_0", "gpu": "good", "license": "Apache-2.0",
                  "files": [{"id": "q4b_model", "role": "model", "flag": "-m",
                             "cands": [{"repo": "unsloth/Qwen3-4B-Instruct-2507-GGUF", "match": ["qwen3-4b-instruct-2507-q4_0"], "ext": ".gguf"},
                                       {"repo": "unsloth/Qwen3-4B-Instruct-2507-GGUF", "path": "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"}]}],
              },
              {
                  "id": "chat_gemma4_e2b_q4_0", "kind": "chat", "title": "Gemma 4 E2B it - Q4_0 (text + vision)",
                  "desc": "Google Gemma 4, 2.3B effective parameters, multimodal. The image projector is downloaded too, so you can attach pictures.",
                  "quant": "Q4_0", "gpu": "good", "license": "Apache-2.0",
                  "files": [
                      {"id": "g4e2_model", "role": "model", "flag": "-m",
                       "cands": [{"repo": "ggml-org/gemma-4-E2B-it-GGUF", "path": "gemma-4-E2B-it-Q4_0.gguf"},
                                 {"repo": "unsloth/gemma-4-E2B-it-GGUF", "match": ["gemma-4-e2b-it-q4_0"], "ext": ".gguf"}]},
                      {"id": "g4e2_mm", "role": "mmproj", "flag": "--mmproj", "optional": True,
                       "cands": [{"repo": "ggml-org/gemma-4-E2B-it-GGUF", "match": ["mmproj"], "ext": ".gguf", "prefer": ["q8_0", "f16", "bf16"]},
                                 {"repo": "unsloth/gemma-4-E2B-it-GGUF", "match": ["mmproj"], "ext": ".gguf", "prefer": ["f16", "bf16"]}]},
                  ],
              },
              {
                  "id": "chat_gemma4_e4b_q4_0", "kind": "chat", "title": "Gemma 4 E4B it - Q4_0 (text + vision)",
                  "desc": "Bigger Gemma 4 (4.5B effective). Near the 5 GB class; needs a phone with plenty of free RAM.",
                  "quant": "Q4_0", "gpu": "good", "license": "Apache-2.0",
                  "files": [
                      {"id": "g4e4_model", "role": "model", "flag": "-m",
                       "cands": [{"repo": "unsloth/gemma-4-E4B-it-GGUF", "match": ["gemma-4-e4b-it-q4_0"], "ext": ".gguf"},
                                 {"repo": "ggml-org/gemma-4-E4B-it-GGUF", "match": ["gemma-4-e4b-it-q4_0"], "ext": ".gguf"}]},
                      {"id": "g4e4_mm", "role": "mmproj", "flag": "--mmproj", "optional": True,
                       "cands": [{"repo": "unsloth/gemma-4-E4B-it-GGUF", "match": ["mmproj"], "ext": ".gguf", "prefer": ["f16", "bf16"]},
                                 {"repo": "ggml-org/gemma-4-E4B-it-GGUF", "match": ["mmproj"], "ext": ".gguf", "prefer": ["q8_0", "f16", "bf16"]}]},
                  ],
              },
              {
                  "id": "chat_qwen35_4b", "kind": "chat", "title": "Qwen3.5 4B - Q4_0 (text + vision)",
                  "desc": "Newest Qwen generation. Hybrid linear-attention design: some operations may still run on the CPU, so compare tokens/s with Qwen3 4B.",
                  "quant": "Q4_0", "gpu": "mixed", "license": "Apache-2.0",
                  "files": [
                      {"id": "q35_model", "role": "model", "flag": "-m",
                       "cands": [{"repo": "unsloth/Qwen3.5-4B-GGUF", "match": ["qwen3.5-4b-q4_0"], "ext": ".gguf"},
                                 {"repo": "unsloth/Qwen3.5-4B-GGUF", "match": ["qwen3.5-4b-q4_k_m"], "ext": ".gguf"}]},
                      {"id": "q35_mm", "role": "mmproj", "flag": "--mmproj", "optional": True,
                       "cands": [{"repo": "unsloth/Qwen3.5-4B-GGUF", "match": ["mmproj"], "ext": ".gguf", "prefer": ["f16", "bf16"]}]},
                  ],
              },
          ]


          def main():
              specs = list(PACKS)
              extra = os.environ.get("EXTRA_CATALOG", "catalog_extra.json")
              if os.path.exists(extra):
                  try:
                      more = json.load(open(extra))
                      specs.extend(more if isinstance(more, list) else more.get("packs", []))
                      print("catalog_extra.json: %d extra pack(s)" % len(more if isinstance(more, list) else more.get("packs", [])))
                  except Exception as ex:
                      print("::warning::catalog_extra.json ignored: %s" % ex)
              packs, skipped = [], []
              for spec in specs:
                  pid = spec.get("id", "?")
                  try:
                      files, notes = build(spec)
                  except Exception as ex:
                      files, notes = None, ["error: %s" % ex]
                  if files is None:
                      skipped.append({"id": pid, "title": spec.get("title", pid), "why": notes[-4:]})
                      print("SKIP %s: %s" % (pid, "; ".join(notes[-3:])))
                      continue
                  p = finish(spec, files)
                  packs.append(p)
                  print("OK   %s: %d files, %d MB" % (pid, len(files), sum(f["size"] for f in files) // MIB))
              ids = [p["id"] for p in packs]
              missing = [r for r in REQUIRED if r not in ids]
              json.dump({"packs": packs, "skipped": skipped}, open("catalog.json", "w"), indent=1)
              lines = ["### Model catalog", "", "| pack | kind | files | download | status |", "|---|---|---|---|---|"]
              for p in packs:
                  tot = sum(f["size"] for f in p["files"])
                  lines.append("| `%s` | %s | %d | %.2f GB | resolved |" % (p["id"], p["kind"], len(p["files"]), tot / float(1 << 30)))
              for s in skipped:
                  lines.append("| `%s` | - | - | - | SKIPPED: %s |" % (s["id"], (s["why"] or ["?"])[-1].replace("|", "/")))
              summ = os.environ.get("GITHUB_STEP_SUMMARY")
              if summ:
                  with open(summ, "a") as f:
                      f.write("\n".join(lines) + "\n")
              if missing:
                  print("::error::required pack(s) could not be resolved: %s" % ", ".join(missing))
                  sys.exit(1)


          if __name__ == "__main__":
              main()
          EOF

      - name: Resolve every pack (no big downloads)
        run: python3 catalog.py

      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: catalog.json
          retention-days: 14

  native:
    name: Build sd-cli (arm64, OpenCL/Adreno + NEON)
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SD_COMMIT: ${{ needs.prep.outputs.sd_commit }}
    steps:
      - name: Reuse the compiled engine if this exact commit was already built
        id: bin
        uses: actions/cache@v4
        with:
          path: out
          key: sdcli-arm64-${{ needs.prep.outputs.sd_commit }}-v1

      - name: Install build tools
        if: steps.bin.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake git

      - name: "Fetch stable-diffusion.cpp at the pinned commit and check it"
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp
          git checkout "$SD_COMMIT"
          git submodule update --init --recursive
          cd ..
          for f in diffusion-model llm vae tokenizer backend params-backend cfg-scale steps; do
            grep -rqF -- "--$f" sdcpp/examples || { echo "::error::sd.cpp @ $SD_COMMIT has no --$f option"; exit 1; }
          done
          grep -rIqi "moss" sdcpp/src || { echo "::error::sd.cpp @ $SD_COMMIT has no MOSS-Image support"; exit 1; }
          echo "sd.cpp @ $SD_COMMIT knows MOSS-Image and every flag the app uses."

      - name: "Build OpenCL headers + ICD stub (link-time only)"
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          TC="$NDK/build/cmake/android.toolchain.cmake"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git
          cmake -S OpenCL-Headers -B oh -DCMAKE_INSTALL_PREFIX="$HOME/ocl"
          cmake --build oh --target install
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git
          cmake -S OpenCL-ICD-Loader -B ol -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 \
            -DANDROID_STL=c++_static \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$HOME/ocl/include" \
            -DCMAKE_INSTALL_PREFIX="$HOME/ocl" -DCMAKE_BUILD_TYPE=Release
          cmake --build ol --target install

      - name: "Compile sd-cli"
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S sdcpp -B sdcpp/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON -DGGML_OPENCL_EMBED_KERNELS=ON \
            -DOpenCL_INCLUDE_DIR="$HOME/ocl/include" -DOpenCL_LIBRARY="$HOME/ocl/lib/libOpenCL.so" \
            -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_EXAMPLES=ON
          cmake --build sdcpp/build --target sd-cli || cmake --build sdcpp/build --target sd
          BIN=$(find sdcpp/build -type f \( -name sd-cli -o -name sd \) | head -1)
          test -n "$BIN"
          mkdir -p out
          cp "$BIN" out/libsdcli.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/libsdcli.so
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: sdcli
          path: out/libsdcli.so
          retention-days: 7

  native-llama:
    name: Build llama-server (arm64, OpenCL/Adreno + NEON) [optional]
    needs: prep
    if: ${{ inputs.build_llama != 'no' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLAMA_COMMIT: ${{ needs.prep.outputs.llama_commit }}
    steps:
      - name: Reuse the compiled engine if this exact commit was already built
        id: bin
        uses: actions/cache@v4
        with:
          path: out
          key: llamaserver-arm64-${{ needs.prep.outputs.llama_commit }}-v1

      - name: Install tools
        if: steps.bin.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake git python3 unzip

      - name: Fetch llama.cpp at the pinned commit
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ggml-org/llama.cpp llamacpp
          cd llamacpp
          git checkout "$LLAMA_COMMIT"
          git rev-parse HEAD

      - name: OpenCL headers + ICD loader (same as sd-cli)
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"; test -d "$NDK"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-Headers -B OpenCL-Headers/build -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$HOME/ocl"
          cmake --build OpenCL-Headers/build --target install
          cmake -S OpenCL-ICD-Loader -B OpenCL-ICD-Loader/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$HOME/ocl/include" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/ocl"
          cmake --build OpenCL-ICD-Loader/build --target install
          ls -l "$HOME/ocl/lib"

      - name: Compile llama-server
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S llamacpp -B llamacpp/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON -DGGML_OPENCL_EMBED_KERNELS=ON \
            -DOpenCL_INCLUDE_DIR="$HOME/ocl/include" -DOpenCL_LIBRARY="$HOME/ocl/lib/libOpenCL.so" \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build llamacpp/build --target llama-server
          BIN=$(find llamacpp/build -type f -name llama-server | head -1)
          test -n "$BIN"
          mkdir -p out
          cp "$BIN" out/libllamaserver.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/libllamaserver.so
          ls -l out/libllamaserver.so
          file out/libllamaserver.so | grep -q 'ARM aarch64' || { echo "::error::not an arm64 binary"; exit 1; }
          readelf -d out/libllamaserver.so | grep -E 'NEEDED' || true

      - name: Record which flags this llama.cpp commit supports (read from source; the engine is not run in CI)
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib
          text = ""
          for d in ("common", "tools/server"):
              for p in (pathlib.Path("llamacpp") / d).rglob("*"):
                  if p.suffix in (".cpp", ".h"):
                      text += p.read_text(errors="ignore")
          req = ["--model", "--host", "--port", "--ctx-size", "--n-gpu-layers", "--threads"]
          opt = ["--jinja", "--no-webui", "--chat-template-kwargs", "--parallel", "--mmproj"]
          missing = [f for f in req if '"%s"' % f not in text]
          out = {"available": not missing,
                 "info": ("chat engine built; flags read from llama.cpp source (engine not run in CI)" if not missing
                          else "llama.cpp is missing required flags: " + " ".join(missing)),
                 "proven_flags": [f for f in opt if '"%s"' % f in text]}
          json.dump(out, open("out/llama_flags.json", "w"))
          print(out)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: llamaserver
          path: |
            out/libllamaserver.so
            out/llama_flags.json
          retention-days: 7

  smoke:
    name: Verify model files + end-to-end test (x86)
    needs: [prep, catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SD_COMMIT: ${{ needs.prep.outputs.sd_commit }}
      SMOKE_PACK: ${{ inputs.smoke_pack || 'moss_q2k' }}
      SKIP_SMOKE: ${{ inputs.run_smoke_test && 'false' || 'true' }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake git time jq

      - uses: actions/download-artifact@v4
        with: { name: catalog, path: . }

      - name: "Download the smoke pack's files and check every SHA-256"
        run: |
          set -eo pipefail
          jq -e --arg p "$SMOKE_PACK" '.packs[]|select(.id==$p)' catalog.json > pack.json || { echo "::error::smoke pack $SMOKE_PACK is not in the catalog"; exit 1; }
          test "$(jq -r '.kind' pack.json)" = image || { echo "::error::the smoke pack must be an image pack"; exit 1; }
          if [ "$SKIP_SMOKE" = "true" ]; then echo "smoke test skipped: nothing to download"; exit 0; fi
          mkdir -p m
          jq -r '.files[]|[.name,.url,.sha256]|@tsv' pack.json | while IFS=$'\t' read -r name url sha; do
            curl -fL --retry 6 --retry-delay 5 --retry-all-errors -o "m/$name" "$url"
            echo "$sha  m/$name" | sha256sum -c -
          done
          for f in m/*.gguf; do head -c 4 "$f" | grep -q GGUF || { echo "::error::$f is not a GGUF file"; exit 1; }; done
          df -h .

      - name: "Build x86 sd-cli at the same commit"
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then echo "smoke test skipped"; exit 0; fi
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp
          git checkout "$SD_COMMIT"
          git submodule update --init --recursive
          cd ..
          cmake -S sdcpp -B sdcpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON
          cmake --build sdcpp/build --target sd-cli || cmake --build sdcpp/build --target sd
          BIN=$(find sdcpp/build -type f \( -name sd-cli -o -name sd \) | head -1)
          test -n "$BIN"
          cp "$BIN" ./sdcli-x86
          ls -l ./sdcli-x86

      - name: "Check that the engine has every flag the app uses"
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then
            # fast build: prove the optional flags from the engine SOURCE at the pinned commit (nothing is run)
            git init -q sdsrc && cd sdsrc
            git fetch -q --depth 1 https://github.com/leejet/stable-diffusion.cpp "$SD_COMMIT" && git checkout -q FETCH_HEAD
            cd ..
            PF=""
            for f in --vae-tiling --threads --seed; do grep -rqF -- "$f" sdsrc/examples && PF="$PF $f"; done
            echo "$PF" > proven.txt; : > proven_args.txt
            echo "optional flags found in source:$PF"
            exit 0
          fi
          ./sdcli-x86 --help > help.txt 2>&1 || true
          wc -l help.txt
          for f in $REQ_FLAGS; do
            grep -qF -- "$f" help.txt || { echo "::error::engine --help does not list $f"; exit 1; }
          done
          echo "all required flags present"
          # optional flags: used by the app only if they were part of the CI-tested command
          PF=""; PA=""
          grep -qF -- "--vae-tiling" help.txt && { PF="$PF --vae-tiling"; PA="$PA --vae-tiling"; }
          grep -qF -- "--threads" help.txt && { PF="$PF --threads"; PA="$PA --threads 4"; }
          grep -qF -- "--seed" help.txt && { PF="$PF --seed"; PA="$PA --seed 1234"; }
          echo "$PF" > proven.txt
          echo "$PA" > proven_args.txt
          echo "proven optional flags:$PF"
          { echo '### engine --help (backend / memory flags)'; echo '```'; grep -i -E 'backend|flash|segment|vram|offload|tiling|graph' help.txt | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -qF -- "--diffusion-fa" help.txt && echo "flash attention exists (offered as experimental toggle, not CI-proven)" || true

      - name: "END-TO-END TEST: real 512x512 image with the app's exact flags (CPU mode)"
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then echo 0 > peak_mb.txt; echo "SKIPPED (fast build: nothing was run in CI; flags checked in source only)" > smoke_info.txt; exit 0; fi
          set -o pipefail
          ARGS=()
          while IFS=$'\t' read -r flag name; do ARGS+=("$flag" "m/$name"); done < <(jq -r '.files[]|[.flag,.name]|@tsv' pack.json)
          CFG=$(jq -r '.cfg' pack.json)
          T0=$(date +%s)
          /usr/bin/time -v -o time.txt ./sdcli-x86 "${ARGS[@]}" \
            --backend cpu $COMMON_FLAGS $(cat proven_args.txt) \
            -p "a lighthouse on a cliff at dawn, volumetric light" \
            -W 512 -H 512 --steps 2 --cfg-scale "$CFG" -o smoke.png -v 2>&1 | tee smoke.log
          SECS=$(( $(date +%s) - T0 ))
          KB=$(grep "Maximum resident" time.txt | awk '{print $NF}')
          MB=$(( KB / 1024 ))
          test "$MB" -gt 100
          echo "$MB" > peak_mb.txt
          test -s smoke.png
          python3 - <<'PY'
          import math, struct, zlib
          data = open("smoke.png", "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          pos = 8
          idat = b""
          while pos < len(data):
              ln = struct.unpack(">I", data[pos:pos + 4])[0]
              typ = data[pos + 4:pos + 8]
              body = data[pos + 8:pos + 8 + ln]
              pos += 12 + ln
              if typ == b"IHDR":
                  w, h, bd, ct, _, _, il = struct.unpack(">IIBBBBB", body)
              elif typ == b"IDAT":
                  idat += body
          assert bd == 8 and il == 0 and ct in (0, 2, 6), "unsupported PNG layout %r" % ((bd, ct, il),)
          ch = {0: 1, 2: 3, 6: 4}[ct]
          stride = w * ch
          raw = zlib.decompress(idat)
          prev = bytearray(stride)
          rows = []
          i = 0
          for y in range(h):
              f = raw[i]
              line = bytearray(raw[i + 1:i + 1 + stride])
              i += 1 + stride
              if f == 1:
                  for x in range(ch, stride):
                      line[x] = (line[x] + line[x - ch]) & 255
              elif f == 2:
                  for x in range(stride):
                      line[x] = (line[x] + prev[x]) & 255
              elif f == 3:
                  for x in range(stride):
                      a = line[x - ch] if x >= ch else 0
                      line[x] = (line[x] + ((a + prev[x]) >> 1)) & 255
              elif f == 4:
                  for x in range(stride):
                      a = line[x - ch] if x >= ch else 0
                      b = prev[x]
                      c = prev[x - ch] if x >= ch else 0
                      p = a + b - c
                      pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                      pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                      line[x] = (line[x] + pr) & 255
              rows.append(line)
              prev = line
          n = 0
          s1 = 0.0
          s2 = 0.0
          k3 = min(ch, 3)
          for y in range(0, h, 8):
              row = rows[y]
              for x in range(0, w, 8):
                  k = x * ch
                  v = sum(row[k:k + k3]) / float(k3)
                  s1 += v
                  s2 += v * v
                  n += 1
          mean = s1 / n
          sd = math.sqrt(max(0.0, s2 / n - mean * mean))
          print("image", w, h, "channels", ch, "pixel stddev", round(sd, 2))
          raise SystemExit(0 if (w == 512 and h == 512 and sd > 8) else 1)
          PY
          echo "end-to-end test passed (${SMOKE_PACK}): 512x512, 2 steps, ${SECS}s, peak RAM ${MB} MB (x86 CPU mode)" | tee smoke_info.txt

      - name: "Show the log tail if the test failed"
        if: failure()
        run: |
          {
            echo "### End-to-end test FAILED - last log lines"
            echo '```'
            tail -n 60 smoke.log 2>/dev/null || echo "(no smoke.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Write smoke_result.json"
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({"pack": os.environ["SMOKE_PACK"],
                     "info": open("smoke_info.txt").read().strip(),
                     "peak_rss_mb": int(open("peak_mb.txt").read().strip()),
                     "proven_flags": open("proven.txt").read().split()},
                    open("smoke_result.json", "w"))
          PY
          cat smoke_result.json

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: smoke_result.json
          retention-days: 14

      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            smoke.log
            smoke.png
            time.txt
            help.txt
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: Scaffold, build, sign, release
    needs: [prep, native, smoke, catalog, native-llama]
    if: ${{ always() && needs.native.result == 'success' && needs.smoke.result == 'success' && needs.catalog.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: "Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)"
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - uses: actions/download-artifact@v4
        with: { name: sdcli, path: native }

      - uses: actions/download-artifact@v4
        with: { name: catalog, path: catalog }

      - uses: actions/download-artifact@v4
        with: { name: smoke-result, path: smoke }

      - name: Download llama-server (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: llamaserver, path: llamabin }


      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.mossmini-key
          key: mossmini-signing-key-v1

      - name: "Prepare signing key"
        id: key
        env:
          KS_B64_SECRET: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          ALLOW_NEW_KEY: ${{ inputs.allow_new_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.mossmini-key
          if [ -n "$KS_B64_SECRET" ]; then
            echo "$KS_B64_SECRET" | base64 -d > ~/.mossmini-key/release.jks
            PW="$KS_PASS_SECRET"; AL="$KS_ALIAS_SECRET"
            echo "Using key from repo secrets."
          elif [ -f ~/.mossmini-key/release.jks ] && [ -f ~/.mossmini-key/pass.txt ]; then
            PW=$(cat ~/.mossmini-key/pass.txt); AL=mossmini
            echo "Using key restored from cache."
          else
            if [ "$ALLOW_NEW_KEY" != "true" ] && gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null | grep -q 'mini-v'; then
              echo "::error::Signing key is missing but MossMini releases already exist. A new key would block in-place updates. Re-run with allow_new_key=true only if you accept uninstall/reinstall."
              exit 1
            fi
            PW=$(openssl rand -hex 24); AL=mossmini
            keytool -genkeypair -keystore ~/.mossmini-key/release.jks -alias mossmini \
              -storepass "$PW" -keypass "$PW" -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=MossMini, O=MossMini, C=ID"
            echo "$PW" > ~/.mossmini-key/pass.txt
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New signing key created and cached."
          fi
          echo "::add-mask::$PW"
          echo "KS_PATH=$HOME/.mossmini-key/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PW" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$AL" >> "$GITHUB_ENV"

      - name: "Back up the NEW signing key"
        if: steps.key.outputs.created == 'true'
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          BK_PASS: ${{ secrets.KEY_BACKUP_PASSPHRASE }}
        run: |
          mkdir -p keybackup
          if [ "$IS_PRIVATE" = "true" ]; then
            {
              echo "KEYSTORE_B64=$(base64 -w0 ~/.mossmini-key/release.jks)"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
            } > keybackup/secrets.txt
            echo "::notice::Private repo: key backup uploaded as artifact signing-key-backup (secrets.txt)."
          elif [ -n "$BK_PASS" ]; then
            tar -C ~ -czf - .mossmini-key | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BK_PASS -out keybackup/mossmini-key.tgz.enc
            echo "::notice::Encrypted key backup uploaded (decrypt with KEY_BACKUP_PASSPHRASE)."
          else
            echo "::warning::Public repo and no KEY_BACKUP_PASSPHRASE secret: the key is NOT backed up (artifacts of public repos are world-readable). Add that secret and re-run with allow_new_key=true, or accept that the key lives only in the cache."
          fi

      - name: Upload key backup
        if: steps.key.outputs.created == 'true' && hashFiles('keybackup/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-backup
          path: keybackup/
          retention-days: 5

      - name: "Write manifest.json (packs, sizes, SHA-256, engine status)"
        env:
          SD_COMMIT: ${{ needs.prep.outputs.sd_commit }}
          LLAMA_COMMIT: ${{ needs.prep.outputs.llama_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > merge_manifest.py <<'EOF'
          import json, os, time

          cat = json.load(open("catalog/catalog.json"))
          sm = json.load(open("smoke/smoke_result.json"))
          ll = {}
          if os.path.exists("llamabin/llama_flags.json"):
              ll = json.load(open("llamabin/llama_flags.json"))
          have_bin = os.path.exists("llamabin/libllamaserver.so")
          llama_ok = bool(have_bin and ll.get("available"))
          skipped = sm["info"].startswith("SKIPPED")
          packs = []
          for pk in cat["packs"]:
              if pk["kind"] == "chat" and not llama_ok:
                  continue
              pk["tested"] = "ci-e2e" if (pk["id"] == sm["pack"] and not skipped) else "files"
              packs.append(pk)
          images = [p["id"] for p in packs if p["kind"] == "image"]
          manifest = {
              "schema": 2,
              "sd_commit": os.environ["SD_COMMIT"],
              "llama_commit": os.environ.get("LLAMA_COMMIT", ""),
              "built_at": time.strftime("%Y-%m-%d", time.gmtime()),
              "run_url": os.environ.get("RUN_URL", ""),
              "default_image": "moss_q2k" if "moss_q2k" in images else images[0],
              "smoke_pack": sm["pack"],
              "smoke": sm["info"],
              "peak_rss_mb": 0 if skipped else int(sm["peak_rss_mb"]),
              "required_flags": os.environ["REQ_FLAGS"].split(),
              "proven_flags": sm.get("proven_flags", []),
              "llama": {
                  "available": llama_ok,
                  "info": ll.get("info", "chat engine not built" if not have_bin else "no check result"),
                  "proven_flags": ll.get("proven_flags", []),
              },
              "packs": packs,
          }
          os.makedirs("manifest", exist_ok=True)
          json.dump(manifest, open("manifest/manifest.json", "w"), indent=1)
          lines = ["### Build manifest", "",
                   "- image packs: %s" % ", ".join(images),
                   "- chat engine: %s" % ("yes (" + manifest["llama"]["info"] + ")" if llama_ok else "NOT in this build (" + manifest["llama"]["info"] + ")"),
                   "- end-to-end proof: %s" % manifest["smoke"], ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print(json.dumps(manifest, indent=1)[:3000])
          EOF
          python3 merge_manifest.py

      - name: "Scaffold project files"
        run: |
          mkdir -p app/src/main/{java/com/mossmini/app,res/xml,res/values,res/drawable,res/mipmap-anydpi-v26,assets,jniLibs/arm64-v8a}
          cp native/libsdcli.so app/src/main/jniLibs/arm64-v8a/libsdcli.so
          if [ -f llamabin/libllamaserver.so ]; then cp llamabin/libllamaserver.so app/src/main/jniLibs/arm64-v8a/libllamaserver.so; fi
          cp manifest/manifest.json app/src/main/assets/manifest.json
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
