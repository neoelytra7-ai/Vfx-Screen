              private fun onDownload(p: Pack) {
                  if (Dl.active) {
                      Toast.makeText(this, "A download is already running.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val need = p.totalBytes - Store.onDiskBytes(this, p)
                  val free = Sys.freeDiskMb(Store.dir(this)) shl 20
                  if (need > free - (300L shl 20)) {
                      Toast.makeText(this, "Not enough storage: need " + Sys.fmtSize(need) + ", free " + Sys.fmtSize(free), Toast.LENGTH_LONG).show()
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 5)
                  }
                  Dl.start(this, p.files)
              }

              private fun confirmDelete(p: Pack) {
                  if (Dl.active) {
                      Toast.makeText(this, "Stop the download first.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Delete " + p.title + "?")
                      .setMessage("Frees up to " + Sys.fmtSize(Store.onDiskBytes(this, p)) +
                          ". Files that another installed model still uses are kept.")
                      .setPositiveButton("Delete") { _, _ ->
                          thread {
                              Store.deletePack(this, p, mf.packs)
                              ui.post { refresh() }
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun refresh() {
                  val used = Store.usedBytes(this)
                  val freeMb = Sys.freeDiskMb(Store.dir(this))
                  storText.text = "Models use " + Sys.fmtSize(used) + " \u00B7 " + freeMb + " MB free on this phone"
                  val tot = used + (freeMb shl 20)
                  storBar.frac = if (tot > 0) used.toFloat() / tot else 0f
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  val unrestricted = try { pm.isIgnoringBatteryOptimizations(packageName) } catch (e: Exception) { false }
                  batText.text = if (unrestricted) "Battery: unrestricted, background work will not be paused."
                  else "Battery: optimized. Some phones pause long background downloads; tap below if that happens."

                  val dl = Dl.active
                  dlCard.root.visibility = if (dl) View.VISIBLE else View.GONE
                  if (dl) {
                      dlText.text = Dl.info
                      dlBar.frac = Dl.overall()
                      dlCard.setBadge((Dl.overall() * 100).toInt().toString() + "%", Pal.info)
                  }
                  for (r in rows) {
                      val p = r.p
                      val have = Store.haveCount(this, p)
                      val inst = have == p.files.size
                      val disk = Store.onDiskBytes(this, p)
                      val frac = if (p.totalBytes > 0) (disk.toFloat() / p.totalBytes).coerceIn(0f, 1f) else 0f
                      val sel = Catalog.selected(this, p.kind)?.id == p.id
                      val ram = if (p.measuredMb > 0) "RAM peak " + p.measuredMb + " MB (measured in CI)" else "RAM ~" + p.ramMb + " MB (estimate)"
                      r.status.text = (if (inst) "installed" else if (disk > 0) "$have of ${p.files.size} files \u00B7 " + (frac * 100).toInt() + "%" else "not installed") +
                          " \u00B7 " + ram
                      r.bar.frac = if (inst) 1f else frac
                      r.bar.color = if (inst) Pal.g1 else Pal.warn
                      if (inst) r.card.setBadge(if (sel) "in use" else "installed", if (sel) Pal.g1 else Pal.sub)
                      else if (disk > 0) r.card.setBadge("partial", Pal.warn)
                      else r.card.setBadge("not installed", Pal.dim)
                      val sbf = StringBuilder()
                      for (m in p.files) {
                          val v = Store.verified(this, m)
                          sbf.append(if (v) "\u2713 " else "\u2022 ").append(m.name).append("  ").append(Sys.fmtSize(m.size))
                          val s = Dl.st(m.id)
                          if (!v && s.text.isNotEmpty()) sbf.append("  ").append(s.text)
                          sbf.append('\n')
                      }
                      r.files.text = sbf.toString().trimEnd()
                      r.bDl.text = if (inst) "Installed" else if (disk > 0) "Resume" else "Download"
                      r.bDl.isEnabled = !inst && !dl
                      r.bDl.alpha = if (r.bDl.isEnabled) 1f else 0.45f
                      r.bSel.text = if (sel) "In use" else "Use"
                      r.bSel.isEnabled = inst && !sel
                      r.bSel.alpha = if (r.bSel.isEnabled) 1f else 0.45f
                      r.bDel.isEnabled = disk > 0 && !dl
                      r.bDel.alpha = if (r.bDel.isEnabled) 1f else 0.45f
                  }
              }
          }
