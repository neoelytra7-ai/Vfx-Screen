                  fText = Array(files.size) { "checking\u2026" }
                  fLevel = IntArray(files.size) { 2 }
              }

              private fun engineHelp(bin: File): String? = try {
                  val pb = ProcessBuilder(bin.absolutePath, "--help").redirectErrorStream(true)
                  pb.environment()["LD_LIBRARY_PATH"] = libEnv
                  val p = pb.start()
                  val txt = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  txt
              } catch (e: Exception) {
                  logE("Engine failed to start: $e")
                  null
              }

              // =====================================================================
              //  compatibility check
              // =====================================================================
              private fun preflight() {
                  val out = ArrayList<Item>()
                  fun item(level: Int, text: String) { out.add(Item(level, text)) }

                  item(3, Build.MANUFACTURER + " " + Build.MODEL + " \u00B7 " + soc() + " \u00B7 Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")")

                  val abiOk = Build.SUPPORTED_64_BIT_ABIS.contains("arm64-v8a")
                  item(if (abiOk) 0 else 2, "CPU is arm64-v8a" + (if (abiOk) "" else " (this phone: " + Build.SUPPORTED_ABIS.joinToString() + ")"))

                  val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                  val binOk = bin.exists() && bin.canExecute()
                  item(if (binOk) 0 else 2, "Engine file present (" + (bin.length() shr 10) + " KB)")
                  if (binOk) {
                      if (helpText.isEmpty()) helpText = engineHelp(bin) ?: ""
                      if (helpText.isEmpty()) {
                          item(2, "Engine does not start (see Log)")
                      } else {
                          val missing = reqFlags.filter { !helpText.contains(it) }
                          item(if (missing.isEmpty()) 0 else 2,
                              if (missing.isEmpty()) "Engine supports all " + reqFlags.size + " flags this app needs"
                              else "Engine is missing: " + missing.joinToString(" "))
                      }
                  }

                  val ocl = listOf("/vendor/lib64/libOpenCL.so", "/system/vendor/lib64/libOpenCL.so", "/system/lib64/libOpenCL.so")
                      .firstOrNull { File(it).exists() }
                  item(if (ocl != null) 0 else 1,
                      if (ocl != null) "GPU: OpenCL driver found \u2192 Adreno path available" else "GPU: no libOpenCL.so found \u2192 CPU mode will be used")
                  val hex = listOf("/vendor/lib64/libcdsprpc.so", "/system/lib64/libcdsprpc.so").firstOrNull { File(it).exists() }
                  item(3, if (hex != null) "NPU: Hexagon present, but this engine has no NPU backend \u2192 GPU/CPU only"
                  else "NPU: not exposed to apps on this device")

                  var needBytes = 0L
                  var okFiles = 0
                  for (m in files) {
                      if (isVerified(m)) { okFiles++; continue }
                      val have = maxOf(fileOf(m).length(), partOf(m).length())
                      needBytes += maxOf(0L, m.size - have)
                  }
                  val needMb = needBytes shr 20
                  val freeMb = freeDiskMb()
                  item(if (freeMb >= needMb + 300) 0 else 2, "Storage: $freeMb MB free, $needMb MB still to download")
                  item(if (okFiles == files.size) 0 else 2, "Model files: $okFiles of ${files.size} verified")

                  val avail = availMemMb()
                  val total = totalMemMb()
                  val baseNeed = if (peakRssMb > 0) (peakRssMb * 1.15).toLong() + 200 else pack.ramMb
                  val ditMb = (files.firstOrNull { m -> m.flag == "--diffusion-model" }?.size ?: 0L) shr 20
                  val extra = if (perfTier > 0) ditMb else 0L
                  val needRam = baseNeed + extra
                  val ramText = "RAM: $avail MB free of $total MB \u00B7 needs ~$needRam MB (" + (if (peakRssMb > 0) "CI peak $peakRssMb MB" else "estimate, not measured") +
                      (if (extra > 0) " + $extra MB for " + tierNames[perfTier] else "") + ")"
                  when {
                      avail >= needRam -> item(0, ramText)
                      avail * 100 >= baseNeed * 80 -> item(1, ramText + (if (extra > 0) " \u00B7 tight for this tier; falls back to Balanced if killed" else " \u00B7 tight, close other apps for safety"))
                      ignoreRamNow -> item(1, "$ramText \u00B7 IGNORED by you, may crash")
                      peakRssMb <= 0 -> item(1, "$ramText \u00B7 close other apps if the engine gets killed")
                      else -> item(2, "$ramText \u00B7 close other apps, then Re-check")
                  }

                  if (!busy) {
                      for ((i, m) in files.withIndex()) {
                          val f = fileOf(m)
                          when {
                              isVerified(m) -> { fFrac[i] = 1f; fText[i] = "verified"; fLevel[i] = 0 }
                              f.exists() && f.length() == m.size -> { fFrac[i] = 0.85f; fText[i] = "downloaded \u00B7 verify pending"; fLevel[i] = 1 }
                              partOf(m).exists() -> {
                                  val fr = partOf(m).length().toFloat() / m.size
                                  fFrac[i] = fr * 0.85f
                                  fText[i] = "partial " + (fr * 100).toInt() + "%"
                                  fLevel[i] = 1
                              }
                              else -> { fFrac[i] = 0f; fText[i] = "not downloaded"; fLevel[i] = 2 }
                          }
                      }
                  }

                  items = out
                  ready = out.none { it.level == 2 }
                  ui.post { renderCompat() }
              }

              private fun renderCompat() {
                  val its = items
                  val bad = its.count { x -> x.level == 2 }
                  val warn = its.count { x -> x.level == 1 }
                  if (bad > 0) cCompat.setBadge("$bad blocking", Pal.err)
                  else if (warn > 0) cCompat.setBadge("$warn warning", Pal.warn)
                  else cCompat.setBadge("all clear", Pal.g1)
                  val sb = SpannableStringBuilder()
                  val show = its.filter { x -> compatExpanded || x.level == 1 || x.level == 2 }
                  if (show.isEmpty()) {
                      sb.append("\u2713 " + its.size + " checks passed. Tap Details to see them.")
                  } else {
                      for (x in show) {
                          val mark = when (x.level) { 0 -> "\u2713 "; 1 -> "! "; 2 -> "\u2717 "; else -> "\u2022 " }
                          val s = sb.length
                          sb.append(mark)
                          sb.setSpan(ForegroundColorSpan(levelColor(x.level)), s, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                          sb.append(x.text).append('\n')
                      }
                  }
                  compatView.text = sb
                  cbFa.isEnabled = helpText.contains("--flash-attn") || helpText.contains("--diffusion-fa")
                  cbFa.text = if (cbFa.isEnabled) "Flash attention (experimental, GPU only)" else "Flash attention (not in this engine)"
                  val cacheOk = helpText.contains("--cache-mode") && helpText.contains("--cache-option")
                  if (cbCache.isEnabled != cacheOk) {
                      cbCache.isEnabled = cacheOk
                      if (cacheOk) cbCache.isChecked = prefs.getBoolean("easycache", false)
                  }
                  cbCache.text = if (cacheOk) "EasyCache: skip near-identical steps (experimental, 10+ steps)" else "EasyCache (not in this engine)"
              }

              // =====================================================================
              //  download + verify
              // =====================================================================
              private fun setFile(i: Int, frac: Float, text: String, level: Int) {
                  fFrac[i] = frac
                  fText[i] = text
                  fLevel[i] = level
              }

              private fun overallFrac(): Float {
                  var tot = 0.0
                  var done = 0.0
                  for ((i, m) in files.withIndex()) { tot += m.size; done += m.size * fFrac[i] }
                  return if (tot <= 0.0) 0f else (done / tot).toFloat()
              }

              private fun remainingBytes(): Long {
                  var r = 0L
                  for ((i, m) in files.withIndex()) r += ((1f - fFrac[i]) * m.size).toLong()
                  return r
              }

              private fun syncDl() {
                  if (!Dl.active) return
                  for ((i, m) in files.withIndex()) {
                      val s = Dl.st(m.id)
                      if (s.text.isNotEmpty()) { fFrac[i] = s.frac; fText[i] = s.text; fLevel[i] = s.level }
                  }
                  dlInfo = Dl.info
              }

              private fun ensureNotifPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 5)
                  }
              }

              private fun downloadAll() {
                  if (busy) return
                  ensureNotifPermission()
                  log("Download started in the background service. You can leave the app; it keeps going.")
                  Dl.start(this, files)
              }

              // =====================================================================
              //  import / backup of model files (no re-download)
              // =====================================================================
              private fun nameSize(u: Uri): Pair<String, Long> {
                  var n = ""
                  var sz = -1L
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              val j = c.getColumnIndex(OpenableColumns.SIZE)
                              if (i >= 0) n = c.getString(i) ?: ""
                              if (j >= 0 && !c.isNull(j)) sz = c.getLong(j)
                          }
                      }
                  } catch (e: Exception) { }
                  return Pair(n, sz)
              }

              private fun importUris(uris: List<Uri>) {
                  if (busy) return
                  busy = true
                  phase = "dl"
                  cancel = false
                  dlRate = 0.0
                  dlInfo = "importing\u2026"
                  openRunLog("import")
                  try {
                      var imported = 0
                      for (u in uris) {
                          if (cancel) break
                          val (nm, sz) = nameSize(u)
                          var idx = files.indexOfFirst { m -> m.name == nm }
                          if (idx < 0) idx = files.indexOfFirst { m -> m.size == sz }
                          if (idx < 0) { logW("Skipped \"" + nm + "\": not one of the model files."); continue }
                          val m = files[idx]
                          if (isVerified(m)) { log(m.name + ": already verified, skipped"); continue }
                          if (sz >= 0 && sz != m.size) { logW(nm + ": size " + sz + " does not match the expected " + m.size + ", skipped"); continue }
                          val free = StatFs(modelDir.path).availableBytes
                          if (m.size > free - (200L shl 20)) { logE(m.name + ": not enough storage (" + (free shr 20) + " MB free)"); continue }
                          val part = partOf(m)
                          part.delete()
                          fileOf(m).delete()
                          val md = MessageDigest.getInstance("SHA-256")
                          var done = 0L
                          var lastDone = 0L
                          var lastT = System.currentTimeMillis()
                          log("Importing " + nm + " as " + m.name)
                          try {
                              val inp = contentResolver.openInputStream(u) ?: throw RuntimeException("cannot open file")
                              inp.use { src ->
                                  part.outputStream().use { o ->
                                      val buf = ByteArray(1 shl 20)
                                      while (true) {
                                          if (cancel) throw RuntimeException("cancelled")
                                          val n = src.read(buf)
                                          if (n < 0) break
                                          o.write(buf, 0, n)
                                          md.update(buf, 0, n)
                                          done += n
                                          val now = System.currentTimeMillis()
                                          if (now - lastT >= 700) {
                                              val rate = (done - lastDone) / 1048576.0 / maxOf(0.001, (now - lastT) / 1000.0)
                                              lastDone = done
                                              lastT = now
                                              val p = done.toFloat() / m.size
                                              setFile(idx, p, "importing " + (p * 100).toInt() + "%", 1)
                                              dlInfo = String.format(Locale.US, "Importing %s \u00B7 %.0f MB/s", m.name, rate)
                                          }
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              part.delete()
                              if (!cancel) {
                                  logE(m.name + ": import failed: " + e)
                                  setFile(idx, 0f, "import failed", 2)
                              }
                              continue
                          }
                          val h = md.digest().joinToString("") { b -> String.format("%02x", b) }
                          if (done == m.size && h == m.sha) {
                              val dest = fileOf(m)
                              if (part.renameTo(dest)) {
                                  prefs.edit().putString("v_" + m.id, stamp(m, dest)).apply()
                                  setFile(idx, 1f, "verified", 0)
                                  log(m.name + ": imported, SHA-256 OK")
                                  imported++
                              } else {
                                  part.delete()
                                  logE(m.name + ": could not finalize the imported file")
                              }
                          } else {
                              part.delete()
                              logE(m.name + ": SHA-256 MISMATCH after import (got " + h.take(12) + ", expected " + m.sha.take(12) + "). That file is a different version or corrupt; deleted.")
                              setFile(idx, 0f, "SHA mismatch, deleted", 2)
                          }
                      }
                      log("Import finished: $imported file(s) accepted.")
                  } catch (e: Exception) {
                      logE("Import error: $e")
                  } finally {
                      closeRunLog()
                      busy = false
                      phase = "idle"
                      dlInfo = ""
                      preflight()
                  }
              }

              private fun backupModels() {
                  if (busy) return
                  if (Build.VERSION.SDK_INT < 29) { logW("Backup needs Android 10 or newer."); return }
                  busy = true
                  phase = "dl"
                  cancel = false
                  dlRate = 0.0
                  dlInfo = "backing up\u2026"
                  openRunLog("backup")
                  try {
                      val rel = Environment.DIRECTORY_DOWNLOADS + "/MossMini"
                      var copied = 0
                      for ((i, m) in files.withIndex()) {
                          if (cancel) break
                          if (!isVerified(m)) { logW(m.name + ": not verified, skipped"); continue }
                          var exists = false
                          try {
                              contentResolver.query(
                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.MediaColumns.SIZE),
                                  MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?",
                                  arrayOf(m.name, rel + "%"), null
                              )?.use { c ->
                                  while (c.moveToNext()) { if (c.getLong(0) == m.size) exists = true }
                              }
                          } catch (e: Exception) { }
                          if (exists) { log(m.name + ": already in Downloads/MossMini"); copied++; continue }
                          val free = StatFs(Environment.getExternalStorageDirectory().path).availableBytes
                          if (m.size > free - (300L shl 20)) { logE(m.name + ": not enough shared storage for the backup"); continue }
                          val v = ContentValues()
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, m.name)
                          v.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream")
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel)
                          v.put(MediaStore.MediaColumns.IS_PENDING, 1)
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                          if (uri == null) { logE(m.name + ": could not create the backup file"); continue }
                          log("Backing up " + m.name + " to Downloads/MossMini")
                          try {
                              val o = contentResolver.openOutputStream(uri) ?: throw RuntimeException("cannot open output")
                              o.use { out ->
                                  fileOf(m).inputStream().use { src ->
                                      val buf = ByteArray(1 shl 20)
                                      var done = 0L
                                      var lastDone = 0L
                                      var lastT = System.currentTimeMillis()
                                      while (true) {
                                          if (cancel) throw RuntimeException("cancelled")
                                          val n = src.read(buf)
                                          if (n < 0) break
                                          out.write(buf, 0, n)
                                          done += n
                                          val now = System.currentTimeMillis()
                                          if (now - lastT >= 700) {
                                              val rate = (done - lastDone) / 1048576.0 / maxOf(0.001, (now - lastT) / 1000.0)
                                              lastDone = done
                                              lastT = now
                                              val p = done.toFloat() / m.size
                                              setFile(i, p, "backup " + (p * 100).toInt() + "%", 1)
                                              dlInfo = String.format(Locale.US, "Backing up %s \u00B7 %.0f MB/s", m.name, rate)
                                          }
                                      }
                                  }
                              }
                              val done0 = ContentValues()
                              done0.put(MediaStore.MediaColumns.IS_PENDING, 0)
                              contentResolver.update(uri, done0, null, null)
                              copied++
                              setFile(i, 1f, "verified", 0)
                          } catch (e: Exception) {
                              try { contentResolver.delete(uri, null, null) } catch (e2: Exception) { }
                              if (!cancel) logE(m.name + ": backup failed: " + e)
                              setFile(i, 1f, "verified", 0)
                          }
                      }
                      log("Backup finished: $copied of ${files.size} file(s) are in Downloads/MossMini. Keep them: after a reinstall use Import.")
                  } catch (e: Exception) {
                      logE("Backup error: $e")
                  } finally {
                      closeRunLog()
                      busy = false
                      phase = "idle"
                      dlInfo = ""
                      preflight()
                  }
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req != 77 || res != RESULT_OK || data == null) return
                  val list = ArrayList<Uri>()
                  val cd = data.clipData
                  if (cd != null) {
                      for (i in 0 until cd.itemCount) list.add(cd.getItemAt(i).uri)
                  } else {
                      val one = data.data
                      if (one != null) list.add(one)
                  }
                  if (list.isNotEmpty()) thread { importUris(list) }
              }


              // =====================================================================
              //  root boost (Magisk): optional, every step is logged
              // =====================================================================
              private fun checkRoot(): Boolean = Root.check()

              private fun rootPre() {
                  Root.pre(this, rootMode) { s -> log(s) }
                  rootActive = true
                  rootInfo = Root.info
              }

              private fun rootPost() {
                  Root.post(this) { s -> log(s) }
                  rootActive = false
              }

              private fun rootPin(pid: Int) {
                  Root.pin(this, pid, rootMode) { s -> log(s) }
              }

              // =====================================================================
              //  generate
              // =====================================================================
              private fun onGenClick() {
                  if (busy && phase == "gen") {
                      cancel = true
                      proc?.destroyForcibly()
                      logW("Stop requested.")
                      return
                  }
                  if (busy || !ready) return
                  if (Run.chatBusy) { logW("Unload the chat model first (it holds RAM)."); return }
                  if (Run.imageBusy) { logW("An earlier image run is still shutting down. Wait a moment."); return }
                  val text = prompt.text.toString().trim()
                  if (text.isEmpty()) { logW("Write a prompt first."); return }
                  val size = listOf(256, 384, 512, 768, 1024)[segSize.selected]
                  val st = (steps.text.toString().toIntOrNull() ?: 20).coerceIn(1, 60)
                  val c = (cfg.text.toString().toDoubleOrNull() ?: 3.0).coerceIn(0.0, 20.0)
                  val sd = seed.text.toString().trim().toLongOrNull() ?: (System.currentTimeMillis() % 1000000000L)
                  val th = (threads.text.toString().toIntOrNull() ?: 4).coerceIn(1, 8)
                  prefs.edit().putInt("size_i", segSize.selected).putInt("mode_i", segMode.selected)
                      .putString("steps_" + variant, st.toString()).putString("cfg_" + variant, c.toString())
                      .putString("threads", th.toString()).putString("prompt", text).putInt("perf_j", segPerf.selected).apply()
                  useCache = cbCache.isChecked && cbCache.isEnabled
                  prefs.edit().putInt("mem_i", segMem.selected).apply()
                  val availNow = availMemMb()
                  memCapGb = when (segMem.selected) {
                      1 -> 0
                      2 -> 3
                      3 -> 2
                      4 -> 1
                      else -> if (availNow < 0 || availNow >= 7000) 0 else if (availNow >= 5000) 3 else if (availNow >= 3500) 2 else 1
                  }
                  if (size >= 768) log("Size $size: the VAE is tiled; the memory cap and Flash attention (optional) keep the big compute buffers in check. Expect it to be slow.")
                  val req = Req(text, size, st, c, sd, th, segMode.selected, cbFa.isChecked && cbFa.isEnabled, segPerf.selected)
                  thread { runGenerate(req) }
              }

              private fun runGenerate(r: Req) {
                  if (busy) return
                  busy = true
                  phase = "gen"
                  cancel = false
                  hs = 1
                  attempts.clear()
                  diagText = ""
                  doneInfo = ""
                  runStart = System.currentTimeMillis()
                  runEnd = 0L
                  rssPeak = 0L
                  rssNow = 0L
                  stage = 0
                  stepNow = 0
                  stepTotal = 0
                  secIt = 0.0
                  openRunLog("generate")
                  acquireWake()
                  Run.imageBusy = true
                  WorkService.begin(this, "Generating image \u00B7 " + pack.title.substringBefore(" - "))
                  if (rootMode > 0) {
                      try { rootPre() } catch (e: Exception) { logW("Root boost failed: $e") }
                  }
                  var produced = false
                  try {
                      preflight()
                      if (!ready) {
                          logE("Not generating: a compatibility check failed (see Compatibility).")
                          hs = 3
                          diagText = "Cause: a compatibility check failed.\nFix: open the Compatibility card and fix the red items."
                          return
                      }
                      var order = profiles.filter { p -> when (r.mode) { 1 -> p.kind == "gpu"; 2 -> p.kind == "cpu"; else -> true } }
                      if (r.mode == 0) {
                          val last = prefs.getString("last_profile", "") ?: ""
                          order = order.sortedBy { p -> if (p.name == last) 0 else 1 }
                      }
                      if (order.isEmpty()) {
                          logE("No engine mode matches this selection.")
                          hs = 3
                          diagText = "Cause: no engine mode matches your Engine choice.\nFix: set Engine to Auto."
                          return
                      }
                      log("Free RAM before start: " + availMemMb() + " MB of " + totalMemMb() + " MB | seed " + r.seed)
                      val plan = ArrayList<Pair<Prof, Int>>()
                      for ((i0, p0) in order.withIndex()) {
                          if (r.tier > 0 && i0 == 0) plan.add(Pair(p0, r.tier))
                          plan.add(Pair(p0, 0))
                      }
                      for ((k, pt) in plan.withIndex()) {
                          if (cancel) break
                          attemptIdx = k + 1
                          attemptTotal = plan.size
                          val p = pt.first
                          val tier = pt.second
                          log("--- Try " + (k + 1) + "/" + plan.size + ": " + p.name + " [" + tierNames[tier] + "]")
                          val res = runOnce(p, r, tier)
                          if (res == 0) {
                              prefs.edit().putString("last_profile", p.name).apply()
                              produced = true
                              break
                          }
                          if (res == 2) break
                          if (res == 3 && tier == 0) break
                          if (k < plan.size - 1) logW("That attempt did not produce an image. Trying the next one.")
                      }
                      hs = if (produced) 2 else if (cancel) 0 else 3
                      if (produced) diagText = ""
                      if (!produced && !cancel) {
                          if (diagText.isEmpty()) diagText = "Cause: no mode produced an image.\nFix: tap Share report and send it."
                          logE("No mode produced an image. Use Share report for debugging.")
                      }
                  } catch (e: Exception) {
                      if (cancel) {
                          logW("Stopped.")
                          hs = 0
                      } else {
                          logE("ERR: $e")
                          hs = 3
                          diagText = "Cause: unexpected app error: $e\nFix: tap Share report."
                      }
                  } finally {
                      if (runEnd == 0L) runEnd = System.currentTimeMillis()
                      if (rootActive) {
                          try { rootPost() } catch (e: Exception) { logW("Root restore failed: $e") }
                      }
                      releaseWake()
                      closeRunLog()
                      proc = null
                      enginePid = -1
                      busy = false
                      phase = "idle"
                      Run.imageBusy = false
                      WorkService.end(this)
                  }
              }

              private fun pumpLines(inp: InputStream, onLine: (String) -> Unit) {
                  val acc = ByteArrayOutputStream()
                  val buf = ByteArray(4096)
                  while (true) {
                      val n = inp.read(buf)
                      if (n < 0) break
                      for (i in 0 until n) {
                          val b = buf[i].toInt()
                          if (b == 10 || b == 13) {
                              if (acc.size() > 0) { onLine(acc.toString("UTF-8")); acc.reset() }
                          } else {
                              acc.write(b)
                              if (acc.size() > 8192) { onLine(acc.toString("UTF-8")); acc.reset() }
                          }
                      }
                  }
                  if (acc.size() > 0) onLine(acc.toString("UTF-8"))
              }

              private fun advanceStage(l: String, line: String) {
                  val s = when {
                      l.contains("save result") -> 4
                      decRe.containsMatchIn(l) || l.contains("decode_first_stage") || l.contains("sampling completed") -> 3
                      l.contains("start sampling") || l.contains("sampling using") || l.contains("get_learned_condition completed") -> 2
                      l.contains("generating image") || l.contains("get_learned_condition") || l.contains("tokeniz") -> 1
                      else -> -1
                  }
                  if (s > stage) {
                      stage = s
                      addLog(1, 0, "stage \u2192 " + stageNames[s] + " at " + fmtDur((System.currentTimeMillis() - runStart) / 1000) + "  (trigger: " + line.take(110) + ")")
                  }
              }

              private fun fileLog(s: String) {
                  synchronized(logs) {
                      try { runLog?.write(s + "\n") } catch (e: Exception) { }
                  }
              }

              private fun onEngineLine(raw: String) {
                  val line = raw.trim()
                  if (line.isEmpty()) return
                  lastOutMs = System.currentTimeMillis()
                  val m = stepRe.find(line)
                  if (m != null) {
                      val a = m.groupValues[1].toIntOrNull() ?: 0
                      val b = m.groupValues[2].toIntOrNull() ?: 0
                      var v = m.groupValues[3].toDoubleOrNull() ?: 0.0
                      if (m.groupValues[4] == "it/s") v = if (v > 0.0) 1.0 / v else 0.0
                      if (b in 1..999) {
                          val changed = a != stepNow
                          stepNow = a
                          stepTotal = b
                          if (v > 0.0) secIt = v
                          if (stage < 2) stage = 2
                          lastLine = "step $a/$b"
                          if (changed) addLog(1, 1, String.format(Locale.US, "step %d/%d \u00B7 %.2f s/it", a, b, v))
                          return
                      }
                  }
                  // weight-loading progress bars ("|####| 8/8 - 176MB/s"): activity only, never shown in the log
                  if (barRe.containsMatchIn(line)) { fileLog(line); return }
                  if (dotRe.containsMatchIn(line)) {
                      if (dotCount == 0) dotFirst = lastOutMs
                      dotCount++
                      dotLast = lastOutMs
                      lastLine = "building OpenCL kernels \u00B7 " + dotCount
                      return
                  }
                  if (dotCount > 0 && !dotLogged) {
                      dotLogged = true
                      addLog(1, 0, "OpenCL kernel build: " + dotCount + " dots over " + ((dotLast - dotFirst) / 1000) + " s")
                  }
                  val l = line.lowercase(Locale.ROOT)
                  val sg = segRe.find(line)
                  if (sg != null) segTotal = sg.groupValues[1].toIntOrNull() ?: 0
                  val loader = line.contains("model_loader.cpp") || line.contains("model_manager.cpp")
                  if (loader) {
                      if (line.contains("loading tensors completed")) blockLoads++
                      lastLine = "streaming weights from disk \u00B7 " + blockLoads + " block loads" +
                          (if (segTotal > 0) " (" + segTotal + " per pass)" else "")
                      if (blockLoads > 3 && classify(line) <= 1) { fileLog(line); return }
                  }
                  advanceStage(l, line)
                  if (l.contains("opencl")) {
                      sawOcl = true
                      val gm = adrenoRe.find(line)
                      if (gm != null) gpuName = gm.value
                  }
                  if (!loader) lastLine = line
                  addLog(classify(line), 1, line)
              }

              private fun recentEngineText(): String {
                  val snap = synchronized(logs) { ArrayList(logs) }
                  return snap.filter { e -> e.src == 1 }.takeLast(150).joinToString("\n") { e -> e.text }.lowercase(Locale.ROOT)
              }

              private fun diagnose(code: Int, p: Prof, peak: Long): String {
                  val txt = recentEngineText()
                  val sig = signalOf(code)
                  val free = availMemMb()
                  return when {
                      sig == 9 -> "Cause: Android killed the engine (out of memory). Engine peak $peak MB, free RAM now $free MB.\nFix: close other apps, choose size 256 or 384, or reboot to free RAM, then try again."
                      sig == 4 -> "Cause: illegal CPU instruction (this build targets ARMv8.6 i8mm/bf16).\nFix: tap Share report; the build needs a lower -march."
                      sig == 11 || sig == 6 || sig == 7 ->
                          if (p.kind == "gpu") "Cause: engine crashed in GPU mode (signal $sig), usually the OpenCL driver.\nFix: set Engine = CPU, or turn off Flash attention."
                          else "Cause: engine crashed (signal $sig).\nFix: tap Share report."
                      txt.contains("bad_alloc") || txt.contains("out of memory") || txt.contains("failed to allocate") ||
                          txt.contains("cl_mem_object_allocation_failure") || txt.contains("cl_out_of_resources") ->
                          "Cause: a memory allocation failed (RAM or GPU memory).\nFix: smaller size, close other apps, or Engine = CPU."
                      txt.contains("opencl") && (txt.contains("error") || txt.contains("failed")) ->
                          "Cause: OpenCL error in the GPU driver.\nFix: Engine = CPU, or retry; the first GPU run compiles kernels."
                      txt.contains("unknown model architecture") || txt.contains("unsupported") || txt.contains("unknown type") ->
                          "Cause: the engine rejected a model file (architecture or quantization not supported by this engine build).\nFix: rebuild with a newer sd_cpp_ref."
                      txt.contains("no such file") || txt.contains("failed to open") || txt.contains("cannot open") ->
                          "Cause: the engine could not open a model file.\nFix: run Download + verify again."
                      code != 0 -> "Cause: engine exited with code $code and no recognizable error.\nLast engine line: $lastLine"
                      else -> "Cause: engine finished but wrote no image.\nFix: tap Share report."
                  }
              }

              private fun tierFlags(p: Prof, tier: Int): List<String> =
                  if (tier <= 0) p.flags else p.flags.map { f -> f.replace("diffusion=disk", "diffusion=cpu") }

              private fun updatePerfNote() {
                  val ditMb = (files.firstOrNull { m -> m.flag == "--diffusion-model" }?.size ?: 0L) shr 20
                  perfNote.text = when (perfTier) {
                      1 -> "Experimental. Keeps the diffusion weights in RAM (~" + ditMb + " MB more). Can push the phone into memory pressure; only worth it if the GPU stat shows real load."
                      2 -> "Experimental. Fast plus flash attention on the GPU. Highest RAM use; falls back automatically."
                      else -> "Weights stream from disk: lowest RAM. Use this by default."
                  }
              }

              private fun updateWork() {
                  val st = (steps.text.toString().toIntOrNull() ?: 20).coerceIn(1, 60)
                  val c = cfg.text.toString().toDoubleOrNull() ?: 3.0
                  val passes = if (Math.abs(c - 1.0) < 0.001) st else st * 2
                  workNote.text = "Up to " + passes + " diffusion passes (" + st + " steps" +
                      (if (passes != st) " \u00D7 2 while CFG is not 1" else ", no CFG pass") + "). Each pass is the slow part."
              }

              /** 0 = image made, 1 = failed (try next), 2 = stopped by you, 3 = killed for memory */
              private fun runOnce(p: Prof, r: Req, tier: Int): Int {
                  val lbl = p.kind.uppercase(Locale.ROOT) + " \u00B7 " + tierNames[tier]
                  curTier = tier
                  val out = File(cacheDir, "out.png")
                  out.delete()
                  stage = 0
                  stepNow = 0
                  stepTotal = 0
                  secIt = 0.0
                  sawOcl = false
                  gpuName = ""
                  blockLoads = 0
                  segTotal = 0
                  dotCount = 0
                  dotLogged = false
                  cpuPct = 0L
                  lastCpuTicks = -1L
                  lastCpuT = 0L
                  curKind = p.kind
                  lastLine = "starting engine\u2026"
                  lastReadT = 0L
                  lastReadMb = 0L
                  diskRate = 0L
                  rssPeak = 0L
                  rssNow = 0L
                  lastOutMs = System.currentTimeMillis()

                  val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                  val cmd = ArrayList<String>()
                  cmd.add(bin.absolutePath)
                  for (m in files) {
                      cmd.add(m.flag)
                      cmd.add(fileOf(m).absolutePath)
                  }
                  cmd.addAll(tierFlags(p, tier))
                  if (hasFlag("--vae-tiling")) cmd.add("--vae-tiling")
                  if (hasFlag("--threads")) { cmd.add("--threads"); cmd.add(r.threads.toString()) }
                  if (hasFlag("--seed")) { cmd.add("--seed"); cmd.add(r.seed.toString()) }
                  if ((r.fa || tier == 2) && p.kind == "gpu") {
                      if (helpText.contains("--flash-attn")) { cmd.add("--flash-attn"); cmd.add("auto,diffusion=on") }
                      else if (helpText.contains("--diffusion-fa")) cmd.add("--diffusion-fa")
                  }
                  if (memCapGb > 0 && p.kind == "gpu" && helpText.contains("--max-vram")) {
                      cmd.add("--max-vram"); cmd.add(memCapGb.toString())
                      log("Memory cap: --max-vram " + memCapGb + " (weights are staged in segments from disk; slower, much lower RAM)")
                  }
                  if (useCache && r.steps >= 10) {
                      cmd.add("--cache-mode"); cmd.add("easycache")
                      cmd.add("--cache-option"); cmd.add("threshold=0.2")
                  }
                  cmd.addAll(listOf("-p", r.prompt, "-W", r.size.toString(), "-H", r.size.toString(),
                      "--steps", r.steps.toString(), "--cfg-scale", r.cfg.toString(), "-o", out.absolutePath, "-v"))
                  log("RUN: " + cmd.joinToString(" "))

                  val t0 = System.currentTimeMillis()
                  val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                  pb.environment()["LD_LIBRARY_PATH"] = libEnv
                  val pr = pb.start()
                  proc = pr
                  enginePid = pidOf(pr)
                  if (rootActive && enginePid > 0) rootPin(enginePid)
                  try {
                      pumpLines(pr.inputStream) { ln -> onEngineLine(ln) }
                  } catch (e: java.io.IOException) {
                      if (!cancel) logW("Engine output stream closed: $e")
                  }
                  val code = pr.waitFor()
                  val secs = (System.currentTimeMillis() - t0) / 1000
                  val peak = rssPeak
                  enginePid = -1
                  failStage = stage
                  log("exit=" + code + " | " + secs + " s | engine peak RSS " + peak + " MB | free RAM " + availMemMb() + " MB")

                  if (cancel) {
                      attempts.add(Attempt(lbl, code, secs, peak, "stopped by you"))
                      logW("Stopped.")
                      return 2
                  }
                  val sig = signalOf(code)
                  if (code != 0 || !out.exists()) {
                      val d = diagnose(code, p, peak)
                      diagText = d
                      val firstLine = d.substringBefore('\n').removePrefix("Cause: ")
                      attempts.add(Attempt(lbl, code, secs, peak, firstLine))
                      logE(d.replace('\n', ' '))
                      if (sig == 9 && tier > 0) logW("Out of memory at " + tierNames[tier] + ". Falling back to Balanced.")
                      return if (sig == 9) 3 else 1
                  }
                  val bmp = BitmapFactory.decodeFile(out.absolutePath)
                  if (bmp == null) {
                      diagText = "Cause: the engine wrote an unreadable image.\nFix: tap Share report."
                      attempts.add(Attempt(lbl, code, secs, peak, "unreadable image"))
                      logE("Engine wrote an unreadable image.")
                      return 1
                  }
                  if (looksBlank(bmp)) {
                      diagText = "Cause: the image is blank/flat, so this mode did not really work.\nFix: try Engine = CPU or more steps."
                      attempts.add(Attempt(lbl, code, secs, peak, "blank image"))
                      logE("The image is blank/flat, so this mode did not really work.")
                      return 1
                  }
                  var note = "ok"
                  if (p.kind == "gpu" && !sawOcl) {
                      note = "ok, but no OpenCL device was reported: it probably ran on CPU"
                      logW("GPU mode was requested but the engine never reported an OpenCL device. It likely fell back to CPU.")
                  }
                  attempts.add(Attempt(lbl, code, secs, peak, note))
                  doneInfo = r.size.toString() + "\u00D7" + r.size + " \u00B7 " + r.steps + " steps \u00B7 cfg " + r.cfg + " \u00B7 seed " + r.seed +
                      " \u00B7 " + p.kind.uppercase(Locale.ROOT) + " \u00B7 " + fmtDur(secs)
                  stage = 5
                  ui.post { showImage(bmp) }
                  saveToGallery(out)
                  return 0
              }

              private fun looksBlank(b: Bitmap): Boolean {
                  val stepX = maxOf(1, b.width / 32)
                  val stepY = maxOf(1, b.height / 32)
                  var sum = 0.0
                  var sq = 0.0
                  var n = 0
                  var y = 0
                  while (y < b.height) {
                      var x = 0
                      while (x < b.width) {
                          val px = b.getPixel(x, y)
                          val l = (((px shr 16) and 0xff) + ((px shr 8) and 0xff) + (px and 0xff)) / 3.0
                          sum += l
                          sq += l * l
                          n++
                          x += stepX
                      }
                      y += stepY
                  }
                  if (n == 0) return true
                  val mean = sum / n
                  return (sq / n - mean * mean) < 9.0
              }

              private fun showImage(bmp: Bitmap) {
                  img.setImageBitmap(bmp)
                  resultInfo.text = doneInfo
                  cResult.root.visibility = View.VISIBLE
                  scrollRoot.post { scrollRoot.smoothScrollTo(0, cResult.root.top - dp(8)) }
              }

              private fun saveToGallery(f: File) {
                  try {
                      val name = "mossmini_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".png"
                      val v = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/MossMini")
                      }
                      val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return
                      contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { i -> i.copyTo(o) } }
                      log("Saved to Pictures/MossMini/" + name)
                  } catch (e: Exception) {
                      logW("Gallery save failed: $e")
                  }
              }

