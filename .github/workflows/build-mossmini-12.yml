                      val d = t.filter { c -> c.isDigit() }
                      if (d.isNotEmpty()) return d.toInt().coerceIn(0, 100)
                  } catch (e: Exception) { }
                  try {
                      val p = File("/sys/class/kgsl/kgsl-3d0/gpubusy").readText().trim().split(' ').filter { x -> x.isNotEmpty() }
                      if (p.size >= 2) {
                          val tt = p[1].toLong()
                          if (tt > 0) return (p[0].toLong() * 100 / tt).toInt().coerceIn(0, 100)
                      }
                  } catch (e: Exception) { }
                  return -1
              }

