                  val ci = Card(this, "Engines in this build")
                  val sb = StringBuilder()
                  sb.append("stable-diffusion.cpp ").append(mf.sdCommit.take(10)).append('\n')
                  sb.append("llama.cpp ").append(if (mf.llamaAvail) mf.llamaCommit.take(10) else "not in this build").append('\n')
                  if (mf.llamaInfo.isNotEmpty()) sb.append(mf.llamaInfo).append('\n')
                  sb.append("image CI proof: ").append(mf.smokeInfo).append('\n')
                  sb.append("built ").append(mf.builtAt)
                  ci.put(tv(this, sb.toString(), 11f, Pal.sub, mono = true), 12)
                  content.put(ci.root, 22)
