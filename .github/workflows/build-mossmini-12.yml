          package com.mossmini.app

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          class MF(
              val id: String, val name: String, val url: String, val size: Long, val sha: String,
              val flag: String, val role: String, val repo: String
          )

          class Prof(val name: String, val kind: String, val flags: List<String>)

          class Pack(
              val id: String, val title: String, val kind: String, val desc: String,
              val quant: String, val gpu: String, val license: String, val tested: String,
              val steps: Int, val cfg: Double, val ramMb: Long, val measuredMb: Long,
              val vision: Boolean, val note: String,
              val files: List<MF>, val profiles: List<Prof>
          ) {
              val totalBytes: Long get() = files.sumOf { f -> f.size }
              val model: MF? get() = files.firstOrNull { f -> f.flag == "-m" }
              val mmproj: MF? get() = files.firstOrNull { f -> f.flag == "--mmproj" }
          }

          class CatManifest(
              val sdCommit: String, val llamaCommit: String, val builtAt: String, val runUrl: String,
              val smokeInfo: String, val smokePack: String, val defaultImage: String,
              val requiredFlags: List<String>, val provenFlags: List<String>,
              val llamaAvail: Boolean, val llamaInfo: String, val llamaFlags: List<String>,
              val packs: List<Pack>
          )

          object Catalog {
              @Volatile private var cached: CatManifest? = null

              private fun strs(a: JSONArray?): List<String> =
                  if (a == null) emptyList() else List(a.length()) { i -> a.getString(i) }

              fun get(ctx: Context): CatManifest {
                  val c = cached
                  if (c != null) return c
                  val txt = ctx.assets.open("manifest.json").bufferedReader().use { it.readText() }
                  val m = parse(txt)
                  cached = m
                  return m
              }

              private fun parse(txt: String): CatManifest {
                  val j = JSONObject(txt)
                  val ll = j.optJSONObject("llama")
                  val measuredPack = j.optString("smoke_pack")
                  val measured = j.optLong("peak_rss_mb", 0L)
                  val pa = j.getJSONArray("packs")
                  val packs = ArrayList<Pack>()
                  for (i in 0 until pa.length()) {
                      val o = pa.getJSONObject(i)
                      val fa = o.getJSONArray("files")
                      val files = List(fa.length()) { k ->
                          val f = fa.getJSONObject(k)
                          MF(f.getString("id"), f.getString("name"), f.getString("url"), f.getLong("size"),
                              f.getString("sha256"), f.getString("flag"), f.optString("role"), f.optString("repo"))
                      }
                      val pr = o.optJSONArray("profiles")
                      val profs = if (pr == null) emptyList() else List(pr.length()) { k ->
                          val p = pr.getJSONObject(k)
                          val nm = p.getString("name")
                          Prof(nm, p.optString("kind", if (nm.contains("GPU")) "gpu" else "cpu"), strs(p.getJSONArray("flags")))
                      }
                      val id = o.getString("id")
                      packs.add(Pack(
                          id, o.getString("title"), o.getString("kind"), o.optString("desc"),
                          o.optString("quant"), o.optString("gpu", "mixed"), o.optString("license"), o.optString("tested", "files"),
                          o.optInt("steps", 20), o.optDouble("cfg", 1.0), o.optLong("ram_mb", 0L),
                          if (id == measuredPack) measured else 0L,
                          o.optBoolean("vision", false), o.optString("note"), files, profs
                      ))
                  }
                  return CatManifest(
                      j.optString("sd_commit"), j.optString("llama_commit"), j.optString("built_at"), j.optString("run_url"),
                      j.optString("smoke"), measuredPack, j.optString("default_image", "moss_q2k"),
                      strs(j.optJSONArray("required_flags")), strs(j.optJSONArray("proven_flags")),
                      ll != null && ll.optBoolean("available", false), ll?.optString("info") ?: "",
                      strs(ll?.optJSONArray("proven_flags")), packs
                  )
              }

              fun byKind(ctx: Context, kind: String): List<Pack> = get(ctx).packs.filter { p -> p.kind == kind }

              fun selected(ctx: Context, kind: String): Pack? {
                  val list = byKind(ctx, kind)
                  if (list.isEmpty()) return null
                  val id = Store.prefs(ctx).getString("pack_$kind", "") ?: ""
                  return list.firstOrNull { p -> p.id == id }
                      ?: list.firstOrNull { p -> p.id == get(ctx).defaultImage }
                      ?: list[0]
              }

              fun select(ctx: Context, p: Pack) {
                  Store.prefs(ctx).edit().putString("pack_" + p.kind, p.id).apply()
              }
          }

          object Store {
              fun prefs(ctx: Context): SharedPreferences = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
              fun dir(ctx: Context): File = File(ctx.filesDir, "models").apply { mkdirs() }
              fun file(ctx: Context, m: MF): File = File(dir(ctx), m.name)
              fun part(ctx: Context, m: MF): File = File(dir(ctx), m.name + ".part")
              fun stamp(m: MF, f: File): String = f.length().toString() + ":" + f.lastModified() + ":" + m.sha

              fun verified(ctx: Context, m: MF): Boolean {
                  val f = file(ctx, m)
                  return f.exists() && f.length() == m.size && prefs(ctx).getString("v_" + m.id, "") == stamp(m, f)
              }

              fun markVerified(ctx: Context, m: MF) {
                  prefs(ctx).edit().putString("v_" + m.id, stamp(m, file(ctx, m))).apply()
              }

              fun unmark(ctx: Context, m: MF) { prefs(ctx).edit().remove("v_" + m.id).apply() }

              fun installed(ctx: Context, p: Pack): Boolean = p.files.all { m -> verified(ctx, m) }

              fun haveCount(ctx: Context, p: Pack): Int = p.files.count { m -> verified(ctx, m) }

              /** bytes already on disk for this pack (finished files + partial downloads) */
              fun onDiskBytes(ctx: Context, p: Pack): Long {
                  var t = 0L
                  for (m in p.files) {
                      val f = file(ctx, m)
                      t += if (f.exists()) f.length() else maxOf(0L, part(ctx, m).let { x -> if (x.exists()) x.length() else 0L })
                  }
                  return t
              }

              fun usedBytes(ctx: Context): Long {
                  var t = 0L
                  val l = dir(ctx).listFiles() ?: return 0L
                  for (f in l) t += f.length()
                  return t
              }

              /** Deletes the pack's files, except files another fully installed pack still needs. */
              fun deletePack(ctx: Context, p: Pack, all: List<Pack>): Int {
                  val keep = HashSet<String>()
                  for (o in all) {
                      if (o.id != p.id && installed(ctx, o)) for (f in o.files) keep.add(f.id)
                  }
                  var n = 0
                  for (m in p.files) {
                      if (keep.contains(m.id)) continue
                      file(ctx, m).delete()
                      part(ctx, m).delete()
                      unmark(ctx, m)
                      Dl.forget(m.id)
                      n++
                  }
                  return n
              }
          }
