          /**
           * Process-wide download queue. It lives outside any Activity and runs inside WorkService
           * (a foreground service), so downloads continue when you leave the app or lock the screen.
           */
          object Dl {
              class FS {
                  @Volatile var frac = 0f
                  @Volatile var text = ""
                  @Volatile var level = 2
              }

              private val states = ConcurrentHashMap<String, FS>()
              private val lock = Any()
              private val queue = ArrayList<MF>()
              private val session = LinkedHashMap<String, MF>()
              private var worker: Thread? = null

              @Volatile var active = false
              @Volatile var info = ""
              @Volatile var rate = 0.0
              @Volatile var cancelled = false
              @Volatile var listener: (() -> Unit)? = null
              @Volatile var logger: ((Int, String) -> Unit)? = null

              fun st(id: String): FS = states.getOrPut(id) { FS() }
              fun forget(id: String) { states.remove(id) }

              private fun set(id: String, frac: Float, text: String, level: Int) {
                  val s = st(id)
                  s.frac = frac
                  s.text = text
                  s.level = level
              }

              private fun log(l: Int, s: String) {
                  try { logger?.invoke(l, s) } catch (e: Exception) { }
              }

              fun overall(): Float {
                  var tot = 0.0
                  var done = 0.0
                  synchronized(lock) {
                      for (m in session.values) { tot += m.size; done += m.size * st(m.id).frac }
                  }
                  return if (tot <= 0.0) 0f else (done / tot).toFloat()
              }

              fun remaining(): Long {
                  var r = 0L
                  synchronized(lock) {
                      for (m in session.values) r += ((1f - st(m.id).frac) * m.size).toLong()
                  }
                  return r
              }

              fun cancelAll() { cancelled = true }

              fun start(ctx: Context, list: List<MF>) {
                  val app = ctx.applicationContext
                  var spawn = false
                  synchronized(lock) {
                      if (!active) { session.clear(); cancelled = false }
                      for (m in list) {
                          if (!session.containsKey(m.id)) session[m.id] = m
                          if (queue.none { q -> q.id == m.id }) queue.add(m)
                      }
                      if (!active) { active = true; spawn = true }
                  }
                  if (!spawn) return
                  info = "starting\u2026"
                  rate = 0.0
                  WorkService.begin(app, "Downloading models")
                  val t = Thread { work(app) }
                  worker = t
                  t.start()
              }

              private fun work(ctx: Context) {
                  try {
                      while (true) {
                          val m: MF? = synchronized(lock) {
                              if (queue.isEmpty() || cancelled) {
                                  queue.clear()
                                  if (worker === Thread.currentThread()) active = false
                                  null
                              } else queue.removeAt(0)
                          }
                          if (m == null) break
                          try {
                              doFile(ctx, m)
                          } catch (e: Exception) {
                              if (!cancelled) {
                                  log(3, m.name + ": " + e)
                                  set(m.id, st(m.id).frac, "failed \u00B7 tap to resume", 2)
                              }
                          }
                      }
                  } finally {
                      synchronized(lock) {
                          queue.clear()
                          if (worker === Thread.currentThread()) active = false
                      }
                      if (cancelled) log(2, "Download stopped. Progress is kept; start again to resume.")
                      else log(1, "Download + verify step finished.")
                      info = ""
                      WorkService.end(ctx)
                      val l = listener
                      if (l != null) { try { l() } catch (e: Exception) { } }
                  }
              }

              private fun doFile(ctx: Context, m: MF) {
                  val f = Store.file(ctx, m)
                  if (Store.verified(ctx, m)) {
                      set(m.id, 1f, "verified", 0)
                      log(1, m.name + ": already verified")
                      return
                  }
                  if (!(f.exists() && f.length() == m.size)) {
                      var ok = false
                      for (attempt in 1..4) {
                          if (cancelled) return
                          try {
                              fetch(ctx, m)
                              ok = true
                              break
                          } catch (e: Exception) {
                              if (cancelled) return
                              log(2, m.name + " attempt " + attempt + " failed: " + e)
                              set(m.id, st(m.id).frac, "retry " + attempt + "/4: " + (e.message ?: "error"), 2)
                              try { Thread.sleep(2000L * attempt) } catch (ie: InterruptedException) { }
                          }
                      }
                      if (!ok) {
                          log(3, m.name + ": download did not finish. Start again to resume.")
                          set(m.id, st(m.id).frac, "failed \u00B7 tap to resume", 2)
                          return
                      }
                  }
                  if (f.length() != m.size) {
                      log(3, m.name + ": wrong size, deleted.")
                      f.delete()
                      set(m.id, 0f, "wrong size, deleted", 2)
                      return
                  }
                  val h = sha256(f, m)
                  if (cancelled) return
                  if (h == m.sha) {
                      Store.markVerified(ctx, m)
                      set(m.id, 1f, "verified", 0)
                      log(1, m.name + ": SHA-256 OK")
                  } else {
                      log(3, m.name + ": SHA-256 MISMATCH. Expected " + m.sha.take(12) + ", got " + h.take(12) + ". File deleted (corrupt, or changed upstream after this app was built).")
