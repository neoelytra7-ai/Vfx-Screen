                      for (ln in r.second.split('\n')) { val t = ln.trim(); if (t.isNotEmpty()) log("root: $t") }
                  } else {
                      try {
                          val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val keep = keepList(ctx).split(' ').toSet()
                          var n = 0
                          for (a in ctx.packageManager.getInstalledApplications(0)) {
                              if (keep.contains(a.packageName)) continue
                              if (a.packageName.startsWith("com.android.") || a.packageName.startsWith("android")) continue
                              am.killBackgroundProcesses(a.packageName)
                              n++
                          }
                          log("Asked Android to drop background processes of $n apps (no root: cannot touch foreground ones).")
                      } catch (e: Exception) { log("Free RAM failed: $e") }
                  }
                  try { Thread.sleep(1200) } catch (e: InterruptedException) { }
                  log("Free RAM now: $before \u2192 " + Sys.availMemMb() + " MB")
              }
          }
