              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Pal.bg
                  window.navigationBarColor = Pal.bg
                  try {
                      loadManifest()
                      appVer = packageManager.getPackageInfo(packageName, 0).versionName ?: ""
                  } catch (e: Exception) {
                      val t = TextView(this)
                      t.text = "manifest.json is missing or broken in this build: " + e
                      t.setTextColor(Pal.text)
                      t.setBackgroundColor(Pal.bg)
                      t.setPadding(dp(20), dp(60), dp(20), dp(20))
                      setContentView(t)
                      return
                  }
                  ignoreRamNow = prefs.getBoolean("ign_ram", false)
                  rootMode = if (prefs.contains("root_mode")) prefs.getInt("root_mode", 0) else if (prefs.getBoolean("root_boost", false)) 1 else 0
                  rootBoost = rootMode > 0
                  Dl.logger = { l, s -> addLog(l, 0, s) }
                  Dl.listener = { thread { preflight() } }
                  buildUi()
                  log("MossMini " + appVer + " | " + Build.MODEL + " | " + soc() + " | Android " + Build.VERSION.SDK_INT)
                  log("Log file: " + File(getExternalFilesDir(null) ?: filesDir, "last_run.log").absolutePath)
                  ui.post(tick)
                  if (prefs.getBoolean("root_dirty", false)) {
                      thread { try { rootPost() } catch (e: Exception) { } }
                  }
                  thread { preflight() }
              }

              private fun lpTop(top: Int): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(top) }

              private fun buildUi() {
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT
                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.setPadding(dp(14), dp(14), dp(14), dp(40))
                  scrollRoot = ScrollView(this)
                  scrollRoot.setBackgroundColor(Pal.bg)
                  scrollRoot.fitsSystemWindows = true
                  scrollRoot.addView(content, ViewGroup.LayoutParams(mp, wc))

                  // ---------- header
                  val head = LinearLayout(this)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  val title = tv(this, "MossMini", 30f, Pal.text)
                  title.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  head.addView(title, LinearLayout.LayoutParams(0, wc, 1f))
                  head.addView(chip(this, "v$appVer", Pal.sub))
                  content.addView(head)
                  val sub = tv(this, pack.title + " \u00B7 on-device \u00B7 GPU first, CPU fallback", 12.5f, Pal.sub)
                  content.put(sub, 4)
                  val meta = LinearLayout(this)
                  meta.orientation = LinearLayout.HORIZONTAL
                  meta.addView(chip(this, "sd.cpp " + sdCommit.take(7), Pal.info))
                  meta.addView(chip(this, pack.quant, Pal.warn),
                      LinearLayout.LayoutParams(wc, wc).apply { leftMargin = dp(8) })
