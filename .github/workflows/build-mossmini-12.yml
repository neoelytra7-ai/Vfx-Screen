              private fun sha256(f: File, m: MF): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  val total = f.length()
                  var done = 0L
                  var lastUi = 0L
                  var lastT = System.currentTimeMillis()
                  f.inputStream().use { inp ->
                      val buf = ByteArray(1 shl 20)
                      while (true) {
                          if (cancelled) return ""
                          val n = inp.read(buf)
                          if (n < 0) break
                          md.update(buf, 0, n)
                          done += n
                          if (done - lastUi > (8L shl 20)) {
                              val now = System.currentTimeMillis()
                              val r = (done - lastUi) / 1048576.0 / maxOf(0.001, (now - lastT) / 1000.0)
                              lastUi = done
                              lastT = now
                              val p = done.toFloat() / total
                              set(m.id, 0.85f + 0.15f * p, "verifying " + (p * 100).toInt() + "%", 1)
                              info = String.format(Locale.US, "Verifying %s \u00B7 %.0f MB/s", m.name, r)
                          }
                      }
                  }
                  return md.digest().joinToString("") { b -> String.format("%02x", b) }
              }

              private fun fetch(ctx: Context, m: MF) {
                  val dest = Store.file(ctx, m)
                  val part = Store.part(ctx, m)
                  val expected = m.size
                  if (part.exists() && part.length() > expected) part.delete()
                  val have = if (part.exists()) part.length() else 0L
                  val c = URL(m.url).openConnection() as HttpURLConnection
                  c.connectTimeout = 30000
                  c.readTimeout = 60000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "MossMini/2.0")
                  if (have > 0) c.setRequestProperty("Range", "bytes=$have-")
                  val code = c.responseCode
                  if (code == 416) { dest.delete(); part.renameTo(dest); return }
                  if (code !in 200..299) throw RuntimeException("HTTP $code")
                  val append = code == 206
                  val free = StatFs(Store.dir(ctx).path).availableBytes
                  val need = expected - (if (append) have else 0L)
                  if (need > free - (200L shl 20)) throw RuntimeException("Not enough storage: need " + (need shr 20) + " MB, free " + (free shr 20) + " MB")
                  log(1, "Downloading " + dest.name + " (" + Sys.fmtSize(expected) + ")" + (if (append) " \u00B7 resuming at " + Sys.fmtSize(have) else ""))
