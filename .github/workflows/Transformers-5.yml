            float anchor(float t) {
              float h2 = H / 2;
              if (t < LA) return h2;
              if (t < LE) { float p = (t - LA) / (LE - LA); return lerp(h2, -95 * k, p * p * p); }
              if (t < DS) return -95 * k;
              float p = cl((t - DS) / (DE - DS));
              float e = p < .5f ? 4 * p * p * p : 1 - (float) Math.pow(-2 * p + 2, 3) / 2;
              return lerp(-95 * k, H + 90 * k, e);
            }

            void setProp(Node n, int pr, float d) {
              switch (pr) {
                case 0: n.px = n.bx + d; break; case 1: n.py = n.by + d; break; case 2: n.pz = n.bz + d; break;
                case 3: n.rx = n.brx + d; break; case 4: n.ry = n.bry + d; break; default: n.rz = n.brz + d;
              }
            }

            static final float[][] CK = {
              {0,0,0,0,700,1.0f,0}, {500,0,0,0,640,1.03f,0}, {1300,-0.45f,0.10f,0,420,1.08f,0},
              {2300,0.40f,0.16f,0.02f,380,1.10f,-6}, {3300,-0.40f,-0.12f,-0.03f,340,1.14f,0},
              {4300,0.30f,-0.08f,0.03f,360,1.18f,8}, {5250,0,-0.14f,0,290,1.30f,18},
              {5900,-0.2f,-0.04f,0,420,1.15f,6}, {6500,0,0,0,700,1.0f,0},
              {7500,0.05f,0,0.06f,700,1.0f,0}, {8600,-0.05f,0,-0.05f,700,1.0f,0}, {9800,0,0,0,700,1.0f,0}
            };
            float camZoom = 1;
            static float cr(float a, float b, float c, float d, float u) {
              return 0.5f * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);
            }
            void camera() {
              int i = 0;
              while (i < CK.length - 2 && t >= CK[i + 1][0]) i++;
              float[] p0 = CK[Math.max(i - 1, 0)], p1 = CK[i], p2 = CK[i + 1], p3 = CK[Math.min(i + 2, CK.length - 1)];
              float u = cl((t - p1[0]) / (p2[0] - p1[0]));
              float yaw = cr(p0[1], p1[1], p2[1], p3[1], u), pit = cr(p0[2], p1[2], p2[2], p3[2], u), rol = cr(p0[3], p1[3], p2[3], p3[3], u);
              camF = Math.max(280f, cr(p0[4], p1[4], p2[4], p3[4], u));
              camZoom = cr(p0[5], p1[5], p2[5], p3[5], u); camPan = cr(p0[6], p1[6], p2[6], p3[6], u);
              yawC = (float) Math.cos(yaw); yawS = (float) Math.sin(yaw);
              pitC = (float) Math.cos(pit); pitS = (float) Math.sin(pit);
              rolC = (float) Math.cos(rol); rolS = (float) Math.sin(rol);
            }
            void cam3(float vx, float vy, float vz) {
              vy -= camPan;
              float x1 = vx * rolC - vy * rolS, y1 = vx * rolS + vy * rolC;
              float x2 = x1 * yawC + vz * yawS, z1 = -x1 * yawS + vz * yawC;
              c3[0] = x2; c3[1] = y1 * pitC - z1 * pitS; c3[2] = y1 * pitS + z1 * pitC;
            }

            // waktu: slow-motion di momen penting
            static final float[][] SLOW = {{E1 - 40, E1 + 40, 0.2f}, {CR, CR + 500, 0.8f}, {LA - 250, LA + 450, 0.5f}};
            static float extra(float t) {
              float e = 0;
              for (float[] s : SLOW) e += (1 / s[2] - 1) * Math.max(0, Math.min(t, s[1]) - s[0]);
              return e;
            }
            static float realOf(float t) { return t + extra(t); }
            static float animOf(float r) {
              float t = r;
              for (int i = 0; i < 16; i++) t = Math.max(0, r - extra(t));
              return t;
            }

            void pose(float dt) {
              float ms = dt * 1000f;
              for (Node n : all) {
                n.px = n.bx; n.py = n.by; n.pz = n.bz; n.rx = n.brx; n.ry = n.bry; n.rz = n.brz;
                n.sx = n.bsx; n.sy = n.bsy; n.sz = n.bsz;
              }
              for (Chan c : chs) {
                float v = lerp(c.a, c.b, ease(c.mode, (t - c.ts) / c.dur));
                if (c.snap) { float q = t - c.ts - c.dur; if (q > 0) v += (c.b - c.a) * 0.06f * (float) (Math.exp(-q / 120) * Math.sin(q * 0.05)); }
                setProp(c.n, c.pr, v);
              }

              float rdy = sm((t - RDY) / 400f);
              float crouch = sm((t - CR) / 500f) * (1 - sm((t - LA) / 140f));
              float fly = sm((t - LA) / 400f) * (1 - sm((t - DS) / 500f));
              float thrv = sm((t - CR) / 500f) * (1 - sm((t - LE) / 300f));
              float unf = sm((t - U) / 400f) * (1 - sm((t - 5000) / 500f));
              float flex = sm((t - 5500) / 300f) * (1 - sm((t - 6000) / 300f));

              float drv = -accW;
              sHx.step(dt, drv * 0.05f); sTor.step(dt, drv * 0.02f); sRoll.step(dt, 0);
              sHz.step(dt, 0); sAnt[0].step(dt, drv * 0.03f); sAnt[1].step(dt, drv * 0.03f);
              for (int i = 0; i < 2; i++) { sArm[i].step(dt, -drv * 0.03f); sEl[i].step(dt, drv * 0.04f); sWg[i].step(dt, drv * 0.02f); }

              rs = lerp(1f, 1.25f, sm((t - U) / 3200f));
              root.sx = root.sy = root.sz = rs;
              float sway = 0.03f * (float) Math.sin(t * 0.0021f) * rdy;
              root.py = awy; root.rz = sRoll.x + 0.02f * (float) Math.sin(t * 0.004f) * rdy;
              pelvis.rz += sway; torso.rz -= sway * 1.4f;
              torso.rx += 0.3f * crouch + sTor.x + 0.012f * (float) Math.sin(t * 0.006f) * rdy;
              torso.sy *= 1 + 0.012f * (float) Math.sin(t * 0.006f) * rdy + 0.03f * flex;
              head.rx += sHx.x - 0.25f * crouch;
              head.rz += sHz.x + sway * 0.6f + 0.08f * (float) Math.sin(t * 0.003f) * rdy;
              head.ry += 0.22f * (float) Math.sin(t * 0.0017f + 1) * rdy * (1 - fly);
              for (int i = 0; i < 2; i++) {
                int s = i == 0 ? -1 : 1;
                hip[i].rx += -0.9f * crouch; knee[i].rx += 1.5f * crouch; ankle[i].rx += -0.6f * crouch;
                hip[i].rz += s * (0.08f * flex + 0.06f * fly);
                toe[i].rx += 0.6f * fly;
                sj[i].rz += s * (sArm[i].x - 0.5f * crouch + 0.12f * flex * (float) Math.sin((t - 5500) * 0.012f));
                elb[i].rx += -sEl[i].x - 0.9f * crouch - 0.7f * flex;
                wg[i].rz += s * sWg[i].x * 0.6f;
                ant[i].rz += s * (0.15f + 0.12f * (float) Math.sin(t * 0.009f + i * 1.3f)) * rdy + sAnt[i].x * s;
                noz[i].sy = 1 + 1.2f * thrv;
                rod[i].py += 4 * crouch - knee[i].rx * 1.2f;
                for (int j = 0; j < 3; j++) vent[i][j].rx += 0.35f * (float) Math.sin(t * 0.01f + j * 1.3f + i) * rdy;
                for (int j = 0; j < 5; j++) f1[i][j].rx += -0.3f * (float) Math.pow(Math.max(0, Math.sin(t * 0.004f + j * 1.7f + i)), 8) * rdy;
              }
              for (int i = 0; i < 8; i++) {
                if (gears[i] == null) continue;
                gA[i] += ms * (0.0025f + 0.012f * unf) * (i >= 4 ? 1.3f : 1f);
                gears[i].rz = gdir[i] * gA[i];
              }
              float ig = sm((t - E1) / 150f);
              float blinkPh = (t * 0.001f) % 2.3f;
              float bl = (t > E1 + 300 && blinkPh < 0.12f) ? 0.12f + 0.88f * Math.abs(blinkPh / 0.06f - 1f) : 1f;
              eyeL.sy = eyeR.sy = Math.max(0.08f, bl) * ig + 0.001f;
              int ec = mix(0xFF29B6F6, 0xFFB3E5FC, 0.5f + 0.5f * (float) Math.sin(t * 0.012f) + 0.5f * fly);
              eyeL.col = eyeR.col = ec;
              for (Node n : strips) n.sy = 0.001f + ig * (0.8f + 0.2f * (float) Math.sin(t * 0.008f + n.bx));

              for (int i = 0; i < all.size(); i++) {
                Node n = all.get(i);
                if (n.plate || n.m == null) { n.as = 1; continue; }
                n.as = bk((t - (n.asT + 500)) / 420f);
              }
              for (int i = 0; i < 7; i++) {
                float p = cl((t - T0 - PDL[i]) / PD);
                Node n = pl[i]; n.e = bk(p); n.pr = p;
                n.col = mix(RED, PC[i], p);
              }
            }

            /** kaki selalu menapak lantai selama belum terbang. */
            void ground() {
              floorY = awy - 55 * rs;
              float w = 1 - sm((t - LA) / 200f);
              if (w <= 0) return;
              float minY = 1e9f;
              for (int i = 0; i < 2; i++) {
                float[][] pts = {{-5.5f,-5,-5.4f},{5.5f,-5,-5.4f},{-5.5f,-5,8.4f},{5.5f,-5,8.4f}};
                for (float[] q : pts) { Node n = foot[i]; float y = n.A[3]*q[0] + n.A[4]*q[1] + n.A[5]*q[2] + n.T[1]; minY = Math.min(minY, y); }
                float[][] tp = {{-5,-2,6.8f},{5,-2,6.8f}};
                for (float[] q : tp) { Node n = toe[i]; float y = n.A[3]*q[0] + n.A[4]*q[1] + n.A[5]*q[2] + n.T[1]; minY = Math.min(minY, y); }
              }
              float dy = (floorY - minY) * w;
              for (Node n : all) n.T[1] += dy;
            }

            float[] sp(Node n, float x, float y, float z) {
              float wx = n.A[0]*x + n.A[1]*y + n.A[2]*z + n.T[0];
              float wy = n.A[3]*x + n.A[4]*y + n.A[5]*z + n.T[1];
              float wz = n.A[6]*x + n.A[7]*y + n.A[8]*z + n.T[2];
              cam3(wx, wy, wz);
              float per = camF / (camF - c3[2]);
              sp2[0] = W / 2 + shx + c3[0] * per * kz; sp2[1] = H / 2 + shy - c3[1] * per * kz; return sp2;
            }

            // ------------------------------------------------------------ render buffers
            static final int MAXF = 4200;
            final int[] fN = new int[MAXF], fI = new int[MAXF], fC = new int[MAXF];
            final boolean[] fS = new boolean[MAXF];
            final long[] keys = new long[MAXF];
            int nf;

            void update(float tt, int w, int h) {
              float dt = Math.max(0, Math.min(40, tt - lt)); lt = tt;
              t = tt; W = w; H = h; k = Math.min(w, h) * 0.0059f;
              camera();
              kz = k * camZoom;
              shk *= (float) Math.pow(0.9, dt / 16f);
              if (t < T0) shk = Math.max(shk, 0.5f);
              shx = (rnd.nextFloat() - 0.5f) * shk * k; shy = (rnd.nextFloat() - 0.5f) * shk * k;
              float Yn = anchor(t); velY = dt > 0 ? (Yn - Y) / dt : 0; Y = Yn;
              awy = (H / 2 - Y) / k;
              float vw = dt > 0 ? (awy - lastAwy) / dt : 0;
              accW = dt > 0 ? Math.max(-4000f, Math.min(4000f, (vw - lastVW) / dt * 1e6f)) : 0;
              lastAwy = awy; lastVW = vw;
              pose(dt / 1000f);
              for (Node n : all) n.upd();
              ground();
              collect();
              sp(wr[0], 0, -3, 0); float g1 = sp2[1]; sp(wr[1], 0, -3, 0); float g2 = sp2[1];
              gripY = (g1 + g2) / 2;
              events(dt);
              stepSparks(dt);
            }

            void collect() {
              nf = 0;
              float sweep = ((t * 0.0006f) % 1f) * 3.6f - 1.8f;
              float il = (float) (1 / Math.sqrt(LX*LX + LY*LY + LZ*LZ));
              for (int ni = 0; ni < all.size(); ni++) {
                Node n = all.get(ni);
                Mesh m = n.m;
                if (m == null) continue;
                if (n.as < 0.03f) continue;
                float[] v = m.v, wv = n.wv, sv = n.sv; int nv = v.length / 3;
                float e = n.e, roll = 0, lift = 0, ccx = 0, ccy = 0, cr = 1, sr = 0, as = n.as, oa = 1 - n.as;
                if (n.plate) {
                  float p = n.pr; float ph = (float) Math.sin(Math.PI * p);
                  roll = ((n.pi & 1) == 0 ? 1 : -1) * 1.4f * ph; lift = 45 * ph;
                  ccx = lerp(n.cex, n.T[0], e); ccy = lerp(n.cey + awy, n.T[1], e);
                  cr = (float) Math.cos(roll); sr = (float) Math.sin(roll);
                }
                float[] A = n.A, T = n.T;
                for (int i = 0; i < nv; i++) {
                  float x = v[3*i], y = v[3*i+1], z = v[3*i+2], vx, vy, vz;
                  if (n.plate) {
                    float ex = x + n.cex, ey = y + n.cey + awy, ez = z;
                    float ax = A[0]*x + A[1]*y + A[2]*z + T[0], ay = A[3]*x + A[4]*y + A[5]*z + T[1], az = A[6]*x + A[7]*y + A[8]*z + T[2];
                    vx = lerp(ex, ax, e); vy = lerp(ey, ay, e); vz = lerp(ez, az, e);
                    float dx = vx - ccx, dy = vy - ccy;
                    vx = ccx + dx * cr - dy * sr; vy = ccy + dx * sr + dy * cr; vz += lift;
                  } else {
                    x *= as; y *= as; z *= as;
                    vx = A[0]*x + A[1]*y + A[2]*z + T[0] + n.ox * oa; vy = A[3]*x + A[4]*y + A[5]*z + T[1] + n.oy * oa; vz = A[6]*x + A[7]*y + A[8]*z + T[2] + n.oz * oa;
                  }
                  cam3(vx, vy, vz);
                  wv[3*i] = c3[0]; wv[3*i+1] = c3[1]; wv[3*i+2] = c3[2];
                  float per = camF / (camF - c3[2]);
                  sv[2*i] = W / 2 + shx + c3[0] * per * kz; sv[2*i+1] = H / 2 + shy - c3[1] * per * kz;
                }
                for (int fi = 0; fi < m.f.length && nf < MAXF; fi++) {
                  int[] q = m.f[fi];
                  float[] nn = newell(wv, q);
                  float len = (float) Math.sqrt(nn[0]*nn[0] + nn[1]*nn[1] + nn[2]*nn[2]);
                  if (len < 1e-6f) continue;
                  nn[0] /= len; nn[1] /= len; nn[2] /= len;
                  float fx = 0, fy = 0, fz = 0, ar = 0;
                  for (int i : q) { fx += wv[3*i]; fy += wv[3*i+1]; fz += wv[3*i+2]; }
                  fx /= q.length; fy /= q.length; fz /= q.length;
                  for (int j = 0; j < q.length; j++) {
                    int a = q[j], b = q[(j + 1) % q.length];
                    ar += sv[2*a] * sv[2*b+1] - sv[2*b] * sv[2*a+1];
                  }
                  if (Math.abs(ar) < 5f) continue;
                  float vx = -fx, vy = -fy, vz = camF - fz;
                  float vl = (float) Math.sqrt(vx*vx + vy*vy + vz*vz); vx /= vl; vy /= vl; vz /= vl;
                  float ndv = nn[0]*vx + nn[1]*vy + nn[2]*vz;
                  if (ndv <= 0) continue;
                  int c;
                  if (m.emi) c = n.col;
                  else {
                    float diff = Math.max(0, (nn[0]*LX + nn[1]*LY + nn[2]*LZ) * il);
                    float hx = LX*il + vx, hy = LY*il + vy, hz = LZ*il + vz;
                    float hl = (float) Math.sqrt(hx*hx + hy*hy + hz*hz);
                    float nh = Math.max(0, (nn[0]*hx + nn[1]*hy + nn[2]*hz) / hl);
                    float spec = (float) Math.pow(nh, 40) * (0.25f + m.met);
                    float rx = 2*ndv*nn[0] - vx, ry = 2*ndv*nn[1] - vy;
                    float hz2 = sm((ry + 0.08f) / 0.16f);
                    float env = lerp(0.1f + 0.1f * (ry + 1), 0.55f + 0.45f * Math.min(1f, ry * 1.2f), hz2) + 0.5f * (float) Math.exp(-ry * ry * 80);
                    env += 0.9f * (float) Math.exp(-((rx + 0.55f) * (rx + 0.55f) * 6 + (ry - 0.45f) * (ry - 0.45f) * 10));
                    env += 0.5f * (float) Math.exp(-((rx - 0.7f) * (rx - 0.7f) * 8 + (ry - 0.1f) * (ry - 0.1f) * 18));
                    float bd = (rx * 0.9f + ry * 0.6f - sweep) * 5;
                    env += 0.9f * (float) Math.exp(-bd * bd);
                    float refl = env * m.met;
                    float rim = (float) Math.pow(1 - ndv, 3) * 0.3f;
                    int bc = n.col;
                    float fl = 0.93f + 0.14f * (((ni * 131 + fi * 17) & 15) / 15f);
                    float lum = ((0.2f + 0.8f * diff) * (1 - 0.4f * m.met) + 0.1f * Math.max(0, -nn[1])) * fl;
                    float br = (bc >> 16) & 255, bg = (bc >> 8) & 255, bb = bc & 255;
                    float r = br * lum + (0.4f * br + 70) * refl * 0.8f + spec * 210 + rim * 30;
                    float g = bg * lum + (0.4f * bg + 80) * refl * 0.8f + spec * 210 + rim * 50;
                    float b = bb * lum + (0.4f * bb + 95) * refl * 0.8f + spec * 210 + rim * 110;
                    c = 0xFF000000 | ((int) Math.min(255, r) << 16) | ((int) Math.min(255, g) << 8) | (int) Math.min(255, b);
                  }
                  fN[nf] = ni; fI[nf] = fi; fC[nf] = c; fS[nf] = !m.gear && !m.emi && q.length > 3;
                  float z = fz + (n.plate ? 1.5f : 0);
                  int bits = Float.floatToIntBits(z); bits ^= (bits >> 31) & 0x7fffffff;
                  keys[nf] = ((long) bits << 32) | nf;
                  nf++;
                }
              }
              Arrays.sort(keys, 0, nf);
            }

            // ------------------------------------------------------------ partikel
            static final int NS = 360;
            final float[] spx = new float[NS], spy = new float[NS], svx = new float[NS], svy = new float[NS];
            final float[] sl = new float[NS], sml = new float[NS], ssz = new float[NS];
            final int[] scol = new int[NS], sty = new int[NS];
            int sc; final Random rnd = new Random(7);

            void emit(float x, float y, int n, float spd, float size, int col, float life, float ang, float spread, int type) {
              for (int i = 0; i < n; i++) {
                int j = sc; sc = (sc + 1) % NS;
                float a = ang + (rnd.nextFloat() - 0.5f) * spread;
                float s = spd * (0.35f + rnd.nextFloat()) * k / 6f;
                spx[j] = x; spy[j] = y; svx[j] = (float) Math.cos(a) * s; svy[j] = (float) Math.sin(a) * s;
                sl[j] = sml[j] = life * (0.6f + 0.6f * rnd.nextFloat()); ssz[j] = size * (0.5f + rnd.nextFloat()) * k / 6f; scol[j] = col; sty[j] = type;
              }
            }
            void spark(float x, float y, int n, float spd, float size, int col, float life, float ang, float spread) { emit(x, y, n, spd, size, col, life, ang, spread, 0); }
            void puff(float x, float y, int n, float size) { emit(x, y, n, 0.18f, size, 0xFFDCE6F0, 900, -1.57f, 1.2f, 1); }

            void stepSparks(float dt) {
              for (int i = 0; i < NS; i++) {
                if (sl[i] <= 0) continue;
                sl[i] -= dt; spx[i] += svx[i] * dt; spy[i] += svy[i] * dt;
                if (sty[i] == 0) { svy[i] += 0.0012f * dt * k / 6f; svx[i] *= 0.995f; } else { svx[i] *= 0.99f; svy[i] *= 0.99f; }
              }
            }

            void lock(Node n, float amt) {
              sp(n, 0, 0, 0);
              spark(sp2[0], sp2[1], 14, 1.3f, 2f, 0xFFFFD27A, 420, 0, 6.28f);
              puff(sp2[0], sp2[1], 2, 5f);
              shk = Math.max(shk, amt); tick++;
              sHx.v += (rnd.nextFloat() - .5f) * 5; sHz.v += (rnd.nextFloat() - .5f) * 5; sTor.v += (rnd.nextFloat() - .5f) * 3;
              sAnt[0].v += (rnd.nextFloat() - .5f) * 16; sAnt[1].v += (rnd.nextFloat() - .5f) * 16;
              sArm[0].v += (rnd.nextFloat() - .5f) * 4; sArm[1].v += (rnd.nextFloat() - .5f) * 4;
            }

            void events(float dt) {
              if (t < T0 + 300 && rnd.nextFloat() < 0.5f) {
                float ang = rnd.nextFloat() * 6.28f, rr = k * 70;
                float ex = W / 2 + (float) Math.cos(ang) * rr, ey = H / 2 + (float) Math.sin(ang) * rr;
                spark(ex, ey, 1, 0.9f, 1.6f, 0xFFFFC27A, 380, ang + 3.14159f, 0.1f);
              }
              for (int i = 0; i < 7; i++) {
                if (!hit[i] && pl[i].pr >= 1) {
                  hit[i] = true; tick++; shk = Math.max(shk, 2.2f);
                  float sx = 0, sy = 0; int nv = pl[i].sv.length / 2;
                  for (int j = 0; j < nv; j++) { sx += pl[i].sv[2*j]; sy += pl[i].sv[2*j+1]; }
                  spark(sx / nv, sy / nv, 26, 1.6f, 2.2f, 0xFFFFD27A, 520, 0, 6.28f);
                  spark(sx / nv, sy / nv, 8, 0.6f, 4f, 0xFFFFFFFF, 260, 0, 6.28f);
                }
              }
              for (Chan c : chs) {
                if (c.snap && !c.fired && t >= c.ts + c.dur) { c.fired = true; if (t < CR) lock(c.n, 1.6f); }
              }
              if (t > RDY && t < CR && rnd.nextFloat() < 0.1f) {
                Node g = gears[2 + rnd.nextInt(6)]; sp(g, 0, 0, 1);
                spark(sp2[0], sp2[1], 2, 0.5f, 1.6f, 0xFFFFE08A, 300, -1.57f, 2.5f);
              }
              if (t > RDY && t < RDY + 700 && rnd.nextFloat() < 0.18f) { sp(stack[rnd.nextInt(2)], 0, 23, 0); puff(sp2[0], sp2[1], 1, 5f); }
              if (t >= LA && !launched) {
