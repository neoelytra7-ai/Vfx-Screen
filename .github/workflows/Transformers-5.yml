            Node plate(int i, Node par, float x, float y, float z, float sx, float sy) {
              float[] q = P[i]; int n = q.length / 2; float cx = 0, cy = 0;
              for (int j = 0; j < n; j++) { cx += q[2*j]; cy += q[2*j+1]; }
              cx /= n; cy /= n;
              float[] xy = new float[n * 2];
              for (int j = 0; j < n; j++) { xy[2*j] = q[2*j] - cx; xy[2*j+1] = -(q[2*j+1] - cy); }
              Node nd = N(par, prism(xy, 1.4f, RED, 0.85f), x, y, z);
              nd.bsx = nd.sx = sx; nd.bsy = nd.sy = sy; nd.plate = true; nd.pi = i; nd.cex = cx - 54; nd.cey = -(cy - 54);
              return nd;
            }

