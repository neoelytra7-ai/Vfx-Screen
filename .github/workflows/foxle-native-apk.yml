          // ---------- input ----------
          struct Touch { bool down = false, moved = false, pinch = false; float x0 = 0, y0 = 0, lx = 0, ly = 0, pd = 1, ps = 1, tapx = 0, tapy = 0; double t0 = 0, lastTap = 0, st[8] = {0}; float sp[8] = {0}; int ns = 0; } T;
