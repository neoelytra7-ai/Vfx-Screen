                T.lastTap = 0; if (A.vscale > 1.05f) { A.vscale = 1; A.vox = A.voy = 0; } else { A.vscale = 2.5f; A.vox = (A.sw / 2.f - x) * 1.5f; A.voy = (A.sh / 2.f - y) * 1.5f; clampPan(); }
              } else { T.lastTap = t; T.tapx = x; T.tapy = y; }
              return;
            }
            if (A.vmode == 2) return;
            if (y < L.hdr) {
              float bx, by, bs; btnRect(0, bx, by, bs);
              if (inBox(x, y, bx, by, bs)) {  // keluar: harus 2x tap
                double n = nowS(); if (A.exitArmed && n - A.exitT < 1.8) ANativeActivity_finish(A.a->activity); else { A.exitArmed = true; A.exitT = n; toast("Tap X sekali lagi untuk keluar"); } return;
              }
              btnRect(1, bx, by, bs); if (inBox(x, y, bx, by, bs)) { A.grid = !A.grid; A.sc.pos = 0; A.sc.vel = 0; } return;
            }
