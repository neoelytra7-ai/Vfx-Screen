          cat > tests/run_tests.py <<'FOXLE_EOF_11'
          #!/usr/bin/env python3
          """Uji engine: akurasi DC-only vs jpeglib (Pillow draft 1/8), jalur fallback, tier EXIF, pack cache, benchmark.
          Pakai: python3 tests/run_tests.py /path/ke/fxcli"""
          import io, os, struct, subprocess, sys, time
          import numpy as np
          from PIL import Image
          CLI = sys.argv[1] if len(sys.argv) > 1 else "/tmp/fxcli"
          D = "/tmp/fx_samples"; os.makedirs(D, exist_ok=True)
          rng = np.random.default_rng(7)

          def photo(w, h):
              g = rng.random((h // 64 + 2, w // 64 + 2, 3)).astype(np.float32)
              big = np.array(Image.fromarray((g * 255).astype(np.uint8)).resize((w, h), Image.BICUBIC)).astype(np.float32)
              yy, xx = np.mgrid[0:h, 0:w]
              tex = 18 * np.sin(xx / 5.0)[..., None] * np.cos(yy / 7.0)[..., None] + rng.normal(0, 5, (h, w, 3))
              return Image.fromarray(np.clip(big + tex, 0, 255).astype(np.uint8))

          def exif_with_thumb(img, orient=6):
              t = io.BytesIO(); img.resize((160, 120)).save(t, "JPEG", quality=85); tb = t.getvalue()
              tiff = b"II*\x00" + struct.pack("<I", 8)
              tiff += struct.pack("<H", 1) + struct.pack("<HHII", 0x0112, 3, 1, orient) + struct.pack("<I", 26)
              tiff += struct.pack("<H", 2) + struct.pack("<HHII", 0x0201, 4, 1, 56) + struct.pack("<HHII", 0x0202, 4, 1, len(tb)) + struct.pack("<I", 0)
              assert len(tiff) == 56
              return b"Exif\x00\x00" + tiff + tb, tb

          def run(*a):
              p = subprocess.run([CLI, *map(str, a)], capture_output=True, text=True); return p.returncode, p.stdout.strip()

          W, H = 4000, 3000
          base = photo(W, H)
          S = {}
          S["420"] = ("photo_420.jpg", dict(quality=90, subsampling=2))
          S["444"] = ("photo_444.jpg", dict(quality=90, subsampling=0))
          S["422"] = ("photo_422.jpg", dict(quality=90, subsampling=1))
          S["gray"] = ("photo_gray.jpg", dict(quality=90))
          S["odd"] = ("photo_odd.jpg", dict(quality=85, subsampling=2))
          for k, (f, kw) in S.items():
              im = base.convert("L") if k == "gray" else base.crop((0, 0, 3999, 2999)) if k == "odd" else base
              im.save(f"{D}/{f}", "JPEG", **kw)
          try:
              base.save(f"{D}/photo_rst.jpg", "JPEG", quality=90, subsampling=2, restart_marker_rows=2); S["rst"] = ("photo_rst.jpg", {})
          except Exception as e:
              print("  (restart marker tidak didukung Pillow ini, dilewati:", e, ")")
          base.save(f"{D}/photo_prog.jpg", "JPEG", quality=90, progressive=True)
          base.resize((800, 600)).save(f"{D}/small.jpg", "JPEG", quality=90)
          base.resize((800, 600)).save(f"{D}/pic.png")
          ex, tb = exif_with_thumb(base); base.save(f"{D}/photo_exif.jpg", "JPEG", quality=90, exif=ex)
          open(f"{D}/thumb_expected.jpg", "wb").write(tb)

          ok = True
          def check(name, cond, info=""):
              global ok; ok &= bool(cond); print(("PASS " if cond else "FAIL ") + name + ("  " + info if info else ""))

          print("== 1. Akurasi DC-only vs jpeglib scale 1/8 (Pillow draft) ==")
          for k, (f, _) in S.items():
              rc, out = run("dc", f"{D}/{f}", "/tmp/dc.rgba")
              ow, oh = map(int, [out.split("ow=")[1].split()[0], out.split("oh=")[1].split()[0]])
              mine = np.fromfile("/tmp/dc.rgba", np.uint8).reshape(oh, ow, 4)[..., :3].astype(int)
              im = Image.open(f"{D}/{f}"); full = im.convert("RGB"); W0, H0 = full.size
              im = Image.open(f"{D}/{f}"); im.draft("RGB", (W0 // 8, H0 // 8)); ref = np.array(im.convert("RGB")).astype(int)
              gt = np.array(full.reduce(8)).astype(int)
              if ref.shape[:2] != mine.shape[:2]: check(f"dc {k}", False, f"ukuran beda {ref.shape} vs {mine.shape}"); continue
              d = np.abs(ref - mine); h2 = min(gt.shape[0], mine.shape[0]); w2 = min(gt.shape[1], mine.shape[1])
              e_me = np.abs(gt[:h2, :w2] - mine[:h2, :w2]).mean(); e_lj = np.abs(gt[:h2, :w2] - ref[:h2, :w2]).mean()
              check(f"dc {k:5s} {ow}x{oh}", d.mean() < 1.5 or e_me <= e_lj * 1.25, f"vs jpeglib: mean={d.mean():.3f} max={d.max()} | error vs kebenaran: engine={e_me:.2f} jpeglib={e_lj:.2f}")

          print("== 2. Jalur fallback & tier ==")
          rc, out = run("dc", f"{D}/photo_prog.jpg", "/tmp/x"); check("progressive -> FALLBACK", rc == 1, out)
          rc, out = run("thumb", f"{D}/small.jpg", 128, "/tmp/x"); check("jpeg kecil -> FALLBACK", rc == 1, out)
          rc, out = run("thumb", f"{D}/pic.png", 128, "/tmp/x"); check("png -> FALLBACK ke decoder platform", rc == 1, out)
          rc, out = run("thumb", f"{D}/photo_420.jpg", 128, "/tmp/t.rgba"); check("tier2 (tanpa EXIF)", rc == 0 and "tier=2" in out, out)
          rc, out = run("thumb", f"{D}/photo_exif.jpg", 128, "/tmp/t.jpg")
          check("tier1 EXIF", rc == 0 and "tier=1" in out and "orient=6" in out, out)
          check("tier1 byte identik dgn thumbnail tertanam", open("/tmp/t.jpg", "rb").read() == tb)
          rc, out = run("thumb", f"{D}/photo_exif.jpg", 256, "/tmp/t2.rgba"); check("target 256 > thumb 160 -> naik ke tier2", rc == 0 and "tier=2" in out, out)
          rc, out = run("pack", "/tmp/t.pack"); check("pack cache roundtrip + reopen", rc == 0, out)

          import zipfile
          zp = f"{D}/t.zip"
          with zipfile.ZipFile(zp, "w") as z:
              z.writestr("a.txt", "hello" * 100, zipfile.ZIP_DEFLATED); z.writestr("dir/b.bin", os.urandom(5000), zipfile.ZIP_STORED); z.writestr("uni_\u00e9.txt", "x", zipfile.ZIP_DEFLATED)
          ref = [f"{i.file_size} {i.compress_size} {8 if i.compress_type == 8 else 0} {i.filename}" for i in zipfile.ZipFile(zp).infolist()]
          got = subprocess.run([CLI, "zip", zp], capture_output=True, text=True).stdout.strip().split("\n")
          check("zip index == zipfile (nama, ukuran, kompresi)", got == ref, f"{len(got)} entri")
          print("== 3. Benchmark (1 core x86 sandbox, 4000x3000, target 128; angka ARM beda) ==")
          for f in ["photo_420.jpg", "photo_exif.jpg"]:
              sz = os.path.getsize(f"{D}/{f}") / 1e6; print(f"-- {f} ({sz:.1f} MB)"); print(run("bench", f"{D}/{f}", 128, 30)[1])
          im_path = f"{D}/photo_420.jpg"; n = 30; t0 = time.perf_counter()
          for _ in range(n):
              im = Image.open(im_path); im.draft("RGB", (500, 375)); im.load()
          pil = (time.perf_counter() - t0) * 1000 / n
          print(f"Pillow draft 1/8 (libjpeg-turbo, referensi): {pil:.3f} ms/img")
          print("\nHASIL:", "SEMUA LULUS" if ok else "ADA YANG GAGAL"); sys.exit(0 if ok else 1)
          FOXLE_EOF_11
      - name: Uji engine di host (akurasi, fallback, EXIF, ZIP, cache, benchmark)
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --quiet pillow numpy
          g++ -std=c++17 -O3 -Iinclude -Iengine engine/engine.cpp engine/jpeg_dc.cpp engine/exif_thumb.cpp engine/zip_index.cpp tools/fxcli.cpp -o fxcli -pthread
          python3 tests/run_tests.py ./fxcli
      - name: Build libfoxle.so (NDK, arm64-v8a)
        run: |
          set -euo pipefail
          echo "NDK=$ANDROID_NDK_HOME"
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -l build/libfoxle.so
      - name: Paketkan APK (aapt2, zipalign, apksigner)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          echo "build-tools=$BT platform=$PLAT"
          "$BT/aapt2" link -o base.apk -I "$PLAT/android.jar" --manifest AndroidManifest.xml \
            --min-sdk-version 30 --target-sdk-version 34 --version-code 1 --version-name 1.0
          mkdir -p apk/lib/arm64-v8a && cp build/libfoxle.so apk/lib/arm64-v8a/
          (cd apk && zip -qr ../base.apk lib)
          "$BT/zipalign" -f -p 4 base.apk aligned.apk
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias foxle \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Foxle,O=Foxle,C=ID"
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out Foxle-native.apk aligned.apk
          "$BT/apksigner" verify --verbose Foxle-native.apk
          ls -l Foxle-native.apk
      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Foxle-native-apk
          path: Foxle-native.apk
