# Foxle Native — APK full-native (NativeActivity + EGL/GLES2 + Foxle Engine). Tanpa Java, tanpa WebView.
# Seluruh sumber ditulis lewat heredoc di langkah pertama; tidak butuh file lain di repo.
name: Foxle Native APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tulis seluruh proyek (heredoc)
        run: |
          set -euo pipefail
          mkdir -p app engine include tools tests
          cat > AndroidManifest.xml <<'FOXLE_EOF_0'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.foxle.native">
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
            <application android:label="Foxle" android:hasCode="false" android:extractNativeLibs="true" android:allowBackup="false" android:hardwareAccelerated="true">
              <activity android:name="android.app.NativeActivity" android:label="Foxle" android:exported="true" android:launchMode="singleTask"
                  android:configChanges="orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|uiMode|density|navigation"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <meta-data android:name="android.app.lib_name" android:value="foxle"/>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          FOXLE_EOF_0
          cat > CMakeLists.txt <<'FOXLE_EOF_1'
          cmake_minimum_required(VERSION 3.18)
          project(foxle C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(GLUE ${ANDROID_NDK}/sources/android/native_app_glue)
          add_library(foxle SHARED app/app.cpp engine/engine.cpp engine/jpeg_dc.cpp engine/exif_thumb.cpp engine/zip_index.cpp engine/android_fallback.cpp ${GLUE}/android_native_app_glue.c)
          target_include_directories(foxle PRIVATE ${GLUE} include engine)
          target_compile_options(foxle PRIVATE -O3 -Wall -Wno-unused-parameter -Wno-misleading-indentation)
          set_target_properties(foxle PROPERTIES LINK_FLAGS "-u ANativeActivity_onCreate -Wl,--gc-sections -Wl,-z,max-page-size=16384")
          target_link_libraries(foxle android log EGL GLESv2 jnigraphics)
          FOXLE_EOF_1
          cat > include/foxle_engine.h <<'FOXLE_EOF_2'
          /* Foxle Engine — C ABI. Sama untuk NativeActivity, JNI tipis, atau WASM. Core tanpa dependensi Android. */
          #ifndef FOXLE_ENGINE_H
          #define FOXLE_ENGINE_H
          #include <stddef.h>
          #include <stdint.h>
          #define FX_API __attribute__((visibility("default")))
          #ifdef __cplusplus
          extern "C" {
          #endif
          enum { FX_OK = 0, FX_FALLBACK = 1, FX_ERR = -1 };
          enum { FX_FMT_JPEG = 1, FX_FMT_RGBA8888 = 2 };
          typedef struct { int fmt, w, h, orient, tier; uint8_t *data; size_t len; } fx_thumb; /* data: malloc, bebaskan fx_thumb_free */
          /* Thumbnail bertingkat: tier1 = JPEG thumbnail di dalam EXIF (baca <=64KB, tanpa decode),
             tier2 = decode DC-only 1/8 (tanpa IDCT/dequant AC), selain itu FX_FALLBACK (host pakai decoder platform). */
          FX_API int  fx_thumb_make(const char *path, int target, fx_thumb *out);
          FX_API void fx_thumb_free(fx_thumb *t);
          /* Cache thumbnail on-disk append-only, indeks di memori. */
          typedef struct fx_pack fx_pack;
          FX_API fx_pack *fx_pack_open(const char *path);
          FX_API void     fx_pack_close(fx_pack *p);
          FX_API int      fx_pack_get(fx_pack *p, uint64_t key, fx_thumb *out);
          FX_API int      fx_pack_put(fx_pack *p, uint64_t key, const fx_thumb *t);
          FX_API uint64_t fx_key(const char *path, uint64_t size, uint64_t mtime_ns);
          /* ZIP: baca central directory dari ujung file (tanpa ekstrak/inflate). cb dipanggil per entri; return jumlah entri atau -1. */
          typedef void (*fx_zip_cb)(const char *name, size_t nlen, uint64_t usize, uint64_t csize, int method, void *ud);
          FX_API int fx_zip_list(const char *path, fx_zip_cb cb, void *ud);
          /* Khusus Android: decoder platform (AImageDecoder, API 30+) untuk PNG/WebP/HEIC/AVIF/JPEG progresif/JPEG kecil. */
          #ifdef __ANDROID__
          FX_API int fx_thumb_fallback(const char *path, int target, fx_thumb *out);
          #endif
          #ifdef __cplusplus
          }
          #endif
          #endif
          FOXLE_EOF_2
          cat > engine/engine.cpp <<'FOXLE_EOF_3'
          #include "foxle_engine.h"
          #include "jpeg_dc.h"
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <algorithm>
          #include <cstdlib>
          #include <cstring>
          #include <mutex>
          #include <unordered_map>

          namespace {
          struct Buf {  // buffer per-thread dipakai ulang: tanpa malloc/memset di jalur panas
            uint8_t *p = nullptr; size_t cap = 0;
            uint8_t *reserve(size_t n) { if (n > cap) { p = (uint8_t *)realloc(p, cap = n + (n >> 3)); } return p; }
            ~Buf() { free(p); }
          };
          bool pread_full(int fd, uint8_t *b, size_t n, off_t off) {
            size_t g = 0;
            while (g < n) { ssize_t r = pread(fd, b + g, n - g, off + (off_t)g); if (r <= 0) return false; g += (size_t)r; }
            return true;
          }
          }  // namespace

          extern "C" int fx_thumb_make(const char *path, int target, fx_thumb *o) {
            memset(o, 0, sizeof *o);
            int fd = open(path, O_RDONLY | O_CLOEXEC);
            if (fd < 0) return FX_ERR;
            struct stat st;
            if (fstat(fd, &st) || st.st_size < 4) { close(fd); return FX_ERR; }
            size_t fs = (size_t)st.st_size;
            static thread_local Buf buf;
            size_t head = std::min<size_t>(fs, 65536 + 32);
            uint8_t *b = buf.reserve(head);
            int rc = FX_FALLBACK;
            if (!pread_full(fd, b, head, 0)) { close(fd); return FX_ERR; }
            if (b[0] != 0xFF || b[1] != 0xD8) { close(fd); return FX_FALLBACK; }  // bukan JPEG: serahkan ke decoder platform
            ExifInfo ex; exif_parse(b, head, ex); o->orient = ex.orient;
            if (ex.thumb) {  // TIER 1: thumbnail bawaan kamera, nol decode
              int tw = 0, th = 0; bool base = false;
              if (jpeg_probe(ex.thumb, ex.thumb_len, &tw, &th, &base) == JDC_OK && std::min(tw, th) * 5 >= target * 4) {
                o->data = (uint8_t *)malloc(ex.thumb_len); memcpy(o->data, ex.thumb, ex.thumb_len);
                o->len = ex.thumb_len; o->fmt = FX_FMT_JPEG; o->w = tw; o->h = th; o->tier = 1; close(fd); return FX_OK;
              }
            }
            if (fs > ((size_t)256 << 20)) { close(fd); return FX_FALLBACK; }
            if (fs > head) {  // baca sisa file sekali, berurutan
              b = buf.reserve(fs);
              if (!pread_full(fd, b + head, fs - head, (off_t)head)) { close(fd); return FX_ERR; }
            }
            close(fd);
            int W = 0, H = 0; bool base = false;
            if (jpeg_probe(b, fs, &W, &H, &base) != JDC_OK) return FX_ERR;
            o->w = W; o->h = H;
            int ow = (W + 7) / 8, oh = (H + 7) / 8;
            if (!base || std::min(ow, oh) * 4 < target * 3) return FX_FALLBACK;  // terlalu kecil/progresif: butuh decoder skala lain
            JdcImage img;
            JdcStatus s = jpeg_dc_decode(b, fs, img);
            if (s == JDC_FALLBACK) return FX_FALLBACK;
            if (s != JDC_OK) return FX_ERR;
            o->data = (uint8_t *)malloc((size_t)target * target * 4);
            rgba_cover(img.rgba.data(), img.ow, img.oh, target, o->data);
            o->len = (size_t)target * target * 4; o->fmt = FX_FMT_RGBA8888; o->w = target; o->h = target; o->tier = 2;
            rc = FX_OK;
            return rc;
          }
          extern "C" void fx_thumb_free(fx_thumb *t) { if (t) { free(t->data); t->data = nullptr; t->len = 0; } }

          extern "C" uint64_t fx_key(const char *path, uint64_t size, uint64_t mtime_ns) {
            uint64_t h = 1469598103934665603ull;
            for (const char *p = path; *p; p++) { h ^= (uint8_t)*p; h *= 1099511628211ull; }
            for (int i = 0; i < 8; i++) { h ^= (size >> (8 * i)) & 255; h *= 1099511628211ull; }
            for (int i = 0; i < 8; i++) { h ^= (mtime_ns >> (8 * i)) & 255; h *= 1099511628211ull; }
            return h;
          }

          // ---- pack: log append-only. Rekaman: key(8) len(4) w(2) h(2) fmt(1) orient(1) rsv(2) payload ----
          struct PackEnt { uint64_t off; uint32_t len; uint16_t w, h; uint8_t fmt, orient; };
          struct fx_pack { int fd = -1; std::mutex mu; std::unordered_map<uint64_t, PackEnt> idx; uint64_t end = 16; };
          static const char PMAGIC[9] = "FXTP0001";

          extern "C" fx_pack *fx_pack_open(const char *path) {
            int fd = open(path, O_RDWR | O_CREAT | O_CLOEXEC, 0600);
            if (fd < 0) return nullptr;
            struct stat st; if (fstat(fd, &st)) { close(fd); return nullptr; }
            fx_pack *p = new fx_pack; p->fd = fd;
            uint8_t hdr[16]; bool ok = st.st_size >= 16 && pread_full(fd, hdr, 16, 0) && !memcmp(hdr, PMAGIC, 8);
            if (!ok) { if (ftruncate(fd, 0)) {} memset(hdr, 0, 16); memcpy(hdr, PMAGIC, 8); if (pwrite(fd, hdr, 16, 0) != 16) { close(fd); delete p; return nullptr; } return p; }
            uint64_t off = 16, size = (uint64_t)st.st_size;
            while (off + 20 <= size) {
              uint8_t h[20]; if (!pread_full(fd, h, 20, (off_t)off)) break;
              PackEnt e; uint64_t key; memcpy(&key, h, 8); memcpy(&e.len, h + 8, 4); memcpy(&e.w, h + 12, 2); memcpy(&e.h, h + 14, 2); e.fmt = h[16]; e.orient = h[17]; e.off = off;
              if (off + 20 + e.len > size) break;  // ekor rusak (crash saat menulis): dipotong
              p->idx[key] = e; off += 20 + e.len;
            }
            if (off < size && ftruncate(fd, (off_t)off)) {}
            p->end = off; return p;
          }
          extern "C" void fx_pack_close(fx_pack *p) { if (p) { if (p->fd >= 0) close(p->fd); delete p; } }
          extern "C" int fx_pack_get(fx_pack *p, uint64_t key, fx_thumb *o) {
            memset(o, 0, sizeof *o); PackEnt e;
            { std::lock_guard<std::mutex> g(p->mu); auto it = p->idx.find(key); if (it == p->idx.end()) return FX_FALLBACK; e = it->second; }
            o->data = (uint8_t *)malloc(e.len ? e.len : 1);
            if (!pread_full(p->fd, o->data, e.len, (off_t)(e.off + 20))) { free(o->data); o->data = nullptr; return FX_ERR; }
            o->len = e.len; o->w = e.w; o->h = e.h; o->fmt = e.fmt; o->orient = e.orient; return FX_OK;
          }
          extern "C" int fx_pack_put(fx_pack *p, uint64_t key, const fx_thumb *t) {
            size_t n = 20 + t->len; uint8_t *b = (uint8_t *)malloc(n);
            uint32_t len = (uint32_t)t->len; uint16_t w = (uint16_t)t->w, h = (uint16_t)t->h; memset(b, 0, 20);
            memcpy(b, &key, 8); memcpy(b + 8, &len, 4); memcpy(b + 12, &w, 2); memcpy(b + 14, &h, 2); b[16] = (uint8_t)t->fmt; b[17] = (uint8_t)t->orient; memcpy(b + 20, t->data, t->len);
            std::lock_guard<std::mutex> g(p->mu);
            size_t done = 0;
            while (done < n) { ssize_t r = pwrite(p->fd, b + done, n - done, (off_t)(p->end + done)); if (r <= 0) { free(b); return FX_ERR; } done += (size_t)r; }
            PackEnt e{p->end, len, w, h, (uint8_t)t->fmt, (uint8_t)t->orient}; p->idx[key] = e; p->end += n; free(b); return FX_OK;
          }
          FOXLE_EOF_3
          cat > engine/jpeg_dc.cpp <<'FOXLE_EOF_4'
          // JPEG baseline "DC-only": hasil 1/8 ukuran asli tanpa dequant AC, tanpa IDCT, tanpa upsample penuh.
          // Simbol Huffman AC tetap dibaca (wajib untuk menggeser bitstream) tapi nilainya dibuang. Setara jpeglib scale 1/8.
          #include "jpeg_dc.h"
          #include <algorithm>
          #include <cstring>
          namespace {
          struct Huff { uint16_t ac[1024]; uint16_t look[512]; int32_t maxc[18], minc[18]; int vp[18]; uint8_t val[256]; bool ok = false; };
          struct Comp { int id = 0, h = 1, v = 1, tq = 0, td = 0, ta = 0, pw = 0, ph = 0, pred = 0, sw = 0, sh = 0; bool rf = false; std::vector<uint8_t> pl; };
          bool build(Huff &h, const uint8_t *cnt, const uint8_t *sym, int total) {
            memcpy(h.val, sym, total); memset(h.look, 0, sizeof h.look);
            int code = 0, k = 0;
            for (int l = 1; l <= 16; l++) {
              h.vp[l] = k; h.minc[l] = code;
              for (int j = 0; j < cnt[l - 1]; j++, k++, code++) {
                if (code >= (1 << l)) return false;
                if (l <= 9) { int base = code << (9 - l), n = 1 << (9 - l); for (int t = 0; t < n; t++) h.look[base + t] = (uint16_t)(l << 8 | h.val[k]); }
              }
              h.maxc[l] = cnt[l - 1] ? code - 1 : -1; code <<= 1;
            }
            memset(h.ac, 0, sizeof h.ac);  // tabel gabungan AC (10 bit): [0..3]=bit total, [4..8]=maju koefisien, [9]=EOB
            k = 0; code = 0;
            for (int l = 1; l <= 10; l++) {
              for (int j = 0; j < cnt[l - 1]; j++, k++, code++) {
                int rs = h.val[k], r = rs >> 4, sz = rs & 15, adv, eob = 0;
                if (!sz) { if (rs == 0) { adv = 0; eob = 1; } else if (r == 15) adv = 16; else continue; } else adv = r + 1;
                if (l + sz > 10) continue;
                uint16_t e = (uint16_t)((l + sz) | adv << 4 | eob << 9);
                int base = code << (10 - l), n2 = 1 << (10 - l);
                for (int t = 0; t < n2; t++) h.ac[base + t] = e;
              }
              code <<= 1;
            }
            h.ok = true; return true;
          }
          struct Br {
            const uint8_t *p, *e; uint64_t buf; int n; bool mk;
            void init(const uint8_t *a, const uint8_t *b) { p = a; e = b; buf = 0; n = 0; mk = false; }
            inline void fill() {
              if (p + 8 <= e && !mk) {  // jalur cepat: 8 byte sekaligus bila tak ada 0xFF (marker/stuffing)
                uint64_t w; memcpy(&w, p, 8); w = __builtin_bswap64(w);
                uint64_t t = ~w;
                if (!(((t - 0x0101010101010101ull) & ~t & 0x8080808080808080ull))) {
                  int k = (64 - n) >> 3;  // jumlah byte utuh yang muat
                  buf = (k == 8 ? 0 : buf << (8 * k)) | (w >> (64 - 8 * k)); p += k; n += 8 * k; return;
                }
              }
              while (n <= 56) {
                uint32_t b = 0;
                if (p < e && !mk) { b = *p; if (b == 0xFF) { if (p + 1 < e && p[1] == 0) p += 2; else { mk = true; b = 0; } } else p++; }
                buf = buf << 8 | b; n += 8;
              }
            }
            inline uint32_t get(int s) { if (n < s) fill(); n -= s; return (uint32_t)(buf >> n) & ((1u << s) - 1); }
            inline int dec(const Huff &h) {
              if (n < 16) fill();
              int e2 = h.look[(buf >> (n - 9)) & 511];
              if (e2) { n -= e2 >> 8; return e2 & 255; }
              for (int l = 10; l <= 16; l++) { int c = (int)((buf >> (n - l)) & ((1u << l) - 1)); if (h.maxc[l] >= 0 && c <= h.maxc[l]) { n -= l; return h.val[h.vp[l] + c - h.minc[l]]; } }
              n -= 16; return -1;
            }
            bool restart() {
              while (p + 1 < e) {
                if (p[0] == 0xFF) { uint8_t c = p[1]; if (c >= 0xD0 && c <= 0xD7) { p += 2; buf = 0; n = 0; mk = false; return true; } if (c == 0 || c == 0xFF) { p += (c == 0 ? 2 : 1); continue; } return false; }
                p++;
              }
              return false;
            }
          };
          }  // namespace

          JdcStatus jpeg_probe(const uint8_t *d, size_t n, int *w, int *h, bool *baseline) {
            if (n < 4 || d[0] != 0xFF || d[1] != 0xD8) return JDC_ERROR;
            size_t i = 2;
            while (i + 4 <= n) {
              if (d[i] != 0xFF) { i++; continue; }
              uint8_t m = d[i + 1];
              if (m == 0xFF) { i++; continue; }
              if (m == 0 || m == 1 || (m >= 0xD0 && m <= 0xD8)) { i += 2; continue; }
              if (m == 0xD9 || m == 0xDA) return JDC_ERROR;
              size_t len = (size_t)d[i + 2] << 8 | d[i + 3];
              if (len < 2 || i + 2 + len > n) return JDC_ERROR;
              if (m >= 0xC0 && m <= 0xCF && m != 0xC4 && m != 0xC8 && m != 0xCC) {
                if (len < 8) return JDC_ERROR;
                *h = d[i + 5] << 8 | d[i + 6]; *w = d[i + 7] << 8 | d[i + 8]; if (baseline) *baseline = (m == 0xC0 || m == 0xC1) && d[i + 4] == 8;
                return *w > 0 && *h > 0 ? JDC_OK : JDC_ERROR;
              }
              i += 2 + len;
            }
            return JDC_ERROR;
          }

          JdcStatus jpeg_dc_decode(const uint8_t *d, size_t n, JdcImage &o) {
            if (n < 4 || d[0] != 0xFF || d[1] != 0xD8) return JDC_ERROR;
            static thread_local Huff hd[4], ha[4];
            for (auto &x : hd) x.ok = false;
            for (auto &x : ha) x.ok = false;
            uint16_t qz[4][64] = {}; bool qok[4] = {false}; int W = 0, H = 0, nf = 0, ri = 0; Comp c[3]; bool sof = false; const uint8_t *scan = nullptr; int ns = 0;
            size_t i = 2;
            while (i + 4 <= n && !scan) {
              if (d[i] != 0xFF) { i++; continue; }
              uint8_t m = d[i + 1];
              if (m == 0xFF) { i++; continue; }
              if (m == 0 || m == 1 || (m >= 0xD0 && m <= 0xD8)) { i += 2; continue; }
              if (m == 0xD9) return JDC_ERROR;
              size_t len = (size_t)d[i + 2] << 8 | d[i + 3];
              if (len < 2 || i + 2 + len > n) return JDC_ERROR;
              const uint8_t *s = d + i + 4; size_t sl = len - 2;
              if (m == 0xDB) {
                while (sl > 0) { int pq = s[0] >> 4, tq = s[0] & 15; s++; sl--; size_t need = pq ? 128 : 64; if (tq > 3 || sl < need) return JDC_ERROR; for (int k = 0; k < 64; k++) qz[tq][k] = pq ? (uint16_t)(s[2 * k] << 8 | s[2 * k + 1]) : s[k]; qok[tq] = true; s += need; sl -= need; }
              } else if (m == 0xC4) {
                while (sl >= 17) { int tc = s[0] >> 4, th = s[0] & 15, tot = 0; for (int k = 1; k <= 16; k++) tot += s[k]; if (tot > 256 || sl < (size_t)17 + tot || th > 3 || tc > 1) return JDC_ERROR; if (!build(tc ? ha[th] : hd[th], s + 1, s + 17, tot)) return JDC_ERROR; s += 17 + tot; sl -= 17 + tot; }
              } else if (m == 0xC0 || m == 0xC1) {
                if (sl < 6 || s[0] != 8) return JDC_FALLBACK;
                H = s[1] << 8 | s[2]; W = s[3] << 8 | s[4]; nf = s[5];
                if (W <= 0 || H <= 0 || (nf != 1 && nf != 3) || sl < (size_t)6 + 3 * nf) return JDC_FALLBACK;
                for (int k = 0; k < nf; k++) { c[k].id = s[6 + 3 * k]; c[k].h = s[7 + 3 * k] >> 4; c[k].v = s[7 + 3 * k] & 15; c[k].tq = s[8 + 3 * k]; if (!c[k].h || !c[k].v || c[k].h > 4 || c[k].v > 4 || c[k].tq > 3) return JDC_ERROR; }
                sof = true;
              } else if ((m >= 0xC2 && m <= 0xCF) && m != 0xC4 && m != 0xC8 && m != 0xCC) {
                return JDC_FALLBACK;  // progressive / lossless / arithmetic
              } else if (m == 0xDD) {
                if (sl >= 2) ri = s[0] << 8 | s[1];
              } else if (m == 0xDA) {
                if (!sof || sl < 1) return JDC_ERROR;
                ns = s[0]; if (ns != nf || sl < (size_t)1 + 2 * ns + 3) return JDC_FALLBACK;  // scan non-interleaved => fallback
                for (int k = 0; k < ns; k++) { int cs = s[1 + 2 * k], tt = s[2 + 2 * k], j = -1; for (int t = 0; t < nf; t++) if (c[t].id == cs) j = t; if (j < 0) return JDC_ERROR; c[j].td = tt >> 4; c[j].ta = tt & 15; if (c[j].td > 3 || c[j].ta > 3) return JDC_ERROR; }
                scan = d + i + 2 + len;
              }
              i += 2 + len;
            }
            if (!scan) return JDC_ERROR;
            int hmax = 1, vmax = 1, mcux, mcuy;
            if (nf == 1) { mcux = (W + 7) / 8; mcuy = (H + 7) / 8; c[0].pw = mcux; c[0].ph = mcuy; }
            else {
              for (int k = 0; k < nf; k++) { hmax = std::max(hmax, c[k].h); vmax = std::max(vmax, c[k].v); }
              mcux = (W + 8 * hmax - 1) / (8 * hmax); mcuy = (H + 8 * vmax - 1) / (8 * vmax);
              for (int k = 0; k < nf; k++) { c[k].pw = mcux * c[k].h; c[k].ph = mcuy * c[k].v; }
            }
            for (int k = 0; k < nf; k++) {
              c[k].rf = nf == 3 && k > 0 && c[k].h * 2 == hmax && c[k].v * 2 == vmax;  // chroma 4:2:0 -> 2x2 sampel/blok
              c[k].sw = c[k].pw * (c[k].rf ? 2 : 1); c[k].sh = c[k].ph * (c[k].rf ? 2 : 1);
              if (!qok[c[k].tq] || !hd[c[k].td].ok || !ha[c[k].ta].ok) return JDC_ERROR;
