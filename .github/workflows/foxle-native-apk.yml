          #include "foxle_engine.h"
          #include "jpeg_dc.h"
          #include <dirent.h>
          #include <chrono>
          #include <cstdio>
          #include <cstring>
          #include <string>
          #include <vector>
          using Clk = std::chrono::steady_clock;
          static double ms(Clk::time_point a, Clk::time_point b) { return std::chrono::duration<double, std::milli>(b - a).count(); }
          static bool readf(const char *p, std::vector<uint8_t> &v) { FILE *f = fopen(p, "rb"); if (!f) return false; fseek(f, 0, SEEK_END); long n = ftell(f); fseek(f, 0, SEEK_SET); v.resize(n); bool ok = fread(v.data(), 1, n, f) == (size_t)n; fclose(f); return ok; }
          int main(int argc, char **argv) {
            if (argc >= 5 && !strcmp(argv[1], "thumb")) {
              fx_thumb t; int rc = fx_thumb_make(argv[2], atoi(argv[3]), &t);
              printf("rc=%d tier=%d fmt=%d w=%d h=%d orient=%d len=%zu\n", rc, t.tier, t.fmt, t.w, t.h, t.orient, t.len);
              if (rc == 0) { FILE *f = fopen(argv[4], "wb"); fwrite(t.data, 1, t.len, f); fclose(f); }
              fx_thumb_free(&t); return rc;
            }
            if (argc >= 4 && !strcmp(argv[1], "dc")) {
              std::vector<uint8_t> v; if (!readf(argv[2], v)) return 9; JdcImage im; JdcStatus s = jpeg_dc_decode(v.data(), v.size(), im);
              printf("status=%d ow=%d oh=%d\n", (int)s, im.ow, im.oh); if (s == JDC_OK) { FILE *f = fopen(argv[3], "wb"); fwrite(im.rgba.data(), 1, im.rgba.size(), f); fclose(f); } return (int)s;
            }
            if (argc >= 4 && !strcmp(argv[1], "bench")) {  // bench <file> <target> <iters>
              int target = atoi(argv[3]), it = argc > 4 ? atoi(argv[4]) : 20; std::vector<uint8_t> v; readf(argv[2], v);
              fx_thumb t; fx_thumb_make(argv[2], target, &t); int tier = t.tier; fx_thumb_free(&t);
              auto a = Clk::now(); for (int i = 0; i < it; i++) { fx_thumb_make(argv[2], target, &t); fx_thumb_free(&t); } auto b = Clk::now();
              printf("engine tier%d (open+read+decode+resize): %.3f ms/img\n", tier, ms(a, b) / it);
              JdcImage im; a = Clk::now(); for (int i = 0; i < it; i++) jpeg_dc_decode(v.data(), v.size(), im); b = Clk::now();
              printf("jpeg_dc_decode only (RAM): %.3f ms/img  (%.0f MB/s entropy data)\n", ms(a, b) / it, v.size() / 1048576.0 / (ms(a, b) / it / 1000));
              return 0;
            }
            if (argc >= 3 && !strcmp(argv[1], "pack")) {  // pack <file.pack>
              remove(argv[2]); fx_pack *p = fx_pack_open(argv[2]); uint8_t d[1000]; for (int i = 0; i < 1000; i++) d[i] = (uint8_t)(i * 7);
              for (uint64_t k = 1; k <= 2000; k++) { fx_thumb t{2, 160, 120, 6, 2, d, (size_t)(100 + k % 900)}; if (fx_pack_put(p, k, &t)) return 2; }
              fx_pack_close(p); p = fx_pack_open(argv[2]); int bad = 0;
              auto a = Clk::now();
              for (uint64_t k = 1; k <= 2000; k++) { fx_thumb g; if (fx_pack_get(p, k, &g) || g.len != 100 + k % 900 || g.w != 160 || g.orient != 6 || memcmp(g.data, d, g.len)) bad++; fx_thumb_free(&g); }
              auto b = Clk::now(); fx_thumb g; int miss = fx_pack_get(p, 99999, &g);
              printf("pack: 2000 records, reopen+index ok, bad=%d, miss_rc=%d, get=%.2f us/rec\n", bad, miss, ms(a, b) * 1000 / 2000);
              fx_pack_close(p); return bad || miss != FX_FALLBACK;
            }
            if (argc >= 3 && !strcmp(argv[1], "zip")) {
              int n = fx_zip_list(argv[2], [](const char *nm, size_t nl, uint64_t us, uint64_t cs, int m, void *) { printf("%llu %llu %d %.*s\n", (unsigned long long)us, (unsigned long long)cs, m, (int)nl, nm); }, nullptr);
              fprintf(stderr, "n=%d\n", n); return n < 0;
            }
            fprintf(stderr, "usage: fxcli thumb|dc|bench|pack ...\n"); return 1;
          }
