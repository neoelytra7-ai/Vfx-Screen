name: Build Foxle Hub APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: foxle-hub
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project (heredoc)
        run: |
          set -e
          D=hub
          mkdir -p $D/app/src/main/java/app/foxl $D/app/src/main/assets $D/app/src/main/res/drawable $D/app/src/main/res/xml

          cat > $D/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'FoxleHub'
          include ':app'
          EOF

          cat > $D/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $D/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          org.gradle.parallel=true
          org.gradle.caching=true
          android.nonTransitiveRClass=true
          android.useAndroidX=true
          android.enableR8.fullMode=true
          EOF

          cat > $D/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'app.foxl'
            compileSdk 34
            defaultConfig {
              applicationId 'app.foxl.hub'
              minSdk 24
              targetSdk 34
              versionCode 6
              versionName '3.0'
            }
            signingConfigs {
              r {
                storeFile file(System.getenv('KS') ?: 'ks.jks')
                storePassword System.getenv('KS_PASS') ?: 'foxlhub'
                keyAlias 'k'
                keyPassword System.getenv('KS_PASS') ?: 'foxlhub'
              }
            }
            buildTypes {
              release {
                minifyEnabled true
                shrinkResources true
                signingConfig signingConfigs.r
                proguardFiles 'p.pro'
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
            implementation 'androidx.core:core:1.13.1'
            implementation 'org.brotli:dec:0.1.2'
          }
          EOF

          cat > $D/app/p.pro <<'EOF'
          -keep class app.foxl.** { *; }
          -keepattributes *Annotation*
          -dontwarn **
          -keep class org.brotli.** { *; }
          EOF

          cat > $D/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <uses-feature android:name="android.hardware.microphone" android:required="false"/>
            <uses-feature android:name="android.hardware.vulkan.version" android:version="0x400003" android:required="false"/>
            <uses-feature android:name="android.hardware.vulkan.level" android:version="0" android:required="false"/>
            <application
              android:label="Foxle Hub"
              android:appCategory="game"
              android:icon="@drawable/ic"
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:usesCleartextTraffic="true"
              android:requestLegacyExternalStorage="true"
              android:allowBackup="false"
              android:largeHeap="true"
              android:hardwareAccelerated="true">
              <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.fp"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/fp"/>
              </provider>
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts"/>
              </activity>
          <activity android:name=".OpenActivity" android:exported="true" android:theme="@android:style/Theme.Translucent.NoTitleBar" android:excludeFromRecents="true" android:taskAffinity="" android:noHistory="true">
            <intent-filter>
              <action android:name="android.intent.action.VIEW"/>
              <category android:name="android.intent.category.DEFAULT"/>
              <category android:name="android.intent.category.BROWSABLE"/>
              <data android:scheme="content"/><data android:scheme="file"/>
              <data android:mimeType="text/html"/><data android:mimeType="application/xhtml+xml"/><data android:mimeType="application/zip"/>
            </intent-filter>
            <intent-filter>
              <action android:name="android.intent.action.VIEW"/>
              <category android:name="android.intent.category.DEFAULT"/>
              <category android:name="android.intent.category.BROWSABLE"/>
              <data android:scheme="content"/><data android:scheme="file"/><data android:host="*"/><data android:mimeType="*/*"/>
              <data android:pathPattern=".*\\.html"/><data android:pathPattern=".*\\.htm"/><data android:pathPattern=".*\\.zip"/>
              <data android:pathPattern=".*\\..*\\.html"/><data android:pathPattern=".*\\..*\\.htm"/>
            </intent-filter>
            <intent-filter>
              <action android:name="android.intent.action.SEND"/>
              <category android:name="android.intent.category.DEFAULT"/>
              <data android:mimeType="text/html"/><data android:mimeType="application/xhtml+xml"/><data android:mimeType="application/zip"/><data android:mimeType="text/plain"/>
            </intent-filter>
            <intent-filter>
              <action android:name="android.intent.action.SEND_MULTIPLE"/>
              <category android:name="android.intent.category.DEFAULT"/>
              <data android:mimeType="text/html"/><data android:mimeType="application/zip"/>
            </intent-filter>
          </activity>
              <activity android:name=".P" android:exported="false"
                android:documentLaunchMode="always"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode"
                android:windowSoftInputMode="adjustResize"/>
            </application>
          </manifest>
          EOF

          cat > $D/app/src/main/java/app/foxl/P.java <<'EOF'
          package app.foxl;

          public class P extends MainActivity {}
          EOF

          cat > $D/app/src/main/java/app/foxl/MainActivity.java <<'EOF'
          package app.foxl;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.StatFs;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.View;
          import android.view.Display;
          import android.view.PixelCopy;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.DocumentsContract;
          import android.content.pm.FeatureInfo;
          import android.content.pm.PackageInfo;
          import android.graphics.BitmapFactory;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.brotli.dec.BrotliInputStream;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import androidx.core.content.FileProvider;
          import androidx.core.content.pm.ShortcutInfoCompat;
          import androidx.core.content.pm.ShortcutManagerCompat;
          import androidx.core.graphics.drawable.IconCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.*;
          import java.util.*;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.*;

          public class MainActivity extends Activity {
            WebView w;
            FrameLayout fl;
            File root, ext;
            String pid, poly = "";
            JSONObject cj = new JSONObject(); // cfg projek yang sedang berjalan (.cfg)
            ValueCallback<Uri[]> fc;
            View cv;
            WebChromeClient.CustomViewCallback cvb;
            WebChromeClient wc;
            PermissionRequest pr;
            String[] prr;
            final Map<Integer, Out> outs = new HashMap<>();
            int oid = 0;
            boolean fsOn;
            int res = 100;
            String ori = "auto", menu = "", mon = "";
            static String sel;
            final Handler hd = new Handler(Looper.getMainLooper());
            long st;
            Runnable capR;
            String engine = "";

            static final String DEFJ = "{\"fs\":false,\"or\":\"auto\",\"res\":100,\"ka\":false,\"st\":true,\"cam\":true,\"mic\":true,\"net\":true,\"ex\":true,\"mn\":true,\"av\":true,\"mon\":false,\"pr\":\"perf\",\"fps\":0,\"drs\":true,\"aa\":\"auto\",\"pw\":true,\"ld\":false,\"tg\":true,\"wg\":true,\"iso\":true,\"ifr\":false,\"bg\":false,\"ctl\":\"off\",\"fav\":false,\"lp\":0,\"pt\":0}";
            // L(): hanya launcher yang boleh mengelola projek. G(): hanya halaman game yang boleh pakai API runtime.
            boolean L() { return pid == null; }
            boolean G() { return pid != null; }
            static String clean(String id) { return id == null ? "" : id.replaceAll("[^a-z0-9-]", ""); }
            static void merge(JSONObject to, JSONObject from) throws Exception {
              Iterator<String> it = from.keys();
              while (it.hasNext()) { String k = it.next(); to.put(k, from.get(k)); }
            }
            JSONObject eff(String id) {
              JSONObject o = new JSONObject();
              try {
                merge(o, new JSONObject(DEFJ));
                String d = getSharedPreferences("foxl", 0).getString("def", null);
                if (d != null) merge(o, new JSONObject(d));
                if (id != null) merge(o, new JSONObject(readCfg(id)));
              } catch (Exception e) {}
              return o;
            }

            // Password buat auto-unlock HTML terenkripsi (lihat vaultJs()).
            // Dipecah jadi potongan acak & di-XOR biar nggak muncul sebagai satu string utuh
            // "********" pas APK di-decompile/di-strings. Tetap cuma obfuscation, bukan proteksi
            // kriptografis beneran — orang yang niat telusurin reconstruct() ya tetap nemu.
            static final int FX_K = 0x5A;
            static final int[] fx_z9 = {'*' ^ FX_K, '*' ^ FX_K};
            static final int[] fx_q7 = {'*' ^ FX_K, '*' ^ FX_K, '*' ^ FX_K};
            static final int[] fx_m2 = {'*' ^ FX_K, '*' ^ FX_K, '*' ^ FX_K};
            static final int[][] FX_ORDER = { fx_z9, fx_q7, fx_m2 };

            static String fxBuild() {
              StringBuilder sb = new StringBuilder();
              for (int[] chunk : FX_ORDER) for (int c : chunk) sb.append((char) (c ^ FX_K));
              return sb.toString();
            }

            static final String VAULT_PW = fxBuild();

            // baca opsi per-projek; default dipakai kalau belum pernah diatur (dan di launcher)
            boolean cb(String k, boolean d) { return cj.optBoolean(k, d); }

            void setKa(boolean on) {
              if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }

            // dilayani di https://p<id>.foxl/__fxreset?m=... supaya JS bisa menghapus storage origin projek itu
            static final String RESET_HTML =
              "<!doctype html><meta charset=utf-8><script>" +
              "(async function(){" +
              "var q=new URLSearchParams(location.search).get('m')||'';" +
              "function T(p){return Promise.race([Promise.resolve(p),new Promise(function(r){setTimeout(r,3000)})])}" +
              "try{" +
              "if(q.indexOf('l')>=0){try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}}" +
              "if(q.indexOf('i')>=0&&indexedDB.databases){var d=(await T(indexedDB.databases()))||[];" +
              "for(var x of d)await T(new Promise(function(r){var z=indexedDB.deleteDatabase(x.name);z.onsuccess=z.onerror=z.onblocked=r}))}" +
              "if(q.indexOf('c')>=0&&self.caches){var k=(await T(caches.keys()))||[];for(var n of k)await T(caches.delete(n))}" +
              "if(q.indexOf('s')>=0&&navigator.serviceWorker){var g=(await T(navigator.serviceWorker.getRegistrations()))||[];for(var w of g)await T(w.unregister())}" +
              "}catch(e){}" +
              "try{R.d()}catch(e){}" +
              "})();</script>";

            static String jsq(String s) {
              StringBuilder o = new StringBuilder("\"");
              for (char c : s.toCharArray()) {
                if (c == '\\' || c == '"') o.append('\\').append(c);
                else if (c == '\n') o.append("\\n");
                else o.append(c);
              }
              return o.append('"').toString();
            }

            // JS auto-unlock buat HTML terenkripsi: cari input password + tombol, isi password, lalu submit.
            // Deteksi vault dilonggarin: meta fx-vault, ATAU skrip (inline/eksternal via src) yang mengandung
            // kata kunci enkripsi, ATAU fallback cuma ada 1 password input di halaman (toggle ini memang opt-in).
            // Polling max ~20 detik buat form yang baru muncul setelah load, submit sekali saja (anti-loop kalau salah).
            String vaultJs() {
              return
              "(function(){try{" +
              "if(window.__fxv)return;window.__fxv=1;" +
              "var PW=" + jsq(VAULT_PW) + ",n=0,done=0;" +
              "function pwi(){var a=document.querySelectorAll('input[type=password]');for(var i=0;i<a.length;i++)if(a[i].getClientRects().length)return a[i];return null}" +
              "function isV(){" +
              "if(document.querySelector('meta[name=fx-vault]'))return 1;" +
              "var re=/crypto[.]subtle|AES-GCM|AES-CBC|PBKDF2|decrypt|vault/i;" +
              "var s=document.scripts,t='';" +
              "for(var i=0;i<s.length;i++){t+=(s[i].textContent||'').slice(0,300000);if(s[i].src)t+=s[i].src}" +
              "if(re.test(t))return 1;" +
              "if(re.test(document.title+' '+(document.body?document.body.className:'')))return 1;" +
              "var pw=document.querySelectorAll('input[type=password]');" +
              "return pw.length===1}" +
              "function setv(i,v){" +
              "var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');" +
              "d.set.call(i,v);" +
              "i.dispatchEvent(new Event('input',{bubbles:true}));" +
              "i.dispatchEvent(new Event('change',{bubbles:true}))}" +
              "function btn(i){" +
              "var b=document.getElementById('b');if(b&&b!==i)return b;" +
              "var f=i.form,c=f&&f.querySelector('button,input[type=submit]');if(c)return c;" +
              "var a=document.querySelectorAll('button,input[type=button],input[type=submit]');" +
              "for(var k=0;k<a.length;k++)if(a[k].getClientRects().length)return a[k];" +
              "return null}" +
              "function go(){" +
              "var i=pwi();if(!i||!isV())return 0;" +
              "setv(i,PW);" +
              "var b=btn(i);" +
              "if(b)b.click();" +
              "else{['keydown','keypress','keyup'].forEach(function(t){i.dispatchEvent(new KeyboardEvent(t,{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true}))});" +
              "if(i.form&&i.form.requestSubmit)i.form.requestSubmit()}" +
              "return 1}" +
              "var mo=new MutationObserver(function(){if(!done&&go()){done=1;mo.disconnect();clearInterval(t)}});" +
              "try{mo.observe(document.documentElement,{childList:true,subtree:true,attributes:true})}catch(e){}" +
              "var t=setInterval(function(){" +
              "if(done||++n>134){clearInterval(t);mo.disconnect();return}" +
              "if(go()){done=1;clearInterval(t);mo.disconnect()}" +
              "},150);" +
              "}catch(e){}})();";
            }

            static class Out { OutputStream o; String n; }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              root = new File(getFilesDir(), "projects");
              root.mkdirs();
              ext = Environment.getExternalStorageDirectory();
              pid = getIntent().getStringExtra("p");
              cj = eff(pid);
              if (pid != null && cb("ka", false)) setKa(true);
              if (pid == null) pushShare();
              final int bgc = pid == null ? 0xFF0F1115 : Color.BLACK;
              getWindow().setBackgroundDrawable(new ColorDrawable(bgc));
              getWindow().setStatusBarColor(bgc);
              getWindow().setNavigationBarColor(bgc);
              try { poly = read(getAssets().open("poly.js")); } catch (Exception e) {}
              try { menu = read(getAssets().open("menu.js")); } catch (Exception e) {}
              try { mon = read(getAssets().open("mon.js")); } catch (Exception e) {}
              try { engine = read(getAssets().open("engine.js")); } catch (Exception e) {}
              WebView.setWebContentsDebuggingEnabled(getSharedPreferences("foxl", 0).getBoolean("dev", true));
              w = new WebView(this);
              w.setBackgroundColor(bgc);
              fl = new FrameLayout(this);
              fl.setBackgroundColor(bgc);
              fl.addView(w, new FrameLayout.LayoutParams(-1, -1));
              setContentView(fl);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setTextZoom(100);
              s.setSupportZoom(false);
              if (Build.VERSION.SDK_INT >= 33) s.setAlgorithmicDarkeningAllowed(false);
              else if (Build.VERSION.SDK_INT >= 29) s.setForceDark(WebSettings.FORCE_DARK_OFF);
              if (Build.VERSION.SDK_INT >= 26) w.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, true);
              s.setBuiltInZoomControls(false);
              w.addJavascriptInterface(new Host(), "Host");
              w.setDownloadListener((url, ua, cd, mt, len) -> {
                try {
                  if (url.startsWith("blob:") || url.startsWith("data:")) return;
                  String fn = URLUtil.guessFileName(url, cd, mt);
                  DownloadManager.Request q = new DownloadManager.Request(Uri.parse(url));
                  if (mt != null && !mt.isEmpty()) q.setMimeType(mt);
                  if (ua != null) q.addRequestHeader("User-Agent", ua);
                  q.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                  q.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fn);
                  ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(q);
                  tt("Mengunduh " + fn);
                } catch (Exception e) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception x) {}
                }
              });
              w.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  WebResourceResponse x = serve(r);
                  if (x != null || cb("net", true)) return x;
                  String sc = r.getUrl().getScheme();
                  if ("http".equals(sc) || "https".equals(sc))
                    return new WebResourceResponse("text/plain", "utf-8", 403, "Blocked", new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                  return null;
                }
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  String h = u.getHost(), sc = u.getScheme();
                  if (h != null && h.endsWith(".foxl")) return false;
                  if ("blob".equals(sc) || "data".equals(sc) || "about".equals(sc) || "javascript".equals(sc)) return false;
                  if (!cb("ex", true)) { tt("Tautan luar diblokir"); return true; }
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) {}
                  return true;
                }
                @Override public void onPageStarted(WebView v, String u, Bitmap f) {
                  v.evaluateJavascript(poly, null);
                  if (pid != null) v.evaluateJavascript(engine, null);
                }
                @Override public void onPageFinished(WebView v, String u) {
                  v.evaluateJavascript(poly, null);
                  if (pid != null) v.evaluateJavascript(engine, null);
                  if (pid != null && cb("av", true)) v.evaluateJavascript(vaultJs(), null);
                }
                @Override public boolean onRenderProcessGone(WebView v, RenderProcessGoneDetail d) {
                  runOnUiThread(() -> recreate());
                  return true;
                }
              });
              wc = new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fc != null) fc.onReceiveValue(null);
                  fc = cb;
                  try { startActivityForResult(p.createIntent(), 8); } catch (Exception e) { fc = null; return false; }
                  return true;
                }
                @Override public void onPermissionRequest(PermissionRequest r) {
                  runOnUiThread(() -> {
                    List<String> al = new ArrayList<>(), need = new ArrayList<>();
                    for (String x : r.getResources()) {
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(x)) {
                        if (!cb("cam", true)) continue;
                        if (checkSelfPermission("android.permission.CAMERA") != PackageManager.PERMISSION_GRANTED) need.add("android.permission.CAMERA");
                      }
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(x)) {
                        if (!cb("mic", true)) continue;
                        if (checkSelfPermission("android.permission.RECORD_AUDIO") != PackageManager.PERMISSION_GRANTED) need.add("android.permission.RECORD_AUDIO");
                      }
                      al.add(x);
                    }
                    if (al.isEmpty()) { r.deny(); return; }
                    String[] ok = al.toArray(new String[0]);
                    if (need.isEmpty()) r.grant(ok);
                    else { pr = r; prr = ok; requestPermissions(need.toArray(new String[0]), 2); }
                  });
                }
                @Override public void onShowCustomView(View v, WebChromeClient.CustomViewCallback cb) {
                  if (cv != null) { cb.onCustomViewHidden(); return; }
                  cv = v;
                  cvb = cb;
                  fl.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  w.setVisibility(View.GONE);
                  immersive(true);
                }
                @Override public void onHideCustomView() {
                  if (cv == null) return;
                  fl.removeView(cv);
                  cv = null;
                  w.setVisibility(View.VISIBLE);
                  immersive(fsOn);
                  if (cvb != null) cvb.onCustomViewHidden();
                  cvb = null;
                }
                @Override public Bitmap getDefaultVideoPoster() {
                  return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                }
                @Override public boolean onJsAlert(WebView v, String u, String m, JsResult r) {
                  if (isFinishing()) { r.cancel(); return true; }
                  new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_Material_Dialog_Alert)
                    .setMessage(m)
                    .setPositiveButton(android.R.string.ok, (d, i) -> r.confirm())
                    .setOnCancelListener(d -> r.cancel())
                    .show();
                  return true;
                }
                @Override public boolean onJsConfirm(WebView v, String u, String m, JsResult r) {
                  if (isFinishing()) { r.cancel(); return true; }
                  new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_Material_Dialog_Alert)
                    .setMessage(m)
