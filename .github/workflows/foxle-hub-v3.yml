                "epub:application/epub+zip", "wasm:application/wasm"
              };
              for (String s : a) { int i = s.indexOf(':'); M.put(s.substring(0, i), s.substring(i + 1)); }
            }
            static String mime(String p) {
              int i = p.lastIndexOf('.');
              if (i < 0) return "application/octet-stream";
              String m = M.get(p.substring(i + 1).toLowerCase());
              return m != null ? m : "application/octet-stream";
            }

            static class Lim extends FilterInputStream {
              long left;
              Lim(InputStream i, long n) { super(i); left = n; }
              @Override public int read() throws IOException {
                if (left <= 0) return -1;
                int r = super.read();
                if (r >= 0) left--;
                return r;
              }
              @Override public int read(byte[] b, int o, int l) throws IOException {
                if (left <= 0) return -1;
                int r = super.read(b, o, (int) Math.min(l, left));
                if (r > 0) left -= r;
                return r;
              }
              @Override public long skip(long n) throws IOException {
                long s = super.skip(Math.min(n, left));
                left -= s;
                return s;
              }
            }

            static WebResourceResponse resp(String m, int c, String msg, Map<String, String> hd, InputStream in) {
              String enc = (m.startsWith("text/") || m.equals("application/json") || m.equals("application/xml") || m.equals("image/svg+xml")) ? "utf-8" : null;
              return new WebResourceResponse(m, enc, c, msg, hd, in);
            }

            // sisipkan poly.js paling awal di <head> supaya API polyfill sudah ada sebelum script halaman jalan
          static void zipDir(java.util.zip.ZipOutputStream z, File d, String p) throws IOException {
            File[] fl = d.listFiles();
            if (fl == null) return;
            for (File f : fl) {
              if (f.getName().startsWith(".")) continue;
              if (f.isDirectory()) zipDir(z, f, p + f.getName() + "/");
              else {
                z.putNextEntry(new java.util.zip.ZipEntry(p + f.getName()));
                try (FileInputStream i = new FileInputStream(f)) { byte[] b = new byte[8192]; int n; while ((n = i.read(b)) > 0) z.write(b, 0, n); }
                z.closeEntry();
              }
            }
          }

            String injectTag() {
              return (cb("mon", false) ? "<script>" + mon + "</script>" : "")
                + "<script>" + poly + "</script><script>" + engine + "</script>"
                + (cb("mn", true) ? "<script>" + menu + "</script>" : "");
            }

            // titik sisip di <head> (atau <html>/<!doctype>) dari potongan awal file
            static int injectAt(String s) {
              Matcher m = Pattern.compile("<head(\\s[^>]*)?>", Pattern.CASE_INSENSITIVE).matcher(s);
              if (m.find()) return m.end();
              m = Pattern.compile("<html(\\s[^>]*)?>", Pattern.CASE_INSENSITIVE).matcher(s);
              if (m.find()) return m.end();
              m = Pattern.compile("<!doctype[^>]*>", Pattern.CASE_INSENSITIVE).matcher(s);
              if (m.find()) return m.end();
              return 0;
            }

            // HTML besar (puluhan MB) tidak lagi dimuat penuh ke memori: hanya 64KB awal yang diperiksa, sisanya di-stream
            InputStream injected(File f) throws IOException {
              FileInputStream fi = new FileInputStream(f);
              byte[] head = new byte[(int) Math.min(f.length(), 65536)];
              int got = 0, r;
              while (got < head.length && (r = fi.read(head, got, head.length - got)) > 0) got += r;
              int at = injectAt(new String(head, 0, got, "ISO-8859-1"));
              byte[] tag = injectTag().getBytes("UTF-8");
              ByteArrayOutputStream pre = new ByteArrayOutputStream(got + tag.length);
              pre.write(head, 0, at); pre.write(tag); pre.write(head, at, got - at);
              return new SequenceInputStream(new ByteArrayInputStream(pre.toByteArray()), fi);
            }

            OutputStream dout(String name, String mime) throws Exception {
              name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
              if (name.isEmpty()) name = "file";
              if (Build.VERSION.SDK_INT >= 29) {
                ContentValues cvs = new ContentValues();
                cvs.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                cvs.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                cvs.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cvs);
                return getContentResolver().openOutputStream(u);
              }
              File d = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
              d.mkdirs();
              File f = new File(d, name);
              String b = name.replaceAll("\\.[^.]*$", ""), x = name.substring(b.length());
              int i = 1;
              while (f.exists()) f = new File(d, b + " (" + (i++) + ")" + x);
              return new FileOutputStream(f);
            }

            // https://app.foxl/ = launcher (assets) | https://p<id>.foxl/ = project | /__fs/<abs path> = real storage (dengan Range)
            WebResourceResponse serve(WebResourceRequest rq) {
              Uri u = rq.getUrl();
              String h = u.getHost();
              if (h == null || !h.endsWith(".foxl")) return null;
              String p = u.getPath();
              boolean app = h.equals("app.foxl");
              if (p == null || p.equals("/")) p = app ? "/launcher.html" : "/index.html";
              Map<String, String> hd = new HashMap<>();
              hd.put("Access-Control-Allow-Origin", "*");
              hd.put("Accept-Ranges", "bytes");
              hd.put("Cross-Origin-Resource-Policy", "cross-origin");
              if (!app && cb("iso", true)) {
                hd.put("Cross-Origin-Opener-Policy", "same-origin");
                hd.put("Cross-Origin-Embedder-Policy", "credentialless");
              }
              try {
                if (!app && h.startsWith("p") && p.equals("/__fxreset"))
                  return resp("text/html", 200, "OK", hd, new ByteArrayInputStream(RESET_HTML.getBytes("UTF-8")));
                if (app && p.startsWith("/__thumb/")) {
                  File tf = new File(new File(root, clean(p.substring(9))), ".thumb.jpg");
                  hd.put("Cache-Control", "no-cache");
                  if (tf.isFile()) return resp("image/jpeg", 200, "OK", hd, new FileInputStream(tf));
                  return resp("text/plain", 404, "Not Found", hd, new ByteArrayInputStream(new byte[0]));
                }
                if (app) return resp(mime(p), 200, "OK", hd, getAssets().open(p.substring(1)));
                if (p.contains("/.")) return resp("text/plain", 404, "Not Found", hd, new ByteArrayInputStream(new byte[0]));
                File f = null;
                boolean fs = false;
                if (h.startsWith("p")) {
                  if (p.startsWith("/__fs/")) {
                    fs = true;
                    File c = safe(p.substring(5));
                    if (c.isFile()) f = c;
                  } else {
                    File d = new File(root, h.substring(1, h.length() - 5));
                    File c = new File(d, p).getCanonicalFile();
                    if (c.getPath().startsWith(d.getCanonicalPath() + File.separator) && c.isFile()) f = c;
                  }
                }
                boolean zdec = false;
                String dm = null;
                if (f == null && !fs && h.startsWith("p")) {
                  // game dengan aset terkompresi (Unity/Godot): x.wasm diminta, yang ada x.wasm.br / x.wasm.gz
                  File d0 = new File(root, h.substring(1, h.length() - 5));
                  for (String ex : new String[]{".br", ".gz"}) {
                    File c = new File(d0, p + ex).getCanonicalFile();
                    if (c.getPath().startsWith(d0.getCanonicalPath() + File.separator) && c.isFile()) { f = c; zdec = true; dm = mime(p); break; }
                  }
                }
                if (f == null) return resp("text/plain", 404, "Not Found", hd, new ByteArrayInputStream(new byte[0]));
                String lname = f.getName().toLowerCase();
                if (!fs && !zdec && (lname.endsWith(".br") || lname.endsWith(".gz"))) {
                  // diminta langsung dengan ekstensi .br/.gz (pola Unity): dekompres, beri header Content-Encoding
                  zdec = true;
                  dm = mime(f.getName().substring(0, f.getName().length() - 3));
                  hd.put("Content-Encoding", lname.endsWith(".br") ? "br" : "gzip");
                }
                if (zdec) {
                  InputStream raw = new FileInputStream(f);
                  InputStream dec = f.getName().toLowerCase().endsWith(".br") ? new BrotliInputStream(raw) : new GZIPInputStream(raw, 65536);
                  hd.remove("Accept-Ranges");
                  return resp(dm, 200, "OK", hd, dec);
                }
                String m = mime(f.getName());
                long n = f.length();
                if (!fs && m.equals("text/html")) {
                  hd.remove("Accept-Ranges");
                  if (!cb("ifr", false)) hd.put("Content-Security-Policy", "frame-src 'self' blob: data: about:");
                  return resp(m, 200, "OK", hd, injected(f));
                }
                String rg = null;
                for (Map.Entry<String, String> e : rq.getRequestHeaders().entrySet()) if (e.getKey().equalsIgnoreCase("range")) rg = e.getValue();
                long a = 0, z = n - 1;
                int code = 200;
                String msg = "OK";
                if (n > 0 && rg != null && rg.startsWith("bytes=")) {
                  try {
                    String[] t = rg.substring(6).split(",")[0].trim().split("-", -1);
                    if (t[0].isEmpty()) a = Math.max(0, n - Long.parseLong(t[1]));
                    else {
                      a = Long.parseLong(t[0]);
                      if (t.length > 1 && !t[1].isEmpty()) z = Math.min(Long.parseLong(t[1]), n - 1);
                    }
                    if (a > z || a >= n) {
                      hd.put("Content-Range", "bytes */" + n);
                      return resp("text/plain", 416, "Range Not Satisfiable", hd, new ByteArrayInputStream(new byte[0]));
                    }
                    code = 206;
                    msg = "Partial Content";
                    hd.put("Content-Range", "bytes " + a + "-" + z + "/" + n);
                  } catch (Exception x) { a = 0; z = n - 1; code = 200; msg = "OK"; hd.remove("Content-Range"); }
                }
                hd.put("Content-Length", String.valueOf(z - a + 1));
                FileInputStream fi = new FileInputStream(f);
                if (a > 0) fi.getChannel().position(a);
                InputStream in = code == 206 ? new Lim(fi, z - a + 1) : fi;
                return resp(m, code, msg, hd, in);
              } catch (Exception e) {
                return resp("text/plain", 404, "Not Found", hd, new ByteArrayInputStream(new byte[0]));
              }
            }

            // ---------- reset data per projek ----------
            // mask: l=localStorage/sessionStorage, i=IndexedDB, c=Cache API, s=service worker
            class Rst implements Runnable {
              final String id, origin, mask;
              final boolean ck, cf;
              WebView t;
              boolean fin;
              Rst(String id, String mask, boolean ck, boolean cf) {
                this.id = id; this.mask = mask; this.ck = ck; this.cf = cf;
                this.origin = "https://p" + id + ".foxl";
              }
              void start() {
                if (mask.isEmpty()) { run(); return; }
                try {
                  t = new WebView(MainActivity.this);
                  WebSettings s = t.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  t.addJavascriptInterface(this, "R");
                  t.setWebViewClient(new WebViewClient() {
                    @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) { return serve(r); }
                  });
                  t.loadUrl(origin + "/__fxreset?m=" + mask);
                  t.postDelayed(this, 9000);
                } catch (Exception e) { run(); }
              }
              @JavascriptInterface public void d() { runOnUiThread(this); }
              @Override public void run() {
                if (fin) return;
                fin = true;
                if (t != null) {
                  try { t.removeCallbacks(this); t.stopLoading(); t.destroy(); } catch (Exception e) {}
                  t = null;
                }
                if (mask.contains("l") && mask.contains("i") && mask.contains("c") && mask.contains("s")) {
                  try { WebStorage.getInstance().deleteOrigin(origin); } catch (Exception e) {}
                }
                if (ck) {
                  try {
                    CookieManager cm = CookieManager.getInstance();
                    String c = cm.getCookie(origin);
                    if (c != null) for (String kv : c.split(";")) {
                      String n = kv.trim();
                      int i = n.indexOf('=');
                      if (i > 0) n = n.substring(0, i);
                      if (!n.isEmpty()) cm.setCookie(origin, n + "=; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/");
                    }
                    cm.flush();
                  } catch (Exception e) {}
                }
                if (cf) new File(new File(root, id), ".cfg").delete();
                tt("Data direset");
                if (w != null) w.evaluateJavascript("window.__rd&&__rd(" + cf + ")", null);
              }
            }

