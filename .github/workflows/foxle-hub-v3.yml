            static long[] stat(File f, boolean top) {
              long[] r = {0, 0};
              File[] a = f.listFiles();
              if (a != null) for (File c : a) {
                if (top && c.getName().startsWith(".")) continue;
                if (c.isDirectory()) { long[] s = stat(c, false); r[0] += s[0]; r[1] += s[1]; }
                else { r[0] += c.length(); r[1]++; }
              }
              return r;
            }

