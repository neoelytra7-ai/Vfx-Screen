          .opt:active{transform:scale(.98)}.opt .ic{flex:none;width:44px;height:44px;border-radius:13px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--ac)}
          .opt b{display:block}.opt small{color:var(--mu)}
          #ts{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:50;transform:translate(-50%,20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;transition:.25s;pointer-events:none;max-width:86%;text-align:center}
          #ts.on{opacity:1;transform:translate(-50%,0)}
