            @Override protected void onStart() { super.onStart(); if (w != null) w.onResume(); }
            @Override protected void onStop() { super.onStop(); if (w != null && !cb("bg", false)) w.onPause(); }
            @Override protected void onResume() {
              super.onResume();
              if (pid == null) return;
              st = System.currentTimeMillis();
              capR = new Runnable() { @Override public void run() { snap(); hd.postDelayed(this, 90000); } };
              hd.postDelayed(capR, 20000);
            }
            @Override protected void onPause() {
              super.onPause();
              if (pid == null) return;
              snap();
              if (capR != null) hd.removeCallbacks(capR);
              long dt = System.currentTimeMillis() - st;
              if (st > 0 && dt > 1000) savePref("pt", cj.optLong("pt", 0) + dt / 1000);
              st = 0;
            }

            void snap() {
              if (pid == null || Build.VERSION.SDK_INT < 26 || w == null || cv != null || st == 0) return;
              if (System.currentTimeMillis() - st < 4000) return;
              try {
                View dv = getWindow().getDecorView();
                int W = dv.getWidth(), Hh = dv.getHeight();
                if (W <= 0 || Hh <= 0) return;
                float sc = Math.min(1f, 480f / Math.max(W, Hh));
                final Bitmap bm = Bitmap.createBitmap(Math.max(1, (int) (W * sc)), Math.max(1, (int) (Hh * sc)), Bitmap.Config.ARGB_8888);
                final String id = pid;
                PixelCopy.request(getWindow(), null, bm, r -> {
                  if (r != PixelCopy.SUCCESS) return;
                  new Thread(() -> {
                    try {
                      long lum = 0;
                      for (int i = 0; i < 5; i++) for (int j = 0; j < 5; j++) {
                        int c = bm.getPixel(bm.getWidth() * (2 * i + 1) / 10, bm.getHeight() * (2 * j + 1) / 10);
                        lum += Color.red(c) + Color.green(c) + Color.blue(c);
                      }
                      if (lum < 25 * 18) return; // layar hitam: jangan timpa thumbnail
                      try (FileOutputStream o = new FileOutputStream(new File(new File(root, id), ".thumb.jpg"))) { bm.compress(Bitmap.CompressFormat.JPEG, 80, o); }
                    } catch (Exception e) {}
                  }).start();
                }, hd);
              } catch (Throwable e) {}
            }

            // tanpa batas FPS = refresh tertinggi; ada batas = refresh terendah yang >= batas
            void applyRefresh() {
              try {
                if (Build.VERSION.SDK_INT < 23) return;
                int cap = cj.optInt("fps", 0);
                Display d = Build.VERSION.SDK_INT >= 30 ? getDisplay() : getWindowManager().getDefaultDisplay();
                Display.Mode cur = d.getMode(), best = null;
                for (Display.Mode m : d.getSupportedModes()) {
                  if (m.getPhysicalWidth() != cur.getPhysicalWidth() || m.getPhysicalHeight() != cur.getPhysicalHeight()) continue;
                  float r = m.getRefreshRate();
                  if (cap <= 0) { if (best == null || r > best.getRefreshRate()) best = m; }
                  else if (r >= cap - 0.5f && (best == null || r < best.getRefreshRate())) best = m;
                }
                if (best == null) return;
                WindowManager.LayoutParams a = getWindow().getAttributes();
                a.preferredDisplayModeId = best.getModeId();
                getWindow().setAttributes(a);
              } catch (Throwable e) {}
            }

