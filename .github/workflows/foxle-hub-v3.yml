          .ck i{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--s3)}.ck.on i{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 3px var(--bg)}
          .ck small{display:block;color:var(--mu);font-size:12.5px}
