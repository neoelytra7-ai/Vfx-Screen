          cat > $D/app/src/main/java/app/foxl/OpenActivity.java <<'EOF'
          package app.foxl;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.widget.Toast;
          import org.json.JSONObject;
          import java.io.*;
          import java.util.*;
          import java.util.regex.*;

          // Terima HTML/ZIP dari app mana pun (Open with / Share), impor ke Hub, lalu langsung jalankan.
          public class OpenActivity extends Activity {
            String cfg;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              final Intent in = getIntent();
              if ("app.foxl.PLAY".equals(in.getAction())) {
                String pid = in.getStringExtra("p");
                pid = pid == null ? "" : pid.replaceAll("[^a-z0-9-]", "");
                File pd = new File(new File(getFilesDir(), "projects"), pid);
                if (!pid.isEmpty() && pd.isDirectory()) {
                  try {
                    File cf = new File(pd, ".cfg");
                    JSONObject c = new JSONObject(cf.exists() ? MainActivity.read(new FileInputStream(cf)) : "{}");
                    c.put("lp", System.currentTimeMillis());
                    MainActivity.wf(cf, c.toString());
                  } catch (Exception e) {}
                  go(pid);
                } else Toast.makeText(this, "Game tidak ditemukan", Toast.LENGTH_SHORT).show();
                finish();
                return;
              }
              new Thread(() -> {
                String id = null;
                try { id = take(in); } catch (Exception e) {}
                final String r = id;
                runOnUiThread(() -> {
                  if (r == null) Toast.makeText(this, "Tidak ada HTML yang bisa dibuka", Toast.LENGTH_SHORT).show();
                  else if ("menu".equals(getSharedPreferences("foxl", 0).getString("om", "direct"))) hub(r);
                  else go(r);
                  finish();
                });
              }).start();
            }

            void hub(String id) {
              MainActivity.sel = id;
              startActivity(new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT));
            }

            void go(String id) {
              Intent it = new Intent(this, P.class).putExtra("p", id)
                .addFlags(Intent.FLAG_ACTIVITY_NEW_DOCUMENT | Intent.FLAG_ACTIVITY_MULTIPLE_TASK);
              try {
                JSONObject c = new JSONObject(MainActivity.read(new FileInputStream(new File(new File(new File(getFilesDir(), "projects"), id), ".cfg"))));
                it.putExtra("fs", c.optBoolean("fs", false)).putExtra("or", c.optString("or", "auto")).putExtra("res", c.optInt("res", 100));
              } catch (Exception e) {}
              startActivity(it);
            }

            String take(Intent in) throws Exception {
              List<Uri> L = new ArrayList<>();
              if (Intent.ACTION_VIEW.equals(in.getAction()) && in.getData() != null) L.add(in.getData());
              else {
                Uri one = in.getParcelableExtra(Intent.EXTRA_STREAM);
                if (one != null) L.add(one);
                ArrayList<Uri> many = in.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                if (many != null) L.addAll(many);
                android.content.ClipData cd = in.getClipData();
                if (L.isEmpty() && cd != null) for (int i = 0; i < cd.getItemCount(); i++) if (cd.getItemAt(i).getUri() != null) L.add(cd.getItemAt(i).getUri());
              }
              String first = null;
              for (Uri u : L) { String id = save(u); if (first == null) first = id; }
              if (first == null) { CharSequence t = in.getCharSequenceExtra(Intent.EXTRA_TEXT); if (t != null) first = saveText(t.toString()); }
              return first;
            }

            static boolean htmlish(String t) {
              t = t.toLowerCase();
              return t.contains("<html") || t.contains("<!doctype html") || t.contains("<script") || t.contains("<body");
            }

            File fresh(String base) {
              String id = base.toLowerCase().replaceAll("[^a-z0-9]+", "-").replaceAll("^-|-$", "");
              if (id.isEmpty()) id = "app";
              File d = new File(new File(getFilesDir(), "projects"), id);
              cfg = null;
              try { cfg = MainActivity.read(new FileInputStream(new File(d, ".cfg"))); } catch (Exception e) {}
              if (d.exists()) MainActivity.del(d);
              d.mkdirs();
              return d;
            }

            void done(File d, String base) throws IOException {
              if (cfg != null) MainActivity.wf(new File(d, ".cfg"), cfg);
              MainActivity.wf(new File(d, ".name"), base);
              d.setLastModified(System.currentTimeMillis());
            }

            String save(Uri u) throws Exception {
              String n = null;
              try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                if (c != null && c.moveToFirst()) { int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (i >= 0) n = c.getString(i); }
              } catch (Exception e) {}
              if (n == null || n.isEmpty()) n = u.getLastPathSegment() == null ? "app" : u.getLastPathSegment();
              n = n.substring(n.lastIndexOf('/') + 1);
              String lo = n.toLowerCase(), mt = String.valueOf(getContentResolver().getType(u)).toLowerCase();
              boolean zip = lo.endsWith(".zip") || mt.contains("zip");
              boolean hn = lo.endsWith(".html") || lo.endsWith(".htm") || mt.contains("html");
              if (!zip && !hn) {
                InputStream s = getContentResolver().openInputStream(u);
                byte[] h = new byte[4096];
                int k = s.read(h);
                s.close();
                if (k <= 0 || !htmlish(new String(h, 0, k, "UTF-8"))) return null;
              }
              String base = n.replaceAll("\\.[^.]*$", "");
              File d = fresh(base);
              InputStream is = getContentResolver().openInputStream(u);
              if (zip) { MainActivity.unzip(is, d); is.close(); MainActivity.fix(d); }
              else MainActivity.cp(is, new File(d, "index.html"), true);
              done(d, base);
              return d.getName();
            }

            String saveText(String t) throws Exception {
              if (!htmlish(t)) return null;
              Matcher m = Pattern.compile("<title[^>]*>([^<]+)</title>", Pattern.CASE_INSENSITIVE).matcher(t);
              String base = m.find() ? m.group(1).trim() : "Shared " + new java.text.SimpleDateFormat("HHmmss").format(new Date());
              File d = fresh(base);
              MainActivity.wf(new File(d, "index.html"), t);
              done(d, base);
              return d.getName();
            }
          }
          EOF

