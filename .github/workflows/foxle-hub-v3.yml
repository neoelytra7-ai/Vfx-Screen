            // ---------- helpers ----------
            static String read(InputStream in) throws IOException {
              ByteArrayOutputStream o = new ByteArrayOutputStream();
              byte[] b = new byte[8192];
              int n;
              while ((n = in.read(b)) > 0) o.write(b, 0, n);
              in.close();
              return o.toString("UTF-8");
            }
            static void cp(InputStream in, File f, boolean close) throws IOException {
              FileOutputStream o = new FileOutputStream(f);
              byte[] b = new byte[16384];
              int n;
              while ((n = in.read(b)) > 0) o.write(b, 0, n);
              o.close();
              if (close) in.close();
            }
            static void wf(File f, String s) throws IOException {
              try (FileOutputStream o = new FileOutputStream(f)) { o.write(s.getBytes("UTF-8")); }
            }
            static boolean del(File f) {
              File[] a = f.listFiles();
              if (a != null) for (File c : a) del(c);
              return f.delete();
            }
            String nm(File d) {
              try { return read(new FileInputStream(new File(d, ".name"))).trim(); } catch (Exception e) { return d.getName(); }
            }
            File safe(String p) throws IOException {
              if (!cb("st", true)) throw new SecurityException("storage off");
              File f = new File(p).getCanonicalFile();
              String r = ext.getCanonicalPath(), q = f.getPath();
              if (!q.equals(r) && !q.startsWith(r + "/")) throw new SecurityException(p);
              return f;
            }

            static void unzip(InputStream in, File d) throws IOException {
              ZipInputStream z = new ZipInputStream(in);
              String base = d.getCanonicalPath() + File.separator;
              ZipEntry e;
              while ((e = z.getNextEntry()) != null) {
                String en = e.getName().replace('\\', '/');
                if (en.startsWith("__MACOSX/")) continue;
                File f = new File(d, en);
                if (!f.getCanonicalPath().startsWith(base)) continue;
                if (e.isDirectory()) f.mkdirs();
                else { f.getParentFile().mkdirs(); cp(z, f, false); }
              }
              z.close();
            }

            static File findIndex(File d, int depth) {
              if (depth > 3) return null;
              if (new File(d, "index.html").exists()) return d;
              File[] a = d.listFiles();
              if (a == null) return null;
              for (File f : a) if (f.isDirectory() && !f.getName().startsWith(".")) { File r = findIndex(f, depth + 1); if (r != null) return r; }
              return null;
            }

            static void fix(File d) {
              if (new File(d, "index.html").exists()) return;
              File hit = findIndex(d, 0);
              if (hit != null && !hit.equals(d)) {
                File tmp = new File(d, ".__fx_tmp");
                if (hit.renameTo(tmp)) {
                  File[] top = d.listFiles();
                  if (top != null) for (File f : top) if (!f.equals(tmp)) del(f);
                  File[] b = tmp.listFiles();
                  if (b != null) for (File f : b) f.renameTo(new File(d, f.getName()));
                  tmp.delete();
                }
              }
              if (!new File(d, "index.html").exists()) {
                File[] a = d.listFiles();
                if (a != null) for (File f : a) if (f.getName().toLowerCase().endsWith(".html")) { f.renameTo(new File(d, "index.html")); break; }
              }
            }

            // buat folder projek baru; .cfg (pengaturan) dipertahankan saat impor ulang
            static File fresh(File root, String base) {
              String id = base.toLowerCase().replaceAll("[^a-z0-9]+", "-").replaceAll("^-|-$", "");
              if (id.isEmpty()) id = "app";
              File d = new File(root, id);
              String cfg = null;
              try { cfg = read(new FileInputStream(new File(d, ".cfg"))); } catch (Exception e) {}
              if (d.exists()) del(d);
              d.mkdirs();
              if (cfg != null) try { wf(new File(d, ".cfg"), cfg); } catch (Exception e) {}
              return d;
            }

            void doneImp(File d, String base) throws IOException {
              wf(new File(d, ".name"), base);
              d.setLastModified(System.currentTimeMillis());
            }

            void imp(Uri u) throws Exception {
              String n = "app";
              try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                if (c != null && c.moveToFirst()) {
                  int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                  if (i >= 0) n = c.getString(i);
                }
              }
              String lo = n.toLowerCase(), base = n.replaceAll("\\.[^.]*$", "");
              boolean zip = lo.endsWith(".zip");
              if (!zip && !lo.endsWith(".html") && !lo.endsWith(".htm")) { tt("Hanya .html / .zip yang bisa diimpor"); return; }
              File d = fresh(root, base);
              InputStream in = getContentResolver().openInputStream(u);
              if (zip) { unzip(in, d); in.close(); fix(d); }
              else cp(in, new File(d, "index.html"), true);
              doneImp(d, base);
            }

            void copyTree(Uri tree, String docId, File dir, int depth) throws Exception {
              if (depth > 12) return;
              Uri ch = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId);
              try (Cursor c = getContentResolver().query(ch, new String[]{DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME, DocumentsContract.Document.COLUMN_MIME_TYPE}, null, null, null)) {
                while (c != null && c.moveToNext()) {
                  String id = c.getString(0), n = c.getString(1), mt = c.getString(2);
                  if (n == null || n.startsWith(".") || n.contains("/")) continue;
                  File f = new File(dir, n);
                  if (DocumentsContract.Document.MIME_TYPE_DIR.equals(mt)) { f.mkdirs(); copyTree(tree, id, f, depth + 1); }
                  else cp(getContentResolver().openInputStream(DocumentsContract.buildDocumentUriUsingTree(tree, id)), f, true);
                }
              }
            }

            void impTree(Uri tree) throws Exception {
              String docId = DocumentsContract.getTreeDocumentId(tree);
              String base = docId.substring(docId.lastIndexOf(':') + 1);
              base = base.substring(base.lastIndexOf('/') + 1);
              if (base.isEmpty()) base = "folder";
              File d = fresh(root, base);
              copyTree(tree, docId, d, 0);
              fix(d);
              doneImp(d, base);
              tt("Diimpor: " + base);
            }

            void impUrl(final String u) {
              new Thread(() -> {
                HttpURLConnection c = null;
                try {
                  if (!u.startsWith("http://") && !u.startsWith("https://")) { tt("Tautan harus http atau https"); return; }
                  tt("Mengunduh...");
                  c = (HttpURLConnection) new URL(u).openConnection();
                  c.setConnectTimeout(15000); c.setReadTimeout(30000); c.setInstanceFollowRedirects(true);
                  String ct = String.valueOf(c.getContentType()).toLowerCase();
                  String path = c.getURL().getPath();
                  String n = path.substring(path.lastIndexOf('/') + 1);
                  if (n.isEmpty()) n = "index.html";
                  String lo = n.toLowerCase();
                  boolean zip = lo.endsWith(".zip") || ct.contains("zip");
                  if (!zip && !lo.endsWith(".html") && !lo.endsWith(".htm") && !ct.contains("html")) { tt("Tautan harus berisi .html atau .zip"); return; }
                  String base = n.replaceAll("\\.[^.]*$", "");
                  if (base.isEmpty()) base = "app";
                  File d = fresh(root, base);
                  InputStream in = c.getInputStream();
                  if (zip) { unzip(in, d); fix(d); } else cp(in, new File(d, "index.html"), true);
                  doneImp(d, base);
                  tt("Diimpor: " + base);
                } catch (Exception e) { tt("Gagal mengunduh"); }
                finally { if (c != null) c.disconnect(); }
                runOnUiThread(() -> { if (w != null) w.evaluateJavascript("refresh()", null); });
              }).start();
            }

            String impText(String t, String name) {
              try {
                if (t == null || !OpenActivity.htmlish(t)) return "";
                Matcher m = Pattern.compile("<title[^>]*>([^<]+)</title>", Pattern.CASE_INSENSITIVE).matcher(t);
                String base = name != null && !name.isEmpty() ? name : m.find() ? m.group(1).trim() : "Tempel " + new java.text.SimpleDateFormat("HHmmss").format(new Date());
                File d = fresh(root, base);
                wf(new File(d, "index.html"), t);
                doneImp(d, base);
                return d.getName();
              } catch (Exception e) { return ""; }
            }

            Bitmap iconFor(File d) {
              Bitmap out = Bitmap.createBitmap(192, 192, Bitmap.Config.ARGB_8888);
              Canvas c = new Canvas(out);
              File t = new File(d, ".thumb.jpg");
              Bitmap tb = t.isFile() ? BitmapFactory.decodeFile(t.getPath()) : null;
              if (tb != null) {
                int s = Math.min(tb.getWidth(), tb.getHeight());
                c.drawBitmap(tb, new Rect((tb.getWidth() - s) / 2, (tb.getHeight() - s) / 2, (tb.getWidth() + s) / 2, (tb.getHeight() + s) / 2), new Rect(0, 0, 192, 192), new Paint(Paint.FILTER_BITMAP_FLAG));
              } else {
                String n = nm(d);
                c.drawColor(Color.HSVToColor(new float[]{Math.abs(n.hashCode()) % 360, .55f, .55f}));
                Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                p.setColor(Color.WHITE); p.setTextSize(110); p.setTextAlign(Paint.Align.CENTER); p.setFakeBoldText(true);
                c.drawText(n.isEmpty() ? "?" : n.substring(0, 1).toUpperCase(), 96, 134, p);
              }
              return out;
            }

