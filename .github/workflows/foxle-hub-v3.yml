           var r=HE.attachShadow({mode:'open'});r.innerHTML='<pre style="margin:0;padding:3px 6px;background:#000c;color:#7cff3a;font:13px/1.25 monospace"></pre><canvas width="150" height="34" style="display:block;background:#000c"></canvas>';
           hp=r.querySelector('pre');hg=r.querySelector('canvas');(document.body||document.documentElement).appendChild(HE)}
