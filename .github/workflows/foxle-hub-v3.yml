          </style></head><body>
          <div id="app">
           <header id="hd"><div class="br"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4l8 5h10l8-5-2 12c0 7-5 12-11 12S5 23 5 16z" fill="var(--ac)"/><path d="M10 19l6 6 6-6-6 2.5z" fill="#fff"/><circle cx="11.5" cy="15" r="1.7" fill="#1a1a1a"/><circle cx="20.5" cy="15" r="1.7" fill="#1a1a1a"/></svg><h1 id="ttl">Foxle Hub</h1></div><div id="ha" style="display:flex;gap:8px"></div></header>
           <main id="mn">
            <section id="v-lib">
             <div class="sr"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Cari game" autocomplete="off" aria-label="Cari game"><button id="qc" hidden aria-label="Hapus pencarian"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
             <div class="ch" id="ch"></div>
             <div id="lib"></div>
            </section>
            <section id="v-eng" hidden></section>
            <section id="v-set" hidden></section>
           </main>
           <button id="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Impor game</button>
           <nav id="nv"></nav>
          </div>
          <div class="sh" id="sd"><div class="sc"></div><div class="pn" id="sp"><div id="shh"><div class="gr"></div></div><div class="sb" id="sbd"></div></div></div>
          <div class="sh" id="si"><div class="sc"></div><div class="pn"><div class="gr"></div><div class="sb" id="ibd"></div></div></div>
          <div id="dlg"></div><div id="ts"></div>
          <script src="/caps.js"></script>
          <script>
          const $=s=>document.querySelector(s);
          const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
          const H=window.Host||{};
          const call=(f,d,...a)=>{try{if(typeof H[f]!=='function')return d;const v=H[f](...a);return v===undefined?d:v}catch(e){return d}};
          const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
          const IC={
           play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',plus:'<path d="M12 5v14M5 12h14"/>',
           star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
           grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',list:'<path d="M4 6h16M4 12h16M4 18h16"/>',
           cpu:'<path d="M7 7h10v10H7zM9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/>',
           set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
           close:'<path d="M6 6l12 12M18 6L6 18"/>',share:'<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.5M8.2 13.2l7.6 4.5"/>',
           pin:'<path d="M4 11l8-7 8 7v9H4z"/>',edit:'<path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',
           sort:'<path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/>',folder:'<path d="M3 6h7l2 3h9v10H3z"/>',link:'<path d="M10 14l4-4M8 12l-3 3a3 3 0 0 0 4 4l3-3M16 12l3-3a3 3 0 0 0-4-4l-3 3"/>',
           file:'<path d="M6 3h8l4 4v14H6zM14 3v4h4"/>',clip:'<path d="M9 4h6v3H9zM6 6h12v15H6z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
           box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>'};
          const ico=(n,c)=>`<svg class="i ${c||''}" viewBox="0 0 24 24">${IC[n]}</svg>`;

          /* ---------- konfigurasi ---------- */
          const PRE={std:{res:100,fps:0,drs:false,aa:'auto',pw:false,ld:false,tg:false},
           eco:{res:70,fps:30,drs:false,aa:'off',pw:false,ld:false,tg:true},
           bal:{res:100,fps:60,drs:false,aa:'auto',pw:true,ld:false,tg:true},
           perf:{res:100,fps:0,drs:true,aa:'auto',pw:true,ld:false,tg:true}};
          const PN=[['std','Standar'],['eco','Hemat'],['bal','Seimbang'],['perf','Performa']];
          const FPS=[[0,'Maks'],[30,'30'],[45,'45'],[60,'60'],[90,'90'],[120,'120']];
          const ORS=[['auto','Auto'],['land','Landscape'],['port','Portrait']];
          const CTL=[['off','Mati'],['arrows','Panah'],['wasd','WASD']];
          const ACC=['#ff8a3d','#4ad295','#4da3ff','#ff6fa8','#b58cff','#ffd447'];
          function pushDefaults(){const k=LS.get('defpr','perf');call('setDefaults',0,JSON.stringify(Object.assign({pr:k},PRE[k]||PRE.perf)))}

          /* ---------- util ---------- */
          const hue=n=>{let h=2166136261;for(const c of n){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h%360};
          const dur=s=>s<60?(s>0?'<1 mnt':''):s<3600?Math.floor(s/60)+' mnt':Math.floor(s/3600)+' j '+Math.floor(s%3600/60)+' mnt';
          const ago=t=>{if(!t)return 'Belum dimainkan';const m=(Date.now()-t)/6e4;if(m<1)return 'Baru saja';if(m<60)return Math.floor(m)+' mnt lalu';const h=m/60;if(h<24)return Math.floor(h)+' jam lalu';const d=Math.floor(h/24);if(d<7)return d+' hari lalu';return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};
          const sz=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
          let tmr;function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('on'),2200)}
          function cover(p){const h=hue(p.name),L=[...p.name.trim()][0]||'?';
           return `<div class="cv" style="background:linear-gradient(135deg,hsl(${h} 62% 42%),hsl(${(h+48)%360} 66% 26%))"><span class="gl">${esc(L.toUpperCase())}</span>${p.th?`<img loading="lazy" alt="" src="/__thumb/${p.id}?v=${p.th}" onerror="this.remove()">`:''}</div>`}

          /* ---------- dialog ---------- */
          let DLG=null;
          function dlg(o){return new Promise(res=>{
           const d=$('#dlg');
           d.innerHTML=`<div class="dc" role="dialog"><h3>${o.title}</h3>${o.msg?`<p>${o.msg}</p>`:''}${o.html||''}${o.input!=null?`<input id="di" value="${esc(o.input)}" placeholder="${esc(o.ph||'')}" autocomplete="off">`:''}<div class="dr">${(o.btn||[{t:'OK',v:'1',c:'pr'}]).map(b=>`<button class="bt ${b.c||''}" data-v="${b.v}">${b.t}</button>`).join('')}</div></div>`;
           d.classList.add('on');
           const fin=v=>{const val=$('#di')?$('#di').value:null;d.classList.remove('on');d.onclick=null;DLG=null;res({v,val})};
           d.onclick=e=>{if(o.on&&o.on(e))return;const b=e.target.closest('[data-v]');if(b)fin(b.dataset.v);else if(e.target===d)fin('0')};
           DLG=()=>fin('0');
           if($('#di'))setTimeout(()=>$('#di').focus(),60);
          })}

          /* ---------- sheet ---------- */
          const SH={};
          function sheet(id,on){const e=$(id);e.classList.toggle('on',on);SH[id]=on}
          $('#sd .sc').onclick=()=>closeDt();$('#si .sc').onclick=()=>sheet('#si',false);

          /* ---------- library ---------- */
          let P=[],S={q:'',f:LS.get('f','all'),sort:LS.get('sort','lp'),view:LS.get('view','grid')},TAB='lib';
          function refresh(){const n=call('list','[]');if(n===window.__ls&&window.__drawn)return;window.__ls=n;try{P=JSON.parse(n)}catch(e){P=[]}drawLib();if(SH['#sd']&&CUR)softDt()}
          window.refresh=refresh;
          const SORTS=[['lp','Terakhir dimainkan'],['mod','Terbaru diimpor'],['name','Nama A–Z']];
          function drawLib(){
           window.__drawn=1;
           const q=S.q.trim().toLowerCase();
           let L=P.slice();
           if(q)L=L.filter(p=>p.name.toLowerCase().includes(q));
           if(S.f==='fav')L=L.filter(p=>p.fav);
           if(S.f==='played')L=L.filter(p=>p.lp>0);
           L.sort(S.sort==='name'?(a,b)=>a.name.localeCompare(b.name):S.sort==='mod'?(a,b)=>b.mod-a.mod:(a,b)=>(b.lp-a.lp)||(b.mod-a.mod));
           $('#ch').innerHTML=[['all','Semua'],['fav','Favorit'],['played','Pernah main']].map(c=>`<button data-f="${c[0]}" class="${S.f===c[0]?'on':''}">${c[1]}</button>`).join('');
           $('#qc').hidden=!S.q;
           let h='';
           if(!P.length){
            h=`<div class="em">${ico('box')}<h2>Belum ada game</h2><p>Impor game HTML dari file, folder, ZIP, atau tautan. Semuanya jalan offline di dalam Hub.</p><button class="bt pr" data-a="imp">${ico('plus')}Impor game</button></div>`;
           }else{
            const rec=(!q&&S.f==='all')?P.filter(p=>p.lp>0).sort((a,b)=>b.lp-a.lp).slice(0,4):[];
            if(rec.length)h+=`<div class="sec"><b>Lanjutkan bermain</b></div><div class="rw">${rec.map(p=>`<div class="rc" data-id="${p.id}">${cover(p)}<div class="tx"><b>${esc(p.name)}</b><small>${ago(p.lp)}</small></div><button class="pl" data-a="play" aria-label="Main ${esc(p.name)}">${ico('play')}</button></div>`).join('')}</div>`;
            h+=`<div class="sec"><b>${S.f==='fav'?'Favorit':q?'Hasil pencarian':'Semua game'}</b><small>${L.length} game</small></div>`;
            if(!L.length)h+=`<div class="em"><h2>Tidak ada hasil</h2><p>${q?'Coba kata kunci lain.':'Belum ada game di filter ini.'}</p></div>`;
            else h+=`<div class="gd">${L.map(p=>`<div class="cd" data-id="${p.id}">${cover(p)}<button class="fv${p.fav?' on':''}" data-a="fav" aria-label="Favorit">${ico('star')}</button><button class="pl" data-a="play" aria-label="Main ${esc(p.name)}">${ico('play')}</button><div class="ct"><b>${esc(p.name)}</b><small>${p.lp?ago(p.lp)+(p.pt>=60?' • '+dur(p.pt):''):'Belum dimainkan'}</small></div></div>`).join('')}</div>`;
           }
           $('#lib').className=S.view==='list'?'ls':'';
           $('#lib').innerHTML=h;
          }
          $('#lib').addEventListener('click',e=>{
           const a=e.target.closest('[data-a]'),c=e.target.closest('[data-id]');
           if(a&&a.dataset.a==='imp')return openImp();
           if(!c)return;const id=c.dataset.id;
           if(a&&a.dataset.a==='play')return play(id);
           if(a&&a.dataset.a==='fav'){const p=P.find(x=>x.id===id);p.fav=!p.fav;call('setPrefs',0,id,JSON.stringify({fav:p.fav}));window.__ls=null;drawLib();return}
           openDt(id);
          });
          $('#ch').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;S.f=b.dataset.f;LS.set('f',S.f);drawLib()});
          $('#q').addEventListener('input',e=>{S.q=e.target.value;drawLib()});
          $('#qc').onclick=()=>{S.q='';$('#q').value='';drawLib()};
          $('#fab').onclick=()=>openImp();
          let PLAYING=0;
          function play(id){
           if(PLAYING)return;PLAYING=1;document.body.classList.add('launching');navigator.vibrate&&navigator.vibrate(14);
           setTimeout(()=>{call('run',0,id)},170);
           setTimeout(()=>{document.body.classList.remove('launching');PLAYING=0;refresh()},1300);
          }

          /* ---------- impor ---------- */
          function openImp(){
           $('#ibd').innerHTML=`<h2 style="font-size:20px">Impor game</h2>
           <button class="opt" data-i="file"><span class="ic">${ico('file')}</span><span><b>File HTML atau ZIP</b><small>Pilih satu atau banyak file</small></span></button>
           <button class="opt" data-i="dir"><span class="ic">${ico('folder')}</span><span><b>Folder game</b><small>Salin seluruh isi folder (index.html + aset)</small></span></button>
           <button class="opt" data-i="url"><span class="ic">${ico('link')}</span><span><b>Dari tautan</b><small>Unduh file .html atau .zip</small></span></button>
           <button class="opt" data-i="clip"><span class="ic">${ico('clip')}</span><span><b>Tempel dari clipboard</b><small>Kode HTML yang baru kamu salin</small></span></button>`;
           sheet('#si',true);
          }
          $('#ibd').addEventListener('click',async e=>{
           const b=e.target.closest('[data-i]');if(!b)return;const k=b.dataset.i;sheet('#si',false);
           if(k==='file')call('imp');
           else if(k==='dir')call('impDir');
           else if(k==='url'){const r=await dlg({title:'Impor dari tautan',msg:'Tempel alamat file .html atau .zip.',input:'',ph:'https://…',btn:[{t:'Batal',v:'0'},{t:'Unduh',v:'1',c:'pr'}]});if(r.v==='1'&&r.val&&r.val.trim())call('impUrl',0,r.val.trim())}
           else if(k==='clip'){const id=call('impText','',call('paste',''),'');if(id){toast('Game diimpor');refresh()}else toast('Clipboard tidak berisi HTML')}
          });

          /* ---------- detail game ---------- */
          let CUR=null,C={},INF={},OPEN={p:true};
          function openDt(id){
           const p=P.find(x=>x.id===id);if(!p)return;CUR=id;
           try{INF=JSON.parse(call('info','{}',id))}catch(e){INF={}}
           try{C=JSON.parse(call('cfg','{}',id))}catch(e){C={}}
           renderDt();sheet('#sd',true);$('#sbd').scrollTop=0;
          }
          function closeDt(){sheet('#sd',false);CUR=null}
          function softDt(){const p=P.find(x=>x.id===CUR);if(!p){closeDt();return}try{C=JSON.parse(call('cfg','{}',CUR))}catch(e){}renderDt()}
          const seg=(k,l,cur)=>`<div class="sg">${l.map(x=>`<button data-k="${k}" data-v="${x[0]}" class="${String(cur)===String(x[0])?'on':''}">${x[1]}</button>`).join('')}</div>`;
          const sw=(k,t,sub,on)=>`<button class="sw${on?' on':''}" data-t="${k}"><span>${t}${sub?`<em>${sub}</em>`:''}</span><i></i></button>`;
          const acc=(id,t,sm,body)=>`<details class="ac" data-s="${id}"${OPEN[id]?' open':''}><summary>${t}<small>${sm||''}</small></summary><div class="ib2">${body}</div></details>`;
          function renderDt(){
           const p=P.find(x=>x.id===CUR);if(!p)return;
           document.querySelectorAll('#sbd details').forEach(d=>OPEN[d.dataset.s]=d.open);
           const y=$('#sbd').scrollTop,pn=(PN.find(x=>x[0]===C.pr)||[0,'Kustom'])[1],tt=(INF.title||'').trim();
           $('#sbd').innerHTML=
           `<div class="hero" id="shh2">${cover(p)}<button class="ib${C.fav?' on':''}" id="xf" aria-label="Favorit">${ico('star')}</button><button class="ib" id="xc" aria-label="Tutup">${ico('close')}</button></div>`+
           `<div class="dn"><h2>${esc(p.name)}</h2><p>${tt&&tt!==p.name?esc(tt):ago(C.lp)}</p></div>`+
           `<div class="cp"><span><b>${sz(INF.size||0)}</b></span><span><b>${INF.files||0}</b> berkas</span><span>Main <b>${C.pt>=60?dur(C.pt):'—'}</b></span><span>${INF.entry?'index.html ✓':'<b style="color:var(--er)">index.html tidak ada</b>'}</span></div>`+
           `<button class="big" data-a="play">${ico('play')}Main</button>`+
           `<div class="ac4"><button data-a="pin">${ico('pin')}Pintasan</button><button data-a="share">${ico('share')}Bagikan</button><button data-a="ren">${ico('edit')}Ganti nama</button><button class="rd" data-a="del">${ico('trash')}Hapus</button></div>`+
           acc('p','Performa',pn,
            `<div><span class="lb">Preset</span>${seg('pr',PN,C.pr)}</div>`+
            `<div><span class="lb">Resolusi render</span><input type="range" id="rg" min="25" max="100" step="5" value="${C.res}"><div class="rv"><span>Hemat GPU</span><b id="rgv">${C.res}%</b><span>Tajam</span></div></div>`+
            `<div><span class="lb">Batas FPS</span>${seg('fps',FPS,C.fps)}</div>`+
            sw('drs','Resolusi otomatis','Turunkan resolusi sementara kalau FPS jatuh',C.drs)+
            sw('tg','Jaga suhu','Batasi 30 FPS kalau HP terlalu panas',C.tg)+
            sw('pw','GPU performa tinggi','Minta GPU terkuat untuk WebGL / WebGPU',C.pw)+
            sw('aa_off','Matikan anti-aliasing','Lebih ringan, tepi sedikit bergerigi',C.aa==='off'))+
           acc('l','Tampilan',C.fs?'Layar penuh':'',
            sw('fs','Layar penuh','Sembunyikan bilah status dan navigasi',C.fs)+
            `<div><span class="lb">Orientasi</span>${seg('or',ORS,C.or)}</div>`+
            sw('ka','Layar tetap menyala','',C.ka)+sw('bg','Tetap jalan di background','Audio dan game tidak dijeda saat keluar app',C.bg))+
           acc('k','Kontrol',C.ctl==='off'?'':'Aktif',
            `<div><span class="lb">Kontrol layar (jadi tombol keyboard)</span>${seg('ctl',CTL,C.ctl)}</div><small style="color:var(--mu)">Gamepad fisik (Bluetooth/USB) langsung didukung.</small>`)+
           acc('e','Mesin dan kompatibilitas','',
            sw('iso','Isolasi lintas-origin','Aktifkan SharedArrayBuffer dan WASM threads (Godot, Unity, emscripten)',C.iso)+
            sw('wg','WebGPU mode kompatibilitas','Kalau WebGPU inti tidak ada, coba mode Compat (OpenGL ES 3.1)',C.wg)+
            sw('ifr','Izinkan iframe luar','Matikan untuk mencegah halaman luar menyentuh Hub',C.ifr)+
            sw('ld','Latensi rendah canvas','Eksperimental, bisa menyebabkan tearing',C.ld)+
            sw('mn','Menu dalam game','Tombol petir di tepi layar',C.mn)+
            sw('mon','Monitor game','Log FPS, CPU, memori, error',C.mon)+
            sw('av','Auto-unlock','Isi password otomatis di HTML terenkripsi',C.av))+
           acc('z','Izin',`${['st','cam','mic','net','ex'].filter(k=>C[k]).length}/5`,
            sw('st','Penyimpanan','Akses file perangkat',C.st)+sw('cam','Kamera','',C.cam)+sw('mic','Mikrofon','',C.mic)+sw('net','Internet','',C.net)+sw('ex','Tautan luar','Boleh membuka link di browser',C.ex))+
           acc('d','Data','',`<button class="bt rd" data-a="rst">Reset data game…</button><small style="color:var(--mu)">Menghapus save game dan cache halaman. File game tidak dihapus.</small>`);
           $('#sbd').scrollTop=y;
           const rg=$('#rg');if(rg){rg.oninput=()=>$('#rgv').textContent=rg.value+'%';rg.onchange=()=>setC({res:+rg.value})}
          }
          function setC(o,keep){
           Object.assign(C,o);
           if(!keep&&!('pr'in o)){C.pr='custom';o.pr='custom'}
           call('setPrefs',0,CUR,JSON.stringify(o));renderDt();
          }
          $('#sbd').addEventListener('click',async e=>{
           if(e.target.closest('#xc'))return closeDt();
           if(e.target.closest('#xf')){C.fav=!C.fav;call('setPrefs',0,CUR,JSON.stringify({fav:C.fav}));const p=P.find(x=>x.id===CUR);if(p)p.fav=C.fav;window.__ls=null;drawLib();return renderDt()}
           const s=e.target.closest('[data-k]');
           if(s){const k=s.dataset.k,v=s.dataset.v;
            if(k==='pr'){if(PRE[v])setC(Object.assign({pr:v},PRE[v]),true)}
            else setC({[k]:(k==='fps'||k==='res')?+v:v});return}
           const t=e.target.closest('[data-t]');
           if(t){const k=t.dataset.t;if(k==='aa_off')setC({aa:C.aa==='off'?'auto':'off'});else setC({[k]:!C[k]});return}
           const a=e.target.closest('[data-a]');if(!a)return;const id=CUR,p=P.find(x=>x.id===id);
           switch(a.dataset.a){
            case 'play':play(id);break;
            case 'pin':toast(call('pin',false,id)?'Meminta pintasan ke layar utama…':'Launcher tidak mendukung pintasan');break;
            case 'share':if(!call('shareProj',false,id))toast('Gagal membagikan');break;
            case 'ren':{const r=await dlg({title:'Ganti nama',input:p.name,btn:[{t:'Batal',v:'0'},{t:'Simpan',v:'1',c:'pr'}]});if(r.v==='1'&&r.val&&r.val.trim()){call('rename',false,id,r.val.trim());window.__ls=null;refresh();setTimeout(()=>{if(CUR===id)softDt()},0)}break}
            case 'del':{const r=await dlg({title:'Hapus game?',msg:`“${esc(p.name)}” dan semua datanya akan dihapus dari Hub.`,btn:[{t:'Batal',v:'0'},{t:'Hapus',v:'1',c:'rd'}]});if(r.v==='1'){call('drop',0,id);closeDt();window.__ls=null;refresh();toast('Game dihapus')}break}
            case 'rst':resetDlg(id);break;
           }
          });
          async function resetDlg(id){
           const R={l:1,i:1,c:1,ck:1,cf:0};
           const RK=[['l','Simpanan lokal','Save game, skor, setelan halaman'],['i','Database (IndexedDB)','Data besar dan offline'],['c','Cache dan service worker','Aset yang tersimpan halaman'],['ck','Cookie',''],['cf','Pengaturan game','Kembali ke default Hub']];
           const body=()=>RK.map(k=>`<button class="ck${R[k[0]]?' on':''}" data-k="${k[0]}"><i></i><span>${k[1]}${k[2]?`<small>${k[2]}</small>`:''}</span></button>`).join('');
           const r=await dlg({title:'Reset data game',msg:'Tutup game dulu kalau sedang berjalan.',html:`<div id="rk" style="display:flex;flex-direction:column;gap:8px">${body()}</div>`,btn:[{t:'Batal',v:'0'},{t:'Reset',v:'1',c:'rd'}],
            on:e=>{const k=e.target.closest('.ck');if(!k)return false;R[k.dataset.k]=R[k.dataset.k]?0:1;$('#rk').innerHTML=body();return true}});
           if(r.v!=='1')return;
           const m=(R.l?'l':'')+(R.i?'i':'')+(R.c?'cs':'');
           if(m||R.ck||R.cf)call('resetData',0,id,m,!!R.ck,!!R.cf);
          }
          window.__rd=cf=>{if(cf&&CUR)softDt()};

          /* ---------- Mesin ---------- */
          let CAPS=null,NAT=null;
          const pill=(ok,y,n,w)=>`<span class="pill ${ok===true?'ok':ok===false?'no':ok==='w'?'wa':'in'}">${ok===true?(y||'Ya'):ok===false?(n||'Tidak'):ok==='w'?(w||'Sebagian'):(y||'—')}</span>`;
          const row=(l,v,s)=>`<div class="row"><span>${l}${s?`<small>${s}</small>`:''}</span><b>${v}</b></div>`;
          async function drawEng(){
           const el=$('#v-eng');
           el.innerHTML=`<div class="hv"><h2>Mesin Foxle</h2><p>Optimasi per game: batas FPS, resolusi dinamis, jaga suhu, WebGPU, dan isolasi threads.</p><button class="bt" data-a="diag">${ico('bolt')}Diagnostik dan benchmark</button></div><div class="cardx"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
           try{NAT=JSON.parse(call('gpu','{}'))}catch(e){NAT={}}
           if(!CAPS){try{CAPS=await FxCaps.probe()}catch(e){CAPS={env:{},wasm:{},gl:{},api:{},gpu:{}}}}
           const N=NAT||{},c=CAPS,g=c.gl||{},u=c.gpu||{},w=c.wasm||{},a=c.api||{};
           const vk=N.vulkan?pill(true,'Vulkan '+N.vulkan):pill(false,'','Tidak ada');
           const wg=u.core?pill(true,'Ya (inti)'):u.compat?pill('w','','','Mode Compat'):pill(false,'','Tidak tersedia');
           const rr=(N.refresh||[]).join(' / ');
           el.innerHTML=
           `<div class="hv"><h2>Mesin Foxle</h2><p>Optimasi per game: batas FPS, resolusi dinamis, jaga suhu, WebGPU, dan isolasi threads.</p><button class="bt" data-a="diag">${ico('bolt')}Diagnostik dan benchmark</button></div>`+
           `<div class="cardx"><h3>Preset untuk game baru</h3><div style="padding:4px 0 12px">${seg('defpr',PN,LS.get('defpr','perf'))}<small style="display:block;color:var(--mu);margin-top:8px">Game yang sudah kamu atur sendiri tidak berubah.</small></div></div>`+
           `<div class="cardx"><h3>Perangkat</h3>${row('Model',esc((N.brand||'')+' '+(N.model||'—')))}${row('Chipset',esc(N.soc||'—'))}${row('Android',esc(N.release||'—')+(N.sdk?' (API '+N.sdk+')':''))}${row('RAM',N.ram?Math.round(N.ram)+' MB':'—')}${row('Core CPU',N.cores||c.env.cores||'—')}${row('Refresh layar',rr?rr+' Hz':'—')}${row('WebView',esc(N.webview||'—'))}</div>`+
           `<div class="cardx"><h3>Grafis</h3>${row('Vulkan (perangkat)',vk,'Dipakai WebGPU di Chrome/WebView lewat Dawn')}${row('OpenGL ES',N.gles?esc(N.gles):'—')}${row('WebGL 2',pill(!!g.v2))}${row('WebGPU',wg,u.info?esc([u.info.vendor,u.info.arch,u.info.device].filter(Boolean).join(' ')):(u.api?'':'navigator.gpu tidak ada di WebView ini'))}${row('GPU (WebGL)',esc(g.renderer||'—'))}${row('Tekstur maks',g.maxTex?g.maxTex+' px':'—')}${row('Kompresi ASTC / ETC2',g.tc?pill(!!g.tc.astc,'ASTC','—')+' '+pill(!!g.tc.etc2,'ETC2','—'):'—')}</div>`+
           `<div class="cardx"><h3>WebAssembly</h3>${row('WebAssembly',pill(w.dasar))}${row('SIMD',pill(w.simd))}${row('Threads',pill(w.threads?true:'w','Ya','','Butuh isolasi'),'Aktif di game jika “Isolasi lintas-origin” nyala')}${row('Bulk memory',pill(w.bulk))}${row('Exceptions',pill(w.exceptions))}${row('Tail call',pill(w.tail))}${row('Memory64',pill(w.memory64))}${row('GC',pill(w.gc))}</div>`+
           `<div class="cardx"><h3>API web</h3>${row('OffscreenCanvas',pill(a.offscreen))}${row('WebCodecs',pill(a.webcodecs))}${row('AudioWorklet',pill(a.audioWorklet))}${row('Gamepad',pill(a.gamepad))}${row('Service Worker',pill(a.sw))}${row('IndexedDB',pill(a.idb))}${row('WebRTC',pill(a.webrtc))}</div>`+
           `<div class="cardx"><h3>Kalau WebGPU “Tidak tersedia”</h3><div style="padding:2px 0 12px;color:var(--mu)">Perbarui Android System WebView dan Chrome lewat Play Store. WebGPU di WebView mengikuti versi WebView, bukan versi Hub. Mode Compat (OpenGL ES 3.1) dirilis untuk WebView di Chromium 146. Aplikasi WebView DevTools juga bisa menampilkan flag WebGPU, tapi itu pengaturan sistem dan bisa tidak stabil.</div></div>`;
          }
          $('#v-eng').addEventListener('click',async e=>{
           const s=e.target.closest('[data-k]');
           if(s&&s.dataset.k==='defpr'){LS.set('defpr',s.dataset.v);pushDefaults();toast('Preset game baru: '+s.textContent);return drawEng()}
           if(e.target.closest('[data-a=diag]')){const id=call('diag','');if(id){refresh();call('run',0,id)}else toast('Gagal menyiapkan diagnostik')}
          });

          /* ---------- Pengaturan ---------- */
          function drawSet(){
           const th=LS.get('th','dark'),ac=LS.get('ac',ACC[0]),om=call('om','direct'),perm=!!call('perm',false),dev=!!call('dev',true);
           let st={};try{st=JSON.parse(call('storage','{}'))}catch(e){}
           $('#v-set').innerHTML=
           `<div class="cardx"><h3>Tampilan</h3><div style="padding:4px 0 12px"><span class="lb">Tema</span>${seg('th',[['dark','Gelap'],['amoled','AMOLED'],['light','Terang']],th)}</div><div style="padding:0 0 14px"><span class="lb">Warna aksen</span><div class="sw8">${ACC.map(x=>`<button data-ac="${x}" class="${x===ac?'on':''}" style="background:${x}" aria-label="Aksen ${x}"></button>`).join('')}</div></div></div>`+
           `<div class="cardx"><h3>Akses</h3><div class="row"><span>Akses semua file<small>Dibutuhkan game yang membaca/menulis folder perangkat</small></span>${perm?pill(true,'Aktif'):`<button class="bt pr" data-a="perm" style="min-height:38px">Aktifkan</button>`}</div><div style="padding:6px 0 14px"><span class="lb">Saat buka .html dari app lain</span>${seg('om',[['direct','Langsung main'],['menu','Tampilkan di Hub']],om)}</div></div>`+
           `<div class="cardx"><h3>Penyimpanan</h3>${row('Dipakai game',st.used!=null?sz(st.used):'—')}${row('Sisa ruang',st.free!=null?sz(st.free):'—')}</div>`+
           `<div class="cardx"><h3>Developer</h3>${sw('dev','Debug WebView','Inspeksi game lewat chrome://inspect (butuh kabel USB)',dev)}</div>`+
           `<div class="cardx"><h3>Tentang</h3>${row('Foxle Hub','3.0')}${row('Mesin','Foxle Engine')}</div>`;
          }
          $('#v-set').addEventListener('click',e=>{
           const s=e.target.closest('[data-k]');
           if(s){const k=s.dataset.k,v=s.dataset.v;if(k==='th'){LS.set('th',v);theme();drawSet()}else if(k==='om'){call('setOm',0,v);drawSet()}return}
           const a=e.target.closest('[data-ac]');if(a){LS.set('ac',a.dataset.ac);theme();drawSet();return}
           const t=e.target.closest('[data-t="dev"]');if(t){call('setDev',0,!call('dev',true));drawSet();return}
           if(e.target.closest('[data-a=perm]'))call('ask');
          });

          /* ---------- tab, header, tema ---------- */
          const TABS=[['lib','Pustaka','grid'],['eng','Mesin','cpu'],['set','Pengaturan','set']];
          $('#nv').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}">${ico(t[2])}${t[1]}</button>`).join('');
          function tab(t){
           TAB=t;
           document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
           ['lib','eng','set'].forEach(x=>$('#v-'+x).hidden=x!==t);
           $('#fab').style.display=t==='lib'?'':'none';
           $('#ttl').textContent=t==='lib'?'Foxle Hub':t==='eng'?'Mesin':'Pengaturan';
           $('#ha').innerHTML=t==='lib'?`<button class="ib" id="hs" aria-label="Urutkan">${ico('sort')}</button><button class="ib" id="hv" aria-label="Ganti tampilan">${ico(S.view==='grid'?'list':'grid')}</button>`:'';
           $('#mn').scrollTop=0;
           if(t==='lib')refresh();else if(t==='eng')drawEng();else drawSet();
          }
          $('#nv').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)});
          $('#ha').addEventListener('click',async e=>{
           if(e.target.closest('#hv')){S.view=S.view==='grid'?'list':'grid';LS.set('view',S.view);tab('lib')}
           else if(e.target.closest('#hs')){
            const r=await dlg({title:'Urutkan game',html:`<div style="display:flex;flex-direction:column;gap:8px">${SORTS.map(x=>`<button class="ck${S.sort===x[0]?' on':''}" data-o="${x[0]}"><i></i><span>${x[1]}</span></button>`).join('')}</div>`,btn:[{t:'Tutup',v:'0'}],
             on:ev=>{const b=ev.target.closest('[data-o]');if(!b)return false;S.sort=b.dataset.o;LS.set('sort',S.sort);drawLib();DLG&&DLG();return true}});
           }
          });
          function theme(){
           const th=LS.get('th','dark'),ac=LS.get('ac',ACC[0]);
           document.documentElement.dataset.th=th;document.documentElement.style.setProperty('--ac',ac);
           call('bars',0,getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),th==='light');
          }
          addEventListener('foxlback',e=>{
           if(DLG){e.preventDefault();DLG();return}
           if(SH['#si']){e.preventDefault();sheet('#si',false);return}
           if(SH['#sd']){e.preventDefault();closeDt();return}
           if(TAB!=='lib'){e.preventDefault();tab('lib')}
          });
          /* geser sheet detail ke bawah untuk menutup */
          {const pn=$('#sp');let y0=null,dy=0;
           const hd=e=>e.target.closest('#shh,#shh2');
           pn.addEventListener('pointerdown',e=>{if(!hd(e)||e.target.closest('button'))return;y0=e.clientY;dy=0;pn.setPointerCapture(e.pointerId);pn.style.transition='none'});
           pn.addEventListener('pointermove',e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);pn.style.transform=`translateY(${dy}px)`});
           const end=()=>{if(y0==null)return;pn.style.transition='';pn.style.transform='';if(dy>110)closeDt();y0=null};
           pn.addEventListener('pointerup',end);pn.addEventListener('pointercancel',end)}
          function sel(){const x=call('sel','');if(x){refresh();tab('lib');openDt(x)}}
          addEventListener('focus',()=>{sel();refresh()});
          document.addEventListener('visibilitychange',()=>{if(!document.hidden){sel();refresh();if(TAB==='set')drawSet()}});
          theme();pushDefaults();tab('lib');sel();
          </script></body></html>
          EOF

          cat > $D/app/src/main/assets/diag.html <<'EOF'
          <!DOCTYPE html>
          <html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Foxle Diagnostik</title>
