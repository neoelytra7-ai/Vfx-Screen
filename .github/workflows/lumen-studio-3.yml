                  "Caramel" to 0xB2764C, "Bronze" to 0x97603C, "Deep" to 0x6F4430, "Ebony" to 0x4B2E22, "Peach glow" to 0xF2C4A8, "Cool pale" to 0xEBDDE0)
              val HAIR = listOf("Jet black" to 0x0F0D0D, "Soft black" to 0x1C1816, "Dark brown" to 0x3A2418, "Chestnut" to 0x5A3420, "Chocolate" to 0x4A2A1C, "Caramel" to 0x9A6A3A,
                  "Honey blonde" to 0xC8A060, "Ash blonde" to 0xB8A888, "Platinum" to 0xE8E0D0, "Strawberry" to 0xC87A5A, "Copper" to 0xB85A2A, "Auburn" to 0x7A2A1A, "Burgundy" to 0x5A1428,
                  "Wine" to 0x7A1E3A, "Milk tea" to 0x9A8070, "Ash grey" to 0x8A8C92, "Silver" to 0xC8CCD4, "Lavender" to 0xB8A0D8, "Pastel pink" to 0xF0B0C8, "Rose gold" to 0xD8A090,
                  "Teal" to 0x2A8A8A, "Navy" to 0x1A2A5A, "Emerald" to 0x1A6A4A, "Electric blue" to 0x2A6AF0, "Violet" to 0x6A2AB0, "Red" to 0xC01820)
              val LIP = listOf("Nude" to 0xC8907E, "Rose" to 0xD0707C, "Coral" to 0xF0705A, "Pink" to 0xF080A0, "Berry" to 0x8A2848, "Red" to 0xC01830, "Plum" to 0x5A1A3A, "Black" to 0x1A0A10,
                  "Gold" to 0xD8B060, "Teal" to 0x30C8B8, "Violet" to 0x7A3AE0, "Brown" to 0x5A3A2E)

              fun names(l: List<Pair<String, Int>>, first: String = "Off"): List<String> = listOf(first) + l.map { it.first }
              /** Palette entry for a choice index (0 = none). */
              fun pick(l: List<Pair<String, Int>>, idx: Int): Int? = if (idx <= 0 || idx > l.size) null else l[idx - 1].second
              fun rgb(h: Int): FloatArray = floatArrayOf(((h shr 16) and 255) / 255f, ((h shr 8) and 255) / 255f, (h and 255) / 255f)
              fun argb(h: Int): Int = (0xFF000000L or h.toLong()).toInt()
          }

          /** Slider definitions for reshaping: one set that hits every face, plus one hidden set per face so each person can be tuned alone. */
          object FaceDefs {
              val TARGETS = listOf("All faces", "Face 1", "Face 2", "Face 3", "Face 4")
              val BODY_TAB = "Body"
              val FACE_TABS: List<String> = Defs.TABS.keys.filter { it != "Body" }

              fun key(t: Int, id: String): String = if (t <= 0) "fa_$id" else "f${t}_$id"

              /** low / high captions of every reshape slider */
              val ends: Map<String, Pair<String, String>> = HashMap<String, Pair<String, String>>().also { m ->
                  for (l in Defs.TABS.values) for (pd in l) { m[key(0, pd.id)] = pd.lo to pd.hi; m["bd_" + pd.id] = pd.lo to pd.hi; for (t in 1..4) m[key(t, pd.id)] = pd.lo to pd.hi }
              }

              val facePDs: List<PD> = FACE_TABS.flatMap { Defs.TABS[it] ?: emptyList() }
              val bodyPDs: List<PD> = Defs.TABS["Body"] ?: emptyList()

              val tools: LinkedHashMap<String, List<S>> = LinkedHashMap<String, List<S>>().also { m ->
                  for (tab in FACE_TABS) {
                      val l = ArrayList<S>()
                      if (tab == "Face") {
                          l.add(Ch("face_sel", "Target face", 0, TARGETS))
                          l.add(Ac("act_face", "Detect faces & body"))
                          l.add(Sl("face_range", "Reshape range", 100, 50, 200, "%"))
                      }
                      for (pd in Defs.TABS[tab] ?: emptyList()) l.add(Sl(key(0, pd.id), pd.label, 0, -100, 100))
                      m[tab] = l
                  }
                  m["Body"] = bodyPDs.map { Sl("bd_" + it.id, it.label, 0, -100, 100) }
              }

              /** Per-face copies, never shown as a tab of their own (the UI swaps the key when a single face is targeted). */
              val hidden: List<S> = (1..4).flatMap { t -> facePDs.map { pd -> Sl(key(t, pd.id), pd.label, 0, -100, 100) as S } }

              private val cpu: HashSet<String> = hashSetOf(
                  "face_sel", "face_range", "bm_look", "bm_p_lips", "bm_p_shadow", "bm_p_liner", "bm_p_lashes", "bm_p_brows", "bm_p_blush", "bm_p_sculpt", "bm_p_lens",
                  "bm_c_lip", "bm_c_lid", "bm_c_blush", "bm_c_liner", "rs_amt", "depth_model", "d_res", "d_tta", "d_snap")

              /** Keys that only the CPU needs (reshape, makeup baking, depth model choice): they stay out of the shader uniform block. */
              fun isCpuKey(k: String): Boolean =
                  k in cpu || k.startsWith("fa_") || k.startsWith("bd_") || (k.length > 3 && k[0] == 'f' && k[1] in '1'..'4' && k[2] == '_')

              /** Whole-look templates (Korean idol, Doll face, V-line …): name -> values in -1..1 */
              val templates: List<Tpl> = Defs.TPL
              val templateGroups: List<String> = Defs.TPL.map { it.group }.distinct()
          }

