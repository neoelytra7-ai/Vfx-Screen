              private fun showSummary() {
                  val keys = Fx.editedKeys()
                  if (keys.isEmpty()) { snack("No edits yet"); return }
                  val sb = StringBuilder()
                  for (k in keys) {
                      val s = Fx.find(k)
                      val v = when (s) {
                          is Sl -> s.show(Fx.i(k))
                          is Ch -> s.options.getOrElse(Fx.i(k)) { "?" }
                          is Tg -> if (Fx.i(k) == 1) "on" else "off"
                          else -> Fx.i(k).toString()
                      }
                      sb.append(tabOf(k)).append(" · ").append(s?.title ?: k).append(": ").append(v).append('\n')
                  }
                  AlertDialog.Builder(this).setTitle(keys.size.toString() + " edits").setMessage(sb.toString()).setPositiveButton("OK", null).show()
              }

              // ---- tap tools: white balance picker, focus picker, placement pickers, pixel inspector
              private fun depthPercentAt(u: Float, v: Float): Int? {
                  val d = depth ?: return null
                  if (dw <= 0 || dh <= 0) return null
                  val x = (u * (dw - 1)).toInt().coerceIn(0, dw - 1)
                  val y = (v * (dh - 1)).toInt().coerceIn(0, dh - 1)
                  var n = (d[y * dw + x].toInt() and 255) / 255.0
                  n = Math.pow(n, Fx.i("d_gamma") / 100.0)
                  n = ((n - 0.5) * (1.0 + Fx.i("d_contrast") / 100.0) + 0.5).coerceIn(0.0, 1.0)
                  if (Fx.i("d_inv") == 1) n = 1.0 - n
                  return (n * 100.0).roundToInt()
              }

              private fun handleTap(u: Float, v: Float) {
                  if (u < 0f || u > 1f || v < 0f || v > 1f) return
                  val s = src ?: return
                  val px = (u * (s.width - 1)).toInt().coerceIn(0, s.width - 1)
                  val py = (v * (s.height - 1)).toInt().coerceIn(0, s.height - 1)
                  val mode = tapMode
                  if (mode == 0) {
                      if (Fx.i("insp_on") == 1) {
                          val p = s.getPixel(px, py)
                          val r = (p shr 16) and 255; val g = (p shr 8) and 255; val b = p and 255
                          val hsv = FloatArray(3)
                          Color.colorToHSV(p, hsv)
                          var txt = String.format(Locale.US, "#%02X%02X%02X   R%d G%d B%d   H%.0f° S%.0f%% V%.0f%%", r, g, b, r, g, b, hsv[0], hsv[1] * 100f, hsv[2] * 100f)
                          val dp2 = depthPercentAt(u, v)
                          if (dp2 != null) txt += "   Depth $dp2"
                          snack(txt); status(txt)
                      }
                      return
                  }
                  tapMode = 0
                  when (mode) {
                      1 -> { Match.neutralAt(s, px, py).forEach { (k, vv) -> Fx.set(k, vv) }; commitEdit(); afterBulk(); snack("White balance set from the tapped spot") }
                      2 -> {
                          val n = depthPercentAt(u, v)
                          if (n == null) snack("Generate a depth map first")
                          else { Fx.set("dof_focus", n); Fx.set("px_focus", n); commitEdit(); afterBulk(); snack("Focus set to depth $n") }
                      }
                      3 -> { Fx.set("lx", ((u - 0.5f) * 200f).toInt()); Fx.set("ly", ((v - 0.5f) * 200f).toInt()); if (Fx.i("relight") == 0) Fx.set("relight", 60); commitEdit(); afterBulk(); snack("Light placed") }
                      4 -> { Fx.set("rad_x", ((u - 0.5f) * 200f).toInt()); Fx.set("rad_y", ((v - 0.5f) * 200f).toInt()); commitEdit(); afterBulk(); snack("Radial filter moved") }
