              override fun onDraw(c: Canvas) {
                  var anim = false
                  val diff = value - shown
                  if (abs(diff) > 0.002f * span()) { shown += diff * 0.35f; anim = true } else shown = value.toFloat()
                  press += (pressT - press) * 0.28f
                  if (abs(pressT - press) > 0.01f) anim = true else press = pressT
                  c.save()
                  if (vertical) { c.translate(0f, height.toFloat()); c.rotate(-90f) }
                  canvas0 = c
                  val L = len(); val H = thick(); val cy = H / 2f
                  val half = 5f * d
                  p.style = Paint.Style.FILL; p.color = withAlpha(0xFF05080D.toInt(), 0.55f)
                  rect.set(14f * d, cy - half, L - 14f * d, cy + half); c.drawRoundRect(rect, half, half, p)
                  val base = if (df > lo && df < hi) df.toFloat() else lo.toFloat()
                  val x0 = xOf(base); val x1 = xOf(shown)
                  val a = min(x0, x1); val b = max(x0, x1)
