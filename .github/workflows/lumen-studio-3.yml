                  top.addView(tv("Template strength", 14f).apply { typeface = NeonFont.cond; textScaleX = NeonFont.SX }, lp(0, WC, 1f)); top.addView(pill)
                  panel.addView(top, lp(MP, WC).apply { topMargin = dp(8) })
                  val ns = NeonSlider(this, false); ns.configure(0, 150, 100, cAccent, cAccent2); ns.setValue(tplPct, false)
                  ns.onChange = { v -> tplPct = v; pill.text = "$v%" }
                  panel.addView(ns, lp(MP, WC))
                  val reset = tv("↺  Reset face shape of this target", 13.5f, cAccent2, true).apply { gravity = Gravity.CENTER; typeface = NeonFont.condBold; textScaleX = NeonFont.SX; setPadding(0, dp(9), 0, dp(9)); background = rr(0x14000000, 12, 0x88000000.toInt() or (cAccent2 and 0xFFFFFF)) }
                  reset.setOnClickListener { tapFx(it); applyTemplate(null); snack("Face shape reset") }
                  panel.addView(reset, lp(MP, WC).apply { topMargin = dp(4) })
                  for (g in FaceDefs.templateGroups) {
                      panel.addView(tv(g.uppercase(Locale.US), 11f, cMuted, true).apply { typeface = NeonFont.condBold; textScaleX = NeonFont.SX; setPadding(dp(2), dp(12), 0, dp(4)) })
                      val hs = HorizontalScrollView(this); hs.isHorizontalScrollBarEnabled = false
                      val row = LinearLayout(this)
                      for (t in FaceDefs.templates.filter { it.group == g }) {
                          val c = tv(t.name, 13.5f, cText).apply { typeface = NeonFont.cond; textScaleX = NeonFont.SX; setPadding(dp(14), dp(8), dp(14), dp(8)); background = rr(0x14FFFFFF, 14, 0x33FFFFFF) }
                          c.setOnClickListener { tapFx(it); applyTemplate(t); snack(t.name) }
