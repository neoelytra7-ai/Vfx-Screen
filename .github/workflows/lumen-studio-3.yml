          package com.lumen.studio

          import android.content.Context
          import android.media.Image
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.net.Uri
          import java.io.File
          import java.nio.ByteBuffer
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin

          object Video {
              /** Camera path for the parallax motion presets. t in [0,1), result x,y,zoom in roughly [-1,1]. */
              fun cam(preset: Int, t: Float): FloatArray {
                  val a = (2.0 * PI * t).toFloat()
                  return when (preset) {
                      0 -> floatArrayOf(cos(a), sin(a) * 0.6f, 0f)
                      1 -> floatArrayOf(sin(a), 0f, 0f)
                      2 -> floatArrayOf(0f, sin(a), 0f)
                      3 -> floatArrayOf(0f, 0f, 0.5f - 0.5f * cos(a))
                      4 -> floatArrayOf(sin(a) * 0.25f, 0f, sin(a))
                      6 -> floatArrayOf(0f, 0f, 0.5f + 0.5f * cos(a))
                      7 -> { val r = sin(a * 0.5f); floatArrayOf(cos(3 * a) * r, sin(3 * a) * r, 0f) }
                      8 -> floatArrayOf(sin(a), sin(2 * a) * 0.5f, 0f)
                      9 -> floatArrayOf(sin(a), 0.2f * (1f - cos(2 * a)), 0f)
                      10 -> floatArrayOf(0f, -cos(a), 0f)
                      11 -> floatArrayOf(0f, 0f, sin(a) * 0.6f)
                      else -> floatArrayOf(sin(3 * a) * 0.4f + sin(5 * a + 1f) * 0.3f, sin(4 * a + 2f) * 0.3f + sin(2 * a) * 0.2f, 0f)
                  }
              }

              /** cam() plus the user's direction and per-axis range settings. */
              fun camFx(preset: Int, t0: Float): FloatArray {
                  val t = if (Fx.i("px_reverse") == 1) 1f - t0 else t0
                  val c = cam(preset, t)
                  return floatArrayOf(c[0] * Fx.i("px_ax") / 100f, c[1] * Fx.i("px_ay") / 100f, c[2])
              }

              private fun fillImage(img: Image, buf: ByteBuffer, w: Int, h: Int) {
                  val yP = img.planes[0]; val uP = img.planes[1]; val vP = img.planes[2]
                  val yb = yP.buffer; val ub = uP.buffer; val vb = vP.buffer
                  val ys = yP.rowStride; val yps = yP.pixelStride
                  val us = uP.rowStride; val ups = uP.pixelStride
                  val vs = vP.rowStride; val vps = vP.pixelStride
                  for (y in 0 until h) {
                      val row = (h - 1 - y) * w * 4
                      for (x in 0 until w) {
                          val o = row + x * 4
                          val r = buf.get(o).toInt() and 255
                          val g = buf.get(o + 1).toInt() and 255
                          val b = buf.get(o + 2).toInt() and 255
                          val yy = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          yb.put(y * ys + x * yps, yy.coerceIn(16, 235).toByte())
                          if ((y and 1) == 0 && (x and 1) == 0) {
                              val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                              val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                              ub.put((y / 2) * us + (x / 2) * ups, u.coerceIn(16, 240).toByte())
                              vb.put((y / 2) * vs + (x / 2) * vps, v.coerceIn(16, 240).toByte())
                          }
                      }
                  }
              }

              fun export(ctx: Context, r: GradeRenderer, w: Int, h: Int, fps: Int, durSec: Int, preset: Int, bitrateMul: Float, progress: (Int) -> Unit): Uri? {
                  val file = File(ctx.cacheDir, "parallax.mp4")
                  file.delete()
                  val fmt = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, w, h)
                  fmt.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                  fmt.setInteger(MediaFormat.KEY_BIT_RATE, maxOf(2_000_000, (w * h * fps * 0.12 * bitrateMul).toInt()))
                  fmt.setInteger(MediaFormat.KEY_FRAME_RATE, fps)
                  fmt.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                  val codec = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                  codec.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  codec.start()
                  val muxer = MediaMuxer(file.path, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  var track = -1
                  var started = false
                  val info = MediaCodec.BufferInfo()

                  fun drain(eos: Boolean) {
                      var tries = 0
                      while (true) {
                          val i = codec.dequeueOutputBuffer(info, if (eos) 10000L else 0L)
                          if (i == MediaCodec.INFO_TRY_AGAIN_LATER) {
                              if (!eos || ++tries > 500) return
                              continue
                          }
                          if (i == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              track = muxer.addTrack(codec.outputFormat); muxer.start(); started = true
                              continue
                          }
                          if (i >= 0) {
                              val ob = codec.getOutputBuffer(i)!!
                              if ((info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0
                              if (info.size > 0 && started) {
                                  ob.position(info.offset); ob.limit(info.offset + info.size)
                                  muxer.writeSampleData(track, ob, info)
                              }
                              codec.releaseOutputBuffer(i, false)
                              if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) return
                          }
                      }
                  }

                  val total = fps * durSec
                  try {
                      for (f in 0 until total) {
                          val c = camFx(preset, f.toFloat() / total)
                          val buf = r.exportFrame(w, h, c[0], c[1], c[2], true, false) ?: return null
                          var idx: Int
                          do { idx = codec.dequeueInputBuffer(10000L); drain(false) } while (idx < 0)
                          val img = codec.getInputImage(idx)!!
                          fillImage(img, buf, w, h)
                          codec.queueInputBuffer(idx, 0, w * h * 3 / 2, f * 1_000_000L / fps, 0)
                          drain(false)
                          progress(f * 100 / total)
                      }
                      var idx: Int
                      do { idx = codec.dequeueInputBuffer(10000L) } while (idx < 0)
                      codec.queueInputBuffer(idx, 0, 0, total * 1_000_000L / fps, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                      drain(true)
                  } finally {
                      try { codec.stop() } catch (e: Exception) {}
                      codec.release()
                      try { if (started) muxer.stop() } catch (e: Exception) {}
                      muxer.release()
                  }
                  return Img.saveVideo(ctx, file)
              }
          }
