                          if (have > 0L) c.setRequestProperty("Range", "bytes=$have-")
                          val code = c.responseCode
                          var append = false
                          if (code == 206) append = true
                          else if (code == 200) have = 0L
                          else if (code == 416) { part.delete(); last = "resume failed, tap again"; continue }
                          else { last = "HTTP $code"; continue }
                          val len = c.contentLengthLong
                          val total = if (len > 0L) (if (append) have + len else len) else -1L
                          c.inputStream.use { ins ->
                              FileOutputStream(part, append).use { out ->
                                  val buf = ByteArray(1 shl 16)
                                  var got = have; var lastPct = -1
                                  while (true) {
                                      val n = ins.read(buf)
                                      if (n < 0) break
                                      out.write(buf, 0, n); got += n
                                      if (total > 0) { val p = (got * 100 / total).toInt(); if (p != lastPct) { lastPct = p; progress(p) } }
                                  }
                              }
                          }
                          val dst = file(ctx, id)
                          dst.delete()
                          part.renameTo(dst)
                          return null
                      } catch (e: Exception) { last = e.message ?: "network error" }
                  }
                  return last
              }

              fun import(ctx: Context, id: String, uri: Uri): String? = try {
                  ctx.contentResolver.openInputStream(uri)!!.use { i -> file(ctx, id).outputStream().use { o -> i.copyTo(o) } }
                  null
              } catch (e: Exception) { e.message ?: "import failed" }
          }

          object Ort {
              private val env: OrtEnvironment by lazy { OrtEnvironment.getEnvironment() }
              private val sessions = HashMap<String, OrtSession>()
              private var accel = -1

              @Synchronized fun session(ctx: Context, id: String): OrtSession {
                  val a = Fx.i("accel")
                  if (a != accel) { for (s in sessions.values) try { s.close() } catch (e: Exception) {}; sessions.clear(); accel = a }
                  val cached = sessions[id]
                  if (cached != null) return cached
                  if (id.startsWith("depth")) {
                      // only one depth network stays in memory: the big ones are heavy
                      val drop = sessions.keys.filter { it.startsWith("depth") }
                      for (k in drop) { try { sessions[k]?.close() } catch (e: Exception) {}; sessions.remove(k) }
                  }
                  val path = Models.file(ctx, id).path
                  var s: OrtSession? = null
                  if (a == 1) {
                      try {
                          val o = OrtSession.SessionOptions()
                          o.setIntraOpNumThreads(4)
                          o.addNnapi(EnumSet.of(NNAPIFlags.USE_FP16))
                          s = env.createSession(path, o)
                      } catch (e: Throwable) { s = null }
                  } else if (a == 2) {
                      try {
                          val o = OrtSession.SessionOptions()
                          o.addXnnpack(mapOf("intra_op_num_threads" to "4"))
                          o.setIntraOpNumThreads(1)
                          s = env.createSession(path, o)
                      } catch (e: Throwable) { s = null }
                  }
                  if (s == null) {
                      val o = OrtSession.SessionOptions()
                      o.setIntraOpNumThreads(4)
                      o.setOptimizationLevel(OrtSession.SessionOptions.OptLevel.ALL_OPT)
                      s = env.createSession(path, o)
                  }
                  sessions[id] = s!!
                  return s
              }

              class Out(val data: FloatArray, val shape: LongArray)

              private fun f2h(f: Float): Short {
                  val b = java.lang.Float.floatToIntBits(f)
                  val sign = (b ushr 16) and 0x8000
                  var e = ((b ushr 23) and 0xFF) - 127 + 15
                  val m = b and 0x7FFFFF
                  if (e <= 0) return sign.toShort()
                  if (e >= 31) return (sign or 0x7C00).toShort()
                  return (sign or (e shl 10) or (m ushr 13)).toShort()
              }

              private fun h2f(h: Short): Float {
                  val x = h.toInt() and 0xFFFF
                  val sign = (x and 0x8000) shl 16
                  val e = (x ushr 10) and 0x1F
                  val m = x and 0x3FF
                  if (e == 0) {
                      if (m == 0) return java.lang.Float.intBitsToFloat(sign)
                      return (if (sign != 0) -1f else 1f) * m * (1f / 16777216f)
                  }
                  if (e == 31) return java.lang.Float.intBitsToFloat(sign or 0x7F800000 or (m shl 13))
                  return java.lang.Float.intBitsToFloat(sign or ((e - 15 + 127) shl 23) or (m shl 13))
              }

              fun run(sess: OrtSession, data: FloatArray, shape: LongArray): Out {
                  val name = sess.inputNames.iterator().next()
                  val inInfo = sess.inputInfo[name]!!.info as TensorInfo
                  val half = inInfo.type == OnnxJavaType.FLOAT16
                  val tensor: OnnxTensor = if (half) {
                      val bb = ByteBuffer.allocateDirect(data.size * 2).order(ByteOrder.nativeOrder())
                      val sb = bb.asShortBuffer()
                      for (v in data) sb.put(f2h(v))
                      bb.rewind()
                      OnnxTensor.createTensor(env, bb, shape, OnnxJavaType.FLOAT16)
                  } else {
                      val bb = ByteBuffer.allocateDirect(data.size * 4).order(ByteOrder.nativeOrder())
                      val fb = bb.asFloatBuffer()
                      fb.put(data); fb.rewind()
                      OnnxTensor.createTensor(env, fb, shape)
                  }
                  return tensor.use { t ->
                      sess.run(mapOf(name to t)).use { res ->
                          val o = res.get(0) as OnnxTensor
                          val oi = o.info
                          val shp = oi.shape
                          val arr: FloatArray
                          if (oi.type == OnnxJavaType.FLOAT16) {
                              val sb = o.shortBuffer
                              arr = FloatArray(sb.remaining())
                              var k = 0
                              while (sb.hasRemaining()) { arr[k] = h2f(sb.get()); k++ }
                          } else {
                              val b = o.floatBuffer
                              arr = FloatArray(b.remaining())
                              b.get(arr)
                          }
                          Out(arr, shp)
                      }
                  }
              }

              fun inputShape(sess: OrtSession): LongArray {
                  val name = sess.inputNames.iterator().next()
                  return (sess.inputInfo[name]!!.info as TensorInfo).shape
              }

              fun chw(bmp: Bitmap, mean: FloatArray, std: FloatArray): FloatArray {
                  val w = bmp.width; val h = bmp.height
                  val px = IntArray(w * h)
                  bmp.getPixels(px, 0, w, 0, 0, w, h)
                  val o = FloatArray(3 * w * h)
                  val n = w * h
                  for (i in 0 until n) {
                      val p = px[i]
                      o[i] = (((p shr 16) and 255) / 255f - mean[0]) / std[0]
                      o[n + i] = (((p shr 8) and 255) / 255f - mean[1]) / std[1]
                      o[2 * n + i] = ((p and 255) / 255f - mean[2]) / std[2]
                  }
                  return o
              }
          }

          object Cutout {
              fun maskDims(w: Int, h: Int): IntArray {
                  val s = min(1f, 2048f / max(w, h))
                  return intArrayOf(max(1, (w * s).roundToInt()), max(1, (h * s).roundToInt()))
              }

              /** Returns the raw model matte (0..1) at mask resolution. */
              fun run(ctx: Context, src: Bitmap, hq: Boolean): FloatArray {
                  val id = if (hq) "isnet" else "u2netp"
                  val sess = Ort.session(ctx, id)
                  val sh = Ort.inputShape(sess)
                  val ih = if (sh.size >= 4 && sh[2] > 0) sh[2].toInt() else (if (hq) 1024 else 320)
                  val iw = if (sh.size >= 4 && sh[3] > 0) sh[3].toInt() else ih
                  val inp = Bitmap.createScaledBitmap(src, iw, ih, true)
                  val mean = if (hq) floatArrayOf(0.5f, 0.5f, 0.5f) else floatArrayOf(0.485f, 0.456f, 0.406f)
                  val std = if (hq) floatArrayOf(1f, 1f, 1f) else floatArrayOf(0.229f, 0.224f, 0.225f)
                  val out = Ort.run(sess, Ort.chw(inp, mean, std), longArrayOf(1, 3, ih.toLong(), iw.toLong()))
                  val n = ih * iw
                  val a = FloatArray(n) { out.data[it] }
                  var lo = Float.MAX_VALUE; var hi = -Float.MAX_VALUE
                  for (v in a) { if (v < lo) lo = v; if (v > hi) hi = v }
                  val rng = max(hi - lo, 1e-6f)
                  for (i in 0 until n) a[i] = (a[i] - lo) / rng
                  val d = maskDims(src.width, src.height)
                  return Img.resizeF(a, iw, ih, d[0], d[1])
              }
          }

          object Depth {
              class Result(val data: ByteArray, val w: Int, val h: Int)

              val CHOICES = listOf("Small · fast", "Base · fp16", "Base · fp32", "Large · int8", "Large · fp16", "Large · fp32 (best)")
              val IDS = listOf("depth", "depth_b16", "depth_b32", "depth_lq", "depth_l16", "depth_l32")
              val SIDES = intArrayOf(518, 700, 896, 1036)

              fun currentId(): String = IDS[Fx.i("depth_model").coerceIn(0, IDS.size - 1)]

              fun run(ctx: Context, src: Bitmap): Result {
                  val sess = Ort.session(ctx, currentId())
                  val sh = Ort.inputShape(sess)
                  val side = SIDES[Fx.i("d_res").coerceIn(0, SIDES.size - 1)]
                  var iw: Int; var ih: Int
                  if (sh.size >= 4 && sh[2] > 0 && sh[3] > 0) { ih = sh[2].toInt(); iw = sh[3].toInt() }
                  else {
                      val s = side.toFloat() / max(src.width, src.height)
                      iw = max(14, ((src.width * s) / 14f).roundToInt() * 14)
                      ih = max(14, ((src.height * s) / 14f).roundToInt() * 14)
                  }
                  val mean = floatArrayOf(0.485f, 0.456f, 0.406f); val std = floatArrayOf(0.229f, 0.224f, 0.225f)
                  val inp = Bitmap.createScaledBitmap(src, iw, ih, true)
                  fun pass(b: Bitmap): FloatArray {
                      val out = Ort.run(sess, Ort.chw(b, mean, std), longArrayOf(1, 3, ih.toLong(), iw.toLong()))
                      val a = FloatArray(iw * ih)
                      System.arraycopy(out.data, 0, a, 0, min(iw * ih, out.data.size))
                      return a
                  }
                  val a = pass(inp)
                  if (Fx.i("d_tta") == 1) {
                      val m = Matrix(); m.postScale(-1f, 1f)
                      val fl = Bitmap.createBitmap(inp, 0, 0, iw, ih, m, true)
                      val b = pass(fl)
                      for (y in 0 until ih) for (x in 0 until iw) {
                          val i = y * iw + x
                          a[i] = (a[i] + b[y * iw + (iw - 1 - x)]) * 0.5f
                      }
                  }
                  // robust normalisation: 2nd..98th percentile
                  val bins = IntArray(2048)
                  var lo = Float.MAX_VALUE; var hi = -Float.MAX_VALUE
                  for (v in a) { if (v < lo) lo = v; if (v > hi) hi = v }
                  val rng = max(hi - lo, 1e-6f)
                  for (v in a) bins[(((v - lo) / rng) * 2047f).toInt().coerceIn(0, 2047)]++
                  var acc = 0; var p2 = 0; var p98 = 2047
                  for (i in 0 until 2048) { acc += bins[i]; if (acc >= a.size * 0.02 && p2 == 0) p2 = i; if (acc >= a.size * 0.98) { p98 = i; break } }
                  val vlo = lo + rng * p2 / 2047f; val vhi = lo + rng * max(p98, p2 + 1) / 2047f
                  for (i in a.indices) a[i] = ((a[i] - vlo) / (vhi - vlo)).coerceIn(0f, 1f)
                  val cap = if (side >= 896) 1536f else 1024f
                  val s2 = min(1f, cap / max(src.width, src.height))
                  val dw = max(8, (src.width * s2).roundToInt()); val dh = max(8, (src.height * s2).roundToInt())
                  var d = Img.resizeF(a, iw, ih, dw, dh)
                  val guide = Img.gray(src, dw, dh)
                  d = Img.guided(guide, d, dw, dh, Fx.i("d_snap").coerceIn(2, 24), 2e-3f)
                  return Result(ByteArray(dw * dh) { (d[it].coerceIn(0f, 1f) * 255f + 0.5f).toInt().toByte() }, dw, dh)
              }
          }
