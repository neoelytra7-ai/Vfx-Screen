                  val dx = (Fx.i("hm_sh_x") / 100f * subSize).toInt()
                  val dy = (Fx.i("hm_sh_y") / 100f * subSize).toInt()
                  val shifted = FloatArray(n)
                  for (y in 0 until H) for (x in 0 until W) {
