                  val dB = DoubleArray(3) { sqrt(max(useB[3 + it] / max(1, nB) - mB[it] * mB[it], 1e-6)) }
                  val mS = DoubleArray(3) { sS[it] / max(1, cS) }
                  val dS = DoubleArray(3) { sqrt(max(sS[3 + it] / max(1, cS) - mS[it] * mS[it], 1e-6)) }
                  val doTransfer = cS > 50

                  // light wrap sources
                  val wr = max(3, (0.05f * max(W, H)).toInt())
                  val br = FloatArray(n) { ((bp[it] shr 16) and 255) / 255f }
                  val bgc = FloatArray(n) { ((bp[it] shr 8) and 255) / 255f }
                  val bb = FloatArray(n) { (bp[it] and 255) / 255f }
                  val wrR = Img.box(Img.box(br, W, H, wr), W, H, wr)
                  val wrG = Img.box(Img.box(bgc, W, H, wr), W, H, wr)
                  val wrB = Img.box(Img.box(bb, W, H, wr), W, H, wr)
                  val aE = Img.box(A, W, H, max(2, (subSize * 0.04f).toInt()))

