name: Build Lumen Studio (Lumen + FaceLab)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/checkout@v4
      - name: Signing key (created once, committed, reused so updates install over the old app)
        run: |
          if [ ! -f lumen.keystore ]; then
            keytool -genkeypair -keystore lumen.keystore -storepass lumen123 -keypass lumen123 -alias lumen -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Lumen"
            git config user.name github-actions; git config user.email actions@github.com
            git add lumen.keystore; git commit -m "Add signing key [skip ci]"; git push
          fi
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write sources
        run: |
          rm -rf app build .gradle settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p .
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Lumen"
          include(":app")
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          mkdir -p .
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.lumen.studio"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.lumen.studio"; minSdk = 29; targetSdk = 34
                  versionCode = (System.getenv("VC") ?: "1").toInt(); versionName = "2." + (System.getenv("VC") ?: "0")
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
              signingConfigs { create("rel") { storeFile = rootProject.file("lumen.keystore"); storePassword = "lumen123"; keyAlias = "lumen"; keyPassword = "lumen123" } }
              buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("rel") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true; pickFirsts += "**/libc++_shared.so" } }
          }
          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.23.2")
              implementation("com.google.mediapipe:tasks-vision:0.10.21")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <application android:label="Lumen" android:largeHeap="true" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/lumen/studio
          cat > app/src/main/java/com/lumen/studio/Img.kt <<'EOF'
          package com.lumen.studio

          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.net.Uri
          import android.provider.MediaStore
          import java.io.File
          import java.io.InputStream
          import java.nio.ByteBuffer
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          object Img {
              fun decode(ctx: Context, uri: Uri, maxDim: Int): Bitmap {
                  val cr = ctx.contentResolver
                  val o = BitmapFactory.Options()
                  o.inJustDecodeBounds = true
                  cr.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o) }
                  var ss = 1
                  while (max(o.outWidth, o.outHeight) / (ss * 2) >= maxDim) ss *= 2
                  val o2 = BitmapFactory.Options()
                  o2.inSampleSize = ss
                  o2.inPreferredConfig = Bitmap.Config.ARGB_8888
                  var bmp = cr.openInputStream(uri)!!.use { BitmapFactory.decodeStream(it, null, o2) }!!
                  val orient = try {
                      cr.openInputStream(uri)!!.use { ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL) }
                  } catch (e: Exception) { ExifInterface.ORIENTATION_NORMAL }
                  val m = Matrix()
                  when (orient) {
                      ExifInterface.ORIENTATION_ROTATE_90 -> m.postRotate(90f)
                      ExifInterface.ORIENTATION_ROTATE_180 -> m.postRotate(180f)
                      ExifInterface.ORIENTATION_ROTATE_270 -> m.postRotate(270f)
                      ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> m.postScale(-1f, 1f)
                      ExifInterface.ORIENTATION_FLIP_VERTICAL -> m.postScale(1f, -1f)
                  }
                  if (!m.isIdentity) bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                  return scaleMax(bmp, maxDim)
              }

              fun scaleMax(b: Bitmap, maxDim: Int): Bitmap {
                  val l = max(b.width, b.height)
                  if (l <= maxDim) return b
                  val s = maxDim.toFloat() / l
                  return Bitmap.createScaledBitmap(b, max(1, (b.width * s).roundToInt()), max(1, (b.height * s).roundToInt()), true)
              }

              fun bufToBitmap(buf: ByteBuffer, w: Int, h: Int): Bitmap {
                  val px = IntArray(w * h)
                  for (y in 0 until h) {
                      val row = (h - 1 - y) * w * 4
                      for (x in 0 until w) {
                          val o = row + x * 4
                          val r = buf.get(o).toInt() and 255
                          val g = buf.get(o + 1).toInt() and 255
                          val b = buf.get(o + 2).toInt() and 255
                          val a = buf.get(o + 3).toInt() and 255
                          px[y * w + x] = (a shl 24) or (r shl 16) or (g shl 8) or b
                      }
                  }
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  bmp.setPixels(px, 0, w, 0, 0, w, h)
                  return bmp
              }

              fun save(ctx: Context, bmp: Bitmap, png: Boolean, q: Int): Uri? {
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "Lumen_${System.currentTimeMillis()}." + (if (png) "png" else "jpg"))
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, if (png) "image/png" else "image/jpeg")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Lumen")
                  cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                  val uri = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                  ctx.contentResolver.openOutputStream(uri)?.use { bmp.compress(if (png) Bitmap.CompressFormat.PNG else Bitmap.CompressFormat.JPEG, q, it) }
                  cv.clear(); cv.put(MediaStore.MediaColumns.IS_PENDING, 0)
                  ctx.contentResolver.update(uri, cv, null, null)
                  return uri
              }

              /** fmt: 0 = JPEG, 1 = PNG, 2 = WebP. */
              fun saveAs(ctx: Context, bmp: Bitmap, fmt: Int, q: Int): Uri? {
                  val ext = when (fmt) { 1 -> "png"; 2 -> "webp"; else -> "jpg" }
                  val mime = when (fmt) { 1 -> "image/png"; 2 -> "image/webp"; else -> "image/jpeg" }
                  val cf = when (fmt) { 1 -> Bitmap.CompressFormat.PNG; 2 -> Bitmap.CompressFormat.WEBP; else -> Bitmap.CompressFormat.JPEG }
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "Lumen_${System.currentTimeMillis()}.$ext")
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Lumen")
                  cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                  val uri = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                  ctx.contentResolver.openOutputStream(uri)?.use { bmp.compress(cf, q, it) }
                  cv.clear(); cv.put(MediaStore.MediaColumns.IS_PENDING, 0)
                  ctx.contentResolver.update(uri, cv, null, null)
                  return uri
              }

              /** Crop, resize and watermark according to the export settings. */
              fun postProcess(src: Bitmap): Bitmap {
                  var b = src
                  if (Fx.i("crop_export") == 1) {
                      val r = Fx.cropRect(b.width, b.height)
                      if (r[2] < b.width || r[3] < b.height) b = Bitmap.createBitmap(b, r[0], r[1], r[2], r[3])
                  }
                  val cap = intArrayOf(0, 4096, 2048, 1080, 720)[Fx.i("exp_size").coerceIn(0, 4)]
                  if (cap > 0) b = scaleMax(b, cap)
                  if (Fx.i("wm_on") == 1) {
                      val txt = Fx.str("wm_text", "")
                      if (txt.isNotBlank()) b = watermark(b, txt)
                  }
                  return b
              }

              fun watermark(bmp: Bitmap, text: String): Bitmap {
                  val out = if (bmp.isMutable) bmp else bmp.copy(Bitmap.Config.ARGB_8888, true)
                  val cv = Canvas(out)
                  val minD = min(out.width, out.height).toFloat()
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.textSize = max(8f, minD * Fx.i("wm_size") / 100f)
                  p.typeface = Typeface.DEFAULT_BOLD
                  p.color = when (Fx.i("wm_col")) { 0 -> Color.WHITE; 1 -> Color.BLACK; 2 -> 0xFF8B7BFF.toInt(); else -> 0xFFFFD166.toInt() }
                  p.alpha = (Fx.i("wm_op") * 255 / 100).coerceIn(0, 255)
                  if (Fx.i("wm_shadow") == 1) p.setShadowLayer(p.textSize * 0.08f, 0f, p.textSize * 0.04f, 0xAA000000.toInt())
                  val tw = p.measureText(text)
                  val fm = p.fontMetrics
                  val th = fm.descent - fm.ascent
                  val mg = minD * Fx.i("wm_margin") / 100f
                  val x: Float
                  val y: Float
                  when (Fx.i("wm_pos")) {
                      0 -> { x = out.width - tw - mg; y = out.height - mg - fm.descent }
                      1 -> { x = mg; y = out.height - mg - fm.descent }
                      2 -> { x = out.width - tw - mg; y = mg - fm.ascent }
                      3 -> { x = mg; y = mg - fm.ascent }
                      else -> { x = (out.width - tw) / 2f; y = (out.height - th) / 2f - fm.ascent }
                  }
                  cv.save()
                  val rot = Fx.i("wm_rot").toFloat()
                  if (rot != 0f) cv.rotate(rot, x + tw / 2f, y - th / 2f)
                  cv.drawText(text, x, y, p)
                  cv.restore()
                  return out
              }

              fun saveVideo(ctx: Context, f: File): Uri? {
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "Lumen_${System.currentTimeMillis()}.mp4")
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/Lumen")
                  val uri = ctx.contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                  ctx.contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { it.copyTo(o) } }
                  return uri
              }

              fun saveText(ctx: Context, name: String, text: String): Uri? {
                  val cv = ContentValues()
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream")
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/Lumen")
                  val uri = ctx.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: return null
                  ctx.contentResolver.openOutputStream(uri)?.use { it.write(text.toByteArray()) }
                  return uri
              }

              /** Parses an Adobe .cube 3D LUT. Returns RGB floats (red fastest) and the grid size. */
              fun parseCube(ins: InputStream): Pair<FloatArray, Int>? {
                  var n = 0
                  val vals = ArrayList<Float>()
                  ins.bufferedReader().forEachLine { raw ->
                      val l = raw.trim()
                      if (l.isEmpty() || l.startsWith("#") || l.startsWith("TITLE")) return@forEachLine
                      if (l.startsWith("LUT_3D_SIZE")) { n = l.split(Regex("\\s+"))[1].toInt(); return@forEachLine }
                      val t = l.split(Regex("\\s+"))
                      if (t.size >= 3 && (t[0][0].isDigit() || t[0][0] == '-' || t[0][0] == '.')) {
                          val a = t[0].toFloatOrNull(); val b = t[1].toFloatOrNull(); val c = t[2].toFloatOrNull()
                          if (a != null && b != null && c != null) { vals.add(a); vals.add(b); vals.add(c) }
                      }
                  }
                  if (n < 2 || vals.size < n * n * n * 3) return null
                  return Pair(vals.toFloatArray(), n)
              }

              // ------------------------------------------------------------ float image helpers
              fun box(src: FloatArray, w: Int, h: Int, r: Int): FloatArray {
                  if (r <= 0) return src.copyOf()
                  val tmp = FloatArray(src.size)
                  val out = FloatArray(src.size)
                  for (y in 0 until h) {
                      val o = y * w
                      var sum = 0f
                      for (x in 0..min(r, w - 1)) sum += src[o + x]
                      for (x in 0 until w) {
                          val x0 = max(0, x - r); val x1 = min(w - 1, x + r)
                          tmp[o + x] = sum / (x1 - x0 + 1)
                          val add = x + r + 1
                          if (add < w) sum += src[o + add]
                          val rem = x - r
                          if (rem >= 0) sum -= src[o + rem]
                      }
                  }
                  for (x in 0 until w) {
                      var sum = 0f
                      for (y in 0..min(r, h - 1)) sum += tmp[y * w + x]
                      for (y in 0 until h) {
                          val y0 = max(0, y - r); val y1 = min(h - 1, y + r)
                          out[y * w + x] = sum / (y1 - y0 + 1)
                          val add = y + r + 1
                          if (add < h) sum += tmp[add * w + x]
                          val rem = y - r
                          if (rem >= 0) sum -= tmp[rem * w + x]
                      }
                  }
                  return out
              }

              fun resizeF(s: FloatArray, sw: Int, sh: Int, dw: Int, dh: Int): FloatArray {
                  if (sw == dw && sh == dh) return s.copyOf()
                  val o = FloatArray(dw * dh)
                  for (y in 0 until dh) {
                      val fy = ((y + 0.5f) * sh / dh - 0.5f).coerceIn(0f, (sh - 1).toFloat())
                      val y0 = fy.toInt(); val y1 = min(sh - 1, y0 + 1); val ty = fy - y0
                      for (x in 0 until dw) {
                          val fx = ((x + 0.5f) * sw / dw - 0.5f).coerceIn(0f, (sw - 1).toFloat())
                          val x0 = fx.toInt(); val x1 = min(sw - 1, x0 + 1); val tx = fx - x0
                          val a = s[y0 * sw + x0] * (1 - tx) + s[y0 * sw + x1] * tx
                          val b = s[y1 * sw + x0] * (1 - tx) + s[y1 * sw + x1] * tx
                          o[y * dw + x] = a * (1 - ty) + b * ty
                      }
                  }
                  return o
              }

              fun gray(b: Bitmap, w: Int, h: Int): FloatArray {
                  val s = if (b.width == w && b.height == h) b else Bitmap.createScaledBitmap(b, w, h, true)
                  val px = IntArray(w * h)
                  s.getPixels(px, 0, w, 0, 0, w, h)
                  return FloatArray(w * h) {
                      val p = px[it]
                      (0.299f * ((p shr 16) and 255) + 0.587f * ((p shr 8) and 255) + 0.114f * (p and 255)) / 255f
                  }
              }

              fun guided(I: FloatArray, p: FloatArray, w: Int, h: Int, r: Int, eps: Float): FloatArray {
                  val n = w * h
                  val mI = box(I, w, h, r)
                  val mp = box(p, w, h, r)
                  val mIp = box(FloatArray(n) { I[it] * p[it] }, w, h, r)
                  val mII = box(FloatArray(n) { I[it] * I[it] }, w, h, r)
                  val a = FloatArray(n)
                  val b = FloatArray(n)
                  for (i in 0 until n) {
                      val cov = mIp[i] - mI[i] * mp[i]
                      val v = mII[i] - mI[i] * mI[i]
                      a[i] = cov / (v + eps)
                      b[i] = mp[i] - a[i] * mI[i]
                  }
                  val ma = box(a, w, h, r)
                  val mb = box(b, w, h, r)
                  return FloatArray(n) { ma[it] * I[it] + mb[it] }
              }

              /** Turns a raw matte into a final 8-bit alpha using the cutout refinement controls. */
              fun refine(base: FloatArray, w: Int, h: Int, guide: FloatArray?, smooth: Int, contrast: Float, shift: Int, feather: Int): ByteArray {
                  var a = base
                  if (smooth > 0 && guide != null) {
                      a = guided(guide, a, w, h, smooth, 1e-3f)
                      for (i in a.indices) a[i] = a[i].coerceIn(0f, 1f)
                  }
                  if (shift != 0) {
                      val bl = box(box(a, w, h, abs(shift)), w, h, max(1, abs(shift) / 2))
                      val out = FloatArray(a.size)
                      for (i in a.indices) {
                          val t = if (shift > 0) ((bl[i] - 0.08f) / 0.3f) else ((bl[i] - 0.55f) / 0.35f)
                          out[i] = t.coerceIn(0f, 1f)
                      }
                      a = out
                  }
                  val lo = 0.45f * contrast
                  val hi = 1f - lo
                  if (contrast > 0.01f) {
                      val out = FloatArray(a.size)
                      for (i in a.indices) out[i] = ((a[i] - lo) / (hi - lo)).coerceIn(0f, 1f)
                      a = out
                  }
                  if (feather > 0) a = box(box(a, w, h, feather), w, h, max(1, feather / 2))
                  return ByteArray(a.size) { (a[it].coerceIn(0f, 1f) * 255f + 0.5f).toInt().toByte() }
              }
          }
          EOF
          mkdir -p app/src/main/java/com/lumen/studio
          cat > app/src/main/java/com/lumen/studio/Ui.kt <<'EOF'
          package com.lumen.studio

          import android.animation.ArgbEvaluator
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.animation.LinearInterpolator
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin

          /**
           * Custom-drawn slider. The thumb chases the finger with easing, grows and glows with a springy press,
           * a value bubble floats above it, a ghost ring marks where the drag started, and the default value is magnetic.
           */
          class FluidSlider(ctx: Context) : View(ctx) {
              var lo = 0; private set
              var hi = 100; private set
              var df = 0; private set
              var value = 0; private set
              var onChange: ((Int) -> Unit)? = null
              var onStop: (() -> Unit)? = null
              var onSnap: (() -> Unit)? = null
              var onTick: (() -> Unit)? = null

              private var label: (Int) -> String = { it.toString() }
              private var accent = 0xFF8B7BFF.toInt()
              private var accent2 = 0xFF22D3EE.toInt()
              private var trackCol = 0xFF26313F.toInt()
              private val d = resources.displayMetrics.density
              private var shown = 0f
              private var press = 0f
              private var pv = 0f
              private var pressT = 0f
              private var startVal = 0
              private var dragging = false
              private var downX = 0f
              private var downY = 0f
              private val slop = ViewConfiguration.get(ctx).scaledTouchSlop
              private val pTrack = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pFill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pThumb = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pGlow = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pDot = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pTick = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pGhost = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pBubble = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pText = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              init {
                  pGhost.style = Paint.Style.STROKE
                  pGhost.strokeWidth = 1.6f * d
                  pThumb.setShadowLayer(4f * d, 0f, 1.5f * d, 0x66000000)
                  pText.color = Color.WHITE
                  pText.textSize = 12f * resources.displayMetrics.scaledDensity
                  pText.typeface = Typeface.DEFAULT_BOLD
                  pText.textAlign = Paint.Align.CENTER
                  setLayerType(LAYER_TYPE_NONE, null)
              }

              fun configure(lo: Int, hi: Int, df: Int, accent: Int, accent2: Int, track: Int, label: (Int) -> String) {
                  this.lo = lo; this.hi = hi; this.df = df
                  this.accent = accent; this.accent2 = accent2; this.trackCol = track
                  this.label = label
                  invalidate()
              }

              fun setValue(v: Int, animate: Boolean) {
                  value = v.coerceIn(lo, hi)
                  if (!animate) shown = value.toFloat()
                  invalidate()
              }

              override fun onMeasure(wSpec: Int, hSpec: Int) {
                  setMeasuredDimension(resolveSize(suggestedMinimumWidth, wSpec), (50f * d).toInt())
              }

              private fun left() = 16f * d
              private fun right() = width - 16f * d
              private fun trackY() = height - 14f * d
              private fun span() = (hi - lo).coerceAtLeast(1)
              private fun xOf(v: Float): Float = left() + (v - lo) / span() * (right() - left())

              override fun onDraw(c: Canvas) {
                  var animating = false
                  val diff = value - shown
                  if (abs(diff) > 0.002f * span()) { shown += diff * 0.32f; animating = true } else shown = value.toFloat()
                  pv += (pressT - press) * 0.34f
                  pv *= 0.64f
                  press += pv
                  if (abs(pv) > 0.002f || abs(pressT - press) > 0.002f) animating = true else { press = pressT; pv = 0f }

                  val pr = press.coerceIn(0f, 1f)
                  val ty = trackY()
                  val l = left(); val r = right()
                  val half = (3.5f + 2f * pr) * d / 2f
                  pTrack.color = trackCol
                  rect.set(l, ty - half, r, ty + half)
                  c.drawRoundRect(rect, half, half, pTrack)

                  val base = if (df > lo && df < hi) df.toFloat() else lo.toFloat()
                  val x0 = xOf(base); val x1 = xOf(shown)
                  val a = min(x0, x1); val b = max(x0, x1)
                  if (b - a > 0.5f) {
                      pFill.shader = LinearGradient(l, 0f, r, 0f, accent, accent2, Shader.TileMode.CLAMP)
                      rect.set(a, ty - half, b, ty + half)
                      c.drawRoundRect(rect, half, half, pFill)
                  }
                  if (df > lo && df < hi) {
                      val dx = xOf(df.toFloat())
                      pTick.color = 0x66FFFFFF
                      c.drawRect(dx - 1f * d, ty - 8f * d, dx + 1f * d, ty - 4f * d, pTick)
                  }
                  if (pr > 0.05f && startVal != value) {
                      pGhost.color = accent
                      pGhost.alpha = (130 * pr).toInt()
                      c.drawCircle(xOf(startVal.toFloat()), ty, 6.5f * d, pGhost)
                  }
                  val tx = xOf(shown)
                  val tr = (8f + 3f * press) * d
                  if (pr > 0.01f) {
                      pGlow.color = accent
                      pGlow.alpha = (95 * pr).toInt()
                      c.drawCircle(tx, ty, tr + 9f * d * pr, pGlow)
                  }
                  pThumb.color = Color.WHITE
                  c.drawCircle(tx, ty, tr, pThumb)
                  if (pr > 0.01f) {
                      pDot.color = accent
                      c.drawCircle(tx, ty, tr * 0.38f * pr, pDot)
                  }
                  if (press > 0.03f) {
                      val s = label(value)
                      val tw = pText.measureText(s)
                      val bw = tw + 22f * d
                      val bh = 22f * d
                      val bx = (tx - bw / 2f).coerceIn(2f * d, max(2f * d, width - bw - 2f * d))
                      val by = 2f * d + (1f - pr) * 8f * d
                      pBubble.color = accent
                      pBubble.alpha = (255 * pr).toInt()
                      rect.set(bx, by, bx + bw, by + bh)
                      c.drawRoundRect(rect, bh / 2f, bh / 2f, pBubble)
                      pText.alpha = (255 * pr).toInt()
                      c.drawText(s, bx + bw / 2f, by + bh / 2f + pText.textSize * 0.35f, pText)
                  }
                  if (animating) postInvalidateOnAnimation()
              }

              private fun setFromX(x: Float) {
                  val f = ((x - left()) / (right() - left())).coerceIn(0f, 1f)
                  var v = (lo + f * span()).roundToInt()
                  val zone = max(1, (span() * 0.012f).roundToInt())
                  var snapped = false
                  if (df > lo && df < hi && abs(v - df) <= zone) { v = df; snapped = true }
                  if (v == value) return
                  val wasDefault = value == df
                  value = v
                  onChange?.invoke(v)
                  if (snapped && !wasDefault) onSnap?.invoke() else onTick?.invoke()
                  invalidate()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.x; downY = e.y; dragging = false; startVal = value
                          pressT = 1f
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!dragging) {
                              val dx = abs(e.x - downX); val dy = abs(e.y - downY)
                              if (dx > slop && dx > dy) { dragging = true; parent?.requestDisallowInterceptTouchEvent(true) }
                              else if (dy > slop) { pressT = 0f; invalidate(); return false }
                          }
                          if (dragging) setFromX(e.x)
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          if (!dragging) setFromX(e.x)
                          pressT = 0f; dragging = false
                          invalidate()
                          onStop?.invoke()
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          pressT = 0f; dragging = false
                          invalidate()
                          if (value != startVal) onStop?.invoke()
                          return true
                      }
                  }
                  return super.onTouchEvent(e)
              }
          }

          /** Custom toggle: springy knob that stretches while pressed and glows when on. */
          class FluidSwitch(ctx: Context) : View(ctx) {
              var checked = false; private set
              var onToggle: ((Boolean) -> Unit)? = null
              private var onCol = 0xFF22D3EE.toInt()
              private val offCol = 0xFF2A3544.toInt()
              private val d = resources.displayMetrics.density
              private var pos = 0f
              private var vel = 0f
              private var pressed = 0f
              private var pressT = 0f
              private val pT = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pK = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pG = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val ev = ArgbEvaluator()

              init { pK.setShadowLayer(3f * d, 0f, 1.2f * d, 0x66000000) }

              fun setAccent(c: Int) { onCol = c; invalidate() }

              fun setChecked(v: Boolean, animate: Boolean) {
                  checked = v
                  if (!animate) { pos = if (v) 1f else 0f; vel = 0f }
                  invalidate()
              }

              fun flip() { checked = !checked; onToggle?.invoke(checked); invalidate() }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension((52f * d).toInt(), (32f * d).toInt()) }

              override fun onDraw(c: Canvas) {
                  val target = if (checked) 1f else 0f
                  vel += (target - pos) * 0.30f
                  vel *= 0.68f
                  pos += vel
                  pressed += (pressT - pressed) * 0.3f
                  val animating = abs(vel) > 0.002f || abs(target - pos) > 0.002f || abs(pressT - pressed) > 0.01f
                  if (!animating) { pos = target; vel = 0f; pressed = pressT }

                  val w = width.toFloat(); val h = height.toFloat()
                  val trackH = 20f * d
                  val onTrack = (0xAA shl 24) or (onCol and 0xFFFFFF)
                  pT.color = ev.evaluate(pos.coerceIn(0f, 1f), offCol, onTrack) as Int
                  rect.set(2f * d, (h - trackH) / 2f, w - 2f * d, (h + trackH) / 2f)
                  c.drawRoundRect(rect, trackH / 2f, trackH / 2f, pT)

                  val kr = (10.5f + 0.8f * pressed) * d
                  val kw = kr + 3.5f * d * pressed
                  val minCx = 2f * d + kw + 1.5f * d
                  val maxCx = w - 2f * d - kw - 1.5f * d
                  val cx = minCx + (maxCx - minCx) * pos
                  if (pos > 0.01f) {
                      pG.color = onCol
                      pG.alpha = (80 * pos.coerceIn(0f, 1f)).toInt()
                      c.drawCircle(cx, h / 2f, kr + 6f * d, pG)
                  }
                  pK.color = Color.WHITE
                  rect.set(cx - kw, h / 2f - kr, cx + kw, h / 2f + kr)
                  c.drawRoundRect(rect, kr, kr, pK)
                  if (animating) postInvalidateOnAnimation()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { pressT = 1f; invalidate(); return true }
                      MotionEvent.ACTION_UP -> {
                          pressT = 0f
                          if (e.x >= 0f && e.x <= width && e.y >= 0f && e.y <= height) flip() else invalidate()
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> { pressT = 0f; invalidate(); return true }
                  }
                  return super.onTouchEvent(e)
              }
          }

          /** Slowly drifting colour blobs for the home screen. */
          class AuroraView(ctx: Context) : View(ctx) {
              private val cols = intArrayOf(0xFF8B7BFF.toInt(), 0xFF22D3EE.toInt(), 0xFFF472B6.toInt())
              private val paints = Array(3) { Paint(Paint.ANTI_ALIAS_FLAG) }
              private var rad = 1f
              private var t = 0f
              private var anim: ValueAnimator? = null

              fun setColors(a: Int, b: Int) { cols[0] = a; cols[1] = b; rebuild(); invalidate() }

              private fun rebuild() {
                  rad = max(width, height) * 0.62f
                  if (rad < 2f) return
                  for (i in 0..2) {
                      val rgb = cols[i] and 0xFFFFFF
                      paints[i].shader = RadialGradient(0f, 0f, rad, (0x5A shl 24) or rgb, rgb, Shader.TileMode.CLAMP)
                  }
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { super.onSizeChanged(w, h, ow, oh); rebuild() }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 26000
                  a.repeatCount = ValueAnimator.INFINITE
                  a.interpolator = LinearInterpolator()
                  a.addUpdateListener { t = it.animatedValue as Float; invalidate() }
                  a.start()
                  anim = a
              }

              override fun onDetachedFromWindow() { anim?.cancel(); anim = null; super.onDetachedFromWindow() }

              override fun onDraw(c: Canvas) {
                  c.drawColor(0xFF090C12.toInt())
                  val tau = 6.2831855f
                  for (i in 0..2) {
                      val ph = i / 3f
                      val cx = width * (0.5f + 0.42f * sin(tau * (t + ph)))
                      val cy = height * (0.34f + 0.26f * cos(tau * (t * 1f + ph * 1.7f)))
                      c.save()
                      c.translate(cx, cy)
                      c.drawCircle(0f, 0f, rad, paints[i])
                      c.restore()
                  }
              }
          }

          /** Text with a flowing gradient. */
          class ShimmerText(ctx: Context) : TextView(ctx) {
              private var grad: LinearGradient? = null
              private val m = Matrix()
              private var shift = 0f
              private var anim: ValueAnimator? = null
              private var c2 = 0xFF22D3EE.toInt()
              private var c3 = 0xFF8B7BFF.toInt()

              fun setColors(a: Int, b: Int) { c2 = a; c3 = b; if (width > 0) build(width) }

              private fun build(w: Int) {
                  grad = LinearGradient(0f, 0f, w * 1.6f, 0f, intArrayOf(0xFFFFFFFF.toInt(), c2, c3, 0xFFFFFFFF.toInt()),
                      floatArrayOf(0f, 0.35f, 0.7f, 1f), Shader.TileMode.MIRROR)
                  paint.shader = grad
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { super.onSizeChanged(w, h, ow, oh); if (w > 0) build(w) }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 5200
                  a.repeatCount = ValueAnimator.INFINITE
                  a.interpolator = LinearInterpolator()
                  a.addUpdateListener { shift = it.animatedValue as Float; invalidate() }
                  a.start()
                  anim = a
              }

              override fun onDetachedFromWindow() { anim?.cancel(); anim = null; super.onDetachedFromWindow() }

              override fun onDraw(canvas: Canvas) {
                  val g = grad
                  if (g != null) { m.setTranslate(shift * width * 3.2f, 0f); g.setLocalMatrix(m) }
                  super.onDraw(canvas)
              }
          }

          /** Thin sweeping bar that shows background work. */
          class BusyBar(ctx: Context) : View(ctx) {
              private val p = Paint()
              private var t = 0f
              private var anim: ValueAnimator? = null
              private var a1 = 0xFF8B7BFF.toInt()
              private var a2 = 0xFF22D3EE.toInt()

              init { alpha = 0f }

              fun setColors(x: Int, y: Int) { a1 = x; a2 = y }

              fun setBusy(b: Boolean) {
                  if (b) {
                      animate().cancel()
                      animate().alpha(1f).setDuration(160).start()
                      if (anim == null) {
                          val a = ValueAnimator.ofFloat(0f, 1f)
                          a.duration = 1100
                          a.repeatCount = ValueAnimator.INFINITE
                          a.interpolator = LinearInterpolator()
                          a.addUpdateListener { t = it.animatedValue as Float; invalidate() }
                          a.start()
                          anim = a
                      }
                  } else {
                      animate().cancel()
                      animate().alpha(0f).setDuration(280).withEndAction { anim?.cancel(); anim = null }.start()
                  }
              }

              override fun onDetachedFromWindow() { anim?.cancel(); anim = null; super.onDetachedFromWindow() }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val seg = w * 0.42f
                  val x = -seg + t * (w + seg)
                  p.shader = LinearGradient(x, 0f, x + seg, 0f, intArrayOf(0x00000000, a1, a2, 0x00000000), floatArrayOf(0f, 0.3f, 0.7f, 1f), Shader.TileMode.CLAMP)
                  c.drawRect(x, 0f, x + seg, height.toFloat(), p)
              }
          }

          /** Expanding rings that confirm a tap. Never intercepts touches. */
          class PulseView(ctx: Context) : View(ctx) {
              private class Ring(val x: Float, val y: Float, val t0: Long, val color: Int)
              private val rings = ArrayList<Ring>()
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val d = resources.displayMetrics.density

              init { p.style = Paint.Style.STROKE }

              fun pulse(x: Float, y: Float, color: Int) {
                  rings.add(Ring(x, y, SystemClock.uptimeMillis(), color))
                  invalidate()
              }

              override fun onDraw(c: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  val iter = rings.iterator()
                  while (iter.hasNext()) {
                      val r = iter.next()
                      val f = (now - r.t0) / 650f
                      if (f >= 1f) { iter.remove(); continue }
                      val e = 1f - (1f - f) * (1f - f)
                      p.color = r.color
                      p.alpha = (200 * (1f - f)).toInt()
                      p.strokeWidth = (3f - 2f * f) * d
                      c.drawCircle(r.x, r.y, (8f + 46f * e) * d, p)
                      p.alpha = (110 * (1f - f)).toInt()
                      c.drawCircle(r.x, r.y, (4f + 26f * e) * d, p)
                  }
                  if (rings.isNotEmpty()) postInvalidateOnAnimation()
              }
          }
