          package com.lumen.studio

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.PointF
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.os.SystemClock
          import android.text.TextUtils
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.widget.LinearLayout
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin

          object NeonFont {
              const val SX = 0.88f
              val cond: Typeface = Typeface.create("sans-serif", Typeface.NORMAL)
              val condBold: Typeface = Typeface.create("sans-serif", Typeface.BOLD)
          }

          private fun withAlpha(c: Int, a: Float): Int = (c and 0xFFFFFF) or ((a.coerceIn(0f, 1f) * 255f).toInt() shl 24)

          /** Full-screen overlay (never takes touches) that draws tap bursts and the particles that fly into / out of sliders and side content. */
          class ParticleLayer(ctx: Context) : View(ctx) {
              private class P(val x0: Float, val y0: Float, val x1: Float, val y1: Float, val t0: Long, val dur: Long, val color: Int, val size: Float, val bulge: Float, val rev: Boolean)
              private val ps = ArrayList<P>()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rnd = java.util.Random()
              private val d = resources.displayMetrics.density

              override fun onTouchEvent(e: MotionEvent): Boolean = false

              fun burst(x: Float, y: Float, color: Int, n: Int = 14) {
                  val now = SystemClock.uptimeMillis()
                  for (i in 0 until n) {
                      val a = rnd.nextFloat() * 6.2831855f
                      val r = (14f + rnd.nextFloat() * 30f) * d
                      ps.add(P(x, y, x + cos(a) * r, y + sin(a) * r, now, 360L + rnd.nextInt(240), color, (1.2f + rnd.nextFloat() * 1.8f) * d, 0f, false))
                  }
                  invalidate()
              }

              /** Particles gather at [fx],[fy] and flow to the target points (reverse = they flow from the targets back to the origin). */
              fun morph(fx: Float, fy: Float, targets: List<PointF>, color: Int, dur: Long, reverse: Boolean) {
                  val now = SystemClock.uptimeMillis()
                  val span = (dur * 0.7f).toLong()
                  val lag = max(1, (dur - span).toInt())
                  for (t in targets) {
                      val st = now + rnd.nextInt(lag)
                      val bulge = (rnd.nextFloat() - 0.5f) * 70f * d
                      ps.add(P(fx + (rnd.nextFloat() - 0.5f) * 10f * d, fy + (rnd.nextFloat() - 0.5f) * 10f * d, t.x, t.y, st, span, color, (1.3f + rnd.nextFloat() * 1.7f) * d, bulge, reverse))
                  }
                  invalidate()
              }

              fun rectPoints(r: RectF, n: Int): List<PointF> {
                  val out = ArrayList<PointF>()
                  for (i in 0 until n) {
                      if (rnd.nextFloat() < 0.55f) {
                          val side = rnd.nextInt(4); val u = rnd.nextFloat()
                          out.add(when (side) { 0 -> PointF(r.left + u * r.width(), r.top); 1 -> PointF(r.left + u * r.width(), r.bottom); 2 -> PointF(r.left, r.top + u * r.height()); else -> PointF(r.right, r.top + u * r.height()) })
                      } else out.add(PointF(r.left + rnd.nextFloat() * r.width(), r.top + rnd.nextFloat() * r.height()))
                  }
                  return out
              }

              override fun onDraw(c: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  val it = ps.iterator()
                  while (it.hasNext()) {
                      val p = it.next()
                      val f = (now - p.t0).toFloat() / p.dur
                      if (f >= 1f) { it.remove(); continue }
                      val fc = f.coerceIn(0f, 1f)
                      val e = fc * fc * (3f - 2f * fc)
                      val pf = if (p.rev) 1f - e else e
                      var x = p.x0 + (p.x1 - p.x0) * pf
                      var y = p.y0 + (p.y1 - p.y0) * pf
                      if (p.bulge != 0f) {
                          val dx = p.x1 - p.x0; val dy = p.y1 - p.y0; val l = max(hypot(dx, dy), 1f)
                          val b = p.bulge * sin(Math.PI.toFloat() * e)
                          x += -dy / l * b; y += dx / l * b
                      }
                      val a = sin(Math.PI.toFloat() * fc).let { Math.sqrt(it.toDouble()).toFloat() }
                      paint.color = withAlpha(p.color, 0.28f * a); c.drawCircle(x, y, p.size * 2.6f, paint)
                      paint.color = withAlpha(0xFFFFFFFF.toInt(), 0.9f * a); c.drawCircle(x, y, p.size * 0.7f, paint)
                      paint.color = withAlpha(p.color, 0.9f * a); c.drawCircle(x, y, p.size, paint)
                  }
                  if (ps.isNotEmpty()) postInvalidateOnAnimation()
              }
          }

          /** Outline slider with glow, double-tap to reset. Horizontal or vertical (value grows upward). */
          class NeonSlider(ctx: Context, private val vertical: Boolean) : View(ctx) {
              var lo = 0; private set
              var hi = 100; private set
              var df = 0; private set
              var value = 0; private set
              var onChange: ((Int) -> Unit)? = null
              var onStop: (() -> Unit)? = null
              var onReset: (() -> Unit)? = null
              var onTick: (() -> Unit)? = null
              var onSnap: (() -> Unit)? = null

              private var accent = 0xFF8B7BFF.toInt()
              private var accent2 = 0xFF22D3EE.toInt()
              private val d = resources.displayMetrics.density
              private var shown = 0f
              private var press = 0f
              private var pressT = 0f
              private var dragging = false
              private var downPos = 0f
              private val slop = ViewConfiguration.get(ctx).scaledTouchSlop
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val gd = GestureDetector(ctx, object : GestureDetector.SimpleOnGestureListener() {
                  override fun onDown(e: MotionEvent): Boolean = true
                  override fun onDoubleTap(e: MotionEvent): Boolean {
                      value = df; dragging = false
                      onChange?.invoke(df); onReset?.invoke(); onStop?.invoke()
                      invalidate(); return true
                  }
              })

              fun configure(lo: Int, hi: Int, df: Int, a1: Int, a2: Int) {
                  this.lo = lo; this.hi = hi; this.df = df; accent = a1; accent2 = a2; invalidate()
              }

              fun setValue(v: Int, animate: Boolean) {
                  value = v.coerceIn(lo, hi)
                  if (!animate) shown = value.toFloat()
                  invalidate()
              }

              override fun onMeasure(w: Int, h: Int) {
                  if (vertical) setMeasuredDimension((54f * d).toInt(), resolveSize(suggestedMinimumHeight, h))
                  else setMeasuredDimension(resolveSize(suggestedMinimumWidth, w), (54f * d).toInt())
              }

              private fun len(): Float = if (vertical) height.toFloat() else width.toFloat()
              private fun thick(): Float = if (vertical) width.toFloat() else height.toFloat()
              private fun span() = (hi - lo).coerceAtLeast(1)
              private fun xOf(v: Float): Float = 18f * d + (v - lo) / span() * (len() - 36f * d)

              private fun glowRect(l: Float, t: Float, r: Float, b: Float, rad: Float, col: Int, base: Float) {
                  p.style = Paint.Style.STROKE
                  for (i in 0..2) {
                      p.strokeWidth = (2f + (3 - i) * 3f) * d
                      p.color = withAlpha(col, base * (0.35f + i * 0.35f) * 0.45f)
                      rect.set(l, t, r, b); canvas0?.drawRoundRect(rect, rad, rad, p)
                  }
                  p.strokeWidth = 1.4f * d; p.color = withAlpha(col, 0.95f)
                  rect.set(l, t, r, b); canvas0?.drawRoundRect(rect, rad, rad, p)
