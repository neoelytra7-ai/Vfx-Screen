              private fun showMenu() {
                  val items = arrayOf(
                      "Fit to screen", "Zoom to 100%", "Rotate right 90°", "Rotate left 90°",
                      "Copy all edits", "Paste edits", "Reset all edits", "Randomize look",
                      "Save current look…", "Export settings file", "Import settings file", "Edit summary", "Image info"
                  )
                  AlertDialog.Builder(this).setItems(items) { _, w ->
                      when (w) {
                          0 -> gl?.resetView()
                          1 -> gl?.oneToOne()
                          2 -> rotateSrc(90f)
                          3 -> rotateSrc(-90f)
                          4 -> { clip = Fx.snapshot(); snack("Copied " + clip!!.size + " settings") }
                          5 -> { val c = clip; if (c == null) snack("Nothing copied yet") else { Fx.applySnapshot(c); curLook = null; commitEdit(); afterBulk(); snack("Pasted") } }
                          6 -> resetAll()
                          7 -> AlertDialog.Builder(this).setTitle("Randomize").setItems(arrayOf("Subtle", "Medium", "Wild")) { _, s ->
                              Fx.randomize(floatArrayOf(0.5f, 1f, 1.6f)[s]); curLook = null; commitEdit(); afterBulk(); snack("Shuffled. Tap undo to go back")
                          }.show()
                          8 -> saveLookDialog()
                          9 -> {
                              val txt = Fx.dump()
                              ai.execute {
                                  val uri = Img.saveText(this, "Lumen_" + System.currentTimeMillis() + ".lumen", txt)
                                  status(if (uri != null) "Settings saved to Download/Lumen" else "Save failed")
                              }
                          }
                          10 -> pick(R_PRESET, "*/*")
                          11 -> showSummary()
                          12 -> showInfo()
                      }
                  }.show()
              }

              private fun resetAll() {
                  val go = { Fx.resetEdits(); curLook = null; commitEdit(); afterBulk(); snack("All edits reset") }
                  if (Fx.i("confirm_reset") == 1)
                      AlertDialog.Builder(this).setTitle("Reset all edits?").setMessage("App settings and cutouts are kept. You can undo this.")
                          .setPositiveButton("Reset") { _, _ -> go() }.setNegativeButton("Cancel", null).show()
                  else go()
              }

              private fun rotateSrc(deg: Float) {
                  val s = src ?: run { snack("Open a photo first"); return }
                  status("Rotating…")
                  ai.execute {
                      val m = Matrix()
                      m.postRotate(deg)
                      val b = Bitmap.createBitmap(s, 0, 0, s.width, s.height, m, true)
                      ui.post {
                          src = b; depth = null; maskBase = null; maskOut = null; maskGuide = null; subject = null; composeBase = null
                          clearFace(); pushAll(); gl?.resetView()
                          status("Rotated. Depth map and cutout were cleared, run them again if needed")
                      }
