              fun par(n: Int, f: (Int) -> Unit) { IntStream.range(0, n).parallel().forEach { f(it) } }

              /** Mean filter with radius r (edge-normalised), separable running sums. */
              fun box(a: FloatArray, w: Int, h: Int, r: Int): FloatArray {
                  val t = FloatArray(a.size); val o = FloatArray(a.size)
                  par(h) { y ->
                      val b = y * w; var s = 0.0; var n = 0
                      for (x in 0..minOf(r, w - 1)) { s += a[b + x]; n++ }
                      for (x in 0 until w) {
                          t[b + x] = (s / n).toFloat()
                          val add = x + r + 1; val rem = x - r
                          if (add < w) { s += a[b + add]; n++ }
                          if (rem >= 0) { s -= a[b + rem]; n-- }
                      }
                  }
                  par(w) { x ->
                      var s = 0.0; var n = 0
                      for (y in 0..minOf(r, h - 1)) { s += t[y * w + x]; n++ }
                      for (y in 0 until h) {
                          o[y * w + x] = (s / n).toFloat()
                          val add = y + r + 1; val rem = y - r
                          if (add < h) { s += t[add * w + x]; n++ }
                          if (rem >= 0) { s -= t[rem * w + x]; n-- }
                      }
                  }
                  return o
              }

              /** Edge-aware refinement of [p] guided by [g] (He et al. guided filter). */
              fun guided(p: FloatArray, g: FloatArray, w: Int, h: Int, r: Int, eps: Float): FloatArray {
                  val n = p.size
                  val mg = box(g, w, h, r); val mp = box(p, w, h, r)
                  val gg = FloatArray(n) { g[it] * g[it] }; val gp = FloatArray(n) { g[it] * p[it] }
                  val cg = box(gg, w, h, r); val cp = box(gp, w, h, r)
                  val a = FloatArray(n); val b = FloatArray(n)
                  for (i in 0 until n) { val v = cg[i] - mg[i] * mg[i]; val c = cp[i] - mg[i] * mp[i]; a[i] = c / (v + eps); b[i] = mp[i] - a[i] * mg[i] }
                  val ma = box(a, w, h, r); val mb = box(b, w, h, r)
                  return FloatArray(n) { (ma[it] * g[it] + mb[it]).coerceIn(0f, 1f) }
              }

