                  Cat("DEPTH", listOf("Depth", "Parallax")),
                  Cat("CUT", listOf("Cutout", "Masked", "Compose")),
                  Cat("STYLE", listOf("Stylize", "Retro")),
                  Cat("MORE", listOf("Overlay", "Export", "Watermark", "Models", "Settings"))
              )
              private val SPECIAL = setOf("Looks", "Favs", "Search", "HSL", "Models", "Templates")

              private var curCat = 0
              private var selItem: S? = null
              private var fine = false
              private var particles: ParticleLayer? = null
              private var toolbarRow: LinearLayout? = null
              private var subRow: LinearLayout? = null
              private var subScroll: HorizontalScrollView? = null
              private var toolScroll: HorizontalScrollView? = null
              private var leftRail: LinearLayout? = null
              private var rightRail: LinearLayout? = null
              private var leftScroll: ScrollView? = null
              private var rightScroll: ScrollView? = null
              private var sliderPanel: GlowFrame? = null
              private var specialHost: GlowFrame? = null
              private var fineLayer: FrameLayout? = null
              private val chips = ArrayList<Pair<S, ParamChip>>()
              private var sliderRefresh: (() -> Unit)? = null
              private var faceLoading = false
              private var faceWarned = false
              private var lastMkSig = ""
              private val faceEx = Executors.newSingleThreadExecutor()
              private val warpTask = Runnable { faceEx.execute { try { warpNow() } catch (e: Throwable) { status("Reshape failed: ${e.message}") } } }
              private val makeupTask = Runnable { faceEx.execute { try { makeupNow() } catch (e: Throwable) { status("Makeup failed: ${e.message}") } } }

              /** Reshape sliders of a single face are stored under f1_… f4_; the tab list only contains the "all faces" keys. */
              private fun ek(k: String): String {
                  if (k.startsWith("fa_")) { val t = Fx.i("face_sel"); if (t in 1..4) return "f${t}_" + k.substring(3) }
                  return k
              }

              private fun globalXY(v: View): PointF { val a = IntArray(2); v.getLocationInWindow(a); return PointF(a[0] + v.width / 2f, a[1] + v.height / 2f) }
              private fun winRect(v: View): RectF { val a = IntArray(2); v.getLocationInWindow(a); return RectF(a[0].toFloat(), a[1].toFloat(), (a[0] + v.width).toFloat(), (a[1] + v.height).toFloat()) }

              private fun tapFx(v: View) { val c = globalXY(v); particles?.burst(c.x, c.y, cAccent2); v.hap(HapticFeedbackConstants.VIRTUAL_KEY) }

              private fun showEditor() {
                  inEditor = true
                  stopHomeAnims()
                  chips.clear(); selItem = null; fine = false
                  val f = FrameLayout(this)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(cBg)

                  val bar = LinearLayout(this)
                  bar.gravity = Gravity.CENTER_VERTICAL
                  bar.setPadding(dp(10), dp(34), dp(10), dp(6))
                  fun barBtn(t: String, bold: Boolean = false): TextView = tv(t, 14f, cText, bold).apply {
                      setPadding(dp(11), dp(8), dp(11), dp(8)); background = rr(0x14FFFFFF, 16, 0x33FFFFFF)
                      typeface = if (bold) NeonFont.condBold else NeonFont.cond; textScaleX = NeonFont.SX
                  }
                  val badge = tv("ORIGINAL", 11f, Color.WHITE, true).apply { setPadding(dp(10), dp(5), dp(10), dp(5)); background = rr(0xAA000000.toInt(), 10); alpha = 0f }
                  val back = barBtn("←"); press(back); back.setOnClickListener { showHome() }
                  val undo = barBtn("↶"); press(undo); undo.setOnClickListener { doUndo() }
                  val redo = barBtn("↷"); press(redo); redo.setOnClickListener { doRedo() }
                  val more = barBtn("⋯"); press(more); more.setOnClickListener { showMenu() }
                  undoBtn = undo; redoBtn = redo
                  val cmp = barBtn("Compare"); press(cmp)
                  cmp.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              gl?.r?.compare = true; gl?.requestRender()
                              v.animate().scaleX(0.95f).scaleY(0.95f).setStartDelay(0).setDuration(80).start()
                              badge.scaleX = 0.85f; badge.scaleY = 0.85f
                              badge.animate().alpha(1f).scaleX(1f).scaleY(1f).setStartDelay(0).setDuration(170).setInterpolator(OvershootInterpolator(2f)).start()
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              gl?.r?.compare = false; gl?.requestRender()
                              v.animate().scaleX(1f).scaleY(1f).setStartDelay(0).setDuration(200).start()
                              badge.animate().alpha(0f).setStartDelay(0).setDuration(220).start()
                          }
                      }
                      true
                  }
                  val exp = barBtn("Export", true); press(exp)
                  exp.setTextColor(cAccent2)
                  exp.setOnClickListener { pulseOn(it); askExport() }
                  bar.addView(back)
                  bar.addView(undo, lp(WC, WC).apply { leftMargin = dp(6) })
                  bar.addView(redo, lp(WC, WC).apply { leftMargin = dp(6) })
                  bar.addView(more, lp(WC, WC).apply { leftMargin = dp(6) })
                  bar.addView(View(this), lp(0, 1, 1f))
                  bar.addView(cmp, lp(WC, WC).apply { rightMargin = dp(8) })
                  bar.addView(exp)
                  root.addView(bar)

                  val busy = BusyBar(this); busy.setColors(cAccent, cAccent2); busyBar = busy
                  root.addView(busy, lp(MP, dp(3)))

                  val g = GradeView(this)
                  gl = g
                  g.r.onError = { m -> ui.post { statusTv?.text = m } }
                  g.onBrush = { u, v, ph -> brush(u, v, ph) }
                  g.onTap = { u, v -> pulseAtTap(); handleTap(u, v) }
                  root.addView(g, lp(MP, 0, 1f))

                  val st = tv("", 12f, cMuted).apply { setPadding(dp(14), dp(3), dp(14), dp(2)); typeface = NeonFont.cond; textScaleX = NeonFont.SX }
                  statusTv = st
                  root.addView(st)

                  // ---- sub menu (horizontal, regular condensed) and toolbar (bold condensed)
                  val sub = HorizontalScrollView(this)
                  sub.isHorizontalScrollBarEnabled = false; sub.overScrollMode = View.OVER_SCROLL_NEVER
                  val subR = LinearLayout(this); subR.setPadding(dp(6), 0, dp(6), 0)
                  sub.addView(subR); subScroll = sub; subRow = subR
                  root.addView(sub, lp(MP, dp(40)))
                  val tb = HorizontalScrollView(this)
                  tb.isHorizontalScrollBarEnabled = false; tb.overScrollMode = View.OVER_SCROLL_NEVER
                  tb.setBackgroundColor(0xFF0C1018.toInt())
                  val tbR = LinearLayout(this); tbR.setPadding(dp(4), 0, dp(4), dp(4))
                  tb.addView(tbR); toolScroll = tb; toolbarRow = tbR
                  for ((i, cat) in CATS.withIndex()) {
                      val t = FxText(this); t.text = cat.name; t.sizeSp = 14.5f; t.bold = true; t.spacing = 1.1f
                      t.glow = cAccent2; t.colorOff = 0xFFA3AEBF.toInt()
                      t.setOnClickListener { tapFx(it); (it as FxText).kick(); openCat(i, it) }
                      tbR.addView(t, lp(WC, dp(44)))
                  }
                  root.addView(tb, lp(MP, dp(48)))
                  f.addView(root, FrameLayout.LayoutParams(MP, MP))

                  // ---- side rails (icons of the open sub menu)
                  fun rail(left: Boolean): Pair<ScrollView, LinearLayout> {
                      val sv = ScrollView(this); sv.isVerticalScrollBarEnabled = false; sv.overScrollMode = View.OVER_SCROLL_NEVER
                      val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL; col.gravity = Gravity.CENTER_HORIZONTAL
                      sv.addView(col, FrameLayout.LayoutParams(dp(52), WC))
                      val lpm = FrameLayout.LayoutParams(dp(52), MP, if (left) Gravity.START else Gravity.END)
                      lpm.topMargin = dp(98); lpm.bottomMargin = dp(246); lpm.leftMargin = 0; lpm.rightMargin = 0
                      f.addView(sv, lpm)
                      return sv to col
                  }
                  val l = rail(true); leftScroll = l.first; leftRail = l.second
                  val r = rail(false); rightScroll = r.first; rightRail = r.second

                  // ---- special panel (looks, favorites, search, HSL, models, templates)
                  val sp = GlowFrame(this); sp.orientation = LinearLayout.VERTICAL; sp.color = cAccent; sp.strength = 0.45f; sp.fill = 0xE60A0E16.toInt()
                  sp.setPadding(dp(10), dp(10), dp(10), dp(10))
                  val sv = ScrollView(this); sv.overScrollMode = View.OVER_SCROLL_NEVER; sv.isVerticalScrollBarEnabled = false
                  panelScroll = sv
                  panel = LinearLayout(this); panel.orientation = LinearLayout.VERTICAL; panel.setPadding(dp(8), dp(2), dp(8), dp(8))
                  sv.addView(panel)
                  sp.addView(sv, lp(MP, MP))
                  sp.visibility = View.GONE; specialHost = sp
                  val splp = FrameLayout.LayoutParams(MP, dp(300), Gravity.BOTTOM); splp.bottomMargin = dp(94); splp.leftMargin = dp(6); splp.rightMargin = dp(6)
                  f.addView(sp, splp)

                  // ---- slider panel
                  val spn = GlowFrame(this); spn.orientation = LinearLayout.VERTICAL; spn.color = cAccent; spn.strength = 0.55f; spn.fill = 0xEE070A10.toInt()
                  spn.setPadding(dp(14), dp(10), dp(14), dp(8)); spn.visibility = View.GONE; sliderPanel = spn
                  val splp2 = FrameLayout.LayoutParams(MP, WC, Gravity.BOTTOM); splp2.bottomMargin = dp(94); splp2.leftMargin = dp(6); splp2.rightMargin = dp(6)
                  f.addView(spn, splp2)

                  // ---- fine tune layer
                  val fl = FrameLayout(this); fl.visibility = View.GONE; fineLayer = fl
                  f.addView(fl, FrameLayout.LayoutParams(MP, MP).apply { topMargin = dp(92); bottomMargin = dp(100) })

                  val cur = View(this); cur.setBackgroundColor(cBg); curtain = cur
                  f.addView(cur, FrameLayout.LayoutParams(MP, MP))
                  val hv = HistView(this); histView = hv
                  f.addView(hv, FrameLayout.LayoutParams(dp(132), dp(54), Gravity.TOP or Gravity.START).apply { topMargin = dp(98); leftMargin = dp(70) })
                  val pv = PulseView(this); pulseView = pv
                  f.addView(pv, FrameLayout.LayoutParams(MP, MP))
                  val pl = ParticleLayer(this); particles = pl
                  f.addView(pl, FrameLayout.LayoutParams(MP, MP))
                  f.addView(badge, FrameLayout.LayoutParams(WC, WC, Gravity.TOP or Gravity.END).apply { topMargin = dp(98); rightMargin = dp(70) })
                  val sn = mkSnack(); snackTv = sn
                  val slp = FrameLayout.LayoutParams(WC, WC, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL); slp.bottomMargin = dp(110)
                  f.addView(sn, slp)
                  frame = f
                  setContentView(f)
                  updateUndo()
                  pushAll()
                  if (src == null) { cur.visibility = View.GONE; status("Open a photo to begin") } else revealImage()
                  bar.alpha = 0f; bar.translationY = -dp(18).toFloat()
                  bar.animate().alpha(1f).translationY(0f).setStartDelay(0).setDuration(420).setInterpolator(DecelerateInterpolator(1.6f)).start()
                  tb.alpha = 0f; tb.animate().alpha(1f).setStartDelay(160).setDuration(380).start()
                  val ci = CATS.indexOfFirst { it.subs.contains(curTool) }.let { if (it < 0) 0 else it }
                  curCat = ci
                  buildSubMenu(null)
                  showTool(curTool)
                  updateChips()
              }

              private fun openCat(i: Int, from: View?) {
                  if (i == curCat && (subRow?.childCount ?: 0) > 0) { return }
                  curCat = i
                  val cat = CATS[i]
                  buildSubMenu(from)
                  showTool(if (cat.subs.contains(curTool)) curTool else cat.subs[0], from)
              }

              private fun buildSubMenu(from: View?) {
                  val row = subRow ?: return
                  row.removeAllViews()
                  val cat = CATS[curCat]
                  for ((i, name) in cat.subs.withIndex()) {
                      val t = FxText(this); t.text = name; t.sizeSp = 13.5f; t.bold = false; t.spacing = 0.4f
                      t.glow = cAccent2; t.colorOff = 0xFFB4BFCE.toInt()
                      t.active = name == curTool
                      t.setOnClickListener { tapFx(it); (it as FxText).kick(); showTool(name, it) }
                      t.alpha = 0f; t.translationY = dp(10).toFloat()
                      t.animate().alpha(1f).translationY(0f).setStartDelay(i * 28L).setDuration(260).start()
                      row.addView(t, lp(WC, dp(40)))
                  }
                  // toolbar highlight
                  val tr = toolbarRow
                  if (tr != null) for (i in 0 until tr.childCount) (tr.getChildAt(i) as? FxText)?.active = i == curCat
                  toolScroll?.let { s -> val c = tr?.getChildAt(curCat); if (c != null) c.post { s.smoothScrollTo(max(0, c.left - s.width / 2 + c.width / 2), 0) } }
              }

              private fun markSub() {
                  val row = subRow ?: return
                  for (i in 0 until row.childCount) (row.getChildAt(i) as? FxText)?.let { t -> t.active = t.text == curTool; if (t.active) subScroll?.let { s -> t.post { s.smoothScrollTo(max(0, t.left - s.width / 2 + t.width / 2), 0) } } }
              }

              private fun updateChips() {
                  val tr = toolbarRow
                  if (tr != null) for ((i, cat) in CATS.withIndex()) {
                      val keys = cat.subs.flatMap { n -> if (n == "HSL") Fx.hsl.map { it.key } else (Fx.tools[n]?.filter { it !is Ac }?.map { it.key } ?: emptyList()) }
                      (tr.getChildAt(i) as? FxText)?.badge = keys.isNotEmpty() && Fx.anyEdited(keys)
                  }
                  val row = subRow
                  if (row != null) for (i in 0 until row.childCount) {
                      val t = row.getChildAt(i) as? FxText ?: continue
                      val n = t.text
                      val keys = if (n == "HSL") Fx.hsl.map { it.key } else (Fx.tools[n]?.filter { it !is Ac }?.map { it.key } ?: emptyList())
                      t.badge = keys.isNotEmpty() && Fx.anyEdited(keys.map { ek(it) })
                  }
                  for ((s, c) in chips) refreshChip(s, c)
              }

              private fun refreshChip(s: S, c: ParamChip) {
                  val k = ek(s.key)
                  val m = Fx.find(k) ?: s
                  when (m) {
                      is Sl -> { val v = Fx.i(k); c.edited = v != m.def; val half = max(1, max(abs(m.max - m.def), abs(m.def - m.min))); c.norm = ((v - m.def).toFloat() / half).coerceIn(-1f, 1f) }
                      is Tg -> { c.edited = Fx.i(k) == 1; c.norm = if (c.edited) 1f else 0f }
                      is Ch -> { c.edited = Fx.i(k) != m.def; c.norm = if (c.edited) 1f else 0f }
                      else -> { c.edited = false }
                  }
                  c.invalidate()
              }

              /** Opens a sub menu: the rails are rebuilt and their icons are assembled from particles that fly out of the tapped sub menu label. */
              private fun showTool(name: String, from: View? = null) {
                  val changed = name != curTool || chips.isEmpty()
                  curTool = name
                  refreshers.clear()
                  closeSlider(false)
                  if (fine) leaveFine(false)
                  markSub()
                  val special = SPECIAL.contains(name)
                  val hasRails = !special
                  specialHost?.let { h ->
                      if (special) {
                          panel.removeAllViews(); lookChips.clear()
                          when (name) {
                              "Looks" -> looksPanel()
                              "Favs" -> favsPanel()
                              "Search" -> searchPanel()
                              "HSL" -> hslPanel()
                              "Models" -> modelsPanel(panel)
                              "Templates" -> templatesPanel()
                          }
                          if (h.visibility != View.VISIBLE) { h.visibility = View.VISIBLE; h.alpha = 0f; h.translationY = dp(30).toFloat(); h.animate().alpha(1f).translationY(0f).setDuration(300).start() }
                          panelScroll?.scrollTo(0, 0)
                          if (from != null) { val c = globalXY(from); val r = winRect(h); particles?.morph(c.x, c.y, particles!!.rectPoints(r, 50), cAccent2, 420, false) }
                      } else if (h.visibility == View.VISIBLE) { h.animate().alpha(0f).setDuration(160).withEndAction { h.visibility = View.GONE }.start() }
                  }
                  buildRails(if (hasRails) (Fx.tools[name] ?: emptyList()) else emptyList(), from, changed)
                  updateChips()
              }

              private fun buildRails(items: List<S>, from: View?, animate: Boolean) {
                  val lc = leftRail ?: return; val rc = rightRail ?: return
                  lc.removeAllViews(); rc.removeAllViews(); chips.clear()
                  if (items.isEmpty()) return
                  val half = (items.size + 1) / 2
                  val all = ArrayList<ParamChip>()
                  for ((i, s) in items.withIndex()) {
                      val c = ParamChip(this)
                      c.accent = cAccent; c.accent2 = cAccent2
                      c.title = (if (s is Ac) s.title.replace("Generate ", "").replace("Export ", "") else s.title)
                      if (s is Ac) { c.edited = false }
                      c.setOnClickListener { tapFx(it); selectItem(s, c) }
                      chips.add(s to c); all.add(c)
                      (if (i < half) lc else rc).addView(c, lp(dp(52), dp(64)))
                      refreshChip(s, c)
                      if (animate) { c.alpha = 0f; c.scaleX = 0.4f; c.scaleY = 0.4f }
                  }
                  if (animate) {
                      val fx = from?.let { globalXY(it) } ?: PointF(resources.displayMetrics.widthPixels / 2f, resources.displayMetrics.heightPixels - dp(70).toFloat())
                      leftRail?.post {
                          val pts = ArrayList<PointF>()
                          for (c in all) pts.add(globalXY(c))
                          particles?.morph(fx.x, fx.y, pts, cAccent2, 520, false)
                          for ((i, c) in all.withIndex()) c.animate().alpha(1f).scaleX(1f).scaleY(1f).setStartDelay(220L + min(i, 12) * 14L).setDuration(300).setInterpolator(OvershootInterpolator(1.6f)).start()
                      }
                  }
              }

              private fun selectItem(s: S, chip: ParamChip) {
                  selItem = s
                  for ((_, c) in chips) c.sel = c === chip
                  if (fine) { fineFill(); return }
                  openSlider(s, chip)
              }

              private fun moveSel(dir: Int) {
                  val i = chips.indexOfFirst { it.first === selItem }
                  if (i < 0) return
                  val n = ((i + dir) % chips.size + chips.size) % chips.size
                  val (s, c) = chips[n]
                  selItem = s
                  for ((_, cc) in chips) cc.sel = cc === c
                  val par = c.parent as? View
                  if (par != null) { (c.parent as? LinearLayout)?.let { col -> (col.parent as? ScrollView)?.smoothScrollTo(0, max(0, c.top - dp(80))) } }
                  if (fine) { fineFill(); return }
                  openSlider(s, c, true)
              }

              // ---------------------------------------------------------------- slider panel
              private fun closeSlider(animate: Boolean) {
                  val p = sliderPanel ?: return
                  for ((_, c) in chips) c.sel = false
                  if (p.visibility != View.VISIBLE) return
                  if (animate) {
                      val c = chips.firstOrNull { it.first === selItem }?.second
                      if (c != null) { val a = globalXY(c); particles?.morph(a.x, a.y, particles!!.rectPoints(winRect(p), 40), cAccent2, 320, true) }
                      p.animate().alpha(0f).setDuration(220).withEndAction { p.visibility = View.GONE }.start()
                  } else { p.animate().cancel(); p.visibility = View.GONE }
                  selItem = null
              }

              private fun openSlider(s: S, from: View, quiet: Boolean = false) {
                  val p = sliderPanel ?: return
                  val key = ek(s.key)
                  val item = Fx.find(key) ?: s
                  p.removeAllViews()
                  val top = LinearLayout(this); top.gravity = Gravity.CENTER_VERTICAL
                  val title = FxText(this); title.text = s.title; title.sizeSp = 15f; title.bold = true; title.active = true; title.glow = cAccent2; title.colorOn = cText; title.setPadding(0, 0, 0, 0)
                  top.addView(title, lp(WC, dp(26)))
                  top.addView(View(this), lp(0, 1, 1f))
                  fun nav(t: String, d: Int): TextView = tv(t, 15f, cAccent2).apply {
                      gravity = Gravity.CENTER; typeface = NeonFont.cond; textScaleX = NeonFont.SX
                      background = rr(0x11000000, 9, 0xAA000000.toInt() or (cAccent2 and 0xFFFFFF)); minWidth = dp(30); minHeight = dp(24); setPadding(dp(6), 0, dp(6), 0)
                      setOnClickListener { tapFx(it); moveSel(d) }
                  }
                  top.addView(nav("‹", -1), lp(dp(32), dp(24)))
                  top.addView(nav("›", 1), lp(dp(32), dp(24)).apply { leftMargin = dp(6) })
                  p.addView(top, lp(MP, WC))
                  val body = LinearLayout(this); body.gravity = Gravity.CENTER_VERTICAL
                  when (item) {
                      is Sl -> {
                          val ns = NeonSlider(this, false)
                          ns.configure(item.min, item.max, item.def, cAccent, cAccent2)
                          ns.setValue(Fx.i(key), false)
                          val pill = tv("", 15f, cAccent2, true).apply { gravity = Gravity.CENTER; typeface = NeonFont.condBold; textScaleX = NeonFont.SX; minWidth = dp(64); setPadding(dp(8), dp(5), dp(8), dp(5)); background = rr(0x22000000, 12, 0xCC000000.toInt() or (cAccent2 and 0xFFFFFF)); setShadowLayer(dp(6).toFloat(), 0f, 0f, cAccent2) }
                          fun upd() { pill.text = item.show(Fx.i(key)) }
                          upd()
                          ns.onChange = { v -> Fx.set(key, v); upd(); onParam(key); chips.firstOrNull { it.first === s }?.let { refreshChip(it.first, it.second) } }
                          ns.onTick = { val now = SystemClock.uptimeMillis(); if (now - lastTick > 40) { lastTick = now; ns.hap(HapticFeedbackConstants.CLOCK_TICK) } }
                          ns.onSnap = { lastTick = SystemClock.uptimeMillis(); ns.hap(HapticFeedbackConstants.LONG_PRESS) }
                          ns.onStop = { commitEdit(); updateChips() }
                          ns.onReset = { ns.hap(HapticFeedbackConstants.LONG_PRESS); particles?.let { pr -> val c = globalXY(pill); pr.burst(c.x, c.y, cAccent2, 18) }; Fx.resetKey(key); onParam(key); upd(); updateChips() }
                          pill.setOnClickListener { tapFx(it); enterFine() }
                          sliderRefresh = { ns.setValue(Fx.i(key), true); upd() }
                          body.addView(ns, lp(0, WC, 1f))
                          body.addView(pill, lp(WC, WC).apply { leftMargin = dp(8) })
                      }
                      is Ch -> {
                          val hs = HorizontalScrollView(this); hs.isHorizontalScrollBarEnabled = false
                          val row = LinearLayout(this)
                          val its = ArrayList<TextView>()
                          fun paint() { for ((i, t) in its.withIndex()) { val on = i == Fx.i(key); t.setTextColor(if (on) Color.WHITE else cMuted); t.background = if (on) rr(0x33000000 or (cAccent and 0xFFFFFF), 14, cAccent2) else rr(0x14FFFFFF, 14, 0x33FFFFFF) } }
                          item.options.forEachIndexed { i, name ->
                              val t = tv(name, 13.5f, cMuted).apply { typeface = NeonFont.cond; textScaleX = NeonFont.SX; setPadding(dp(13), dp(7), dp(13), dp(7)) }
                              t.setOnClickListener { tapFx(it); Fx.set(key, i); paint(); onParam(key); commitEdit(); updateChips() }
                              its.add(t); row.addView(t, lp(WC, WC).apply { rightMargin = dp(8) })
                          }
                          paint(); hs.addView(row)
                          sliderRefresh = { paint() }
                          body.addView(hs, lp(0, WC, 1f))
                          body.addView(tv("↺", 20f, cMuted).apply { setPadding(dp(10), 0, dp(4), 0); setOnClickListener { tapFx(it); Fx.resetKey(key); onParam(key); commitEdit(); paint(); updateChips() } })
                      }
                      is Tg -> {
                          val sw = FluidSwitch(this); sw.setAccent(cAccent2); sw.setChecked(Fx.i(key) == 1, false)
                          sw.onToggle = { on -> Fx.set(key, if (on) 1 else 0); sw.hapToggle(on); onParam(key); commitEdit(); updateChips() }
                          sliderRefresh = { sw.setChecked(Fx.i(key) == 1, true) }
                          body.addView(tv(if (Fx.i(key) == 1) "On / off" else "On / off", 14f, cMuted).apply { typeface = NeonFont.cond; textScaleX = NeonFont.SX }, lp(0, WC, 1f))
                          body.addView(sw)
                      }
                      is Ac -> {
                          val b = tv(item.title, 15f, cAccent2, true).apply {
                              gravity = Gravity.CENTER; typeface = NeonFont.condBold; textScaleX = NeonFont.SX; setPadding(0, dp(11), 0, dp(11))
                              background = rr(0x14000000, 14, 0xCC000000.toInt() or (cAccent2 and 0xFFFFFF)); setShadowLayer(dp(6).toFloat(), 0f, 0f, cAccent2)
                          }
                          b.setOnClickListener { tapFx(it); pulseOn(it); act(item.key) }
                          sliderRefresh = null
                          body.addView(b, lp(0, WC, 1f))
                      }
                  }
                  p.addView(body, lp(MP, WC).apply { topMargin = dp(4) })
                  // hint for face-reshape ends
                  val ends = FaceDefs.ends[key]
                  if (ends != null && item is Sl) {
                      val hint = LinearLayout(this)
                      hint.addView(tv(ends.first, 11f, cMuted).apply { typeface = NeonFont.cond; textScaleX = NeonFont.SX }, lp(0, WC, 1f))
                      hint.addView(tv(ends.second, 11f, cMuted).apply { typeface = NeonFont.cond; textScaleX = NeonFont.SX })
                      p.addView(hint, lp(MP, WC).apply { leftMargin = dp(6); rightMargin = dp(76) })
                  }
                  if (p.visibility != View.VISIBLE) {
                      p.visibility = View.VISIBLE; p.alpha = 0f
                      val c = globalXY(from)
                      p.post {
                          particles?.morph(c.x, c.y, particles!!.rectPoints(winRect(p), 56), cAccent2, 420, false)
                          p.animate().alpha(1f).setStartDelay(160).setDuration(280).start()
                      }
                  } else if (!quiet) { p.alpha = 1f } else {
                      p.alpha = 0.3f; p.animate().alpha(1f).setStartDelay(0).setDuration(180).start()
                  }
              }

              // ---------------------------------------------------------------- fine tune: vertical slider on the right, content listed on the left
              private fun enterFine() {
                  val s = selItem ?: return
                  if (Fx.find(ek(s.key)) !is Sl) return
                  fine = true
                  val fl = fineLayer ?: return
                  fl.removeAllViews()
                  for (v in listOf(leftScroll, rightScroll)) v?.animate()?.alpha(0f)?.setDuration(180)?.start()
                  fl.visibility = View.VISIBLE
                  fineFill()
                  fl.alpha = 0f; fl.animate().alpha(1f).setStartDelay(120).setDuration(260).start()
                  post2 { particles?.let { pr -> val sv = fl.getChildAt(1); if (sv != null) { val vv = winRect(sv); val c = PointF(vv.centerX(), vv.bottom); pr.morph(c.x, c.y, pr.rectPoints(vv, 50), cAccent2, 480, false) } } }
              }

              private fun post2(r: () -> Unit) { ui.post(r) }

              private fun fineFill() {
                  val fl = fineLayer ?: return
                  val s = selItem ?: return
                  val key = ek(s.key)
                  val item = Fx.find(key) as? Sl ?: return
                  fl.removeAllViews()
                  // left: vertical outline/glow list of the sub menu content
                  val sv = ScrollView(this); sv.isVerticalScrollBarEnabled = false; sv.overScrollMode = View.OVER_SCROLL_NEVER
                  val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL
                  for ((si, _) in chips) {
                      if (si !is Sl) continue
                      val on = si === s
                      val gf = GlowFrame(this); gf.orientation = LinearLayout.HORIZONTAL; gf.color = if (on) cAccent2 else cAccent; gf.strength = if (on) 0.95f else 0.3f; gf.cornerDp = 12f; gf.fill = if (on) 0xCC0B1118.toInt() else 0x880A0E16.toInt()
                      gf.setPadding(dp(10), dp(6), dp(10), dp(6))
                      val t = FxText(this); t.text = si.title; t.sizeSp = 13.5f; t.bold = on; t.active = on; t.glow = cAccent2; t.colorOn = Color.WHITE; t.colorOff = 0xFFB4BFCE.toInt(); t.setPadding(dp(2), 0, dp(2), 0)
                      gf.addView(t, lp(WC, dp(26)))
                      gf.setOnClickListener { v ->
                          tapFx(v)
                          selItem = si
                          for ((_, cc) in this@MainActivity.chips) cc.sel = cc.title == si.title
                          fineFill()
                      }
                      col.addView(gf, lp(MP, WC).apply { bottomMargin = dp(2) })
                  }
                  sv.addView(col)
                  fl.addView(sv, FrameLayout.LayoutParams(dp(150), MP, Gravity.START).apply { leftMargin = dp(6) })
                  // right: vertical slider, value, done
                  val right = LinearLayout(this); right.orientation = LinearLayout.VERTICAL; right.gravity = Gravity.CENTER_HORIZONTAL
                  val valTv = tv(item.show(Fx.i(key)), 20f, cAccent2, true).apply { typeface = NeonFont.condBold; textScaleX = NeonFont.SX; setShadowLayer(dp(8).toFloat(), 0f, 0f, cAccent2); gravity = Gravity.CENTER }
                  right.addView(valTv, lp(WC, WC))
                  val ns = NeonSlider(this, true)
                  ns.configure(item.min, item.max, item.def, cAccent, cAccent2); ns.setValue(Fx.i(key), false)
                  ns.onChange = { v -> Fx.set(key, v); valTv.text = item.show(v); onParam(key) }
                  ns.onTick = { val now = SystemClock.uptimeMillis(); if (now - lastTick > 40) { lastTick = now; ns.hap(HapticFeedbackConstants.CLOCK_TICK) } }
                  ns.onStop = { commitEdit(); updateChips() }
                  ns.onReset = { Fx.resetKey(key); onParam(key); valTv.text = item.show(Fx.i(key)); updateChips() }
                  sliderRefresh = { ns.setValue(Fx.i(key), true); valTv.text = item.show(Fx.i(key)) }
                  right.addView(ns, lp(dp(54), 0, 1f).apply { topMargin = dp(6); bottomMargin = dp(8) })
                  val done = tv("DONE", 14f, cAccent2, true).apply {
                      gravity = Gravity.CENTER; typeface = NeonFont.condBold; textScaleX = NeonFont.SX; setPadding(dp(18), dp(9), dp(18), dp(9)); letterSpacing = 0.12f
                      background = rr(0x22000000, 14, 0xCC000000.toInt() or (cAccent2 and 0xFFFFFF)); setShadowLayer(dp(7).toFloat(), 0f, 0f, cAccent2)
                  }
                  done.setOnClickListener { tapFx(it); leaveFine(true) }
                  right.addView(done, lp(WC, WC))
                  fl.addView(right, FrameLayout.LayoutParams(dp(92), MP, Gravity.END).apply { rightMargin = dp(6) })
                  // keep the horizontal panel in step
                  sliderPanel?.let { if (it.visibility == View.VISIBLE) { val c = chips.firstOrNull { p -> p.first === s }?.second; if (c != null) openSlider(s, c, true) } }
                  sliderRefresh = { ns.setValue(Fx.i(key), true); valTv.text = item.show(Fx.i(key)) }
              }

              private fun leaveFine(animate: Boolean) {
                  if (!fine) return
                  fine = false
                  val fl = fineLayer ?: return
                  if (animate) {
                      val sv = fl.getChildAt(1)
                      if (sv != null) { val vv = winRect(sv); particles?.morph(vv.centerX(), vv.bottom, particles!!.rectPoints(vv, 40), cAccent2, 340, true) }
                      fl.animate().alpha(0f).setStartDelay(0).setDuration(240).withEndAction { fl.visibility = View.GONE; fl.removeAllViews() }.start()
                  } else { fl.animate().cancel(); fl.visibility = View.GONE; fl.removeAllViews() }
                  for (v in listOf(leftScroll, rightScroll)) v?.animate()?.alpha(1f)?.setStartDelay(animate.let { if (it) 200L else 0L })?.setDuration(260)?.start()
                  sliderRefresh = null
                  sliderPanel?.let { p -> val s = selItem; if (p.visibility == View.VISIBLE && s != null) { val c = chips.firstOrNull { it.first === s }?.second; if (c != null) openSlider(s, c, true) } }
                  updateChips()
              }

