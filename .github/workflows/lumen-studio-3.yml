                      Ch("bm_c_liner", "Liner color", 0, Pal.names(Pal.LIP, "Look default"))
                  ),
                  "Restore" to listOf<S>(
                      Ac("act_restore", "Restore faces (GFPGAN)"),
                      Sl("rs_amt", "Strength", 100, 0, 100, "%"),
                      Ac("act_restore_undo", "Undo restore")
                  )
              )
          }

          /** What the analysis step leaves behind: the original masks plus the numbers the shader needs. */
          class FaceData(
              val an: Analysis,
              val bmp: Bitmap,
              val maskA: ByteArray,     // RGBA, an.w x an.h: face skin, hair, lips, body skin
              val maskB: ByteArray,     // RGBA, an.w x an.h: teeth, eye whites, iris, under-eye
              val skinMean: FloatArray, // sRGB 0..1
              val hairLuma: Float, val hairY0: Float, val hairY1: Float,
              val face: FloatArray      // centre x, centre y (uv), eye distance in uv-height units, roll angle
          )

          object FaceKit {
              @Volatile var data: FaceData? = null
              var restored: Bitmap? = null   // pre-restore source, so the restoration can be undone
              private var look: Makeup? = null

              // ---------------------------------------------------------------- build data from an analysis
              private fun union(an: Analysis, cls: IntArray): FloatArray? {
                  var acc: FloatArray? = null
                  for (c in cls) {
                      val b = an.maps[c] ?: continue
                      val f = FloatArray(an.w * an.h) { (b[it].toInt() and 255) / 255f }
                      acc = if (acc == null) f else { val a0 = acc; FloatArray(f.size) { maxOf(a0[it], f[it]) } }
                  }
                  return acc
              }

              private fun q(v: Float): Byte = (v.coerceIn(0f, 1f) * 255f + 0.5f).toInt().toByte()

              fun build(an: Analysis, bmp: Bitmap): FaceData {
                  val w = an.w; val h = an.h; val n = w * h
                  val px = IntArray(n); bmp.getPixels(px, 0, w, 0, 0, w, h)
                  val gray = FI.gray(px)
                  val r = maxOf(2, (0.004f * maxOf(w, h)).toInt())
                  fun refined(f: FloatArray?): FloatArray = if (f == null) FloatArray(n) else FI.guided(f, gray, w, h, r, 0.001f)
                  val su = refined(union(an, intArrayOf(1, 10, 14, 7, 8)))
                  val ex = refined(union(an, intArrayOf(2, 3, 4, 5, 6, 11, 12, 13)))
                  val skin = FloatArray(n) { maxOf(0f, su[it] - ex[it]) }
                  val hair = refined(union(an, intArrayOf(17)))
                  val lips = refined(union(an, intArrayOf(12, 13)))
                  val bodyRaw = refined(union(an, intArrayOf(100)))
                  val a = ByteArray(n * 4)
                  for (i in 0 until n) {
                      a[i * 4] = q(skin[i]); a[i * 4 + 1] = q(hair[i]); a[i * 4 + 2] = q(lips[i])
                      a[i * 4 + 3] = q(maxOf(0f, bodyRaw[i] - skin[i] * 0.5f))
                  }
                  // mean skin colour and hair statistics (used as the reference point of the shader operators)
                  var sr = 0.0; var sg = 0.0; var sb = 0.0; var sn = 0
                  var hl = 0.0; var hn = 0; var y0 = h; var y1 = 0
                  var i = 0
                  while (i < n) {
                      if (skin[i] > 0.6f) { val p = px[i]; sr += (p shr 16) and 255; sg += (p shr 8) and 255; sb += p and 255; sn++ }
                      if (hair[i] > 0.5f) {
                          val p = px[i]; hl += (0.2126 * ((p shr 16) and 255) + 0.7152 * ((p shr 8) and 255) + 0.0722 * (p and 255)) / 255.0; hn++
                          val y = i / w; if (y < y0) y0 = y; if (y > y1) y1 = y
                      }
                      i += 2
                  }
                  val mean = if (sn > 10) floatArrayOf((sr / sn / 255.0).toFloat(), (sg / sn / 255.0).toFloat(), (sb / sn / 255.0).toFloat()) else floatArrayOf(0.8f, 0.62f, 0.52f)
                  val hLum = if (hn > 10) (hl / hn).toFloat() else 0.25f
                  val face = FloatArray(4)
                  an.faces.firstOrNull()?.let { f ->
                      val u = hypot(f[473 * 2] - f[468 * 2], f[473 * 2 + 1] - f[468 * 2 + 1])
                      face[0] = (f[468 * 2] + f[473 * 2]) / 2f / w; face[1] = (f[468 * 2 + 1] + f[473 * 2 + 1]) / 2f / h
                      face[2] = u / h; face[3] = atan2(f[473 * 2 + 1] - f[468 * 2 + 1], f[473 * 2] - f[468 * 2])
                  }
                  return FaceData(an, bmp, a, detailMasks(an), mean, hLum, if (hn > 10) y0.toFloat() / h else 0f, if (hn > 10) (y1 + 1f) / h else 1f, face)
              }

              // ---------------------------------------------------------------- teeth / eye whites / iris / under-eye polygons
              private val UPR = listOf(intArrayOf(33, 246, 161, 160, 159, 158, 157, 173, 133), intArrayOf(263, 466, 388, 387, 386, 385, 384, 398, 362))
              private val LOW = listOf(intArrayOf(33, 7, 163, 144, 145, 153, 154, 155, 133), intArrayOf(263, 249, 390, 373, 374, 380, 381, 382, 362))
              private val RING = listOf(intArrayOf(469, 470, 471, 472), intArrayOf(474, 475, 476, 477))
              private val LIPI = intArrayOf(78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95)

              private fun detailMasks(an: Analysis): ByteArray {
                  val w = an.w; val h = an.h
                  val bt = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888); val bs = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val bi = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888); val bu = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val cT = Canvas(bt); val cS = Canvas(bs); val cI = Canvas(bi); val cU = Canvas(bu)
                  for (f in an.faces) {
                      fun X(i: Int) = f[i * 2]
                      fun Y(i: Int) = f[i * 2 + 1]
                      val u = hypot(X(473) - X(468), Y(473) - Y(468)); if (u < 10f) continue
                      val th = atan2(Y(473) - Y(468), X(473) - X(468))
                      val bl = maxOf(1f, 0.012f * u)
                      fun fillP(): Paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFFFFFFFF.toInt(); style = Paint.Style.FILL; maskFilter = BlurMaskFilter(bl, BlurMaskFilter.Blur.NORMAL) }
                      fun poly(ids: List<Int>): Path { val p = Path(); ids.forEachIndexed { j, id -> if (j == 0) p.moveTo(X(id), Y(id)) else p.lineTo(X(id), Y(id)) }; p.close(); return p }
                      cT.drawPath(poly(LIPI.toList()), fillP())
                      for (s in 0..1) {
                          cS.drawPath(poly(UPR[s].toList() + LOW[s].toList().reversed()), fillP())
                          val ic = if (s == 0) 468 else 473
                          val rr = RING[s].map { hypot(X(it) - X(ic), Y(it) - Y(ic)) }.average().toFloat()
                          cS.drawCircle(X(ic), Y(ic), rr * 1.05f, Paint(Paint.ANTI_ALIAS_FLAG).apply { xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_OUT); color = 0xFF000000.toInt() })
                          cI.drawCircle(X(ic), Y(ic), rr * 0.95f, fillP())
                          val o = if (s == 0) 33 else 263; val inn = if (s == 0) 133 else 362
                          val cx = (X(o) + X(inn)) / 2f - sin(th) * 0.27f * u; val cy = (Y(o) + Y(inn)) / 2f + cos(th) * 0.27f * u
                          cU.save(); cU.rotate(Math.toDegrees(th.toDouble()).toFloat(), cx, cy)
                          cU.drawOval(RectF(cx - 0.38f * u, cy - 0.1f * u, cx + 0.38f * u, cy + 0.1f * u), fillP())
                          cU.restore()
                      }
                  }
                  val out = ByteArray(w * h * 4); val ia = IntArray(w * h)
                  val all = listOf(bt, bs, bi, bu)
                  for ((ci, b) in all.withIndex()) {
                      b.getPixels(ia, 0, w, 0, 0, w, h)
                      for (i in 0 until w * h) out[i * 4 + ci] = (ia[i] ushr 24).toByte()
                      b.recycle()
                  }
                  return out
              }

              // ---------------------------------------------------------------- reshape displacement field (uv units, drawn live by the GPU)
              fun field(d: FaceData, gw: Int, gh: Int): FloatArray? {
                  val an = d.an
                  val ops = ArrayList<Op>()
                  val k = Fx.i("face_range") / 100f
                  for ((fi, f) in an.faces.withIndex()) {
                      val p = HashMap<String, Float>()
                      for (pd in FaceDefs.facePDs) {
                          var v = Fx.i(FaceDefs.key(0, pd.id))
                          if (fi < 4) v += Fx.i(FaceDefs.key(fi + 1, pd.id))
                          if (v != 0) p[pd.id] = (v / 100f).coerceIn(-1.5f, 1.5f)
                      }
                      if (p.isNotEmpty()) Warp.faceOps(f, p, k, ops)
                  }
                  val pose = an.pose
                  if (pose != null) {
                      val p = HashMap<String, Float>()
                      for (pd in FaceDefs.bodyPDs) { val v = Fx.i("bd_" + pd.id); if (v != 0) p[pd.id] = v / 100f }
                      if (p.isNotEmpty()) Warp.bodyOps(pose, p, k, ops)
                  }
                  if (ops.isEmpty()) return null
                  val mw = gw - 1; val mh = gh - 1
                  val verts = Warp.mesh(an.w, an.h, mw, mh, ops, 1f)
                  val out = FloatArray(gw * gh * 2)
                  for (j in 0 until gh) for (i in 0 until gw) {
                      val idx = (j * gw + i) * 2
                      val vx = an.w * i.toFloat() / mw; val vy = an.h * j.toFloat() / mh
                      out[idx] = (verts[idx] - vx) / an.w; out[idx + 1] = (verts[idx + 1] - vy) / an.h
                  }
                  return out
              }

              // ---------------------------------------------------------------- makeup: baked once per look, intensity stays a live slider
              fun currentLook(): Makeup? { val i = Fx.i("bm_look"); return if (i <= 0 || i > MkLib.ALL.size) null else MkLib.ALL[i - 1] }

              fun makeupSignature(): String = listOf("bm_look", "bm_p_lips", "bm_p_shadow", "bm_p_liner", "bm_p_lashes", "bm_p_brows", "bm_p_blush", "bm_p_sculpt", "bm_p_lens",
                  "bm_c_lip", "bm_c_lid", "bm_c_blush", "bm_c_liner").joinToString(",") { Fx.i(it).toString() }

              fun bakeMakeup(d: FaceData): ByteArray? {
                  val lk = currentLook() ?: return null
                  val parts = HashSet<String>()
                  if (Fx.i("bm_p_lips") == 1) parts.add("Lips")
                  if (Fx.i("bm_p_shadow") == 1) parts.add("Shadow")
                  if (Fx.i("bm_p_liner") == 1) parts.add("Liner")
                  if (Fx.i("bm_p_lashes") == 1) parts.add("Lashes")
                  if (Fx.i("bm_p_brows") == 1) parts.add("Brows")
                  if (Fx.i("bm_p_blush") == 1) parts.add("Blush")
                  if (Fx.i("bm_p_sculpt") == 1) parts.add("Sculpt")
                  if (Fx.i("bm_p_lens") == 1) parts.add("Lens")
                  val cols = HashMap<String, Int>()
                  Pal.pick(Pal.LIP, Fx.i("bm_c_lip"))?.let { cols["lip"] = Pal.argb(it) }
                  Pal.pick(Pal.LIP, Fx.i("bm_c_lid"))?.let { cols["lid"] = Pal.argb(it); cols["crease"] = Pal.argb(it) }
                  Pal.pick(Pal.LIP, Fx.i("bm_c_blush"))?.let { cols["blush"] = Pal.argb(it) }
                  Pal.pick(Pal.LIP, Fx.i("bm_c_liner"))?.let { cols["liner"] = Pal.argb(it) }
                  val tuned = lk.tuned(parts, emptyMap(), cols)
                  val w = d.an.w; val h = d.an.h
                  val work = d.bmp.copy(Bitmap.Config.ARGB_8888, true)
                  for ((i, f) in d.an.faces.withIndex()) Mk.render(work, f, tuned, 1f, i + 1)
                  val a = IntArray(w * h); val b = IntArray(w * h)
                  d.bmp.getPixels(a, 0, w, 0, 0, w, h); work.getPixels(b, 0, w, 0, 0, w, h); work.recycle()
                  val out = ByteArray(w * h * 3)
                  for (i in 0 until w * h) {
                      for (c in 0..2) {
                          val sh = 16 - 8 * c
                          val dv = ((b[i] shr sh) and 255) - ((a[i] shr sh) and 255)
                          out[i * 3 + c] = (128 + dv / 2).coerceIn(0, 255).toByte()
                      }
                  }
                  return out
              }

              // ---------------------------------------------------------------- colours handed to the shader (vec4 x 8)
              fun uniforms(): FloatArray {
                  val u = FloatArray(32)
                  val d = data
                  val m = d?.skinMean ?: floatArrayOf(0.8f, 0.62f, 0.52f)
                  u[0] = m[0]; u[1] = m[1]; u[2] = m[2]; u[3] = 1f
                  val tone = Pal.pick(Pal.SKIN, Fx.i("skn_tone"))
                  if (tone != null) { val c = Pal.rgb(tone); u[4] = c[0]; u[5] = c[1]; u[6] = c[2]; u[7] = 1f }
                  val h1 = Pal.pick(Pal.HAIR, Fx.i("hr_c1"))
                  if (h1 != null) {
                      val c = Pal.rgb(h1); u[8] = c[0]; u[9] = c[1]; u[10] = c[2]
                      val h2 = Pal.pick(Pal.HAIR, Fx.i("hr_c2")) ?: h1
                      val c2 = Pal.rgb(h2); u[12] = c2[0]; u[13] = c2[1]; u[14] = c2[2]
                      u[15] = 1f
                  }
                  u[11] = d?.hairLuma ?: 0.25f
                  val lip = Pal.pick(Pal.LIP, Fx.i("lp_c"))
                  if (lip != null) { val c = Pal.rgb(lip); u[16] = c[0]; u[17] = c[1]; u[18] = c[2]; u[19] = 1f }
                  u[20] = d?.hairY0 ?: 0f; u[21] = d?.hairY1 ?: 1f
                  val f = d?.face ?: FloatArray(4)
                  u[22] = f[0]; u[23] = f[1]; u[24] = f[2]; u[25] = f[3]
                  return u
              }
          }
