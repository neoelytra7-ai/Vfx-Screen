              private fun applyTemplate(t: Tpl?) {
                  val sel = Fx.i("face_sel")
                  for (pd in FaceDefs.facePDs) {
                      val v = if (t == null) 0 else Math.round((t.v[pd.id] ?: 0f) * 100f * tplPct / 100f).coerceIn(-100, 100)
                      Fx.set(FaceDefs.key(sel, pd.id), v)
                  }
                  commitEdit(); onParam("fa_x"); afterBulk()
              }

              // ---------------------------------------------------------------- face pipeline
              private fun needsFace(k: String): Boolean =
                  k.startsWith("skn_") || k.startsWith("hr_") || k.startsWith("lp_") || k.startsWith("ec_") || k.startsWith("bm_") || k.startsWith("fa_") || k.startsWith("bd_") || k == "face_range" ||
                      (k.length > 3 && k[0] == 'f' && k[1] in '1'..'4' && k[2] == '_')

              private fun isShapeKey(k: String): Boolean = k.startsWith("fa_") || k.startsWith("bd_") || k == "face_range" || (k.length > 3 && k[0] == 'f' && k[1] in '1'..'4' && k[2] == '_')

              private fun ensureFace(then: (() -> Unit)?) {
                  val s = src ?: run { snack("Open a photo first"); return }
                  if (FaceKit.data != null) { then?.invoke(); return }
                  if (faceLoading) return
                  if (!FM.core(this)) {
                      if (!faceWarned) { faceWarned = true; snack("Download the Face pack first (Models)"); showTool("Models") }
                      return
                  }
                  faceLoading = true
                  status("Reading faces…")
                  runAi {
                      try {
                          val an = Analyzer.analyze(this, s) { st -> status(arrayOf("Reading the photo", "Scanning every face", "Locating the body", "Mapping hair, skin, lips, eyes", "Segmenting the frame", "Refining edges").getOrElse(st - 1) { "Analyzing" }) }
                          val bmp = Bitmap.createScaledBitmap(s, an.w, an.h, true)
                          val d = FaceKit.build(an, bmp)
                          FaceKit.data = d; lastMkSig = ""
                          ui.post {
                              faceLoading = false
                              pushFace(); pushParams()
                              status(if (an.faces.isEmpty()) "No face found" else "${an.faces.size} face(s)" + (if (an.pose != null) " + body" else "") + " mapped")
                              then?.invoke()
                          }
                      } catch (e: Throwable) { faceLoading = false; status("Face analysis failed: ${e.message}") }
                  }
              }

              private fun pushFace() {
                  val g = gl ?: return
                  val d = FaceKit.data
                  if (d == null) { g.r.setFace(null, null, 0, 0); g.r.setWarp(null, 0, 0); g.r.setMake(null); return }
                  g.r.setFace(d.maskA, d.maskB, d.an.w, d.an.h)
                  scheduleWarp(); scheduleMakeup()
              }

              private fun clearFace() { FaceKit.data = null; FaceKit.restored = null; faceWarned = false; faceLoading = false; lastMkSig = ""; gl?.r?.setFace(null, null, 0, 0); gl?.r?.setWarp(null, 0, 0); gl?.r?.setMake(null) }

              private fun scheduleWarp() { ui.removeCallbacks(warpTask); ui.postDelayed(warpTask, 20) }
              private fun scheduleMakeup() { ui.removeCallbacks(makeupTask); ui.postDelayed(makeupTask, 220) }

              private fun warpNow() {
                  val d = FaceKit.data ?: return
                  val gw = 176; val gh = max(8, (gw * d.an.h.toFloat() / d.an.w).roundToInt())
                  val fld = FaceKit.field(d, gw, gh)
                  gl?.r?.setWarp(fld, gw, gh)
                  gl?.requestRender()
              }

              private fun makeupNow() {
                  val d = FaceKit.data ?: return
                  val sig = FaceKit.makeupSignature()
                  if (sig == lastMkSig) return
                  lastMkSig = sig
                  gl?.r?.setMake(FaceKit.bakeMakeup(d))
                  gl?.requestRender()
              }

              private fun doRestore() {
                  val s = src ?: run { snack("Open a photo first"); return }
                  if (!FM.has(this, FM.RESTORE)) { snack("Download the Restore model first (Models)"); showTool("Models"); return }
                  ensureFace {
                      val d = FaceKit.data
                      if (d != null && d.an.faces.isNotEmpty()) {
                          status("Restoring faces…")
                          runAi {
                              val work = s.copy(Bitmap.Config.ARGB_8888, true)
                              val k = work.width.toFloat() / d.an.w
                              for (f in d.an.faces) Restore.run(FM.path(this, FM.RESTORE).path, work, FloatArray(f.size) { f[it] * k }, Fx.i("rs_amt") / 100f)
                              FaceKit.restored = s; src = work
                              ui.post { gl?.r?.setImage(work); status("Faces restored. Strength can be undone") }
                          }
                      } else snack("No face found")
                  }
              }

              private fun faceModelRows(parent: LinearLayout) {
                  fun row(title: String, models: List<Mdl>) {
                      val box = LinearLayout(this); box.orientation = LinearLayout.VERTICAL; box.setPadding(0, dp(12), 0, dp(4))
                      box.addView(tv(title, 14f))
                      val ready = models.all { FM.has(this, it) }
                      val mb = models.sumOf { it.mb }
                      val lbl = tv(if (ready) "Ready  •  $mb MB" else "Not downloaded  •  $mb MB", 12f, if (ready) cOk else cMuted); lbl.setPadding(0, dp(2), 0, dp(6)); box.addView(lbl)
                      val dl = tv(if (ready) "Re-check" else "Download", 13f, cAccent2, true).apply { setPadding(dp(16), dp(9), dp(16), dp(9)); background = ripple(rr(tint(0x14), 12, tint(0x33)), 12) }
                      press(dl)
                      dl.setOnClickListener {
                          it.hap(HapticFeedbackConstants.VIRTUAL_KEY)
                          Thread {
                              try {
                                  for ((i, m) in models.withIndex()) FM.fetch(this, m) { p -> ui.post { lbl.setTextColor(cMuted); lbl.text = "Downloading ${i + 1}/${models.size}  ${(p * 100).toInt()}%" } }
                                  ui.post { lbl.setTextColor(cOk); lbl.text = "Ready  •  $mb MB"; snack("$title ready"); faceWarned = false }
                              } catch (e: Throwable) { ui.post { lbl.setTextColor(cWarn); lbl.text = "Failed: ${e.message}" } }
                          }.start()
                      }
                      box.addView(dl)
                      parent.addView(box, lp(MP, WC))
                  }
                  row("Face pack (landmarks, body pose, face parsing, segmentation)", listOf(FM.FACE, FM.POSE, FM.PARSE, FM.SELFIE))
                  row("Face restore (GFPGAN 1.4)", listOf(FM.RESTORE))
              }

              // ------------------------------------------------------------------ models panel
              private fun modelsPanel(parent: LinearLayout) {
                  parent.addView(tv("Depth Base and Large are CC BY-NC 4.0 (personal use). Pick the model in Depth > Depth model.", 11f, cMuted).apply { setPadding(0, dp(6), 0, dp(2)) })
                  faceModelRows(parent)
                  for (m in Models.list) {
                      val box = LinearLayout(this)
                      box.orientation = LinearLayout.VERTICAL
                      box.setPadding(0, dp(12), 0, dp(4))
                      box.addView(tv(m.name, 14f))
                      val ready = Models.ready(this, m.id)
                      val lbl = tv(if (ready) "Ready  •  ${m.mb} MB" else "Not downloaded  •  ${m.mb} MB", 12f, if (ready) cOk else cMuted)
                      lbl.setPadding(0, dp(2), 0, dp(6))
                      box.addView(lbl)
                      val btns = LinearLayout(this)
                      fun mini(t: String): TextView = tv(t, 13f, cAccent2, true).apply {
                          setPadding(dp(16), dp(9), dp(16), dp(9)); background = ripple(rr(tint(0x14), 12, tint(0x33)), 12)
                      }
                      val dl = mini(if (ready) "Re-download" else "Download"); press(dl)
                      dl.setOnClickListener {
                          it.hap(HapticFeedbackConstants.VIRTUAL_KEY)
                          lbl.setTextColor(cMuted); lbl.text = "Downloading 0%"
