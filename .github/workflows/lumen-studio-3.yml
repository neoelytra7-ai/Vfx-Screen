                      p.alpha = 190
                      rect.set(a, cy - 2.6f * d, b, cy + 2.6f * d); c.drawRoundRect(rect, 3f * d, 3f * d, p)
                      p.shader = null
                      p.color = withAlpha(accent2, 0.22f); rect.set(a, cy - 5f * d, b, cy + 5f * d); c.drawRoundRect(rect, 5f * d, 5f * d, p)
                  }
                  glowRect(14f * d, cy - half, L - 14f * d, cy + half, half, accent, 1f)
                  if (df > lo && df < hi) { p.style = Paint.Style.FILL; p.color = withAlpha(0xFFFFFFFF.toInt(), 0.7f); c.drawRect(xOf(df.toFloat()) - 1f * d, cy - 10f * d, xOf(df.toFloat()) + 1f * d, cy - 7f * d, p) }
                  val tx = xOf(shown); val tr = (9.5f + 3.5f * press) * d
                  p.style = Paint.Style.FILL
                  for (i in 0..2) { p.color = withAlpha(accent2, (0.10f + 0.07f * i) * (1f + press)); c.drawCircle(tx, cy, tr + (3 - i) * 4f * d, p) }
                  p.color = 0xFF080B11.toInt(); c.drawCircle(tx, cy, tr, p)
                  p.style = Paint.Style.STROKE; p.strokeWidth = 2f * d; p.color = accent2; c.drawCircle(tx, cy, tr, p)
                  p.style = Paint.Style.FILL; p.color = withAlpha(0xFFFFFFFF.toInt(), 0.95f); c.drawCircle(tx, cy, tr * 0.32f, p)
                  c.restore()
                  if (anim) postInvalidateOnAnimation()
              }

              private fun setFromPos(pos: Float) {
                  val f = ((pos - 18f * d) / (len() - 36f * d)).coerceIn(0f, 1f)
                  var v = (lo + f * span()).roundToInt()
                  val zone = max(1, (span() * 0.012f).roundToInt())
                  var snapped = false
                  if (df > lo && df < hi && abs(v - df) <= zone) { v = df; snapped = true }
                  if (v == value) return
                  val was = value == df
                  value = v
                  onChange?.invoke(v)
                  if (snapped && !was) onSnap?.invoke() else onTick?.invoke()
                  invalidate()
              }

              private fun axis(e: MotionEvent): Float = if (vertical) height - e.y else e.x

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  gd.onTouchEvent(e)
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { downPos = axis(e); dragging = false; pressT = 1f; parent?.requestDisallowInterceptTouchEvent(true); invalidate(); return true }
                      MotionEvent.ACTION_MOVE -> {
                          if (!dragging && abs(axis(e) - downPos) > slop) dragging = true
                          if (dragging) setFromPos(axis(e))
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          pressT = 0f; invalidate()
                          if (dragging) { dragging = false; onStop?.invoke() }
                          return true
                      }
                  }
                  return super.onTouchEvent(e)
              }
          }

          /** Round outline icon for a parameter: glyph in the middle, ring that shows the value, tiny caption. */
          class ParamChip(ctx: Context) : View(ctx) {
              var title = ""; set(v) { field = v; glyph = makeGlyph(v); invalidate() }
              var norm = 0f          // -1..1 position of the value relative to the default (0 = untouched)
              var edited = false
              var sel = false; set(v) { field = v; invalidate() }
              var accent = 0xFF8B7BFF.toInt()
              var accent2 = 0xFF22D3EE.toInt()
              private var glyph = ""
              private val d = resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()

              init {
                  tp.typeface = NeonFont.condBold; tp.textAlign = Paint.Align.CENTER; tp.textScaleX = NeonFont.SX
              }

              private fun makeGlyph(t: String): String {
                  val words = t.split(' ', '/', '-', '&').filter { it.isNotEmpty() }
                  val g = if (words.size >= 2) "" + words[0][0] + words[1][0] else t.take(2)
                  return g.uppercase()
              }

              override fun onMeasure(w: Int, h: Int) { setMeasuredDimension((52f * d).toInt(), (64f * d).toInt()) }

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f; val cy = 22f * d; val r = 17f * d
                  val pulse = if (sel) 0.5f + 0.5f * sin(SystemClock.uptimeMillis() / 260.0).toFloat() else 0f
                  p.style = Paint.Style.FILL; p.color = withAlpha(0xFF070A10.toInt(), 0.42f); c.drawCircle(cx, cy, r, p)
                  p.style = Paint.Style.STROKE
                  val col = if (sel) accent2 else accent
                  for (i in 0..2) { p.strokeWidth = (1.5f + (3 - i) * 2.6f) * d; p.color = withAlpha(col, (if (sel) 0.18f + 0.12f * pulse else 0.07f) * (0.5f + i * 0.4f)); c.drawCircle(cx, cy, r, p) }
                  p.strokeWidth = 1.5f * d; p.color = withAlpha(col, if (sel) 1f else 0.7f); c.drawCircle(cx, cy, r, p)
                  if (edited) {
                      p.strokeWidth = 3f * d; p.strokeCap = Paint.Cap.ROUND; p.color = accent2
                      rect.set(cx - r - 3.5f * d, cy - r - 3.5f * d, cx + r + 3.5f * d, cy + r + 3.5f * d)
                      val sweep = (abs(norm).coerceIn(0.04f, 1f)) * 300f
                      val start = -90f
                      c.drawArc(rect, if (norm >= 0f) start else start - sweep, sweep, false, p)
                      p.strokeCap = Paint.Cap.BUTT
                  }
                  tp.textSize = 11.5f * d; tp.color = if (sel) 0xFFFFFFFF.toInt() else 0xFFE8EEF5.toInt()
                  if (sel) tp.setShadowLayer(8f * d, 0f, 0f, accent2) else tp.clearShadowLayer()
                  c.drawText(glyph, cx, cy + 4f * d, tp)
                  tp.clearShadowLayer()
                  tp.textSize = 9f * d; tp.typeface = NeonFont.cond; tp.color = if (sel) 0xFFFFFFFF.toInt() else 0xFFB4BFCE.toInt()
                  val cap = TextUtils.ellipsize(title, android.text.TextPaint(tp), width - 6f * d, TextUtils.TruncateAt.END).toString()
                  c.drawText(cap, cx, 53f * d, tp)
                  tp.typeface = NeonFont.condBold
                  if (sel) postInvalidateOnAnimation()
              }
          }

          /** Label with a procedural pulse: a wave of scale + glow travels through the letters. */
          class FxText(ctx: Context) : View(ctx) {
              var text = ""; set(v) { field = v; requestLayout(); invalidate() }
              var sizeSp = 14f; set(v) { field = v; requestLayout(); invalidate() }
              var bold = true; set(v) { field = v; paint.typeface = if (v) NeonFont.condBold else NeonFont.cond; requestLayout(); invalidate() }
              var active = false; set(v) { field = v; invalidate() }
              var badge = false; set(v) { field = v; invalidate() }
              var glow = 0xFF22D3EE.toInt()
              var colorOn = 0xFFFFFFFF.toInt()
              var colorOff = 0xFF8693A5.toInt()
              var spacing = 0.6f
              private val d = resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bar = Paint(Paint.ANTI_ALIAS_FLAG)
              private var kickT0 = 0L

              init { paint.typeface = NeonFont.condBold; paint.textScaleX = NeonFont.SX; setPadding((11f * d).toInt(), 0, (11f * d).toInt(), 0) }

              fun kick() { kickT0 = SystemClock.uptimeMillis(); invalidate() }

              private fun sp(): Float = sizeSp * resources.displayMetrics.scaledDensity

              private fun textW(): Float { paint.textSize = sp(); var w = 0f; for (ch in text) w += paint.measureText(ch.toString()) + spacing * d; return w }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension((textW() + paddingLeft + paddingRight).toInt() + 2, (sp() * 2.1f).toInt())
              }

              override fun onDraw(c: Canvas) {
                  paint.textSize = sp()
                  val now = SystemClock.uptimeMillis()
                  val kick = ((1f - (now - kickT0) / 900f)).coerceIn(0f, 1f)
                  var x = paddingLeft.toFloat(); val base = height / 2f + sp() * 0.34f
                  val ph = now / 1100.0 * 6.2831853
                  paint.color = if (active) colorOn else colorOff
                  if (active) paint.setShadowLayer(9f * d, 0f, 0f, glow) else paint.clearShadowLayer()
                  for ((i, ch) in text.withIndex()) {
                      val s = ch.toString(); val w = paint.measureText(s)
                      val wave = sin(ph - i * 0.62).toFloat()
                      val kw = sin((now - kickT0) / 120.0 - i * 0.7).toFloat() * kick
                      val sc = 1f + (if (active) 0.055f * wave else 0f) + 0.22f * kw
                      c.save(); c.scale(sc, sc, x + w / 2f, base - sp() * 0.3f)
                      if (active) paint.alpha = (205 + 50 * wave).toInt().coerceIn(0, 255)
                      c.drawText(s, x, base, paint); c.restore()
                      x += w + spacing * d
                  }
                  paint.clearShadowLayer()
                  if (active) {
                      val l = paddingLeft.toFloat(); val r = width - paddingRight.toFloat(); val y = height - 3f * d
                      bar.style = Paint.Style.STROKE; bar.strokeCap = Paint.Cap.ROUND
                      for (i in 0..2) { bar.strokeWidth = (2f + (3 - i) * 2.4f) * d; bar.color = withAlpha(glow, 0.12f * (i + 1)); c.drawLine(l, y, r, y, bar) }
                      bar.strokeWidth = 1.6f * d; bar.color = glow; c.drawLine(l, y, r, y, bar)
                  }
                  if (badge) { bar.style = Paint.Style.FILL; bar.color = withAlpha(glow, 0.35f); c.drawCircle(width - paddingRight + 2f * d, 7f * d, 5f * d, bar); bar.color = glow; c.drawCircle(width - paddingRight + 2f * d, 7f * d, 2.4f * d, bar) }
                  if (active || kick > 0f) postInvalidateOnAnimation()
              }
          }

          /** Container with an outline and soft glow drawn behind its children. */
          class GlowFrame(ctx: Context) : LinearLayout(ctx) {
              var color = 0xFF22D3EE.toInt(); set(v) { field = v; invalidate() }
              var fill = 0x99070A10.toInt(); set(v) { field = v; invalidate() }
              var cornerDp = 16f; set(v) { field = v; invalidate() }
              var strength = 0.6f; set(v) { field = v; invalidate() }
              private val d = resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val r = RectF()

              init { setWillNotDraw(false) }

              override fun onDraw(c: Canvas) {
                  val rad = cornerDp * d
                  p.style = Paint.Style.FILL; p.color = fill
                  r.set(4f * d, 4f * d, width - 4f * d, height - 4f * d); c.drawRoundRect(r, rad, rad, p)
                  p.style = Paint.Style.STROKE
                  for (i in 0..2) {
                      p.strokeWidth = (1.5f + (3 - i) * 2.2f) * d; p.color = withAlpha(color, strength * 0.10f * (i + 1))
                      c.drawRoundRect(r, rad, rad, p)
                  }
                  p.strokeWidth = 1.3f * d; p.color = withAlpha(color, min(1f, strength + 0.3f))
                  c.drawRoundRect(r, rad, rad, p)
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon --stacktrace
        env:
          VC: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: Lumen-Studio-apk, path: app/build/outputs/apk/debug/*.apk }
