                      if (sx in 0 until W && sy in 0 until H) shifted[y * W + x] = A[sy * W + sx]
                  }
                  val sbr = max(2, (Fx.i("hm_sh_blur") / 100f * subSize * 0.5f).toInt())
                  val shadow = Img.box(Img.box(shifted, W, H, sbr), W, H, max(1, sbr / 2))
                  val shOp = Fx.i("hm_shadow") / 100f
                  val colorK = Fx.i("hm_color") / 100.0
                  val lightK = Fx.i("hm_light") / 100.0
                  val wrapK = Fx.i("hm_wrap") / 100f

                  val rgb = DoubleArray(3)
                  val out = IntArray(n)
                  for (k in 0 until n) {
                      var r0 = ((bp[k] shr 16) and 255) / 255f
                      var g0 = ((bp[k] shr 8) and 255) / 255f
                      var b0 = (bp[k] and 255) / 255f
                      val s = shadow[k] * shOp * 0.7f
