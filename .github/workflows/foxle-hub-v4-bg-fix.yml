          let Q='',SORT=localStorage.getItem('fxSort')||'az',PIN=new Set(ls('fxPin','[]')),ADDED=ls('fxAdded','{}'),LAST=ls('fxLast','{}'),SIZE=ls('fxSize','{}');
          const svPin=()=>localStorage.setItem('fxPin',JSON.stringify([...PIN]));
