           x.globalAlpha=.1;x.strokeStyle=col;x.lineWidth=1;for(let i=0;i<4;i++){x.beginPath();x.arc(cx,cy,r*(.25+i*.2),0,7);x.stroke()}x.globalAlpha=1;
           x.restore();
