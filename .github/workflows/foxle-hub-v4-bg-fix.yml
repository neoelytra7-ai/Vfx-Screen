            x.beginPath();x.moveTo(px,py);x.lineTo(px+(qx-px)*.22,py+(qy-py)*.22);x.strokeStyle=col;x.lineWidth=2;x.globalAlpha=.6;x.stroke();x.globalAlpha=1}
           x.font='700 '+(S*.34)+'px Orbitron, sans-serif';x.textAlign='center';x.textBaseline='middle';
           x.shadowColor=col;x.shadowBlur=10;x.fillStyle='#eaf6ff';x.fillText(ini,cx,cy+2);x.shadowBlur=0;
           return c.toDataURL();
          }
          /* ---------- logo Foxle: tanda sirkuit heksagon ---------- */
          function logo(){
           const S=96,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),cx=S/2,cy=S/2,r=S*.4;
           x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/2,px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();
           x.fillStyle='#0b121c';x.fill();x.lineWidth=4;x.strokeStyle='#2fe3ff';x.shadowColor='#2fe3ff';x.shadowBlur=16;x.stroke();x.shadowBlur=0;
           x.beginPath();x.moveTo(cx-r*.32,cy+r*.22);x.lineTo(cx-r*.05,cy-r*.3);x.lineTo(cx+r*.14,cy-r*.02);x.lineTo(cx+r*.36,cy-r*.38);
           x.strokeStyle='#8a5cff';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.shadowColor='#8a5cff';x.shadowBlur=8;x.stroke();x.shadowBlur=0;
