          function mk(){HE=document.createElement('div');HE.style.cssText='all:initial;position:fixed;top:calc(34px + env(safe-area-inset-top,0px));left:6px;z-index:2147483646;pointer-events:none';
           var r=HE.attachShadow({mode:'open'});r.innerHTML='<pre style="margin:0;padding:3px 6px;background:#000c;color:#7cff3a;font:13px/1.25 monospace"></pre><canvas width="150" height="34" style="display:block;background:#000c"></canvas>';
           hp=r.querySelector('pre');hg=r.querySelector('canvas');(document.body||document.documentElement).appendChild(HE)}
          function draw(){if(!hud||!hp)return;var s=S[S.length-1];if(!s)return;
           hp.textContent='FPS '+s.fps+'  p95 '+f1(s.p95)+'ms\nCPU '+(s.cpu==null?'-':Math.round(s.cpu)+'%')+'  DC '+s.dc+'\nHEAP '+(s.heap?Math.round(s.heap)+'M':'-')+'  PSS '+(s.pss?Math.round(s.pss)+'M':'-')+'\nTEMP '+(s.bt||'-')+'C  jank '+jk;
           var c=hg.getContext('2d');c.clearRect(0,0,150,34);var a=S.slice(-75);for(var i=0;i<a.length;i++){var h=Math.min(34,a[i].fps/60*32);c.fillStyle=a[i].fps<30?'#ff5a3a':a[i].fps<50?'#fcdb5a':'#7cff3a';c.fillRect(i*2,34-h,2,h)}}
          function setHud(on){hud=on;if(on){if(!HE||!HE.isConnected)mk();HE.style.display='block';draw()}else if(HE)HE.style.display='none'}
          function report(){
           var dur=(performance.now()-t0)/1000,fp=S.map(function(s){return s.fps}),cp=S.filter(function(s){return s.cpu!=null}).map(function(s){return s.cpu}),
           hh=S.filter(function(s){return s.heap}).map(function(s){return s.heap}),ps=S.filter(function(s){return s.pss}).map(function(s){return s.pss}),d1=S.map(function(s){return s.dc}),t1=S.map(function(s){return s.tr});
           var L=['FOXLE PERFORMANCE LOG',new Date().toISOString()+'  run '+f1(dur)+'s','Page: '+location.pathname.split('/').pop()+'  viewport '+innerWidth+'x'+innerHeight+' @'+devicePixelRatio+'x','UA: '+navigator.userAgent.slice(12,130),
           '','[FRAMES] '+FT.length+' frames  avg '+f1(FT.length?1000/av(FT):0)+' fps',
           '  fps/s min '+mn(fp)+'  max '+mx(fp)+'  1% low '+f1(1000/(pc(FT,.99)||1))+'  0.1% low '+f1(1000/(pc(FT,.999)||1)),
           '  frame ms avg '+f1(av(FT))+'  p50 '+f1(pc(FT,.5))+'  p95 '+f1(pc(FT,.95))+'  p99 '+f1(pc(FT,.99))+'  max '+f1(mx(FT)),
           '  jank >33ms: '+jk+' ('+f1(jk*100/(FT.length||1))+'%)  stall >100ms: '+jb,
           '','[CPU/MEM] cpu avg '+f1(av(cp))+'%  max '+f1(mx(cp))+'%  (100% = 1 core, '+(nv&&nv.cores||'?')+' cores)',
           '  JS heap now '+f1(hh[hh.length-1]||0)+'M  max '+f1(mx(hh))+'M','  PSS now '+f1(ps[ps.length-1]||0)+'M  max '+f1(mx(ps))+'M  native heap '+f1(nv&&nv.nat||0)+'M',
           '  battery '+(nv?nv.bt:'-')+'C  thermal status '+(nv?nv.th:'-')+' (0 none .. 6 shutdown)',
           '','[GL] contexts: '+(CX.join(', ')||'none'),
           '  draw calls/s avg '+Math.round(av(d1))+' max '+mx(d1)+'  tris/s avg '+Math.round(av(t1))+' max '+Math.round(mx(t1)),
           '  tex uploads '+tx+'  buffer uploads '+bf+'  shaders compiled '+sh,
           '','[MAIN THREAD] long tasks '+lc+' total '+Math.round(lm)+'ms',LT.slice(-8).join(' | '),
           '[DOM] nodes '+(S.length?S[S.length-1].dom:'-')+'  canvases '+document.getElementsByTagName('canvas').length,
           '','[ERRORS] '+ER.length].concat(ER.slice(-10),['','[TIMELINE every 5s] t fps p95ms cpu% heapM pssM drawcalls']);
           for(var i=0;i<S.length;i+=5){var s=S[i];L.push(s.t+'s '+s.fps+' '+f1(s.p95)+' '+(s.cpu==null?'-':Math.round(s.cpu))+' '+(s.heap?Math.round(s.heap):'-')+' '+(s.pss?Math.round(s.pss):'-')+' '+s.dc)}
           return L.join('\n')}
          function reset(){FT=[];S=[];ER=[];LT=[];lc=jk=jb=tx=bf=sh=0;t0=performance.now()}
          window.__fxmon={report:report,reset:reset,hud:setHud,on:function(){return hud}};
