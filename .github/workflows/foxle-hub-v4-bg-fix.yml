            File safe(String p) throws IOException {
              if (!cb("st", true)) throw new SecurityException("storage off");
              File f = new File(p).getCanonicalFile();
              String r = ext.getCanonicalPath(), q = f.getPath();
              if (!q.equals(r) && !q.startsWith(r + "/")) throw new SecurityException(p);
              return f;
            }

            static void unzip(InputStream in, File d) throws IOException {
              ZipInputStream z = new ZipInputStream(in);
              String base = d.getCanonicalPath() + File.separator;
              ZipEntry e;
              while ((e = z.getNextEntry()) != null) {
                String en = e.getName().replace('\\', '/');
                if (en.startsWith("__MACOSX/")) continue;
                File f = new File(d, en);
                if (!f.getCanonicalPath().startsWith(base)) continue;
                if (e.isDirectory()) f.mkdirs();
                else { f.getParentFile().mkdirs(); cp(z, f, false); }
              }
              z.close();
            }

            static void fix(File d) {
              if (new File(d, "index.html").exists()) return;
              File[] a = d.listFiles();
              if (a == null) return;
              if (a.length == 1 && a[0].isDirectory()) {
                File[] b = a[0].listFiles();
                if (b != null) for (File f : b) f.renameTo(new File(d, f.getName()));
                a[0].delete();
              }
              if (!new File(d, "index.html").exists()) {
                a = d.listFiles();
                if (a != null) for (File f : a) if (f.getName().toLowerCase().endsWith(".html")) { f.renameTo(new File(d, "index.html")); break; }
              }
            }

