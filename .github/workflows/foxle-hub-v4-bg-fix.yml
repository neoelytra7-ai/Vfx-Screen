            const V=view(),now=Date.now();
            const it=V.map((p,i)=>{
              const isNew=now-(ADDED[p.id]||0)<3*864e5,pin=PIN.has(p.id),sel=ms&&SEL.has(p.id);
              return `<div class="s${pin?' pin':''}${sel?' sel':''}" data-id="${p.id}" style="animation-delay:${Math.min(i%PER,23)*18}ms"><img src="${av(p.name)}" alt=""><span>${esc(p.name)}</span>${isNew&&!ms?'<b class="nb">BARU</b>':''}${pin&&!ms?'<i class="pb">&#9733;</i>':''}${ms?'<i class="ckb">'+(sel?'&#10003;':'')+'</i>':''}</div>`;
            });
            if(!Q&&!ms)it.push(`<div class="s add" id="add"><b>+</b><span>Impor</span></div>`);
