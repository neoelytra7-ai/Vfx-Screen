             new:(a,b)=>(ADDED[b.id]||0)-(ADDED[a.id]||0),
             last:(a,b)=>(LAST[b.id]||0)-(LAST[a.id]||0)||a.name.localeCompare(b.name),
             size:(a,b)=>(SIZE[b.id]||-1)-(SIZE[a.id]||-1)||a.name.localeCompare(b.name)}[SORT];
            v.sort((a,b)=>(PIN.has(b.id)-PIN.has(a.id))||cmp(a,b));
            return v;
          }
          function refresh(){let n;try{n=Host.list()}catch(e){n='[]'}if(n===window.__ls&&pg.firstChild)return;window.__ls=n;try{P=JSON.parse(n)}catch(e){P=[]}touchAdded();draw()}
          function draw(){
