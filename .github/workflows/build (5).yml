          Runway|legL=.8,waist=.4,headBody=-.4,arms=-.4,thighs=-.4
          Balanced|waist=.25,legL=.2,headBody=-.15
          """)
          }

          class Op(val cx: Float, val cy: Float, val rx: Float, val ry: Float, val th: Float, val sx: Float, val sy: Float, val shx: Float, val shy: Float, val rot: Float) {
              val c = cos(th); val s = sin(th)
          }

          object Warp {
              private val SYM = listOf(33 to 263, 133 to 362, 159 to 386, 145 to 374, 246 to 466, 7 to 249, 70 to 300, 105 to 334, 107 to 336, 46 to 276, 55 to 285, 129 to 358, 98 to 327, 49 to 279,
                  61 to 291, 37 to 267, 84 to 314, 40 to 270, 234 to 454, 127 to 356, 93 to 323, 132 to 361, 58 to 288, 172 to 397, 136 to 365, 150 to 379, 149 to 378, 176 to 400, 148 to 377,
                  21 to 251, 54 to 284, 103 to 332, 67 to 297, 468 to 473)
              /** All face operators are defined in a face-aligned frame (origin between the eyes, unit = inter-eye distance), so they follow roll and size. */
              fun faceOps(f: FloatArray, p: Map<String, Float>, K: Float, out: MutableList<Op>) {
                  if (p.values.all { it == 0f }) return
                  fun x(i: Int) = f[i * 2]
                  fun y(i: Int) = f[i * 2 + 1]
                  val u = hypot(x(473) - x(468), y(473) - y(468)); if (u < 8f) return
                  val th = atan2(y(473) - y(468), x(473) - x(468)); val ct = cos(th); val st = sin(th)
                  val mx = (x(468) + x(473)) / 2; val my = (y(468) + y(473)) / 2
                  fun px(a: Float, b: Float) = mx + (ct * a - st * b) * u
                  fun py(a: Float, b: Float) = my + (st * a + ct * b) * u
                  fun v(n: String) = (p[n] ?: 0f) * K
                  fun mv(cx: Float, cy: Float, r: Float, dx: Float, dy: Float) { if (dx != 0f || dy != 0f) out.add(Op(cx, cy, r * u, r * u, th, 0f, 0f, dx * u, dy * u, 0f)) }
                  fun mvi(i: Int, r: Float, dx: Float, dy: Float) = mv(x(i), y(i), r, dx, dy)
                  fun sym(il: Int, ir: Int, r: Float, dxOut: Float, dy: Float) { mvi(il, r, -dxOut, dy); mvi(ir, r, dxOut, dy) }
                  fun sc(cx: Float, cy: Float, rx: Float, ry: Float, sx: Float, sy: Float) { if (sx != 0f || sy != 0f) out.add(Op(cx, cy, rx * u, ry * u, th, sx.coerceIn(-0.6f, 0.6f), sy.coerceIn(-0.6f, 0.6f), 0f, 0f, 0f)) }

                  // ---- face shape
                  val fwv = v("faceW")
                  if (fwv != 0f) { for ((a, b) in listOf(234 to 454, 93 to 323, 132 to 361, 58 to 288, 172 to 397, 136 to 365, 150 to 379)) { sym(a, b, 0.45f, fwv * 0.09f, 0f) } }
                  v("faceL").let { mvi(152, 0.8f, 0f, it * 0.12f); mvi(10, 0.9f, 0f, -it * 0.10f) }
                  v("headScale").let { sc(px(0f, 0.4f), py(0f, 0.4f), 3.2f, 3.6f, it * 0.25f, it * 0.25f) }
                  val tpv = v("taper")
                  if (tpv != 0f) { for ((a, b, wt) in listOf(Triple(58, 288, 0.04f), Triple(172, 397, 0.07f), Triple(136, 365, 0.09f), Triple(150, 379, 0.11f), Triple(149, 378, 0.12f), Triple(176, 400, 0.12f), Triple(148, 377, 0.11f))) { sym(a, b, 0.38f, -tpv * wt, 0f) } }
                  v("templeW").let { sym(21, 251, 0.45f, it * 0.07f, 0f); sym(54, 284, 0.45f, it * 0.06f, 0f) }
                  v("foreH").let { for ((i, r) in listOf(10 to 0.85f, 109 to 0.7f, 338 to 0.7f, 67 to 0.6f, 297 to 0.6f)) mvi(i, r, 0f, -it * 0.13f) }
                  v("foreW").let { sym(103, 332, 0.5f, it * 0.06f, 0f); sym(54, 284, 0.5f, it * 0.05f, 0f) }
                  v("cheekW").let { sym(234, 454, 0.5f, it * 0.07f, 0f); sym(93, 323, 0.5f, it * 0.06f, 0f) }
                  v("cheekFull").let { sym(205, 425, 0.45f, it * 0.05f, 0f); sym(150, 379, 0.4f, it * 0.03f, 0f) }
                  v("hairVol").let { sc(px(0f, -0.9f), py(0f, -0.9f), 2.6f, 2.4f, it * 0.18f, it * 0.12f) }
                  v("crown").let { mv(px(0f, -1.5f), py(0f, -1.5f), 1.1f, 0f, -it * 0.2f) }
                  // ---- jaw & chin
                  v("jawW").let { for ((a, b) in listOf(58 to 288, 172 to 397, 136 to 365, 150 to 379, 149 to 378)) sym(a, b, 0.38f, it * 0.08f, 0f) }
                  v("jawAng").let { sym(58, 288, 0.3f, -it * 0.04f, it * 0.02f); sym(172, 397, 0.3f, -it * 0.03f, it * 0.01f) }
                  v("chinL").let { mvi(152, 0.5f, 0f, it * 0.12f); sym(148, 377, 0.4f, 0f, it * 0.09f) }
                  v("chinW").let { sym(148, 377, 0.35f, it * 0.07f, 0f); sym(176, 400, 0.3f, it * 0.05f, 0f) }
                  v("chinPt").let { sym(148, 377, 0.4f, -it * 0.08f, 0f); mvi(152, 0.45f, 0f, it * 0.06f) }
                  // ---- eyes
                  val ewL = hypot(x(133) - x(33), y(133) - y(33)); val ewR = hypot(x(362) - x(263), y(362) - y(263))
                  val es = listOf(listOf(33, 133, 468, -1), listOf(263, 362, 473, 1))
                  for ((si, e) in es.withIndex()) {
                      val outer = e[0]; val inner = e[1]; val sg = e[3].toFloat(); val ew = (if (si == 0) ewL else ewR) / u
                      val cx = (x(outer) + x(inner)) / 2; val cy = (y(outer) + y(inner)) / 2
                      val d = v("eyeSizeD") * (if (si == 0) -1f else 1f)
                      val size = (v("eyeSize") - d) * 0.45f
                      sc(cx, cy, ew * 1.25f, ew * 1.25f, size, size)
                      sc(cx, cy, ew * 1.3f, ew * 0.9f, v("eyeW") * 0.4f, 0f)
                      sc(cx, cy, ew * 1.1f, ew * 0.8f, 0f, v("eyeH") * 0.5f)
                      v("eyeTilt").let { mvi(outer, 0.3f, 0f, -it * 0.05f); mvi(inner, 0.25f, 0f, it * 0.025f) }
                      mvi(inner, 0.25f, -sg * v("eyeInner") * 0.04f, 0f)
                      mvi(outer, 0.28f, sg * v("eyeOuter") * 0.05f, -v("eyeOuter") * 0.01f)
                      mv(cx, cy, 0.55f, sg * v("eyeDist") * 0.07f, -v("eyeY") * 0.06f)
                  }
                  // ---- brows
                  val bu = listOf(listOf(70, 63, 105, 66, 107), listOf(300, 293, 334, 296, 336)); val bl = listOf(listOf(46, 53, 52, 65, 55), listOf(276, 283, 282, 295, 285))
                  for (si in 0..1) {
                      val sg = if (si == 0) -1f else 1f
                      for (i in bu[si] + bl[si]) mvi(i, 0.22f, 0f, -v("browY") * 0.07f)
                      for (i in listOf(bu[si][0], bl[si][0])) { mvi(i, 0.22f, 0f, -v("browTilt") * 0.06f); mvi(i, 0.22f, sg * v("browLen") * 0.06f, 0f) }
                      for (i in listOf(bu[si][4], bl[si][4])) { mvi(i, 0.22f, 0f, v("browTilt") * 0.03f); mvi(i, 0.22f, sg * v("browDist") * 0.05f, 0f) }
                      mvi(bu[si][2], 0.22f, 0f, -v("browArch") * 0.05f); mvi(bl[si][2], 0.22f, 0f, -v("browArch") * 0.04f)
                      for (i in bu[si]) mvi(i, 0.2f, 0f, -v("browThick") * 0.025f)
                      for (i in bl[si]) mvi(i, 0.2f, 0f, v("browThick") * 0.025f)
                  }
                  // ---- nose
                  v("noseW").let { sym(129, 358, 0.22f, it * 0.05f, 0f); sym(49, 279, 0.22f, it * 0.04f, 0f); sym(98, 327, 0.2f, it * 0.03f, 0f) }
                  v("noseBridge").let { sym(193, 417, 0.2f, it * 0.03f, 0f); sym(122, 351, 0.25f, it * 0.025f, 0f) }
                  v("noseTip").let { sc(x(1), y(1), 0.28f, 0.28f, it * 0.4f, it * 0.4f) }
                  v("noseTipY").let { mvi(1, 0.3f, 0f, -it * 0.05f); mvi(4, 0.3f, 0f, -it * 0.04f) }
                  v("noseL").let { mvi(1, 0.4f, 0f, it * 0.06f); mvi(2, 0.4f, 0f, it * 0.05f); sym(129, 358, 0.3f, 0f, it * 0.04f) }
                  v("nostril").let { sym(98, 327, 0.2f, it * 0.03f, it * 0.01f) }
                  // ---- lips
                  v("mouthW").let { sym(61, 291, 0.3f, it * 0.07f, 0f) }
                  v("lipUp").let { for (i in listOf(0, 37, 267, 39, 269)) mvi(i, 0.22f, 0f, -it * 0.032f) }
                  v("lipLow").let { for (i in listOf(17, 84, 314, 181, 405)) mvi(i, 0.24f, 0f, it * 0.04f) }
                  v("mouthY").let { mv((x(0) + x(17)) / 2, (y(0) + y(17)) / 2, 0.7f, 0f, -it * 0.07f) }
                  v("smile").let { sym(61, 291, 0.28f, it * 0.02f, -it * 0.04f) }
                  v("lipPeak").let { mvi(37, 0.15f, 0f, -it * 0.03f); mvi(267, 0.15f, 0f, -it * 0.03f); mvi(0, 0.15f, 0f, it * 0.015f) }
                  // ---- auto symmetry: every left/right landmark pair is pulled toward its mirror image across the eyes-to-chin axis
                  val sym0 = maxOf(0f, v("symm"))
                  if (sym0 > 0f) {
                      val axx = x(152) - mx; val ayy = y(152) - my; val al = hypot(axx, ayy).coerceAtLeast(1f); val ax = axx / al; val ay = ayy / al
                      fun refl(qx: Float, qy: Float): FloatArray { val rx = qx - mx; val ry = qy - my; val dot = rx * ax + ry * ay; return floatArrayOf(2 * (mx + ax * dot) - qx, 2 * (my + ay * dot) - qy) }
                      for ((l, r) in SYM) {
                          val rr = refl(x(r), y(r)); val ll = refl(x(l), y(l))
                          for ((i, tx, ty) in listOf(Triple(l, (x(l) + rr[0]) / 2, (y(l) + rr[1]) / 2), Triple(r, (x(r) + ll[0]) / 2, (y(r) + ll[1]) / 2))) {
                              val ddx = (tx - x(i)) * sym0; val ddy = (ty - y(i)) * sym0
                              mv(x(i), y(i), 0.2f, (ct * ddx + st * ddy) / u, (-st * ddx + ct * ddy) / u)
                          }
                      }
                  }
                  // ---- balance and centering
                  val eyd = v("eyeYD")
                  if (eyd != 0f) { for ((si, e) in es.withIndex()) { mv((x(e[0]) + x(e[1])) / 2, (y(e[0]) + y(e[1])) / 2, 0.55f, 0f, eyd * 0.04f * (if (si == 0) 1f else -1f)) } }
                  val brd = v("browD")
                  if (brd != 0f) { for (si in 0..1) { for (i in bu[si] + bl[si]) mvi(i, 0.22f, 0f, brd * 0.04f * (if (si == 0) 1f else -1f)) } }
                  val nsh = v("noseShift")
                  if (nsh != 0f) { for ((i, r) in listOf(1 to 0.5f, 2 to 0.45f, 129 to 0.3f, 358 to 0.3f, 6 to 0.4f)) mvi(i, r, nsh * 0.04f, 0f) }
                  val mt = v("mouthTilt")
                  if (mt != 0f) { mvi(61, 0.28f, 0f, -mt * 0.03f); mvi(291, 0.28f, 0f, mt * 0.03f) }
                  val msh = v("mouthShift")
                  if (msh != 0f) mv((x(0) + x(17)) / 2, (y(0) + y(17)) / 2, 0.7f, msh * 0.05f, 0f)
                  val jd = v("jawD")
                  if (jd != 0f) { for (i in listOf(58, 172, 136, 150, 149, 288, 397, 365, 379, 378)) mvi(i, 0.38f, -jd * 0.06f, 0f) }
                  val csh = v("chinShift")
                  if (csh != 0f) { mvi(152, 0.45f, csh * 0.05f, 0f); mvi(148, 0.4f, csh * 0.04f, 0f); mvi(377, 0.4f, csh * 0.04f, 0f) }
                  // ---- ears & neck
                  v("earSize").let { sc(px(-1.28f, 0.2f), py(-1.28f, 0.2f), 0.45f, 0.45f, it * 0.5f, it * 0.5f); sc(px(1.28f, 0.2f), py(1.28f, 0.2f), 0.45f, 0.45f, it * 0.5f, it * 0.5f) }
                  v("neckL").let { sc(px(0f, 2.1f), py(0f, 2.1f), 1.1f, 1.4f, 0f, it * 0.3f) }
                  v("neckW").let { sc(px(0f, 2.1f), py(0f, 2.1f), 1.1f, 1.4f, it * 0.25f, 0f) }
              }

              fun bodyOps(f: FloatArray, p: Map<String, Float>, K: Float, out: MutableList<Op>) {
                  if (p.values.all { it == 0f }) return
                  fun x(i: Int) = f[i * 2]
                  fun y(i: Int) = f[i * 2 + 1]
                  fun v(n: String) = (p[n] ?: 0f) * K
                  val ws = hypot(x(11) - x(12), y(11) - y(12)); if (ws < 20f) return
                  val smx = (x(11) + x(12)) / 2; val smy = (y(11) + y(12)) / 2; val hmx = (x(23) + x(24)) / 2; val hmy = (y(23) + y(24)) / 2
                  val tl = hypot(hmx - smx, hmy - smy); val ta = atan2(hmy - smy, hmx - smx); val perp = ta + (PI / 2).toFloat()
                  fun sc(cx: Float, cy: Float, rx: Float, ry: Float, th: Float, sx: Float, sy: Float) { if (sx != 0f || sy != 0f) out.add(Op(cx, cy, rx, ry, th, sx.coerceIn(-0.6f, 0.6f), sy.coerceIn(-0.6f, 0.6f), 0f, 0f, 0f)) }
                  // limb: scale across the limb axis, centred at fraction t of the segment a->b
                  fun limb(a: Int, b: Int, t: Float, wid: Float, amt: Float) {
                      if (amt == 0f) return
                      val ax = x(a); val ay = y(a); val bx = x(b); val by = y(b); val l = hypot(bx - ax, by - ay); if (l < 10f) return
                      sc(ax + (bx - ax) * t, ay + (by - ay) * t, wid * l, 0.55f * l, atan2(by - ay, bx - ax) + (PI / 2).toFloat(), amt, 0f)
                  }
                  val shw = v("shoulderW")
                  if (shw != 0f) { for (i in listOf(11, 12)) {
                      val dx = x(i) - smx; val dy = y(i) - smy; val l = hypot(dx, dy).coerceAtLeast(1f)
                      out.add(Op(x(i), y(i), 0.45f * ws, 0.45f * ws, 0f, 0f, 0f, dx / l * shw * 0.08f * ws, dy / l * shw * 0.08f * ws, 0f)) } }
                  sc(smx + (hmx - smx) * 0.62f, smy + (hmy - smy) * 0.62f, 0.75f * ws, 0.28f * tl, perp, -v("waist") * 0.22f, 0f)
                  sc(hmx, hmy, 0.85f * ws, 0.25f * tl, perp, v("hips") * 0.2f, 0f)
                  for ((h, k) in listOf(23 to 25, 24 to 26)) limb(h, k, 0.45f, 0.24f, v("thighs") * 0.22f)
                  for ((k, a) in listOf(25 to 27, 26 to 28)) limb(k, a, 0.4f, 0.2f, v("calves") * 0.22f)
                  for ((s, e) in listOf(11 to 13, 12 to 14)) limb(s, e, 0.5f, 0.28f, v("arms") * 0.22f)
                  for ((e, w) in listOf(13 to 15, 14 to 16)) limb(e, w, 0.5f, 0.26f, v("arms") * 0.18f)
                  val ax = (x(27) + x(28)) / 2; val ay = (y(27) + y(28)) / 2
                  sc((hmx + ax) / 2, (hmy + ay) / 2, 1.1f * ws, 0.55f * (ay - hmy).coerceAtLeast(10f), 0f, 0f, v("legL") * 0.12f)
                  sc((smx + hmx) / 2, (smy + hmy) / 2, 1.0f * ws, 0.6f * tl, perp, 0f, v("torsoL") * 0.12f)
                  val hx = (x(7) + x(8)) / 2; val hy = (y(7) + y(8)) / 2; val hs = hypot(x(7) - x(8), y(7) - y(8)).coerceAtLeast(10f)
                  sc(hx, hy, 1.6f * hs, 1.6f * hs, 0f, v("headBody") * 0.25f, v("headBody") * 0.25f)
                  sc((hx + smx) / 2, (hy + smy) / 2, 0.45f * ws, 0.4f * ws, 0f, v("neckB") * 0.25f, 0f)
              }

              /** Vertex grid for drawBitmapMesh: every grid point moved by the summed operators. Cheap enough to redo while a slider moves. */
              fun mesh(w: Int, h: Int, mw: Int, mh: Int, ops: List<Op>, k: Float): FloatArray {
                  val verts = FloatArray((mw + 1) * (mh + 1) * 2); val edge = 0.04f * minOf(w, h)
                  Img.par(mh + 1) { j ->
                      for (i in 0..mw) {
                          val vx = w * i.toFloat() / mw; val vy = h * j.toFloat() / mh
                          val ax = vx / k; val ay = vy / k
                          var dx = 0f; var dy = 0f
                          for (o in ops) {
                              val ddx = ax - o.cx; val ddy = ay - o.cy
                              val qx = o.c * ddx + o.s * ddy; val qy = -o.s * ddx + o.c * ddy
                              val t2 = (qx / o.rx) * (qx / o.rx) + (qy / o.ry) * (qy / o.ry)
                              if (t2 >= 1f) continue
                              val fo = (1f - t2) * (1f - t2)
                              val lx = fo * (o.sx * qx + o.shx - o.rot * qy); val ly = fo * (o.sy * qy + o.shy + o.rot * qx)
                              dx += o.c * lx - o.s * ly; dy += o.s * lx + o.c * ly
                          }
                          val e = Img.smooth(minOf(minOf(vx, vy), minOf(w - vx, h - vy)), 0f, edge)
                          val idx = (j * (mw + 1) + i) * 2
                          verts[idx] = vx + dx * k * e; verts[idx + 1] = vy + dy * k * e
                      }
                  }
                  return verts
              }

              fun apply(src: Bitmap, ops: List<Op>, k: Float): Bitmap {
                  if (ops.isEmpty()) return src
                  val w = src.width; val h = src.height; val mw = 220; val mh = maxOf(2, (mw * h.toFloat() / w).roundToInt())
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  Canvas(out).drawBitmapMesh(src, mw, mh, mesh(w, h, mw, mh, ops, k), 0, null, 0, Paint(Paint.FILTER_BITMAP_FLAG or Paint.ANTI_ALIAS_FLAG))
                  return out
              }
          }
