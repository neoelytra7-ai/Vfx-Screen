                  val ob = Bitmap.createBitmap(an.w, an.h, Bitmap.Config.ARGB_8888); ob.setPixels(ov, 0, an.w, 0, 0, an.w, an.h)
                  c.drawBitmap(Bitmap.createScaledBitmap(ob, w, h, true), 0f, 0f, null)
