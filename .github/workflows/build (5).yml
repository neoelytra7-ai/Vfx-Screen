                      "Gems forehead" -> for (i in -2..2) gem(i * 0.17f, -1.0f - 0.05f * (2 - abs(i)) * -1f + 0.0f, (0.045f - 0.008f * abs(i)) * sz, c2)
                      "Beauty mark" -> cv.drawCircle(L(0.55f), L(1.0f), L(0.016f * sz), fill(0xFF2A1A16.toInt()))
                      "Nose stud" -> { gem(-0.16f, 0.78f, 0.028f * sz, c2) }
                      "Hair bow" -> { val bx = L(-0.85f); val by = L(-1.75f); cv.drawOval(RectF(bx - L(0.32f), by - L(0.16f), bx, by + L(0.16f)), fill(c1)); cv.drawOval(RectF(bx, by - L(0.16f), bx + L(0.32f), by + L(0.16f)), fill(c1)); cv.drawCircle(bx, by, L(0.07f), fill(c2)) }
                      "Headband" -> { val p = Path().apply { moveTo(L(-1.25f), L(-0.45f)); quadTo(0f, L(-2.6f), L(1.25f), L(-0.45f)) }; cv.drawPath(p, line(0x44000000, L(0.14f * tk), L(0.03f))); cv.drawPath(p, line(c1, L(0.11f * tk))) }
                  }
                  cv.restore()
              }

              private fun png(cv: Canvas, an: Analysis, k: Float, lp: LayerP) {
                  val b = LayerStore.bmps[lp.bmp] ?: return
                  var ax = 0f; var ay = 0f; var unit = 1f; var ang = 0f; var baseW = 1f
                  if (lp.anchor <= 8) {
                      val f0 = an.faces.getOrNull(lp.face) ?: return; val f = FloatArray(f0.size) { f0[it] * k }
                      val u = hypot(f[473 * 2] - f[468 * 2], f[473 * 2 + 1] - f[468 * 2 + 1]); if (u < 8f) return
                      val th = atan2(f[473 * 2 + 1] - f[468 * 2 + 1], f[473 * 2] - f[468 * 2]); val mx = (f[468 * 2] + f[473 * 2]) / 2; val my = (f[468 * 2 + 1] + f[473 * 2 + 1]) / 2
                      val (a, c) = when (lp.anchor) { 0 -> 0f to -2.0f; 1 -> 0f to -1.1f; 2 -> 0f to 0f; 3 -> 0f to 0.7f; 4 -> 0f to 1.45f; 5 -> 0f to 2.1f; 6 -> -1.3f to 0.3f; 7 -> 1.3f to 0.3f; else -> 0f to 2.6f }
                      ax = mx + (cos(th) * a - sin(th) * c) * u; ay = my + (sin(th) * a + cos(th) * c) * u; unit = u; ang = Math.toDegrees(th.toDouble()).toFloat(); baseW = 2.6f * u
                  } else {
                      val p = an.pose ?: return; fun X(i: Int) = p[i * 2] * k
                      fun Y(i: Int) = p[i * 2 + 1] * k
                      val ws = hypot(X(11) - X(12), Y(11) - Y(12)); if (ws < 20f) return
                      val sx = (X(11) + X(12)) / 2; val sy = (Y(11) + Y(12)) / 2; val hx = (X(23) + X(24)) / 2; val hy = (Y(23) + Y(24)) / 2
                      val t = when (lp.anchor) { 9 -> 0f; 10 -> 0.3f; 11 -> 0.5f; else -> 1f }
                      ax = sx + (hx - sx) * t; ay = sy + (hy - sy) * t; unit = ws; ang = Math.toDegrees(atan2((Y(12) - Y(11)).toDouble(), (X(12) - X(11)).toDouble())).toFloat(); baseW = 1.5f * ws
                  }
                  val s = baseW * lp.scale / b.width
                  val m = Matrix(); m.postTranslate(-b.width / 2f, -b.height / 2f); m.postScale(s, s); m.postRotate(ang + lp.rot); m.postTranslate(ax + lp.dx * unit, ay + lp.dy * unit)
                  cv.drawBitmap(b, m, Paint(Paint.FILTER_BITMAP_FLAG or Paint.ANTI_ALIAS_FLAG).apply { alpha = (lp.alpha.coerceIn(0f, 1f) * 255f).toInt(); blendMode = BLENDS[lp.blend.coerceIn(0, 3)] })
              }
          }

          class OutfitP {
              var mode = 0; var c1 = 0; var c2 = 0; var scale = 1f; var angle = 0f; var amt = 0.9f; var keep = 0.85f
              fun key() = "$mode$c1$c2$scale$angle$amt$keep"
              fun copy() = OutfitP().also { it.mode = mode; it.c1 = c1; it.c2 = c2; it.scale = scale; it.angle = angle; it.amt = amt; it.keep = keep }
          }

          object Outfit {
              /** Clothes recolour / pattern in OKLab: the fabric's own light and folds are kept (keep), the colour and pattern are replaced. */
              fun apply(px: IntArray, w: Int, h: Int, M: FloatArray, op: OutfitP) {
                  if (op.mode == 0 || op.c1 == 0) return
                  val n = w * h; val t3 = FloatArray(3); var sl = 0.0; var sw = 0.0; var i0 = 0
                  while (i0 < n) { if (M[i0] > 0.6f) { Lab.lab(px[i0], t3, 0); sl += t3[0]; sw += 1.0 }; i0 += 3 }
                  if (sw < 20.0) return
                  val ml = (sl / sw).toFloat(); val c1 = Lab.of(op.c1); val c2 = Lab.of(if (op.c2 != 0) op.c2 else op.c1); val per = (0.02f + 0.06f * op.scale) * maxOf(w, h)
                  val ca = cos(Math.toRadians(op.angle.toDouble())).toFloat(); val sa = sin(Math.toRadians(op.angle.toDouble())).toFloat()
                  Img.par(h) { y ->
                      val t = FloatArray(3)
                      for (x in 0 until w) {
                          val i = y * w + x; val m = M[i] * op.amt; if (m < 0.01f) continue
                          Lab.lab(px[i], t, 0)
                          val u = (x * ca + y * sa) / per; val v = (-x * sa + y * ca) / per
                          val g = when (op.mode) {
                              2 -> Img.smooth(abs(u - floor(u) - 0.5f), 0.22f, 0.28f)
                              3 -> maxOf(Img.smooth(abs(u - floor(u) - 0.5f), 0.3f, 0.36f), 0.7f * Img.smooth(abs(v - floor(v) - 0.5f), 0.4f, 0.46f)).coerceIn(0f, 1f)
                              4 -> { val fx = u * 2f - floor(u * 2f) - 0.5f; val fy = v * 2f - floor(v * 2f) - 0.5f; 1f - Img.smooth(sqrt(fx * fx + fy * fy), 0.2f, 0.26f) }
                              5 -> (y.toFloat() / h)
                              else -> 0f
                          }
                          val lt = Img.mix(c1[0], c2[0], g); val at = Img.mix(c1[1], c2[1], g); val bt = Img.mix(c1[2], c2[2], g)
                          val ln = (lt + (t[0] - ml) * op.keep).coerceIn(0f, 1.02f)
                          px[i] = Lab.rgb(t[0] + (ln - t[0]) * m, t[1] + (at - t[1]) * m, t[2] + (bt - t[2]) * m, px[i] ushr 24)
                      }
                  }
              }
          }

          object HairWave {
              /** Waves and curls: strands are displaced sideways by a sine field that only acts inside the hair mask (sampled bilinearly, so no jaggies). */
              fun apply(px: IntArray, w: Int, h: Int, M: FloatArray, wave: Float, freq: Float, u: Float) {
                  if (wave <= 0f) return
                  val src = px.copyOf(); val amp = wave * 0.18f * u; val per = u * (1.4f - freq * 0.9f)
                  Img.par(h) { y ->
                      for (x in 0 until w) {
                          val i = y * w + x; val m = M[i]; if (m < 0.02f) continue
                          val sx = (x + amp * sin(6.2832f * y / per) * m).coerceIn(0f, w - 1.001f); val sy = (y + amp * 0.4f * sin(6.2832f * x / (per * 1.7f) + 1.3f) * m).coerceIn(0f, h - 1.001f)
                          val x0 = sx.toInt(); val y0 = sy.toInt(); val fx = sx - x0; val fy = sy - y0
                          fun ch(s2: Int): Int { val a = ((src[y0 * w + x0] shr s2) and 255) * (1 - fx) + ((src[y0 * w + x0 + 1] shr s2) and 255) * fx; val b = ((src[(y0 + 1) * w + x0] shr s2) and 255) * (1 - fx) + ((src[(y0 + 1) * w + x0 + 1] shr s2) and 255) * fx; return (a * (1 - fy) + b * fy).toInt().coerceIn(0, 255) }
                          px[i] = (0xFF shl 24) or (ch(16) shl 16) or (ch(8) shl 8) or ch(0)
                      }
                  }
              }
          }
