                          small.setPixels(blurred, 0, sw, 0, 0, sw, sh)
                          val up = Bitmap.createScaledBitmap(small, w, h, true); val upx = IntArray(n); up.getPixels(upx, 0, w, 0, 0, w, h)
                          for (i in 0 until n) {
