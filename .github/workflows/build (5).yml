              }

              fun run(an: Analysis, base: Bitmap, st: EditState, depth: DepthData?, cache: MaskCache): Bitmap = finish(an, st, bake(an, base, st, depth, cache) { false }, depth)

              /** Shows what the AI found: part masks tinted, plus the 478 face points and body joints. */
              fun debug(an: Analysis, base: Bitmap): Bitmap {
