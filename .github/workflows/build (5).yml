          package com.example.facelab

          import ai.onnxruntime.*
          import android.content.ContentValues
          import android.content.Context
          import android.graphics.*
          import android.provider.MediaStore
          import org.tensorflow.lite.Interpreter
          import org.tensorflow.lite.gpu.GpuDelegate
          import java.io.File
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.*

          /** Depth Anything V2 as a TFLite model. The GPU delegate runs it on the Adreno GPU; if the delegate cannot take the graph it falls back to CPU. */
          object DepthTfl {
              private var interp: Interpreter? = null
              private var gpu: GpuDelegate? = null
              private var key = ""
              @Volatile var backend = ""; @Volatile var lastMs = 0L
              private val MEAN = floatArrayOf(0.485f, 0.456f, 0.406f); private val STD = floatArrayOf(0.229f, 0.224f, 0.225f)

              private fun open(path: String, wantGpu: Boolean) {
                  val k = "$path|$wantGpu"; if (k == key && interp != null) return
                  interp?.close(); gpu?.close(); interp = null; gpu = null
                  if (wantGpu) {
                      var g: GpuDelegate? = null
                      try { g = GpuDelegate(); val o = Interpreter.Options(); o.addDelegate(g); interp = Interpreter(File(path), o); gpu = g; backend = "GPU (TFLite delegate)" }
                      catch (e: Throwable) { try { g?.close() } catch (_: Throwable) {}; interp = null }
                  }
                  if (interp == null) { val o = Interpreter.Options(); o.setNumThreads(5); interp = Interpreter(File(path), o); backend = "CPU (TFLite)" }
                  key = k
              }

              fun run(path: String, src: Bitmap, wantGpu: Boolean, tta: Boolean): DepthData {
                  open(path, wantGpu); val ip = interp!!
                  val ish = ip.getInputTensor(0).shape(); val nchw = ish.size == 4 && ish[1] == 3
                  val H = if (nchw) ish[2] else ish[1]; val W = if (nchw) ish[3] else ish[2]
                  val fit = min(W.toFloat() / src.width, H.toFloat() / src.height)
                  val dw = max(1, (src.width * fit).roundToInt()); val dh = max(1, (src.height * fit).roundToInt()); val ox = (W - dw) / 2; val oy = (H - dh) / 2
                  val cb = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888); val cv = Canvas(cb); cv.drawColor(Color.rgb(124, 116, 104))
                  cv.drawBitmap(Bitmap.createScaledBitmap(src, dw, dh, true), ox.toFloat(), oy.toFloat(), null)
                  val px = IntArray(W * H); cb.getPixels(px, 0, W, 0, 0, W, H)
                  val on = ip.getOutputTensor(0).shape().fold(1) { a, b -> a * b }
                  val t0 = System.nanoTime()
                  fun pass(flip: Boolean): FloatArray {
                      val ib = ByteBuffer.allocateDirect(3 * W * H * 4).order(ByteOrder.nativeOrder()); val fb = ib.asFloatBuffer()
                      if (nchw) { for (c in 0..2) for (y in 0 until H) for (x in 0 until W) { val p = px[y * W + (if (flip) W - 1 - x else x)]; fb.put((((p shr (16 - 8 * c)) and 255) / 255f - MEAN[c]) / STD[c]) } }
                      else { for (y in 0 until H) for (x in 0 until W) { val p = px[y * W + (if (flip) W - 1 - x else x)]; for (c in 0..2) fb.put((((p shr (16 - 8 * c)) and 255) / 255f - MEAN[c]) / STD[c]) } }
                      val ob = ByteBuffer.allocateDirect(on * 4).order(ByteOrder.nativeOrder())
                      ip.run(ib, ob); ob.rewind(); val out = FloatArray(on); ob.asFloatBuffer().get(out)
                      if (flip && on == W * H) for (y in 0 until H) for (x in 0 until W / 2) { val i = y * W + x; val j = y * W + (W - 1 - x); val t = out[i]; out[i] = out[j]; out[j] = t }
                      return out
                  }
                  val a = pass(false); val d = if (tta) { val b = pass(true); FloatArray(a.size) { (a[it] + b[it]) * 0.5f } } else a
                  lastMs = (System.nanoTime() - t0) / 1_000_000
                  val crop = FloatArray(dw * dh) { d[(oy + it / dw) * W + ox + it % dw] }
                  val sorted = crop.copyOf().also { it.sort() }
                  val lo = sorted[(sorted.size * 0.01f).toInt()]; val hi = sorted[(sorted.size * 0.99f).toInt()]
                  return DepthData(FloatArray(crop.size) { ((crop[it] - lo) / (hi - lo + 1e-6f)).coerceIn(0f, 1f) }, dw, dh)
              }
          }

          class RestoreP {
              var on = false; var strength = 0.7f; var custom = ""
              fun key() = "$on$strength$custom"
              fun copy() = RestoreP().also { it.on = on; it.strength = strength; it.custom = custom }
          }

          /** Face restoration (GFPGAN 1.4 or any 512 px, [-1,1] model): the face is aligned with a 5-point similarity transform, restored, then blended back through a feathered face-oval mask. */
          object Restore {
              private var sess: OrtSession? = null; private var skey = ""
              private val env = OrtEnvironment.getEnvironment()
              private val TPL = floatArrayOf(0.37691676f, 0.46864664f, 0.62285697f, 0.46912813f, 0.50123859f, 0.61331904f, 0.39308822f, 0.72541100f, 0.61150205f, 0.72490465f)
              private val OVAL = intArrayOf(10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109)

              fun run(path: String, work: Bitmap, f: FloatArray, strength: Float) {
                  if (sess == null || skey != path) { sess?.close(); sess = env.createSession(path, Acc.opts(5)); skey = path }
                  val s = sess!!; val idx = intArrayOf(468, 473, 1, 61, 291)
                  var msx = 0.0; var msy = 0.0; var mdx = 0.0; var mdy = 0.0
                  for (k in 0..4) { msx += f[idx[k] * 2]; msy += f[idx[k] * 2 + 1]; mdx += TPL[k * 2] * 512.0; mdy += TPL[k * 2 + 1] * 512.0 }
                  msx /= 5; msy /= 5; mdx /= 5; mdy /= 5
                  var nr = 0.0; var ni = 0.0; var den = 0.0
                  for (k in 0..4) { val ax = f[idx[k] * 2] - msx; val ay = f[idx[k] * 2 + 1] - msy; val bx = TPL[k * 2] * 512.0 - mdx; val by = TPL[k * 2 + 1] * 512.0 - mdy
                      nr += bx * ax + by * ay; ni += by * ax - bx * ay; den += ax * ax + ay * ay }
                  if (den < 1e-3) return
                  val a = nr / den; val b = ni / den; val tx = mdx - (a * msx - b * msy); val ty = mdy - (a * msy + b * msx)
                  val m = Matrix(); m.setValues(floatArrayOf(a.toFloat(), (-b).toFloat(), tx.toFloat(), b.toFloat(), a.toFloat(), ty.toFloat(), 0f, 0f, 1f))
                  val inv = Matrix(); if (!m.invert(inv)) return
                  val crop = Bitmap.createBitmap(512, 512, Bitmap.Config.ARGB_8888); Canvas(crop).drawBitmap(work, m, Paint(Paint.FILTER_BITMAP_FLAG))
                  val px = IntArray(512 * 512); crop.getPixels(px, 0, 512, 0, 0, 512, 512); val hw = 512 * 512
                  val fb = ByteBuffer.allocateDirect(3 * hw * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                  for (c in 0..2) for (i in 0 until hw) fb.put((((px[i] shr (16 - 8 * c)) and 255) / 255f - 0.5f) / 0.5f)
                  fb.rewind()
                  val t = OnnxTensor.createTensor(env, fb, longArrayOf(1, 3, 512, 512)); val out = FloatArray(3 * hw)
                  try { s.run(mapOf(s.inputNames.first() to t)).use { r -> (r.first().value as OnnxTensor).floatBuffer.get(out) } } finally { t.close() }
                  val res = IntArray(hw) { i -> fun q(c: Int) = (((out[c * hw + i].coerceIn(-1f, 1f) + 1f) / 2f) * 255f + 0.5f).toInt()
                      (0xFF shl 24) or (q(0) shl 16) or (q(1) shl 8) or q(2) }
                  val layer = Bitmap.createBitmap(512, 512, Bitmap.Config.ARGB_8888); layer.setPixels(res, 0, 512, 0, 0, 512, 512)
                  val pts = FloatArray(OVAL.size * 2) { f[OVAL[it / 2] * 2 + it % 2] }; m.mapPoints(pts)
                  val path = Path(); for (i in OVAL.indices) if (i == 0) path.moveTo(pts[0], pts[1]) else path.lineTo(pts[i * 2], pts[i * 2 + 1]); path.close()
                  val mask = Bitmap.createBitmap(512, 512, Bitmap.Config.ARGB_8888)
                  Canvas(mask).drawPath(path, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; maskFilter = BlurMaskFilter(22f, BlurMaskFilter.Blur.NORMAL) })
                  Canvas(layer).drawBitmap(mask, 0f, 0f, Paint().apply { xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_IN) })
                  Canvas(work).drawBitmap(layer, inv, Paint(Paint.FILTER_BITMAP_FLAG).apply { alpha = (strength.coerceIn(0f, 1f) * 255f).toInt() })
              }
          }

          // ------------------------------------------------------------------ 3D: tilt, volume sculpt, scan

          class TiltP {
              var on = false; var yaw = 0f; var pitch = 0f; var roll = 0f; var dolly = 0f; var depthK = 1f; var pivot = 0.5f; var smooth = 0.3f; var protect = 0.5f
              fun key() = "$on$yaw$pitch$roll$dolly$depthK$pivot$smooth$protect"
              fun copy() = TiltP().also { it.on = on; it.yaw = yaw; it.pitch = pitch; it.roll = roll; it.dolly = dolly; it.depthK = depthK; it.pivot = pivot; it.smooth = smooth; it.protect = protect }
          }

          class SculptP {
              val v = HashMap<String, Float>(); var shade = 0.6f
              fun active() = v.values.any { it != 0f }
              fun key() = "${v.toSortedMap()}$shade"
              fun copy() = SculptP().also { it.v.putAll(v); it.shade = shade }
          }

          /** Relief edits on the depth field: Gaussian bumps anchored to the face mesh, so noses, cheeks and chins can gain or lose real volume. */
          object Sculpt {
              val DEFS = listOf("sBridge" to "Nose bridge", "sTip" to "Nose tip", "sCheek" to "Cheeks", "sChin" to "Chin", "sBrow" to "Brow ridge", "sFore" to "Forehead", "sJaw" to "Jaw", "sLips" to "Lips", "sEye" to "Eye sockets", "sHead" to "Head roundness")
              class Blob(val cx: Float, val cy: Float, val rx: Float, val ry: Float, val h: Float, val th: Float)

              fun blobs(an: Analysis, sp: SculptP): List<Blob> {
                  val out = ArrayList<Blob>()
                  for (f in an.faces) {
                      fun x(i: Int) = f[i * 2]
                      fun y(i: Int) = f[i * 2 + 1]
                      val u = hypot(x(473) - x(468), y(473) - y(468)); if (u < 8f) continue
                      val th = atan2(y(473) - y(468), x(473) - x(468)); val ct = cos(th); val st = sin(th); val mx = (x(468) + x(473)) / 2; val my = (y(468) + y(473)) / 2
                      fun px(a: Float, b: Float) = mx + (ct * a - st * b) * u
                      fun py(a: Float, b: Float) = my + (st * a + ct * b) * u
                      fun add(a: Float, b: Float, rx: Float, ry: Float, h: Float) { if (h != 0f) out.add(Blob(px(a, b), py(a, b), rx * u, ry * u, h, th)) }
                      fun g(n: String) = sp.v[n] ?: 0f
                      add(0f, 0.35f, 0.12f, 0.45f, g("sBridge") * 0.05f)
                      out.add(Blob(x(1), y(1), 0.22f * u, 0.22f * u, g("sTip") * 0.06f, th))
                      for (s in listOf(-1f, 1f)) { add(0.65f * s, 0.75f, 0.45f, 0.45f, g("sCheek") * 0.05f); add(0.4f * s, -0.18f, 0.4f, 0.12f, g("sBrow") * 0.04f)
                          add(0.95f * s, 1.3f, 0.5f, 0.5f, g("sJaw") * 0.04f); add(0.5f * s, 0f, 0.28f, 0.28f, -g("sEye") * 0.04f) }
                      out.add(Blob(x(152), y(152), 0.35f * u, 0.35f * u, g("sChin") * 0.05f, th)); add(0f, -0.9f, 0.8f, 0.8f, g("sFore") * 0.04f)
                      out.add(Blob((x(0) + x(17)) / 2, (y(0) + y(17)) / 2, 0.3f * u, 0.3f * u, g("sLips") * 0.04f, th)); add(0f, 0.5f, 2.3f, 2.3f, g("sHead") * 0.06f)
                  }
                  return out.filter { it.h != 0f }
              }

              private fun bump(b: Blob, x: Float, y: Float): Float {
                  val dx = x - b.cx; val dy = y - b.cy; val c = cos(b.th); val s = sin(b.th)
                  val qx = (c * dx + s * dy) / b.rx; val qy = (-s * dx + c * dy) / b.ry; val e = qx * qx + qy * qy
                  return if (e > 6f) 0f else b.h * exp(-2f * e)
              }
              fun grid(blobs: List<Blob>, aw: Int, ah: Int, mw: Int, mh: Int): FloatArray = FloatArray((mw + 1) * (mh + 1)) { n ->
                  val i = n % (mw + 1); val j = n / (mw + 1); val x = i.toFloat() / mw * aw; val y = j.toFloat() / mh * ah
                  var s = 0f; for (b in blobs) s += bump(b, x, y); s }
              fun field(blobs: List<Blob>, w: Int, h: Int, k: Float): FloatArray {
                  val out = FloatArray(w * h)
                  for (b in blobs) {
                      val r = 1.8f * maxOf(b.rx, b.ry) * k; val x0 = maxOf(0, (b.cx * k - r).toInt()); val x1 = minOf(w - 1, (b.cx * k + r).toInt()); val y0 = maxOf(0, (b.cy * k - r).toInt()); val y1 = minOf(h - 1, (b.cy * k + r).toInt())
                      for (y in y0..y1) for (x in x0..x1) out[y * w + x] += bump(b, x / k, y / k)
                  }
                  return out
              }
          }

          object Volume {
              /** Re-shades the picture as if the sculpted relief were real: lambert shading of the new normals minus the old ones, under the Light tab's direction. */
              fun apply(px: IntArray, w: Int, h: Int, d: FloatArray, delta: FloatArray, subj: FloatArray?, amt: Float, lp: LightP) {
                  val r = maxOf(2, (0.004f * maxOf(w, h)).toInt()); val d1 = Img.box(d, w, h, r); val dd = Img.box(delta, w, h, r)
                  val sm = subj?.let { Img.box(it, w, h, r) }
                  val az = Math.toRadians(lp.angle.toDouble()).toFloat(); val lz = 0.25f + 0.7f * lp.elev; val lxy = sqrt(1f - lz * lz); val lx = cos(az) * lxy; val ly = -sin(az) * lxy; val sc = maxOf(w, h) * 0.6f
                  Img.par(h) { y ->
                      val ym = maxOf(y - 1, 0); val yp = minOf(y + 1, h - 1)
                      for (x in 0 until w) {
                          val i = y * w + x; val xm = maxOf(x - 1, 0); val xp = minOf(x + 1, w - 1)
                          var g1x = (d1[y * w + xp] - d1[y * w + xm]) * 0.5f * sc; var g1y = (d1[yp * w + x] - d1[ym * w + x]) * 0.5f * sc
                          val g2x = g1x + (dd[y * w + xp] - dd[y * w + xm]) * 0.5f * sc; val g2y = g1y + (dd[yp * w + x] - dd[ym * w + x]) * 0.5f * sc
                          val s1 = (-g1x * lx - g1y * ly + lz) / sqrt(g1x * g1x + g1y * g1y + 1f); val s2 = (-g2x * lx - g2y * ly + lz) / sqrt(g2x * g2x + g2y * g2y + 1f)
                          val f = 1f + amt * 3.5f * (s2 - s1) * (sm?.get(i) ?: 1f)
                          if (abs(f - 1f) < 0.002f) continue
                          val p = px[i]; px[i] = (p and 0xFF000000.toInt()) or ((((p shr 16) and 255) * f).toInt().coerceIn(0, 255) shl 16) or ((((p shr 8) and 255) * f).toInt().coerceIn(0, 255) shl 8) or (((p and 255) * f).toInt().coerceIn(0, 255))
                      }
                  }
              }
          }

          object Tilt {
              /** Rotates the depth relief about the pivot plane: every mesh vertex becomes a 3D point, is rotated, then re-projected with perspective. */
              fun apply(base: FloatArray, w: Int, h: Int, mw: Int, mh: Int, d: DepthData, delta: FloatArray?, tp: TiltP): FloatArray {
                  val pp = ParP().also { it.focus = tp.pivot; it.gamma = 1f; it.smooth = tp.smooth; it.protect = tp.protect }
                  val prep = Parallax.prepare(d, mw, mh, pp, delta)
                  val out = FloatArray(base.size); val cx = w / 2f; val cy = h / 2f; val S = tp.depthK * w * 0.5f
                  val yaw = Math.toRadians(tp.yaw.toDouble()).toFloat(); val pit = Math.toRadians(tp.pitch.toDouble()).toFloat(); val rol = Math.toRadians(tp.roll.toDouble()).toFloat()
                  val f = w * (1.4f - tp.dolly * 0.6f); val zoom = 1f + tp.dolly * 0.5f + 0.5f * (abs(sin(yaw)) + abs(sin(pit))) * (0.5f + 0.5f * tp.depthK)
                  val cyw = cos(yaw); val syw = sin(yaw); val cp = cos(pit); val sp = sin(pit); val cr = cos(rol); val sr = sin(rol)
                  for (i in 0 until out.size / 2) {
                      val z = prep.dg[i] * prep.ep[i] * S; val x = base[2 * i] - cx; val y = base[2 * i + 1] - cy
                      val x1 = x * cyw + z * syw; val z1 = -x * syw + z * cyw
                      val y2 = y * cp - z1 * sp; val z2 = y * sp + z1 * cp
                      val xr = x1 * cr - y2 * sr; val yr = x1 * sr + y2 * cr
                      val sc = f / (f - z2).coerceAtLeast(f * 0.3f) * zoom
                      out[2 * i] = cx + xr * sc; out[2 * i + 1] = cy + yr * sc
                  }
                  return out
              }
          }

          object Scan {
              /** Single-photo relief scan: textured grid mesh (OBJ + MTL + JPG) with depth as height. Triangles across large depth jumps are dropped so silhouettes stay clean. */
              fun exportObj(ctx: Context, tex: Bitmap, d: DepthData, an: Analysis, sp: SculptP, gw: Int, depthK: Float, pivot: Float): String {
                  val gh = max(2, (gw * tex.height.toFloat() / tex.width).roundToInt()); val bl = Sculpt.blobs(an, sp)
                  val dl = if (bl.isNotEmpty()) Sculpt.grid(bl, an.w, an.h, gw, gh) else null
                  val z = FloatArray((gw + 1) * (gh + 1)); val aspect = tex.height.toFloat() / tex.width
                  for (j in 0..gh) for (i in 0..gw) {
                      val u = i.toFloat() / gw * (d.w - 1); val v = j.toFloat() / gh * (d.h - 1)
                      val x0 = u.toInt(); val y0 = v.toInt(); val x1 = min(x0 + 1, d.w - 1); val y1 = min(y0 + 1, d.h - 1); val fu = u - x0; val fv = v - y0
                      val dv = (d.d[y0 * d.w + x0] * (1 - fu) + d.d[y0 * d.w + x1] * fu) * (1 - fv) + (d.d[y1 * d.w + x0] * (1 - fu) + d.d[y1 * d.w + x1] * fu) * fv
                      z[j * (gw + 1) + i] = (dv + (dl?.get(j * (gw + 1) + i) ?: 0f) - pivot) * depthK * 0.5f
                  }
                  val sb = StringBuilder("mtllib scan.mtl\nusemtl face\n")
                  for (j in 0..gh) for (i in 0..gw) sb.append("v ").append((i.toFloat() / gw - 0.5f)).append(' ').append((0.5f * aspect - j.toFloat() / gh * aspect)).append(' ').append(z[j * (gw + 1) + i]).append('\n')
                  for (j in 0..gh) for (i in 0..gw) sb.append("vt ").append(i.toFloat() / gw).append(' ').append(1f - j.toFloat() / gh).append('\n')
                  fun id(i: Int, j: Int) = j * (gw + 1) + i + 1
                  for (j in 0 until gh) for (i in 0 until gw) {
                      val a = id(i, j); val b = id(i + 1, j); val c = id(i, j + 1); val e = id(i + 1, j + 1)
                      val zs = floatArrayOf(z[a - 1], z[b - 1], z[c - 1], z[e - 1])
                      if (zs.max() - zs.min() > 0.045f * depthK * 2f) continue
                      sb.append("f $a/$a $c/$c $b/$b\nf $b/$b $c/$c $e/$e\n")
                  }
                  val base = "FaceLab_scan_" + System.currentTimeMillis()
                  fun save(name: String, mime: String, write: (java.io.OutputStream) -> Unit) {
                      val v = ContentValues().apply { put(MediaStore.Downloads.DISPLAY_NAME, name); put(MediaStore.Downloads.MIME_TYPE, mime); put(MediaStore.Downloads.RELATIVE_PATH, "Download/FaceLab/$base"); put(MediaStore.Downloads.IS_PENDING, 1) }
                      val u = ctx.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v) ?: return
                      ctx.contentResolver.openOutputStream(u)?.use { write(it) }; v.clear(); v.put(MediaStore.Downloads.IS_PENDING, 0); ctx.contentResolver.update(u, v, null, null)
                  }
                  save("scan.obj", "application/octet-stream") { it.write(sb.toString().toByteArray()) }
                  save("scan.mtl", "application/octet-stream") { it.write("newmtl face\nKd 1 1 1\nmap_Kd texture.jpg\n".toByteArray()) }
                  save("texture.jpg", "image/jpeg") { tex.compress(Bitmap.CompressFormat.JPEG, 95, it) }
                  return "Download/FaceLab/$base"
              }
          }

          // ------------------------------------------------------------------ accessories, imported layers, outfit, hair wave

          object LayerStore { val bmps = HashMap<Int, Bitmap>(); var next = 1 }

          class LayerP {
              var kind = ""; var bmp = 0; var anchor = 2; var scale = 1f; var rot = 0f; var dx = 0f; var dy = 0f; var alpha = 1f; var blend = 0; var c1 = 0; var c2 = 0; var size = 1f; var thick = 1f; var face = 0
              fun key() = "$kind$bmp$anchor$scale$rot$dx$dy$alpha$blend$c1$c2$size$thick$face"
              fun copy() = LayerP().also { it.kind = kind; it.bmp = bmp; it.anchor = anchor; it.scale = scale; it.rot = rot; it.dx = dx; it.dy = dy; it.alpha = alpha; it.blend = blend; it.c1 = c1; it.c2 = c2; it.size = size; it.thick = thick; it.face = face }
          }

          object Deco {
              val KINDS = listOf("Glasses round", "Glasses cat-eye", "Glasses aviator", "Glasses square", "Glasses rimless", "Earrings studs", "Earrings hoops", "Earrings drops", "Necklace", "Choker",
                  "Gems eye corners", "Gems forehead", "Beauty mark", "Nose stud", "Hair bow", "Headband")
              val ANCHORS = listOf("Head top", "Forehead", "Eyes", "Nose", "Mouth", "Chin", "Ear left", "Ear right", "Neck", "Shoulders", "Chest", "Torso", "Hips")

              private fun fill(c: Int, blur: Float = 0f) = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = c; style = Paint.Style.FILL; if (blur > 0.5f) maskFilter = BlurMaskFilter(blur, BlurMaskFilter.Blur.NORMAL) }
              private fun line(c: Int, w: Float, blur: Float = 0f) = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = c; style = Paint.Style.STROKE; strokeWidth = w; strokeCap = Paint.Cap.ROUND; strokeJoin = Paint.Join.ROUND; if (blur > 0.5f) maskFilter = BlurMaskFilter(blur, BlurMaskFilter.Blur.NORMAL) }
              private fun curve(p: List<PointF>): Path {
                  val path = Path(); val n = p.size; path.moveTo(p[0].x, p[0].y)
                  for (i in 0 until n) { val p0 = p[(i - 1 + n) % n]; val p1 = p[i]; val p2 = p[(i + 1) % n]; val p3 = p[(i + 2) % n]
                      path.cubicTo(p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6, p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6, p2.x, p2.y) }
                  path.close(); return path
              }
              private val BLENDS = listOf(BlendMode.SRC_OVER, BlendMode.MULTIPLY, BlendMode.SCREEN, BlendMode.OVERLAY)

              fun render(work: Bitmap, an: Analysis, k: Float, lp: LayerP) {
                  val cv = Canvas(work)
                  if (lp.kind == "png") { png(cv, an, k, lp); return }
                  val f0 = an.faces.getOrNull(lp.face) ?: return; val f = FloatArray(f0.size) { f0[it] * k }
                  fun X(i: Int) = f[i * 2]
                  fun Y(i: Int) = f[i * 2 + 1]
                  val u = hypot(X(473) - X(468), Y(473) - Y(468)); if (u < 8f) return
                  val th = atan2(Y(473) - Y(468), X(473) - X(468)); val mx = (X(468) + X(473)) / 2; val my = (Y(468) + Y(473)) / 2
                  val c1 = if (lp.c1 != 0) lp.c1 else 0xFF2A2A30.toInt(); val c2 = if (lp.c2 != 0) lp.c2 else 0xFF8FB8D8.toInt(); val sz = lp.size; val tk = lp.thick
                  cv.save(); cv.translate(mx, my); cv.rotate(Math.toDegrees(th.toDouble()).toFloat())
                  fun L(a: Float) = a * u
                  fun glasses(shape: Int, frame: Boolean) {
                      for (s in listOf(-1f, 1f)) {
                          val raw = when (shape) { 1 -> listOf(-0.46f to -0.06f, -0.2f to -0.3f, 0.3f to -0.38f, 0.58f to -0.42f, 0.5f to -0.05f, 0.3f to 0.26f, -0.1f to 0.34f, -0.4f to 0.22f)
                              2 -> listOf(-0.5f to -0.2f, -0.2f to -0.38f, 0.3f to -0.38f, 0.52f to -0.15f, 0.48f to 0.15f, 0.25f to 0.4f, -0.1f to 0.42f, -0.42f to 0.2f)
                              3 -> listOf(-0.5f to -0.3f, 0f to -0.34f, 0.5f to -0.3f, 0.52f to 0f, 0.5f to 0.3f, 0f to 0.34f, -0.5f to 0.3f, -0.52f to 0f)
                              else -> (0 until 12).map { val a = it / 12f * 6.2832f; cos(a) * 0.46f to sin(a) * 0.46f } }
                          val poly = raw.map { PointF(L((0.5f * s) + (if (s > 0) it.first else -it.first) * sz * (if (shape == 1 || shape == 2) 0.9f else 1f)), L(it.second * sz + 0.05f)) }
                          val path = curve(poly)
                          cv.drawPath(path, line(0x40000000, L(0.05f * tk), L(0.035f)).also { it.style = Paint.Style.FILL; it.alpha = 50 })
                          cv.drawPath(path, fill(c2.let { (it and 0xFFFFFF) or (0x44 shl 24) }))
                          cv.drawPath(Path().apply { moveTo(L(0.5f * s - 0.22f * s * sz), L(-0.2f * sz + 0.05f)); lineTo(L(0.5f * s - 0.06f * s * sz), L(-0.22f * sz + 0.05f)); lineTo(L(0.5f * s - 0.2f * s * sz), L(0.02f * sz + 0.05f)); close() }, fill(0x33FFFFFF))
                          if (frame) cv.drawPath(path, line(c1, L(0.045f * tk)))
                          else cv.drawPath(path, line(0x55FFFFFF, L(0.012f)))
                          cv.drawLine(L(s * (0.5f + 0.46f * sz)), L(0.0f), L(s * 1.18f), L(0.06f), line(if (frame) c1 else 0x66FFFFFF, L(0.035f * tk)))
                      }
                      if (frame) { val br = Path().apply { moveTo(L(-0.1f), L(-0.02f)); quadTo(0f, L(-0.14f), L(0.1f), L(-0.02f)) }; cv.drawPath(br, line(c1, L(0.04f * tk))) }
                  }
                  fun gem(x: Float, y: Float, r: Float, c: Int) { cv.drawCircle(L(x) + L(0.01f), L(y) + L(0.015f), L(r), fill(0x44000000, L(0.01f))); cv.drawCircle(L(x), L(y), L(r), fill(c)); cv.drawCircle(L(x) - L(r) * 0.3f, L(y) - L(r) * 0.3f, L(r) * 0.35f, fill(0xCCFFFFFF.toInt())) }
                  when (lp.kind) {
