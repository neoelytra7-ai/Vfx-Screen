                      "Earrings studs" -> for (s in listOf(-1f, 1f)) gem(1.27f * s, 0.78f, 0.055f * sz, c1)
                      "Earrings hoops" -> for (s in listOf(-1f, 1f)) { cv.drawCircle(L(1.27f * s), L(0.95f), L(0.17f * sz), line(0x44000000, L(0.035f * tk), L(0.02f))); cv.drawCircle(L(1.27f * s), L(0.95f), L(0.17f * sz), line(c1, L(0.028f * tk))) }
                      "Earrings drops" -> for (s in listOf(-1f, 1f)) { cv.drawLine(L(1.27f * s), L(0.8f), L(1.27f * s), L(1.0f * sz + 0.1f), line(c1, L(0.015f))); gem(1.27f * s, 0.8f, 0.035f, c1); gem(1.27f * s, 1.05f * sz + 0.1f, 0.07f * sz, c2) }
                      "Necklace" -> { val p = Path().apply { moveTo(L(-0.95f), L(2.0f)); quadTo(0f, L(3.4f), L(0.95f), L(2.0f)) }; cv.drawPath(p, line(0x44000000, L(0.03f * tk), L(0.02f))); cv.drawPath(p, line(c1, L(0.018f * tk))); gem(0f, 2.78f, 0.06f * sz, c2) }
                      "Choker" -> { val p = Path().apply { moveTo(L(-0.85f), L(2.25f)); quadTo(0f, L(2.75f), L(0.85f), L(2.25f)) }; cv.drawPath(p, line(0x55000000, L(0.1f * tk), L(0.03f))); cv.drawPath(p, line(c1, L(0.08f * tk))); gem(0f, 2.52f, 0.05f * sz, c2) }
