          // ---------------------------------------------------------------- feedback visuals

          @Composable fun Aurora() {
              val t by rememberInfiniteTransition(label = "aur").animateFloat(initialValue = 0f, targetValue = 1f, animationSpec = infiniteRepeatable(tween(ms(18000), easing = LinearEasing)), label = "t")
              Canvas(Modifier.fillMaxSize()) {
                  val a = (t * 6.2832f)
                  for ((i, c) in listOf(Th.a1, Th.a2, Color(0xFF4A5BFF)).withIndex()) {
                      val cx = size.width * (0.5f + 0.4f * kotlin.math.cos(a + i * 2.1f)); val cy = size.height * (0.3f + 0.25f * kotlin.math.sin(a * 1.3f + i * 1.7f))
                      drawCircle(Brush.radialGradient(listOf(c.copy(alpha = 0.28f), Color.Transparent), Offset(cx, cy), size.minDimension * 0.7f), size.minDimension * 0.7f, Offset(cx, cy))
                  }
              }
          }

          @Composable fun FlowBar(p: Float) {
              val t by rememberInfiniteTransition(label = "flow").animateFloat(initialValue = 0f, targetValue = 1f, animationSpec = infiniteRepeatable(tween(ms(1500), easing = LinearEasing)), label = "ft")
              val pa by animateFloatAsState(p, tween(ms(300)), label = "pa")
              Canvas(Modifier.fillMaxWidth().height(8.dp).clip(CircleShape)) {
                  drawRect(Color.White.copy(alpha = 0.12f))
                  if (p >= 0f) drawRect(Th.grad(), size = Size(size.width * pa, size.height))
                  else { val w = size.width * 0.35f; drawRect(Th.grad(), Offset((size.width + w) * t - w, 0f), Size(w, size.height)) }
                  val sx = size.width * t; drawRect(Brush.horizontalGradient(listOf(Color.Transparent, Color.White.copy(alpha = 0.35f), Color.Transparent), startX = sx - 70f, endX = sx + 70f))
              }
          }

          @Composable fun StepRow(text: String, state: Int) {
              val pulse by rememberInfiniteTransition(label = "pu").animateFloat(initialValue = 0.4f, targetValue = 1f, animationSpec = infiniteRepeatable(tween(ms(700)), RepeatMode.Reverse), label = "pp")
              val pop by animateFloatAsState(if (state == 2) 1f else 0f, spring(0.4f, 500f * Th.speed), label = "pop")
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Box(Modifier.size(18.dp).graphicsLayer { alpha = if (state == 1) pulse else 1f }.background(if (state == 2) Th.grad() else Brush.linearGradient(listOf(Color.White.copy(alpha = if (state == 1) 0.7f else 0.18f), Color.White.copy(alpha = if (state == 1) 0.7f else 0.18f))), CircleShape)) {
                      if (state == 2) Canvas(Modifier.fillMaxSize().padding(4.dp).graphicsLayer { scaleX = pop; scaleY = pop }) {
                          val s = size.minDimension; drawLine(Color(0xFF0A0A0F), Offset(s * .1f, s * .55f), Offset(s * .4f, s * .85f), s * .16f, StrokeCap.Round); drawLine(Color(0xFF0A0A0F), Offset(s * .4f, s * .85f), Offset(s * .92f, s * .15f), s * .16f, StrokeCap.Round) }
                  }
                  Text(text, color = Color.White.copy(alpha = if (state == 0) 0.4f else 0.95f), fontSize = 13.sp, modifier = Modifier.padding(start = 10.dp))
              }
          }

          @Composable fun ProgressLayer(vm: Vm) {
              AnimatedVisibility(vm.busy, enter = fadeIn(tween(ms(250))), exit = fadeOut(tween(ms(350)))) {
                  Box(Modifier.fillMaxSize().background(Color(0x77000000)).pointerInput(Unit) { detectTapGestures { } }, contentAlignment = Alignment.Center) {
                      Column(Modifier.padding(28.dp).fillMaxWidth().glass(Th.corner.dp + 4.dp).padding(22.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                          Text(vm.jobTitle, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          vm.jobSteps.forEachIndexed { i, s -> StepRow(s, if (i < vm.jobStep) 2 else if (i == vm.jobStep) 1 else 0) }
                          FlowBar(vm.jobP)
                          Row { Text(vm.jobDetail, color = Color.White.copy(alpha = 0.5f), fontSize = 11.sp, modifier = Modifier.weight(1f)); if (vm.jobP >= 0f) Text("${(vm.jobP * 100).toInt()}%", color = Th.a1, fontSize = 12.sp, fontWeight = FontWeight.Bold) }
                      }
                  }
              }
