              private val LIP_O = intArrayOf(61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146)
              private val LIP_I = intArrayOf(78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95)

              fun render(bmp: Bitmap, f: FloatArray, mk: Makeup, k: Float, seed: Int) {
                  fun X(i: Int) = f[i * 2]
                  fun Y(i: Int) = f[i * 2 + 1]
                  val u = hypot(X(473) - X(468), Y(473) - Y(468)); if (u < 10f) return
                  val th = atan2(Y(473) - Y(468), X(473) - X(468)); val ct = cos(th); val st = sin(th)
                  val mx = (X(468) + X(473)) / 2; val my = (Y(468) + Y(473)) / 2
                  var x0 = 1e9f; var y0 = 1e9f; var x1 = -1e9f; var y1 = -1e9f
                  for (i in 0 until f.size / 2) { x0 = minOf(x0, X(i)); x1 = maxOf(x1, X(i)); y0 = minOf(y0, Y(i)); y1 = maxOf(y1, Y(i)) }
                  val rx0 = maxOf(0, (x0 - 0.8f * u).toInt()); val ry0 = maxOf(0, (y0 - 0.8f * u).toInt())
                  val rx1 = minOf(bmp.width, (x1 + 0.8f * u).toInt()); val ry1 = minOf(bmp.height, (y1 + 0.8f * u).toInt())
                  val rw = rx1 - rx0; val rh = ry1 - ry0; if (rw < 16 || rh < 16) return
                  val roi = Bitmap.createBitmap(rw, rh, Bitmap.Config.ARGB_8888); val cv = Canvas(roi)
                  cv.drawBitmap(bmp, -rx0.toFloat(), -ry0.toFloat(), null)
                  fun L(i: Int) = PointF(X(i) - rx0, Y(i) - ry0)
                  fun pts(a: IntArray) = a.map { L(it) }
                  fun P(a: Float, b: Float) = PointF(mx + (ct * a - st * b) * u - rx0, my + (st * a + ct * b) * u - ry0)
                  val up = PointF(st, -ct)
                  fun off(p: PointF, d: Float, dir: PointF = up) = PointF(p.x + dir.x * d * u, p.y + dir.y * d * u)
                  fun draw(blend: BlendMode, a: Float, block: (Canvas) -> Unit) {
                      if (a <= 0.003f) return
                      val l = Bitmap.createBitmap(rw, rh, Bitmap.Config.ARGB_8888); block(Canvas(l))
                      cv.drawBitmap(l, 0f, 0f, Paint().apply { blendMode = blend; alpha = (a.coerceIn(0f, 1f) * 255f).toInt() }); l.recycle()
                  }
                  fun tint(col: Int, a: Float, block: (Canvas) -> Unit) {
                      if (lum(col) < 0.28f) draw(BlendMode.MULTIPLY, a, block) else { draw(BlendMode.SOFT_LIGHT, a, block); draw(BlendMode.SRC_OVER, a * 0.45f, block) }
                  }
                  fun openPath(s: Side): Path = curve(pts(s.upper) + pts(s.lower).reversed(), true)
                  fun ell(c: Canvas, cx: Float, cy: Float, rx: Float, ry: Float, ang: Float, col: Int, a: Float) {
                      val sh = RadialGradient(0f, 0f, 1f, intArrayOf(col.al(a), col.al(a * 0.5f), col.al(0f)), floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                      val m = Matrix(); m.postScale(rx, ry); m.postRotate(Math.toDegrees(ang.toDouble()).toFloat()); m.postTranslate(cx, cy); sh.setLocalMatrix(m)
                      c.drawPaint(Paint(Paint.ANTI_ALIAS_FLAG).apply { shader = sh })
                  }
                  val rnd = java.util.Random(seed.toLong())

                  // ---- lips
                  if (mk.lipA > 0f || mk.gloss > 0f) {
                      val outer = curve(pts(LIP_O), true); val inner = curve(pts(LIP_I), true)
                      fun lipMask(c: Canvas) { c.drawPath(outer, fill(0xFFFFFFFF.toInt(), 1.2f)); c.drawPath(inner, xfer(PorterDuff.Mode.DST_OUT)) }
                      val col = mk.lip
                      fun lipLayer(c: Canvas) {
                          if (mk.lipMode == 2 || mk.lipMode == 3) {
                              if (mk.lipMode == 3) c.drawPath(outer, fill(col.al(0.3f), 0f))
                              c.drawPath(curve(pts(LIP_I), true), stroke(col, (if (mk.lipMode == 3) 0.17f else 0.12f) * u, 0.07f * u))
                          } else c.drawPath(outer, fill(col, 0f))
                          val m = Bitmap.createBitmap(rw, rh, Bitmap.Config.ARGB_8888); lipMask(Canvas(m))
                          c.drawBitmap(m, 0f, 0f, xfer(PorterDuff.Mode.DST_IN)); m.recycle()
                          c.drawPath(inner, xfer(PorterDuff.Mode.DST_OUT))
                      }
                      if (lum(col) < 0.3f) draw(BlendMode.MULTIPLY, mk.lipA * k, ::lipLayer) else { draw(BlendMode.COLOR, mk.lipA * k * 0.9f, ::lipLayer); draw(BlendMode.SOFT_LIGHT, mk.lipA * k * 0.6f, ::lipLayer) }
                      if (mk.gloss > 0f) draw(BlendMode.SCREEN, mk.gloss * k * 0.8f) { c ->
                          val a = L(14); val b = L(17); val g = L(0); val h2 = L(13)
                          ell(c, (a.x + b.x) / 2, (a.y + b.y) / 2, 0.2f * u, 0.05f * u, th, 0xFFFFFFFF.toInt(), 0.9f)
                          ell(c, (g.x + h2.x) / 2, (g.y + h2.y) / 2, 0.14f * u, 0.03f * u, th, 0xFFFFFFFF.toInt(), 0.6f)
                          val m = Bitmap.createBitmap(rw, rh, Bitmap.Config.ARGB_8888); lipMask(Canvas(m)); c.drawBitmap(m, 0f, 0f, xfer(PorterDuff.Mode.DST_IN)); m.recycle()
                      }
                  }

                  for (s in SIDES) {
                      val sg = s.sgn; val out = PointF(ct * sg, st * sg); val U = pts(s.upper); val open = openPath(s)
                      fun w(j: Int) = 0.35f + 0.65f * sin(PI * j / 8f).toFloat()
                      // ---- shadow zones
                      if (mk.shA > 0f) {
                          val lo = U.mapIndexed { j, p -> off(p, 0.10f * w(j)) }; val hi = U.mapIndexed { j, p -> off(p, 0.30f * w(j)) }
                          val ext = PointF(U[0].x + out.x * 0.10f * u + up.x * 0.05f * u, U[0].y + out.y * 0.10f * u + up.y * 0.05f * u)
                          val creasePath = curve(listOf(ext) + hi + lo.reversed(), true)
                          tint(mk.crease, mk.shA * k) { c -> c.drawPath(creasePath, fill(mk.crease, 0.05f * u)); c.drawPath(open, xfer(PorterDuff.Mode.DST_OUT)) }
                          val lidPoly = U + U.mapIndexed { j, p -> off(p, 0.12f * w(j)) }.reversed()
                          tint(mk.lid, mk.shA * k) { c -> c.drawPath(curve(lidPoly, true), fill(mk.lid, 0.035f * u)); c.drawPath(open, xfer(PorterDuff.Mode.DST_OUT)) }
                          if (mk.outer != 0) {
                              val v = Path().apply { moveTo(U[0].x, U[0].y); lineTo(U[0].x + out.x * 0.17f * u + up.x * 0.06f * u, U[0].y + out.y * 0.17f * u + up.y * 0.06f * u)
                                  val m2 = off(U[3], 0.2f); lineTo(m2.x, m2.y); lineTo(U[2].x, U[2].y); close() }
                              tint(mk.outer, mk.shA * k * 0.9f) { c -> c.drawPath(v, fill(mk.outer, 0.045f * u)); c.drawPath(open, xfer(PorterDuff.Mode.DST_OUT)) }
                          }
                          if (mk.inner != 0) draw(BlendMode.SCREEN, mk.shA * k * 0.8f) { c -> val p = L(s.inner); c.drawCircle(p.x - out.x * 0.02f * u, p.y - out.y * 0.02f * u, 0.05f * u, fill(mk.inner, 0.03f * u)) }
                          if (mk.hilite > 0f) draw(BlendMode.SCREEN, mk.hilite * k * 0.35f) { c -> c.drawPath(curve(pts(s.browLow).map { off(it, -0.05f) }, false), stroke(0xFFFFEEDD.toInt(), 0.05f * u, 0.03f * u)) }
                      }
                      if (mk.lowerSh > 0f) tint(mk.crease, mk.lowerSh * k * 0.8f) { c ->
                          val lw = pts(s.lower).slice(0..5).map { off(it, -0.05f) }
                          c.drawPath(curve(lw, false), stroke(mk.crease, 0.06f * u, 0.035f * u)); c.drawPath(open, xfer(PorterDuff.Mode.DST_OUT)) }
                      // ---- liner and wing
                      if (mk.linerA > 0f) draw(BlendMode.SRC_OVER, mk.linerA * k) { c ->
                          val th1 = maxOf(1.5f, 0.026f * u * mk.linerT)
                          c.drawPath(curve(U, false), stroke(mk.liner, th1, 0.4f))
                          if (mk.wing > 0f) {
                              val tip = PointF(U[0].x + out.x * mk.wing * 0.22f * u + up.x * mk.wing * 0.07f * u, U[0].y + out.y * mk.wing * 0.22f * u + up.y * mk.wing * 0.07f * u)
                              val base2 = off(U[1], 0.012f * mk.linerT)
                              c.drawPath(Path().apply { moveTo(U[0].x, U[0].y); lineTo(tip.x, tip.y); lineTo(base2.x, base2.y); lineTo(U[1].x, U[1].y); close() }, fill(mk.liner, 0.5f))
                          }
                      }
                      if (mk.lowerLiner > 0f) draw(BlendMode.SRC_OVER, mk.lowerLiner * k * 0.8f) { c -> c.drawPath(curve(pts(s.lower).slice(0..4), false), stroke(mk.liner.let { if (it == 0) 0xFF201818.toInt() else it }, maxOf(1.2f, 0.018f * u), 0.5f)) }
                      // ---- lashes
                      if (mk.lash > 0f) draw(BlendMode.SRC_OVER, 0.9f) { c ->
                          val n = (22 * mk.lash).toInt().coerceAtLeast(8)
                          for (q in 0 until n) {
                              val t = q / (n - 1f) * 8f; val j = t.toInt().coerceAtMost(7); val fr = t - j
                              val p = PointF(U[j].x + (U[j + 1].x - U[j].x) * fr, U[j].y + (U[j + 1].y - U[j].y) * fr)
                              val rel = abs(t / 8f - 0.5f) * 2f; val bend = 0.9f * (1f - 0.55f * rel)
                              val sp = (0.15f + 0.8f * (1f - t / 8f)) * 0.5f; val d = PointF(up.x + out.x * sp, up.y + out.y * sp)
                              val dl = hypot(d.x, d.y); val len = (0.05f + 0.07f * (1f - rel)) * u * (0.6f + 0.6f * mk.lash)
                              c.drawLine(p.x, p.y, p.x + d.x / dl * len * bend, p.y + d.y / dl * len * bend, stroke(0xFF140C0C.toInt(), maxOf(1f, 0.0045f * u), 0f))
                          }
                      }
                      if (mk.lowerLash > 0f) draw(BlendMode.SRC_OVER, 0.7f) { c ->
                          val lw = pts(s.lower); val n = (12 * mk.lowerLash).toInt().coerceAtLeast(5)
                          for (q in 0 until n) {
                              val t = q / (n - 1f) * 4f; val j = t.toInt().coerceAtMost(3); val fr = t - j
                              val p = PointF(lw[j].x + (lw[j + 1].x - lw[j].x) * fr, lw[j].y + (lw[j + 1].y - lw[j].y) * fr)
                              c.drawLine(p.x, p.y, p.x - up.x * 0.045f * u + out.x * 0.015f * u, p.y - up.y * 0.045f * u + out.y * 0.015f * u, stroke(0xFF2A1A1A.toInt(), maxOf(1f, 0.0035f * u), 0f))
                          }
                      }
                      // ---- brows
                      if (mk.browA > 0f) {
                          val poly = curve(pts(s.brow) + pts(s.browLow), true)
                          if (lum(mk.brow) < 0.3f) draw(BlendMode.MULTIPLY, mk.browA * k) { c -> c.drawPath(poly, fill(mk.brow, 0.012f * u)) }
                          else { draw(BlendMode.COLOR, mk.browA * k) { c -> c.drawPath(poly, fill(mk.brow, 0.012f * u)) }; draw(BlendMode.MULTIPLY, mk.browA * k * 0.5f) { c -> c.drawPath(poly, fill(mk.brow, 0.012f * u)) } }
                      }
                      // ---- under-eye
                      val lw = pts(s.lower)
                      if (mk.aegyo > 0f) {
                          draw(BlendMode.SCREEN, mk.aegyo * k * 0.8f) { c -> c.drawPath(curve(lw.slice(1..7).map { off(it, -0.065f) }, false), stroke(0xFFFFF1E8.toInt(), 0.05f * u, 0.018f * u)); c.drawPath(open, xfer(PorterDuff.Mode.DST_OUT)) }
                          draw(BlendMode.MULTIPLY, mk.aegyo * k * 0.4f) { c -> c.drawPath(curve(lw.slice(1..7).map { off(it, -0.13f) }, false), stroke(0xFFB08A7E.toInt(), 0.03f * u, 0.015f * u)) }
                      }
                      if (mk.tear > 0f) draw(BlendMode.MULTIPLY, mk.tear * k * 0.5f) { c -> c.drawPath(curve(lw.slice(0..6).map { off(it, -0.17f) }, false), stroke(0xFF9A6A64.toInt(), 0.045f * u, 0.03f * u)) }
                      if (mk.darkCircle > 0f) draw(BlendMode.MULTIPLY, mk.darkCircle * k * 0.55f) { c ->
                          val m = L(s.outer); val n2 = L(s.inner); ell(c, (m.x + n2.x) / 2 - up.x * 0.28f * u, (m.y + n2.y) / 2 - up.y * 0.28f * u, 0.4f * u, 0.11f * u, th, 0xFF6B5B7B.toInt(), 0.9f) }
                      // ---- lens
                      if (mk.lensA > 0f) {
                          val ic = L(s.iris); val r = s.ring.map { hypot(L(it).x - ic.x, L(it).y - ic.y) }.average().toFloat() * mk.lensSize
                          val blend = if (lum(mk.lens) < 0.28f) BlendMode.MULTIPLY else BlendMode.COLOR
                          draw(blend, mk.lensA * k) { c ->
                              c.drawCircle(ic.x, ic.y, r, fill(mk.lens, 0f)); c.drawCircle(ic.x, ic.y, r, stroke(0xFF000000.toInt().al(0.55f), r * 0.18f, r * 0.12f))
                              val mm = Bitmap.createBitmap(rw, rh, Bitmap.Config.ARGB_8888); Canvas(mm).drawPath(open, fill(0xFFFFFFFF.toInt(), 1f)); c.drawBitmap(mm, 0f, 0f, xfer(PorterDuff.Mode.DST_IN)); mm.recycle() }
                      }
                  }
                  // ---- blush
                  if (mk.blushA > 0f) {
                      val cols = mk.blush
                      fun both(block: (Float) -> Unit) { block(-1f); block(1f) }
                      draw(BlendMode.SOFT_LIGHT, mk.blushA * k) { c ->
                          both { sg -> val ang = th + atan2(-0.35f * sg, 1f)
                              when (mk.blushStyle) {
                                  0 -> { val p = P(0.62f * sg, 0.78f); ell(c, p.x, p.y, 0.4f * u, 0.32f * u, th, cols, 1f) }
                                  1, 3 -> { val p = P(0.68f * sg, 0.55f); ell(c, p.x, p.y, 0.62f * u, 0.27f * u, ang, cols, 1f) }
                                  else -> { val p = P(0.95f * sg, 0.25f); ell(c, p.x, p.y, 0.55f * u, 0.2f * u, th + atan2(-0.8f * sg, 1f), cols, 1f) }
                              } }
                          if (mk.blushStyle == 1 || mk.blushStyle == 3) { val p = P(0f, 0.5f); ell(c, p.x, p.y, 0.95f * u, 0.13f * u, th, cols, 0.9f) }
                      }
                      draw(BlendMode.SRC_OVER, mk.blushA * k * 0.22f) { c -> both { sg -> val p = P(0.66f * sg, 0.62f); ell(c, p.x, p.y, 0.5f * u, 0.28f * u, th + atan2(-0.3f * sg, 1f), cols, 1f) } }
                  }
                  // ---- sculpt
                  if (mk.contour > 0f) draw(BlendMode.MULTIPLY, mk.contour * k * 0.55f) { c ->
                      for (sg in listOf(-1f, 1f)) {
                          val p = P(1.0f * sg, 1.15f); ell(c, p.x, p.y, 0.5f * u, 0.11f * u, th + atan2(-0.5f * sg, 1f), 0xFF7B5A4E.toInt(), 1f)
                          val a = P(0.15f * sg, 0.15f); val b = P(0.21f * sg, 0.85f)
                          c.drawLine(a.x, a.y, b.x, b.y, stroke(0xFF8A6A5E.toInt(), 0.1f * u, 0.06f * u))
                      } }
                  if (mk.hilite > 0f) draw(BlendMode.SCREEN, mk.hilite * k * 0.6f) { c ->
                      val a = P(0f, 0.15f); val b = P(0f, 0.8f); c.drawLine(a.x, a.y, b.x, b.y, stroke(0xFFFFF1E0.toInt(), 0.07f * u, 0.04f * u))
                      for (sg in listOf(-1f, 1f)) { val p = P(0.8f * sg, 0.62f); ell(c, p.x, p.y, 0.3f * u, 0.1f * u, th + atan2(-0.3f * sg, 1f), 0xFFFFF1E0.toInt(), 0.9f) }
                      val fh = P(0f, -0.55f); ell(c, fh.x, fh.y, 0.5f * u, 0.22f * u, th, 0xFFFFF1E0.toInt(), 0.5f)
                      val ch = L(152); ell(c, ch.x, ch.y - 0.12f * u, 0.25f * u, 0.1f * u, th, 0xFFFFF1E0.toInt(), 0.5f)
                      val cb = L(0); ell(c, cb.x, cb.y - 0.03f * u, 0.1f * u, 0.035f * u, th, 0xFFFFF8F0.toInt(), 0.7f)
                  }
                  if (mk.freckle > 0f) draw(BlendMode.MULTIPLY, 0.75f) { c ->
                      val n = (90 * mk.freckle).toInt()
                      for (q in 0 until n) {
                          val a = (rnd.nextFloat() * 2f - 1f) * 0.95f; val b = 0.2f + rnd.nextFloat() * 0.75f
                          if (abs(a) < 0.12f && b > 0.4f) continue
                          val p = P(a, b); c.drawCircle(p.x, p.y, u * (0.006f + rnd.nextFloat() * 0.009f), fill(0xFF8A5A44.toInt().al(0.35f + rnd.nextFloat() * 0.4f), 0.6f))
                      } }
                  Canvas(bmp).drawBitmap(roi, rx0.toFloat(), ry0.toFloat(), null)
                  roi.recycle()
              }
          }
          EOF
          cat > $P/Render.kt <<'EOF'
          package com.example.facelab

          import android.graphics.*
          import kotlin.math.*

          class Canceled : RuntimeException()

          class FaceEdit {
              val p = HashMap<String, Float>(); var mk: Makeup? = null; var mkK = 1f
              var mkOn = HashSet<String>(listOf("Lips", "Shadow", "Liner", "Lashes", "Brows", "Blush", "Sculpt", "Lens", "Skin"))
              val partK = HashMap<String, Float>(); val col = HashMap<String, Int>()
              fun copy() = FaceEdit().also { it.p.putAll(p); it.mk = mk; it.mkK = mkK; it.mkOn = HashSet(mkOn); it.partK.putAll(partK); it.col.putAll(col) }
              fun key() = "${mk?.name}|$mkK|${mkOn.sorted()}|${partK.toSortedMap()}|${col.toSortedMap()}"
          }

          class EditState {
              val faces = ArrayList<FaceEdit>(); val body = HashMap<String, Float>()
              var skin = SkinP(); var hair = HairP(); var bokeh = BokehP(); var adj = AdjP(); var light = LightP(); var detail = DetailP(); var par = ParP(); var range = 1f
              var tilt = TiltP(); var sculpt = SculptP(); var restore = RestoreP(); var outfit = OutfitP(); val layers = ArrayList<LayerP>()
              fun copy() = EditState().also { s -> faces.forEach { s.faces.add(it.copy()) }; s.body.putAll(body); s.skin = skin.copy(); s.hair = hair.copy(); s.bokeh = bokeh.copy()
                  s.adj = adj.copy(); s.light = light.copy(); s.detail = detail.copy(); s.par = par.copy(); s.range = range
                  s.tilt = tilt.copy(); s.sculpt = sculpt.copy(); s.restore = restore.copy(); s.outfit = outfit.copy(); layers.forEach { s.layers.add(it.copy()) } }
              /** Everything that needs a full re-render. Reshape and 3D-tilt sliders are excluded on purpose: those run live on the GPU. */
              fun bakeKey(): Int = (skin.key() + "#" + hair.key() + "#" + bokeh.key() + "#" + adj.key() + "#" + light.key() + "#" + detail.key() + "#" + restore.key() + "#" + outfit.key() + "#" +
                  sculpt.key() + "#" + layers.joinToString("/") { it.key() } + "#" + faces.joinToString("/") { it.key() }).hashCode()
          }

          class MaskCache {
              @Volatile var photo = ""
              private val byW = HashMap<Int, HashMap<String, FloatArray>>()
              @Synchronized fun at(w: Int): HashMap<String, FloatArray> { if (byW.size >= 3 && !byW.containsKey(w)) byW.remove(byW.keys.first()); return byW.getOrPut(w) { HashMap() } }
              @Synchronized fun clear() { byW.clear() }
          }

          object Render {
              private fun union(an: Analysis, cls: IntArray, w: Int, h: Int, gray: FloatArray, r: Int): FloatArray {
                  var acc: FloatArray? = null
                  for (c in cls) {
                      val b = an.maps[c] ?: continue
                      val f = FloatArray(an.w * an.h) { (b[it].toInt() and 255) / 255f }
                      acc = if (acc == null) f else { val a0 = acc; FloatArray(f.size) { maxOf(a0[it], f[it]) } }
                  }
                  if (acc == null) return FloatArray(w * h)
                  return Img.guided(Img.resize(acc, an.w, an.h, w, h), gray, w, h, r, 0.001f)
              }

              fun mask(an: Analysis, name: String, w: Int, h: Int, gray: FloatArray, cache: MaskCache): FloatArray {
                  val mm = cache.at(w); mm[name]?.let { return it }
                  DiskCache.loadMask(cache.photo, name, w, w * h)?.let { mm[name] = it; return it }
                  val r = maxOf(2, (0.004f * maxOf(w, h)).toInt())
                  val out = when (name) {
                      "skin" -> { val su = union(an, intArrayOf(1, 10, 14, 7, 8), w, h, gray, r); val ex = union(an, intArrayOf(2, 3, 4, 5, 6, 11, 12, 13), w, h, gray, r)
                          FloatArray(su.size) { maxOf(0f, su[it] - ex[it]) } }
                      "hair" -> union(an, intArrayOf(17), w, h, gray, r)
                      "cloth" -> union(an, intArrayOf(16), w, h, gray, r)
                      "body" -> { val b = union(an, intArrayOf(100), w, h, gray, r); val s = mask(an, "skin", w, h, gray, cache); FloatArray(b.size) { maxOf(0f, b[it] - s[it] * 0.5f) } }
                      else -> { val a = mask(an, "skin", w, h, gray, cache); val b = mask(an, "hair", w, h, gray, cache); val c = union(an, intArrayOf(16, 100), w, h, gray, r)
                          FloatArray(a.size) { maxOf(a[it], b[it], c[it]) } }
                  }
                  mm[name] = out; DiskCache.saveMask(cache.photo, name, out, w); return out
              }

              fun depthRefined(d: DepthData, w: Int, h: Int, gray: FloatArray, cache: MaskCache): FloatArray {
                  val name = "depth_" + d.tag; val mm = cache.at(w); mm[name]?.let { return it }
                  if (d.tag.isNotEmpty()) DiskCache.loadMask(cache.photo, name, w, w * h)?.let { mm[name] = it; return it }
                  val out = Img.guided(Img.resize(d.d, d.w, d.h, w, h), gray, w, h, maxOf(4, (0.006f * maxOf(w, h)).toInt()), 0.0002f)
