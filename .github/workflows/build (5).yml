              var haptics by mutableStateOf(true); var compact by mutableStateOf(false); var expand by mutableStateOf(false); var perf by mutableStateOf(false)
              val a1: Color get() = Color.hsv(hue % 360f, 0.55f, 1f)
              val a2: Color get() = Color.hsv((hue + 70f) % 360f, 0.5f, 1f)
              fun grad() = Brush.linearGradient(listOf(a1, a2))
              val pad: Dp get() = if (compact) 10.dp else 16.dp
              fun load(p: android.content.SharedPreferences) { hue = p.getFloat("hue", 335f); blur = p.getFloat("blur", 0.6f); opacity = p.getFloat("opacity", 0.34f); corner = p.getFloat("corner", 26f)
                  glow = p.getFloat("glow", 0.6f); speed = p.getFloat("speed", 1f); haptics = p.getBoolean("haptics", true); compact = p.getBoolean("compact", false); expand = p.getBoolean("expand", false); perf = p.getBoolean("perf", false) }
              fun save(p: android.content.SharedPreferences) { p.edit().putFloat("hue", hue).putFloat("blur", blur).putFloat("opacity", opacity).putFloat("corner", corner).putFloat("glow", glow).putFloat("speed", speed)
                  .putBoolean("haptics", haptics).putBoolean("compact", compact).putBoolean("expand", expand).putBoolean("perf", perf).apply() }
          }

          class Backdrop(val bmp: ImageBitmap?, val root: IntSize, val zoom: Float, val off: Offset)
          val LocalBackdrop = compositionLocalOf<Backdrop?> { null }

          private val TABS = listOf("Face", "Jaw", "Eyes", "Brows", "Nose", "Lips", "Ears", "Body", "Skin", "Hair", "Makeup", "Detail", "Restore", "Style", "Light", "3D", "Adjust", "Bokeh", "Parallax")
          private val STEPS = listOf("Reading the photo", "Scanning every face in the frame", "Locating the body", "Mapping hair, skin, lips, brows, eyes", "Segmenting the whole frame", "Refining edges")
          private val SKIN_TONES = listOf("Porcelain" to 0xF7DCCB, "Fair rose" to 0xF1C9B3, "Light beige" to 0xE8BF9F, "Warm ivory" to 0xE9C39A, "Honey" to 0xD9A47A, "Golden tan" to 0xC98E62,
              "Caramel" to 0xB2764C, "Bronze" to 0x97603C, "Deep" to 0x6F4430, "Ebony" to 0x4B2E22, "Peach glow" to 0xF2C4A8, "Cool pale" to 0xEBDDE0)
          private val HAIR_COLORS = listOf("Jet black" to 0x0F0D0D, "Soft black" to 0x1C1816, "Dark brown" to 0x3A2418, "Chestnut" to 0x5A3420, "Chocolate" to 0x4A2A1C, "Caramel" to 0x9A6A3A,
              "Honey blonde" to 0xC8A060, "Ash blonde" to 0xB8A888, "Platinum" to 0xE8E0D0, "Strawberry" to 0xC87A5A, "Copper" to 0xB85A2A, "Auburn" to 0x7A2A1A, "Burgundy" to 0x5A1428,
              "Wine" to 0x7A1E3A, "Milk tea" to 0x9A8070, "Ash grey" to 0x8A8C92, "Silver" to 0xC8CCD4, "Lavender" to 0xB8A0D8, "Pastel pink" to 0xF0B0C8, "Rose gold" to 0xD8A090,
              "Teal" to 0x2A8A8A, "Navy" to 0x1A2A5A, "Emerald" to 0x1A6A4A, "Electric blue" to 0x2A6AF0, "Violet" to 0x6A2AB0, "Red" to 0xC01820)
          private val PAL = listOf("Nude" to 0xC8907E, "Rose" to 0xD0707C, "Coral" to 0xF0705A, "Pink" to 0xF080A0, "Berry" to 0x8A2848, "Red" to 0xC01830, "Plum" to 0x5A1A3A, "Black" to 0x1A0A10,
              "Gold" to 0xD8B060, "Teal" to 0x30C8B8, "Violet" to 0x7A3AE0, "Brown" to 0x5A3A2E)
          private fun argb(h: Int) = (0xFF000000L or h.toLong()).toInt()
          private fun ms(v: Int) = (v / Th.speed).toInt()

          class Vm(val app: Context) {
              val prefs = app.getSharedPreferences("facelab", 0)
              var stage by mutableIntStateOf(0)
              var coreReady by mutableStateOf(Models.core(app))
              var busy by mutableStateOf(false); var status by mutableStateOf("")
              var jobTitle by mutableStateOf(""); var jobSteps by mutableStateOf<List<String>>(emptyList()); var jobStep by mutableIntStateOf(0); var jobP by mutableFloatStateOf(-1f); var jobDetail by mutableStateOf("")
              private var full: Bitmap? = null
              var an: Analysis? = null; var st = EditState(); var rev by mutableIntStateOf(0)
              var baked by mutableStateOf<Bitmap?>(null); var prevBaked by mutableStateOf<Bitmap?>(null); var bakeId by mutableIntStateOf(0); var baking by mutableStateOf(false)
              var orig by mutableStateOf<Bitmap?>(null); var backdrop by mutableStateOf<ImageBitmap?>(null)
              @Volatile var verts: FloatArray? = null; @Volatile var vertsFor: Bitmap? = null; var meshH = 0; var meshRev by mutableIntStateOf(0); val MW = 110
              var depth: DepthData? = null; var depthReady by mutableStateOf(false)
              var tab by mutableStateOf("Face"); var face by mutableIntStateOf(0); var allFaces by mutableStateOf(false)
              var tplK by mutableFloatStateOf(1f); var detect by mutableStateOf(false); var compare by mutableStateOf(false); var mkFamily by mutableStateOf("Asian")
              var sheet by mutableStateOf(true); var tall by mutableStateOf(false); var settings by mutableStateOf(false); var showExp by mutableStateOf(false)
              var zoom by mutableFloatStateOf(1f); var off by mutableStateOf(Offset.Zero); var root by mutableStateOf(IntSize.Zero)
              var parT by mutableFloatStateOf(0f); var parPlay by mutableStateOf(true)
              var prevRes by mutableIntStateOf(1200)
              var customDepth by mutableStateOf(""); var customRestore by mutableStateOf(""); var depthInfo by mutableStateOf(""); var selLayer by mutableIntStateOf(-1); var scanCols by mutableIntStateOf(192)
              val fade = Animatable(1f)
              var parOut = FloatArray(0); private var parPrepV: Prep? = null; private var parKey = ""
              private val hist = ArrayList<EditState>(); private var hp = 0
              private val bakeEx = java.util.concurrent.ScheduledThreadPoolExecutor(1, java.util.concurrent.ThreadFactory { r -> Thread(r).also { it.priority = Thread.NORM_PRIORITY - 1 } }); private val meshEx = Executors.newSingleThreadExecutor()
              private var bakeReq = 0; private var meshReq = 0; private var lastKey = 0
              private val cache = MaskCache(); private val stageCache = StageCache(); private val bases = HashMap<Int, Bitmap>()
              var photoKey = ""; var timings by mutableStateOf(""); var cacheSize by mutableLongStateOf(0L)
              fun newMaskCache() = MaskCache().also { it.photo = photoKey }
              fun depthTag(bp: BokehP) = "${bp.model}_${if (bp.model >= 2) 0 else bp.side}_${if (bp.tta) 1 else 0}" + (if (bp.model == 3) "_" + customDepth.hashCode() else "")

              init { Th.load(prefs); prevRes = prefs.getInt("prevRes", 1200); Acc.nnapi = prefs.getBoolean("nnapi", false); Acc.fastParse = prefs.getBoolean("fast", false)
                  DiskCache.init(app); DiskCache.enabled = prefs.getBoolean("diskCache", true); DiskCache.maxBytes = prefs.getLong("cacheMax", 1_500_000_000L)
                  customDepth = prefs.getString("customDepth", "") ?: ""; customRestore = prefs.getString("customRestore", "") ?: "" }
              fun saveSettings() { Th.save(prefs); prefs.edit().putInt("prevRes", prevRes).putBoolean("nnapi", Acc.nnapi).putBoolean("fast", Acc.fastParse).putBoolean("diskCache", DiskCache.enabled).putLong("cacheMax", DiskCache.maxBytes).apply() }

              private fun base(r: Int): Bitmap = bases.getOrPut(r) {
                  val f = full!!; val sc = min(1f, r.toFloat() / maxOf(f.width, f.height))
                  if (sc >= 1f) f else Bitmap.createScaledBitmap(f, (f.width * sc).toInt(), (f.height * sc).toInt(), true)
              }
              private fun startJob(title: String, steps: List<String> = emptyList()) { busy = true; jobTitle = title; jobSteps = steps; jobStep = 0; jobP = -1f; jobDetail = "" }

              fun downloadCore() {
                  if (busy) return; startJob("Setting up AI models")
                  Thread {
                      try {
                          val list = listOf(Models.FACE, Models.POSE, Models.SELFIE, Models.PARSE)
                          for ((i, m) in list.withIndex()) { jobDetail = m.file; Models.fetch(app, m) { jobP = (i + it) / list.size } }
                          coreReady = true; status = "AI models ready"
                      } catch (e: Throwable) { status = "Download failed: ${e.message?.take(90)}" }
                      busy = false
                  }.start()
              }

              fun open(uri: Uri) {
                  if (busy) return; startJob("Analysing the whole photo", STEPS)
                  Thread {
                      try {
                          val src = ImageDecoder.createSource(app.contentResolver, uri)
                          val bmp = ImageDecoder.decodeBitmap(src) { dec, info, _ ->
                              var n = 1; val m = maxOf(info.size.width, info.size.height); while (m / n > 3600) n *= 2
                              dec.setTargetSampleSize(n); dec.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                          }
                          full = bmp.copy(Bitmap.Config.ARGB_8888, false); bases.clear(); cache.clear(); stageCache.clear(); depth = null; depthReady = false; verts = null
                          photoKey = DiskCache.key(full!!); cache.photo = photoKey; stageCache.photo = photoKey
                          val cachedA = DiskCache.loadAnalysis(photoKey)
                          val a = if (cachedA != null) { jobStep = 5; cachedA } else Analyzer.analyze(app, full!!) { jobStep = it }.also { DiskCache.saveAnalysis(photoKey, it) }
                          DiskCache.trim()
                          an = a; st = EditState(); for (i in a.faces.indices) st.faces.add(FaceEdit())
                          hist.clear(); hist.add(st.copy()); hp = 0; face = 0; zoom = 1f; off = Offset.Zero; lastKey = st.bakeKey()
                          jobStep = 5; orig = base(prevRes); stage = 1; rev++
                          DiskCache.loadDepth(photoKey, depthTag(st.bokeh))?.let { depth = it; depthReady = true }
                          status = (if (cachedA != null) "Loaded from cache. " else "") + (if (a.faces.isEmpty()) "No face found. Body, skin, light and bokeh still work." else "${a.faces.size} face(s) found")
                          bake()
                      } catch (e: Throwable) { status = "Could not open: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }

              private fun makeBackdrop(b: Bitmap) {
                  val w = 96; val h = maxOf(8, (96f * b.height / b.width).toInt()); val s = Bitmap.createScaledBitmap(b, w, h, true)
                  val px = IntArray(w * h); s.getPixels(px, 0, w, 0, 0, w, h)
                  val r = (1 + Th.blur * 5f).toInt(); val ch = Array(3) { c -> FloatArray(w * h) { ((px[it] shr (16 - 8 * c)) and 255) / 255f } }
                  val bl = ch.map { Img.box(Img.box(it, w, h, r), w, h, r) }
                  s.setPixels(IntArray(w * h) { (0xFF shl 24) or ((bl[0][it] * 255f).toInt() shl 16) or ((bl[1][it] * 255f).toInt() shl 8) or (bl[2][it] * 255f).toInt() }, 0, w, 0, 0, w, h)
                  backdrop = s.asImageBitmap()
              }
              fun refreshBackdrop() { val b = baked ?: return; bakeEx.execute { makeBackdrop(b) } }

              /** Two-step render: a quick low-resolution draft appears immediately, then the full preview replaces it once the sliders have been still for a moment. */
              fun bake() {
                  val a = an ?: return; val my = ++bakeReq; val snap = st.copy(); val dp = depth; val dbg = detect; baking = true
                  fun job(res: Int, qual: Float, last: Boolean) = Runnable {
                      if (my != bakeReq) return@Runnable
                      try {
                          val prof = StringBuilder()
                          val b = if (dbg) Render.debug(a, base(res)) else Render.bake(a, base(res), snap, dp, cache, BakeOpt(stageCache, qual, prof)) { my != bakeReq }
                          if (my == bakeReq) { prevBaked = baked; baked = b; bakeId++; if (!dbg && last) makeBackdrop(b); meshAsync(); if (last) { timings = "${b.width}px  " + prof.toString(); baking = false } }
                      } catch (e: Canceled) {} catch (e: Throwable) { status = "Render error: ${e.message?.take(100)}"; baking = false }
                  }
                  val draft = minOf(prevRes, 720)
                  if (prevRes > draft && !dbg) { bakeEx.execute(job(draft, 0.45f, false)); bakeEx.schedule(job(prevRes, 0.8f, true), 350, java.util.concurrent.TimeUnit.MILLISECONDS) }
                  else bakeEx.execute(job(prevRes, 0.8f, true))
              }

              fun meshAsync() {
                  val a = an ?: return; val b = baked ?: return; val my = ++meshReq; val snap = st.copy()
                  meshEx.execute {
                      if (my != meshReq) return@execute
                      val k = b.width.toFloat() / a.w; val mh = maxOf(2, (MW * b.height.toFloat() / b.width).roundToInt())
                      val v = Render.finalMesh(a, snap, b.width, b.height, depth, MW, mh)
                      if (my == meshReq) { meshH = mh; vertsFor = b; verts = v; meshRev++ }
                  }
              }

              fun touch() { rev++; val k = st.bakeKey(); if (k != lastKey) { lastKey = k; bake() } else meshAsync() }
              fun commit() { while (hist.size > hp + 1) hist.removeAt(hist.size - 1); hist.add(st.copy()); hp = hist.size - 1; if (hist.size > 40) { hist.removeAt(0); hp-- } }
              fun undo() { if (hp > 0) { hp--; st = hist[hp].copy(); touch() } }

              private fun targets(): List<FaceEdit> = if (allFaces) st.faces else listOfNotNull(st.faces.getOrNull(face))
              fun targetsPublic() = targets()
              fun curFace(): FaceEdit? = st.faces.getOrNull(face)
              fun pv(id: String): Float { rev; return if (tab == "Body") st.body[id] ?: 0f else st.faces.getOrNull(face)?.p?.get(id) ?: 0f }
              fun setP(id: String, v: Float) { if (tab == "Body") st.body[id] = v else targets().forEach { it.p[id] = v }; touch() }
              fun applyTpl(t: Tpl) {
                  val whole = t.group == "Whole look"
                  val clear = if (whole) Defs.TABS.filterKeys { it != "Body" }.values.flatten().map { it.id } else (Defs.TABS[tab] ?: emptyList()).map { it.id }
                  val maps: List<MutableMap<String, Float>> = if (tab == "Body") listOf(st.body) else targets().map { it.p }
                  for (m in maps) { for (c in clear) m.remove(c); for ((k, v) in t.v) m[k] = (v * tplK).coerceIn(-1.3f, 1.3f) }
                  touch(); commit()
              }
              fun resetTab() {
                  val ids = (Defs.TABS[tab] ?: emptyList()).map { it.id }
                  val maps: List<MutableMap<String, Float>> = if (tab == "Body") listOf(st.body) else targets().map { it.p }
                  for (m in maps) for (i in ids) m.remove(i)
                  touch(); commit()
              }

              fun computeDepth() {
                  if (busy || full == null) return; val bp = st.bokeh
                  startJob("Estimating depth", listOf("Preparing the depth model", "Reading depth", "Refining edges"))
                  Thread {
                      try {
                          val t0 = System.nanoTime()
                          fun ms2() = (System.nanoTime() - t0) / 1_000_000
                          val tag = depthTag(bp)
                          val cd = DiskCache.loadDepth(photoKey, tag)
                          val d: DepthData = cd?.also { depthInfo = "restored from the disk cache"; jobStep = 1 } ?: when (bp.model) {
                              2 -> { val m = Models.DEPTH_TFL
                                  if (!Models.has(app, m)) { jobDetail = m.file; Models.fetch(app, m) { jobP = it } }
                                  jobP = -1f; jobDetail = ""; jobStep = 1
                                  DepthTfl.run(Models.path(app, m).path, base(2000), true, bp.tta).also { depthInfo = "${DepthTfl.backend}: ${DepthTfl.lastMs} ms" } }
                              3 -> { jobStep = 1; val p = customDepth
                                  if (p.endsWith(".tflite")) DepthTfl.run(p, base(2000), true, bp.tta).also { depthInfo = "${DepthTfl.backend}: ${DepthTfl.lastMs} ms (custom)" }
                                  else DepthNet.runPath(p, base(2000), bp.side, bp.tta).also { depthInfo = "ONNX custom: ${ms2()} ms" } }
                              else -> { val m = Models.DEPTH[bp.model]
                                  if (!Models.has(app, m)) { jobDetail = m.file; Models.fetch(app, m) { jobP = it } }
                                  jobP = -1f; jobDetail = ""; jobStep = 1
                                  DepthNet.run(app, bp.model, base(2000), bp.side, bp.tta).also { depthInfo = "CPU ONNX: ${ms2()} ms" } }
                          }.also { it.tag = tag; DiskCache.saveDepth(photoKey, tag, it) }
                          depth = d; jobStep = 2; depthReady = true; st.bokeh.on = true; status = "Depth ready (${depthInfo}). Tap the photo to set focus."; lastKey = 0; touch(); commit()
                      } catch (e: Throwable) { status = "Depth failed: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }

              fun export(r: Int) {
                  val a = an ?: return; if (busy) return; startJob("Exporting the photo", listOf("Applying every effect", "Reshaping", "Saving"))
                  Thread {
                      try {
                          val b = Render.bake(a, base(r), st.copy(), depth, newMaskCache(), BakeOpt(null, 1f, null) { jobDetail = it }) { false }; jobStep = 1
                          val out = Render.finish(a, st, b, depth); jobStep = 2
                          val v = ContentValues().apply { put(MediaStore.Images.Media.DISPLAY_NAME, "FaceLab_" + System.currentTimeMillis() + ".jpg"); put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                              put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/FaceLab"); put(MediaStore.Images.Media.IS_PENDING, 1) }
                          val u = app.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)
                          if (u != null) { app.contentResolver.openOutputStream(u)?.use { out.compress(Bitmap.CompressFormat.JPEG, 98, it) }; v.clear(); v.put(MediaStore.Images.Media.IS_PENDING, 0); app.contentResolver.update(u, v, null, null); status = "Saved to Pictures/FaceLab (${out.width} x ${out.height})" }
                          else status = "Save failed"
                      } catch (e: Throwable) { status = "Export failed: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }

              fun importModel(uri: Uri, role: String) {
                  Thread {
                      try {
                          val name = app.contentResolver.query(uri, null, null, null, null)?.use { c -> if (c.moveToFirst()) { val i = c.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME); if (i >= 0) c.getString(i) else null } else null } ?: ("model_" + role)
                          val f = java.io.File(java.io.File(app.filesDir, "custom").also { it.mkdirs() }, name)
                          app.contentResolver.openInputStream(uri)?.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                          if (role == "depth") { customDepth = f.path; prefs.edit().putString("customDepth", f.path).apply() } else { customRestore = f.path; prefs.edit().putString("customRestore", f.path).apply() }
                          status = "Imported $name"
                      } catch (e: Throwable) { status = "Import failed: ${e.message?.take(80)}" }
                  }.start()
              }

              fun setRestore(on: Boolean, custom: Boolean) {
                  if (!on) { st.restore.on = false; touch(); commit(); return }
                  if (busy) return
                  if (custom && customRestore.isEmpty()) { status = "Import a restore model in Settings first"; return }
                  val path = if (custom) customRestore else Models.path(app, Models.RESTORE).path
                  if (!custom && !Models.has(app, Models.RESTORE)) {
                      startJob("Downloading the face restorer (340 MB)")
                      Thread {
                          try { jobDetail = Models.RESTORE.file; Models.fetch(app, Models.RESTORE) { jobP = it }; st.restore.custom = path; st.restore.on = true; touch(); commit() }
                          catch (e: Throwable) { status = "Download failed: ${e.message?.take(90)}" }
                          busy = false
                      }.start(); return
                  }
                  st.restore.custom = path; st.restore.on = true; touch(); commit()
              }

              fun addAccessory(kind: String) {
                  val l = LayerP(); l.kind = kind; l.face = face.coerceIn(0, maxOf(0, (an?.faces?.size ?: 1) - 1)); st.layers.add(l); selLayer = st.layers.size - 1; touch(); commit()
              }
              fun addPng(uri: Uri) {
                  Thread {
                      try {
                          val src = ImageDecoder.createSource(app.contentResolver, uri)
                          val b = ImageDecoder.decodeBitmap(src) { dec, info, _ -> var n = 1; val m = maxOf(info.size.width, info.size.height); while (m / n > 1600) n *= 2; dec.setTargetSampleSize(n); dec.allocator = ImageDecoder.ALLOCATOR_SOFTWARE }.copy(Bitmap.Config.ARGB_8888, false)
                          val id = LayerStore.next++; LayerStore.bmps[id] = b
                          val l = LayerP(); l.kind = "png"; l.bmp = id; l.face = face.coerceIn(0, maxOf(0, (an?.faces?.size ?: 1) - 1)); st.layers.add(l); selLayer = st.layers.size - 1; touch(); commit()
                      } catch (e: Throwable) { status = "Could not load the image: ${e.message?.take(80)}" }
                  }.start()
              }
              fun removeLayer(i: Int) {
                  if (i !in st.layers.indices) return; st.layers.removeAt(i); selLayer = if (st.layers.isEmpty()) -1 else (i - 1).coerceAtLeast(0); touch(); commit()
              }

              fun scanExport(cols: Int) {
                  val a = an ?: return; val d = depth ?: run { status = "Compute the depth map first"; return }; if (busy) return
                  startJob("Building the 3D relief scan", listOf("Applying every effect", "Meshing the relief", "Writing OBJ, MTL and texture"))
                  Thread {
                      try {
                          val b = Render.bake(a, base(2048), st.copy(), depth, newMaskCache(), BakeOpt(null, 1f, null) { jobDetail = it }) { false }; jobStep = 1
                          val where_ = Scan.exportObj(app, b, d, a, st.sculpt, cols, st.tilt.depthK, st.tilt.pivot); jobStep = 2; status = "Scan saved to $where_"
                      } catch (e: Throwable) { status = "Scan failed: ${e.message?.take(90)}" }
                      busy = false
                  }.start()
              }

              fun parPrep(): Prep? {
                  val d = depth ?: return null; if (meshH < 2) return null; val p = st.par; val k = "${p.gamma}|${p.smooth}|${p.protect}|${p.focus}|${MW}|$meshH|${System.identityHashCode(d)}"
                  if (k != parKey || parPrepV == null) { parPrepV = Parallax.prepare(d, MW, meshH, p); parKey = k }
                  return parPrepV
              }

              fun parExport() {
                  val a = an ?: return; val d = depth ?: return; if (busy) return; val p = st.par.copy(); startJob("Rendering parallax video", listOf("Applying every effect", "Building the depth mesh", "Encoding frames"))
                  Thread {
                      try {
                          val bm = base(p.res); val w = maxOf(16, bm.width / 16 * 16); val h = maxOf(16, bm.height / 16 * 16)
                          val b = Render.bake(a, bm, st.copy(), d, newMaskCache(), BakeOpt(null, 1f, null) { jobDetail = it }) { false }; jobStep = 1
                          val scaled = if (b.width == w && b.height == h) b else Bitmap.createScaledBitmap(b, w, h, true)
                          val mw = 140; val mh = maxOf(2, (mw * h.toFloat() / w).roundToInt())
                          val verts = Render.finalMesh(a, st, w, h, d, mw, mh); val prep = Parallax.prepare(d, mw, mh, p); jobStep = 2
                          val ok = Parallax.encode(app, scaled, verts, mw, mh, prep, p) { jobP = it }
                          status = if (ok) "Saved to Movies/FaceLab (${w} x ${h})" else "Video export failed"
                      } catch (e: Throwable) { status = "Video export failed: ${e.message?.take(100)}" }
                      busy = false
                  }.start()
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  enableEdgeToEdge(SystemBarStyle.dark(android.graphics.Color.TRANSPARENT), SystemBarStyle.dark(android.graphics.Color.TRANSPARENT))
                  val vm = Vm(applicationContext)
                  setContent { App(vm) }
              }
          }

          // ---------------------------------------------------------------- glass primitives

          @Composable fun Modifier.glass(radius: Dp = Th.corner.dp, strength: Float = 1f): Modifier {
              val bd = LocalBackdrop.current
              var pos by remember { mutableStateOf(Offset.Zero) }
              val shape = RoundedCornerShape(radius)
              return this.onGloballyPositioned { pos = it.positionInRoot() }.clip(shape).drawBehind {
                  val b = bd?.bmp
                  if (b != null && bd.root.width > 0) {
                      val fit = minOf(bd.root.width.toFloat() / b.width, bd.root.height.toFloat() / b.height) * bd.zoom
                      val dw = b.width * fit; val dh = b.height * fit
                      translate(-pos.x, -pos.y) { drawImage(b, dstOffset = IntOffset((bd.root.width / 2f + bd.off.x - dw / 2f).toInt(), (bd.root.height / 2f + bd.off.y - dh / 2f).toInt()), dstSize = IntSize(dw.toInt(), dh.toInt())) }
                  }
                  drawRect(Color(0xFF0C0C14).copy(alpha = (Th.opacity * strength).coerceIn(0f, 0.95f)))
                  drawRect(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.13f * strength), Color.Transparent), endY = size.height * 0.6f))
              }.border(1.dp, Brush.linearGradient(listOf(Color.White.copy(alpha = 0.5f), Color.White.copy(alpha = 0.05f), Color.White.copy(alpha = 0.2f))), shape)
          }

          @Composable fun Modifier.press(onClick: () -> Unit): Modifier {
              val src = remember { MutableInteractionSource() }; val p by src.collectIsPressedAsState(); val hap = LocalHapticFeedback.current
              val s by animateFloatAsState(if (p) 0.93f else 1f, spring(0.45f, 500f * Th.speed), label = "press")
              return this.graphicsLayer { scaleX = s; scaleY = s }.clickable(src, null) { if (Th.haptics) hap.performHapticFeedback(HapticFeedbackType.TextHandleMove); onClick() }
          }

          @Composable fun GPill(text: String, on: Boolean = false, onClick: () -> Unit) {
              val a by animateFloatAsState(if (on) 1f else 0f, tween(ms(260)), label = "pill")
              Box(Modifier.press(onClick).glass(20.dp, 0.8f).drawBehind { if (a > 0f) drawRect(Th.grad(), alpha = 0.9f * a) }.padding(horizontal = 14.dp, vertical = 8.dp)) {
                  Text(text, color = if (on) Color(0xFF0A0A0F) else Color.White, fontSize = 13.sp, fontWeight = if (on) FontWeight.Bold else FontWeight.Medium) }
          }

          private fun DrawScope.glyph(i: Int, c: Color) {
              val s = size.minDimension; val w = s * 0.09f; val rc = StrokeCap.Round
              when (i) {
                  0 -> { drawLine(c, Offset(s * .27f, s * .27f), Offset(s * .73f, s * .73f), w, rc); drawLine(c, Offset(s * .73f, s * .27f), Offset(s * .27f, s * .73f), w, rc) }
                  1 -> { drawArc(c, 200f, 230f, false, Offset(s * .22f, s * .3f), Size(s * .56f, s * .46f), style = Stroke(w, cap = rc)); drawLine(c, Offset(s * .24f, s * .22f), Offset(s * .24f, s * .42f), w, rc); drawLine(c, Offset(s * .24f, s * .42f), Offset(s * .42f, s * .4f), w, rc) }
                  2 -> { drawOval(c, Offset(s * .14f, s * .3f), Size(s * .72f, s * .4f), style = Stroke(w)); drawCircle(c, s * .09f, Offset(s * .5f, s * .5f)) }
                  3 -> for ((x, y) in listOf(.2f to .2f, .8f to .2f, .2f to .8f, .8f to .8f)) { val dx = if (x < .5f) 1f else -1f; val dy = if (y < .5f) 1f else -1f
                      drawLine(c, Offset(s * x, s * y), Offset(s * (x + dx * .16f), s * y), w, rc); drawLine(c, Offset(s * x, s * y), Offset(s * x, s * (y + dy * .16f)), w, rc) }
                  4 -> for ((k, kx) in listOf(.25f to .35f, .5f to .65f, .75f to .45f)) { drawLine(c, Offset(s * .18f, s * k), Offset(s * .82f, s * k), w * .7f, rc); drawCircle(c, s * .075f, Offset(s * kx, s * k)) }
                  5 -> { drawLine(c, Offset(s * .5f, s * .62f), Offset(s * .5f, s * .2f), w, rc); drawLine(c, Offset(s * .34f, s * .36f), Offset(s * .5f, s * .2f), w, rc); drawLine(c, Offset(s * .66f, s * .36f), Offset(s * .5f, s * .2f), w, rc)
                      drawRoundRect(c, Offset(s * .2f, s * .5f), Size(s * .6f, s * .3f), CornerRadius(s * .08f), style = Stroke(w)) }
                  else -> { drawLine(c, Offset(s * .25f, s * .4f), Offset(s * .5f, s * .62f), w, rc); drawLine(c, Offset(s * .75f, s * .4f), Offset(s * .5f, s * .62f), w, rc) }
              }
          }

          @Composable fun GIcon(i: Int, on: Boolean = false, onClick: (() -> Unit)? = null) {
              val a by animateFloatAsState(if (on) 1f else 0f, tween(ms(260)), label = "ic")
              Box((if (onClick != null) Modifier.press(onClick) else Modifier).size(42.dp).glass(21.dp, 0.9f).drawBehind { if (a > 0f) drawRect(Th.grad(), alpha = 0.9f * a) }.padding(11.dp)) {
                  Canvas(Modifier.fillMaxSize()) { glyph(i, if (on) Color(0xFF0A0A0F) else Color.White) } }
          }

          @Composable fun Sec(t: String) { Text(t.uppercase(), color = Color.White.copy(alpha = 0.5f), fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.2.sp) }

          @Composable fun Swatch(name: String, color: Int, on: Boolean, onClick: () -> Unit) {
