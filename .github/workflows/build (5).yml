                  val mk0 = if (fe0 != null) fe0.mk?.tuned(fe0.mkOn, fe0.partK, fe0.col) else null
                  if (mk0 != null) { if (sp.tone == 0 && mk0.skinTone != 0) { sp.tone = mk0.skinTone; sp.amt = mk0.skinAmt }; sp.smooth = maxOf(sp.smooth, mk0.smooth); sp.glow = maxOf(sp.glow, mk0.glow) }
                  val hp = st.hair
                  val active = booleanArrayOf(
                      hasFace && st.restore.on && st.restore.custom.isNotEmpty(), hasFace && sp.active(), hasFace && (hp.c1 != 0 || hp.wave > 0f), st.outfit.mode != 0 && st.outfit.c1 != 0,
                      hasFace && st.detail.active(), depth != null && ((st.sculpt.active() && st.sculpt.shade > 0f) || st.light.on),
                      st.layers.isNotEmpty() || st.faces.any { it.mk != null }, bp.on && depth != null, st.adj.active())
                  val keys = arrayOf("r" + st.restore.key(), "s" + sp.key(), "h" + hp.key(), "o" + st.outfit.key(), "d" + st.detail.key(), "v" + st.sculpt.key() + st.light.key() + dTag,
                      "m" + st.faces.joinToString("/") { it.key() } + st.layers.joinToString("/") { it.key() }, "b" + bp.key() + dTag + opt.qual, "a" + st.adj.key())
                  val cum = IntArray(9); var hsh = 17; for (i in 0 until 9) { hsh = hsh * 31 + keys[i].hashCode(); cum[i] = hsh }
