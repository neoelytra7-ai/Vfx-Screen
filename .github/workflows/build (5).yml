                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Fast analysis (skip mirror pass)", Acc.fastParse) { Acc.fastParse = !Acc.fastParse; sv() } }
                      Text("Cache and speed", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Disk cache", DiskCache.enabled) { DiskCache.enabled = !DiskCache.enabled; sv() }; GPill("Show timings", Th.perf) { Th.perf = !Th.perf; sv() } }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { for ((label, bytes) in listOf("0.5 GB" to 500_000_000L, "1.5 GB" to 1_500_000_000L, "3 GB" to 3_000_000_000L)) GPill(label, DiskCache.maxBytes == bytes) { DiskCache.maxBytes = bytes; sv() } }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Clear cache (${vm.cacheSize / 1_000_000} MB)") { DiskCache.clear(); vm.cacheSize = DiskCache.size() } }
                      Text("Analysis, depth maps, refined masks and evicted render stages are kept on flash, so reopening a photo, switching effects and exporting reuse them instead of recomputing. Oldest files are removed when the limit is reached.", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp)
                      Text("Model Lab", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Import depth model") { pickD.launch("*/*") }; GPill("Import restore model") { pickR.launch("*/*") } }
                      Text("Depth: " + (if (vm.customDepth.isEmpty()) "none" else java.io.File(vm.customDepth).name) + "   Restore: " + (if (vm.customRestore.isEmpty()) "none" else java.io.File(vm.customRestore).name), color = Color.White.copy(alpha = 0.55f), fontSize = 11.sp)
                      Text("Depth models: .tflite runs on the GPU delegate, .onnx on the CPU; input must be an RGB image, output a depth map (any fixed size). Restore models: 512 px ONNX, RGB in and out, range -1..1. Local Dream NPU context binaries are compiled per chip generation and cannot run on a Snapdragon 8 Gen 1; importing the source ONNX/TFLite model works.", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp)
                      Text("GPU use: the live reshape preview, 3D tilt and the TFLite depth model run on the GPU. Colour effects, makeup and bokeh are CPU pixel code. NNAPI lets the ONNX models use the vendor GPU/DSP driver (restart after changing it).", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp)
                  }
              }
          }

          private val ACC_PAL = listOf("Gold" to 0xD8B060, "Silver" to 0xC0C4CC, "Rose gold" to 0xD8A090, "Black" to 0x1A1A20, "White" to 0xF2F2F2, "Red" to 0xC01830, "Blue" to 0x2A6AF0, "Pink" to 0xF080A0,
              "Green" to 0x2A9A6A, "Violet" to 0x7A3AE0, "Brown" to 0x6A4A32, "Sky" to 0xAFD8F0)

          @Composable fun RestorePanel(vm: Vm) {
              val r = vm.st.restore
              if (vm.an?.faces.isNullOrEmpty()) { Text("Face restoration needs a detected face.", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp); return }
              val def = Models.path(vm.app, Models.RESTORE).path
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  GPill("Off", !r.on) { vm.setRestore(false, false) }
                  GPill("GFPGAN 1.4", r.on && r.custom == def) { vm.setRestore(true, false) }
                  if (vm.customRestore.isNotEmpty()) GPill("Custom model", r.on && r.custom == vm.customRestore) { vm.setRestore(true, true) }
              }
              SL(vm, "Strength", "subtle", "full", r.strength, 0f..1f) { r.strength = it }
              Text("GFPGAN 1.4 is a 340 MB one-time download and takes a few seconds per face on CPU. It runs first, so every other effect works on the cleaned face. Import your own 512 px model in Settings.", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp)
          }

          @Composable fun StylePanel(vm: Vm) {
              val pick = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { x -> if (x != null) vm.addPng(x) }
              Sec("Accessories")
              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(Deco.KINDS.size) { i -> GPill(Deco.KINDS[i]) { vm.addAccessory(Deco.KINDS[i]) } } }
              Row { GPill("Import PNG layer (hair piece, hat, clothes)") { pick.launch("image/*") } }
              val ls = vm.st.layers
              if (ls.isNotEmpty()) {
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(ls.size) { i -> GPill("${i + 1}. " + (if (ls[i].kind == "png") "PNG" else ls[i].kind), vm.selLayer == i) { vm.selLayer = i } } }
                  val l = ls.getOrNull(vm.selLayer)
                  if (l != null) {
                      val png = l.kind == "png"
                      if (png) { Sec("Anchor"); LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(Deco.ANCHORS.size) { i -> GPill(Deco.ANCHORS[i], l.anchor == i) { l.anchor = i; vm.touch(); vm.commit() } } } }
                      if (png) SL(vm, "Size", "small", "large", l.scale, 0.2f..3f) { l.scale = it } else SL(vm, "Size", "small", "large", l.size, 0.5f..1.8f) { l.size = it }
                      if (png) SL(vm, "Rotation", "", "", l.rot, -180f..180f) { l.rot = it }
                      SL(vm, "Move sideways", "left", "right", l.dx, -2f..2f) { l.dx = it }
                      SL(vm, "Move up / down", "up", "down", l.dy, -2f..2f) { l.dy = it }
                      if (png) {
                          SL(vm, "Opacity", "", "", l.alpha, 0f..1f) { l.alpha = it }
                          val bl = listOf("Normal", "Multiply", "Screen", "Overlay")
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(bl.size) { i -> GPill(bl[i], l.blend == i) { l.blend = i; vm.touch(); vm.commit() } } }
                      } else {
                          SL(vm, "Thickness", "thin", "bold", l.thick, 0.4f..2.5f) { l.thick = it }
                          Sec("Main color")
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) { items(ACC_PAL.size) { i -> val c = ACC_PAL[i]; Swatch(c.first, c.second, l.c1 == argb(c.second)) { l.c1 = argb(c.second); vm.touch(); vm.commit() } } }
                          Sec("Gem or lens color")
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) { items(ACC_PAL.size) { i -> val c = ACC_PAL[i]; Swatch(c.first, c.second, l.c2 == argb(c.second)) { l.c2 = argb(c.second); vm.touch(); vm.commit() } } }
                      }
                      Row { GPill("Remove layer") { vm.removeLayer(vm.selLayer) } }
                  }
              }
              val o = vm.st.outfit
              Sec("Outfit color and pattern")
              val modes = listOf("Off", "Solid", "Stripes", "Plaid", "Dots", "Gradient")
              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(modes.size) { i -> GPill(modes[i], o.mode == i) { o.mode = i; vm.touch(); vm.commit() } } }
              if (o.mode != 0) {
                  val pal = ACC_PAL + PAL
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) { items(pal.size) { i -> val c = pal[i]; Swatch(c.first, c.second, o.c1 == argb(c.second)) { o.c1 = argb(c.second); vm.touch(); vm.commit() } } }
                  if (o.mode >= 2) { Sec("Second color"); LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) { items(pal.size) { i -> val c = pal[i]; Swatch(c.first, c.second, o.c2 == argb(c.second)) { o.c2 = argb(c.second); vm.touch(); vm.commit() } } } }
                  SL(vm, "Strength", "", "", o.amt, 0f..1f) { o.amt = it }
                  Fine(vm) {
                      SL(vm, "Keep fabric folds", "flat", "natural", o.keep, 0.3f..1f) { o.keep = it }
                      if (o.mode in 2..4) SL(vm, "Pattern size", "fine", "bold", o.scale, 0.2f..3f) { o.scale = it }
                      if (o.mode in 2..4) SL(vm, "Pattern angle", "", "", o.angle, 0f..180f) { o.angle = it }
                  }
              }
              Text("Recolors the real clothes and keeps their folds. Swapping garments for different cuts needs a generative model; import a PNG of the garment above to place one.", color = Color.White.copy(alpha = 0.4f), fontSize = 10.sp)
          }

          @Composable fun ThreePanel(vm: Vm) {
              if (!vm.depthReady) {
                  Text("3D tilt, volume sculpting and the relief scan all build on the depth map. Compute it once in the Bokeh tab (the GPU option is the fast one).", color = Color.White.copy(alpha = 0.6f), fontSize = 13.sp)
                  Row { GPill("Go to Bokeh") { vm.tab = "Bokeh" } }; return
              }
              val t = vm.st.tilt; val s = vm.st.sculpt
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("3D tilt", t.on) { t.on = !t.on; vm.touch(); vm.commit() } }
              SL(vm, "Turn head and body (yaw)", "left", "right", t.yaw, -35f..35f) { t.yaw = it }
              SL(vm, "Tilt up / down (pitch)", "down", "up", t.pitch, -35f..35f) { t.pitch = it }
              Fine(vm) {
                  SL(vm, "Roll", "", "", t.roll, -20f..20f) { t.roll = it }
                  SL(vm, "Camera distance", "far", "close", t.dolly, -1f..1f) { t.dolly = it }
                  SL(vm, "Depth strength", "flatter", "deeper", t.depthK, 0.2f..2f) { t.depthK = it }
                  SL(vm, "Pivot plane", "far", "near", t.pivot, 0f..1f) { t.pivot = it }
                  SL(vm, "Depth smoothing", "sharp edges", "soft edges", t.smooth, 0f..1f) { t.smooth = it }
                  SL(vm, "Edge protect", "", "", t.protect, 0f..1f) { t.protect = it }
              }
              Sec("Sculpt volume")
              for ((id, label) in Sculpt.DEFS) SliderRow(label, "less", "more", s.v[id] ?: 0f, -1f..1f, { "%+.2f".format(it) }, { s.v[id] = it; vm.touch() }, { vm.commit() })
              SL(vm, "Relief shading", "none", "full", s.shade, 0f..1f) { s.shade = it }
              Sec("3D scan export")
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { for (c in listOf(128, 192, 256, 384)) GPill("$c", vm.scanCols == c) { vm.scanCols = c } }
              Box(Modifier.fillMaxWidth().press { vm.scanExport(vm.scanCols) }.clip(RoundedCornerShape(18.dp)).background(Th.grad()).padding(vertical = 13.dp), contentAlignment = Alignment.Center) {
                  Text("Export relief scan (OBJ + texture)", color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 14.sp) }
              Text("This is a single-photo relief scan: a textured height-field mesh from the depth map, with your sculpting included. Hidden surfaces (the back of the head) cannot be recovered from one photo, so tilts beyond about 30 degrees stretch. A true all-round 3D scan needs several photos.", color = Color.White.copy(alpha = 0.4f), fontSize = 10.sp)
          }
          EOF
      - run: gradle assembleDebug --no-daemon --stacktrace
        env:
          VC: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: FaceLab-debug, path: app/build/outputs/apk/debug/*.apk }
