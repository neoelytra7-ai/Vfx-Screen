              }

              /**
               * Every effect except the shape warp and 3D tilt. The pipeline has 9 stages; each stage's result is cached under a key made of all settings up to that stage,
               * so changing one slider only recomputes that stage and the ones after it.
               */
              fun bake(an: Analysis, base: Bitmap, st: EditState, depth: DepthData?, cache: MaskCache, opt: BakeOpt = BakeOpt(), cancel: () -> Boolean): Bitmap {
                  fun chk() { if (cancel()) throw Canceled() }
                  val w = base.width; val h = base.height; val n = w * h; val k = w.toFloat() / an.w
                  val hasFace = an.faces.isNotEmpty(); val prof = opt.prof; val bp = st.bokeh
                  fun fk(i: Int) = FloatArray(an.faces[i].size) { an.faces[i][it] * k }
                  val bpx = IntArray(n); base.getPixels(bpx, 0, w, 0, 0, w, h)
                  val gray = cache.at(w).getOrPut("gray") { Img.gray(bpx) }
