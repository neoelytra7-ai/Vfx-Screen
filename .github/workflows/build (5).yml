                  chk()
                  work.setPixels(px, 0, w, 0, 0, w, h)
                  return work
              }

              fun ops(an: Analysis, st: EditState): List<Op> {
                  val ops = ArrayList<Op>()
                  for (i in an.faces.indices) st.faces.getOrNull(i)?.let { Warp.faceOps(an.faces[i], it.p, st.range, ops) }
                  an.pose?.let { Warp.bodyOps(it, st.body, st.range, ops) }
                  return ops
              }

              /** Reshape mesh plus the optional 3D tilt, in one vertex grid. */
              fun finalMesh(an: Analysis, st: EditState, w: Int, h: Int, depth: DepthData?, mw: Int, mh: Int): FloatArray {
                  var v = Warp.mesh(w, h, mw, mh, ops(an, st), w.toFloat() / an.w)
                  if (st.tilt.on && depth != null) {
                      val bl = if (st.sculpt.active()) Sculpt.blobs(an, st.sculpt) else emptyList()
                      v = Tilt.apply(v, w, h, mw, mh, depth, if (bl.isNotEmpty()) Sculpt.grid(bl, an.w, an.h, mw, mh) else null, st.tilt)
                  }
                  return v
              }

              /** Applies the final mesh to a baked bitmap (export path, software canvas). */
              fun finish(an: Analysis, st: EditState, b: Bitmap, depth: DepthData?): Bitmap {
                  if (ops(an, st).isEmpty() && !(st.tilt.on && depth != null)) return b
                  val mw = 220; val mh = maxOf(2, (mw * b.height.toFloat() / b.width).roundToInt())
