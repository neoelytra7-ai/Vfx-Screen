              val bd = Backdrop(vm.backdrop, vm.root, vm.zoom, vm.off)
              CompositionLocalProvider(LocalBackdrop provides bd) {
                  Box(Modifier.fillMaxSize().background(Color(0xFF07070C)).onSizeChanged { vm.root = it }) {
                      if (vm.stage == 0) { Aurora(); Home(vm) } else Editor(vm)
                      ProgressLayer(vm)
                      if (vm.settings) SettingsLayer(vm)
                  }
