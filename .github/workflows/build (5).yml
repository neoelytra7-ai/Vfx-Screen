                          Box(Modifier.fillMaxWidth().press { vm.downloadCore() }.clip(RoundedCornerShape(18.dp)).background(Th.grad()).padding(vertical = 15.dp), contentAlignment = Alignment.Center) { Text("Download AI models", color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 16.sp) }
                      } else {
                          Box(Modifier.fillMaxWidth().press { pick.launch("image/*") }.clip(RoundedCornerShape(18.dp)).background(Th.grad()).padding(vertical = 15.dp), contentAlignment = Alignment.Center) { Text("Open a photo", color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 16.sp) }
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Settings") { vm.settings = true } }
                      }
                      if (vm.status.isNotEmpty()) Text(vm.status, color = Th.a1, fontSize = 13.sp)
