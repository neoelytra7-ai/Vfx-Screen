          @Composable fun Home(vm: Vm) {
              val pick = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { u -> if (u != null) vm.open(u) }
              Column(Modifier.fillMaxSize().statusBarsPadding().padding(26.dp), verticalArrangement = Arrangement.Center) {
