          @Composable fun GSlider(value: Float, range: ClosedFloatingPointRange<Float>, center: Float?, onChange: (Float) -> Unit, onDone: () -> Unit) {
              var drag by remember { mutableStateOf(false) }
              val ts by animateFloatAsState(if (drag) 1.35f else 1f, spring(0.5f, 400f * Th.speed), label = "thumb")
              val span = range.endInclusive - range.start
              Canvas(Modifier.fillMaxWidth().height(30.dp).pointerInput(range) {
                  awaitEachGesture {
                      val d = awaitFirstDown(); drag = true
                      fun upd(x: Float) { onChange(range.start + (x / size.width).coerceIn(0f, 1f) * span) }
                      upd(d.position.x)
                      do { val ev = awaitPointerEvent(); ev.changes.firstOrNull()?.let { upd(it.position.x); it.consume() } } while (ev.changes.any { it.pressed })
                      drag = false; onDone()
                  }
              }) {
                  val f = ((value - range.start) / span).coerceIn(0f, 1f); val cy = size.height / 2; val tr = 4.dp.toPx()
                  drawRoundRect(Color.White.copy(alpha = 0.16f), Offset(0f, cy - tr / 2), Size(size.width, tr), CornerRadius(tr / 2))
                  val c0 = if (center != null) (center - range.start) / span else 0f
                  val a = minOf(c0, f) * size.width; val b = maxOf(c0, f) * size.width
                  drawRoundRect(Th.grad(), Offset(a, cy - tr / 2), Size(maxOf(b - a, 0.1f), tr), CornerRadius(tr / 2))
                  val x = f * size.width
                  if (Th.glow > 0f) drawCircle(Th.a1.copy(alpha = 0.3f * Th.glow * ts), 15.dp.toPx() * ts, Offset(x, cy))
                  drawCircle(Color.White, 8.dp.toPx() * ts, Offset(x, cy))
              }
          }

          @Composable fun SliderRow(label: String, lo: String, hi: String, value: Float, range: ClosedFloatingPointRange<Float>, fmt: (Float) -> String, onChange: (Float) -> Unit, onDone: () -> Unit) {
              var v by remember(value) { mutableFloatStateOf(value) }
              Column {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text(label, color = Color.White.copy(alpha = 0.92f), fontSize = 12.sp, modifier = Modifier.weight(1f).press { v = 0f; onChange(0f); onDone() })
                      Text(fmt(v), color = Th.a1, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                  }
                  GSlider(v, range, if (range.start < 0f) 0f else null, { v = it; onChange(it) }, onDone)
                  if (lo.isNotEmpty()) Row { Text(lo, color = Color.White.copy(alpha = 0.4f), fontSize = 9.sp, modifier = Modifier.weight(1f)); Text(hi, color = Color.White.copy(alpha = 0.4f), fontSize = 9.sp) }
              }
          }

          @Composable fun SL(vm: Vm, label: String, lo: String, hi: String, v: Float, r: ClosedFloatingPointRange<Float>, set: (Float) -> Unit) {
              SliderRow(label, lo, hi, v, r, { "%.2f".format(it) }, { set(it); vm.touch() }, { vm.commit() })
