          @Composable fun Sheet(vm: Vm) {
              Column(Modifier.fillMaxWidth().heightIn(max = if (vm.tall) 560.dp else 330.dp).glass(Th.corner.dp).animateContentSize(spring(0.85f, 300f * Th.speed))) {
                  Box(Modifier.fillMaxWidth().press { vm.tall = !vm.tall }.padding(top = 9.dp, bottom = 4.dp), contentAlignment = Alignment.Center) { Box(Modifier.size(38.dp, 4.dp).background(Color.White.copy(alpha = 0.35f), CircleShape)) }
                  Column(Modifier.verticalScroll(rememberScrollState()).padding(Th.pad, 4.dp, Th.pad, 18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      vm.rev
                      AnimatedContent(vm.tab, transitionSpec = { (fadeIn(tween(ms(260))) + slideInVertically(tween(ms(260))) { it / 14 }) togetherWith fadeOut(tween(ms(120))) }, label = "panel") { t ->
                          Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              when (t) { "Skin" -> SkinPanel(vm); "Hair" -> HairPanel(vm); "Makeup" -> MakeupPanel(vm); "Detail" -> DetailPanel(vm); "Restore" -> RestorePanel(vm); "Style" -> StylePanel(vm); "3D" -> ThreePanel(vm); "Light" -> LightPanel(vm)
                                  "Adjust" -> AdjustPanel(vm); "Bokeh" -> BokehPanel(vm); "Parallax" -> ParallaxPanel(vm); else -> ParamPanel(vm, t) }
                          }
                      }
