              Column(Modifier.press(onClick), horizontalAlignment = Alignment.CenterHorizontally) {
                  Box(Modifier.size(36.dp).graphicsLayer { scaleX = s; scaleY = s }.background(Color(argb(color)), CircleShape).border(if (on) 2.5.dp else 1.dp, if (on) Color.White else Color.White.copy(alpha = 0.25f), CircleShape))
                  Text(name, color = Color.White.copy(alpha = if (on) 0.95f else 0.5f), fontSize = 9.sp, modifier = Modifier.padding(top = 3.dp)) }
