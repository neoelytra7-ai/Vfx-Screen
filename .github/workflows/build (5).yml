              if (vm.depthInfo.isNotEmpty()) Text("Last run: ${vm.depthInfo}", color = Color.White.copy(alpha = 0.5f), fontSize = 10.sp)
              Box(Modifier.fillMaxWidth().press { vm.computeDepth() }.clip(RoundedCornerShape(18.dp)).background(Th.grad()).padding(vertical = 13.dp), contentAlignment = Alignment.Center) {
                  Text(if (vm.depthReady) "Recompute depth" else "Compute depth map", color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 14.sp) }
              if (!vm.depthReady) { Text("Depth Anything V2 runs once on this phone. Higher resolution and flip-averaging trace edges more precisely but take longer. Base is CC BY-NC (personal use).", color = Color.White.copy(alpha = 0.45f), fontSize = 10.sp); return }
              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { GPill("Blur on", b.on) { b.on = !b.on; vm.touch(); vm.commit() }; GPill("Show depth", b.showDepth) { b.showDepth = !b.showDepth; vm.touch() }; GPill("Blur foreground", b.fg) { b.fg = !b.fg; vm.touch(); vm.commit() } }
              Text("Tap the photo to set the focus point.", color = Th.a1, fontSize = 12.sp)
              SL(vm, "Aperture", "f/16", "f/1.2", b.aperture, 0f..1f) { b.aperture = it }
              SL(vm, "In-focus range", "thin", "deep", b.dof, 0f..0.4f) { b.dof = it }
              Fine(vm) {
                  SL(vm, "Falloff", "gradual", "fast", 1.6f - b.gamma, 0.2f..1.4f) { b.gamma = 1.6f - it }
                  SL(vm, "Highlight bokeh balls", "soft", "bright", b.hl, 0f..1f) { b.hl = it }
                  SL(vm, "Cat-eye edges", "none", "strong", b.cat, 0f..1f) { b.cat = it }
