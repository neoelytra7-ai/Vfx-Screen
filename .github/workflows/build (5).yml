          package com.example.facelab

          import android.content.Context
          import android.graphics.Bitmap
          import java.io.*
          import java.nio.ByteBuffer
          import java.util.zip.CRC32

          /** Persistent cache on internal flash: analysis, depth maps, refined masks and evicted render stages survive between sessions. */
          object DiskCache {
              var dir: File? = null
              @Volatile var enabled = true
              @Volatile var maxBytes = 1_500_000_000L
              private const val AV = "analysis_v3.bin"

              fun init(ctx: Context) { dir = File(ctx.filesDir, "cache").also { it.mkdirs() } }

              /** Stable id of a photo: size plus a CRC of a 64x64 thumbnail, so re-opening the same picture finds its cache. */
              fun key(b: Bitmap): String {
                  val s = Bitmap.createScaledBitmap(b, 64, 64, true); val px = IntArray(4096); s.getPixels(px, 0, 64, 0, 0, 64, 64)
                  val bb = ByteBuffer.allocate(4096 * 4); for (p in px) bb.putInt(p)
                  val crc = CRC32(); crc.update(bb.array())
                  return "${b.width}x${b.height}_" + java.lang.Long.toHexString(crc.value)
              }

              private fun file(photo: String, name: String): File? {
                  if (!enabled || photo.isEmpty()) return null
                  val d = dir ?: return null
                  return File(File(d, photo).also { it.mkdirs() }, name)
              }
              private fun fb(a: FloatArray): ByteArray { val bb = ByteBuffer.allocate(a.size * 4); bb.asFloatBuffer().put(a); return bb.array() }
              private fun bf(b: ByteArray, n: Int): FloatArray { val a = FloatArray(n); ByteBuffer.wrap(b).asFloatBuffer().get(a); return a }

              fun saveMask(photo: String, name: String, m: FloatArray, w: Int) {
                  val f = file(photo, "m_${name}_$w.bin") ?: return
                  try { f.writeBytes(ByteArray(m.size) { (m[it].coerceIn(0f, 1f) * 255f + 0.5f).toInt().toByte() }) } catch (_: Throwable) {}
              }
              fun loadMask(photo: String, name: String, w: Int, n: Int): FloatArray? {
                  val f = file(photo, "m_${name}_$w.bin") ?: return null
                  if (!f.exists() || f.length() != n.toLong()) return null
                  return try { val b = f.readBytes(); f.setLastModified(System.currentTimeMillis()); FloatArray(n) { (b[it].toInt() and 255) / 255f } } catch (_: Throwable) { null }
              }

              fun saveDepth(photo: String, tag: String, d: DepthData) {
                  val f = file(photo, "d_$tag.bin") ?: return
                  try { DataOutputStream(BufferedOutputStream(FileOutputStream(f), 1 shl 16)).use { it.writeInt(d.w); it.writeInt(d.h); it.write(fb(d.d)) } } catch (_: Throwable) {}
              }
              fun loadDepth(photo: String, tag: String): DepthData? {
                  val f = file(photo, "d_$tag.bin") ?: return null
                  if (!f.exists()) return null
                  return try { DataInputStream(BufferedInputStream(FileInputStream(f), 1 shl 16)).use { i -> val w = i.readInt(); val h = i.readInt(); val b = ByteArray(w * h * 4); i.readFully(b)
                      f.setLastModified(System.currentTimeMillis()); DepthData(bf(b, w * h), w, h).also { it.tag = tag } } } catch (_: Throwable) { null }
              }

              fun saveAnalysis(photo: String, a: Analysis) {
                  val f = file(photo, AV) ?: return
                  try { DataOutputStream(BufferedOutputStream(FileOutputStream(f), 1 shl 20)).use { o ->
                      o.writeInt(a.w); o.writeInt(a.h); o.writeInt(a.faces.size)
                      for (fc in a.faces) { o.writeInt(fc.size); o.write(fb(fc)) }
                      val p = a.pose; o.writeInt(p?.size ?: -1); if (p != null) o.write(fb(p))
                      o.writeInt(a.maps.size); for ((id, b) in a.maps) { o.writeInt(id); o.writeInt(b.size); o.write(b) } } } catch (_: Throwable) { f.delete() }
              }
              fun loadAnalysis(photo: String): Analysis? {
                  val f = file(photo, AV) ?: return null
                  if (!f.exists()) return null
                  return try { DataInputStream(BufferedInputStream(FileInputStream(f), 1 shl 20)).use { i ->
                      val w = i.readInt(); val h = i.readInt(); val nf = i.readInt()
                      val faces = ArrayList<FloatArray>(); for (k in 0 until nf) { val n = i.readInt(); val b = ByteArray(n * 4); i.readFully(b); faces.add(bf(b, n)) }
                      val pn = i.readInt(); val pose = if (pn >= 0) { val b = ByteArray(pn * 4); i.readFully(b); bf(b, pn) } else null
                      val nm = i.readInt(); val maps = HashMap<Int, ByteArray>(); for (k in 0 until nm) { val id = i.readInt(); val sz = i.readInt(); val b = ByteArray(sz); i.readFully(b); maps[id] = b }
                      f.setLastModified(System.currentTimeMillis()); Analysis(w, h, faces, pose, maps) } } catch (_: Throwable) { null }
              }

              fun saveStage(photo: String, key: String, px: IntArray) {
                  val f = file(photo, "s_$key.bin") ?: return
                  try { val bb = ByteBuffer.allocate(px.size * 4); bb.asIntBuffer().put(px); FileOutputStream(f).use { it.write(bb.array()) } } catch (_: Throwable) { f.delete() }
              }
              fun loadStage(photo: String, key: String, n: Int): IntArray? {
                  val f = file(photo, "s_$key.bin") ?: return null
                  if (!f.exists() || f.length() != n * 4L) return null
                  return try { val b = f.readBytes(); val a = IntArray(n); ByteBuffer.wrap(b).asIntBuffer().get(a); f.setLastModified(System.currentTimeMillis()); a } catch (_: Throwable) { null }
              }

              fun size(): Long = dir?.walkTopDown()?.filter { it.isFile }?.sumOf { it.length() } ?: 0L
              fun clear() { dir?.listFiles()?.forEach { it.deleteRecursively() } }
              /** Deletes the least recently used files until the cache fits the limit. */
              fun trim() {
                  val d = dir ?: return
                  var total = 0L; val files = d.walkTopDown().filter { it.isFile }.toList(); for (f in files) total += f.length()
                  if (total <= maxBytes) return
                  for (f in files.sortedBy { it.lastModified() }) { total -= f.length(); f.delete(); if (total <= maxBytes * 0.8) break }
              }
          }

          /** RAM cache of intermediate renders (one entry per pipeline stage and settings combination). Entries evicted from RAM spill to flash, so jumping back in the history is instant. */
          class StageCache {
              @Volatile var photo = ""
              private val ram = LinkedHashMap<String, IntArray>(16, 0.75f, true)
              private var bytes = 0L
              private val limit = 160L * 1024 * 1024

              @Synchronized fun get(k: String, n: Int): IntArray? {
                  ram[k]?.let { return it }
                  val d = DiskCache.loadStage(photo, k, n) ?: return null
                  putRam(k, d); return d
              }
              @Synchronized fun put(k: String, px: IntArray) { putRam(k, px.copyOf()) }
              private fun putRam(k: String, a: IntArray) {
                  ram[k]?.let { bytes -= it.size * 4L }; ram[k] = a; bytes += a.size * 4L
                  while (bytes > limit && ram.size > 1) {
                      val e = ram.entries.iterator().next(); val key = e.key; val old = e.value
                      DiskCache.saveStage(photo, key, old); bytes -= old.size * 4L; ram.remove(key)
                  }
              }
              @Synchronized fun clear() { ram.clear(); bytes = 0 }
          }

          class BakeOpt(val sc: StageCache? = null, val qual: Float = 1f, val prof: StringBuilder? = null, val onStage: (String) -> Unit = {})
          EOF
