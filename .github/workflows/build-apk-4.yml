name: Build HtmlWall APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
env:
  VC: ${{ github.run_number }}
  KS: ${{ github.workspace }}/.ks/app.keystore
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}

      - name: Keystore (generate once, persist in repo)
        run: |
          mkdir -p .ks
          if [ ! -f .ks/app.keystore ]; then
            keytool -genkeypair -keystore .ks/app.keystore -storepass htmlwp123 -keypass htmlwp123 \
              -alias k -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=HtmlWall,O=HW,C=ID"
            git config user.name bot && git config user.email bot@users.noreply.github.com
            git add .ks && git commit -qm "add keystore" && git push
          fi

      - name: Generate project
        run: |
          rm -rf hw && mkdir hw && cd hw
          P=app/src/main
          mkdir -p $P/java/com/htmlwp/app $P/res/xml $P/res/values $P/res/drawable $P/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HtmlWall"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.7.3" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          val vc = (System.getenv("VC") ?: "1").toInt()
          android {
            namespace = "com.htmlwp.app"
            compileSdk = 34
            defaultConfig { applicationId = "com.htmlwp.app"; minSdk = 26; targetSdk = 34; versionCode = vc; versionName = "1.$vc" }
            signingConfigs { create("r") { storeFile = file(System.getenv("KS") ?: "x"); storePassword = "htmlwp123"; keyAlias = "k"; keyPassword = "htmlwp123" } }
            buildTypes { release { signingConfig = signingConfigs.getByName("r") } }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
            lint { checkReleaseBuilds = false; abortOnError = false }
          }
          dependencies { implementation("androidx.webkit:webkit:1.12.1") }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.software.live_wallpaper" android:required="true"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:hardwareAccelerated="true" android:label="@string/app_name" android:icon="@drawable/ic" android:usesCleartextTraffic="true">
              <activity android:name=".Main" android:exported="true" android:theme="@android:style/Theme.Material.NoActionBar">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".WP" android:exported="true" android:permission="android.permission.BIND_WALLPAPER">
                <intent-filter><action android:name="android.service.wallpaper.WallpaperService"/></intent-filter>
                <meta-data android:name="android.service.wallpaper" android:resource="@xml/wp"/>
              </service>
            </application>
          </manifest>
          EOF

          echo '<wallpaper xmlns:android="http://schemas.android.com/apk/res/android" android:description="@string/app_name" android:settingsActivity="com.htmlwp.app.Main"/>' > $P/res/xml/wp.xml
          echo '<resources><string name="app_name">HtmlWall</string></resources>' > $P/res/values/strings.xml

          cat > $P/res/drawable/ic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#5B7CFF" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M34,36l-8,18l8,18h8l-8,-18l8,-18zM74,36l8,18l-8,18h-8l8,-18l-8,-18z"/>
          </vector>
          EOF

          cat > $P/assets/default.html <<'EOF'
          <!doctype html><meta name=viewport content="width=device-width,initial-scale=1">
          <style>html,body{margin:0;height:100%;overflow:hidden;background:#05060f}canvas{display:block;width:100%;height:100%}</style>
          <canvas id=c></canvas><script>
          const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),tx=0,ty=0,sx=0,sy=0,sc=.5,R=[];
          function rs(){W=c.width=innerWidth*D;H=c.height=innerHeight*D}addEventListener('resize',rs);rs();
          addEventListener('wptilt',e=>{tx=e.detail.x;ty=e.detail.y});
          addEventListener('wpscroll',e=>sc=e.detail.x);
          addEventListener('pointerdown',e=>R.push({x:e.clientX*D,y:e.clientY*D,t:0}));
          const S=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),z:Math.random()*.9+.1}));
          const B=[[260,.2,.9],[170,.5,.8],[300,.8,1.1],[330,.35,1.3]];
          function f(t){t/=1000;sx+=(tx-sx)*.06;sy+=(ty-sy)*.06;
          x.globalCompositeOperation='source-over';
          let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05060f');g.addColorStop(1,'#0b1226');x.fillStyle=g;x.fillRect(0,0,W,H);
          x.globalCompositeOperation='lighter';
          B.forEach((b,i)=>{const px=(b[1]+Math.sin(t*.15*b[2]+i)*.25+(sc-.5)*.2+sx*.05)*W,py=(.3+i*.17+Math.cos(t*.12*b[2]+i*2)*.12+sy*.04)*H,r=Math.max(W,H)*.45;
           const q=x.createRadialGradient(px,py,0,px,py,r);q.addColorStop(0,`hsla(${b[0]+Math.sin(t*.1)*30},90%,60%,.35)`);q.addColorStop(1,'hsla(0,0%,0%,0)');x.fillStyle=q;x.fillRect(0,0,W,H)});
          S.forEach(s=>{const px=((s.x+sx*.04*s.z)%1+1)%1*W,py=((s.y-t*.004*s.z+sy*.03*s.z)%1+1)%1*H;x.fillStyle=`rgba(255,255,255,${.25+.5*Math.abs(Math.sin(t*s.z*2+s.x*9))})`;x.beginPath();x.arc(px,py,s.z*1.8*D,0,7);x.fill()});
          R=R.filter(r=>(r.t+=.02)<1);R.forEach(r=>{x.strokeStyle=`rgba(160,200,255,${1-r.t})`;x.lineWidth=2*D;x.beginPath();x.arc(r.x,r.y,r.t*180*D,0,7);x.stroke()});
          requestAnimationFrame(f)}requestAnimationFrame(f)
          </script>
          EOF

          cat > $P/java/com/htmlwp/app/WP.kt <<'EOF'
          package com.htmlwp.app
          import android.app.Presentation
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Canvas
          import android.graphics.Color
          import android.hardware.*
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.net.Uri
          import android.service.wallpaper.WallpaperService
          import android.view.*
          import android.webkit.*
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewAssetLoader.InternalStoragePathHandler
          import java.io.File
          import kotlin.math.*

          fun ensure(c: Context) {
            val d = File(c.filesDir, "wp")
            if (d.list().isNullOrEmpty()) {
              d.mkdirs()
              c.assets.open("default.html").use { i -> File(d, "index.html").outputStream().use { i.copyTo(it) } }
              c.getSharedPreferences("p", 0).edit().putString("entry", "index.html").apply()
            }
          }

          class WV(c: Context) : WebView(c) {
            var soft = false; var on = false
            fun att() { if (!on) { on = true; try { onAttachedToWindow(); onWindowFocusChanged(true) } catch (e: Exception) {} } }
            fun vis(v: Boolean) { try { onWindowVisibilityChanged(if (v) View.VISIBLE else View.GONE) } catch (e: Exception) {} }
            fun det() { if (on) { on = false; try { onDetachedFromWindow() } catch (e: Exception) {} } }
            override fun isShown() = if (soft) true else super.isShown()
          }

          class WP : WallpaperService() {
            override fun onCreateEngine(): Engine = E()

            inner class E : Engine(), SensorEventListener, SharedPreferences.OnSharedPreferenceChangeListener {
              val sp = getSharedPreferences("p", 0)
              val ch = Choreographer.getInstance()
              val sm = getSystemService(SENSOR_SERVICE) as SensorManager
              var wv: WV? = null; var vd: VirtualDisplay? = null; var pr: Presentation? = null
              var vis = false; var gpu = true; var last = 0L; var fps = 60; var sw = 0; var sh = 0
              var gx = 0f; var gy = 0f; var gz = 0f; var lb = 999.0; var lg = 999.0
              val cb = object : Choreographer.FrameCallback {
                override fun doFrame(t: Long) {
                  if (!vis) return
                  if (t - last >= 1_000_000_000L / fps - 3_000_000L) { last = t; tick() }
                  ch.postFrameCallback(this)
                }
              }

              fun rd() { fps = sp.getInt("fps", 60) }
              fun js(s: String) { wv?.evaluateJavascript(s, null) }

              fun load() {
                val v = wv ?: return
                val u = sp.getString("url", "") ?: ""
                v.loadUrl(if (u.isNotEmpty()) u else "https://appassets.androidplatform.net/wp/" + Uri.encode(sp.getString("entry", "index.html"), "/"))
              }

              fun mk(c: Context): WV {
                val v = WV(c)
                v.setBackgroundColor(Color.BLACK)
                v.isVerticalScrollBarEnabled = false; v.isHorizontalScrollBarEnabled = false; v.overScrollMode = View.OVER_SCROLL_NEVER
                val a = WebViewAssetLoader.Builder().addPathHandler("/wp/", InternalStoragePathHandler(applicationContext, File(filesDir, "wp"))).build()
                v.webViewClient = object : WebViewClient() {
                  override fun shouldInterceptRequest(w: WebView, r: WebResourceRequest): WebResourceResponse? = a.shouldInterceptRequest(r.url)
                  override fun onPageFinished(w: WebView, u: String) { w.evaluateJavascript("document.documentElement.style.overflow='hidden'", null) }
                }
                v.webChromeClient = WebChromeClient()
                v.settings.apply {
                  javaScriptEnabled = true; domStorageEnabled = true; mediaPlaybackRequiresUserGesture = false
                  mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW; allowFileAccess = false; allowContentAccess = false
                }
                return v
              }

              fun stop() {
                try { pr?.dismiss() } catch (e: Exception) {}; pr = null
                try { vd?.release() } catch (e: Exception) {}; vd = null
                wv?.let { it.det(); try { it.destroy() } catch (e: Exception) {} }; wv = null
              }

              // GPU: WebView hidup di window asli (Presentation) pada VirtualDisplay yang menulis ke surface wallpaper
              // Software: WebView di-draw manual ke canvas (fallback, tanpa WebGL)
              fun start() {
                stop(); if (sw <= 0) return
                gpu = sp.getBoolean("gpu", true)
                if (gpu) try {
                  val d = (getSystemService(DISPLAY_SERVICE) as DisplayManager)
                    .createVirtualDisplay("hw", sw, sh, resources.displayMetrics.densityDpi, surfaceHolder.surface, 0)
                  vd = d
                  val p = Presentation(this@WP, d.display, android.R.style.Theme_Material_NoActionBar_Fullscreen)
                  val v = mk(p.context); wv = v
                  p.setContentView(v)
                  p.window?.apply { setLayout(-1, -1); clearFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND) }
                  p.show(); pr = p
                } catch (e: Throwable) { stop(); gpu = false }
                if (!gpu) {
                  val v = mk(applicationContext); v.soft = true; wv = v
                  v.measure(View.MeasureSpec.makeMeasureSpec(sw, View.MeasureSpec.EXACTLY), View.MeasureSpec.makeMeasureSpec(sh, View.MeasureSpec.EXACTLY))
                  v.layout(0, 0, sw, sh); v.att()
                }
                load(); vs()
              }

              fun vs() {
                val v = wv ?: return
                if (vis) { v.onResume(); v.resumeTimers(); if (gpu) vd?.surface = surfaceHolder.surface else v.vis(true) }
                else { if (gpu) vd?.surface = null else v.vis(false); v.onPause(); v.pauseTimers() }
              }

              fun sens() {
                sm.unregisterListener(this)
                if (vis && sp.getBoolean("tilt", true))
                  (sm.getDefaultSensor(Sensor.TYPE_GRAVITY) ?: sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER))?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
              }

              override fun onCreate(h: SurfaceHolder) {
                super.onCreate(h); setTouchEventsEnabled(true); ensure(this@WP); rd()
                WebView.setWebContentsDebuggingEnabled(true)
                sp.registerOnSharedPreferenceChangeListener(this)
              }

              override fun onSurfaceChanged(h: SurfaceHolder, f: Int, w: Int, ht: Int) {
                super.onSurfaceChanged(h, f, w, ht)
                if (w == sw && ht == sh && wv != null) return
                sw = w; sh = ht; start()
              }

              override fun onSurfaceDestroyed(h: SurfaceHolder) { stop(); sw = 0; super.onSurfaceDestroyed(h) }

              override fun onVisibilityChanged(v: Boolean) {
                vis = v; ch.removeFrameCallback(cb)
                if (v) ch.postFrameCallback(cb)
                vs(); sens()
              }

              fun tick() {
                if (sp.getBoolean("tilt", true)) {
                  val nx = (-gx / 9.81f).coerceIn(-1f, 1f); val ny = ((gz / 9.81f - .5f) * 2).coerceIn(-1f, 1f)
                  val b = Math.round(Math.toDegrees(atan2(gy, gz).toDouble()) * 10) / 10.0
                  val g = Math.round(Math.toDegrees(asin(nx).toDouble()) * 10) / 10.0
                  if (abs(b - lb) > .3 || abs(g - lg) > .3) {
                    lb = b; lg = g
                    js("(function(){window.wpTilt={x:$nx,y:$ny};dispatchEvent(new DeviceOrientationEvent('deviceorientation',{alpha:0,beta:$b,gamma:$g}));dispatchEvent(new CustomEvent('wptilt',{detail:{x:$nx,y:$ny}}))})()")
                  }
                }
                if (!gpu) draw()
              }

              fun draw() {
                val v = wv ?: return
                val s = surfaceHolder; var c: Canvas? = null
                try { c = s.lockCanvas(); if (c != null) v.draw(c) }
                catch (e: Exception) {}
                finally { try { c?.let { s.unlockCanvasAndPost(it) } } catch (e: Exception) {} }
              }

              override fun onTouchEvent(e: MotionEvent) { wv?.dispatchTouchEvent(e); super.onTouchEvent(e) }

              override fun onOffsetsChanged(x: Float, y: Float, xs: Float, ys: Float, xp: Int, yp: Int) {
                js("window.wpScroll={x:$x,y:$y};dispatchEvent(new CustomEvent('wpscroll',{detail:{x:$x,y:$y}}))")
              }

              override fun onSensorChanged(e: SensorEvent) { gx = e.values[0]; gy = e.values[1]; gz = e.values[2] }
              override fun onAccuracyChanged(s: Sensor?, a: Int) {}
              override fun onSharedPreferenceChanged(s: SharedPreferences, k: String?) {
                rd(); if (k == "rev") load(); if (k == "tilt") sens(); if (k == "gpu") start()
              }

              override fun onDestroy() {
                vis = false; ch.removeFrameCallback(cb); sm.unregisterListener(this)
                sp.unregisterOnSharedPreferenceChangeListener(this)
                stop(); super.onDestroy()
              }
            }
          }
          EOF

          cat > $P/java/com/htmlwp/app/Main.kt <<'EOF'
          package com.htmlwp.app
          import android.app.Activity
          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Intent
          import android.content.SharedPreferences
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import java.io.*
          import java.util.zip.ZipInputStream

          class Main : Activity() {
            lateinit var sp: SharedPreferences
            fun rev() = sp.getInt("rev", 0) + 1
            fun btn(t: String, f: () -> Unit) = Button(this).apply { text = t; setOnClickListener { f() } }
            fun sw(t: String, k: String, d: Boolean) = Switch(this).apply {
              text = t; isChecked = sp.getBoolean(k, d); setOnCheckedChangeListener { _, c -> sp.edit().putBoolean(k, c).apply() }
            }

            override fun onCreate(b: Bundle?) {
              super.onCreate(b); sp = getSharedPreferences("p", 0); ensure(this)
              val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
              val u = EditText(this).apply { hint = "https://... (opsional)"; setSingleLine(); setText(sp.getString("url", "")) }
              val fb = Button(this)
              fun lab() { fb.text = "FPS: " + sp.getInt("fps", 60) }
              lab()
              fb.setOnClickListener { sp.edit().putInt("fps", when (sp.getInt("fps", 60)) { 30 -> 45; 45 -> 60; else -> 30 }).apply(); lab() }
              l.addView(TextView(this).apply { text = "HtmlWall"; textSize = 26f })
              l.addView(btn("Pilih file .html / .zip") {
                startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).setType("*/*").addCategory(Intent.CATEGORY_OPENABLE), 1)
              })
              l.addView(u)
              l.addView(btn("Pakai URL") { sp.edit().putString("url", u.text.toString().trim()).putInt("rev", rev()).apply() })
              l.addView(btn("Reset ke demo") {
                File(filesDir, "wp").deleteRecursively(); ensure(this); u.setText("")
                sp.edit().putString("entry", "index.html").putString("url", "").putInt("rev", rev()).apply()
              })
              l.addView(fb)
              l.addView(sw("Tilt / gyro parallax", "tilt", true))
              l.addView(sw("Mode GPU (WebGL, disarankan)", "gpu", true))
              l.addView(btn("Set sebagai Wallpaper") {
                try {
                  startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER)
                    .putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, ComponentName(this, WP::class.java)))
                } catch (e: Exception) { startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER)) }
              })
              setContentView(ScrollView(this).apply { addView(l) })
            }

            override fun onActivityResult(r: Int, c: Int, d: Intent?) { if (r == 1 && c == RESULT_OK) d?.data?.let { imp(it) } }

            fun imp(u: Uri) = Thread {
              val m = try {
                val d = File(filesDir, "wp"); d.deleteRecursively(); d.mkdirs()
                val b = BufferedInputStream(contentResolver.openInputStream(u)!!)
                b.mark(4); val h = ByteArray(2); b.read(h); b.reset()
                var e = "index.html"
                if (h[0] == 'P'.code.toByte() && h[1] == 'K'.code.toByte()) ZipInputStream(b).use { z ->
                  var first: String? = null
                  while (true) {
                    val en = z.nextEntry ?: break
                    val f = File(d, en.name)
                    if (!f.canonicalPath.startsWith(d.canonicalPath + "/")) continue
                    if (en.isDirectory) f.mkdirs() else {
                      f.parentFile?.mkdirs(); f.outputStream().use { z.copyTo(it) }
                      if (first == null && en.name.endsWith(".html", true)) first = en.name
                    }
                  }
                  e = if (File(d, "index.html").exists()) "index.html" else first ?: "index.html"
                } else b.use { i -> File(d, "index.html").outputStream().use { i.copyTo(it) } }
                sp.edit().putString("entry", e).putString("url", "").putInt("rev", rev()).apply()
                "OK: $e"
              } catch (x: Exception) { "Gagal: " + x.message }
              runOnUiThread { Toast.makeText(this, m, Toast.LENGTH_LONG).show() }
            }.start()
          }
          EOF

      - name: Build
        working-directory: hw
        run: gradle :app:assembleRelease --no-daemon -q

      - uses: actions/upload-artifact@v4
        with:
          name: HtmlWall-${{ github.run_number }}
          path: hw/app/build/outputs/apk/release/*.apk
