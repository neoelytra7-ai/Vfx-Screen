                  val fb = Button(this)
                  fb.text = "\u2708"; fb.setOnClickListener { r.fly = !r.fly; fb.alpha = if (r.fly) 1f else .6f }
                  fb.alpha = .6f
                  root.addView(fb, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).also { it.setMargins(0, 252, 8, 0) })
