name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KS_PASS || 'infinitepath' }}
      KS_ALIAS: ${{ secrets.KS_ALIAS || 'key' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate native Android project (heredoc)
        run: |
          set -e
          P=android/app/src/main
          mkdir -p $P/java/com/infinitepath/app $P/res/xml $P/res/values $P/res/drawable $P/res/mipmap-anydpi android/app

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "InfinitePath"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          val verCode = (project.findProperty("verCode") as String?)?.toIntOrNull() ?: 1
          val ghRepo = (project.findProperty("ghRepo") as String?) ?: "owner/repo"
          android {
              namespace = "com.infinitepath.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.infinitepath.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = verCode
                  versionName = "1.0.$verCode"
                  buildConfigField("String", "GH_REPO", "\"$ghRepo\"")
              }
              buildFeatures { buildConfig = true }
              signingConfigs {
                  create("rel") {
                      storeFile = file(System.getenv("KS_FILE") ?: "../../ci.jks")
                      storePassword = System.getenv("KS_PASS") ?: "infinitepath"
                      keyAlias = System.getenv("KS_ALIAS") ?: "key"
                      keyPassword = System.getenv("KS_PASS") ?: "infinitepath"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("rel")
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:label="Infinite Path"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fp"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > $P/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="dl" path="Download/" />
          </paths>
          EOF

          cat > $P/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat > $P/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#1B2A49</color>
          </resources>
          EOF

          cat > $P/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFD54A"
                  android:pathData="M54,30m-10,0a10,10 0,1 1,20 0a10,10 0,1 1,-20 0" />
              <path android:fillColor="#2E9E72"
                  android:pathData="M22,78L44,46L58,64L68,52L86,78Z" />
          </vector>
          EOF

          cat > $P/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > $P/java/com/infinitepath/app/World.kt <<'EOF'
          package com.infinitepath.app

          import kotlin.math.ceil
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sqrt

          /**
           * Fasad dunia untuk Cinematic (Planner/CamRig) dan fisika: tinggi tanah & jarak bebas.
           * gen != null => chunk voxel dibuat sesuai kebutuhan (khusus thread planner, World ini disinkronkan).
           * gen == null => hanya memakai voxel yang sudah dikirim worker ke Core utama (thread GL).
           */
          class World(val core: Core, private val gen: Gen?) {
              val sea: Int get() = core.S.sea.toInt()

              private fun chunkVox(cx: Int, cz: Int): ByteArray? {
                  var v = core.VOX[core.ck(cx, cz)]
                  if (v == null && gen != null) {
                      if (core.VOX.size > 360) core.clearVox()
                      gen.voxGen(cx, cz)
                      v = core.VOX[core.ck(cx, cz)]
                  }
                  return v
              }

              @Synchronized
              fun hg(x: Float, z: Float): Float = core.hfn(floor(x).toInt(), floor(z).toInt()) + 1f

              /** jarak bebas ke permukaan terdekat (di luar radius r); o = arah dorong keluar */
              @Synchronized
              fun clr(x: Float, y: Float, z: Float, r: Float, o: FloatArray): Float {
                  var top = -1e9f
                  val x0 = floor(x - r * .5f).toInt(); val x1 = floor(x + r * .5f).toInt()
                  val z0 = floor(z - r * .5f).toInt(); val z1 = floor(z + r * .5f).toInt()
                  for (a in x0..x1) for (b in z0..z1) {
                      val rec = core.colRec(a, b)
                      val g = (rec and 63) + 1f; val ws = (rec ushr 10) / 64f
                      top = max(top, max(g, ws))
                  }
                  var best = y - top - r
                  o[0] = 0f; o[1] = 1f; o[2] = 0f
                  if (y - r - 3f > Core.H) return best
                  val R = ceil(r + 1.2f).toInt()
                  val ix = floor(x).toInt(); val iy = floor(y).toInt(); val iz = floor(z).toInt()
                  for (a in ix - R..ix + R) for (b in iz - R..iz + R) {
                      val gh = (core.colRec(a, b) and 63) + 1
                      val ya = max(gh, iy - R); val yb = min(Core.H - 1, iy + R)
                      if (ya > yb) continue
                      val v = chunkVox(a shr 4, b shr 4) ?: continue
                      val base = (a and 15) + 16 * (b and 15)
                      for (yy in ya..yb) {
                          if (v[base + 256 * yy].toInt() == 0) continue
                          val qx = x.coerceIn(a.toFloat(), a + 1f); val qy = y.coerceIn(yy.toFloat(), yy + 1f); val qz = z.coerceIn(b.toFloat(), b + 1f)
                          var dx = x - qx; var dy = y - qy; var dz = z - qz
                          var l = sqrt(dx * dx + dy * dy + dz * dz)
                          val d = l - r
                          if (d < best) {
                              best = d
                              if (l < 1e-4f) { dx = 0f; dy = 1f; dz = 0f; l = 1f }
                              o[0] = dx / l; o[1] = dy / l; o[2] = dz / l
                          }
                      }
                  }
                  return best
              }
          }
          EOF

          cat > $P/java/com/infinitepath/app/Cinematic.kt <<'EOF'
          package com.infinitepath.app

          import java.util.Random
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.atan
          import kotlin.math.atan2
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.exp
          import kotlin.math.floor
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.tan

          fun lp(a: Float, b: Float, t: Float) = a + (b - a) * t
          fun ss(a: Float, b: Float, x: Float): Float { val t = ((x - a) / (b - a)).coerceIn(0f, 1f); return t * t * (3f - 2f * t) }

          fun crp(P: List<FloatArray>, s: Float, o: FloatArray) {
              val n = P.size - 1
              val f = s.coerceIn(0f, 1f) * n
              val i = min(n - 1, floor(f).toInt())
              val t = f - i
              val p0 = P[max(0, i - 1)]; val p1 = P[i]; val p2 = P[i + 1]; val p3 = P[min(n, i + 2)]
              val t2 = t * t; val t3 = t2 * t
              for (j in 0..2) o[j] = .5f * (2f * p1[j] + (-p0[j] + p2[j]) * t + (2f * p0[j] - 5f * p1[j] + 4f * p2[j] - p3[j]) * t2 + (-p0[j] + 3f * p1[j] - 3f * p2[j] + p3[j]) * t3)
          }

          class Path(val P: List<FloatArray>) {
              private val M = max(8, (P.size - 1) * 24)
              private val pos = Array(M + 1) { FloatArray(3) }
              private val cum = FloatArray(M + 1)
              val len: Float

              init {
                  val o = FloatArray(3)
                  for (i in 0..M) {
                      crp(P, i / M.toFloat(), o)
                      System.arraycopy(o, 0, pos[i], 0, 3)
                      if (i > 0) cum[i] = cum[i - 1] + hypot(hypot(o[0] - pos[i - 1][0], o[1] - pos[i - 1][1]), o[2] - pos[i - 1][2])
                  }
                  len = max(cum[M], 1e-3f)
              }

              fun at(s: Float, out: FloatArray) {
                  val L = s.coerceIn(0f, 1f) * len
                  var a = 0; var b = M
                  while (b - a > 1) { val m = (a + b) shr 1; if (cum[m] <= L) a = m else b = m }
                  val f = (L - cum[a]) / max(1e-6f, cum[b] - cum[a])
                  for (j in 0..2) out[j] = pos[a][j] + (pos[b][j] - pos[a][j]) * f
              }
          }

          class Ev(val k: Int, val t: Float, val w: Float, val a: Float = 0f, val ox: Float = 0f, val oy: Float = 0f, val oz: Float = 0f, val f: Float = 0f, val s: Float = 0f)

          class Shot(
              val path: Path, val T: List<FloatArray>, val sp: FloatArray, val fov: Float, val dur: Float, val ease: Int,
              val bank: Float, val shake: Float, val camR: Float, val dolly: Float, val z0: Float, val z1: Float,
              val dtc: Float, val ev: List<Ev>, val tag: String, val name: String, val ax: Float, val az: Float,
              val ptsX: FloatArray, val ptsZ: FloatArray
          )

          class Pose { var x = 0f; var y = 0f; var z = 0f; var yaw = 0f; var pit = 0f; var roll = 0f; var fov = 1f }

          class Planner(private val w: World) {
              private val co = FloatArray(3)
              private val names1 = arrayOf("Hutan", "Lembah", "Punggung", "Pesisir", "Kabut", "Fajar", "Senja", "Sungai", "Padang", "Bukit")
              private val names2 = arrayOf("Sunyi", "Emas", "Biru", "Purba", "Lengang", "Hijau", "Perak", "Jauh")
              private val rigNames = arrayOf("ORBIT", "HELIX", "SERPENTINE", "FPV", "ARC DOLLY", "ROCKET", "TOP-DOWN SPIRAL", "VERTIGO", "RIDGE-REVEAL")
              private val hist = ArrayList<Int>()

              private fun smH(x: Float, z: Float): Float {
                  var s = 0f
                  for (a in -2..2) for (b in -2..2) s += w.hg(x + a * 6f, z + b * 6f)
                  return s / 25f
              }

              private fun base(x: Float, z: Float) = max(smH(x, z), w.sea + 1f)

              private fun mkA(n: Int, f: (Float) -> FloatArray): MutableList<FloatArray> {
                  val l = ArrayList<FloatArray>()
                  for (i in 0 until n) l.add(f(i / (n - 1).toFloat()))
                  return l
              }

              private fun relax(P: List<FloatArray>, r: Float, mg: Float, it: Int) {
                  fun push(p: FloatArray, m: Float) {
                      val d = w.clr(p[0], p[1], p[2], r, co)
                      if (d < m) { val f = (m - d) * .75f; p[0] += co[0] * f; p[1] += co[1] * f; p[2] += co[2] * f }
                  }
                  val n = P.size
                  for (k in 0 until it) {
                      for (i in 0 until n) push(P[i], mg)
                      if (k < it - 1) for (i in 1 until n - 1) {
                          val p = P[i]; val a = P[i - 1]; val b = P[i + 1]
                          for (j in 0..2) p[j] += ((a[j] + b[j]) * .5f - p[j]) * .3f
                      }
                  }
                  for (k in 0 until 4) for (i in 0 until n) push(P[i], mg * .6f)
              }

              private fun pathMin(pa: Path, r: Float): Float {
                  var m = 1e9f
                  val n = max(40, ceil(pa.len / 1.8f).toInt())
                  val o = FloatArray(3)
                  for (i in 0..n) { pa.at(i / n.toFloat(), o); val d = w.clr(o[0], o[1], o[2], r, co); if (d < m) m = d }
                  return m
              }

              fun make(i: Int, seed: Int, prevX: Float, prevZ: Float): Shot {
                  val r = Random((i * 7919L + seed * 131L + 17L))
                  fun rf() = r.nextFloat()
                  // pilih rig, hindari pengulangan
                  var ri: Int
                  do { ri = r.nextInt(rigNames.size) } while (hist.contains(ri))
                  hist.add(ri); if (hist.size > 3) hist.removeAt(0)
                  val ang = rf() * 6.283f; val ds = 140f + rf() * 220f
                  val bx = prevX + cos(ang) * ds; val bz = prevZ + sin(ang) * ds
                  var best = -1e9f; var X = bx; var Z = bz
                  for (k in 0 until 14) {
                      val x = bx + (rf() - .5f) * 160f; val z = bz + (rf() - .5f) * 160f; val h = w.hg(x, z)
                      val s = if (ri == 2 || ri == 3 || ri == 5 || ri == 8) abs(w.hg(x + 40, z) - w.hg(x - 40, z)) + abs(w.hg(x, z + 40) - w.hg(x, z - 40)) + h * .3f
                      else h - abs(w.hg(x + 25, z) - h) * 2f
                      if (s > best) { best = s; X = x; Z = z }
                  }
                  val hd = rf() * 6.283f; val fx = cos(hd); val fz = sin(hd); val qx = -fz; val qz = fx
                  val h0 = w.hg(X, Z); val ph = rf() * 6.283f
                  var P: MutableList<FloatArray> = ArrayList(); var T: MutableList<FloatArray> = ArrayList()
                  var fov = 1f; var bank = .5f; var shake = .4f; var camR = 1.15f; var dolly = 0f; var ease = -1; var dk = 1f
                  var sp = floatArrayOf(X, h0 + 4f, Z)
                  when (ri) {
                      0 -> { // ORBIT
                          val R0 = 26f + rf() * 40f; val R1 = R0 * (.55f + rf() * 1.1f); val t0 = rf() * 6.283f
                          val sw = (1.3f + rf() * 3.2f) * (if (rf() < .5f) 1f else -1f); val a0 = 5f + rf() * 16f; val a1 = a0 + (rf() - .35f) * 34f
                          val sj = 2f + rf() * 9f; val wb = 1f + rf() * 2f; sp = floatArrayOf(X, h0 + sj, Z)
                          P = mkA(16) { t -> val R = lp(R0, R1, t); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(a0, a1, t) + sin(t * 6.283f * wb) * 4f, z) }
                          T = mkA(5) { t -> floatArrayOf(X + sin(t * 3 + ph) * 3, sp[1] + cos(t * 2) * 2, Z + cos(t * 3) * 3) }
                          fov = .9f; bank = .55f; shake = .4f
                      }
                      1 -> { // HELIX
                          val up = rf() < .7f; val R0 = 14f + rf() * 20f; val R1 = R0 + 30f + rf() * 40f; val t0 = rf() * 6.283f
                          val sw = (2f + rf() * 3.4f) * (if (rf() < .5f) 1f else -1f); val a0 = 3f + rf() * 3f; val a1 = 45f + rf() * 60f
                          sp = floatArrayOf(X, h0 + 3f + rf() * 6f, Z)
                          P = mkA(20) { t -> val q = if (up) t else 1 - t; val R = lp(R0, R1, q); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(a0, a1, q * q * (3 - 2 * q)), z) }
                          T = mkA(4) { t -> floatArrayOf(X, sp[1] + t * 6f, Z) }
                          fov = .95f; bank = .35f; shake = .3f; ease = 3
                      }
                      2, 3 -> { // SERPENTINE / FPV
                          val fpv = ri == 3
                          val L = if (fpv) 220f + rf() * 110f else 130f + rf() * 120f
                          val A = if (fpv) 18f + rf() * 24f else 10f + rf() * 26f
                          val cy = if (fpv) 1.5f + rf() * 1.3f else .9f + rf() * .9f
                          val p0 = rf() * 6.283f; val a0 = if (fpv) 4f + rf() * 5f else 10f + rf() * 30f; val da = (rf() - .5f) * 20f
                          val pf = { t: Float ->
                              val d = t * L; val sw = sin(p0 + t * 6.283f * cy) * A * min(1f, t * 4f + .3f)
                              val x = X + fx * d + qx * sw; val z = Z + fz * d + qz * sw
                              floatArrayOf(x, base(x, z) + a0 + (if (fpv) sin(t * 9 + p0) * 2.5f else da * t), z)
                          }
                          P = mkA(if (fpv) 26 else 18, pf)
                          val la = if (fpv) .07f else .16f
                          T = mkA(if (fpv) 26 else 18) { t -> val q = pf(t + la); floatArrayOf(q[0], if (fpv) q[1] + 1.5f else q[1] - (q[1] - base(q[0], q[2])) * .55f, q[2]) }
                          fov = if (fpv) 1.5f + rf() * .25f else 1.05f; bank = if (fpv) 1.5f else .9f; shake = if (fpv) .7f else .45f
                          if (fpv) { dk = .68f; ease = 2 }
                          sp = floatArrayOf(X + fx * L * .5f, h0 + 4f, Z + fz * L * .5f)
                      }
                      4 -> { // ARC DOLLY (tele)
                          val R = 22f + rf() * 26f; val t0 = rf() * 6.283f; val sw = (.8f + rf() * .7f) * (if (rf() < .5f) 1f else -1f); val a0 = 3.5f + rf() * 7f
                          sp = floatArrayOf(X, h0 + 2f + rf() * 8f, Z)
                          P = mkA(8) { t -> val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + a0 + sin(t * 3) * 1.2f, z) }
                          T = mkA(4) { t -> floatArrayOf(X + sin(t * 2) * 1.5f, sp[1], Z + cos(t * 2) * 1.5f) }
                          fov = .32f + rf() * .2f; bank = .25f; shake = .55f
                      }
                      5 -> { // ROCKET
                          val R0 = 10f + rf() * 10f; val R1 = R0 + 14f + rf() * 20f; val t0 = rf() * 6.283f; val sw = (1.2f + rf() * 1.4f) * (if (rf() < .5f) 1f else -1f); val top = 80f + rf() * 40f
                          sp = floatArrayOf(X, h0 + 4f, Z)
                          P = mkA(14) { t -> val R = lp(R0, R1, t); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(2.5f, top, t * t * (3 - 2 * t)), z) }
                          T = mkA(4) { t -> floatArrayOf(X, sp[1] - t * 2, Z) }
                          fov = 1.1f; bank = .2f; shake = .25f; ease = 3
                      }
                      6 -> { // TOP-DOWN SPIRAL
                          val t0 = rf() * 6.283f; val sw = (2.5f + rf() * 2.6f) * (if (rf() < .5f) 1f else -1f); val R0 = 26f + rf() * 20f; val R1 = R0 + 30f + rf() * 30f
                          val a0 = 90f + rf() * 40f; val a1 = 26f + rf() * 14f; val hz = rf() * 6.283f
                          P = mkA(20) { t -> val R = lp(R0, R1, t); val a = t0 + sw * t; val x = X + cos(a) * R; val z = Z + sin(a) * R; floatArrayOf(x, base(x, z) + lp(a0, a1, t), z) }
                          T = mkA(5) { t -> val q = ss(.15f, 1f, t); floatArrayOf(X + cos(hz) * 120f * q, h0 + lp(0f, 24f, q), Z + sin(hz) * 120f * q) }
                          fov = 1f; bank = .3f; shake = .2f; ease = 3
                      }
                      7 -> { // VERTIGO (dolly zoom)
                          val d0 = 18f + rf() * 10f; val d1 = d0 * (2.3f + rf() * .9f); val inn = rf() < .5f; val a0 = 5f + rf() * 4f
                          val bl = (if (rf() < .5f) 1f else -1f) * (8f + rf() * 6f); val ds2 = if (inn) d1 else d0; val de = if (inn) d0 else d1; val f0 = .6f + rf() * .3f
                          sp = floatArrayOf(X, h0 + 6f + rf() * 8f, Z)
                          P = mkA(7) { t -> val d = lp(ds2, de, t); val x = X - fx * d + qx * sin(t * 3.1416f) * bl; val z = Z - fz * d + qz * sin(t * 3.1416f) * bl; floatArrayOf(x, base(x, z) + a0 + t * 3f, z) }
                          T = mkA(3) { floatArrayOf(sp[0], sp[1], sp[2]) }
                          fov = f0; bank = .15f; shake = .25f; dolly = tan(f0 / 2f) * (if (inn) d1 else d0); ease = 3
                      }
                      else -> { // RIDGE-REVEAL
                          val sg = if (rf() < .5f) 1f else -1f
                          val ax = X - fx * 20f; val az = Z - fz * 20f; val bx2 = X + fx * 70f; val bz2 = Z + fz * 70f
                          val lat = sg * (25f + rf() * 20f); val cx = (ax + bx2) / 2 + qx * lat; val cz = (az + bz2) / 2 + qz * lat; val h1 = 22f + rf() * 14f
                          fun bzr(a: Float, b: Float, d: Float, t: Float) = (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * d
                          P = mkA(14) { t -> val x = bzr(ax, cx, bx2, t); val z = bzr(az, cz, bz2, t); floatArrayOf(x, base(x, z) + lp(2.4f, h1, t * t * (3 - 2 * t)), z) }
                          T = mkA(6) { t -> val x = lp(ax + fx * 60f, bx2 + fx * 170f, t); val z = lp(az + fz * 60f, bz2 + fz * 170f, t); floatArrayOf(x, base(x, z) + lp(8f, -4f, t), z) }
                          fov = 1f; bank = .5f; shake = .35f; ease = 3
                          sp = floatArrayOf(bx2 + fx * 60f, h0, bz2 + fz * 60f)
                      }
                  }
                  // ---- validasi: relaksasi + swept-sphere; naikkan jalur kalau perlu ----
                  camR = 1.15f
                  var ok = false
                  var cp = P
                  for (att in 0 until 7) {
                      if (att > 0) cp = P.map { it.copyOf() }.toMutableList()
                      val lift = if (att >= 3) (att - 2) * 9f else 0f
                      if (lift > 0) for (p in cp) p[1] += lift
                      relax(cp, camR, camR * .8f + .9f, 10)
                      val pa = Path(cp)
                      if (pathMin(pa, camR) >= .12f) { P = cp as MutableList<FloatArray>; ok = true; break }
                  }
                  if (!ok) {
                      P = mkA(14) { t -> val a = ph + 4 * t; val x = X + cos(a) * 70f; val z = Z + sin(a) * 70f; floatArrayOf(x, base(x, z) + 55f, z) }
                      T = mkA(3) { floatArrayOf(X, h0 + 4f, Z) }
                      relax(P, camR, camR * .8f + .9f, 30); fov = .9f; dolly = 0f; sp = floatArrayOf(X, h0 + 4f, Z)
                  }
                  val pa = Path(P)
                  // ---- program lensa & event ----
                  val ev = ArrayList<Ev>(); val tag = StringBuilder(rigNames[ri])
                  var z0 = 1f; var z1 = 1f
                  if (dolly == 0f) {
                      when (r.nextInt(5)) {
                          0 -> { z0 = 1.1f + rf() * .1f; z1 = .72f + rf() * .1f; tag.append(" · PUSH-IN") }
                          1 -> { z0 = .78f + rf() * .1f; z1 = 1.15f + rf() * .1f; tag.append(" · PULL-OUT") }
                          2 -> { z0 = 1.25f; z1 = 1.25f; tag.append(" · WIDE") }
                          else -> {}
                      }
                  } else tag.append(" · DOLLY-ZOOM")
                  val nE = (rf() * 3f).toInt() + (if (ri == 3) 1 else 0)
                  for (k in 0 until nE) {
                      val t = .18f + rf() * .64f
                      when (r.nextInt(6)) {
                          0, 1 -> { ev.add(Ev(0, t, .035f + rf() * .03f, a = .7f + rf() * .5f)); tag.append(" · CRASH-ZOOM") }
                          2 -> { val a = (if (rf() < .5f) 1f else -1f) * (1.2f + rf() * 1.2f); val dd = 45f + rf() * 70f
                              ev.add(Ev(1, t, .05f + rf() * .03f, ox = cos(a + ph) * dd, oy = (rf() - .35f) * 20f, oz = sin(a + ph) * dd)); tag.append(" · WHIP-PAN") }
                          3 -> { ev.add(Ev(2, t, .03f + rf() * .03f, a = .03f + rf() * .05f, f = 25f + rf() * 20f, s = rf() * 6.28f)); tag.append(" · JOLT") }
                          4 -> { ev.add(Ev(3, t, .12f + rf() * .1f, a = (if (rf() < .5f) 1f else -1f) * (.17f + rf() * .3f))); tag.append(" · DUTCH") }
                          else -> if (ri == 3 || ri == 5 || rf() < .12f) { ev.add(Ev(4, t, .07f + rf() * .04f, a = (if (rf() < .5f) 1f else -1f) * 6.283f)); tag.append(" · BARREL-ROLL") }
                      }
                  }
                  val dtc = if (rf() < .3f) (if (rf() < .5f) 1f else -1f) * (.08f + rf() * .18f) else 0f
                  if (ease < 0) ease = r.nextInt(5)
                  val np = min(8, max(5, ceil(pa.len / 45f).toInt()))
                  val px = FloatArray(np); val pz = FloatArray(np); val o = FloatArray(3)
                  for (k in 0 until np) { pa.at(k / (np - 1).toFloat(), o); px[k] = o[0]; pz[k] = o[2] }
                  val dur = 9f * (.85f + rf() * .3f) * dk
                  return Shot(pa, T, sp, fov, dur, ease, bank, shake, camR, dolly, z0, z1, dtc, ev, tag.toString(),
                      names1[r.nextInt(10)] + " " + names2[r.nextInt(8)], X, Z, px, pz)
              }
          }

          class CamRig(private val w: World) {
              private val p = FloatArray(3); private val q = FloatArray(3); private val a = FloatArray(3); private val b = FloatArray(3)
              private val co = FloatArray(3)
              private var rollS = 0f
              private var sfx = 0f; private var sfy = 0f; private var sfz = 0f

              fun ease(u: Float, m: Int): Float = when (m) {
                  1 -> 1f - (1f - u).pow(2.2f)
                  2 -> u.pow(1.8f)
                  3 -> u * u * u * (u * (6f * u - 15f) + 10f)
                  4 -> u - sin(6.2832f * u) * .09f
                  else -> u * u * (3f - 2f * u) * .7f + u * .3f
              }

              private fun wob(t: Float, f: Float, p: Float) = sin(t * f + p) + .5f * sin(t * f * 2.3f + p * 1.7f)

              fun pose(s: Shot, k: Float, t: Float, dt: Float, o: Pose) {
                  val u = min(1f, t / s.dur)
                  s.path.at(k, p); crp(s.T, k, q)
                  val e0 = .012f
                  s.path.at(max(0f, k - e0), a); s.path.at(min(1f, k + e0), b)
                  val vx = b[0] - a[0]; val vz = b[2] - a[2]; val ax = b[0] - 2 * p[0] + a[0]; val az = b[2] - 2 * p[2] + a[2]
                  val vl = hypot(vx, vz).coerceAtLeast(1e-4f)
                  val cur = 4f * (vx * az - vz * ax) / (vl * vl * vl)
                  var fovK = lp(s.z0, s.z1, ease(u, 0))
                  var ro = s.dtc * ss(0f, .25f, u); var yo = 0f; var po = 0f; var ox = 0f; var oy = 0f; var oz = 0f
                  for (e in s.ev) {
                      val x = (u - e.t) / e.w; val g = exp(-x * x * 2f); val sw = ss(e.t - e.w, e.t + e.w, u)
                      when (e.k) {
                          0 -> fovK *= 1f - .34f * g * e.a
                          1 -> { ox += e.ox * sw; oy += e.oy * sw; oz += e.oz * sw }
                          2 -> { val am = e.a * g; yo += sin(t * e.f + e.s) * am; po += sin(t * e.f * 1.3f + e.s * 2) * am * .8f; ro += sin(t * e.f * .9f + e.s * 3) * am * 1.4f }
                          3 -> ro += e.a * g * 1.6f
                          4 -> ro += e.a * sw
                      }
                  }
                  val sh = s.shake * .006f
                  var px = p[0]; var py = p[1]; var pz = p[2]
                  // jaring pengaman halus (bukan clamp)
                  val d = w.clr(px, py, pz, s.camR * .55f, co)
                  var tx = 0f; var ty = 0f; var tz = 0f
                  if (d < 0f) { tx = co[0] * (-d + .05f); ty = co[1] * (-d + .05f); tz = co[2] * (-d + .05f) }
                  val kk = 1f - exp(-dt * 6f)
                  sfx += (tx - sfx) * kk; sfy += (ty - sfy) * kk; sfz += (tz - sfz) * kk
                  px += sfx + sh * .8f * wob(t, .9f, 7f); py += sfy + sh * .56f * wob(t, 1.1f, 9f); pz += sfz
                  val dx = q[0] + ox - px; val dy = q[1] + oy - py; val dz = q[2] + oz - pz
                  val l = hypot(hypot(dx, dy), dz).coerceAtLeast(1e-4f)
                  o.x = px; o.y = py; o.z = pz
                  o.yaw = atan2(-dx, -dz) + yo + sh * (.5f * wob(t, 1.7f, 1f) + .27f * wob(t, 5.1f, 2f))
                  o.pit = (kotlin.math.asin((dy / l).coerceIn(-1f, 1f)) + po + sh * (.43f * wob(t, 1.3f, 3f) + .23f * wob(t, 4.7f, 4f))).coerceIn(-1.45f, 1.45f)
                  if (s.dolly > 0f) fovK = 2f * atan(s.dolly / max(4f, hypot(hypot(s.sp[0] - px, s.sp[1] - py), s.sp[2] - pz))) / s.fov
                  o.fov = (s.fov * fovK).coerceIn(.16f, 2.3f)
                  val bk = (cur * s.bank * 14f).coerceIn(-.6f, .6f)
                  rollS += (bk + ro + sh * .55f * wob(t, 1.1f, 5f) - rollS) * (1f - exp(-dt * (if (s.bank > 1f) 5f else 3f)))
                  o.roll = rollS
              }
          }
          EOF

