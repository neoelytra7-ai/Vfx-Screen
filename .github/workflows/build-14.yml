              override fun onSurfaceChanged(gl: GL10?, w: Int, h: Int) { sw = w; sh = h; G.glViewport(0, 0, w, h) }

              // ---------- util chunk ----------
              private fun key(cx: Int, cz: Int): Long = (cx.toLong() shl 32) or (cz.toLong() and 0xffffffffL)

              private fun freeGpu(c: Chunk) {
                  if (c.vao != 0) {
                      G.glDeleteVertexArrays(1, intArrayOf(c.vao), 0)
                      G.glDeleteBuffers(3, intArrayOf(c.vbo, c.lbo, c.ibo), 0)
                      c.vao = 0; c.vbo = 0; c.lbo = 0; c.ibo = 0; c.nT = 0; c.nF = 0; c.nW = 0
                  }
              }

              private fun lodFor(ch: Chunk, d: Float): Int {
                  val f = d / cfg.rd.toFloat() * 10f * cfg.lodScale.toFloat()
                  var l = min(9, floor(f).toInt())
                  if (ch.lod in 0..9 && f > ch.lod - .25f && f < ch.lod + 1.25f) l = ch.lod
                  return l
              }

              // ---------- streaming ----------
              private fun plan(now: Long) {
                  val pcx = floor(px / 16f).toInt(); val pcz = floor(pz / 16f).toInt()
                  val k = key(pcx, pcz)
                  if (k == planKey && now - planT < 600) return
                  planKey = k; planT = now
                  val nn = nx
                  val rd = cfg.rd.toFloat(); val R = ceil(rd).toInt()
                  val dm = HashMap<Long, Float>()
                  fun ring(cx: Int, cz: Int, r: Int) {
                      for (dx in -r..r) for (dz in -r..r) {
                          val d = hypot(dx.toFloat(), dz.toFloat())
                          if (d > r) continue
                          val kk = key(cx + dx, cz + dz); val o = dm[kk]
                          if (o == null || d < o) dm[kk] = d
                      }
                  }
                  ring(pcx, pcz, R)
                  if (nn != null) for (i in nn.ptsX.indices) ring(floor(nn.ptsX[i] / 16f).toInt(), floor(nn.ptsZ[i] / 16f).toInt(), if (i == 0) 7 else 4)
                  val yawv = yaw
                  tasks = ArrayList()
                  for ((kk, d) in dm) {
                      val cx = (kk shr 32).toInt(); val cz = kk.toInt()
                      var ch = chunks[kk]
                      if (ch == null) { ch = Chunk(cx, cz); chunks[kk] = ch }
                      ch.d = d
                      val lod = lodFor(ch, d)
                      if (ch.lod != lod && !ch.busy) {
                          val dx = (cx - pcx).toFloat(); val dz = (cz - pcz).toFloat()
                          val fwd = (dx * -sin(yawv) + dz * -cos(yawv)) / max(d, .5f)
                          tasks.add(Task(ch, lod, d * (1f + .45f * (1f - fwd))))
                      }
                  }
                  tasks.sortBy { it.pr }
                  // buang chunk yang jauh / tidak dipakai
                  val it = chunks.entries.iterator()
                  while (it.hasNext()) {
                      val e = it.next(); val c = e.value
                      if (!dm.containsKey(e.key)) {
                          val far = max(abs(c.cx - pcx), abs(c.cz - pcz)) > R + 2
                          if (far || nn != null) {
                              c.dead = true; freeGpu(c); main.dropVox(c.cx, c.cz); it.remove()
                          }
                      }
                  }
              }

              private fun dispatch() {
                  val maxIn = nW * 2
                  while (inflight < maxIn && tasks.isNotEmpty()) {
                      val t = tasks.removeAt(0)
                      val ch = t.ch
                      if (ch.dead || ch.busy) continue
                      ch.busy = true; inflight++
                      val gid = genId
                      val job = Job(++jobSeq, ch.cx, ch.cz, t.lod, cfg.spp.toInt(), cfg.bounce.toInt(), 99, ch.lod >= 0, t.lod <= 3, gid)
                      ch.jobId = job.id
                      val tl = tlEng
                      val cf = cfg
                      try {
                          exec.execute {
                              try {
                                  var e = tl.get()
                                  if (e == null) { e = Engine(cf.copy(), atlas.alb); tl.set(e) }
                                  e.mesher.build(job, { ch.dead || ch.jobId != job.id || genId != gid }, { m -> done.add(m) })
                              } catch (_: Throwable) {
                              } finally { done.add(JobEnd(ch.cx, ch.cz, job.id, gid)) }
                          }
                      } catch (_: Throwable) { ch.busy = false; inflight-- }
                  }
              }

              private fun upload(ch: Chunk, m: MeshOut) {
                  val old = intArrayOf(ch.vao, ch.vbo, ch.lbo, ch.ibo)
                  val vao = IntArray(1); val b = IntArray(3)
                  G.glGenVertexArrays(1, vao, 0); G.glGenBuffers(3, b, 0)
                  G.glBindVertexArray(vao[0])
                  G.glBindBuffer(G.GL_ARRAY_BUFFER, b[0])
                  G.glBufferData(G.GL_ARRAY_BUFFER, m.vb.remaining(), m.vb, G.GL_STATIC_DRAW)
                  G.glVertexAttribPointer(0, 4, G.GL_SHORT, false, 16, 0); G.glEnableVertexAttribArray(0)
                  G.glVertexAttribPointer(1, 2, G.GL_SHORT, false, 16, 8); G.glEnableVertexAttribArray(1)
                  G.glVertexAttribPointer(2, 4, G.GL_UNSIGNED_BYTE, false, 16, 12); G.glEnableVertexAttribArray(2)
                  G.glBindBuffer(G.GL_ARRAY_BUFFER, b[1])
                  G.glBufferData(G.GL_ARRAY_BUFFER, m.lb.remaining(), m.lb, G.GL_DYNAMIC_DRAW)
                  G.glVertexAttribPointer(3, 4, G.GL_HALF_FLOAT, false, 8, 0); G.glEnableVertexAttribArray(3)
                  G.glBindBuffer(G.GL_ELEMENT_ARRAY_BUFFER, b[2])
                  G.glBufferData(G.GL_ELEMENT_ARRAY_BUFFER, m.ib.remaining(), m.ib, G.GL_STATIC_DRAW)
                  G.glBindVertexArray(0)
                  if (old[0] != 0) {
                      G.glDeleteVertexArrays(1, intArrayOf(old[0]), 0)
                      G.glDeleteBuffers(3, intArrayOf(old[1], old[2], old[3]), 0)
                  }
                  ch.vao = vao[0]; ch.vbo = b[0]; ch.lbo = b[1]; ch.ibo = b[2]
                  ch.nT = m.nT; ch.nF = m.nF; ch.nW = m.nW; ch.isz = if (m.big) 4 else 2
                  ch.lod = m.lod
                  if (m.vox != null) main.setVox(ch.cx, ch.cz, m.vox) else main.dropVox(ch.cx, ch.cz)
              }

              private fun pump() {
                  val tEnd = System.nanoTime() + 4_000_000L
                  var n = 0
                  while (n < 4) {
                      val m = done.poll() ?: break
                      if (m is JobEnd) {
                          if (m.gen == genId) {
                              val c = chunks[key(m.cx, m.cz)]
                              if (c != null && c.jobId == m.id) c.busy = false
                              inflight = max(0, inflight - 1)
                          }
                      } else if (m is MeshOut) {
                          val c = chunks[key(m.cx, m.cz)]
                          if (c != null && !c.dead && c.jobId == m.id) { upload(c, m); n++ }
                      } else if (m is LightOut) {
                          val c = chunks[key(m.cx, m.cz)]
                          if (c != null && !c.dead && c.jobId == m.id && c.vao != 0) {
                              G.glBindBuffer(G.GL_ARRAY_BUFFER, c.lbo)
                              G.glBufferSubData(G.GL_ARRAY_BUFFER, 0, m.lb.remaining(), m.lb)
                              n++
                          }
                      }
                      if (System.nanoTime() > tEnd) break
                  }
              }

              private fun ready(s: Shot): Boolean {
                  val cx = floor(s.ptsX[0] / 16f).toInt(); val cz = floor(s.ptsZ[0] / 16f).toInt()
                  var tot = 0; var ok = 0
                  for (dx in -5..5) for (dz in -5..5) if (hypot(dx.toFloat(), dz.toFloat()) <= 5f) {
                      tot++
                      val c = chunks[key(cx + dx, cz + dz)]
                      if (c != null && c.lod >= 0) ok++
                  }
                  return ok >= tot * .95f
              }

              /** ganti kualitas (aman dipanggil dari thread UI; dikerjakan di thread GL) */
              fun setQuality(q: Int) { pendingQ = q }

              // ---------- setting dari menu ----------
              @Volatile private var wantRegen = false

              /** Terapkan satu setting ke cfg render + Core fisika/planner; persist=true => simpan permanen. */
              fun setSetting(k: String, v: Double, persist: Boolean) {
                  cfg.setK(k, v); main.S.setK(k, v); plCore.S.setK(k, v)
                  if (persist) Store.put(act, k, v)
              }

              /** Kembalikan satu setting ke default preset kualitas saat ini. */
              fun resetSetting(k: String) {
                  val v = makeCfg(quality).getK(k)
                  Store.remove(act, k)
                  setSetting(k, v, false)
              }

              fun requestRegen() { wantRegen = true }

              private fun regenWorld() {
                  main.reconfig(); synchronized(plWorld) { plCore.reconfig() }
                  genId++
                  exec.shutdownNow(); exec = newPool(); tlEng = ThreadLocal()
                  done.clear(); inflight = 0
                  for (c in chunks.values) { c.dead = true; freeGpu(c) }
                  chunks.clear(); tasks.clear(); main.clearVox()
                  spawned = false
                  planKey = Long.MIN_VALUE
              }


              private fun applyQuality(q: Int) {
                  quality = q; Store.remove(act, "rd", "lodScale", "spp", "bounce"); cfg = Store.apply(act, makeCfg(q))
                  genId++
                  exec.shutdownNow(); exec = newPool(); tlEng = ThreadLocal()
                  done.clear(); inflight = 0
                  for (c in chunks.values) { c.dead = true; freeGpu(c) }
                  chunks.clear(); tasks.clear(); main.clearVox()
                  planKey = Long.MIN_VALUE
              }

              // ---------- fisika pemain ----------
              private fun hit(x: Float, fy: Float, z: Float): Boolean {
                  val x0 = floor(x - .3f).toInt(); val x1 = floor(x + .3f).toInt()
                  val y0 = floor(fy).toInt(); val y1 = floor(fy + 1.79f).toInt()
                  val z0 = floor(z - .3f).toInt(); val z1 = floor(z + .3f).toInt()
                  for (a in x0..x1) for (b in y0..y1) for (c in z0..z1)
                      if (main.getP(a + .5, b + .5, c + .5) != 0) return true
                  return false
              }

              private fun look() {
                  val ks = cfg.touch.toFloat()
                  yaw -= lookDX * ks; pit = (pit - lookDY * ks).coerceIn(-1.45f, 1.45f); lookDX = 0f; lookDY = 0f
              }

              private fun walkStep(dt: Float) {
                  look()
                  if (!spawned) {
                      val g = main.hfn(floor(px).toInt(), floor(pz).toInt()) + 1f
                      py = g + EYE; spawned = true; vy = 0f
                  }
                  val f = -moveY; val r = moveX
                  var feet = py - EYE
                  val wy = main.waterY(px.toDouble(), pz.toDouble()).toFloat()
                  val inW = wy > -1e8f && feet + 1.0f < wy
                  val spd = (if (sprint) cfg.spr else cfg.spd).toFloat() * (if (inW) .6f else 1f)
                  val wx = (-sin(yaw) * f + cos(yaw) * r) * spd
                  val wz = (-cos(yaw) * f - sin(yaw) * r) * spd
                  // dorong keluar bila terjepit di dalam blok
                  var guard = 0
                  while (hit(px, feet, pz) && guard < 6) { feet += 1f; guard++ }
                  // horizontal (per sumbu) + naik 1 blok otomatis
                  val nxp = px + wx * dt
                  if (!hit(nxp, feet, pz)) px = nxp
                  else if (onGround) { val nf = floor(feet + .01f) + 1f; if (!hit(nxp, nf, pz)) { px = nxp; feet = nf } }
                  val nzp = pz + wz * dt
                  if (!hit(px, feet, nzp)) pz = nzp
                  else if (onGround) { val nf = floor(feet + .01f) + 1f; if (!hit(px, nf, nzp)) { pz = nzp; feet = nf } }
                  // vertikal
                  if (inW) {
                      vy += (((wy - .9f) - feet) * 6f - vy * 2.5f) * dt
                      if (jumpReq) vy += 22f * dt
                      vy += sin(pit) * f * 14f * dt
                      vy = vy.coerceIn(-5f, 5f)
                  } else {
                      vy -= cfg.grav.toFloat() * dt
                      if (onGround && jumpReq) { vy = cfg.jump.toFloat(); onGround = false }
                      if (vy < -45f) vy = -45f
                  }
                  val ny = feet + vy * dt
                  if (vy <= 0f) {
                      if (hit(px, ny, pz)) {
                          val top = floor(ny) + 1f
                          if (!hit(px, top, pz)) feet = top
                          vy = 0f; onGround = true
                      } else { feet = ny; onGround = false }
                  } else {
                      if (hit(px, ny, pz)) vy = 0f else feet = ny
                      onGround = false
                  }
                  py = feet + EYE
                  roll += (0f - roll) * min(1f, dt * 4f); fov += (1.2f - fov) * min(1f, dt * 4f)
              }

              private fun flyStep(dt: Float) {
                  look()
                  val f = -moveY; val r = moveX; val sp = (if (sprint) 60f else 24f)
                  val cp = cos(pit)
                  px += (-sin(yaw) * cp * f + cos(yaw) * r) * sp * dt
                  pz += (-cos(yaw) * cp * f - sin(yaw) * r) * sp * dt
                  py += (sin(pit) * f + (if (jumpReq) .7f else 0f)) * sp * dt
                  val d = world.clr(px, py, pz, .8f, co)
                  if (d < 0f) { px += co[0] * -d; py += co[1] * -d; pz += co[2] * -d }
                  vy = 0f; onGround = false; spawned = true
                  roll += (0f - roll) * min(1f, dt * 4f); fov += (1.2f - fov) * min(1f, dt * 4f)
              }

              // ---------- cinematic ----------
              private fun cut() {
                  cur = nx; nx = null; ct = 0f; fade = 1f; shotNo++
                  val c = cur!!
                  anchX = c.ax; anchZ = c.az
                  val n = shotNo; val a = anchX; val b = anchZ
                  fut = planExec.submit(Callable<Shot> { planner.make(n, 1, a, b) })
                  act.showTitle("SCENE " + String.format("%02d", shotNo) + " — " + c.tag, c.name)
                  planKey = Long.MIN_VALUE
              }

              private fun cinStep(dt: Float) {
                  if (!wasCin) {
                      wasCin = true; cur = null; nx = null; shotNo = 0; anchX = px; anchZ = pz; waitT = 0f
                      val a = anchX; val b = anchZ
                      fut = planExec.submit(Callable<Shot> { planner.make(0, 1, a, b) })
                  }
                  val f = fut
                  if (f != null && f.isDone) {
                      try { nx = f.get() } catch (e: Exception) { nx = null }
                      fut = null; planKey = Long.MIN_VALUE
                  }
                  val c = cur
                  if (c == null) {
                      val n = nx ?: return
                      waitT += dt
                      rig.pose(n, 0f, waitT, dt, pose); apply()
                      if (ready(n) || waitT > 20f) cut()
                      return
                  }
                  ct += dt
                  fade = max(0f, fade - dt / 1.2f)
                  val u = min(1f, ct / c.dur)
                  rig.pose(c, rig.ease(u, c.ease), ct, dt, pose); apply()
                  val n = nx
                  if (n != null && ct >= c.dur && (ready(n) || ct > c.dur + 10f)) cut()
              }

              private fun apply() { px = pose.x; py = pose.y; pz = pose.z; yaw = pose.yaw; pit = pose.pit; roll = pose.roll; fov = pose.fov }

              fun setCinematic(on: Boolean) {
                  cin = on
                  if (!on) {
                      wasCin = false; cur = null; nx = null; fut = null; fade = 0f; roll = 0f; planKey = Long.MIN_VALUE; act.hideTitle()
                      spawned = false   // turun ke tanah dari posisi kamera terakhir
                  }
              }

              // ---------- frustum ----------
              private fun extractPlanes() {
                  val m = mvp
                  fun pl(i: Int, a: Float, b: Float, c: Float, d: Float) {
                      val l = sqrt(a * a + b * b + c * c)
                      planes[i * 4] = a / l; planes[i * 4 + 1] = b / l; planes[i * 4 + 2] = c / l; planes[i * 4 + 3] = d / l
                  }
                  pl(0, m[3] + m[0], m[7] + m[4], m[11] + m[8], m[15] + m[12])
                  pl(1, m[3] - m[0], m[7] - m[4], m[11] - m[8], m[15] - m[12])
                  pl(2, m[3] + m[1], m[7] + m[5], m[11] + m[9], m[15] + m[13])
                  pl(3, m[3] - m[1], m[7] - m[5], m[11] - m[9], m[15] - m[13])
                  pl(4, m[3] + m[2], m[7] + m[6], m[11] + m[10], m[15] + m[14])
                  pl(5, m[3] - m[2], m[7] - m[6], m[11] - m[10], m[15] - m[14])
              }

              private fun inView(cx: Float, cy: Float, cz: Float, r: Float): Boolean {
                  for (i in 0 until 6) {
                      if (planes[i * 4] * cx + planes[i * 4 + 1] * cy + planes[i * 4 + 2] * cz + planes[i * 4 + 3] < -r) return false
                  }
                  return true
              }

              // ---------- frame ----------
              override fun onDrawFrame(gl: GL10?) {
                  if (broken) { G.glClearColor(.1f, 0f, 0f, 1f); G.glClear(G.GL_COLOR_BUFFER_BIT); return }
                  val pq = pendingQ
                  if (pq >= 0) { pendingQ = -1; applyQuality(pq) }
                  if (wantRegen) { wantRegen = false; regenWorld() }
                  val t = System.nanoTime()
                  val dt = min(.05f, (t - last) / 1e9f); last = t
                  val tm = (t - t0) / 1e9f
                  fps += (1f / max(dt, 1e-3f) - fps) * .05f
                  if (cin) cinStep(dt) else { wasCin = false; if (fly) flyStep(dt) else walkStep(dt) }
                  plan(t / 1000000L); dispatch(); pump()

                  val cp = cos(pit); val sp = sin(pit)
                  val fw = floatArrayOf(-sin(yaw) * cp, sp, -cos(yaw) * cp)
                  val r0 = floatArrayOf(cos(yaw), 0f, -sin(yaw)); val u0 = floatArrayOf(sin(yaw) * sp, cp, cos(yaw) * sp)
                  val cr = cos(roll); val sr = sin(roll)
                  val rv = FloatArray(3) { r0[it] * cr + u0[it] * sr }; val uv = FloatArray(3) { u0[it] * cr - r0[it] * sr }
                  val eye = floatArrayOf(px, py, pz)
                  fun dot(a: FloatArray, b: FloatArray) = a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
                  val z = floatArrayOf(-fw[0], -fw[1], -fw[2])
                  view[0] = rv[0]; view[1] = uv[0]; view[2] = z[0]; view[3] = 0f
                  view[4] = rv[1]; view[5] = uv[1]; view[6] = z[1]; view[7] = 0f
                  view[8] = rv[2]; view[9] = uv[2]; view[10] = z[2]; view[11] = 0f
                  view[12] = -dot(rv, eye); view[13] = -dot(uv, eye); view[14] = -dot(z, eye); view[15] = 1f
                  val asp = sw / sh.toFloat()
                  kick += ((if (sprint && !cin) 1f else 0f) - kick) * min(1f, dt * 5f)
                  val fovE = fov + .14f * kick * cfg.getK("fovKick").toFloat()
                  Matrix.perspectiveM(proj, 0, Math.toDegrees(fovE.toDouble()).toFloat(), asp, .1f, 1500f)
                  Matrix.multiplyMM(mvp, 0, proj, 0, view, 0)
                  extractPlanes()

                  // matahari & pencahayaan (sama dengan bake)
                  val el = cfg.sunEl; val az = cfg.sunAz
                  val sdx = (cos(el) * sin(az)).toFloat(); val sdy = sin(el).toFloat(); val sdz = (cos(el) * cos(az)).toFloat()
                  val scs = cfg.sun.toFloat()
                  fun kf(k: String): Float = cfg.getK(k).toFloat()
                  val wyU = main.waterY(px.toDouble(), pz.toDouble()).toFloat()
                  val under = kf("uwOn") > .5f && wyU > -1e8f && py < wyU
                  val fog = max(cfg.fog.toFloat(), 3.2f / (cfg.rd.toFloat() * 16f)) * (if (under) 1f + 2.2f * kf("uwDens") else 1f)
                  val pf = if (kf("post") > .5f) 1f else 0f
                  val gA = if (kf("gOn") > .5f) kf("gAmt") * pf else 0f
                  val mAz: Double; val mEl: Double
                  if (kf("mnAuto") > .5f) { mAz = az + Math.PI + kf("mnAzOff"); mEl = Math.abs(el) * .9 + kf("mnElOff") }
                  else { mAz = kf("mnAz").toDouble(); mEl = kf("mnEl").toDouble() }
                  val mdx = (Math.cos(mEl) * Math.sin(mAz)).toFloat(); val mdy = Math.sin(mEl).toFloat(); val mdz = (Math.cos(mEl) * Math.cos(mAz)).toFloat()


                  G.glViewport(0, 0, sw, sh)
                  G.glClearColor(.3f, .5f, .9f, 1f)
                  G.glClear(G.GL_COLOR_BUFFER_BIT or G.GL_DEPTH_BUFFER_BIT)
                  fun common(p: Prog) {
                      G.glUniform3f(p.u("sd"), sdx, sdy, sdz); G.glUniform3f(p.u("sc"), 1.3f * scs, 1.1f * scs, .85f * scs)
                      G.glUniform1f(p.u("cex"), cfg.cex.toFloat()); G.glUniform1f(p.u("sat"), cfg.sat.toFloat()); G.glUniform1f(p.u("con"), cfg.con.toFloat())
                      G.glUniform1f(p.u("hs"), 1f)
                      G.glUniform4f(p.u("g1"), gA, kf("gEv"), kf("gTemp"), kf("gTint"))
                      G.glUniform4f(p.u("g2"), kf("gCon"), kf("gPiv"), kf("gSat"), kf("gVib"))
                      G.glUniform4f(p.u("g3"), kf("gBlk"), kf("gWht"), kf("matte") * pf, kf("bleach") * pf)
                      G.glUniform4f(p.u("g4"), kf("stSH"), kf("stSS"), kf("stHH"), kf("stHS"))
                      G.glUniform4f(p.u("g5"), kf("grade") * pf, kf("grain") * pf, (tm % 100f), 0f)
                      G.glUniform3f(p.u("gLi"), kf("glR"), kf("glG"), kf("glB"))
                      G.glUniform3f(p.u("gGa"), kf("ggR"), kf("ggG"), kf("ggB"))
                      G.glUniform3f(p.u("gGn"), kf("gnR"), kf("gnG"), kf("gnB"))
                  }
                  // langit
                  G.glDisable(G.GL_DEPTH_TEST)
                  G.glUseProgram(pSky.id); common(pSky)
                  G.glUniform3fv(pSky.u("R"), 1, rv, 0); G.glUniform3fv(pSky.u("U"), 1, uv, 0); G.glUniform3fv(pSky.u("F"), 1, fw, 0)
                  G.glUniform2f(pSky.u("th"), tan(fovE / 2f) * asp, tan(fovE / 2f))
                  G.glUniform1f(pSky.u("tm"), tm); G.glUniform1f(pSky.u("stT"), kf("stMWTilt"))
                  G.glUniform4f(pSky.u("stA"), kf("stDens"), kf("stBr"), kf("stSz"), kf("stTw"))
                  G.glUniform4f(pSky.u("stB"), kf("stOn"), kf("stCol"), kf("stMW"), kf("stDark"))
                  G.glUniform4f(pSky.u("mnA"), kf("mnOn"), kf("mnSize"), kf("mnBr"), kf("mnPhase"))
                  G.glUniform3f(pSky.u("md"), mdx, mdy, mdz)
                  G.glUniform4f(pSky.u("mnB"), kf("mnTint"), kf("mnGlow"), kf("mnDay"), kf("mnRot"))
                  G.glUniform4f(pSky.u("mnC"), kf("mnMaria"), kf("mnCrat"), kf("mnEs"), 0f)
                  G.glUniform4f(pSky.u("clA"), kf("cloud"), kf("c2Sc"), kf("c2Sp"), kf("c2Br"))
                  G.glUniform4f(pSky.u("clB"), kf("c2Dir"), kf("c2Soft"), kf("c2Sh"), kf("c2Hz"))
                  G.glUniform4f(pSky.u("clC"), kf("c2Ci"), kf("c2Ac"), kf("c2Cu"), kf("c2St"))
                  val saAzD = kf("saAz").toDouble(); val saElD = kf("saEl").toDouble()
                  G.glUniform3f(pSky.u("sad"), (Math.cos(saElD) * Math.sin(saAzD)).toFloat(), Math.sin(saElD).toFloat(), (Math.cos(saElD) * Math.cos(saAzD)).toFloat())
                  G.glUniform4f(pSky.u("saA"), kf("saOn"), kf("saSize"), kf("saBr"), kf("saBands"))
                  G.glUniform4f(pSky.u("saB"), kf("saRoll"), kf("saOpen"), kf("saRing"), kf("saGlow"))
                  G.glUniform4f(pSky.u("saC"), kf("saShadow"), kf("saTint"), kf("saDay"), 0f)
                  G.glDrawArrays(G.GL_TRIANGLES, 0, 3)
                  G.glEnable(G.GL_DEPTH_TEST)

                  // kumpulkan chunk terlihat
                  vis.clear()
                  for (c in chunks.values) {
                      if (c.vao == 0) continue
                      if (inView(c.cx * 16f + 8f, 32f, c.cz * 16f + 8f, 44f)) vis.add(c)
                  }
                  val gx = cos(cfg.windDir).toFloat(); val gz = sin(cfg.windDir).toFloat()
                  // terrain
                  G.glActiveTexture(G.GL_TEXTURE0); G.glBindTexture(G.GL_TEXTURE_2D, texAtlas)
                  G.glUseProgram(pT.id); common(pT)
                  G.glUniformMatrix4fv(pT.u("m"), 1, false, mvp, 0); G.glUniform3f(pT.u("cp"), px, py, pz)
                  G.glUniform1f(pT.u("e"), cfg.exp.toFloat()); G.glUniform1f(pT.u("fg"), fog); G.glUniform1i(pT.u("tx"), 0)
                  val ogT = pT.u("og")
                  for (c in vis) {
                      if (c.nT == 0) continue
                      G.glUniform3f(ogT, c.cx * 16f, 0f, c.cz * 16f)
                      G.glBindVertexArray(c.vao)
                      G.glDrawElements(G.GL_TRIANGLES, c.nT, if (c.isz == 4) G.GL_UNSIGNED_INT else G.GL_UNSIGNED_SHORT, 0)
                  }
                  // foliage
                  G.glUseProgram(pF.id); common(pF)
                  G.glUniformMatrix4fv(pF.u("m"), 1, false, mvp, 0); G.glUniform3f(pF.u("cp"), px, py, pz)
                  G.glUniform1f(pF.u("e"), cfg.exp.toFloat()); G.glUniform1f(pF.u("fg"), fog); G.glUniform1i(pF.u("tx"), 0)
                  G.glUniform1f(pF.u("tm"), tm)
                  G.glUniform1f(pF.u("wd"), (cfg.wind * cfg.swayAmp * (if (cin) cfg.cinWind else 1.0)).toFloat())
                  G.glUniform1f(pF.u("wg"), cfg.swayGust.toFloat()); G.glUniform1f(pF.u("wf"), cfg.swayFlut.toFloat())
                  G.glUniform2f(pF.u("wdr"), gx, gz)
                  val ogF = pF.u("og")
                  for (c in vis) {
                      if (c.nF == 0) continue
                      G.glUniform3f(ogF, c.cx * 16f, 0f, c.cz * 16f)
                      G.glBindVertexArray(c.vao)
                      G.glDrawElements(G.GL_TRIANGLES, c.nF, if (c.isz == 4) G.GL_UNSIGNED_INT else G.GL_UNSIGNED_SHORT, c.nT * c.isz)
                  }
                  // air: pass A (serapan, kali) lalu pass B (pantulan/kilau, tambah)
                  G.glActiveTexture(G.GL_TEXTURE0 + 1); G.glBindTexture(G.GL_TEXTURE_2D, texWn); G.glActiveTexture(G.GL_TEXTURE0)
                  G.glEnable(G.GL_BLEND); G.glDepthMask(false)
                  for (pass in 0..1) {
                      val p = if (pass == 0) pWA else pWB
                      if (pass == 0) G.glBlendFunc(G.GL_ZERO, G.GL_SRC_COLOR) else G.glBlendFunc(G.GL_ONE, G.GL_ONE)
                      G.glUseProgram(p.id); common(p)
                      G.glUniformMatrix4fv(p.u("m"), 1, false, mvp, 0); G.glUniform3f(p.u("cp"), px, py, pz)
                      G.glUniform1i(p.u("wn"), 1)
                      G.glUniform1f(p.u("wtm"), tm); G.glUniform1f(p.u("fg"), fog); G.glUniform1f(p.u("e"), cfg.exp.toFloat())
                      G.glUniform1f(p.u("rip"), cfg.wRip.toFloat()); G.glUniform1f(p.u("wfl"), cfg.wFlow.toFloat()); G.glUniform1f(p.u("wfm"), cfg.wFoam.toFloat())
                      G.glUniform1f(p.u("wcl"), cfg.wClar.toFloat()); G.glUniform1f(p.u("wsp"), cfg.wSpec.toFloat())
                      G.glUniform1f(p.u("swA"), cfg.wvSwell.toFloat()); G.glUniform1f(p.u("swL"), cfg.wvLen.toFloat())
                      G.glUniform1f(p.u("swC"), cfg.wvChop.toFloat()); G.glUniform1f(p.u("swS"), cfg.wvSpd.toFloat()); G.glUniform1f(p.u("swD"), cfg.windDir.toFloat())
                      val og = p.u("og")
                      for (c in vis) {
                          if (c.nW == 0) continue
                          G.glUniform3f(og, c.cx * 16f, 0f, c.cz * 16f)
                          G.glBindVertexArray(c.vao)
                          G.glDrawElements(G.GL_TRIANGLES, c.nW, if (c.isz == 4) G.GL_UNSIGNED_INT else G.GL_UNSIGNED_SHORT, (c.nT + c.nF) * c.isz)
                      }
                  }
                  G.glBindVertexArray(0)
                  G.glDepthMask(true)
                  // ---- fauna prosedural, debu, kunang-kunang ----
                  run {
                      val faOn = kf("faOn") > .5f
                      val nFF = if (faOn && !under) (Math.min(kf("ff"), 600f) / 4f).toInt() else 0
                      val nDu = if (!under) Math.min(kf("dust"), 600f).toInt() else 0
                      val nBu = if (faOn && !under) kf("butN").toInt() else 0
                      val nDr = if (faOn && !under) kf("drgN").toInt() else 0
                      val nBi = if (faOn && !under) kf("birdN").toInt() else 0
                      if (nFF + nDu + nBu + nDr + nBi > 0) {
                          val d0 = ((sdy + .05f) / .4f).coerceIn(0f, 1f)
                          val dayf = d0 * d0 * (3f - 2f * d0)
                          val gyy = main.hfn(floor(px).toInt(), floor(pz).toInt()) + 1f
                          G.glEnable(G.GL_BLEND); G.glDepthMask(false)
                          G.glUseProgram(pFa.id)
                          G.glUniformMatrix4fv(pFa.u("m"), 1, false, mvp, 0); G.glUniform3f(pFa.u("cp"), px, py, pz)
                          G.glUniform1f(pFa.u("tm"), tm); G.glUniform1f(pFa.u("gy"), gyy); G.glUniform1f(pFa.u("dayf"), dayf)
                          G.glUniform1f(pFa.u("ps"), sh / (2f * tan(fovE / 2f)))
                          G.glUniform4f(pFa.u("cn"), nFF.toFloat(), nDu.toFloat(), nBu.toFloat(), nDr.toFloat())
                          G.glUniform4f(pFa.u("fa1"), kf("ffSpd"), kf("ffAlt"), kf("ffWander"), kf("ffBlink"))
                          G.glUniform4f(pFa.u("fa2"), kf("butSpd"), kf("butFlap"), kf("butErr"), kf("butSize"))
                          G.glUniform4f(pFa.u("fa3"), kf("drgSpd"), kf("drgSize"), kf("birdAlt"), kf("birdSpd"))
                          G.glUniform4f(pFa.u("fa4"), kf("birdSize"), kf("ffSize"), kf("ffHalo") * (.55f + kf("ffBright")), kf("ffDay"))
                          G.glUniform3f(pFa.u("fa5"), kf("faRange"), 0f, 0f)
                          if (nFF + nDu > 0) { G.glBlendFunc(G.GL_ONE, G.GL_ONE); G.glDrawArrays(G.GL_POINTS, 0, nFF + nDu) }
                          if (nBu + nDr + nBi > 0) { G.glBlendFunc(G.GL_SRC_ALPHA, G.GL_ONE_MINUS_SRC_ALPHA); G.glDrawArrays(G.GL_POINTS, nFF + nDu, nBu + nDr + nBi) }
                          G.glDepthMask(true)
                      }
                  }
                  // ---- lens flare / glare / streak / halation ----
                  run {
                      val fl = kf("flare"); val st = kf("streak"); val gl = kf("glare"); val ha = kf("halat")
                      if (!under && pf > 0f && fl + st + gl + ha > 0f) {
                          val wx = px + sdx * 1000f; val wy2 = py + sdy * 1000f; val wz = pz + sdz * 1000f
                          val cw = mvp[3] * wx + mvp[7] * wy2 + mvp[11] * wz + mvp[15]
                          var tgt = 0f; var nx = 0f; var ny = 0f
                          if (cw > .01f && sdy > -.05f) {
                              nx = (mvp[0] * wx + mvp[4] * wy2 + mvp[8] * wz + mvp[12]) / cw
                              ny = (mvp[1] * wx + mvp[5] * wy2 + mvp[9] * wz + mvp[13]) / cw
                              var occ = false; var dd = 3f
                              while (dd < 260f && !occ) { if (main.getP((px + sdx * dd).toDouble(), (py + sdy * dd).toDouble(), (pz + sdz * dd).toDouble()) != 0) occ = true; dd *= 1.18f }
                              val e = Math.max(Math.abs(nx), Math.abs(ny))
                              tgt = if (occ) 0f else ((1.7f - e) / .9f).coerceIn(0f, 1f) * ((sdy + .05f) / .2f).coerceIn(0f, 1f)
                          }
                          flareVis += (tgt - flareVis) * min(1f, dt * 8f)
                          if (flareVis > .003f) {
                              G.glDisable(G.GL_DEPTH_TEST); G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_ONE, G.GL_ONE)
                              G.glUseProgram(pFl.id)
                              G.glUniform2f(pFl.u("sp"), nx, ny); G.glUniform1f(pFl.u("asp"), asp); G.glUniform1f(pFl.u("vis"), flareVis)
                              G.glUniform4f(pFl.u("fl"), fl, st, gl, ha)
                              G.glDrawArrays(G.GL_TRIANGLES, 0, 3)
                          }
                      } else { flareVis = 0f }
                  }
                  // ---- parameter audio ----
                  run {
                      audio.day = ((sdy + .05f) / .4f).coerceIn(0f, 1f)
                      audio.wind = cfg.wind.toFloat() * cfg.swayAmp.toFloat()
                      audio.under = under
                      audio.alt = py - (main.hfn(floor(px).toInt(), floor(pz).toInt()) + 1f)
                      if (dt > 0f) { audio.speed = Math.hypot((px - lastPx).toDouble(), (pz - lastPz).toDouble()).toFloat() / dt; audio.grounded = audio.alt < 2.2f }
                      lastPx = px; lastPz = pz
                      if (++wTick % 10 == 0) {
                          var n = 0
                          for (o in arrayOf(0f, 8f, -8f)) for (o2 in arrayOf(0f, 8f, -8f)) if (main.waterY((px + o).toDouble(), (pz + o2).toDouble()) > -1e8) n++
                          audio.water = n / 9f
                      }
                  }

                  // overlay bawah air (tint + kaustik + sinar)
                  if (under) {
                      G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_SRC_ALPHA, G.GL_ONE_MINUS_SRC_ALPHA)
                      G.glUseProgram(pUw.id)
                      G.glUniform1f(pUw.u("tm"), tm); G.glUniform1f(pUw.u("amt"), kf("uwAmt")); G.glUniform1f(pUw.u("dens"), kf("uwDens"))
                      G.glUniform1f(pUw.u("caus"), kf("uwCaus")); G.glUniform1f(pUw.u("sdy"), sdy)
                      G.glDrawArrays(G.GL_TRIANGLES, 0, 3)
                  }
                  // vignette (kali layar)
                  G.glDisable(G.GL_DEPTH_TEST)
                  G.glBlendFunc(G.GL_ZERO, G.GL_SRC_COLOR)
                  G.glUseProgram(pVig.id); G.glUniform1f(pVig.u("vig"), cfg.vig.toFloat()); G.glUniform1f(pVig.u("asp"), asp)
                  G.glDrawArrays(G.GL_TRIANGLES, 0, 3)
                  // fade antar scene
                  if (cin && fade > 0f) {
                      G.glBlendFunc(G.GL_SRC_ALPHA, G.GL_ONE_MINUS_SRC_ALPHA)
                      G.glUseProgram(pFade.id); G.glUniform1f(pFade.u("a"), fade * fade * (3f - 2f * fade))
                      G.glDrawArrays(G.GL_TRIANGLES, 0, 3)
                  }
                  G.glDisable(G.GL_BLEND); G.glEnable(G.GL_DEPTH_TEST)
                  // letterbox 2.39:1
                  if (cin) {
                      val bh = ((sh - sw / 2.39f) / 2f).toInt()
                      if (bh > 0) {
                          G.glEnable(G.GL_SCISSOR_TEST); G.glClearColor(0f, 0f, 0f, 1f)
                          G.glScissor(0, 0, sw, bh); G.glClear(G.GL_COLOR_BUFFER_BIT)
                          G.glScissor(0, sh - bh, sw, bh); G.glClear(G.GL_COLOR_BUFFER_BIT)
                          G.glDisable(G.GL_SCISSOR_TEST)
                      }
                  }
                  hudT += dt
                  if (hudT > .5f) {
                      hudT = 0f
                      var have = 0
                      for (c in chunks.values) if (c.vao != 0) have++
                      val mode = if (cin) "cinematic" else if (fly) "terbang" else "jalan"
                      act.setHud(fps.toInt().toString() + " fps · " + mode + " · chunk " + vis.size + "/" + have + " · antre " + (tasks.size + inflight) +
                          " · Q" + quality + " · y " + py.toInt())
                  }
              }

              fun destroy() { exec.shutdownNow(); planExec.shutdownNow() }
          }
