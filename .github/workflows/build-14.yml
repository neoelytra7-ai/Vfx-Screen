              private val tg = TreeGen()
              private val bt = DoubleArray(3)

              // ===================== CHUNK =====================
              /** buat voxel + kartu daun untuk chunk (cx,cz) bila belum ada */
              fun voxGen(cx: Int, cz: Int) {
                  val k = c.ck(cx, cz)
                  if (c.VOX.containsKey(k)) return
                  val v = ByteArray(CS * CS * H)
                  val x0 = cx * CS; val z0 = cz * CS
                  gv = v; gx0 = x0; gz0 = z0
                  cards = ArrayList()
                  for (lx in 0 until CS) for (lz in 0 until CS) {
                      val rec = c.colRec(x0 + lx, z0 + lz)
                      val h = rec and 63; val fl = (rec shr 6) and 15; val ws = (rec ushr 10) / 64.0
                      val top = c.surf(x0 + lx, z0 + lz, h, fl, ws)
                      val sub = if (top == 1 || top == 14 || top == 12) 2 else if (top == 13) 13 else if (top == 7 || top == 10 || top == 11) 7 else 3
                      for (y in 0..h) v[lx + CS * (lz + CS * y)] = (if (y == h) top else if (y > h - 4) sub else 3).toByte()
                  }
                  ruinPass(x0, z0)
                  for (tx in x0 - 10 until x0 + CS + 10) for (tz in z0 - 10 until z0 + CS + 10) {
                      val kk = c.treeAt(tx, tz)
                      if (kk == 0) continue
                      if (!c.treeOK(tx, tz, kk)) continue
                      val h = c.hfn(tx, tz)
                      val own = tx >= x0 && tx < x0 + CS && tz >= z0 && tz < z0 + CS
                      c.bTintF(tx + .5, tz + .5, bt)
                      val g = tg
                      g.tx = tx; g.tz = tz; g.h = h; g.rg = Rng(tx, tz, c.seedv()); g.own = own
                      g.bt0 = bt[0]; g.bt1 = bt[1]; g.bt2 = bt[2]; g.pal = 0
                      val r1 = g.r(); val r2 = g.r(); val r3 = g.r()
                      g.sz = max(.55, min(2.3, .6 + (r1 * r2 * 1.7 + (r3 - .5) * .3) * S.treeSz))
                      g.cxx = tx + .5; g.czz = tz + .5
                      g.gen(kk)
                      if (own && S.treeFall > 0 && kk != 2 && kk != 14 && kk != 18 && g.r() < .018 * S.treeFall) {
                          val ax = g.r() < .5; val L = 3 + floor(g.r() * 3).toInt()
                          for (kq in 0 until L) {
                              val X = tx + 2 + (if (ax) kq else 0); val Z = tz + 2 + (if (ax) 0 else kq)
                              put(X, c.hfn(X, Z) + 1, Z, 4)
                          }
                      }
                  }
                  val em = c.EDIT[k]
                  if (em != null) for ((q, i) in em) v[q] = i.toByte()
                  c.VOX[k] = v
                  c.CARD[k] = cards
              }
          }
