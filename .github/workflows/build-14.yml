                  val ok = IntArray(1); G.glGetProgramiv(p, G.GL_LINK_STATUS, ok, 0)
                  if (ok[0] == 0) throw RuntimeException("link: " + G.glGetProgramInfoLog(p))
                  return Prog(p)
              }

