          package com.infinitepath.app

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import java.util.Locale
          import kotlin.math.ceil
          import kotlin.math.log10
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          /** Akses Cfg per nama key (field statis lewat refleksi, sisanya lewat dyn). */
          object CfgX {
              private val fl = HashMap<String, java.lang.reflect.Field?>()
              @Synchronized fun f(k: String): java.lang.reflect.Field? {
                  if (!fl.containsKey(k)) fl[k] = try { Cfg::class.java.getField(k) } catch (_: Throwable) { null }
                  return fl[k]
              }
          }
          fun Cfg.getK(k: String): Double { val f = CfgX.f(k); return if (f != null) f.getDouble(this) else d(k) }
          fun Cfg.setK(k: String, v: Double) { val f = CfgX.f(k); if (f != null) f.setDouble(this, v) else dyn[k] = v }

          /** Setting yang diubah user disimpan di SharedPreferences dan ditimpakan ke Cfg saat start. */
          object Store {
              private fun p(c: Context) = c.getSharedPreferences("ibp_cfg", Context.MODE_PRIVATE)
              fun apply(c: Context, cfg: Cfg): Cfg {
                  try {
                      for ((k, v) in p(c).all) { val d = (v as? String)?.toDoubleOrNull() ?: continue; cfg.setK(k, d) }
                  } catch (_: Throwable) {}
                  return cfg
              }
              fun put(c: Context, k: String, v: Double) { p(c).edit().putString(k, v.toString()).apply() }
              fun remove(c: Context, vararg ks: String) { val e = p(c).edit(); for (k in ks) e.remove(k); e.apply() }
              fun clear(c: Context) { p(c).edit().clear().apply() }
          }

          /**
           * Menu pengaturan: kategori horizontal di bawah, daftar item di panel atasnya, slider muncul saat item diketuk.
           * Slider digeser => menu menghilang (dunia terlihat penuh) dan nilai tampil di atas layar. Ketuk di luar / tombol X menutup.
           */
          class SettingsMenu(private val act: MainActivity, private val r: Renderer) {
              val root = FrameLayout(act)
              private val dp = act.resources.displayMetrics.density
              private fun px(v: Float) = (v * dp).toInt()
              private val dim = 0x44000000
              private val cBg = Color.argb(235, 20, 27, 23)
              private val cBd = Color.parseColor("#060908")
              private val cFg = Color.parseColor("#E4EEDC")
              private val cAc = Color.parseColor("#7CCF4F")
              private val cAc2 = Color.parseColor("#FFA63A")
              private val cBt = Color.parseColor("#2E3A31")

              private val col = LinearLayout(act)
              private val list = LinearLayout(act)
              private val bar = LinearLayout(act)
              private val chipRow = LinearLayout(act)
              private val pv = TextView(act)
              private val h = Handler(Looper.getMainLooper())
              private var regenRun: Runnable? = null
              private val chips = ArrayList<TextView>()
              private var ci = 0
              private var openKey: String? = null

              private class MaxScroll(c: Context) : ScrollView(c) {
                  override fun onMeasure(w: Int, hh: Int) {
                      val mh = (resources.displayMetrics.heightPixels * .44f).toInt()
                      super.onMeasure(w, View.MeasureSpec.makeMeasureSpec(mh, View.MeasureSpec.AT_MOST))
                  }
              }

              private fun box(fill: Int, rad: Float = 6f): GradientDrawable {
                  val g = GradientDrawable(); g.setColor(fill); g.cornerRadius = rad * dp; g.setStroke(px(2f), cBd); return g
              }

              private fun btn(t: String, w: Int = 40): TextView {
                  val b = TextView(act)
                  b.text = t; b.setTextColor(cFg); b.textSize = 15f; b.gravity = Gravity.CENTER; b.typeface = Typeface.DEFAULT_BOLD
                  b.background = box(cBt, 4f)
                  b.layoutParams = LinearLayout.LayoutParams(px(w.toFloat()), px(38f)).also { it.setMargins(px(2f), 0, px(2f), 0) }
                  return b
              }

              init {
                  root.visibility = View.GONE
                  root.setBackgroundColor(dim)
                  root.setOnClickListener { close() }

                  pv.setTextColor(cAc2); pv.textSize = 15f; pv.typeface = Typeface.DEFAULT_BOLD
                  pv.background = box(cBg); pv.setPadding(px(14f), px(6f), px(14f), px(6f)); pv.visibility = View.GONE
                  root.addView(pv, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.CENTER_HORIZONTAL).also { it.topMargin = px(52f) })

                  col.orientation = LinearLayout.VERTICAL
                  col.isClickable = true
                  val sw = act.resources.displayMetrics.widthPixels
                  val cw = min(px(560f), sw - px(16f))
                  root.addView(col, FrameLayout.LayoutParams(cw, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).also { it.bottomMargin = px(8f) })

                  val sc = MaxScroll(act)
                  sc.background = box(cBg); sc.isVerticalScrollBarEnabled = false
                  list.orientation = LinearLayout.VERTICAL; list.setPadding(px(10f), px(2f), px(10f), px(2f))
                  sc.addView(list, FrameLayout.LayoutParams(-1, -2))
                  col.addView(sc, LinearLayout.LayoutParams(-1, -2).also { it.bottomMargin = px(6f) })

                  bar.orientation = LinearLayout.HORIZONTAL; bar.gravity = Gravity.CENTER_VERTICAL
                  bar.background = box(cBg); bar.setPadding(px(5f), px(5f), px(5f), px(5f))
                  val hs = HorizontalScrollView(act); hs.isHorizontalScrollBarEnabled = false
                  chipRow.orientation = LinearLayout.HORIZONTAL
                  hs.addView(chipRow)
                  bar.addView(hs, LinearLayout.LayoutParams(0, -2, 1f))
                  val rs = btn("\u21BA"); rs.setOnClickListener { resetCat() }
                  val cl = btn("\u2715"); cl.setOnClickListener { close() }
                  bar.addView(rs); bar.addView(cl)
                  col.addView(bar, LinearLayout.LayoutParams(-1, -2))

                  for ((i, c) in Schema.CATS.withIndex()) {
                      val t = TextView(act)
                      t.text = c.name; t.textSize = 11f; t.typeface = Typeface.DEFAULT_BOLD; t.setTextColor(cFg)
                      t.setPadding(px(11f), px(9f), px(11f), px(9f)); t.background = box(cBt, 3f)
                      t.setOnClickListener { openKey = null; showCat(i) }
                      chipRow.addView(t, LinearLayout.LayoutParams(-2, -2).also { it.setMargins(px(2f), 0, px(2f), 0) })
                      chips.add(t)
                  }
                  showCat(0)
              }

              fun isOpen() = root.visibility == View.VISIBLE
              fun open() { showCat(ci); root.visibility = View.VISIBLE }
              fun close() { peek(false); root.visibility = View.GONE }
              fun toggle() { if (isOpen()) close() else open() }

              private fun peek(on: Boolean) {
                  col.alpha = if (on) 0f else 1f
                  root.setBackgroundColor(if (on) 0 else dim)
                  pv.visibility = if (on) View.VISIBLE else View.GONE
              }

              private fun fmt(it: Schema.Item, v: Double): String {
                  val st = it.step
                  val d = if (st >= 1.0) 0 else min(5, max(1, ceil(-log10(st) - 1e-9).toInt()))
                  return String.format(Locale.US, "%." + d + "f", v)
              }
              private fun isToggle(it: Schema.Item) = it.min == 0.0 && it.max == 1.0 && it.step == 1.0

              private fun showCat(i: Int) {
                  ci = i
                  for ((k, t) in chips.withIndex()) {
                      t.background = box(if (k == i) cAc else cBt, 3f)
                      t.setTextColor(if (k == i) Color.WHITE else cFg)
                  }
                  list.removeAllViews()
                  for (item in Schema.CATS[i].items) addRow(item)
              }

              private fun addRow(item: Schema.Item) {
                  val row = LinearLayout(act)
                  row.orientation = LinearLayout.HORIZONTAL; row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(px(2f), px(6f), px(2f), px(6f))
                  val lb = TextView(act); lb.text = item.label; lb.setTextColor(cFg); lb.textSize = 12f; lb.typeface = Typeface.DEFAULT_BOLD
                  val vt = TextView(act); vt.setTextColor(cAc2); vt.textSize = 12f; vt.typeface = Typeface.DEFAULT_BOLD; vt.gravity = Gravity.END
                  row.addView(lb, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(vt, LinearLayout.LayoutParams(-2, -2))
                  list.addView(row, LinearLayout.LayoutParams(-1, px(44f)))
                  val cur = r.cfg.getK(item.key)
                  if (isToggle(item)) {
                      vt.text = if (cur > .5) "ON" else "OFF"
                      row.setOnClickListener {
                          val nv = if (r.cfg.getK(item.key) > .5) 0.0 else 1.0
                          vt.text = if (nv > .5) "ON" else "OFF"
                          apply(item, nv, true)
                      }
                      return
                  }
                  vt.text = fmt(item, cur)
                  val sl = LinearLayout(act)
                  sl.orientation = LinearLayout.HORIZONTAL; sl.gravity = Gravity.CENTER_VERTICAL
                  sl.visibility = if (openKey == item.key) View.VISIBLE else View.GONE
                  val stp = max(item.step, (item.max - item.min) / 2000000.0)
                  val n = max(1, ((item.max - item.min) / stp).roundToInt())
                  val sb = SeekBar(act)
                  sb.max = n
                  sb.progress = ((cur - item.min) / stp).roundToInt().coerceIn(0, n)
                  fun vOf(p: Int): Double = Math.round((item.min + p * stp) * 1e6) / 1e6
                  val mn = btn("\u2212", 38); val pl = btn("+", 38)
                  fun nudge(dir: Int) {
                      val p = (sb.progress + dir).coerceIn(0, n)
                      sb.progress = p
                      val v = vOf(p); vt.text = fmt(item, v); apply(item, v, true)
                  }
                  mn.setOnClickListener { nudge(-1) }; pl.setOnClickListener { nudge(1) }
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, user: Boolean) {
                          if (!user) return
                          val v = vOf(p); vt.text = fmt(item, v); pv.text = item.label + "   " + fmt(item, v)
                          apply(item, v, false)
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) { pv.text = item.label + "   " + fmt(item, r.cfg.getK(item.key)); peek(true) }
                      override fun onStopTrackingTouch(s: SeekBar?) { peek(false); apply(item, vOf(sb.progress), true) }
                  })
                  sl.addView(mn); sl.addView(sb, LinearLayout.LayoutParams(0, px(40f), 1f)); sl.addView(pl)
                  list.addView(sl, LinearLayout.LayoutParams(-1, -2))
                  row.setOnClickListener {
                      val was = sl.visibility == View.VISIBLE
                      openKey = if (was) null else item.key
                      showCat(ci)
                  }
              }

              /** final=true: simpan ke prefs + (bila setting dunia) regenerasi segera; false: hanya terapkan, regen ditunda 400 ms. */
              private fun apply(item: Schema.Item, v: Double, final: Boolean) {
                  r.setSetting(item.key, v, final)
                  if (!item.regen) return
                  regenRun?.let { h.removeCallbacks(it) }
                  if (final) { regenRun = null; r.requestRegen() }
                  else { val run = Runnable { r.requestRegen() }; regenRun = run; h.postDelayed(run, 400) }
              }

              private fun resetCat() {
                  var rg = false
                  for (item in Schema.CATS[ci].items) { r.resetSetting(item.key); if (item.regen) rg = true }
                  if (rg) r.requestRegen()
                  openKey = null; showCat(ci)
              }
          }
