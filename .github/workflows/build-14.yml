                      val s = (x ushr 16) and 0x8000
                      val e = ((x ushr 23) and 0xff) - 112
                      if (e <= 0) return s
                      if (e >= 31) return s or 0x7bff
                      return s or (e shl 10) or ((x ushr 13) and 0x3ff)
                  }
