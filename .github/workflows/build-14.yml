          package com.infinitepath.app

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import java.util.Random
          import kotlin.math.PI
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.tanh

          /** Ambience prosedural (angin, dedaunan, air, burung, jangkrik, katak, langkah, bawah air). Dibuat langsung sebagai PCM di thread terpisah. */
          class Audio(private val cfg: () -> Cfg) {
              @Volatile var day = 1f
              @Volatile var wind = 1f
              @Volatile var water = 0f
              @Volatile var under = false
              @Volatile var speed = 0f
              @Volatile var alt = 0f
              @Volatile var grounded = true
              @Volatile private var run = false
              private var th: Thread? = null
              private val SR = 22050

              fun start() {
                  if (run) return
                  run = true
                  th = Thread { loop() }.also { it.isDaemon = true; it.start() }
              }

              fun stop() {
                  run = false
                  try { th?.join(400) } catch (_: Throwable) {}
                  th = null
              }

              private fun loop() {
                  val at: AudioTrack = try {
                      val minB = AudioTrack.getMinBufferSize(SR, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      val tr = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_GAME).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(SR).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(max(minB, 8192))
                          .setTransferMode(AudioTrack.MODE_STREAM)
                          .build()
                      tr.play()
                      tr
                  } catch (_: Throwable) { run = false; return }
                  val rnd = Random(7)
                  val buf = ShortArray(1024)
                  var w1 = 0f; var w2 = 0f; var w3 = 0f; var bn = 0f; var u1 = 0f; var hp = 0f; var ft = 0f
                  var t = 0.0
                  var chL = 0; var chN = 1; var chF0 = 3000f; var chF1 = 3500f; var chPh = 0f
                  var crPh = 0f; var crPh2 = 0f; var frPh = 0f; var frPh2 = 0f
                  var stepIn = 0; var fL = 0
                  while (run) {
                      val c = cfg()
                      val on = c.getK("sndOn") > .5
                      val master = c.getK("sndMaster").toFloat()
                      val amb = c.getK("sndAmb").toFloat()
                      val tod = c.getK("sndTod").toFloat()
                      val dy = day; val nt = 1f - dy
                      val wv = min(2.2f, wind)
                      val gust = (.5f + .5f * sin(t * .35 + 1.0).toFloat()) * (.6f + .4f * sin(t * 1.13).toFloat())
                      val gustK = 1f + (gust - .5f) * c.getK("sndGust").toFloat()
                      val altK = 1f + c.getK("sndAlt").toFloat() * min(1.5f, max(0f, alt) / 35f)
                      val windG = c.getK("sndWind").toFloat() * (.07f + .16f * wv / 1.45f) * gustK * altK * amb
                      val folG = (c.getK("sndFol").toFloat() * (.5f * c.getK("sndLeaf").toFloat() + .5f * c.getK("sndGrass").toFloat())) * .10f * (wv / 1.45f) * (wv / 1.45f) * gustK * amb
                      val watG = water * c.getK("sndWater").toFloat() * .30f * amb
                      val birdRate = 1.4f * c.getK("sndBird").toFloat() * (1f - tod * .0f) * (dy * dy) * amb * (if (under) 0f else 1f)
                      val crG = c.getK("sndInsect").toFloat() * .035f * nt * tod * amb
                      val frG = c.getK("sndFrog").toFloat() * .09f * nt * min(1f, water * 3f) * tod * amb
                      val footG = c.getK("sndFoot").toFloat() * .55f
                      val hpd = c.getK("sndHP").toFloat() * .4f
                      val un = under
                      val underG = c.getK("sndUnder").toFloat()
                      val aLp = .02f + .10f * gust * wv / 1.45f
                      val sp = speed; val gr = grounded
                      for (i in 0 until buf.size) {
                          if (!on) { buf[i] = 0; continue }
                          val n = rnd.nextFloat() * 2f - 1f
                          w1 += (n - w1) * aLp; w3 += (w1 - w3) * .5f
                          var s = w3 * windG * 9f
                          w2 += (n - w2) * .35f
                          s += (n - w2) * folG
                          bn = (bn + .02f * n) / 1.02f
                          s += bn * watG * (.65f + .35f * sin(t * 3.1 + i * .0).toFloat()) * 7f
                          // burung
                          if (chL <= 0) {
                              if (rnd.nextFloat() < birdRate / SR) {
                                  chN = 1 + rnd.nextInt(3); chL = (SR * (.07f + rnd.nextFloat() * .09f)).toInt()
                                  chF0 = 2300f + rnd.nextFloat() * 2200f; chF1 = chF0 * (.7f + rnd.nextFloat() * .9f); chPh = 0f
                              }
                          } else {
                              val dur = 1600f
                              val fr = chF0 + (chF1 - chF0) * (1f - chL / dur).coerceIn(0f, 1f)
                              chPh += (2f * PI.toFloat() * fr) / SR
                              s += sin(chPh) * sin(PI.toFloat() * (chL / dur).coerceIn(0f, 1f)) * .11f * c.getK("sndBird").toFloat() * dy
                              chL--
                              if (chL <= 0 && chN > 1) { chN--; chL = (SR * .09f).toInt(); chF0 = chF0 * (.9f + rnd.nextFloat() * .25f); chF1 = chF0 * (.7f + rnd.nextFloat() * .9f) }
                          }
                          // jangkrik
                          if (crG > 0f) {
                              crPh += 2f * PI.toFloat() * 4300f / SR; crPh2 += 2f * PI.toFloat() * 26f / SR
                              val g = if (sin(crPh2) > .1f) 1f else 0f
                              s += sin(crPh) * g * crG
                          }
                          // katak
                          if (frG > 0f) {
                              frPh += 2f * PI.toFloat() * 230f / SR; frPh2 += 2f * PI.toFloat() * 7f / SR
                              val g = max(0f, sin(frPh2)) * max(0f, sin(frPh2 * .27f))
                              s += sin(frPh + sin(frPh * .5f) * 2f) * g * frG
                          }
                          // langkah
                          if (sp > .5f && gr && !un) {
                              stepIn--
                              if (stepIn <= 0) { fL = (SR * .09f).toInt(); stepIn = (SR * .62f * (4.4f / max(sp, 1f))).toInt() }
                          } else stepIn = 0
                          if (fL > 0) {
                              ft += (n - ft) * .18f
                              s += ft * (fL / (SR * .09f)) * footG
                              fL--
                          }
                          if (un) { u1 += (s - u1) * .035f; s = u1 * (1.8f + underG) * .9f + w1 * .15f * underG }
                          hp += (s - hp) * .25f
                          s = s * (1f - hpd) + hp * hpd
                          val o = tanh((s * master * 1.6f).toDouble()).toFloat()
                          buf[i] = (o * 28000f).toInt().coerceIn(-32768, 32767).toShort()
                          t += 1.0 / SR
                      }
                      try { at.write(buf, 0, buf.size) } catch (_: Throwable) { break }
                  }
                  try { at.stop(); at.release() } catch (_: Throwable) {}
              }
          }
          EOF


      - name: Signing keystore (stabil supaya update bisa ditimpa)
        id: ks
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ci.jks
            echo "keystore dari secret"
          elif [ -f ci.jks ]; then
            echo "keystore dari repo"
          else
            keytool -genkeypair -keystore ci.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=InfinitePath, O=Personal, C=ID"
            echo "gen=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Simpan keystore baru ke repo (sekali saja)
        if: steps.ks.outputs.gen == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f ci.jks
          git commit -m "ci: signing keystore"
          git push

      - name: Build release APK
        working-directory: android
        env:
          KS_FILE: ${{ github.workspace }}/ci.jks
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          gradle assembleRelease --no-daemon -PverCode=${{ github.run_number }} -PghRepo=${{ github.repository }} 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../InfinitePath.apk

      - name: Ringkasan error compile
        if: failure()
        run: |
          echo "===== ERROR KOMPILASI ====="
          grep -E '^e: ' build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -60 || true
          echo "==========================="

      - uses: actions/upload-artifact@v4
        with:
          name: InfinitePath-apk
          path: InfinitePath.apk

      - name: Publish release (dipakai updater di app)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: InfinitePath.apk
          make_latest: true
