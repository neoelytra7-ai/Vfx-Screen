                      'T' -> {
                          c.fillStyle(A)
                          c.beginPath(); c.ellipse(bx - 2.2 * s, by + 2, 2.8 * s, 5.4 * s, .28, 0.0, 6.3); c.fill()
                          c.beginPath(); c.ellipse(bx + 2.2 * s, by + 2, 2.8 * s, 5.4 * s, -.28, 0.0, 6.3); c.fill()
                          c.beginPath(); c.ellipse(bx, by + 1, 3 * s, 5.9 * s, 0.0, 0.0, 6.3); c.fill()
                          c.fillStyle(B); c.beginPath(); c.ellipse(bx, by - 2.6 * s, 1.8 * s, 2.6 * s, 0.0, 0.0, 6.3); c.fill()
                      }
                      'L' -> {
                          for (k in 0 until (if (n == 1) 60 else 30)) {
                              val a = R11() * 6.283; val r = sqrt(R11()) * 5.8 * s
                              dot(bx + cos(a) * r, by + sin(a) * r * .95, 1.15 + R11() * .7, if (k % 3 != 0) A else B)
                          }
                      }
                      'X' -> {
                          for (k in 0 until n) {
                              val a = k.toDouble() / n * 6.283 - 1.57; c.fillStyle(A); c.beginPath(); c.moveTo(bx, by)
                              c.quad(bx + cos(a - .35) * 4.5 * s, by + sin(a - .35) * 4.5 * s, bx + cos(a) * 7.2 * s, by + sin(a) * 7.2 * s)
                              c.quad(bx + cos(a + .35) * 4.5 * s, by + sin(a + .35) * 4.5 * s, bx, by); c.fill()
                          }
                          for (k in 0 until 5) dot(bx + cos(k * 1.3) * 2 * s, by + sin(k * 1.3) * 2 * s, .7, B)
                          dot(bx, by, 1.0, B)
                      }
                      'U' -> {
                          c.fillStyle(A); c.beginPath(); c.moveTo(bx - 1.8, by + 5 * s); c.lineTo(bx - 5.6 * s, by - 3.2 * s)
                          c.quad(bx, by - 6.2 * s, bx + 5.6 * s, by - 3.2 * s); c.lineTo(bx + 1.8, by + 5 * s); c.closePath(); c.fill()
                          c.fillStyle(B); c.beginPath(); c.ellipse(bx, by - 3.2 * s, 4.2 * s, 1.9 * s, 0.0, 0.0, 6.3); c.fill(); dot(bx, by - 3, 1.1, white55)
                      }
                      'N' -> {
                          for (k in 0 until n) { val a = k.toDouble() / n * 6.283; c.fillStyle(A); c.beginPath(); c.ellipse(bx + cos(a) * 7 * s, by + sin(a) * 7 * s, 4.4 * s, 1.6, a, 0.0, 6.3); c.fill() }
                          dot(bx, by, 4.6 * s, B)
                          for (k in 0 until 14) { val a = k * 2.4; val r = sqrt(k / 14.0) * 4; dot(bx + cos(a) * r, by + sin(a) * r, .55, Color.parseColor("#8a5a22")) }
                      }
                      'C' -> {
                          for (k in 0 until 22) {
                              val a = R11() * 6.283; val r = sqrt(R11()) * 6.4 * s; val x = bx + cos(a) * r; val y = by + sin(a) * r * .85
                              c.strokeStyle(Color.parseColor("#5a9a30")); c.lineWidth = .5; c.beginPath(); c.moveTo(16.0, by + 4); c.lineTo(x, y); c.stroke()
                              dot(x, y, 1.25, A); dot(x, y, .45, B)
                          }
                      }
                      'I' -> {
                          for (k in -1..1) { c.fillStyle(A); c.beginPath(); c.ellipse(bx + k * 2.4, by - 2.2, 1.9 * s, 4.4 * s, k * .22, 0.0, 6.3); c.fill() }
                          for (k in intArrayOf(-1, 1)) { c.fillStyle(A); c.beginPath(); c.ellipse(bx + k * 4.6, by + 2.4, 3.6 * s, 2.3 * s, k * .9, 0.0, 6.3); c.fill() }
                          c.fillStyle(B); c.beginPath(); c.ellipse(bx, by + 3, 1.5, 3.1, 0.0, 0.0, 6.3); c.fill()
                      }
                      'E' -> {
                          var r = 6.2 * s; var k = 0
                          while (r > .8) {
                              c.fillStyle(if (k % 2 == 1) A else B); c.beginPath(); c.arc(bx + sin(k.toDouble()) * .5, by + cos(k.toDouble()) * .5, r, 0.0, 6.3); c.fill()
                              c.strokeStyle(Color.argb(46, 0, 0, 0)); c.lineWidth = .5; c.stroke()
                              r -= 1.15; k++
                          }
                      }
                      'H' -> {
                          c.fillStyle(Color.parseColor("#5a8a30")); c.beginPath(); c.ellipse(bx, by + 3.4, 3.6, 3.1, 0.0, 0.0, 6.3); c.fill()
                          c.strokeStyle(A); c.lineWidth = .9
                          for (k in -6..6) { c.beginPath(); c.moveTo(bx + k * .35, by + 2); c.lineTo(bx + k * .95 * s, by - 5.4 * s + abs(k) * .35); c.stroke() }
                      }
                      'F' -> {
                          c.strokeStyle(B); c.lineWidth = .55
                          for (k in 0 until 26) {
                              val a = k / 26.0 * 6.283
                              c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + cos(a) * 6.4 * s, by + sin(a) * 6.4 * s); c.stroke()
                              dot(bx + cos(a) * 6.4 * s, by + sin(a) * 6.4 * s, .7, A)
                          }
                          dot(bx, by, 1.2, B)
                      }
                      'Q' -> {
                          for (L in 0 until 2) for (k in 0 until 7) {
                              val a = -2.6 + k * .72 - (if (L == 1) .36 else 0.0); val r = if (L == 1) 4.4 else 6.0
                              c.fillStyle(A); c.globalAlpha = if (L == 1) 1.0 else .88
                              c.beginPath(); c.ellipse(bx + cos(a) * r * .55 * s, by + 3 + sin(a) * r * .7 * s, 1.6 * s, r * .62 * s, a + 1.57, 0.0, 6.3); c.fill()
                          }
                          c.globalAlpha = 1.0; dot(bx, by + 2, 1.8 * s, B)
                      }
                      else -> dot(bx, by, 3.0, A)
                  }
              }

