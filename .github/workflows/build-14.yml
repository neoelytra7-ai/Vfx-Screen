                      b = if (BM < .3) 2 else if (BM < .5) 3 else 7
                  }
                  if (!(S.d(BK[b]) > .5)) b = if (S.d("bFor") > .5) 0 else 1
                  return b
              }

              // ---------- pantai ----------
              private fun bandH(x: Double, z: Double) = S.beachW * S.beach * (.6 + .9 * fn(x * .02 + 11, z * .02 - 4, 120.0, 2))
              private fun bchRock(x: Double, z: Double) = S.beachRock > 0 && fn(x * .012 + 3, z * .012 + 9, 121.0, 2) > 1 - S.beachRock * .45
              private fun beachShape(hv: Double, x: Double, z: Double): Double {
                  if (S.beach <= 0 || bchRock(x, z)) return hv
                  val sl = S.sea + 1; val d = hv - sl; val bw = max(1.2, S.beachW * S.beach) * 1.8
                  if (d >= bw || d <= -7) return hv
                  val k = 1 - .72 * min(1.0, S.beachSlope)
                  val g: Double
                  if (d >= 0) {
                      val s = sst(0.0, bw, d); g = d * (k + (1 - k) * s)
                  } else {
                      val s = sst(0.0, 7.0, -d); val k2 = min(1.0, k * 1.15); g = d * (k2 + (1 - k2) * s)
                  }
                  return sl + g
              }

              // ---------- terrain ----------
              fun hBase(x: Int, z: Int): Int {
                  val xd = x.toDouble(); val zd = z.toDouble()
                  val o = SV * 137.3; val f = S.freq
                  val n = fn(xd * f + o, zd * f + o, 1.0, 5)
                  val m = fn(xd * f * .5 + 9 + o, zd * f * .5 + o, 20.0, 3)
                  var hv = 4 + n * S.hscale + max(0.0, m - S.mtnTh) * 45 * S.mtnAmt
                  if (S.biomeOn > .5 && S.dune > 0) {
                      biomeAt(xd, zd)
                      if (BDS > 0) {
                          val dn = fn(xd * .028 + o * .1, zd * .05 - o * .2, 131.0, 3)
                          val tg = S.sea + 3 + (1 - abs(dn * 2 - 1)) * 7
                          hv += (tg - hv) * min(1.0, BDS * 1.2) * min(1.0, S.dune)
                      }
                  }
                  hv = beachShape(hv, xd, zd)
                  return min((H - 14).toDouble(), max(1.0, floor(hv))).toInt()
              }

              private fun rwAt(x: Double, z: Double): Double {
                  val o = SV * 57.7 + 3.1
                  return SL() + .6 + 4 * fn(x * .012 + o, z * .012 - o, 44.0, 2)
              }

              private fun rvF(x: Double, z: Double): Double {
                  val o = SV * 57.7 + 3.1
                  val wx = fn(x * .017 + o, z * .017 + 7.7, 41.0, 2) - .5
                  val wz = fn(x * .017 - 5.3, z * .017 + o, 43.0, 2) - .5
                  val s = fn((x + wx * 70) * .0105 + o, (z + wz * 70) * .0105 - o, 40.0, 3)
                  val f = S.freq; val oo = SV * 137.3
                  RHL = 4 + fn(x * f + oo, z * f + oo, 1.0, 2) * S.hscale
                  RRW = rwAt(x, z)
                  return s + KAP * (RHL - RRW)
              }

              // RV: 0 jarak, 1 setengah lebar, 2 tepi, 3 muka air, 4 aliran X, 5 aliran Z
              fun river(x: Double, z: Double) {
                  val e = 1.5
                  val s0 = rvF(x, z); val hlo = RHL
                  val sx = rvF(x + e, z); val sz = rvF(x, z + e)
                  val gx = (sx - s0) / e; val gz = (sz - s0) / e
                  val gl = max(sqrt(gx * gx + gz * gz), 8e-4)
                  val L = if (S.riv <= 1.05) LV[0] else if (S.riv <= 1.6) LV[1] else LV[2]
                  var dm = 1e9; var cn = .5
                  for (i in L.indices) {
                      val dd = abs(s0 - L[i]) / gl
                      if (dd < dm) { dm = dd; cn = L[i] }
                  }
                  val k = (s0 - cn) / (gl * gl)
                  val rw = rwAt(x - k * gx, z - k * gz)
                  val wn = fn(x * .03 + 11, z * .03 - 7, 45.0, 2)
                  val tx = -gz / gl; val tz = gx / gl
                  val dot = tx * GDX + tz * GDZ
                  val fl = max(-1.0, min(1.0, dot * 2.5))
                  RV[0] = dm
                  RV[1] = (2.2 + 2.2 * wn) * S.rivW
                  RV[2] = (4.5 + .5 * max(0.0, hlo - rw)) * S.rivW
                  RV[3] = rw
                  RV[4] = tx * fl
                  RV[5] = tz * fl
              }

              /** muka air di posisi nyata; WRV = pengaruh sungai 0..1, WFX/WFZ = arah aliran */
              fun WSv(x: Double, z: Double): Double {
                  WRV = 0.0; WFX = 0.0; WFZ = 0.0
                  if (S.riv <= 0) return SL()
                  river(x, z)
                  val d = RV[0]; val hw = RV[1]; val bk = RV[2]
                  if (d >= hw + bk) return SL()
                  val u = if (d < hw) 0.0 else sst(0.0, 1.0, (d - hw) / bk)
                  WRV = 1 - u
                  WFX = RV[4] * WRV; WFZ = RV[5] * WRV
                  return RV[3] + (SL() - RV[3]) * u
              }

              /** rekaman kolom: h(6 bit) | flags<<6 | round(ws*64)<<10 */
              fun colRec(x: Int, z: Int): Int {
                  val k = (x + 1048576L) * 2097152L + (z + 1048576L)
                  val c = HC.get(k)
                  if (c != Int.MIN_VALUE) return c
                  var h = hBase(x, z)
                  var ws = SL()
                  var fl = 0
                  if (S.riv > 0) {
                      river(x + .5, z + .5)
                      val d = RV[0]; val hw = RV[1]; val bk = RV[2]; val rw = RV[3]
                      if (d < hw + bk) {
                          if (d < hw) {
                              val q = d / hw
                              h = floor(rw - .4 - S.rivD * (1 - q * q)).toInt() - 1
                              ws = rw
                              fl = if (d < hw * 1.05) 3 else 2
                          } else {
                              val u = sst(0.0, 1.0, (d - hw) / bk)
                              val cr = ceil(rw + .05).toInt() - 1
                              h = jr(cr + (h - cr) * u).toInt()
                              ws = rw + (SL() - rw) * u
                              fl = 2
                          }
                          h = max(1, min(H - 14, h))
                      }
                  }
                  val v = h or (fl shl 6) or (jr(ws * 64).toInt() shl 10)
                  if (HC.size > (if (S.lowRam > 0) 120000 else 400000)) HC.clear()
                  HC.put(k, v)
                  return v
              }

              fun hfn(x: Int, z: Int): Int = colRec(x, z) and 63
              fun hfnD(x: Double, z: Double): Int = colRec(floor(x).toInt(), floor(z).toInt()) and 63
              fun wsCol(x: Double, z: Double): Double = (colRec(floor(x).toInt(), floor(z).toInt()) ushr 10) / 64.0
              /** tinggi permukaan air di (x,z) bila ada air di atas tanah, selain itu -1e9 */
              fun waterY(x: Double, z: Double): Double {
                  val r = colRec(floor(x).toInt(), floor(z).toInt())
                  val h = r and 63; val ws = (r ushr 10) / 64.0
                  return if (h + 1 < ws - .02) ws else -1e9
              }

              // ---------- permukaan / blok atas ----------
              fun surf(x: Int, z: Int, h: Int, fl: Int, ws: Double): Int {
                  val tp = h + 1; val sl = SL()
                  val xd = x.toDouble(); val zd = z.toDouble()
                  val b = biomeAt(xd + .5, zd + .5)
                  if (tp < ws - .02) return if ((fl and 1) != 0) 10 else (if (bchRock(xd, zd) && ws <= sl + .05) 10 else 7)
                  if (tp <= ws + (if ((fl and 2) != 0) 1.15 else .7)) return 11
                  val bt = if (S.beach > 0 && ws <= sl + .05) sl + 1.15 + bandH(xd, zd) else ws + 1.15
                  if (tp <= bt) {
                      if (S.beach > 0 && ws <= sl + .05) {
                          if (bchRock(xd, zd)) return 10
                          if (S.biomeOn > .5) {
                              if (BT < .27) return 10
                              if (b == 6) return 11
                          }
                      }
                      return 7
                  }
                  if (h >= S.snowLine) return 12
                  if (h >= S.rockLine) return 3
                  if (S.biomeOn > .5) {
                      fun q(sd: Double, f: Double) = fn(xd * f + sd, zd * f - sd, (sd.toInt()).toDouble(), 2)
                      if (b == 2) return if (q(122.0, .02) > .62) 13 else 7
                      if (b == 5) return if (q(123.0, .06) > .58) 1 else 12
                      if (b == 4) return if (q(124.0, .08) > .55) 14 else 1
                      if (b == 9) return if (q(125.0, .08) > .6) 14 else 1
                      if (b == 6) return if (q(126.0, .07) > .55) 11 else 1
                  }
                  return 1
              }

              // ---------- pohon (penempatan) ----------
              private fun treeAt0(x: Int, z: Int): Int {
                  val xd = x.toDouble(); val zd = z.toDouble()
                  val f = fn(xd * .07 + 50, zd * .07, 3.0, 3)
                  val r = hs(xd * 1.9 + SV, zd * 2.3, 5.0)
                  val r2 = hs(xd * 2.7, zd * 1.1 + SV, 6.0)
                  val tpF: Double = if (f > .5) .05 else .007
                  val bpF: Double = if (f > .4) .04 else .012
                  if (S.biomeOn < .5) {
                      if (r < tpF * S.tree) {
                          val v = S.treeVar
                          if (v <= 0) return 1
                          val r3 = hs(xd * 3.3 + 9, zd * 1.7 + SV, 8.0)
                          val rel = (hfn(x, z) - S.sea) / max(8.0, S.hscale)
                          val m = fn(xd * .03 + 11, zd * .03 - 5, 13.0, 3)
                          if (rel > .9 && r3 < .5) return 0
                          if (r3 < .035 * S.treeGiant * v) return 5
                          if (rel > .62 || m > .74) return 3
                          if (m < .26) return 4
                          if (rel < .14 && r3 < .6) return 6
                          return 1
                      }
                      if (r2 < bpF * S.tree * S.bushD) return 2
                      return 0
                  }
                  val jx = (hs(xd * 1.3, zd * .7, 21.0) - .5) * 30
                  val jz = (hs(xd * .9, zd * 1.7, 22.0) - .5) * 30
                  val b = biomeAt(xd + jx, zd + jz)
                  val btv = BT
                  if (S.beach > 0 && S.beachPalm > 0 && btv > .42 && r < .012 * S.beachPalm) {
                      val hh = hfn(x, z)
                      if (hh + 1 >= S.sea + 1.6 && hh + 1 <= S.sea + 2.15 + S.beachW * S.beach) return if (S.d("tPalm") > 0) 6 else 0
                  }
                  if (r < tpF * S.tree * CBP[b][0]) {
                      val v = S.treeVar
                      if (v <= 0) return 1
                      val r3 = hs(xd * 3.3 + 9, zd * 1.7 + SV, 8.0)
                      val rel = (hfn(x, z) - S.sea) / max(8.0, S.hscale)
                      val m = fn(xd * .03 + 11, zd * .03 - 5, 13.0, 3)
                      biomeAt(xd, zd)
                      if (rel > .9 && r3 < .5) return 0
                      if (r3 < .035 * S.treeGiant * v && (b == 0 || b == 1 || b == 9 || b == 8)) return if (S.d("tOak") > 0) 5 else 0
                      if ((rel > .62 || m > .74) && (b == 0 || b == 1 || b == 9 || b == 8)) return if (BT < .4) 15 else 3
                      var tot = 0.0
                      val T = TB[b]
                      for (e in T) tot += e[1] * S.d(KW[e[0].toInt()]!!)
                      if (tot <= 0) return 0
                      var u = hs(xd * 5.1 + 3, zd * 4.3 + SV, 11.0) * tot
                      for (e in T) {
                          u -= e[1] * S.d(KW[e[0].toInt()]!!)
                          if (u <= 0) return e[0].toInt()
                      }
                      return T[0][0].toInt()
                  }
                  if (r2 < bpF * S.tree * S.bushD * CBP[b][1]) return 2
                  return 0
              }

              fun treeAt(x: Int, z: Int): Int {
                  val k = (x + 1048576L) * 2097152L + (z + 1048576L)
                  var v = TC.get(k)
                  if (v == Int.MIN_VALUE) {
                      v = treeAt0(x, z)
                      if (TC.size > (if (S.lowRam > 0) 150000 else 400000)) TC.clear()
                      TC.put(k, v)
                  }
                  return v
              }

              // rumput: [tile, tinggi, lebar]
              fun gSp(x: Double, z: Double, y: Int, u: Double): DoubleArray {
                  val v = S.grassVar
                  val m = fn(x * .045 + 3, z * .045 - 8, 71.0, 2)
                  val el = min(1.0, max(0.0, (y - S.sea) / max(8.0, S.hscale)))
                  if (y < S.sea + 3.5 && u < .5 * v) return doubleArrayOf(18.0, 1.7, .9)
                  if (m > .68 && u < .8 * v) return doubleArrayOf(19.0, .85, 1.5)
                  if (m < .28 && u < .7 * v) return doubleArrayOf(21.0, 1.0, 1.1)
                  if (el > .6 && u < .6 * v) return doubleArrayOf(22.0, .45, 1.1)
                  if (u < .16 * v) return doubleArrayOf(20.0, 1.1, 1.3)
                  if (u > .9 && m > .4) return doubleArrayOf(23.0, 1.6, 1.2)
                  if (u > .83) return doubleArrayOf(24.0, 1.3, .9)
                  return doubleArrayOf(9.0, 1.0, 1.0)
              }

              /** tint biome -> out[0..2] */
              fun bTintF(x: Double, z: Double, o: DoubleArray) {
                  if (S.biomeOn < .5 || S.bTint <= 0) { o[0] = 1.0; o[1] = 1.0; o[2] = 1.0; return }
                  val b = biomeAt(x, z)
                  val t = (BT - .5) * 2; val m = (BM - .5) * 2
                  val hot = max(t, 0.0); val cold = max(-t, 0.0); val dry = max(-m, 0.0); val wet = max(m, 0.0); val k = S.bTint
                  var r = 1 + k * (.42 * hot * dry + .12 * hot - .28 * cold - .1 * wet)
                  var gg = 1 + k * (.12 * hot * dry - .04 * hot + .02 * cold + .1 * wet)
                  var bb = 1 + k * (-.5 * hot * dry - .1 * hot - .1 * wet)
                  if (b == 9) { r *= 1 + .25 * k; gg *= 1 - .12 * k; bb *= 1 - .25 * k }
                  else if (b == 6) { r *= 1 - .18 * k; gg *= 1 - .1 * k; bb *= 1 - .3 * k }
                  o[0] = r; o[1] = gg; o[2] = bb
              }

              /** warna rumput/daun lokal (gT) -> out */
              fun gT(x: Double, z: Double, o: DoubleArray) {
                  val t = fn(x * .09, z * .09, 33.0, 3)
                  val g0 = 1.08 + (.6 - 1.08) * t
                  val g1 = 1.0 + (1.08 - 1.0) * t
                  val g2 = .55 + (.7 - .55) * t
                  bTintF(x, z, o)
                  o[0] *= g0; o[1] *= g1; o[2] *= g2
              }

              fun treeOK(x: Int, z: Int, k: Int): Boolean {
                  val r = colRec(x, z); val h = r and 63; val ws = (r ushr 10) / 64.0
                  if (inRuin(x.toDouble(), z.toDouble())) return false
                  if (k == 17) return h + 1 > ws - 1.3 && h + 1 < ws + 1.1
                  if (k == 6) return h + 1 > ws + .35 && h < S.rockLine
                  return h + 1 > ws + 1.15 && h < S.rockLine
              }

              // ---------- reruntuhan ----------
              class Ruin(
                  val x: Int, val z: Int, val h: Int, val b: Int, val t: Int, val rad: Int, val rot: Int,
                  val sd: Double, val brx: Int, val brz: Int
              )

              private val RTAB: Array<Array<Pair<String, Double>>> = arrayOf(
                  arrayOf("ruinTower" to .8, "ruinHouse" to 1.0, "ruinArch" to .8, "ruinHenge" to .5, "ruinShrine" to 0.0),
                  arrayOf("ruinHenge" to 1.0, "ruinArch" to 1.0, "ruinHouse" to .8, "ruinTower" to .3),
                  arrayOf("ruinTemple" to 1.2, "ruinTower" to .8, "ruinArch" to .8, "ruinRound" to .5),
                  arrayOf("ruinHenge" to 1.0, "ruinHouse" to .6, "ruinArch" to .8, "ruinRound" to .4),
                  arrayOf("ruinCabin" to 1.2, "ruinTower" to .7, "ruinHouse" to .6),
                  arrayOf("ruinCabin" to 1.0, "ruinArch" to .7, "ruinTower" to .6),
                  arrayOf("ruinTemple" to .9, "ruinHouse" to 1.0, "ruinTower" to .7, "ruinRound" to .5),
                  arrayOf("ruinTemple" to 1.4, "ruinArch" to .8, "ruinRound" to .8, "ruinTower" to .4),
                  arrayOf("ruinShrine" to 1.5, "ruinHouse" to .7, "ruinArch" to .6),
                  arrayOf("ruinHouse" to 1.0, "ruinTower" to .8, "ruinCabin" to .8, "ruinHenge" to .5, "ruinArch" to .5)
              )
              private val RTN = mapOf(
                  "ruinTower" to 0, "ruinHouse" to 1, "ruinArch" to 2, "ruinTemple" to 3,
                  "ruinHenge" to 4, "ruinCabin" to 5, "ruinShrine" to 6, "ruinRound" to 7
              )
              private val RRAD = intArrayOf(5, 6, 7, 8, 7, 5, 6, 5)
              private val RROT = arrayOf(intArrayOf(1, 0, 0, 1), intArrayOf(0, -1, 1, 0), intArrayOf(-1, 0, 0, -1), intArrayOf(0, 1, -1, 0))

              fun ruinAt(cx: Int, cz: Int): Ruin? {
                  if (RUC.size > 400) RUC.clear()
                  val key = cx * 65536L + cz
                  if (RUC.containsKey(key)) return RUC[key]
                  var R: Ruin? = null
                  if (S.ruinOn > .5 && hs(cx * 7.31 + SV, cz * 3.77, 41.0) < .42 * S.ruinDens) {
                      val x = cx * RCELL + 15 + floor(hs(cx * 1.9, cz * 5.3 + SV, 42.0) * (RCELL - 30)).toInt()
                      val z = cz * RCELL + 15 + floor(hs(cx * 4.1 + SV, cz * 2.3, 43.0) * (RCELL - 30)).toInt()
                      val rc = colRec(x, z); val h = rc and 63; val ws = (rc ushr 10) / 64.0
                      if (h + 1 > ws + 1.2 && h < S.rockLine + 6) {
                          var mn = 99; var mx_ = 0; var ok = true
                          val offs = arrayOf(intArrayOf(-7, -7), intArrayOf(7, -7), intArrayOf(-7, 7), intArrayOf(7, 7), intArrayOf(0, 0))
                          for (o in offs) {
                              val q = colRec(x + o[0], z + o[1]); val hh = q and 63; val w2 = (q ushr 10) / 64.0
                              mn = min(mn, hh); mx_ = max(mx_, hh)
                              if (hh + 1 < w2 + .5) ok = false
                          }
                          if (ok && mx_ - mn <= 4) {
                              val b = biomeAt(x.toDouble(), z.toDouble())
                              val tab = RTAB[b]
                              var tot = 0.0
                              for (e in tab) tot += e.second * S.d(e.first)
                              if (tot > 0) {
                                  var u = hs(cx * 2.7, cz * 1.3 + SV, 44.0) * tot
                                  var ty = tab[0].first
                                  for (e in tab) {
                                      u -= e.second * S.d(e.first)
                                      if (u <= 0) { ty = e.first; break }
                                  }
                                  val t = RTN[ty]!!
                                  R = Ruin(
                                      x, z, max(mn, min(mx_, h)), b, t, RRAD[t] + 1,
                                      floor(hs(cx * 9.1, cz * 3.3, 45.0) * 4).toInt(),
                                      hs(cx * 5.5, cz * 8.2, 46.0) * 1000,
                                      if (hs(cx.toDouble(), cz.toDouble(), 47.0) < .5) -1 else 1,
                                      if (hs(cx + 3.0, cz.toDouble(), 48.0) < .5) -1 else 1
                                  )
                              }
                          }
                      }
                  }
                  RUC[key] = R
                  return R
              }

              fun inRuin(x: Double, z: Double): Boolean {
                  val R = ruinAt(floor(x / RCELL).toInt(), floor(z / RCELL).toInt()) ?: return false
                  return abs(x - R.x) <= R.rad && abs(z - R.z) <= R.rad
              }

              // ---------- penyimpanan voxel (akses thread pemilik) ----------
              private var lcv: ByteArray? = null
              private var lcx = 1000000000
              private var lcz = 1000000000

              fun get(x: Int, y: Int, z: Int): Int {
                  if (y < 0 || y >= H) return 0
                  val cx = x shr 4; val cz = z shr 4
                  if (cx != lcx || cz != lcz) { lcx = cx; lcz = cz; lcv = VOX[ck(cx, cz)] }
                  val v = lcv ?: return 0
                  return v[(x and 15) + 16 * ((z and 15) + 16 * y)].toInt() and 255
              }

              /** padat/tidak untuk fisika & kamera; di luar chunk termuat pakai heightfield */
              fun getP(xd: Double, yd: Double, zd: Double): Int {
                  val x = floor(xd).toInt(); val y = floor(yd).toInt(); val z = floor(zd).toInt()
                  if (y < 0) return 3
                  if (y >= H) return 0
                  val c = VOX[ck(x shr 4, z shr 4)]
                  if (c != null) return c[(x and 15) + 16 * ((z and 15) + 16 * y)].toInt() and 255
                  return if (y <= hfn(x, z)) 3 else 0
              }

              fun setVox(cx: Int, cz: Int, v: ByteArray) { VOX[ck(cx, cz)] = v; lcx = 1000000000 }
              fun clearVox() { VOX.clear(); CARD.clear(); lcx = 1000000000 }
              fun invalidate() { lcx = 1000000000 }
              fun dropVox(cx: Int, cz: Int) { VOX.remove(ck(cx, cz)); lcx = 1000000000 }

              fun setEdit(x: Int, y: Int, z: Int, id: Int) {
                  if (y < 0 || y >= H) return
                  val cx = x shr 4; val cz = z shr 4; val k = ck(cx, cz)
                  val q = (x and 15) + 16 * ((z and 15) + 16 * y)
                  val m = EDIT.getOrPut(k) { HashMap() }
                  m[q] = id
                  VOX[k]?.set(q, id.toByte())
                  lcx = 1000000000
              }
              fun clearEdits() { EDIT.clear() }
          }
          EOF

          cat > $P/java/com/infinitepath/app/Gen.kt <<'EOF'
          package com.infinitepath.app

          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.sqrt

          /** Generator voxel per chunk: tanah, reruntuhan, pohon. Port 1:1 dari voxGen()/buildRuin() HTML v18. */
          class Gen(private val c: Core) {
              private val S = c.S
              private val CS = Core.CS
              private val H = Core.H
              private val RCELL = Core.RCELL
              private val RROT = arrayOf(intArrayOf(1, 0, 0, 1), intArrayOf(0, -1, 1, 0), intArrayOf(-1, 0, 0, -1), intArrayOf(0, 1, -1, 0))

              // chunk yang sedang dibangun
              private var gv = ByteArray(0)
              private var gx0 = 0
              private var gz0 = 0
              private var cards = ArrayList<DoubleArray>()

              private fun put(x: Int, y: Int, z: Int, i: Int) {
                  val lx = x - gx0; val lz = z - gz0
                  if (lx < 0 || lx >= CS || lz < 0 || lz >= CS || y < 0 || y >= H) return
                  val q = lx + CS * (lz + CS * y)
                  if (i == 5 && gv[q].toInt() != 0) return
                  gv[q] = i.toByte()
              }

              // ===================== REruntuhan =====================
              private fun ruinPass(x0: Int, z0: Int) {
                  if (S.ruinOn < .5) return
                  val ax = floor((x0 - 12.0) / RCELL).toInt(); val bx = floor((x0 + CS + 12.0) / RCELL).toInt()
                  val az = floor((z0 - 12.0) / RCELL).toInt(); val bz = floor((z0 + CS + 12.0) / RCELL).toInt()
                  for (cx in ax..bx) for (cz in az..bz) {
                      val R = c.ruinAt(cx, cz) ?: continue
                      if (R.x + R.rad < x0 || R.x - R.rad >= x0 + CS || R.z + R.rad < z0 || R.z - R.rad >= z0 + CS) continue
                      buildRuin(R)
                  }
              }

              private fun buildRuin(R: Core.Ruin) {
                  val m = RROT[R.rot]; val b = R.b
                  val cold = b == 4 || b == 5; val sand = b == 2 || b == 3; val wet = b == 6 || b == 7
                  val W = if (sand) 20 else 18
                  val MS = if (sand) 20 else 19
                  val wood = if (b == 8) 22 else 21
                  val mp = min(1.0, (if (wet) .55 else if (b == 0 || b == 9 || b == 8) .25 else if (cold) .05 else if (sand) 0.0 else .12) * S.ruinMoss)
                  val vp = (if (wet) .5 else if (b == 0) .18 else if (b == 9 || b == 8) .1 else .02) * S.ruinVines
                  val dec = S.ruinDecay

                  fun rp(u: Int, y: Int, v: Int, id: Int) = put(R.x + u * m[0] + v * m[1], R.h + y, R.z + u * m[2] + v * m[3], id)
                  fun r(a: Int, cc: Int, d: Int): Double = c.hs(R.sd + a * 13.7 + cc * 5.1, d * 9.3 + cc * 2.9, 77.0)
                  fun keep(u: Int, y: Int, v: Int, hh: Int): Boolean {
                      val q = y.toDouble() / hh
                      var p = max(q, 0.0).pow(1.5) * dec * 1.25 + dec * .1
                      if (R.brx * u + R.brz * v > R.rad * .45 && y > 2) p += .45 * dec * 2
                      return r(u, y, v) >= p
                  }
                  fun wall(u: Int, y: Int, v: Int): Int = if (r(u, y, v + 3) < mp) MS else W
                  fun vine(u: Int, y: Int, v: Int) {
                      if (vp > 0 && r(u, y, v + 9) < vp * .22) {
                          rp(u, y + 1, v, 5)
                          if (r(u, y, v + 11) < .5) rp(u, y + 2, v, 5)
                      }
                  }
                  fun clr(w: Int, d: Int, hh: Int) {
                      for (u in -w..w) for (v in -d..d) for (y in 1..hh) rp(u, y, v, 0)
                  }
                  fun rub(w: Int, n: Int) {
                      for (i in 0 until n) {
                          val a = r(i, 1, 1) * 6.28; val d = w + 1 + r(i, 2, 2) * 3
                          rp(jr(cos(a) * d).toInt(), 1, jr(sin(a) * d).toInt(), 23)
                      }
                  }
                  fun fnd(w: Int, d: Int) {
                      for (u in -w..w) for (v in -d..d) {
                          val X = R.x + u * m[0] + v * m[1]; val Z = R.z + u * m[2] + v * m[3]
                          val g = c.hfn(X, Z)
                          for (y in g until R.h) put(X, y, Z, 3)
                      }
                  }

                  val t = R.t
                  if (t == 0 || t == 7) {
                      val rnd = t == 7; val w = 3
                      val hh = (if (rnd) 11 else 9) + floor(r(1, 1, 1) * 5).toInt()
                      clr(w + 1, w + 1, hh + 2); fnd(w + 1, w + 1)
                      val ex = w + (if (rnd) 1 else 0)
                      for (y in 0..hh) for (u in -ex..ex) for (v in -ex..ex) {
                          val rr = hypot(u.toDouble(), v.toDouble())
                          val edge = if (rnd) (rr >= w - .4 && rr <= w + .7) else max(abs(u), abs(v)) == w
                          if (y == 0) { if (if (rnd) rr <= w + .7 else true) rp(u, 0, v, W); continue }
                          if (!edge) continue
                          if (y <= 2 && u <= -w && abs(v) <= 0) continue
                          if ((y == 4 || y == 7 || y == 10) && ((abs(u) <= 0 && abs(v) >= w - .4) || (abs(v) <= 0 && abs(u) >= w - .4))) continue
                          if (!keep(u, y, v, hh)) continue
                          rp(u, y, v, wall(u, y, v))
                          if (y == hh || !keep(u, y + 1, v, hh)) vine(u, y, v)
                      }
                      for (fy in intArrayOf(4, 8)) if (fy < hh) for (u in -w + 1 until w) for (v in -w + 1 until w)
                          if (keep(u, fy, v, hh) && r(u, fy, v) < .65) rp(u, fy, v, wood)
                      rub(w, 16)
                  } else if (t == 1) {
                      val hh = 4
                      clr(5, 4, 9); fnd(5, 4)
                      for (u in -4..4) for (v in -3..3) if (r(u, 0, v) < .75) rp(u, 0, v, if (u > 0) W else wood)
                      for (y in 1..hh + 4) for (u in -4..4) for (v in -3..3) {
                          val edge = abs(u) == 4 || abs(v) == 3; val rf = hh + 1 + (3 - abs(v))
                          if (y <= hh && edge) {
                              if (u == -4 && abs(v) <= 0 && y <= 2) continue
                              if ((y == 2 || y == 3) && ((abs(v) == 3 && abs(u) <= 1) || (abs(u) == 4 && abs(v) <= 1 && u > 0))) continue
                              if (!keep(u, y, v, hh + 4)) continue
                              rp(u, y, v, wall(u, y, v))
                          } else if (y > hh && y <= rf + 0 && (abs(u) == 4 && y < rf) && keep(u, y, v, hh + 4)) {
                              rp(u, y, v, W)
                          } else if (y == rf && y > hh && keep(u, y, v, hh + 4) && r(u, y, v) < .8) {
                              rp(u, y, v, wood)
                          }
                      }
                      for (y in 1..hh + 3) if (keep(3, y, 2, hh + 3)) rp(3, y, 2, W)
                      rub(5, 12)
                  } else if (t == 2) {
                      clr(8, 2, 9); fnd(8, 2)
                      for (s in intArrayOf(-3, 3)) for (y in 1..6) for (v in 0..1) if (keep(s, y, v, 6)) rp(s, y, v, wall(s, y, v))
                      for (u in -3..3) for (y in 7..8) for (v in 0..1) {
                          val arch = abs(u) >= 2 || y == 8
                          if (arch && keep(u, y, v, 8) && r(u, y, v) < .9) rp(u, y, v, W)
                      }
                      for (sd in intArrayOf(-1, 1)) for (k in 4..8) {
                          val hh = max(0, 3 - floor(k / 3.0).toInt() + floor(r(k, sd, 3) * 2).toInt())
                          for (y in 1..hh) if (keep(sd * k, y, 0, 4)) rp(sd * k, y, 0, wall(sd * k, y, 0))
                      }
                      rub(6, 14)
                  } else if (t == 3) {
                      val tier = intArrayOf(6, 4, 3, 2)
                      clr(7, 7, 18); fnd(7, 7)
                      for (ti in 0 until 4) {
                          val s = tier[ti]
                          for (y in ti * 3 + 1..ti * 3 + 3) for (u in -s..s) for (v in -s..s) {
                              if (y > ti * 3 + 1 && abs(u) < s && abs(v) < s && y < ti * 3 + 3) continue
                              if (!keep(u, y, v, 13)) continue
                              rp(u, y, v, wall(u, y, v))
                          }
                      }
                      for (ti in 0 until 3) for (v in -1..1) rp(tier[ti] + 0, ti * 3 + 1, v, W)
                      val cor = arrayOf(intArrayOf(-1, -1), intArrayOf(1, -1), intArrayOf(-1, 1), intArrayOf(1, 1))
                      for (cc in cor) for (y in 11..14) if (keep(cc[0], y, cc[1], 14)) rp(cc[0], y, cc[1], wall(cc[0], y, cc[1]))
                      for (u in -2..2) for (v in -2..2) if (keep(u, 15, v, 15) && r(u, 15, v) < .7) rp(u, 15, v, W)
                      for (k in 0 until 20) {
                          val u = jr((r(k, 1, 5) - .5) * 14).toInt(); val v = jr((r(k, 2, 5) - .5) * 14).toInt()
                          val y = max(if (abs(u) <= 6 && abs(v) <= 6) 1 else 0, 0)
                          vine(u, y + 1, v)
                      }
                      rub(7, 16)
                  } else if (t == 4) {
                      clr(7, 7, 8)
                      val n = 8
                      for (i in 0 until n) {
                          val a = i.toDouble() / n * 6.283
                          val u = jr(cos(a) * 5).toInt(); val v = jr(sin(a) * 5).toInt()
                          val hh = 2 + floor(r(i, 1, 2) * 5).toInt()
                          fnd(0, 0)
                          val g = c.hfn(R.x + u * m[0] + v * m[1], R.z + u * m[2] + v * m[3])
                          for (y in g until R.h) rp(u, y - R.h, v, 3)
                          for (y in 1..hh) rp(u, y, v, if (r(i, y, 3) < mp) MS else W)
                          if (hh >= 4 && i % 2 == 0) {
                              val a2 = (i + 1).toDouble() / n * 6.283
                              val u2 = jr(cos(a2) * 5).toInt(); val v2 = jr(sin(a2) * 5).toInt()
                              for (k in 0..4) if (r(i, k, 9) < .8)
                                  rp(jr(u + (u2 - u) * k / 4.0).toInt(), hh + 1, jr(v + (v2 - v) * k / 4.0).toInt(), W)
                          }
                          vine(u, hh, v)
                      }
                      for (u in -1..0) for (v in -1..0) rp(u, 1, v, W)
                      rub(5, 10)
                  } else if (t == 5) {
                      val hh = 3
                      clr(4, 3, 8); fnd(4, 3)
                      for (u in -3..3) for (v in -2..2) if (r(u, 0, v) < .8) rp(u, 0, v, wood)
                      for (y in 1..hh) for (u in -3..3) for (v in -2..2) {
                          val edge = abs(u) == 3 || abs(v) == 2
                          if (!edge) continue
                          if (u == -3 && v == 0 && y <= 2) continue
                          if (y == 2 && abs(v) == 2 && abs(u) <= 1) continue
                          if (!keep(u, y, v, hh + 2)) continue
                          val cor = abs(u) == 3 && abs(v) == 2
                          rp(u, y, v, if (cor || y == hh) 4 else wood)
                      }
                      for (u in -3..3) for (v in -2..2) {
                          val rf = hh + 1 + (2 - abs(v)) * .5
                          val fr = floor(rf).toInt()
                          if (v <= 0 && keep(u, fr, v, hh + 2) && r(u, 5, v) < .75) {
                              rp(u, fr, v, wood)
                              if (cold) rp(u, fr + 1, v, 12)
                          }
                      }
                      rub(3, 8)
                  } else if (t == 6) {
                      clr(4, 6, 9); fnd(3, 6)
                      for (s in intArrayOf(-3, 3)) for (y in 1..6) for (v in 0..1) if (keep(s, y, v, 7)) rp(s, y, v, 22)
                      for (u in -4..4) {
                          if (keep(u, 7, 0, 7)) rp(u, 7, 0, 22)
                          if (keep(u, 6, 0, 7) && abs(u) <= 2 && r(u, 6, 1) < .5) rp(u, 6, 0, wood)
                          if (keep(u, 8, 0, 8) && r(u, 8, 2) < .8) rp(u, 8, 0, 22)
                      }
                      for (k in 2..6) if (r(k, 1, 8) < .8) { rp(0, 1, k, 18); rp(0, 1, -k, 18) }
                      for (s in intArrayOf(-1, 1)) for (y in 1..2) rp(s * 2, y, 5, W)
                      rub(4, 10)
                  }
              }

              // ===================== POHON =====================
              private inner class TreeGen {
                  var tx = 0; var tz = 0; var h = 0
                  lateinit var rg: Rng
                  var own = false
                  var bt0 = 1.0; var bt1 = 1.0; var bt2 = 1.0
                  var pal = 0
                  var sz = 1.0
                  var cxx = 0.0; var czz = 0.0

                  fun r(): Double = rg.next()

                  private fun card(x: Double, y: Double, z: Double, size: Double, cx: Double, cy: Double, cz: Double, tp: Double, tt: Double, tk: Double) {
                      cards.add(doubleArrayOf(x, y, z, size, cx, cy, cz, tp, tt, tk, pal.toDouble(), bt0, bt1, bt2))
                  }

                  fun ball(cx_: Double, cy: Double, cz_: Double, R: Double, p: Double, nc: Int, cs: Double) {
                      val q = ceil(R).toInt()
                      for (a in -q..q) for (b in -q..q) for (cc in -q..q)
                          if (a * a + b * b + cc * cc <= R * R && r() < p)
                              put(floor(cx_).toInt() + a, floor(cy).toInt() + b, floor(cz_).toInt() + cc, 5)
                      for (i in 0 until nc) {
                          var a: Double; var b: Double; var cc: Double
                          do { a = r() * 2 - 1; b = r() * 2 - 1; cc = r() * 2 - 1 } while (a * a + b * b + cc * cc > 1)
                          val size = cs * (.7 + r() * .7) * S.leafS
                          val tp = r(); val tt = r(); val tk = r()
                          if (own) card(cx_ + a * R, cy + b * R * .85, cz_ + cc * R, size, cx_, cy, cz_, tp, tt, tk)
                      }
                  }

                  fun blob(bx: Double, by: Double, bz: Double, R: Double, ky: Double, p: Double, nc: Int, cs: Double) {
                      val q = ceil(R).toInt(); val qy = ceil(R * ky).toInt()
                      for (a in -q..q) for (b in -qy..qy) for (cc in -q..q)
                          if (a * a + (b / ky) * (b / ky) + cc * cc <= R * R && r() < p)
                              put(floor(bx).toInt() + a, floor(by).toInt() + b, floor(bz).toInt() + cc, 5)
                      for (i in 0 until nc) {
                          var a: Double; var b: Double; var cc: Double
                          do { a = r() * 2 - 1; b = r() * 2 - 1; cc = r() * 2 - 1 } while (a * a + b * b + cc * cc > 1)
                          // NB: di HTML, r() di bawah ini hanya dipanggil bila own (quirk dipertahankan agar pohon identik)
                          if (own) {
                              val size = cs * (.7 + r() * .7) * S.leafS
                              val tp = r(); val tt = r(); val tk = r()
                              card(bx + a * R, by + b * R * ky * .85, bz + cc * R, size, bx, by, bz, tp, tt, tk)
                          }
                      }
                  }

                  fun ln(x1: Double, y1: Double, z1: Double, x2: Double, y2: Double, z2: Double, id: Int) {
                      val n = ceil(hypot(hypot(x2 - x1, y2 - y1), z2 - z1) * 1.5).toInt()
                      if (n == 0) return
                      for (i in 0..n) put(
                          floor(x1 + (x2 - x1) * i / n).toInt(), floor(y1 + (y2 - y1) * i / n).toInt(),
                          floor(z1 + (z2 - z1) * i / n).toInt(), id
                      )
                  }

                  /** mengembalikan ex,ez lewat tex/tez */
                  var tex = 0; var tez = 0
                  fun trunk(hg0: Int, lx: Double, lz: Double, wd: Int, id: Int) {
                      var ex = 0; var ez = 0
                      val hg = min(hg0, H - h - 9)
                      for (yy in 1..hg) {
                          val t = yy.toDouble() / hg
                          ex = jr(lx * t * t).toInt(); ez = jr(lz * t * t).toInt()
                          val w2 = if (wd > 1 && t < .55) 2 else 1
                          for (a in 0 until w2) for (b in 0 until w2) put(tx + ex + a, h + yy, tz + ez + b, if (id == 0) 4 else id)
                      }
                      tex = ex; tez = ez
                  }

                  fun roots(n: Int, L: Double) {
                      if (S.treeRoot <= 0) return
                      for (j in 0 until n) {
                          val a = r() * 6.28; val l = L * S.treeRoot * (.7 + r() * .6)
                          ln(tx + .5, (h + 2).toDouble(), tz + .5, tx + .5 + cos(a) * l, h.toDouble(), tz + .5 + sin(a) * l, 4)
                      }
                  }

                  var lnx = 0.0; var lnz = 0.0
                  fun lean() {
                      val a = r() * 6.28
                      val l = max(-2.5, min(2.5, (r() - .5) * 2 * S.treeLean * min(2.5, sz * 1.3) * .5))
                      lnx = cos(a) * l * 2; lnz = sin(a) * l * 2
                  }

                  fun oakT(pv: Int, Rm: Double, fl: Boolean) {
                      pal = pv
                      val th = max(4, jr((5 + r() * 4) * sz * (if (fl) .8 else 1.0)).toInt())
                      val R = (2.6 + r() * .9) * sz * Rm
                      lean(); val lx = lnx; val lz = lnz
                      val wd = if (sz > 1.35) 2 else 1
                      trunk(th, lx, lz, wd, 0)
                      val ex = tex; val ez = tez
                      val ccx = cxx + ex; val ccz = czz + ez; val cy = h + th + 1.2 * sz
                      roots(if (sz > 1) 5 else 3, 1.6)
                      val nb = 2 + (if (sz > 1) 2 else 0) + jr(r() * S.treeBranch * 2).toInt()
                      for (j in 0 until nb) {
                          val a = j.toDouble() / nb * 6.28 + r()
                          val d = R * (.55 + r() * .3)
                          val x2 = ccx + cos(a) * d; val z2 = ccz + sin(a) * d
                          val y2 = cy + (r() - .4) * R * .4
                          ln(tx + ex + .5, h + th - 1 - r() * 2, tz + ez + .5, x2, y2 - 1, z2, 4)
                          blob(x2, y2, z2, R * (.5 + r() * .15), if (fl) .6 else 1.0, .62, jr(R * R * 5 * S.leafN).toInt(), .9)
                      }
                      blob(ccx, cy + R * .15, ccz, R * .85, if (fl) .7 else 1.0, .6, jr(R * R * 11 * S.leafN).toInt(), .95)
                  }

                  fun conif(pv: Int, red: Boolean, hm: Double) {
                      pal = pv
                      var th = jr((7 + r() * 7) * sz * hm).toInt()
                      th = min(th, H - h - 9)
                      val L = max(3, jr(th * .62).toInt())
                      lean(); val lx = lnx; val lz = lnz
                      trunk(th, lx * .6, lz * .6, if (red) 2 else 1, if (red) 17 else 4)
                      val bx = cxx + tex; val bz = czz + tez
                      if (red) roots(4, 2.2)
                      for (j in 0 until L) {
                          val t = j.toDouble() / (L - 1)
                          val R = (.8 + t * min(if (red) 2.6 else 3.4, 1.6 + sz * 1.4)) * (if (red) .8 else 1.0)
                          ball(bx, h + th + 1.5 - j * (if (red) 2.2 else 1.7), bz, R, .78, jr((5 + t * 18) * S.leafN).toInt(), .8)
                      }
                      ball(bx, h + th + 2.4, bz, .7, .9, jr(5 * S.leafN).toInt(), .6)
                  }

                  fun gen(kk: Int) {
                      val lf = S.leafN
                      if (kk == 1) oakT(0, 1.0, false)
                      else if (kk == 10) oakT(2, 1.05, false)
                      else if (kk == 9) oakT(1, 1.2, true)
                      else if (kk == 2) {
                          pal = 0
                          ball(tx + .5, h + 1.0, tz + .5, (.8 + r() * .9) * min(sz, 1.6) + .3, .7, jr(17 * sz * lf).toInt(), .8)
                      }
                      else if (kk == 3) conif(4, false, 1.0)
                      else if (kk == 15) conif(3, false, 1.15)
                      else if (kk == 16) conif(4, true, 1.5)
                      else if (kk == 4) {
                          pal = 0
                          val th = jr((7 + r() * 5) * max(.8, sz)).toInt()
                          lean(); val lx = lnx; val lz = lnz
                          trunk(th, lx * .7, lz * .7, 1, 16)
                          val ex = tex; val ez = tez
                          val bx = cxx + ex; val bz = czz + ez
                          val n = 3 + (r() * 2).toInt()
                          for (j in 0 until n) {
                              val a = r() * 6.28
                              val d = if (j != 0) 1 + r() * .8 else 0.0
                              blob(bx + cos(a) * d, h + th + 1 - j * 1.3 + r(), bz + sin(a) * d, 1.5 + r() * .6, 1.25, .58, jr(30 * lf).toInt(), .8)
                          }
                          val lim = 2 + jr(S.treeBranch).toInt()
                          for (j in 0 until lim) {
                              val a = r() * 6.28
                              ln((tx + ex).toDouble(), (h + th - 3).toDouble(), (tz + ez).toDouble(), tx + ex + cos(a) * 1.8, (h + th - 1).toDouble(), tz + ez + sin(a) * 1.8, 16)
                          }
                      }
                      else if (kk == 5) {
                          pal = 0
                          val th = jr(13 + r() * 9 + sz * 3).toInt()
                          val R = 6 + r() * 2.5
                          for (y in 1..th) for (a in 0 until 2) for (b in 0 until 2) put(tx + a, h + y, tz + b, 4)
                          for (j in 0 until 6) {
                              val a = j / 6.0 * 6.28 + r(); val L = 2 + r() * 2.8
                              ln(tx + .5, (h + 3).toDouble(), tz + .5, tx + .5 + cos(a) * L, (h - 1).toDouble(), tz + .5 + sin(a) * L, 4)
                          }
                          val cy = (h + th + 2).toDouble(); val nb = 6 + (r() * 3).toInt()
                          for (j in 0 until nb) {
                              val a = j.toDouble() / nb * 6.28 + r() * .6
                              val d = R * .55
                              val x2 = cxx + 1 + cos(a) * d; val z2 = czz + 1 + sin(a) * d
                              val y2 = cy + (r() - .3) * R * .35
                              ln(tx + 1.0, (h + th - 2).toDouble(), tz + 1.0, x2, y2, z2, 4)
                              blob(x2, y2, z2, R * .55, .9, .55, jr(R * R * 5 * lf).toInt(), .95)
                          }
                          blob(cxx + 1, cy + R * .25, czz + 1, R * .8, .85, .5, jr(R * R * 9 * lf).toInt(), 1.0)
                      }
                      else if (kk == 6) {
                          pal = 8
                          val th = jr((6 + r() * 4) * max(.85, sz)).toInt()
                          lean(); val lx = lnx; val lz = lnz
                          trunk(th, lx * 1.4, lz * 1.4, 1, 4)
                          val px_ = cxx + tex; val pz_ = czz + tez; val py = h + min(th, H - h - 9)
                          for (j in 0 until 10) {
                              val a = j / 10.0 * 6.28 + r() * .3
                              val len = 3 + floor(r() * 3).toInt()
                              for (d in 1..len) {
                                  val X = px_ + cos(a) * d * .95; val Z = pz_ + sin(a) * d * .95; val Y = py + 1 - d * d * .14
                                  put(floor(X).toInt(), floor(Y).toInt(), floor(Z).toInt(), 5)
                                  if (own && d > 1) card(X, Y + .2, Z, 1.5 * S.leafS, px_, py.toDouble(), pz_, r(), r(), r())
