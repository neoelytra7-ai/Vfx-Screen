          package com.infinitepath.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.DownloadManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.net.Uri
          import android.os.Environment
          import android.provider.Settings
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object Updater {
              private fun toast(a: Activity, s: String) = a.runOnUiThread { Toast.makeText(a, s, Toast.LENGTH_LONG).show() }

              fun check(a: Activity, manual: Boolean) {
                  Thread {
                      try {
                          val c = URL("https://api.github.com/repos/" + BuildConfig.GH_REPO + "/releases/latest").openConnection() as HttpURLConnection
                          c.setRequestProperty("Accept", "application/vnd.github+json")
                          c.connectTimeout = 8000
                          c.readTimeout = 8000
                          val j = JSONObject(c.inputStream.bufferedReader().use { it.readText() })
                          val code = j.getString("tag_name").takeLastWhile { it.isDigit() }.toIntOrNull() ?: 0
                          val assets = j.getJSONArray("assets")
                          var found: String? = null
                          for (i in 0 until assets.length()) {
                              val o = assets.getJSONObject(i)
                              if (o.getString("name").endsWith(".apk")) found = o.getString("browser_download_url")
                          }
                          val url = found
                          if (url != null && code > BuildConfig.VERSION_CODE) {
                              a.runOnUiThread {
                                  AlertDialog.Builder(a)
                                      .setTitle("Update tersedia")
                                      .setMessage("Build #" + code + " (terpasang #" + BuildConfig.VERSION_CODE + ")")
                                      .setPositiveButton("Update") { _, _ -> download(a, url) }
                                      .setNegativeButton("Nanti", null)
                                      .show()
                              }
                          } else if (manual) {
                              toast(a, "Sudah versi terbaru (#" + BuildConfig.VERSION_CODE + ")")
                          }
                      } catch (e: Exception) {
                          if (manual) toast(a, "Gagal cek update: " + e.message)
                      }
                  }.start()
              }

              private fun download(a: Activity, url: String) {
                  val f = File(a.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "update.apk")
                  if (f.exists()) f.delete()
                  val dm = a.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  val req = DownloadManager.Request(Uri.parse(url))
                      .setTitle("Infinite Path update")
                      .setDestinationInExternalFilesDir(a, Environment.DIRECTORY_DOWNLOADS, "update.apk")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE)
                  val id = dm.enqueue(req)
                  val rc = object : BroadcastReceiver() {
                      override fun onReceive(c: Context, i: Intent) {
                          if (i.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L) != id) return
                          try { a.unregisterReceiver(this) } catch (_: Exception) {}
                          if (f.exists() && f.length() > 0) install(a, f) else toast(a, "Unduhan gagal")
                      }
                  }
                  ContextCompat.registerReceiver(a, rc, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), ContextCompat.RECEIVER_EXPORTED)
                  toast(a, "Mengunduh update...")
              }

              private fun install(a: Activity, f: File) {
                  if (!a.packageManager.canRequestPackageInstalls()) {
                      a.startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + a.packageName)))
                      toast(a, "Izinkan install dari app ini, lalu tekan Cek update APK lagi")
                      return
                  }
                  val u = FileProvider.getUriForFile(a, a.packageName + ".fp", f)
                  a.startActivity(
                      Intent(Intent.ACTION_VIEW)
                          .setDataAndType(u, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }
