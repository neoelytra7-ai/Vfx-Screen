              fun upLight() {
                  val el = S.sunEl; val az = S.sunAz
                  S0 = cos(el) * sin(az); S1 = sin(el); S2 = cos(el) * cos(az)
                  SCs[0] = 1.3 * S.sun; SCs[1] = 1.1 * S.sun; SCs[2] = .85 * S.sun
                  val u = if (abs(S1) > .9) doubleArrayOf(1.0, 0.0, 0.0) else doubleArrayOf(0.0, 1.0, 0.0)
                  val a = doubleArrayOf(u[1] * S2 - u[2] * S1, u[2] * S0 - u[0] * S2, u[0] * S1 - u[1] * S0)
                  val l = sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2])
                  for (i in 0..2) { a[i] /= l; SPa[i] = a[i] }
                  SPb[0] = S1 * a[2] - S2 * a[1]; SPb[1] = S2 * a[0] - S0 * a[2]; SPb[2] = S0 * a[1] - S1 * a[0]
              }

              private fun reset() {
                  P.clear(); Tt.clear(); Aa.clear(); Lt.clear(); IT.clear(); IF.clear(); IW.clear()
                  BQ.clear(); BN.clear(); BR.clear(); GB.clear(); WP.clear(); WA.clear(); WL.clear(); WK.clear()
              }

              /** 0 = tanpa cahaya; 1 = cahaya tunggal lit[0..2]; 2 = per vertex lit[0..11] */
              private fun aq(
                  pts: DoubleArray, uvs: DoubleArray, tile: Int, sw: Double, swTop: Double, tint: DoubleArray, idx: IA,
                  litMode: Int, lit: DoubleArray?
              ): Int {
                  val b = P.n / 3
                  for (k in 0 until 4) {
                      P.add(pts[k * 3], pts[k * 3 + 1], pts[k * 3 + 2])
                      Tt.add(uvs[k * 2]); Tt.add(uvs[k * 2 + 1]); Tt.add(tile.toDouble()); Tt.add(if (k >= 2) swTop else sw)
                      Aa.add(tint[0], tint[1], tint[2])
                      if (litMode == 1) Lt.add(lit!![0], lit[1], lit[2])
                      else if (litMode == 2) Lt.add(lit!![k * 3], lit[k * 3 + 1], lit[k * 3 + 2])
                  }
                  idx.add(b, b + 1, b + 2); idx.add(b, b + 2, b + 3)
                  return b
              }

              private fun bs(px: Double, py: Double, pz: Double, nx: Int, ny: Int, nz: Int, start: Int, count: Int): Int {
