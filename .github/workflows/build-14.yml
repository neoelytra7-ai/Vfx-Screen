                  root.addView(qb, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).also { it.setMargins(0, 374, 8, 0) })
                  val jb = Button(this)
                  jb.text = "\u2191"; jb.textSize = 28f; jb.alpha = .65f
                  jb.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> r.jumpReq = true
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> r.jumpReq = false
                      }
                      true
                  }
                  root.addView(jb, FrameLayout.LayoutParams(220, 220, Gravity.BOTTOM or Gravity.END).also { it.setMargins(0, 0, 60, 50) })
