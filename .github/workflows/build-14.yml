              fun generate(): Atlas {
                  // ---- blok procedural ----
                  proc(0) { x, y -> grassC(x, y) }
                  proc(1) { x, y -> val h = 4 + tn(x, y, 16, 16, 1, 3) * 8; if (y < h) sc(grassC(x, y), .55 + .45 * (1 - y / h)) else dirtC(x, y) }
                  proc(2) { x, y -> dirtC(x, y) }
                  proc(3) { x, y ->
                      var c = mx(d3(.36, .36, .38), d3(.64, .63, .61), tn(x, y, 5, 5, 5, 5))
                      if (abs(tn(x, y, 4, 4, 9, 2) - .5) < .025) c = sc(c, .55)
                      sc(c, .92 + .16 * hs(x, y, 3))
                  }
                  proc(4) { x, y -> sc(mx(d3(.74, .66, .44), d3(.88, .8, .57), tn(x, y, 8, 8, 2, 3)), .9 + .2 * hs(x, y, 2)) }
                  proc(5) { x, y -> sc(mx(d3(.13, .09, .05), d3(.38, .27, .17), tn(x, y, 16, 2, 3, 3)), .85 + .15 * hs(x, y, 7)) }
                  proc(6) { x, y ->
                      val r = hypot(x - 15.5, y - 15.5)
                      if (r > 13) mx(d3(.15, .1, .06), d3(.35, .25, .15), tn(x, y, 16, 16, 3, 3))
                      else mx(d3(.55, .4, .22), d3(.76, .6, .36), .5 + .5 * sin(r * 1.35 + tn(x, y, 4, 4, 2, 2) * 4))
                  }
                  proc(7) { x, y -> mx(d3(.07, .25, .4), d3(.2, .46, .6), tn(x, y, 8, 8, 4, 3)) }
                  leaf(8, 75.0, 130.0, .5); leaf(15, 55.0, 105.0, .8)
                  dr(9) { c ->
                      for (i in 0 until 18) {
                          val x = 1 + rr() * 30; val tx = x + (rr() - .5) * 9; val ty = 2 + rr() * 16
                          c.fillStyle(hsl(70 + rr() * 50, 45 + rr() * 25, 18 + rr() * 22))
                          c.beginPath(); c.moveTo(x - 1.4, 32.0); c.quad(x, 18.0, tx, ty); c.quad(x + .4, 18.0, x + 1.4, 32.0); c.fill()
                      }
                  }
                  proc(16) { x, y ->
                      val N = 5; val cs = 32.0 / N; var d1 = 9.0; var d2 = 9.0; var id = 0.0
                      for (i in -1..N) for (j in -1..N) {
                          val ii = (i + N) % N; val jj = (j + N) % N
                          val qx = (i + .5 + (hs(ii, jj, 21) - .5) * .7) * cs; val qy = (j + .5 + (hs(ii, jj, 22) - .5) * .7) * cs
                          val d = hypot(x + .5 - qx, y + .5 - qy)
                          if (d < d1) { d2 = d1; d1 = d; id = hs(ii, jj, 23) } else if (d < d2) d2 = d
                      }
                      val e = min(1.0, (d2 - d1) / 2.2)
                      val pal = arrayOf(d3(.42, .40, .38), d3(.55, .5, .42), d3(.35, .3, .27), d3(.62, .6, .56), d3(.48, .42, .34))
                      val c = pal[floor(id * 5).toInt() % 5]
                      sc(c, (.55 + .45 * e) * (.85 + .3 * hs(x, y, 24)))
                  }
                  proc(17) { x, y -> sc(mx(d3(.4, .34, .22), d3(.5, .43, .29), tn(x, y, 8, 8, 12, 3)), .92 + .16 * hs(x, y, 13)) }

                  // ---- blok v11 ----
                  proc(25) { x, y ->
                      var c = mx(d3(.82, .88, .96), d3(.98, .99, 1.0), tn(x, y, 6, 6, 31, 4))
                      if (hs(x, y, 41) > .95) c = d3(1.0, 1.0, 1.0)
                      sc(c, .94 + .1 * hs(x, y, 42))
                  }
                  proc(26) { x, y ->
                      val b = .5 + .5 * sin(y * .55 + tn(x, y, 3, 3, 5, 2) * 4)
                      sc(mx(d3(.58, .22, .1), d3(.78, .36, .17), b * .7 + tn(x, y, 8, 8, 6, 3) * .3), .86 + .2 * hs(x, y, 43))
                  }
                  proc(27) { x, y ->
                      var c = mx(d3(.16, .1, .06), d3(.34, .24, .15), tn(x, y, 8, 8, 7, 4))
                      if (hs(x, y, 44) > .9) c = d3(.5, .42, .2)
                      if (hs(x, y, 45) > .96) c = d3(.62, .58, .5)
                      sc(c, .85 + .25 * hs(x, y, 46))
                  }
                  proc(28) { x, y ->
                      val rb = abs(sin(x * .98))
                      var c = mx(d3(.1, .36, .12), d3(.28, .6, .22), .4 + .6 * rb)
                      if (y % 6 == 2 && x % 4 == 1) c = d3(.9, .88, .7)
                      sc(c, .9 + .15 * hs(x, y, 47))
                  }
                  proc(29) { x, y ->
                      var c = mx(d3(.86, .84, .78), d3(.97, .96, .93), tn(x, y, 4, 4, 8, 3))
                      val m = tn(x, y, 2, 9, 9, 2)
                      if (m > .62 && (y % 7 < 3)) c = sc(c, .18 + .4 * (1 - m))
                      if (hs(x, y, 48) > .97) c = sc(c, .5)
                      sc(c, .92 + .12 * hs(x, y, 49))
                  }
                  proc(30) { x, y ->
                      val rp = .5 + .5 * sin(x * .8 + y * .3 + tn(x, y, 3, 3, 10, 2) * 6)
                      sc(mx(d3(.82, .7, .46), d3(.95, .86, .62), rp * .6 + .4 * tn(x, y, 8, 8, 11, 2)), .92 + .16 * hs(x, y, 50))
                  }
                  proc(31) { x, y ->
                      val g = abs(sin(x * 1.1 + tn(x, y, 2, 8, 12, 3) * 5))
                      sc(mx(d3(.22, .08, .05), d3(.5, .2, .1), tn(x, y, 3, 12, 13, 3) * .6 + g * .4), .8 + .3 * hs(x, y, 51))
                  }
                  proc(128) { x, y -> brk(x, y, d3(.45, .45, .47), d3(.62, .62, .64), d3(.24, .24, .26), 61) }
                  proc(129) { x, y ->
                      val c = brk(x, y, d3(.45, .45, .47), d3(.62, .62, .64), d3(.24, .24, .26), 61); val m = tn(x, y, 5, 5, 67, 4)
                      if (m > .5) mx(c, d3(.2, .42, .14), min(1.0, (m - .5) * 3.2)) else c
                  }
                  proc(130) { x, y -> brk(x, y, d3(.78, .65, .42), d3(.9, .78, .54), d3(.55, .45, .28), 71) }
                  proc(131) { x, y ->
                      val by = y % 8; val g = tn(x, y, 10, 1, 73, 3)
                      sc(if (by == 0) d3(.28, .18, .09) else mx(d3(.55, .38, .2), d3(.7, .5, .28), g), .9 + .15 * hs(x, y, 74))
                  }
                  proc(132) { x, y ->
                      val by = y % 8; val g = tn(x, y, 10, 1, 75, 3)
                      sc(if (by == 0) d3(.3, .05, .04) else mx(d3(.62, .1, .08), d3(.8, .2, .12), g), .9 + .15 * hs(x, y, 76))
                  }

                  // ---- sprite rumput variasi 18..24 ----
                  dr(18) { c ->
                      for (i in 0 until 5) {
                          val x = 4 + rr() * 24; val tx = x + (rr() - .5) * 5
                          c.strokeStyle(hsl(75 + rr() * 30, 50.0, 24 + rr() * 14)); c.lineWidth = 1.3
                          c.beginPath(); c.moveTo(x, 32.0); c.quad(x + (tx - x) * .3, 16.0, tx, 2 + rr() * 8); c.stroke()
                          if (i % 2 == 0) { c.fillStyle(Color.parseColor("#5a3a1c")); c.beginPath(); c.ellipse(tx, 6 + rr() * 3, 1.3, 3.4, 0.0, 0.0, 6.3); c.fill() }
                      }
                  }
                  dr(19) { c ->
                      for (f in 0 until 5) {
                          val a = -1.3 + f * .65 + rr() * .2; val L = 18 + rr() * 10; val ox = 16.0; val oy = 32.0
                          val ex = ox + sin(a) * L; val ey = oy - cos(a) * L
                          c.strokeStyle(hsl(95 + rr() * 30, 50.0, 22 + rr() * 12)); c.lineWidth = .9
                          c.beginPath(); c.moveTo(ox, oy); c.quad(ox + sin(a) * L * .4, oy - cos(a) * L * .9, ex, ey); c.stroke()
                          var t = .2
                          while (t < 1) {
                              val x = ox + (ex - ox) * t; val y = oy + (ey - oy) * t; val w = 7 * (1 - t) + 1.5
                              c.beginPath(); c.moveTo(x, y); c.lineTo(x - w * cos(a), y - 1 - w * sin(a) * .2)
                              c.moveTo(x, y); c.lineTo(x + w * cos(a), y - 1 + w * sin(a) * .2); c.stroke()
                              t += .1
                          }
                      }
                  }
                  dr(20) { c ->
                      for (i in 0 until 6) {
                          val x = 5 + rr() * 22; val tx = x + (rr() - .5) * 14; val ty = 3 + rr() * 12; val w = 2.2 + rr() * 1.6
                          c.fillStyle(hsl(95 + rr() * 30, 50 + rr() * 20, 20 + rr() * 16))
                          c.beginPath(); c.moveTo(x - w, 32.0); c.quad(x - w * .8, 18.0, tx, ty); c.quad(x + w * .8, 18.0, x + w, 32.0); c.fill()
                      }
                  }
                  dr(21) { c ->
                      for (i in 0 until 18) {
                          val x = 1 + rr() * 30; val tx = x + (rr() - .5) * 9; val ty = 2 + rr() * 16
                          c.fillStyle(hsl(35 + rr() * 20, 45 + rr() * 20, 38 + rr() * 18))
                          c.beginPath(); c.moveTo(x - 1.4, 32.0); c.quad(x, 18.0, tx, ty); c.quad(x + .4, 18.0, x + 1.4, 32.0); c.fill()
                      }
                  }
                  dr(22) { c ->
                      for (i in 0 until 9) {
