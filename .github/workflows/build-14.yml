          package com.infinitepath.app

          /** Peta Long->Int open-addressing (tanpa boxing). Nilai Int.MIN_VALUE = tidak ada. */
          class LongIntMap(initCap: Int = 1024) {
              private var keys = LongArray(initCap)
              private var vals = IntArray(initCap)
              private var used = BooleanArray(initCap)
              var size = 0
                  private set
              private var mask = initCap - 1

              private fun slot(k: Long): Int {
                  var h = (k * -7046029254386353131L).let { it xor (it ushr 32) }.toInt() and mask
