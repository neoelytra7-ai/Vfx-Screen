          echo "$SV" > .nerdfm

      - name: Build
        run: |
          G=$([ -f gradlew ] && echo ./gradlew || echo gradle)
          $G assembleRelease -PvCode=${{ github.run_number }} -PvName=${{ steps.v.outputs.n }} --build-cache --parallel --console=plain -q
          A=$(find . -path '*outputs/apk/release/*.apk' | head -1)
          [ -n "$A" ] || { echo "::error::no APK produced"; exit 1; }
          cp "$A" "NerdFM-${{ steps.v.outputs.n }}.apk"

      - name: Verify
        run: |
          A=$(ls NerdFM-*.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$A" | head -2
          S=$(stat -c%s "$A")
          echo "### $A · $((S/1024)) KiB · sha256 \`$(sha256sum "$A" | cut -c1-16)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit bootstrap
        if: steps.b.outputs.s == '1'
        continue-on-error: true
        run: |
          git config user.name nerdfm-ci; git config user.email ci@users.noreply.github.com
          git add -A; git reset -q -- ks.jks '*.apk' 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "chore: scaffold SV=$SV [skip ci]" && git push; }

      - uses: actions/upload-artifact@v4
        with:
          name: 'NerdFM-${{ steps.v.outputs.n }}'
          path: |
            NerdFM-*.apk
            app/build/outputs/mapping/release/mapping.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
