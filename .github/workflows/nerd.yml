           <path android:fillColor="#FF9CC2" android:pathData="M34,38 h40 a14,14 0 0 1 14,14 v22 a14,14 0 0 1 -14,14 h-40 a14,14 0 0 1 -14,-14 v-22 a14,14 0 0 1 14,-14 z"/>
           <path android:fillColor="#FFFFFF" android:fillAlpha="0.25" android:pathData="M32,44 h16 a4,4 0 0 1 0,8 h-16 a4,4 0 0 1 0,-8 z"/>
           <path android:fillColor="#3B2A38" android:pathData="M40,54 a4,5.5 0 1 0 0,11 a4,5.5 0 1 0 0,-11 z M68,54 a4,5.5 0 1 0 0,11 a4,5.5 0 1 0 0,-11 z"/>
           <path android:fillColor="#FFFFFF" android:pathData="M41,56 a1.6,1.6 0 1 0 0,3.2 a1.6,1.6 0 1 0 0,-3.2 z M69,56 a1.6,1.6 0 1 0 0,3.2 a1.6,1.6 0 1 0 0,-3.2 z"/>
           <path android:fillColor="#FF6B9A" android:fillAlpha="0.6" android:pathData="M28,70 a5,4 0 1 0 0,8 a5,4 0 1 0 0,-8 z M80,70 a5,4 0 1 0 0,8 a5,4 0 1 0 0,-8 z"/>
           <path android:strokeColor="#3B2A38" android:strokeWidth="2.4" android:strokeLineCap="round" android:pathData="M49,70 q5,5 10,0"/>
          </vector>
          NFM_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/paths.xml <<'NFM_EOF'
          <paths><root-path name="r" path="."/></paths>
