                subs.chunked(cols).forEachIndexed { r, row ->
                  Row(horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                    row.forEachIndexed { c, (n, f) -> SubChip(n.substringBefore('|', ""), n.substringAfter('|'), r * cols + c) { close(); f() } }
                  }
