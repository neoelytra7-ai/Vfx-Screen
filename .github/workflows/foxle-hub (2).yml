            if(href.startsWith(FS)){
             const p=decodeURIComponent(new URL(href).pathname.slice(5));
             H.dlf(p,name||p.split('/').pop());return;
            }
            const b=await(await fetch(href)).blob(),n=name||'download',id=H.dlo(n,b.type||H.mime(n));
            if(id<0)throw 0;
            for(let i=0;i<b.size;i+=CH)H.dlw(id,B(new Uint8Array(await b.slice(i,i+CH).arrayBuffer())));
            H.dlc(id);
           }catch(e){H.toast('Gagal menyimpan file')}
          };
          const need=a=>a.hasAttribute('download')&&(/^(blob:|data:)/.test(a.href)||a.href.startsWith(FS));
          document.addEventListener('click',e=>{
           const a=e.target.closest&&e.target.closest('a');
           if(a&&need(a)){e.preventDefault();e.stopImmediatePropagation();save(a.href,a.getAttribute('download'))}
          },true);
          {
           const ac=HTMLAnchorElement.prototype.click;
           HTMLAnchorElement.prototype.click=function(){if(need(this)){save(this.href,this.getAttribute('download'));return}return ac.call(this)};
          }
          window.__fx={LF,save,ensure};
          })();
          EOF

          cat > $D/app/src/main/assets/launcher.html <<'EOF'
          <!DOCTYPE html>
