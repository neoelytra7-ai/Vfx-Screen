          .add{background:#2b6b12;box-shadow:inset 3px 3px 0 #5fb02f,inset -3px -3px 0 #123a06}
          .add b{font:700 44px 'Pixelify Sans',monospace;line-height:56px;text-shadow:3px 3px 0 #000}
          #e{position:absolute;left:0;right:0;top:46%;text-align:center;color:#9a9a9a;font-size:24px;pointer-events:none}
          </style></head><body>
          <div id="top"><img id="lg" alt=""><h1>Foxle Hub</h1><button id="pm">Akses file</button></div>
          <div id="g"></div>
          <div id="e" hidden>Belum ada projek<br>Tap + untuk impor .html / .zip</div>
          <script>
          const $=s=>document.querySelector(s);
          const pal=['#e8802a','#5fb02f','#4a7fd4','#d6403a','#9b59c9','#fcdb5a','#7cff3a','#e86fb0'];
          const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
          function px(g,pl){const c=document.createElement('canvas');c.width=c.height=10;const x=c.getContext('2d'),on=(i,y)=>pl[(g[y]||'')[i]];
           x.fillStyle='#000';for(let y=-1;y<9;y++)for(let i=-1;i<9;i++)if(!on(i,y)&&(on(i-1,y)||on(i+1,y)||on(i,y-1)||on(i,y+1)))x.fillRect(i+1,y+1,1,1);
           g.forEach((r,y)=>[...r].forEach((ch,i)=>{if(pl[ch]){x.fillStyle=pl[ch];x.fillRect(i+1,y+1,1,1)}}));return c.toDataURL()}
          function av(n){let h=2166136261;for(const c of n){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
           let r=h;const rnd=()=>((r=(Math.imul(r,1103515245)+12345)>>>0)/4294967296);
           const g=[];for(let y=0;y<8;y++){let a='';for(let i=0;i<4;i++)a+=rnd()<.55?'c':'.';g.push(a+[...a].reverse().join(''))}
           g[3]=g[3].replace(/^.(.*).$/,'.$1.');return px(g,{c:pal[h%8]})}
          const FOX=["o......o","oo....oo","oooooooo","owkoowko","oooooooo","owwoowwo",".owwwwo.","..okko.."];
          $('#lg').src=px(FOX,{o:'#e8802a',w:'#fff',k:'#000'});
          let P=[];
          function refresh(){try{P=JSON.parse(Host.list())}catch(e){P=[]}draw()}
          function draw(){$('#g').innerHTML=P.map(p=>`<div class="s" data-id="${p.id}"><img src="${av(p.name)}" alt=""><span>${esc(p.name)}</span></div>`).join('')+`<div class="s add" id="add"><b>+</b><span>Impor</span></div>`;$('#e').hidden=P.length>0}
          let lp,lf=0;const g=$('#g');
          g.addEventListener('pointerdown',e=>{const s=e.target.closest('.s[data-id]');if(!s)return;lf=0;lp=setTimeout(()=>{lf=1;navigator.vibrate&&navigator.vibrate(15);if(confirm('Hapus "'+s.textContent+'"?')){Host.drop(s.dataset.id);refresh()}},600)});
          ['pointerup','pointercancel','pointermove'].forEach(v=>g.addEventListener(v,()=>clearTimeout(lp)));
          g.addEventListener('click',e=>{if(lf){lf=0;return}if(e.target.closest('#add'))return Host.imp();const s=e.target.closest('.s[data-id]');s&&Host.run(s.dataset.id)});
          function stat(){const o=Host.perm();const b=$('#pm');b.textContent='Akses file: '+(o?'ON':'OFF');b.className=o?'on':''}
          $('#pm').onclick=()=>{if(!Host.perm())Host.ask()};
          addEventListener('focus',stat);document.addEventListener('visibilitychange',stat);
          stat();refresh();
          </script></body></html>
