name: Build Foxle Hub APK

on:
  push:
    paths: ['.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: foxle-hub
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project (heredoc)
        run: |
          set -e
          D=hub
          mkdir -p $D/app/src/main/java/app/foxl $D/app/src/main/assets $D/app/src/main/res/drawable $D/app/src/main/res/xml

          cat > $D/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'FoxleHub'
          include ':app'
          EOF

          cat > $D/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $D/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          org.gradle.parallel=true
          org.gradle.caching=true
          android.nonTransitiveRClass=true
          android.useAndroidX=true
          android.enableR8.fullMode=true
          EOF

          cat > $D/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'app.foxl'
            compileSdk 34
            defaultConfig {
              applicationId 'app.foxl.hub'
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName '2.0'
            }
            signingConfigs {
              r {
                storeFile file(System.getenv('KS') ?: 'ks.jks')
                storePassword 'foxlhub'
                keyAlias 'k'
                keyPassword 'foxlhub'
              }
            }
            buildTypes {
              release {
                minifyEnabled true
                shrinkResources true
                signingConfig signingConfigs.r
                proguardFiles 'p.pro'
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies { implementation 'androidx.core:core:1.13.1' }
          EOF

          cat > $D/app/p.pro <<'EOF'
          -keep class app.foxl.** { *; }
          -keepattributes *Annotation*
          -dontwarn **
          EOF

          cat > $D/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <uses-feature android:name="android.hardware.microphone" android:required="false"/>
            <application
              android:label="Foxle Hub"
              android:icon="@drawable/ic"
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:usesCleartextTraffic="true"
              android:requestLegacyExternalStorage="true"
              android:allowBackup="false"
              android:largeHeap="true"
              android:hardwareAccelerated="true">
              <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.fp"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/fp"/>
              </provider>
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <activity android:name=".P" android:exported="false"
                android:documentLaunchMode="always"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode"
                android:windowSoftInputMode="adjustResize"/>
            </application>
          </manifest>
          EOF

          cat > $D/app/src/main/java/app/foxl/P.java <<'EOF'
          package app.foxl;

          public class P extends MainActivity {}
          EOF

          cat > $D/app/src/main/java/app/foxl/MainActivity.java <<'EOF'
          package app.foxl;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.StatFs;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.*;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.*;
          import java.util.*;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.*;

          public class MainActivity extends Activity {
            WebView w;
            FrameLayout fl;
            File root, ext;
            String pid, poly = "";
            ValueCallback<Uri[]> fc;
            View cv;
            WebChromeClient.CustomViewCallback cvb;
            WebChromeClient wc;
            PermissionRequest pr;
            final Map<Integer, Out> outs = new HashMap<>();
            int oid = 0;

            static class Out { OutputStream o; String n; }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              root = new File(getFilesDir(), "projects");
              root.mkdirs();
              ext = Environment.getExternalStorageDirectory();
              pid = getIntent().getStringExtra("p");
              getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
              getWindow().setStatusBarColor(Color.BLACK);
              getWindow().setNavigationBarColor(Color.BLACK);
              try { poly = read(getAssets().open("poly.js")); } catch (Exception e) {}
              WebView.setWebContentsDebuggingEnabled(true);
              w = new WebView(this);
              w.setBackgroundColor(Color.BLACK);
              fl = new FrameLayout(this);
              fl.setBackgroundColor(Color.BLACK);
              fl.addView(w, new FrameLayout.LayoutParams(-1, -1));
              setContentView(fl);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              s.setTextZoom(100);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              w.addJavascriptInterface(new Host(), "Host");
              w.setDownloadListener((url, ua, cd, mt, len) -> {
                try {
                  if (url.startsWith("blob:") || url.startsWith("data:")) return;
                  String fn = URLUtil.guessFileName(url, cd, mt);
                  DownloadManager.Request q = new DownloadManager.Request(Uri.parse(url));
                  if (mt != null && !mt.isEmpty()) q.setMimeType(mt);
                  if (ua != null) q.addRequestHeader("User-Agent", ua);
                  q.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                  q.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fn);
                  ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(q);
                  tt("Mengunduh " + fn);
                } catch (Exception e) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception x) {}
                }
              });
              w.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return serve(r);
                }
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  String h = u.getHost(), sc = u.getScheme();
                  if (h != null && h.endsWith(".foxl")) return false;
                  if ("blob".equals(sc) || "data".equals(sc) || "about".equals(sc) || "javascript".equals(sc)) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) {}
                  return true;
                }
                @Override public void onPageStarted(WebView v, String u, Bitmap f) {
                  v.evaluateJavascript(poly, null);
                }
                @Override public void onPageFinished(WebView v, String u) {
                  v.evaluateJavascript(poly, null);
                }
                @Override public boolean onRenderProcessGone(WebView v, RenderProcessGoneDetail d) {
                  runOnUiThread(() -> recreate());
                  return true;
                }
              });
              wc = new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fc != null) fc.onReceiveValue(null);
                  fc = cb;
                  try { startActivityForResult(p.createIntent(), 8); } catch (Exception e) { fc = null; return false; }
                  return true;
                }
                @Override public void onPermissionRequest(PermissionRequest r) {
                  runOnUiThread(() -> {
                    List<String> need = new ArrayList<>();
                    for (String x : r.getResources()) {
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(x) && checkSelfPermission("android.permission.CAMERA") != PackageManager.PERMISSION_GRANTED) need.add("android.permission.CAMERA");
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(x) && checkSelfPermission("android.permission.RECORD_AUDIO") != PackageManager.PERMISSION_GRANTED) need.add("android.permission.RECORD_AUDIO");
                    }
                    if (need.isEmpty()) r.grant(r.getResources());
                    else { pr = r; requestPermissions(need.toArray(new String[0]), 2); }
                  });
                }
                @Override public void onShowCustomView(View v, WebChromeClient.CustomViewCallback cb) {
                  if (cv != null) { cb.onCustomViewHidden(); return; }
                  cv = v;
                  cvb = cb;
                  fl.addView(v, new FrameLayout.LayoutParams(-1, -1));
                  w.setVisibility(View.GONE);
                  immersive(true);
                }
                @Override public void onHideCustomView() {
                  if (cv == null) return;
                  fl.removeView(cv);
                  cv = null;
                  w.setVisibility(View.VISIBLE);
                  immersive(false);
                  if (cvb != null) cvb.onCustomViewHidden();
                  cvb = null;
                }
                @Override public Bitmap getDefaultVideoPoster() {
                  return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                }
                @Override public boolean onJsAlert(WebView v, String u, String m, JsResult r) {
                  if (isFinishing()) { r.cancel(); return true; }
                  new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_Material_Dialog_Alert)
                    .setMessage(m)
                    .setPositiveButton(android.R.string.ok, (d, i) -> r.confirm())
                    .setOnCancelListener(d -> r.cancel())
                    .show();
                  return true;
                }
                @Override public boolean onJsConfirm(WebView v, String u, String m, JsResult r) {
                  if (isFinishing()) { r.cancel(); return true; }
                  new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_Material_Dialog_Alert)
                    .setMessage(m)
                    .setPositiveButton(android.R.string.ok, (d, i) -> r.confirm())
                    .setNegativeButton(android.R.string.cancel, (d, i) -> r.cancel())
                    .setOnCancelListener(d -> r.cancel())
                    .show();
                  return true;
                }
                @Override public boolean onJsPrompt(WebView v, String u, String m, String def, JsPromptResult r) {
                  if (isFinishing()) { r.cancel(); return true; }
                  final EditText et = new EditText(MainActivity.this);
                  et.setText(def);
                  new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_Material_Dialog_Alert)
                    .setMessage(m)
                    .setView(et)
                    .setPositiveButton(android.R.string.ok, (d, i) -> r.confirm(et.getText().toString()))
                    .setNegativeButton(android.R.string.cancel, (d, i) -> r.cancel())
                    .setOnCancelListener(d -> r.cancel())
                    .show();
                  return true;
                }
              };
              w.setWebChromeClient(wc);
              if (pid != null) {
                try { setTaskDescription(new ActivityManager.TaskDescription(nm(new File(root, pid)))); } catch (Exception e) {}
              }
              w.loadUrl(pid == null ? "https://app.foxl/" : "https://p" + pid + ".foxl/");
            }

            void immersive(boolean on) {
              getWindow().getDecorView().setSystemUiVisibility(on
                ? (View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION)
                : 0);
            }

            void tt(String m) {
              runOnUiThread(() -> Toast.makeText(this, m, Toast.LENGTH_SHORT).show());
            }

            // Tombol back: kirim event 'foxlback' ke halaman (preventDefault() = sudah ditangani, mis. naik folder)
            @Override public void onBackPressed() {
              if (cv != null) { wc.onHideCustomView(); return; }
              if (w == null) { super.onBackPressed(); return; }
              w.evaluateJavascript("(function(){try{var e=new CustomEvent('foxlback',{cancelable:true});dispatchEvent(e);return e.defaultPrevented}catch(x){return false}})()", v -> {
                if ("true".equals(v)) return;
                if (w != null && w.canGoBack()) w.goBack(); else super.onBackPressed();
              });
            }

            @Override protected void onDestroy() {
              for (Out x : outs.values()) try { x.o.close(); } catch (Exception e) {}
              outs.clear();
              if (w != null) { fl.removeView(w); w.destroy(); w = null; }
              super.onDestroy();
            }

            @Override public void onRequestPermissionsResult(int rq, String[] ps, int[] gr) {
              if (rq == 2 && pr != null) {
                boolean ok = gr.length > 0;
                for (int g : gr) if (g != PackageManager.PERMISSION_GRANTED) ok = false;
                if (ok) pr.grant(pr.getResources()); else pr.deny();
                pr = null;
              }
            }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              if (rq == 8) {
                if (fc != null) {
                  fc.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d));
                  fc = null;
                }
                return;
              }
              if (rq == 7 && rs == RESULT_OK && d != null) {
                final List<Uri> L = new ArrayList<>();
                ClipData c = d.getClipData();
                if (c != null) for (int i = 0; i < c.getItemCount(); i++) L.add(c.getItemAt(i).getUri());
                else if (d.getData() != null) L.add(d.getData());
                new Thread(() -> {
                  for (Uri u : L) try { imp(u); } catch (Exception e) {}
                  runOnUiThread(() -> { if (w != null) w.evaluateJavascript("refresh()", null); });
                }).start();
              }
            }

            // ---------- helpers ----------
            static String read(InputStream in) throws IOException {
              ByteArrayOutputStream o = new ByteArrayOutputStream();
              byte[] b = new byte[8192];
              int n;
              while ((n = in.read(b)) > 0) o.write(b, 0, n);
              in.close();
              return o.toString("UTF-8");
            }
            static void cp(InputStream in, File f, boolean close) throws IOException {
              FileOutputStream o = new FileOutputStream(f);
              byte[] b = new byte[16384];
              int n;
              while ((n = in.read(b)) > 0) o.write(b, 0, n);
              o.close();
              if (close) in.close();
            }
            static void wf(File f, String s) throws IOException {
              try (FileOutputStream o = new FileOutputStream(f)) { o.write(s.getBytes("UTF-8")); }
            }
            static boolean del(File f) {
              File[] a = f.listFiles();
              if (a != null) for (File c : a) del(c);
              return f.delete();
            }
            String nm(File d) {
              try { return read(new FileInputStream(new File(d, ".name"))).trim(); } catch (Exception e) { return d.getName(); }
            }
            File safe(String p) throws IOException {
              File f = new File(p).getCanonicalFile();
              String r = ext.getCanonicalPath(), q = f.getPath();
              if (!q.equals(r) && !q.startsWith(r + "/")) throw new SecurityException(p);
              return f;
            }

            void unzip(InputStream in, File d) throws IOException {
              ZipInputStream z = new ZipInputStream(in);
              String base = d.getCanonicalPath() + File.separator;
              ZipEntry e;
              while ((e = z.getNextEntry()) != null) {
                String en = e.getName().replace('\\', '/');
                if (en.startsWith("__MACOSX/")) continue;
                File f = new File(d, en);
                if (!f.getCanonicalPath().startsWith(base)) continue;
                if (e.isDirectory()) f.mkdirs();
                else { f.getParentFile().mkdirs(); cp(z, f, false); }
              }
              z.close();
            }

            void fix(File d) {
              if (new File(d, "index.html").exists()) return;
              File[] a = d.listFiles();
              if (a == null) return;
              if (a.length == 1 && a[0].isDirectory()) {
                File[] b = a[0].listFiles();
                if (b != null) for (File f : b) f.renameTo(new File(d, f.getName()));
                a[0].delete();
              }
              if (!new File(d, "index.html").exists()) {
                a = d.listFiles();
                if (a != null) for (File f : a) if (f.getName().toLowerCase().endsWith(".html")) { f.renameTo(new File(d, "index.html")); break; }
              }
            }

            void imp(Uri u) throws Exception {
              String n = "app";
              try (Cursor c = getContentResolver().query(u, null, null, null, null)) {
                if (c != null && c.moveToFirst()) {
                  int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                  if (i >= 0) n = c.getString(i);
                }
              }
              String lo = n.toLowerCase(), base = n.replaceAll("\\.[^.]*$", "");
              String id = base.toLowerCase().replaceAll("[^a-z0-9]+", "-").replaceAll("^-|-$", "");
              if (id.isEmpty()) id = "app";
              boolean zip = lo.endsWith(".zip");
              if (!zip && !lo.endsWith(".html") && !lo.endsWith(".htm")) { tt("Hanya .html / .zip yang bisa diimpor"); return; }
              File d = new File(root, id);
              if (d.exists()) del(d);
              d.mkdirs();
              InputStream in = getContentResolver().openInputStream(u);
              if (zip) { unzip(in, d); in.close(); fix(d); }
              else cp(in, new File(d, "index.html"), true);
              wf(new File(d, ".name"), base);
            }

            static final Map<String, String> M = new HashMap<>();
            static {
              String[] a = {
                "html:text/html", "htm:text/html", "xhtml:application/xhtml+xml",
                "js:text/javascript", "mjs:text/javascript", "cjs:text/javascript", "css:text/css",
                "json:application/json", "map:application/json", "webmanifest:application/manifest+json",
                "svg:image/svg+xml", "png:image/png", "jpg:image/jpeg", "jpeg:image/jpeg", "jpe:image/jpeg", "jfif:image/jpeg",
                "gif:image/gif", "webp:image/webp", "avif:image/avif", "bmp:image/bmp", "ico:image/x-icon",
                "tif:image/tiff", "tiff:image/tiff", "heic:image/heic", "heif:image/heif",
                "woff:font/woff", "woff2:font/woff2", "ttf:font/ttf", "otf:font/otf", "eot:application/vnd.ms-fontobject",
                "mp3:audio/mpeg", "ogg:audio/ogg", "oga:audio/ogg", "opus:audio/opus", "wav:audio/wav", "flac:audio/flac",
                "aac:audio/aac", "m4a:audio/mp4", "weba:audio/webm", "mid:audio/midi", "midi:audio/midi", "amr:audio/amr",
                "mp4:video/mp4", "m4v:video/mp4", "webm:video/webm", "mkv:video/x-matroska", "mov:video/quicktime",
                "avi:video/x-msvideo", "3gp:video/3gpp", "ogv:video/ogg", "ts:video/mp2t", "mpg:video/mpeg", "mpeg:video/mpeg",
                "flv:video/x-flv", "wmv:video/x-ms-wmv",
                "pdf:application/pdf", "txt:text/plain", "log:text/plain", "ini:text/plain", "conf:text/plain", "md:text/markdown",
                "csv:text/csv", "xml:application/xml", "yml:text/yaml", "yaml:text/yaml", "rtf:application/rtf",
                "java:text/plain", "kt:text/plain", "py:text/plain", "sh:text/plain", "php:text/plain", "c:text/plain", "cpp:text/plain", "h:text/plain",
                "zip:application/zip", "rar:application/vnd.rar", "7z:application/x-7z-compressed", "tar:application/x-tar",
                "gz:application/gzip", "bz2:application/x-bzip2", "xz:application/x-xz",
                "apk:application/vnd.android.package-archive",
                "doc:application/msword", "docx:application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                "xls:application/vnd.ms-excel", "xlsx:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                "ppt:application/vnd.ms-powerpoint", "pptx:application/vnd.openxmlformats-officedocument.presentationml.presentation",
                "odt:application/vnd.oasis.opendocument.text", "ods:application/vnd.oasis.opendocument.spreadsheet",
                "epub:application/epub+zip", "wasm:application/wasm"
              };
              for (String s : a) { int i = s.indexOf(':'); M.put(s.substring(0, i), s.substring(i + 1)); }
            }
            static String mime(String p) {
              int i = p.lastIndexOf('.');
              if (i < 0) return "application/octet-stream";
              String m = M.get(p.substring(i + 1).toLowerCase());
              return m != null ? m : "application/octet-stream";
            }

            static class Lim extends FilterInputStream {
              long left;
              Lim(InputStream i, long n) { super(i); left = n; }
              @Override public int read() throws IOException {
                if (left <= 0) return -1;
                int r = super.read();
                if (r >= 0) left--;
                return r;
              }
              @Override public int read(byte[] b, int o, int l) throws IOException {
                if (left <= 0) return -1;
                int r = super.read(b, o, (int) Math.min(l, left));
                if (r > 0) left -= r;
                return r;
              }
              @Override public long skip(long n) throws IOException {
                long s = super.skip(Math.min(n, left));
                left -= s;
                return s;
              }
            }

            static WebResourceResponse resp(String m, int c, String msg, Map<String, String> hd, InputStream in) {
              String enc = (m.startsWith("text/") || m.equals("application/json") || m.equals("application/xml") || m.equals("image/svg+xml")) ? "utf-8" : null;
              return new WebResourceResponse(m, enc, c, msg, hd, in);
            }

            // sisipkan poly.js paling awal di <head> supaya API polyfill sudah ada sebelum script halaman jalan
            String inject(String s) {
              String tag = "<script>" + poly + "</script>";
              int at = 0;
              Matcher m = Pattern.compile("<head(\\s[^>]*)?>", Pattern.CASE_INSENSITIVE).matcher(s);
              if (m.find()) at = m.end();
              else {
                m = Pattern.compile("<html(\\s[^>]*)?>", Pattern.CASE_INSENSITIVE).matcher(s);
                if (m.find()) at = m.end();
                else {
                  m = Pattern.compile("<!doctype[^>]*>", Pattern.CASE_INSENSITIVE).matcher(s);
                  if (m.find()) at = m.end();
                }
              }
              return s.substring(0, at) + tag + s.substring(at);
            }

            OutputStream dout(String name, String mime) throws Exception {
              name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
              if (name.isEmpty()) name = "file";
