            const t=L*k/(n-1);while(s<c.length-1&&c[s]<t)s++;
            const a=p[s-1],b=p[s],l=c[s]-c[s-1]||1,u=Math.min(1,Math.max(0,(t-c[s-1])/l));
            o[2*k]=a[0]+(b[0]-a[0])*u;o[2*k+1]=a[1]+(b[1]-a[1])*u;
           }
           return o;
          }

          /* ---------- render teks vektor statis (SVG path) ---------- */
          const sw=z=>Math.max(1,z*.1);
          function render(el,str){
           if(str!=null)el.dataset.s=str;
           const W=el.clientWidth,z=+el.dataset.z;
           if(!W||!z)return;
           const a=el.dataset.a||'l',L=layout(el.dataset.s,z,W,+el.dataset.t||0);
           const ox=a==='c'?(W-L.w)/2:a==='r'?W-L.w:0,oy=z*.08;
           const d=L.st.map(s=>'M'+s.map(q=>(q[0]+ox).toFixed(1)+' '+(q[1]+oy).toFixed(1)).join('L')).join('');
           el.setAttribute('aria-label',el.dataset.s);
           el.innerHTML='<svg width="'+W+'" height="'+(z*1.35)+'" aria-hidden="true"><path stroke-width="'+sw(z)+'" d="'+d+'"/></svg>';
          }
          function hyd(root){root.querySelectorAll('.vt').forEach(e=>{e.style.height=(+e.dataset.z*1.35)+'px';render(e)})}
          const rgb=el=>{const m=getComputedStyle(el).color.match(/[\d.]+/g);return[+m[0],+m[1],+m[2]]};
          /* deskripsi vektor teks di koordinat layar */
          function desc(el,str,col){
           const r=el.getBoundingClientRect(),z=+el.dataset.z,a=el.dataset.a||'l';
           const L=layout(str==null?el.dataset.s:str,z,r.width,+el.dataset.t||0);
           const ox=a==='c'?(r.width-L.w)/2:a==='r'?r.width-L.w:0,oy=z*.08;
           return{st:L.st.map(s=>res(s.map(q=>[q[0]+ox+r.left,q[1]+oy+r.top]),N)),col:col||rgb(el),w:sw(z),cx:r.left+ox+L.w/2,cy:r.top+oy+z/2};
          }
          const vts=root=>[...root.querySelectorAll('.vt')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.bottom>0&&r.top<innerHeight}).slice(0,44);

          /* =====================================================================
             VEKTOR MORPH  -  engine
             Tiap teks = kumpulan stroke. Dua teks dipasangkan stroke-by-stroke
             (split/merge kalau jumlahnya beda), tiap titik berjalan di jalur
             melengkung dengan stagger; digambar di satu canvas overlay.
             ===================================================================== */
          const cv=$('#fx'),cx=cv.getContext('2d');let DPR=1,jobs=[],raf=0;
          function fit(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR)}
          const dot=(x,y)=>{const o=new Float32Array(N*2);for(let k=0;k<N;k++){o[2*k]=x;o[2*k+1]=y}return o};
          const lerp=(a,b,t)=>a+(b-a)*t;
          function mk(it,i,n,dur,stag){
           const A=it.a&&it.a.st.length?it.a:null,B=it.b&&it.b.st.length?it.b:null,sp=it.sp==null?80:it.sp;
           const m=Math.max(A?A.st.length:0,B?B.st.length:0,1),pr=[];
           const ca=it.a||it.b,cb=it.b||it.a;
           for(let k=0;k<m;k++){
            const rx=(Math.random()-.5)*2*sp,ry=(Math.random()-.5)*2*sp;
            const a=A?A.st[Math.floor(k*A.st.length/m)]:dot(cb.cx+rx,cb.cy+ry);
            const b=B?B.st[Math.floor(k*B.st.length/m)]:dot(ca.cx+rx,ca.cy+ry);
            pr.push([a,b,k%2?1:-1]);
           }
           return{pr,ca:ca.col,cb:cb.col,wa:ca.w,wb:cb.w,fi:!A,fo:!B,dl:n>1?i*(stag/(n-1)):0,dur:Math.max(300,dur-stag)};
          }
          function draw(it,t){
           const L=Math.min(1,Math.max(0,(t-it.dl)/it.dur)),al=it.fi?Math.min(1,L*2.5):it.fo?Math.max(0,1-L*1.4):1;
           if(al<=.01)return;
           const m=it.pr.length,pa=new Path2D();
           for(let k=0;k<m;k++){
            const q=it.pr[k],a=q[0],b=q[1],sg=q[2],ps=Math.min(1,Math.max(0,L*1.35-.35*k/m));
            for(let j=0;j<N;j++){
             const pj=Math.min(1,Math.max(0,ps*1.4-.4*j/(N-1))),e=pj<.5?4*pj*pj*pj:1-Math.pow(-2*pj+2,3)/2;
             const ax=a[2*j],ay=a[2*j+1],dx=b[2*j]-ax,dy=b[2*j+1]-ay,d=Math.hypot(dx,dy)||1,arc=Math.sin(Math.PI*e)*d*.16*sg;
             const x=ax+dx*e-dy/d*arc,y=ay+dy*e+dx/d*arc;
             j?pa.lineTo(x,y):pa.moveTo(x,y);
            }
           }
           const col='rgb('+Math.round(lerp(it.ca[0],it.cb[0],L))+','+Math.round(lerp(it.ca[1],it.cb[1],L))+','+Math.round(lerp(it.ca[2],it.cb[2],L))+')';
           const lw=lerp(it.wa,it.wb,L),amt=Math.sin(Math.PI*L)*2.4;
           cx.globalAlpha=al*.14;cx.strokeStyle=col;cx.lineWidth=lw*3.6;cx.stroke(pa);
           if(amt>.3){
            cx.save();cx.globalAlpha=al*.55;cx.lineWidth=lw;
            cx.translate(-amt,0);cx.strokeStyle='#00e5ff';cx.stroke(pa);
            cx.translate(amt*2,0);cx.strokeStyle='#ff2d95';cx.stroke(pa);cx.restore();
           }
           cx.globalAlpha=al;cx.strokeStyle=col;cx.lineWidth=lw;cx.stroke(pa);
          }
          function loop(now){
           raf=0;
           cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
           cx.globalCompositeOperation='lighter';cx.lineCap='round';cx.lineJoin='round';
           const keep=[];
           for(const j of jobs){
            const t=now-j.t0;
            for(const it of j.items)draw(it,t);
            if(t>=j.dur)j.res();else keep.push(j);
           }
           jobs=keep;
           if(jobs.length)raf=requestAnimationFrame(loop);else cx.clearRect(0,0,innerWidth,innerHeight);
          }
          function run(items,dur,stag){
           return new Promise(res=>{
            if(!items.length)return res();
            const n=items.length,d=dur||900,s=stag==null?300:stag;
            jobs.push({t0:performance.now(),dur:d,res,items:items.map((it,i)=>mk(it,i,n,d,s))});
            if(!raf)raf=requestAnimationFrame(loop);
           });
          }
          /* teks muncul: partikel -> huruf */
          async function appear(root,stag){
           const list=vts(root);if(!list.length)return;
           list.forEach(e=>e.classList.add('vh'));
           await run(list.map(e=>({a:null,b:desc(e),sp:90})),950,stag==null?520:stag);
           list.forEach(e=>e.classList.remove('vh'));
          }
          /* satu teks berubah isi */
          function morphText(el,s,o){
           o=o||{};
           const a=desc(el),b=desc(el,s,o.col);
           el.classList.add('vh');
           return run([{a,b}],o.dur||700,0).then(()=>{render(el,s);el.classList.remove('vh')});
          }

          /* =====================================================================
             DATA + VIEW
             ===================================================================== */
          let P=[],cur='proj',busy=0,lastP=null;
          const ORDER=['proj','sys','api'],T={proj:'PROYEK',sys:'SISTEM',api:'API'};
          const V={proj:$('#v-proj'),sys:$('#v-sys'),api:$('#v-api')};
          const vt=(s,z,o)=>{o=o||{};return'<i class="vt'+(o.g?' g':'')+(o.cls?' '+o.cls:'')+'" data-s="'+esc(s)+'" data-z="'+z+'"'+(o.a?' data-a="'+o.a+'"':'')+(o.t?' data-t="'+o.t+'"':'')+(o.c?' style="color:'+o.c+'"':'')+'></i>'};
          const pad=n=>String(n).padStart(2,'0');
          const load=()=>{try{P=JSON.parse(Hs.list())}catch(e){P=[]}};
          const disk=()=>{try{return JSON.parse(Hs.disk())}catch(e){return{t:1,f:0}}};
          const gb=b=>(b/1073741824).toFixed(1)+' GB';

          function sigil(n){
           let h=2166136261;for(const c of String(n)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
           let r=h;const rd=()=>((r=(Math.imul(r,1103515245)+12345)>>>0)/4294967296);
           const col=['#00e5ff','#7c4dff','#ff2d95','#3dffa8','#ffb300'][h%5];let d='M20,2V38';
           for(let y=0;y<4;y++)for(let x=0;x<2;x++){
            const k=rd(),s=[];
            if(k<.28)s.push([x,y,x+1,y]);else if(k<.5)s.push([x,y,x,y+1]);else if(k<.68)s.push([x,y,x+1,y+1]);else if(k<.8)s.push([x+1,y,x,y+1]);
            for(const q of s){d+='M'+q[0]*10+','+(q[1]*10)+'L'+q[2]*10+','+(q[3]*10)+'M'+(4-q[0])*10+','+(q[1]*10)+'L'+(4-q[2])*10+','+(q[3]*10)}
           }
           return'<svg class="sg" viewBox="-3 -3 46 46" style="color:'+col+'"><circle class="ring" cx="20" cy="20" r="22" fill="none" stroke="currentColor"/><path d="'+d+'"/></svg>';
          }
          const card=(p,i)=>'<div class="card" data-id="'+esc(p.id)+'" data-n="'+esc(p.name)+'" style="--i:'+i+'"><div class="in"><div class="top">'+vt(pad(i+1),9,{c:'var(--dim)'})+'<b class="st"></b></div>'+sigil(p.name)+vt(p.name,14,{cls:'nm'})+vt('P/'+p.id,8,{c:'var(--dim)'})+'</div></div>';

          const BUILD={
           proj(){
            let h='<div class="sec"><div class="l">'+vt('DAFTAR PROYEK',10,{c:'var(--dim)',t:1})+'</div><div class="r">'+vt(pad(P.length),10,{a:'r',c:'var(--c1)'})+'</div></div><div class="grid">';
            h+=P.map(card).join('');
            h+='<div class="card add" id="add" style="--i:'+P.length+'"><div class="in"><svg class="pl" viewBox="0 0 40 40"><path d="M20,6V34M6,20H34"/></svg>'+vt('IMPOR',12,{a:'c',c:'var(--c1)',t:1})+vt('.HTML / .ZIP',8,{a:'c',c:'var(--dim)'})+'</div></div>';
            if(!P.length)h+='<div class="empty">'+sigil('kosong')+vt('BELUM ADA PROYEK',12,{a:'c',t:1})+vt('TAP IMPOR UNTUK MENAMBAH',9,{a:'c',c:'var(--dim)'})+'</div>';
            return h+'</div>';
           },
           sys(){
            const o=!!Hs.perm(),d=disk(),used=Math.max(0,d.t-d.f),pc=d.t>1?Math.round(used/d.t*100):0;
            return '<div class="panel" style="--i:0"><div class="in">'+vt('AKSES FILE',9,{c:'var(--dim)',t:1})+vt(o?'AKTIF':'NONAKTIF',26,{g:1,t:1,c:o?'var(--ok)':'var(--warn)'})+
             (o?vt('SEMUA FILE TERBUKA UNTUK PROYEK',8,{c:'var(--dim)'}):'<button class="btn" id="grant">'+vt('BERI IZIN',10,{a:'c',t:1})+'</button>')+'</div></div>'+
            '<div class="panel" style="--i:1"><div class="in">'+vt('PENYIMPANAN',9,{c:'var(--dim)',t:1})+'<div class="two"><div>'+vt(gb(d.f)+' BEBAS',16,{g:1})+'</div><div class="r">'+vt('DARI '+gb(d.t),8,{a:'r',c:'var(--dim)'})+'</div></div>'+
             '<div class="bar"><u style="width:'+pc+'%"></u></div>'+vt(pc+'% TERPAKAI',8,{a:'r',c:'var(--c1)'})+'</div></div>'+
            '<div class="panel" style="--i:2"><div class="in">'+vt('PROYEK TERIMPOR',9,{c:'var(--dim)',t:1})+vt(pad(P.length),34,{g:1,c:'var(--c1)'})+'</div></div>';
           },
           api(){
            const L=[['FILE SYSTEM ACCESS',typeof window.showDirectoryPicker==='function'],['SHOWOPENFILEPICKER',typeof window.showOpenFilePicker==='function'],['SHOWSAVEFILEPICKER',typeof window.showSaveFilePicker==='function'],['VIDEO / AUDIO RANGE STREAM',1],['BLOB / DATA DOWNLOAD',1],['CLIPBOARD + SHARE',1],['FULLSCREEN VIDEO',1],['EVENT TOMBOL BACK',1]];
            return '<div class="sec"><div class="l">'+vt('CAPABILITY MATRIX',10,{c:'var(--dim)',t:1})+'</div></div>'+
             L.map((x,i)=>'<div class="row" style="--i:'+i+'"><div class="l">'+vt(x[0],10)+'</div><div class="r">'+vt(x[1]?'OK':'--',10,{a:'r',c:x[1]?'var(--ok)':'var(--dim)'})+'</div></div>').join('');
           }
          };

          /* ---------- transisi tab = vektor morph ---------- */
          function setTab(nm){
           document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===nm));
           $('#ind').style.transform='translateX('+ORDER.indexOf(nm)*100+'%)';
          }
          function fxScan(){const s=$('#scan');s.classList.remove('go');void s.offsetWidth;s.classList.add('go')}
          async function go(nm){
           if(busy||nm===cur)return;busy=1;
           try{
            const A=V[cur],B=V[nm],title=$('#title');
            B.innerHTML=BUILD[nm]();B.hidden=false;B.style.visibility='hidden';B.scrollTop=0;hyd(B);
            const fa=[desc(title)].concat(vts(A).map(e=>desc(e))),fb=[desc(title,T[nm])].concat(vts(B).map(e=>desc(e)));
            const n=Math.max(fa.length,fb.length),items=[];
            for(let i=0;i<n;i++)items.push({a:fa[i]||null,b:fb[i]||null,sp:50});
            const hide=[title].concat(vts(A),vts(B));
            hide.forEach(e=>e.classList.add('vh'));
            B.style.visibility='';B.classList.add('in');A.classList.add('out');
            setTab(nm);fxScan();
            await run(items,1050,340);
            A.hidden=true;A.classList.remove('out');B.classList.remove('in');
            render(title,T[nm]);
            hide.forEach(e=>e.classList.remove('vh'));
            cur=nm;
           }finally{busy=0}
          }
          /* bangun ulang view aktif lalu partikel -> huruf */
          function rebuild(nm){
           const v=V[nm];v.innerHTML=BUILD[nm]();hyd(v);
           v.classList.add('fresh');setTimeout(()=>v.classList.remove('fresh'),1100);
           return appear(v,380);
          }
          window.refresh=()=>{load();if(cur==='proj'&&!busy)rebuild('proj')};

          /* ---------- akses file ---------- */
          function stat(){
           const o=!!Hs.perm();if(o===lastP)return;
           const first=lastP===null;lastP=o;
           const s=o?'AKSES ON':'AKSES OFF',b=$('#acc'),t=$('#accT');
           b.className=o?'on':'';
           if(first){t.dataset.s=s}else{morphText(t,s,{col:o?[61,255,168]:[255,170,60]});if(cur==='sys'&&!busy)rebuild('sys')}
          }
          $('#acc').addEventListener('click',()=>{if(Hs.perm())go('sys');else Hs.ask()});
          addEventListener('focus',stat);document.addEventListener('visibilitychange',stat);

          /* ---------- interaksi ---------- */
          document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
          let lp,lf=0;
          const main=$('#views');
          main.addEventListener('pointerdown',e=>{
           const c=e.target.closest('.card[data-id]');if(!c)return;
           lf=0;lp=setTimeout(()=>{lf=1;navigator.vibrate&&navigator.vibrate(15);if(confirm('Hapus "'+c.dataset.n+'"?')){Hs.drop(c.dataset.id);window.refresh()}},600);
          });
          ['pointerup','pointercancel','pointermove'].forEach(v=>main.addEventListener(v,()=>clearTimeout(lp)));
          main.addEventListener('click',e=>{
           if(lf){lf=0;return}
           if(e.target.closest('#add'))return Hs.imp();
           if(e.target.closest('#grant'))return Hs.ask();
           const c=e.target.closest('.card[data-id]');if(c)launch(c);
          });
          function launch(c){
           if(c.__b||busy)return;c.__b=1;
           const nm=c.querySelector('.nm'),f=$('#flash');
           f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
           morphText(nm,'MEMBUKA',{dur:520});
           setTimeout(()=>Hs.run(c.dataset.id),420);
           setTimeout(()=>{morphText(nm,c.dataset.n,{dur:650}).then(()=>{c.__b=0})},1500);
          }
          let sx=0,sy=0;
          main.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
          main.addEventListener('touchend',e=>{
           const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
           if(Math.abs(dx)>70&&Math.abs(dy)<45){const i=ORDER.indexOf(cur)+(dx<0?1:-1);if(ORDER[i])go(ORDER[i])}
          },{passive:true});
          addEventListener('foxlback',e=>{if(cur!=='proj'){e.preventDefault();go('proj')}});
          let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fit();document.querySelectorAll('.vt').forEach(e=>render(e))},120)});

          /* ---------- boot ---------- */
          fit();load();stat();
          V.proj.innerHTML=BUILD.proj();
          hyd(document.body);
          appear(document.body,700);
          document.body.classList.remove('boot');
          setTab('proj');
          })();
          </script></body></html>
          EOF

          cat > $D/app/src/main/res/xml/fp.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <root-path name="r" path="."/>
          </paths>
          EOF

          cat > $D/app/src/main/res/drawable/ic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96">
            <path android:fillColor="#05070D" android:pathData="M0,0h96v96h-96z"/>
            <path android:strokeColor="#1C1448" android:strokeWidth="1" android:pathData="M0,24H96M0,48H96M0,72H96M24,0V96M48,0V96M72,0V96"/>
            <path android:strokeColor="#7C4DFF" android:strokeWidth="3" android:pathData="M8,24V8H24M72,8H88V24M88,72V88H72M24,88H8V72"/>
            <path android:strokeColor="#00E5FF" android:strokeWidth="3.5" android:strokeLineJoin="round" android:pathData="M24,24L38,40H58L72,24L84,50L48,84L12,50Z"/>
            <path android:strokeColor="#00E5FF" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M30,52L42,56M66,52L54,56"/>
            <path android:fillColor="#FF2D95" android:pathData="M43,69H53L48,76Z"/>
          </vector>
          EOF

      - name: Keystore (cache, dibuat sekali)
        uses: actions/cache@v4
        with:
          path: ks.jks
          key: foxl-keystore-v1

      - name: Buat keystore jika belum ada
        run: |
          [ -f ks.jks ] || keytool -genkeypair -keystore ks.jks -storepass foxlhub -keypass foxlhub \
            -alias k -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Foxle Hub"

      - name: Build release APK
        working-directory: hub
        env:
          KS: ${{ github.workspace }}/ks.jks
        run: gradle assembleRelease --console=plain

      - name: Rename
        run: |
          cp hub/app/build/outputs/apk/release/app-release.apk FoxleHub.apk
          ls -l FoxleHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FoxleHub
          path: FoxleHub.apk
          if-no-files-found: error
