const WG=`@group(0) @binding(0) var<storage,read> vox: array<u32>;
@group(0) @binding(1) var<storage,read_write> outp: array<u32>;
fn hs(x:u32)->u32{let s=x*747796405u+2891336453u;let w=((s>>((s>>28u)+4u))^s)*277803737u;return (w>>22u)^w;}
fn rr(i:u32,k:u32)->f32{return f32(hs(i*6u+k)>>8u)/16777216.0;}
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) g:vec3<u32>){
 let i=g.x; if(i>=arrayLength(&outp)){return;}
 let o=vec3<f32>(32.0+(rr(i,0u)-0.5)*40.0,40.0+rr(i,1u)*20.0,32.0+(rr(i,2u)-0.5)*40.0);
 var d=normalize(vec3<f32>(rr(i,3u)*2.0-1.0,-rr(i,4u),rr(i,5u)*2.0-1.0));
 if(abs(d.x)<1e-8){d.x=1e-8;} if(abs(d.y)<1e-8){d.y=1e-8;} if(abs(d.z)<1e-8){d.z=1e-8;}
