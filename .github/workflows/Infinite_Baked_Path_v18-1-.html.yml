#vl .vx{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bt);color:#fff;font-size:14px}
#mb button{position:relative;overflow:hidden;width:44px;height:46px;padding:2px 0;border-radius:11px;border:1px solid transparent;background:none;color:#c8d8bd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;cursor:pointer;touch-action:manipulation;flex:none;transition:background .2s,color .2s,transform .2s}
#mb button i{font:400 7.5px var(--f3);letter-spacing:.1em;text-transform:uppercase;font-style:normal}
#mb button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#mb button:active{transform:scale(.9)}
#mb button.on{background:var(--acs);color:#fff;border-color:rgba(124,207,79,.55)}
#mb button.x,#mb button.hb{height:34px;font-size:15px}#mb button.hb:disabled{opacity:.35}
#mb .bd{position:absolute;right:2px;top:2px;width:13px;height:13px;stroke:var(--ac2);stroke-width:2}
#mh{position:sticky;top:0;z-index:3;height:32px;box-sizing:border-box;padding:10px 2px 0;display:flex;justify-content:space-between;align-items:baseline;background:var(--pn)}
#mh .t{font:400 11px var(--f1);letter-spacing:.3em}#mh .s{font:italic 400 14px var(--f2);color:var(--ac)}
#sq{position:sticky;top:32px;z-index:2;padding:2px 0 6px;background:var(--pn)}
