 out(msg);ev("gpu",msg.replace(/\n/g," | "));if(mp<97)anom("gpupar","Hasil traversal GPU beda dari CPU ("+mp.toFixed(1)+"% cocok)");[bv,bo,bs].forEach(b=>b.destroy())}
