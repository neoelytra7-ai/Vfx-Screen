 const sp=Math.hypot(px-lpx,pz-lpz)/Math.max(dt,1e-3);lpx=px;lpz=pz;let dy=yaw-lyw;lyw=yaw;dy=Math.max(-.2,Math.min(.2,dy));ph+=Math.min(sp,12)*dt*1.5;const mv=Math.min(1,sp/5);
 const tx=Math.sin(ph)*4*mv-dy*160,ty=Math.abs(Math.cos(ph))*5*mv;hx+=(tx-hx)*Math.min(1,dt*10);hy+=(ty-hy)*Math.min(1,dt*10);
 if(M.sw>0)M.sw=Math.max(0,M.sw-dt*(M.hb?3.2:5));const sw=M.sw>0?Math.sin((1-M.sw)*Math.PI):0;
 hand.style.transform="translate("+(hx-sw*18).toFixed(1)+"px,"+(hy-sw*26+(1-mv)*Math.sin(now/900)*1.5).toFixed(1)+"px) rotate("+(-sw*24).toFixed(1)+"deg) scale("+(1+sw*.1).toFixed(3)+")";
 // pantau pergantian seed -> muat edit tersimpan
 if(now-M.nT>700){M.nT=now;if(S.seed!==M.seedN){M.seedN=S.seed;try{const sv=JSON.parse(localStorage.getItem("ibp.ed."+S.seed)||"null");if(Array.isArray(sv)&&sv.length&&!C.listEdits().length)EDITB(sv)}catch(e){}M.und.length=0;M.red.length=0}}}
requestAnimationFrame(loop);
// ---------- masukan ----------
function setOn(v){M.on=v?1:0;document.body.classList.toggle("mcOn",!!M.on);bm.classList.toggle("on",!!M.on);if(M.on){bar();nm("Mode bangun · "+(M.cr?"Kreatif":"Kumpul"))}else{M.hb=M.hp=0;pal.style.display="none";M.prog=0}}
bm.onclick=()=>setOn(!M.on);
const ptr=(el,dn,up)=>{el.onpointerdown=e=>{e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId)}catch(_){}dn()};el.onpointerup=el.onpointercancel=e=>{e.stopPropagation();up()};el.oncontextmenu=e=>e.preventDefault()};
ptr(mbk,()=>{M.hb=1;mbk.classList.add("on")},()=>{M.hb=0;mbk.classList.remove("on")});
ptr(mpl,()=>{M.hp=1;M.pt=.35;doPlace()},()=>{M.hp=0});ptr(mpi,pick,()=>{});
pal.onpointerdown=hb.onpointerdown||(e=>e.stopPropagation());pal.addEventListener("pointerdown",e=>e.stopPropagation());
const lk=()=>document.pointerLockElement===cv;
addEventListener("mousedown",e=>{if(!M.on||!lk())return;e.preventDefault();if(e.button==0)M.hb=1;else if(e.button==2){M.hp=1;M.pt=.35;doPlace()}else if(e.button==1)pick()},true);
addEventListener("mouseup",e=>{if(e.button==0)M.hb=0;else if(e.button==2)M.hp=0},true);
addEventListener("contextmenu",e=>{if(M.on&&lk())e.preventDefault()});
addEventListener("wheel",e=>{if(!M.on||!lk())return;e.preventDefault();sel((M.sel+(e.deltaY>0?1:8))%9)},{passive:false});
addEventListener("keydown",e=>{const t=e.target&&e.target.tagName;if(t=="INPUT"||t=="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code=="KeyB"&&!e.repeat){setOn(!M.on);return}if(!M.on)return;
 if(/^Digit[1-9]$/.test(e.code)){sel(+e.code[5]-1);return}if(e.code=="KeyE"&&!e.repeat){tp();return}if(e.code=="KeyU"&&!e.repeat){e.shiftKey?redo():undo()}});
// ---------- seed + view penuh ----------
const r2=v=>+(+v).toFixed(2);
function copyFull(){const o={app:"InfiniteBakedPath",v:4,seed:S.seed,pos:{px:r2(px),py:r2(py),pz:r2(pz),yaw:+yaw.toFixed(3),pit:+pit.toFixed(3)},world:{},edits:C.listEdits()};WCK().forEach(k=>o.world[k]=+(+S[k]).toFixed(4));
 const txt="// Infinite Baked Path · FULL seed+view+world+edit ("+o.edits.length/4+" blok diubah)\n// Kirim ke saya untuk iterasi berikutnya, atau tempel menggantikan baris `const LAUNCH=null;`\nconst LAUNCH="+JSON.stringify(o)+";";
 gshow(txt,"copy","rep");try{navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{})}catch(e){}toast("FULL seed+view disalin ("+o.edits.length/4+" blok)")}
function applyFull(j){const w={seed:j.seed};if(j.world)for(const k in j.world)w[k]=j.world[k];applyJson(JSON.stringify(w));
 if(Array.isArray(j.edits)&&j.edits.length)EDITB(j.edits);if(j.pos){const q=j.pos;if(isFinite(q.px))px=+q.px;if(isFinite(q.py))py=+q.py;if(isFinite(q.pz))pz=+q.pz;if(isFinite(q.yaw))yaw=+q.yaw;if(isFinite(q.pit))pit=+q.pit;vy=0}
 saveE();toast("FULL seed+view dimuat");return true}
window.BLD={copyFull,applyFull,M,undo,redo,edit,setOn};
}catch(err){console.warn("MC gagal:",err)}})();
