#ld .r1{stroke-dasharray:290;stroke-dashoffset:290;animation:ldr 2.4s ease-out forwards,ldp 3s 2.4s ease-in-out infinite;transform-origin:60px 60px;opacity:.7}
#ld .r2{stroke-dasharray:200;stroke-dashoffset:200;animation:ldr 2s .5s ease-out forwards;stroke:#ffd28a}
#ld h1{font:400 15px var(--f1);letter-spacing:.5em;margin:20px 0 8px .5em;font-weight:400}
#ld p{font:italic 300 15px var(--f2);opacity:.7;margin:0 0 22px;min-height:20px;transition:opacity .4s}
.lbr{width:200px;height:2px;margin:0 auto;background:#ffffff1f;border-radius:2px;overflow:hidden}.lbr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ccf4f,#ffd28a);transition:width .35s}
@keyframes ldin{from{opacity:0;transform:translateY(14px)}}@keyframes ldr{to{stroke-dashoffset:0}}@keyframes ldp{50%{transform:scale(1.05);opacity:1}}
/* ===== UI v14: satu tema kaca gelap, tanpa blur (hemat GPU), setelan padat ===== */
.b,#mp,#mb,#vl .vi,#gio>div{background:var(--pn);border:1px solid var(--bd);border-radius:12px}
#mp,#mb{background:linear-gradient(180deg,rgba(124,207,79,.07),transparent 150px),var(--pn)}
#g,#sp,#ph,#lb{border-radius:12px;overflow:hidden;color:var(--fg);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
#g:active,#sp:active,#ph:active,#lb:active{transform:scale(.9)}
#g svg,#sp svg,#ph svg,#j svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#g .bd{position:absolute;right:3px;bottom:3px;width:12px;height:12px;stroke:var(--ac2);stroke-width:2.2}
#j{border-radius:50%;background:rgba(11,17,13,.6);color:var(--fg)}
#sp.on,#lb.on{background:var(--acs);border-color:var(--ac)}
#m{position:fixed;inset:0;display:none;flex-direction:row-reverse;align-items:stretch;justify-content:flex-start;z-index:9;color:var(--fg);user-select:none;font-family:var(--f3);padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(270deg,rgba(4,9,5,.55),rgba(4,9,5,0) 65%)}
#m.pk{pointer-events:none}#m.pk #mp,#m.pk #mb{opacity:0;pointer-events:auto}
#m>*{animation:slin .4s cubic-bezier(.2,.9,.2,1) both}#m>#mp{animation-delay:.04s}
@keyframes slin{from{opacity:0;transform:translateX(28px)}}
#mb,#mp{box-sizing:border-box;transition:opacity .12s,transform .4s cubic-bezier(.2,.9,.2,1)}
#mb{order:0;display:flex;flex-direction:column;width:56px;padding:7px 4px;gap:4px;align-items:center}
#cats,#tabs{display:flex;flex-direction:column;overflow:hidden auto;align-items:center;gap:4px;flex:1;min-height:0;scrollbar-width:none}
#cats::-webkit-scrollbar,#tabs::-webkit-scrollbar{display:none}
#mp{order:1;width:min(430px,calc(100vw - 86px));margin-right:8px;padding:0 9px 10px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
@media(max-width:560px){#mp{width:calc(100vw - 80px)}}
#m.vo #mp{transform:translateX(-6px)}#m.vo #mb{transform:translateX(-3px)}
#vl{order:2;width:var(--lane);overflow:visible;transition:width .4s cubic-bezier(.2,.9,.2,1);position:relative;flex:none}
#m.vo{--lane:84px}
#vl .vi{position:absolute;right:8px;top:0;bottom:0;width:68px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;opacity:0;transform:translateX(24px) scale(.9);transition:.35s cubic-bezier(.2,.9,.2,1);pointer-events:none;box-sizing:border-box}
