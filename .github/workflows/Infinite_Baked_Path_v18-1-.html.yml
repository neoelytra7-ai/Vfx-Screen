 var tm=((vec3<f32>(p)+select(vec3<f32>(0.0),vec3<f32>(1.0),pos))-o)/d;
 var res=0xFFFFFFFFu;
 for(var s=0;s<160;s++){
  if(any(p<vec3<i32>(0))||any(p>=vec3<i32>(64))){break;}
  let idx=u32(p.x+64*(p.z+64*p.y));
  if(vox[idx]!=0u){res=idx;break;}
  if(tm.x<tm.y&&tm.x<tm.z){p.x+=st.x;tm.x+=inv.x;}else if(tm.y<tm.z){p.y+=st.y;tm.y+=inv.y;}else{p.z+=st.z;tm.z+=inv.z;}
 }
