/* ===== VIS: Visibility Engine =====
 Aturan: sesuatu di-vanish HANYA jika terbukti tidak berkontribusi ke piksel (bukan diburamkan).
 - Medium bawah air: shader komposit memakai T=exp(-ab*dist), ab.b=.05*uwDens. Di atas jarak ln(2048)/ab, T<5e-4 => darat/benda jauh hilang total.
 - Langit bawah air: piksel langit tertimpa penuh (T kecil) & jendela Snell dihitung prosedural, jadi pass langit+awan tidak terlihat.
 - Permukaan air dari bawah: selalu ditimpa jendela Snell/TIR => pass air (absorpsi/SSR) tidak terlihat.
 - Fauna udara & debu atas: berada di atas bidang air => ray ke sana memotong permukaan => tertimpa.
 - Udara: kabut exp(-d*fog) => di atas 7.6/fog meter, benda hilang. */
const VIS={on:1,uw:0,vd:1e9,vd2:1e18,sky:1,upk:0,cull:0,
