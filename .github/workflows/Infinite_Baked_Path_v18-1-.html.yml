#plb{position:fixed;inset:0;background:#000d;z-index:35;display:none;align-items:center;justify-content:center}#plb img{max-width:96vw;max-height:92vh;box-shadow:0 0 30px #000}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:8px 0}.gal .ph{display:flex;flex-direction:column;gap:3px}.gal .ph div.im{aspect-ratio:4/3;background:#222 center/cover;border:2px solid var(--bd);border-radius:3px;cursor:pointer}.gal .ph .bt{display:flex;gap:3px}.gal .ph .bt button{flex:1;padding:4px 0;border:2px solid var(--bd);border-radius:3px;background:var(--bt);color:var(--fg);cursor:pointer;font-size:12px}.gal small{opacity:.7;font-size:10px}

:root{--f1:'Cinzel',serif;--f2:'Cormorant Garamond',serif;--f3:'Josefin Sans',sans-serif;--fn:'Space Mono',monospace;--us:1;--lane:0px;--ac:#7ccf4f}
body[data-ft="2"]{--f1:'Antonio',sans-serif;--f2:'Tenor Sans',sans-serif;--f3:'Italiana',serif;--fn:'Space Mono',monospace}
#ld{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 90% at 50% 40%,#16221a,#070b08);display:flex;align-items:center;justify-content:center;transition:opacity .9s,transform .9s cubic-bezier(.6,0,.2,1);color:#e8f0dc}
#ld.out{opacity:0;transform:scale(1.04);pointer-events:none}
#ld .lc{text-align:center;animation:ldin 1.2s cubic-bezier(.2,.9,.2,1) both}
