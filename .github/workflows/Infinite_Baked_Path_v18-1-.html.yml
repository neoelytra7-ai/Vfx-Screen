  if(this.on&&S.uwOn>.5){let wy=-1e9;try{wy=C.waterY(x,z)}catch(_){}d=isFinite(wy)&&wy>-1e8?wy-y:0}
  this.uw=d>.03?d:0;let vd=1e9;
  if(this.on){const k=this.uw?.05*S.uwDens:Math.max(S.fog,1e-4);vd=Math.min(1e9,7.6/k);if(this.uw)vd=Math.min(vd,260)}
  this.vd=vd;this.vd2=vd*vd;this.sky=!(this.on&&this.uw>0&&S.uwDens>=.6);this.upk=this.on&&this.uw>0&&this.uw<9},
