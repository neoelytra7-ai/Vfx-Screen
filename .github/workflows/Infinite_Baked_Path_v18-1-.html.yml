const hs=x=>{const s=(Math.imul(x,747796405)+2891336453)>>>0,w=Math.imul(((s>>>((s>>>28)+4))^s)>>>0,277803737)>>>0;return((w>>>22)^w)>>>0},rr=(i,k)=>(hs(i*6+k)>>>8)/16777216;
function cpuRay(i,vox){let ox=32+(rr(i,0)-.5)*40,oy=40+rr(i,1)*20,oz=32+(rr(i,2)-.5)*40,dx=rr(i,3)*2-1,dy=-rr(i,4),dz=rr(i,5)*2-1;const l=Math.hypot(dx,dy,dz);dx/=l;dy/=l;dz/=l;
 if(Math.abs(dx)<1e-8)dx=1e-8;if(Math.abs(dy)<1e-8)dy=1e-8;if(Math.abs(dz)<1e-8)dz=1e-8;
 let x=Math.floor(ox),y=Math.floor(oy),z=Math.floor(oz);const sx=dx>0?1:-1,sy=dy>0?1:-1,sz=dz>0?1:-1,ix=1/Math.abs(dx),iy=1/Math.abs(dy),iz=1/Math.abs(dz);
