#sq input:focus{border-color:var(--ac)}
.gh{display:block;width:100%;text-align:left;height:26px;margin:2px 0;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:#cfe0c4;font:400 calc(9.5px*var(--us)) var(--f1);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.sec>.gh{display:flex;justify-content:space-between;align-items:center;height:30px;margin:4px 0 0;background:var(--bt);color:var(--fg);font-size:calc(10px*var(--us))}
.sec>.gh i{font:400 10px var(--fn);color:var(--ac2);font-style:normal;letter-spacing:0}
.sec.o>.gh{background:var(--acs);border-color:rgba(124,207,79,.5)}
.gh:active{transform:scale(.99)}
.gcn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;padding:5px 0 3px}
.gcn>:not(.it){grid-column:1/-1}
.it{position:relative;display:flex;align-items:center;gap:6px;height:calc(34px*var(--us));padding:0 8px;border-radius:8px;background:var(--bt);overflow:hidden;touch-action:pan-y;cursor:ew-resize;transition:background .15s}
.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,rgba(124,207,79,.04),rgba(124,207,79,.28));pointer-events:none}
.it.tgl::before{display:none}.it.tgl{cursor:pointer}
.it.dg{background:rgba(124,207,79,.14)}.it.sel{box-shadow:inset 0 0 0 1px var(--ac)}
.it>b{position:relative;flex:1;min-width:0;font:400 calc(10.5px*var(--us)) var(--f3);line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.it .v,.it .ve{position:relative;flex:none;font:500 calc(11px*var(--us)) var(--fn);color:var(--ac2);font-variant-numeric:tabular-nums}
.it .v{min-width:30px;text-align:right;padding:6px 0 6px 6px;cursor:text}
.it .ve{width:66px;height:24px;box-sizing:border-box;padding:0 6px;border:1px solid var(--ac);border-radius:6px;background:var(--vb);color:var(--fg);text-align:center;outline:0;user-select:text;-webkit-user-select:text}
.sw{position:relative;flex:none;width:30px;height:16px;border-radius:9px;border:1px solid var(--bd);background:var(--vb);padding:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#8a978a;transition:transform .18s cubic-bezier(.3,1.5,.5,1),background .18s}
.sw.on{background:rgba(124,207,79,.35);border-color:var(--ac)}.sw.on::after{transform:translateX(14px);background:#fff}
.gb{display:flex;gap:5px;padding:6px 0 2px;flex-wrap:wrap}
.gb button,#gio button,.sb,.tg,.seedrow button{height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bt);color:var(--fg);font:500 11px var(--f3);cursor:pointer;touch-action:manipulation;white-space:nowrap;flex:none;transition:transform .15s,background .15s}
.gb button:active,#gio button:active,.sb:active,.tg:active,.seedrow button:active{transform:scale(.94)}
