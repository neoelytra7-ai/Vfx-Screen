                      selPreset = null; updateChips()
                      if (keys.any { k -> k.startsWith("rt_") }) RootFx.syncAll()
                      refreshers.forEach { r -> r() }
                      secChecks.forEach { r -> r() }
                      snack("${sec.title} reset")
                  }
                  return card
              }

              private fun setOpen(body: View, chev: TextView, open: Boolean) {
                  chev.animate().rotation(if (open) 180f else 0f).setDuration(240).start()
                  val lpb = body.layoutParams
                  if (open) {
                      body.visibility = View.VISIBLE
                      val ws = View.MeasureSpec.makeMeasureSpec(resources.displayMetrics.widthPixels - dp(32), View.MeasureSpec.EXACTLY)
                      body.measure(ws, View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED))
                      val target = body.measuredHeight
                      lpb.height = 0
                      body.requestLayout()
                      val a = ValueAnimator.ofInt(0, target)
                      a.duration = 280
                      a.interpolator = DecelerateInterpolator()
                      a.addUpdateListener { lpb.height = it.animatedValue as Int; body.requestLayout() }
                      a.addListener(object : AnimatorListenerAdapter() {
                          override fun onAnimationEnd(an: Animator) { lpb.height = WC; body.requestLayout() }
                      })
                      a.start()
                  } else {
                      val start = body.height
                      val a = ValueAnimator.ofInt(start, 0)
                      a.duration = 240
                      a.interpolator = DecelerateInterpolator()
                      a.addUpdateListener { lpb.height = it.animatedValue as Int; body.requestLayout() }
                      a.addListener(object : AnimatorListenerAdapter() {
                          override fun onAnimationEnd(an: Animator) { body.visibility = View.GONE; lpb.height = WC; body.requestLayout() }
                      })
                      a.start()
                  }
              }

              private fun changedKey(k: String) {
                  if (selPreset != null) { selPreset = null; updateChips() }
                  if (k.startsWith("rt_") && RootFx.available) RootFx.onKeyChanged(k)
                  secChecks.forEach { it() }
              }

              private fun spinReset(v: View) {
                  v.animate().rotationBy(-360f).setDuration(380).setInterpolator(DecelerateInterpolator()).start()
                  v.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
              }

              // ---------- rows ----------
              private fun slider(parent: LinearLayout, s: Sl) {
                  val wrap = LinearLayout(this)
                  wrap.orientation = LinearLayout.VERTICAL
                  wrap.setPadding(0, dp(12), 0, dp(4))
                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val pill = tv("", 12f, cAccent2, true).apply { setPadding(dp(9), dp(3), dp(9), dp(3)); background = rr(0x2222D3EE, 10) }
                  val reset = tv("↺", 19f, cMuted).apply { setPadding(dp(12), 0, dp(2), 0) }
                  top.addView(tv(s.title, 14f), lp(0, WC, 1f))
                  top.addView(pill); top.addView(reset)
                  val sb = SeekBar(this)
                  sb.max = s.max - s.min
                  sb.progress = Fx.i(s.key) - s.min
                  sb.progressTintList = ColorStateList.valueOf(cAccent)
                  sb.progressBackgroundTintList = ColorStateList.valueOf(cTrack)
                  sb.thumbTintList = ColorStateList.valueOf(Color.WHITE)

                  fun upd() {
                      pill.text = "${Fx.i(s.key)}${s.unit}"
                      val show = !Fx.isDefault(s.key)
                      reset.animate().alpha(if (show) 1f else 0f).setDuration(160).start()
                      reset.isClickable = show
                  }
                  pill.text = "${Fx.i(s.key)}${s.unit}"
                  reset.alpha = if (Fx.isDefault(s.key)) 0f else 1f
                  reset.isClickable = !Fx.isDefault(s.key)

                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, p: Int, fromUser: Boolean) {
                          if (!fromUser) return
                          Fx.set(s.key, p + s.min)
                          pop(pill)
                          val now = SystemClock.uptimeMillis()
                          if (now - lastTick > 40) { lastTick = now; bar?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK) }
                          upd(); changedKey(s.key)
                      }
                      override fun onStartTrackingTouch(bar: SeekBar?) {}
                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  })

                  val refreshRow: () -> Unit = {
                      val a = ValueAnimator.ofInt(sb.progress, Fx.i(s.key) - s.min)
                      a.duration = 320
                      a.interpolator = DecelerateInterpolator()
                      a.addUpdateListener { sb.progress = it.animatedValue as Int }
                      a.start()
                      upd()
                  }
                  refreshers.add(refreshRow)
                  reset.setOnClickListener {
                      spinReset(it)
                      Fx.resetKey(s.key)
                      changedKey(s.key)
                      refreshRow()
                  }
                  wrap.addView(top, lp(MP, WC))
                  wrap.addView(sb, lp(MP, WC))
                  parent.addView(wrap, lp(MP, WC))
              }

              private fun toggle(parent: LinearLayout, s: Tg) {
                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(0, dp(10), 0, dp(6))
                  val reset = tv("↺", 19f, cMuted).apply { setPadding(dp(4), 0, dp(14), 0) }
                  val sw = Switch(this)
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.thumbTintList = ColorStateList(states, intArrayOf(cAccent2, 0xFFB0BAC8.toInt()))
                  sw.trackTintList = ColorStateList(states, intArrayOf(0x6622D3EE, 0xFF2A3544.toInt()))
                  row.addView(tv(s.title, 14f), lp(0, WC, 1f))
                  row.addView(reset); row.addView(sw)
                  var busy = false
                  sw.isChecked = Fx.i(s.key) == 1
                  reset.alpha = if (Fx.isDefault(s.key)) 0f else 1f
                  reset.isClickable = !Fx.isDefault(s.key)
                  fun upd() {
                      val show = !Fx.isDefault(s.key)
                      reset.animate().alpha(if (show) 1f else 0f).setDuration(160).start()
                      reset.isClickable = show
                  }
                  sw.setOnCheckedChangeListener { v, on ->
                      if (!busy) {
                          Fx.set(s.key, if (on) 1 else 0)
                          v.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                          upd(); changedKey(s.key)
                      }
                  }
                  val refreshRow: () -> Unit = {
                      busy = true; sw.isChecked = Fx.i(s.key) == 1; busy = false
                      upd()
                  }
                  refreshers.add(refreshRow)
                  reset.setOnClickListener {
                      spinReset(it)
                      Fx.resetKey(s.key)
                      changedKey(s.key)
                      refreshRow()
                  }
                  parent.addView(row, lp(MP, WC))
              }

              private fun choice(parent: LinearLayout, s: Ch) {
                  val wrap = LinearLayout(this)
                  wrap.orientation = LinearLayout.VERTICAL
                  wrap.setPadding(0, dp(12), 0, dp(6))
                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val reset = tv("↺", 19f, cMuted).apply { setPadding(dp(12), 0, dp(2), 0) }
                  top.addView(tv(s.title, 14f), lp(0, WC, 1f))
                  top.addView(reset)
                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  hs.overScrollMode = View.OVER_SCROLL_NEVER
                  val row = LinearLayout(this)
                  val items = ArrayList<TextView>()

                  fun paintChips(sel: Int, animate: Boolean) {
                      for ((k, c) in items.withIndex()) {
                          val on = k == sel
                          c.background = rr(if (on) cAccent else 0x14FFFFFF, 16)
                          c.setTextColor(if (on) Color.WHITE else cMuted)
                      }
                      if (animate && sel in items.indices) {
                          val c = items[sel]
                          c.scaleX = 0.88f; c.scaleY = 0.88f
                          c.animate().scaleX(1f).scaleY(1f).setDuration(280).setInterpolator(OvershootInterpolator(3f)).start()
                      }
                  }
                  fun upd() {
                      val show = !Fx.isDefault(s.key)
                      reset.animate().alpha(if (show) 1f else 0f).setDuration(160).start()
                      reset.isClickable = show
                  }
                  s.options.forEachIndexed { i, name ->
                      val c = tv(name, 13f, cMuted).apply { setPadding(dp(14), dp(8), dp(14), dp(8)) }
                      c.setOnClickListener {
                          Fx.set(s.key, i)
                          it.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                          paintChips(i, true); upd(); changedKey(s.key)
                      }
                      items.add(c)
                      row.addView(c, lp(WC, WC).apply { rightMargin = dp(8) })
                  }
                  paintChips(Fx.i(s.key), false)
                  reset.alpha = if (Fx.isDefault(s.key)) 0f else 1f
                  reset.isClickable = !Fx.isDefault(s.key)
                  val refreshRow: () -> Unit = { paintChips(Fx.i(s.key), true); upd() }
                  refreshers.add(refreshRow)
                  reset.setOnClickListener {
                      spinReset(it)
                      Fx.resetKey(s.key)
                      changedKey(s.key)
                      refreshRow()
                  }
                  hs.addView(row)
                  wrap.addView(top, lp(MP, WC))
                  wrap.addView(hs, lp(MP, WC).apply { topMargin = dp(8) })
                  parent.addView(wrap, lp(MP, WC))
              }

              private fun action(parent: LinearLayout, s: Ac) {
                  val b = tv(s.title, 14f, cAccent2, true).apply {
                      gravity = Gravity.CENTER; setPadding(0, dp(13), 0, dp(13))
                      background = ripple(rr(0x1422D3EE, 14, 0x3322D3EE), 14)
                  }
                  press(b)
                  b.setOnClickListener {
                      it.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                      handleAction(s.key)
                  }
                  parent.addView(b, lp(MP, WC).apply { topMargin = dp(12); bottomMargin = dp(4) })
              }

              private fun handleAction(k: String) {
                  when (k) {
                      "act_grant" -> {
                          if (!RootFx.available) snack("Root not detected") else { RootFx.grant(); snack("Permissions granted via root") }
                      }
                      "act_restore" -> {
                          if (!RootFx.available) snack("Root not detected") else { RootFx.restore(); snack("System defaults restored") }
                      }
                      "act_test_trans" -> {
                          if (!FxService.running) snack("Start the overlay first") else RootInput.transSeq.incrementAndGet()
                      }
                      "act_test_sparks" -> {
                          if (!FxService.running) snack("Start the overlay first") else RootInput.demoSeq.incrementAndGet()
                      }
                  }
              }

              private fun toggleService() {
                  val i = Intent(this, FxService::class.java)
                  if (FxService.running) {
                      stopService(i)
                  } else {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          return
                      }
                      if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                      startForegroundService(i)
                  }
                  power.postDelayed({ refreshPower() }, 450)
              }
          }
