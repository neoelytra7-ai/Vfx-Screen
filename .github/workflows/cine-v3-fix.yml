name: Build APK v3 fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          rm -rf app/src
          mkdir -p app/src/main/java/com/example/cineoverlay
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CineOverlay"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.cineoverlay"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.cineoverlay"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="CineOverlay" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FxService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Screen overlay visual effects"/>
                  </service>
                  <service android:name=".FxTile" android:exported="true"
                      android:label="Cine overlay"
                      android:icon="@android:drawable/ic_menu_view"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/cineoverlay/Fx.kt <<'EOF'
          package com.example.cineoverlay

          import android.content.Context
          import android.content.SharedPreferences

          sealed class S(val key: String, val title: String, val def: Int)
          class Sl(key: String, title: String, def: Int, val min: Int, val max: Int, val unit: String = "") : S(key, title, def)
          class Tg(key: String, title: String, def: Boolean) : S(key, title, if (def) 1 else 0)
          class Ch(key: String, title: String, def: Int, val options: List<String>) : S(key, title, def)
          class Ac(key: String, title: String) : S(key, title, 0)
          class Sec(val title: String, val badge: String, val items: List<S>)

          object Fx {
              val sections: List<Sec> = listOf(
                  Sec("Magic touch", "ROOT", listOf(
                      Tg("mg_on", "Touch sparks", true),
                      Sl("mg_density", "Spark amount", 60, 0, 100, "%"),
                      Sl("mg_size", "Spark size", 12, 2, 40, " dp"),
                      Sl("mg_life", "Lifetime", 1100, 300, 3000, " ms"),
                      Sl("mg_scatter", "Scatter", 40, 0, 100, "%"),
                      Sl("mg_inherit", "Follow finger speed", 35, 0, 100, "%"),
                      Sl("mg_gravity", "Gravity (negative floats up)", -25, -100, 100),
                      Sl("mg_depth", "Depth blur", 60, 0, 100, "%"),
                      Ch("mg_shape", "Spark shape", 3, listOf("Bokeh", "Hexagon", "Sparkle", "Mixed")),
                      Ch("mg_color", "Palette", 1, listOf("Golden", "Aurora", "Ice", "Fire", "Rainbow", "Pastel", "White", "Custom")),
                      Sl("mg_hue", "Custom hue", 300, 0, 360, "°"),
                      Sl("mg_sat", "Saturation", 70, 0, 100, "%"),
                      Sl("mg_glow", "Spark glow", 55, 0, 100, "%"),
                      Sl("mg_orb", "Finger glow", 45, 0, 100, "%"),
                      Sl("mg_hold", "Hold shimmer", 40, 0, 100, "%"),
                      Tg("mg_ripple", "Prism shockwave on tap", true),
                      Sl("mg_ripple_size", "Shockwave size", 160, 40, 500, " dp"),
                      Sl("mg_react", "Motion reaction", 50, 0, 100, "%"),
                      Ac("act_test_sparks", "Preview sparks")
                  )),
                  Sec("Transition magic", "ROOT", listOf(
                      Tg("tr_on", "Screen transitions", true),
                      Ch("tr_style", "Style", 4, listOf("Light burst", "Prism sweep", "Spark burst", "Shockwave", "All")),
                      Sl("tr_strength", "Intensity", 70, 10, 100, "%"),
                      Sl("tr_duration", "Duration", 900, 250, 2000, " ms"),
                      Sl("tr_particles", "Burst sparks", 90, 0, 300),
                      Sl("tr_pulse", "Color pulse", 25, 0, 100, "%"),
                      Ac("act_test_trans", "Preview transition")
                  )),
                  Sec("Bloom", "", listOf(
                      Tg("b_on", "Bloom", true),
                      Sl("b_haze", "Pro-mist haze", 12, 0, 100, "%"),
                      Sl("b_haze_temp", "Haze warmth", 60, 0, 100),
                      Sl("b_leaks", "Light leaks", 25, 0, 100, "%"),
                      Sl("b_leak_speed", "Leak speed", 20, 0, 100),
                      Sl("b_streak", "Anamorphic streaks", 35, 0, 100, "%"),
                      Sl("b_streak_len", "Streak length", 200, 50, 400, "%")
                  )),
                  Sec("Soft glow (real blur)", "A12+", listOf(
                      Tg("bl_on", "Soft glow", false),
                      Sl("bl_radius", "Blur radius", 14, 1, 80, " px"),
                      Sl("bl_strength", "Blend", 30, 5, 100, "%")
                  )),
                  Sec("Cinematic look", "", listOf(
                      Sl("fx_vig", "Vignette", 45, 0, 100, "%"),
                      Sl("fx_vig_start", "Vignette start", 55, 20, 90, "%"),
                      Sl("fx_grain", "Film grain", 20, 0, 100, "%"),
                      Sl("fx_grain_size", "Grain size", 2, 1, 6, " px"),
                      Sl("fx_grade", "Teal & orange grade", 25, 0, 100, "%"),
                      Sl("fx_grade_mid", "Grade split point", 50, 10, 90, "%"),
                      Sl("fx_fringe", "Chromatic fringe", 30, 0, 100, "%"),
                      Sl("fx_fringe_start", "Fringe start", 70, 30, 90, "%"),
                      Sl("fx_halation", "Halation glow", 15, 0, 100, "%"),
                      Sl("fx_letterbox", "Letterbox bars", 0, 0, 30, "%"),
                      Sl("fx_scan", "Scanlines", 0, 0, 100, "%"),
                      Sl("fx_scan_gap", "Scanline spacing", 4, 2, 12, " dp"),
                      Sl("fx_flicker", "Film flicker", 0, 0, 100, "%")
                  )),
                  Sec("Root tools", "ROOT", listOf(
                      Tg("rt_on", "Screen color grade", false),
                      Sl("rt_sat", "Saturation", 115, 0, 200, "%"),
                      Sl("rt_contrast", "Contrast", 110, 50, 150, "%"),
                      Sl("rt_warm", "Warmth", 20, -100, 100),
                      Sl("rt_exposure", "Exposure", 0, -50, 50, "%"),
                      Sl("rt_tint", "Tint (green to magenta)", 0, -100, 100),
                      Ch("rt_refresh", "Refresh rate", 0, listOf("Default", "60 Hz", "90 Hz", "120 Hz", "144 Hz")),
                      Sl("rt_anim", "System animation speed", 100, 0, 300, "%"),
                      Ac("act_grant", "Grant permissions via root"),
                      Ac("act_restore", "Restore system defaults")
                  )),
                  Sec("Performance", "", listOf(
                      Sl("pf_fps", "Frame rate limit", 60, 10, 60, " fps"),
                      Tg("pf_pause_off", "Pause when screen is off", true),
                      Tg("pf_batt", "Low battery saver", true),
                      Ch("pf_quality", "Sprite quality", 1, listOf("Low", "Medium", "High"))
                  ))
              )

              val presets: LinkedHashMap<String, Map<String, Int>> = linkedMapOf(
                  "Default" to emptyMap<String, Int>(),
                  "Dreamy" to mapOf("mg_color" to 5, "mg_glow" to 80, "mg_size" to 16, "mg_depth" to 80, "mg_gravity" to -40, "b_haze" to 30, "fx_vig" to 35, "fx_grain" to 10, "fx_grade" to 15),
                  "Cinematic night" to mapOf("mg_color" to 0, "tr_style" to 1, "fx_grade" to 45, "fx_vig" to 60, "fx_grain" to 30, "fx_halation" to 30, "b_streak" to 55, "fx_letterbox" to 8, "fx_fringe" to 40),
                  "Fireflies" to mapOf("mg_color" to 0, "mg_shape" to 0, "mg_size" to 7, "mg_life" to 1800, "mg_gravity" to -15, "mg_scatter" to 60, "mg_glow" to 90, "mg_hold" to 80, "fx_grain" to 0, "fx_fringe" to 0, "fx_grade" to 0, "b_haze" to 5),
                  "Aurora" to mapOf("mg_color" to 1, "mg_glow" to 85, "mg_orb" to 70, "tr_style" to 4, "fx_halation" to 10, "b_leaks" to 45, "fx_grade" to 20),
                  "Subtle" to mapOf("mg_density" to 30, "mg_glow" to 30, "mg_orb" to 20, "b_haze" to 6, "b_leaks" to 0, "b_streak" to 10, "fx_vig" to 25, "fx_grain" to 8, "fx_grade" to 10, "fx_fringe" to 15, "tr_strength" to 40),
                  "All off" to mapOf("mg_on" to 0, "tr_on" to 0, "b_on" to 0, "bl_on" to 0, "fx_vig" to 0, "fx_grain" to 0, "fx_grade" to 0, "fx_fringe" to 0, "fx_halation" to 0, "fx_letterbox" to 0, "fx_scan" to 0, "fx_flicker" to 0)
              )

              private val defs: Map<String, Int> = sections.flatMap { it.items }.associate { it.key to it.def }
              private val map = HashMap<String, Int>()
              private var prefs: SharedPreferences? = null
              @Volatile var version = 0

              fun init(c: Context) {
                  if (prefs != null) return
                  val p = c.applicationContext.getSharedPreferences("fx3", Context.MODE_PRIVATE)
                  prefs = p
                  for (k in defs.keys) if (p.contains(k)) map[k] = p.getInt(k, 0)
                  version++
              }

              fun i(k: String): Int = map[k] ?: defs[k] ?: 0
              fun isDefault(k: String): Boolean = i(k) == (defs[k] ?: 0)

              fun set(k: String, v: Int) {
                  map[k] = v
                  prefs?.edit()?.putInt(k, v)?.apply()
                  version++
              }

              fun resetKeys(keys: List<String>) {
                  val e = prefs?.edit()
                  for (k in keys) { map.remove(k); e?.remove(k) }
                  e?.apply()
                  version++
              }

              fun resetKey(k: String) = resetKeys(listOf(k))

              fun applyPreset(name: String) {
                  map.clear()
                  val e = prefs?.edit()
                  e?.clear()
                  presets[name]?.forEach { (k, v) -> map[k] = v; e?.putInt(k, v) }
                  e?.apply()
                  version++
              }
          }
          EOF
          cat > app/src/main/java/com/example/cineoverlay/FxView.kt <<'EOF'
          package com.example.cineoverlay

          import android.content.*
          import android.graphics.*
          import android.os.BatteryManager
          import android.os.Build
          import android.view.View
          import android.view.WindowManager
          import kotlin.math.*
          import kotlin.random.Random

          class FxView(ctx: Context) : View(ctx) {
              private companion object { const val LEVELS = 8; const val MAXS = 700; const val PAL = 24 }

              private class Sp {
                  var alive = false
                  var x = 0f; var y = 0f; var vx = 0f; var vy = 0f
                  var age = 0f; var life = 1f; var size = 10f
                  var lvl = 0; var kind = 0; var pal = 0
                  var br = 1f; var ph = 0f
              }
              private class Rp { var on = false; var x = 0f; var y = 0f; var age = 0f; var maxR = 100f; var dur = 0.8f }

              var onCfg: (() -> Unit)? = null
              private val dp = ctx.resources.displayMetrics.density
              private val sps = Array(MAXS) { Sp() }
              private var spi = 0
              private val rps = Array(8) { Rp() }
              private var rpi = 0
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val sp = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val dst = RectF()
              private val streakFilter = PorterDuffColorFilter(Color.rgb(127, 176, 255), PorterDuff.Mode.SRC_IN)
              private val bandF = arrayOf<ColorFilter>(
                  PorterDuffColorFilter(Color.rgb(255, 40, 80), PorterDuff.Mode.SRC_IN),
                  PorterDuffColorFilter(Color.rgb(90, 255, 140), PorterDuff.Mode.SRC_IN),
                  PorterDuffColorFilter(Color.rgb(70, 130, 255), PorterDuff.Mode.SRC_IN))

              private var bok0: Array<Bitmap>? = null
              private var bok1: Array<Bitmap>? = null
              private var sparkle: Bitmap? = null
              private var glow: Bitmap? = null
              private var spriteQ = -1
              private var pal: Array<ColorFilter> = emptyArray()

              private var cacheVer = -1; private var cw = 0; private var ch = 0
              private var gradeSh: Shader? = null; private var vigSh: Shader? = null
              private var fringeR: Shader? = null; private var fringeC: Shader? = null
              private var halSh: Shader? = null
              private var scanSh: Shader? = null; private var hazeSh: Shader? = null
              private var unitRad: Shader? = null; private var unitBand: Shader? = null
              private val leakSh = arrayOfNulls<Shader>(3)
              private var gpts = FloatArray(0)

              // cached config
              private var cMagic = true; private var cDens = 0f; private var cSize = 0f; private var cLife = 1f
              private var cScatter = 0f; private var cInherit = 0f; private var cGrav = 0f; private var cDepth = 0f
              private var cShape = 0; private var cGlow = 0f; private var cOrb = 0f; private var cHold = 0f
              private var cRipple = true; private var cRippleR = 0f; private var cReact = 0f
              private var cStreak = 0f; private var cStreakL = 2f; private var cPalMode = 0

              // state
              private var t = 0f; private var chk = 0f; private var last = 0L
              private var motion = 0f
              private val fx = FloatArray(10); private val fy = FloatArray(10)
              private val lx = FloatArray(10); private val ly = FloatArray(10)
              private val acc = FloatArray(10); private val hold = FloatArray(10)
              private val fdown = BooleanArray(10)
              private var lastX = -1f; private var lastY = -1f
              private var seenTrans = RootInput.transSeq.get(); private var seenDemo = RootInput.demoSeq.get()
              private var lastTrans = -10f
              private var transAge = -1f; private var transDur = 0.9f; private var transStr = 0.7f; private var transStyle = 4
              private var tox = 0f; private var toy = 0f
              private var active = false; private var attached = false; private var paused = false; private var battLow = false

              private val rcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (i?.action == Intent.ACTION_SCREEN_OFF) {
                          if (Fx.i("pf_pause_off") == 1) { paused = true; removeCallbacks(tick) }
                      } else if (i?.action == Intent.ACTION_SCREEN_ON) {
                          if (paused) { paused = false; last = 0L; removeCallbacks(tick); post(tick) }
                      }
                  }
              }

              private val tick = object : Runnable {
                  override fun run() {
                      if (!attached || paused) return
                      val now = System.nanoTime()
                      val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.1f)
                      last = now
                      step(dt)
                      val idleAnim = Fx.i("fx_grain") > 0 || Fx.i("fx_flicker") > 0 || (Fx.i("b_on") == 1 && Fx.i("b_leaks") > 0)
                      if (active || idleAnim || cacheVer != Fx.version) invalidate()
                      postDelayed(this, (1000L / effFps()).coerceAtLeast(8L))
                  }
              }

              private fun effFps(): Int {
                  val f = Fx.i("pf_fps").coerceIn(10, 60)
                  val base = if (Fx.i("pf_batt") == 1 && battLow) min(15, f) else f
                  return if (active) base else min(base, 24)
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  attached = true
                  val f = IntentFilter(Intent.ACTION_SCREEN_OFF).apply { addAction(Intent.ACTION_SCREEN_ON) }
                  if (Build.VERSION.SDK_INT >= 33) context.registerReceiver(rcv, f, Context.RECEIVER_NOT_EXPORTED)
                  else context.registerReceiver(rcv, f)
                  readBattery()
                  post(tick)
              }

              override fun onDetachedFromWindow() {
                  attached = false
                  removeCallbacks(tick)
                  try { context.unregisterReceiver(rcv) } catch (e: Exception) {}
                  super.onDetachedFromWindow()
              }

              private fun readBattery() {
                  val i = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED)) ?: return
                  val lv = i.getIntExtra(BatteryManager.EXTRA_LEVEL, 100) * 100 / max(1, i.getIntExtra(BatteryManager.EXTRA_SCALE, 100))
                  val st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                  battLow = lv < 20 && st != BatteryManager.BATTERY_STATUS_CHARGING && st != BatteryManager.BATTERY_STATUS_FULL
              }

              @Suppress("DEPRECATION")
              private fun rot(): Int = (context.getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.rotation

              // ---------------- input ----------------
              private fun touch(e: TEv) {
                  val mxr = if (RootInput.maxX > 0) RootInput.maxX.toFloat() else width.toFloat()
                  val myr = if (RootInput.maxY > 0) RootInput.maxY.toFloat() else height.toFloat()
                  val nx = (e.x / mxr).coerceIn(0f, 1f); val ny = (e.y / myr).coerceIn(0f, 1f)
                  val px: Float; val py: Float
                  when (rot()) {
                      1 -> { px = ny; py = 1f - nx }
                      2 -> { px = 1f - nx; py = 1f - ny }
                      3 -> { px = 1f - ny; py = nx }
                      else -> { px = nx; py = ny }
                  }
                  val x = px * width; val y = py * height
                  val s = e.s.coerceIn(0, 9)
                  when (e.t) {
                      0 -> {
                          fdown[s] = true; fx[s] = x; fy[s] = y; lx[s] = x; ly[s] = y; acc[s] = 0f; lastX = x; lastY = y
                          if (cMagic && cRipple) addRipple(x, y, cRippleR, 0.8f)
                      }
                      1 -> if (fdown[s]) {
                          val dx = x - lx[s]; val dy = y - ly[s]; val d = hypot(dx, dy)
                          fx[s] = x; fy[s] = y; lastX = x; lastY = y
                          if (cMagic && d > 0f) {
                              motion = min(1f, motion + d / (60f * dp))
                              acc[s] += d / dp * cDens
                              while (acc[s] >= 1f) {
                                  acc[s] -= 1f
                                  val f = Random.nextFloat()
                                  spawn(lx[s] + dx * f, ly[s] + dy * f, dx * cInherit, dy * cInherit, 1f)
                              }
                          }
                          lx[s] = x; ly[s] = y
                      }
                      2 -> fdown[s] = false
                  }
              }

              private fun palIdx(): Int =
                  if (cPalMode == 1 || cPalMode == 4) ((t * 5f).toInt() + Random.nextInt(4)) % PAL else Random.nextInt(PAL)

              private fun spawn(x: Float, y: Float, vx: Float, vy: Float, lifeMul: Float) {
                  val s = sps[spi]; spi = (spi + 1) % MAXS
                  val a = Random.nextFloat() * 6.2832f
                  val sc = cScatter * (0.3f + Random.nextFloat())
                  s.alive = true
                  s.x = x + (Random.nextFloat() - 0.5f) * 6f * dp; s.y = y + (Random.nextFloat() - 0.5f) * 6f * dp
                  s.vx = vx + cos(a) * sc; s.vy = vy + sin(a) * sc
                  s.age = 0f; s.life = cLife * lifeMul * (0.6f + Random.nextFloat() * 0.6f)
                  val lv = (Random.nextFloat().pow(1.6f) * cDepth * (LEVELS - 1)).roundToInt().coerceIn(0, LEVELS - 1)
                  s.lvl = lv
                  s.kind = when (cShape) {
                      0 -> 0
                      1 -> 1
                      2 -> 2
                      else -> { val r = Random.nextFloat(); if (r < 0.45f) 0 else if (r < 0.7f) 1 else 2 }
                  }
                  s.size = cSize * (0.5f + Random.nextFloat() * 0.8f) * (1f + lv * 0.10f)
                  s.pal = palIdx()
                  s.br = 0.55f + Random.nextFloat() * 0.45f
                  s.ph = Random.nextFloat() * 6.28f
              }

              private fun addRipple(x: Float, y: Float, maxR: Float, dur: Float) {
                  val r = rps[rpi]; rpi = (rpi + 1) % rps.size
                  r.on = true; r.x = x; r.y = y; r.age = 0f; r.maxR = maxR; r.dur = dur
              }

              private fun burst(n: Int) {
                  for (i in 0 until n) {
                      val a = Random.nextFloat() * 6.2832f
                      val spd = (200f + Random.nextFloat() * 800f) * dp * (0.4f + transStr)
                      spawn(tox, toy, cos(a) * spd, sin(a) * spd, 1.5f)
                  }
              }

              private fun startTransition() {
                  if (t - lastTrans < 0.5f) return
                  lastTrans = t
                  val w = width.toFloat(); val h = height.toFloat()
                  transDur = Fx.i("tr_duration") / 1000f
                  transStr = Fx.i("tr_strength") / 100f
                  transStyle = Fx.i("tr_style")
                  transAge = 0f
                  tox = if (lastX >= 0f) lastX else w / 2f
                  toy = if (lastY >= 0f) lastY else h * 0.55f
                  if (transStyle == 2 || transStyle == 4) burst(Fx.i("tr_particles"))
                  if (transStyle == 3 || transStyle == 4) addRipple(tox, toy, hypot(w, h) * 0.75f, transDur * 1.1f)
                  RootFx.pulse(Fx.i("tr_pulse") / 100f, (transDur * 1000f).toInt())
              }

              private fun demo() {
                  tox = width / 2f; toy = height / 2f; transStr = 0.8f
                  addRipple(tox, toy, 220f * dp, 0.9f)
                  burst(70)
              }

              // ---------------- simulation ----------------
              private fun step(dt: Float) {
                  t += dt; chk += dt
                  if (chk > 5f) { chk = 0f; readBattery() }
                  if (width == 0) return
                  if (cacheVer != Fx.version || width != cw || height != ch) rebuild()

                  var n = 0
                  var e = RootInput.q.poll()
                  while (e != null && n < 600) { touch(e); n++; e = RootInput.q.poll() }
                  val ts = RootInput.transSeq.get()
                  if (ts != seenTrans) { seenTrans = ts; if (Fx.i("tr_on") == 1) startTransition() }
                  val ds = RootInput.demoSeq.get()
                  if (ds != seenDemo) { seenDemo = ds; demo() }

                  motion = max(0f, motion - dt * 2f)
                  if (cMagic && cHold > 0f) for (i in 0..9) if (fdown[i]) {
                      hold[i] += dt * cHold * 14f
                      while (hold[i] >= 1f) { hold[i] -= 1f; spawn(fx[i], fy[i], 0f, 0f, 0.8f) }
                  }

                  var alive = false
                  val grav = cGrav * dt
                  val dr = 1f - min(0.9f, dt * 1.1f)
                  for (s in sps) {
                      if (!s.alive) continue
                      s.age += dt
                      if (s.age >= s.life) { s.alive = false; continue }
                      s.vx *= dr; s.vy = s.vy * dr + grav
                      s.x += s.vx * dt; s.y += s.vy * dt
                      alive = true
                  }
                  for (r in rps) if (r.on) {
                      r.age += dt
                      if (r.age >= r.dur) r.on = false else alive = true
                  }
                  if (transAge >= 0f) {
                      transAge += dt
                      if (transAge >= transDur) transAge = -1f else alive = true
                  }
                  active = alive || fdown.any { it } || motion > 0f
              }

              // ---------------- resources ----------------
              private fun shapePath(sides: Int, cx: Float, cy: Float, r: Float): Path {
                  val p = Path()
                  if (sides == 0) p.addCircle(cx, cy, r, Path.Direction.CW)
                  else {
                      for (i in 0 until sides) {
                          val a = (-PI / 2 + 2 * PI * i / sides).toFloat()
                          val x = cx + r * cos(a); val y = cy + r * sin(a)
                          if (i == 0) p.moveTo(x, y) else p.lineTo(x, y)
                      }
                      p.close()
                  }
                  return p
              }

              private fun bokehSet(sides: Int, sz: Int): Array<Bitmap> {
                  val ring = 0.55f; val fill = 0.35f
                  val r0 = sz * 0.30f
                  return Array(LEVELS) { l ->
                      val soft = l / (LEVELS - 1f)
                      val bmp = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888)
                      val cv = Canvas(bmp)
                      val r = r0 * (0.5f + 0.5f * soft.pow(0.6f))
                      val path = shapePath(sides, sz / 2f, sz / 2f, r)
                      val p = Paint(Paint.ANTI_ALIAS_FLAG)
                      p.color = Color.WHITE
                      p.maskFilter = BlurMaskFilter(max(0.6f, 0.6f + soft * sz * 0.07f), BlurMaskFilter.Blur.NORMAL)
                      p.style = Paint.Style.FILL
                      p.alpha = (255 * (1f - soft * (1f - fill))).toInt().coerceIn(0, 255)
                      cv.drawPath(path, p)
                      if (soft > 0.12f) {
                          p.style = Paint.Style.STROKE
                          p.strokeWidth = r * (0.06f + 0.10f * ring)
                          p.alpha = (255 * ring * min(1f, soft * 2f)).toInt().coerceIn(0, 255)
                          cv.drawPath(path, p)
                      }
                      bmp
                  }
              }

              private fun sparkleBmp(sz: Int): Bitmap {
                  val bmp = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888)
                  val cv = Canvas(bmp)
                  val c0 = sz / 2f; val big = sz * 0.47f; val r = sz * 0.05f
                  val p = Path()
                  p.moveTo(c0, c0 - big)
                  p.quadTo(c0 + r, c0 - r, c0 + big, c0)
                  p.quadTo(c0 + r, c0 + r, c0, c0 + big)
                  p.quadTo(c0 - r, c0 + r, c0 - big, c0)
                  p.quadTo(c0 - r, c0 - r, c0, c0 - big)
                  p.close()
                  val pt = Paint(Paint.ANTI_ALIAS_FLAG)
                  pt.color = Color.WHITE
                  cv.drawPath(p, pt)
                  pt.maskFilter = BlurMaskFilter(sz * 0.05f, BlurMaskFilter.Blur.NORMAL)
                  pt.alpha = 200
                  cv.drawCircle(c0, c0, sz * 0.12f, pt)
                  return bmp
              }

              private fun palette(i: Int): ColorFilter {
                  val f = i / (PAL - 1f)
                  val sat0 = Fx.i("mg_sat") / 100f
                  var hue: Float; var sat: Float
                  when (cPalMode) {
                      0 -> { hue = 36f + 16f * f; sat = sat0 * 0.85f }
                      1 -> { hue = 140f + 170f * f; sat = sat0 }
                      2 -> { hue = 188f + 28f * f; sat = sat0 * 0.55f }
                      3 -> { hue = 4f + 36f * f; sat = sat0 }
                      4 -> { hue = 360f * f; sat = sat0 }
                      5 -> { hue = 360f * f; sat = sat0 * 0.4f }
                      6 -> { hue = 40f; sat = 0f }
                      else -> { hue = Fx.i("mg_hue") + (f - 0.5f) * 40f; sat = sat0 }
                  }
                  hue = ((hue % 360f) + 360f) % 360f
                  val col = Color.HSVToColor(floatArrayOf(hue, sat.coerceIn(0f, 1f), 1f))
                  return PorterDuffColorFilter(col, PorterDuff.Mode.SRC_IN)
              }

              private fun rebuild() {
                  val ver = Fx.version
                  cw = width; ch = height
                  val w = cw.toFloat(); val h = ch.toFloat()
                  val r = hypot(w / 2f, h / 2f)

                  cMagic = Fx.i("mg_on") == 1
                  cDens = Fx.i("mg_density") / 100f * 0.4f
                  cSize = Fx.i("mg_size") * dp
                  cLife = Fx.i("mg_life") / 1000f
                  cScatter = Fx.i("mg_scatter") / 100f * 220f * dp
                  cInherit = Fx.i("mg_inherit") / 100f * 90f
                  cGrav = Fx.i("mg_gravity") / 100f * 400f * dp
                  cDepth = Fx.i("mg_depth") / 100f
                  cShape = Fx.i("mg_shape")
                  cGlow = Fx.i("mg_glow") / 100f; cOrb = Fx.i("mg_orb") / 100f; cHold = Fx.i("mg_hold") / 100f
                  cRipple = Fx.i("mg_ripple") == 1; cRippleR = Fx.i("mg_ripple_size") * dp
                  cReact = Fx.i("mg_react") / 100f
                  cStreak = if (Fx.i("b_on") == 1) Fx.i("b_streak") / 100f else 0f
                  cStreakL = Fx.i("b_streak_len") / 100f
                  cPalMode = Fx.i("mg_color")

                  val q = Fx.i("pf_quality").coerceIn(0, 2)
                  if (q != spriteQ || bok0 == null) {
                      val sz = intArrayOf(96, 128, 192)[q]
                      bok0 = bokehSet(0, sz); bok1 = bokehSet(6, sz); sparkle = sparkleBmp(sz)
                      val g = Bitmap.createBitmap(128, 128, Bitmap.Config.ARGB_8888)
                      val gp = Paint(Paint.ANTI_ALIAS_FLAG)
                      gp.shader = RadialGradient(64f, 64f, 64f,
                          intArrayOf(0xFFFFFFFF.toInt(), 0x55FFFFFF, 0x00FFFFFF), floatArrayOf(0f, 0.3f, 1f), Shader.TileMode.CLAMP)
                      Canvas(g).drawCircle(64f, 64f, 64f, gp)
                      glow = g
                      spriteQ = q
                  }
                  pal = Array(PAL) { palette(it) }

                  val ga = (Fx.i("fx_grade") * 0.9f).toInt().coerceIn(0, 255)
                  val mid = Fx.i("fx_grade_mid") / 100f
                  gradeSh = LinearGradient(0f, 0f, 0f, h,
                      intArrayOf(Color.argb(ga, 0, 110, 130), Color.argb(0, 128, 128, 128), Color.argb(ga, 255, 120, 30)),
                      floatArrayOf(0f, mid, 1f), Shader.TileMode.CLAMP)

                  vigSh = RadialGradient(w / 2f, h / 2f, r, intArrayOf(0, 0, Color.argb(255, 0, 0, 0)),
                      floatArrayOf(0f, Fx.i("fx_vig_start") / 100f, 1f), Shader.TileMode.CLAMP)

                  val off = w * 0.006f * (1f + Fx.i("fx_fringe") / 50f)
                  val fs = Fx.i("fx_fringe_start") / 100f
                  val fm = fs + (1f - fs) * 0.6f
                  fringeR = RadialGradient(w / 2f + off, h / 2f, r,
                      intArrayOf(Color.argb(0, 255, 30, 70), Color.argb(0, 255, 30, 70), Color.argb(255, 255, 30, 70), Color.argb(140, 255, 30, 70)),
                      floatArrayOf(0f, fs, fm, 1f), Shader.TileMode.CLAMP)
                  fringeC = RadialGradient(w / 2f - off, h / 2f, r,
                      intArrayOf(Color.argb(0, 0, 210, 255), Color.argb(0, 0, 210, 255), Color.argb(255, 0, 210, 255), Color.argb(140, 0, 210, 255)),
                      floatArrayOf(0f, fs, fm, 1f), Shader.TileMode.CLAMP)

                  halSh = RadialGradient(w / 2f, h / 2f, r, intArrayOf(Color.argb(0, 255, 70, 25), Color.argb(0, 255, 70, 25), Color.argb(255, 255, 70, 25)),
                      floatArrayOf(0f, 0.62f, 1f), Shader.TileMode.CLAMP)

                  scanSh = null
                  if (Fx.i("fx_scan") > 0) {
                      val gap = (Fx.i("fx_scan_gap") * dp).toInt().coerceAtLeast(2)
                      val b = Bitmap.createBitmap(1, gap, Bitmap.Config.ARGB_8888)
                      b.setPixel(0, 0, Color.argb((Fx.i("fx_scan") * 1.2f).toInt().coerceIn(0, 255), 0, 0, 0))
                      scanSh = BitmapShader(b, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                  }

                  val tmp = Fx.i("b_haze_temp") / 100f
                  val hc = Color.rgb((120 + 135 * tmp).toInt(), (170 + 20 * tmp).toInt(), (255 - 135 * tmp).toInt())
                  hazeSh = RadialGradient(w / 2f, h * 0.35f, w * 0.95f, hc, hc and 0x00FFFFFF, Shader.TileMode.CLAMP)

                  val lc = intArrayOf(Color.rgb(255, 120, 40), Color.rgb(255, 60, 140), Color.rgb(40, 180, 200))
                  for (i in 0..2) leakSh[i] = RadialGradient(0f, 0f, w * 0.75f, lc[i], lc[i] and 0x00FFFFFF, Shader.TileMode.CLAMP)

                  val warm = Color.rgb(255, 236, 210)
                  unitRad = RadialGradient(0f, 0f, 1f, intArrayOf(warm, (warm and 0x00FFFFFF) or 0x70000000, warm and 0x00FFFFFF),
                      floatArrayOf(0f, 0.35f, 1f), Shader.TileMode.CLAMP)
                  unitBand = LinearGradient(-1f, 0f, 1f, 0f, intArrayOf(0x00FFFFFF, 0xFFFFFFFF.toInt(), 0x00FFFFFF),
                      floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP)

                  cacheVer = ver
                  post { onCfg?.invoke() }
              }

              // ---------------- drawing ----------------
              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (w == 0f) return
                  if (cacheVer != Fx.version || width != cw || height != ch) rebuild()

                  if (Fx.i("fx_grade") > 0) fill(c, gradeSh, w, h, 1f)
                  if (Fx.i("b_on") == 1) drawBloom(c, w, h)
                  if (transAge >= 0f) drawTransition(c, w, h)
                  drawRipples(c)
                  drawSparks(c)

                  val react = 1f + motion * cReact
                  val hal = Fx.i("fx_halation")
                  if (hal > 0) fill(c, halSh, w, h, (hal / 100f * 0.55f * react).coerceAtMost(1f))
                  val fr = Fx.i("fx_fringe")
                  if (fr > 0) {
                      val a = (fr / 100f * 0.8f * (1f + motion * cReact * 1.2f)).coerceAtMost(1f)
                      fill(c, fringeR, w, h, a); fill(c, fringeC, w, h, a)
                  }
                  val vg = Fx.i("fx_vig")
                  if (vg > 0) fill(c, vigSh, w, h, (vg / 100f * 0.94f * (1f + motion * cReact * 0.4f)).coerceAtMost(1f))
                  if (Fx.i("fx_scan") > 0) fill(c, scanSh, w, h, 1f)

                  val gr = Fx.i("fx_grain")
                  if (gr > 0) {
                      val n = 300 + gr * 10
                      if (gpts.size < 2 * n) gpts = FloatArray(2 * n)
                      for (i in 0 until 2 * n step 2) { gpts[i] = Random.nextFloat() * w; gpts[i + 1] = Random.nextFloat() * h }
                      paint.shader = null; paint.strokeWidth = Fx.i("fx_grain_size").toFloat(); paint.strokeCap = Paint.Cap.SQUARE
                      val a = (15 + gr * 0.8f).toInt().coerceIn(0, 255)
                      paint.color = Color.argb(a, 255, 255, 255); c.drawPoints(gpts, 0, n, paint)
                      paint.color = Color.argb(a, 0, 0, 0); c.drawPoints(gpts, n, n, paint)
                  }

                  val fl = Fx.i("fx_flicker")
                  if (fl > 0) c.drawColor(Color.argb((Random.nextFloat() * fl * 0.12f).toInt().coerceIn(0, 255), 0, 0, 0))

                  val lb = Fx.i("fx_letterbox")
                  if (lb > 0) {
                      val bar = h * lb / 100f
                      paint.shader = null; paint.color = Color.BLACK
                      c.drawRect(0f, 0f, w, bar, paint); c.drawRect(0f, h - bar, w, h, paint)
                  }
              }

              private fun fill(c: Canvas, s: Shader?, w: Float, h: Float, a: Float) {
                  paint.shader = s; paint.alpha = (a * 255).toInt().coerceIn(0, 255)
                  c.drawRect(0f, 0f, w, h, paint)
                  paint.shader = null; paint.alpha = 255
              }

              private fun drawBloom(c: Canvas, w: Float, h: Float) {
                  val haze = Fx.i("b_haze") / 100f
                  if (haze > 0f) {
                      val tmp = Fx.i("b_haze_temp") / 100f
                      c.drawColor(Color.argb((haze * 45).toInt(), (120 + 135 * tmp).toInt(), (170 + 20 * tmp).toInt(), (255 - 135 * tmp).toInt()))
                      fill(c, hazeSh, w, h, haze * 0.5f)
                  }
                  val lk = Fx.i("b_leaks") / 100f
                  if (lk > 0f) {
                      val sp2 = 0.05f + Fx.i("b_leak_speed") / 100f * 0.5f
                      for (i in 0..2) {
                          val x = w * (0.5f + 0.6f * cos(t * sp2 + i * 2.1f))
                          val y = h * (0.5f + 0.55f * sin(t * sp2 * 0.7f + i * 1.7f))
                          paint.shader = leakSh[i]; paint.alpha = (lk * 110).toInt().coerceIn(0, 255)
                          c.save(); c.translate(x, y); c.drawCircle(0f, 0f, w * 0.75f, paint); c.restore()
                      }
                      paint.shader = null; paint.alpha = 255
                  }
              }

              private fun drawTransition(c: Canvas, w: Float, h: Float) {
                  val p = (transAge / transDur).coerceIn(0f, 1f)
                  val st = transStyle
                  if (st == 0 || st == 4) {
                      val e = 1f - (1f - p) * (1f - p)
                      val rr = max(w, h) * (0.25f + 1.2f * e)
                      val a = (1f - p).pow(2f) * 0.75f * transStr
                      paint.shader = unitRad; paint.alpha = (a * 255).toInt().coerceIn(0, 255)
                      c.save(); c.translate(tox, toy); c.scale(rr, rr); c.drawCircle(0f, 0f, 1f, paint); c.restore()
                      paint.shader = null; paint.alpha = 255
                      val glw = glow
                      if (cStreak > 0f && glw != null) {
                          sp.colorFilter = streakFilter
                          sp.alpha = ((1f - p).pow(2f) * cStreak * 0.9f * transStr * 255).toInt().coerceIn(0, 255)
                          dst.set(tox - w, toy - 9f * dp, tox + w, toy + 9f * dp)
                          c.drawBitmap(glw, null, dst, sp)
                          sp.colorFilter = null
                      }
                  }
                  if (st == 1 || st == 4) {
                      val e = p * p * (3f - 2f * p)
                      val xs = -0.45f * w + 1.9f * w * e
                      val bell = sin(PI * p).toFloat()
                      val d = w * 0.075f
                      paint.shader = unitBand
                      for (k in 0..2) {
                          paint.colorFilter = bandF[k]
                          paint.alpha = (bell * 0.55f * transStr * 255).toInt().coerceIn(0, 255)
                          c.save(); c.translate(xs + (k - 1) * d, 0f); c.skew(-0.12f, 0f); c.scale(w * 0.26f, 1f)
                          c.drawRect(-1f, -0.1f * h, 1f, 1.1f * h, paint)
                          c.restore()
                      }
                      paint.shader = null; paint.colorFilter = null; paint.alpha = 255
                  }
              }

              private fun drawRipples(c: Canvas) {
                  paint.shader = null; paint.style = Paint.Style.STROKE
                  for (r in rps) {
                      if (!r.on) continue
                      val p = (r.age / r.dur).coerceIn(0f, 1f)
                      val e = 1f - (1f - p) * (1f - p) * (1f - p)
                      val rad = r.maxR * e
                      val a = (1f - p).pow(1.5f)
                      val sw = max(1.5f, (3.5f * (1f - p) + 1f) * dp)
                      val off = (2f + 6f * p) * dp
                      paint.strokeWidth = sw
                      paint.color = Color.argb((a * 200).toInt().coerceIn(0, 255), 255, 50, 90); c.drawCircle(r.x, r.y, rad + off, paint)
                      paint.color = Color.argb((a * 200).toInt().coerceIn(0, 255), 70, 130, 255); c.drawCircle(r.x, r.y, max(1f, rad - off), paint)
                      paint.strokeWidth = sw * 0.7f
                      paint.color = Color.argb((a * 230).toInt().coerceIn(0, 255), 255, 255, 255); c.drawCircle(r.x, r.y, rad, paint)
                  }
                  paint.style = Paint.Style.FILL
              }

              private fun drawSparks(c: Canvas) {
                  val b0 = bok0 ?: return; val b1 = bok1 ?: return
                  val spk = sparkle ?: return; val gl = glow ?: return
                  val pals = pal
                  if (pals.isEmpty()) return

                  if (cMagic && cOrb > 0f) for (i in 0..9) {
                      if (!fdown[i]) continue
                      val r = (28f + 90f * cOrb) * dp * (0.92f + 0.08f * sin(t * 7f + i)) * (1f + motion * 0.35f)
                      sp.colorFilter = pals[((t * 4f).toInt() + i * 5) % PAL]
                      sp.alpha = (255 * min(1f, 0.35f + 0.5f * cOrb)).toInt().coerceIn(0, 255)
                      dst.set(fx[i] - r, fy[i] - r, fx[i] + r, fy[i] + r)
                      c.drawBitmap(gl, null, dst, sp)
                  }

                  for (s in sps) {
                      if (!s.alive) continue
                      val f = s.age / s.life
                      val fadeIn = min(1f, s.age / 0.08f)
                      val tw = 0.8f + 0.2f * sin(s.ph + s.age * 12f)
                      val a = (fadeIn * (1f - f).pow(1.4f) * tw * s.br).coerceIn(0f, 1f)
                      if (a < 0.01f) continue
                      val rad = s.size * (1f - 0.35f * f)
                      sp.colorFilter = pals[s.pal]
                      if (cGlow > 0f) {
                          sp.alpha = (a * cGlow * 0.7f * 255).toInt().coerceIn(0, 255)
                          val g = rad * 2.6f
                          dst.set(s.x - g, s.y - g, s.x + g, s.y + g)
                          c.drawBitmap(gl, null, dst, sp)
                      }
                      sp.alpha = (a * 255).toInt().coerceIn(0, 255)
                      if (s.kind == 2) {
                          val e = rad * 1.5f * (0.85f + 0.3f * sin(s.ph + s.age * 9f))
                          dst.set(s.x - e, s.y - e, s.x + e, s.y + e)
                          c.drawBitmap(spk, null, dst, sp)
                      } else {
                          val e = rad * 1.667f
                          dst.set(s.x - e, s.y - e, s.x + e, s.y + e)
                          c.drawBitmap(if (s.kind == 1) b1[s.lvl] else b0[s.lvl], null, dst, sp)
                      }
                      if (cStreak > 0f && s.br > 0.85f) {
                          sp.colorFilter = streakFilter
                          sp.alpha = (a * cStreak * 0.6f * 255).toInt().coerceIn(0, 255)
                          val l = rad * 3f * cStreakL; val hh = rad * 0.28f
                          dst.set(s.x - l, s.y - hh, s.x + l, s.y + hh)
                          c.drawBitmap(gl, null, dst, sp)
                      }
                  }
                  sp.colorFilter = null
              }
          }
