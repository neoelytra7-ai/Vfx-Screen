          package com.example.cineoverlay

          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.atomic.AtomicInteger

          class TEv(val t: Int, val s: Int, val x: Int, val y: Int)

          /** Root readers: raw touch events (getevent) and foreground-app changes (logcat events). */
          object RootInput {
              val q = ConcurrentLinkedQueue<TEv>()
              val transSeq = AtomicInteger(0)
              val demoSeq = AtomicInteger(0)
              @Volatile var maxX = 0
              @Volatile var maxY = 0
              @Volatile var running = false
              private val procs = ArrayList<Process>()
              @Volatile private var gen = 0

              @Synchronized fun start() {
                  if (running) return
                  running = true
                  gen++
                  val g = gen
                  Thread { try { touchLoop(g) } catch (e: Exception) {} }.start()
                  Thread { try { transLoop(g) } catch (e: Exception) {} }.start()
              }

              @Synchronized fun stop() {
                  running = false
                  gen++
                  for (p in procs) try { p.destroy() } catch (e: Exception) {}
                  procs.clear()
                  q.clear()
              }

              @Synchronized private fun spawn(cmd: String): Process? = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", cmd))
                  procs.add(p)
                  p
              } catch (e: Exception) { null }

              private fun touchLoop(g: Int) {
                  var dev = ""
                  val p0 = spawn("getevent -pl") ?: return
                  val rx = Regex("max\\s+(\\d+)")
                  var cur = ""; var cx = 0; var cy = 0
                  BufferedReader(InputStreamReader(p0.inputStream)).use { r ->
                      while (true) {
                          val line = r.readLine() ?: break
                          if (line.contains("add device")) { cur = line.substringAfter(": ").trim(); cx = 0; cy = 0 }
                          else if (line.contains("ABS_MT_POSITION_X")) cx = rx.find(line)?.groupValues?.get(1)?.toIntOrNull() ?: 0
                          else if (line.contains("ABS_MT_POSITION_Y")) cy = rx.find(line)?.groupValues?.get(1)?.toIntOrNull() ?: 0
                          if (dev.isEmpty() && cx > 0 && cy > 0) { dev = cur; maxX = cx; maxY = cy }
                      }
                  }
                  try { p0.destroy() } catch (e: Exception) {}

                  val p = spawn(if (dev.isNotEmpty()) "getevent -l $dev" else "getevent -l") ?: return
                  val sx = IntArray(10); val sy = IntArray(10)
                  val dn = BooleanArray(10); val up = BooleanArray(10); val mv = BooleanArray(10); val on = BooleanArray(10)
                  var slot = 0
                  val ws = Regex("\\s+")
                  BufferedReader(InputStreamReader(p.inputStream)).use { r ->
                      while (gen == g) {
                          val line = r.readLine() ?: break
                          val tk = line.trim().split(ws)
                          val ei = tk.indexOfFirst { it.startsWith("EV_") }
                          if (ei < 0 || ei + 2 >= tk.size) continue
                          val lab = tk[ei + 1]; val v = tk[ei + 2]
                          when (lab) {
                              "ABS_MT_SLOT" -> slot = (v.toIntOrNull(16) ?: 0).coerceIn(0, 9)
                              "ABS_MT_TRACKING_ID" -> { if (v.equals("ffffffff", true)) up[slot] = true else dn[slot] = true }
                              "ABS_MT_POSITION_X" -> { sx[slot] = v.toIntOrNull(16) ?: 0; mv[slot] = true }
                              "ABS_MT_POSITION_Y" -> { sy[slot] = v.toIntOrNull(16) ?: 0; mv[slot] = true }
                              "SYN_REPORT" -> {
                                  for (i in 0..9) {
                                      if (dn[i]) { on[i] = true; q.add(TEv(0, i, sx[i], sy[i])) }
                                      else if (mv[i] && on[i]) q.add(TEv(1, i, sx[i], sy[i]))
                                      if (up[i]) { if (on[i]) q.add(TEv(2, i, sx[i], sy[i])); on[i] = false }
                                      dn[i] = false; up[i] = false; mv[i] = false
                                  }
                                  if (q.size > 3000) q.clear()
                              }
                          }
                      }
                  }
              }

              private fun transLoop(g: Int) {
                  val p = spawn("logcat -b events -T 1 -s wm_set_resumed_activity") ?: return
                  val t0 = System.currentTimeMillis()
                  BufferedReader(InputStreamReader(p.inputStream)).use { r ->
                      while (gen == g) {
                          val line = r.readLine() ?: break
                          if (System.currentTimeMillis() - t0 > 1200 && line.isNotBlank() && !line.startsWith("-")) transSeq.incrementAndGet()
                      }
                  }
              }
          }
