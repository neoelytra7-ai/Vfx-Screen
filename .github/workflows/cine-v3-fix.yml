          package com.example.cineoverlay

          import android.app.*
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.View
          import android.view.WindowManager

          class FxService : Service() {
              companion object { @Volatile var running = false }
              private var view: FxView? = null
              private var viewLp: WindowManager.LayoutParams? = null
              private var blur: View? = null
              private var blurLp: WindowManager.LayoutParams? = null
              private val wm get() = getSystemService(WINDOW_SERVICE) as WindowManager

              override fun onBind(i: Intent?): IBinder? = null

              private fun overlayParams(blurFlag: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  if (blurFlag && Build.VERSION.SDK_INT >= 31) flags = flags or WindowManager.LayoutParams.FLAG_BLUR_BEHIND
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, flags, PixelFormat.TRANSLUCENT)
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  return lp
              }

              private fun updateBlur() {
                  val v = view ?: return
                  val want = Fx.i("bl_on") == 1 && Build.VERSION.SDK_INT >= 31 && wm.isCrossWindowBlurEnabled
                  if (!want) {
                      blur?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                      blur = null; blurLp = null
                      return
                  }
                  val d = resources.displayMetrics.density
                  val r = (Fx.i("bl_radius") * d).toInt()
                  val a = Fx.i("bl_strength") / 100f
                  val existing = blurLp
                  if (blur == null || existing == null) {
                      val lp = overlayParams(true)
                      lp.blurBehindRadius = r
                      lp.alpha = a
                      val bv = View(this)
                      bv.setBackgroundColor(0x01000000)
                      wm.addView(bv, lp)
                      blur = bv; blurLp = lp
                      // keep the effects window above the blur layer
                      viewLp?.let { vlp -> try { wm.removeView(v); wm.addView(v, vlp) } catch (e: Exception) {} }
                  } else {
                      existing.blurBehindRadius = r
                      existing.alpha = a
                      wm.updateViewLayout(blur, existing)
                  }
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  Fx.init(this)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("fx", "Overlay", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 0,
                      Intent(this, FxService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
                  startForeground(1, Notification.Builder(this, "fx")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Cinematic overlay active")
                      .addAction(Notification.Action.Builder(null, "Stop", stop).build()).build())

                  if (i?.action == "STOP") { stopSelf(); return START_NOT_STICKY }
                  if (view == null) {
                      val lp = overlayParams(false)
                      viewLp = lp
                      val fv = FxView(this)
                      fv.onCfg = { updateBlur() }
                      view = fv
                      wm.addView(fv, lp)
                      running = true
                      Thread {
                          val ok = RootShell.isRoot()
                          RootFx.available = ok
                          if (ok) { RootInput.start(); RootFx.boot() }
                      }.start()
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  running = false
                  RootInput.stop()
                  blur?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  blur = null
                  view?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  view = null
                  super.onDestroy()
              }
          }
