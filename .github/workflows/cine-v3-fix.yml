          package com.example.cineoverlay

          import java.io.OutputStream
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.math.PI
          import kotlin.math.max
          import kotlin.math.sin

          object RootShell {
              private var proc: Process? = null
              private var out: OutputStream? = null

              @Synchronized fun exec(cmd: String): Boolean = try {
                  if (proc == null) { val p = Runtime.getRuntime().exec("su"); proc = p; out = p.outputStream }
                  out!!.write(("($cmd) >/dev/null 2>&1\n").toByteArray())
                  out!!.flush()
                  true
              } catch (e: Exception) { proc = null; out = null; false }

              fun isRoot(): Boolean = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", "id"))
                  val s = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  s.contains("uid=0")
              } catch (e: Exception) { false }
          }

          /** Root tools: whole-screen color matrix via SurfaceFlinger, refresh rate, animation scale, permission grants. */
          object RootFx {
              private const val PKG = "com.example.cineoverlay"
              @Volatile var available = false
              private val ex = Executors.newSingleThreadExecutor()
              private val mq = AtomicBoolean(false)
              private val pulsing = AtomicBoolean(false)

              fun boot() { if (available && Fx.i("rt_on") == 1) matrixAsync() }

              fun matrixAsync() {
                  if (mq.compareAndSet(false, true)) ex.execute { mq.set(false); applyMatrix() }
              }

              fun onKeyChanged(k: String) {
                  when (k) {
                      "rt_refresh" -> ex.execute { applyRefresh() }
                      "rt_anim" -> ex.execute { applyAnim() }
                      else -> matrixAsync()
                  }
              }

              fun syncAll() {
                  if (!available) return
                  matrixAsync()
                  ex.execute { applyRefresh(); applyAnim() }
              }

              fun grant() = ex.execute {
                  RootShell.exec("appops set $PKG SYSTEM_ALERT_WINDOW allow")
                  RootShell.exec("pm grant $PKG android.permission.POST_NOTIFICATIONS")
                  RootShell.exec("cmd deviceidle whitelist +$PKG")
              }

              fun restore() = ex.execute {
                  RootShell.exec("service call SurfaceFlinger 1015 i32 0")
                  RootShell.exec("settings delete system min_refresh_rate; settings delete system peak_refresh_rate")
                  RootShell.exec("settings put global window_animation_scale 1.0; settings put global transition_animation_scale 1.0; settings put global animator_duration_scale 1.0")
              }

              private fun matrixCmd(s: Float, c: Float, w: Float, e: Float, t: Float): String {
                  val l = floatArrayOf(0.213f, 0.715f, 0.072f)
                  val ex2 = 1f + e
                  val gain = floatArrayOf((1f + 0.12f * w + 0.04f * t) * ex2, (1f - 0.12f * t) * ex2, (1f - 0.18f * w + 0.04f * t) * ex2)
                  val m = Array(3) { FloatArray(3) }
                  for (r in 0..2) for (k in 0..2)
                      m[r][k] = (l[k] * (1 - s) + (if (r == k) s else 0f)) * c * gain[r]
                  val off = FloatArray(3) { (1 - c) / 2f * gain[it] }
                  val f = floatArrayOf(
                      m[0][0], m[1][0], m[2][0], 0f,
                      m[0][1], m[1][1], m[2][1], 0f,
                      m[0][2], m[1][2], m[2][2], 0f,
                      off[0], off[1], off[2], 1f)
                  return "service call SurfaceFlinger 1015 i32 1 " + f.joinToString(" ") { "f $it" }
              }

              private fun applyMatrix() {
                  if (Fx.i("rt_on") == 1) {
                      RootShell.exec(matrixCmd(Fx.i("rt_sat") / 100f, Fx.i("rt_contrast") / 100f, Fx.i("rt_warm") / 100f, Fx.i("rt_exposure") / 100f, Fx.i("rt_tint") / 100f))
                  } else RootShell.exec("service call SurfaceFlinger 1015 i32 0")
              }

              private fun applyRefresh() {
                  val hz = intArrayOf(0, 60, 90, 120, 144)[Fx.i("rt_refresh").coerceIn(0, 4)]
                  if (hz == 0) RootShell.exec("settings delete system min_refresh_rate; settings delete system peak_refresh_rate")
                  else RootShell.exec("settings put system min_refresh_rate $hz.0; settings put system peak_refresh_rate $hz.0")
              }

              private fun applyAnim() {
                  val v = String.format(Locale.US, "%.2f", Fx.i("rt_anim") / 100f)
                  RootShell.exec("settings put global window_animation_scale $v; settings put global transition_animation_scale $v; settings put global animator_duration_scale $v")
              }

              /** Brief saturation/exposure swell used by screen transitions. */
              fun pulse(amount: Float, ms: Int) {
                  if (!available || amount <= 0f || !pulsing.compareAndSet(false, true)) return
                  ex.execute {
                      try {
                          val on = Fx.i("rt_on") == 1
                          val s0 = if (on) Fx.i("rt_sat") / 100f else 1f
                          val c0 = if (on) Fx.i("rt_contrast") / 100f else 1f
                          val w0 = if (on) Fx.i("rt_warm") / 100f else 0f
                          val e0 = if (on) Fx.i("rt_exposure") / 100f else 0f
                          val t0 = if (on) Fx.i("rt_tint") / 100f else 0f
                          val steps = max(6, ms / 70)
                          for (k in 0..steps) {
                              val bell = sin(PI * k / steps).toFloat()
                              RootShell.exec(matrixCmd(s0 * (1f + amount * 0.9f * bell), c0 * (1f + amount * 0.15f * bell), w0, e0 + amount * 0.12f * bell, t0))
                              Thread.sleep((ms / steps).toLong())
                          }
                          applyMatrix()
                      } finally { pulsing.set(false) }
                  }
              }
          }
