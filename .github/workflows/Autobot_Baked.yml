              lf = Vector(fpos) - ABS[par]
              d0 = 40 + PLT.index((nm, par, fpos, fs, wpos)) * 5
              key(ob, 1, loc=l0, rot=r0.to_euler(), scl=s0); key(ob, d0, loc=l0, rot=r0.to_euler(), scl=s0)
              mid = (l0 + lf) / 2 + Vector((0, -0.7, 0.3)); mid.x = l0.x + (lf.x - l0.x) * .5
              key(ob, d0 + 40, loc=mid, rot=Euler((R(rnd.uniform(-25, 25)), 0, R(rnd.uniform(-30, 30)))), scl=(1, 1, 1))
              key(ob, 170 + PLT.index((nm, par, fpos, fs, wpos)) * 3, loc=lf + Vector((0, -.05, 0)), rot=(0, 0, 0), scl=(fs, fs, fs))
              key(ob, 182 + PLT.index((nm, par, fpos, fs, wpos)) * 3, loc=lf, rot=(0, 0, 0), scl=(fs, fs, fs))
          # measure hand at grab -> solve lift height so hands reach just above the top edge
          sc.frame_set(326)
          hz = (LINK['pmp'].matrix_world.translation.z + LINK['pmm'].matrix_world.translation.z) / 2
          RZ += 7.9 - hz
          lift_keys(RZ)
          sc.frame_set(326)
          hp_ = (LINK['pmp'].matrix_world.translation + LINK['pmm'].matrix_world.translation) / 2
          BAR0 = Vector((0, hp_.y + 0.34, hp_.z + 0.04))
          BARB = LINK['bar']
          key(BARB, 1, loc=BAR0); key(BARB, 326, loc=BAR0)
          for f in range(330, 451, 4): key(BARB, f, loc=BAR0 + Vector((0, 0, liftz(RZ, f) - liftz(RZ, 326))))
          for f in range(330, 451, 4): pass
          # gears spin
          for nm, ax, s in GEARS:
              ob = LINK[nm]; i_ = 1 if ax == 'y' else 2
              for f, a in [(1, 0), (NF, s * 6 * math.pi)]:
                  r_ = [0, 0, 0]; r_[i_] = a; key(ob, f, rot=tuple(r_))
              interp(ob, 'LINEAR')
          # plumes
          for x in 'pm':
              for nm in ('plb' + x, 'plf' + x):
                  ob = LINK[nm]
                  for f, v in [(1, 0), (246, 0), (262, 1.0), (330, 1.0), (338, .75), (428, .7), (446, 0)]: key(ob, f, scl=(v if v else .001,) * 3)
                  noise(ob, 'scale', 2, .12, 3, 250, 440)
          # lights / camera / world
          tgt = bpy.data.objects.new('tgt', None); sc.collection.objects.link(tgt); tgt.location = (0, -0.9, 3)
          rig = bpy.data.objects.new('rig', None); sc.collection.objects.link(rig); rig.location = (0, 0, 3)
          cc = rig.constraints.new('COPY_LOCATION'); cc.target = LIFTOB; cc.use_x = False; cc.use_y = False; cc.use_z = True; cc.use_offset = True
          tc_ = tgt.constraints.new('COPY_LOCATION'); tc_.target = rig; tc_.use_x = False; tc_.use_y = False; tc_.use_z = True
          def light(name, loc, en, col, size):
              d = bpy.data.lights.new(name, 'AREA'); d.energy = en; d.color = col; d.shape = 'RECTANGLE'; d.size = size[0]; d.size_y = size[1]
              o = bpy.data.objects.new(name, d); sc.collection.objects.link(o); o.location = loc; o.parent = rig
              t = o.constraints.new('TRACK_TO'); t.target = tgt; t.track_axis = 'TRACK_NEGATIVE_Z'; t.up_axis = 'UP_Y'
          light('key', (-5, -8, 3), 4200, (1.0, 0.93, 0.85), (6, 6))
          light('rim', (6, 3.5, 2), 2600, (0.35, 0.75, 1.0), (3, 6))
          light('rim2', (-6, 3, 0), 1500, (1.0, 0.5, 0.25), (3, 6))
          light('fill', (5, -7, -3), 900, (0.6, 0.7, 1.0), (6, 6))
          light('top', (0, -3, 9), 1200, (1, 1, 1), (8, 3))
          w_ = bpy.data.worlds.new('W'); sc.world = w_; w_.use_nodes = True
          bg = w_.node_tree.nodes['Background']; bg.inputs['Color'].default_value = (0.03, 0.04, 0.06, 1); bg.inputs['Strength'].default_value = 0.8
          cam = bpy.data.cameras.new('C'); cam.lens = 40; cam.sensor_width = 36; cam.sensor_fit = 'HORIZONTAL'
          cam.clip_start = .1; cam.clip_end = 100
          try:
              cam.dof.use_dof = True; cam.dof.focus_distance = 7.1; cam.dof.aperture_fstop = 5.6
          except Exception: pass
          co = bpy.data.objects.new('C', cam); sc.collection.objects.link(co)
          co.location = (0, -8, 0); co.rotation_euler = (R(90), 0, 0); sc.camera = co

          # ============================================================ track + smoke schedule
          VENTS = [('wgp', Vector((1.2, 1.1, 5.2))), ('wgm', Vector((-1.2, 1.1, 5.2))), ('hpp', Vector((.62, .45, 2.5))), ('hpm', Vector((-.62, .45, 2.5))),
                   ('waist', Vector((.4, 1.1, 4.8))), ('waist', Vector((-.4, 1.1, 4.8))), ('knp', Vector((.62, .6, 1.5))), ('knm', Vector((-.62, .6, 1.5))),
                   ('shp', Vector((1.8, 0, 5.1))), ('shm', Vector((-1.8, 0, 5.1)))]
          NZ = ['plbp', 'plbm', 'plfp', 'plfm']
          track, EM = [], []
          for f in range(1, NF + 1):
              sc.frame_set(f)
              v = world_to_camera_view(sc, co, BARB.matrix_world.translation)
              evt = 0
              if f in (100, 126, 142, 158, 174, 184): evt = 1
              if f == 252: evt = 2
              if f == 326: evt = 3
              track.append((f, 1 - v.y, evt))
              def wp(l, p):  # world position of a robot-space point attached to link l
                  return LINK[l].matrix_world @ (p - ABS[l])
              if 96 <= f <= 190 and f % 5 == 0:
                  l, p = rnd.choice(VENTS); EM.append((f, 'steam', wp(l, p), Vector((rnd.uniform(-.4, .4), rnd.uniform(.2, .6), 1)).normalized()))
              if 248 <= f <= 272 and f % 2 == 0:
                  for n_ in NZ[2:]: EM.append((f, 'burst', LINK[n_].matrix_world.translation.copy(), Vector((rnd.uniform(-1, 1), rnd.uniform(-1, 1), .15)).normalized()))
              if 252 <= f <= 332 and f % 3 == 0:
                  for n_ in NZ: EM.append((f, 'jet', LINK[n_].matrix_world.translation.copy(), (LINK[n_].matrix_world.to_3x3() @ Vector((0, 0, -1))).normalized()))
              if 334 <= f <= 430 and f % 4 == 0:
                  for n_ in NZ[:2]: EM.append((f, 'jet2', LINK[n_].matrix_world.translation.copy(), (LINK[n_].matrix_world.to_3x3() @ Vector((0, 0, -1))).normalized()))
              if f in (140, 160, 180):  # chest steam bursts at lock
                  for l, p in VENTS[:6]: EM.append((f, 'steam', wp(l, p), Vector((rnd.uniform(-.4, .4), rnd.uniform(.2, .6), 1)).normalized()))
          print('emissions:', len(EM))
          if SH == 0 and not PREVIEW:
              with open(os.path.join(OUT, 'track.csv'), 'w') as fh:
                  for f, b, e in track: fh.write('%d,%.5f,%d\n' % (f, b, e))

          # ============================================================ smoke (path-traced volumes)
          def smoke_mat():
              m, nt, N, L = mk('SMK'); out = N.new('ShaderNodeOutputMaterial')
              tc = N.new('ShaderNodeTexCoord'); oi = N.new('ShaderNodeObjectInfo')
              tn = N.new('ShaderNodeValue'); tn.name = 'T'
              fc = nt.driver_add('nodes["T"].outputs[0].default_value'); fc.driver.type = 'SCRIPTED'; fc.driver.expression = 'frame*0.045'
              ad = N.new('ShaderNodeMath'); ad.operation = 'MULTIPLY_ADD'; ad.inputs[1].default_value = 30.0
              L.new(oi.outputs['Random'], ad.inputs[0]); L.new(tn.outputs[0], ad.inputs[2])
              nz = N.new('ShaderNodeTexNoise'); nz.noise_dimensions = '4D'
              nz.inputs['Scale'].default_value = 1.8; nz.inputs['Detail'].default_value = 6; nz.inputs['Roughness'].default_value = 0.55
              L.new(tc.outputs['Object'], nz.inputs['Vector']); L.new(ad.outputs[0], nz.inputs['W'])
              ln = N.new('ShaderNodeVectorMath'); ln.operation = 'LENGTH'; L.new(tc.outputs['Object'], ln.inputs[0])
              r1 = N.new('ShaderNodeMapRange'); r1.inputs['From Min'].default_value = .3; r1.inputs['From Max'].default_value = 1.0
              r1.inputs['To Min'].default_value = 1.0; r1.inputs['To Max'].default_value = 0.0; L.new(ln.outputs['Value'], r1.inputs['Value'])
              r2 = N.new('ShaderNodeMapRange'); r2.inputs['From Min'].default_value = .38; r2.inputs['From Max'].default_value = .72
              L.new(nz.outputs['Fac'], r2.inputs['Value'])
              m1 = N.new('ShaderNodeMath'); m1.operation = 'MULTIPLY'; L.new(r1.outputs['Result'], m1.inputs[0]); L.new(r2.outputs['Result'], m1.inputs[1])
              sp = N.new('ShaderNodeSeparateColor'); L.new(oi.outputs['Color'], sp.inputs['Color'])
              m2 = N.new('ShaderNodeMath'); m2.operation = 'MULTIPLY'; L.new(m1.outputs[0], m2.inputs[0]); L.new(sp.outputs['Red'], m2.inputs[1])
              m3 = N.new('ShaderNodeMath'); m3.operation = 'MULTIPLY'; m3.inputs[1].default_value = 5.0; L.new(m2.outputs[0], m3.inputs[0])
              pv = N.new('ShaderNodeVolumePrincipled'); pv.inputs['Color'].default_value = (.8, .8, .82, 1); pv.inputs['Anisotropy'].default_value = .35
              L.new(m3.outputs[0], pv.inputs['Density']); L.new(pv.outputs['Volume'], out.inputs['Volume'])
              return m
          sm = smoke_mat()
          sme = bpy.data.meshes.new('puff'); bmx = bmesh.new(); bmesh.ops.create_icosphere(bmx, subdivisions=2, radius=1.0); bmx.to_mesh(sme); bmx.free()
          sme.materials.append(sm)
          KIND = {'steam': (.1, .5, 40, .03, 1.0, .3), 'burst': (.35, 1.9, 70, .05, 1.6, .15), 'jet': (.25, 1.2, 55, .12, 1.3, .3), 'jet2': (.25, 1.0, 50, .08, 1.0, .3)}
          for i, (f, kd, pos, dr) in enumerate(EM):
              r0, r1_, life, spd, dens, rise = KIND[kd]
              ob = bpy.data.objects.new('pf%d' % i, sme); sc.collection.objects.link(ob)
              ob.rotation_euler = (rnd.uniform(0, 6), rnd.uniform(0, 6), rnd.uniform(0, 6))
              p1 = pos + dr * spd * life * .6 + Vector((rnd.uniform(-.3, .3), rnd.uniform(-.2, .2), rise * life * .02))
              ob.hide_render = True; ob.keyframe_insert('hide_render', frame=max(0, f - 1))
              ob.hide_render = False; ob.keyframe_insert('hide_render', frame=f)
              ob.hide_render = True; ob.keyframe_insert('hide_render', frame=f + life + 1)
              key(ob, f, loc=pos); key(ob, f + life, loc=p1)
              key(ob, f, scl=(r0,) * 3); key(ob, f + life, scl=(r1_,) * 3)
              for ff, d in [(f, 0), (f + 5, dens), (f + int(life * .55), dens * .6), (f + life, 0)]:
                  ob.color = (d, d, d, 1); ob.keyframe_insert('color', frame=ff)
          print('puffs:', len(EM))

          # ============================================================ render
          cy = sc.cycles
          sc.render.engine = 'CYCLES'
          cy.device = 'CPU'; cy.samples = SPP; cy.use_denoising = True
          try: cy.denoiser = 'OPENIMAGEDENOISE'
          except Exception: pass
          cy.use_adaptive_sampling = True; cy.adaptive_threshold = 0.02
          cy.max_bounces = 8; cy.diffuse_bounces = 2; cy.glossy_bounces = 5; cy.transmission_bounces = 6
          cy.volume_bounces = 1; cy.transparent_max_bounces = 8
          try: cy.volume_step_rate = 1.6; cy.volume_max_steps = 64
          except Exception: pass
          sc.render.film_transparent = True
          sc.render.resolution_x, sc.render.resolution_y, sc.render.resolution_percentage = RW, RH, 100
          sc.render.image_settings.file_format = 'PNG'; sc.render.image_settings.color_mode = 'RGBA'; sc.render.image_settings.color_depth = '8'
          sc.render.use_motion_blur = True
          try: sc.render.motion_blur_shutter = 0.4
          except Exception: pass
          try:
              sc.view_settings.view_transform = 'AgX'
              sc.view_settings.look = 'Medium High Contrast'
          except Exception: pass
          sc.view_settings.exposure = float(os.environ.get('EXPO', '0'))
          frames = [1, 45, 90, 125, 160, 200, 250, 290, 318, 340, 380, 420] if PREVIEW else [f for f in range(1, NF + 1) if f % NSH == SH]
          t0 = time.time()
          for i, f in enumerate(frames):
              sc.frame_set(f)
              sc.render.filepath = os.path.join(OUT, '%04d.png' % f)
              bpy.ops.render.render(write_still=True)
              print('frame', f, '(%d/%d)' % (i + 1, len(frames)), '%.1fs elapsed' % (time.time() - t0), flush=True)

          EOF
      - name: Path trace (Cycles CPU)
        run: |
          export PREVIEW=${{ inputs.preview && '1' || '0' }}
          blender/blender -b --factory-startup -noaudio -P intro.py -- ${{ matrix.shard }} ${{ matrix.n }} out
      - name: Encode WebP
        if: ${{ !inputs.preview }}
        run: |
          cd out
          ls *.png | xargs -P 4 -I{} sh -c 'cwebp -quiet -q 78 -alpha_q 85 -m 4 {} -o $(basename {} .png).webp'
          rm -f *.png
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preview && 'preview' || format('frames-{0}', matrix.shard) }}
          path: out
          if-no-files-found: error

  build:
    needs: render
    if: ${{ !inputs.preview }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: intro_frames
          merge-multiple: true
      - name: Generate project
        run: |
          set -e
          rm -rf app/src app/build.gradle app/build.gradle.kts build.gradle.kts settings.gradle.kts
          J=app/src/main/java/com/autobot/app
          R=app/src/main/res
          mkdir -p $J $R/values $R/values-v31 $R/drawable $R/mipmap-anydpi-v26
          mkdir -p app/src/main/assets/intro
          cp intro_frames/*.webp intro_frames/track.csv app/src/main/assets/intro/

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Autobot'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.autobot.app'
            androidResources { noCompress 'webp', 'csv' }
            compileSdk 34
            defaultConfig {
              applicationId 'com.autobot.app'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <application
              android:label="Autobot"
              android:icon="@mipmap/ic_launcher"
              android:theme="@style/T"
              android:hardwareAccelerated="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > $R/values/colors.xml << 'EOF'
          <resources><color name="bg">#0A0A0F</color></resources>
          EOF

          cat > $R/values/styles.xml << 'EOF'
          <resources>
            <style name="T" parent="@android:style/Theme.DeviceDefault.NoActionBar">
              <item name="android:windowIsTranslucent">true</item>
              <item name="android:windowBackground">@android:color/transparent</item>
              <item name="android:windowAnimationStyle">@null</item>
              <item name="android:windowDisablePreview">true</item>
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
            </style>
          </resources>
          EOF

          cat > $R/values-v31/styles.xml << 'EOF'
          <resources>
            <style name="T" parent="@android:style/Theme.DeviceDefault.NoActionBar">
              <item name="android:windowIsTranslucent">true</item>
              <item name="android:windowBackground">@android:color/transparent</item>
              <item name="android:windowAnimationStyle">@null</item>
              <item name="android:windowDisablePreview">true</item>
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
              <item name="android:windowSplashScreenBackground">@android:color/transparent</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_splash_empty</item>
            </style>
          </resources>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > $R/drawable/ic_splash_empty.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="1dp" android:height="1dp" android:viewportWidth="1" android:viewportHeight="1">
            <path android:fillColor="#00000000" android:pathData="M0,0h1v1h-1z"/>
          </vector>
          EOF

          cat > $R/drawable/ic_fg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <group android:scaleX="0.85" android:scaleY="0.85" android:pivotX="54" android:pivotY="54">
              <path android:fillColor="#E53935" android:pathData="M26,26L42,34L46,46L32,48Z"/>
              <path android:fillColor="#E53935" android:pathData="M82,26L66,34L62,46L76,48Z"/>
              <path android:fillColor="#E53935" android:pathData="M50,32L58,32L62,46L54,50L46,46Z"/>
              <path android:fillColor="#E53935" android:pathData="M32,52L46,50L48,64L40,70Z"/>
              <path android:fillColor="#E53935" android:pathData="M76,52L62,50L60,64L68,70Z"/>
              <path android:fillColor="#E53935" android:pathData="M50,54L58,54L60,66L54,72L48,66Z"/>
              <path android:fillColor="#E53935" android:pathData="M42,74L66,74L54,86Z"/>
            </group>
          </vector>
          EOF

          cat > $J/MainActivity.java << 'EOF'
          package com.autobot.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;

          public class MainActivity extends Activity {
            WindowManager wm;
            View overlay;
            boolean started;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              if (Build.VERSION.SDK_INT >= 28)
                getWindow().getAttributes().layoutInDisplayCutoutMode =
                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              if (Settings.canDrawOverlays(this)) go(true); else ask();
            }

            void ask() {
              new AlertDialog.Builder(this)
                .setTitle("Izin overlay")
                .setMessage("Autobot butuh izin tampil di atas aplikasi lain supaya animasi pembuka berjalan transparan di atas layarmu.")
                .setCancelable(false)
                .setPositiveButton("Izinkan", (d, w) -> startActivityForResult(
                  new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())), 7))
                .setNegativeButton("Lewati", (d, w) -> go(false))
                .show();
            }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              super.onActivityResult(rq, rs, d);
              if (rq == 7 && !started) go(Settings.canDrawOverlays(this));
            }

            FrameLayout ui() {
              FrameLayout f = new FrameLayout(this);
              f.setBackgroundColor(0xFF10131A);
              TextView t = new TextView(this);
              t.setText("AUTOBOT\nUI siap");
              t.setTextColor(0xFF9FB3C8);
              t.setTextSize(22);
              t.setGravity(Gravity.CENTER);
              f.addView(t, new FrameLayout.LayoutParams(-1, -1));
              return f;
            }

            void go(boolean ov) {
              started = true;
              final FrameLayout ui = ui();
              ui.setVisibility(View.INVISIBLE);
              final TransformView tv = new TransformView(this, ty -> {
                if (ui.getVisibility() != View.VISIBLE) ui.setVisibility(View.VISIBLE);
                ui.setTranslationY(ty);
              });
              FrameLayout root = new FrameLayout(this);
              root.addView(ui, new FrameLayout.LayoutParams(-1, -1));
              root.addView(tv, new FrameLayout.LayoutParams(-1, -1));
              if (ov) {
                WindowManager.LayoutParams lp = new WindowManager.LayoutParams(-1, -1,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                  PixelFormat.TRANSLUCENT);
                lp.gravity = Gravity.TOP | Gravity.START;
                if (Build.VERSION.SDK_INT >= 28)
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                overlay = root;
                wm.addView(root, lp);
              } else {
                setContentView(root);
              }
              tv.setOnEnd(() -> {
                FrameLayout real = ui();
                setContentView(real);
                final View o = overlay;
                overlay = null;
                if (o != null) real.post(() -> { try { wm.removeView(o); } catch (Exception e) { } });
              });
            }

            @Override protected void onDestroy() {
              if (overlay != null) { try { wm.removeView(overlay); } catch (Exception e) { } overlay = null; }
              super.onDestroy();
            }
          }
          EOF

          cat > $J/TransformView.java << 'EOF'
          package com.autobot.app;

          import android.content.Context;
          import android.content.res.AssetManager;
          import android.graphics.*;
          import android.view.*;
          import java.io.*;
          import java.util.*;
          import java.util.concurrent.*;

          public class TransformView extends View {
            public interface Sheet { void y(float ty); }

            static final int FW = 720, FH = 1560, FPS = 30, AHEAD = 8, PRE = 6, KEEP = 4;
            final Sheet sheet;
            final Paint pt = new Paint(Paint.FILTER_BITMAP_FLAG);
            final ConcurrentHashMap<Integer, Bitmap> ready = new ConcurrentHashMap<>();
            final ConcurrentLinkedQueue<Bitmap> pool = new ConcurrentLinkedQueue<>();
            float[] bar = new float[0];
            int[] evt = new int[0];
            int n, lastEvt = -1;
            volatile int cur, shown = -1;
            volatile boolean alive = true;
            boolean started, ended;
            long t0, lastTick;
            Thread dec;
            Runnable onEnd;

            public TransformView(Context c, Sheet s) { super(c); sheet = s; }

            public void setOnEnd(Runnable r) { onEnd = r; }

            void load() {
              ArrayList<float[]> rows = new ArrayList<>();
              try (BufferedReader br = new BufferedReader(new InputStreamReader(getContext().getAssets().open("intro/track.csv")))) {
                String ln;
                while ((ln = br.readLine()) != null) {
                  String[] p = ln.trim().split(",");
                  if (p.length >= 3) rows.add(new float[]{Float.parseFloat(p[1]), Integer.parseInt(p[2])});
                }
              } catch (Exception e) { }
              n = rows.size();
              bar = new float[n]; evt = new int[n];
              for (int i = 0; i < n; i++) { bar[i] = rows.get(i)[0]; evt[i] = (int) rows.get(i)[1]; }
              dec = new Thread(() -> {
                AssetManager am = getContext().getAssets();
                BitmapFactory.Options o = new BitmapFactory.Options();
                o.inMutable = true;
                o.inPreferredConfig = Bitmap.Config.ARGB_8888;
                for (int i = 0; i < n && alive; i++) {
                  while (alive && i > cur + AHEAD) {
                    try { Thread.sleep(3); } catch (InterruptedException e) { return; }
                  }
                  int s = shown - KEEP;
                  for (Integer k : ready.keySet()) {
                    if (k < s) { Bitmap b = ready.remove(k); if (b != null) pool.add(b); }
                  }
                  Bitmap re = pool.poll();
                  Bitmap b = null;
                  try (InputStream in = am.open(String.format(Locale.US, "intro/%04d.webp", i + 1))) {
                    o.inBitmap = re;
                    b = BitmapFactory.decodeStream(in, null, o);
                  } catch (Throwable e) {
                    o.inBitmap = null;
                    try (InputStream in2 = am.open(String.format(Locale.US, "intro/%04d.webp", i + 1))) {
                      b = BitmapFactory.decodeStream(in2, null, o);
                    } catch (Throwable e2) { }
                  }
                  if (b != null) ready.put(i, b);
                }
              }, "intro-dec");
              dec.start();
            }

            @Override protected void onAttachedToWindow() {
              super.onAttachedToWindow();
              load();
              postInvalidateOnAnimation();
            }

            @Override protected void onDetachedFromWindow() {
              alive = false;
              if (dec != null) dec.interrupt();
              super.onDetachedFromWindow();
            }

            void finish() {
              if (ended) return;
              ended = true;
              alive = false;
              sheet.y(0);
              setVisibility(GONE);
              if (onEnd != null) onEnd.run();
            }

            @Override protected void onDraw(Canvas c) {
              if (ended) return;
              int w = getWidth(), h = getHeight();
              if (w == 0 || h == 0) { postInvalidateOnAnimation(); return; }
              if (n < 2) { finish(); return; }
              if (!started) {
                if (ready.size() >= PRE) { started = true; t0 = System.nanoTime(); }
                else { postInvalidateOnAnimation(); return; }
              }
              float f = (System.nanoTime() - t0) * FPS / 1e9f;
              int i = (int) f;
              if (i >= n - 1) { finish(); return; }
              cur = i;
              float fr = f - i;
              float sc = Math.max(w / (float) FW, h / (float) FH);
              float dx = (w - FW * sc) / 2f, dy = (h - FH * sc) / 2f;
              float bn = bar[i] + (bar[i + 1] - bar[i]) * fr;
              sheet.y(Math.min(0f, dy + bn * FH * sc - h));
              for (int j = lastEvt + 1; j <= i; j++) {
                if (evt[j] == 1) {
                  long now = System.nanoTime();
                  if (now - lastTick > 60000000L) { lastTick = now; performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK); }
                } else if (evt[j] == 2) performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);
                else if (evt[j] == 3) performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY);
              }
              lastEvt = i;
              Bitmap b = null;
              for (int k = i; k >= Math.max(shown, 0) && b == null; k--) {
                b = ready.get(k);
                if (b != null) shown = k;
              }
              if (b == null && shown >= 0) b = ready.get(shown);
              if (b != null) {
                c.save();
                c.translate(dx, dy);
                c.scale(sc, sc);
                c.drawBitmap(b, 0, 0, pt);
                c.restore();
              }
              postInvalidateOnAnimation();
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Autobot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Autobot
          path: Autobot.apk
          if-no-files-found: error
