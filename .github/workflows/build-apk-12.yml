                  shutter = btn("●") { cam.shoot() }
                  shutter.textSize = 22f
                  panel.addView(shutter, LinearLayout.LayoutParams(MATCH, dp(56)))
                  setContentView(root)
                  styleModes()
              }

              private fun styleModes() {
                  for ((m, b) in modeBtns) b.alpha = if (m == mode) 1f else 0.5f
                  videoRow.visibility = if (mode == Mode.VIDEO) View.VISIBLE else View.GONE
                  btnRaw.visibility = if (mode == Mode.RAW) View.VISIBLE else View.GONE
              }

              private fun setMode(m: Mode) {
                  mode = m
                  styleModes()
                  tryStart()
              }

              // ------------------------------------------------------------ manual transitions
              private fun enterManualExp() {
                  val l = cam.last
                  l?.get(CaptureResult.SENSOR_SENSITIVITY)?.let { cam.p.iso = it; sIso.progress = isoT(it) }
                  l?.get(CaptureResult.SENSOR_EXPOSURE_TIME)?.let { cam.p.expNs = it; sShut.progress = expT(it) }
                  cam.p.autoExp = false
                  btnAe.text = "AE: MAN"
                  cam.refresh()
              }

              private fun enterManualFocus() {
                  val fd = cam.last?.get(CaptureResult.LENS_FOCUS_DISTANCE)
                  if (fd != null && cam.minFocus > 0f) {
                      cam.p.focus = (fd / cam.minFocus).coerceIn(0f, 1f)
                      sFocus.progress = (cam.p.focus * 1000).toInt()
                  }
                  cam.p.autoFocus = false
                  btnAf.text = "AF: MAN"
                  cam.refresh()
              }

              private fun enterManualWb() {
                  cam.captureWbBase()
                  cam.p.wbShift = 0f
                  sWb.progress = 500
                  cam.p.autoWb = false
                  btnAwb.text = "AWB: MAN"
                  cam.refresh()
              }

              private fun isoR(): Range<Int> = cam.isoRange ?: Range(50, 3200)
              private fun expR(): Range<Long> = cam.expRange ?: Range(100_000L, 1_000_000_000L)
              private fun isoOf(t: Int): Int {
                  val r = isoR()
                  return (r.lower * (r.upper.toDouble() / r.lower).pow(t / 1000.0)).toInt().coerceIn(r.lower, r.upper)
              }
              private fun isoT(v: Int): Int {
                  val r = isoR()
                  return (1000 * ln(v.toDouble() / r.lower) / ln(r.upper.toDouble() / r.lower)).toInt().coerceIn(0, 1000)
              }
              private fun expOf(t: Int): Long {
                  val r = expR()
                  val hi = min(r.upper, 1_000_000_000L)
                  return (r.lower * (hi.toDouble() / r.lower).pow(t / 1000.0)).toLong().coerceIn(r.lower, r.upper)
              }
              private fun expT(v: Long): Int {
                  val r = expR()
                  val hi = min(r.upper, 1_000_000_000L)
                  return (1000 * ln(v.toDouble() / r.lower) / ln(hi.toDouble() / r.lower)).toInt().coerceIn(0, 1000)
              }

              // ------------------------------------------------------------ CamUi
              override fun status(s: String) { runOnUiThread { tvStatus.text = s } }
              override fun readout(s: String) { runOnUiThread { tvRead.text = s } }
              override fun busy(b: Boolean) { runOnUiThread { shutter.isEnabled = !b } }
              override fun recording(b: Boolean) { runOnUiThread { shutter.text = if (b) "■" else "●" } }
              override fun aspect(pw: Int, ph: Int) {
                  runOnUiThread {
                      val sw = resources.displayMetrics.widthPixels
                      tv.layoutParams = FrameLayout.LayoutParams(sw, (sw.toFloat() * pw / ph).toInt(), Gravity.TOP)
                  }
              }

              // ------------------------------------------------------------ TextureView
              override fun onSurfaceTextureAvailable(st: SurfaceTexture, w: Int, h: Int) {
                  cam.texture = st
                  texReady = true
                  tryStart()
              }
              override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, w: Int, h: Int) {}
              override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean {
                  cam.texture = null
                  texReady = false
                  return true
              }
              override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}
          }
          EOF

      - name: Build APK (debug + release)
        working-directory: _gen
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: MiCamPro-apk
          path: _gen/app/build/outputs/apk/**/*.apk
