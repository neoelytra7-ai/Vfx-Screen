          package com.micampro

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.ImageFormat
          import android.graphics.SurfaceTexture
          import android.hardware.camera2.CameraCaptureSession
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraDevice
          import android.hardware.camera2.CameraManager
          import android.hardware.camera2.CameraMetadata
          import android.hardware.camera2.CaptureFailure
          import android.hardware.camera2.CaptureRequest
          import android.hardware.camera2.CaptureResult
          import android.hardware.camera2.DngCreator
          import android.hardware.camera2.TotalCaptureResult
          import android.hardware.camera2.params.ColorSpaceTransform
          import android.hardware.camera2.params.DynamicRangeProfiles
          import android.hardware.camera2.params.OutputConfiguration
          import android.hardware.camera2.params.RggbChannelVector
          import android.hardware.camera2.params.SessionConfiguration
          import android.media.ExifInterface
          import android.media.Image
          import android.media.ImageReader
          import android.media.MediaCodec
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.provider.MediaStore
          import android.util.Range
          import android.util.Size
          import android.view.Surface
          import java.text.SimpleDateFormat
          import java.util.ArrayList
          import java.util.Date
          import java.util.LinkedHashSet
          import java.util.Locale
          import java.util.concurrent.Executor
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.roundToInt

          enum class Mode { RAW, SR, HDR, VIDEO }

          data class Lens(val id: String, val label: String, val ultra: Boolean)

          class Params {
              @Volatile var autoExp = true
              @Volatile var iso = 100
              @Volatile var expNs = 8_000_000L
              @Volatile var autoFocus = true
              @Volatile var focus = 0f
              @Volatile var autoWb = true
              @Volatile var wbShift = 0f
              @Volatile var baseGains: RggbChannelVector? = null
              @Volatile var baseCcm: ColorSpaceTransform? = null
              @Volatile var hdrVideo = true
              @Volatile var fps = 30
              @Volatile var rawNoProc = true
          }

          interface CamUi {
              fun status(s: String)
              fun aspect(pw: Int, ph: Int)
              fun busy(b: Boolean)
              fun readout(s: String)
              fun recording(b: Boolean)
          }

          object Cfg {
              const val SR_FRAMES = 8
              val HDR_EVS = floatArrayOf(-3f, -1.5f, 0f, 1.5f, 3f)
          }

          object Store {
              fun create(ctx: Context, name: String, mime: String, video: Boolean): Uri? {
                  val v = ContentValues()
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, if (video) "Movies/MiCamPro" else "Pictures/MiCamPro")
                  val coll = if (video) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  return ctx.contentResolver.insert(coll, v)
              }
          }

          class CamController(private val ctx: Context, private val ui: CamUi) {
              val p = Params()
              @Volatile var texture: SurfaceTexture? = null
              @Volatile var deviceOri = 0
              @Volatile var isoRange: Range<Int>? = null
              @Volatile var expRange: Range<Long>? = null
              @Volatile var minFocus = 0f
              @Volatile var last: TotalCaptureResult? = null
              @Volatile var hdrVideoOk = false

              private val mgr = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
              private val ht = HandlerThread("cam").also { it.start() }
              private val wt = HandlerThread("work").also { it.start() }
              private val hd = Handler(ht.looper)
              private val wh = Handler(wt.looper)
              private val exec = Executor { r -> hd.post(r) }

              private var dev: CameraDevice? = null
              private var sess: CameraCaptureSession? = null
              private var chars: CameraCharacteristics? = null
              private var reader: ImageReader? = null
              private var prevSurface: Surface? = null
              private var previewB: CaptureRequest.Builder? = null
              private var mode = Mode.RAW
              private var pending: Pending? = null
              private var encoder: VideoEncoder? = null
              private var recording = false
              private var videoSize = Size(1920, 1080)
              private var sessionHdr = false
              private var ultra = false

              // ---------------------------------------------------------------- lenses
              fun lenses(): List<Lens> {
                  val ids = LinkedHashSet<String>()
                  for (id in mgr.cameraIdList) {
                      ids.add(id)
                      try { ids.addAll(mgr.getCameraCharacteristics(id).physicalCameraIds) } catch (e: Exception) { }
                  }
                  val out = ArrayList<Lens>()
                  for (id in ids) {
                      try {
                          val c = mgr.getCameraCharacteristics(id)
                          if (c.get(CameraCharacteristics.LENS_FACING) != CameraMetadata.LENS_FACING_BACK) continue
                          val f = c.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS)?.firstOrNull() ?: continue
                          val sz = c.get(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE) ?: continue
                          val eq = f * 36f / sz.width
                          out.add(Lens(id, "cam$id ${eq.roundToInt()}mm", eq < 20f))
                      } catch (e: Exception) { }
                  }
                  return out
              }

              // ---------------------------------------------------------------- open / close
              @SuppressLint("MissingPermission")
              fun start(id: String, m: Mode) {
                  hd.post {
                      closeInternal()
                      hd.postDelayed({
                          try {
                              val c = mgr.getCameraCharacteristics(id)
                              chars = c
                              mode = m
                              isoRange = c.get(CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE)
                              expRange = c.get(CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE)
                              minFocus = c.get(CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE) ?: 0f
                              val f = c.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS)?.firstOrNull() ?: 5f
                              val sw = c.get(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE)?.width ?: 7f
                              ultra = f * 36f / sw < 20f
                              hdrVideoOk = hdrSupported(c)
                              mgr.openCamera(id, exec, object : CameraDevice.StateCallback() {
                                  override fun onOpened(camera: CameraDevice) { dev = camera; createSession() }
                                  override fun onDisconnected(camera: CameraDevice) { camera.close(); dev = null }
                                  override fun onError(camera: CameraDevice, error: Int) {
                                      camera.close(); dev = null
                                      ui.status("Camera error $error (lens may not be exposed to 3rd-party apps)")
                                  }
                              })
                          } catch (e: Exception) {
                              ui.status("Open failed: ${e.message}")
                          }
                      }, 300)
                  }
              }

              fun close() { hd.post { closeInternal() } }

              private fun closeInternal() {
                  if (recording) { recording = false; encoder?.end(); ui.recording(false) }
                  try { sess?.close() } catch (e: Exception) { }
                  try { dev?.close() } catch (e: Exception) { }
                  try { reader?.close() } catch (e: Exception) { }
                  try { encoder?.release() } catch (e: Exception) { }
                  try { prevSurface?.release() } catch (e: Exception) { }
                  sess = null; dev = null; reader = null; encoder = null; prevSurface = null; previewB = null
              }

              private fun hdrSupported(c: CameraCharacteristics): Boolean {
                  if (Build.VERSION.SDK_INT < 33) return false
                  val prof = c.get(CameraCharacteristics.REQUEST_AVAILABLE_DYNAMIC_RANGE_PROFILES) ?: return false
                  return prof.supportedProfiles.contains(DynamicRangeProfiles.HLG10)
              }

              private fun pickPreview(map: android.hardware.camera2.params.StreamConfigurationMap, cap: Size): Size {
                  val list = map.getOutputSizes(SurfaceTexture::class.java).filter { it.width <= 1920 }
                  val ratio = cap.width.toFloat() / cap.height
                  return list.filter { Math.abs(it.width.toFloat() / it.height - ratio) < 0.02f }
                      .maxByOrNull { it.width * it.height } ?: list.maxByOrNull { it.width * it.height }!!
              }

              private fun createSession() {
                  val d = dev ?: return
                  val c = chars ?: return
                  val map = c.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP) ?: return
                  val tex = texture ?: run { ui.status("No preview surface yet"); return }
                  val area = { s: Size -> s.width.toLong() * s.height }
                  val outs = ArrayList<OutputConfiguration>()
                  val cap: Size
                  when (mode) {
                      Mode.RAW -> {
                          cap = map.getOutputSizes(ImageFormat.RAW_SENSOR)?.maxByOrNull(area)
                              ?: run { ui.status("This lens has no RAW output – use SR / HDR"); return }
                          reader = ImageReader.newInstance(cap.width, cap.height, ImageFormat.RAW_SENSOR, 3)
                      }
                      Mode.SR, Mode.HDR -> {
                          cap = map.getOutputSizes(ImageFormat.YUV_420_888).maxByOrNull(area)!!
                          val n = if (mode == Mode.SR) Cfg.SR_FRAMES else Cfg.HDR_EVS.size
                          reader = ImageReader.newInstance(cap.width, cap.height, ImageFormat.YUV_420_888, n + 2)
                      }
                      Mode.VIDEO -> {
                          val vs = runCatching { map.getOutputSizes(MediaCodec::class.java) }.getOrNull()
                              ?: map.getOutputSizes(SurfaceTexture::class.java)
                          videoSize = vs.filter { it.width <= 3840 && it.width * 9 == it.height * 16 }.maxByOrNull(area)
                              ?: vs.maxByOrNull(area)!!
                          cap = videoSize
                      }
                  }
                  reader?.setOnImageAvailableListener({ r ->
                      val img = r.acquireNextImage()
                      if (img != null) {
                          val pd = pending
                          if (pd == null) img.close() else pd.addImage(img)
                      }
                  }, wh)

                  val ps = pickPreview(map, cap)
                  tex.setDefaultBufferSize(ps.width, ps.height)
                  prevSurface?.release()
                  val surf = Surface(tex)
                  prevSurface = surf
                  ui.aspect(ps.width, ps.height)
                  outs.add(OutputConfiguration(surf))
                  reader?.let { outs.add(OutputConfiguration(it.surface)) }

                  sessionHdr = false
                  if (mode == Mode.VIDEO) {
                      val bitrate = if (videoSize.width >= 3840) (if (p.fps >= 60) 140_000_000 else 100_000_000) else 50_000_000
                      var enc: VideoEncoder? = null
                      if (p.hdrVideo && hdrVideoOk) {
                          try { enc = VideoEncoder(videoSize.width, videoSize.height, p.fps, bitrate, true); sessionHdr = true }
                          catch (e: Exception) { ui.status("HEVC Main10 unavailable → SDR") }
                      }
                      if (enc == null) {
                          try { enc = VideoEncoder(videoSize.width, videoSize.height, p.fps, bitrate, false) }
                          catch (e: Exception) { ui.status("Encoder failed: ${e.message}"); return }
                      }
                      encoder = enc
                      val oc = OutputConfiguration(enc.surface)
                      if (sessionHdr && Build.VERSION.SDK_INT >= 33) oc.setDynamicRangeProfile(DynamicRangeProfiles.HLG10)
                      outs.add(oc)
                  }

                  d.createCaptureSession(
                      SessionConfiguration(SessionConfiguration.SESSION_REGULAR, outs, exec,
                          object : CameraCaptureSession.StateCallback() {
                              override fun onConfigured(s: CameraCaptureSession) {
                                  sess = s
                                  startPreview()
                                  ui.status("Ready · $mode" + (if (mode == Mode.VIDEO) (if (sessionHdr) " · HLG10 HEVC" else " · SDR HEVC") else ""))
                              }
                              override fun onConfigureFailed(s: CameraCaptureSession) {
                                  ui.status("Session config failed (stream combo unsupported on this lens)")
                              }
                          })
                  )
              }

              // ---------------------------------------------------------------- preview + params
              private val previewCb = object : CameraCaptureSession.CaptureCallback() {
                  private var n = 0
                  override fun onCaptureCompleted(session: CameraCaptureSession, request: CaptureRequest, result: TotalCaptureResult) {
                      last = result
                      if (++n % 6 == 0) {
                          val iso = result.get(CaptureResult.SENSOR_SENSITIVITY)
                          val ex = result.get(CaptureResult.SENSOR_EXPOSURE_TIME)
                          val fd = result.get(CaptureResult.LENS_FOCUS_DISTANCE)
                          val es = if (ex == null) "?" else {
                              val s = ex / 1e9
                              if (s >= 0.5) String.format(Locale.US, "%.1fs", s) else "1/" + (1.0 / s).roundToInt()
                          }
                          ui.readout("ISO ${iso ?: "?"} · $es · focus ${fd?.let { String.format(Locale.US, "%.2fD", it) } ?: "?"}")
                      }
                  }
              }

              private fun startPreview() {
                  val d = dev ?: return
                  val b = d.createCaptureRequest(if (mode == Mode.VIDEO) CameraDevice.TEMPLATE_RECORD else CameraDevice.TEMPLATE_PREVIEW)
                  b.addTarget(prevSurface ?: return)
                  if (mode == Mode.VIDEO) encoder?.let { b.addTarget(it.surface) }
                  applyParams(b)
                  previewB = b
                  try { sess?.setRepeatingRequest(b.build(), previewCb, hd) } catch (e: Exception) { ui.status("Preview error: ${e.message}") }
              }

              fun refresh() {
                  hd.post {
                      val b = previewB ?: return@post
                      applyParams(b)
                      try { sess?.setRepeatingRequest(b.build(), previewCb, hd) } catch (e: Exception) { }
                  }
              }

              fun captureWbBase() {
                  val l = last ?: return
                  p.baseGains = l.get(CaptureResult.COLOR_CORRECTION_GAINS)
                  p.baseCcm = l.get(CaptureResult.COLOR_CORRECTION_TRANSFORM)
              }

              private fun sup(key: CameraCharacteristics.Key<IntArray>, v: Int): Boolean =
                  chars?.get(key)?.contains(v) == true

              private fun cap(v: Int): Boolean = sup(CameraCharacteristics.REQUEST_AVAILABLE_CAPABILITIES, v)

              private fun noProcess(b: CaptureRequest.Builder) {
                  if (sup(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES, CameraMetadata.NOISE_REDUCTION_MODE_OFF))
                      b.set(CaptureRequest.NOISE_REDUCTION_MODE, CameraMetadata.NOISE_REDUCTION_MODE_OFF)
                  if (sup(CameraCharacteristics.EDGE_AVAILABLE_EDGE_MODES, CameraMetadata.EDGE_MODE_OFF))
                      b.set(CaptureRequest.EDGE_MODE, CameraMetadata.EDGE_MODE_OFF)
                  if (sup(CameraCharacteristics.HOT_PIXEL_AVAILABLE_HOT_PIXEL_MODES, CameraMetadata.HOT_PIXEL_MODE_OFF))
                      b.set(CaptureRequest.HOT_PIXEL_MODE, CameraMetadata.HOT_PIXEL_MODE_OFF)
                  if (sup(CameraCharacteristics.SHADING_AVAILABLE_MODES, CameraMetadata.SHADING_MODE_OFF))
                      b.set(CaptureRequest.SHADING_MODE, CameraMetadata.SHADING_MODE_OFF)
                  if (sup(CameraCharacteristics.DISTORTION_CORRECTION_AVAILABLE_MODES, CameraMetadata.DISTORTION_CORRECTION_MODE_OFF))
                      b.set(CaptureRequest.DISTORTION_CORRECTION_MODE, CameraMetadata.DISTORTION_CORRECTION_MODE_OFF)
                  if (sup(CameraCharacteristics.TONEMAP_AVAILABLE_TONE_MAP_MODES, CameraMetadata.TONEMAP_MODE_GAMMA_VALUE)) {
                      b.set(CaptureRequest.TONEMAP_MODE, CameraMetadata.TONEMAP_MODE_GAMMA_VALUE)
                      b.set(CaptureRequest.TONEMAP_GAMMA, 2.2f)
                  }
              }

              private fun quality(b: CaptureRequest.Builder) {
                  if (sup(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES, CameraMetadata.NOISE_REDUCTION_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.NOISE_REDUCTION_MODE, CameraMetadata.NOISE_REDUCTION_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.EDGE_AVAILABLE_EDGE_MODES, CameraMetadata.EDGE_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.EDGE_MODE, CameraMetadata.EDGE_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.HOT_PIXEL_AVAILABLE_HOT_PIXEL_MODES, CameraMetadata.HOT_PIXEL_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.HOT_PIXEL_MODE, CameraMetadata.HOT_PIXEL_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.SHADING_AVAILABLE_MODES, CameraMetadata.SHADING_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.SHADING_MODE, CameraMetadata.SHADING_MODE_HIGH_QUALITY)
                  if (sup(CameraCharacteristics.DISTORTION_CORRECTION_AVAILABLE_MODES, CameraMetadata.DISTORTION_CORRECTION_MODE_HIGH_QUALITY))
                      b.set(CaptureRequest.DISTORTION_CORRECTION_MODE, CameraMetadata.DISTORTION_CORRECTION_MODE_HIGH_QUALITY)
              }

              private fun applyParams(b: CaptureRequest.Builder) {
                  val c = chars ?: return
                  val raw = mode == Mode.RAW && p.rawNoProc
                  b.set(CaptureRequest.CONTROL_MODE, CameraMetadata.CONTROL_MODE_AUTO)
                  if (!p.autoExp && cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_SENSOR)) {
                      b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_OFF)
                      b.set(CaptureRequest.SENSOR_SENSITIVITY, p.iso)
                      b.set(CaptureRequest.SENSOR_EXPOSURE_TIME, p.expNs)
                      b.set(CaptureRequest.SENSOR_FRAME_DURATION, max(p.expNs, 33_333_333L))
                  } else {
                      b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON)
                  }
                  if (!p.autoFocus && minFocus > 0f) {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_OFF)
                      b.set(CaptureRequest.LENS_FOCUS_DISTANCE, p.focus * minFocus)
                  } else {
                      b.set(CaptureRequest.CONTROL_AF_MODE,
                          if (mode == Mode.VIDEO) CameraMetadata.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                          else CameraMetadata.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                  }
                  val bg = p.baseGains
                  val bc = p.baseCcm
                  if (!p.autoWb && bg != null && bc != null && cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_POST_PROCESSING)) {
                      val f = 2.0.pow(p.wbShift.toDouble()).toFloat()
                      b.set(CaptureRequest.CONTROL_AWB_MODE, CameraMetadata.CONTROL_AWB_MODE_OFF)
                      b.set(CaptureRequest.COLOR_CORRECTION_MODE, CameraMetadata.COLOR_CORRECTION_MODE_TRANSFORM_MATRIX)
                      b.set(CaptureRequest.COLOR_CORRECTION_GAINS, RggbChannelVector(bg.red * f, bg.greenEven, bg.greenOdd, bg.blue / f))
                      b.set(CaptureRequest.COLOR_CORRECTION_TRANSFORM, bc)
                  } else {
                      b.set(CaptureRequest.CONTROL_AWB_MODE, CameraMetadata.CONTROL_AWB_MODE_AUTO)
                  }
                  if (raw) noProcess(b) else quality(b)
                  if (mode == Mode.VIDEO) {
                      val ranges = c.get(CameraCharacteristics.CONTROL_AE_AVAILABLE_TARGET_FPS_RANGES)
                      val r = ranges?.firstOrNull { it.lower == p.fps && it.upper == p.fps }
                          ?: ranges?.filter { it.upper == p.fps }?.maxByOrNull { it.lower }
                      if (r != null) b.set(CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE, r)
                  }
              }

              // ---------------------------------------------------------------- shooting
              fun shoot() {
                  hd.post {
                      val s = sess ?: return@post
                      val d = dev ?: return@post
                      if (pending != null) return@post
                      when (mode) {
                          Mode.RAW -> shootRaw(s, d)
                          Mode.SR -> shootBurst(s, d, FloatArray(Cfg.SR_FRAMES))
                          Mode.HDR -> shootBurst(s, d, Cfg.HDR_EVS)
                          Mode.VIDEO -> toggleRecord()
                      }
                  }
              }

              private fun shootRaw(s: CameraCaptureSession, d: CameraDevice) {
                  val rd = reader ?: return
                  val b = d.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE)
                  b.addTarget(rd.surface)
                  applyParams(b)
                  val pd = Pending(1, Mode.RAW)
                  pending = pd
                  ui.busy(true)
                  s.capture(b.build(), object : CameraCaptureSession.CaptureCallback() {
                      override fun onCaptureCompleted(session: CameraCaptureSession, request: CaptureRequest, result: TotalCaptureResult) {
                          pd.addResult(result)
                      }
                      override fun onCaptureFailed(session: CameraCaptureSession, request: CaptureRequest, failure: CaptureFailure) {
                          ui.status("Capture failed"); pd.abort()
                      }
                  }, hd)
              }

              private fun lockFrom(b: CaptureRequest.Builder, base: TotalCaptureResult) {
                  b.set(CaptureRequest.CONTROL_MODE, CameraMetadata.CONTROL_MODE_AUTO)
                  b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_OFF)
                  if (cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_POST_PROCESSING)) {
                      val g = base.get(CaptureResult.COLOR_CORRECTION_GAINS)
                      val t = base.get(CaptureResult.COLOR_CORRECTION_TRANSFORM)
                      if (g != null && t != null) {
                          b.set(CaptureRequest.CONTROL_AWB_MODE, CameraMetadata.CONTROL_AWB_MODE_OFF)
                          b.set(CaptureRequest.COLOR_CORRECTION_MODE, CameraMetadata.COLOR_CORRECTION_MODE_TRANSFORM_MATRIX)
                          b.set(CaptureRequest.COLOR_CORRECTION_GAINS, g)
                          b.set(CaptureRequest.COLOR_CORRECTION_TRANSFORM, t)
                      }
                      if (sup(CameraCharacteristics.TONEMAP_AVAILABLE_TONE_MAP_MODES, CameraMetadata.TONEMAP_MODE_PRESET_CURVE)) {
                          b.set(CaptureRequest.TONEMAP_MODE, CameraMetadata.TONEMAP_MODE_PRESET_CURVE)
                          b.set(CaptureRequest.TONEMAP_PRESET_CURVE, CameraMetadata.TONEMAP_PRESET_CURVE_SRGB)
                      }
                  }
                  if (minFocus > 0f) {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_OFF)
                      base.get(CaptureResult.LENS_FOCUS_DISTANCE)?.let { b.set(CaptureRequest.LENS_FOCUS_DISTANCE, it) }
                  }
                  quality(b)
              }

              private fun shootBurst(s: CameraCaptureSession, d: CameraDevice, evs: FloatArray) {
                  val base = last ?: run { ui.status("Preview not ready yet"); return }
                  val rd = reader ?: return
                  if (!cap(CameraMetadata.REQUEST_AVAILABLE_CAPABILITIES_MANUAL_SENSOR)) {
                      ui.status("Lens lacks manual sensor control (needed for SR/HDR)"); return
                  }
                  val e0 = base.get(CaptureResult.SENSOR_EXPOSURE_TIME) ?: return
                  val i0 = base.get(CaptureResult.SENSOR_SENSITIVITY) ?: return
                  val ir = isoRange ?: return
                  val er = expRange ?: return
                  val reqs = ArrayList<CaptureRequest>()
                  for (ev in evs) {
                      val k = 2.0.pow(ev.toDouble())
                      val tot = e0.toDouble() * i0 * k
                      val tmax = max(e0, 40_000_000L)
                      val et = min((e0 * k).toLong(), tmax).coerceIn(er.lower, er.upper)
                      val iso = (tot / et).roundToInt().coerceIn(ir.lower, ir.upper)
                      val b = d.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE)
                      b.addTarget(rd.surface)
                      lockFrom(b, base)
                      b.set(CaptureRequest.SENSOR_EXPOSURE_TIME, et)
                      b.set(CaptureRequest.SENSOR_SENSITIVITY, iso)
                      b.set(CaptureRequest.SENSOR_FRAME_DURATION, max(et, 33_333_333L))
                      reqs.add(b.build())
                  }
                  val pd = Pending(reqs.size, mode)
                  pending = pd
                  ui.busy(true)
                  ui.status("Capturing ${reqs.size} frames – hold still…")
                  s.captureBurst(reqs, object : CameraCaptureSession.CaptureCallback() {
                      override fun onCaptureCompleted(session: CameraCaptureSession, request: CaptureRequest, result: TotalCaptureResult) {
                          pd.addResult(result)
                      }
                      override fun onCaptureFailed(session: CameraCaptureSession, request: CaptureRequest, failure: CaptureFailure) {
                          ui.status("Capture failed"); pd.abort()
                      }
                  }, hd)
              }

              private fun toggleRecord() {
                  val e = encoder ?: return
                  if (!recording) {
                      val uri = Store.create(ctx, "VID_${stamp()}.mp4", "video/mp4", true)
                          ?: run { ui.status("Cannot create video file"); return }
                      val pfd = ctx.contentResolver.openFileDescriptor(uri, "rw") ?: return
                      val audio = ctx.checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                      if (!e.begin(pfd, audio)) { pfd.close(); ui.status("Encoder not ready, try again"); return }
                      recording = true
                      ui.recording(true)
                      ui.status("● REC ${videoSize.width}x${videoSize.height}@${p.fps}" + (if (sessionHdr) " HLG10" else ""))
                  } else {
                      recording = false
                      ui.recording(false)
                      wh.post { e.end(); ui.status("Video saved → Movies/MiCamPro") }
                  }
              }

              // ---------------------------------------------------------------- results
              private inner class Pending(val n: Int, val kind: Mode) {
                  val frames = ArrayList<Frame>()
                  val raws = ArrayList<Image>()
                  val results = ArrayList<TotalCaptureResult>()
                  private var fired = false

                  @Synchronized fun addImage(img: Image) {
                      if (kind == Mode.RAW) raws.add(img) else { frames.add(Frame.from(img)); img.close() }
                      check()
                  }

                  @Synchronized fun addResult(r: TotalCaptureResult) { results.add(r); check() }

                  fun abort() { pending = null; ui.busy(false) }

                  private fun check() {
                      val ni = if (kind == Mode.RAW) raws.size else frames.size
                      if (!fired && ni >= n && results.size >= n) {
                          fired = true
                          Thread {
                              try {
                                  when (kind) {
                                      Mode.RAW -> processRaw(this)
                                      Mode.SR -> processSr(this)
                                      Mode.HDR -> processHdr(this)
                                      else -> { }
                                  }
                              } catch (t: Throwable) {
                                  ui.status("Processing failed: ${t.javaClass.simpleName} ${t.message}")
                              } finally {
                                  pending = null
                                  ui.busy(false)
                              }
                          }.start()
                      }
                  }
              }

              private fun stamp(): String = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())

              private fun jpegRot(): Int {
                  val so = chars?.get(CameraCharacteristics.SENSOR_ORIENTATION) ?: 90
                  return (so + deviceOri + 360) % 360
              }

              private fun exifOri(rot: Int): Int = when (rot) { 90 -> 6; 180 -> 3; 270 -> 8; else -> 1 }

              private fun processRaw(pd: Pending) {
                  val img = pd.raws[0]
                  val res = pd.results[0]
                  val uri = Store.create(ctx, "RAW_${stamp()}.dng", "image/x-adobe-dng", false)
                      ?: throw IllegalStateException("cannot create file")
                  ctx.contentResolver.openOutputStream(uri)!!.use { out ->
                      val dng = DngCreator(chars!!, res)
                      dng.setOrientation(exifOri(jpegRot()))
                      dng.writeImage(out, img)
                      dng.close()
                  }
                  img.close()
                  ui.status("Saved DNG (no processing) → Pictures/MiCamPro")
              }

              private fun tag(pd: Pending) {
                  for (i in pd.frames.indices) {
                      pd.frames[i].expNs = pd.results[i].get(CaptureResult.SENSOR_EXPOSURE_TIME) ?: 0L
                      pd.frames[i].iso = pd.results[i].get(CaptureResult.SENSOR_SENSITIVITY) ?: 100
                  }
              }

              private fun processSr(pd: Pending) {
                  tag(pd)
                  val bmp = SuperRes.run(pd.frames, 2, if (ultra) 1.1f else 0.7f, if (ultra) 1.0f else 0.25f) { ui.status(it) }
                  pd.frames.clear()
                  ui.status("Encoding JPEG…")
                  saveJpeg(bmp, "SR_${stamp()}.jpg")
                  bmp.recycle()
                  ui.status("Saved super-res → Pictures/MiCamPro")
              }

              private fun processHdr(pd: Pending) {
                  tag(pd)
                  val bmp = HdrMerge.run(pd.frames) { ui.status(it) }
                  pd.frames.clear()
                  ui.status("Encoding JPEG…")
                  saveJpeg(bmp, "HDR_${stamp()}.jpg")
                  bmp.recycle()
                  ui.status("Saved HDR → Pictures/MiCamPro")
              }

              private fun saveJpeg(bmp: Bitmap, name: String) {
                  val uri = Store.create(ctx, name, "image/jpeg", false) ?: throw IllegalStateException("cannot create file")
                  ctx.contentResolver.openOutputStream(uri)!!.use { bmp.compress(Bitmap.CompressFormat.JPEG, 97, it) }
                  try {
                      ctx.contentResolver.openFileDescriptor(uri, "rw")?.use { pfd ->
                          val ex = ExifInterface(pfd.fileDescriptor)
                          ex.setAttribute(ExifInterface.TAG_ORIENTATION, exifOri(jpegRot()).toString())
                          ex.saveAttributes()
                      }
                  } catch (e: Exception) { }
              }
          }
