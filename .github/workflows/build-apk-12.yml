name: Build MiCam Pro APK

# Satu file ini = seluruh project. Heredoc di bawah nulis semua source Android
# (Kotlin / Camera2) saat CI jalan, lalu Gradle build APK-nya.
# Taruh di: .github/workflows/build-apk.yml  ->  push  ->  tab Actions  ->  Artifacts.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project (heredocs)
        run: |
          set -e
          mkdir -p _gen/app/src/main/java/com/micampro
          cd _gen
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MiCamPro"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.micampro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.micampro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-feature android:name="android.hardware.camera.any" />
              <application
                  android:label="MiCam Pro"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/micampro/Core.kt <<'EOF'
          package com.micampro

          import android.media.Image
          import java.util.stream.IntStream
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          object Px {
              fun bil(a: ByteArray, w: Int, h: Int, x: Float, y: Float): Float {
                  val xc = x.coerceIn(0f, (w - 1).toFloat())
                  val yc = y.coerceIn(0f, (h - 1).toFloat())
                  val x0 = xc.toInt(); val y0 = yc.toInt()
                  val x1 = min(x0 + 1, w - 1); val y1 = min(y0 + 1, h - 1)
                  val fx = xc - x0; val fy = yc - y0
                  val p00 = (a[y0 * w + x0].toInt() and 0xFF).toFloat()
                  val p10 = (a[y0 * w + x1].toInt() and 0xFF).toFloat()
                  val p01 = (a[y1 * w + x0].toInt() and 0xFF).toFloat()
                  val p11 = (a[y1 * w + x1].toInt() and 0xFF).toFloat()
                  return (p00 * (1 - fx) + p10 * fx) * (1 - fy) + (p01 * (1 - fx) + p11 * fx) * fy
              }

              fun c8(v: Float): Int = (v + 0.5f).toInt().coerceIn(0, 255)
          }

          /** One YUV420 frame (full-range BT.601), planes de-strided. */
          class Frame(val w: Int, val h: Int, val y: ByteArray, val cb: ByteArray, val cr: ByteArray) {
              var expNs: Long = 0
              var iso: Int = 100
              val gain: Double get() = expNs.toDouble() * iso

              companion object {
                  fun from(img: Image): Frame {
                      val w = img.width
                      val h = img.height
                      val y = plane(img.planes[0], w, h)
                      val cb = plane(img.planes[1], w / 2, h / 2)
                      val cr = plane(img.planes[2], w / 2, h / 2)
                      return Frame(w, h, y, cb, cr)
                  }

                  private fun plane(p: Image.Plane, pw: Int, ph: Int): ByteArray {
                      val out = ByteArray(pw * ph)
                      val b = p.buffer
                      val rs = p.rowStride
                      val ps = p.pixelStride
                      if (ps == 1) {
                          for (r in 0 until ph) {
                              b.position(r * rs)
                              b.get(out, r * pw, pw)
                          }
                      } else {
                          for (r in 0 until ph) {
                              val base = r * rs
                              val o = r * pw
                              for (c in 0 until pw) out[o + c] = b.get(base + c * ps)
                          }
                      }
                      return out
                  }
              }
          }

          /** Per-tile translation field: cur(x+dx, y+dy) ~= ref(x, y). */
          class Warp(val tile: Int, val tw: Int, val th: Int, val dx: FloatArray, val dy: FloatArray) {
              val minDy: Float = dy.minOrNull() ?: 0f
              val maxDy: Float = dy.maxOrNull() ?: 0f

              fun eval(x: Float, y: Float, o: FloatArray) {
                  if (tw == 1 && th == 1) { o[0] = dx[0]; o[1] = dy[0]; return }
                  val fx = ((x - tile / 2f) / tile).coerceIn(0f, (tw - 1).toFloat())
                  val fy = ((y - tile / 2f) / tile).coerceIn(0f, (th - 1).toFloat())
                  val ix = fx.toInt(); val iy = fy.toInt()
                  val ax = fx - ix; val ay = fy - iy
                  val ix1 = min(ix + 1, tw - 1); val iy1 = min(iy + 1, th - 1)
                  val a = iy * tw + ix; val b = iy * tw + ix1
                  val c = iy1 * tw + ix; val d = iy1 * tw + ix1
                  o[0] = (dx[a] * (1 - ax) + dx[b] * ax) * (1 - ay) + (dx[c] * (1 - ax) + dx[d] * ax) * ay
                  o[1] = (dy[a] * (1 - ax) + dy[b] * ax) * (1 - ay) + (dy[c] * (1 - ax) + dy[d] * ax) * ay
              }
          }

          object Align {
              private fun down(src: ByteArray, w: Int, h: Int, f: Int): Triple<ByteArray, Int, Int> {
                  val dw = w / f
                  val dh = h / f
                  val out = ByteArray(dw * dh)
                  IntStream.range(0, dh).parallel().forEach { y ->
                      for (x in 0 until dw) {
                          var s = 0
                          for (j in 0 until f) {
                              val row = (y * f + j) * w + x * f
                              for (i in 0 until f) s += src[row + i].toInt() and 0xFF
                          }
                          out[y * dw + x] = (s / (f * f)).toByte()
                      }
                  }
                  return Triple(out, dw, dh)
              }

              private fun search(a: ByteArray, b: ByteArray, w: Int, h: Int, cx: Int, cy: Int, r: Int, step: Int): IntArray {
                  val m = max(abs(cx), abs(cy)) + r + 1
                  if (w <= 2 * m + 8 || h <= 2 * m + 8) return intArrayOf(cx, cy)
                  var best = Long.MAX_VALUE
                  var bx = cx
                  var by = cy
                  for (sy in cy - r..cy + r) {
                      for (sx in cx - r..cx + r) {
                          var s = 0L
                          var y = m
                          while (y < h - m) {
                              val ra = y * w
                              val rb = (y + sy) * w + sx
                              var x = m
                              while (x < w - m) {
                                  s += abs((a[ra + x].toInt() and 0xFF) - (b[rb + x].toInt() and 0xFF))
                                  x += step
                              }
                              y += step
                          }
                          if (s < best) { best = s; bx = sx; by = sy }
                      }
                  }
                  return intArrayOf(bx, by)
              }

              /** Coarse-to-fine global translation (full-res pixels). */
              fun global(ref: ByteArray, cur: ByteArray, w: Int, h: Int): IntArray {
                  val (r8, w8, h8) = down(ref, w, h, 8)
                  val (c8, _, _) = down(cur, w, h, 8)
                  val s8 = search(r8, c8, w8, h8, 0, 0, 12, 1)
                  val (r2, w2, h2) = down(ref, w, h, 2)
                  val (c2, _, _) = down(cur, w, h, 2)
                  val s2 = search(r2, c2, w2, h2, s8[0] * 4, s8[1] * 4, 4, 2)
                  return search(ref, cur, w, h, s2[0] * 2, s2[1] * 2, 2, 4)
              }

              private fun sad(ref: ByteArray, cur: ByteArray, w: Int, h: Int, x0: Int, y0: Int, t: Int, sx: Int, sy: Int): Float {
                  var s = 0
                  var n = 0
                  var y = y0
                  val ye = min(y0 + t, h)
                  val xe = min(x0 + t, w)
                  while (y < ye) {
                      val yy = y + sy
                      if (yy in 0 until h) {
                          var x = x0
                          while (x < xe) {
                              val xx = x + sx
                              if (xx in 0 until w) {
                                  s += abs((ref[y * w + x].toInt() and 0xFF) - (cur[yy * w + xx].toInt() and 0xFF))
                                  n++
                              }
                              x += 2
                          }
                      }
                      y += 2
                  }
                  return if (n < 16) 1e9f else s.toFloat() / n
              }

              private fun parab(m: Float, c: Float, p: Float): Float {
                  if (m > 1e8f || p > 1e8f) return 0f
                  val d = m - 2 * c + p
                  return if (d > 1e-3f) ((m - p) / (2 * d)).coerceIn(-0.5f, 0.5f) else 0f
              }

              private fun tileShifts(ref: ByteArray, cur: ByteArray, w: Int, h: Int, g: IntArray): Warp {
                  val t = 32
                  val tw = (w + t - 1) / t
                  val th = (h + t - 1) / t
                  val dx = FloatArray(tw * th)
                  val dy = FloatArray(tw * th)
                  IntStream.range(0, th).parallel().forEach { ty ->
                      for (tx in 0 until tw) {
                          val x0 = tx * t
                          val y0 = ty * t
                          var best = Float.MAX_VALUE
                          var worst = 0f
                          var bx = g[0]
                          var by = g[1]
                          for (sy in g[1] - 3..g[1] + 3) {
                              for (sx in g[0] - 3..g[0] + 3) {
                                  val s = sad(ref, cur, w, h, x0, y0, t, sx, sy)
                                  if (s < best) { best = s; bx = sx; by = sy }
                                  if (s > worst && s < 1e8f) worst = s
                              }
                          }
                          var fx = bx.toFloat()
                          var fy = by.toFloat()
                          if (best > 1e8f || worst - best < 1.5f) {
                              fx = g[0].toFloat(); fy = g[1].toFloat()
                          } else {
                              val sl = sad(ref, cur, w, h, x0, y0, t, bx - 1, by)
                              val sr = sad(ref, cur, w, h, x0, y0, t, bx + 1, by)
                              val su = sad(ref, cur, w, h, x0, y0, t, bx, by - 1)
                              val sd = sad(ref, cur, w, h, x0, y0, t, bx, by + 1)
                              fx += parab(sl, best, sr)
                              fy += parab(su, best, sd)
                          }
                          dx[ty * tw + tx] = fx
                          dy[ty * tw + tx] = fy
                      }
                  }
                  return Warp(t, tw, th, dx, dy)
              }

              fun estimate(ref: ByteArray, cur: ByteArray, w: Int, h: Int, useTiles: Boolean): Warp {
                  val g = global(ref, cur, w, h)
                  return if (useTiles) tileShifts(ref, cur, w, h, g)
                  else Warp(max(w, h), 1, 1, floatArrayOf(g[0].toFloat()), floatArrayOf(g[1].toFloat()))
              }
          }
          EOF
          cat > app/src/main/java/com/micampro/Merge.kt <<'EOF'
          package com.micampro

          import android.graphics.Bitmap
          import java.util.stream.IntStream
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.exp
          import kotlin.math.floor
          import kotlin.math.ln
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow

          /**
           * Multi-frame super-resolution: tile-wise sub-pixel alignment, robust kernel splatting
           * of every frame's native samples onto a [scale]x grid (luma), chroma from the sharpest frame.
           */
          object SuperRes {
              private fun sharp(y: ByteArray, w: Int, h: Int): Long {
                  var s = 0L
                  var r = 0
                  while (r < h) {
                      var c = 0
                      while (c < w - 1) {
                          s += abs((y[r * w + c].toInt() and 0xFF) - (y[r * w + c + 1].toInt() and 0xFF))
                          c += 3
                      }
                      r += 3
                  }
                  return s
              }

              fun run(frames: List<Frame>, scale: Int, sharpen: Float, edge: Float, log: (String) -> Unit): Bitmap {
                  val w = frames[0].w
                  val h = frames[0].h
                  var ri = 0
                  var bestS = -1L
                  for (i in frames.indices) {
                      val s = sharp(frames[i].y, w, h)
                      if (s > bestS) { bestS = s; ri = i }
                  }
                  val ref = frames[ri]
                  val warps = arrayOfNulls<Warp>(frames.size)
                  for (i in frames.indices) {
                      if (i == ri) continue
                      log("Aligning frame ${i + 1}/${frames.size}…")
                      warps[i] = Align.estimate(ref.y, frames[i].y, w, h, true)
                  }
                  val bw = w * scale
                  val bh = h * scale
                  val bmp = Bitmap.createBitmap(bw, bh, Bitmap.Config.ARGB_8888)
                  val sh = 96
                  val n = (bh + sh - 1) / sh
                  log("Merging ${frames.size} frames → ${bw}x$bh …")
                  val finalRi = ri
                  IntStream.range(0, n).parallel().forEach { s ->
                      strip(frames, finalRi, warps, scale, s * sh, min((s + 1) * sh, bh), sharpen, edge, bmp)
                  }
                  return bmp
              }

              private fun strip(
                  frames: List<Frame>, ri: Int, warps: Array<Warp?>, s: Int,
                  ya: Int, yb: Int, sharpen: Float, edge: Float, bmp: Bitmap
              ) {
                  val ref = frames[ri]
                  val w = ref.w
                  val h = ref.h
                  val ow = w * s
                  val oh = h * s
                  val pad = 2
                  val rows = (yb - ya) + 2 * pad
                  val oy0 = ya - pad
                  val num = FloatArray(ow * rows)
                  val den = FloatArray(ow * rows)
                  val sv = FloatArray(2)
                  val rMin = (oy0 - 2f) / s - 1
                  val rMax = (oy0 + rows + 2f) / s + 1

                  for (fi in frames.indices) {
                      val f = frames[fi]
                      val wp = warps[fi]
                      val isRef = fi == ri
                      val vmin = max(0, floor(rMin + (wp?.minDy ?: 0f)).toInt() - 6)
                      val vmax = min(h - 1, ceil(rMax + (wp?.maxDy ?: 0f)).toInt() + 6)
                      for (v in vmin..vmax) {
                          val rowOff = v * w
                          for (u in 0 until w) {
                              var sx = 0f
                              var sy = 0f
                              if (wp != null) {
                                  wp.eval(u.toFloat(), v.toFloat(), sv)
                                  sx = sv[0]; sy = sv[1]
                              }
                              val rx = u - sx
                              val ry = v - sy
                              val oy = (ry + 0.5f) * s - 0.5f - oy0
                              if (oy < -1.5f || oy > rows - 1 + 1.5f) continue
                              val ox = (rx + 0.5f) * s - 0.5f
                              if (ox < -1.5f || ox > ow - 1 + 1.5f) continue
                              val c = (f.y[rowOff + u].toInt() and 0xFF).toFloat()
                              var wt = 1f
                              if (!isRef) {
                                  val d = abs(c - Px.bil(ref.y, w, h, rx, ry))
                                  val t = d / 28f
                                  if (t >= 1f) continue
                                  wt = 1f - t * t
                              }
                              val xa = ceil(ox - 1.5f).toInt()
                              val xb = floor(ox + 1.5f).toInt()
                              val y1 = ceil(oy - 1.5f).toInt()
                              val y2 = floor(oy + 1.5f).toInt()
                              for (yy in max(y1, 0)..min(y2, rows - 1)) {
                                  val wy = 1f - abs(yy - oy) / 1.5f
                                  if (wy <= 0f) continue
                                  for (xx in max(xa, 0)..min(xb, ow - 1)) {
                                      val wx = 1f - abs(xx - ox) / 1.5f
                                      if (wx <= 0f) continue
                                      val k = wt * wx * wy
                                      val idx = yy * ow + xx
                                      num[idx] += k * c
                                      den[idx] += k
                                  }
                              }
                          }
                      }
                  }

                  val lam = 0.25f
                  val yl = FloatArray(ow * rows)
                  for (r in 0 until rows) {
                      val ryy = (oy0 + r + 0.5f) / s - 0.5f
                      for (x in 0 until ow) {
                          val rxx = (x + 0.5f) / s - 0.5f
                          val i = r * ow + x
                          val up = Px.bil(ref.y, w, h, rxx, ryy)
                          yl[i] = (num[i] + lam * up) / (den[i] + lam)
                      }
                  }

                  val out = IntArray(ow * (yb - ya))
                  val cw = w / 2
                  val ch = h / 2
                  for (r in pad until pad + (yb - ya)) {
                      val gy = oy0 + r
                      val ny = (gy - oh * 0.5f) / (oh * 0.5f)
                      for (x in 0 until ow) {
                          val x1 = max(x - 1, 0)
                          val x2 = min(x + 1, ow - 1)
                          var bl = 0f
                          for (rr in r - 1..r + 1) {
                              val o = rr * ow
                              bl += yl[o + x1] + yl[o + x] + yl[o + x2]
                          }
                          bl /= 9f
                          val nx = (x - ow * 0.5f) / (ow * 0.5f)
                          val r2 = (nx * nx + ny * ny) * 0.5f
                          val amt = sharpen * (1f + edge * r2)
                          val yc = yl[r * ow + x]
                          val yv = yc + amt * (yc - bl)
                          val cxp = (x + 0.5f) / (2f * s) - 0.5f
                          val cyp = (gy + 0.5f) / (2f * s) - 0.5f
                          val cb = Px.bil(ref.cb, cw, ch, cxp, cyp) - 128f
                          val cr = Px.bil(ref.cr, cw, ch, cxp, cyp) - 128f
                          val rr = yv + 1.402f * cr
                          val gg = yv - 0.344136f * cb - 0.714136f * cr
                          val bb = yv + 1.772f * cb
                          out[(r - pad) * ow + x] = (0xFF shl 24) or (Px.c8(rr) shl 16) or (Px.c8(gg) shl 8) or Px.c8(bb)
                      }
                  }
                  synchronized(bmp) { bmp.setPixels(out, 0, ow, 0, ya, ow, yb - ya) }
              }
          }

          /**
           * Bracketed HDR: global alignment on exposure-equalised luma, radiance-domain merge
           * (sRGB-linearised, exposure-normalised, hat-weighted), then bilateral base/detail local tone mapping.
           */
          object HdrMerge {
              private val lin = FloatArray(256) { i ->
                  val c = i / 255f
                  if (c <= 0.04045f) c / 12.92f else ((c + 0.055f) / 1.055f).pow(2.4f)
              }
              private val encTab = IntArray(4096) { i ->
                  val c = i / 4095f
                  val v = if (c <= 0.0031308f) 12.92f * c else 1.055f * c.pow(1f / 2.4f) - 0.055f
                  (v * 255f + 0.5f).toInt().coerceIn(0, 255)
              }

              private fun enc(l: Float): Int = encTab[(l.coerceIn(0f, 1f) * 4095f + 0.5f).toInt()]
              private fun lum(o: FloatArray) = 0.2126f * o[0] + 0.7152f * o[1] + 0.0722f * o[2]

              fun run(input: List<Frame>, log: (String) -> Unit): Bitmap {
                  val frames = input.sortedBy { it.gain }
                  val n = frames.size
                  val ri = n / 2
                  val ref = frames[ri]
                  val w = ref.w
                  val h = ref.h
                  val gxs = IntArray(n)
                  val gys = IntArray(n)
                  for (i in 0 until n) {
                      if (i == ri) continue
                      log("Aligning exposure ${i + 1}/$n…")
                      val rel = (ref.gain / frames[i].gain).toFloat()
                      val lut = ByteArray(256) { k -> enc(lin[k] * rel).toByte() }
                      val src = frames[i].y
                      val eq = ByteArray(w * h)
                      for (p in eq.indices) eq[p] = lut[src[p].toInt() and 0xFF]
                      val g = Align.global(ref.y, eq, w, h)
                      gxs[i] = g[0]; gys[i] = g[1]
                  }

                  fun sample(u: Int, v: Int, o: FloatArray) {
                      var sr = 0f; var sg = 0f; var sb = 0f; var sw = 0f
                      for (i in 0 until n) {
                          val f = frames[i]
                          val uu = (u + gxs[i]).coerceIn(0, w - 1)
                          val vv = (v + gys[i]).coerceIn(0, h - 1)
                          val yb = f.y[vv * w + uu].toInt() and 0xFF
                          val ci = (vv / 2) * (w / 2) + uu / 2
                          val yv = yb.toFloat()
                          val cb = (f.cb[ci].toInt() and 0xFF) - 128f
                          val cr = (f.cr[ci].toInt() and 0xFF) - 128f
                          val r = yv + 1.402f * cr
                          val g = yv - 0.344136f * cb - 0.714136f * cr
                          val b = yv + 1.772f * cb
                          val t = yb / 255f
                          var wt = if (t > 0.985f) 1e-4f else {
                              val a = 2f * t - 1f
                              val a2 = a * a
                              max(1f - a2 * a2 * a2, 0.01f)
                          }
                          val e = (f.gain / ref.gain).toFloat()
                          wt *= e
                          val inv = 1f / e
                          sr += wt * lin[Px.c8(r)] * inv
                          sg += wt * lin[Px.c8(g)] * inv
                          sb += wt * lin[Px.c8(b)] * inv
                          sw += wt
                      }
                      o[0] = sr / sw; o[1] = sg / sw; o[2] = sb / sw
                  }

                  log("Building radiance + tone map…")
                  val blk = 8
                  val bw = w / blk
                  val bh = h / blk
                  val raw = FloatArray(bw * bh)
                  IntStream.range(0, bh).parallel().forEach { by ->
                      val o = FloatArray(3)
                      for (bx in 0 until bw) {
                          var s = 0f
                          for (dy in intArrayOf(2, 6)) for (dx in intArrayOf(2, 6)) {
                              sample(bx * blk + dx, by * blk + dy, o)
                              s += ln(lum(o) + 1e-5f)
                          }
                          raw[by * bw + bx] = s / 4f
                      }
                  }
                  val rad = 8
                  val sp = Array(2 * rad + 1) { dy ->
                      FloatArray(2 * rad + 1) { dx ->
                          exp(-(((dx - rad) * (dx - rad) + (dy - rad) * (dy - rad)).toFloat()) / 32f)
                      }
                  }
                  val base = FloatArray(bw * bh)
                  IntStream.range(0, bh).parallel().forEach { y ->
                      for (x in 0 until bw) {
                          val c = raw[y * bw + x]
                          var s = 0f
                          var ws = 0f
                          for (dy in -rad..rad) {
                              val yy = y + dy
                              if (yy < 0 || yy >= bh) continue
                              for (dx in -rad..rad) {
                                  val xx = x + dx
                                  if (xx < 0 || xx >= bw) continue
                                  val v = raw[yy * bw + xx]
                                  val d = v - c
                                  val wgt = sp[dy + rad][dx + rad] * exp(-d * d / 0.72f)
                                  s += wgt * v
                                  ws += wgt
                              }
                          }
                          base[y * bw + x] = s / ws
                      }
                  }
                  val sorted = base.sortedArray()
                  val anchor = sorted[(sorted.size * 0.97f).toInt().coerceAtMost(sorted.size - 1)]
                  val comp = 0.55f
                  val detail = 1.2f
                  val key = ln(0.9f)

                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  IntStream.range(0, h).parallel().forEach { y ->
                      val o = FloatArray(3)
                      val row = IntArray(w)
                      val gy = ((y - blk / 2f) / blk).coerceIn(0f, (bh - 1).toFloat())
                      val y0 = gy.toInt()
                      val y1 = min(y0 + 1, bh - 1)
                      val fy = gy - y0
                      for (x in 0 until w) {
                          sample(x, y, o)
                          val l = lum(o) + 1e-5f
                          val gx = ((x - blk / 2f) / blk).coerceIn(0f, (bw - 1).toFloat())
                          val x0 = gx.toInt()
                          val x1 = min(x0 + 1, bw - 1)
                          val fx = gx - x0
                          val b = (base[y0 * bw + x0] * (1 - fx) + base[y0 * bw + x1] * fx) * (1 - fy) +
                                  (base[y1 * bw + x0] * (1 - fx) + base[y1 * bw + x1] * fx) * fy
                          val outL = exp(comp * (b - anchor) + detail * (ln(l) - b) + key)
                          val k = outL / l
                          row[x] = (0xFF shl 24) or (enc(o[0] * k) shl 16) or (enc(o[1] * k) shl 8) or enc(o[2] * k)
                      }
                      synchronized(bmp) { bmp.setPixels(row, 0, w, 0, y, w, 1) }
                  }
                  return bmp
              }
          }
