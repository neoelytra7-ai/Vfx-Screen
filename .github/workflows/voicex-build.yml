name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/voicex
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VoiceX"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.voicex"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.voicex"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("com.microsoft.onnxruntime:onnxruntime-android:1.18.0") }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application android:label="VoiceX" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/voicex/Pitch.kt <<'EOF'
          package com.example.voicex

          /** YIN pitch tracker: 16 kHz mono in, Hz per 10 ms frame out (0 = unvoiced). */
          object Pitch {
              fun f0(x: FloatArray): FloatArray {
                  val hop = 160
                  val w = 512
                  val tauMin = 14
                  val tauMax = 320
                  val frames = x.size / hop + 1
                  val out = FloatArray(frames)
                  val seg = FloatArray(w + tauMax)
                  val d = FloatArray(tauMax + 1)
                  val cm = FloatArray(tauMax + 1)
                  for (f in 0 until frames) {
                      val start = f * hop - w / 2
                      var e = 0.0
                      for (i in seg.indices) {
                          val j = start + i
                          seg[i] = if (j >= 0 && j < x.size) x[j] else 0f
                      }
                      for (i in 0 until w) e += (seg[i] * seg[i]).toDouble()
                      if (Math.sqrt(e / w) < 0.008) continue
                      for (tau in 1..tauMax) {
                          var sum = 0f
                          for (i in 0 until w) {
                              val df = seg[i] - seg[i + tau]
                              sum += df * df
                          }
                          d[tau] = sum
                      }
                      var run = 0f
                      cm[0] = 1f
                      for (tau in 1..tauMax) {
                          run += d[tau]
                          cm[tau] = if (run > 0f) d[tau] * tau / run else 1f
                      }
                      var best = -1
                      var tau = tauMin
                      while (tau < tauMax - 1) {
                          if (cm[tau] < 0.15f) {
                              while (tau + 1 < tauMax - 1 && cm[tau + 1] < cm[tau]) tau++
                              best = tau
                              break
                          }
                          tau++
                      }
                      if (best < 1) continue
                      val a = cm[best - 1]
                      val b = cm[best]
                      val c = cm[best + 1]
                      val den = 2f * (a - 2f * b + c)
                      val refined = if (Math.abs(den) > 1e-6f) best + (a - c) / den else best.toFloat()
                      out[f] = 16000f / refined
                  }
                  // 5-frame median over voiced frames to kill octave jitter
                  val sm = FloatArray(frames)
                  val win = FloatArray(5)
                  for (i in 0 until frames) {
                      if (out[i] <= 0f) continue
                      var n = 0
                      for (k in -2..2) {
                          val j = i + k
                          if (j in 0 until frames && out[j] > 0f) win[n++] = out[j]
                      }
                      java.util.Arrays.sort(win, 0, n)
                      sm[i] = win[n / 2]
                  }
                  return sm
              }
          }
          EOF
          cat > app/src/main/java/com/example/voicex/Rvc.kt <<'EOF'
          package com.example.voicex

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import ai.onnxruntime.TensorInfo
          import java.nio.FloatBuffer
          import java.nio.LongBuffer
          import java.util.Random

          /** RVC inference on ONNX Runtime: ContentVec/HuBERT features + YIN pitch -> voice model -> audio. */
          class Rvc {
              private val env = OrtEnvironment.getEnvironment()

              fun phoneDim(voicePath: String): Int {
                  val so = OrtSession.SessionOptions()
                  val s = env.createSession(voicePath, so)
                  try {
                      val info = s.inputInfo["phone"]?.info as? TensorInfo ?: error("Not an RVC voice model (no 'phone' input)")
                      return info.shape.last().toInt()
                  } finally {
                      s.close()
                  }
              }

              /** Returns (features flat [T][dim], T) at 50 fps. */
              private fun content(path: String, wav: FloatArray, dim: Int): Pair<FloatArray, Int> {
                  val so = OrtSession.SessionOptions()
                  so.setIntraOpNumThreads(4)
                  val s = env.createSession(path, so)
                  try {
                      val inName = s.inputNames.first()
                      val rank = (s.inputInfo[inName]!!.info as TensorInfo).shape.size
                      val shape = if (rank == 3) longArrayOf(1, 1, wav.size.toLong()) else longArrayOf(1, wav.size.toLong())
                      val t = OnnxTensor.createTensor(env, FloatBuffer.wrap(wav), shape)
                      try {
                          val r = s.run(mapOf(inName to t))
                          try {
                              val o = r[0] as OnnxTensor
                              val sh = o.info.shape
                              val fb = o.floatBuffer
                              val flat = FloatArray(fb.remaining())
                              fb.get(flat)
                              if (sh.size != 3) error("Unexpected content model output")
                              if (sh[2].toInt() == dim) return Pair(flat, sh[1].toInt())
                              if (sh[1].toInt() == dim) {
                                  val frames = sh[2].toInt()
                                  val tr = FloatArray(flat.size)
                                  for (f in 0 until frames) for (c in 0 until dim) tr[f * dim + c] = flat[c * frames + f]
                                  return Pair(tr, frames)
                              }
                              error("Content model outputs ${sh[2]} dims but the voice needs $dim")
                          } finally {
                              r.close()
                          }
                      } finally {
                          t.close()
                      }
                  } finally {
                      s.close()
                  }
              }

              fun convert(wav: FloatArray, voicePath: String, hubertFor: (Int) -> String?, semitones: Float, say: (String) -> Unit): Pair<FloatArray, Int> {
                  val so = OrtSession.SessionOptions()
                  so.setIntraOpNumThreads(4)
                  say("Loading voice model…")
                  val voice = env.createSession(voicePath, so)
                  val made = ArrayList<OnnxTensor>()
                  try {
                      for (n in listOf("phone", "phone_lengths", "pitch", "pitchf", "ds", "rnd")) {
                          require(voice.inputNames.contains(n)) { "Unsupported voice model (missing input '$n'). Export it with RVC's export_onnx." }
                      }
                      val dim = (voice.inputInfo["phone"]!!.info as TensorInfo).shape.last().toInt()
                      val hp = hubertFor(dim) ?: error("Import a $dim-dim ContentVec/HuBERT ONNX model first")

                      say("Reading speech content…")
                      val (feat, t50) = content(hp, wav, dim)
                      val t = t50 * 2
                      val phone = FloatArray(t * dim)
                      for (i in 0 until t) System.arraycopy(feat, (i / 2) * dim, phone, i * dim, dim)

                      say("Tracking pitch…")
                      val f0 = Pitch.f0(wav)
                      val melMin = 1127.0 * Math.log(1.0 + 50.0 / 700.0)
                      val melMax = 1127.0 * Math.log(1.0 + 1100.0 / 700.0)
                      val ratio = Math.pow(2.0, semitones / 12.0)
                      val coarse = LongArray(t)
                      val pitchf = FloatArray(t)
                      for (i in 0 until t) {
                          val hz = (if (i < f0.size) f0[i] else 0f) * ratio
                          pitchf[i] = hz.toFloat()
                          coarse[i] = if (hz > 0.0) {
                              val mel = 1127.0 * Math.log(1.0 + hz / 700.0)
                              Math.round((mel - melMin) * 254.0 / (melMax - melMin) + 1.0).coerceIn(1L, 255L)
                          } else 1L
                      }
                      val rng = Random()
                      val rnd = FloatArray(192 * t) { rng.nextGaussian().toFloat() }

                      say("Synthesising…")
                      val tl = t.toLong()
                      val inputs = HashMap<String, OnnxTensor>()
                      inputs["phone"] = OnnxTensor.createTensor(env, FloatBuffer.wrap(phone), longArrayOf(1, tl, dim.toLong()))
                      inputs["phone_lengths"] = OnnxTensor.createTensor(env, LongBuffer.wrap(longArrayOf(tl)), longArrayOf(1))
                      inputs["pitch"] = OnnxTensor.createTensor(env, LongBuffer.wrap(coarse), longArrayOf(1, tl))
                      inputs["pitchf"] = OnnxTensor.createTensor(env, FloatBuffer.wrap(pitchf), longArrayOf(1, tl))
                      inputs["ds"] = OnnxTensor.createTensor(env, LongBuffer.wrap(longArrayOf(0)), longArrayOf(1))
                      inputs["rnd"] = OnnxTensor.createTensor(env, FloatBuffer.wrap(rnd), longArrayOf(1, 192, tl))
                      made.addAll(inputs.values)
                      val r = voice.run(inputs)
                      try {
                          val o = r[0] as OnnxTensor
                          val fb = o.floatBuffer
                          val audio = FloatArray(fb.remaining())
                          fb.get(audio)
                          var peak = 0f
                          for (v in audio) peak = Math.max(peak, Math.abs(v))
                          if (peak > 0.95f) for (i in audio.indices) audio[i] = audio[i] / peak * 0.95f
                          val guess = audio.size / (t / 100.0)
                          val sr = intArrayOf(16000, 24000, 32000, 40000, 44100, 48000).minByOrNull { Math.abs(it - guess) }!!
                          return Pair(audio, sr)
                      } finally {
                          r.close()
                      }
                  } finally {
                      for (x in made) x.close()
                      voice.close()
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/voicex/Audio.kt <<'EOF'
          package com.example.voicex

          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import java.io.File
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class Recorder {
              @Volatile var recording = false
              @Volatile var level = 0f
              private var thread: Thread? = null
              private val chunks = ArrayList<ShortArray>()

              fun start() {
                  val min = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  val ar = AudioRecord(MediaRecorder.AudioSource.MIC, 16000, AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT, Math.max(min, 16000))
                  chunks.clear()
                  recording = true
                  val t = Thread {
                      ar.startRecording()
                      val buf = ShortArray(1600)
                      while (recording) {
                          val n = ar.read(buf, 0, buf.size)
                          if (n > 0) {
                              chunks.add(buf.copyOf(n))
                              var p = 0
                              for (i in 0 until n) p = Math.max(p, Math.abs(buf[i].toInt()))
                              level = p / 32768f
                          }
                      }
                      ar.stop()
                      ar.release()
                  }
                  thread = t
                  t.start()
              }

              fun stop(): FloatArray {
                  recording = false
                  thread?.join()
                  level = 0f
                  var total = 0
                  for (c in chunks) total += c.size
                  val out = FloatArray(total)
                  var o = 0
                  for (c in chunks) for (s in c) out[o++] = s / 32768f
                  return out
              }
          }

          class Player {
              private var track: AudioTrack? = null

              fun play(x: FloatArray, sr: Int) {
                  stop()
                  val t = AudioTrack.Builder()
                      .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_FLOAT)
                          .setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                      .setBufferSizeInBytes(x.size * 4)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()
                  t.write(x, 0, x.size, AudioTrack.WRITE_BLOCKING)
                  t.play()
                  track = t
              }

              fun stop() {
                  track?.let {
                      try { it.stop() } catch (e: Exception) { }
                      it.release()
                  }
                  track = null
              }
          }

          fun saveWav(x: FloatArray, sr: Int, f: File) {
              val data = ByteBuffer.allocate(x.size * 2).order(ByteOrder.LITTLE_ENDIAN)
              for (v in x) data.putShort((v.coerceIn(-1f, 1f) * 32767f).toInt().toShort())
              val h = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
              h.put("RIFF".toByteArray()); h.putInt(36 + x.size * 2); h.put("WAVE".toByteArray())
              h.put("fmt ".toByteArray()); h.putInt(16); h.putShort(1); h.putShort(1)
              h.putInt(sr); h.putInt(sr * 2); h.putShort(2); h.putShort(16)
              h.put("data".toByteArray()); h.putInt(x.size * 2)
              FileOutputStream(f).use {
                  it.write(h.array())
                  it.write(data.array())
              }
          }
          EOF
          cat > app/src/main/java/com/example/voicex/MainActivity.kt <<'EOF'
          package com.example.voicex

          import android.Manifest
          import android.animation.ValueAnimator
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import java.io.File

          class MainActivity : Activity() {
              private val ui = Handler(Looper.getMainLooper())
              private val rec = Recorder()
              private val player = Player()
              private val rvc = Rvc()
              private var original: FloatArray? = null
              private var converted: FloatArray? = null
              private var convSr = 40000
              private var selected: String? = null
              private var semi = 0
              private var busy = false
              private lateinit var status: TextView
              private lateinit var voiceList: LinearLayout
              private lateinit var recBtn: TextView
              private lateinit var level: View
              private lateinit var modelInfo: TextView

              private val BG = Color.parseColor("#0A0B10")
              private val CARD = Color.parseColor("#14161F")
              private val CARD2 = Color.parseColor("#1C1F2B")
              private val TEXT = Color.parseColor("#EEF0F6")
              private val DIM = Color.parseColor("#8B91A3")
              private val ACC = Color.parseColor("#7C5CFF")
              private val ACC2 = Color.parseColor("#2DE2C4")
              private val RED = Color.parseColor("#FF4D6A")

              private fun dp(v: Int) = (v * resources.displayMetrics.density + 0.5f).toInt()
              private fun voicesDir() = File(filesDir, "voices").also { it.mkdirs() }
              private fun hubert(dim: Int) = File(filesDir, "hubert_$dim.onnx")

              private fun bg(c: Int, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(c)
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              private fun btn(text: String, c: Int, fg: Int, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = 14f
                  t.setTextColor(fg)
                  t.gravity = Gravity.CENTER
                  t.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  t.setPadding(dp(14), dp(12), dp(14), dp(12))
                  t.background = bg(c, 20)
                  t.setOnClickListener {
                      it.animate().scaleX(0.95f).scaleY(0.95f).setDuration(80).withEndAction {
                          it.animate().scaleX(1f).scaleY(1f).setDuration(220).start()
                      }.start()
                      onClick()
                  }
                  return t
              }

              private fun card(): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.background = bg(CARD, 22)
                  l.setPadding(dp(16), dp(16), dp(16), dp(16))
                  val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  lp.bottomMargin = dp(12)
                  l.layoutParams = lp
                  return l
              }

              private fun label(text: String, size: Float = 12f, c: Int = DIM): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = size
                  t.setTextColor(c)
                  return t
              }

              private fun row(vararg v: View): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  for ((i, x) in v.withIndex()) {
                      val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      if (i > 0) lp.leftMargin = dp(8)
                      r.addView(x, lp)
                  }
                  val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  lp.topMargin = dp(10)
                  r.layoutParams = lp
                  return r
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = BG
                  window.navigationBarColor = BG
                  selected = getSharedPreferences("v", 0).getString("voice", null)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(16), dp(14), dp(16), dp(24))
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(BG)
                  sv.isVerticalScrollBarEnabled = false
                  sv.addView(root)
                  setContentView(sv)

                  val title = label("VOICEX", 26f, TEXT)
                  title.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  title.letterSpacing = 0.18f
                  root.addView(title)
                  root.addView(label("LOCAL VOICE CHANGER · RVC ON-DEVICE", 10.5f))

                  // ---- voices
                  val models = card()
                  (models.layoutParams as LinearLayout.LayoutParams).topMargin = dp(16)
                  models.addView(label("VOICES", 11f))
                  voiceList = LinearLayout(this)
                  voiceList.orientation = LinearLayout.VERTICAL
                  models.addView(voiceList)
                  models.addView(row(
                      btn("＋ Import voice (.onnx)", ACC, Color.WHITE) { pick(1) },
                      btn("ContentVec 256", CARD2, TEXT) { pick(2) },
                      btn("ContentVec 768", CARD2, TEXT) { pick(3) }))
                  modelInfo = label("", 11.5f)
                  modelInfo.setPadding(0, dp(10), 0, 0)
                  models.addView(modelInfo)
                  root.addView(models)

                  // ---- record
                  val rc = card()
                  rc.addView(label("RECORD", 11f))
                  recBtn = btn("●  Tap to record", RED, Color.WHITE) { toggleRecord() }
                  recBtn.textSize = 17f
                  recBtn.setPadding(dp(14), dp(20), dp(14), dp(20))
                  val rlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  rlp.topMargin = dp(10)
                  rc.addView(recBtn, rlp)
                  level = View(this)
                  level.background = bg(ACC2, 4)
                  val llp = LinearLayout.LayoutParams(0, dp(6))
                  llp.topMargin = dp(12)
                  rc.addView(level, llp)
                  val semiTv = label("Pitch shift: 0 semitones", 13f, TEXT)
                  semiTv.setPadding(0, dp(16), 0, 0)
                  rc.addView(semiTv)
                  val sb = SeekBar(this)
                  sb.max = 24
                  sb.progress = 12
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) {
                          semi = p - 12
                          semiTv.text = "Pitch shift: " + (if (semi > 0) "+" else "") + semi + " semitones"
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  rc.addView(sb)
                  root.addView(rc)

                  // ---- convert
                  val cv = card()
                  cv.addView(btn("✦  Convert to selected voice", ACC, Color.WHITE) { convert() })
                  status = label("Record something, pick a voice, convert.", 12.5f)
                  status.setPadding(0, dp(12), 0, 0)
                  cv.addView(status)
                  cv.addView(row(
                      btn("▶ Original", CARD2, TEXT) { original?.let { player.play(it, 16000) } },
                      btn("▶ Converted", CARD2, ACC2) { converted?.let { player.play(it, convSr) } },
                      btn("■ Stop", CARD2, DIM) { player.stop() }))
                  cv.addView(row(btn("Save converted as WAV", CARD2, TEXT) { save() }))
                  root.addView(cv)

                  refresh()
                  animateLevel()
                  root.alpha = 0f
                  root.translationY = dp(24).toFloat()
                  root.animate().alpha(1f).translationY(0f).setDuration(450).start()
              }

              // ------------------------------------------------------------------ models
              private fun refresh() {
                  voiceList.removeAllViews()
                  val files = voicesDir().listFiles { f -> f.name.endsWith(".onnx") }?.sortedBy { it.name } ?: emptyList()
                  if (files.isEmpty()) voiceList.addView(label("No voices yet. Import an RVC voice exported to ONNX.", 12.5f))
                  for (f in files) {
                      val on = f.name == selected
                      val t = TextView(this)
                      t.text = (if (on) "◉  " else "○  ") + f.name.removeSuffix(".onnx")
                      t.textSize = 15f
                      t.setTextColor(if (on) ACC2 else TEXT)
                      t.setPadding(dp(8), dp(11), dp(8), dp(11))
                      t.setOnClickListener {
                          selected = f.name
                          getSharedPreferences("v", 0).edit().putString("voice", f.name).apply()
                          refresh()
                      }
                      t.setOnLongClickListener {
                          AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                              .setTitle("Delete " + f.name + "?")
                              .setPositiveButton("Delete") { _, _ -> f.delete(); refresh() }
                              .setNegativeButton("Cancel", null).show()
                          true
                      }
                      voiceList.addView(t)
                  }
                  modelInfo.text = "ContentVec 256: " + (if (hubert(256).exists()) "ready" else "missing") +
                      "   ·   768: " + (if (hubert(768).exists()) "ready" else "missing") +
                      "\nLong-press a voice to delete it."
              }

              private fun pick(code: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  startActivityForResult(i, code)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  val uri: Uri = data?.data ?: return
                  if (res != RESULT_OK) return
                  var name = "voice.onnx"
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (c.moveToFirst() && i >= 0) name = c.getString(i)
                  }
                  val dest = when (req) {
                      2 -> hubert(256)
                      3 -> hubert(768)
                      else -> File(voicesDir(), if (name.endsWith(".onnx")) name else "$name.onnx")
                  }
                  say("Importing " + name + "…")
                  Thread {
                      try {
                          contentResolver.openInputStream(uri)!!.use { ins -> dest.outputStream().use { ins.copyTo(it) } }
                          ui.post { say("Imported $name"); refresh() }
                      } catch (e: Exception) {
                          ui.post { say("Import failed: " + e.message) }
                      }
                  }.start()
              }

              // ------------------------------------------------------------------ record / convert
              private fun toggleRecord() {
                  if (rec.recording) {
                      original = rec.stop()
                      val secs = original!!.size / 16000f
                      recBtn.text = "●  Tap to record"
                      say(String.format("Recorded %.1f s", secs))
                  } else {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                          return
                      }
                      player.stop()
                      rec.start()
                      recBtn.text = "■  Recording… tap to stop"
                  }
              }

              private fun convert() {
                  val src = original
                  val voice = selected
                  if (busy) return
                  if (src == null || src.size < 8000) { say("Record at least a second first."); return }
                  if (voice == null || !File(voicesDir(), voice).exists()) { say("Pick a voice first."); return }
                  busy = true
                  Thread {
                      try {
                          val t0 = System.currentTimeMillis()
                          val (audio, sr) = rvc.convert(src, File(voicesDir(), voice).absolutePath,
                              { dim -> hubert(dim).takeIf { it.exists() }?.absolutePath }, semi.toFloat()) { m -> ui.post { say(m) } }
                          converted = audio
                          convSr = sr
                          ui.post { say(String.format("Done in %.1f s. Tap Converted to listen.", (System.currentTimeMillis() - t0) / 1000f)) }
                      } catch (e: Throwable) {
                          ui.post { say("Failed: " + (e.message ?: e.toString())) }
                      } finally {
                          busy = false
                      }
                  }.start()
              }

              private fun save() {
                  val c = converted ?: run { say("Nothing to save yet."); return }
                  val dir = getExternalFilesDir(Environment.DIRECTORY_MUSIC) ?: filesDir
                  val f = File(dir, "voicex_" + System.currentTimeMillis() + ".wav")
                  saveWav(c, convSr, f)
                  say("Saved: " + f.absolutePath)
              }

              private fun say(m: String) {
                  status.text = m
              }

              private fun animateLevel() {
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.repeatCount = ValueAnimator.INFINITE
                  a.duration = 1000
                  a.addUpdateListener {
                      val w = (rec.level * 3f).coerceAtMost(1f) * (recBtn.width.toFloat())
                      val lp = level.layoutParams
                      lp.width = Math.max(dp(4), w.toInt())
                      level.layoutParams = lp
                      recBtn.alpha = if (rec.recording) 0.75f + 0.25f * (1f - it.animatedValue as Float) else 1f
                  }
                  a.start()
              }

              override fun onDestroy() {
                  player.stop()
                  super.onDestroy()
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: VoiceX-debug, path: app/build/outputs/apk/debug/*.apk }
