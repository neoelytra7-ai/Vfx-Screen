              private fun showSpecs(s: Specs.Info) {
                  specTv.text = "SoC: " + s.soc + "\nCPU cores: " + s.cores + "   ·   RAM: " + String.format("%.1f", s.ramMb / 1024f) + " GB" +
                      "\nGPU: " + s.gpu + "\nPitch tracker: ~" + s.pitchX + "× realtime"
                  recTv.text = "Tier: " + s.tierName + "\n" + s.advice
              }

              private fun recommendSearch() {
                  hfQuery.setText(Specs.cur?.query ?: "rvc onnx")
                  hfSearch()
              }

              // ------------------------------------------------------------------ models
              private fun refresh() {
                  voiceList.removeAllViews()
                  val files = voicesDir().listFiles { f -> f.name.endsWith(".onnx") }?.sortedBy { it.name } ?: emptyList()
                  if (files.isEmpty()) voiceList.addView(label("No voices yet. Import an RVC voice exported to ONNX.", 12.5f))
                  for (f in files) {
                      val on = f.name == selected
                      val t = TextView(this)
                      t.text = (if (on) "◉  " else "○  ") + f.name.removeSuffix(".onnx")
                      t.textSize = 15f
                      t.setTextColor(if (on) ACC2 else TEXT)
                      t.setPadding(dp(8), dp(11), dp(8), dp(11))
                      t.setOnClickListener {
                          selected = f.name
                          getSharedPreferences("v", 0).edit().putString("voice", f.name).apply()
                          refresh()
                      }
                      t.setOnLongClickListener {
                          AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                              .setTitle("Delete " + f.name + "?")
                              .setPositiveButton("Delete") { _, _ -> rvc.release(f.absolutePath); f.delete(); refresh() }
                              .setNegativeButton("Cancel", null).show()
                          true
                      }
                      voiceList.addView(t)
                  }
                  modelInfo.text = "ContentVec 256: " + (if (hubert(256).exists()) "ready" else "missing") +
                      "   ·   768: " + (if (hubert(768).exists()) "ready" else "missing") +
                      "\nLong-press a voice to delete it."
              }

              private fun pick(code: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  startActivityForResult(i, code)
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  val uri: Uri = data?.data ?: return
                  if (res != RESULT_OK) return
                  var name = "voice.onnx"
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (c.moveToFirst() && i >= 0) name = c.getString(i)
                  }
                  val dest = when (req) {
                      2 -> hubert(256)
                      3 -> hubert(768)
                      else -> File(voicesDir(), if (name.endsWith(".onnx")) name else "$name.onnx")
                  }
                  say("Importing " + name + "…")
                  Thread {
                      try {
                          contentResolver.openInputStream(uri)!!.use { ins -> dest.outputStream().use { ins.copyTo(it) } }
                          ui.post { say("Imported $name"); refresh() }
                      } catch (e: Exception) {
                          ui.post { say("Import failed: " + e.message) }
                      }
                  }.start()
              }


              // ------------------------------------------------------------------ hugging face
              private fun isVoiceFile(n: String): Boolean {
                  val l = n.lowercase()
                  return l.endsWith(".onnx") && listOf("vec-", "hubert", "rmvpe", "contentvec", "whisper", "crepe", "fcpe").none { l.contains(it) }
              }

              private fun progress(show: Boolean, pct: Int = 0) {
                  hfProgress.visibility = if (show) View.VISIBLE else View.GONE
                  hfProgress.progress = pct
              }

              private fun prog(d: Long, t: Long, name: String) {
                  val p = if (t > 0) (d * 100 / t).toInt() else 0
                  progress(true, p)
                  say("Downloading " + name + " · " + p + "% (" + (d / 1048576) + " MB)")
              }

              private fun hfSearch() {
                  val q = hfQuery.text.toString().trim()
                  if (q.isEmpty()) return
                  say("Searching Hugging Face…")
                  Thread {
                      try {
                          val r = Hf.search(q)
                          ui.post { showRepos(r) }
                      } catch (e: Exception) {
                          ui.post { say("Search failed: " + e.message) }
                      }
                  }.start()
              }

              private fun showRepos(list: List<Hf.Repo>) {
                  hfList.removeAllViews()
                  if (list.isEmpty()) { say("No results."); return }
                  say(list.size.toString() + " results. Tap one to see its ONNX files.")
                  for (repo in list.take(20)) {
                      val t = TextView(this)
                      t.text = repo.id + "\n↓ " + repo.downloads + "   ♥ " + repo.likes
                      t.textSize = 13.5f
                      t.setTextColor(TEXT)
                      t.setPadding(dp(8), dp(10), dp(8), dp(10))
                      t.setOnClickListener { hfFiles(repo) }
                      hfList.addView(t)
                  }
              }

              private fun hfFiles(repo: Hf.Repo) {
                  say("Reading " + repo.id + "…")
                  Thread {
                      try {
                          val fs = Hf.files(repo.id).filter { isVoiceFile(it.name) }
                          ui.post {
                              if (fs.isEmpty()) {
                                  say("No RVC voice .onnx in this repo.")
                              } else {
                                  val lim = (Specs.cur?.maxVoiceMb ?: 120) * 1048576L
                                  val names = fs.map {
                                      (if (it.size < 0) "" else if (it.size <= lim) "✓ " else "⚠ ") + it.name.substringAfterLast('/') +
                                          (if (it.size > 0) "  (" + (it.size / 1048576) + " MB)" else "")
                                  }
                                  AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                                      .setTitle(repo.id)
                                      .setItems(names.toTypedArray()) { _, i -> downloadVoice(repo, fs[i]) }
                                      .setNegativeButton("Cancel", null).show()
                              }
                          }
                      } catch (e: Exception) {
                          ui.post { say("Could not read repo: " + e.message) }
                      }
                  }.start()
              }

              private fun downloadVoice(repo: Hf.Repo, f: Hf.HFile) {
                  if (busy) { say("Busy, wait for the current task."); return }
                  busy = true
                  val dest = File(voicesDir(), repo.id.replace('/', '_') + "_" + f.name.substringAfterLast('/'))
                  Thread {
                      try {
                          Hf.download(repo.id, f.name, dest) { d, t -> ui.post { prog(d, t, f.name.substringAfterLast('/')) } }
                          ui.post { say("Checking compatibility…") }
                          val dim = rvc.phoneDim(dest.absolutePath)
                          selected = dest.name
                          getSharedPreferences("v", 0).edit().putString("voice", dest.name).apply()
                          ui.post { progress(false); refresh() }
                          if (!hubert(dim).exists()) {
                              try {
                                  setupContent(dim)
                              } catch (e: Throwable) {
                                  ui.post { progress(false); say("Voice saved, but ContentVec setup failed: " + e.message + ". Import it manually.") }
                              }
                          } else {
                              ui.post { say("Voice ready. Record and convert!") }
                          }
                      } catch (e: Throwable) {
                          rvc.release(dest.absolutePath)
                          dest.delete()
                          ui.post { progress(false); refresh(); say("Not usable: " + (e.message ?: e.toString())) }
                      } finally {
                          busy = false
                      }
                  }.start()
              }

              /** Runs on a worker thread: finds and downloads the matching ContentVec model. */
              private fun setupContent(dim: Int) {
                  ui.post { say("Looking for a $dim-dim ContentVec model…") }
                  val hit = Hf.findContentVec(dim) ?: error("No $dim-dim ContentVec ONNX found on Hugging Face")
                  Hf.download(hit.first, hit.second.name, hubert(dim)) { d, t -> ui.post { prog(d, t, "ContentVec $dim") } }
                  ui.post { progress(false); say("ContentVec $dim ready."); refresh() }
              }

              private fun autoSetup() {
                  if (busy) { say("Busy, wait for the current task."); return }
                  busy = true
                  Thread {
                      try {
                          val sel = selected
                          val dim = if (sel != null && File(voicesDir(), sel).exists()) rvc.phoneDim(File(voicesDir(), sel).absolutePath) else (Specs.cur?.preferDim ?: 768)
                          if (hubert(dim).exists()) ui.post { say("ContentVec $dim is already installed.") } else setupContent(dim)
                      } catch (e: Throwable) {
                          ui.post { progress(false); say("Setup failed: " + (e.message ?: e.toString())) }
                      } finally {
                          busy = false
                      }
                  }.start()
              }

              // ------------------------------------------------------------------ record / convert
              private fun toggleRecord() {
                  if (rec.recording) {
                      original = rec.stop()
                      val secs = original!!.size / 16000f
                      recBtn.text = "●  Tap to record"
                      say(String.format("Recorded %.1f s", secs))
                  } else {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                          return
                      }
                      player.stop()
                      rec.start()
                      recBtn.text = "■  Recording… tap to stop"
                  }
              }

              private fun convert() {
                  val src = original
                  val voice = selected
                  if (busy) return
                  if (src == null || src.size < 8000) { say("Record at least a second first."); return }
                  if (voice == null || !File(voicesDir(), voice).exists()) { say("Pick a voice first."); return }
                  busy = true
                  Thread {
                      try {
                          val t0 = System.currentTimeMillis()
                          val (audio, sr) = rvc.convert(src, File(voicesDir(), voice).absolutePath,
                              { dim -> hubert(dim).takeIf { it.exists() }?.absolutePath }, semi.toFloat()) { m -> ui.post { say(m) } }
                          converted = audio
                          convSr = sr
                          val note = Specs.cur?.let { if (src.size / 16000f > it.maxClipS) " · clip is longer than recommended" else "" } ?: ""
                          ui.post { say(String.format("Done in %.1f s on %s%s. Tap Converted to listen.", (System.currentTimeMillis() - t0) / 1000f, rvc.lastBackend, note)) }
                      } catch (e: Throwable) {
                          ui.post { say("Failed: " + (e.message ?: e.toString())) }
                      } finally {
                          busy = false
                      }
                  }.start()
              }

              private fun save() {
                  val c = converted ?: run { say("Nothing to save yet."); return }
                  val dir = getExternalFilesDir(Environment.DIRECTORY_MUSIC) ?: filesDir
                  val f = File(dir, "voicex_" + System.currentTimeMillis() + ".wav")
                  saveWav(c, convSr, f)
                  say("Saved: " + f.absolutePath)
              }

              private fun say(m: String) {
                  status.text = m
              }

              private fun animateLevel() {
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.repeatCount = ValueAnimator.INFINITE
                  a.duration = 1000
                  a.addUpdateListener {
                      val w = (rec.level * 3f).coerceAtMost(1f) * (recBtn.width.toFloat())
                      val lp = level.layoutParams
                      lp.width = Math.max(dp(4), w.toInt())
                      level.layoutParams = lp
                      recBtn.alpha = if (rec.recording) 0.75f + 0.25f * (1f - it.animatedValue as Float) else 1f
                  }
                  a.start()
              }

              override fun onDestroy() {
                  player.stop()
                  super.onDestroy()
              }
          }
          EOF
