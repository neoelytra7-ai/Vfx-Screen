name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/voicex
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VoiceX"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.voicex"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.voicex"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("com.microsoft.onnxruntime:onnxruntime-android:1.18.0") }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="VoiceX" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/voicex/Pitch.kt <<'EOF'
          package com.example.voicex

          /** YIN pitch tracker: 16 kHz mono in, Hz per 10 ms frame out (0 = unvoiced). */
          object Pitch {
              fun f0(x: FloatArray): FloatArray {
                  val hop = 160
                  val w = 512
                  val tauMin = 14
                  val tauMax = 320
                  val frames = x.size / hop + 1
                  val out = FloatArray(frames)
                  val seg = FloatArray(w + tauMax)
                  val d = FloatArray(tauMax + 1)
                  val cm = FloatArray(tauMax + 1)
                  for (f in 0 until frames) {
                      val start = f * hop - w / 2
                      var e = 0.0
                      for (i in seg.indices) {
                          val j = start + i
                          seg[i] = if (j >= 0 && j < x.size) x[j] else 0f
                      }
                      for (i in 0 until w) e += (seg[i] * seg[i]).toDouble()
                      if (Math.sqrt(e / w) < 0.008) continue
                      for (tau in 1..tauMax) {
                          var sum = 0f
                          for (i in 0 until w) {
                              val df = seg[i] - seg[i + tau]
                              sum += df * df
                          }
                          d[tau] = sum
                      }
                      var run = 0f
                      cm[0] = 1f
                      for (tau in 1..tauMax) {
                          run += d[tau]
                          cm[tau] = if (run > 0f) d[tau] * tau / run else 1f
                      }
                      var best = -1
                      var tau = tauMin
                      while (tau < tauMax - 1) {
                          if (cm[tau] < 0.15f) {
                              while (tau + 1 < tauMax - 1 && cm[tau + 1] < cm[tau]) tau++
                              best = tau
                              break
                          }
                          tau++
                      }
                      if (best < 1) continue
                      val a = cm[best - 1]
                      val b = cm[best]
                      val c = cm[best + 1]
                      val den = 2f * (a - 2f * b + c)
                      val refined = if (Math.abs(den) > 1e-6f) best + (a - c) / den else best.toFloat()
                      out[f] = 16000f / refined
                  }
                  // 5-frame median over voiced frames to kill octave jitter
                  val sm = FloatArray(frames)
                  val win = FloatArray(5)
                  for (i in 0 until frames) {
                      if (out[i] <= 0f) continue
                      var n = 0
                      for (k in -2..2) {
                          val j = i + k
                          if (j in 0 until frames && out[j] > 0f) win[n++] = out[j]
                      }
                      java.util.Arrays.sort(win, 0, n)
                      sm[i] = win[n / 2]
                  }
                  return sm
              }
          }
          EOF
          cat > app/src/main/java/com/example/voicex/Rvc.kt <<'EOF'
          package com.example.voicex

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import ai.onnxruntime.TensorInfo
          import ai.onnxruntime.providers.NNAPIFlags
          import java.nio.FloatBuffer
          import java.nio.LongBuffer
          import java.util.EnumSet
          import java.util.Random

          /** RVC inference on ONNX Runtime: ContentVec/HuBERT features + YIN pitch -> voice model -> audio. */
          class Rvc {
              private val env = OrtEnvironment.getEnvironment()

              private val threads = Math.max(2, Math.min(4, Runtime.getRuntime().availableProcessors() / 2))
              private var vPath: String? = null
              private var vSess: OrtSession? = null
              private var hPath: String? = null
              private var hSess: OrtSession? = null

              /** 0 = auto (NNAPI GPU/NPU, CPU fallback), 1 = GPU only, 2 = CPU */
              var backend = 0
              private var forceCpu = false
              var lastBackend = "CPU"

              @Synchronized
              fun setBackend(b: Int) {
                  backend = b
                  forceCpu = false
                  closeAll()
              }

              @Synchronized
              fun closeAll() {
                  vSess?.close(); vSess = null; vPath = null
                  hSess?.close(); hSess = null; hPath = null
              }

              private fun opts(): OrtSession.SessionOptions {
                  val o = OrtSession.SessionOptions()
                  o.setIntraOpNumThreads(if (backend == 2 || forceCpu) threads else 2)
                  o.setOptimizationLevel(OrtSession.SessionOptions.OptLevel.ALL_OPT)
                  if (backend != 2 && !forceCpu) {
                      try {
                          o.addNnapi(EnumSet.of(NNAPIFlags.USE_FP16, NNAPIFlags.CPU_DISABLED))
                      } catch (e: Throwable) {
                      }
                  }
                  return o
              }

              @Synchronized
              private fun voiceSess(path: String): OrtSession {
                  if (path != vPath) {
                      vSess?.close()
                      vSess = null
                      vSess = env.createSession(path, opts())
                      vPath = path
                  }
                  return vSess!!
              }

              @Synchronized
              private fun hubSess(path: String): OrtSession {
                  if (path != hPath) {
                      hSess?.close()
                      hSess = null
                      hSess = env.createSession(path, opts())
                      hPath = path
                  }
                  return hSess!!
              }

              @Synchronized
              fun release(path: String) {
                  if (path == vPath) { vSess?.close(); vSess = null; vPath = null }
                  if (path == hPath) { hSess?.close(); hSess = null; hPath = null }
              }

              fun phoneDim(voicePath: String): Int {
                  val s = voiceSess(voicePath)
                  val info = s.inputInfo["phone"]?.info as? TensorInfo ?: error("Not an RVC voice model (no 'phone' input)")
                  return info.shape.last().toInt()
              }

              /** Returns (features flat [T][dim], T) at 50 fps. */
              private fun content(path: String, wav: FloatArray, dim: Int): Pair<FloatArray, Int> {
                  val s = hubSess(path)
                  try {
                      val inName = s.inputNames.first()
                      val rank = (s.inputInfo[inName]!!.info as TensorInfo).shape.size
                      val shape = if (rank == 3) longArrayOf(1, 1, wav.size.toLong()) else longArrayOf(1, wav.size.toLong())
                      val t = OnnxTensor.createTensor(env, FloatBuffer.wrap(wav), shape)
                      try {
                          val r = s.run(mapOf(inName to t))
                          try {
                              val o = r[0] as OnnxTensor
                              val sh = o.info.shape
                              val fb = o.floatBuffer
                              val flat = FloatArray(fb.remaining())
                              fb.get(flat)
                              if (sh.size != 3) error("Unexpected content model output")
                              if (sh[2].toInt() == dim) return Pair(flat, sh[1].toInt())
                              if (sh[1].toInt() == dim) {
                                  val frames = sh[2].toInt()
                                  val tr = FloatArray(flat.size)
                                  for (f in 0 until frames) for (c in 0 until dim) tr[f * dim + c] = flat[c * frames + f]
                                  return Pair(tr, frames)
                              }
                              error("Content model outputs ${sh[2]} dims but the voice needs $dim")
                          } finally {
                              r.close()
                          }
                      } finally {
                          t.close()
                      }
                  } finally {
                  }
              }

              fun convert(wav: FloatArray, voicePath: String, hubertFor: (Int) -> String?, semitones: Float, say: (String) -> Unit): Pair<FloatArray, Int> {
                  try {
                      val r = convertImpl(wav, voicePath, hubertFor, semitones, say)
                      lastBackend = if (backend != 2 && !forceCpu) "NNAPI (GPU/NPU where supported)" else "CPU"
                      return r
                  } catch (e: Throwable) {
                      if (backend == 0 && !forceCpu) {
                          say("GPU path failed (" + (e.message ?: "error") + "), retrying on CPU…")
                          forceCpu = true
                          closeAll()
                          val r = convertImpl(wav, voicePath, hubertFor, semitones, say)
                          lastBackend = "CPU (GPU fallback)"
                          return r
                      }
                      throw e
                  }
              }

              private fun convertImpl(wav: FloatArray, voicePath: String, hubertFor: (Int) -> String?, semitones: Float, say: (String) -> Unit): Pair<FloatArray, Int> {
                  say("Loading voice model…")
                  val voice = voiceSess(voicePath)
                  val made = ArrayList<OnnxTensor>()
                  try {
                      for (n in listOf("phone", "phone_lengths", "pitch", "pitchf", "ds", "rnd")) {
                          require(voice.inputNames.contains(n)) { "Unsupported voice model (missing input '$n'). Export it with RVC's export_onnx." }
                      }
                      val dim = (voice.inputInfo["phone"]!!.info as TensorInfo).shape.last().toInt()
                      val hp = hubertFor(dim) ?: error("Import a $dim-dim ContentVec/HuBERT ONNX model first")

                      say("Reading speech content…")
                      val (feat, t50) = content(hp, wav, dim)
                      val t = t50 * 2
                      val phone = FloatArray(t * dim)
                      for (i in 0 until t) System.arraycopy(feat, (i / 2) * dim, phone, i * dim, dim)

                      say("Tracking pitch…")
                      val f0 = Pitch.f0(wav)
                      val melMin = 1127.0 * Math.log(1.0 + 50.0 / 700.0)
                      val melMax = 1127.0 * Math.log(1.0 + 1100.0 / 700.0)
                      val ratio = Math.pow(2.0, semitones / 12.0)
                      val coarse = LongArray(t)
                      val pitchf = FloatArray(t)
                      for (i in 0 until t) {
                          val hz = (if (i < f0.size) f0[i] else 0f) * ratio
                          pitchf[i] = hz.toFloat()
                          coarse[i] = if (hz > 0.0) {
                              val mel = 1127.0 * Math.log(1.0 + hz / 700.0)
                              Math.round((mel - melMin) * 254.0 / (melMax - melMin) + 1.0).coerceIn(1L, 255L)
                          } else 1L
                      }
                      val rng = Random()
                      val rnd = FloatArray(192 * t) { rng.nextGaussian().toFloat() }

                      say("Synthesising…")
                      val tl = t.toLong()
                      val inputs = HashMap<String, OnnxTensor>()
                      inputs["phone"] = OnnxTensor.createTensor(env, FloatBuffer.wrap(phone), longArrayOf(1, tl, dim.toLong()))
                      inputs["phone_lengths"] = OnnxTensor.createTensor(env, LongBuffer.wrap(longArrayOf(tl)), longArrayOf(1))
                      inputs["pitch"] = OnnxTensor.createTensor(env, LongBuffer.wrap(coarse), longArrayOf(1, tl))
                      inputs["pitchf"] = OnnxTensor.createTensor(env, FloatBuffer.wrap(pitchf), longArrayOf(1, tl))
                      inputs["ds"] = OnnxTensor.createTensor(env, LongBuffer.wrap(longArrayOf(0)), longArrayOf(1))
                      inputs["rnd"] = OnnxTensor.createTensor(env, FloatBuffer.wrap(rnd), longArrayOf(1, 192, tl))
                      made.addAll(inputs.values)
                      val r = voice.run(inputs)
                      try {
                          val o = r[0] as OnnxTensor
                          val fb = o.floatBuffer
                          val audio = FloatArray(fb.remaining())
                          fb.get(audio)
                          var peak = 0f
                          for (v in audio) peak = Math.max(peak, Math.abs(v))
                          if (peak > 0.95f) for (i in audio.indices) audio[i] = audio[i] / peak * 0.95f
                          val guess = audio.size / (t / 100.0)
                          val sr = intArrayOf(16000, 24000, 32000, 40000, 44100, 48000).minByOrNull { Math.abs(it - guess) }!!
                          return Pair(audio, sr)
                      } finally {
                          r.close()
                      }
                  } finally {
                      for (x in made) x.close()
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/voicex/Hf.kt <<'EOF'
          package com.example.voicex

          import org.json.JSONObject
          import org.json.JSONArray
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          /** Minimal Hugging Face client: search repos, list ONNX files, stream downloads. */
          object Hf {
              class Repo(val id: String, val downloads: Int, val likes: Int)
              class HFile(val name: String, val size: Long)

              private const val BASE = "https://huggingface.co"

              private fun open(url: String): HttpURLConnection {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "VoiceX/1.0")
                  return c
              }

              private fun getText(url: String): String {
                  val c = open(url)
                  try {
                      if (c.responseCode !in 200..299) error("HTTP " + c.responseCode)
                      return c.inputStream.bufferedReader().readText()
                  } finally {
                      c.disconnect()
                  }
              }

              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8").replace("+", "%20")

              fun search(q: String): List<Repo> {
                  val arr = JSONArray(getText(BASE + "/api/models?search=" + enc(q) + "&sort=downloads&direction=-1&limit=30"))
                  val out = ArrayList<Repo>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      out.add(Repo(o.optString("id"), o.optInt("downloads"), o.optInt("likes")))
                  }
                  return out
              }

              fun files(id: String): List<HFile> {
                  val o = JSONObject(getText(BASE + "/api/models/" + id + "?blobs=true"))
                  val s = o.optJSONArray("siblings") ?: return emptyList()
                  val out = ArrayList<HFile>()
                  for (i in 0 until s.length()) {
                      val f = s.getJSONObject(i)
                      val n = f.optString("rfilename")
                      if (n.lowercase().endsWith(".onnx")) out.add(HFile(n, f.optLong("size", -1L)))
                  }
                  return out
              }

              fun download(id: String, file: String, dest: File, progress: (Long, Long) -> Unit) {
                  val part = File(dest.path + ".part")
                  val c = open(BASE + "/" + id + "/resolve/main/" + file.split("/").joinToString("/") { enc(it) })
                  try {
                      if (c.responseCode !in 200..299) error("HTTP " + c.responseCode + " (private or gated repo?)")
                      val total = c.contentLengthLong
                      var done = 0L
                      var last = -1
                      c.inputStream.use { ins ->
                          part.outputStream().use { out ->
                              val buf = ByteArray(65536)
                              while (true) {
                                  val n = ins.read(buf)
                                  if (n < 0) break
                                  out.write(buf, 0, n)
                                  done += n
                                  val p = if (total > 0) (done * 100 / total).toInt() else (done / 1048576).toInt()
                                  if (p != last) {
                                      last = p
                                      progress(done, total)
                                  }
                              }
                          }
                      }
                      if (dest.exists()) dest.delete()
                      if (!part.renameTo(dest)) error("Could not save file")
                  } catch (e: Throwable) {
                      part.delete()
                      throw e
                  } finally {
                      c.disconnect()
                  }
              }

              /** Searches Hugging Face for a ContentVec/HuBERT ONNX export with the requested feature size. */
              fun findContentVec(dim: Int): Pair<String, HFile>? {
                  val needle = if (dim == 768) "vec-768-layer-12" else "vec-256-layer-9"
                  for (q in listOf(needle, "contentvec onnx", "hubert rvc onnx")) {
                      val repos = try { search(q) } catch (e: Exception) { continue }
                      for (r in repos.take(8)) {
                          val fs = try { files(r.id) } catch (e: Exception) { continue }
                          for (f in fs) if (f.name.lowercase().contains(needle)) return Pair(r.id, f)
                      }
                  }
                  return null
              }
          }
          EOF
          cat > app/src/main/java/com/example/voicex/Specs.kt <<'EOF'
          package com.example.voicex

          import android.app.ActivityManager
          import android.content.Context
          import android.opengl.EGL14
          import android.opengl.EGLConfig
          import android.opengl.GLES20
          import android.os.Build
          import android.os.SystemClock

          /** Reads the device and turns it into a model recommendation. */
          object Specs {
              class Info(val soc: String, val cores: Int, val ramMb: Long, val gpu: String, val pitchX: Int, val tier: Int) {
                  val tierName: String get() = arrayOf("Light", "Balanced", "High", "Ultra")[tier]
                  val maxVoiceMb: Int get() = intArrayOf(60, 70, 120, 150)[tier]
                  val maxClipS: Int get() = intArrayOf(10, 20, 30, 60)[tier]
                  val preferDim: Int get() = if (tier >= 1) 768 else 256
                  val query: String get() = arrayOf("rvc onnx v1 40k", "rvc onnx 40k", "rvc v2 onnx 48k", "rvc v2 onnx 48k")[tier]
                  val advice: String get() = when (tier) {
                      0 -> "256-dim (RVC v1) voices up to ~60 MB, clips up to 10 s. Close other apps first."
                      1 -> "768-dim voices up to ~70 MB, 40 kHz, clips up to 20 s."
                      2 -> "768-dim (RVC v2) voices up to ~120 MB, 40–48 kHz, clips up to 30 s."
                      else -> "Best quality: 768-dim (RVC v2) voices up to ~150 MB, 48 kHz, clips up to 60 s."
                  }
              }

              @Volatile var cur: Info? = null

              fun read(ctx: Context): Info {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val ramMb = mi.totalMem / 1048576L
                  val cores = Runtime.getRuntime().availableProcessors()
                  val soc = if (Build.VERSION.SDK_INT >= 31) Build.SOC_MANUFACTURER + " " + Build.SOC_MODEL else Build.HARDWARE
                  val x = FloatArray(32000) { (0.5 * Math.sin(2.0 * Math.PI * 220.0 * it / 16000.0)).toFloat() }
                  val t0 = SystemClock.elapsedRealtime()
                  Pitch.f0(x)
                  val ms = Math.max(1L, SystemClock.elapsedRealtime() - t0)
                  val tier = when {
                      ramMb >= 10500 && cores >= 8 -> 3
                      ramMb >= 7000 -> 2
                      ramMb >= 5000 -> 1
                      else -> 0
                  }
                  val info = Info(soc, cores, ramMb, gpuName(), (2000L / ms).toInt(), tier)
                  cur = info
                  return info
              }

              private fun gpuName(): String = try {
                  val d = EGL14.eglGetDisplay(EGL14.EGL_DEFAULT_DISPLAY)
                  val v = IntArray(2)
                  EGL14.eglInitialize(d, v, 0, v, 1)
                  val attr = intArrayOf(EGL14.EGL_RENDERABLE_TYPE, EGL14.EGL_OPENGL_ES2_BIT,
                      EGL14.EGL_SURFACE_TYPE, EGL14.EGL_PBUFFER_BIT, EGL14.EGL_NONE)
                  val cfg = arrayOfNulls<EGLConfig>(1)
                  val n = IntArray(1)
                  EGL14.eglChooseConfig(d, attr, 0, cfg, 0, 1, n, 0)
                  val c = EGL14.eglCreateContext(d, cfg[0], EGL14.EGL_NO_CONTEXT,
                      intArrayOf(EGL14.EGL_CONTEXT_CLIENT_VERSION, 2, EGL14.EGL_NONE), 0)
                  val s = EGL14.eglCreatePbufferSurface(d, cfg[0],
                      intArrayOf(EGL14.EGL_WIDTH, 1, EGL14.EGL_HEIGHT, 1, EGL14.EGL_NONE), 0)
                  EGL14.eglMakeCurrent(d, s, s, c)
                  val r = GLES20.glGetString(GLES20.GL_RENDERER) ?: "unknown"
                  EGL14.eglMakeCurrent(d, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_SURFACE, EGL14.EGL_NO_CONTEXT)
                  EGL14.eglDestroySurface(d, s)
                  EGL14.eglDestroyContext(d, c)
                  r
              } catch (e: Throwable) {
                  "unknown"
              }
          }
          EOF
          cat > app/src/main/java/com/example/voicex/Audio.kt <<'EOF'
          package com.example.voicex

          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import java.io.File
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class Recorder {
              @Volatile var recording = false
              @Volatile var level = 0f
              private var thread: Thread? = null
              private val chunks = ArrayList<ShortArray>()

              fun start() {
                  val min = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  val ar = AudioRecord(MediaRecorder.AudioSource.MIC, 16000, AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT, Math.max(min, 16000))
                  chunks.clear()
                  recording = true
                  val t = Thread {
                      ar.startRecording()
                      val buf = ShortArray(1600)
                      while (recording) {
                          val n = ar.read(buf, 0, buf.size)
                          if (n > 0) {
                              chunks.add(buf.copyOf(n))
                              var p = 0
                              for (i in 0 until n) p = Math.max(p, Math.abs(buf[i].toInt()))
                              level = p / 32768f
                          }
                      }
                      ar.stop()
                      ar.release()
                  }
                  thread = t
                  t.start()
              }

              fun stop(): FloatArray {
                  recording = false
                  thread?.join()
                  level = 0f
                  var total = 0
                  for (c in chunks) total += c.size
                  val out = FloatArray(total)
                  var o = 0
                  for (c in chunks) for (s in c) out[o++] = s / 32768f
                  return out
              }
          }

          class Player {
              private var track: AudioTrack? = null

              fun play(x: FloatArray, sr: Int) {
                  stop()
                  val t = AudioTrack.Builder()
                      .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_FLOAT)
                          .setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                      .setBufferSizeInBytes(x.size * 4)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()
                  t.write(x, 0, x.size, AudioTrack.WRITE_BLOCKING)
                  t.play()
                  track = t
              }

              fun stop() {
                  track?.let {
                      try { it.stop() } catch (e: Exception) { }
                      it.release()
                  }
                  track = null
              }
          }

          fun saveWav(x: FloatArray, sr: Int, f: File) {
              val data = ByteBuffer.allocate(x.size * 2).order(ByteOrder.LITTLE_ENDIAN)
              for (v in x) data.putShort((v.coerceIn(-1f, 1f) * 32767f).toInt().toShort())
              val h = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
              h.put("RIFF".toByteArray()); h.putInt(36 + x.size * 2); h.put("WAVE".toByteArray())
              h.put("fmt ".toByteArray()); h.putInt(16); h.putShort(1); h.putShort(1)
              h.putInt(sr); h.putInt(sr * 2); h.putShort(2); h.putShort(16)
              h.put("data".toByteArray()); h.putInt(x.size * 2)
              FileOutputStream(f).use {
                  it.write(h.array())
                  it.write(data.array())
              }
          }
