                      expr = Expr.HEART
                      blush = 1f
                      lean = 0.1f * sin(u * 8f)
                      if (tickEvery(u, 2.4f, 0.35f)) fx.heart(p.cx + rf(-R, R) * 0.5f, p.top())
                  },
