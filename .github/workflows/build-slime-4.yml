                      if (tickEvery(u, 1.8f, 0.12f)) fx.spark(p.cx + rf(-1.2f, 1.2f) * R, p.cy + rf(-1.2f, 1.2f) * R)
                  },
                  Clip("sulk", 2.4f, 0.8f, CALM) { u, _ ->
                      val k = pulse(u, 0.1f, 0.9f)
                      sy *= 1f - 0.12f * k
