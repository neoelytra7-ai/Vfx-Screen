# SLIME - overlay slime hidup (soft-body) untuk Android 11, tanpa root.
# Taruh di: .github/workflows/build-slime.yml  -> Actions -> build-slime -> Run workflow
# Hasil: artifact "debug" (debug.zip) berisi app-debug.apk. Kalau gagal, lihat log step Build.
# Semua source masuk folder slime/ supaya tidak bentrok dengan app lain di repo.
# Revisi: tiap file = satu step bernama "FILE <nama>". Ganti isi step itu saja.
name: build-slime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slime.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: "FILE gradle config"
        shell: bash
        run: |
          mkdir -p slime
          cat > slime/settings.gradle <<'SLIME_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Slime'
          include ':app'
          SLIME_EOF
          mkdir -p slime
          cat > slime/build.gradle <<'SLIME_EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          SLIME_EOF
          mkdir -p slime
          cat > slime/gradle.properties <<'SLIME_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          SLIME_EOF
          mkdir -p slime/app
          cat > slime/app/build.gradle <<'SLIME_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'app.slime'
              compileSdk 34

              defaultConfig {
                  applicationId 'app.slime'
                  minSdk 30
                  targetSdk 30
                  versionCode 1
                  versionName '0.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          SLIME_EOF

      - name: "FILE manifest dan resource"
        shell: bash
        run: |
          mkdir -p slime/app/src/main
          cat > slime/app/src/main/AndroidManifest.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SlimeService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/slime_service" />
                  </service>
              </application>
          </manifest>
          SLIME_EOF
          mkdir -p slime/app/src/main/res/xml
          cat > slime/app/src/main/res/xml/slime_service.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled|typeWindowContentChanged|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="30"
              android:description="@string/svc_desc"
              android:settingsActivity="app.slime.MainActivity" />
          SLIME_EOF
          mkdir -p slime/app/src/main/res/values
          cat > slime/app/src/main/res/values/strings.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Slime</string>
              <string name="svc_desc">Overlay slime hidup. Hanya membaca posisi dan ukuran elemen layar (bounds), tidak membaca isi teks.</string>
          </resources>
          SLIME_EOF

      - name: "FILE Tuning.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/Tuning.kt <<'SLIME_EOF'
          package app.slime

          import android.content.SharedPreferences

          object Tuning {
              class P(
                  val key: String,
                  val def: Float,
                  val min: Float,
                  val max: Float,
                  val label: String,
                  val steps: List<String>? = null
              )

              val ALL = listOf(
                  P("eyeStyle", 1f, 0f, 2f, "Gaya mata", listOf("Bulat putih", "Lonjong hitam", "Feline")),
                  P("iris", 48f, 0f, 360f, "Warna iris (feline)"),
                  P("fx", 1f, 0f, 2f, "Jumlah partikel"),
                  P("silly", 1f, 0f, 2f, "Tingkat absurd"),
                  P("radius", 34f, 18f, 70f, "Ukuran (dp)"),
                  P("shape", 420f, 80f, 900f, "Kekakuan bentuk"),
                  P("edge", 500f, 100f, 1200f, "Kekakuan tepi"),
                  P("damp", 7f, 2f, 30f, "Redaman jelly"),
                  P("pressure", 60f, 0f, 160f, "Tekanan volume"),
                  P("gravity", 900f, 400f, 2000f, "Gravitasi (dp/s2)"),
                  P("jump", 1f, 0.5f, 1.6f, "Kekuatan lompat"),
                  P("wander", 3f, 0.8f, 10f, "Jeda antar aksi (detik)"),
                  P("floor", 0f, 0f, 120f, "Margin lantai (dp)"),
                  P("hue", 130f, 0f, 360f, "Warna badan (hue)"),
                  P("eye", 1f, 0.6f, 1.6f, "Ukuran mata")
              )

              var eyeStyle = 1f
              var iris = 48f
              var fx = 1f
              var silly = 1f
              var radius = 34f
              var shape = 420f
              var edge = 500f
              var damp = 7f
              var pressure = 60f
              var gravity = 900f
              var jump = 1f
              var wander = 3f
              var floor = 0f
              var hue = 130f
              var eye = 1f

              val eyeStyleI: Int get() = (eyeStyle + 0.5f).toInt().coerceIn(0, 2)

              fun load(sp: SharedPreferences) {
                  fun g(k: String): Float {
                      val p = ALL.first { it.key == k }
                      return sp.getFloat(k, p.def)
                  }
                  eyeStyle = g("eyeStyle")
                  iris = g("iris")
                  fx = g("fx")
                  silly = g("silly")
                  radius = g("radius")
                  shape = g("shape")
                  edge = g("edge")
                  damp = g("damp")
                  pressure = g("pressure")
                  gravity = g("gravity")
                  jump = g("jump")
                  wander = g("wander")
                  floor = g("floor")
                  hue = g("hue")
                  eye = g("eye")
              }
          }
          SLIME_EOF

      - name: "FILE SlimePhysics.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimePhysics.kt <<'SLIME_EOF'
          package app.slime

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          class Plat(@JvmField var l: Float, @JvmField var t: Float, @JvmField var r: Float, @JvmField var b: Float)

          /** Soft-body slime: N titik di keliling, pegas tepi + shape matching + tekanan volume. */
          class SlimePhysics {
              companion object {
                  const val N = 18
              }

              val px = FloatArray(N)
              val py = FloatArray(N)
              val vx = FloatArray(N)
              val vy = FloatArray(N)
              private val oy = FloatArray(N)
              private val ax = FloatArray(N)
              private val ay = FloatArray(N)
              private val rx = FloatArray(N) { cos(2.0 * PI * it / N).toFloat() }
              private val ry = FloatArray(N) { sin(2.0 * PI * it / N).toFloat() }

              var W = 0f
              var H = 0f
              var density = 1f
              var radius = 60f
              var cx = 0f
              var cy = 0f
              var cvx = 0f
              var cvy = 0f
              var scaleX = 1f
              var scaleY = 1f
              var lean = 0f
              var pushX = 0f
              var pushY = 0f
              var floorY = 0f
              var contacts = 0
              var onPlat = false
              var impact = 0f
              var inited = false
              var platforms: List<Plat> = emptyList()
              private var stand: Plat? = null

              val grounded: Boolean get() = contacts >= 2

              fun reset(x: Float, y: Float) {
                  radius = Tuning.radius * density
                  for (i in 0 until N) {
                      px[i] = x + rx[i] * radius
                      py[i] = y + ry[i] * radius
                      vx[i] = 0f
                      vy[i] = 0f
                      oy[i] = py[i]
                  }
                  cx = x
                  cy = y
                  inited = true
              }

              fun launch(sx: Float, sy: Float) {
                  for (i in 0 until N) {
                      vx[i] = sx
                      vy[i] = sy * (1f - 0.12f * ry[i])
                  }
                  contacts = 0
                  onPlat = false
                  stand = null
              }

              fun kick(dvx: Float, dvy: Float) {
                  for (i in 0 until N) {
                      vx[i] += dvx
                      vy[i] += dvy
                  }
              }

              fun bottom(): Float {
                  var m = py[0]
                  for (i in 1 until N) if (py[i] > m) m = py[i]
                  return m
              }

              fun top(): Float {
                  var m = py[0]
                  for (i in 1 until N) if (py[i] < m) m = py[i]
                  return m
              }

              private fun shiftPoints(dx: Float, dy: Float, soft: Float) {
                  for (i in 0 until N) {
                      val up = ((cy - py[i]) / radius).coerceIn(0f, 1f)
                      val f = 1f - soft * up
                      px[i] += dx * f
                      py[i] += dy * f
                      oy[i] += dy * f
                  }
              }

              /** Scan baru dari aksesibilitas: lacak platform yang sedang diinjak supaya ikut bergeser. */
              fun updatePlatforms(n: List<Plat>) {
                  val s = stand
                  if (s != null && onPlat) {
                      var best: Plat? = null
                      var bd = 1e9f
                      for (p in n) {
                          if (abs(p.l - s.l) > 6f * density) continue
                          if (abs(p.r - s.r) > 6f * density) continue
                          if (abs((p.b - p.t) - (s.b - s.t)) > 8f * density) continue
                          val dd = abs(p.t - s.t)
                          if (dd < bd) {
                              bd = dd
                              best = p
                          }
                      }
                      val b = best
                      if (b != null && bd > 1f && bd < 700f * density) {
                          shiftPoints(b.l - s.l, b.t - s.t, 0.25f)
                      }
                      stand = b
                  }
                  platforms = n
              }

              /** Event scroll dengan delta: geser platform di area yang di-scroll, slime ikut kalau berdiri di situ. */
              fun shiftRegion(l: Float, t: Float, r: Float, b: Float, dx: Float, dy: Float) {
                  for (pl in platforms) {
                      val mx = (pl.l + pl.r) * 0.5f
                      val my = (pl.t + pl.b) * 0.5f
                      if (mx >= l && mx <= r && my >= t && my <= b) {
                          pl.l += dx
                          pl.r += dx
                          pl.t += dy
                          pl.b += dy
                      }
                  }
                  if (onPlat && cx >= l && cx <= r && cy >= t && cy <= b) {
                      shiftPoints(dx, dy, 0.4f)
                  }
              }

              fun step(frameDt: Float) {
                  if (!inited) return
                  val dt = frameDt * 0.5f
                  sub(dt)
                  sub(dt)
              }

              private fun sub(dt: Float) {
                  val d = density
                  radius += (Tuning.radius * d - radius) * min(1f, dt * 6f)
                  val R = radius
                  floorY = H - Tuning.floor * d
                  val g = Tuning.gravity * d

                  var sx = 0f
                  var sy = 0f
                  var svx = 0f
                  var svy = 0f
                  for (i in 0 until N) {
                      sx += px[i]
                      sy += py[i]
                      svx += vx[i]
                      svy += vy[i]
                  }
                  cx = sx / N
                  cy = sy / N
                  cvx = svx / N
                  cvy = svy / N

                  var a2 = 0f
                  for (i in 0 until N) {
                      val j = (i + 1) % N
                      a2 += px[i] * py[j] - px[j] * py[i]
                  }
                  val twoPi = (2.0 * PI).toFloat()
                  val restA = 0.5f * N * R * R * sin(twoPi / N)
                  val rel = ((restA - abs(a2) * 0.5f) / restA).coerceIn(-0.6f, 1.2f)
                  val kS = Tuning.shape
                  val kE = Tuning.edge
                  val c = Tuning.damp
                  val pf = Tuning.pressure * rel * R
                  val L = 2f * R * sin(PI.toFloat() / N)

                  for (i in 0 until N) {
                      ax[i] = 0f
                      ay[i] = 0f
                  }
                  for (i in 0 until N) {
                      val j = (i + 1) % N
                      val dx = px[j] - px[i]
                      val dy = py[j] - py[i]
                      val dl = sqrt(dx * dx + dy * dy) + 0.001f
                      val f = (dl - L) * kE / dl
                      ax[i] += f * dx
                      ay[i] += f * dy
                      ax[j] -= f * dx
                      ay[j] -= f * dy
                  }
                  for (i in 0 until N) {
                      val tx = cx + (rx[i] * scaleX - lean * ry[i]) * R
                      val ty = cy + ry[i] * R * scaleY
                      val ex = px[i] - cx
                      val ey = py[i] - cy
                      val el = sqrt(ex * ex + ey * ey) + 0.001f
                      ax[i] += (tx - px[i]) * kS + ex / el * pf - (vx[i] - cvx) * c + pushX
                      ay[i] += (ty - py[i]) * kS + ey / el * pf - (vy[i] - cvy) * c + g + pushY
                  }

                  val vmax = 4200f * d
                  val tol = 22f * d
                  val depth = 60f * d
                  val fr = min(1f, 16f * dt)
                  contacts = 0
                  onPlat = false
                  var imp = 0f
                  var lastStand: Plat? = null

                  for (i in 0 until N) {
                      vx[i] = (vx[i] + ax[i] * dt).coerceIn(-vmax, vmax)
                      vy[i] = (vy[i] + ay[i] * dt).coerceIn(-vmax, vmax)
                      oy[i] = py[i]
                      px[i] += vx[i] * dt
                      py[i] += vy[i] * dt

                      if (px[i] < 0f) {
                          px[i] = 0f
                          if (vx[i] < 0f) vx[i] *= -0.2f
                      } else if (px[i] > W) {
                          px[i] = W
                          if (vx[i] > 0f) vx[i] *= -0.2f
                      }

                      var top = Float.MAX_VALUE
                      var chosen: Plat? = null
                      if (py[i] > floorY) top = floorY
                      if (vy[i] > -60f * d) {
                          val x = px[i]
                          val y = py[i]
                          for (pl in platforms) {
                              if (x < pl.l || x > pl.r || pl.t >= top) continue
                              if (y >= pl.t && (y <= pl.t + depth || oy[i] <= pl.t + tol)) {
                                  top = pl.t
                                  chosen = pl
                              }
                          }
                      }
                      if (top != Float.MAX_VALUE) {
                          val v = vy[i]
                          if (v > 0f) {
                              if (v > imp) imp = v
                              vy[i] = if (v > 450f * d) -v * 0.12f else 0f
                          }
                          py[i] = top
                          vx[i] *= (1f - fr)
                          contacts++
                          if (chosen != null) {
                              onPlat = true
                              lastStand = chosen
                          }
                      }
                  }
                  if (imp > 650f * d) {
                      for (k in 0 until N) if (vy[k] > 0f) vy[k] *= 0.55f
                  }
                  if (imp > impact) impact = imp
                  if (lastStand != null) stand = lastStand
              }
          }
          SLIME_EOF

      - name: "FILE SlimeFx.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeFx.kt <<'SLIME_EOF'
          package app.slime

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Typeface
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.random.Random

          /** Partikel slimy: tetesan, genangan, gelembung, kilau, hati, huruf z. */
          class SlimeFx {
              companion object {
                  const val M = 220
                  const val DROP = 1
                  const val PUDDLE = 2
                  const val BUBBLE = 3
                  const val SPARK = 4
                  const val HEART = 5
                  const val ZZ = 6
              }

              var density = 1f

              private val kind = IntArray(M)
              private val x = FloatArray(M)
              private val y = FloatArray(M)
              private val vx = FloatArray(M)
              private val vy = FloatArray(M)
              private val life = FloatArray(M)
              private val maxLife = FloatArray(M)
              private val size = FloatArray(M)
              private var cursor = 0
              private var time = 0f

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply { typeface = Typeface.DEFAULT_BOLD }
              private val path = Path()
              private val rect = RectF()
              private val hsv = FloatArray(3)

              private fun rf(a: Float, b: Float): Float = a + Random.nextFloat() * (b - a)

              private fun on(): Boolean = Tuning.fx >= 0.05f

              private fun cnt(n: Int): Int = if (!on()) 0 else max(1, (n * Tuning.fx).roundToInt())

              private fun col(a: Int, s: Float, v: Float): Int {
                  hsv[0] = Tuning.hue
                  hsv[1] = s
                  hsv[2] = v
                  return Color.HSVToColor(a.coerceIn(0, 255), hsv)
              }

              private fun slot(): Int {
                  for (k in 0 until M) {
                      cursor = (cursor + 1) % M
                      if (kind[cursor] == 0) return cursor
                  }
                  cursor = (cursor + 1) % M
                  return cursor
              }

              private fun add(k: Int, px: Float, py: Float, pvx: Float, pvy: Float, sz: Float, lf: Float) {
                  val i = slot()
                  kind[i] = k
                  x[i] = px
                  y[i] = py
                  vx[i] = pvx
                  vy[i] = pvy
                  size[i] = sz
                  life[i] = lf
                  maxLife[i] = lf
              }

              /** Kipas tetesan. ang: 0=kanan, -90=atas, 90=bawah (derajat). */
              fun fan(px: Float, py: Float, n: Int, speed: Float, ang: Float, spread: Float, sz: Float) {
                  for (k in 0 until cnt(n)) {
                      val a = (ang + rf(-spread, spread)) * (PI.toFloat() / 180f)
                      val sp = speed * rf(0.4f, 1f)
                      add(DROP, px + rf(-3f, 3f), py, cos(a) * sp, sin(a) * sp, sz * rf(0.5f, 1.2f), rf(1.4f, 2.2f))
                  }
              }

              fun ring(px: Float, py: Float, n: Int, speed: Float, sz: Float) {
                  fan(px, py, n, speed, 0f, 180f, sz)
              }

              fun drop(px: Float, py: Float, pvx: Float, pvy: Float, sz: Float) {
                  if (on()) add(DROP, px, py, pvx, pvy, sz, rf(1.4f, 2.2f))
              }

              fun splat(px: Float, py: Float, w: Float) {
                  if (on()) add(PUDDLE, px, py, 0f, 0f, w, rf(1.1f, 1.9f))
              }

              fun bubble(px: Float, py: Float) {
                  if (on()) add(BUBBLE, px, py, rf(-20f, 20f) * density, -rf(60f, 110f) * density, rf(5f, 10f) * density, rf(1.6f, 2.4f))
              }

              fun spark(px: Float, py: Float) {
                  if (on()) add(SPARK, px, py, rf(-60f, 60f) * density, -rf(30f, 110f) * density, rf(3f, 6f) * density, rf(0.5f, 0.9f))
              }

              fun heart(px: Float, py: Float) {
                  if (on()) add(HEART, px, py, rf(-25f, 25f) * density, -rf(50f, 90f) * density, rf(5f, 8f) * density, rf(1.2f, 1.8f))
              }

              fun z(px: Float, py: Float) {
                  if (on()) add(ZZ, px, py, rf(8f, 25f) * density, -rf(25f, 40f) * density, rf(8f, 12f) * density, 2f)
              }

              private fun surface(px: Float, oy: Float, ny: Float, plats: List<Plat>, floorY: Float): Float {
                  var best = Float.MAX_VALUE
                  if (ny >= floorY) best = floorY
                  for (pl in plats) {
                      if (px < pl.l || px > pl.r || pl.t >= best) continue
                      if (oy <= pl.t + 2f && ny >= pl.t) best = pl.t
                  }
                  return best
              }

              fun update(dt: Float, g: Float, plats: List<Plat>, floorY: Float) {
                  time += dt
                  for (i in 0 until M) {
                      if (kind[i] == 0) continue
                      life[i] -= dt
                      if (life[i] <= 0f) {
                          kind[i] = 0
                          continue
                      }
                      when (kind[i]) {
                          DROP -> {
                              vy[i] += g * dt
                              vx[i] *= (1f - 0.5f * dt)
                              val oy = y[i]
                              x[i] += vx[i] * dt
                              y[i] += vy[i] * dt
                              if (vy[i] > 0f) {
                                  val top = surface(x[i], oy, y[i], plats, floorY)
                                  if (top != Float.MAX_VALUE) {
                                      val sz = size[i]
                                      kind[i] = 0
                                      if (Random.nextFloat() < 0.7f) add(PUDDLE, x[i], top, 0f, 0f, sz * rf(1.5f, 2.6f), rf(0.9f, 1.6f))
                                  }
                              }
                          }
                          BUBBLE, HEART, ZZ -> {
                              x[i] += (vx[i] + sin(time * 5f + i) * 14f * density) * dt
                              y[i] += vy[i] * dt
                          }
                          SPARK -> {
                              x[i] += vx[i] * dt
                              y[i] += vy[i] * dt
                              vy[i] += g * 0.1f * dt
                          }
                          else -> {}
                      }
                  }
              }

              fun shiftRegion(l: Float, t: Float, r: Float, b: Float, dx: Float, dy: Float) {
                  for (i in 0 until M) {
                      if (kind[i] == PUDDLE && x[i] >= l && x[i] <= r && y[i] >= t && y[i] <= b) {
                          x[i] += dx
                          y[i] += dy
                      }
                  }
              }

              /** back=true: genangan di belakang badan; false: sisanya di depan. */
              fun draw(c: Canvas, back: Boolean) {
                  for (i in 0 until M) {
                      val k = kind[i]
                      if (k == 0) continue
                      if ((k == PUDDLE) != back) continue
                      val f = life[i] / maxLife[i]
                      when (k) {
                          PUDDLE -> {
                              val s = size[i] * (0.65f + 0.35f * f)
                              fill.color = col((min(1f, f * 1.6f) * 150f).toInt(), 0.65f, 1f)
                              rect.set(x[i] - s, y[i] - s * 0.34f, x[i] + s, y[i] + s * 0.06f)
                              c.drawOval(rect, fill)
                          }
                          DROP -> {
                              val cl = col((min(1f, life[i] / 0.35f) * 235f).toInt(), 0.6f, 1f)
                              fill.color = cl
                              line.color = cl
                              line.strokeWidth = size[i] * 1.5f
                              c.drawLine(x[i] - vx[i] * 0.022f, y[i] - vy[i] * 0.022f, x[i], y[i], line)
                              c.drawCircle(x[i], y[i], size[i], fill)
                          }
                          BUBBLE -> {
                              val a = (min(1f, f * 3f) * 170f).toInt()
                              val pop = life[i] < 0.14f
                              val r = size[i] * (if (pop) 1f + (0.14f - life[i]) * 8f else 1f)
                              line.strokeWidth = 1.6f * density
                              line.color = Color.argb(if (pop) a / 2 else a, 255, 255, 255)
                              c.drawCircle(x[i], y[i], r, line)
                              fill.color = Color.argb(a / 2, 255, 255, 255)
                              c.drawCircle(x[i] - r * 0.35f, y[i] - r * 0.35f, r * 0.18f, fill)
                          }
                          SPARK -> {
                              val s = size[i] * (0.5f + 0.5f * min(1f, f * 2f))
                              val a = (min(1f, f * 3f) * 255f).toInt()
                              fill.color = Color.argb(a, 255, 255, 235)
                              val px = x[i]
                              val py = y[i]
                              path.reset()
                              path.moveTo(px, py - s)
                              path.lineTo(px + s * 0.28f, py - s * 0.28f)
                              path.lineTo(px + s, py)
                              path.lineTo(px + s * 0.28f, py + s * 0.28f)
                              path.lineTo(px, py + s)
                              path.lineTo(px - s * 0.28f, py + s * 0.28f)
                              path.lineTo(px - s, py)
                              path.lineTo(px - s * 0.28f, py - s * 0.28f)
                              path.close()
                              c.drawPath(path, fill)
                          }
                          HEART -> {
                              val s = size[i]
                              val px = x[i]
                              val py = y[i]
                              fill.color = Color.argb((min(1f, f * 2.5f) * 255f).toInt(), 255, 92, 147)
                              path.reset()
                              path.moveTo(px, py + s * 0.9f)
                              path.cubicTo(px - s * 1.6f, py - s * 0.1f, px - s * 0.9f, py - s * 1.4f, px, py - s * 0.5f)
                              path.cubicTo(px + s * 0.9f, py - s * 1.4f, px + s * 1.6f, py - s * 0.1f, px, py + s * 0.9f)
                              path.close()
                              c.drawPath(path, fill)
                          }
                          ZZ -> {
                              text.textSize = size[i] * 2f
                              text.color = Color.argb((min(1f, f * 2.5f) * 255f).toInt(), 235, 245, 255)
                              c.drawText("z", x[i], y[i], text)
                          }
                          else -> {}
                      }
                  }
              }
          }
          SLIME_EOF

