                          fx.fan(p.cx + R, p.cy, 3, 500f * d, -10f, 30f, 2.6f * d)
                      }
                  },
                  Clip("tilt", 1.8f, 1f, CALM) { u, _ ->
                      val k = ease(min(1f, u / 0.25f)) * ease(min(1f, (1f - u) / 0.25f))
