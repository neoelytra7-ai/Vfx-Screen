          package app.slime

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.random.Random

          enum class Expr { NORMAL, HAPPY, SLEEP, ANGRY, DIZZY, CROSS, HEART }
          enum class Mouth { SMILE, O, FLAT, YAWN, TONGUE, WAVY, GRIN, NONE }

          /** Satu klip animasi: dur detik, w bobot, kind jenis, tick(u 0..1, dt) memodifikasi pose. */
          class Clip(
              val name: String,
              val dur: Float,
              val w: Float,
              val kind: Int,
              val tick: (Float, Float) -> Unit
          )

          /** Otak slime: lompat ke elemen UI, puluhan klip animasi absurd, mood/energi, kaget saat scroll. */
          class SlimeBrain(private val p: SlimePhysics, private val fx: SlimeFx) {
              companion object {
                  const val CALM = 0
                  const val ACTIVE = 1
                  const val SILLY = 2
                  const val SLEEPY = 3
              }

              enum class S { IDLE, WIND, AIR, LAND, CLIP }

              var state = S.IDLE

              // wajah (dibaca view)
              var expr = Expr.NORMAL
              var mouth = Mouth.SMILE
              var blink = 0f
              var wide = 0f
              var sleepy = 0f
              var squint = 0f
              var blush = 0f
              var glow = 0f
              var lookX = 0f
              var lookY = 0f
              var clock = 0f

              // pose per frame
              private var sx = 1f
              private var sy = 1f
              private var lean = 0f
              private var pushX = 0f
              private var pushY = 0f
              private var sleepT = 0f
              private var squintT = 0f

              private var t = 0f
              private var idleLeft = 1.5f
              private var windDur = 0.3f
              private var wiggle = false
              private var planned = false
              private var jvx = 0f
              private var jvy = 0f
              private var jtx = 0f
              private var jty = 0f
              private var jT = 0.5f
              private var air = 0f
              private var loose = 0f
              private var blinkIn = 2f
              private var lookIn = 1f
              private var tlx = 0f
              private var tly = 0f
              private var energy = 0.7f
              private var scrollBurst = 0f
              private var highTime = 0f
              private var trailT = 0f
              private var cur: Clip? = null
              private var lastClip: Clip? = null
              private var cA = 0f
              private var cB = -1
              private var cDir = 1f

              private val d: Float get() = p.density
              private val R: Float get() = p.radius

              private fun rf(a: Float, b: Float): Float = a + Random.nextFloat() * (b - a)
              private fun hump(u: Float): Float = sin(u * PI.toFloat())
              private fun ease(u: Float): Float {
                  val k = u.coerceIn(0f, 1f)
                  return k * k * (3f - 2f * k)
              }
              private fun pulse(u: Float, a: Float, b: Float): Float =
                  if (u < a || u > b) 0f else sin((u - a) / (b - a) * PI.toFloat())

              /** true tiap kali u melewati kelipatan period (detik) di klip berdurasi dur. */
              private fun tickEvery(u: Float, dur: Float, period: Float): Boolean {
                  val k = (u * dur / period).toInt()
                  if (k > cB) {
                      cB = k
                      return true
                  }
                  return false
              }

              private fun go(s: S) {
                  state = s
                  t = 0f
              }

              val clipCount: Int get() = clips.size

              private val clips: List<Clip> = listOf(
                  Clip("yawn", 2.0f, 1f, SLEEPY) { u, _ ->
                      val k = pulse(u, 0.1f, 0.9f)
                      sy *= 1f + 0.2f * k
                      sx *= 1f - 0.1f * k
                      expr = Expr.SLEEP
                      mouth = if (k > 0.2f) Mouth.YAWN else Mouth.SMILE
                      sleepT = 0.6f
                  },
                  Clip("jiggle", 1.2f, 1f, CALM) { u, _ ->
                      lean = sin(u * 30f) * 0.3f * (1f - u)
                      sx *= 1f + 0.08f * sin(u * 30f + 1f)
                      expr = Expr.HAPPY
                      mouth = Mouth.GRIN
                  },
                  Clip("boing", 1.5f, 1f, ACTIVE) { u, _ ->
                      if (tickEvery(u, 1.5f, 0.5f) && p.grounded) {
                          p.kick(0f, -560f * d)
                          fx.fan(p.cx, p.bottom(), 4, 250f * d, -90f, 80f, 2.4f * d)
                      }
                      expr = Expr.HAPPY
                      mouth = Mouth.GRIN
                  },
                  Clip("stretchUp", 1.5f, 1f, CALM) { u, _ ->
                      val k = hump(u)
