                  },
                  Clip("bubbles", 2.4f, 1f, CALM) { u, _ ->
                      if (tickEvery(u, 2.4f, 0.4f)) fx.bubble(p.cx + rf(-0.2f, 0.2f) * R, p.top())
                      mouth = Mouth.O
                      sy *= 1f + 0.04f * sin(u * 30f)
                  },
                  Clip("peek", 2.2f, 1f, CALM) { u, _ ->
                      val k = pulse(u, 0.1f, 0.9f)
                      lean = 0.32f * cDir * k
                      tlx = cDir
                      tly = 0.8f
                      lookIn = 1f
                      mouth = Mouth.O
                  },
                  Clip("sideStretch", 1.6f, 1f, CALM) { u, _ ->
                      val k = hump(u)
                      sx *= 1f + 0.4f * k
                      sy *= 1f - 0.2f * k
                      expr = Expr.HAPPY
                      mouth = Mouth.GRIN
                  },
                  Clip("tantrum", 1.8f, 0.7f, ACTIVE) { u, _ ->
                      expr = Expr.ANGRY
                      mouth = Mouth.FLAT
                      lean = 0.12f * sin(u * 26f)
                      if (tickEvery(u, 1.8f, 0.3f) && p.grounded) {
