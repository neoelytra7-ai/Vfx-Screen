                  },
                  Clip("wobble", 1.4f, 1f, ACTIVE) { u, _ ->
                      val w = sin(u * 28f) * (1f - u)
                      sy *= 1f + 0.25f * w
                      sx *= 1f - 0.2f * w
                      expr = Expr.HAPPY
                  },
                  Clip("stare", 2.0f, 0.7f, SILLY) { _, _ ->
                      tlx = 0f
                      tly = 0f
                      lookIn = 1f
                      blinkIn = 2f
                      wide = max(wide, 0.35f)
                      mouth = Mouth.FLAT
                  }
              )

              private fun clipByName(n: String): Clip = clips.first { it.name == n }

              private fun weight(c: Clip): Float {
                  if (c === lastClip) return 0f
                  val e = energy
                  return c.w * when (c.kind) {
                      CALM -> 1.3f - 0.5f * e
                      ACTIVE -> 0.3f + 1.4f * e
                      SILLY -> (0.6f + 0.6f * e) * Tuning.silly
                      else -> 1.45f - 1.4f * e
                  }
              }

              private fun startClip(c: Clip) {
                  cur = c
                  lastClip = c
                  cA = 0f
                  cB = -1
                  cDir = if (Random.nextBoolean()) 1f else -1f
                  if (c.kind == ACTIVE) energy = min(1f, energy + 0.07f)
                  if (c.kind == SLEEPY) energy = max(0f, energy - 0.2f)
                  go(S.CLIP)
              }

              private fun playRandomClip() {
                  var total = 0f
                  for (c in clips) total += weight(c)
                  if (total <= 0f) return
                  var r = Random.nextFloat() * total
                  var pick = clips[0]
                  for (c in clips) {
                      r -= weight(c)
                      if (r <= 0f) {
                          pick = c
                          break
                      }
                  }
                  startClip(pick)
              }

              fun onScroll() {
                  wide = 1f
                  scrollBurst += 1f
                  if (Random.nextFloat() < 0.08f) fx.fan(p.cx, p.top(), 3, 300f * d, -90f, 60f, 2.5f * d)
                  if (state == S.IDLE && p.grounded && Random.nextFloat() < 0.25f) {
                      planned = false
                      wiggle = false
                      jvx = 0f
                      jvy = -rf(480f, 640f) * d
                      windDur = 0.1f
                      go(S.WIND)
                  }
              }

              fun update(dt: Float) {
                  clock += dt
                  t += dt
                  energy += (0.6f - energy) * dt * 0.03f
                  scrollBurst = max(0f, scrollBurst - dt * 4f)
                  if (p.cy < p.H * 0.3f) highTime += dt else highTime = max(0f, highTime - dt * 2f)
                  wide = max(0f, wide - dt * 1.5f)
                  blink = max(0f, blink - dt * 7f)
                  blinkIn -= dt
                  if (blinkIn <= 0f) {
                      blink = 1f
                      blinkIn = rf(1.8f, 5f)
                  }
                  lookIn -= dt
                  if (lookIn <= 0f) {
                      tlx = rf(-1f, 1f)
                      tly = rf(-0.5f, 0.5f)
                      lookIn = rf(1.2f, 3.5f)
                  }

                  val breath = 1f + 0.025f * (1f - 0.5f * sleepy) * sin(clock * (2.4f - 1.2f * sleepy))
                  sx = 1f / breath
                  sy = breath
                  lean = 0f
                  pushX = 0f
                  pushY = 0f
                  expr = Expr.NORMAL
                  mouth = Mouth.SMILE
                  blush = 0f
                  glow = 0f
                  sleepT = 0f
                  squintT = 0f

                  when (state) {
                      S.IDLE -> {
                          if (p.grounded) loose = 0f else loose += dt
                          if (loose > 0.25f) {
                              air = 0f
                              go(S.AIR)
                          } else {
                              idleLeft -= dt
                              if (idleLeft <= 0f && p.grounded) decide()
                          }
                      }
                      S.WIND -> {
                          val k = min(1f, t / windDur)
                          sy *= 1f - 0.34f * k
                          sx *= 1f + 0.30f * k
                          squintT = k
                          mouth = Mouth.GRIN
                          if (wiggle) lean = sin(t * 38f) * 0.13f * k
                          if (t >= windDur) {
                              if (planned) aim()
                              launchFx()
                              p.launch(jvx, jvy)
                              air = 0f
                              go(S.AIR)
                          }
                      }
                      S.AIR -> {
                          air += dt
                          expr = if (p.cvy < 0f) Expr.HAPPY else Expr.NORMAL
                          mouth = if (p.cvy < 0f) Mouth.GRIN else Mouth.O
                          trailT -= dt
                          if (trailT <= 0f && abs(p.cvy) + abs(p.cvx) > 350f * d) {
                              trailT = 0.06f
                              fx.drop(p.cx + rf(-0.6f, 0.6f) * R, p.cy + R * 0.7f, -p.cvx * 0.08f, rf(-40f, 20f) * d, rf(1.4f, 2.6f) * d)
                          }
                          val fxs = 1f + 0.18f * min(1f, abs(p.cvx) / (900f * d))
                          val fys = 1f + 0.32f * min(1f, abs(p.cvy) / (1000f * d))
                          val n = sqrt(fxs * fys)
                          sx *= fxs / n
                          sy *= fys / n
                          if (air > 0.12f && p.grounded) {
                              val k = min(1f, p.impact / (1500f * d))
                              landFx(k)
                              wide = max(wide, k * 0.9f)
                              p.impact = 0f
                              go(S.LAND)
                          } else if (air > 6f) {
                              go(S.IDLE)
                          }
                      }
                      S.LAND -> {
                          if (t < 0.12f) expr = Expr.SLEEP
                          mouth = if (t < 0.25f) Mouth.O else Mouth.SMILE
                          if (t > 0.35f) {
                              idleLeft = rf(0.2f, 1.0f)
                              loose = 0f
                              go(S.IDLE)
                          }
                      }
                      S.CLIP -> {
                          val c = cur
                          if (c == null) {
                              go(S.IDLE)
                          } else {
                              val u = min(1f, t / c.dur)
                              c.tick(u, dt)
                              if (p.grounded) loose = 0f else loose += dt
                              if (loose > 0.3f) {
                                  cur = null
                                  air = 0f
                                  go(S.AIR)
                              } else if (t >= c.dur) {
                                  cur = null
                                  idleLeft = rf(0.2f, 1.0f)
                                  go(S.IDLE)
                              }
                          }
                      }
                  }

                  sleepy += (sleepT - sleepy) * min(1f, dt * 3f)
                  squint += (squintT - squint) * min(1f, dt * 10f)
                  lookX += (tlx - lookX) * min(1f, dt * 4f)
                  lookY += (tly - lookY) * min(1f, dt * 4f)
                  p.scaleX = sx
                  p.scaleY = sy
                  p.lean = lean
                  p.pushX = pushX
                  p.pushY = pushY
              }

              private fun launchFx() {
                  val by = p.bottom()
                  val x = p.cx
                  fx.fan(x - R * 0.5f, by, 5, 380f * d, 200f, 25f, 3f * d)
                  fx.fan(x + R * 0.5f, by, 5, 380f * d, -20f, 25f, 3f * d)
                  fx.splat(x, by, R * 0.55f)
              }

              private fun landFx(k: Float) {
                  val by = p.bottom()
                  val x = p.cx
                  val n = 5 + (18f * k).toInt()
                  val sp = (240f + 520f * k) * d
                  fx.fan(x - R * 0.7f, by, n / 2 + 1, sp, 200f, 28f, 3f * d)
                  fx.fan(x + R * 0.7f, by, n / 2 + 1, sp, -20f, 28f, 3f * d)
                  fx.fan(x, by, n / 3 + 1, sp * 0.7f, -90f, 55f, 2.6f * d)
                  val pn = 2 + (3f * k).toInt()
                  for (i in 0 until pn) {
                      fx.splat(x + rf(-1f, 1f) * R * (0.6f + k), by, R * rf(0.25f, 0.5f) * (0.7f + k))
                  }
              }

              private fun decide() {
                  idleLeft = Tuning.wander * rf(0.4f, 1.2f)
                  if (scrollBurst > 40f) {
                      scrollBurst = 0f
                      startClip(clipByName("dizzy"))
                      return
                  }
                  val jumpP = 0.15f + 0.4f * energy
                  val r = Random.nextFloat()
                  if (r < jumpP && planJump()) {
                      wiggle = Random.nextFloat() < 0.4f
                      if (wiggle) windDur = 0.55f
                      energy = max(0f, energy - 0.05f)
                      go(S.WIND)
                      return
                  }
                  if (r < jumpP + 0.07f) {
                      planned = false
                      wiggle = false
                      jvx = (if (Random.nextBoolean()) 1f else -1f) * rf(80f, 260f) * d
                      jvy = -rf(480f, 720f) * d
                      windDur = 0.18f
                      go(S.WIND)
                      return
                  }
                  playRandomClip()
              }

              private fun planJump(): Boolean {
                  val g = Tuning.gravity * d
                  val maxRise = p.H * 0.42f * Tuning.jump
                  var best: Plat? = null
                  var bestScore = -99f
                  for (pl in p.platforms) {
                      val w = pl.r - pl.l
                      if (w < R * 1.1f) continue
                      if (pl.t < p.H * 0.1f || pl.t > p.floorY - R * 0.4f) continue
                      val rise = p.cy - (pl.t - R * 0.85f)
                      if (rise > maxRise) continue
                      if (abs(pl.t - (p.cy + R * 0.9f)) < R * 0.6f && p.cx >= pl.l && p.cx <= pl.r) continue
                      val dx = (pl.l + pl.r) * 0.5f - p.cx
                      if (abs(dx) > p.W * 0.75f) continue
                      val rn = (rise / maxRise).coerceIn(-0.3f, 1f)
                      var score = Random.nextFloat() + 0.2f * rn + 0.3f * (1f - abs(dx) / (p.W * 0.75f))
                      if (pl.t < p.H * 0.3f) score -= 0.5f
                      if (highTime > 3f) score -= 1.2f * rn.coerceAtLeast(0f)
                      if (score > bestScore) {
                          bestScore = score
                          best = pl
                      }
                  }
                  val pl = best ?: return false
                  val w = pl.r - pl.l
                  val m = min(R * 0.6f, w * 0.3f)
                  val tx = rf(pl.l + m, pl.r - m).coerceIn(R * 0.8f, p.W - R * 0.8f)
                  val tcy = pl.t - R * 0.85f
                  val dy = tcy - p.cy
                  val dx = tx - p.cx
                  var tt = 1.2f * sqrt(2f * max(0f, -dy) / g) + 0.3f
                  tt = max(tt, 0.42f)
                  tt = max(tt, abs(dx) / (1100f * d))
                  planned = true
                  jtx = tx
                  jty = tcy
                  jT = tt
                  windDur = 0.28f
                  tlx = (dx / (p.W * 0.5f)).coerceIn(-1f, 1f)
                  tly = if (dy < 0f) -0.8f else 0.3f
                  lookIn = 1.5f
                  return true
              }

              private fun aim() {
                  val g = Tuning.gravity * d
                  jvx = (jtx - p.cx) / jT
                  jvy = ((jty - p.cy) - 0.5f * g * jT * jT) / jT
              }
          }
          SLIME_EOF

      - name: "FILE SlimeView.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeView.kt <<'SLIME_EOF'
          package app.slime

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.view.Choreographer
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          class SlimeView(ctx: Context) : View(ctx), Choreographer.FrameCallback {
              private val phys = SlimePhysics()
              private val fx = SlimeFx()
              private val brain = SlimeBrain(phys, fx)

              private fun fillPaint(c: Int) = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = c }
              private fun strokePaint(c: Int) = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  color = c
              }

              private val fill = fillPaint(0)
              private val outline = strokePaint(0)
              private val glow = strokePaint(0)
              private val white = fillPaint(Color.WHITE)
              private val shine = fillPaint(0x66FFFFFF)
              private val dark = fillPaint(0xFF101820.toInt())
              private val pink = fillPaint(0xFFFF6FA5.toInt())
              private val pinkSolid = fillPaint(0xFFFF4D88.toInt())
              private val tongue = fillPaint(0xFFFF7A9E.toInt())
              private val iris = fillPaint(0xFFFFB000.toInt())
              private val shade = fillPaint(0x80000000.toInt())
              private val mouthLine = strokePaint(0xFF101820.toInt())
              private val eyeLine = strokePaint(0xFF101820.toInt())

              private val path = Path()
              private val epath = Path()
              private val spath = Path()
              private val rect = RectF()
              private val hsv = FloatArray(3)
              private val loc = IntArray(2)
              private var last = 0L

              private fun col(a: Int, s: Float, v: Float): Int {
                  hsv[0] = Tuning.hue
                  hsv[1] = s
                  hsv[2] = v
                  return Color.HSVToColor(a, hsv)
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  last = 0L
                  Choreographer.getInstance().postFrameCallback(this)
              }

              override fun onDetachedFromWindow() {
                  Choreographer.getInstance().removeFrameCallback(this)
                  super.onDetachedFromWindow()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  phys.W = w.toFloat()
                  phys.H = h.toFloat()
                  phys.density = resources.displayMetrics.density
                  fx.density = phys.density
                  if (!phys.inited && w > 0) phys.reset(w * 0.5f, h * 0.2f)
              }

              override fun doFrame(frameTimeNanos: Long) {
                  if (last != 0L) {
                      val dt = min((frameTimeNanos - last) / 1_000_000_000f, 1f / 30f)
                      brain.update(dt)
                      phys.step(dt)
                      fx.update(dt, Tuning.gravity * phys.density, phys.platforms, phys.floorY)
                      invalidate()
                  }
                  last = frameTimeNanos
                  Choreographer.getInstance().postFrameCallback(this)
              }

              /** Dari service (thread utama): bounds elemen layar dalam koordinat layar. */
              fun setPlatforms(rects: List<Rect>) {
                  getLocationOnScreen(loc)
                  val ox = loc[0].toFloat()
                  val oy = loc[1].toFloat()
                  phys.updatePlatforms(rects.map { Plat(it.left - ox, it.top - oy, it.right - ox, it.bottom - oy) })
              }

              fun onScroll(r: Rect?, dx: Int, dy: Int) {
                  brain.onScroll()
                  if (r == null || (dx == 0 && dy == 0)) return
                  getLocationOnScreen(loc)
                  val ox = loc[0].toFloat()
                  val oy = loc[1].toFloat()
                  val l = r.left - ox
                  val t = r.top - oy
                  val rr = r.right - ox
                  val b = r.bottom - oy
                  phys.shiftRegion(l, t, rr, b, dx.toFloat(), dy.toFloat())
                  fx.shiftRegion(l, t, rr, b, dx.toFloat(), dy.toFloat())
              }

              override fun onDraw(c: Canvas) {
                  if (!phys.inited) return
                  fx.draw(c, true)
                  drawBody(c)
                  drawFace(c)
                  fx.draw(c, false)
              }

              private fun drawBody(c: Canvas) {
                  val n = SlimePhysics.N
                  val px = phys.px
                  val py = phys.py
                  val d = phys.density
                  path.reset()
                  path.moveTo((px[n - 1] + px[0]) / 2f, (py[n - 1] + py[0]) / 2f)
                  for (i in 0 until n) {
                      val j = (i + 1) % n
                      path.quadTo(px[i], py[i], (px[i] + px[j]) / 2f, (py[i] + py[j]) / 2f)
                  }
                  path.close()
                  val gl = brain.glow
                  glow.strokeWidth = (9f + 8f * gl) * d
                  glow.color = col((70 + 150 * gl).toInt(), 0.8f, 1f)
                  c.drawPath(path, glow)
                  fill.color = col(215, 0.65f, 1f)
                  c.drawPath(path, fill)
                  outline.strokeWidth = 2.2f * d
                  outline.color = col(255, 0.85f, 0.75f)
                  c.drawPath(path, outline)
              }

              private fun drawFace(c: Canvas) {
                  val R = phys.radius
                  val cx = phys.cx
                  val cy = phys.cy
                  val sxk = phys.scaleX
                  val syk = phys.scaleY

                  rect.set(cx - 0.52f * R * sxk, cy - 0.74f * R * syk, cx - 0.12f * R * sxk, cy - 0.50f * R * syk)
                  c.drawOval(rect, shine)

                  if (brain.blush > 0.02f) {
                      pink.alpha = (brain.blush * 140f).toInt().coerceIn(0, 255)
                      for (s in 0..1) {
                          val sg = if (s == 0) -1f else 1f
                          val bx = cx + sg * 0.50f * R * sxk
                          rect.set(bx - 0.14f * R, cy + 0.12f * R * syk, bx + 0.14f * R, cy + 0.26f * R * syk)
                          c.drawOval(rect, pink)
                      }
                  }

                  val e = 0.17f * R * Tuning.eye
                  val open = (1f - brain.blink) * (1f - 0.55f * brain.sleepy) *
                      (1f + 0.4f * brain.wide) * (1f - 0.35f * brain.squint)
                  val h = max(0.07f, open)
                  val ey = cy - 0.08f * R * syk + brain.lookY * 0.06f * R
                  val shift = brain.lookX * 0.10f * R
                  eye(c, cx - 0.30f * R * sxk + shift, ey, e, h, -1f)
                  eye(c, cx + 0.30f * R * sxk + shift, ey, e, h, 1f)
                  drawMouth(c, cx, cy, R, syk)
              }

              private fun eye(c: Canvas, x: Float, y: Float, e: Float, h: Float, side: Float) {
                  val d = phys.density
                  val inn = -side
                  when (brain.expr) {
                      Expr.HAPPY -> {
                          arc(c, x, y, e, true)
                          return
                      }
                      Expr.SLEEP -> {
                          arc(c, x, y, e, false)
                          return
                      }
                      Expr.DIZZY -> {
                          spiral(c, x, y, e)
                          return
                      }
                      Expr.HEART -> {
                          heartEye(c, x, y, e)
                          return
                      }
                      else -> {}
                  }
                  val cross = if (brain.expr == Expr.CROSS) inn * e * 0.55f else 0f
                  val lx = brain.lookX * e * 0.38f + cross
                  val ly = brain.lookY * e * 0.30f
                  when (Tuning.eyeStyleI) {
                      0 -> roundEye(c, x, y, e, h, lx, ly)
                      1 -> ovalEye(c, x, y, e, h, lx, ly)
                      else -> felineEye(c, x, y, e, h, side, lx, ly)
                  }
                  if (brain.expr == Expr.ANGRY) {
                      eyeLine.strokeWidth = 2.8f * d
                      c.drawLine(x - inn * e * 1.5f, y - e * 1.6f, x + inn * e * 1.4f, y - e * 0.7f, eyeLine)
                  }
              }

              private fun arc(c: Canvas, x: Float, y: Float, e: Float, up: Boolean) {
                  eyeLine.strokeWidth = 2.6f * phys.density
                  if (up) {
                      rect.set(x - e, y - e * 0.5f, x + e, y + e * 0.9f)
                      c.drawArc(rect, 200f, 140f, false, eyeLine)
                  } else {
                      rect.set(x - e, y - e * 0.9f, x + e, y + e * 0.5f)
                      c.drawArc(rect, 20f, 140f, false, eyeLine)
                  }
              }

              private fun spiral(c: Canvas, x: Float, y: Float, e: Float) {
                  eyeLine.strokeWidth = 1.7f * phys.density
                  spath.reset()
                  val n = 26
                  for (k in 0..n) {
                      val r = e * 1.05f * k / n
                      val a = k * 0.62f + brain.clock * 7f
                      val px = x + cos(a) * r
                      val py = y + sin(a) * r
                      if (k == 0) spath.moveTo(px, py) else spath.lineTo(px, py)
                  }
                  c.drawPath(spath, eyeLine)
              }

              private fun heartEye(c: Canvas, x: Float, y: Float, e: Float) {
                  val s = e * 0.9f
                  spath.reset()
                  spath.moveTo(x, y + s * 0.9f)
                  spath.cubicTo(x - s * 1.5f, y - s * 0.1f, x - s * 0.9f, y - s * 1.3f, x, y - s * 0.45f)
                  spath.cubicTo(x + s * 0.9f, y - s * 1.3f, x + s * 1.5f, y - s * 0.1f, x, y + s * 0.9f)
                  spath.close()
                  c.drawPath(spath, pinkSolid)
              }

              private fun roundEye(c: Canvas, x: Float, y: Float, e: Float, h: Float, lx: Float, ly: Float) {
                  rect.set(x - e, y - e * h, x + e, y + e * h)
                  c.drawOval(rect, white)
                  val pr = e * 0.55f
                  val ph = pr * min(h, 1f)
                  rect.set(x + lx - pr, y + ly - ph, x + lx + pr, y + ly + ph)
                  c.drawOval(rect, dark)
              }

              private fun ovalEye(c: Canvas, x: Float, y: Float, e: Float, h: Float, lx: Float, ly: Float) {
                  val ew = e * 0.62f
                  val eh = e * 1.2f * h
                  val ox = x + lx * 0.4f
                  val oy = y + ly * 0.4f
                  rect.set(ox - ew, oy - eh, ox + ew, oy + eh)
                  c.drawOval(rect, dark)
                  if (h > 0.35f) {
                      val hr = e * 0.2f * min(1f, h)
                      c.drawCircle(ox - ew * 0.3f, oy - eh * 0.45f, hr, white)
                      c.drawCircle(ox + ew * 0.35f, oy + eh * 0.4f, hr * 0.5f, white)
                  }
              }

              private fun felineEye(c: Canvas, x: Float, y: Float, e: Float, h: Float, side: Float, lx: Float, ly: Float) {
                  val d = phys.density
                  val outX = x + side * e * 1.35f
                  val inX = x - side * e * 1.35f
                  val outY = y - e * 0.32f
                  val inY = y + e * 0.14f
                  val half = e * 0.95f * h
                  epath.reset()
                  epath.moveTo(outX, outY)
                  epath.quadTo(x, y - 2f * half - e * 0.1f, inX, inY)
                  epath.quadTo(x, y + 1.6f * half + e * 0.05f, outX, outY)
                  epath.close()

                  hsv[0] = Tuning.iris
                  hsv[1] = 0.85f
                  hsv[2] = 1f
                  iris.color = Color.HSVToColor(255, hsv)
                  c.drawPath(epath, iris)

                  c.save()
                  c.clipPath(epath)
                  hsv[1] = 0.95f
                  hsv[2] = 0.55f
                  shade.color = Color.HSVToColor(150, hsv)
                  rect.set(x - 2f * e, y - 2f * half - e * 0.5f, x + 2f * e, y - half * 0.25f)
                  c.drawOval(rect, shade)
                  hsv[1] = 0.35f
                  hsv[2] = 1f
                  shade.color = Color.HSVToColor(130, hsv)
                  rect.set(x - e * 0.9f, y + half * 0.1f, x + e * 0.9f, y + half * 1.4f)
                  c.drawOval(rect, shade)

                  val pw = e * (0.17f + 0.40f * brain.wide)
                  val pxc = x + lx
                  rect.set(pxc - pw, y + ly * 0.5f - half * 1.15f, pxc + pw, y + ly * 0.5f + half * 1.15f)
                  c.drawOval(rect, dark)
                  if (h > 0.3f) {
                      val hr = e * 0.24f * min(1f, h)
                      c.drawCircle(x - e * 0.45f + lx * 0.3f, y - half * 0.5f, hr, white)
                      c.drawCircle(x + e * 0.5f + lx * 0.3f, y + half * 0.45f, hr * 0.45f, white)
                  }
                  c.restore()

                  eyeLine.strokeWidth = 1.9f * d
                  c.drawPath(epath, eyeLine)
                  eyeLine.strokeWidth = 2.4f * d
                  c.drawLine(outX, outY, outX + side * e * 0.6f, outY - e * 0.55f, eyeLine)
              }

              private fun drawMouth(c: Canvas, cx: Float, cy: Float, R: Float, syk: Float) {
                  val d = phys.density
                  var m = brain.mouth
                  if (m == Mouth.SMILE && brain.wide > 0.3f) m = Mouth.O
                  mouthLine.strokeWidth = 1.8f * d
                  when (m) {
                      Mouth.SMILE -> {
                          rect.set(cx - 0.16f * R, cy + 0.02f * R * syk, cx + 0.16f * R, cy + 0.22f * R * syk)
                          c.drawArc(rect, 20f, 140f, false, mouthLine)
                      }
                      Mouth.O -> {
                          val s = if (brain.wide > 0.3f) 0.09f else 0.06f
                          rect.set(cx - s * R, cy + 0.14f * R * syk, cx + s * R, cy + (0.14f + 2f * s) * R * syk)
                          c.drawOval(rect, dark)
                      }
                      Mouth.FLAT -> {
                          c.drawLine(cx - 0.12f * R, cy + 0.17f * R * syk, cx + 0.12f * R, cy + 0.17f * R * syk, mouthLine)
                      }
                      Mouth.YAWN -> {
                          rect.set(cx - 0.15f * R, cy + 0.06f * R * syk, cx + 0.15f * R, cy + 0.42f * R * syk)
                          c.drawOval(rect, dark)
                          rect.set(cx - 0.09f * R, cy + 0.28f * R * syk, cx + 0.09f * R, cy + 0.40f * R * syk)
                          c.drawOval(rect, tongue)
                      }
                      Mouth.TONGUE -> {
                          rect.set(cx - 0.16f * R, cy + 0.02f * R * syk, cx + 0.16f * R, cy + 0.22f * R * syk)
                          c.drawArc(rect, 20f, 140f, false, mouthLine)
                          rect.set(cx + 0.02f * R, cy + 0.16f * R * syk, cx + 0.12f * R, cy + 0.32f * R * syk)
                          c.drawOval(rect, tongue)
                      }
                      Mouth.WAVY -> {
                          spath.reset()
                          for (k in 0..6) {
                              val px = cx - 0.18f * R + k * 0.06f * R
                              val py = cy + 0.16f * R * syk + (if (k % 2 == 0) -0.02f else 0.03f) * R
                              if (k == 0) spath.moveTo(px, py) else spath.lineTo(px, py)
                          }
                          c.drawPath(spath, mouthLine)
                      }
                      Mouth.GRIN -> {
                          rect.set(cx - 0.2f * R, cy - 0.02f * R * syk, cx + 0.2f * R, cy + 0.26f * R * syk)
                          c.drawArc(rect, 0f, 180f, true, dark)
                          rect.set(cx - 0.09f * R, cy + 0.14f * R * syk, cx + 0.09f * R, cy + 0.25f * R * syk)
                          c.drawOval(rect, tongue)
                      }
                      Mouth.NONE -> {}
                  }
              }
          }
          SLIME_EOF

      - name: "FILE SlimeService.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeService.kt <<'SLIME_EOF'
          package app.slime

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          /** Hanya membaca bounds elemen layar (posisi/ukuran). Teks tidak pernah dibaca. */
          class SlimeService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var view: SlimeView? = null
              private val main = Handler(Looper.getMainLooper())
              private var bgThread: HandlerThread? = null
              private var bg: Handler? = null
              private var sp: SharedPreferences? = null
              private val spl = SharedPreferences.OnSharedPreferenceChangeListener { p, _ -> Tuning.load(p) }

              @Volatile private var queued = false
              @Volatile private var lastScan = 0L

              private val tick = object : Runnable {
                  override fun run() {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (pm.isInteractive) requestScan(0)
                      bg?.postDelayed(this, 900)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (view != null) return
                  val prefs = getSharedPreferences("slime", Context.MODE_PRIVATE)
                  sp = prefs
                  Tuning.load(prefs)
                  prefs.registerOnSharedPreferenceChangeListener(spl)

                  val t = HandlerThread("slime-scan")
                  t.start()
                  bgThread = t
                  bg = Handler(t.looper)

                  val manager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = manager
                  val v = SlimeView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  manager.addView(v, lp)
                  view = v
                  requestScan(200)
                  bg?.postDelayed(tick, 900)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null) return
                  when (e.eventType) {
                      AccessibilityEvent.TYPE_VIEW_SCROLLED -> {
                          val dx = e.scrollDeltaX
                          val dy = e.scrollDeltaY
                          val valid = !(dx == -1 && dy == -1)
                          val src = e.source
                          val r = if (src != null) Rect().also { src.getBoundsInScreen(it) } else null
                          src?.recycle()
                          view?.onScroll(if (valid) r else null, if (valid) -dx else 0, if (valid) -dy else 0)
                          requestScan(40)
                      }
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED,
                      AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED -> requestScan(120)
                  }
              }

              override fun onInterrupt() {}

              private fun requestScan(delayMs: Long) {
                  if (queued) return
                  queued = true
                  val since = SystemClock.uptimeMillis() - lastScan
                  val wait = max(max(delayMs, 110L - since), 0L)
                  bg?.postDelayed({
                      queued = false
                      lastScan = SystemClock.uptimeMillis()
                      scan()
                  }, wait)
              }

              private fun scan() {
                  try {
                      val root = rootInActiveWindow ?: return
                      val dm = resources.displayMetrics
                      val d = dm.density
                      val h = view?.height ?: dm.heightPixels
                      val out = ArrayList<Rect>()
                      walk(root, 0, out, intArrayOf(500), dm.widthPixels, h, (36 * d).toInt(), (14 * d).toInt())
                      root.recycle()
                      val list = merge(out)
                      main.post { view?.setPlatforms(list) }
                  } catch (e: Throwable) {
                  }
              }

              private fun walk(
                  n: AccessibilityNodeInfo, depth: Int, out: MutableList<Rect>, budget: IntArray,
                  w: Int, h: Int, minW: Int, minH: Int
              ) {
                  if (budget[0] <= 0 || depth > 40) return
                  budget[0]--
                  if (!n.isVisibleToUser) return
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  val bw = r.width()
                  val bh = r.height()
                  val huge = bw > w * 0.92f && bh > h * 0.85f
                  val tall = bh > h * 0.35f
                  if (!huge && !tall && bw >= minW && bh >= minH && r.top > 0 && r.top < h) out.add(r)
                  for (i in 0 until n.childCount) {
                      val ch = n.getChild(i) ?: continue
                      walk(ch, depth + 1, out, budget, w, h, minW, minH)
                      ch.recycle()
                  }
              }

              private fun merge(src: List<Rect>): List<Rect> {
                  val sorted = src.sortedWith(compareBy<Rect>({ it.top }, { it.left }))
                  val out = ArrayList<Rect>()
                  for (r in sorted) {
                      var dup = false
                      for (o in out) {
                          if (abs(o.top - r.top) < 8 && o.left < r.right && r.left < o.right) {
                              val inter = min(o.right, r.right) - max(o.left, r.left)
                              val small = min(o.width(), r.width())
                              if (inter > small * 0.7f) {
                                  dup = true
                                  break
                              }
                          }
                      }
                      if (!dup) out.add(r)
                      if (out.size >= 160) break
                  }
                  return out
              }

              private fun teardown() {
                  try {
                      val v = view
                      if (v != null) wm?.removeView(v)
                  } catch (e: Throwable) {
                  }
                  view = null
                  bgThread?.quitSafely()
                  bgThread = null
                  bg = null
                  sp?.unregisterOnSharedPreferenceChangeListener(spl)
                  sp = null
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  teardown()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  teardown()
                  super.onDestroy()
              }
          }
          SLIME_EOF

      - name: "FILE MainActivity.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/MainActivity.kt <<'SLIME_EOF'
          package app.slime

          import android.app.Activity
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {
              private val neon = 0xFF39FF14.toInt()
              private lateinit var status: TextView

              override fun onCreate(saved: Bundle?) {
                  super.onCreate(saved)
                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK
                  val sp = getSharedPreferences("slime", MODE_PRIVATE)
                  val d = resources.displayMetrics.density
                  val pad = (16 * d).toInt()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(pad, pad * 2, pad, pad * 2)

                  fun tv(txt: String, size: Float, c: Int): TextView {
                      val t = TextView(this)
                      t.text = txt
                      t.textSize = size
                      t.setTextColor(c)
                      t.typeface = Typeface.MONOSPACE
                      return t
                  }

                  col.addView(tv("SLIME", 30f, neon).also { it.setTypeface(Typeface.MONOSPACE, Typeface.BOLD) })
                  status = tv("", 13f, 0xFFB0FFB0.toInt())
                  status.setPadding(0, pad / 2, 0, pad / 2)
                  col.addView(status)

                  val open = Button(this)
                  open.text = "BUKA PENGATURAN AKSESIBILITAS"
                  open.setTextColor(neon)
                  open.setBackgroundColor(0xFF0B1A0B.toInt())
                  open.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  col.addView(open)

                  for (p in Tuning.ALL) {
                      val label = tv("", 12f, 0xFFB0FFB0.toInt())
                      label.setPadding(0, pad, 0, 0)
                      val st = p.steps
                      fun upd(v: Float) {
                          label.text = if (st != null) {
                              p.label + ": " + st[v.toInt().coerceIn(0, st.size - 1)]
                          } else {
                              p.label + ": " + String.format("%.1f", v)
                          }
                      }
                      val cur = sp.getFloat(p.key, p.def)
                      upd(cur)
                      val sb = SeekBar(this)
                      if (st != null) {
                          sb.max = st.size - 1
                          sb.progress = (cur + 0.5f).toInt().coerceIn(0, st.size - 1)
                      } else {
                          sb.max = 1000
                          sb.progress = (((cur - p.min) / (p.max - p.min)) * 1000f).toInt().coerceIn(0, 1000)
                      }
                      sb.progressTintList = ColorStateList.valueOf(neon)
                      sb.thumbTintList = ColorStateList.valueOf(neon)
                      sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, pr: Int, user: Boolean) {
                              val v = if (st != null) pr.toFloat() else p.min + (p.max - p.min) * pr / 1000f
                              upd(v)
                              if (user) sp.edit().putFloat(p.key, v).apply()
                          }

                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                      col.addView(label)
                      col.addView(sb)
                  }

                  val reset = Button(this)
                  reset.text = "RESET KE DEFAULT"
                  reset.setTextColor(neon)
                  reset.setBackgroundColor(0xFF0B1A0B.toInt())
                  reset.setOnClickListener {
                      sp.edit().clear().apply()
                      recreate()
                  }
                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  lp.topMargin = pad * 2
                  col.addView(reset, lp)

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.BLACK)
                  sv.addView(col)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  val en = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: ""
                  status.text = if (en.contains(packageName)) {
                      "STATUS: AKTIF - slime hidup"
                  } else {
                      "STATUS: MATI - aktifkan layanan Slime di Aksesibilitas"
                  }
              }
          }
          SLIME_EOF

