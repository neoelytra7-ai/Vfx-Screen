              cc.addView(lab, Ui.lp(top = 10))
              cc.addView(Slider(a, .5f, 2f, 1f, .25f, { "×%.2f".format(it) }) { v -> scale = v.toDouble(); lab.text = "Duration  ×%.2f".format(v) }, Ui.lp(h = Th.dpi(46)))
              cc.addView(Ui.btn(a, "▶  Run benchmark") { run() }, Ui.lp(top = 8))
              Ui.add(col, cc)

              Ui.add(col, resBox, 12)

              val sc = Ui.card(a, 12); sc.addView(Ui.h(a, "Throttle / stability test"))
              sc.addView(stressSp, Ui.lp(h = Th.dpi(96), top = 6)); sc.addView(stressTx, Ui.lp(top = 6))
              sc.addView(Ui.pill(a, "🔥 Start 30 s stress test") { stress() }, Ui.lp(top = 10))
              Ui.add(col, sc)

              val hc = Ui.card(a, 12); hc.addView(hist, Ui.lp(h = Th.dpi(96))); hc.addView(histTxt, Ui.lp(top = 8))
              val hb = LinearLayout(a)
              hb.addView(Ui.pill(a, "↗ Share") { share() }, LinearLayout.LayoutParams(0, -2, 1f).apply { marginEnd = Th.dpi(8) })
              hb.addView(Ui.pill(a, "🗑 Clear history") { Th.p().edit().remove("bhist").apply(); loadHist(); a.toast("History cleared") }, LinearLayout.LayoutParams(0, -2, 1f))
              hc.addView(hb, Ui.lp(top = 10)); Ui.add(col, hc)
              loadHist()
            }

            private fun histArr(): JSONArray = try { JSONArray(Th.p().getString("bhist", "[]")) } catch (e: Throwable) { JSONArray() }
            private fun loadHist() {
              val h = histArr(); hist.load((0 until h.length()).map { h.getJSONObject(it).optInt("s").toFloat() })
              val f = SimpleDateFormat("MMM d HH:mm", Locale.US)
              histTxt.text = if (h.length() == 0) "No runs yet" else (h.length() - 1 downTo maxOf(0, h.length() - 5)).joinToString("\n") { "${f.format(Date(h.getJSONObject(it).optLong("t")))}   score ${h.getJSONObject(it).optInt("s")}" } +
                "\nbest ${(0 until h.length()).maxOf { h.getJSONObject(it).optInt("s") }}"
            }

            private fun addRow(r: BR.Res) {
              val line = "${r.t.name.padEnd(18)} ${"%.1f".format(r.v)} ${r.t.unit}"; resLines.add(line)
              val row = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL; background = Th.glass(14f); setPadding(Th.dpi(14), Th.dpi(10), Th.dpi(14), Th.dpi(12)) }
              val top = LinearLayout(a)
              top.addView(Ui.txt(a, r.t.name, 13f, Th.TXT, true), LinearLayout.LayoutParams(0, -2, 1f))
              top.addView(Ui.txt(a, "${"%.1f".format(r.v)} ${r.t.unit}", 13f, Th.a1, true))
              val m = Meter(a)
              row.addView(top); row.addView(m, Ui.lp(h = Th.dpi(8), top = 8)); resBox.addView(row, Ui.lp(top = 8))
              if (Th.anim) { row.alpha = 0f; row.translationX = Th.dp(40f); row.animate().alpha(1f).translationX(0f).setDuration(380).start() }
              m.post { m.set((r.ratio / 1.5).toFloat()) }
            }

            private fun run() {
              if (running || stressing) return
              if (cats.isEmpty()) { a.toast("Select at least one suite"); return }
              running = true; resBox.removeAllViews(); resLines.clear()
              a.window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              val sel = LinkedHashSet(cats); val sc = scale
              Thread {
                var total = 0; var cs: Map<String, Int> = emptyMap()
                try {
                  val r = BR.run(a, sel, sc, { n, f -> a.runOnUiThread { ring.set(f, "${(f * 100).toInt()}", "%", n.uppercase().take(14)); status.text = "Running · $n" } }, { res -> a.runOnUiThread { addRow(res) } })
                  total = r.first; cs = r.second
                } catch (e: Throwable) { a.runOnUiThread { status.text = "Error: ${e.message}" } }
                a.runOnUiThread { finish(total, cs) }
              }.start()
            }

            private fun finish(total: Int, cs: Map<String, Int>) {
              running = false; lastTotal = total
              if (!Th.p().getBoolean("keepon", false)) a.window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              ring.set((total / 2000f).coerceAtMost(1f), "$total", "", "SCORE")
              radar.set(BR.CATS, BR.CATS.map { ((cs[it] ?: 0) / 1500f).coerceIn(0f, 1.1f) })
              status.text = "Done · " + cs.entries.joinToString("  ") { "${it.key} ${it.value}" }
              if (total > 0) { val h = histArr(); h.put(JSONObject().put("t", System.currentTimeMillis()).put("s", total)); while (h.length() > 20) h.remove(0); Th.p().edit().putString("bhist", h.toString()).apply(); loadHist() }
              Th.hap(ring, true); a.toast("Score $total")
            }

            private fun stress() {
              if (running || stressing) return
              stressing = true; stressSp.load(emptyList()); a.window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              Thread {
                val sum = try { BR.stress(a, 30) { rel, t, mhz, left -> a.runOnUiThread { stressSp.push(rel * 100); stressTx.text = "${left}s left · ${Th.temp(t)} · ${mhz} MHz" } } } catch (e: Throwable) { "Error: ${e.message}" }
                a.runOnUiThread { stressTx.text = sum; stressing = false; if (!Th.p().getBoolean("keepon", false)) a.window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); Th.hap(stressSp, true) }
              }.start()
            }

            private fun share() {
              val t = "SysX benchmark — ${Build.MODEL}\nScore $lastTotal\n" + resLines.joinToString("\n")
              a.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, t), "Share results"))
            }

            override fun onShow() { Ui.stagger(col) }
          }
          EOF

