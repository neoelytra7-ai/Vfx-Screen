          package dev.sysx

          import android.app.Application
          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.OvershootInterpolator

          class App : Application() {
            override fun onCreate() { super.onCreate(); Th.app = this }
          }

          object Th {
            lateinit var app: Context
            fun p() = app.getSharedPreferences("sx", 0)
            val BG = 0xFF070A12.toInt()
            val TXT = 0xFFEAF2FF.toInt()
            val DIM = 0xFF8C9AB0.toInt()
            val EMPH: android.view.animation.Interpolator = android.view.animation.PathInterpolator(0.05f, 0.7f, 0.1f, 1f)
            val STD: android.view.animation.Interpolator = android.view.animation.PathInterpolator(0.2f, 0f, 0f, 1f)
            val accents = listOf(
              Triple("Aurora", 0xFF6EE7F9.toInt(), 0xFFA78BFA.toInt()),
              Triple("Neon", 0xFF39FF88.toInt(), 0xFF00E5FF.toInt()),
              Triple("Sunset", 0xFFFF9A62.toInt(), 0xFFFF4D8D.toInt()),
              Triple("Ocean", 0xFF4FACFE.toInt(), 0xFF00F2FE.toInt()),
              Triple("Gold", 0xFFFFD166.toInt(), 0xFFFF8F3F.toInt()),
              Triple("Sakura", 0xFFFFA6D5.toInt(), 0xFFC4A1FF.toInt())
            )
            val idx get() = p().getInt("accent", 0).coerceIn(0, accents.size - 1)
            val a1 get() = accents[idx].second
            val a2 get() = accents[idx].third
            val anim get() = p().getBoolean("anim", true)
            val haptic get() = p().getBoolean("haptic", true)
            val aurora get() = p().getBoolean("aurora", true)
            val fahr get() = p().getBoolean("fahr", false)

            fun cv(c: Double) = if (fahr) c * 1.8 + 32 else c
            fun temp(c: Double) = "%.1f".format(cv(c)) + if (fahr) "°F" else "°C"
            fun dp(v: Float) = v * app.resources.displayMetrics.density
            fun dpi(v: Int) = dp(v.toFloat()).toInt()
            fun d(ms: Long) = if (anim) ms else 0L
            fun alpha(c: Int, a: Int) = (c and 0x00FFFFFF) or (a.coerceIn(0, 255) shl 24)
            fun mix(a: Int, b: Int, t: Float): Int {
              val k = t.coerceIn(0f, 1f)
              fun f(x: Int, y: Int) = (x + (y - x) * k).toInt()
              return Color.argb(f(Color.alpha(a), Color.alpha(b)), f(Color.red(a), Color.red(b)), f(Color.green(a), Color.green(b)), f(Color.blue(a), Color.blue(b)))
            }

            fun glass(r: Float = 18f, fill: Int = 0x16FFFFFF, stroke: Int = 0x26FFFFFF) = GradientDrawable().apply {
              setColor(fill); cornerRadius = dp(r); setStroke(Math.max(1, dp(1f).toInt()), stroke)
            }

            fun hap(v: View, strong: Boolean = false) {
              if (!haptic) return
              v.performHapticFeedback(if (strong && Build.VERSION.SDK_INT >= 30) HapticFeedbackConstants.CONFIRM else HapticFeedbackConstants.VIRTUAL_KEY)
            }

            /** Press-scale micro interaction + haptic click. */
            fun fx(v: View, click: (() -> Unit)? = null): View {
              v.isClickable = true
              v.setOnTouchListener { x, e ->
                when (e.actionMasked) {
                  MotionEvent.ACTION_DOWN -> x.animate().scaleX(.95f).scaleY(.95f).setDuration(d(80)).start()
                  MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> x.animate().scaleX(1f).scaleY(1f).setDuration(d(320)).setInterpolator(OvershootInterpolator(3f)).start()
                }
                false
              }
              if (click != null) v.setOnClickListener { hap(it); click() }
              return v
            }
          }
