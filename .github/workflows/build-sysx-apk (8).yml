          package dev.sysx

          import android.content.Context
          import java.security.MessageDigest
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          object BR {
            class T(val id: String, val name: String, val cat: String, val ref: Double, val unit: String, val lowerBetter: Boolean = false, val run: (Context, Double) -> Double)
            class Res(val t: T, val v: Double) {
              val ratio: Double get() = if (v <= 0) 0.0 else if (t.lowerBetter) t.ref / v else v / t.ref
            }
            val CATS = listOf("CPU", "Multi", "Memory", "Crypto", "GPU", "Storage")
            private var lastRead = 0.0

            private fun mat(ms: Long): Double {
              val n = 96; val a = FloatArray(n * n) { (it % 7) * 0.1f }; val b = FloatArray(n * n) { (it % 5) * 0.2f }; val c = FloatArray(n * n)
              var ops = 0.0; val t = System.nanoTime(); val e = t + ms * 1_000_000
              while (System.nanoTime() < e) {
                java.util.Arrays.fill(c, 0f)
                for (i in 0 until n) for (k in 0 until n) { val x = a[i * n + k]; for (j in 0 until n) c[i * n + j] += x * b[k * n + j] }
                ops += 2.0 * n * n * n
              }
              Bench.sink = c[3].toLong(); return ops / ((System.nanoTime() - t) / 1e9) / 1e9
            }
            private fun sort(ms: Long): Double {
              val r = java.util.Random(3); val src = IntArray(1_000_000) { r.nextInt() }; var keys = 0L
              val t = System.nanoTime(); val e = t + ms * 1_000_000
              while (System.nanoTime() < e) { val a = src.copyOf(); a.sort(); keys += a.size; Bench.sink = a[7].toLong() }
              return keys / ((System.nanoTime() - t) / 1e9) / 1e6
            }
            private fun sha(ms: Long): Double {
              val md = MessageDigest.getInstance("SHA-256"); val d = ByteArray(1 shl 20); var b = 0L
              val t = System.nanoTime(); val e = t + ms * 1_000_000
              while (System.nanoTime() < e) { md.update(d); b += d.size }
              Bench.sink = md.digest()[0].toLong(); return b / ((System.nanoTime() - t) / 1e9) / 1e6
            }

            fun tests() = listOf(
              T("int1", "Integer 1T", "CPU", 600.0, "Mops/s") { _, s -> Bench.intB((1100 * s).toLong()) },
              T("flt1", "Float 1T", "CPU", 40.0, "Mops/s") { _, s -> Bench.fltB((1100 * s).toLong()) },
              T("mat", "Matrix mul 1T", "CPU", 2.0, "GFLOPS") { _, s -> mat((1200 * s).toLong()) },
              T("sort", "Sort 1M ints", "CPU", 60.0, "Mkeys/s") { _, s -> sort((1200 * s).toLong()) },
              T("intN", "Integer ${S.n}T", "Multi", 3000.0, "Mops/s") { _, s -> Bench.multi((1400 * s).toLong()) { Bench.intB(it) } },
              T("fltN", "Float ${S.n}T", "Multi", 250.0, "Mops/s") { _, s -> Bench.multi((1400 * s).toLong()) { Bench.fltB(it) } },
              T("mem", "RAM bandwidth", "Memory", 10.0, "GB/s") { _, s -> Bench.mem((1200 * s).toLong()) },
              T("lat", "RAM latency", "Memory", 110.0, "ns", true) { _, _ -> Bench.lat() },
              T("aes", "AES-CBC", "Crypto", 1000.0, "MB/s") { _, s -> Bench.aes((1000 * s).toLong()) },
              T("sha", "SHA-256", "Crypto", 600.0, "MB/s") { _, s -> sha((1000 * s).toLong()) },
              T("zip", "Deflate", "Crypto", 40.0, "MB/s") { _, s -> Bench.zip((1000 * s).toLong()) },
              T("gpu", "GPU shader 1024²", "GPU", 40.0, "fps") { _, _ -> Bench.gpu() },
              T("sw", "Storage write", "Storage", 250.0, "MB/s") { c, _ -> val (w, r) = Bench.sto(c); lastRead = r; w },
              T("sr", "Storage read*", "Storage", 1500.0, "MB/s") { _, _ -> lastRead }
            )

            fun run(c: Context, cats: Set<String>, scale: Double, prog: (String, Float) -> Unit, res: (Res) -> Unit): Pair<Int, Map<String, Int>> {
              val ts = tests().filter { it.cat in cats }; val out = ArrayList<Res>()
              prog("warming up", 0f); Bench.intB(250); Bench.fltB(250)
              ts.forEachIndexed { i, t ->
                prog(t.name, i / ts.size.toFloat())
                val v = try { t.run(c, scale) } catch (e: Throwable) { 0.0 }
                val r = Res(t, v); out.add(r); res(r)
              }
              prog("done", 1f)
              val cs = cats.associateWith { cat -> val l = out.filter { it.t.cat == cat && it.v > 0 }; if (l.isEmpty()) 0 else (l.map { it.ratio }.average() * 1000).toInt() }
              return Pair(if (cs.isEmpty()) 0 else cs.values.average().toInt(), cs)
            }

            /** All-core stress; cb(relativePerf, tempC, maxMHz, secondsLeft). Returns summary text. */
            fun stress(c: Context, secs: Int, cb: (Float, Double, Long, Int) -> Unit): String {
              val ops = AtomicLong(); val stop = AtomicBoolean(false)
              val ts = (0 until S.n).map {
                Thread { var x = 1L; while (!stop.get()) { for (i in 0 until 200000) { x = x * 6364136223846793005L + 1442695040888963407L; x = x xor (x ushr 29) }; ops.addAndGet(200000) }; Bench.sink = x }.also { it.start() }
              }
              var last = 0L; var base = 0.0; val rels = ArrayList<Float>(); var peak = 0L; var lastF = 0L; var t0 = S.tmax(); var tmx = t0
              for (s in 1..secs) {
                Thread.sleep(1000); val o = ops.get(); val d = (o - last).toDouble(); last = o
                if (s == 1) base = d
                val rel = if (base > 0) (d / base).toFloat() else 1f; rels.add(rel)
                val mhz = S.freqs().maxOrNull() ?: 0L; if (mhz > peak) peak = mhz; lastF = mhz
                val tc = S.tmax(); if (tc > tmx) tmx = tc
                cb(rel, tc, mhz, secs - s)
              }
              stop.set(true); ts.forEach { it.join() }
              val tail = rels.takeLast(5).average(); val worst = rels.minOrNull() ?: 1f
              return "Sustained ${"%.0f".format(tail * 100)}% of peak (worst ${"%.0f".format(worst * 100)}%) · throttle ${"%.0f".format(Math.max(0.0, (1 - tail) * 100))}%\n" +
                "Peak ${peak}MHz → end ${lastF}MHz · temp ${Th.temp(t0)} → ${Th.temp(tmx)}"
            }
          }
