                  duration = 40000; repeatCount = ValueAnimator.INFINITE; interpolator = LinearInterpolator()
                  addUpdateListener { t = it.animatedValue as Float; val nw = android.os.SystemClock.uptimeMillis(); if (nw - lastDraw >= 32L) { lastDraw = nw; invalidate() } }; start()
