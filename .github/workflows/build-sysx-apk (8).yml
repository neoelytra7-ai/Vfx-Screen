            private fun rebuild() { if (width > 0) sh = SweepGradient(width / 2f, height / 2f, intArrayOf(ca, cb, cb), floatArrayOf(0f, .75f, 1f)) }
            override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { rebuild() }
            fun set(f: Float, big: String, unit: String, label: String, a: Int = Th.a1, b: Int = Th.a2) {
              this.big = big; this.unit = unit; this.label = label
              if (a != ca || b != cb) { ca = a; cb = b; rebuild() }
              val to = f.coerceIn(0f, 1f); va?.cancel()
              if (!Th.anim) { shown = to; invalidate(); return }
              va = ValueAnimator.ofFloat(shown, to).apply {
