              Fx("LEVELS", 0, 4, listOf(p("GAMMA", .2f, 3f, 1f), p("BLACK", 0f, 1f, 0f), p("WHITE", 0f, 1f, 1f))),
              Fx("INVERT", 0, 5, listOf(p("AMOUNT", 0f, 1f, 1f))),
              Fx("SEPIA", 0, 6, listOf(p("AMOUNT", 0f, 1f, 1f), p("SEPIA", 0f, 1f, 1f))),
              Fx("DUOTONE", 0, 7, listOf(p("MIX", 0f, 1f, 1f))),
              Fx("TRITONE", 0, 8, listOf(p("MIX", 0f, 1f, 1f))),
              Fx("POSTER", 0, 9, listOf(p("LEVELS", 2f, 16f, 5f))),
              Fx("THRESH", 0, 10, listOf(p("LEVEL", 0f, 1f, .5f), p("SOFT", 0f, .5f, .02f))),
              Fx("VIGNETTE", 0, 11, listOf(p("AMOUNT", 0f, 1f, .6f), p("RADIUS", .1f, 1f, .35f), p("SOFT", .05f, 1f, .5f))),
              Fx("CHROMA", 0, 12, listOf(p("SHIFT", 0f, 30f, 6f))),
              Fx("SOLAR", 0, 13, listOf(p("LEVEL", 0f, 1f, .5f))),
              Fx("PIXEL", 1, 14, listOf(p("SIZE", 2f, 64f, 8f))),
              Fx("HALFTONE", 1, 15, listOf(p("SIZE", 4f, 40f, 10f), p("ANGLE", 0f, 90f, 45f))),
              Fx("DITHER", 1, 16, listOf(p("LEVELS", 2f, 8f, 3f), p("SCALE", 1f, 8f, 2f))),
              Fx("EMBOSS", 1, 17, listOf(p("POWER", 0f, 4f, 1.5f), p("ANGLE", 0f, 360f, 135f))),
              Fx("EDGES", 1, 18, listOf(p("POWER", 0f, 4f, 1.5f), p("KEEP", 0f, 1f, 0f))),
              Fx("TOON", 1, 19, listOf(p("LEVELS", 2f, 10f, 4f), p("EDGE", 0f, 3f, 1.2f))),
              Fx("MOSAIC", 1, 20, listOf(p("SIZE", 6f, 80f, 24f), p("SEED", 0f, 20f, 0f))),
              Fx("GLITCH", 1, 21, listOf(p("AMOUNT", 0f, 1f, .5f), p("BLOCK", 2f, 60f, 16f), p("SEED", 0f, 50f, 1f))),
              Fx("CRT", 1, 22, listOf(p("LINES", .2f, 4f, 1.5f), p("DARK", 0f, 1f, .5f), p("CURVE", 0f, 3f, 1f))),
              Fx("GRAIN", 1, 23, listOf(p("AMOUNT", 0f, 1f, .25f), p("SIZE", 1f, 6f, 1f), p("SEED", 0f, 50f, 1f))),
              Fx("OIL", 1, 24, listOf(p("RADIUS", 1f, 8f, 4f))),
              Fx("STARDUST", 1, 25, listOf(p("DENSITY", 0f, 1f, .3f), p("SIZE", .3f, 1.8f, 1.1f), p("SEED", 0f, 50f, 3f))),
              Fx("PATTERN", 1, 26, listOf(p("PATTERN", 1f, 13f, 4f), p("SIZE", 8f, 120f, 40f), p("OPACITY", 0f, 1f, .5f))),
              Fx("SWIRL", 2, 27, listOf(p("ANGLE", -8f, 8f, 3f), p("RADIUS", .1f, 1f, .5f), p("X", 0f, 1f, .5f), p("Y", 0f, 1f, .5f))),
              Fx("BULGE", 2, 28, listOf(p("AMOUNT", -1f, 1f, .6f), p("RADIUS", .1f, 1f, .5f), p("X", 0f, 1f, .5f), p("Y", 0f, 1f, .5f))),
              Fx("RIPPLE", 2, 29, listOf(p("AMP", 0f, .06f, .015f), p("FREQ", 1f, 40f, 12f), p("PHASE", 0f, 6.28f, 0f), p("BOTH", 0f, 1f, 0f))),
              Fx("FISHEYE", 2, 30, listOf(p("LENS", -1f, 1f, .6f))),
              Fx("KALEIDO", 2, 31, listOf(p("SEGMENTS", 2f, 16f, 6f), p("TURN", 0f, 6.28f, 0f))),
              Fx("MIRROR", 2, 32, listOf(p("MODE", 0f, 4f, 0f))),
              Fx("TILE", 2, 33, listOf(p("REPEAT", 1f, 8f, 2f))),
              Fx("POLAR", 2, 34, listOf(p("MODE", 0f, 1f, 0f))),
              Fx("GAUSS", 3, 100, listOf(p("RADIUS", 0f, 32f, 8f))),
              Fx("MOTION", 3, 104, listOf(p("LENGTH", 0f, 60f, 20f), p("ANGLE", 0f, 360f, 0f))),
              Fx("RADIAL", 3, 36, listOf(p("AMOUNT", 0f, 1f, .3f), p("X", 0f, 1f, .5f), p("Y", 0f, 1f, .5f))),
              Fx("TILT", 3, 37, listOf(p("FOCUS", 0f, 1f, .5f), p("BAND", 0f, .5f, .1f), p("BLUR", 0f, 30f, 14f))),
              Fx("BOKEH", 3, 38, listOf(p("RADIUS", 0f, 30f, 10f))),
              Fx("GLOW", 3, 101, listOf(p("THRESH", 0f, 1f, .6f), p("RADIUS", 2f, 32f, 12f), p("POWER", 0f, 2f, .9f))),
              Fx("DREAM", 3, 102, listOf(p("RADIUS", 2f, 32f, 16f), p("POWER", 0f, 1.5f, .6f))),
              Fx("SHARPEN", 3, 103, listOf(p("RADIUS", 1f, 8f, 2f), p("POWER", 0f, 3f, 1f))),
              // LOOKS: multi-pass recipes built from the filters above (neon uses your brush color)
              Fx("NEON", 4, 105, listOf(p("EDGE", .5f, 6f, 2.5f), p("GLOW", 2f, 32f, 10f), p("AMOUNT", 0f, 2f, 1.2f))),
              Fx("POP", 4, 106, listOf(p("RADIUS", 1f, 8f, 2f), p("CLARITY", 0f, 3f, 1.2f), p("VIBE", 0f, 2f, 1.3f))),
              Fx("FILM", 4, 107, listOf(p("WARM", -1f, 1f, .3f), p("GRAIN", 0f, 1f, .2f), p("VIGNETTE", 0f, 1f, .5f))),
              Fx("VHS", 4, 108, listOf(p("SHIFT", 0f, 20f, 5f), p("LINES", .2f, 4f, 1.5f), p("NOISE", 0f, 1f, .3f))),
          )

          @Composable
          fun FxPanel(e: Engine, v: CanvasView, apply: () -> Unit, cancel: () -> Unit) {
              val rv = U.rev
              var cat by remember { mutableIntStateOf(0) }
              var sel by remember { mutableIntStateOf(-1) }
              val vals = remember { mutableStateListOf(0f, 0f, 0f, 0f) }
              if (!e.fxOk) { Tx("fx shaders are not supported on this gpu :("); return }
              fun pick(i: Int) {
                  sel = i
                  for (k in 0 until 4) vals[k] = FXS[i].ps.getOrNull(k)?.d ?: 0f
                  val a = vals.toFloatArray(); v.gl { e.fxSet(i, a) }
              }
              fun dice() {
                  val i = FXS.indices.random(); cat = FXS[i].cat; pick(i)
                  FXS[i].ps.forEachIndexed { k, q -> vals[k] = (q.d + (kotlin.random.Random.nextFloat() - .5f) * (q.hi - q.lo) * .6f).coerceIn(q.lo, q.hi) }
                  val a = vals.toFloatArray(); v.gl { e.fxSet(i, a) }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  FXC.forEachIndexed { i, n -> Pill(n, cat == i, Ik.FX) { cat = i } }
                  Pill("DICE", false, Ik.DC) { dice() }
              }
              FXS.withIndex().filter { it.value.cat == cat }.chunked(3).forEach { row ->
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      row.forEach { (i, f) -> Pill(f.n, sel == i) { pick(i) } }
                  }
              }
              if (sel >= 0) {
                  FXS[sel].ps.forEachIndexed { k, q ->
                      R2(PP(q.n, q.lo, q.hi, (q.hi - q.lo) / 100f, false, { vals[k] }, { x -> vals[k] = x; val a = vals.toFloatArray(); v.gl { e.fxSet(sel, a) } }))
                  }
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Pill("APPLY", true, Ik.OK) { v.gl { e.fxApply() }; apply() }
                      Pill("RESET") { pick(sel) }
                      Pill("CANCEL") { cancel() }
                  }
              }
          }
