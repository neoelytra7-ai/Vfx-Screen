          // ───────────────────────── edge sliders: size (left) and opacity (right) with live preview ─────────────────────────
          @Composable
          fun VBar(t: Float, h: Float, onT: (Float) -> Unit, onDown: (Boolean) -> Unit) {
              val ac = T.ac; val ac2 = T.ac2; val tr = T.panel2; val dk = T.dk
              val cb by rememberUpdatedState(onT)
              val db by rememberUpdatedState(onDown)
              val hf = LocalHapticFeedback.current
              val q = remember { IntArray(1) }
              Box(
                  Modifier.width(d(30f)).height(d(h)).systemGestureExclusion().drawBehind {
                      val w = size.width; val hh = size.height; val r = w / 2f
                      val y = hh - r - (hh - 2f * r) * t.coerceIn(0f, 1f)
                      val cr = CornerRadius(w * .22f)
                      drawRoundRect(tr.copy(alpha = .85f), Offset(w * .3f, 0f), Size(w * .4f, hh), cr)
                      drawRoundRect(Brush.verticalGradient(listOf(ac, ac2), y, hh), Offset(w * .3f, y), Size(w * .4f, hh - y), cr)
                      drawCircle(Color.White, r * .92f, Offset(r, y))
                      drawCircle(dk, r * .09f, Offset(r - r * .28f, y - r * .12f)); drawCircle(dk, r * .09f, Offset(r + r * .28f, y - r * .12f))
                      drawArc(dk, 20f, 140f, false, Offset(r - r * .2f, y - r * .06f), Size(r * .4f, r * .26f), style = androidx.compose.ui.graphics.drawscope.Stroke(r * .08f, cap = StrokeCap.Round))
                  }.pointerInput(Unit) {
                      awaitPointerEventScope {
                          while (true) {
                              val c = awaitPointerEvent().changes[0]
                              if (c.pressed) {
                                  db(true)
                                  val x = (1f - c.position.y / size.height).coerceIn(0f, 1f)
                                  val k = (x * 20f).toInt()
                                  if (k != q[0]) { q[0] = k; if (T.hap > .5f) hf.performHapticFeedback(HapticFeedbackType.TextHandleMove) }
                                  cb(x); c.consume()
                              } else db(false)
                          }
                      }
                  }
              )
          }

          @Composable
          fun BarPreview(e: Engine, mode: Int) {
              val p = e.pen
              val s = minOf(e.vw.toFloat() / e.W, e.vh.toFloat() / e.H) * e.zoom
              val col = Color(p.color)
              Column(Modifier.padding(horizontal = d(6f)).glass(rs(.8f)).padding(d(8f)), horizontalAlignment = Alignment.CenterHorizontally) {
                  Canvas(Modifier.size(d(84f))) {
                      val c = Offset(size.width / 2f, size.height / 2f)
                      val maxR = size.minDimension / 2f
                      if (mode == 1) {
                          drawRect(Color(0xFF3A3A3A), Offset(0f, 0f), Size(size.width / 2f, size.height))
                          drawRect(Color(0xFFEEEEEE), Offset(size.width / 2f, 0f), Size(size.width / 2f, size.height))
                      }
                      val rr = if (mode == 0) (p.size * .5f * s).coerceIn(1.5f, maxR) else maxR * .8f
                      val hd = p.hardness.coerceIn(0f, .97f)
                      val a = if (mode == 1) p.opacity else 1f
                      drawCircle(Brush.radialGradient(0f to col.copy(alpha = a), hd to col.copy(alpha = a), 1f to col.copy(alpha = 0f), center = c, radius = rr), rr, c)
                  }
                  Tx(if (mode == 0) "%d px".format(p.size.toInt()) else "%d%%".format((p.opacity * 100f).toInt()), T.ink, sz = 10f)
              }
          }

          @Composable
          fun BoxScope.EdgeBars(e: Engine, busy: Boolean) {
              var dl by remember { mutableStateOf(false) }
              var dr by remember { mutableStateOf(false) }
              val fade by animateFloatAsState(if (busy) .15f else 1f, label = "eb")
              val p = e.pen
              val st = (ln(p.size.coerceAtLeast(1f)) / ln(1000f)).coerceIn(0f, 1f)
              Row(Modifier.align(Alignment.CenterStart).padding(start = d(6f)).graphicsLayer { alpha = fade }, verticalAlignment = Alignment.CenterVertically) {
                  VBar(st, 190f, { x -> p.size = 1000f.pow(x); U.bump() }, { dl = it })
                  if (dl) BarPreview(e, 0)
              }
              Row(Modifier.align(Alignment.CenterEnd).padding(end = d(6f)).graphicsLayer { alpha = fade }, verticalAlignment = Alignment.CenterVertically) {
                  if (dr) BarPreview(e, 1)
                  VBar(p.opacity.coerceIn(0f, 1f), 190f, { x -> p.opacity = x.coerceAtLeast(.01f); U.bump() }, { dr = it })
              }
          }

          /** Swipe the little grip to throw the dock to another edge / side. */
          @Composable
          fun Grip(onFling: (Float, Float) -> Unit) {
              val ac2 = T.ac2
              val cb by rememberUpdatedState(onFling)
              Canvas(
                  Modifier.size(d(16f), d(36f)).pointerInput(Unit) {
                      var ax = 0f; var ay = 0f
                      detectDragGestures(
                          onDragStart = { ax = 0f; ay = 0f },
                          onDragEnd = { cb(ax, ay) },
                          onDragCancel = { }
                      ) { c, a -> c.consume(); ax += a.x; ay += a.y }
                  }
              ) {
                  for (i in 0..2) for (j in 0..1) drawCircle(ac2.copy(alpha = .75f), size.width * .12f, Offset(size.width * (.3f + .4f * j), size.height * (.25f + .25f * i)))
              }
          }

          // ───────────────────────── brush preview (live stroke made from the current brush settings) ─────────────────────────
          @Composable
          fun BrushPreview(e: Engine) {
              val rv = U.rev
              val p = e.pen
              val col = Color(p.color)
              val lum = col.red * .3f + col.green * .59f + col.blue * .11f
              val bg = if (lum > .55f) T.panel2.copy(alpha = 1f) else Color(0xFFEDE7EE)
              Canvas(Modifier.fillMaxWidth().height(d(54f)).clip(rs(.6f)).background(bg)) {
                  val w = size.width; val h = size.height
                  val maxR = h * .4f
                  val vr = (ln(p.size.coerceAtLeast(1f)) / ln(1000f) * maxR).coerceAtLeast(1.5f)
                  val x0 = w * .08f; val x1 = w * .92f
                  val span = x1 - x0
                  val step = maxOf(1.2f, vr * 2f * p.spacing, span / 200f)
                  val hd = p.hardness.coerceIn(0f, .97f)
                  var x = x0; var i = 0
                  while (x <= x1 && i < 400) {
                      val tt = (x - x0) / span
                      val pr = sin(tt * 3.1416f).coerceAtLeast(0f).pow(p.pCurve.coerceAtLeast(.05f))
                      val y = h / 2f + sin(tt * 6.2832f) * h * .22f
                      val jr = 1f - p.sizeJit * (((i * 7919) % 100) / 100f)
                      val r = (vr * (1f - p.pSize + p.pSize * pr) * jr).coerceAtLeast(.8f)
                      val a = (p.opacity * (1f - p.pOp + p.pOp * pr)).coerceIn(0f, 1f)
                      val sc = p.scatter * r
                      val ox = if (p.scatter > 0f) (((i * 104729) % 100) / 50f - 1f) * sc else 0f
                      val oy = if (p.scatter > 0f) (((i * 15485863) % 100) / 50f - 1f) * sc else 0f
                      val c = Offset(x + ox, y + oy)
                      drawCircle(Brush.radialGradient(0f to col.copy(alpha = a), hd to col.copy(alpha = a), 1f to col.copy(alpha = 0f), center = c, radius = r), r, c)
                      x += step; i++
                  }
              }
          }

          // ───────────────────────── smart color: harmonies + recent colors ─────────────────────────
          val HARM_N = listOf("COMP", "ANALOG", "TRIAD", "SPLIT", "TETRAD", "SHADES")

          @Composable
          fun Harmony(pick: (Int) -> Unit) {
              val rv = U.rev
              var mode by remember { mutableIntStateOf(0) }
              Tx("HARMONY", T.ac, sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  HARM_N.forEachIndexed { i, n -> Pill(n, mode == i) { mode = i } }
              }
              val h = U.hh; val s = U.ss; val b = U.bb
              val cols = ArrayList<Int>()
              if (mode == 5) {
                  for (k in 0..6) cols.add(hsvInt(h, s, .15f + .85f * k / 6f))
              } else {
                  val offs = if (mode == 0) floatArrayOf(0f, 180f) else if (mode == 1) floatArrayOf(-30f, 0f, 30f) else if (mode == 2) floatArrayOf(0f, 120f, 240f)
                      else if (mode == 3) floatArrayOf(0f, 150f, 210f) else floatArrayOf(0f, 90f, 180f, 270f)
                  for (o in offs) {
                      cols.add(hsvInt(h + o, s * .55f, 1f))
                      cols.add(hsvInt(h + o, s, b.coerceAtLeast(.6f)))
                      cols.add(hsvInt(h + o, (s + .15f).coerceAtMost(1f), b * .55f))
                  }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                  cols.forEach { c -> Bub(32f, false, anim = false, pad = .2f, f = { pick(c) }) { drawCircle(Color(c), size.minDimension / 2f) } }
              }
          }

          @Composable
          fun Recents(pick: (Int) -> Unit) {
              if (U.hist.isEmpty()) return
              Tx("RECENT", T.ac, sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                  U.hist.toList().forEach { c -> Bub(30f, false, anim = false, pad = .2f, f = { pick(c) }) { drawCircle(Color(c), size.minDimension / 2f) } }
              }
          }

          // ───────────────────────── style panel extras: font picker + layout ─────────────────────────
          val FONT_N = listOf("ROUND", "MONO", "SERIF", "SCRIPT", "CASUAL", "NARROW", "HEAVY", "THIN", "ITALIC", "BOLDMONO")

          @Composable
          fun FontPick() {
              val cur = T.fnt.toInt()
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  FONTS.forEachIndexed { i, f ->
                      Text(
                          "Aa " + FONT_N[i].lowercase(), color = if (cur == i) T.dk else T.ink, fontSize = (T.fs + 2f).sp, fontFamily = f, maxLines = 1,
                          modifier = Modifier.clip(RoundedCornerShape(50)).background(if (cur == i) T.ac else T.panel2)
                              .clickable { T.fnt = i.toFloat(); U.bump() }.padding(horizontal = d(11f), vertical = d(7f))
                      )
                  }
              }
          }

          @Composable
          fun LayoutPanel() {
              val rv = U.rev
              val ctx = LocalContext.current
              fun save() { T.save(ctx.getSharedPreferences("t", 0)); U.bump() }
              val side = (T.dkx * 2f + .5f).toInt().coerceIn(0, 2)
              Tx("Swipe the dots on the dock to throw it around, or set it here.", T.ink.copy(alpha = .7f), sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Pill(if (T.dky > .5f) "DOCK TOP" else "DOCK BOTTOM", true, Ik.UP) { T.dky = if (T.dky > .5f) 0f else 1f; save() }
                  Pill(listOf("SIDE LEFT", "SIDE CENTER", "SIDE RIGHT")[side], true, Ik.MV) { T.dkx = ((side + 1) % 3) / 2f; save() }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Pill("EDGE BARS", T.edge > .5f, Ik.BS) { T.edge = if (T.edge > .5f) 0f else 1f; U.bump() }
                  Pill("HAPTIC", T.hap > .5f, Ik.MN) { T.hap = if (T.hap > .5f) 0f else 1f; U.bump() }
                  Pill("COLOR FOLLOW", T.fol > .5f, Ik.CO) { T.fol = if (T.fol > .5f) 0f else 1f; U.bump() }
              }
          }

          fun surprise() {
              val r = kotlin.random.Random
              val h = r.nextFloat() * 360f
              val sh = listOf(30f, 60f, 120f, 150f, 180f, -30f, -60f, -120f)[r.nextInt(8)]
              val bh = (((h + (r.nextFloat() - .5f) * 40f) % 360f) + 360f) % 360f
              val ph = (((h + sh * .5f) % 360f) + 360f) % 360f
              applyPreset(floatArrayOf(h, .3f + r.nextFloat() * .35f, .9f + r.nextFloat() * .1f, sh, bh, .35f + r.nextFloat() * .35f, r.nextFloat() * .05f,
                  (1 + r.nextInt(13)).toFloat(), ph, .3f + r.nextFloat() * .3f, .25f + r.nextFloat() * .15f, .4f + r.nextFloat() * .3f, 28f + r.nextFloat() * 60f))
          }
