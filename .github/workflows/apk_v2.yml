          class FxP(val n: String, val lo: Float, val hi: Float, val d: Float)
          class Fx(val n: String, val cat: Int, val m: Int, val ps: List<FxP>)

          val FXC = listOf("COLOR", "STYLE", "DISTORT", "BLUR", "LOOKS")
          private fun p(n: String, lo: Float, hi: Float, d: Float) = FxP(n, lo, hi, d)

          /** 46 filters. m = shader mode (100+ = multi-pass recipes built in Engine.fxPlan). */
          val FXS = listOf(
              Fx("BRIGHT", 0, 1, listOf(p("BRIGHT", -1f, 1f, 0f), p("CONTRAST", 0f, 2f, 1f))),
              Fx("HUE/SAT", 0, 2, listOf(p("HUE", -180f, 180f, 0f), p("SAT", 0f, 2f, 1f), p("VALUE", 0f, 2f, 1f))),
