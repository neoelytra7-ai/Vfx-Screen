          /** Decode a picked image (down-sampled to roughly [mx] px, EXIF-rotated). Call off the main thread. */
          fun decodeImg(ctx: Context, u: Uri, mx: Int): Bitmap? {
              return try {
                  val o = BitmapFactory.Options(); o.inJustDecodeBounds = true
                  ctx.contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o) }
                  var ss = 1
                  while (kotlin.math.max(o.outWidth, o.outHeight) / ss > mx) ss *= 2
                  val o2 = BitmapFactory.Options(); o2.inSampleSize = ss
                  val b = ctx.contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, o2) } ?: return null
                  val ori = try {
                      ctx.contentResolver.openInputStream(u)?.use { s -> android.media.ExifInterface(s).getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1) } ?: 1
                  } catch (t: Throwable) { 1 }
                  val deg = if (ori == 6) 90f else if (ori == 3) 180f else if (ori == 8) 270f else 0f
                  if (deg == 0f) b else {
                      val m = Matrix(); m.postRotate(deg)
                      Bitmap.createBitmap(b, 0, 0, b.width, b.height, m, true)
                  }
              } catch (t: Throwable) { null }
          }

          /** Animated 0..1 loop as a State (read it inside draw / graphicsLayer lambdas so nothing recomposes per frame). */
          @Composable
          fun loopState(ms: Int, label: String): State<Float> =
              if (T.an > .01f) rememberInfiniteTransition(label = label).animateFloat(0f, 1f, infiniteRepeatable(tween(ms, easing = LinearEasing)), label = label)
              else remember { mutableFloatStateOf(0f) }

          // ───────────────────────── liquid-glass surface ─────────────────────────
          /** Panel surface: tinted glass, top sheen, gradient hairline border, and a one-shot light sweep whenever [key] changes. */
          @Composable
          fun Modifier.glass(sh: Shape = rs(), key: Any = Unit): Modifier {
              val sw = remember { Animatable(1f) }
              LaunchedEffect(key) { if (T.an > .01f) { sw.snapTo(0f); sw.animateTo(1f, tween(1000)) } }
              val ac = T.ac; val ac2 = T.ac2; val pn = T.panel; val gl = T.gls
              return this.clip(sh).background(pn).drawBehind {
                  val w = size.width; val h = size.height
                  drawRect(Brush.verticalGradient(listOf(Color.White.copy(alpha = .05f + .09f * gl), Color.Transparent), 0f, h * .6f))
                  val p = sw.value
                  if (p > 0f && p < 1f) {
                      val x = -w * .35f + w * 1.7f * p
                      drawRect(Brush.linearGradient(listOf(Color.Transparent, Color.White.copy(alpha = .18f * (1f - p)), Color.Transparent), Offset(x, 0f), Offset(x + w * .3f, h * .7f)))
                  }
              }.border(1.dp, Brush.linearGradient(listOf(ac2.copy(alpha = .55f), ac.copy(alpha = .1f), ac2.copy(alpha = .35f))), sh)
          }

          // ───────────────────────── sparkles / confetti ─────────────────────────
          class Spark(var x: Float, var y: Float, var vx: Float, var vy: Float, var life: Float, val kind: Int, val hue: Int, val sz: Float)

          class SparkSys(val g: Float, val k: Float) {
              val list = ArrayList<Spark>()
              var tick by mutableIntStateOf(0)
              var alive by mutableStateOf(false)
              fun burst(x: Float, y: Float, n: Int, spread: Float, up: Float) {
                  val r = kotlin.random.Random
                  for (i in 0 until n) {
                      if (list.size > 180) list.removeAt(0)
                      val a = r.nextFloat() * 6.2832f; val sp = r.nextFloat() * spread
                      list.add(Spark(x, y, cos(a) * sp, sin(a) * sp - up, 1.1f + r.nextFloat() * .8f, r.nextInt(3), r.nextInt(2), (6f + r.nextFloat() * 8f) * k))
                  }
                  alive = true
              }
              fun step(dt: Float) {
                  val iter = list.iterator()
                  while (iter.hasNext()) {
                      val s = iter.next()
                      s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += g * dt
                      if (s.life <= 0f) iter.remove()
                  }
                  tick++
              }
          }

          suspend fun runSparks(sys: SparkSys) {
              var last = 0L
              while (sys.list.isNotEmpty()) {
                  withFrameNanos { n ->
                      val dt = if (last == 0L) .016f else ((n - last) / 1000000000f).coerceAtMost(.05f)
                      last = n; sys.step(dt)
                  }
              }
              sys.alive = false
          }

          fun DrawScope.drawSparks(sys: SparkSys, a1: Color, a2: Color) {
              val t = sys.tick
              if (t < 0) return
              for (s in sys.list) {
                  val c = (if (s.hue == 0) a1 else a2).copy(alpha = s.life.coerceIn(0f, 1f))
                  if (s.kind == 0) drawCircle(c, s.sz * .5f, Offset(s.x, s.y))
                  else if (s.kind == 1) heartAt(c, s.x, s.y, s.sz * .5f)
                  else starAt(c, s.x, s.y, s.sz * .5f)
              }
          }

          /** Home background: a trail of hearts / stars / dots follows the finger (never consumes touches). */
          @Composable
          fun SparkBox(mod: Modifier, content: @Composable BoxScope.() -> Unit) {
              val sys = remember { SparkSys(120f, 1.4f) }
              val a1 = T.ac; val a2 = T.ac2
              LaunchedEffect(sys.alive) { if (sys.alive) runSparks(sys) }
              Box(
                  mod.pointerInput(Unit) {
                      awaitPointerEventScope {
                          while (true) {
                              val ev = awaitPointerEvent(PointerEventPass.Initial)
                              val c = ev.changes.firstOrNull()
                              if (c != null && c.pressed && T.an > .01f) sys.burst(c.position.x, c.position.y, 2, 90f, 40f)
                          }
                      }
                  }
              ) {
                  content()
                  Canvas(Modifier.fillMaxSize()) { drawSparks(sys, a1, a2) }
              }
          }

          /** Fountain of hearts / stars from the bottom whenever [trigger] changes. */
          @Composable
          fun Confetti(trigger: Int, mod: Modifier) {
