          // ───────────────────────── canvas guides: symmetry axes + composition grids ─────────────────────────
          val GUIDE_N = listOf("OFF", "THIRDS", "GRID", "GOLDEN", "DIAG")

          @Composable
          fun Guides(e: Engine, sym: Int, n: Int, grid: Int, busy: Boolean) {
              val fade by animateFloatAsState(if (busy) .25f else 1f, label = "gd")
              if (sym == 0 && grid == 0) return
              val ac2 = T.ac2
              Canvas(Modifier.fillMaxSize()) {
                  val vr = e.vrev
                  if (vr < 0) return@Canvas
                  val z = e.zoom; val r = e.rot
                  val wv = e.vw.toFloat(); val hv = e.vh.toFloat()
                  val cw = e.W.toFloat(); val ch = e.H.toFloat()
                  val s = minOf(wv / cw, hv / ch) * z
                  val cr = cos(r); val sr = sin(r)
                  val ox = wv / 2f + e.px; val oy = hv / 2f + e.py
                  fun pt(cx: Float, cy: Float): Offset {
                      val u = (cx - cw / 2f) * s; val v = (ch / 2f - cy) * s
                      return Offset(ox + cr * u - sr * v, oy + sr * u + cr * v)
                  }
                  val dash = PathEffect.dashPathEffect(floatArrayOf(16f, 12f), 0f)
                  fun ln2(a: Offset, b: Offset, c: Color, w: Float, dashed: Boolean) =
                      drawLine(c, a, b, strokeWidth = w, cap = StrokeCap.Round, pathEffect = if (dashed) dash else null)
                  val col = ac2.copy(alpha = .8f * fade)
                  if (sym == 1 || sym == 3) ln2(pt(cw / 2f, -ch), pt(cw / 2f, 2f * ch), col, 3f, true)
                  if (sym == 2 || sym == 3) ln2(pt(-cw, ch / 2f), pt(2f * cw, ch / 2f), col, 3f, true)
                  if (sym == 4) {
                      val rr = hypot(cw, ch)
                      val c0 = pt(cw / 2f, ch / 2f)
                      for (k in 0 until n) {
                          val t = 6.2832f * k / n
                          ln2(c0, pt(cw / 2f + rr * cos(t), ch / 2f + rr * sin(t)), col, 3f, true)
                      }
                      drawCircle(col, 7f, c0)
                  }
                  val gc = Color.White.copy(alpha = .4f * fade)
                  if (grid == 1) {
                      for (i in 1..2) {
                          ln2(pt(cw * i / 3f, 0f), pt(cw * i / 3f, ch), gc, 2f, false)
                          ln2(pt(0f, ch * i / 3f), pt(cw, ch * i / 3f), gc, 2f, false)
                      }
                  } else if (grid == 2) {
                      val g = maxOf(cw, ch) / 8f
                      var x = g
                      while (x < cw - 1f) { ln2(pt(x, 0f), pt(x, ch), gc, 1.5f, false); x += g }
                      var y = g
                      while (y < ch - 1f) { ln2(pt(0f, y), pt(cw, y), gc, 1.5f, false); y += g }
                  } else if (grid == 3) {
                      val k = .381966f
                      ln2(pt(cw * k, 0f), pt(cw * k, ch), gc, 2f, false); ln2(pt(cw * (1f - k), 0f), pt(cw * (1f - k), ch), gc, 2f, false)
                      ln2(pt(0f, ch * k), pt(cw, ch * k), gc, 2f, false); ln2(pt(0f, ch * (1f - k)), pt(cw, ch * (1f - k)), gc, 2f, false)
                  } else if (grid == 4) {
                      ln2(pt(0f, 0f), pt(cw, ch), gc, 2f, false); ln2(pt(0f, ch), pt(cw, 0f), gc, 2f, false)
                      ln2(pt(cw / 2f, 0f), pt(cw / 2f, ch), gc, 1.5f, false); ln2(pt(0f, ch / 2f), pt(cw, ch / 2f), gc, 1.5f, false)
                  }
              }
          }

          @Composable
          fun ViewChip(e: Engine) {
              val moved by remember { derivedStateOf { e.rot != 0f || e.zoom != 1f } }
              AnimatedVisibility(visible = moved, enter = fadeIn(), exit = fadeOut()) {
