          class Cfg(val w: Int, val h: Int, val paper: Int, val pat: Int, val layers: Int, val budget: Int)

          val ASP = listOf("1:1" to 1f, "4:3" to 4f / 3f, "3:2" to 1.5f, "16:9" to 16f / 9f, "3:4" to .75f, "2:3" to 2f / 3f, "9:16" to 9f / 16f)
          val PAPERS = listOf(0xFFFFFFFFL, 0xFFFFF4E0L, 0xFFFFE3EEL, 0xFFDFF7EAL, 0xFFE3F1FFL, 0xFF1A141CL, 0x00FFFFFFL)
          val PAPER_PATS = listOf("NONE" to 0, "DOTS" to 1, "GRID" to 2, "CHECK" to 6, "HEARTS" to 4, "STARS" to 5)
          val SAYS = listOf("hi! i'm mochi", "let's draw something cute", "tap tap tap~", "i believe in your art!", "snacks first?", "psst... try the fx")

          fun r256(x: Float): Int = max(256, ((x + 128f) / 256f).toInt() * 256)
          fun dimsOf(long: Int, ratio: Float): Pair<Int, Int> = if (ratio >= 1f) Pair(long, r256(long / ratio)) else Pair(r256(long * ratio), long)
          fun layersCap(w: Int, h: Int, ramMb: Int): Int {
              val lm = w * h * 4f / 1048576f
              val budget = (ramMb * .22f).coerceIn(150f, 1400f)
              return (budget / lm - 4f).toInt().coerceIn(3, 32)
          }
          fun rawText(i: Int, v: Float): String = when (i) {
              0 -> "%.1f Gpx/s".format(v / 1000f)
              1 -> "%.0f k/s".format(v)
              2 -> "%.0f Mpx/s".format(v)
              3 -> "%.0f MB/s".format(v)
              4 -> "%.0f M/s".format(v)
              else -> "%.1f GB".format(v)
          }

          fun DrawScope.heartAt(c: Color, x: Float, y: Float, r: Float) {
              drawCircle(c, r * .55f, Offset(x - r * .5f, y - r * .2f)); drawCircle(c, r * .55f, Offset(x + r * .5f, y - r * .2f))
              val p = Path(); p.moveTo(x - r * 1.02f, y); p.lineTo(x, y + r); p.lineTo(x + r * 1.02f, y); p.close(); drawPath(p, c)
          }
          fun DrawScope.starAt(c: Color, x: Float, y: Float, r: Float) {
              val p = Path(); p.moveTo(x, y - r * 1.4f); p.lineTo(x + r * .35f, y - r * .35f); p.lineTo(x + r * 1.4f, y); p.lineTo(x + r * .35f, y + r * .35f)
              p.lineTo(x, y + r * 1.4f); p.lineTo(x - r * .35f, y + r * .35f); p.lineTo(x - r * 1.4f, y); p.lineTo(x - r * .35f, y - r * .35f); p.close(); drawPath(p, c)
          }

          /** Drifting hearts / stars / bubbles; loops seamlessly (integer speeds). Animation is read in the draw phase only. */
          @Composable
          fun Floaters(mod: Modifier) {
              val ts = loopState(50000, "fl")
              val a1 = T.ac; val a2 = T.ac2
              Canvas(mod) {
                  val t = ts.value
                  for (i in 0 until 26) {
                      val h1 = ((i * 7919) % 1000) / 1000f; val h2 = ((i * 104729) % 997) / 997f
                      val k = 1 + i % 3
                      val x = size.width * h2 + sin(t * 6.2832f * (2 + i % 3) + i) * 14f
                      val y = size.height * (1f - ((h1 + t * k) % 1f))
                      val r = 6f + h2 * 14f
                      val c = (if (i % 2 == 0) a1 else a2).copy(alpha = .14f + h1 * .14f)
                      when (i % 4) {
                          0 -> drawCircle(c, r, Offset(x, y))
                          1 -> drawCircle(c, r, Offset(x, y), style = Stroke(2.5f))
                          2 -> heartAt(c, x, y, r)
                          else -> starAt(c, x, y, r)
                      }
                  }
              }
          }

          @Composable
          fun Title() {
              val ts = loopState(2400, "tt")
              Row {
                  "mochi canvas".forEachIndexed { i, ch ->
                      Text(
                          ch.toString(), color = if (i % 2 == 0) T.ac else T.ac2, fontSize = (30f * T.sc).sp, fontFamily = FONTS[T.fnt.toInt().coerceIn(0, FONTS.size - 1)],
                          letterSpacing = T.ls.sp,
                          modifier = Modifier.graphicsLayer { translationY = sin(ts.value * 6.2832f + i * .55f) * 5f * density }
                      )
                  }
              }
          }

          @Composable
          fun BarRow(name: String, v: Float, label: String) {
              val a by animateFloatAsState(v, spring(.7f, 120f), label = "bar")
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Tx(name, T.ink.copy(alpha = .8f), Modifier.width(d(50f)), 10f)
                  Box(Modifier.weight(1f).height(d(12f)).clip(RoundedCornerShape(50)).background(T.panel2)) {
                      Box(Modifier.fillMaxWidth(a.coerceIn(.03f, 1f)).fillMaxHeight().background(Brush.horizontalGradient(listOf(T.ac2, T.ac))))
                  }
                  Tx(label, T.ink, Modifier.width(d(76f)), 9f)
              }
          }

          @Composable
          fun BenchCard(st: BenchState, rerun: () -> Unit) {
              val r = st.res
              var more by remember { mutableStateOf(false) }
              Column(
                  Modifier.fillMaxWidth().glass().animateContentSize().padding(d(12f)),
                  verticalArrangement = Arrangement.spacedBy(d(7f))
              ) {
                  if (st.running || r == null) {
                      Tx(if (st.running) "measuring your device..." else "no benchmark yet", T.ac)
                      for (i in 0 until 6) BarRow(BN[i], st.bars[i], if (i < st.stage) "done" else if (i == st.stage && st.running) "running" else "")
                  } else {
                      val tier = TIERS[r.tier]
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                          Canvas(Modifier.size(d(110f), d(22f))) {
                              val n = r.score / 20f
                              for (i in 0..4) starAt(if (n > i + .4f) T.ac else T.panel2, size.height * .7f + i * size.height * 1.15f, size.height / 2f, size.height * .3f)
                          }
                          Tx(tier.name + "  " + r.score + "/100", T.ac, sz = 13f)
                      }
                      Tx(tier.tag + "  -  " + r.gpu, T.ink.copy(alpha = .7f), sz = 9f)
                      for (i in 0 until 6) BarRow(BN[i], r.sc[i], rawText(i, r.raw[i]))
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                          Pill(if (more) "HIDE SPECS" else "SPECS", more, Ik.CV, if (more) 1f else 0f) { more = !more }
                          Pill("RE-RUN", false, Ik.FX) { rerun() }
                      }
                      if (more) {
                          for (i in 0 until 6) {
                              val s = if (r.raw[i] >= BREC[i]) 2 else if (r.raw[i] >= BMIN[i]) 1 else 0
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                                  Tx(BN[i], T.ink, Modifier.width(d(50f)), 10f)
                                  Tx("need " + rawText(i, BMIN[i]) + "  best " + rawText(i, BREC[i]), T.ink.copy(alpha = .6f), Modifier.weight(1f), 8f)
                                  Tx(
                                      listOf("LOW", "OK", "GREAT")[s], T.dk,
                                      Modifier.clip(RoundedCornerShape(50)).background(listOf(Color(0xFFFF6B8B), Color(0xFFFFD86B), Color(0xFF7BE495))[s]).padding(horizontal = d(8f), vertical = d(2f)), 9f
                                  )
                              }
                          }
                          Tx("GL " + r.api + "  max tex " + r.maxTex + "  cores " + r.cores, T.ink.copy(alpha = .5f), sz = 8f)
                      }
                  }
              }
          }

          @Composable
          fun NewCanvas(res: BenchRes?, ramMb: Int, onStart: (Cfg) -> Unit) {
              val rec = res?.tier ?: 1
              var sizeI by remember { mutableIntStateOf(rec) }
              var asp by remember { mutableIntStateOf(0) }
              var paperI by remember { mutableIntStateOf(0) }
              var patI by remember { mutableIntStateOf(0) }
              val (w, h) = dimsOf(SIZES[sizeI], ASP[asp].second)
              val cap = layersCap(w, h, ramMb)
              val mbs = "%.0f".format(w * h * 4f / 1048576f)
              val verdict = if (sizeI <= rec) "smooth for your device" else if (sizeI == rec + 1) "ok, heavy fx may lag" else "heavy! expect lag"
              val vc = if (sizeI <= rec) Color(0xFF7BE495) else if (sizeI == rec + 1) Color(0xFFFFD86B) else Color(0xFFFF6B8B)
              Tx("CANVAS SIZE" + (if (res != null) "   (* = best for you)" else ""), T.ac, sz = 10f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  for (i in SIZES.indices) Pill(SIZE_N[i] + " " + SIZES[i] + (if (res != null && i == rec) " *" else ""), sizeI == i) { sizeI = i }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  ASP.forEachIndexed { i, a -> Pill(a.first, asp == i) { asp = i } }
              }
              Tx("" + w + " x " + h + " px  -  ~" + cap + " layers  -  " + mbs + " MB per layer", T.ink, sz = 10f)
              Tx(verdict, vc, sz = 11f)
              Tx("PAPER", T.ac, sz = 10f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PAPERS.forEachIndexed { i, c ->
                      Bub(38f, paperI == i, anim = false, pad = .2f, f = { paperI = i }) {
                          drawCircle(Color(c))
                          if (c == 0x00FFFFFFL) {
                              drawCircle(Color.White, size.minDimension / 2f, style = Stroke(2f))
                              drawLine(Color(0xFFFF6B8B), Offset(size.width * .15f, size.height * .85f), Offset(size.width * .85f, size.height * .15f), 3f)
                          }
                      }
                  }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PAPER_PATS.forEachIndexed { i, pp -> Pill(pp.first, patI == i) { patI = i } }
              }
              Pill("START DRAWING", true, Ik.BR) { onStart(Cfg(w, h, PAPERS[paperI].toInt(), PAPER_PATS[patI].second, cap, TIERS[rec.coerceIn(0, 4)].budget)) }
          }

          @Composable
          fun Home(st: BenchState, onStart: (Cfg) -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var sheet by remember { mutableIntStateOf(0) }
              var lastS by remember { mutableIntStateOf(1) }
              var mood by remember { mutableIntStateOf(0) }
              var say by remember { mutableStateOf(greet()) }
              val res = st.res
              val ram = remember { (ramGb(ctx) * 1024f).toInt() }
              val fl = loopState(3000, "fl2")
              fun rerun() {
                  for (i in 0 until 6) st.bars[i] = 0f
                  st.stage = 0; st.res = null; st.key++; st.running = true
              }
              SideEffect { if (sheet != 0) lastS = sheet }
              LaunchedEffect(Unit) { if (st.res == null && !st.running) rerun() }
              LaunchedEffect(st.running) {
                  if (st.running) {
                      mood = 2; say = "measuring your device..."
                      delay(15000)
                      if (st.running) { st.res = fallbackRes(ctx); st.running = false }
                  } else {
                      val r0 = st.res
                      if (r0 != null) { mood = 3; say = "you're a " + TIERS[r0.tier].name.lowercase() + "!"; delay(2600); mood = 0 }
                  }
              }
              SparkBox(Modifier.fillMaxSize().background(Color.Black)) {
                  Floaters(Modifier.fillMaxSize())
                  if (st.running) key(st.key) {
                      AndroidView({ BenchView(ctx, st) { r -> st.res = r; st.running = false; saveBench(ctx, r) } }, Modifier.size(2.dp))
                  }
                  Column(
                      Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().verticalScroll(rememberScrollState()).padding(d(16f)),
                      horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(d(10f))
                  ) {
                      Spacer(Modifier.height(d(14f)))
                      Title()
                      Box(Modifier.graphicsLayer { translationY = sin(fl.value * 6.2832f) * 5f * density }) {
                          Mascot(mood, 132f, if (res != null) intArrayOf(1, 2, 3, 4, 5)[res.tier] else 0) {
                              say = SAYS[(System.currentTimeMillis() % SAYS.size).toInt()]; mood = 1
                              scope.launch { delay(1300); mood = if (st.running) 2 else 0 }
                          }
                      }
                      Tx(say, T.dk, Modifier.clip(RoundedCornerShape(50)).background(T.ac).padding(horizontal = d(14f), vertical = d(6f)), 11f)
                      if (res != null && !st.running) Tx(TIERS[res.tier].name + " tier  -  " + res.score + "/100", T.ac2, sz = 12f)
                      Row(horizontalArrangement = Arrangement.spacedBy(d(8f)), verticalAlignment = Alignment.CenterVertically) {
                          Pill("NEW ART", sheet == 1, Ik.PL) { sheet = if (sheet == 1) 0 else 1 }
                          Pill("STYLE", sheet == 2, Ik.TH) { sheet = if (sheet == 2) 0 else 2 }
                          Pill("IDEA", false, Ik.DC) { say = idea(); mood = 1; scope.launch { delay(2800); mood = if (st.running) 2 else 0 } }
                      }
                      AnimatedVisibility(
                          visible = sheet != 0,
                          enter = fadeIn() + scaleIn(spring(.55f, 380f), initialScale = .92f, transformOrigin = TransformOrigin(.5f, 0f)) + expandVertically(),
                          exit = fadeOut() + scaleOut(targetScale = .94f, transformOrigin = TransformOrigin(.5f, 0f)) + shrinkVertically()
                      ) {
                          Column(
                              Modifier.fillMaxWidth().glass(key = lastS).animateContentSize().padding(d(12f)),
                              verticalArrangement = Arrangement.spacedBy(d(8f))
                          ) {
                              if (lastS == 1) NewCanvas(res, ram, onStart)
                              else ThemePanel { T.save(ctx.getSharedPreferences("t", 0)); sheet = 0 }
                          }
                      }
                      BenchCard(st) { rerun() }
                      Spacer(Modifier.height(d(16f)))
                  }
              }
          }
          EOF_SRC
      - uses: actions/cache@v4
        with: {path: ~/ks, key: "ks-${{github.repository}}"}
      - env:
          B: ${{secrets.KS_B64}}
          P: ${{secrets.KS_PASS || 'ci-dev-key'}}
          A: ${{secrets.KS_ALIAS || 'k'}}
        run: |
          V=0.$(date -u +%y%m%d).$GITHUB_RUN_NUMBER
          gradle -q :app:assembleRelease -PversionCode=$((1000+GITHUB_RUN_NUMBER)) -PversionName=$V
          mkdir -p ~/ks dist; K=~/ks/k.jks
          [ -n "$B" ] && echo "$B"|base64 -d >$K
          [ -f $K ] || keytool -genkeypair -keystore $K -alias $A -keyalg RSA -keysize 3072 -validity 36500 -storepass "$P" -keypass "$P" -dname CN=$N
          T=$(ls -d $ANDROID_HOME/build-tools/*|sort -V|tail -1)
          $T/zipalign -fp 4 app/build/outputs/apk/release/*.apk a.apk
          $T/apksigner sign --ks $K --ks-key-alias $A --ks-pass env:P --key-pass env:P --out dist/$N-$V.apk a.apk
          echo "V=$V" >>$GITHUB_ENV
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{github.token}}"}
        run: |
          R=nightly F=-p; [ $GITHUB_REF_TYPE = tag ] && R=$GITHUB_REF_NAME F=
          [ $R = nightly ] && gh release delete nightly --cleanup-tag -y || true
          gh release create $R dist/* -t "$N $V" -n "build $GITHUB_RUN_NUMBER" --target $GITHUB_SHA $F
