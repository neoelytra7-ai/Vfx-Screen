name: Build HexNPU APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/checkout@v4
      - name: Signing key (created once, committed, reused so updates install over the old app)
        run: |
          if [ ! -f hexnpu.keystore ]; then
            keytool -genkeypair -keystore hexnpu.keystore -storepass hexnpu123 -keypass hexnpu123 -alias hexnpu -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=HexNPU"
            git config user.name github-actions; git config user.email actions@github.com
            git add hexnpu.keystore; git commit -m "Add signing key [skip ci]"; git push
          fi
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          P=app/src/main/java/com/example/hexnpu
          mkdir -p $P
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HexNPU"
          include(":app")
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              signingConfigs { create("rel") { storeFile = rootProject.file("hexnpu.keystore"); storePassword = "hexnpu123"; keyAlias = "hexnpu"; keyPassword = "hexnpu123" } }
              buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("rel") } }
              namespace = "com.example.hexnpu"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.hexnpu"; minSdk = 29; targetSdk = 34; versionCode = (System.getenv("VC") ?: "1").toInt(); versionName = "1." + (System.getenv("VC") ?: "0")
                  ndk { abiFilters += "arm64-v8a" }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              // DSP must read the Skel .so files from disk, so they have to be extracted
              packaging { jniLibs { useLegacyPackaging = true; pickFirsts += "**/libc++_shared.so" } }
          }
          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android-qnn:1.23.2")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <application android:label="HexNPU"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <uses-native-library android:name="libcdsprpc.so" android:required="false"/>
                  <uses-native-library android:name="libadsprpc.so" android:required="false"/>
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/Sh.kt <<'EOF'
          package com.example.hexnpu

          object Sh {
              fun su(cmd: String): String = try {
                  val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                  val o = p.inputStream.bufferedReader().readText(); p.waitFor(); o.trim()
              } catch (e: Exception) { "su failed: ${e.message}" }

              val PROBE = """
              echo "SoC: $(getprop ro.soc.model) / platform $(getprop ro.board.platform) (SD8G1 = taro / SM8450)"
              echo "Magisk: $(magisk -v 2>&1) ($(magisk -V 2>&1))"
              echo "SELinux: $(getenforce)"
              echo "-- FastRPC nodes"; ls -l /dev | grep -i rpc
              echo "-- remoteproc"; for f in /sys/class/remoteproc/*; do echo "${'$'}(cat ${'$'}f/name): ${'$'}(cat ${'$'}f/state)"; done
              echo "-- vendor libcdsprpc"; ls /vendor/lib64/libcdsprpc.so 2>&1
              echo "-- DSP lib dirs"; ls /vendor/lib/rfsa/adsp /vendor/dsp/cdsp 2>&1 | head -25
              """.trimIndent()
          }
          EOF
          cat > $P/Npu.kt <<'EOF'
          package com.example.hexnpu

          import ai.onnxruntime.*
          import android.content.Context
          import android.system.Os
          import java.io.File
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object Npu {
              /** SM8450 (SD8 Gen 1) = Hexagon v69, soc_model 36 */
              private val HTP = mapOf(
                  "backend_path" to "libQnnHtp.so", "htp_arch" to "69", "soc_model" to "36",
                  "htp_performance_mode" to "burst", "enable_htp_fp16_precision" to "1")

              @Volatile var lastBackend = ""
              fun prepEnv(ctx: Context) {
                  val n = ctx.applicationInfo.nativeLibraryDir
                  Os.setenv("ADSP_LIBRARY_PATH", "$n;/vendor/lib/rfsa/adsp;/vendor/dsp/cdsp;/system/lib/rfsa/adsp", true)
              }

              /** Fixed shapes let ORT constant-fold the shape math before QNN partitions the graph. */
              fun fix(o: OrtSession.SessionOptions) {
                  // Only public API is used: if this ORT build exposes a free-dimension override, apply it; otherwise do nothing.
                  val m = o.javaClass.methods.firstOrNull { it.name.startsWith("addFreeDimensionOverride") && it.parameterTypes.size == 2 && it.parameterTypes[0] == String::class.java } ?: return
                  for ((k, v) in mapOf("batch_size" to 1L, "num_channels" to 3L, "height" to 224L, "width" to 224L, "sequence_length" to 77L))
                      try { m.invoke(o, k, v) } catch (_: Throwable) {}
              }
              fun cpu(env: OrtEnvironment, path: String): OrtSession {
                  val o = OrtSession.SessionOptions(); fix(o); return env.createSession(path, o)
              }

              /** Opens a model on the HTP NPU (caches the compiled graph), falls back to CPU if every attempt fails. */
              fun open(env: OrtEnvironment, path: String, log: (String) -> Unit): OrtSession {
                  val ctx = "$path.v2.ctx.onnx"; File("$path.ctx.onnx").delete()
                  val tries = if (File(ctx).exists()) listOf(ctx to false) else listOf(path to true, path to false)
                  for ((p, dump) in tries) try {
                      val o = OrtSession.SessionOptions(); fix(o); o.addQnn(HTP)
                      if (dump) { o.addConfigEntry("ep.context_enable", "1"); o.addConfigEntry("ep.context_file_path", ctx) }
                      val s = env.createSession(p, o)
                      lastBackend = "HTP"; log("HTP session ok: ${File(p).name}${if (dump) " (compiled graph cached)" else ""}"); return s
                  } catch (e: Throwable) {
                      log("HTP attempt failed: ${e.message?.take(150)}"); if (p == ctx) File(ctx).delete()
                  }
                  log("-> CPU fallback for ${File(path).name}")
                  lastBackend = "CPU"; return cpu(env, path)
              }

              /** Proves where the model really runs: per-node provider counts from ORT's profiler + wall time vs CPU time vs a CPU-only baseline. */
              fun verify(ctx: Context, log: (String) -> Unit) {
                  prepEnv(ctx)
                  val env = OrtEnvironment.getEnvironment()
                  val path = File(ctx.filesDir, "clip16/vision.onnx").path
                  val cx = "$path.v2.ctx.onnx"
                  fun mk(s: OrtSession): HashMap<String, OnnxTensor> {
                      val m = HashMap<String, OnnxTensor>()
                      for ((n, ni) in s.inputInfo) {
                          val ti = ni.info as TensorInfo
                          val shape = ti.shape.let { r -> if (r.size == 4 && r[1] <= 0 && r[2] <= 0 && r[3] <= 0) longArrayOf(1, 3, 224, 224) else r.map { if (it <= 0) 1L else it }.toLongArray() }
                          val sz = when (ti.type) { OnnxJavaType.INT64, OnnxJavaType.DOUBLE -> 8
                              OnnxJavaType.UINT8, OnnxJavaType.INT8, OnnxJavaType.BOOL -> 1; OnnxJavaType.FLOAT16 -> 2; else -> 4 }
                          val b = ByteBuffer.allocateDirect(shape.fold(1L) { a, x -> a * x }.toInt() * sz).order(ByteOrder.nativeOrder())
                          m[n] = OnnxTensor.createTensor(env, b, shape, ti.type)
                      }
                      return m
                  }
                  fun time(s: OrtSession, n: Int): Pair<Double, Double> {
                      val ins = mk(s); repeat(2) { s.run(ins).close() }
                      val c0 = android.os.Process.getElapsedCpuTime(); val t0 = System.nanoTime()
                      repeat(n) { s.run(ins).close() }
                      val wall = (System.nanoTime() - t0) / 1e6; val cpu = (android.os.Process.getElapsedCpuTime() - c0).toDouble()
                      ins.values.forEach { it.close() }
                      return wall / n to cpu / wall * 100
                  }
                  log("verify: running vision model on HTP (15 runs)...")
                  val o = OrtSession.SessionOptions(); fix(o); o.addQnn(HTP); o.enableProfiling(File(ctx.cacheDir, "prof").path)
                  val s = env.createSession(if (File(cx).exists()) cx else path, o)
                  val (nm, nc) = time(s, 15)
                  val cnt = Regex("\"provider\"\\s*:\\s*\"(\\w+)\"").findAll(File(s.endProfiling()).readText()).groupingBy { it.groupValues[1] }.eachCount()
                  s.close()
                  val q = cnt.filterKeys { it.contains("QNN", true) }.values.sum(); val c = cnt["CPUExecutionProvider"] ?: 0
                  log("NPU path: ${"%.1f".format(nm)} ms/img, process CPU use ${"%.0f".format(nc)}% (100% = 1 core)")
                  log("kernel events -> NPU(QNN): $q, CPU: $c  $cnt")
                  log("verify: CPU-only baseline (5 runs)...")
                  val cs = cpu(env, path); val (cm, cc) = time(cs, 5); cs.close()
                  log("CPU only: ${"%.1f".format(cm)} ms/img, CPU use ${"%.0f".format(cc)}%")
                  log(if (q > 0 && nm < cm) "VERDICT: NPU is used, ${"%.1f".format(cm / nm)}x faster than CPU. $c CPU kernel events per 15 runs = ops that fell back."
                      else if (q > 0) "VERDICT: NPU runs part of the graph but is not faster than CPU (many ops fall back)."
                      else "VERDICT: no NPU kernels ran. Model is effectively on CPU.")
              }

              fun bench(ctx: Context, model: String, log: (String) -> Unit) {
                  prepEnv(ctx)
                  val env = OrtEnvironment.getEnvironment()
                  val cpu = run(env, model, null, 5, log)
                  log("CPU: ${"%.2f".format(cpu)} ms/run")
                  // strict = fail instead of silently falling back to CPU, so a pass proves 100% NPU
                  for (strict in listOf(true, false)) {
                      try {
                          val t = run(env, model, strict, 20, log)
                          log("HTP (${if (strict) "strict, all nodes on NPU" else "partial, CPU fallback allowed"}): ${"%.2f".format(t)} ms/run  -> ${"%.1f".format(cpu / t)}x")
                          return
                      } catch (e: Throwable) { log("HTP ${if (strict) "strict" else "partial"} failed: ${e.message?.take(300)}") }
                  }
              }

              private fun run(env: OrtEnvironment, model: String, strict: Boolean?, n: Int, log: (String) -> Unit): Double {
                  val o = OrtSession.SessionOptions()
                  if (strict != null) {
                      if (strict) o.addConfigEntry("session.disable_cpu_ep_fallback", "1")
                      o.addQnn(HTP)
                  }
                  env.createSession(model, o).use { s ->
                      val ins = HashMap<String, OnnxTensor>()
                      for ((name, ni) in s.inputInfo) {
                          val ti = ni.info as TensorInfo
                          val shape = ti.shape.let { r -> if (r.size == 4 && r[1] <= 0 && r[2] <= 0 && r[3] <= 0) longArrayOf(1, 3, 224, 224) else r.map { if (it <= 0) 1L else it }.toLongArray() }
                          val cnt = shape.fold(1L) { a, b -> a * b }.toInt()
                          val sz = when (ti.type) { OnnxJavaType.INT64, OnnxJavaType.DOUBLE -> 8
                              OnnxJavaType.UINT8, OnnxJavaType.INT8, OnnxJavaType.BOOL -> 1
                              OnnxJavaType.FLOAT16 -> 2; else -> 4 }
                          val b = ByteBuffer.allocateDirect(cnt * sz).order(ByteOrder.nativeOrder())
                          ins[name] = OnnxTensor.createTensor(env, b, shape, ti.type)
                      }
                      repeat(3) { s.run(ins).close() }
                      val t0 = System.nanoTime()
                      repeat(n) { s.run(ins).close() }
                      ins.values.forEach { it.close() }
                      return (System.nanoTime() - t0) / 1e6 / n
                  }
              }
          }
          EOF
          cat > $P/Clip.kt <<'EOF'
          package com.example.hexnpu

          import ai.onnxruntime.*
          import android.content.ContentUris
          import android.content.Context
          import android.graphics.Bitmap
          import android.provider.MediaStore
          import android.util.Size
          import org.json.JSONObject
          import java.io.*
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          /** CLIP ViT-B/32: image + text encoders on the NPU, cosine search over a local index. */
          object Clip {
              private const val BASE = "https://huggingface.co/Xenova/clip-vit-base-patch16/resolve/main/"
              private val FILES = listOf("onnx/vision_model.onnx" to "vision.onnx", "onnx/text_model.onnx" to "text.onnx",
                  "vocab.json" to "vocab.json", "merges.txt" to "merges.txt")
              private val MEAN = floatArrayOf(0.48145466f, 0.4578275f, 0.40821073f)
              private val STD = floatArrayOf(0.26862954f, 0.26130258f, 0.27577711f)
              private lateinit var dir: File
              private lateinit var tok: Tok
              private lateinit var vis: OrtSession
              private lateinit var txt: OrtSession
              private val env: OrtEnvironment by lazy { OrtEnvironment.getEnvironment() }
              private val ids = ArrayList<Long>()
              private val vecs = ArrayList<FloatArray>()
              @Volatile var ready = false

              fun download(ctx: Context, log: (String) -> Unit) {
                  File(ctx.filesDir, "clip").deleteRecursively()
              dir = File(ctx.filesDir, "clip16").apply { mkdirs() }
                  for ((remote, local) in FILES) {
                      val f = File(dir, local)
                      if (f.length() > 0) { log("have $local"); continue }
                      val c = URL(BASE + remote).openConnection() as HttpURLConnection
                      c.connectTimeout = 20000; c.readTimeout = 30000
                      val total = c.contentLengthLong; val tmp = File(dir, "$local.part"); var last = -1
                      c.inputStream.use { i -> tmp.outputStream().use { o ->
                          val buf = ByteArray(1 shl 16); var n = 0L
                          while (true) {
                              val r = i.read(buf); if (r < 0) break
                              o.write(buf, 0, r); n += r
                              val pct = if (total > 0) (n * 10 / total).toInt() * 10 else 0
                              if (pct != last) { last = pct; log("$local $pct%") }
                          }
                      } }
                      tmp.renameTo(f)
                  }
                  log("download done")
              }

              fun open(ctx: Context, log: (String) -> Unit) {
                  Npu.prepEnv(ctx); logger = log
                  dir = File(ctx.filesDir, "clip16")
                  tok = Tok(File(dir, "vocab.json").readText(), File(dir, "merges.txt").readText())
                  log("loading vision model (first NPU compile can take minutes, cached after)...")
                  vis = Npu.open(env, File(dir, "vision.onnx").path, log)
                  log("loading text model...")
                  txt = Npu.open(env, File(dir, "text.onnx").path, log)
                  ids.clear(); vecs.clear()
                  val f = File(dir, "index.bin")
                  if (f.exists()) DataInputStream(BufferedInputStream(f.inputStream())).use { d ->
                      try { while (true) { val id = d.readLong(); val v = FloatArray(512) { d.readFloat() }; ids.add(id); vecs.add(v) } }
                      catch (_: EOFException) {}
                  }
                  ready = true
                  log("ready, ${ids.size} photos indexed")
              }

              private fun vec(r: OrtSession.Result): FloatArray {
                  val e = r.firstOrNull { it.key.contains("embeds") } ?: r.first()
                  val fb = (e.value as OnnxTensor).floatBuffer
                  val a = FloatArray(fb.remaining()); fb.get(a)
                  val n = Math.sqrt(a.sumOf { (it * it).toDouble() }).toFloat().coerceAtLeast(1e-9f)
                  return FloatArray(a.size) { a[it] / n }
              }

              private fun textVec(q: String): FloatArray {
                  val t = tok.encode(q)
                  val ins = HashMap<String, OnnxTensor>()
                  try {
                      for (n in txt.inputNames) {
                          val b = ByteBuffer.allocateDirect(77 * 8).order(ByteOrder.nativeOrder()).asLongBuffer()
                          for (i in 0 until 77) b.put(if (n.contains("mask")) 1L else t[i])
                          b.rewind()
                          ins[n] = OnnxTensor.createTensor(env, b, longArrayOf(1, 77))
                      }
                      return txt.run(ins).use { vec(it) }
                  } finally { ins.values.forEach { it.close() } }
              }

              private fun imgVec(ctx: Context, id: Long): FloatArray? {
                  val uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id)
                  val bmp = try { ctx.contentResolver.loadThumbnail(uri, Size(224, 224), null) } catch (e: Exception) { return null }
                  val s = minOf(bmp.width, bmp.height)
                  val sq = Bitmap.createBitmap(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s)
                  val r = Bitmap.createScaledBitmap(sq, 224, 224, true).copy(Bitmap.Config.ARGB_8888, false)
                  val px = IntArray(224 * 224); r.getPixels(px, 0, 224, 0, 0, 224, 224)
                  val fb = ByteBuffer.allocateDirect(3 * 224 * 224 * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                  for (ch in 0..2) for (p in px) fb.put((((p shr (16 - 8 * ch)) and 255) / 255f - MEAN[ch]) / STD[ch])
                  fb.rewind()
                  val t = OnnxTensor.createTensor(env, fb, longArrayOf(1, 3, 224, 224))
                  try { return vis.run(mapOf(vis.inputNames.first() to t)).use { vec(it) } } finally { t.close() }
              }

              @Volatile private var logger: (String) -> Unit = {}
              private fun imgVecSafe(ctx: Context, id: Long): FloatArray? = try { imgVec(ctx, id) } catch (e: OrtException) {
                  logger("NPU image run failed (${e.message?.take(120)}), vision model -> CPU")
                  vis = Npu.cpu(env, File(dir, "vision.onnx").path); imgVec(ctx, id)
              }
              private fun textVecSafe(q: String): FloatArray = try { textVec(q) } catch (e: OrtException) {
                  logger("NPU text run failed (${e.message?.take(120)}), text model -> CPU")
                  txt = Npu.cpu(env, File(dir, "text.onnx").path); textVec(q)
              }

              fun index(ctx: Context, log: (String) -> Unit) {
                  val have = synchronized(this) { ids.toHashSet() }
                  val all = ArrayList<Long>()
                  ctx.contentResolver.query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.Images.Media._ID),
                      null, null, MediaStore.Images.Media.DATE_ADDED + " DESC")?.use { while (it.moveToNext()) all.add(it.getLong(0)) }
                  val todo = all.filter { it !in have }
                  log("${all.size} photos, ${todo.size} new")
                  val o = DataOutputStream(BufferedOutputStream(FileOutputStream(File(dir, "index.bin"), true)))
                  val t0 = System.nanoTime()
                  todo.forEachIndexed { i, id ->
                      val v = imgVecSafe(ctx, id) ?: return@forEachIndexed
                      if (v.size != 512) { log("unexpected embedding size ${v.size}, stopping"); o.close(); return }
                      o.writeLong(id); v.forEach { o.writeFloat(it) }
                      synchronized(this) { ids.add(id); vecs.add(v) }
                      if (i % 25 == 24) { o.flush(); log("indexed ${i + 1}/${todo.size} (${"%.1f".format((i + 1) / ((System.nanoTime() - t0) / 1e9))} img/s)") }
                  }
                  o.close(); log("index complete")
              }

              fun search(q: String, k: Int = 30): List<Pair<Long, Float>> {
                  val qa = textVecSafe(q); val qb = textVecSafe("a photo of $q")
                  val sum = FloatArray(qa.size) { qa[it] + qb[it] }
                  val nn = Math.sqrt(sum.sumOf { (it * it).toDouble() }).toFloat().coerceAtLeast(1e-9f)
                  val t = FloatArray(sum.size) { sum[it] / nn }
                  return synchronized(this) {
                      ids.indices.map { i -> ids[i] to vecs[i].indices.sumOf { (vecs[i][it] * t[it]).toDouble() }.toFloat() }
                          .sortedByDescending { it.second }.take(k)
                  }
              }
          }

          /** CLIP byte-level BPE tokenizer. */
          class Tok(vocab: String, merges: String) {
              private val enc = HashMap<String, Int>()
              private val rank = HashMap<String, Int>()
              private val b2u = HashMap<Int, Char>()
              private val pat = Regex("""'s|'t|'re|'ve|'m|'ll|'d|[\p{L}]+|[\p{N}]|[^\s\p{L}\p{N}]+""")
              init {
                  val j = JSONObject(vocab); for (k in j.keys()) enc[k] = j.getInt(k)
                  merges.lines().drop(1).filter { it.isNotBlank() }.take(48894).forEachIndexed { i, l -> rank[l] = i }
                  val bs = ArrayList<Int>(); (33..126).forEach { bs.add(it) }; (161..172).forEach { bs.add(it) }; (174..255).forEach { bs.add(it) }
                  val cs = ArrayList<Int>(bs); var n = 0
                  for (b in 0..255) if (b !in bs) { bs.add(b); cs.add(256 + n); n++ }
                  for (i in bs.indices) b2u[bs[i]] = cs[i].toChar()
              }
              private fun bpe(s: String): List<String> {
                  val w = s.map { it.toString() }.toMutableList(); w[w.size - 1] = w.last() + "</w>"
                  while (w.size > 1) {
                      var best = Int.MAX_VALUE; var bi = -1
                      for (i in 0 until w.size - 1) { val r = rank[w[i] + " " + w[i + 1]]; if (r != null && r < best) { best = r; bi = i } }
                      if (bi < 0) break
                      w[bi] = w[bi] + w[bi + 1]; w.removeAt(bi + 1)
                  }
                  return w
              }
              fun encode(text: String): LongArray {
                  val out = LongArray(77) { 49407L }; out[0] = 49406; var n = 1
                  val t = text.trim().replace(Regex("\\s+"), " ").lowercase()
                  for (m in pat.findAll(t)) {
                      val s = m.value.toByteArray().joinToString("") { b2u[it.toInt() and 255].toString() }
                      for (p in bpe(s)) { if (n >= 76) break; out[n++] = (enc[p] ?: 0).toLong() }
                  }
                  return out
              }
          }
          EOF
          cat > $P/Seg.kt <<'EOF'
          package com.example.hexnpu

          import ai.onnxruntime.*
          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.ImageDecoder
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.graphics.RectF
          import android.graphics.Shader
          import android.net.Uri
          import android.provider.MediaStore
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          /** Subject cutout: IS-Net (high quality, 1024px) on the Hexagon NPU, falling back to U2-Netp if it cannot run. */
          object Seg {
              private class Cfg(val url: String, val file: String, val s: Int, val mean: FloatArray, val std: FloatArray, val lo: Float, val hi: Float, val label: String)
              private val QUALITY = Cfg("https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx", "isnet.onnx", 1024,
                  floatArrayOf(0.485f, 0.456f, 0.406f), floatArrayOf(1f, 1f, 1f), 0.08f, 0.92f, "IS-Net 1024")
              private val FAST = Cfg("https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx", "u2netp.onnx", 320,
                  floatArrayOf(0.485f, 0.456f, 0.406f), floatArrayOf(0.229f, 0.224f, 0.225f), 0.2f, 0.8f, "U2-Netp 320 (fallback)")
              private val sess = HashMap<String, OrtSession>()
              @Volatile var backend = ""
              @Volatile var lastMs = 0L
              @Volatile var model = ""

              fun decode(ctx: Context, id: Long, maxSide: Int = 2560): Bitmap {
                  val src = ImageDecoder.createSource(ctx.contentResolver, uriOf(id))
                  return ImageDecoder.decodeBitmap(src) { dec, info, _ ->
                      var n = 1; val m = maxOf(info.size.width, info.size.height)
                      while (m / n > maxSide) n *= 2
                      dec.setTargetSampleSize(n); dec.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                  }
              }

              private fun ensure(ctx: Context, c: Cfg, log: (String) -> Unit): OrtSession {
                  sess[c.file]?.let { return it }
                  val f = File(ctx.filesDir, "seg/" + c.file); f.parentFile?.mkdirs()
                  if (f.length() == 0L) {
                      val conn = URL(c.url).openConnection() as HttpURLConnection
                      conn.connectTimeout = 20000; conn.readTimeout = 30000
                      val part = File(f.path + ".part")
                      conn.inputStream.use { i -> part.outputStream().use { o -> i.copyTo(o) } }
                      part.renameTo(f)
                  }
                  Npu.prepEnv(ctx)
                  val s = Npu.open(OrtEnvironment.getEnvironment(), f.path, log)
                  backend = Npu.lastBackend; sess[c.file] = s; return s
              }

              private fun infer(ctx: Context, src: Bitmap, c: Cfg, log: (String) -> Unit): Bitmap {
                  val s = ensure(ctx, c, log); val env = OrtEnvironment.getEnvironment(); val n = c.s
                  val px = IntArray(n * n)
                  Bitmap.createScaledBitmap(src, n, n, true).getPixels(px, 0, n, 0, 0, n, n)
                  val fb = ByteBuffer.allocateDirect(3 * n * n * 4).order(ByteOrder.nativeOrder()).asFloatBuffer()
                  for (ch in 0..2) for (p in px) fb.put((((p shr (16 - 8 * ch)) and 255) / 255f - c.mean[ch]) / c.std[ch])
                  fb.rewind()
                  val t = OnnxTensor.createTensor(env, fb, longArrayOf(1, 3, n.toLong(), n.toLong()))
                  val out = FloatArray(n * n)
                  val t0 = System.nanoTime()
                  try { s.run(mapOf(s.inputNames.first() to t)).use { r -> (r.first().value as OnnxTensor).floatBuffer.get(out) } } finally { t.close() }
                  lastMs = (System.nanoTime() - t0) / 1_000_000; model = c.label
                  val mn = out.min(); val mx = out.max()
                  val m = IntArray(out.size) {
                      val q = (((out[it] - mn) / (mx - mn + 1e-6f) - c.lo) / (c.hi - c.lo)).coerceIn(0f, 1f)
                      ((q * q * (3 - 2 * q) * 255).toInt()) shl 24
                  }
                  return Bitmap.createScaledBitmap(Bitmap.createBitmap(m, n, n, Bitmap.Config.ARGB_8888), src.width, src.height, true)
              }

              /** Returns an alpha mask bitmap with the same size as [src]. Quality model first, fast model only if that fails. */
              fun mask(ctx: Context, src: Bitmap, log: (String) -> Unit): Bitmap =
                  try { infer(ctx, src, QUALITY, log) } catch (e: Throwable) { log("quality cutout failed (${e.message?.take(100)}), using fast model"); infer(ctx, src, FAST, log) }

              /** 0 original (null), 1 cutout, 2 blurred background, 3 color pop, 4 gradient background. */
              fun render(orig: Bitmap, mask: Bitmap, mode: Int): Bitmap? {
                  if (mode == 0) return null
                  val w = orig.width; val h = orig.height
                  val cut = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(cut); c.drawBitmap(orig, 0f, 0f, null)
                  c.drawBitmap(mask, 0f, 0f, Paint().apply { xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_IN) })
                  if (mode == 1) return cut
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888); val o = Canvas(out)
                  when (mode) {
                      2 -> {
                          // smooth multi-step blur: repeated halving then repeated doubling avoids the blocky look of one big jump
                          var b = orig; var k = 0
                          while (k < 4 && b.width > 16 && b.height > 16) { b = Bitmap.createScaledBitmap(b, b.width / 2, b.height / 2, true); k++ }
                          while (b.width < w / 2) b = Bitmap.createScaledBitmap(b, minOf(b.width * 2, w), minOf(b.height * 2, h), true)
                          o.drawBitmap(Bitmap.createScaledBitmap(b, w, h, true), 0f, 0f, null)
                      }
                      3 -> o.drawBitmap(orig, 0f, 0f, Paint().apply { colorFilter = ColorMatrixColorFilter(ColorMatrix().apply { setSaturation(0f) }) })
                      else -> o.drawRect(0f, 0f, w.toFloat(), h.toFloat(), Paint().apply {
                          shader = LinearGradient(0f, 0f, w.toFloat(), h.toFloat(), 0xFF8E7CFF.toInt(), 0xFF38E1D0.toInt(), Shader.TileMode.CLAMP) })
                  }
                  o.drawBitmap(cut, 0f, 0f, null)
                  return out
              }

              fun save(ctx: Context, bmp: Bitmap, png: Boolean): Uri? {
                  val v = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "HexNPU_" + System.currentTimeMillis() + if (png) ".png" else ".jpg")
                      put(MediaStore.Images.Media.MIME_TYPE, if (png) "image/png" else "image/jpeg")
                      put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/HexNPU")
                      put(MediaStore.Images.Media.IS_PENDING, 1)
                  }
                  val u = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return null
                  ctx.contentResolver.openOutputStream(u)?.use { bmp.compress(if (png) Bitmap.CompressFormat.PNG else Bitmap.CompressFormat.JPEG, 98, it) }
                  v.clear(); v.put(MediaStore.Images.Media.IS_PENDING, 0); ctx.contentResolver.update(u, v, null, null)
                  return u
              }
          }

          /** Text lines with boxes normalised to 0..1 of the OCR bitmap. */
          class OcrRes(val lines: List<Pair<String, RectF>>, val w: Int, val h: Int, val text: String)

          object Ocr {
              private val rec by lazy { TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS) }
              fun run(bmp: Bitmap, done: (OcrRes?) -> Unit) {
                  rec.process(InputImage.fromBitmap(bmp, 0)).addOnSuccessListener { t ->
                      val ls = t.textBlocks.flatMap { it.lines }.mapNotNull { l ->
                          l.boundingBox?.let { b -> l.text to RectF(b.left / bmp.width.toFloat(), b.top / bmp.height.toFloat(), b.right / bmp.width.toFloat(), b.bottom / bmp.height.toFloat()) }
                      }
                      done(OcrRes(ls, bmp.width, bmp.height, t.text))
                  }.addOnFailureListener { done(null) }
              }
          }
