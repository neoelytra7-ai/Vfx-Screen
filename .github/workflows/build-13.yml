          @Composable fun OcrOverlay(r: OcrRes, onCopy: (String) -> Unit) {
              var shown by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) { shown = true }
              val a by animateFloatAsState(if (shown) 1f else 0f, tween(600), label = "oa")
              fun fit(w: Float, h: Float): Triple<Float, Float, Float> { val s = minOf(w / r.w, h / r.h); return Triple((w - r.w * s) / 2, (h - r.h * s) / 2, s) }
              Canvas(Modifier.fillMaxSize().pointerInput(r) {
                  detectTapGestures { p ->
                      val (ox, oy, s) = fit(size.width.toFloat(), size.height.toFloat())
                      r.lines.firstOrNull { (_, b) -> p.x in (ox + b.left * r.w * s)..(ox + b.right * r.w * s) && p.y in (oy + b.top * r.h * s)..(oy + b.bottom * r.h * s) }?.let { onCopy(it.first) }
                  }
              }) {
                  val (ox, oy, s) = fit(size.width, size.height)
                  r.lines.forEach { (_, b) ->
                      val tl = Offset(ox + b.left * r.w * s, oy + b.top * r.h * s)
                      val sz = Size((b.right - b.left) * r.w * s, (b.bottom - b.top) * r.h * s)
                      drawRoundRect(A2.copy(alpha = 0.16f * a), tl, sz, CornerRadius(6.dp.toPx()))
                      drawRoundRect(A2.copy(alpha = 0.9f * a), tl, sz, CornerRadius(6.dp.toPx()), style = Stroke(1.5.dp.toPx()))
                  }
              }
          }

          /** Pinch + pan zoom (swipes pass to the pager until zoomed), double-tap zoom to the tapped point, single tap toggles chrome. */
          @Composable fun ZoomPage(id: Long, sc: Sc, onZoom: (Boolean) -> Unit, onTap: () -> Unit, content: @Composable () -> Unit) {
              var scale by remember { mutableFloatStateOf(1f) }
              var ox by remember { mutableFloatStateOf(0f) }
              var oy by remember { mutableFloatStateOf(0f) }
              val scope = rememberCoroutineScope()
              LaunchedEffect(scale) { onZoom(scale > 1.02f) }
              Box(Modifier.fillMaxSize()
                  .pointerInput(Unit) {
                      awaitEachGesture {
                          awaitFirstDown(requireUnconsumed = false)
                          do {
                              val ev = awaitPointerEvent()
                              if (ev.changes.count { it.pressed } >= 2 || scale > 1.01f) {
                                  val z = ev.calculateZoom(); val pan = ev.calculatePan(); val c = ev.calculateCentroid(useCurrent = false)
                                  val ns = (scale * z).coerceIn(1f, 6f)
                                  if (c != Offset.Unspecified) {
                                      val d = c - Offset(size.width / 2f, size.height / 2f)
                                      ox = d.x - (d.x - ox) * (ns / scale) + pan.x
                                      oy = d.y - (d.y - oy) * (ns / scale) + pan.y
                                  }
                                  scale = ns
                                  val mx = (scale - 1f) * size.width / 2f; val my = (scale - 1f) * size.height / 2f
                                  ox = ox.coerceIn(-mx, mx); oy = oy.coerceIn(-my, my)
                                  ev.changes.forEach { if (it.positionChanged()) it.consume() }
                              }
                          } while (ev.changes.any { it.pressed })
                      }
                  }
                  .pointerInput(Unit) {
                      detectTapGestures(onTap = { onTap() }, onDoubleTap = { p ->
                          val target = if (scale > 1.05f) 1f else 2.6f
                          val d = p - Offset(size.width / 2f, size.height / 2f)
                          val s0 = scale; val x0 = ox; val y0 = oy
                          val lx = (target - 1f) * size.width / 2f; val ly = (target - 1f) * size.height / 2f
                          val tx = if (target == 1f) 0f else (d.x - (d.x - x0) * (target / s0)).coerceIn(-lx, lx)
                          val ty = if (target == 1f) 0f else (d.y - (d.y - y0) * (target / s0)).coerceIn(-ly, ly)
                          scope.launch { animate(0f, 1f, animationSpec = spring(0.8f, 280f)) { t, _ -> scale = s0 + (target - s0) * t; ox = x0 + (tx - x0) * t; oy = y0 + (ty - y0) * t } }
                      })
                  }) {
                  Box(Modifier.fillMaxSize().graphicsLayer { scaleX = scale; scaleY = scale; translationX = ox; translationY = oy }) {
                      with(sc.st) {
                          AsyncImage(
                              model = ImageRequest.Builder(LocalContext.current).data(uriOf(id)).size(1800).crossfade(250).build(),
                              contentDescription = null, contentScale = ContentScale.Fit,
                              modifier = Modifier.fillMaxSize().sharedElement(rememberSharedContentState("img$id"), sc.av))
                      }
                      content()
                  }
              }
          }

          @Composable fun Viewer(v: Viewing, sc: Sc, close: () -> Unit) {
              val ctx = LocalContext.current; val scope = rememberCoroutineScope(); val hap = LocalHapticFeedback.current
              val clip = LocalClipboardManager.current
              BackHandler(onBack = close)
              val pager = rememberPagerState(v.start) { v.ids.size }
              val cur = v.ids[pager.currentPage]
              val off = remember { Animatable(0f) }
              var crossed by remember { mutableStateOf(false) }
              var zoomed by remember { mutableStateOf(false) }
              var chrome by remember { mutableStateOf(true) }
              var mode by remember { mutableIntStateOf(0) }
              var ocr by remember(cur) { mutableStateOf<OcrRes?>(null) }
              var ocrBusy by remember(cur) { mutableStateOf(false) }
              var orig by remember(cur) { mutableStateOf<Bitmap?>(null) }
              var mask by remember(cur) { mutableStateOf<Bitmap?>(null) }
              var edMode by remember(cur) { mutableIntStateOf(1) }
              var edBusy by remember(cur) { mutableStateOf(false) }
              var info by remember(cur) { mutableStateOf("") }
              var toast by remember { mutableStateOf("") }
              var lastToast by remember { mutableStateOf("") }
              LaunchedEffect(cur) { mode = 0 }
              LaunchedEffect(toast) { if (toast.isNotEmpty()) { lastToast = toast; delay(1500); toast = "" } }
              val result by produceState<Bitmap?>(null, orig, mask, edMode) {
                  val o = orig; val m = mask
                  value = if (o != null && m != null) withContext(Dispatchers.Default) { Seg.render(o, m, edMode) } else null
              }
              fun copy(t: String, msg: String) { clip.setText(AnnotatedString(t)); toast = msg; hap.performHapticFeedback(HapticFeedbackType.LongPress) }
              fun doText() {
                  if (mode == 1) { mode = 0; return }
                  mode = 1
                  if (ocr == null && !ocrBusy) {
                      ocrBusy = true
                      scope.launch {
                          val b = withContext(Dispatchers.IO) { Seg.decode(ctx, cur, 2000) }
                          Ocr.run(b) { r -> ocr = r; ocrBusy = false; if (r != null && r.lines.isNotEmpty()) hap.performHapticFeedback(HapticFeedbackType.LongPress) }
                      }
                  }
              }
              fun doEdit() {
                  if (mode == 2) { mode = 0; return }
                  mode = 2
                  if (mask == null && !edBusy) {
                      edBusy = true
                      scope.launch {
                          try {
                              val r = withContext(Dispatchers.Default) { val b = Seg.decode(ctx, cur); b to Seg.mask(ctx, b) { } }
                              orig = r.first; mask = r.second; info = "${Seg.backend} \u00b7 ${Seg.model} \u00b7 ${Seg.lastMs} ms"
                              hap.performHapticFeedback(HapticFeedbackType.LongPress)
                          } catch (e: Throwable) { info = "failed: ${e.message?.take(70)}" }
                          edBusy = false
                      }
                  }
              }
              fun saveEdit(share: Boolean) {
                  val r = result
                  if (r == null) { toast = "Pick an effect first"; return }
                  scope.launch {
                      val u = withContext(Dispatchers.IO) { Seg.save(ctx, r, edMode == 1) }
                      if (u == null) toast = "Save failed"
                      else if (share) ctx.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).setType(if (edMode == 1) "image/png" else "image/jpeg").putExtra(Intent.EXTRA_STREAM, u).addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION), null))
                      else { toast = "Saved to Pictures/HexNPU"; hap.performHapticFeedback(HapticFeedbackType.LongPress) }
                  }
              }
              val bgA = 1f - (abs(off.value) / 900f).coerceIn(0f, 0.7f)
              val panel = Modifier.fillMaxWidth().clip(RoundedCornerShape(24.dp)).background(Color(0xF0181822)).border(1.dp, EDGE, RoundedCornerShape(24.dp)).padding(16.dp)
              Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = bgA)).pointerInput(Unit) {
                  detectVerticalDragGestures(
                      onDragEnd = { crossed = false; if (abs(off.value) > 280f) close() else scope.launch { off.animateTo(0f, spring(0.6f, 300f)) } },
                      onVerticalDrag = { c, dy ->
                          if (!zoomed) {
                              c.consume(); val n = off.value + dy
                              if (abs(n) > 280f && !crossed) { crossed = true; hap.performHapticFeedback(HapticFeedbackType.LongPress) }
                              if (abs(n) <= 280f) crossed = false
                              scope.launch { off.snapTo(n) }
                          }
                      })
              }) {
                  HorizontalPager(pager, Modifier.fillMaxSize().graphicsLayer { translationY = off.value; val s = 1f - abs(off.value) / 2600f; scaleX = s; scaleY = s },
                      pageSpacing = 14.dp, beyondViewportPageCount = 1, userScrollEnabled = !zoomed) { page ->
                      val isCur = page == pager.currentPage
                      ZoomPage(v.ids[page], sc, onZoom = { if (isCur) zoomed = it }, onTap = { chrome = !chrome }) {
                          if (isCur) {
                              Crossfade(result, animationSpec = tween(350), label = "res") { b ->
                                  if (b != null) { if (edMode == 1) Checker(); Image(b.asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Fit) }
                              }
                              if (mode == 1) ocr?.let { r -> OcrOverlay(r) { t -> copy(t, "Copied line") } }
                          }
                      }
                  }
                  if (ocrBusy || edBusy) Scan()
                  AnimatedVisibility(chrome && !zoomed, Modifier.align(Alignment.TopCenter), enter = fadeIn() + slideInVertically { -it / 2 }, exit = fadeOut() + slideOutVertically { -it / 2 }) {
                      Row(Modifier.fillMaxWidth().statusBarsPadding().padding(16.dp, 8.dp), verticalAlignment = Alignment.CenterVertically) {
                          Canvas(Modifier.size(40.dp).pressable(0.85f, null, close).clip(CircleShape).background(Color(0x66000000)).padding(11.dp)) { icon(7, Color.White) }
                          Spacer(Modifier.weight(1f))
                          AnimatedContent(pager.currentPage + 1, transitionSpec = { (slideInVertically { it } + fadeIn()) togetherWith (slideOutVertically { -it } + fadeOut()) }, label = "pg") { n ->
                              Text("$n / ${v.ids.size}", color = Color.White, fontSize = 13.sp, modifier = Modifier.clip(CircleShape).background(Color(0x66000000)).padding(horizontal = 14.dp, vertical = 6.dp))
                          }
                          Spacer(Modifier.weight(1f)); Spacer(Modifier.size(40.dp))
                      }
                  }
                  AnimatedVisibility(toast.isNotEmpty(), Modifier.align(Alignment.TopCenter).statusBarsPadding().padding(top = 64.dp),
                      enter = slideInVertically { -it } + fadeIn() + scaleIn(initialScale = 0.8f), exit = fadeOut() + slideOutVertically { -it }) {
                      Text(toast.ifEmpty { lastToast }, color = Color(0xFF0A0A0F), fontWeight = FontWeight.Bold, fontSize = 14.sp, modifier = Modifier.clip(CircleShape).background(GRAD).padding(horizontal = 18.dp, vertical = 10.dp))
                  }
                  Column(Modifier.align(Alignment.BottomCenter).navigationBarsPadding().padding(16.dp, 0.dp, 16.dp, 16.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      AnimatedVisibility(mode == 1, enter = slideInVertically(spring(0.8f, 300f)) { it / 2 } + fadeIn(), exit = slideOutVertically { it / 2 } + fadeOut()) {
                          Column(panel, verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              val r = ocr
                              when {
                                  ocrBusy -> Text("Reading text...", color = DIM, fontSize = 14.sp)
                                  r == null -> Text("Couldn't read this image", color = DIM, fontSize = 14.sp)
                                  r.lines.isEmpty() -> Text("No text found in this photo", color = DIM, fontSize = 14.sp)
                                  else -> {
                                      Text("${r.lines.size} lines. Tap a highlight to copy it, or long-press the text to select.", color = DIM, fontSize = 12.sp)
                                      Box(Modifier.heightIn(max = 160.dp).verticalScroll(rememberScrollState())) { SelectionContainer { Text(r.text, color = Color.White, fontSize = 15.sp) } }
                                      Pill("Copy all", true) { copy(r.text, "Copied all text") }
                                  }
                              }
                          }
                      }
                      AnimatedVisibility(mode == 2, enter = slideInVertically(spring(0.8f, 300f)) { it / 2 } + fadeIn(), exit = slideOutVertically { it / 2 } + fadeOut()) {
                          Column(panel, verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) { items(EDITS.size) { i -> ModeChip(EDITS[i], edMode == i) { edMode = i } } }
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Text(if (edBusy) "Cutting out (first run downloads a 170 MB model)..." else info, color = DIM, fontSize = 12.sp, modifier = Modifier.weight(1f))
                                  Pill("Save", false) { saveEdit(false) }; Pill("Share", true) { saveEdit(true) }
                              }
                          }
                      }
                      AnimatedVisibility(chrome && !zoomed, enter = fadeIn() + slideInVertically { it / 2 }, exit = fadeOut() + slideOutVertically { it / 2 }) {
                          Row(Modifier.clip(RoundedCornerShape(32.dp)).background(Color(0xEB181822)).border(1.dp, EDGE, RoundedCornerShape(32.dp)).padding(6.dp)) {
                              ActBtn(3, "Text", mode == 1) { doText() }
                              ActBtn(4, "Cutout", mode == 2) { doEdit() }
                              ActBtn(5, "Share", false) { shareImages(ctx, listOf(cur)) }
                          }
                      }
                  }
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon --stacktrace
        env:
          VC: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: HexNPU-debug, path: app/build/outputs/apk/debug/*.apk }
