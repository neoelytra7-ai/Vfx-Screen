           dl:'<svg viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg>'};
          function sz(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB'}
          function saveC(){try{Host.setCfg(id,JSON.stringify(C))}catch(e){}}
          function ops(){
            $('#ops').innerHTML=
             `<button class="ob${C.fs?' on':''}" data-o="fs">${ic.fs}Layar penuh<em>${C.fs?'ON':'OFF'}</em></button>`+
             `<button class="ob${C.or!=='auto'?' on':''}" data-o="or">${ic.or}Orientasi<em>${ORN[C.or]}</em></button>`+
             `<button class="ob${C.res!==100?' on':''}" data-o="rs">${ic.rs}Resolusi<em>${C.res}%</em></button>`+
             `<button class="ob" data-o="rn">${ic.rn}Ganti nama</button>`+
             `<button class="ob rd" data-o="dl">${ic.dl}Hapus</button>`;
          }
          function openDt(i){
            const p=P.find(x=>x.id===i);if(!p)return;id=i;
            let f={};try{f=JSON.parse(Host.info(i))}catch(e){}
            try{C=Object.assign({fs:false,or:'auto',res:100},JSON.parse(Host.cfg(i)))}catch(e){}
            $('#dn').textContent=p.name;$('#dnm').textContent=p.name;$('#da').src=av(p.name);
            const t=(f.title||'').trim();$('#dtt').textContent=t&&t!==p.name?t:'';$('#dtt').hidden=!($('#dtt').textContent);
            $('#mt').innerHTML=
             `<div><small>Ukuran</small><b>${sz(f.size||0)}</b></div>`+
             `<div><small>Berkas</small><b>${f.files||0}</b></div>`+
             `<div><small>Diubah</small><b>${f.mod?new Date(f.mod).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-'}</b></div>`+
             `<div><small>index.html</small><b>${f.entry?'Ada':'Tidak ada'}</b></div>`;
            ops();$('#dt').classList.add('on');openD=true;
          }
          function closeDt(){$('#dt').classList.remove('on');openD=false;$('#go').classList.remove('on')}
          $('#bk').onclick=closeDt;
          addEventListener('foxlback',e=>{if(openD){e.preventDefault();closeDt()}});
          $('#ops').addEventListener('click',e=>{
            const b=e.target.closest('.ob');if(!b)return;const o=b.dataset.o;
            if(o==='fs'){C.fs=!C.fs;saveC();ops()}
            else if(o==='or'){C.or=ORS[(ORS.indexOf(C.or)+1)%3];saveC();ops()}
            else if(o==='rs'){C.res=RES[(RES.indexOf(C.res)+1)%RES.length];saveC();ops()}
            else if(o==='rn'){const p=P.find(x=>x.id===id);const n=prompt('Nama baru',p.name);if(n&&n.trim()){Host.rename(id,n.trim());refresh();openDt(id)}}
            else if(o==='dl'){const p=P.find(x=>x.id===id);if(confirm('Hapus "'+p.name+'"?')){Host.drop(id);closeDt();refresh()}}
          });

          /* ---------- Play: ripple + partikel + wipe ---------- */
          const play=$('#play');
          play.addEventListener('click',e=>{
            if(!id||play.dataset.b)return;play.dataset.b=1;
            const r=play.getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;
            const d=Math.max(r.width,r.height)*2,rp=document.createElement('span');rp.className='rp';
            rp.style.cssText=`width:${d}px;height:${d}px;left:${x-r.left-d/2}px;top:${y-r.top-d/2}px`;play.appendChild(rp);setTimeout(()=>rp.remove(),650);
            const cols=['#7cff3a','#fcdb5a','#fff','#5fb02f','#e8802a'];
            for(let i=0;i<18;i++){const q=document.createElement('i');q.className='pt';q.style.cssText=`left:${x-4}px;top:${y-4}px;background:${cols[i%5]};box-shadow:2px 2px 0 #000`;document.body.appendChild(q);
              const a=Math.random()*Math.PI*2,m=60+Math.random()*110;
              q.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*m}px,${Math.sin(a)*m-30}px) scale(0)`,opacity:0}],{duration:520+Math.random()*260,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>q.remove()}
            navigator.vibrate&&navigator.vibrate(18);
            const go=$('#go');go.style.left=(r.left+r.width/2)+'px';go.style.top=(r.top+r.height/2)+'px';
            go.style.setProperty('--k',Math.hypot(innerWidth,innerHeight)/18);
            setTimeout(()=>go.classList.add('on'),120);
            setTimeout(()=>{Host.run(id)},480);
            setTimeout(()=>{go.classList.remove('on');delete play.dataset.b},1300);
          });

          function stat(){const o=Host.perm();const b=$('#pm');b.textContent='Akses file: '+(o?'ON':'OFF');b.className=o?'on':''}
          $('#pm').onclick=()=>{if(!Host.perm())Host.ask()};
          addEventListener('focus',stat);document.addEventListener('visibilitychange',stat);
          stat();refresh();
          </script></body></html>
          EOF

          cat > $D/app/src/main/assets/menu.js <<'EOF'
          (function(){
          if(window.top!==window||window.__fxm)return;window.__fxm=1;
          var RES=[100,75,50,35],ORS=[['auto','Auto'],['land','Landscape'],['port','Portrait']];
          function go(){
            if(!window.Host||!Host.state)return;
            var st;try{st=JSON.parse(Host.state())}catch(e){return}
            var h=document.createElement('div');
            h.style.cssText='all:initial;position:fixed;top:0;right:0;width:0;height:0;z-index:2147483647';
            var r=h.attachShadow({mode:'open'});
            r.innerHTML='<style>'+
            '*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}'+
            '#w{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;transform-origin:top right;font:17px/1.15 "VT323",monospace;color:#fff}'+
            'button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}'+
            '#b{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#4a3320;border:3px solid #000;box-shadow:inset 3px 3px 0 #8a5a2b,inset -3px -3px 0 #2a1a0c;opacity:.4;transition:opacity .25s,transform .15s cubic-bezier(.3,1.6,.5,1)}'+
            '#b:active{transform:scale(.88)}#w.a #b,#w.o #b{opacity:1}'+
            '#b i{display:block;width:18px;height:3px;background:#fff;box-shadow:0 6px 0 #fff,0 -6px 0 #fff;transition:transform .25s,box-shadow .25s}'+
            '#w.o #b i{transform:rotate(45deg);box-shadow:0 0 0 #fff,0 0 0 #fff}'+
            '#w.o #b i::after{content:"";display:block;width:18px;height:3px;background:#fff;transform:rotate(90deg)}'+
            '#p{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-6px) scale(.96);transform-origin:top right;transition:grid-template-rows .25s,opacity .2s,transform .25s cubic-bezier(.2,.9,.2,1);pointer-events:none}'+
            '#w.o #p{grid-template-rows:1fr;opacity:1;transform:none;pointer-events:auto}'+
            '#p>div{overflow:hidden;min-height:0;width:218px;background:#1a120af2;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a3f22}'+
            '#w:not(.o) #p>div{border-width:0;box-shadow:none}'+
            '.g>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#4a3320;border-bottom:3px solid #000;text-shadow:2px 2px 0 #000;font-size:19px}'+
            '.g>button::after{content:"\\25B8";color:#fcdb5a;transition:transform .2s}'+
            '.g.o>button::after{transform:rotate(90deg)}'+
            '.gb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s}.g.o .gb{grid-template-rows:1fr}'+
            '.gb>div{overflow:hidden;min-height:0;display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}'+
            '.g.o .gb>div{padding:10px}'+
            '.c{flex:1 1 auto;min-width:46px;padding:6px 8px;background:#2a1c10;border:3px solid #000;box-shadow:inset 2px 2px 0 #5a3f22;text-align:center;transition:transform .12s}'+
            '.c:active{transform:scale(.9)}.c.on{background:#2b6b12;box-shadow:inset 2px 2px 0 #5fb02f,inset -2px -2px 0 #123a06;color:#b6ff8a}'+
            '.c.rd{background:#6b1c12}'+
            '#f{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:6px;background:#000c;color:#7cff3a;padding:2px 8px;font:19px "VT323",monospace;display:none;pointer-events:none}'+
            '</style>'+
            '<div id="f"></div>'+
            '<div id="w"><button id="b"><i></i></button><div id="p"><div>'+
             '<div class="g" id="g1"><button>Resolusi</button><div class="gb"><div id="rs"></div></div></div>'+
             '<div class="g" id="g2"><button>Layar</button><div class="gb"><div id="ly"></div></div></div>'+
             '<div class="g" id="g3"><button>Alat</button><div class="gb"><div id="al"></div></div></div>'+
            '</div></div></div>';
            function $(s){return r.querySelector(s)}
            var w=$('#w'),idle;
            function dim(){clearTimeout(idle);w.classList.add('a');idle=setTimeout(function(){w.classList.remove('a')},3000)}
            function scale(){w.style.transform='scale('+((st.res||100)/100)+')'}
            function build(){
              $('#rs').innerHTML=RES.map(function(n){return '<button class="c'+(st.res===n?' on':'')+'" data-r="'+n+'">'+n+'%</button>'}).join('');
              $('#ly').innerHTML='<button class="c'+(st.fs?' on':'')+'" data-f="1" style="flex-basis:100%">Layar penuh: '+(st.fs?'ON':'OFF')+'</button>'+
                ORS.map(function(o){return '<button class="c'+(st.or===o[0]?' on':'')+'" data-o="'+o[0]+'">'+o[1]+'</button>'}).join('');
              $('#al').innerHTML='<button class="c'+(fpsOn?' on':'')+'" data-a="fps" style="flex-basis:100%">Penghitung FPS: '+(fpsOn?'ON':'OFF')+'</button>'+
                '<button class="c" data-a="rl" style="flex-basis:100%">Muat ulang</button>'+
                '<button class="c rd" data-a="ex" style="flex-basis:100%">Kembali ke Hub</button>';
              scale();
            }
            var fpsOn=false,fr=0,ft=0,raf;
            function loop(t){fr++;if(t-ft>=500){$('#f').textContent=Math.round(fr*1000/(t-ft))+' FPS';fr=0;ft=t}raf=requestAnimationFrame(loop)}
            function fps(on){fpsOn=on;$('#f').style.display=on?'block':'none';cancelAnimationFrame(raf);if(on){fr=0;ft=performance.now();raf=requestAnimationFrame(loop)}}
            $('#b').onclick=function(){w.classList.toggle('o');dim()};
            r.addEventListener('click',function(e){
              var g=e.target.closest('.g>button');
              if(g){var p=g.parentNode,was=p.classList.contains('o');
                ['g1','g2','g3'].forEach(function(i){$('#'+i).classList.remove('o')});
                if(!was)p.classList.add('o');dim();return}
              var c=e.target.closest('.c');if(!c)return;dim();
              if(c.dataset.r){st.res=+c.dataset.r;Host.hRes(st.res)}
              else if(c.dataset.f){st.fs=!st.fs;Host.hFs(st.fs)}
              else if(c.dataset.o){st.or=c.dataset.o;Host.hOri(st.or)}
              else if(c.dataset.a==='fps')fps(!fpsOn);
              else if(c.dataset.a==='rl')Host.hReload();
              else if(c.dataset.a==='ex')Host.hExit();
              build();
            });
            ['pointerdown','pointerup','touchstart','touchend','mousedown','mouseup','click'].forEach(function(t){h.addEventListener(t,function(e){e.stopPropagation()})});
            build();dim();
            (document.body||document.documentElement).appendChild(h);
            setInterval(function(){if(!h.isConnected)(document.body||document.documentElement).appendChild(h)},2000);
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
          })();
          EOF

          cat > $D/app/src/main/res/xml/fp.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <root-path name="r" path="."/>
          </paths>
          EOF

          python3 - <<'PY'
          g=["o......o","oo....oo","oooooooo","owkoowko","oooooooo","owwoowwo",".owwwwo.","..okko.."]
          C={'o':'#e8802a','w':'#ffffff','k':'#000000'}
          s='<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="12" android:viewportHeight="12">'
          s+='<path android:fillColor="#7a5230" android:pathData="M0,0h12v12h-12z"/><path android:fillColor="#5fb02f" android:pathData="M0,0h12v1.5h-12z"/>'
          for c,col in C.items():
              d=''.join('M%d,%dh1v1h-1z'%(x+2,y+2) for y,r in enumerate(g) for x,ch in enumerate(r) if ch==c)
              s+='<path android:fillColor="%s" android:pathData="%s"/>'%(col,d)
          open('hub/app/src/main/res/drawable/ic.xml','w').write(s+'</vector>')
          PY

      - name: Keystore (cache, dibuat sekali)
        uses: actions/cache@v4
        with:
          path: ks.jks
          key: foxl-keystore-v1

      - name: Buat keystore jika belum ada
        run: |
          [ -f ks.jks ] || keytool -genkeypair -keystore ks.jks -storepass foxlhub -keypass foxlhub \
            -alias k -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Foxle Hub"

      - name: Build release APK
        working-directory: hub
        env:
          KS: ${{ github.workspace }}/ks.jks
        run: gradle assembleRelease --console=plain

      - name: Rename
        run: |
          cp hub/app/build/outputs/apk/release/app-release.apk FoxleHub.apk
          ls -l FoxleHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FoxleHub
          path: FoxleHub.apk
          if-no-files-found: error
