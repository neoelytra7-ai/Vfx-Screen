# SLIME - overlay slime hidup (soft-body) untuk Android 11, tanpa root.
# Taruh di: .github/workflows/build-slime.yml  -> Actions -> build-slime -> Run workflow
# Hasil: artifact "debug" (debug.zip) berisi app-debug.apk. Kalau gagal, lihat log step Build.
# Semua source masuk folder slime/ supaya tidak bentrok dengan app lain di repo.
# Revisi: tiap file = satu step bernama "FILE <nama>". Ganti isi step itu saja.
name: build-slime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-slime.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: "FILE gradle config"
        shell: bash
        run: |
          mkdir -p slime
          cat > slime/settings.gradle <<'SLIME_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Slime'
          include ':app'
          SLIME_EOF
          mkdir -p slime
          cat > slime/build.gradle <<'SLIME_EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          SLIME_EOF
          mkdir -p slime
          cat > slime/gradle.properties <<'SLIME_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          SLIME_EOF
          mkdir -p slime/app
          cat > slime/app/build.gradle <<'SLIME_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'app.slime'
              compileSdk 34

              defaultConfig {
                  applicationId 'app.slime'
                  minSdk 30
                  targetSdk 30
                  versionCode 1
                  versionName '0.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          SLIME_EOF

      - name: "FILE manifest dan resource"
        shell: bash
        run: |
          mkdir -p slime/app/src/main
          cat > slime/app/src/main/AndroidManifest.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SlimeService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/slime_service" />
                  </service>
              </application>
          </manifest>
          SLIME_EOF
          mkdir -p slime/app/src/main/res/xml
          cat > slime/app/src/main/res/xml/slime_service.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewScrolled|typeWindowContentChanged|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="30"
              android:description="@string/svc_desc"
              android:settingsActivity="app.slime.MainActivity" />
          SLIME_EOF
          mkdir -p slime/app/src/main/res/values
          cat > slime/app/src/main/res/values/strings.xml <<'SLIME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Slime</string>
              <string name="svc_desc">Overlay slime hidup. Hanya membaca posisi dan ukuran elemen layar (bounds), tidak membaca isi teks.</string>
          </resources>
          SLIME_EOF

      - name: "FILE Tuning.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/Tuning.kt <<'SLIME_EOF'
          package app.slime

          import android.content.SharedPreferences

          object Tuning {
              class P(val key: String, val def: Float, val min: Float, val max: Float, val label: String)

              val ALL = listOf(
                  P("radius", 34f, 18f, 70f, "Ukuran (dp)"),
                  P("shape", 420f, 80f, 900f, "Kekakuan bentuk"),
                  P("edge", 500f, 100f, 1200f, "Kekakuan tepi"),
                  P("damp", 7f, 2f, 30f, "Redaman jelly"),
                  P("pressure", 60f, 0f, 160f, "Tekanan volume"),
                  P("gravity", 900f, 400f, 2000f, "Gravitasi (dp/s2)"),
                  P("jump", 1f, 0.5f, 1.6f, "Kekuatan lompat"),
                  P("wander", 3f, 0.8f, 10f, "Jeda antar aksi (detik)"),
                  P("floor", 0f, 0f, 120f, "Margin lantai (dp)"),
                  P("hue", 130f, 0f, 360f, "Warna (hue)"),
                  P("eye", 1f, 0.6f, 1.6f, "Ukuran mata")
              )

              var radius = 34f
              var shape = 420f
              var edge = 500f
              var damp = 7f
              var pressure = 60f
              var gravity = 900f
              var jump = 1f
              var wander = 3f
              var floor = 0f
              var hue = 130f
              var eye = 1f

              fun load(sp: SharedPreferences) {
                  fun g(k: String): Float {
                      val p = ALL.first { it.key == k }
                      return sp.getFloat(k, p.def)
                  }
                  radius = g("radius")
                  shape = g("shape")
                  edge = g("edge")
                  damp = g("damp")
                  pressure = g("pressure")
                  gravity = g("gravity")
                  jump = g("jump")
                  wander = g("wander")
                  floor = g("floor")
                  hue = g("hue")
                  eye = g("eye")
              }
          }
          SLIME_EOF

      - name: "FILE SlimePhysics.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimePhysics.kt <<'SLIME_EOF'
          package app.slime

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          class Plat(@JvmField var l: Float, @JvmField var t: Float, @JvmField var r: Float, @JvmField var b: Float)

          /** Soft-body slime: N titik di keliling, pegas tepi + shape matching + tekanan volume. */
          class SlimePhysics {
              companion object {
                  const val N = 18
              }

              val px = FloatArray(N)
              val py = FloatArray(N)
              val vx = FloatArray(N)
              val vy = FloatArray(N)
              private val oy = FloatArray(N)
              private val ax = FloatArray(N)
              private val ay = FloatArray(N)
              private val rx = FloatArray(N) { cos(2.0 * PI * it / N).toFloat() }
              private val ry = FloatArray(N) { sin(2.0 * PI * it / N).toFloat() }

              var W = 0f
              var H = 0f
              var density = 1f
              var radius = 60f
              var cx = 0f
              var cy = 0f
              var cvx = 0f
              var cvy = 0f
              var scaleX = 1f
              var scaleY = 1f
              var floorY = 0f
              var contacts = 0
              var onPlat = false
              var impact = 0f
              var inited = false
              var platforms: List<Plat> = emptyList()
              private var stand: Plat? = null

              val grounded: Boolean get() = contacts >= 2

              fun reset(x: Float, y: Float) {
                  radius = Tuning.radius * density
                  for (i in 0 until N) {
                      px[i] = x + rx[i] * radius
                      py[i] = y + ry[i] * radius
                      vx[i] = 0f
                      vy[i] = 0f
                      oy[i] = py[i]
                  }
                  cx = x
                  cy = y
                  inited = true
              }

              fun launch(sx: Float, sy: Float) {
                  for (i in 0 until N) {
                      vx[i] = sx
                      vy[i] = sy * (1f - 0.12f * ry[i])
                  }
                  contacts = 0
                  onPlat = false
                  stand = null
              }

              private fun shiftPoints(dx: Float, dy: Float, soft: Float) {
                  for (i in 0 until N) {
                      val up = ((cy - py[i]) / radius).coerceIn(0f, 1f)
                      val f = 1f - soft * up
                      px[i] += dx * f
                      py[i] += dy * f
                      oy[i] += dy * f
                  }
              }

              /** Scan baru dari aksesibilitas: lacak platform yang sedang diinjak supaya ikut bergeser. */
              fun updatePlatforms(n: List<Plat>) {
                  val s = stand
                  if (s != null && onPlat) {
                      var best: Plat? = null
                      var bd = 1e9f
                      for (p in n) {
                          if (abs(p.l - s.l) > 6f * density) continue
                          if (abs(p.r - s.r) > 6f * density) continue
                          if (abs((p.b - p.t) - (s.b - s.t)) > 8f * density) continue
                          val dd = abs(p.t - s.t)
                          if (dd < bd) {
                              bd = dd
                              best = p
                          }
                      }
                      val b = best
                      if (b != null && bd > 1f && bd < 700f * density) {
                          shiftPoints(b.l - s.l, b.t - s.t, 0.25f)
                      }
                      stand = b
                  }
                  platforms = n
              }

              /** Event scroll dengan delta: geser platform di area yang di-scroll, slime ikut kalau berdiri di situ. */
              fun shiftRegion(l: Float, t: Float, r: Float, b: Float, dx: Float, dy: Float) {
                  for (pl in platforms) {
                      val mx = (pl.l + pl.r) * 0.5f
                      val my = (pl.t + pl.b) * 0.5f
                      if (mx >= l && mx <= r && my >= t && my <= b) {
                          pl.l += dx
                          pl.r += dx
                          pl.t += dy
                          pl.b += dy
                      }
                  }
                  if (onPlat && cx >= l && cx <= r && cy >= t && cy <= b) {
                      shiftPoints(dx, dy, 0.4f)
                  }
              }

              fun step(frameDt: Float) {
                  if (!inited) return
                  val dt = frameDt * 0.5f
                  sub(dt)
                  sub(dt)
              }

              private fun sub(dt: Float) {
                  val d = density
                  radius += (Tuning.radius * d - radius) * min(1f, dt * 6f)
                  val R = radius
                  floorY = H - Tuning.floor * d
                  val g = Tuning.gravity * d

                  var sx = 0f
                  var sy = 0f
                  var svx = 0f
                  var svy = 0f
                  for (i in 0 until N) {
                      sx += px[i]
                      sy += py[i]
                      svx += vx[i]
                      svy += vy[i]
                  }
                  cx = sx / N
                  cy = sy / N
                  cvx = svx / N
                  cvy = svy / N

                  var a2 = 0f
                  for (i in 0 until N) {
                      val j = (i + 1) % N
                      a2 += px[i] * py[j] - px[j] * py[i]
                  }
                  val twoPi = (2.0 * PI).toFloat()
                  val restA = 0.5f * N * R * R * sin(twoPi / N)
                  val rel = ((restA - abs(a2) * 0.5f) / restA).coerceIn(-0.6f, 1.2f)
                  val kS = Tuning.shape
                  val kE = Tuning.edge
                  val c = Tuning.damp
                  val pf = Tuning.pressure * rel * R
                  val L = 2f * R * sin(PI.toFloat() / N)

                  for (i in 0 until N) {
                      ax[i] = 0f
                      ay[i] = 0f
                  }
                  for (i in 0 until N) {
                      val j = (i + 1) % N
                      val dx = px[j] - px[i]
                      val dy = py[j] - py[i]
                      val dl = sqrt(dx * dx + dy * dy) + 0.001f
                      val f = (dl - L) * kE / dl
                      ax[i] += f * dx
                      ay[i] += f * dy
                      ax[j] -= f * dx
                      ay[j] -= f * dy
                  }
                  for (i in 0 until N) {
                      val tx = cx + rx[i] * R * scaleX
                      val ty = cy + ry[i] * R * scaleY
                      val ex = px[i] - cx
                      val ey = py[i] - cy
                      val el = sqrt(ex * ex + ey * ey) + 0.001f
                      ax[i] += (tx - px[i]) * kS + ex / el * pf - (vx[i] - cvx) * c
                      ay[i] += (ty - py[i]) * kS + ey / el * pf - (vy[i] - cvy) * c + g
                  }

                  val vmax = 4200f * d
                  val tol = 22f * d
                  val depth = 60f * d
                  val fr = min(1f, 16f * dt)
                  contacts = 0
                  onPlat = false
                  var imp = 0f
                  var lastStand: Plat? = null

                  for (i in 0 until N) {
                      vx[i] = (vx[i] + ax[i] * dt).coerceIn(-vmax, vmax)
                      vy[i] = (vy[i] + ay[i] * dt).coerceIn(-vmax, vmax)
                      oy[i] = py[i]
                      px[i] += vx[i] * dt
                      py[i] += vy[i] * dt

                      if (px[i] < 0f) {
                          px[i] = 0f
                          if (vx[i] < 0f) vx[i] *= -0.2f
                      } else if (px[i] > W) {
                          px[i] = W
                          if (vx[i] > 0f) vx[i] *= -0.2f
                      }

                      var top = Float.MAX_VALUE
                      var chosen: Plat? = null
                      if (py[i] > floorY) top = floorY
                      if (vy[i] > -60f * d) {
                          val x = px[i]
                          val y = py[i]
                          for (pl in platforms) {
                              if (x < pl.l || x > pl.r || pl.t >= top) continue
                              if (y >= pl.t && (y <= pl.t + depth || oy[i] <= pl.t + tol)) {
                                  top = pl.t
                                  chosen = pl
                              }
                          }
                      }
                      if (top != Float.MAX_VALUE) {
                          val v = vy[i]
                          if (v > 0f) {
                              if (v > imp) imp = v
                              vy[i] = if (v > 450f * d) -v * 0.12f else 0f
                          }
                          py[i] = top
                          vx[i] *= (1f - fr)
                          contacts++
                          if (chosen != null) {
                              onPlat = true
                              lastStand = chosen
                          }
                      }
                  }
                  if (imp > 650f * d) {
                      for (k in 0 until N) if (vy[k] > 0f) vy[k] *= 0.55f
                  }
                  if (imp > impact) impact = imp
                  if (lastStand != null) stand = lastStand
              }
          }
          SLIME_EOF

      - name: "FILE SlimeBrain.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeBrain.kt <<'SLIME_EOF'
          package app.slime

          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.random.Random

          /** Otak slime: idle (napas, kedip, tidur), merencanakan lompat ke elemen UI, kaget saat scroll. */
          class SlimeBrain(private val p: SlimePhysics) {
              enum class S { IDLE, WIND, AIR, LAND }

              var state = S.IDLE
              var blink = 0f
              var wide = 0f
              var sleepy = 0f
              var lookX = 0f
              var lookY = 0f
              var squint = 0f

              private var t = 0f
              private var clock = 0f
              private var idleLeft = 1.5f
              private var windDur = 0.3f
              private var jvx = 0f
              private var jvy = 0f
              private var planned = false
              private var jtx = 0f
              private var jty = 0f
              private var jT = 0.5f
              private var air = 0f
              private var loose = 0f
              private var blinkIn = 2f
              private var lookIn = 1f
              private var tlx = 0f
              private var tly = 0f
              private var wantSleep = false

              private fun rf(a: Float, b: Float): Float = a + Random.nextFloat() * (b - a)

              private fun go(s: S) {
                  state = s
                  t = 0f
              }

              fun onScroll() {
                  wide = 1f
                  wantSleep = false
                  if (state == S.IDLE && p.grounded && Random.nextFloat() < 0.3f) {
                      planned = false
                      jvx = 0f
                      jvy = -rf(480f, 640f) * p.density
                      windDur = 0.1f
                      go(S.WIND)
                  }
              }

              fun update(dt: Float) {
                  clock += dt
                  t += dt
                  wide = max(0f, wide - dt * 1.5f)
                  blink = max(0f, blink - dt * 7f)
                  blinkIn -= dt
                  if (blinkIn <= 0f) {
                      blink = 1f
                      blinkIn = rf(1.8f, 5f)
                  }
                  val sl = if (wantSleep) 1f else 0f
                  sleepy += (sl - sleepy) * min(1f, dt * 2f)
                  lookIn -= dt
                  if (lookIn <= 0f) {
                      tlx = rf(-1f, 1f)
                      tly = rf(-0.5f, 0.5f)
                      lookIn = rf(1.2f, 3.5f)
                  }
                  lookX += (tlx - lookX) * min(1f, dt * 4f)
                  lookY += (tly - lookY) * min(1f, dt * 4f)

                  val breath = 1f + 0.025f * (1f - 0.5f * sleepy) * sin(clock * (2.4f - 1.2f * sleepy))
                  var sx = 1f / breath
                  var sy = breath
                  val d = p.density

                  when (state) {
                      S.IDLE -> {
                          if (p.grounded) loose = 0f else loose += dt
                          if (loose > 0.25f) {
                              air = 0f
                              go(S.AIR)
                          } else {
                              idleLeft -= dt
                              if (idleLeft <= 0f && p.grounded) decide()
                          }
                      }
                      S.WIND -> {
                          val k = min(1f, t / windDur)
                          sy *= 1f - 0.34f * k
                          sx *= 1f + 0.30f * k
                          squint = k
                          if (t >= windDur) {
                              if (planned) aim()
                              p.launch(jvx, jvy)
                              air = 0f
                              go(S.AIR)
                          }
                      }
                      S.AIR -> {
                          air += dt
                          val fx = 1f + 0.18f * min(1f, abs(p.cvx) / (900f * d))
                          val fy = 1f + 0.32f * min(1f, abs(p.cvy) / (1000f * d))
                          val n = sqrt(fx * fy)
                          sx *= fx / n
                          sy *= fy / n
                          if (air > 0.12f && p.grounded) {
                              wide = max(wide, min(1f, p.impact / (1500f * d)) * 0.9f)
                              p.impact = 0f
                              go(S.LAND)
                          } else if (air > 6f) {
                              go(S.IDLE)
                          }
                      }
                      S.LAND -> {
                          if (t > 0.35f) {
                              idleLeft = rf(0.3f, 1.2f)
                              loose = 0f
                              go(S.IDLE)
                          }
                      }
                  }
                  if (state != S.WIND) squint += (0f - squint) * min(1f, dt * 10f)
                  p.scaleX = sx
                  p.scaleY = sy
              }

              private fun decide() {
                  val r = Random.nextFloat()
                  idleLeft = Tuning.wander * rf(0.5f, 1.5f)
                  wantSleep = false
                  if (r < 0.62f && planJump()) {
                      go(S.WIND)
                      return
                  }
                  if (r < 0.80f) {
                      val d = p.density
                      planned = false
                      jvx = (if (Random.nextBoolean()) 1f else -1f) * rf(80f, 260f) * d
                      jvy = -rf(480f, 720f) * d
                      windDur = 0.18f
                      go(S.WIND)
                      return
                  }
                  if (r < 0.90f) wantSleep = true
              }

              private fun planJump(): Boolean {
                  val d = p.density
                  val R = p.radius
                  val g = Tuning.gravity * d
                  val maxRise = p.H * 0.5f * Tuning.jump
                  var best: Plat? = null
                  var bestScore = -9f
                  for (pl in p.platforms) {
                      val w = pl.r - pl.l
                      if (w < R * 1.1f) continue
                      if (pl.t < p.H * 0.1f || pl.t > p.floorY - R * 0.4f) continue
                      val rise = p.cy - (pl.t - R * 0.85f)
                      if (rise > maxRise) continue
                      if (abs(pl.t - (p.cy + R * 0.9f)) < R * 0.6f && p.cx >= pl.l && p.cx <= pl.r) continue
                      val dx = (pl.l + pl.r) * 0.5f - p.cx
                      if (abs(dx) > p.W * 0.75f) continue
                      val score = Random.nextFloat() + 0.6f * (rise / maxRise).coerceIn(-0.3f, 1f)
                      if (score > bestScore) {
                          bestScore = score
                          best = pl
                      }
                  }
                  val pl = best ?: return false
                  val w = pl.r - pl.l
                  val m = min(R * 0.6f, w * 0.3f)
                  val tx = rf(pl.l + m, pl.r - m).coerceIn(R * 0.8f, p.W - R * 0.8f)
                  val tcy = pl.t - R * 0.85f
                  val dy = tcy - p.cy
                  val dx = tx - p.cx
                  var tt = 1.2f * sqrt(2f * max(0f, -dy) / g) + 0.3f
                  tt = max(tt, 0.42f)
                  tt = max(tt, abs(dx) / (1100f * d))
                  planned = true
                  jtx = tx
                  jty = tcy
                  jT = tt
                  windDur = 0.28f
                  tlx = (dx / (p.W * 0.5f)).coerceIn(-1f, 1f)
                  tly = if (dy < 0f) -0.8f else 0.3f
                  lookIn = 1.5f
                  return true
              }

              private fun aim() {
                  val g = Tuning.gravity * p.density
                  jvx = (jtx - p.cx) / jT
                  jvy = ((jty - p.cy) - 0.5f * g * jT * jT) / jT
              }
          }
          SLIME_EOF

      - name: "FILE SlimeView.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeView.kt <<'SLIME_EOF'
          package app.slime

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.view.Choreographer
          import android.view.View
          import kotlin.math.max
          import kotlin.math.min

          class SlimeView(ctx: Context) : View(ctx), Choreographer.FrameCallback {
              private val phys = SlimePhysics()
              private val brain = SlimeBrain(phys)

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val outline = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
              }
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
              }
              private val white = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val shine = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0x66FFFFFF }
              private val dark = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFF101820.toInt() }
              private val mouth = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  color = 0xFF101820.toInt()
              }
              private val path = Path()
              private val rect = RectF()
              private val hsv = FloatArray(3)
              private val loc = IntArray(2)
              private var last = 0L

              private fun col(a: Int, s: Float, v: Float): Int {
                  hsv[0] = Tuning.hue
                  hsv[1] = s
                  hsv[2] = v
                  return Color.HSVToColor(a, hsv)
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  last = 0L
                  Choreographer.getInstance().postFrameCallback(this)
              }

              override fun onDetachedFromWindow() {
                  Choreographer.getInstance().removeFrameCallback(this)
                  super.onDetachedFromWindow()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  phys.W = w.toFloat()
                  phys.H = h.toFloat()
                  phys.density = resources.displayMetrics.density
                  if (!phys.inited && w > 0) phys.reset(w * 0.5f, h * 0.2f)
              }

              override fun doFrame(frameTimeNanos: Long) {
                  if (last != 0L) {
                      val dt = min((frameTimeNanos - last) / 1_000_000_000f, 1f / 30f)
                      brain.update(dt)
                      phys.step(dt)
                      invalidate()
                  }
                  last = frameTimeNanos
                  Choreographer.getInstance().postFrameCallback(this)
              }

              /** Dipanggil dari service (thread utama): daftar bounds elemen layar dalam koordinat layar. */
              fun setPlatforms(rects: List<Rect>) {
                  getLocationOnScreen(loc)
                  val ox = loc[0].toFloat()
                  val oy = loc[1].toFloat()
                  phys.updatePlatforms(rects.map { Plat(it.left - ox, it.top - oy, it.right - ox, it.bottom - oy) })
              }

              fun onScroll(r: Rect?, dx: Int, dy: Int) {
                  brain.onScroll()
                  if (r == null || (dx == 0 && dy == 0)) return
                  getLocationOnScreen(loc)
                  val ox = loc[0].toFloat()
                  val oy = loc[1].toFloat()
                  phys.shiftRegion(r.left - ox, r.top - oy, r.right - ox, r.bottom - oy, dx.toFloat(), dy.toFloat())
              }

              override fun onDraw(c: Canvas) {
                  if (!phys.inited) return
                  val n = SlimePhysics.N
                  val px = phys.px
                  val py = phys.py
                  val d = phys.density
                  val R = phys.radius

                  path.reset()
                  path.moveTo((px[n - 1] + px[0]) / 2f, (py[n - 1] + py[0]) / 2f)
                  for (i in 0 until n) {
                      val j = (i + 1) % n
                      path.quadTo(px[i], py[i], (px[i] + px[j]) / 2f, (py[i] + py[j]) / 2f)
                  }
                  path.close()

                  glow.strokeWidth = 9f * d
                  glow.color = col(70, 0.8f, 1f)
                  c.drawPath(path, glow)
                  fill.color = col(215, 0.65f, 1f)
                  c.drawPath(path, fill)
                  outline.strokeWidth = 2.2f * d
                  outline.color = col(255, 0.85f, 0.75f)
                  c.drawPath(path, outline)

                  val cx = phys.cx
                  val cy = phys.cy
                  val sxk = phys.scaleX
                  val syk = phys.scaleY

                  rect.set(cx - 0.52f * R * sxk, cy - 0.74f * R * syk, cx - 0.12f * R * sxk, cy - 0.50f * R * syk)
                  c.drawOval(rect, shine)

                  val e = 0.17f * R * Tuning.eye
                  val open = (1f - brain.blink) * (1f - 0.55f * brain.sleepy) *
                      (1f + 0.4f * brain.wide) * (1f - 0.35f * brain.squint)
                  val h = max(0.07f, open)
                  val ey = cy - 0.08f * R * syk + brain.lookY * 0.06f * R
                  val shift = brain.lookX * 0.10f * R
                  eye(c, cx - 0.30f * R * sxk + shift, ey, e, h)
                  eye(c, cx + 0.30f * R * sxk + shift, ey, e, h)

                  mouth.strokeWidth = 1.8f * d
                  if (brain.wide > 0.3f) {
                      rect.set(cx - 0.07f * R, cy + 0.14f * R * syk, cx + 0.07f * R, cy + 0.30f * R * syk)
                      c.drawOval(rect, dark)
                  } else if (brain.sleepy < 0.5f) {
                      rect.set(cx - 0.16f * R, cy + 0.02f * R * syk, cx + 0.16f * R, cy + 0.22f * R * syk)
                      c.drawArc(rect, 20f, 140f, false, mouth)
                  }
              }

              private fun eye(c: Canvas, x: Float, y: Float, e: Float, h: Float) {
                  rect.set(x - e, y - e * h, x + e, y + e * h)
                  c.drawOval(rect, white)
                  val pr = e * 0.55f
                  val pxp = x + brain.lookX * e * 0.4f
                  val pyp = y + brain.lookY * e * 0.35f
                  val ph = pr * min(h, 1f)
                  rect.set(pxp - pr, pyp - ph, pxp + pr, pyp + ph)
                  c.drawOval(rect, dark)
              }
          }
          SLIME_EOF

      - name: "FILE SlimeService.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/SlimeService.kt <<'SLIME_EOF'
          package app.slime

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          /** Hanya membaca bounds elemen layar (posisi/ukuran). Teks tidak pernah dibaca. */
          class SlimeService : AccessibilityService() {
              private var wm: WindowManager? = null
              private var view: SlimeView? = null
              private val main = Handler(Looper.getMainLooper())
              private var bgThread: HandlerThread? = null
              private var bg: Handler? = null
              private var sp: SharedPreferences? = null
              private val spl = SharedPreferences.OnSharedPreferenceChangeListener { p, _ -> Tuning.load(p) }

              @Volatile private var queued = false
              @Volatile private var lastScan = 0L

              private val tick = object : Runnable {
                  override fun run() {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (pm.isInteractive) requestScan(0)
                      bg?.postDelayed(this, 900)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (view != null) return
                  val prefs = getSharedPreferences("slime", Context.MODE_PRIVATE)
                  sp = prefs
                  Tuning.load(prefs)
                  prefs.registerOnSharedPreferenceChangeListener(spl)

                  val t = HandlerThread("slime-scan")
                  t.start()
                  bgThread = t
                  bg = Handler(t.looper)

                  val manager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = manager
                  val v = SlimeView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  manager.addView(v, lp)
                  view = v
                  requestScan(200)
                  bg?.postDelayed(tick, 900)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null) return
                  when (e.eventType) {
                      AccessibilityEvent.TYPE_VIEW_SCROLLED -> {
                          val dx = e.scrollDeltaX
                          val dy = e.scrollDeltaY
                          val valid = !(dx == -1 && dy == -1)
                          val src = e.source
                          val r = if (src != null) Rect().also { src.getBoundsInScreen(it) } else null
                          src?.recycle()
                          view?.onScroll(if (valid) r else null, if (valid) -dx else 0, if (valid) -dy else 0)
                          requestScan(40)
                      }
                      AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED,
                      AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED -> requestScan(120)
                  }
              }

              override fun onInterrupt() {}

              private fun requestScan(delayMs: Long) {
                  if (queued) return
                  queued = true
                  val since = SystemClock.uptimeMillis() - lastScan
                  val wait = max(max(delayMs, 110L - since), 0L)
                  bg?.postDelayed({
                      queued = false
                      lastScan = SystemClock.uptimeMillis()
                      scan()
                  }, wait)
              }

              private fun scan() {
                  try {
                      val root = rootInActiveWindow ?: return
                      val dm = resources.displayMetrics
                      val d = dm.density
                      val h = view?.height ?: dm.heightPixels
                      val out = ArrayList<Rect>()
                      walk(root, 0, out, intArrayOf(500), dm.widthPixels, h, (36 * d).toInt(), (14 * d).toInt())
                      root.recycle()
                      val list = merge(out)
                      main.post { view?.setPlatforms(list) }
                  } catch (e: Throwable) {
                  }
              }

              private fun walk(
                  n: AccessibilityNodeInfo, depth: Int, out: MutableList<Rect>, budget: IntArray,
                  w: Int, h: Int, minW: Int, minH: Int
              ) {
                  if (budget[0] <= 0 || depth > 40) return
                  budget[0]--
                  if (!n.isVisibleToUser) return
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  val bw = r.width()
                  val bh = r.height()
                  val huge = bw > w * 0.92f && bh > h * 0.85f
                  if (!huge && bw >= minW && bh >= minH && r.top > 0 && r.top < h) out.add(r)
                  for (i in 0 until n.childCount) {
                      val ch = n.getChild(i) ?: continue
                      walk(ch, depth + 1, out, budget, w, h, minW, minH)
                      ch.recycle()
                  }
              }

              private fun merge(src: List<Rect>): List<Rect> {
                  val sorted = src.sortedWith(compareBy<Rect>({ it.top }, { it.left }))
                  val out = ArrayList<Rect>()
                  for (r in sorted) {
                      var dup = false
                      for (o in out) {
                          if (abs(o.top - r.top) < 8 && o.left < r.right && r.left < o.right) {
                              val inter = min(o.right, r.right) - max(o.left, r.left)
                              val small = min(o.width(), r.width())
                              if (inter > small * 0.7f) {
                                  dup = true
                                  break
                              }
                          }
                      }
                      if (!dup) out.add(r)
                      if (out.size >= 160) break
                  }
                  return out
              }

              private fun teardown() {
                  try {
                      val v = view
                      if (v != null) wm?.removeView(v)
                  } catch (e: Throwable) {
                  }
                  view = null
                  bgThread?.quitSafely()
                  bgThread = null
                  bg = null
                  sp?.unregisterOnSharedPreferenceChangeListener(spl)
                  sp = null
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  teardown()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  teardown()
                  super.onDestroy()
              }
          }
          SLIME_EOF

      - name: "FILE MainActivity.kt"
        shell: bash
        run: |
          mkdir -p slime/app/src/main/java/app/slime
          cat > slime/app/src/main/java/app/slime/MainActivity.kt <<'SLIME_EOF'
          package app.slime

          import android.app.Activity
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class MainActivity : Activity() {
              private val neon = 0xFF39FF14.toInt()
              private lateinit var status: TextView

              override fun onCreate(saved: Bundle?) {
                  super.onCreate(saved)
                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK
                  val sp = getSharedPreferences("slime", MODE_PRIVATE)
                  val d = resources.displayMetrics.density
                  val pad = (16 * d).toInt()

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(pad, pad * 2, pad, pad * 2)

                  fun tv(txt: String, size: Float, c: Int): TextView {
                      val t = TextView(this)
                      t.text = txt
                      t.textSize = size
                      t.setTextColor(c)
                      t.typeface = Typeface.MONOSPACE
                      return t
                  }

                  col.addView(tv("SLIME", 30f, neon).also { it.setTypeface(Typeface.MONOSPACE, Typeface.BOLD) })
                  status = tv("", 13f, 0xFFB0FFB0.toInt())
                  status.setPadding(0, pad / 2, 0, pad / 2)
                  col.addView(status)

                  val open = Button(this)
                  open.text = "BUKA PENGATURAN AKSESIBILITAS"
                  open.setTextColor(neon)
                  open.setBackgroundColor(0xFF0B1A0B.toInt())
                  open.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  col.addView(open)

                  for (p in Tuning.ALL) {
                      val label = tv("", 12f, 0xFFB0FFB0.toInt())
                      label.setPadding(0, pad, 0, 0)
                      fun upd(v: Float) {
                          label.text = p.label + ": " + String.format("%.1f", v)
                      }
                      val cur = sp.getFloat(p.key, p.def)
                      upd(cur)
                      val sb = SeekBar(this)
                      sb.max = 1000
                      sb.progress = (((cur - p.min) / (p.max - p.min)) * 1000f).toInt().coerceIn(0, 1000)
                      sb.progressTintList = ColorStateList.valueOf(neon)
                      sb.thumbTintList = ColorStateList.valueOf(neon)
                      sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, pr: Int, user: Boolean) {
                              val v = p.min + (p.max - p.min) * pr / 1000f
                              upd(v)
                              if (user) sp.edit().putFloat(p.key, v).apply()
                          }

                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                      col.addView(label)
                      col.addView(sb)
                  }

                  val reset = Button(this)
                  reset.text = "RESET KE DEFAULT"
                  reset.setTextColor(neon)
                  reset.setBackgroundColor(0xFF0B1A0B.toInt())
                  reset.setOnClickListener {
                      sp.edit().clear().apply()
                      recreate()
                  }
                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  lp.topMargin = pad * 2
                  col.addView(reset, lp)

                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.BLACK)
                  sv.addView(col)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  val en = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: ""
                  status.text = if (en.contains(packageName)) {
                      "STATUS: AKTIF - slime hidup"
                  } else {
                      "STATUS: MATI - aktifkan layanan Slime di Aksesibilitas"
                  }
              }
          }
          SLIME_EOF

