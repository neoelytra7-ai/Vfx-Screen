          fun labeled(ctx: Context, label: String, v: View): LinearLayout =
              LinearLayout(ctx).apply {
                  orientation = LinearLayout.VERTICAL
                  addView(tv(ctx, label.uppercase(Locale.ROOT), 9.5f, Pal.dim, bold = true).apply { letterSpacing = 0.1f })
