              private fun log(s: String) = addLog(1, 0, s)
              private fun logW(s: String) = addLog(2, 0, s)
              private fun logE(s: String) = addLog(3, 0, s)

              private fun classify(line: String): Int {
                  val l = line.lowercase(Locale.ROOT)
                  return when {
                      l.startsWith("[error]") -> 3
                      l.startsWith("[warn") -> 2
                      l.startsWith("[debug]") -> 0
                      l.contains("error") || l.contains("fatal") || l.contains("assert") || l.contains("abort") ||
                          l.contains("bad_alloc") || l.contains("failed") || l.contains("cannot ") || l.contains("unable") -> 3
                      l.contains("warn") -> 2
                      else -> 1
                  }
              }

              private fun openRunLog(tag: String) {
                  try {
                      runLog?.close()
                      val dir = getExternalFilesDir(null) ?: filesDir
                      runLog = FileWriter(File(dir, "last_run.log"), false)
                      runLog?.write("MossMini " + tag + " | " + Date() + "\n")
                  } catch (e: Exception) { runLog = null }
              }

              private fun closeRunLog() {
                  try { runLog?.flush(); runLog?.close() } catch (e: Exception) { }
                  runLog = null
              }

              private fun acquireWake() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "MossMini:run").apply {
                          setReferenceCounted(false)
                          acquire(3L * 60 * 60 * 1000)
                      }
                  } catch (e: Exception) { wake = null }
              }

              private fun releaseWake() {
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
                  wake = null
              }

              // =====================================================================
              //  small helpers
              // =====================================================================
              private fun fmtDur(s: Long): String {
                  val t = if (s < 0L) 0L else s
                  val h = t / 3600
                  val m = (t % 3600) / 60
                  val sec = t % 60
                  return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, sec)
                  else String.format(Locale.US, "%d:%02d", m, sec)
              }

              private fun fmtSize(b: Long): String =
                  if (b >= (1L shl 30)) String.format(Locale.US, "%.2f GB", b / 1073741824.0)
                  else (b shr 20).toString() + " MB"

              private fun levelColor(l: Int): Int = when (l) {
                  0 -> Pal.g1
                  1 -> Pal.warn
                  2 -> Pal.err
                  else -> Pal.info
              }

              private fun availMemMb(): Long = try {
                  File("/proc/meminfo").readLines().first { it.startsWith("MemAvailable") }
                      .filter { it.isDigit() }.toLong() / 1024
              } catch (e: Exception) { -1L }

              private fun totalMemMb(): Long = try {
                  val mi = ActivityManager.MemoryInfo()
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  am.getMemoryInfo(mi)
                  mi.totalMem shr 20
              } catch (e: Exception) { -1L }

              private fun freeDiskMb(): Long = try { StatFs(modelDir.path).availableBytes shr 20 } catch (e: Exception) { -1L }

              private fun soc(): String =
                  if (Build.VERSION.SDK_INT >= 31) (Build.SOC_MANUFACTURER + " " + Build.SOC_MODEL) else Build.HARDWARE

              private fun battTempC(): Float {
                  val i = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  return if (i == null) -1f else i.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, -1) / 10f
              }

              private fun thermal(): Int =
                  if (Build.VERSION.SDK_INT >= 29) (getSystemService(Context.POWER_SERVICE) as PowerManager).currentThermalStatus else 0

              private fun stamp(m: MF, f: File): String = f.length().toString() + ":" + f.lastModified() + ":" + m.sha

              private fun isVerified(m: MF): Boolean {
                  val f = fileOf(m)
                  return f.exists() && f.length() == m.size && prefs.getString("v_" + m.id, "") == stamp(m, f)
              }

              private fun flagFor(id: String): String = when (id) {
                  "dit" -> "--diffusion-model"
                  "te" -> "--llm"
                  "vae" -> "--vae"
                  else -> "--tokenizer"
              }

              private fun hasFlag(f: String): Boolean = proven.contains(f) && helpText.contains(f)

              private fun signalOf(code: Int): Int = when (code) {
                  9, 137, 265, -9 -> 9
                  4, 132, 260, -4 -> 4
                  6, 134, 262, -6 -> 6
                  7, 135, 263, -7 -> 7
                  11, 139, 267, -11 -> 11
                  else -> 0
              }

              private fun pidOf(p: Process): Int {
                  try { return (p.javaClass.getMethod("pid").invoke(p) as Number).toInt() } catch (e: Exception) { }
                  try {
                      val f = p.javaClass.getDeclaredField("pid")
                      f.isAccessible = true
                      return f.getInt(p)
                  } catch (e: Exception) { }
                  return -1
              }

              /** returns [rssMb, peakMb, readMb], -1 when unavailable */
              private fun readProc(pid: Int): LongArray {
                  var rss = -1L
                  var hwm = -1L
                  var rd = -1L
                  try {
                      File("/proc/$pid/status").forEachLine { ln ->
                          if (ln.startsWith("VmRSS:")) rss = ln.filter { c -> c.isDigit() }.toLong() / 1024
                          else if (ln.startsWith("VmHWM:")) hwm = ln.filter { c -> c.isDigit() }.toLong() / 1024
                      }
                  } catch (e: Exception) { }
                  try {
                      File("/proc/$pid/io").forEachLine { ln ->
                          if (ln.startsWith("read_bytes:")) rd = ln.substringAfter(':').trim().toLong() shr 20
                      }
                  } catch (e: Exception) { }
                  return longArrayOf(rss, hwm, rd)
              }

              private fun loadManifest() {
                  val j = JSONObject(assets.open("manifest.json").bufferedReader().use { it.readText() })
                  sdCommit = j.optString("sd_commit")
                  peakRssMb = j.optLong("peak_rss_mb", 0L)
                  testInfo = j.optString("smoke")
                  builtAt = j.optString("built_at")
                  val rq = j.getJSONArray("required_flags")
                  reqFlags = List(rq.length()) { i -> rq.getString(i) }
                  val pv = j.optJSONArray("proven_flags")
                  proven = if (pv == null) emptyList() else List(pv.length()) { i -> pv.getString(i) }
                  val pa = j.getJSONArray("profiles")
                  profiles = List(pa.length()) { i ->
                      val o = pa.getJSONObject(i)
                      val fa = o.getJSONArray("flags")
                      val nm = o.getString("name")
                      Prof(nm, o.optString("kind", if (nm.contains("GPU")) "gpu" else "cpu"), List(fa.length()) { k -> fa.getString(k) })
                  }
                  val fl = j.getJSONArray("files")
                  files = List(fl.length()) { i ->
                      val o = fl.getJSONObject(i)
                      MF(o.getString("id"), o.getString("name"), o.getString("url"), o.getLong("size"), o.getString("sha256"))
                  }
                  fFrac = FloatArray(files.size)
                  fText = Array(files.size) { "checking\u2026" }
                  fLevel = IntArray(files.size) { 2 }
              }

              private fun engineHelp(bin: File): String? = try {
                  val pb = ProcessBuilder(bin.absolutePath, "--help").redirectErrorStream(true)
                  pb.environment()["LD_LIBRARY_PATH"] = libEnv
                  val p = pb.start()
                  val txt = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  txt
              } catch (e: Exception) {
                  logE("Engine failed to start: $e")
                  null
              }

              // =====================================================================
              //  compatibility check
              // =====================================================================
              private fun preflight() {
                  val out = ArrayList<Item>()
                  fun item(level: Int, text: String) { out.add(Item(level, text)) }

                  item(3, Build.MANUFACTURER + " " + Build.MODEL + " \u00B7 " + soc() + " \u00B7 Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")")

                  val abiOk = Build.SUPPORTED_64_BIT_ABIS.contains("arm64-v8a")
                  item(if (abiOk) 0 else 2, "CPU is arm64-v8a" + (if (abiOk) "" else " (this phone: " + Build.SUPPORTED_ABIS.joinToString() + ")"))

                  val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                  val binOk = bin.exists() && bin.canExecute()
                  item(if (binOk) 0 else 2, "Engine file present (" + (bin.length() shr 10) + " KB)")
                  if (binOk) {
                      if (helpText.isEmpty()) helpText = engineHelp(bin) ?: ""
                      if (helpText.isEmpty()) {
                          item(2, "Engine does not start (see Log)")
                      } else {
                          val missing = reqFlags.filter { !helpText.contains(it) }
                          item(if (missing.isEmpty()) 0 else 2,
                              if (missing.isEmpty()) "Engine supports all " + reqFlags.size + " flags this app needs"
                              else "Engine is missing: " + missing.joinToString(" "))
                      }
                  }

                  val ocl = listOf("/vendor/lib64/libOpenCL.so", "/system/vendor/lib64/libOpenCL.so", "/system/lib64/libOpenCL.so")
                      .firstOrNull { File(it).exists() }
                  item(if (ocl != null) 0 else 1,
                      if (ocl != null) "GPU: OpenCL driver found \u2192 Adreno path available" else "GPU: no libOpenCL.so found \u2192 CPU mode will be used")
                  val hex = listOf("/vendor/lib64/libcdsprpc.so", "/system/lib64/libcdsprpc.so").firstOrNull { File(it).exists() }
                  item(3, if (hex != null) "NPU: Hexagon present, but this engine has no NPU backend \u2192 GPU/CPU only"
                  else "NPU: not exposed to apps on this device")

                  var needBytes = 0L
                  var okFiles = 0
                  for (m in files) {
                      if (isVerified(m)) { okFiles++; continue }
                      val have = maxOf(fileOf(m).length(), partOf(m).length())
                      needBytes += maxOf(0L, m.size - have)
                  }
                  val needMb = needBytes shr 20
                  val freeMb = freeDiskMb()
                  item(if (freeMb >= needMb + 300) 0 else 2, "Storage: $freeMb MB free, $needMb MB still to download")
                  item(if (okFiles == files.size) 0 else 2, "Model files: $okFiles of ${files.size} verified")

                  val avail = availMemMb()
                  val total = totalMemMb()
                  val needRam = (peakRssMb * 1.15).toLong() + 200
                  val ramText = "RAM: $avail MB free of $total MB \u00B7 needs ~$needRam MB (CI peak $peakRssMb MB)"
                  when {
                      avail >= needRam -> item(0, ramText)
                      avail * 100 >= needRam * 80 -> item(1, "$ramText \u00B7 tight, close other apps for safety")
                      ignoreRamNow -> item(1, "$ramText \u00B7 IGNORED by you, may crash")
                      else -> item(2, "$ramText \u00B7 close other apps, then Re-check")
                  }

                  if (!busy) {
                      for ((i, m) in files.withIndex()) {
                          val f = fileOf(m)
                          when {
                              isVerified(m) -> { fFrac[i] = 1f; fText[i] = "verified"; fLevel[i] = 0 }
                              f.exists() && f.length() == m.size -> { fFrac[i] = 0.85f; fText[i] = "downloaded \u00B7 verify pending"; fLevel[i] = 1 }
                              partOf(m).exists() -> {
                                  val fr = partOf(m).length().toFloat() / m.size
                                  fFrac[i] = fr * 0.85f
                                  fText[i] = "partial " + (fr * 100).toInt() + "%"
                                  fLevel[i] = 1
                              }
                              else -> { fFrac[i] = 0f; fText[i] = "not downloaded"; fLevel[i] = 2 }
                          }
                      }
                  }

                  items = out
                  ready = out.none { it.level == 2 }
                  ui.post { renderCompat() }
              }

              private fun renderCompat() {
                  val its = items
                  val bad = its.count { x -> x.level == 2 }
                  val warn = its.count { x -> x.level == 1 }
                  if (bad > 0) cCompat.setBadge("$bad blocking", Pal.err)
                  else if (warn > 0) cCompat.setBadge("$warn warning", Pal.warn)
                  else cCompat.setBadge("all clear", Pal.g1)
                  val sb = SpannableStringBuilder()
                  val show = its.filter { x -> compatExpanded || x.level == 1 || x.level == 2 }
                  if (show.isEmpty()) {
                      sb.append("\u2713 " + its.size + " checks passed. Tap Details to see them.")
                  } else {
                      for (x in show) {
                          val mark = when (x.level) { 0 -> "\u2713 "; 1 -> "! "; 2 -> "\u2717 "; else -> "\u2022 " }
                          val s = sb.length
                          sb.append(mark)
                          sb.setSpan(ForegroundColorSpan(levelColor(x.level)), s, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                          sb.append(x.text).append('\n')
                      }
                  }
                  compatView.text = sb
                  cbFa.isEnabled = helpText.contains("--diffusion-fa")
                  cbFa.text = if (cbFa.isEnabled) "Flash attention (experimental, GPU only)" else "Flash attention (not in this engine)"
              }

              // =====================================================================
              //  download + verify
              // =====================================================================
              private fun setFile(i: Int, frac: Float, text: String, level: Int) {
                  fFrac[i] = frac
                  fText[i] = text
                  fLevel[i] = level
              }

              private fun overallFrac(): Float {
                  var tot = 0.0
                  var done = 0.0
                  for ((i, m) in files.withIndex()) { tot += m.size; done += m.size * fFrac[i] }
                  return if (tot <= 0.0) 0f else (done / tot).toFloat()
              }

              private fun remainingBytes(): Long {
                  var r = 0L
                  for ((i, m) in files.withIndex()) r += ((1f - fFrac[i]) * m.size).toLong()
                  return r
              }

              private fun sha256(f: File, label: String, idx: Int): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  val total = f.length()
                  var done = 0L
                  var lastUi = 0L
                  var lastT = System.currentTimeMillis()
                  f.inputStream().use { inp ->
                      val buf = ByteArray(1 shl 20)
                      while (true) {
                          if (cancel) throw RuntimeException("cancelled")
                          val n = inp.read(buf)
                          if (n < 0) break
                          md.update(buf, 0, n)
                          done += n
                          if (done - lastUi > (8L shl 20)) {
                              val now = System.currentTimeMillis()
                              val rate = (done - lastUi) / 1048576.0 / maxOf(0.001, (now - lastT) / 1000.0)
                              lastUi = done
                              lastT = now
                              val p = done.toFloat() / total
                              setFile(idx, 0.85f + 0.15f * p, "verifying " + (p * 100).toInt() + "%", 1)
                              dlInfo = String.format(Locale.US, "Verifying %s \u00B7 %.0f MB/s", label, rate)
                          }
                      }
                  }
                  return md.digest().joinToString("") { b -> String.format("%02x", b) }
              }

              private fun download(m: MF, idx: Int) {
                  val dest = fileOf(m)
                  val part = partOf(m)
                  val expected = m.size
                  if (part.exists() && part.length() > expected) part.delete()
                  val have = if (part.exists()) part.length() else 0L
                  val c = URL(m.url).openConnection() as HttpURLConnection
                  c.connectTimeout = 30000
                  c.readTimeout = 60000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "MossMini/1.0")
                  if (have > 0) c.setRequestProperty("Range", "bytes=$have-")
                  val code = c.responseCode
                  if (code == 416) { dest.delete(); part.renameTo(dest); return }
                  if (code !in 200..299) throw RuntimeException("HTTP $code")
                  val append = code == 206
                  val free = StatFs(modelDir.path).availableBytes
                  val need = expected - (if (append) have else 0L)
                  if (need > free - (200L shl 20)) throw RuntimeException("Not enough storage: need " + (need shr 20) + " MB, free " + (free shr 20) + " MB")
                  log("Downloading " + dest.name + " (" + fmtSize(expected) + ")" + (if (append) " \u00B7 resuming at " + fmtSize(have) else ""))
                  RandomAccessFile(part, "rw").use { raf ->
                      if (append) raf.seek(have) else raf.setLength(0)
                      var done = if (append) have else 0L
                      var lastDone = done
                      var lastT = System.currentTimeMillis()
                      c.inputStream.use { inp ->
                          val buf = ByteArray(1 shl 20)
                          while (true) {
                              if (cancel) throw RuntimeException("cancelled")
                              val n = inp.read(buf)
                              if (n < 0) break
                              raf.write(buf, 0, n)
                              done += n
                              val now = System.currentTimeMillis()
                              if (now - lastT >= 700) {
                                  val inst = (done - lastDone) / maxOf(0.001, (now - lastT) / 1000.0)
                                  dlRate = if (dlRate <= 0.0) inst else dlRate * 0.7 + inst * 0.3
                                  lastDone = done
                                  lastT = now
                                  val p = done.toFloat() / expected
                                  setFile(idx, 0.85f * p, "downloading " + (p * 100).toInt() + "%", 1)
                                  val eta = if (dlRate > 1.0) remainingBytes() / dlRate else 0.0
                                  dlInfo = String.format(Locale.US, "%.1f MB/s \u00B7 ETA %s \u00B7 %s left", dlRate / 1048576.0, fmtDur(eta.toLong()), fmtSize(remainingBytes()))
                              }
                          }
                      }
                  }
                  if (part.length() != expected) throw RuntimeException("incomplete: " + part.length() + " of " + expected + " bytes")
                  dest.delete()
                  if (!part.renameTo(dest)) throw RuntimeException("could not finalize file")
              }

              private fun downloadAll() {
                  if (busy) { return }
                  busy = true
                  phase = "dl"
                  cancel = false
                  dlRate = 0.0
                  dlInfo = "starting\u2026"
                  openRunLog("download")
                  try {
                      for ((i, m) in files.withIndex()) {
                          if (cancel) break
                          if (isVerified(m)) { setFile(i, 1f, "verified", 0); log(m.name + ": already verified"); continue }
                          val f = fileOf(m)
                          if (!(f.exists() && f.length() == m.size)) {
                              var ok = false
                              for (attempt in 1..4) {
                                  if (cancel) break
                                  try {
                                      download(m, i)
                                      ok = true
                                      break
                                  } catch (e: Exception) {
                                      if (cancel) break
                                      logW(m.name + " attempt " + attempt + " failed: " + e)
                                      setFile(i, fFrac[i], "retry $attempt/4: " + (e.message ?: "error"), 2)
                                      try { Thread.sleep(2000L * attempt) } catch (ie: InterruptedException) { }
                                  }
                              }
                              if (!ok) {
                                  if (!cancel) {
                                      logE(m.name + ": download did not finish. Tap Download again to resume.")
                                      setFile(i, fFrac[i], "failed \u00B7 tap to resume", 2)
                                  }
                                  continue
                              }
                          }
                          if (f.length() != m.size) {
                              logE(m.name + ": wrong size, deleted.")
                              f.delete()
                              setFile(i, 0f, "wrong size, deleted", 2)
                              continue
                          }
                          val h = sha256(f, m.name, i)
                          if (h == m.sha) {
                              prefs.edit().putString("v_" + m.id, stamp(m, f)).apply()
                              setFile(i, 1f, "verified", 0)
                              log(m.name + ": SHA-256 OK")
                          } else {
                              logE(m.name + ": SHA-256 MISMATCH. Expected " + m.sha.take(12) + ", got " + h.take(12) + ". File deleted (corrupt, or changed upstream after this app was built).")
                              f.delete()
                              prefs.edit().remove("v_" + m.id).apply()
                              setFile(i, 0f, "SHA mismatch, deleted", 2)
                          }
                      }
                      if (cancel) logW("Cancelled. Progress is kept; tap Download to resume.") else log("Download + verify step finished.")
                  } catch (e: Exception) {
                      if (cancel) logW("Cancelled.") else logE("Download/verify error: $e")
                  } finally {
                      closeRunLog()
                      busy = false
                      phase = "idle"
                      dlInfo = ""
                      preflight()
                  }
              }

              // =====================================================================
              //  generate
              // =====================================================================
              private fun onGenClick() {
                  if (busy && phase == "gen") {
                      cancel = true
                      proc?.destroyForcibly()
                      logW("Stop requested.")
                      return
                  }
                  if (busy || !ready) return
                  val text = prompt.text.toString().trim()
                  if (text.isEmpty()) { logW("Write a prompt first."); return }
                  val size = listOf(256, 384, 512)[segSize.selected]
                  val st = (steps.text.toString().toIntOrNull() ?: 20).coerceIn(1, 60)
                  val c = (cfg.text.toString().toDoubleOrNull() ?: 3.0).coerceIn(0.0, 20.0)
                  val sd = seed.text.toString().trim().toLongOrNull() ?: (System.currentTimeMillis() % 1000000000L)
                  val th = (threads.text.toString().toIntOrNull() ?: 4).coerceIn(1, 8)
                  prefs.edit().putInt("size_i", segSize.selected).putInt("mode_i", segMode.selected)
                      .putString("steps", st.toString()).putString("cfg", c.toString())
                      .putString("threads", th.toString()).putString("prompt", text).apply()
                  val req = Req(text, size, st, c, sd, th, segMode.selected, cbFa.isChecked && cbFa.isEnabled)
                  thread { runGenerate(req) }
              }

              private fun runGenerate(r: Req) {
                  if (busy) return
                  busy = true
                  phase = "gen"
                  cancel = false
                  hs = 1
                  attempts.clear()
                  diagText = ""
                  doneInfo = ""
                  runStart = System.currentTimeMillis()
                  runEnd = 0L
                  rssPeak = 0L
                  rssNow = 0L
                  stage = 0
                  stepNow = 0
                  stepTotal = 0
                  secIt = 0.0
                  openRunLog("generate")
                  acquireWake()
                  var produced = false
                  try {
                      preflight()
                      if (!ready) {
                          logE("Not generating: a compatibility check failed (see Compatibility).")
                          hs = 3
                          diagText = "Cause: a compatibility check failed.\nFix: open the Compatibility card and fix the red items."
                          return
                      }
                      var order = profiles.filter { p -> when (r.mode) { 1 -> p.kind == "gpu"; 2 -> p.kind == "cpu"; else -> true } }
                      if (r.mode == 0) {
                          val last = prefs.getString("last_profile", "") ?: ""
                          order = order.sortedBy { p -> if (p.name == last) 0 else 1 }
                      }
                      if (order.isEmpty()) {
                          logE("No engine mode matches this selection.")
                          hs = 3
                          diagText = "Cause: no engine mode matches your Engine choice.\nFix: set Engine to Auto."
                          return
                      }
                      log("Free RAM before start: " + availMemMb() + " MB of " + totalMemMb() + " MB | seed " + r.seed)
                      for ((k, p) in order.withIndex()) {
                          if (cancel) break
                          attemptIdx = k + 1
                          attemptTotal = order.size
                          log("--- Try " + (k + 1) + "/" + order.size + ": " + p.name)
                          val res = runOnce(p, r)
                          if (res == 0) {
                              prefs.edit().putString("last_profile", p.name).apply()
                              produced = true
                              break
                          }
                          if (res == 2) break
                          if (k < order.size - 1) logW("This mode did not produce an image. Trying the next mode.")
                      }
                      hs = if (produced) 2 else if (cancel) 0 else 3
                      if (produced) diagText = ""
                      if (!produced && !cancel) {
                          if (diagText.isEmpty()) diagText = "Cause: no mode produced an image.\nFix: tap Share report and send it."
                          logE("No mode produced an image. Use Share report for debugging.")
                      }
                  } catch (e: Exception) {
                      logE("ERR: $e")
                      hs = 3
                      diagText = "Cause: unexpected app error: $e\nFix: tap Share report."
                  } finally {
                      if (runEnd == 0L) runEnd = System.currentTimeMillis()
                      releaseWake()
                      closeRunLog()
                      proc = null
                      enginePid = -1
                      busy = false
                      phase = "idle"
                  }
              }

              private fun pumpLines(inp: InputStream, onLine: (String) -> Unit) {
                  val acc = ByteArrayOutputStream()
                  val buf = ByteArray(4096)
                  while (true) {
                      val n = inp.read(buf)
                      if (n < 0) break
                      for (i in 0 until n) {
                          val b = buf[i].toInt()
                          if (b == 10 || b == 13) {
                              if (acc.size() > 0) { onLine(acc.toString("UTF-8")); acc.reset() }
                          } else {
                              acc.write(b)
                              if (acc.size() > 8192) { onLine(acc.toString("UTF-8")); acc.reset() }
                          }
                      }
                  }
                  if (acc.size() > 0) onLine(acc.toString("UTF-8"))
              }

              private fun advanceStage(l: String) {
                  val s = when {
                      l.contains("save result") || l.contains("save_image") || l.contains("saved") -> 4
                      l.contains("decoding") || l.contains("decode_first_stage") || l.contains("sampling completed") -> 3
                      l.contains("start sampling") || l.contains("sampling using") || l.contains("get_learned_condition completed") -> 2
                      l.contains("generating image") || l.contains("get_learned_condition") || l.contains("tokeniz") -> 1
                      else -> -1
                  }
                  if (s > stage) stage = s
              }

              private fun onEngineLine(raw: String) {
                  val line = raw.trim()
                  if (line.isEmpty()) return
                  lastOutMs = System.currentTimeMillis()
                  val m = stepRe.find(line)
                  if (m != null) {
                      val a = m.groupValues[1].toIntOrNull() ?: 0
                      val b = m.groupValues[2].toIntOrNull() ?: 0
                      var v = m.groupValues[3].toDoubleOrNull() ?: 0.0
                      if (m.groupValues[4] == "it/s") v = if (v > 0.0) 1.0 / v else 0.0
                      if (b in 1..999) {
                          val changed = a != stepNow
                          stepNow = a
                          stepTotal = b
                          if (v > 0.0) secIt = v
                          if (stage < 2) stage = 2
                          lastLine = "step $a/$b"
                          if (changed) addLog(1, 1, String.format(Locale.US, "step %d/%d \u00B7 %.2f s/it", a, b, v))
                          return
                      }
                  }
                  val l = line.lowercase(Locale.ROOT)
                  advanceStage(l)
                  if (l.contains("opencl")) {
                      sawOcl = true
                      if (l.contains("device")) gpuName = line.substringAfter("device:", line).trim().take(44)
                  }
                  lastLine = line
                  addLog(classify(line), 1, line)
              }

              private fun recentEngineText(): String {
                  val snap = synchronized(logs) { ArrayList(logs) }
                  return snap.filter { e -> e.src == 1 }.takeLast(150).joinToString("\n") { e -> e.text }.lowercase(Locale.ROOT)
              }

              private fun diagnose(code: Int, p: Prof, peak: Long): String {
                  val txt = recentEngineText()
                  val sig = signalOf(code)
                  val free = availMemMb()
                  return when {
                      sig == 9 -> "Cause: Android killed the engine (out of memory). Engine peak $peak MB, free RAM now $free MB.\nFix: close other apps, choose size 256 or 384, or reboot to free RAM, then try again."
                      sig == 4 -> "Cause: illegal CPU instruction (this build targets ARMv8.6 i8mm/bf16).\nFix: tap Share report; the build needs a lower -march."
                      sig == 11 || sig == 6 || sig == 7 ->
                          if (p.kind == "gpu") "Cause: engine crashed in GPU mode (signal $sig), usually the OpenCL driver.\nFix: set Engine = CPU, or turn off Flash attention."
                          else "Cause: engine crashed (signal $sig).\nFix: tap Share report."
                      txt.contains("bad_alloc") || txt.contains("out of memory") || txt.contains("failed to allocate") ||
                          txt.contains("cl_mem_object_allocation_failure") || txt.contains("cl_out_of_resources") ->
                          "Cause: a memory allocation failed (RAM or GPU memory).\nFix: smaller size, close other apps, or Engine = CPU."
                      txt.contains("opencl") && (txt.contains("error") || txt.contains("failed")) ->
                          "Cause: OpenCL error in the GPU driver.\nFix: Engine = CPU, or retry; the first GPU run compiles kernels."
                      txt.contains("unknown model architecture") || txt.contains("unsupported") || txt.contains("unknown type") ->
                          "Cause: the engine rejected a model file (architecture or quantization not supported by this engine build).\nFix: rebuild with a newer sd_cpp_ref."
                      txt.contains("no such file") || txt.contains("failed to open") || txt.contains("cannot open") ->
                          "Cause: the engine could not open a model file.\nFix: run Download + verify again."
                      code != 0 -> "Cause: engine exited with code $code and no recognizable error.\nLast engine line: $lastLine"
                      else -> "Cause: engine finished but wrote no image.\nFix: tap Share report."
                  }
              }

              /** 0 = image made, 1 = failed (try next mode), 2 = stop everything */
              private fun runOnce(p: Prof, r: Req): Int {
                  val out = File(cacheDir, "out.png")
                  out.delete()
                  stage = 0
                  stepNow = 0
                  stepTotal = 0
                  secIt = 0.0
                  sawOcl = false
                  gpuName = ""
                  curKind = p.kind
                  lastLine = "starting engine\u2026"
                  lastReadT = 0L
                  lastReadMb = 0L
                  diskRate = 0L
                  rssPeak = 0L
                  rssNow = 0L
                  lastOutMs = System.currentTimeMillis()

                  val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                  val cmd = ArrayList<String>()
                  cmd.add(bin.absolutePath)
                  for (m in files) {
                      cmd.add(flagFor(m.id))
                      cmd.add(fileOf(m).absolutePath)
                  }
                  cmd.addAll(p.flags)
                  if (hasFlag("--vae-tiling")) cmd.add("--vae-tiling")
                  if (hasFlag("--threads")) { cmd.add("--threads"); cmd.add(r.threads.toString()) }
                  if (hasFlag("--seed")) { cmd.add("--seed"); cmd.add(r.seed.toString()) }
                  if (r.fa && p.kind == "gpu" && helpText.contains("--diffusion-fa")) cmd.add("--diffusion-fa")
                  cmd.addAll(listOf("-p", r.prompt, "-W", r.size.toString(), "-H", r.size.toString(),
                      "--steps", r.steps.toString(), "--cfg-scale", r.cfg.toString(), "-o", out.absolutePath, "-v"))
                  log("RUN: " + cmd.joinToString(" "))

                  val t0 = System.currentTimeMillis()
                  val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                  pb.environment()["LD_LIBRARY_PATH"] = libEnv
                  val pr = pb.start()
                  proc = pr
                  enginePid = pidOf(pr)
                  pumpLines(pr.inputStream) { ln -> onEngineLine(ln) }
                  val code = pr.waitFor()
                  val secs = (System.currentTimeMillis() - t0) / 1000
                  val peak = rssPeak
                  enginePid = -1
                  failStage = stage
                  log("exit=" + code + " | " + secs + " s | engine peak RSS " + peak + " MB | free RAM " + availMemMb() + " MB")

                  if (cancel) {
                      attempts.add(Attempt(p.name, code, secs, peak, "stopped by you"))
                      logW("Stopped.")
                      return 2
                  }
                  val sig = signalOf(code)
                  if (code != 0 || !out.exists()) {
                      val d = diagnose(code, p, peak)
                      diagText = d
                      val firstLine = d.substringBefore('\n').removePrefix("Cause: ")
                      attempts.add(Attempt(p.name, code, secs, peak, firstLine))
                      logE(d.replace('\n', ' '))
                      return if (sig == 9) 2 else 1
                  }
                  val bmp = BitmapFactory.decodeFile(out.absolutePath)
                  if (bmp == null) {
                      diagText = "Cause: the engine wrote an unreadable image.\nFix: tap Share report."
                      attempts.add(Attempt(p.name, code, secs, peak, "unreadable image"))
                      logE("Engine wrote an unreadable image.")
                      return 1
                  }
                  if (looksBlank(bmp)) {
                      diagText = "Cause: the image is blank/flat, so this mode did not really work.\nFix: try Engine = CPU or more steps."
                      attempts.add(Attempt(p.name, code, secs, peak, "blank image"))
                      logE("The image is blank/flat, so this mode did not really work.")
                      return 1
                  }
                  var note = "ok"
                  if (p.kind == "gpu" && !sawOcl) {
                      note = "ok, but no OpenCL device was reported: it probably ran on CPU"
                      logW("GPU mode was requested but the engine never reported an OpenCL device. It likely fell back to CPU.")
                  }
                  attempts.add(Attempt(p.name, code, secs, peak, note))
                  doneInfo = r.size.toString() + "\u00D7" + r.size + " \u00B7 " + r.steps + " steps \u00B7 cfg " + r.cfg + " \u00B7 seed " + r.seed +
                      " \u00B7 " + p.kind.uppercase(Locale.ROOT) + " \u00B7 " + fmtDur(secs)
                  stage = 5
                  ui.post { showImage(bmp) }
                  saveToGallery(out)
                  return 0
              }

              private fun looksBlank(b: Bitmap): Boolean {
                  val stepX = maxOf(1, b.width / 32)
                  val stepY = maxOf(1, b.height / 32)
                  var sum = 0.0
                  var sq = 0.0
                  var n = 0
                  var y = 0
                  while (y < b.height) {
                      var x = 0
                      while (x < b.width) {
                          val px = b.getPixel(x, y)
                          val l = (((px shr 16) and 0xff) + ((px shr 8) and 0xff) + (px and 0xff)) / 3.0
                          sum += l
                          sq += l * l
                          n++
                          x += stepX
                      }
                      y += stepY
                  }
                  if (n == 0) return true
                  val mean = sum / n
                  return (sq / n - mean * mean) < 9.0
              }

              private fun showImage(bmp: Bitmap) {
                  img.setImageBitmap(bmp)
                  resultInfo.text = doneInfo
                  cResult.root.visibility = View.VISIBLE
                  scrollRoot.post { scrollRoot.smoothScrollTo(0, cResult.root.top - dp(8)) }
              }

              private fun saveToGallery(f: File) {
                  try {
                      val name = "mossmini_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".png"
                      val v = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/MossMini")
                      }
                      val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return
                      contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { i -> i.copyTo(o) } }
                      log("Saved to Pictures/MossMini/" + name)
                  } catch (e: Exception) {
                      logW("Gallery save failed: $e")
                  }
              }

              // =====================================================================
              //  report (for debugging)
              // =====================================================================
              private fun buildReport(): String {
                  val sb = StringBuilder()
                  sb.append("MossMini report\n")
                  sb.append("app ").append(appVer).append(" | engine ").append(sdCommit.take(12)).append(" | built ").append(builtAt).append('\n')
                  sb.append("device ").append(Build.MANUFACTURER).append(' ').append(Build.MODEL).append(" | ").append(soc())
                      .append(" | android ").append(Build.VERSION.RELEASE).append('\n')
                  sb.append("ram total ").append(totalMemMb()).append(" MB, free ").append(availMemMb()).append(" MB | disk free ")
                      .append(freeDiskMb()).append(" MB\n")
                  sb.append("temp ").append(battTempC()).append(" C, thermal ").append(thermal()).append('\n')
                  sb.append("CI: ").append(testInfo).append('\n')
                  sb.append("proven flags: ").append(proven.joinToString(" ")).append('\n')
                  sb.append("\n-- checks\n")
                  for (x in items) sb.append(listOf("[ok]", "[warn]", "[FAIL]", "[info]")[x.level.coerceIn(0, 3)]).append(' ').append(x.text).append('\n')
                  sb.append("\n-- attempts\n")
                  for (a in attempts) sb.append(a.label).append(" | exit ").append(a.code).append(" | ").append(a.secs).append("s | peak ")
                      .append(a.peakMb).append(" MB | ").append(a.note).append('\n')
                  if (diagText.isNotEmpty()) sb.append("\n-- diagnosis\n").append(diagText).append('\n')
                  val snap = synchronized(logs) { ArrayList(logs) }
                  sb.append("\n-- warnings and errors (last 40)\n")
                  for (e in snap.filter { e -> e.lvl >= 2 }.takeLast(40)) sb.append(e.text).append('\n')
                  sb.append("\n-- log tail (last 120 lines)\n")
                  for (e in snap.takeLast(120)) sb.append(e.text).append('\n')
                  val s = sb.toString()
                  return if (s.length > 60000) s.takeLast(60000) else s
              }

              // =====================================================================
              //  rendering (UI thread only)
              // =====================================================================
              private fun sampleProc(now: Long) {
                  val pid = enginePid
                  if (pid <= 0) return
                  val s = readProc(pid)
                  if (s[0] >= 0) {
                      rssNow = s[0]
                      if (s[0] > rssPeak) rssPeak = s[0]
                  }
                  if (s[1] > rssPeak) rssPeak = s[1]
                  if (s[2] >= 0) {
                      if (lastReadT == 0L) {
                          lastReadMb = s[2]
                          lastReadT = now
                      } else {
                          val dt = (now - lastReadT) / 1000.0
                          if (dt > 0.3) {
                              diskRate = ((s[2] - lastReadMb) / dt).toLong().coerceAtLeast(0L)
                              lastReadMb = s[2]
                              lastReadT = now
                          }
                      }
                  }
              }

              private fun hintText(silentS: Long): String = when {
                  silentS < 25 -> ""
                  stage <= 0 && diskRate >= 1 -> "Loading weights from storage ($diskRate MB/s). Normal with 4 GB RAM."
                  stage <= 0 -> "Quiet for ${silentS}s, no disk reads: GPU kernels may be compiling (first run can take 1-3 min)."
                  stage == 2 && stepNow == 0 -> "First step is the slowest (kernel compile + weight paging). Wait for step 1."
                  else -> "Quiet for ${silentS}s. Engine is still alive."
              }

              private fun renderHero(now: Long, running: Boolean, dling: Boolean) {
                  var chipT = "IDLE"
                  var chipC = Pal.sub
                  var title = ""
                  var sub = ""
                  var stg = -1
                  var fail = false
                  var frac = 0f
                  var indet = false
                  when {
                      running -> {
                          chipT = "RUNNING"
                          chipC = Pal.warn
                          stg = stage.coerceIn(0, 4)
                          title = when (stg) {
                              0 -> "Loading models"
                              1 -> "Encoding prompt"
                              2 -> if (stepTotal > 0) "Sampling  $stepNow / $stepTotal" else "Starting sampler"
                              3 -> "Decoding image"
                              else -> "Saving"
                          }
                          sub = "\u25B8 " + lastLine
                          if (stg == 2 && stepTotal > 0) frac = stepNow.toFloat() / stepTotal else indet = true
                      }
                      dling -> {
                          chipT = "DOWNLOADING"
                          chipC = Pal.info
                          title = "Fetching model files"
                          sub = dlInfo
                          frac = overallFrac()
                      }
                      hs == 2 -> {
                          chipT = "DONE"
                          chipC = Pal.g1
                          stg = 5
                          title = "Image ready"
                          sub = doneInfo
                          frac = 1f
                      }
                      hs == 3 -> {
                          chipT = "FAILED"
                          chipC = Pal.err
                          stg = failStage.coerceIn(0, 4)
                          fail = true
                          title = "Generation failed"
                          sub = "See the diagnosis below"
                      }
                      ready -> {
                          chipT = "READY"
                          chipC = Pal.g1
                          title = "Ready to generate"
                          sub = items.size.toString() + " checks passed \u00B7 engine " + sdCommit.take(8)
                      }
                      else -> {
                          chipT = "BLOCKED"
                          chipC = Pal.warn
                          title = "Setup needed"
                          sub = items.firstOrNull { x -> x.level == 2 }?.text ?: "checking\u2026"
                      }
                  }
                  heroChip.text = chipT
                  heroChip.recolor(chipC)
                  heroTitle.text = title
                  heroSub.text = sub
                  strip.stage = stg
                  strip.failed = fail
                  heroBar.indeterminate = indet
                  heroBar.frac = frac
                  heroBar.color = if (fail) Pal.err else if (hs == 2 && !running) Pal.g1 else Pal.g2
                  heroBeat.text = if (busy) (if (beat) "\u25CF live" else "\u25CB live") else ""

                  if (running || dling || hs == 2) {
                      val k = curKind.uppercase(Locale.ROOT)
                      var mt = if (k.isEmpty()) "" else k
                      if (gpuName.isNotEmpty()) mt += " \u00B7 " + gpuName
                      if (attemptTotal > 1) mt += " \u00B7 try $attemptIdx/$attemptTotal"
                      if (mt.isNotEmpty() && !dling) {
                          heroMode.text = mt
                          heroMode.recolor(if (curKind == "gpu") Pal.info else Pal.sub)
                          heroMode.visibility = View.VISIBLE
                      } else heroMode.visibility = View.GONE
                  } else heroMode.visibility = View.GONE

                  val silent = if (running) (now - lastOutMs) / 1000 else 0L
                  val hint = if (running) hintText(silent) else ""
                  heroHint.text = hint
                  heroHint.visibility = if (hint.isEmpty()) View.GONE else View.VISIBLE

                  // action button
                  val showAct = !busy && !ready && hs != 3
                  heroAction.visibility = if (showAct) View.VISIBLE else View.GONE
                  if (showAct) {
                      val filesBad = files.indices.any { i -> fLevel[i] != 0 }
                      heroAction.text = if (filesBad) "Go to model files" else "Open checks"
                  }

                  // diagnosis + attempts
                  val sbd = StringBuilder()
                  if (hs == 3 && diagText.isNotEmpty() && !running) sbd.append(diagText)
                  if (attempts.isNotEmpty()) {
                      if (sbd.isNotEmpty()) sbd.append("\n\n")
                      sbd.append("Attempts\n")
                      for ((i, a) in attempts.withIndex()) {
                          sbd.append(i + 1).append(". ").append(a.label.substringBefore(" (")).append("  exit ").append(a.code)
                              .append("  ").append(fmtDur(a.secs)).append("  peak ").append(a.peakMb).append(" MB\n    ").append(a.note).append('\n')
                      }
                  }
                  if (sbd.isEmpty()) {
                      heroDiagBox.visibility = View.GONE
                  } else {
                      heroDiagBox.visibility = View.VISIBLE
                      heroDiag.text = sbd.toString().trimEnd()
                      val tone = if (hs == 3) 1 else 0
                      if (tone != diagTone) {
                          diagTone = tone
                          val c = if (tone == 1) Pal.err else Pal.warn
                          heroDiagBox.background = rounded(this, 14, (c and 0xFFFFFF) or 0x1A000000, (c and 0xFFFFFF) or 0x55000000)
                      }
                  }

                  // stats
                  val el = ((if (running) now else if (runEnd > 0L) runEnd else now) - runStart) / 1000
                  if (running || hs == 2 || hs == 3) {
                      sElapsed.value.text = fmtDur(el)
                      sStep.value.text = if (stepTotal > 0) "$stepNow/$stepTotal" else "-"
                      sSpeed.value.text = if (secIt > 0.0) String.format(Locale.US, "%.1fs", secIt) else "-"
                      sEta.value.text = if (running && stage == 2 && stepTotal > 0 && secIt > 0.0) "~" + fmtDur(((stepTotal - stepNow) * secIt).toLong()) else "-"
                      sRam.value.text = if (rssNow > 0) rssNow.toString() + "M" else "-"
                      sPeak.value.text = if (rssPeak > 0) rssPeak.toString() + "M" else "-"
                  }
                  val free = availMemMb()
                  sFree.value.text = if (free >= 0) free.toString() + "M" else "-"
                  sFree.value.setTextColor(if (free in 0..600) Pal.err else if (free in 0..1200) Pal.warn else Pal.text)
                  sDisk.value.text = if (running) diskRate.toString() + "M/s" else "-"

                  // temperature chip
                  val tc = battTempC()
                  val th = thermal()
                  if (tc > 0f) {
                      val hot = th >= 3 || tc >= 45f
                      val warm = th >= 2 || tc >= 40f
                      heroTemp.text = String.format(Locale.US, "%.0f\u00B0C", tc) + (if (th >= 2) " \u00B7 hot" else "")
                      heroTemp.recolor(if (hot) Pal.err else if (warm) Pal.warn else Pal.g2)
                      heroTemp.visibility = View.VISIBLE
                  } else heroTemp.visibility = View.GONE
              }

              private fun renderFiles(dling: Boolean) {
                  for (i in files.indices) {
                      rowState[i].text = fText[i]
                      rowState[i].setTextColor(if (fLevel[i] == 0) Pal.g1 else if (fLevel[i] == 1) Pal.warn else Pal.err)
                      rowBar[i].frac = fFrac[i]
                      rowBar[i].color = if (fLevel[i] == 0) Pal.g1 else if (fLevel[i] == 1) Pal.warn else Pal.err
                  }
                  val ok = fLevel.count { l -> l == 0 }
                  cFiles.setBadge("$ok / ${files.size} verified", if (ok == files.size) Pal.g1 else Pal.warn)
                  val total = files.sumOf { m -> m.size }
                  dlSummary.text = if (dling) dlInfo else "${files.size} files \u00B7 " + fmtSize(total) + " \u00B7 resumable"
                  dlBar.frac = overallFrac()
                  dlBar.color = if (ok == files.size) Pal.g1 else Pal.warn

                  val st = if (busy && phase == "dl") 1 else if (busy) 2 else 0
                  if (st != btnDlState) {
                      btnDlState = st
                      btnDl.text = if (st == 1) "Stop" else "Download + verify all"
                      btnDl.paint(if (st == 1) 3 else 1)
                      btnDl.alpha = if (st == 2) 0.45f else 1f
                      btnDl.isEnabled = st != 2
                  }
              }

              private fun renderGenButton() {
                  val st = if (busy && phase == "gen") 2 else if (!busy && ready) 0 else 1
                  if (st != btnGenState) {
                      btnGenState = st
                      btnGen.text = if (st == 2) "Stop" else "Generate"
                      btnGen.paint(if (st == 2) 3 else 0)
                      btnGen.alpha = if (st == 1) 0.4f else 1f
                      btnGen.isEnabled = st != 1
                  }
                  if (!busy && ready) cCreate.setBadge("ready", Pal.g1)
                  else if (busy && phase == "gen") cCreate.setBadge("running", Pal.warn)
                  else cCreate.setBadge("blocked", Pal.warn)
              }

              private fun renderLog() {
                  val snap = synchronized(logs) { logDirty = false; ArrayList(logs) }
                  val sel = snap.filter { e ->
                      when (logFilter) {
                          0 -> e.lvl >= 1
                          1 -> e.lvl >= 2
                          2 -> true
                          else -> e.src == 0
                      }
                  }.takeLast(300)
                  val sb = SpannableStringBuilder()
                  for (e in sel) {
                      val col = when {
                          e.lvl >= 3 -> Pal.err
                          e.lvl == 2 -> Pal.warn
                          e.lvl == 0 -> Pal.dim
                          e.src == 0 -> Pal.info
                          else -> Pal.sub
                      }
                      val s = sb.length
                      sb.append(clock.format(Date(e.t))).append(' ').append(e.text).append('\n')
                      sb.setSpan(ForegroundColorSpan(col), s, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  }
                  val atBottom = logScroll.scrollY + logScroll.height >= logView.height - dp(48)
                  logView.text = sb
                  if (atBottom) logScroll.post { logScroll.scrollTo(0, logView.height) }
              }

              private fun renderAll() {
                  val now = System.currentTimeMillis()
                  beat = !beat
                  val running = busy && phase == "gen"
                  val dling = busy && phase == "dl"
                  if (running) sampleProc(now)
                  renderHero(now, running, dling)
                  renderFiles(dling)
                  renderGenButton()
                  if (logDirty) renderLog()
              }

              // =====================================================================
              //  UI construction
              // =====================================================================
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Pal.bg
                  window.navigationBarColor = Pal.bg
                  try {
                      loadManifest()
                      appVer = packageManager.getPackageInfo(packageName, 0).versionName ?: ""
                  } catch (e: Exception) {
                      val t = TextView(this)
                      t.text = "manifest.json is missing or broken in this build: " + e
                      t.setTextColor(Pal.text)
                      t.setBackgroundColor(Pal.bg)
                      t.setPadding(dp(20), dp(60), dp(20), dp(20))
                      setContentView(t)
                      return
                  }
                  ignoreRamNow = prefs.getBoolean("ign_ram", false)
                  buildUi()
                  log("MossMini " + appVer + " | " + Build.MODEL + " | " + soc() + " | Android " + Build.VERSION.SDK_INT)
                  log("Log file: " + File(getExternalFilesDir(null) ?: filesDir, "last_run.log").absolutePath)
                  ui.post(tick)
                  thread { preflight() }
              }

              private fun lpTop(top: Int): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(top) }

              private fun buildUi() {
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT
                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.setPadding(dp(14), dp(14), dp(14), dp(40))
                  scrollRoot = ScrollView(this)
                  scrollRoot.setBackgroundColor(Pal.bg)
                  scrollRoot.fitsSystemWindows = true
                  scrollRoot.addView(content, ViewGroup.LayoutParams(mp, wc))

                  // ---------- header
                  val head = LinearLayout(this)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  val title = tv(this, "MossMini", 30f, Pal.text)
                  title.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  head.addView(title, LinearLayout.LayoutParams(0, wc, 1f))
                  head.addView(chip(this, "v$appVer", Pal.sub))
                  content.addView(head)
                  val sub = tv(this, "MOSS-Image SFT \u00B7 on-device \u00B7 GPU first, CPU fallback", 12.5f, Pal.sub)
                  content.put(sub, 4)
                  val meta = LinearLayout(this)
                  meta.orientation = LinearLayout.HORIZONTAL
                  meta.addView(chip(this, "sd.cpp " + sdCommit.take(7), Pal.info))
                  val ci = chip(this, if (testInfo.startsWith("SKIPPED")) "CI test skipped" else "CI test passed", if (testInfo.startsWith("SKIPPED")) Pal.warn else Pal.g1)
                  meta.addView(ci, LinearLayout.LayoutParams(wc, wc).apply { leftMargin = dp(8) })
                  if (builtAt.isNotEmpty()) meta.addView(chip(this, builtAt, Pal.sub), LinearLayout.LayoutParams(wc, wc).apply { leftMargin = dp(8) })
                  val metaScroll = HorizontalScrollView(this)
                  metaScroll.isHorizontalScrollBarEnabled = false
                  metaScroll.addView(meta)
                  content.put(metaScroll, 10)

                  // ---------- hero
                  val hero = LinearLayout(this)
                  hero.orientation = LinearLayout.VERTICAL
                  hero.background = rounded(this, 26, Pal.surface2, Pal.stroke)
                  hero.setPadding(dp(18), dp(16), dp(18), dp(18))
                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  heroChip = chip(this, "IDLE", Pal.sub)
                  heroMode = chip(this, "", Pal.info)
                  heroMode.visibility = View.GONE
                  heroTemp = chip(this, "", Pal.g2)
                  heroTemp.visibility = View.GONE
                  heroBeat = tv(this, "", 11f, Pal.g1, mono = true)
                  top.addView(heroChip)
                  top.addView(heroMode, LinearLayout.LayoutParams(wc, wc).apply { leftMargin = dp(6) })
                  top.addView(heroTemp, LinearLayout.LayoutParams(wc, wc).apply { leftMargin = dp(6) })
                  top.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  top.addView(heroBeat)
                  hero.addView(top)
                  heroTitle = tv(this, "Starting\u2026", 26f, Pal.text)
                  heroTitle.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  hero.put(heroTitle, 14)
                  heroSub = tv(this, "", 11.5f, Pal.sub, mono = true)
                  heroSub.maxLines = 2
                  heroSub.ellipsize = TextUtils.TruncateAt.END
                  hero.put(heroSub, 6)
                  strip = StageStrip(this, stageNames)
                  hero.put(strip, 14)
                  heroBar = BarView(this)
                  hero.put(heroBar, 4, h = dp(6))
                  sElapsed = Stat(this, "elapsed")
                  sStep = Stat(this, "step")
                  sSpeed = Stat(this, "s / it")
                  sEta = Stat(this, "eta")
                  sRam = Stat(this, "engine ram")
                  sPeak = Stat(this, "peak")
                  sFree = Stat(this, "free ram")
                  sDisk = Stat(this, "disk read")
                  hero.put(statRow(this, sElapsed, sStep, sSpeed, sEta), 16)
                  hero.put(statRow(this, sRam, sPeak, sFree, sDisk), 14)
                  heroHint = tv(this, "", 12f, Pal.warn)
                  heroHint.visibility = View.GONE
                  hero.put(heroHint, 12)
                  heroDiagBox = LinearLayout(this)
                  heroDiagBox.orientation = LinearLayout.VERTICAL
                  heroDiagBox.setPadding(dp(14), dp(12), dp(14), dp(12))
                  heroDiag = tv(this, "", 12f, Pal.text)
                  heroDiag.setLineSpacing(0f, 1.15f)
                  heroDiagBox.addView(heroDiag)
                  heroDiagBox.visibility = View.GONE
                  hero.put(heroDiagBox, 14)
                  heroAction = pill(this, "Go to model files", 1, compact = true)
                  heroAction.visibility = View.GONE
                  heroAction.setOnClickListener {
                      val filesBad = files.indices.any { i -> fLevel[i] != 0 }
                      val target = if (filesBad) cFiles.root else cCompat.root
                      scrollRoot.smoothScrollTo(0, target.top - dp(8))
                  }
                  hero.put(heroAction, 14)
                  content.put(hero, 14)

                  // ---------- create
                  cCreate = Card(this, "Create")
                  prompt = fieldView(this, "Describe your image",
                      prefs.getString("prompt", "a lighthouse on a cliff at dawn, volumetric light, highly detailed") ?: "", multiline = true)
                  cCreate.put(prompt, 12)
                  val exs = listOf(
                      "Lighthouse" to "a lighthouse on a cliff at dawn, volumetric light, highly detailed",
                      "Neon alley" to "a rainy neon-lit alley in a cyberpunk city, reflections, cinematic",
                      "Moss temple" to "an ancient moss-covered temple deep in a misty forest, soft light"
                  )
                  val exRow = LinearLayout(this)
                  exRow.orientation = LinearLayout.HORIZONTAL
                  for ((nm, txt) in exs) {
                      val c = chip(this, nm, Pal.info)
                      c.setOnClickListener { prompt.setText(txt) }
                      exRow.addView(c, LinearLayout.LayoutParams(wc, wc).apply { rightMargin = dp(8) })
                  }
                  val exScroll = HorizontalScrollView(this)
                  exScroll.isHorizontalScrollBarEnabled = false
                  exScroll.addView(exRow)
                  cCreate.put(exScroll, 10)

                  segSize = Seg(this, listOf("256", "384", "512"))
                  segSize.select(prefs.getInt("size_i", 1), false)
                  segMode = Seg(this, listOf("Auto", "GPU", "CPU"))
                  segMode.select(prefs.getInt("mode_i", 0), false)
                  val segRow = LinearLayout(this)
                  segRow.orientation = LinearLayout.HORIZONTAL
                  segRow.putW(labeled(this, "Size (px)", segSize.view), 1f)
                  segRow.putW(labeled(this, "Engine", segMode.view), 1f, leftDp = 12)
                  cCreate.put(segRow, 14)

                  steps = fieldView(this, "20", prefs.getString("steps", "20") ?: "20", numeric = true, decimal = false, compact = true)
                  cfg = fieldView(this, "3.0", prefs.getString("cfg", "3.0") ?: "3.0", numeric = true, compact = true)
                  seed = fieldView(this, "random", "", numeric = true, decimal = false, compact = true)
                  threads = fieldView(this, "4", prefs.getString("threads", "4") ?: "4", numeric = true, decimal = false, compact = true)
                  val nums = LinearLayout(this)
                  nums.orientation = LinearLayout.HORIZONTAL
                  nums.putW(labeled(this, "Steps", steps), 1f)
                  nums.putW(labeled(this, "CFG", cfg), 1f, leftDp = 8)
                  nums.putW(labeled(this, "Seed", seed), 1.3f, leftDp = 8)
                  nums.putW(labeled(this, "Threads", threads), 1f, leftDp = 8)
                  cCreate.put(nums, 12)

                  cbFa = CheckBox(this)
                  cbFa.text = "Flash attention (experimental, GPU only)"
                  cbFa.setTextColor(Pal.sub)
                  cbFa.textSize = 12.5f
                  cbFa.buttonTintList = android.content.res.ColorStateList.valueOf(Pal.g1)
                  cCreate.put(cbFa, 8)

                  btnGen = pill(this, "Generate", 0)
                  btnGen.setOnClickListener { onGenClick() }
                  cCreate.put(btnGen, 12)
                  content.put(cCreate.root, 14)

                  // ---------- result
                  cResult = Card(this, "Result")
                  cResult.root.visibility = View.GONE
                  img = ImageView(this)
                  img.adjustViewBounds = true
                  img.background = rounded(this, 16, Pal.field)
                  img.clipToOutline = true
                  img.outlineProvider = ViewOutlineProvider.BACKGROUND
                  cResult.put(img, 12)
                  resultInfo = tv(this, "", 11.5f, Pal.sub, mono = true)
                  cResult.put(resultInfo, 10)
                  content.put(cResult.root, 14)

                  // ---------- model files
                  cFiles = Card(this, "Model files")
                  dlSummary = tv(this, "", 12f, Pal.sub, mono = true)
                  cFiles.put(dlSummary, 12)
                  dlBar = BarView(this)
                  cFiles.put(dlBar, 8, h = dp(6))
                  val rs = ArrayList<TextView>()
                  val rb = ArrayList<BarView>()
                  for (m in files) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.VERTICAL
                      val line = LinearLayout(this)
                      line.orientation = LinearLayout.HORIZONTAL
                      val nm = tv(this, m.name + " \u00B7 " + fmtSize(m.size), 12f, Pal.text, mono = true)
                      nm.maxLines = 1
                      nm.ellipsize = TextUtils.TruncateAt.MIDDLE
                      val stt = tv(this, "", 11f, Pal.sub, bold = true)
                      stt.maxLines = 1
                      line.addView(nm, LinearLayout.LayoutParams(0, wc, 1f))
                      line.addView(stt, LinearLayout.LayoutParams(wc, wc).apply { leftMargin = dp(8) })
                      row.addView(line)
                      val bv = BarView(this)
                      row.put(bv, 6, h = dp(4))
                      rs.add(stt)
                      rb.add(bv)
                      cFiles.put(row, 12)
                  }
                  rowState = rs
                  rowBar = rb
                  btnDl = pill(this, "Download + verify all", 1)
                  btnDl.setOnClickListener {
                      if (busy && phase == "dl") {
                          cancel = true
                          logW("Stop requested.")
                      } else if (!busy) {
                          thread { downloadAll() }
                      }
                  }
                  cFiles.put(btnDl, 16)
                  content.put(cFiles.root, 14)

                  // ---------- compatibility
                  cCompat = Card(this, "Compatibility")
                  compatView = tv(this, "Checking\u2026", 12f, Pal.text, mono = true)
                  compatView.setLineSpacing(0f, 1.2f)
                  cCompat.put(compatView, 12)
                  val ignoreRam = CheckBox(this)
                  ignoreRam.text = "Ignore the RAM check (may crash)"
                  ignoreRam.setTextColor(Pal.sub)
                  ignoreRam.textSize = 12.5f
                  ignoreRam.isChecked = ignoreRamNow
                  ignoreRam.buttonTintList = android.content.res.ColorStateList.valueOf(Pal.g1)
                  ignoreRam.setOnCheckedChangeListener { _, v ->
                      ignoreRamNow = v
                      prefs.edit().putBoolean("ign_ram", v).apply()
                      if (!busy) thread { preflight() }
                  }
                  cCompat.put(ignoreRam, 8)
                  val btnRow = LinearLayout(this)
                  btnRow.orientation = LinearLayout.HORIZONTAL
                  val btnDetails = pill(this, "Details", 2, compact = true)
                  btnDetails.setOnClickListener {
                      compatExpanded = !compatExpanded
                      btnDetails.text = if (compatExpanded) "Hide" else "Details"
                      renderCompat()
                  }
                  val btnRecheck = pill(this, "Re-check", 2, compact = true)
                  btnRecheck.setOnClickListener { if (!busy) thread { preflight() } }
                  btnRow.putW(btnDetails, 1f)
                  btnRow.putW(btnRecheck, 1f, leftDp = 8)
                  cCompat.put(btnRow, 10)
                  content.put(cCompat.root, 14)

                  // ---------- log
                  val cLog = Card(this, "Log")
                  segLog = Seg(this, listOf("Info", "Issues", "Debug", "App"))
                  segLog.onChange = { i ->
                      logFilter = i
                      synchronized(logs) { logDirty = true }
                  }
                  cLog.put(segLog.view, 12)
                  logView = tv(this, "", 10.5f, Pal.sub, mono = true)
                  logView.setPadding(dp(10), dp(8), dp(10), dp(8))
                  logScroll = ScrollView(this)
                  logScroll.background = rounded(this, 12, Pal.field)
                  logScroll.isVerticalScrollBarEnabled = true
                  logScroll.setOnTouchListener { v, _ ->
                      v.parent.requestDisallowInterceptTouchEvent(true)
                      false
                  }
                  logScroll.addView(logView, ViewGroup.LayoutParams(mp, wc))
                  cLog.put(logScroll, 10, h = dp(300))
                  val lr = LinearLayout(this)
                  lr.orientation = LinearLayout.HORIZONTAL
                  val bCopy = pill(this, "Copy report", 2, compact = true)
                  bCopy.setOnClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("MossMini report", buildReport()))
                      log("Report copied to clipboard.")
                  }
                  val bShare = pill(this, "Share", 2, compact = true)
                  bShare.setOnClickListener {
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "text/plain"
                      i.putExtra(Intent.EXTRA_SUBJECT, "MossMini report")
                      i.putExtra(Intent.EXTRA_TEXT, buildReport())
                      startActivity(Intent.createChooser(i, "Share report"))
                  }
                  val bClear = pill(this, "Clear", 2, compact = true)
                  bClear.setOnClickListener {
                      synchronized(logs) { logs.clear(); logDirty = true }
                  }
                  lr.putW(bCopy, 1.4f)
                  lr.putW(bShare, 1f, leftDp = 8)
                  lr.putW(bClear, 1f, leftDp = 8)
                  cLog.put(lr, 10)
                  content.put(cLog.root, 14)

                  setContentView(scrollRoot)
              }

              override fun onDestroy() {
                  cancel = true
                  proc?.destroyForcibly()
                  ui.removeCallbacks(tick)
                  releaseWake()
                  closeRunLog()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build signed release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Show the real error (only if the build failed)
        if: failure()
        run: |
          {
            echo "### Build failed - first errors"
            echo '```'
            grep -E -A3 '^e: |What went wrong|error:' build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log + generated sources (only if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            build.log
            app/src/main/java
            app/build.gradle.kts
          retention-days: 7

      - name: "Verify and name the APK"
        run: |
          APK="MossMini-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" > cert.txt
          head -3 cert.txt
          unzip -l "$APK" > apk_list.txt
          grep -q 'lib/arm64-v8a/libsdcli.so' apk_list.txt || { echo "::error::sd-cli missing from APK"; exit 1; }
          grep -q 'assets/manifest.json' apk_list.txt || { echo "::error::manifest.json missing from APK"; exit 1; }
          sha256sum "$APK" > SHA256SUMS.txt
          {
            echo "### APK"
            echo "| file | size | native engine |"
            echo "|---|---|---|"
            echo "| $APK | $(du -h "$APK" | cut -f1) | $(unzip -lv "$APK" | awk '/libsdcli.so/{print $1" B"}') |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt
          python3 - <<'PY'
          import json
          m = json.load(open("manifest/manifest.json"))
          lines = ["MossMini: MOSS-Image SFT (smallest build), proven in CI.", "",
                   "- stable-diffusion.cpp commit: `%s`" % m["sd_commit"],
                   "- CI end-to-end test: %s" % m["smoke"],
                   "- Optional flags proven in CI: %s" % (" ".join(m.get("proven_flags", [])) or "none"),
                   "- Measured peak RAM in CI: %d MB" % m["peak_rss_mb"], "", "Files the app downloads (SHA-256 checked on the phone):"]
          for f in m["files"]:
              lines.append("- `%s` - %d MB - `%s`" % (f["name"], f["size"] >> 20, f["sha256"]))
          open("release_notes.md", "w").write("\n".join(lines) + "\n")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mini-v${{ github.run_number }}
          name: MossMini ${{ env.VERSION_NAME }}
          body_path: release_notes.md
          files: |
            MossMini-${{ env.VERSION_NAME }}.apk
            SHA256SUMS.txt
          make_latest: false

      - uses: actions/upload-artifact@v4
        with:
          name: MossMini-apk
          path: MossMini-*.apk
          retention-days: 14
