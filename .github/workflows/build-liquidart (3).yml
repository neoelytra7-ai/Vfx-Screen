           override fun onDrawFrame(x:GL10?){
            while(true){val l=trash.poll()?:break;if(l.t!=0)G.glDeleteTextures(2,intArrayOf(l.t,l.dt),0)}
            if(lqd&&Cur.tool==2&&Cur.lq>0)lqApply(lqx,lqy,0f,0f)
            val ls=Cur.layers.toList();var k=ls.size;ls.forEach{k=k*31+it.op.hashCode()*7+it.mode*3+(if(it.vis)1 else 0)+it.t+(if(it.has)5 else 0)}
            if(k!=key){key=k;dirty=true}
