           override fun onSurfaceChanged(x:GL10?,w:Int,h:Int){
            vw=w;vh=h;if(vt[0]!=0)G.glDeleteTextures(1,intArrayOf(vt[0]),0)
            vt=mk(w,h,G.GL_RGBA8,1+floor(log2(max(w,h).toFloat())).toInt());Cur.sc=min(w,h)*.9f/N;Cur.vd=true}

           fun ensure(L:Layer){if(L.t!=0)return;val m=mk(N,N,G.GL_RGBA16F);L.t=m[0];L.f=m[1];val w=if(L.white)1f else 0f;G.glClearColor(w,w,w,w);G.glClear(G.GL_COLOR_BUFFER_BIT)}
           fun ensureD(L:Layer){if(L.dt!=0)return;val m=mk(N,N,G.GL_RG16F);L.dt=m[0];L.df=m[1]}
