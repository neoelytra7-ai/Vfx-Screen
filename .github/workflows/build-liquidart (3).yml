            if(Cur.vd){Cur.vd=false;G.glDisable(G.GL_BLEND);fb(vt[1],vw,vh);G.glUseProgram(pv);bt(0,a[fin][0],pv,"uC")
             uf(pv,"uCS",N.toFloat(),N.toFloat());uf(pv,"uVS",vw.toFloat(),vh.toFloat());uf(pv,"uPan",Cur.px,Cur.py);uf(pv,"uSc",Cur.sc);uf(pv,"uRot",cos(Cur.rot),sin(Cur.rot));tri()
             G.glBindTexture(G.GL_TEXTURE_2D,vt[0]);G.glGenerateMipmap(G.GL_TEXTURE_2D)}
