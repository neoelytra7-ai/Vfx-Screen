          // A glass panel = one blob in the GL liquid-glass pass. Spring-driven size gives jelly open/close; nearby blobs melt together.
          @Composable fun Glass(id:Int,open:Boolean,mod:Modifier,rad:Float=34f,content:@Composable BoxScope.()->Unit){
           val sc by animateFloatAsState(if(open)1f else 0f,spring(.5f,230f),label="g")
           var r by remember{mutableStateOf(Rect.Zero)}
           DisposableEffect(id){onDispose{Glass.m.remove(id)}}
           if(sc>.02f){
            SideEffect{if(r.width>0f)Glass.m[id]=floatArrayOf(r.center.x,r.center.y,r.width/2*sc,r.height/2*sc,min(rad*sc,min(r.width,r.height)/2*sc))}
            Box(mod.onGloballyPositioned{r=it.boundsInWindow()}.graphicsLayer{scaleX=sc;scaleY=sc;alpha=min(1f,sc*1.4f)},content=content)
           }else SideEffect{Glass.m.remove(id)}}

