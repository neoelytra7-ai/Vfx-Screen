           fun bake(L:Layer){if(!L.has)return;G.glDisable(G.GL_BLEND);fb(a[1][1],N,N);G.glUseProgram(pb);bt(0,L.t,pb,"uLay");bt(1,L.dt,pb,"uDisp");uf(pb,"uSize",N.toFloat(),N.toFloat());tri()
            blit(a[1][1],L.f);G.glBindFramebuffer(G.GL_FRAMEBUFFER,L.df);G.glClearColor(0f,0f,0f,0f);G.glClear(G.GL_COLOR_BUFFER_BIT);L.has=false;dirty=true}

           fun comp(){
            val ls=Cur.layers.toList();var s=0;fb(a[0][1],N,N);G.glClearColor(0f,0f,0f,0f);G.glClear(G.GL_COLOR_BUFFER_BIT);G.glDisable(G.GL_BLEND);G.glUseProgram(pc)
            for((i,L) in ls.withIndex()){if(!L.vis)continue;ensure(L);val d=1-s;fb(a[d][1],N,N)
             bt(0,a[s][0],pc,"uAcc");bt(1,L.t,pc,"uLay");bt(2,if(L.has)L.dt else L.t,pc,"uDisp");bt(3,stk[0],pc,"uStroke")
             ui(pc,"uHas",if(L.has)1 else 0);ui(pc,"uSM",if(st&&i==Cur.sel)(when{Cur.tool==0->if(L.lock)3 else 1;Cur.tool==1->2;else->0})else 0)
