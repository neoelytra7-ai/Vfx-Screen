          class CanvasView(c:Context):GLSurfaceView(c){
           val r=Eng();var g=false;var ig=false;var pcx=0f;var pcy=0f;var pdist=1f;var pa=0f;var sty=false
           init{setEGLContextClientVersion(3);setEGLConfigChooser(8,8,8,8,0,0);setRenderer(r);Cur.view=this}
           fun cv(x:Float,y:Float):FloatArray{val vx=(x-width/2f-Cur.px)/Cur.sc;val vy=(y-height/2f-Cur.py)/Cur.sc;val c=cos(Cur.rot);val s=sin(Cur.rot)
            return floatArrayOf(c*vx+s*vy+1024f,-s*vx+c*vy+1024f)}
           fun pt(k:Int,e:MotionEvent,h:Int){
            val x=if(h<0)e.x else e.getHistoricalX(h);val y=if(h<0)e.y else e.getHistoricalY(h)
            val st=e.getToolType(0)==MotionEvent.TOOL_TYPE_STYLUS
            val p=if(st)(if(h<0)e.pressure else e.getHistoricalPressure(h)) else 1f
            val t=if(st)(if(h<0)e.getAxisValue(MotionEvent.AXIS_TILT) else e.getHistoricalAxisValue(MotionEvent.AXIS_TILT,h))/1.5708f else 0f
            val c=cv(x,y);queueEvent{r.ptr(k,c[0],c[1],p,t)}}
           override fun onTouchEvent(e:MotionEvent):Boolean{
            requestUnbufferedDispatch(e);val a=e.actionMasked
            if(e.getToolType(0)==MotionEvent.TOOL_TYPE_STYLUS)sty=true
            if(e.pointerCount>=2){
             if(!ig){ig=true;queueEvent{r.ptr(2,0f,0f,0f,0f)}}
             if(a==MotionEvent.ACTION_POINTER_UP){g=false;return true}
             val x0=e.getX(0);val y0=e.getY(0);val x1=e.getX(1);val y1=e.getY(1)
             val cx=(x0+x1)/2;val cy=(y0+y1)/2;val d=max(1f,hypot(x1-x0,y1-y0));val an=atan2(y1-y0,x1-x0)
             if(g&&a!=MotionEvent.ACTION_POINTER_DOWN){
              val p=cv(pcx,pcy);Cur.sc=(Cur.sc*d/pdist).coerceIn(.05f,40f);Cur.rot+=an-pa
              val vx=p[0]-1024f;val vy=p[1]-1024f;val c=cos(Cur.rot);val s=sin(Cur.rot)
              Cur.px=cx-width/2f-Cur.sc*(c*vx-s*vy);Cur.py=cy-height/2f-Cur.sc*(s*vx+c*vy);Cur.vd=true}
             g=true;pcx=cx;pcy=cy;pdist=d;pa=an;return true}
            if(ig){if(a==MotionEvent.ACTION_UP||a==MotionEvent.ACTION_CANCEL){ig=false;g=false};return true}
            if(sty&&e.getToolType(0)!=MotionEvent.TOOL_TYPE_STYLUS)return true
            when(a){
             MotionEvent.ACTION_DOWN->pt(0,e,-1)
             MotionEvent.ACTION_MOVE->{for(h in 0 until e.historySize)pt(1,e,h);pt(1,e,-1)}
             MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->pt(2,e,-1)}
            return true}
          }
