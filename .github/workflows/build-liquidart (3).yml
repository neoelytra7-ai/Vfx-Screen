           // ---- input (runs on GL thread) ----
           fun ptr(k:Int,x:Float,y:Float,p:Float,t:Float){
            if(Cur.tool==2){liq(k,x,y);return}
            when(k){
             0->{val L=cur()?:return;if(L.has)bake(L);ensure(L);fb(stk[1],N,N);G.glClearColor(0f,0f,0f,0f);G.glClear(G.GL_COLOR_BUFFER_BIT)
              sx=x;sy=y;lx=x;ly=y;carry=0f;path=0f;vel=0f;dir=0f;st=true;hsv=floatArrayOf(Cur.hue,Cur.sat,Cur.vl);dab(x,y,p,t);flush();dirty=true}
             1->{if(!st)return;val al=1f-.97f*g("stab");val nx=sx+(x-sx)*al;val ny=sy+(y-sy)*al;vel=vel*.7f+.3f*hypot(x-sx,y-sy)
