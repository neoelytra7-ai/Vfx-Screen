             2->{if(!st)return;walk(x,y,p,t);flush();cur()?.let{commit(it)};st=false;dirty=true}}}
           fun walk(nx:Float,ny:Float,p:Float,t:Float){
            val dx=nx-lx;val dy=ny-ly;val d=hypot(dx,dy);if(d<1e-3f)return;dir=Math.toDegrees(atan2(dy,dx).toDouble()).toFloat()
            val sp=max(.5f,g("spacing")*g("size"));var s=sp-carry
            while(s<=d){dab(lx+dx/d*s,ly+dy/d*s,p,t);s+=sp}
            carry=d-(s-sp);path+=d;lx=nx;ly=ny}
           fun dab(x:Float,y:Float,p:Float,t:Float){
            val pr=p.coerceIn(0f,1f).pow(g("pGamma"));val v=min(vel/(8f+g("size")*.3f),1f)-.5f
            var sz=g("size")*(1f+g("pSize")*(lp(g("minSize"),1f,pr)-1f))*(1f+g("vSize")*v)*(1f-g("sizeJ")*rn())
            if(g("taper")>0f)sz*=min(1f,.2f+.8f*path/g("taper"))
            sz=max(sz,1f)
            val fl=(g("flow")*lp(1f,pr,g("pFlow"))*(1f+g("vFlow")*v)*(1f-g("flowJ")*rn())).coerceIn(0f,1f)
            val deg=g("angle")+g("follow")*dir+g("tAng")*t*180f+g("angJ")*(rn()-.5f)*360f
            val rot=Math.toRadians(deg.toDouble()).toFloat();val rd=g("round")*(1f-g("tRound")*t*.8f)
            val c=if(Cur.tool==1)0 else Color.HSVToColor(floatArrayOf((hsv[0]+g("hueJ")*(rn()-.5f)*180f+360f)%360f,(hsv[1]+g("satJ")*(rn()-.5f)).coerceIn(0f,1f),(hsv[2]+g("valJ")*(rn()-.5f)).coerceIn(0f,1f)))
            repeat(g("count").roundToInt()){val an=rn()*6.2832f;val rr=g("scatter")*sz*.5f*sqrt(rn())
             if(dn==4096)flush()
             buf.put(x+cos(an)*rr);buf.put(y+sin(an)*rr);buf.put(sz);buf.put(rot);buf.put(fl);buf.put(rd)
             buf.put(Color.red(c)/255f);buf.put(Color.green(c)/255f);buf.put(Color.blue(c)/255f);dn++}}
           fun flush(){if(dn==0)return
            fb(stk[1],N,N);G.glEnable(G.GL_BLEND);G.glBlendFunc(G.GL_ONE,G.GL_ONE_MINUS_SRC_ALPHA);G.glUseProgram(pd)
            uf(pd,"uSize",N.toFloat(),N.toFloat());uf(pd,"uMax",maxPt);uf(pd,"uHard",g("hard"));uf(pd,"uEdge",g("edge"));uf(pd,"uGrain",g("grain"))
            uf(pd,"uGS",g("gScale"));uf(pd,"uGM",g("gMove"));uf(pd,"uGC",g("gCon"))
