            else->lqd=false}}
           fun lqApply(x:Float,y:Float,dx:Float,dy:Float){
            val ts=Cur.layers.filter{it.liq}.ifEmpty{listOfNotNull(cur())}
            for(L in ts){ensure(L);ensureD(L);G.glDisable(G.GL_BLEND);fb(sd[1],N,N);G.glUseProgram(pl);bt(0,L.dt,pl,"uD")
             uf(pl,"uSize",N.toFloat(),N.toFloat());uf(pl,"uC",x,y);uf(pl,"uDl",dx,dy);uf(pl,"uR",g("lqR"));uf(pl,"uK",g("lqK")*(if(Cur.lq==0)1f else .05f));uf(pl,"uH",g("lqH"));ui(pl,"uM",Cur.lq)
