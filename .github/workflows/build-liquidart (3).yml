name: Build LiquidArt APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - name: Write project
        run: |
          mkdir -p liquidart && cd liquidart
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name="LiquidArt"
          include(":app")
          EOF_0
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_1'
          plugins{
           id("com.android.application") version "8.5.2" apply false
           id("org.jetbrains.kotlin.android") version "2.0.20" apply false
           id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_1
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_2
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_3'
          plugins{id("com.android.application");id("org.jetbrains.kotlin.android");id("org.jetbrains.kotlin.plugin.compose")}
          android{namespace="art.liquid";compileSdk=34
           defaultConfig{applicationId="art.liquid";minSdk=29;targetSdk=34;versionCode=1;versionName="1.0"}
           compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17}
           kotlinOptions{jvmTarget="17"}
           buildFeatures{compose=true}}
          dependencies{
           implementation(platform("androidx.compose:compose-bom:2024.09.00"))
           implementation("androidx.compose.ui:ui");implementation("androidx.compose.foundation:foundation");implementation("androidx.compose.material3:material3")
           implementation("androidx.activity:activity-compose:1.9.2")}
          EOF_3
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
           <application android:label="LiquidArt" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:hardwareAccelerated="true">
            <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|density">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF_4
          mkdir -p $(dirname app/src/main/java/art/liquid/Engine.kt)
          cat > app/src/main/java/art/liquid/Engine.kt <<'EOF_5'
          package art.liquid
          import android.content.Context
          import android.graphics.Color
          import android.opengl.GLES30 as G
          import android.opengl.GLSurfaceView
          import android.os.SystemClock
          import android.view.MotionEvent
          import androidx.compose.runtime.*
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.ConcurrentLinkedQueue
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.*
          import kotlin.random.Random

          // ---- Blend registry: add a mode = add one line (GLSL expr over backdrop b, source s) ----
          val BLENDS = listOf(
          "Normal" to "s","Dissolve" to "s","Darken" to "min(b,s)","Multiply" to "b*s",
          "Color Burn" to "1.0-min(vec3(1.0),(1.0-b)/max(s,vec3(1e-4)))","Linear Burn" to "max(b+s-1.0,vec3(0.0))",
          "Darker Color" to "mix(b,s,step(lum(s),lum(b)))","Lighten" to "max(b,s)","Screen" to "b+s-b*s",
          "Color Dodge" to "min(vec3(1.0),b/max(1.0-s,vec3(1e-4)))","Linear Dodge (Add)" to "min(b+s,vec3(1.0))",
          "Lighter Color" to "mix(b,s,step(lum(b),lum(s)))","Overlay" to "mix(2.0*b*s,1.0-2.0*(1.0-b)*(1.0-s),step(0.5,b))",
          "Soft Light" to "mix(b-(1.0-2.0*s)*b*(1.0-b),b+(2.0*s-1.0)*(mix(sqrt(b),((16.0*b-12.0)*b+4.0)*b,step(b,vec3(0.25)))-b),step(0.5,s))",
          "Hard Light" to "mix(2.0*b*s,1.0-2.0*(1.0-b)*(1.0-s),step(0.5,s))",
          "Vivid Light" to "mix(1.0-(1.0-b)/max(2.0*s,vec3(1e-4)),b/max(2.0*(1.0-s),vec3(1e-4)),step(0.5,s))",
          "Linear Light" to "b+2.0*s-1.0","Pin Light" to "mix(min(b,2.0*s),max(b,2.0*s-1.0),step(0.5,s))",
          "Hard Mix" to "step(vec3(1.0),b+s)","Difference" to "abs(b-s)","Exclusion" to "b+s-2.0*b*s",
          "Subtract" to "max(b-s,vec3(0.0))","Divide" to "b/max(s,vec3(1e-4))",
          "Hue" to "setLum(setSat(s,sat(b)),lum(b))","Saturation" to "setLum(setSat(b,sat(s)),lum(b))",
          "Color" to "setLum(s,lum(b))","Luminosity" to "setLum(b,lum(s))",
          "Glow" to "min(vec3(1.0),s*s/max(1.0-b,vec3(1e-4)))","Reflect" to "min(vec3(1.0),b*b/max(1.0-s,vec3(1e-4)))",
          "Heat" to "1.0-min(vec3(1.0),(1.0-s)*(1.0-s)/max(b,vec3(1e-4)))","Freeze" to "1.0-min(vec3(1.0),(1.0-b)*(1.0-b)/max(s,vec3(1e-4)))",
          "Phoenix" to "min(b,s)-max(b,s)+1.0","Negation" to "1.0-abs(1.0-b-s)","Average" to "(b+s)*0.5",
          "Grain Extract" to "b-s+0.5","Grain Merge" to "b+s-0.5","Pegtop Soft Light" to "(1.0-2.0*s)*b*b+2.0*s*b",
          "Interpolation" to "0.5-0.25*cos(3.14159*s)-0.25*cos(3.14159*b)","Contrast Mask" to "(b-0.5)*(0.5+s*1.5)+0.5",
          "Threshold" to "step(s,b)","Hard Reflect" to "mix(min(vec3(1.0),b*b/max(1.0-s,vec3(1e-4))),s,step(vec3(0.999),s))")

          class PD(val k:String,val n:String,val g:String,val lo:Float,val hi:Float,val d:Float)
          val DEFS = listOf(
          PD("size","Size","Shape",1f,400f,28f),PD("minSize","Min size","Shape",0f,1f,.15f),PD("hard","Hardness","Shape",0f,1f,.8f),
          PD("round","Roundness","Shape",.05f,1f,1f),PD("angle","Angle","Shape",0f,360f,0f),PD("angJ","Angle jitter","Shape",0f,1f,0f),
          PD("sizeJ","Size jitter","Shape",0f,1f,0f),PD("spacing","Spacing","Shape",.01f,1.5f,.08f),PD("scatter","Scatter","Shape",0f,4f,0f),
          PD("count","Dabs/step","Shape",1f,6f,1f),
          PD("opacity","Stroke opacity","Flow",0f,1f,1f),PD("flow","Flow","Flow",.02f,1f,.8f),PD("flowJ","Flow jitter","Flow",0f,1f,0f),
          PD("pSize","Pressure>size","Dynamics",0f,1f,.7f),PD("pFlow","Pressure>flow","Dynamics",0f,1f,.3f),PD("pGamma","Pressure curve","Dynamics",.2f,3f,1f),
          PD("vSize","Speed>size","Dynamics",-1f,1f,0f),PD("vFlow","Speed>flow","Dynamics",-1f,1f,0f),PD("tAng","Tilt>angle","Dynamics",0f,1f,0f),
          PD("tRound","Tilt>squash","Dynamics",0f,1f,0f),PD("follow","Follow stroke","Dynamics",0f,1f,0f),
          PD("stab","Stabilizer","Stroke",0f,1f,.35f),PD("taper","Entry taper px","Stroke",0f,300f,0f),
          PD("grain","Grain","Texture",0f,1f,0f),PD("gScale","Grain scale","Texture",.1f,8f,1f),PD("gMove","Grain moves","Texture",0f,1f,0f),
          PD("gCon","Grain softness","Texture",.02f,.5f,.2f),PD("edge","Wet edge","Texture",0f,1f,0f),
          PD("hueJ","Hue jitter","Color",0f,1f,0f),PD("satJ","Sat jitter","Color",0f,1f,0f),PD("valJ","Value jitter","Color",0f,1f,0f),
          PD("lqR","Radius","Liquify",8f,600f,160f),PD("lqK","Strength","Liquify",.05f,1f,.5f),PD("lqH","Hardness","Liquify",0f,1f,.3f))

          class Layer(n:String){
           var name by mutableStateOf(n); var op by mutableFloatStateOf(1f); var mode by mutableIntStateOf(0)
           var vis by mutableStateOf(true); var lock by mutableStateOf(false); var liq by mutableStateOf(false)
           var white=false; var t=0; var f=0; var dt=0; var df=0; var has=false }
          object Glass{ val m=ConcurrentHashMap<Int,FloatArray>() }
          object Cur{
           val layers=mutableStateListOf<Layer>(); var sel by mutableIntStateOf(1); var tool by mutableIntStateOf(0); var lq by mutableIntStateOf(0)
           var hue by mutableFloatStateOf(220f); var sat by mutableFloatStateOf(.8f); var vl by mutableFloatStateOf(.9f)
           val b=mutableStateMapOf<String,Float>().apply{DEFS.forEach{put(it.k,it.d)}}
           @Volatile var px=0f; @Volatile var py=0f; @Volatile var sc=.4f; @Volatile var rot=0f; @Volatile var vd=true
           @Volatile var lx=0f; @Volatile var ly=-1f
           var r:Eng?=null; var view:CanvasView?=null
           fun q(a:()->Unit){view?.queueEvent{a()}}
           fun col()=Color.HSVToColor(floatArrayOf(hue,sat,vl)) }

          const val HDR="#version 300 es\nprecision highp float;precision highp int;precision highp sampler2D;\n"
          const val FSV=HDR+"out vec2 uv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);uv=p;gl_Position=vec4(p*2.-1.,0,1);}"
          // Catmull-Rom bicubic in 5 bilinear taps: keeps displaced/zoomed layers sharp
          const val CR="""vec4 cr(sampler2D t,vec2 uv,vec2 sz){vec2 sp=uv*sz;vec2 tc=floor(sp-.5)+.5;vec2 f=sp-tc;vec2 f2=f*f,f3=f2*f;
          vec2 w0=f2-.5*(f3+f);vec2 w1=1.5*f3-2.5*f2+1.;vec2 w3=.5*(f3-f2);vec2 w2=1.-w0-w1-w3;vec2 w12=w1+w2;
          vec2 t0=(tc-1.)/sz,t3=(tc+2.)/sz,t12=(tc+w2/w12)/sz;
          vec4 r=texture(t,vec2(t12.x,t0.y))*(w12.x*w0.y)+texture(t,vec2(t0.x,t12.y))*(w0.x*w12.y)+texture(t,t12)*(w12.x*w12.y)+texture(t,vec2(t3.x,t12.y))*(w3.x*w12.y)+texture(t,vec2(t12.x,t3.y))*(w12.x*w3.y);
          r/=(w12.x*w0.y+w0.x*w12.y+w12.x*w12.y+w3.x*w12.y+w12.x*w3.y);r.a=clamp(r.a,0.,1.);r.rgb=clamp(r.rgb,0.,r.a);return r;}
          """
          val COMP=HDR+"in vec2 uv;out vec4 o;uniform sampler2D uAcc,uLay,uDisp,uStroke;uniform int uHas,uSM,uMode;uniform float uSO,uOp;uniform vec2 uSize;\n"+CR+"""
          float lum(vec3 c){return dot(c,vec3(.3,.59,.11));}
          vec3 clipC(vec3 c){float l=lum(c),n=min(min(c.r,c.g),c.b),x=max(max(c.r,c.g),c.b);if(n<0.)c=l+(c-l)*l/(l-n);if(x>1.)c=l+(c-l)*(1.-l)/(x-l);return c;}
          vec3 setLum(vec3 c,float l){return clipC(c+(l-lum(c)));}
          float sat(vec3 c){return max(max(c.r,c.g),c.b)-min(min(c.r,c.g),c.b);}
          vec3 setSat(vec3 c,float s){float mx=max(max(c.r,c.g),c.b),mn=min(min(c.r,c.g),c.b);return mx>mn?(c-mn)*s/(mx-mn):vec3(0.);}
          vec3 bf(int m,vec3 b,vec3 s){switch(m){"""+BLENDS.mapIndexed{i,p->"case $i:return ${p.second};"}.joinToString("")+"""default:return s;}}
          void main(){vec2 u=uv;vec4 L;if(uHas>0){u+=texture(uDisp,uv).rg;L=cr(uLay,u,uSize);}else L=texture(uLay,uv);
          if(uSM>0){vec4 S=texture(uStroke,uv)*uSO;if(uSM==1)L=S+L*(1.-S.a);else if(uSM==2)L*=1.-S.a;else L=vec4(S.rgb*L.a+L.rgb*(1.-S.a),L.a);}
          vec4 B=texture(uAcc,uv);float sa=L.a*uOp;
          if(uMode==1)sa=step(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453),sa);
          vec3 s=L.a>0.?L.rgb/L.a:vec3(0.);vec3 b=B.a>0.?B.rgb/B.a:vec3(0.);vec3 m=clamp(bf(uMode,b,s),0.,1.);
          o=vec4((1.-B.a)*sa*s+(1.-sa)*B.rgb+sa*B.a*m,sa+B.a*(1.-sa));}"""
          val BAKE=HDR+"in vec2 uv;out vec4 o;uniform sampler2D uLay,uDisp;uniform vec2 uSize;\n"+CR+"void main(){o=cr(uLay,uv+texture(uDisp,uv).rg,uSize);}"
          val COMMIT=HDR+"in vec2 uv;out vec4 o;uniform sampler2D uS;uniform float uSO;void main(){o=texture(uS,uv)*uSO;}"
          val DABV=HDR+"layout(location=0)in vec2 aP;layout(location=1)in vec4 aA;layout(location=2)in vec3 aC;uniform vec2 uSize;uniform float uMax;flat out vec4 vA;flat out vec3 vC;flat out vec2 vP;void main(){gl_Position=vec4(aP/uSize*2.-1.,0,1);gl_PointSize=min(aA.x+2.,uMax);vA=aA;vC=aC;vP=aP;}"
          val DABF=HDR+"""flat in vec4 vA;flat in vec3 vC;flat in vec2 vP;out vec4 o;uniform float uMax,uHard,uEdge,uGrain,uGS,uGM,uGC;
          float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
          float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
          void main(){float ps=min(vA.x+2.,uMax);vec2 p=(gl_PointCoord-.5)*ps;float c=cos(vA.y),s=sin(vA.y);p=vec2(c*p.x+s*p.y,-s*p.x+c*p.y);p.y/=max(vA.w,.05);
          float r=length(p)/(min(vA.x,ps-2.)*.5);float a=1.-smoothstep(uHard*.98,1.,r);a*=1.+uEdge*smoothstep(.5,.95,r);
          vec2 gp=(uGM>.5?p+vA.x:vP+p)*uGS*.5;float n=vn(gp)*.65+vn(gp*2.3)*.35;a*=mix(1.,smoothstep(.5-uGC,.5+uGC,n),uGrain);
          a=clamp(a*vA.z,0.,1.);o=vec4(vC*a,a);}"""
          val LQ=HDR+"""in vec2 uv;out vec4 o;uniform sampler2D uD;uniform vec2 uSize,uC,uDl;uniform float uR,uK,uH;uniform int uM;
          vec2 D(vec2 q){return texture(uD,q/uSize).rg*uSize;}
          void main(){vec2 p=uv*uSize;vec2 v=p-uC;float f=1.-smoothstep(uR*uH,uR,length(v));vec2 q=p,r;
          if(uM==0)q=p-uDl*f;
          else if(uM==1||uM==2){float a=uK*f*(uM==1?1.:-1.);float c=cos(a),s=sin(a);q=uC+vec2(c*v.x-s*v.y,s*v.x+c*v.y);}
          else if(uM==3)q=uC+v*(1.-uK*f);else if(uM==4)q=uC+v*(1.+uK*f);
          if(uM==5)r=D(p)*(1.-uK*f);
          else if(uM==6){float e=uR*.08;r=mix(D(p),(D(p+vec2(e,0))+D(p-vec2(e,0))+D(p+vec2(0,e))+D(p-vec2(0,e)))*.25,clamp(uK*f*8.,0.,1.));}
          else r=D(q)+(q-p);
          o=vec4(r/uSize,0,1);}"""
          val VIEW=HDR+"in vec2 uv;out vec4 o;uniform sampler2D uC;uniform vec2 uCS,uVS,uPan,uRot;uniform float uSc;\n"+CR+"""
          void main(){vec2 sp=vec2(gl_FragCoord.x,uVS.y-gl_FragCoord.y);vec2 v=(sp-uVS*.5-uPan)/uSc;v=vec2(uRot.x*v.x+uRot.y*v.y,-uRot.y*v.x+uRot.x*v.y);vec2 c=v+uCS*.5;
          vec3 bg=mix(vec3(.05,.06,.09),vec3(.12,.1,.17),sp.y/uVS.y);
          if(c.x<0.||c.y<0.||c.x>uCS.x||c.y>uCS.y){o=vec4(bg,1);return;}
          vec4 t=cr(uC,c/uCS,uCS);vec2 k=floor(c/40.);float ch=.86+.08*mod(k.x+k.y,2.);o=vec4(t.rgb+(1.-t.a)*ch,1);}"""
          // Liquid glass: smooth-union SDF blobs that refract, blur and disperse the live canvas behind them
          val GLASS=HDR+"""in vec2 uv;out vec4 o;uniform sampler2D uV;uniform vec2 uVS,uL;uniform int uN;uniform vec4 uB[12],uP[12];uniform float uT;
          float sd(vec2 p){float d=1e4;for(int i=0;i<12;i++){if(i>=uN)break;vec2 q=abs(p-uB[i].xy)-uB[i].zw+uP[i].x;float di=length(max(q,0.))+min(max(q.x,q.y),0.)-uP[i].x;float h=clamp(.5+.5*(d-di)/30.,0.,1.);d=mix(d,di,h)-30.*h*(1.-h);}return d;}
          vec3 tx(vec2 u,float l){return textureLod(uV,u,l).rgb;}
          void main(){vec2 sp=vec2(gl_FragCoord.x,uVS.y-gl_FragCoord.y);vec3 base=tx(uv,0.);
          if(uN==0){o=vec4(base,1);return;}
          vec2 w=sp+1.5*sin(vec2(uT*1.3+sp.y*.02,uT*1.1+sp.x*.02));float d=sd(w);
          base*=1.-(1.-smoothstep(0.,40.,sd(w-vec2(0,12))))*.3;
          if(d<1.5){vec2 e=vec2(1.5,0.);vec2 n=normalize(vec2(sd(w+e)-sd(w-e),sd(w+e.yx)-sd(w-e.yx))+1e-5);
          float lens=pow(1.-clamp(-d/28.,0.,1.),2.2);vec2 off=vec2(n.x,-n.y)*lens*46./uVS;
          vec3 c=vec3(tx(uv-off,1.6).r,tx(uv-off*1.07,1.6).g,tx(uv-off*1.14,1.6).b);c=mix(c,vec3(1.),.08);
          float rim=smoothstep(-6.,-.5,d);vec2 L=normalize(uL);
          c+=rim*(.18+.7*pow(max(dot(n,L),0.),3.))+rim*.12*pow(max(dot(n,-L),0.),3.);
          base=mix(base,c,1.-smoothstep(-1.,1.5,d));}
          o=vec4(base,1);}"""

          fun prog(vs:String,fs:String):Int{
           fun sh(t:Int,s:String):Int{val i=G.glCreateShader(t);G.glShaderSource(i,s);G.glCompileShader(i);val o=IntArray(1);G.glGetShaderiv(i,G.GL_COMPILE_STATUS,o,0)
            if(o[0]==0)throw RuntimeException(G.glGetShaderInfoLog(i)+"\n"+s);return i}
           val p=G.glCreateProgram();G.glAttachShader(p,sh(G.GL_VERTEX_SHADER,vs));G.glAttachShader(p,sh(G.GL_FRAGMENT_SHADER,fs));G.glLinkProgram(p);return p}
          fun mk(w:Int,h:Int,fmt:Int,lv:Int=1):IntArray{
           val t=IntArray(1);G.glGenTextures(1,t,0);G.glBindTexture(G.GL_TEXTURE_2D,t[0]);G.glTexStorage2D(G.GL_TEXTURE_2D,lv,fmt,w,h)
           G.glTexParameteri(G.GL_TEXTURE_2D,G.GL_TEXTURE_MIN_FILTER,if(lv>1)G.GL_LINEAR_MIPMAP_LINEAR else G.GL_LINEAR);G.glTexParameteri(G.GL_TEXTURE_2D,G.GL_TEXTURE_MAG_FILTER,G.GL_LINEAR)
           G.glTexParameteri(G.GL_TEXTURE_2D,G.GL_TEXTURE_WRAP_S,G.GL_CLAMP_TO_EDGE);G.glTexParameteri(G.GL_TEXTURE_2D,G.GL_TEXTURE_WRAP_T,G.GL_CLAMP_TO_EDGE)
           val b=IntArray(1);G.glGenFramebuffers(1,b,0);G.glBindFramebuffer(G.GL_FRAMEBUFFER,b[0]);G.glFramebufferTexture2D(G.GL_FRAMEBUFFER,G.GL_COLOR_ATTACHMENT0,G.GL_TEXTURE_2D,t[0],0)
           G.glClearColor(0f,0f,0f,0f);G.glClear(G.GL_COLOR_BUFFER_BIT);return intArrayOf(t[0],b[0])}
          fun fb(f:Int,w:Int,h:Int){G.glBindFramebuffer(G.GL_FRAMEBUFFER,f);G.glViewport(0,0,w,h)}
          fun uf(p:Int,n:String,vararg v:Float){val l=G.glGetUniformLocation(p,n);if(v.size==1)G.glUniform1f(l,v[0]) else G.glUniform2f(l,v[0],v[1])}
          fun ui(p:Int,n:String,v:Int)=G.glUniform1i(G.glGetUniformLocation(p,n),v)
          fun bt(u:Int,t:Int,p:Int,n:String){G.glActiveTexture(G.GL_TEXTURE0+u);G.glBindTexture(G.GL_TEXTURE_2D,t);ui(p,n,u)}
          fun tri()=G.glDrawArrays(G.GL_TRIANGLES,0,3)
          fun lp(a:Float,b:Float,t:Float)=a+(b-a)*t
          fun rn()=Random.nextFloat()

          class Eng:GLSurfaceView.Renderer{
           val N=2048
           var pc=0;var pd=0;var pq=0;var pb=0;var pl=0;var pv=0;var pg=0
           var a=arrayOf(IntArray(2),IntArray(2));var stk=IntArray(2);var sd=IntArray(2);var vt=IntArray(2)
           var vbo=0;var maxPt=256f;var vw=1;var vh=1;var fin=0;var key=0;var dirty=true
           val trash=ConcurrentLinkedQueue<Layer>()
           val buf=ByteBuffer.allocateDirect(9*4*4096).order(ByteOrder.nativeOrder()).asFloatBuffer();var dn=0
           var st=false;var sx=0f;var sy=0f;var lx=0f;var ly=0f;var carry=0f;var path=0f;var vel=0f;var dir=0f;var hsv=FloatArray(3)
           var lqd=false;var lqx=0f;var lqy=0f
           fun g(k:String)=Cur.b[k]!!
           fun cur()=Cur.layers.getOrNull(Cur.sel)

           override fun onSurfaceCreated(x:GL10?,c:EGLConfig?){
            Cur.r=this
