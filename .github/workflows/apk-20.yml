          @Composable
          fun FxPanel(e: Engine, v: CanvasView, apply: () -> Unit, cancel: () -> Unit) {
              val rv = U.rev
              var cat by remember { mutableIntStateOf(0) }
              var sel by remember { mutableIntStateOf(-1) }
              val vals = remember { mutableStateListOf(0f, 0f, 0f, 0f) }
              var hq by remember { mutableStateOf(e.fxHq) }
              if (!e.fxOk) { Tx("fx shaders are not supported on this gpu :("); return }
              fun pick(i: Int) {
                  sel = i
                  for (k in 0 until 4) vals[k] = FXS[i].ps.getOrNull(k)?.d ?: 0f
                  val a = vals.toFloatArray(); v.gl { e.fxSet(i, a) }
              }
              if (T.hint > .5f) Tx("fast preview while you tweak - full quality is rendered when you APPLY", T.ink.copy(alpha = .5f), sz = 8f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  FXC.forEachIndexed { i, n -> Pill(n, cat == i, Ik.FX) { cat = i } }
                  Pill(if (hq) "HQ PREVIEW" else "FAST PREVIEW", hq, Ik.CV) { hq = !hq; v.gl { e.fxSetHq(hq) } }
              }
              FXS.withIndex().filter { it.value.cat == cat }.chunked(3).forEach { row ->
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      row.forEach { (i, f) -> Pill(f.n, sel == i) { pick(i) } }
                  }
              }
              if (sel >= 0) {
                  FXS[sel].ps.forEachIndexed { k, q ->
                      R2(PP(q.n, q.lo, q.hi, (q.hi - q.lo) / 100f, false, { vals[k] }, { x -> vals[k] = x; val a = vals.toFloatArray(); v.gl { e.fxSet(sel, a) } }))
                  }
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Pill("APPLY", true, Ik.OK) { FxMem.idx = sel; FxMem.vals = vals.toFloatArray(); v.gl { e.fxApply() }; apply() }
                      Pill("RESET") { pick(sel) }
                      Pill("CANCEL") { cancel() }
                  }
              }
          }
