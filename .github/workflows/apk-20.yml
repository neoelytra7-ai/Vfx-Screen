          object U {
              var rev by mutableIntStateOf(0)
              var hh by mutableFloatStateOf(0f)
              var ss by mutableFloatStateOf(0f)
              var bb by mutableFloatStateOf(1f)
              var tgt by mutableIntStateOf(0)
              fun bump() { rev++ }
              fun col(): Int = android.graphics.Color.HSVToColor(floatArrayOf(hh, ss, bb))
              fun from(c: Int) { val a = FloatArray(3); android.graphics.Color.colorToHSV(c, a); hh = a[0]; ss = a[1]; bb = a[2] }
          }

