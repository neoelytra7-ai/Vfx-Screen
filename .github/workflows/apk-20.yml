          package dev.canvas

          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.spring
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.offset
          import androidx.compose.foundation.layout.width
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.inset
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          class PieOpt(val ik: Ik, val label: String, val act: () -> Unit)

          /**
           * Hold-to-open radial menu. Press and hold any HUD button, slide onto an option and lift to trigger it;
           * lift anywhere else to cancel. Options fan out toward the screen centre so they never fall off the edge.
           */
          object Pie {
              var show by mutableStateOf(false)
              var opts by mutableStateOf<List<PieOpt>>(emptyList())
              var sel by mutableIntStateOf(-1)
              var title by mutableStateOf("")
              var cx by mutableFloatStateOf(0f)
              var cy by mutableFloatStateOf(0f)
              var optR = 70f
              var xs = FloatArray(0)
              var ys = FloatArray(0)
              var sw = 1080f
              var sh = 1920f

              fun open(x: Float, y: Float, o: List<PieOpt>, t: String, density: Float) {
                  val r = 86f * density; optR = 27f * density
                  val n = o.size
                  val base = atan2(sh / 2f - y, sw / 2f - x)
                  val step = min(.98f, 5.2f / max(n - 1, 1))
                  xs = FloatArray(n) { (x + r * cos(base + (it - (n - 1) / 2f) * step)).coerceIn(optR + 8f, sw - optR - 8f) }
                  ys = FloatArray(n) { (y + r * sin(base + (it - (n - 1) / 2f) * step)).coerceIn(optR + 8f, sh - optR - 8f) }
                  opts = o; title = t; sel = -1; cx = x; cy = y; show = true
              }

              fun update(px: Float, py: Float) {
                  var best = -1; var bd = optR * 1.7f
                  for (i in xs.indices) { val d = hypot(px - xs[i], py - ys[i]); if (d < bd) { bd = d; best = i } }
                  if (best != sel) sel = best
              }

              fun finish() {
                  val o = opts.getOrNull(sel)
                  show = false; sel = -1
                  o?.act?.invoke()
              }
          }

          @Composable
          fun PieOverlay() {
              val a by animateFloatAsState(if (Pie.show) 1f else 0f, spring(.55f, 380f), label = "pie")
              if (a < .01f && !Pie.show) return
              val den = LocalDensity.current.density
              val ac = T.ac; val ac2 = T.ac2
              val aa = a.coerceIn(0f, 1f)
              Box(Modifier.fillMaxSize()) {
                  Canvas(Modifier.fillMaxSize()) {
                      drawRect(Color.Black.copy(alpha = .5f * aa))
                      drawCircle(ac2.copy(alpha = .55f * aa), Pie.optR * .5f, Offset(Pie.cx, Pie.cy), style = Stroke(3f))
                      for (i in Pie.xs.indices) {
                          val o = Pie.opts.getOrNull(i) ?: continue
                          val on = i == Pie.sel
                          val px = Pie.cx + (Pie.xs[i] - Pie.cx) * aa; val py = Pie.cy + (Pie.ys[i] - Pie.cy) * aa
                          val r = Pie.optR * (if (on) 1.22f else 1f) * (.4f + .6f * aa)
                          drawCircle(Color.Black.copy(alpha = .35f), r, Offset(px, py + r * .08f))
                          drawCircle(if (on) ac else T.panel2, r, Offset(px, py))
                          if (on) drawCircle(ac2.copy(alpha = .7f), r * 1.1f, Offset(px, py), style = Stroke(r * .08f))
                          inset(px - r * .62f, py - r * .62f, size.width - px - r * .62f, size.height - py - r * .62f) {
                              ic(o.ik, if (on) T.dk else T.ink, if (on) Color.White else ac2, 0f)
                          }
                      }
                  }
                  if (aa > .6f) {
                      for (i in Pie.xs.indices) {
                          val o = Pie.opts.getOrNull(i) ?: continue
                          Box(
                              Modifier.offset { IntOffset((Pie.xs[i] - 45f * den).toInt(), (Pie.ys[i] + Pie.optR * 1.15f).toInt()) }.width(90.dp),
                              contentAlignment = Alignment.TopCenter
                          ) { Tx(o.label, if (i == Pie.sel) T.ac else T.ink, sz = 9f, head = true) }
                      }
                      if (Pie.title.isNotEmpty()) Box(
                          Modifier.offset { IntOffset((Pie.cx - 60f * den).toInt(), (Pie.cy - Pie.optR * 1.6f).toInt()) }.width(120.dp),
                          contentAlignment = Alignment.TopCenter
                      ) { Tx(Pie.title, T.ink.copy(alpha = .7f), sz = 8f) }
                  }
              }
          }
