          package dev.canvas

          import android.content.SharedPreferences
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.graphics.nativeCanvas
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.IntSize
          import androidx.compose.ui.unit.dp
          import kotlin.math.abs
          import kotlin.math.roundToInt

          /** One movable HUD widget. x,y = centre as a fraction of the screen. */
          class WS(val id: String, val label: String, val ik: Ik, val dx: Float, val dy: Float) {
              var x by mutableFloatStateOf(dx)
              var y by mutableFloatStateOf(dy)
              var s by mutableFloatStateOf(1f)
              var vis by mutableStateOf(true)
              var g by mutableIntStateOf(0)      // 0 = no group, 1..3 = group
          }

          object Hud {
              val ws = listOf(
                  WS("menu", "MENU", Ik.MN, .10f, .94f), WS("tool", "TOOL", Ik.BR, .26f, .94f), WS("brush", "BRUSH", Ik.BS, .42f, .94f),
                  WS("color", "COLOR", Ik.CO, .58f, .94f), WS("layers", "LAYERS", Ik.LY, .74f, .94f), WS("fx", "FX", Ik.FX, .90f, .94f),
                  WS("undo", "UNDO", Ik.UN, .09f, .06f), WS("redo", "REDO", Ik.RE, .23f, .06f), WS("stab", "STABILIZER", Ik.ST, .37f, .06f),
                  WS("size", "SIZE", Ik.BS, .04f, .5f), WS("opac", "OPACITY", Ik.BL, .96f, .5f),
                  WS("lasso", "LASSO BAR", Ik.LS, .5f, .80f), WS("compass", "COMPASS", Ik.CP, .91f, .06f),
              )
              var edit by mutableStateOf(false)
              var sel by mutableStateOf("menu")
              var snap by mutableFloatStateOf(8f)       // grid snap in dp, 0 = off
              var grid by mutableFloatStateOf(1f)       // show the grid + ruler guides
              var guideX by mutableFloatStateOf(-1f)
              var guideY by mutableFloatStateOf(-1f)
              val col = mutableStateListOf(false, false, false, false)    // group collapsed
              val open = mutableStateListOf(false, false, false, false)   // collapsed group temporarily expanded
              val pins = mutableStateListOf(Tool.BRUSH, Tool.ERASER, Tool.LASSO, Tool.SMUDGE, Tool.FILL, Tool.PICK)

              fun by(id: String): WS = ws.firstOrNull { it.id == id } ?: ws[0]
              fun leader(g: Int): WS? = ws.firstOrNull { it.g == g }

              fun shown(w: WS, cond: Boolean): Boolean {
                  if (edit) return true
                  if (!w.vis || !cond) return false
                  if (w.g > 0 && col[w.g] && !open[w.g]) return leader(w.g) === w
                  return true
              }

              fun pin(t: Tool) { pins.remove(t); pins.add(0, t); while (pins.size > 6) pins.removeAt(pins.size - 1) }

              /** move a widget, snapping to the grid / other widgets / the screen centre; group members follow */
              fun drag(w: WS, rx: Float, ry: Float, sw: Float, sh: Float, den: Float) {
                  var nx = rx.coerceIn(.02f, .98f); var ny = ry.coerceIn(.02f, .98f)
                  guideX = -1f; guideY = -1f
                  if (snap > .5f) {
                      val gx = snap * den / sw; val gy = snap * den / sh
                      nx = Math.round(nx / gx) * gx; ny = Math.round(ny / gy) * gy
                  }
                  val tx = 7f * den / sw; val ty = 7f * den / sh
                  var best = tx
                  if (abs(nx - .5f) < best) { best = abs(nx - .5f); guideX = .5f }
                  for (o in ws) if (o !== w && !(w.g > 0 && o.g == w.g) && abs(nx - o.x) < best) { best = abs(nx - o.x); guideX = o.x }
                  if (guideX >= 0f) nx = guideX
                  best = ty
                  if (abs(ny - .5f) < best) { best = abs(ny - .5f); guideY = .5f }
                  for (o in ws) if (o !== w && !(w.g > 0 && o.g == w.g) && abs(ny - o.y) < best) { best = abs(ny - o.y); guideY = o.y }
                  if (guideY >= 0f) ny = guideY
                  val ddx = nx - w.x; val ddy = ny - w.y
                  if (w.g > 0) for (m in ws) if (m.g == w.g) { m.x = (m.x + ddx).coerceIn(.02f, .98f); m.y = (m.y + ddy).coerceIn(.02f, .98f) }
                  else { w.x = nx; w.y = ny }
              }

              private fun place(id: String, x: Float, y: Float) { val w = by(id); w.x = x; w.y = y }
              fun preset(p: Int) {
                  val row = listOf("menu", "tool", "brush", "color", "layers", "fx")
                  when (p) {
                      0 -> {
                          row.forEachIndexed { i, id -> place(id, .10f + .16f * i, .94f) }
                          place("undo", .09f, .06f); place("redo", .23f, .06f); place("stab", .37f, .06f); place("compass", .91f, .06f)
                          place("size", .04f, .5f); place("opac", .96f, .5f); place("lasso", .5f, .80f)
                      }
                      1 -> {
                          row.forEachIndexed { i, id -> place(id, .10f + .16f * i, .06f) }
                          place("undo", .09f, .94f); place("redo", .23f, .94f); place("stab", .37f, .94f); place("compass", .91f, .16f)
                          place("size", .04f, .5f); place("opac", .96f, .5f); place("lasso", .5f, .20f)
                      }
                      2 -> {
                          row.forEachIndexed { i, id -> place(id, .08f, .2f + .12f * i) }
                          place("undo", .2f, .06f); place("redo", .34f, .06f); place("stab", .48f, .06f); place("compass", .91f, .06f)
                          place("size", .96f, .45f); place("opac", .88f, .45f); place("lasso", .55f, .86f)
                      }
                      else -> {
                          row.forEachIndexed { i, id -> place(id, .92f, .2f + .12f * i) }
                          place("undo", .09f, .06f); place("redo", .23f, .06f); place("stab", .37f, .06f); place("compass", .75f, .06f)
                          place("size", .04f, .45f); place("opac", .12f, .45f); place("lasso", .45f, .86f)
                      }
                  }
              }
              fun resetAll() { preset(0); for (w in ws) { w.s = 1f; w.vis = true; w.g = 0 }; for (i in 0..3) { col[i] = false; open[i] = false } }

              fun save(p: SharedPreferences) {
                  val ed = p.edit()
                  for (w in ws) {
                      ed.putFloat("h_" + w.id + "_x", w.x).putFloat("h_" + w.id + "_y", w.y).putFloat("h_" + w.id + "_s", w.s)
                      ed.putBoolean("h_" + w.id + "_v", w.vis).putInt("h_" + w.id + "_g", w.g)
                  }
                  ed.putFloat("h_snap", snap).putFloat("h_grid", grid).putInt("h_ver", 1)
                  for (i in 0..3) ed.putBoolean("h_col" + i, col[i])
                  ed.putString("h_pins", pins.joinToString(",") { it.name })
                  ed.apply()
              }
              fun load(p: SharedPreferences) {
                  if (p.getInt("h_ver", 0) < 1) return
                  for (w in ws) {
                      w.x = p.getFloat("h_" + w.id + "_x", w.x); w.y = p.getFloat("h_" + w.id + "_y", w.y); w.s = p.getFloat("h_" + w.id + "_s", w.s)
                      w.vis = p.getBoolean("h_" + w.id + "_v", w.vis); w.g = p.getInt("h_" + w.id + "_g", w.g)
                  }
                  snap = p.getFloat("h_snap", snap); grid = p.getFloat("h_grid", grid)
                  for (i in 0..3) col[i] = p.getBoolean("h_col" + i, col[i])
                  val ps = p.getString("h_pins", null)?.split(",")?.mapNotNull { n -> Tool.values().firstOrNull { it.name == n } }
                  if (ps != null && ps.isNotEmpty()) { pins.clear(); pins.addAll(ps) }
              }
          }

          /** places a widget centred on its fractional position; in edit mode it becomes draggable and selectable */
          @Composable
          fun Placed(w: WS, sw: Float, sh: Float, den: Float, content: @Composable () -> Unit) {
              var sz by remember { mutableStateOf(IntSize.Zero) }
              Box(
                  Modifier.offset { IntOffset((w.x * sw - sz.width / 2f).roundToInt(), (w.y * sh - sz.height / 2f).roundToInt()) }
                      .onSizeChanged { sz = it }
                      .graphicsLayer { scaleX = w.s; scaleY = w.s; alpha = if (Hud.edit && !w.vis) .35f else 1f }
              ) {
                  content()
                  if (Hud.edit) EditHandle(w, sw, sh, den)
                  else if (w.g > 0 && Hud.col[w.g] && Hud.leader(w.g) === w) {
                      Tx(
                          if (Hud.open[w.g]) "-" else "+" + Hud.ws.count { it.g == w.g && it !== w },
                          T.dk, Modifier.align(Alignment.TopEnd).clip(RoundedCornerShape(50)).background(T.ac2).clickable { Hud.open[w.g] = !Hud.open[w.g] }.padding(horizontal = d(5f)), 9f
                      )
                  }
              }
          }

          @Composable
          fun BoxScope.EditHandle(w: WS, sw: Float, sh: Float, den: Float) {
              var rx by remember { mutableFloatStateOf(0f) }
              var ry by remember { mutableFloatStateOf(0f) }
              val on = Hud.sel == w.id
              Box(
                  Modifier.matchParentSize().clip(RoundedCornerShape(14.dp)).background(Color.Black.copy(alpha = .001f))
                      .border(if (on) 2.dp else 1.dp, if (on) T.ac else T.ink.copy(alpha = .35f), RoundedCornerShape(14.dp))
                      .pointerInput(w.id) { detectTapGestures(onTap = { Hud.sel = w.id }) }
                      .pointerInput(w.id) {
                          detectDragGestures(
                              onDragStart = { Hud.sel = w.id; rx = w.x; ry = w.y },
                              onDragEnd = { Hud.guideX = -1f; Hud.guideY = -1f },
                              onDragCancel = { Hud.guideX = -1f; Hud.guideY = -1f }
                          ) { ch, drag ->
                              ch.consume(); rx += drag.x * w.s / sw; ry += drag.y * w.s / sh; Hud.drag(w, rx, ry, sw, sh, den)
                          }
                      }
              )
          }

          /** edit-mode overlay: grid, centre lines, a ruler along the top and left edges (dp), live alignment guides */
          @Composable
          fun HudRuler(den: Float) {
              val paint = remember { android.graphics.Paint().apply { isAntiAlias = true } }
              val ac = T.ac; val ink = T.ink
              Canvas(Modifier.fillMaxSize()) {
                  paint.textSize = 10f * den
                  val gs = if (Hud.snap > .5f) Hud.snap * den else 16f * den
                  if (Hud.grid > .5f) {
                      var i = 0; var x = 0f
                      while (x <= size.width) { drawLine(ink.copy(alpha = if (i % 5 == 0) .16f else .07f), Offset(x, 0f), Offset(x, size.height), 1f); x += gs; i++ }
                      i = 0; var y = 0f
                      while (y <= size.height) { drawLine(ink.copy(alpha = if (i % 5 == 0) .16f else .07f), Offset(0f, y), Offset(size.width, y), 1f); y += gs; i++ }
                  }
                  drawLine(ac.copy(alpha = .35f), Offset(size.width / 2f, 0f), Offset(size.width / 2f, size.height), 2f)
                  drawLine(ac.copy(alpha = .35f), Offset(0f, size.height / 2f), Offset(size.width, size.height / 2f), 2f)
                  paint.color = android.graphics.Color.argb(210, 255, 255, 255)
                  var k = 0; var p = 0f
                  while (p <= size.width) {
                      val big = k % 5 == 0
                      drawLine(ink.copy(alpha = .7f), Offset(p, 0f), Offset(p, if (big) 14f * den else 7f * den), 1.5f)
                      if (big && k > 0) drawContext.canvas.nativeCanvas.drawText((k * 10).toString(), p + 3f, 24f * den, paint)
                      p += 10f * den; k++
                  }
                  k = 0; p = 0f
                  while (p <= size.height) {
                      val big = k % 5 == 0
                      drawLine(ink.copy(alpha = .7f), Offset(0f, p), Offset(if (big) 14f * den else 7f * den, p), 1.5f)
                      if (big && k > 0) drawContext.canvas.nativeCanvas.drawText((k * 10).toString(), 16f * den, p + 4f * den, paint)
                      p += 10f * den; k++
                  }
                  val w = Hud.by(Hud.sel); val cx = w.x * size.width; val cy = w.y * size.height
                  drawLine(ac.copy(alpha = .8f), Offset(cx, 0f), Offset(cx, size.height), 1.5f)
                  drawLine(ac.copy(alpha = .8f), Offset(0f, cy), Offset(size.width, cy), 1.5f)
                  paint.color = android.graphics.Color.argb(255, 255, 255, 255)
                  drawContext.canvas.nativeCanvas.drawText("x " + (cx / den).toInt() + "  y " + (cy / den).toInt(), cx + 14f * den, cy - 14f * den, paint)
                  if (Hud.guideX >= 0f) drawLine(Color.White, Offset(Hud.guideX * size.width, 0f), Offset(Hud.guideX * size.width, size.height), 2.5f)
                  if (Hud.guideY >= 0f) drawLine(Color.White, Offset(0f, Hud.guideY * size.height), Offset(size.width, Hud.guideY * size.height), 2.5f)
              }
          }

          /** bottom/top card shown while editing the HUD */
          @Composable
          fun HudInspector(onDone: () -> Unit) {
              val rv = U.rev
              val w = Hud.by(Hud.sel)
              val snaps = listOf(0f, 4f, 8f, 16f, 32f)
              Box(Modifier.fillMaxSize(), contentAlignment = if (w.y > .5f) Alignment.TopCenter else Alignment.BottomCenter) {
                  Column(
                      Modifier.statusBarsPadding().navigationBarsPadding().padding(d(10f)).clip(rs()).background(T.panel)
                          .verticalScroll(rememberScrollState()).heightIn(max = d(330f)).padding(d(10f)),
                      verticalArrangement = Arrangement.spacedBy(d(6f))
                  ) {
                      Tx("EDIT HUD  -  " + w.label, T.ac, head = true, sz = 13f)
                      Tx("drag any button to move it. tap one to select it. magnets help you line things up.", T.ink.copy(alpha = .55f), sz = 8f, maxLines = 2)
                      R2(PP("SCALE", .6f, 2f, .05f, false, { w.s }, { w.s = it }, "size of this button"))
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                          Pill(if (w.vis) "VISIBLE" else "HIDDEN", w.vis, Ik.EY) { w.vis = !w.vis; U.bump() }
                          Pill("RESET THIS", false, Ik.UN) { w.x = w.dx; w.y = w.dy; w.s = 1f; w.vis = true; w.g = 0; U.bump() }
                      }
                      Choice("GROUP  (grouped buttons move together)", listOf("NONE", "G1", "G2", "G3"), w.g) { w.g = it; U.bump() }
                      if (w.g > 0) Choice("GROUP LOOK", listOf("SPREAD", "COLLAPSED (+N badge)"), if (Hud.col[w.g]) 1 else 0) { Hud.col[w.g] = it == 1; U.bump() }
                      Choice("SNAP (dp)", listOf("OFF", "4", "8", "16", "32"), snaps.indexOf(Hud.snap)) { Hud.snap = snaps[it]; U.bump() }
                      Choice("GRID + RULER", listOf("OFF", "ON"), Hud.grid.toInt()) { Hud.grid = it.toFloat(); U.bump() }
                      Choice("LAYOUT PRESET", listOf("BOTTOM", "TOP", "COLUMN L", "COLUMN R"), -1) { Hud.preset(it); U.bump() }
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                          Pill("RESET ALL", false, Ik.TR) { Hud.resetAll(); U.bump() }
                          Pill("DONE", true, Ik.OK, f = onDone)
                      }
                  }
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Ui.kt <<'EOF_SRC'
          package dev.canvas

          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.activity.compose.BackHandler
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.animateContentSize
          import androidx.compose.animation.core.Animatable
