              <path android:fillColor="#1D1826" android:pathData="M64,69 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0 z" />
              <path android:fillColor="#1D1826" android:pathData="M36,74 a18,8 0 1,0 36,0 a18,8 0 1,0 -36,0 z" />
              <path
                  android:fillColor="#00000000"
