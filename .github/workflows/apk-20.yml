              Text(s, modifier = mod, color = c, fontSize = fsz(sz).sp, fontFamily = ff ?: font(if (head) T.fnt2 else T.fnt), maxLines = maxLines)

          @Composable
          fun Modifier.touch(f: (Float, Float) -> Unit): Modifier {
              val u by rememberUpdatedState(f)
              return pointerInput(Unit) {
                  awaitPointerEventScope {
                      while (true) {
                          val c = awaitPointerEvent().changes[0]
                          if (c.pressed) {
                              u((c.position.x / size.width).coerceIn(0f, 1f), (c.position.y / size.height).coerceIn(0f, 1f))
                              c.consume()
                          }
                      }
                  }
              }
          }

          /** springy pop-in; i staggers siblings */
          @Composable
          fun Modifier.pop(i: Int = 0): Modifier {
              val a = remember { Animatable(0f) }
              LaunchedEffect(Unit) {
                  if (T.an > .01f) { delay(i * 28L); a.animateTo(1f, spring(.45f, 260f)) } else a.snapTo(1f)
              }
              return graphicsLayer {
                  val v = a.value
                  scaleX = .6f + .4f * v; scaleY = .6f + .4f * v; alpha = v.coerceIn(0f, 1f); translationY = (1f - v) * 24f
              }
          }

          /**
           * Tap = action. Hold = a ring charges around the button, then either a radial PIE menu opens (slide onto an option
           * and lift to trigger it) or a simple hold action fires (rep = keeps firing while you keep holding).
           */
          @Composable
          fun Modifier.press(
              en: Boolean, pie: List<PieOpt>?, hold: (() -> Unit)?, rep: Boolean, title: String,
              pressed: (Boolean) -> Unit, charge: Animatable<Float, AnimationVector1D>, tap: () -> Unit
          ): Modifier {
              val scope = rememberCoroutineScope()
              val haptic = LocalHapticFeedback.current
              val tapU by rememberUpdatedState(tap)
              val holdU by rememberUpdatedState(hold)
              val pieU by rememberUpdatedState(pie)
              val prU by rememberUpdatedState(pressed)
              var org by remember { mutableStateOf(Offset.Zero) }
              var sz by remember { mutableStateOf(IntSize.Zero) }
              return this.onGloballyPositioned { org = it.positionInRoot(); sz = it.size }.pointerInput(en) {
                  if (en) awaitEachGesture {
                      val down = awaitFirstDown(requireUnconsumed = false)
                      prU(true)
                      val hasHold = pieU != null || holdU != null
                      val cj = if (hasHold) scope.launch { charge.snapTo(0f); charge.animateTo(1f, tween(380, easing = LinearEasing)) } else null
                      var cancelled = false
                      val up = withTimeoutOrNull(if (hasHold) 380L else 60000L) {
                          val u = waitForUpOrCancellation(); if (u == null) cancelled = true; u
                      }
                      cj?.cancel(); scope.launch { charge.snapTo(0f) }
                      if (up != null) { prU(false); tapU() }
                      else if (cancelled) prU(false)
                      else {
                          if (T.hap > .5f) haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                          val pl = pieU
                          if (pl != null && pl.isNotEmpty()) {
                              Pie.open(org.x + sz.width / 2f, org.y + sz.height / 2f, pl, title, density)
                              while (true) {
                                  val ev = awaitPointerEvent()
                                  val c = ev.changes.firstOrNull { it.id == down.id } ?: break
                                  if (!c.pressed) break
                                  c.consume(); Pie.update(org.x + c.position.x, org.y + c.position.y)
                              }
                              prU(false); Pie.finish()
                          } else {
                              holdU?.invoke()
                              if (rep) while (true) {
                                  val r = withTimeoutOrNull(110L) { waitForUpOrCancellation(); 1 }
                                  if (r != null) break
                                  holdU?.invoke()
                              }
                              prU(false)
                          }
                      }
                  }
              }
          }

          /** Squishy bubble: spring squish + tilt on press, expanding ring + sparkles on tap, looping phase while [anim]. */
          @Composable
          fun Bub(
              sz: Float, on: Boolean, en: Boolean = true, anim: Boolean = on, pad: Float = .42f,
              pie: List<PieOpt>? = null, title: String = "", hold: (() -> Unit)? = null, rep: Boolean = false,
              f: () -> Unit, draw: DrawScope.(Float) -> Unit
          ) {
              var pr by remember { mutableStateOf(false) }
              val sq by animateFloatAsState(if (pr) .82f else 1f, spring(.35f, 600f), label = "sq")
              val tl by animateFloatAsState(if (pr) -7f else 0f, spring(.35f, 400f), label = "tl")
              val pop = remember { Animatable(0f) }
              val charge = remember { Animatable(0f) }
              val scope = rememberCoroutineScope()
              val fU by rememberUpdatedState(f)
              val ph = if (anim && T.an > .01f)
                  rememberInfiniteTransition(label = "ph").animateFloat(0f, 1f, infiniteRepeatable(tween(1800, easing = LinearEasing)), label = "p").value
              else pop.value
              val ac = T.ac; val ac2 = T.ac2; val bgc = if (on) T.ac else T.panel2
              Canvas(
                  Modifier.size(d(sz)).graphicsLayer { scaleX = sq; scaleY = sq; rotationZ = tl; alpha = if (en) 1f else .3f }
                      .press(en, pie, hold, rep, title, { pr = it }, charge) { scope.launch { pop.snapTo(0f); pop.animateTo(1f, tween(450)) }; fU() }
              ) {
                  val r = size.minDimension / 2f
                  val cr = CornerRadius(r * .92f * T.bsh.coerceIn(.2f, 1f))
                  val bs = Size(r * 1.84f, r * 1.84f)
                  drawRoundRect(Color.Black.copy(alpha = .35f * T.sdw), Offset(r * .08f, r * .15f), bs, cr)
                  drawRoundRect(bgc, Offset(r * .08f, r * .08f), bs, cr)
                  if (T.olw > .05f) drawRoundRect(T.ink.copy(alpha = .8f), Offset(r * .08f, r * .08f), bs, cr, style = Stroke(T.olw * 1.5f))
                  drawCircle(Color.White.copy(alpha = (if (on) .38f else .12f) * T.gls * 2f), r * .16f, Offset(r * .62f, r * .5f))
                  val cg = charge.value
                  if (cg > .02f) drawArc(ac2, -90f, 360f * cg, false, Offset(r * .05f, r * .05f), Size(r * 1.9f, r * 1.9f), style = Stroke(r * .13f, cap = StrokeCap.Round))
                  val pv = pop.value
                  if (pv > 0f && pv < 1f) {
                      drawCircle(ac2.copy(alpha = (1f - pv) * .8f), r * (.95f + .55f * pv), Offset(r, r), style = Stroke(2.5f))
                      for (i in 0..5) {
                          val a = i * 1.0472f + .4f; val rr = r * (1f + .5f * pv)
                          drawCircle(ac.copy(alpha = 1f - pv), 2.4f, Offset(r + cos(a) * rr, r + sin(a) * rr))
                      }
                  }
                  inset(r * pad) { draw(ph) }
              }
          }

          @Composable
          fun IB(
              k: Ik, on: Boolean = false, en: Boolean = true, sz: Float = 44f, anim: Boolean = on,
              pie: List<PieOpt>? = null, title: String = "", hold: (() -> Unit)? = null, rep: Boolean = false, f: () -> Unit
          ) {
              val ac2 = T.ac2
              Bub(sz, on, en, anim, .42f, pie, title, hold, rep, f) { ph -> ic(k, if (on) T.dk else T.ink, if (on) Color.White else ac2, ph) }
          }

          @Composable
          fun Pill(s: String, on: Boolean = false, k: Ik? = null, ph: Float = 0f, hold: (() -> Unit)? = null, ff: FontFamily? = null, f: () -> Unit) {
              var pr by remember { mutableStateOf(false) }
              val sq by animateFloatAsState(if (pr) .9f else 1f, spring(.4f, 500f), label = "pl")
              val fU by rememberUpdatedState(f)
              val hU by rememberUpdatedState(hold)
              val haptic = LocalHapticFeedback.current
              val fg = if (on) T.dk else T.ink
              val ac2 = T.ac2
              val lp: ((Offset) -> Unit)? = if (hold != null) ({ _: Offset ->
                  if (T.hap > .5f) haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                  hU?.invoke()
              }) else null
              Row(
                  Modifier.graphicsLayer { scaleX = sq; scaleY = sq }.clip(RoundedCornerShape(50)).background(if (on) T.ac else T.panel2)
                      .pointerInput(hold != null) {
                          detectTapGestures(onPress = { pr = true; tryAwaitRelease(); pr = false }, onLongPress = lp, onTap = { fU() })
                      }.padding(horizontal = d(11f), vertical = d(7f)),
                  verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))
              ) {
                  if (k != null) Canvas(Modifier.size(d(16f))) { ic(k, fg, ac2, ph) }
                  Tx(s, fg, ff = ff)
              }
          }

          /** Slider whose knob is a little cat face. */
          @Composable
          fun CS(t: Float, mod: Modifier = Modifier, on: (Float) -> Unit) {
              val ac = T.ac; val ac2 = T.ac2; val tr = T.panel2
              Box(
                  Modifier.then(mod).height(d(28f)).drawBehind {
                      val h = size.height; val r = h / 2f
                      val x = r + (size.width - 2f * r) * t.coerceIn(0f, 1f)
                      val cr = CornerRadius(h * .25f)
                      drawRoundRect(tr, Offset(0f, h * .25f), Size(size.width, h * .5f), cr)
                      drawRoundRect(Brush.horizontalGradient(listOf(ac2, ac), 0f, x.coerceAtLeast(1f)), Offset(0f, h * .25f), Size(x, h * .5f), cr)
                      val ear = Path(); ear.moveTo(x - r * .75f, r * .55f); ear.lineTo(x - r * .6f, r * .05f); ear.lineTo(x - r * .2f, r * .38f); ear.close()
                      val ear2 = Path(); ear2.moveTo(x + r * .75f, r * .55f); ear2.lineTo(x + r * .6f, r * .05f); ear2.lineTo(x + r * .2f, r * .38f); ear2.close()
                      drawPath(ear, Color.White); drawPath(ear2, Color.White)
                      drawCircle(Color.White, r * .92f, Offset(x, r))
                      drawCircle(T.dk, r * .09f, Offset(x - r * .28f, r * .86f)); drawCircle(T.dk, r * .09f, Offset(x + r * .28f, r * .86f))
                      drawArc(T.dk, 20f, 140f, false, Offset(x - r * .2f, r * .92f), Size(r * .4f, r * .26f), style = Stroke(r * .08f, cap = StrokeCap.Round))
                      drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x - r * .52f, r * 1.08f)); drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x + r * .52f, r * 1.08f))
                  }.touch { xx, _ -> on(xx) }
              )
          }

          /** vertical quick slider for the HUD edge */
          @Composable
          fun VSlider(t: Float, label: String, value: String, en: Boolean = true, on: (Float) -> Unit) {
              val ac = T.ac; val ac2 = T.ac2; val tr = T.panel2
              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.graphicsLayer { alpha = if (en) 1f else .3f }) {
                  Tx(label, T.ink.copy(alpha = .7f), sz = 7f)
                  Box(
                      Modifier.size(d(30f), d(150f)).drawBehind {
                          val w = size.width; val h = size.height; val r = w / 2f
                          val y = h - r - (h - 2f * r) * t.coerceIn(0f, 1f)
                          val cr = CornerRadius(w * .25f)
                          drawRoundRect(tr, Offset(w * .25f, 0f), Size(w * .5f, h), cr)
                          drawRoundRect(Brush.verticalGradient(listOf(ac, ac2), y, (h).coerceAtLeast(y + 1f)), Offset(w * .25f, y), Size(w * .5f, h - y), cr)
                          drawCircle(Color.White, r * .92f, Offset(r, y))
                          drawCircle(T.dk, r * .1f, Offset(r - r * .3f, y - r * .08f)); drawCircle(T.dk, r * .1f, Offset(r + r * .3f, y - r * .08f))
                          drawArc(T.dk, 20f, 140f, false, Offset(r - r * .2f, y - r * .02f), Size(r * .4f, r * .26f), style = Stroke(r * .08f, cap = StrokeCap.Round))
                      }.touch { _, yy -> if (en) on(1f - yy) }
                  )
                  Tx(value, T.ink, sz = 8f)
              }
          }

          @Composable
          fun R2(p: PP) {
              val rv = U.rev
              val v = p.g()
              val t = if (p.log) ln(v / p.lo) / ln(p.hi / p.lo) else (v - p.lo) / (p.hi - p.lo)
              fun set(x: Float) { p.s(x.coerceIn(p.lo, p.hi)); U.bump() }
              Column(verticalArrangement = Arrangement.spacedBy(d(1f))) {
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))) {
                      Tx(p.n, T.ink.copy(alpha = .8f), Modifier.width(d(66f)), 10f)
                      IB(Ik.MI, sz = 30f) { set(v - p.st) }
                      CS(t, Modifier.weight(1f)) { x -> set(if (p.log) p.lo * (p.hi / p.lo).pow(x) else p.lo + x * (p.hi - p.lo)) }
                      IB(Ik.PL, sz = 30f) { set(v + p.st) }
                      Tx("%.2f".format(v), mod = Modifier.width(d(48f)))
                  }
                  if (T.hint > .5f && p.desc.isNotEmpty()) Tx(p.desc, T.ink.copy(alpha = .5f), Modifier.padding(start = d(70f)), 8f)
              }
          }

          @Composable
          fun Choice(label: String, opts: List<String>, sel: Int, fonts: Boolean = false, on: (Int) -> Unit) {
              Tx(label, T.ink.copy(alpha = .7f), sz = 9f)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  opts.forEachIndexed { i, s -> Pill(s, sel == i, ff = if (fonts) FONTS[i] else null) { on(i) } }
              }
          }

          // ───────────────────────── the black cat ─────────────────────────
          fun DrawScope.drawEars(fur: Color, inner: Color, s: Float, ear: Int) {
              when (ear) {
                  1 -> for (sd in 0..1) {
                      val x = if (sd == 0) .22f else .78f; val dx = if (sd == 0) 1f else -1f
                      val pa = Path(); pa.moveTo(s * (x - .13f * dx), s * .34f); pa.lineTo(s * (x - .03f * dx), s * .01f); pa.lineTo(s * (x + .15f * dx), s * .26f); pa.close(); drawPath(pa, fur)
                      val pb = Path(); pb.moveTo(s * (x - .07f * dx), s * .3f); pb.lineTo(s * (x - .02f * dx), s * .1f); pb.lineTo(s * (x + .08f * dx), s * .25f); pb.close(); drawPath(pb, inner)
                  }
                  2 -> for (sd in 0..1) {
                      val x = if (sd == 0) .3f else .7f
                      drawOval(fur, Offset(s * (x - .07f), 0f), Size(s * .14f, s * .34f)); drawOval(inner, Offset(s * (x - .035f), s * .05f), Size(s * .07f, s * .22f))
                  }
                  else -> {
                      drawCircle(fur, s * .13f, Offset(s * .24f, s * .2f)); drawCircle(fur, s * .13f, Offset(s * .76f, s * .2f))
                      drawCircle(inner, s * .06f, Offset(s * .24f, s * .2f)); drawCircle(inner, s * .06f, Offset(s * .76f, s * .2f))
                  }
              }
          }

          fun DrawScope.drawBow(c: Color, s: Float) {
              val x = s * .8f; val y = s * .2f
              val a = Path(); a.moveTo(x, y); a.lineTo(x - s * .1f, y - s * .06f); a.lineTo(x - s * .1f, y + s * .06f); a.close(); drawPath(a, c)
              val b = Path(); b.moveTo(x, y); b.lineTo(x + s * .1f, y - s * .06f); b.lineTo(x + s * .1f, y + s * .06f); b.close(); drawPath(b, c)
              drawCircle(Color.White.copy(alpha = .85f), s * .025f, Offset(x, y))
          }

          /** Neko: black cat with big innocent eyes. mood 0 idle 1 happy 2 focus 3 love 4 oops 5 sleep. Tap = menu, hold = quick pie. */
          @Composable
          fun Mascot(mood: Int, sz: Float, pie: List<PieOpt>? = null, f: () -> Unit) {
              var pr by remember { mutableStateOf(false) }
              val sq by animateFloatAsState(if (pr) .85f else 1f, spring(.3f, 500f), label = "ms")
              val charge = remember { Animatable(0f) }
              var blink by remember { mutableStateOf(false) }
              val anim = T.an > .01f
              LaunchedEffect(anim) { if (anim) while (true) { delay((2200L..4600L).random()); blink = true; delay(130); blink = false } }
              val br = if (anim) rememberInfiniteTransition(label = "br").animateFloat(0f, 1f, infiniteRepeatable(tween(2200), RepeatMode.Reverse), label = "b").value else 0f
              val fU by rememberUpdatedState(f)
              val fur = T.hsv(T.furh, .22f, T.fur); val rim = T.ac2; val ink = T.ink
              val iris = T.hsv(T.eye, .65f, 1f); val irisDk = T.hsv(T.eye, .9f, .62f)
              val ac2 = T.ac2
              val ear = T.ear.toInt(); val cheek = T.cheek; val blush = T.blush; val whisk = T.whisk > .5f; val bow = T.bow > .5f; val eyeK = T.eyes
              Canvas(
                  Modifier.size(d(sz)).graphicsLayer { scaleX = sq * (1f + .035f * br); scaleY = sq * (1f - .035f * br) }
                      .press(true, pie, null, false, "CAT", { pr = it }, charge) { fU() }
              ) {
                  val s = size.minDimension
                  val sk = Stroke(s * .035f, cap = StrokeCap.Round)
                  val pinkIn = Color(0xFFFF9DB8)
                  drawEars(fur, pinkIn, s, ear)
                  val cr = s * (.09f + .1f * cheek)
                  drawOval(fur, Offset(s * .03f, s * .17f), Size(s * .94f, s * .8f))
                  drawCircle(fur, cr, Offset(s * .17f, s * .72f)); drawCircle(fur, cr, Offset(s * .83f, s * .72f))
                  drawOval(fur, Offset(s * .2f, s * .8f), Size(s * .6f, s * .18f))
                  drawOval(rim.copy(alpha = .6f), Offset(s * .03f, s * .17f), Size(s * .94f, s * .8f), style = Stroke(s * .02f))
                  drawOval(Color.White.copy(alpha = .1f), Offset(s * .2f, s * .22f), Size(s * .34f, s * .1f))
                  if (bow) drawBow(ac2, s)
                  val pk = Color(0xFFFF7A9C)
                  drawOval(pk.copy(alpha = .5f * blush), Offset(s * .09f, s * .64f), Size(s * .17f, s * .1f))
                  drawOval(pk.copy(alpha = .5f * blush), Offset(s * .74f, s * .64f), Size(s * .17f, s * .1f))
                  if (whisk) for (side in 0..1) {
                      val dir = if (side == 0) -1f else 1f; val bx = if (side == 0) s * .22f else s * .78f
                      for (k in -1..1) drawLine(ink.copy(alpha = .45f), Offset(bx, s * (.6f + .05f * k)), Offset(bx + dir * s * .2f, s * (.57f + .09f * k)), s * .02f, StrokeCap.Round)
                  }
                  val ey = s * .5f; val er = s * .115f * eyeK
                  for (side in 0..1) {
                      val cx = if (side == 0) s * .31f else s * .69f
                      val dir = if (side == 0) 1f else -1f
                      if (blink || mood == 5) drawArc(ink, 20f, 140f, false, Offset(cx - er * .8f, ey - er * .3f), Size(er * 1.6f, er * .9f), style = sk)
                      else when (mood) {
                          1 -> drawArc(ink, 200f, 140f, false, Offset(cx - er * .8f, ey - er * .3f), Size(er * 1.6f, er * 1.1f), style = sk)
                          3 -> {
                              val hc = Color(0xFFFF4F7A); val r = er * .85f
                              drawCircle(hc, r * .55f, Offset(cx - r * .5f, ey - r * .2f)); drawCircle(hc, r * .55f, Offset(cx + r * .5f, ey - r * .2f))
                              val pa = Path(); pa.moveTo(cx - r * 1.02f, ey); pa.lineTo(cx, ey + r); pa.lineTo(cx + r * 1.02f, ey); pa.close(); drawPath(pa, hc)
                          }
                          4 -> {
                              drawLine(ink, Offset(cx - dir * er * .7f, ey - er * .7f), Offset(cx + dir * er * .6f, ey), s * .035f, StrokeCap.Round)
                              drawLine(ink, Offset(cx + dir * er * .6f, ey), Offset(cx - dir * er * .7f, ey + er * .7f), s * .035f, StrokeCap.Round)
                          }
                          else -> {
                              val big = if (mood == 2) .92f else 1f
                              drawCircle(Brush.radialGradient(colors = listOf(iris, irisDk), center = Offset(cx, ey), radius = er * big), er * big, Offset(cx, ey))
                              drawCircle(T.dk, er * .62f * big, Offset(cx, ey))
                              drawCircle(Color.White, er * .36f * big, Offset(cx - er * .32f, ey - er * .34f))
                              drawCircle(Color.White.copy(alpha = .85f), er * .17f * big, Offset(cx + er * .3f, ey + er * .3f))
                          }
                      }
                  }
                  val nose = Path(); nose.moveTo(s * .46f, s * .595f); nose.lineTo(s * .54f, s * .595f); nose.lineTo(s * .5f, s * .635f); nose.close()
                  drawPath(nose, pk)
                  val mc = ink.copy(alpha = .85f)
                  when (mood) {
                      1, 3 -> { drawArc(mc, 0f, 180f, true, Offset(s * .44f, s * .64f), Size(s * .12f, s * .1f)); drawCircle(pk, s * .025f, Offset(s * .5f, s * .72f)) }
                      2, 5 -> drawCircle(mc, s * .022f, Offset(s * .5f, s * .67f))
                      4 -> drawLine(mc, Offset(s * .45f, s * .67f), Offset(s * .55f, s * .67f), s * .03f, StrokeCap.Round)
                      else -> {
                          drawArc(mc, 20f, 140f, false, Offset(s * .42f, s * .63f), Size(s * .08f, s * .07f), style = sk)
                          drawArc(mc, 20f, 140f, false, Offset(s * .5f, s * .63f), Size(s * .08f, s * .07f), style = sk)
                      }
                  }
                  val cg = charge.value
                  if (cg > .02f) drawArc(ac2, -90f, 360f * cg, false, Offset(s * .02f, s * .02f), Size(s * .96f, s * .96f), style = Stroke(s * .05f, cap = StrokeCap.Round))
                  if (mood == 5) {
                      val z = s * (.78f + .03f * br)
                      drawLine(ink, Offset(z, s * .08f), Offset(z + s * .1f, s * .08f), s * .03f, StrokeCap.Round)
                      drawLine(ink, Offset(z + s * .1f, s * .08f), Offset(z, s * .18f), s * .03f, StrokeCap.Round)
                      drawLine(ink, Offset(z, s * .18f), Offset(z + s * .1f, s * .18f), s * .03f, StrokeCap.Round)
                  }
              }
          }

