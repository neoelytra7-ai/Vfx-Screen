# Single-file pipeline: this YAML contains the whole Android app (Kotlin) + build + sign + release.
# Edit the source blocks in the 'src' step and push: every push builds an updatable APK.
name: apk
on:
  push: {branches: [main], tags: ['v*']}
  workflow_dispatch:
concurrency: {group: "apk-${{github.ref}}", cancel-in-progress: true}
permissions: {contents: write}
env: {N: Canvas}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - name: src
        run: |
          cat > settings.gradle.kts <<'EOF_SRC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Canvas"
          include(":app")
          EOF_SRC
          cat > build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_SRC
          cat > gradle.properties <<'EOF_SRC'
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_SRC
          cat > .gitignore <<'EOF_SRC'
          build/
          .gradle/
          local.properties
          *.jks
          EOF_SRC
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "dev.canvas"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.canvas"; minSdk = 24; targetSdk = 35
                  versionCode = (findProperty("versionCode") as String?)?.toInt() ?: 1
                  versionName = findProperty("versionName") as String? ?: "dev"
              }
              buildTypes { release { isMinifyEnabled = true; isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt")) } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
          }
          EOF_SRC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <application android:label="Neko Canvas" android:icon="@mipmap/ic_launcher" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF_SRC'
