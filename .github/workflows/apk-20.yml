          @Composable
          fun ThemePanel(editHud: () -> Unit = {}, done: () -> Unit) {
              val rv = U.rev
              var grp by remember { mutableIntStateOf(0) }
              val gs = themeGroups()
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  THEME_PRESETS.forEachIndexed { i, v ->
                      Box(Modifier.pop(i)) {
                          Bub(38f, false, anim = false, pad = .2f, f = { applyPreset(v); U.bump() }) {
                              drawCircle(T.hsv(v[4], v[5], .2f), size.minDimension / 2f)
                              drawCircle(T.hsv(v[0], v[1], v[2]), size.minDimension * .26f, Offset(size.width * .5f, size.height * .5f))
                          }
                      }
                  }
              }
              if (T.hint > .5f) Tx("presets: " + THEME_NAMES.joinToString(" - ").lowercase(), T.ink.copy(alpha = .5f), sz = 8f, maxLines = 2)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  gs.forEachIndexed { i, g -> Pill(g.first, grp == i) { grp = i } }
                  Pill("DONE", true, Ik.OK, f = done)
              }
              val name = gs[grp].first
              val skip: Set<String> = when (name) {
                  "TEXT" -> setOf("FONT", "TITLE FONT", "UI SCALE", "HINTS")
                  "CAT" -> setOf("EARS", "WHISKERS", "BOW")
                  "BACKDROP" -> setOf("PATTERN")
                  "GLOW" -> setOf("RIPPLE")
                  "STAB" -> setOf("MODE", "CATCH UP", "FOR BRUSH", "FOR ERASER", "FOR LASSO", "FOR LIQUIFY")
                  else -> emptySet()
              }
              when (name) {
                  "TEXT" -> {
                      Choice("UI SCALE", SC_N, SC_V.indices.minByOrNull { kotlin.math.abs(SC_V[it] - T.sc) } ?: 2) { T.sc = SC_V[it]; U.bump() }
                      Choice("BODY FONT", FONT_NAMES, T.fnt.toInt(), true) { T.fnt = it.toFloat(); U.bump() }
                      Choice("TITLE FONT", FONT_NAMES, T.fnt2.toInt(), true) { T.fnt2 = it.toFloat(); U.bump() }
                      Choice("HINTS", listOf("OFF", "ON"), T.hint.toInt()) { T.hint = it.toFloat(); U.bump() }
                  }
                  "CAT" -> {
                      Choice("EARS", listOf("ROUND", "CAT", "BUNNY"), T.ear.toInt()) { T.ear = it.toFloat(); U.bump() }
                      Choice("WHISKERS", listOf("OFF", "ON"), T.whisk.toInt()) { T.whisk = it.toFloat(); U.bump() }
                      Choice("BOW", listOf("OFF", "ON"), T.bow.toInt()) { T.bow = it.toFloat(); U.bump() }
                  }
                  "BACKDROP" -> Choice("PATTERN", PAT_NAMES, T.pat.toInt()) { T.pat = it.toFloat(); U.bump() }
                  "GLOW" -> Choice("TAP RIPPLE", listOf("OFF", "ON"), T.rip.toInt()) { T.rip = it.toFloat(); U.bump() }
                  "STAB" -> {
                      Choice("MODE", listOf("OFF", "SMOOTH", "ROPE", "BOTH"), Stab.mode.toInt()) { Stab.mode = it.toFloat(); U.bump() }
                      Choice("CATCH UP", listOf("OFF", "ON"), if (Stab.catchUp) 1 else 0) { Stab.catchUp = it == 1; U.bump() }
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                          Pill("BRUSH", Stab.onBrush, Ik.BR) { Stab.onBrush = !Stab.onBrush; U.bump() }
                          Pill("ERASER", Stab.onEraser, Ik.ER) { Stab.onEraser = !Stab.onEraser; U.bump() }
                          Pill("LASSO", Stab.onLasso, Ik.LS) { Stab.onLasso = !Stab.onLasso; U.bump() }
                          Pill("LIQUIFY", Stab.onLiquify, Ik.LQ) { Stab.onLiquify = !Stab.onLiquify; U.bump() }
                      }
                  }
                  "HUD" -> {
                      Pill("EDIT HUD (drag, group, scale, ruler)", true, Ik.ED) { editHud() }
                      Choice("LAYOUT PRESET", listOf("BOTTOM", "TOP", "COLUMN L", "COLUMN R"), -1) { Hud.preset(it); U.bump() }
                  }
                  else -> {}
              }
              gs[grp].second.filter { it.n !in skip }.forEach { R2(it) }
          }

          @Composable
          fun LB(k: Ik, label: String, on: Boolean = false, en: Boolean = true, pie: List<PieOpt>? = null, f: () -> Unit) {
              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                  IB(k, on, en, sz = 36f, anim = false, pie = pie, title = label, f = f)
                  Tx(label, T.ink.copy(alpha = .7f), sz = 7f)
              }
          }

          /** the lasso's action bar: appears while the lasso is active or a selection exists. every button has a pie of variants. */
          @Composable
          fun LassoBar(e: Engine, v: CanvasView) {
              val rv = U.rev
              val has = e.hasSel
              val modes = listOf("NEW", "ADD", "SUB", "AND"); val shapes = listOf("FREE", "BOX", "OVAL")
              Column(Modifier.clip(rs(.8f)).background(T.panel).padding(d(6f)), verticalArrangement = Arrangement.spacedBy(d(2f))) {
                  Row(horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                      LB(Ik.LS, modes[e.lasMode], true, pie = modes.mapIndexed { i, n -> PieOpt(Ik.LS, n) { e.lasMode = i; U.bump() } }) { e.lasMode = (e.lasMode + 1) % 4; U.bump() }
                      LB(Ik.RC, shapes[e.lasShape], pie = shapes.mapIndexed { i, n -> PieOpt(Ik.RC, n) { e.lasShape = i; U.bump() } }) { e.lasShape = (e.lasShape + 1) % 3; U.bump() }
                      LB(Ik.SA, "ALL") { v.gl { e.selectAll() } }
                      LB(Ik.SI, "INVERT") { v.gl { e.invertSel() } }
                      LB(Ik.ND, "NONE", en = has) { v.gl { e.deselect() } }
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                      LB(Ik.FL, "FILL", en = has, pie = listOf(
                          PieOpt(Ik.FL, "FG") { v.gl { e.selFill(e.pen.color) } }, PieOpt(Ik.FL, "BG") { v.gl { e.selFill(e.pen.color2) } },
                          PieOpt(Ik.FL, "WHITE") { v.gl { e.selFill(-1) } }, PieOpt(Ik.FL, "BLACK") { v.gl { e.selFill(0xFF000000.toInt()) } })) { v.gl { e.selFill(e.pen.color) } }
                      LB(Ik.CT, "CLEAR", en = has, pie = listOf(
                          PieOpt(Ik.CT, "CLEAR") { v.gl { e.selClear() } }, PieOpt(Ik.LF, "CUT TO LAYER") { v.gl { e.selLift(true) } })) { v.gl { e.selClear() } }
                      LB(Ik.DP, "COPY", en = has, pie = listOf(PieOpt(Ik.DP, "COPY TO LAYER") { v.gl { e.selLift(false) } })) { v.gl { e.selLift(false) } }
                      LB(Ik.LF, "LIFT", en = has) { v.gl { e.selLift(true) } }
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                      LB(Ik.FE, "FEATHER", en = has, pie = listOf(2, 6, 12, 24).map { r -> PieOpt(Ik.FE, r.toString() + " px") { v.gl { e.featherSel(r) } } }) { v.gl { e.featherSel(6) } }
                      LB(Ik.GW, "GROW", en = has, pie = listOf(1, 3, 6, 12).map { r -> PieOpt(Ik.GW, "+" + r) { v.gl { e.growSel(r, true) } } }) { v.gl { e.growSel(3, true) } }
                      LB(Ik.SK, "SHRINK", en = has, pie = listOf(1, 3, 6, 12).map { r -> PieOpt(Ik.SK, "-" + r) { v.gl { e.growSel(r, false) } } }) { v.gl { e.growSel(3, false) } }
                  }
              }
          }

          fun saveBmp(ctx: Context, b: Bitmap, share: Boolean = false) {
              val n = "Neko_" + System.currentTimeMillis() + ".png"
              var ok = true
              var uri: Uri? = null
              try {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val cv = ContentValues()
                      cv.put(MediaStore.Images.Media.DISPLAY_NAME, n)
                      cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                      cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Neko")
                      val u = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv)!!
                      ctx.contentResolver.openOutputStream(u)!!.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                      uri = u
                  } else {
                      val f = java.io.File(ctx.getExternalFilesDir(Environment.DIRECTORY_PICTURES), n)
                      f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  }
              } catch (x: Exception) { ok = false }
              val u2 = uri
              Handler(Looper.getMainLooper()).post {
                  Toast.makeText(ctx, if (ok) "saved " + n else "save failed", Toast.LENGTH_LONG).show()
                  if (share && ok && u2 != null) {
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "image/png"; i.putExtra(Intent.EXTRA_STREAM, u2); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      val c = Intent.createChooser(i, "share"); c.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(c)
                  }
              }
          }

          // ───────────────────────── app ─────────────────────────
          @Composable
          fun App(e: Engine, onHome: () -> Unit) {
              val ctx = LocalContext.current
              val den = LocalDensity.current.density
              val v = remember { CanvasView(ctx, e) }
              val rv = U.rev
              val sig = T.sig()
              val scope = rememberCoroutineScope()
              var tool by remember { mutableStateOf(Tool.BRUSH) }
              var alt by remember { mutableStateOf(Tool.ERASER) }
              var panel by remember { mutableIntStateOf(0) }   // 0 none 1 tools 2 brush 3 color 4 layers 5 menu 6 settings 7 fx 8 stabilizer
              var last by remember { mutableIntStateOf(1) }
              var prevShown by remember { mutableIntStateOf(1) }
              var hud by remember { mutableStateOf(true) }
              var mood by remember { mutableIntStateOf(0) }
              var say by remember { mutableStateOf("") }
              var sayOn by remember { mutableStateOf(false) }
              var backT by remember { mutableLongStateOf(0L) }
              val job = remember { arrayOfNulls<Job>(1) }
              val moved by remember { derivedStateOf { e.rot != 0f || e.zoom != 1f } }
              fun feel(m: Int, s: String) {
                  job[0]?.cancel(); mood = m; say = s; sayOn = true
                  job[0] = scope.launch { delay(1600); mood = 0; sayOn = false }
              }
              fun setTool(t: Tool) { tool = t; e.tool = t; U.bump() }
              fun openP(p: Int) { panel = if (panel == p) 0 else p }
              fun undoN(n: Int) { v.gl { repeat(n) { e.undo() } } }
              fun redoN(n: Int) { v.gl { repeat(n) { e.redo() } } }
              fun saveShare(share: Boolean) { v.gl { val b = e.snapshot(); Thread { saveBmp(ctx, b, share) }.start() }; feel(3, if (share) "sharing!" else "saved!") }
              fun quickFx(name: String) {
                  val i = FXS.indexOfFirst { it.n == name }
                  if (i >= 0) {
                      val f = FXS[i]; val vv = FloatArray(4) { f.ps.getOrNull(it)?.d ?: 0f }
                      FxMem.idx = i; FxMem.vals = vv; v.gl { e.fxQuick(i, vv) }; feel(3, name.lowercase() + "!")
                  }
              }
              fun swapColors() { val t = e.pen.color; e.pen.color = e.pen.color2; e.pen.color2 = t; U.from(if (U.tgt == 0) e.pen.color else e.pen.color2); U.bump() }
              fun setColor(c: Int) { e.pen.color = c; U.from(c); U.bump() }
              fun setStab(l: Float) { Stab.level = l; if (l > .02f) Stab.last = l; U.bump(); feel(1, if (l > .02f) "stabilizer " + (l * 100).toInt() + "%" else "stabilizer off") }

              SideEffect {
                  T.push(e); v.kick()
                  if (panel != 0 && panel != last) { prevShown = last; last = panel }
              }
              LaunchedEffect(Unit) { e.onPick = { c -> U.tgt = 0; U.from(c); U.bump() }; feel(1, "meow~ let's draw!") }
              LaunchedEffect(e.busy) { if (e.busy && (panel == 1 || panel == 5)) panel = 0 }
              LaunchedEffect(Hud.edit) { if (Hud.edit) panel = 0 }
              LaunchedEffect(panel) {
                  e.pulse(); v.kick()
                  if (panel == 7) v.gl { e.fxOpen() } else v.gl { e.fxClose() }
              }
              BackHandler {
                  if (Hud.edit) Hud.edit = false
                  else if (panel != 0) panel = 0
                  else if (!hud) hud = true
                  else {
                      val n = System.currentTimeMillis()
                      if (n - backT < 2000) onHome() else { backT = n; feel(4, "back again to leave") }
                  }
              }
              val m = if (!hud) 5 else if (e.busy) 2 else mood
              val hudA by animateFloatAsState(if (e.busy) .08f else 1f, label = "hudA")

              // ---- widget bodies ----
              val wc: @Composable (String) -> Unit = { id ->
                  when (id) {
                      "menu" -> Mascot(
                          m, 46f, pie = listOf(
                              PieOpt(Ik.SV, "SAVE") { saveShare(false) },
                              PieOpt(Ik.SH, "SHARE") { saveShare(true) },
                              PieOpt(Ik.TH, "SETTINGS") { panel = 6 },
                              PieOpt(Ik.ED, "EDIT HUD") { Hud.edit = true; panel = 0; feel(1, "drag buttons to rearrange") },
                              PieOpt(Ik.CV, "NAP") { hud = false; panel = 0 })
                      ) { openP(5) }
                      "tool" -> IB(
                          Ik.valueOf(tool.code), true, sz = 44f, anim = !e.busy, title = "QUICK TOOLS",
                          pie = Hud.pins.map { t -> PieOpt(Ik.valueOf(t.code), TN[t.ordinal]) { setTool(t); feel(1, SAY[t.ordinal]) } }
                      ) { openP(1) }
                      "brush" -> {
                          val nz = (ln(e.pen.size) / ln(1000f)).coerceIn(0f, 1f)
                          val hd = e.pen.hardness.coerceIn(0f, .97f)
                          Bub(
                              44f, panel == 2, anim = false, pad = .2f, title = "BRUSH PRESETS",
                              pie = PRESETS.map { (n, vals) -> PieOpt(Ik.BR, n) { e.pen.load(vals); U.bump(); feel(1, n.lowercase() + " brush") } },
                              f = { openP(2) }
                          ) {
                              val col = if (panel == 2) T.dk else T.ink
                              drawCircle(Brush.radialGradient(0f to col, hd to col, 1f to col.copy(alpha = 0f)), size.minDimension / 2f * (.35f + .65f * nz))
                          }
                      }
                      "color" -> Bub(
                          44f, panel == 3, anim = false, pad = .24f, title = "COLOR",
                          pie = listOf(
                              PieOpt(Ik.SY, "SWAP") { swapColors() }, PieOpt(Ik.PK, "EYEDROP") { setTool(Tool.PICK) },
                              PieOpt(Ik.CO, "WHITE") { setColor(-1) }, PieOpt(Ik.CO, "BLACK") { setColor(0xFF000000.toInt()) },
                              PieOpt(Ik.CO, "AMBER") { setColor(0xFFFFC857.toInt()) }),
                          f = { openP(3); U.from(if (U.tgt == 0) e.pen.color else e.pen.color2) }
                      ) {
                          val s2 = size.minDimension
                          drawCircle(Color(e.pen.color2), s2 * .3f, Offset(s2 * .66f, s2 * .66f))
                          drawCircle(Color.White, s2 * .36f, Offset(s2 * .4f, s2 * .4f))
                          drawCircle(Color(e.pen.color), s2 * .29f, Offset(s2 * .4f, s2 * .4f))
                      }
                      "layers" -> Box {
                          IB(
                              Ik.LY, panel == 4, sz = 44f, anim = false, title = "LAYERS",
                              pie = listOf(
                                  PieOpt(Ik.PL, "NEW") { v.gl { e.addLayer() }; feel(1, "new layer!") }, PieOpt(Ik.DP, "DUPLICATE") { v.gl { e.dupLayer() } },
                                  PieOpt(Ik.MG, "MERGE") { v.gl { e.mergeDown() } }, PieOpt(Ik.EY, "SOLO") { v.gl { e.solo(e.cur) } },
                                  PieOpt(Ik.CX, "CLEAR") { v.gl { e.clearLayer() } })
                          ) { openP(4) }
                          Tx("" + e.info.size, T.dk, Modifier.align(Alignment.BottomEnd).clip(CircleShape).background(T.ac2).padding(horizontal = d(5f)), 9f)
                      }
                      "fx" -> IB(
                          Ik.FX, panel == 7, sz = 44f, anim = false, title = "QUICK FX",
                          pie = listOf(
                              PieOpt(Ik.UN, "LAST FX") {
                                  if (FxMem.idx >= 0) { val i = FxMem.idx; val vv = FxMem.vals.copyOf(); v.gl { e.fxQuick(i, vv) }; feel(3, "again: " + FXS[i].n.lowercase()) }
                                  else feel(4, "no filter used yet")
                              },
                              PieOpt(Ik.BL, "GAUSS") { quickFx("GAUSS") }, PieOpt(Ik.DG, "SHARPEN") { quickFx("SHARPEN") },
                              PieOpt(Ik.FX, "GLOW") { quickFx("GLOW") }, PieOpt(Ik.GR, "GRAIN") { quickFx("GRAIN") }, PieOpt(Ik.CO, "DREAM") { quickFx("DREAM") })
                      ) { openP(7) }
                      "undo" -> IB(
                          Ik.UN, en = e.canUndo, anim = false, title = "UNDO",
                          pie = listOf(PieOpt(Ik.UN, "UNDO x5") { undoN(5) }, PieOpt(Ik.UN, "UNDO x20") { undoN(20) }, PieOpt(Ik.RE, "REDO x5") { redoN(5) })
                      ) { v.gl { e.undo() }; feel(4, "oops!") }
                      "redo" -> IB(
                          Ik.RE, en = e.canRedo, anim = false, title = "REDO",
                          pie = listOf(PieOpt(Ik.RE, "REDO x5") { redoN(5) }, PieOpt(Ik.RE, "REDO x20") { redoN(20) }, PieOpt(Ik.UN, "UNDO x5") { undoN(5) })
                      ) { v.gl { e.redo() }; feel(1, "again!") }
                      "stab" -> IB(
                          Ik.ST, Stab.level > .02f && Stab.mode.toInt() != 0, sz = 44f, anim = false, title = "STABILIZER",
                          pie = listOf(
                              PieOpt(Ik.ST, "OFF") { setStab(0f) }, PieOpt(Ik.ST, "LIGHT") { setStab(.25f) }, PieOpt(Ik.ST, "MEDIUM") { setStab(.5f) },
                              PieOpt(Ik.ST, "STRONG") { setStab(.75f) }, PieOpt(Ik.ST, "MAX") { setStab(1f) }, PieOpt(Ik.TH, "TUNE...") { panel = 8 })
                      ) { if (Stab.level > .02f) setStab(0f) else setStab(Stab.last.coerceAtLeast(.2f)) }
                      "size" -> {
                          val lq = tool == Tool.LIQUIFY; val ls = tool == Tool.LASSO
                          val t = if (lq) ln(e.liqR / 10f) / ln(50f) else if (ls) e.lasFeather / 40f else ln(e.pen.size) / ln(1000f)
                          val lab = if (lq) "RADIUS" else if (ls) "FEATHER" else "SIZE"
                          val value = if (lq) e.liqR.toInt().toString() else if (ls) e.lasFeather.toInt().toString() else e.pen.size.toInt().toString()
                          VSlider(t, lab, value) { x ->
                              if (lq) e.liqR = 10f * 50f.pow(x) else if (ls) e.lasFeather = x * 40f else e.pen.size = 1000f.pow(x)
                              U.bump()
                          }
                      }
                      "opac" -> {
                          val lq = tool == Tool.LIQUIFY; val ls = tool == Tool.LASSO
                          val t = if (lq) (e.liqS - .05f) / 2.95f else (e.pen.opacity - .01f) / .99f
                          val value = if (lq) "%.1f".format(e.liqS) else (e.pen.opacity * 100).toInt().toString() + "%"
                          VSlider(t, if (lq) "POWER" else "OPACITY", value, en = !ls) { x ->
                              if (lq) e.liqS = .05f + x * 2.95f else e.pen.opacity = .01f + x * .99f
                              U.bump()
                          }
                      }
                      "compass" -> Bub(
                          40f, false, anim = false, pad = .24f, title = "VIEW",
                          pie = listOf(
                              PieOpt(Ik.LK, if (e.rotLock) "UNLOCK" else "LOCK ROT") { e.rotLock = !e.rotLock; U.bump(); feel(1, if (e.rotLock) "rotation locked" else "rotation free") },
                              PieOpt(Ik.CP, "ANGLE 0") { e.resetRot(); v.requestRender() },
                              PieOpt(Ik.RC, "FIT") { e.resetView(); v.requestRender() }),
                          f = { e.resetView(); v.requestRender(); feel(1, "view reset") }
                      ) { ic(Ik.CP, T.ink, T.ac2, e.rot / 6.2832f) }
                      "lasso" -> LassoBar(e, v)
                      else -> {}
                  }
              }

              BoxWithConstraints(Modifier.fillMaxSize()) {
                  val sw = constraints.maxWidth.toFloat(); val sh = constraints.maxHeight.toFloat()
                  SideEffect { Pie.sw = sw; Pie.sh = sh }
                  AndroidView({ v }, Modifier.fillMaxSize())

                  AnimatedVisibility(
                      visible = hud, modifier = Modifier.fillMaxSize(),
                      enter = fadeIn() + scaleIn(spring(.6f, 300f), initialScale = .92f), exit = fadeOut() + scaleOut(targetScale = .94f)
                  ) {
                      Box(Modifier.fillMaxSize()) {
                          if (Hud.edit) HudRuler(den)
                          Box(Modifier.fillMaxSize().graphicsLayer { alpha = if (Hud.edit) 1f else hudA }) {
                              for (w in Hud.ws) {
                                  val cond = when (w.id) { "compass" -> moved; "lasso" -> tool == Tool.LASSO || e.hasSel; else -> true }
                                  if (Hud.shown(w, cond)) key(w.id) { Placed(w, sw, sh, den) { wc(w.id) } }
                              }
                          }
                      }
                  }

                  // ---- floating panel, anchored to the button that opened it ----
                  val shownP = if (panel != 0) panel else last
                  val anchor = Hud.by(when (shownP) { 1 -> "tool"; 2 -> "brush"; 3 -> "color"; 4 -> "layers"; 7 -> "fx"; 8 -> "stab"; else -> "menu" })
                  val up = anchor.y > .5f
                  val ox = anchor.x
                  val oy = if (up) 1f else 0f
                  AnimatedVisibility(
                      visible = panel != 0 && !Hud.edit && hud,
                      modifier = Modifier.align(if (up) Alignment.BottomCenter else Alignment.TopCenter).padding(horizontal = d(8f))
                          .then(
                              if (up) Modifier.padding(bottom = ((1f - anchor.y) * sh / den).dp + d(30f * anchor.s))
                              else Modifier.padding(top = (anchor.y * sh / den).dp + d(30f * anchor.s))
                          ),
                      enter = fadeIn() + scaleIn(spring(.5f, 340f), initialScale = .86f, transformOrigin = TransformOrigin(ox, oy)) + expandVertically(),
                      exit = fadeOut() + scaleOut(targetScale = .9f, transformOrigin = TransformOrigin(ox, oy)) + shrinkVertically()
                  ) {
                      Column(
                          Modifier.fillMaxWidth().heightIn(max = d(T.pnh)).clip(rs()).background(T.panel)
                              .animateContentSize().verticalScroll(rememberScrollState()).padding(d(10f))
                      ) {
                          key(shownP) {
                              val a = remember { Animatable(0f) }
                              LaunchedEffect(Unit) { if (T.an > .01f) { a.snapTo(0f); a.animateTo(1f, spring(.5f, 280f)) } else a.snapTo(1f) }
                              val dir = if (shownP >= prevShown) 1f else -1f
                              Column(
                                  Modifier.graphicsLayer {
                                      val t = a.value
                                      translationX = (1f - t) * 70f * dir; alpha = t.coerceIn(0f, 1f); scaleX = .94f + .06f * t; scaleY = .94f + .06f * t
                                  },
                                  verticalArrangement = Arrangement.spacedBy(d(8f))
                              ) {
                                  when (shownP) {
                                      1 -> ToolsPanel(
                                          tool, { t -> setTool(t); feel(1, SAY[t.ordinal]); panel = 0 },
                                          { t -> Hud.pin(t); feel(1, TN[t.ordinal] + " pinned to quick menu") },
                                          { t -> alt = t; feel(1, TN[t.ordinal] + " is your alt tool") },
                                          { t -> feel(1, TD[t.ordinal]) })
                                      2 -> BrushPanel(e)
                                      3 -> ColorPanel(e) { a2, b -> feel(a2, b) }
                                      4 -> LayerPanel(e, v) { a2, b -> feel(a2, b) }
                                      5 -> MenuPanel(
                                          e,
                                          sym = { e.symMode = (e.symMode + 1) % 5; U.bump(); feel(1, "sym " + SYM[e.symMode]) },
                                          symHold = { e.symMode = 4; e.symN = if (e.symN >= 12) 2 else e.symN + 1; U.bump(); feel(1, "radial x" + e.symN) },
                                          save = { saveShare(false); panel = 0 }, share = { saveShare(true); panel = 0 },
                                          theme = { panel = 6 }, dice = { randomTheme(); U.bump(); feel(3, "surprise!") },
                                          editHud = { Hud.edit = true; feel(1, "drag buttons to rearrange") },
                                          rotReset = { e.resetRot(); v.requestRender(); feel(1, "angle reset") },
                                          hide = { hud = false; panel = 0 }, home = { onHome() }
                                      )
                                      6 -> ThemePanel(editHud = { Hud.edit = true; feel(1, "drag buttons to rearrange") }) {
                                          T.save(ctx.getSharedPreferences("t", 0)); Hud.save(ctx.getSharedPreferences("t", 0)); panel = 0; feel(3, "so cute!")
                                      }
                                      8 -> StabPanel()
                                      else -> FxPanel(e, v, { panel = 0; feel(3, "sparkly!") }, { panel = 0 })
                                  }
                              }
                          }
                      }
                  }

                  AnimatedVisibility(
