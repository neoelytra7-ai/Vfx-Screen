          @Composable
          fun BrushPanel(e: Engine) {
              val rv = U.rev
              var more by remember { mutableStateOf(false) }
              val ps = penParams(e)
              when (e.tool) {
                  Tool.LIQUIFY -> {
                      Choice("LIQUIFY MODE", listOf("PUSH", "PINCH", "BLOAT", "SWIRL"), e.liqMode) { e.liqMode = it; U.bump() }
                      R2(PP("RADIUS", 10f, 500f, 5f, true, { e.liqR }, { e.liqR = it }, "brush radius"))
                      R2(PP("STRENGTH", .05f, 3f, .05f, false, { e.liqS }, { e.liqS = it }, "how hard it pushes"))
                  }
                  Tool.GRAD -> {
                      Choice("GRADIENT", listOf("LINEAR", "RADIAL", "CONIC", "MIRROR"), e.pen.gradMode) { e.pen.gradMode = it; U.bump() }
                      Choice("ENDS", listOf("FG > BG", "FG > FADE"), if (e.pen.gradFade) 1 else 0) { e.pen.gradFade = it == 1; U.bump() }
                  }
                  Tool.RECT, Tool.OVAL -> Choice("SHAPE", listOf("OUTLINE", "FILL", "BOTH"), e.pen.shapeFill) { e.pen.shapeFill = it; U.bump() }
                  Tool.FILL -> R2(ps.first { it.n == "FILL TOL" })
                  Tool.LASSO -> {
                      Choice("SELECT MODE", listOf("NEW", "ADD", "SUBTRACT", "INTERSECT"), e.lasMode) { e.lasMode = it; U.bump() }
                      Choice("SHAPE", listOf("FREE", "BOX", "OVAL"), e.lasShape) { e.lasShape = it; U.bump() }
                      R2(PP("FEATHER", 0f, 40f, 1f, false, { e.lasFeather }, { e.lasFeather = it }, "soft edge on new selections"))
                  }
                  else -> {}
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PRESETS.forEachIndexed { i, (n, vals) -> Box(Modifier.pop(i)) { Pill(n) { e.pen.load(vals); U.bump() } } }
              }
              R2(ps[0]); R2(ps[1])
              val pg by animateFloatAsState(if (more) 1f else 0f, spring(.6f, 300f), label = "more")
              Pill(if (more) "LESS" else "MORE", more, Ik.CV, pg) { more = !more }
              if (more) {
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Pill("FOLLOW", e.pen.follow) { e.pen.follow = !e.pen.follow; U.bump() }
                      SYM.forEachIndexed { i, s -> Pill(s, e.symMode == i) { e.symMode = i; U.bump() } }
                  }
                  ps.drop(2).forEach { R2(it) }
              }
          }

