          val PAPERS = listOf(0xFFFFFFFFL, 0xFFFFF4E0L, 0xFFFFE3EEL, 0xFFDFF7EAL, 0xFFE3F1FFL, 0xFF1A141CL, 0x00FFFFFFL)
          val PAPER_PATS = listOf("NONE" to 0, "DOTS" to 1, "GRID" to 2, "CHECK" to 6, "HEARTS" to 4, "PAWS" to 14, "KITTIES" to 15)
          val SAYS = listOf("hello, i'm neko", "ready when you are", "what shall we draw?", "take your time", "meow")

          fun r256(x: Float): Int = max(256, ((x + 128f) / 256f).toInt() * 256)
          fun dimsOf(long: Int, ratio: Float): Pair<Int, Int> = if (ratio >= 1f) Pair(long, r256(long / ratio)) else Pair(r256(long * ratio), long)
          fun layersCap(w: Int, h: Int, ramMb: Int): Int {
              val lm = w * h * 4f / 1048576f
              val budget = (ramMb * .22f).coerceIn(150f, 1400f)
              return (budget / lm - 4f).toInt().coerceIn(3, 32)
          }
          fun rawText(i: Int, v: Float): String = when (i) {
              0 -> "%.1f Gpx/s".format(v / 1000f)
              1 -> "%.0f k/s".format(v)
              2 -> "%.0f Mpx/s".format(v)
              3 -> "%.0f MB/s".format(v)
              4 -> "%.0f M/s".format(v)
              else -> "%.1f GB".format(v)
          }

          fun DrawScope.heartAt(c: Color, x: Float, y: Float, r: Float) {
              drawCircle(c, r * .55f, Offset(x - r * .5f, y - r * .2f)); drawCircle(c, r * .55f, Offset(x + r * .5f, y - r * .2f))
              val p = Path(); p.moveTo(x - r * 1.02f, y); p.lineTo(x, y + r); p.lineTo(x + r * 1.02f, y); p.close(); drawPath(p, c)
          }
          fun DrawScope.pawAt(c: Color, x: Float, y: Float, r: Float) {
              drawCircle(c, r * .55f, Offset(x, y + r * .25f))
              drawCircle(c, r * .22f, Offset(x - r * .6f, y - r * .15f)); drawCircle(c, r * .22f, Offset(x - r * .22f, y - r * .6f))
              drawCircle(c, r * .22f, Offset(x + r * .22f, y - r * .6f)); drawCircle(c, r * .22f, Offset(x + r * .6f, y - r * .15f))
          }

          /** a few slow paws and hearts drifting up; seamless loop (integer speeds), very quiet */
          @Composable
          fun Floaters(mod: Modifier) {
              val t = if (T.an > .01f) rememberInfiniteTransition(label = "fl").animateFloat(0f, 1f, infiniteRepeatable(tween(90000, easing = LinearEasing)), label = "t").value else 0f
              val a1 = T.ac; val a2 = T.ac2
              Canvas(mod) {
                  for (i in 0 until 12) {
                      val h1 = ((i * 7919) % 1000) / 1000f; val h2 = ((i * 104729) % 997) / 997f
                      val x = size.width * h2 + sin(t * 6.2832f * (1 + i % 2) + i) * 10f
                      val y = size.height * (1f - ((h1 + t * (1 + i % 2)) % 1f))
                      val r = 7f + h2 * 9f
                      val c = (if (i % 2 == 0) a1 else a2).copy(alpha = .07f + h1 * .07f)
                      if (i % 3 == 0) heartAt(c, x, y, r) else pawAt(c, x, y, r)
                  }
              }
          }

          @Composable
          fun BarRow(name: String, v: Float, label: String) {
              val a by animateFloatAsState(v, spring(.8f, 100f), label = "bar")
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  Tx(name, T.ink.copy(alpha = .8f), Modifier.width(d(50f)), 10f)
                  Box(Modifier.weight(1f).height(d(8f)).clip(RoundedCornerShape(50)).background(T.panel2)) {
                      Box(Modifier.fillMaxWidth(a.coerceIn(.03f, 1f)).fillMaxHeight().background(Brush.horizontalGradient(listOf(T.ac2, T.ac))))
                  }
                  Tx(label, T.ink.copy(alpha = .8f), Modifier.width(d(76f)), 9f)
              }
          }

          /** calm card: a gentle progress bar while measuring, then the phone class + one friendly recommendation */
          @Composable
          fun BenchCard(st: BenchState, ram: Int, rerun: () -> Unit) {
              val r = st.res
              var more by remember { mutableStateOf(false) }
              Column(
                  Modifier.fillMaxWidth().clip(rs()).background(T.panel).animateContentSize().padding(d(14f)),
                  verticalArrangement = Arrangement.spacedBy(d(8f))
              ) {
                  if (st.running || r == null) {
                      Tx(if (st.running) "getting to know your phone..." else "phone check not done yet", T.ac, head = true)
                      val pg by animateFloatAsState(st.stage / 6f, spring(.8f, 100f), label = "pg")
                      Box(Modifier.fillMaxWidth().height(d(6f)).clip(RoundedCornerShape(50)).background(T.panel2)) {
                          Box(Modifier.fillMaxWidth(pg.coerceIn(.04f, 1f)).fillMaxHeight().background(Brush.horizontalGradient(listOf(T.ac2, T.ac))))
                      }
                      Tx(if (st.running) BSTAGE[st.stage.coerceIn(0, 5)] else "tap re-check to try again", T.ink.copy(alpha = .6f), sz = 9f)
                  } else {
                      val tier = TIERS[r.tier]
                      Tx(tier.name, T.ac, head = true, sz = 15f)
                      Tx(tier.tag, T.ink.copy(alpha = .7f), sz = 10f)
                      Row(horizontalArrangement = Arrangement.spacedBy(d(5f))) {
                          for (i in 0..4) Box(Modifier.size(d(14f), d(6f)).clip(RoundedCornerShape(50)).background(if (i <= r.tier) T.ac else T.panel2))
                      }
                      val (w, h) = dimsOf(SIZES[r.tier], 1f)
                      Tx("recommended: " + SIZES[r.tier] + " px canvas, about " + layersCap(w, h, ram) + " layers", T.ink, sz = 10f, maxLines = 2)
                      Tx(deviceName() + "  -  " + r.gpu, T.ink.copy(alpha = .5f), sz = 8f)
                      Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                          Pill(if (more) "HIDE DETAILS" else "DETAILS", more, Ik.CV, if (more) 1f else 0f) { more = !more }
                          Pill("RE-CHECK", false, Ik.FX) { rerun() }
                      }
                      if (more) {
                          for (i in 0 until 6) BarRow(BN[i], r.sc[i], rawText(i, r.raw[i]))
                          for (i in 0 until 6) {
                              val s = if (r.raw[i] >= BREC[i]) 2 else if (r.raw[i] >= BMIN[i]) 1 else 0
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                                  Tx(BN[i], T.ink, Modifier.width(d(50f)), 10f)
                                  Tx("needs " + rawText(i, BMIN[i]) + "   nicer " + rawText(i, BREC[i]), T.ink.copy(alpha = .6f), Modifier.weight(1f), 8f)
                                  Tx(
                                      listOf("LOW", "OK", "GREAT")[s], T.dk,
                                      Modifier.clip(RoundedCornerShape(50)).background(listOf(Color(0xFFFF9AAE), Color(0xFFFFE08A), Color(0xFF9BE6AE))[s]).padding(horizontal = d(8f), vertical = d(2f)), 9f
                                  )
                              }
                          }
                          Tx("GL " + r.api + "  max tex " + r.maxTex + "  cores " + r.cores, T.ink.copy(alpha = .5f), sz = 8f)
                      }
                  }
              }
          }

          @Composable
          fun NewCanvas(res: BenchRes?, ramMb: Int, onStart: (Cfg) -> Unit) {
              val rec = res?.tier ?: 1
              var sizeI by remember { mutableIntStateOf(rec) }
              var asp by remember { mutableIntStateOf(0) }
              var paperI by remember { mutableIntStateOf(0) }
              var patI by remember { mutableIntStateOf(0) }
              val (w, h) = dimsOf(SIZES[sizeI], ASP[asp].second)
              val cap = layersCap(w, h, ramMb)
              val mbs = "%.0f".format(w * h * 4f / 1048576f)
              val verdict = if (sizeI <= rec) "smooth for your phone" else if (sizeI == rec + 1) "ok, heavy filters may lag" else "heavy - expect some lag"
              val vc = if (sizeI <= rec) Color(0xFF9BE6AE) else if (sizeI == rec + 1) Color(0xFFFFE08A) else Color(0xFFFF9AAE)
              Tx("CANVAS SIZE" + (if (res != null) "   (* = recommended)" else ""), T.ac, sz = 10f, head = true)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  for (i in SIZES.indices) Box(Modifier.pop(i)) { Pill(SIZE_N[i] + " " + SIZES[i] + (if (res != null && i == rec) " *" else ""), sizeI == i) { sizeI = i } }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  ASP.forEachIndexed { i, a -> Pill(a.first, asp == i) { asp = i } }
              }
              Tx("" + w + " x " + h + " px  -  about " + cap + " layers  -  " + mbs + " MB per layer", T.ink, sz = 10f)
              Tx(verdict, vc, sz = 11f)
              Tx("PAPER", T.ac, sz = 10f, head = true)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PAPERS.forEachIndexed { i, c ->
                      Box(Modifier.pop(i)) {
                          Bub(38f, paperI == i, anim = false, pad = .2f, f = { paperI = i }) {
                              drawCircle(Color(c))
                              if (c == 0x00FFFFFFL) {
                                  drawCircle(Color.White, size.minDimension / 2f, style = Stroke(2f))
                                  drawLine(Color(0xFFFF9AAE), Offset(size.width * .15f, size.height * .85f), Offset(size.width * .85f, size.height * .15f), 3f)
                              }
                          }
                      }
                  }
              }
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PAPER_PATS.forEachIndexed { i, pp -> Pill(pp.first, patI == i) { patI = i } }
              }
              Pill("START DRAWING", true, Ik.BR) { onStart(Cfg(w, h, PAPERS[paperI].toInt(), PAPER_PATS[patI].second, cap, TIERS[rec.coerceIn(0, 4)].budget)) }
          }

          @Composable
          fun Home(st: BenchState, onStart: (Cfg) -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var sheet by remember { mutableIntStateOf(0) }
              var lastS by remember { mutableIntStateOf(1) }
              var mood by remember { mutableIntStateOf(0) }
              var say by remember { mutableStateOf(SAYS[0]) }
              val res = st.res
              val ram = remember { (ramGb(ctx) * 1024f).toInt() }
              val fl = if (T.an > .01f) rememberInfiniteTransition(label = "fl2").animateFloat(0f, 1f, infiniteRepeatable(tween(4000, easing = LinearEasing)), label = "f").value else 0f
              fun rerun() {
                  for (i in 0 until 6) st.bars[i] = 0f
                  st.stage = 0; st.res = null; st.key++; st.running = true
              }
              SideEffect { if (sheet != 0) lastS = sheet }
              LaunchedEffect(Unit) { if (st.res == null && !st.running) rerun() }
              LaunchedEffect(st.running) {
                  if (st.running) {
                      mood = 2; say = "one moment, looking at your phone"
                      delay(15000)
                      if (st.running) { st.res = fallbackRes(ctx); st.running = false }
                  } else {
                      val r0 = st.res
                      if (r0 != null) { mood = 1; say = "all set - " + TIERS[r0.tier].name.lowercase() + " phone"; delay(2400); mood = 0 }
                  }
              }
              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  Floaters(Modifier.fillMaxSize())
                  if (st.running) key(st.key) {
                      AndroidView({ BenchView(ctx, st) { r -> st.res = r; st.running = false; saveBench(ctx, r) } }, Modifier.size(2.dp))
                  }
                  Column(
                      Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().verticalScroll(rememberScrollState()).padding(d(16f)),
                      horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(d(10f))
                  ) {
                      Spacer(Modifier.height(d(18f)))
                      Box(Modifier.pop(0)) { Tx("neko canvas", T.ac, head = true, sz = 24f) }
                      Box(Modifier.offset(y = (sin(fl * 6.2832f) * 3f).dp).pop(1)) {
                          Mascot(mood, 96f) {
                              say = SAYS[(System.currentTimeMillis() % SAYS.size).toInt()]; mood = 1
                              scope.launch { delay(1200); mood = if (st.running) 2 else 0 }
                          }
                      }
                      Tx(say, T.ink.copy(alpha = .8f), sz = 11f)
                      Row(Modifier.pop(2), horizontalArrangement = Arrangement.spacedBy(d(8f)), verticalAlignment = Alignment.CenterVertically) {
                          Pill("NEW CANVAS", sheet == 1, Ik.PL) { sheet = if (sheet == 1) 0 else 1 }
                          Pill("STYLE", sheet == 2, Ik.TH) { sheet = if (sheet == 2) 0 else 2 }
                      }
                      AnimatedVisibility(
                          visible = sheet != 0,
                          enter = fadeIn() + scaleIn(spring(.55f, 380f), initialScale = .92f, transformOrigin = TransformOrigin(if (lastS == 1) .3f else .7f, 0f)) + expandVertically(),
                          exit = fadeOut() + scaleOut(targetScale = .94f, transformOrigin = TransformOrigin(.5f, 0f)) + shrinkVertically()
                      ) {
                          Column(
                              Modifier.fillMaxWidth().clip(rs()).background(T.panel).animateContentSize().padding(d(12f)),
                              verticalArrangement = Arrangement.spacedBy(d(8f))
                          ) {
                              if (lastS == 1) NewCanvas(res, ram, onStart)
                              else ThemePanel { T.save(ctx.getSharedPreferences("t", 0)); sheet = 0 }
                          }
                      }
                      Box(Modifier.pop(3)) { BenchCard(st, ram) { rerun() } }
                      Spacer(Modifier.height(d(16f)))
                  }
              }
          }
          EOF_SRC
      - uses: actions/cache@v4
        with: {path: ~/ks, key: "ks-${{github.repository}}"}
      - env:
          B: ${{secrets.KS_B64}}
          P: ${{secrets.KS_PASS || 'ci-dev-key'}}
          A: ${{secrets.KS_ALIAS || 'k'}}
        run: |
          V=0.$(date -u +%y%m%d).$GITHUB_RUN_NUMBER
          gradle -q :app:assembleRelease -PversionCode=$((1000+GITHUB_RUN_NUMBER)) -PversionName=$V
          mkdir -p ~/ks dist; K=~/ks/k.jks
          [ -n "$B" ] && echo "$B"|base64 -d >$K
          [ -f $K ] || keytool -genkeypair -keystore $K -alias $A -keyalg RSA -keysize 3072 -validity 36500 -storepass "$P" -keypass "$P" -dname CN=$N
          T=$(ls -d $ANDROID_HOME/build-tools/*|sort -V|tail -1)
          $T/zipalign -fp 4 app/build/outputs/apk/release/*.apk a.apk
          $T/apksigner sign --ks $K --ks-key-alias $A --ks-pass env:P --key-pass env:P --out dist/$N-$V.apk a.apk
          echo "V=$V" >>$GITHUB_ENV
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{github.token}}"}
        run: |
          R=nightly F=-p; [ $GITHUB_REF_TYPE = tag ] && R=$GITHUB_REF_NAME F=
          [ $R = nightly ] && gh release delete nightly --cleanup-tag -y || true
          gh release create $R dist/* -t "$N $V" -n "build $GITHUB_RUN_NUMBER" --target $GITHUB_SHA $F
