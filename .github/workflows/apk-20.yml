          /** scribble here: the faint line is your raw finger, the bold line is what the stabilizer would draw */
          @Composable
          fun StabPad() {
              val raw = remember { mutableStateListOf<Offset>() }
              val out = remember { mutableStateListOf<Offset>() }
              val f = remember { StabFilter() }
              val ac = T.ac; val ink = T.ink
              Box(
                  Modifier.fillMaxWidth().height(d(130f)).clip(rs(.7f)).background(T.panel2)
                      .pointerInput(Unit) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              raw.clear(); out.clear()
                              f.start(down.position.x, down.position.y, down.uptimeMillis)
                              raw.add(down.position); out.add(down.position); down.consume()
                              while (true) {
                                  val ev = awaitPointerEvent()
                                  val c = ev.changes.firstOrNull { it.id == down.id } ?: break
                                  if (!c.pressed) break
                                  c.consume()
                                  f.feed(c.position.x, c.position.y, c.uptimeMillis, 1f, Stab.level, Stab.mode.toInt())
                                  raw.add(c.position); out.add(Offset(f.ox, f.oy))
                              }
                              if (Stab.catchUp) out.add(Offset(f.rx, f.ry))
                          }
                      }.drawBehind {
                          if (raw.size > 1) {
                              val a = Path(); a.moveTo(raw[0].x, raw[0].y); for (i in 1 until raw.size) a.lineTo(raw[i].x, raw[i].y)
                              drawPath(a, ink.copy(alpha = .35f), style = Stroke(2f))
                              val b = Path(); b.moveTo(out[0].x, out[0].y); for (i in 1 until out.size) b.lineTo(out[i].x, out[i].y)
                              drawPath(b, ac, style = Stroke(8f, cap = StrokeCap.Round))
                          }
                      },
                  contentAlignment = Alignment.Center
              ) { if (raw.isEmpty()) Tx("scribble here with your finger", T.ink.copy(alpha = .4f), sz = 9f) }
          }

