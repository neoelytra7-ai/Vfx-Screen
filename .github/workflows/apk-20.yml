          package dev.canvas

          import kotlin.math.ceil
          import kotlin.math.floor
          import kotlin.math.max
          import kotlin.math.min

          /**
           * Non-zero scanline polygon fill: 2 sub-scanlines per row + exact horizontal span coverage = smooth edges.
           * pts are canvas px (x,y pairs); sc scales them into the w*h mask (used for the low-res instant preview).
           */
          fun raster(pts: FloatArray, n: Int, sc: Float, w: Int, h: Int, out: ByteArray) {
              java.util.Arrays.fill(out, 0.toByte())
              if (n < 3) return
              var minY = Float.MAX_VALUE; var maxY = -Float.MAX_VALUE
              for (i in 0 until n) { val y = pts[2 * i + 1] * sc; if (y < minY) minY = y; if (y > maxY) maxY = y }
              val y0 = max(0, floor(minY).toInt()); val y1 = min(h - 1, ceil(maxY).toInt())
              val acc = FloatArray(w + 1)
              val xv = FloatArray(n); val dv = IntArray(n)
              for (y in y0..y1) {
                  java.util.Arrays.fill(acc, 0f)
                  for (sub in 0..1) {
                      val sy = y + .25f + .5f * sub
                      var c = 0
                      for (i in 0 until n) {
                          val j = if (i == n - 1) 0 else i + 1
                          val ax = pts[2 * i] * sc; val ay = pts[2 * i + 1] * sc; val bx = pts[2 * j] * sc; val by = pts[2 * j + 1] * sc
                          if ((ay <= sy && by > sy) || (by <= sy && ay > sy)) {
                              val t = (sy - ay) / (by - ay)
                              xv[c] = ax + t * (bx - ax); dv[c] = if (by > ay) 1 else -1; c++
                          }
                      }
                      if (c < 2) continue
                      for (a in 1 until c) {
                          val kx = xv[a]; val kd = dv[a]; var b = a - 1
                          while (b >= 0 && xv[b] > kx) { xv[b + 1] = xv[b]; dv[b + 1] = dv[b]; b-- }
                          xv[b + 1] = kx; dv[b + 1] = kd
                      }
                      var wind = 0
                      for (a in 0 until c - 1) { wind += dv[a]; if (wind != 0) addSpan(acc, xv[a], xv[a + 1], w) }
                  }
                  val row = y * w
                  for (x in 0 until w) { val v = acc[x] * .5f; if (v > 0f) out[row + x] = (min(1f, v) * 255f + .5f).toInt().toByte() }
              }
          }

          private fun addSpan(acc: FloatArray, xa: Float, xb: Float, w: Int) {
              val a = max(0f, xa); val b = min(w.toFloat(), xb)
              if (b <= a) return
              val ia = a.toInt(); val ib = b.toInt()
              if (ia == ib) { acc[ia] += b - a; return }
              acc[ia] += (ia + 1 - a)
              for (x in ia + 1 until ib) acc[x] += 1f
              acc[ib] += (b - ib)
          }

          /** mode 0 replace, 1 add, 2 subtract, 3 intersect */
          fun combineMask(dst: ByteArray, src: ByteArray, mode: Int) {
              for (i in dst.indices) {
                  val a = dst[i].toInt() and 255; val b = src[i].toInt() and 255
                  dst[i] = when (mode) {
                      1 -> max(a, b)
                      2 -> a * (255 - b) / 255
                      else -> min(a, b)
                  }.toByte()
              }
          }

          /** separable running-sum box blur (O(n), any radius) */
          fun boxBlur(a: ByteArray, w: Int, h: Int, r: Int) {
              if (r <= 0) return
              val tmp = ByteArray(a.size)
              val d = 2 * r + 1
              for (y in 0 until h) {
                  val row = y * w
                  var sum = 0
                  for (x in -r..r) sum += a[row + x.coerceIn(0, w - 1)].toInt() and 255
                  for (x in 0 until w) {
                      tmp[row + x] = (sum / d).toByte()
                      val xo = (x - r).coerceAtLeast(0); val xi = (x + r + 1).coerceAtMost(w - 1)
                      sum += (a[row + xi].toInt() and 255) - (a[row + xo].toInt() and 255)
                  }
              }
              for (x in 0 until w) {
                  var sum = 0
                  for (y in -r..r) sum += tmp[y.coerceIn(0, h - 1) * w + x].toInt() and 255
                  for (y in 0 until h) {
                      a[y * w + x] = (sum / d).toByte()
                      val yo = (y - r).coerceAtLeast(0); val yi = (y + r + 1).coerceAtMost(h - 1)
                      sum += (tmp[yi * w + x].toInt() and 255) - (tmp[yo * w + x].toInt() and 255)
                  }
              }
          }
