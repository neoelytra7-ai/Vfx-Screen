          package dev.canvas

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.pow

          /** Global stabilizer settings, shared by brush, eraser, lasso and liquify. */
          object Stab {
              var level by mutableFloatStateOf(.45f)
              var mode by mutableFloatStateOf(3f)        // 0 off  1 smooth  2 rope  3 both
              var catchUp by mutableStateOf(true)        // finish the stroke at the finger when you lift
              var onBrush by mutableStateOf(true)        // brush, smudge, blur, dodge, burn
              var onEraser by mutableStateOf(true)
              var onLasso by mutableStateOf(true)
              var onLiquify by mutableStateOf(true)
              var last by mutableFloatStateOf(.45f)      // level remembered by the quick on/off toggle
          }

          /**
           * Finger-friendly stabilizer. Stage 1: speed-adaptive low-pass (One-Euro style) removes tremor while keeping
           * fast flicks responsive. Stage 2: a lazy rope - the tip only moves once the finger pulls farther than the rope
           * length, which turns wobbly input into long clean curves. Lengths scale with zoom so it feels the same at any zoom.
           */
          class StabFilter {
              @JvmField var ox = 0f; @JvmField var oy = 0f     // stabilized tip
              @JvmField var rx = 0f; @JvmField var ry = 0f     // last raw finger position
              private var tx = 0f; private var ty = 0f; private var pt = 0L

              fun start(x: Float, y: Float, t: Long) { ox = x; oy = y; rx = x; ry = y; tx = x; ty = y; pt = t }

              /** unit = canvas px per screen px (1 when working in screen space) */
              fun feed(x: Float, y: Float, t: Long, unit: Float, level: Float, mode: Int) {
                  val dt = max(4L, t - pt) / 1000f; pt = t
                  if (mode == 1 || mode == 3) {
                      val sp = hypot(x - rx, y - ry) / dt / unit
                      val fc = 6f - 5.4f * level + .012f * sp
                      val a = 1f / (1f + 1f / (6.2832f * fc * dt))
                      tx += (x - tx) * a; ty += (y - ty) * a
                  } else { tx = x; ty = y }
                  rx = x; ry = y
                  if (mode == 2 || mode == 3) {
                      val rope = level.pow(1.2f) * 90f * unit
                      val ddx = tx - ox; val ddy = ty - oy; val dist = hypot(ddx, ddy)
                      if (dist > rope && dist > 0f) { val k = (dist - rope) / dist; ox += ddx * k; oy += ddy * k }
                  } else { ox = tx; oy = ty }
              }
          }
