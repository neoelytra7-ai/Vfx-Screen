# Single-file pipeline: this YAML contains the whole Android app (Kotlin) + build + sign + release.
# Edit the source blocks in the 'src' step and push: every push builds an updatable APK.
name: apk
on:
  push: {branches: [main], tags: ['v*']}
  workflow_dispatch:
concurrency: {group: "apk-${{github.ref}}", cancel-in-progress: true}
permissions: {contents: write}
env: {N: Canvas}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - name: src
        run: |
          cat > settings.gradle.kts <<'EOF_SRC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Canvas"
          include(":app")
          EOF_SRC
          cat > build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_SRC
          cat > gradle.properties <<'EOF_SRC'
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_SRC
          cat > .gitignore <<'EOF_SRC'
          build/
          .gradle/
          local.properties
          *.jks
          EOF_SRC
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "dev.canvas"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.canvas"; minSdk = 24; targetSdk = 35
                  versionCode = (findProperty("versionCode") as String?)?.toInt() ?: 1
                  versionName = findProperty("versionName") as String? ?: "dev"
              }
              buildTypes { release { isMinifyEnabled = true; isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt")) } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
          }
          EOF_SRC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <application android:label="Canvas" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/MainActivity.kt <<'EOF_SRC'
          package dev.canvas

          import android.app.ActivityManager
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  // canvas size adapts to device memory: low-end stays smooth, hi-end gets 2K
                  val mc = (getSystemService(ACTIVITY_SERVICE) as ActivityManager).memoryClass
                  val e = Engine(when { mc >= 256 -> 2048; mc >= 128 -> 1536; else -> 1024 })
                  setContent { App(e) }
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Engine.kt <<'EOF_SRC'
          package dev.canvas

          import android.opengl.GLES30 as G
          import android.opengl.GLSurfaceView
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.*

          enum class Tool { BRUSH, ERASER, LIQUIFY }

          class Brush(
              @JvmField var size: Float = 40f, @JvmField var opacity: Float = 1f,
              @JvmField var hardness: Float = .6f, @JvmField var spacing: Float = .1f,
              @JvmField var color: Int = -1,
          )

          class Layer(@JvmField val tex: Int, @JvmField val fbo: Int) {
              @JvmField var show = true
              @JvmField var alpha = 1f
          }

          private class P(val id: Int) {
              private val m = HashMap<String, Int>()
              fun u(n: String) = m.getOrPut(n) { G.glGetUniformLocation(id, n) }
          }

          // Fullscreen / stamp quad generated from gl_VertexID: zero vertex buffers.
          private const val VS = """#version 300 es
          uniform vec4 uR;out vec2 vP,vU;
          void main(){vec2 p=vec2(float(gl_VertexID&1),float(gl_VertexID>>1))*2.-1.;vP=p;vU=p*.5+.5;gl_Position=vec4(uR.xy+p*uR.zw,0,1);}"""

          // Soft round stamp, premultiplied alpha.
          private const val FS_B = """#version 300 es
          precision mediump float;in vec2 vP;uniform vec4 uC;uniform float uH;out vec4 o;
          void main(){float a=(1.-smoothstep(uH,1.,length(vP)))*uC.a;o=vec4(uC.rgb*a,a);}"""

          // Composite: layer sampled through the shared 16-bit displacement map (multilayer liquify).
          private const val FS_C = """#version 300 es
          precision highp float;in vec2 vU;uniform sampler2D uL,uD;uniform vec2 uSz;uniform float uA,uW,uRng;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          void main(){vec2 uv=vU;if(uW>0.)uv+=dec(texture(uD,uv))/uSz;o=texture(uL,uv)*uA;}"""

          // Liquify push, only rasterised inside the brush bounding box.
          private const val FS_L = """#version 300 es
          precision highp float;uniform sampler2D uD;uniform vec2 uSz,uC,uV;uniform float uRad,uS,uRng;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          vec4 enc(vec2 v){vec2 q=floor((clamp(v/uRng,-1.,1.)*.5+.5)*65535.+.5);vec2 h=floor(q/256.);vec2 l=q-h*256.;return vec4(h.x,l.x,h.y,l.y)/255.;}
          void main(){vec2 c=dec(texture(uD,gl_FragCoord.xy/uSz));float d=length(gl_FragCoord.xy-uC)/uRad;float f=max(1.-d*d,0.);f*=f;o=enc(c-uV*f*uS);}"""

          class Engine(@JvmField val W: Int, @JvmField val H: Int = W) : GLSurfaceView.Renderer {
              @JvmField var tool = Tool.BRUSH
              @JvmField val brush = Brush()
              @JvmField var liqRadius = 140f
              @JvmField var liqStrength = 1f
              @JvmField var cur = 0
              @Volatile var vw = 1
              @Volatile var vh = 1
              @Volatile var zoom = 1f
              @Volatile var px = 0f
              @Volatile var py = 0f

              private val layers = ArrayList<Layer>()
              private var warped = false
              private lateinit var pB: P
              private lateinit var pC: P
              private lateinit var pL: P
              private var dTex = 0; private var dFbo = 0; private var sTex = 0; private var sFbo = 0
              private val rng = 128f
              private var lx = 0f; private var ly = 0f; private var acc = 0f

              // ---- GL helpers ----
              private fun tex(f: Int): Int {
                  val t = IntArray(1); G.glGenTextures(1, t, 0); G.glBindTexture(G.GL_TEXTURE_2D, t[0])
                  G.glTexImage2D(G.GL_TEXTURE_2D, 0, G.GL_RGBA8, W, H, 0, G.GL_RGBA, G.GL_UNSIGNED_BYTE, null)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MIN_FILTER, f)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MAG_FILTER, f)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_S, G.GL_CLAMP_TO_EDGE)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_T, G.GL_CLAMP_TO_EDGE)
                  return t[0]
              }
              private fun fbo(t: Int): Int {
                  val f = IntArray(1); G.glGenFramebuffers(1, f, 0); G.glBindFramebuffer(G.GL_FRAMEBUFFER, f[0])
                  G.glFramebufferTexture2D(G.GL_FRAMEBUFFER, G.GL_COLOR_ATTACHMENT0, G.GL_TEXTURE_2D, t, 0)
                  return f[0]
              }
              private fun prog(fs: String): P {
                  fun sh(t: Int, s: String): Int {
                      val h = G.glCreateShader(t); G.glShaderSource(h, s); G.glCompileShader(h)
                      val ok = IntArray(1); G.glGetShaderiv(h, G.GL_COMPILE_STATUS, ok, 0)
                      if (ok[0] == 0) throw RuntimeException(G.glGetShaderInfoLog(h))
                      return h
                  }
                  val p = G.glCreateProgram()
                  G.glAttachShader(p, sh(G.GL_VERTEX_SHADER, VS)); G.glAttachShader(p, sh(G.GL_FRAGMENT_SHADER, fs))
                  G.glLinkProgram(p); return P(p)
              }
              private fun quad() = G.glDrawArrays(G.GL_TRIANGLE_STRIP, 0, 4)
              private fun clearMap() {
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, dFbo)
                  G.glClearColor(128 / 255f, 0f, 128 / 255f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
              }

              // ---- layers ----
              fun addLayer(fill: Boolean = false) {
                  if (layers.size >= 24) return
                  val t = tex(G.GL_LINEAR); val f = fbo(t)
                  if (fill) G.glClearColor(1f, 1f, 1f, 1f) else G.glClearColor(0f, 0f, 0f, 0f)
                  G.glClear(G.GL_COLOR_BUFFER_BIT)
                  layers += Layer(t, f); cur = layers.size - 1
              }

              // ---- view transform ----
              private fun sc() = min(vw.toFloat() / W, vh.toFloat() / H) * zoom
              private fun lf(s: Float) = (vw - W * s) / 2 + px
              private fun tp(s: Float) = (vh - H * s) / 2 + py
              fun cx(t: Float): Float { val s = sc(); return (t - lf(s)) / s }
              fun cy(t: Float): Float { val s = sc(); return H - (t - tp(s)) / s }
              fun zoomAt(mx: Float, my: Float, f: Float) {
                  val s0 = sc(); val a = (mx - lf(s0)) / s0; val b = (my - tp(s0)) / s0
                  zoom = (zoom * f).coerceIn(.1f, 32f); val s1 = sc()
                  px = mx - a * s1 - (vw - W * s1) / 2; py = my - b * s1 - (vh - H * s1) / 2
              }

              // ---- renderer ----
              override fun onSurfaceCreated(g: GL10?, c: EGLConfig?) {
                  val v = IntArray(1); G.glGenVertexArrays(1, v, 0); G.glBindVertexArray(v[0])
                  pB = prog(FS_B); pC = prog(FS_C); pL = prog(FS_L)
                  dTex = tex(G.GL_NEAREST); dFbo = fbo(dTex); sTex = tex(G.GL_NEAREST); sFbo = fbo(sTex)
                  clearMap(); layers.clear(); addLayer(true); addLayer(); warped = false
              }
              override fun onSurfaceChanged(g: GL10?, w: Int, h: Int) { vw = w; vh = h; zoom = 1f; px = 0f; py = 0f }

              private fun compUniforms(w: Float, a: Float) {
                  G.glUseProgram(pC.id); G.glUniform1i(pC.u("uL"), 0); G.glUniform1i(pC.u("uD"), 1)
                  G.glUniform2f(pC.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform1f(pC.u("uRng"), rng)
                  G.glUniform1f(pC.u("uW"), w); G.glUniform1f(pC.u("uA"), a); G.glUniform4f(pC.u("uR"), 0f, 0f, 1f, 1f)
                  G.glActiveTexture(G.GL_TEXTURE1); G.glBindTexture(G.GL_TEXTURE_2D, dTex); G.glActiveTexture(G.GL_TEXTURE0)
              }

              override fun onDrawFrame(g: GL10?) {
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, 0); G.glViewport(0, 0, vw, vh)
                  G.glClearColor(0f, 0f, 0f, 1f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  val s = sc()
                  G.glViewport(lf(s).roundToInt(), (vh - tp(s) - H * s).roundToInt(), (W * s).roundToInt(), (H * s).roundToInt())
                  compUniforms(if (warped) 1f else 0f, 1f)
                  G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                  for (l in layers) if (l.show) {
                      G.glBindTexture(G.GL_TEXTURE_2D, l.tex); G.glUniform1f(pC.u("uA"), l.alpha); quad()
                  }
                  G.glDisable(G.GL_BLEND)
              }

              // ---- strokes (called on GL thread; x,y in canvas pixels, y up) ----
              fun begin(x: Float, y: Float, p: Float) { lx = x; ly = y; acc = 0f; if (tool != Tool.LIQUIFY) stamp(x, y, p) }
              fun end() {}
              fun move(x: Float, y: Float, p: Float) {
                  val dx = x - lx; val dy = y - ly; val d = hypot(dx, dy)
                  if (d < .01f) return
                  if (tool == Tool.LIQUIFY) { push(x, y, dx, dy); lx = x; ly = y; return }
                  val st = max(1f, brush.size * brush.spacing); var t = st - acc
                  while (t <= d) { stamp(lx + dx * t / d, ly + dy * t / d, p); t += st }
                  acc = d - (t - st); lx = x; ly = y
              }

              private fun stamp(x: Float, y: Float, p: Float) {
                  val l = layers[cur]
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo); G.glViewport(0, 0, W, H); G.glUseProgram(pB.id)
                  val r = brush.size * (.3f + .7f * p.coerceIn(0f, 1f)) / 2f; val c = brush.color
                  G.glUniform4f(pB.u("uR"), x * 2f / W - 1f, y * 2f / H - 1f, 2f * r / W, 2f * r / H)
                  G.glUniform4f(pB.u("uC"), (c shr 16 and 255) / 255f, (c shr 8 and 255) / 255f, (c and 255) / 255f, brush.opacity)
                  G.glUniform1f(pB.u("uH"), min(brush.hardness, .98f))
                  G.glEnable(G.GL_BLEND)
                  if (tool == Tool.ERASER) G.glBlendFunc(G.GL_ZERO, G.GL_ONE_MINUS_SRC_ALPHA)
                  else G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                  quad(); G.glDisable(G.GL_BLEND)
              }

              private fun push(x: Float, y: Float, dx: Float, dy: Float) {
                  val r = liqRadius
                  val x0 = max(0, floor(x - r).toInt()); val x1 = min(W, ceil(x + r).toInt())
                  val y0 = max(0, floor(y - r).toInt()); val y1 = min(H, ceil(y + r).toInt())
                  if (x1 <= x0 || y1 <= y0) return
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H); G.glUseProgram(pL.id)
                  G.glActiveTexture(G.GL_TEXTURE0); G.glBindTexture(G.GL_TEXTURE_2D, dTex); G.glUniform1i(pL.u("uD"), 0)
                  G.glUniform4f(pL.u("uR"), (x0 + x1) / W.toFloat() - 1f, (y0 + y1) / H.toFloat() - 1f, (x1 - x0) / W.toFloat(), (y1 - y0) / H.toFloat())
                  G.glUniform2f(pL.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform2f(pL.u("uC"), x, y); G.glUniform2f(pL.u("uV"), dx, dy)
                  G.glUniform1f(pL.u("uRad"), r); G.glUniform1f(pL.u("uS"), liqStrength); G.glUniform1f(pL.u("uRng"), rng)
                  quad()
                  G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, x0, y0, x0, y0, x1 - x0, y1 - y0) // bbox-only write-back
                  warped = true
              }

              /** Resample every layer ONCE through the map (keeps detail sharp), then reset the map. */
              fun bake() {
                  if (!warped) return
                  compUniforms(1f, 1f); G.glDisable(G.GL_BLEND)
                  for (l in layers) {
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H)
                      G.glBindTexture(G.GL_TEXTURE_2D, l.tex); quad()
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, 0, 0, W, H)
                  }
                  clearMap(); warped = false
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/CanvasView.kt <<'EOF_SRC'
          package dev.canvas

          import android.content.Context
          import android.opengl.GLSurfaceView
          import android.view.MotionEvent
          import kotlin.math.hypot

          class CanvasView(c: Context, private val e: Engine) : GLSurfaceView(c) {
              private var draw = false
              private var pan = false
              private var mx = 0f; private var my = 0f; private var md = 1f

              init {
                  setEGLContextClientVersion(3)
                  setEGLConfigChooser(8, 8, 8, 0, 0, 0) // no depth/stencil/alpha: less memory
                  preserveEGLContextOnPause = true
                  setRenderer(e)
                  renderMode = RENDERMODE_WHEN_DIRTY    // zero idle GPU/battery cost
              }

              fun post(f: () -> Unit) { queueEvent(Runnable { f() }); requestRender() }

              private fun send(a: Int, x: Float, y: Float, p: Float) {
                  val cx = e.cx(x); val cy = e.cy(y)
                  queueEvent(Runnable { if (a == 0) e.begin(cx, cy, p) else e.move(cx, cy, p) })
              }

              private fun sync(t: MotionEvent) {
                  mx = (t.getX(0) + t.getX(1)) / 2; my = (t.getY(0) + t.getY(1)) / 2
                  md = hypot(t.getX(0) - t.getX(1), t.getY(0) - t.getY(1)).coerceAtLeast(1f)
              }

              override fun onTouchEvent(t: MotionEvent): Boolean {
                  when (t.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { draw = true; send(0, t.x, t.y, t.pressure) }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          if (draw) { draw = false; queueEvent(Runnable { e.end() }) }
                          pan = true; sync(t)
                      }
                      MotionEvent.ACTION_MOVE ->
                          if (pan && t.pointerCount > 1) {
                              val x = (t.getX(0) + t.getX(1)) / 2; val y = (t.getY(0) + t.getY(1)) / 2
                              val d = hypot(t.getX(0) - t.getX(1), t.getY(0) - t.getY(1)).coerceAtLeast(1f)
                              e.px += x - mx; e.py += y - my; e.zoomAt(x, y, d / md)
                              mx = x; my = y; md = d
                          } else if (draw) {
                              for (h in 0 until t.historySize) send(1, t.getHistoricalX(h), t.getHistoricalY(h), t.getHistoricalPressure(h))
                              send(1, t.x, t.y, t.pressure)
                          }
                      MotionEvent.ACTION_POINTER_UP -> if (t.pointerCount <= 2) pan = false
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          if (draw) queueEvent(Runnable { e.end() })
                          draw = false; pan = false
                      }
                  }
                  requestRender(); return true
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Ui.kt <<'EOF_SRC'
          package dev.canvas

          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectVerticalDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView

          /** Every UI token lives here: swap them at runtime (customisation hook for later iterations). */
          object T {
              var bg by mutableStateOf(Color.Black)
              var panel by mutableStateOf(Color(0xFF0D0D10))
              var ac by mutableStateOf(Color(0xFF00FFC8))
              var rad by mutableStateOf(12.dp)
          }

          @Composable
          fun Chip(s: String, on: Boolean = false, f: () -> Unit) =
              Text(s, color = if (on) Color.Black else T.ac, fontFamily = FontFamily.Monospace, fontSize = 11.sp,
                  modifier = Modifier.clip(RoundedCornerShape(T.rad)).background(if (on) T.ac else T.panel)
                      .clickable(onClick = f).padding(horizontal = 10.dp, vertical = 8.dp))

          /** Ibis-style vertical slider. */
          @Composable
          fun VS(init: Float, lo: Float, hi: Float, on: (Float) -> Unit) {
              var f by remember { mutableFloatStateOf(((init - lo) / (hi - lo)).coerceIn(0f, 1f)) }
              Box(
                  Modifier.width(26.dp).height(170.dp).clip(RoundedCornerShape(13.dp)).background(T.panel)
                      .pointerInput(Unit) {
                          detectVerticalDragGestures { c, _ ->
                              f = (1f - c.position.y / size.height).coerceIn(0f, 1f); on(lo + f * (hi - lo))
                          }
                      },
                  contentAlignment = Alignment.BottomCenter
              ) { Box(Modifier.fillMaxWidth().fillMaxHeight(f.coerceAtLeast(.02f)).background(T.ac.copy(alpha = .85f))) }
          }

          @Composable
          fun App(e: Engine) {
              val ctx = LocalContext.current
              val v = remember { CanvasView(ctx, e) }
              var tool by remember { mutableStateOf(Tool.BRUSH) }
              var li by remember { mutableIntStateOf(1) }
              var n by remember { mutableIntStateOf(2) }
              var ai by remember { mutableIntStateOf(0) }
              val cols = remember { listOf(0xFFFFFFFF, 0xFF000000, 0xFFFF3B5C, 0xFFFFB300, 0xFF00E676, 0xFF00B0FF, 0xFF7C4DFF, 0xFFFF4081).map { Color(it) } }
              val acs = remember { listOf(Color(0xFF00FFC8), Color(0xFFFF2E93), Color(0xFFFFD400), Color(0xFF7C4DFF)) }

              Box(Modifier.fillMaxSize().background(T.bg)) {
                  AndroidView({ v }, Modifier.fillMaxSize())
                  Row(Modifier.align(Alignment.CenterStart).padding(start = 10.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      VS(e.brush.size, 2f, 400f) { e.brush.size = it }
                      VS(e.brush.opacity, .02f, 1f) { e.brush.opacity = it }
                      VS(e.brush.hardness, 0f, 1f) { e.brush.hardness = it }
                      if (tool == Tool.LIQUIFY) VS(e.liqRadius, 20f, 400f) { e.liqRadius = it }
                  }
                  Column(
                      Modifier.align(Alignment.BottomCenter).navigationBarsPadding().padding(8.dp),
                      verticalArrangement = Arrangement.spacedBy(6.dp), horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          cols.forEach { c -> Box(Modifier.size(26.dp).clip(CircleShape).background(c).clickable { e.brush.color = c.toArgb() }) }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Tool.values().forEach { t -> Chip(t.name, tool == t) { tool = t; e.tool = t } }
                          Chip("<") { li = (li - 1 + n) % n; val i = li; v.post { e.cur = i } }
                          Chip("L$li") {}
                          Chip(">") { li = (li + 1) % n; val i = li; v.post { e.cur = i } }
                          Chip("+") { if (n < 24) { li = n; n++; v.post { e.addLayer() } } }
                          if (tool == Tool.LIQUIFY) Chip("APPLY") { v.post { e.bake() } }
                          Chip("*") { ai = (ai + 1) % acs.size; T.ac = acs[ai] }
                      }
                  }
              }
          }
          EOF_SRC
      - uses: actions/cache@v4
        with: {path: ~/ks, key: "ks-${{github.repository}}"}
      - env:
          B: ${{secrets.KS_B64}}
          P: ${{secrets.KS_PASS || 'ci-dev-key'}}
          A: ${{secrets.KS_ALIAS || 'k'}}
        run: |
          V=0.$(date -u +%y%m%d).$GITHUB_RUN_NUMBER
          gradle -q :app:assembleRelease -PversionCode=$((1000+GITHUB_RUN_NUMBER)) -PversionName=$V
          mkdir -p ~/ks dist; K=~/ks/k.jks
          [ -n "$B" ] && echo "$B"|base64 -d >$K
          [ -f $K ] || keytool -genkeypair -keystore $K -alias $A -keyalg RSA -keysize 3072 -validity 36500 -storepass "$P" -keypass "$P" -dname CN=$N
          T=$(ls -d $ANDROID_HOME/build-tools/*|sort -V|tail -1)
          $T/zipalign -fp 4 app/build/outputs/apk/release/*.apk a.apk
          $T/apksigner sign --ks $K --ks-key-alias $A --ks-pass env:P --key-pass env:P --out dist/$N-$V.apk a.apk
          echo "V=$V" >>$GITHUB_ENV
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{github.token}}"}
        run: |
          R=nightly F=-p; [ $GITHUB_REF_TYPE = tag ] && R=$GITHUB_REF_NAME F=
          [ $R = nightly ] && gh release delete nightly --cleanup-tag -y || true
          gh release create $R dist/* -t "$N $V" -n "build $GITHUB_RUN_NUMBER" --target $GITHUB_SHA $F
