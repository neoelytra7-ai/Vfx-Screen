          // ───────────────────────── procedural icons (no assets, drawn + animated in code) ─────────────────────────
          enum class Ik { BR, ER, SM, BL, DG, BN, LQ, FL, GR, LN, RC, OV, PK, MV, UN, RE, LY, CO, BS, MN, SV, SY, EY, EN, PL, MI, DP, TR, UP, DN, MG, CX, CV, OK, TH }

          /** ph = animation phase 0..1 (looping while active, one-shot on tap). */
          fun DrawScope.ic(k: Ik, c: Color, c2: Color, ph: Float) {
              val u = size.minDimension / 24f
              val sw = 2.1f * u
              val tau = 6.2832f
              val w = sin(ph * tau)
              val st = Stroke(sw, cap = StrokeCap.Round, join = StrokeJoin.Round)
              fun o(x: Float, y: Float) = Offset(x * u, y * u)
              fun l(a: Float, b: Float, x: Float, y: Float, col: Color = c) = drawLine(col, o(a, b), o(x, y), sw, StrokeCap.Round)
              fun dot(x: Float, y: Float, r: Float, col: Color = c2) = drawCircle(col, r * u, o(x, y))
              fun ring(x: Float, y: Float, r: Float, col: Color = c) = drawCircle(col, r * u, o(x, y), style = st)
              fun poly(vararg p: Float, close: Boolean = true, fill: Color? = null) {
                  val pa = Path(); pa.moveTo(p[0] * u, p[1] * u)
                  var i = 2
                  while (i < p.size) { pa.lineTo(p[i] * u, p[i + 1] * u); i += 2 }
                  if (close) pa.close()
                  if (fill != null) drawPath(pa, fill)
                  drawPath(pa, c, style = st)
              }
              when (k) {
                  Ik.BR -> { l(19f, 5f, 10f, 14f); dot(8f, 16f + w * .6f, 3.6f); dot(19f, 19f, 1.2f + w * .3f) }
                  Ik.ER -> { poly(5f, 15f, 13f, 6f, 19f, 11f, 12f, 20f, fill = c2.copy(alpha = .35f)); l(9f, 11f, 15f, 16f, c2); dot(4f + (w + 1f) * 2f, 5f, 1f) }
                  Ik.SM -> {
                      val pa = Path(); pa.moveTo(3f * u, 17f * u); pa.cubicTo(8f * u, 6f * u, 14f * u, 22f * u, 21f * u, 9f * u)
                      drawPath(pa, c, style = st); dot(8f + w * 2f, 14f, 3f)
                  }
                  Ik.BL -> { dot(12f, 12f, 3.2f); ring(12f, 12f, 6.5f + w * .7f); ring(12f, 12f, 10f + w * .5f, c.copy(alpha = .45f)) }
                  Ik.DG -> {
                      dot(12f, 12f, 4f)
                      for (i in 0..7) { val a = (i * 45f + ph * 45f) * 0.01745f; l(12f + cos(a) * 7f, 12f + sin(a) * 7f, 12f + cos(a) * 10f, 12f + sin(a) * 10f) }
                  }
                  Ik.BN -> {
                      poly(12f, 3f + w * .5f, 18f, 11f, 17f, 18f, 12f, 21f, 7f, 18f, 6f, 11f, fill = c2.copy(alpha = .5f))
                      poly(12f, 12f, 14f, 16f, 12f, 19f, 10f, 16f, fill = c2)
                  }
                  Ik.LQ -> for (j in 0..1) {
                      val pa = Path()
                      for (i in 0..16) {
                          val x = 3f + i * 1.125f
                          val y = (if (j == 0) 9f else 15f) + 2.6f * sin((i / 16f + ph * (if (j == 0) 1f else -1f)) * tau)
                          if (i == 0) pa.moveTo(x * u, y * u) else pa.lineTo(x * u, y * u)
                      }
                      drawPath(pa, if (j == 0) c else c2, style = st)
                  }
                  Ik.FL -> { poly(4f, 12f, 11f, 5f, 18f, 12f, 11f, 19f, fill = c2.copy(alpha = .4f)); l(4f, 12f, 18f, 12f); dot(20f, 17f + w * .8f, 2.2f) }
                  Ik.GR -> for (i in 0..4) drawRect(c.copy(alpha = ((i + 1) / 5f) * (.75f + .25f * sin((ph + i / 5f) * tau))), o(4f + i * 3.2f, 5f), Size(2.6f * u, 14f * u))
                  Ik.LN -> { l(5f, 19f, 19f, 5f); ring(5f, 19f, 2f); ring(19f, 5f, 2f); dot(5f + 14f * ph, 19f - 14f * ph, 1.5f) }
                  Ik.RC -> { drawRoundRect(c, o(5f, 6f), Size(14f * u, 12f * u), CornerRadius(2.5f * u), style = st); dot(5f, 6f, 1.5f); dot(19f, 18f, 1.5f) }
                  Ik.OV -> { drawOval(c, o(4f, 6f), Size(16f * u, 12f * u), style = st); dot(12f, 12f, 1.5f + w * .4f) }
                  Ik.PK -> { l(6f, 18f, 15f, 9f); dot(17f, 7f, 3.2f); dot(5f, 19f, 1.3f + w * .4f, c) }
                  Ik.MV -> {
                      val g = 2.5f + w * .5f
                      l(12f, 3f, 12f, 21f); l(3f, 12f, 21f, 12f)
                      l(12f, 3f, 12f - g, 3f + g); l(12f, 3f, 12f + g, 3f + g); l(12f, 21f, 12f - g, 21f - g); l(12f, 21f, 12f + g, 21f - g)
                      l(3f, 12f, 3f + g, 12f - g); l(3f, 12f, 3f + g, 12f + g); l(21f, 12f, 21f - g, 12f - g); l(21f, 12f, 21f - g, 12f + g)
                  }
                  Ik.UN -> rotate(-w * 20f, o(12f, 12f)) {
                      val pa = Path(); pa.moveTo(19f * u, 19f * u); pa.cubicTo(19f * u, 11f * u, 14f * u, 9f * u, 6f * u, 9f * u)
                      drawPath(pa, c, style = st); l(6f, 9f, 10f, 5f); l(6f, 9f, 10f, 13f)
                  }
                  Ik.RE -> scale(-1f, 1f, o(12f, 12f)) { ic(Ik.UN, c, c2, ph) }
                  Ik.LY -> for (i in 0..2) {
                      val cy = 7f + i * 5f * (1f + .15f * w)
                      poly(12f, cy - 3.5f, 20f, cy, 12f, cy + 3.5f, 4f, cy, fill = if (i == 2) c2.copy(alpha = .5f) else null)
                  }
                  Ik.CO -> {
                      ring(12f, 12f, 9f)
                      val cs = listOf(c, c2, Color.White)
                      for (i in 0..2) { val a = (i * 120f + ph * 120f) * 0.01745f; dot(12f + cos(a) * 4.5f, 12f + sin(a) * 4.5f, 1.8f, cs[i]) }
                  }
                  Ik.BS -> for (i in 0..2) { val y = 6f + i * 6f; l(4f, y, 20f, y, c.copy(alpha = .5f)); dot(8f + i * 4f + w * 2f, y, 2.4f) }
                  Ik.MN -> for (i in 0..2) dot(6f + i * 6f, 12f + sin((ph + i * .2f) * tau) * 2.5f, 1.9f, c)
                  Ik.SV -> { l(12f, 4f + w * .8f, 12f, 15f); l(12f, 15f, 8f, 11f); l(12f, 15f, 16f, 11f); poly(5f, 16f, 5f, 20f, 19f, 20f, 19f, 16f, close = false) }
                  Ik.SY -> {
                      for (i in 0..4) l(12f, 3f + i * 4.5f, 12f, 5f + i * 4.5f)
                      poly(4f, 8f + w * .5f, 9f, 12f, 4f, 16f - w * .5f, fill = c2.copy(alpha = .4f))
                      poly(20f, 8f + w * .5f, 15f, 12f, 20f, 16f - w * .5f, fill = c2.copy(alpha = .4f))
                  }
                  Ik.EY -> { drawOval(c, o(3f, 7f), Size(18f * u, 10f * u), style = st); dot(12f, 12f, 3f + w * .3f) }
                  Ik.EN -> { drawOval(c.copy(alpha = .5f), o(3f, 7f), Size(18f * u, 10f * u), style = st); l(4f, 20f, 20f, 4f) }
                  Ik.PL -> { l(12f, 5f, 12f, 19f); l(5f, 12f, 19f, 12f) }
                  Ik.MI -> l(5f, 12f, 19f, 12f)
                  Ik.DP -> {
                      drawRoundRect(c, o(8f, 8f), Size(12f * u, 12f * u), CornerRadius(3f * u), style = st)
                      drawRoundRect(c2, o(4f, 4f), Size(12f * u, 12f * u), CornerRadius(3f * u), style = st)
                  }
                  Ik.TR -> {
                      val lift = (w + 1f) * .8f
                      poly(7f, 9f, 8f, 20f, 16f, 20f, 17f, 9f, close = false); l(5f, 7f - lift, 19f, 7f - lift); l(10f, 4f - lift, 14f, 4f - lift)
                  }
                  Ik.UP -> { l(12f, 19f, 12f, 5f); l(12f, 5f, 6f, 11f); l(12f, 5f, 18f, 11f) }
                  Ik.DN -> { l(12f, 5f, 12f, 19f); l(12f, 19f, 6f, 13f); l(12f, 19f, 18f, 13f) }
                  Ik.MG -> { l(12f, 3f, 12f, 14f); l(12f, 14f, 7f, 9f); l(12f, 14f, 17f, 9f); l(5f, 19f, 19f, 19f) }
                  Ik.CX -> rotate(ph * 90f, o(12f, 12f)) {
                      poly(12f, 3f, 14f, 10f, 21f, 12f, 14f, 14f, 12f, 21f, 10f, 14f, 3f, 12f, 10f, 10f, fill = c2.copy(alpha = .5f))
                  }
                  Ik.CV -> rotate(ph * 180f, o(12f, 12f)) { l(7f, 10f, 12f, 15f); l(12f, 15f, 17f, 10f) }
                  Ik.OK -> { l(5f, 12f, 10f, 17f); l(10f, 17f, 19f, 7f) }
                  Ik.TH -> {
                      for (i in 0..5) { val a = (i * 60f + ph * 60f) * 0.01745f; dot(12f + cos(a) * 5.5f, 12f + sin(a) * 5.5f, 3.2f, if (i % 2 == 0) c else c2) }
                      dot(12f, 12f, 2.6f, Color.White)
                  }
                  else -> {}
              }
          }

          // ───────────────────────── cute building blocks ─────────────────────────
          @Composable
          fun Tx(s: String, c: Color = T.ink, mod: Modifier = Modifier, sz: Float = T.fs) =
              Text(s, modifier = mod, color = c, fontSize = sz.sp, fontFamily = CF, maxLines = 1)

          @Composable
          fun Modifier.touch(f: (Float, Float) -> Unit): Modifier {
              val u by rememberUpdatedState(f)
              return pointerInput(Unit) {
                  awaitPointerEventScope {
                      while (true) {
                          val c = awaitPointerEvent().changes[0]
                          if (c.pressed) {
                              u((c.position.x / size.width).coerceIn(0f, 1f), (c.position.y / size.height).coerceIn(0f, 1f))
                              c.consume()
                          }
                      }
                  }
              }
          }

          /** Squishy bubble: spring squish + tilt on press, expanding ring + sparkles on tap, looping phase while [anim]. */
          @Composable
          fun Bub(sz: Float, on: Boolean, en: Boolean = true, anim: Boolean = on, pad: Float = .42f, f: () -> Unit, draw: DrawScope.(Float) -> Unit) {
              val src = remember { MutableInteractionSource() }
              val pr by src.collectIsPressedAsState()
              val sq by animateFloatAsState(if (pr) .82f else 1f, spring(.35f, 600f), label = "sq")
              val tl by animateFloatAsState(if (pr) -7f else 0f, spring(.35f, 400f), label = "tl")
              val pop = remember { Animatable(0f) }
              val scope = rememberCoroutineScope()
              val ph = if (anim && T.an > .01f)
                  rememberInfiniteTransition(label = "ph").animateFloat(0f, 1f, infiniteRepeatable(tween(1800, easing = LinearEasing)), label = "p").value
              else pop.value
              val ac = T.ac; val ac2 = T.ac2; val bgc = if (on) T.ac else T.panel2
              Canvas(
                  Modifier.size(d(sz)).graphicsLayer { scaleX = sq; scaleY = sq; rotationZ = tl; alpha = if (en) 1f else .3f }
                      .clickable(interactionSource = src, indication = null, enabled = en) {
                          scope.launch { pop.snapTo(0f); pop.animateTo(1f, tween(450)) }; f()
                      }
              ) {
                  val r = size.minDimension / 2f
                  drawCircle(Color.Black.copy(alpha = .3f), r * .92f, Offset(r, r + r * .07f))
                  drawCircle(bgc, r * .92f, Offset(r, r))
                  drawCircle(Color.White.copy(alpha = if (on) .38f else .12f), r * .16f, Offset(r * .62f, r * .5f))
                  val pv = pop.value
                  if (pv > 0f && pv < 1f) {
                      drawCircle(ac2.copy(alpha = (1f - pv) * .8f), r * (.95f + .55f * pv), Offset(r, r), style = Stroke(2.5f))
                      for (i in 0..5) {
                          val a = i * 1.0472f + .4f; val rr = r * (1f + .5f * pv)
                          drawCircle(ac.copy(alpha = 1f - pv), 2.4f, Offset(r + cos(a) * rr, r + sin(a) * rr))
                      }
                  }
                  inset(r * pad) { draw(ph) }
              }
          }

          @Composable
          fun IB(k: Ik, on: Boolean = false, en: Boolean = true, sz: Float = 44f, anim: Boolean = on, f: () -> Unit) {
              val ac2 = T.ac2
              Bub(sz, on, en, anim, .42f, f) { ph -> ic(k, if (on) T.dk else T.ink, if (on) Color.White else ac2, ph) }
          }

          @Composable
          fun Pill(s: String, on: Boolean = false, k: Ik? = null, ph: Float = 0f, f: () -> Unit) {
              val src = remember { MutableInteractionSource() }
              val pr by src.collectIsPressedAsState()
              val sq by animateFloatAsState(if (pr) .9f else 1f, spring(.4f, 500f), label = "pl")
              val fg = if (on) T.dk else T.ink
              val ac2 = T.ac2
              Row(
                  Modifier.graphicsLayer { scaleX = sq; scaleY = sq }.clip(RoundedCornerShape(50)).background(if (on) T.ac else T.panel2)
                      .clickable(interactionSource = src, indication = null, onClick = f).padding(horizontal = d(11f), vertical = d(7f)),
                  verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))
              ) {
                  if (k != null) Canvas(Modifier.size(d(16f))) { ic(k, fg, ac2, ph) }
                  Tx(s, fg)
              }
          }

          /** Slider whose knob is a little face. */
          @Composable
          fun CS(t: Float, mod: Modifier = Modifier, on: (Float) -> Unit) {
              val ac = T.ac; val ac2 = T.ac2; val tr = T.panel2
              Box(
                  Modifier.then(mod).height(d(28f)).drawBehind {
                      val h = size.height; val r = h / 2f
                      val x = r + (size.width - 2f * r) * t.coerceIn(0f, 1f)
                      val cr = CornerRadius(h * .25f)
                      drawRoundRect(tr, Offset(0f, h * .25f), Size(size.width, h * .5f), cr)
                      drawRoundRect(Brush.horizontalGradient(listOf(ac2, ac), 0f, x.coerceAtLeast(1f)), Offset(0f, h * .25f), Size(x, h * .5f), cr)
                      drawCircle(Color.White, r * .92f, Offset(x, r))
                      drawCircle(T.dk, r * .09f, Offset(x - r * .28f, r * .86f)); drawCircle(T.dk, r * .09f, Offset(x + r * .28f, r * .86f))
                      drawArc(T.dk, 20f, 140f, false, Offset(x - r * .2f, r * .92f), Size(r * .4f, r * .26f), style = Stroke(r * .08f, cap = StrokeCap.Round))
                      drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x - r * .52f, r * 1.08f)); drawCircle(ac2.copy(alpha = .6f), r * .12f, Offset(x + r * .52f, r * 1.08f))
                  }.touch { xx, _ -> on(xx) }
              )
          }

          @Composable
          fun R2(p: PP) {
              val rv = U.rev
              val v = p.g()
              val t = if (p.log) ln(v / p.lo) / ln(p.hi / p.lo) else (v - p.lo) / (p.hi - p.lo)
              fun set(x: Float) { p.s(x.coerceIn(p.lo, p.hi)); U.bump() }
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(5f))) {
                  Tx(p.n, T.ink.copy(alpha = .8f), Modifier.width(d(64f)), 10f)
                  IB(Ik.MI, sz = 30f) { set(v - p.st) }
                  CS(t, Modifier.weight(1f)) { x -> set(if (p.log) p.lo * (p.hi / p.lo).pow(x) else p.lo + x * (p.hi - p.lo)) }
                  IB(Ik.PL, sz = 30f) { set(v + p.st) }
                  Tx("%.2f".format(v), mod = Modifier.width(d(48f)))
              }
          }

          // ───────────────────────── mascot "Mochi": menu button + mood display ─────────────────────────
          @Composable
          fun Mascot(mood: Int, sz: Float, f: () -> Unit) {
              val src = remember { MutableInteractionSource() }
              val pr by src.collectIsPressedAsState()
              val sq by animateFloatAsState(if (pr) .85f else 1f, spring(.3f, 500f), label = "ms")
              var blink by remember { mutableStateOf(false) }
              val anim = T.an > .01f
              LaunchedEffect(anim) { if (anim) while (true) { delay((2200L..4600L).random()); blink = true; delay(130); blink = false } }
              val br = if (anim) rememberInfiniteTransition(label = "br").animateFloat(0f, 1f, infiniteRepeatable(tween(2200), RepeatMode.Reverse), label = "b").value else 0f
              val ac = T.ac; val ac2 = T.ac2; val dk = T.dk
              Canvas(
                  Modifier.size(d(sz)).graphicsLayer { scaleX = sq * (1f + .035f * br); scaleY = sq * (1f - .035f * br) }
                      .clickable(interactionSource = src, indication = null, onClick = f)
              ) {
                  val s = size.minDimension
                  val sk = Stroke(s * .035f, cap = StrokeCap.Round)
                  drawCircle(ac, s * .13f, Offset(s * .24f, s * .2f)); drawCircle(ac, s * .13f, Offset(s * .76f, s * .2f))
                  drawCircle(ac2.copy(alpha = .7f), s * .06f, Offset(s * .24f, s * .2f)); drawCircle(ac2.copy(alpha = .7f), s * .06f, Offset(s * .76f, s * .2f))
                  drawOval(ac, Offset(s * .04f, s * .16f), Size(s * .92f, s * .8f))
                  drawOval(Color.White.copy(alpha = .28f), Offset(s * .16f, s * .24f), Size(s * .3f, s * .14f))
                  drawCircle(ac2.copy(alpha = .6f), s * .075f, Offset(s * .22f, s * .68f)); drawCircle(ac2.copy(alpha = .6f), s * .075f, Offset(s * .78f, s * .68f))
                  val ey = s * .52f
                  for (side in 0..1) {
                      val cx = if (side == 0) s * .33f else s * .67f
                      val dir = if (side == 0) 1f else -1f
                      if (blink || mood == 5) drawArc(dk, 20f, 140f, false, Offset(cx - s * .06f, ey - s * .02f), Size(s * .12f, s * .08f), style = sk)
                      else when (mood) {
                          1 -> drawArc(dk, 200f, 140f, false, Offset(cx - s * .07f, ey - s * .02f), Size(s * .14f, s * .1f), style = sk)
                          3 -> {
                              val hc = Color(0xFFFF4F7A); val r = s * .07f
                              drawCircle(hc, r * .55f, Offset(cx - r * .5f, ey - r * .2f)); drawCircle(hc, r * .55f, Offset(cx + r * .5f, ey - r * .2f))
                              val pa = Path(); pa.moveTo(cx - r * 1.02f, ey); pa.lineTo(cx, ey + r); pa.lineTo(cx + r * 1.02f, ey); pa.close(); drawPath(pa, hc)
                          }
                          4 -> {
                              drawLine(dk, Offset(cx - dir * s * .05f, ey - s * .05f), Offset(cx + dir * s * .04f, ey), s * .035f, StrokeCap.Round)
                              drawLine(dk, Offset(cx + dir * s * .04f, ey), Offset(cx - dir * s * .05f, ey + s * .05f), s * .035f, StrokeCap.Round)
                          }
                          else -> {
                              drawCircle(dk, s * (if (mood == 2) .045f else .06f), Offset(cx, ey))
                              drawCircle(Color.White, s * .018f, Offset(cx - s * .018f, ey - s * .02f))
                          }
                      }
                  }
                  val mx = s * .5f; val my = s * .64f
                  when (mood) {
                      1, 3 -> { drawArc(dk, 0f, 180f, true, Offset(mx - s * .09f, my - s * .05f), Size(s * .18f, s * .14f)); drawCircle(ac2, s * .03f, Offset(mx, my + s * .06f)) }
                      2, 5 -> drawCircle(dk, s * .028f, Offset(mx, my + s * .02f))
                      4 -> drawLine(dk, Offset(mx - s * .05f, my + s * .02f), Offset(mx + s * .05f, my + s * .02f), s * .03f, StrokeCap.Round)
                      else -> drawArc(dk, 20f, 140f, false, Offset(mx - s * .07f, my - s * .03f), Size(s * .14f, s * .09f), style = sk)
                  }
                  if (mood == 5) {
                      val z = s * (.78f + .03f * br)
                      drawLine(dk, Offset(z, s * .1f), Offset(z + s * .1f, s * .1f), s * .03f, StrokeCap.Round)
                      drawLine(dk, Offset(z + s * .1f, s * .1f), Offset(z, s * .2f), s * .03f, StrokeCap.Round)
                      drawLine(dk, Offset(z, s * .2f), Offset(z + s * .1f, s * .2f), s * .03f, StrokeCap.Round)
                  }
              }
          }

          // ───────────────────────── panels ─────────────────────────
          @Composable
          fun ToolsPanel(cur: Tool, pick: (Tool) -> Unit) {
              Tool.values().toList().chunked(5).forEach { row ->
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      row.forEach { t ->
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              IB(Ik.valueOf(t.code), t == cur, sz = 46f) { pick(t) }
                              Tx(TN[t.ordinal], if (t == cur) T.ac else T.ink.copy(alpha = .7f), sz = 9f)
                          }
                      }
                  }
              }
          }

          @Composable
          fun BrushPanel(e: Engine) {
              val rv = U.rev
              var more by remember { mutableStateOf(false) }
              val ps = penParams(e)
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  PRESETS.forEach { (n, vals) -> Pill(n) { e.pen.load(vals); U.bump() } }
              }
              R2(ps[0]); R2(ps[1])
              val pg by animateFloatAsState(if (more) 1f else 0f, spring(.6f, 300f), label = "more")
              Pill(if (more) "LESS" else "MORE", more, Ik.CV, pg) { more = !more }
              if (more) {
                  Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                      Pill("FOLLOW", e.pen.follow) { e.pen.follow = !e.pen.follow; U.bump() }
                      SYM.forEachIndexed { i, s -> Pill(s, e.symMode == i) { e.symMode = i; U.bump() } }
                  }
                  ps.drop(2).forEach { R2(it) }
              }
          }

          @Composable
          fun ColorPanel(e: Engine, feel: (Int, String) -> Unit) {
              val rv = U.rev
              val hc = Color(android.graphics.Color.HSVToColor(floatArrayOf(U.hh, 1f, 1f)))
              fun ap() { val c = U.col(); if (U.tgt == 0) e.pen.color = c else e.pen.color2 = c; U.bump() }
              Row(horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  Pill("FG", U.tgt == 0) { U.tgt = 0; U.from(e.pen.color) }
                  Pill("BG", U.tgt == 1) { U.tgt = 1; U.from(e.pen.color2) }
                  Pill("SWAP", false, Ik.SY) {
                      val t = e.pen.color; e.pen.color = e.pen.color2; e.pen.color2 = t
                      U.from(if (U.tgt == 0) e.pen.color else e.pen.color2); U.bump()
                  }
                  Tx("#%06X".format(U.col() and 0xFFFFFF))
              }
              Box(
                  Modifier.fillMaxWidth().height(d(150f)).clip(rs(.8f)).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.White, hc)))
                      drawRect(Brush.verticalGradient(listOf(Color.Transparent, Color.Black)))
                      drawCircle(Color.White, radius = 10f, center = Offset(U.ss * size.width, (1f - U.bb) * size.height), style = Stroke(3.5f))
                  }.touch { x, y -> U.ss = x; U.bb = 1f - y; ap() }
              )
              Box(
                  Modifier.fillMaxWidth().height(d(26f)).clip(RoundedCornerShape(50)).drawBehind {
                      drawRect(Brush.horizontalGradient(listOf(Color.Red, Color.Yellow, Color.Green, Color.Cyan, Color.Blue, Color.Magenta, Color.Red)))
                      drawCircle(Color.White, size.height / 2f - 2f, Offset(U.hh / 360f * size.width, size.height / 2f), style = Stroke(4f))
                  }.touch { x, _ -> U.hh = x * 360f; ap() }
              )
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(4f))) {
                  PASTEL.forEach { c ->
                      Bub(36f, false, anim = false, pad = .26f, f = { U.from(Color(c).toArgb()); ap(); feel(1, "pretty!") }) {
                          drawCircle(Color(c), size.minDimension / 2f)
                      }
                  }
              }
          }

          @Composable
          fun LayerPanel(e: Engine, v: CanvasView, feel: (Int, String) -> Unit) {
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(6f))) {
                  IB(Ik.PL, sz = 40f) { v.gl { e.addLayer() }; feel(1, "new layer!") }
                  IB(Ik.DP, sz = 40f) { v.gl { e.dupLayer() } }
                  IB(Ik.TR, sz = 40f) { v.gl { e.delLayer() }; feel(4, "bye layer") }
                  IB(Ik.UP, sz = 40f) { v.gl { e.moveLayer(1) } }
                  IB(Ik.DN, sz = 40f) { v.gl { e.moveLayer(-1) } }
                  IB(Ik.MG, sz = 40f) { v.gl { e.mergeDown() } }
                  IB(Ik.CX, sz = 40f) { v.gl { e.clearLayer() }; feel(1, "squeaky clean") }
              }
              e.info.indices.reversed().forEach { i ->
                  val l = e.info[i]
                  Row(
                      Modifier.fillMaxWidth().clip(rs(.6f)).background(if (i == e.curUi) T.ac.copy(alpha = .16f) else Color.Transparent)
                          .clickable { v.gl { e.select(i) } }.padding(d(3f)),
                      verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(d(6f))
                  ) {
                      Tx("L" + (i + 1), if (i == e.curUi) T.ac else T.ink, Modifier.width(d(28f)))
                      IB(if (l.show) Ik.EY else Ik.EN, l.show, sz = 34f, anim = false) { v.gl { e.setShow(i, !l.show) } }
                      Pill(BL[l.blend]) { v.gl { e.setBlend(i, (l.blend + 1) % 4) } }
                      CS(l.alpha, Modifier.weight(1f)) { x -> v.gl { e.setAlpha(i, x) } }
                  }
              }
          }

          @Composable
          fun MenuPanel(e: Engine, sym: () -> Unit, save: () -> Unit, theme: () -> Unit, hide: () -> Unit) {
              val rv = U.rev
              Row(Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                  Pill("SYM " + SYM[e.symMode], e.symMode != 0, Ik.SY) { sym() }
                  Pill("SAVE", false, Ik.SV) { save() }
                  Pill("THEME", false, Ik.TH) { theme() }
                  Pill("HIDE", false, Ik.CV) { hide() }
              }
          }

          @Composable
          fun ThemePanel(done: () -> Unit) {
              val rv = U.rev
              Row(horizontalArrangement = Arrangement.spacedBy(d(6f)), verticalAlignment = Alignment.CenterVertically) {
                  THEMES.forEach { (_, vals) ->
                      Bub(38f, false, anim = false, pad = .24f, f = { T.ah = vals[0]; T.sat = vals[1]; T.av = vals[2]; T.sh = vals[3]; U.bump() }) {
                          drawCircle(T.hsv(vals[0], vals[1], vals[2]), size.minDimension / 2f)
                      }
                  }
                  Spacer(Modifier.weight(1f))
                  Pill("DONE", true, Ik.OK, f = done)
              }
              themeParams().forEach { R2(it) }
          }

          fun saveBmp(ctx: Context, b: Bitmap) {
              val n = "Canvas_" + System.currentTimeMillis() + ".png"
              var ok = true
              try {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val cv = ContentValues()
                      cv.put(MediaStore.Images.Media.DISPLAY_NAME, n)
                      cv.put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                      cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Canvas")
                      val u = ctx.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv)!!
                      ctx.contentResolver.openOutputStream(u)!!.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  } else {
                      val f = java.io.File(ctx.getExternalFilesDir(Environment.DIRECTORY_PICTURES), n)
                      f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  }
              } catch (x: Exception) { ok = false }
              Handler(Looper.getMainLooper()).post {
                  Toast.makeText(ctx, if (ok) "saved " + n else "save failed", Toast.LENGTH_LONG).show()
              }
          }

          // ───────────────────────── app ─────────────────────────
          @Composable
          fun App(e: Engine) {
              val ctx = LocalContext.current
              val v = remember { CanvasView(ctx, e) }
              val rv = U.rev
              val bg = T.bgv
              val scope = rememberCoroutineScope()
              var tool by remember { mutableStateOf(Tool.BRUSH) }
              var panel by remember { mutableIntStateOf(0) }   // 0 none 1 tools 2 brush 3 color 4 layers 5 menu 6 theme
              var last by remember { mutableIntStateOf(1) }
              var hud by remember { mutableStateOf(true) }
              var mood by remember { mutableIntStateOf(0) }
              var say by remember { mutableStateOf("") }
              var sayOn by remember { mutableStateOf(false) }
              val job = remember { arrayOfNulls<Job>(1) }
              fun feel(m: Int, s: String) {
                  job[0]?.cancel(); mood = m; say = s; sayOn = true
                  job[0] = scope.launch { delay(1500); mood = 0; sayOn = false }
              }
              SideEffect { e.bgv = bg; v.requestRender(); if (panel != 0) last = panel }
              LaunchedEffect(Unit) { e.onPick = { c -> U.tgt = 0; U.from(c); U.bump() }; feel(1, "hi~ let's draw!") }
              LaunchedEffect(e.busy) { if (e.busy && (panel == 1 || panel == 5)) panel = 0 }
              val m = if (!hud) 5 else if (e.busy) 2 else mood

              Box(Modifier.fillMaxSize().background(Color(bg, bg, bg))) {
                  AndroidView({ v }, Modifier.fillMaxSize())
                  if (!hud) {
                      Box(Modifier.align(Alignment.BottomStart).navigationBarsPadding().padding(d(10f))) { Mascot(5, 52f) { hud = true; feel(1, "hi!") } }
                  } else {
                      Row(Modifier.align(Alignment.TopStart).statusBarsPadding().padding(d(10f)), horizontalArrangement = Arrangement.spacedBy(d(8f))) {
                          IB(Ik.UN, en = e.canUndo, anim = false) { v.gl { e.undo() }; feel(4, "oops!") }
                          IB(Ik.RE, en = e.canRedo, anim = false) { v.gl { e.redo() }; feel(1, "again!") }
                      }
                      val dockA by animateFloatAsState(if (e.busy) .08f else 1f, label = "dock")
                      Column(
                          Modifier.align(Alignment.BottomCenter).navigationBarsPadding().padding(d(8f)).graphicsLayer { alpha = dockA },
                          horizontalAlignment = Alignment.Start
                      ) {
                          AnimatedVisibility(
                              visible = panel != 0,
                              enter = fadeIn() + scaleIn(spring(.55f, 380f), initialScale = .9f, transformOrigin = TransformOrigin(.5f, 1f)) + expandVertically(),
                              exit = fadeOut() + scaleOut(targetScale = .92f, transformOrigin = TransformOrigin(.5f, 1f)) + shrinkVertically()
                          ) {
                              Column(
                                  Modifier.fillMaxWidth().padding(bottom = d(6f)).heightIn(max = d(360f)).clip(rs()).background(T.panel)
                                      .animateContentSize().verticalScroll(rememberScrollState()).padding(d(10f)),
                                  verticalArrangement = Arrangement.spacedBy(d(8f))
                              ) {
                                  when (if (panel != 0) panel else last) {
                                      1 -> ToolsPanel(tool) { t -> tool = t; e.tool = t; U.bump(); feel(1, SAY[t.ordinal]); panel = 0 }
                                      2 -> BrushPanel(e)
                                      3 -> ColorPanel(e) { a, b -> feel(a, b) }
                                      4 -> LayerPanel(e, v) { a, b -> feel(a, b) }
                                      5 -> MenuPanel(
                                          e,
                                          sym = { e.symMode = (e.symMode + 1) % 5; U.bump(); feel(1, "sym " + SYM[e.symMode]) },
                                          save = { v.gl { val b = e.snapshot(); Thread { saveBmp(ctx, b) }.start() }; feel(3, "saved!"); panel = 0 },
                                          theme = { panel = 6 },
                                          hide = { hud = false; panel = 0 }
                                      )
                                      else -> ThemePanel { T.save(ctx.getSharedPreferences("t", 0)); panel = 0; feel(3, "so cute!") }
                                  }
                              }
                          }
                          AnimatedVisibility(visible = sayOn, enter = scaleIn(spring(.5f, 500f)) + fadeIn(), exit = fadeOut() + scaleOut()) {
                              Tx(say, T.dk, Modifier.padding(start = d(6f), bottom = d(4f)).clip(RoundedCornerShape(50)).background(T.ac).padding(horizontal = d(12f), vertical = d(5f)))
                          }
                          Row(
                              Modifier.align(Alignment.CenterHorizontally).clip(RoundedCornerShape(50)).background(T.panel).padding(d(6f)),
                              horizontalArrangement = Arrangement.spacedBy(d(8f)), verticalAlignment = Alignment.CenterVertically
                          ) {
                              Mascot(m, 50f) { panel = if (panel == 5) 0 else 5 }
                              IB(Ik.valueOf(tool.code), true, sz = 48f, anim = !e.busy) { panel = if (panel == 1) 0 else 1 }
                              val nz = (ln(e.pen.size) / ln(1000f)).coerceIn(0f, 1f)
                              val hd = e.pen.hardness.coerceIn(0f, .97f)
                              Bub(48f, panel == 2, anim = false, pad = .2f, f = { panel = if (panel == 2) 0 else 2 }) {
                                  val col = if (panel == 2) T.dk else T.ink
                                  drawCircle(Brush.radialGradient(0f to col, hd to col, 1f to col.copy(alpha = 0f)), size.minDimension / 2f * (.35f + .65f * nz))
                              }
                              Bub(48f, panel == 3, anim = false, pad = .24f, f = { panel = if (panel == 3) 0 else 3; U.from(if (U.tgt == 0) e.pen.color else e.pen.color2) }) {
                                  val s2 = size.minDimension
                                  drawCircle(Color(e.pen.color2), s2 * .3f, Offset(s2 * .66f, s2 * .66f))
                                  drawCircle(Color.White, s2 * .36f, Offset(s2 * .4f, s2 * .4f))
                                  drawCircle(Color(e.pen.color), s2 * .29f, Offset(s2 * .4f, s2 * .4f))
                              }
                              Box {
                                  IB(Ik.LY, panel == 4, sz = 48f, anim = false) { panel = if (panel == 4) 0 else 4 }
                                  Tx("" + e.info.size, T.dk, Modifier.align(Alignment.BottomEnd).clip(CircleShape).background(T.ac2).padding(horizontal = d(5f)), 9f)
                              }
                          }
                      }
                  }
              }
          }
          EOF_SRC
      - uses: actions/cache@v4
        with: {path: ~/ks, key: "ks-${{github.repository}}"}
      - env:
          B: ${{secrets.KS_B64}}
          P: ${{secrets.KS_PASS || 'ci-dev-key'}}
          A: ${{secrets.KS_ALIAS || 'k'}}
        run: |
          V=0.$(date -u +%y%m%d).$GITHUB_RUN_NUMBER
          gradle -q :app:assembleRelease -PversionCode=$((1000+GITHUB_RUN_NUMBER)) -PversionName=$V
          mkdir -p ~/ks dist; K=~/ks/k.jks
          [ -n "$B" ] && echo "$B"|base64 -d >$K
          [ -f $K ] || keytool -genkeypair -keystore $K -alias $A -keyalg RSA -keysize 3072 -validity 36500 -storepass "$P" -keypass "$P" -dname CN=$N
          T=$(ls -d $ANDROID_HOME/build-tools/*|sort -V|tail -1)
          $T/zipalign -fp 4 app/build/outputs/apk/release/*.apk a.apk
          $T/apksigner sign --ks $K --ks-key-alias $A --ks-pass env:P --key-pass env:P --out dist/$N-$V.apk a.apk
          echo "V=$V" >>$GITHUB_ENV
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env: {GH_TOKEN: "${{github.token}}"}
        run: |
          R=nightly F=-p; [ $GITHUB_REF_TYPE = tag ] && R=$GITHUB_REF_NAME F=
          [ $R = nightly ] && gh release delete nightly --cleanup-tag -y || true
          gh release create $R dist/* -t "$N $V" -n "build $GITHUB_RUN_NUMBER" --target $GITHUB_SHA $F
