              var av by mutableFloatStateOf(1f)
              var sh by mutableFloatStateOf(150f)   // hue shift for the 2nd accent
              var pa by mutableFloatStateOf(.82f)   // panel opacity
              var rad by mutableFloatStateOf(1f)    // roundness 0..1
              var sc by mutableFloatStateOf(1f)     // UI scale
              var fs by mutableFloatStateOf(11f)
              var bgv by mutableFloatStateOf(0f)    // canvas surround (0 = AMOLED black)
              var an by mutableFloatStateOf(1f)     // cute-animation amount (0 = off, saves battery)
              fun hsv(h: Float, s: Float, v: Float): Color =
                  Color(android.graphics.Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f))))
              val ac: Color get() = hsv(ah, sat, av)
              val ac2: Color get() = hsv(ah + sh, sat, av)
              val panel: Color get() = hsv(ah, .35f, .11f).copy(alpha = pa)
              val panel2: Color get() = hsv(ah, .3f, .2f)
              val ink = Color(0xFFFFF1F7)
              val dk = Color(0xFF2A1722)
              fun load(p: SharedPreferences) {
                  ah = p.getFloat("ah", ah); sat = p.getFloat("sat", sat); av = p.getFloat("av", av); sh = p.getFloat("sh", sh)
                  pa = p.getFloat("pa", pa); rad = p.getFloat("rad", rad); sc = p.getFloat("sc", sc); fs = p.getFloat("fs", fs)
                  bgv = p.getFloat("bgv", bgv); an = p.getFloat("an", an)
              }
              fun save(p: SharedPreferences) {
                  p.edit().putFloat("ah", ah).putFloat("sat", sat).putFloat("av", av).putFloat("sh", sh).putFloat("pa", pa)
                      .putFloat("rad", rad).putFloat("sc", sc).putFloat("fs", fs).putFloat("bgv", bgv).putFloat("an", an).apply()
              }
          }

