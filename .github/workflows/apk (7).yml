# Single-file pipeline: this YAML contains the whole Android app (Kotlin) + build + sign + release.
# Edit the source blocks in the 'src' step and push: every push builds an updatable APK.
name: apk
on:
  push: {branches: [main], tags: ['v*']}
  workflow_dispatch:
concurrency: {group: "apk-${{github.ref}}", cancel-in-progress: true}
permissions: {contents: write}
env: {N: Canvas}
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.10.2}
      - name: src
        run: |
          cat > settings.gradle.kts <<'EOF_SRC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Canvas"
          include(":app")
          EOF_SRC
          cat > build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_SRC
          cat > gradle.properties <<'EOF_SRC'
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_SRC
          cat > .gitignore <<'EOF_SRC'
          build/
          .gradle/
          local.properties
          *.jks
          EOF_SRC
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "dev.canvas"
              compileSdk = 35
              defaultConfig {
                  applicationId = "dev.canvas"; minSdk = 24; targetSdk = 35
                  versionCode = (findProperty("versionCode") as String?)?.toInt() ?: 1
                  versionName = findProperty("versionName") as String? ?: "dev"
              }
              buildTypes { release { isMinifyEnabled = true; isShrinkResources = true
                  proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt")) } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
          }
          EOF_SRC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
              <application android:label="Canvas" android:allowBackup="false" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/MainActivity.kt <<'EOF_SRC'
          package dev.canvas

          import android.app.ActivityManager
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  T.load(getSharedPreferences("t", 0))
                  // canvas size adapts to device memory: low-end stays smooth, hi-end gets 2K
                  val mc = (getSystemService(ACTIVITY_SERVICE) as ActivityManager).memoryClass
                  val e = Engine(when { mc >= 256 -> 2048; mc >= 128 -> 1536; else -> 1024 })
                  setContent { App(e) }
              }
          }
          EOF_SRC
          mkdir -p app/src/main/kotlin/dev/canvas
          cat > app/src/main/kotlin/dev/canvas/Engine.kt <<'EOF_SRC'
          package dev.canvas

          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.opengl.GLES30 as G
          import android.opengl.GLSurfaceView
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.IntBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.*
          import kotlin.random.Random

          enum class Tool(val code: String) {
              BRUSH("BR"), ERASER("ER"), SMUDGE("SM"), BLUR("BL"), DODGE("DG"), BURN("BN"), LIQUIFY("LQ"),
              FILL("FL"), GRAD("GR"), LINE("LN"), RECT("RC"), OVAL("OV"), PICK("PK"), MOVE("MV")
          }

          class Pen {
              var size = 24f; var opacity = 1f; var hardness = .8f; var spacing = .08f
              var round = 1f; var angle = 0f; var follow = false
              var scatter = 0f; var sizeJit = 0f; var opJit = 0f
              var grain = 0f; var grainScale = 2f; var smooth = .2f
              var pCurve = 1f; var pSize = .7f; var pOp = 0f
              var blurR = 2f; var tol = 24f
              var color = -1; var color2 = 0xFF000000.toInt()
              fun load(v: FloatArray) {
                  size = v[0]; opacity = v[1]; hardness = v[2]; spacing = v[3]; round = v[4]; angle = v[5]; scatter = v[6]
                  sizeJit = v[7]; opJit = v[8]; grain = v[9]; grainScale = v[10]; smooth = v[11]; pSize = v[12]; pOp = v[13]
              }
          }

          class LI(val show: Boolean, val alpha: Float, val blend: Int)
          class Layer(val tex: Int, val fbo: Int) { var show = true; var alpha = 1f; var blend = 0 }

          private class P(val id: Int) {
              private val m = HashMap<String, Int>()
              fun u(n: String) = m.getOrPut(n) { G.glGetUniformLocation(id, n) }
          }
          private class Step(val l: Layer) { val t = HashMap<Int, Int>() }

          private const val PIF = 3.1415927f
          private const val TS = 256        // undo tile size (copy-on-write, only touched tiles are stored)
          private const val BUDGET = 160    // max stored tiles (~40 MB) across the undo stack

          private const val VS = """#version 300 es
          uniform vec4 uR;out vec2 vP,vU;
          void main(){vec2 p=vec2(float(gl_VertexID&1),float(gl_VertexID>>1))*2.-1.;vP=p;vU=p*.5+.5;gl_Position=vec4(uR.xy+p*uR.zw,0,1);}"""

          // stamp: hardness, roundness, angle, grain (canvas-fixed noise), kind (0 paint, 1 dodge/burn)
          private const val FS_B = """#version 300 es
          precision highp float;in vec2 vP;uniform vec4 uC,uQ;uniform vec2 uG;out vec4 o;
          float hs(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
          void main(){float c=cos(uQ.z),s=sin(uQ.z);vec2 q=vec2(c*vP.x+s*vP.y,-s*vP.x+c*vP.y);q.y/=uQ.y;
          float a=(1.-smoothstep(uQ.x,1.,length(q)))*uC.a;a*=1.-uQ.w*hs(floor(gl_FragCoord.xy/uG.x));
          o=uG.y<.5?vec4(uC.rgb*a,a):vec4(vec3(a*.3),0.);}"""

          // smudge (mode 0) / blur (mode 1) reading a scratch copy of the layer
          private const val FS_S = """#version 300 es
          precision highp float;in vec2 vP;uniform sampler2D uT;uniform vec2 uSz,uD;uniform vec4 uQ;uniform float uM,uS,uBr;out vec4 o;
          void main(){vec2 uv=gl_FragCoord.xy/uSz;vec4 src=texture(uT,uv);float a=(1.-smoothstep(uQ.x,1.,length(vP)))*uS;vec4 r;
          if(uM<.5)r=texture(uT,uv-uD/uSz);else{r=vec4(0.);for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++)r+=texture(uT,uv+vec2(float(i),float(j))*uBr/uSz);r/=9.;}
          o=mix(src,r,a);}"""

          private const val FS_G = """#version 300 es
          precision highp float;uniform vec2 uA,uB;uniform vec4 uC1,uC2;out vec4 o;
          void main(){vec2 d=uB-uA;float t=clamp(dot(gl_FragCoord.xy-uA,d)/dot(d,d),0.,1.);o=mix(uC1,uC2,t);}"""

          // composite: layer sampled through shared 16-bit displacement map + optional move offset
          private const val FS_C = """#version 300 es
          precision highp float;in vec2 vU;uniform sampler2D uL,uD;uniform vec2 uSz,uO;uniform float uA,uW,uRng;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          void main(){vec2 uv=vU-uO/uSz;if(uW>0.)uv+=dec(texture(uD,vU))/uSz;
          if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.){o=vec4(0.);return;}o=texture(uL,uv)*uA;}"""

          // liquify: mode 0 push, 1 pinch, 2 bloat, 3 swirl
          private const val FS_L = """#version 300 es
          precision highp float;uniform sampler2D uD;uniform vec2 uSz,uC,uV;uniform float uRad,uS,uRng,uM;out vec4 o;
          vec2 dec(vec4 t){vec4 b=t*255.;return(vec2(b.r*256.+b.g,b.b*256.+b.a)/65535.-.5)*2.*uRng;}
          vec4 enc(vec2 v){vec2 q=floor((clamp(v/uRng,-1.,1.)*.5+.5)*65535.+.5);vec2 h=floor(q/256.);vec2 l=q-h*256.;return vec4(h.x,l.x,h.y,l.y)/255.;}
          void main(){vec2 c=dec(texture(uD,gl_FragCoord.xy/uSz));vec2 dr=gl_FragCoord.xy-uC;float L=length(dr);float d=L/uRad;float f=max(1.-d*d,0.);f*=f;
          vec2 n=L>0.?dr/L:vec2(0.);float k=length(uV);vec2 dd;
          if(uM<.5)dd=-uV;else if(uM<1.5)dd=n*k;else if(uM<2.5)dd=-n*k;else dd=vec2(-n.y,n.x)*k;
          o=enc(c+dd*f*uS);}"""

          class Engine(val W: Int, val H: Int = W) : GLSurfaceView.Renderer {
              @JvmField var tool = Tool.BRUSH
              val pen = Pen()
              @JvmField var liqMode = 0
              @JvmField var liqR = 140f
              @JvmField var liqS = 1f
              @JvmField var symMode = 0
              @JvmField var symN = 6
              @JvmField var cur = 0
              @JvmField var onPick: ((Int) -> Unit)? = null
              @Volatile var bgv = 0f
              @Volatile var vw = 1
              @Volatile var vh = 1
              @Volatile var zoom = 1f
              @Volatile var px = 0f
              @Volatile var py = 0f

              // UI-observable state (written on the GL thread, read by Compose)
              var info by mutableStateOf(listOf<LI>())
              var curUi by mutableIntStateOf(0)
              var canUndo by mutableStateOf(false)
              var canRedo by mutableStateOf(false)
              var busy by mutableStateOf(false)

              private val layers = ArrayList<Layer>()
              private val uStack = ArrayDeque<Step>()
              private val rStack = ArrayDeque<Step>()
              private var step: Step? = null
              private var tiles = 0
              private var warped = false
              private lateinit var pB: P; private lateinit var pS: P; private lateinit var pG: P
              private lateinit var pC: P; private lateinit var pL: P
              private lateinit var map: Layer
              private var dTex = 0; private var dFbo = 0; private var sTex = 0; private var sFbo = 0; private var tFbo = 0
              private val rng = 128f
              private var lx = 0f; private var ly = 0f; private var acc = 0f
              private var sx = 0f; private var sy = 0f; private var x0 = 0f; private var y0 = 0f
              private var pdx = 0f; private var pdy = 0f; private var mox = 0f; private var moy = 0f

              private fun sync() {
                  info = layers.map { LI(it.show, it.alpha, it.blend) }; curUi = cur
                  canUndo = uStack.isNotEmpty(); canRedo = rStack.isNotEmpty()
              }

              // ---------- GL helpers ----------
              private fun tex(f: Int, w: Int = W, h: Int = H): Int {
                  val t = IntArray(1); G.glGenTextures(1, t, 0); G.glBindTexture(G.GL_TEXTURE_2D, t[0])
                  G.glTexImage2D(G.GL_TEXTURE_2D, 0, G.GL_RGBA8, w, h, 0, G.GL_RGBA, G.GL_UNSIGNED_BYTE, null)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MIN_FILTER, f)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_MAG_FILTER, f)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_S, G.GL_CLAMP_TO_EDGE)
                  G.glTexParameteri(G.GL_TEXTURE_2D, G.GL_TEXTURE_WRAP_T, G.GL_CLAMP_TO_EDGE)
                  return t[0]
              }
              private fun fbo(t: Int): Int {
                  val f = IntArray(1); G.glGenFramebuffers(1, f, 0); G.glBindFramebuffer(G.GL_FRAMEBUFFER, f[0])
                  G.glFramebufferTexture2D(G.GL_FRAMEBUFFER, G.GL_COLOR_ATTACHMENT0, G.GL_TEXTURE_2D, t, 0)
                  return f[0]
              }
              private fun delTex(t: Int) = G.glDeleteTextures(1, intArrayOf(t), 0)
              private fun prog(fs: String): P {
                  fun sh(t: Int, s: String): Int {
                      val h = G.glCreateShader(t); G.glShaderSource(h, s); G.glCompileShader(h)
                      val ok = IntArray(1); G.glGetShaderiv(h, G.GL_COMPILE_STATUS, ok, 0)
                      if (ok[0] == 0) throw RuntimeException(G.glGetShaderInfoLog(h))
                      return h
                  }
                  val p = G.glCreateProgram()
                  G.glAttachShader(p, sh(G.GL_VERTEX_SHADER, VS)); G.glAttachShader(p, sh(G.GL_FRAGMENT_SHADER, fs))
                  G.glLinkProgram(p); return P(p)
              }
              private fun quad() = G.glDrawArrays(G.GL_TRIANGLE_STRIP, 0, 4)
              private fun ch(c: Int, s: Int) = ((c shr s) and 255) / 255f
              private fun blend(m: Int) {
                  when (m) {
                      1 -> G.glBlendFuncSeparate(G.GL_DST_COLOR, G.GL_ONE_MINUS_SRC_ALPHA, G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      2 -> G.glBlendFuncSeparate(G.GL_ONE, G.GL_ONE_MINUS_SRC_COLOR, G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      3 -> G.glBlendFuncSeparate(G.GL_ONE, G.GL_ONE, G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      else -> G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                  }
              }
              private fun clearMap() {
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, dFbo)
                  G.glClearColor(128 / 255f, 0f, 128 / 255f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
              }
              private fun pm(p: P, n: String, c: Int) {
                  val a = pen.opacity; G.glUniform4f(p.u(n), ch(c, 16) * a, ch(c, 8) * a, ch(c, 0) * a, a)
              }

              // ---------- undo: tile copy-on-write ----------
              private fun beginStep(l: Layer) { step = Step(l) }
              private fun touch(x0: Int, y0: Int, x1: Int, y1: Int) {
                  val s = step ?: return
                  val nx = W / TS
                  for (ty in (y0 / TS)..((y1 - 1) / TS)) for (tx in (x0 / TS)..((x1 - 1) / TS)) {
                      val k = ty * nx + tx
                      if (s.t.containsKey(k)) continue
                      val t = tex(G.GL_NEAREST, TS, TS)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, s.l.fbo)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, tx * TS, ty * TS, TS, TS)
                      s.t[k] = t; tiles++
                  }
              }
              private fun dropTiles(s: Step) { for (t in s.t.values) delTex(t); tiles -= s.t.size }
              private fun commitStep() {
                  val s = step ?: return
                  step = null
                  if (s.t.isEmpty()) return
                  uStack.addLast(s)
                  for (r in rStack) dropTiles(r)
                  rStack.clear()
                  while (tiles > BUDGET && uStack.size > 1) dropTiles(uStack.removeFirst())
                  sync()
              }
              private fun swap(s: Step): Step {
                  val r = Step(s.l); val nx = W / TS
                  for ((k, t) in s.t) {
                      val tx = k % nx; val ty = k / nx
                      val n = tex(G.GL_NEAREST, TS, TS)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, s.l.fbo)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, tx * TS, ty * TS, TS, TS)
                      r.t[k] = n
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, tFbo)
                      G.glFramebufferTexture2D(G.GL_FRAMEBUFFER, G.GL_COLOR_ATTACHMENT0, G.GL_TEXTURE_2D, t, 0)
                      G.glBindTexture(G.GL_TEXTURE_2D, s.l.tex)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, tx * TS, ty * TS, 0, 0, TS, TS)
                      delTex(t)
                  }
                  if (s.l === map) warped = true
                  return r
              }
              fun undo() { val s = uStack.removeLastOrNull() ?: return; rStack.addLast(swap(s)); sync() }
              fun redo() { val s = rStack.removeLastOrNull() ?: return; uStack.addLast(swap(s)); sync() }
              private fun clearHistory() {
                  for (s in uStack) dropTiles(s); for (s in rStack) dropTiles(s)
                  uStack.clear(); rStack.clear(); sync()
              }

              // ---------- layers ----------
              fun addLayer(fill: Boolean = false) {
                  if (layers.size >= 24) return
                  val t = tex(G.GL_LINEAR); val f = fbo(t)
                  if (fill) G.glClearColor(1f, 1f, 1f, 1f) else G.glClearColor(0f, 0f, 0f, 0f)
                  G.glClear(G.GL_COLOR_BUFFER_BIT)
                  val at = if (layers.isEmpty()) 0 else cur + 1
                  layers.add(at, Layer(t, f)); cur = at; sync()
              }
              private fun blit(s: Layer, d: Layer, a: Float, bm: Int) {
                  compUniforms(0f)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, d.fbo); G.glViewport(0, 0, W, H); G.glUniform1f(pC.u("uA"), a)
                  if (bm < 0) G.glDisable(G.GL_BLEND) else { G.glEnable(G.GL_BLEND); blend(bm) }
                  G.glBindTexture(G.GL_TEXTURE_2D, s.tex); quad(); G.glDisable(G.GL_BLEND)
              }
              private fun delGl(l: Layer) { delTex(l.tex); G.glDeleteFramebuffers(1, intArrayOf(l.fbo), 0) }
              fun select(i: Int) { if (i in layers.indices) { cur = i; sync() } }
              fun setShow(i: Int, b: Boolean) { layers.getOrNull(i)?.show = b; sync() }
              fun setAlpha(i: Int, a: Float) { layers.getOrNull(i)?.alpha = a; sync() }
              fun setBlend(i: Int, m: Int) { layers.getOrNull(i)?.blend = m; sync() }
              fun delLayer() {
                  if (layers.size <= 1) return
                  val l = layers.removeAt(cur)
                  for (q in arrayOf(uStack, rStack)) q.removeAll { if (it.l === l) { dropTiles(it); true } else false }
                  delGl(l); cur = min(cur, layers.size - 1); sync()
              }
              fun dupLayer() {
                  if (layers.size >= 24) return
                  val s = layers[cur]; addLayer(); val d = layers[cur]
                  blit(s, d, 1f, -1); d.alpha = s.alpha; d.blend = s.blend; d.show = s.show; sync()
              }
              fun mergeDown() {
                  if (cur <= 0) return
                  val s = layers[cur]; blit(s, layers[cur - 1], s.alpha, s.blend)
                  layers.removeAt(cur); delGl(s); cur--; clearHistory()
              }
              fun moveLayer(dir: Int) {
                  val j = cur + dir
                  if (j !in layers.indices) return
                  java.util.Collections.swap(layers, cur, j); cur = j; sync()
              }
              fun clearLayer() {
                  val l = layers[cur]; beginStep(l); touch(0, 0, W, H)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo); G.glClearColor(0f, 0f, 0f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  commitStep()
              }

              // ---------- view transform ----------
              private fun sc() = min(vw.toFloat() / W, vh.toFloat() / H) * zoom
              private fun lf(s: Float) = (vw - W * s) / 2 + px
              private fun tp(s: Float) = (vh - H * s) / 2 + py
              fun cx(t: Float): Float { val s = sc(); return (t - lf(s)) / s }
              fun cy(t: Float): Float { val s = sc(); return H - (t - tp(s)) / s }
              fun zoomAt(mx: Float, my: Float, f: Float) {
                  val s0 = sc(); val a = (mx - lf(s0)) / s0; val b = (my - tp(s0)) / s0
                  zoom = (zoom * f).coerceIn(.1f, 32f); val s1 = sc()
                  px = mx - a * s1 - (vw - W * s1) / 2; py = my - b * s1 - (vh - H * s1) / 2
              }

              // ---------- renderer ----------
              override fun onSurfaceCreated(g: GL10?, c: EGLConfig?) {
                  val a = IntArray(1); G.glGenVertexArrays(1, a, 0); G.glBindVertexArray(a[0])
                  pB = prog(FS_B); pS = prog(FS_S); pG = prog(FS_G); pC = prog(FS_C); pL = prog(FS_L)
                  dTex = tex(G.GL_NEAREST); dFbo = fbo(dTex); sTex = tex(G.GL_LINEAR); sFbo = fbo(sTex)
                  G.glGenFramebuffers(1, a, 0); tFbo = a[0]
                  map = Layer(dTex, dFbo); clearMap()
                  layers.clear(); uStack.clear(); rStack.clear(); tiles = 0; step = null; warped = false; cur = 0
                  addLayer(true); addLayer()
              }
              override fun onSurfaceChanged(g: GL10?, w: Int, h: Int) { vw = w; vh = h; zoom = 1f; px = 0f; py = 0f }

              private fun compUniforms(w: Float) {
                  G.glUseProgram(pC.id); G.glUniform1i(pC.u("uL"), 0); G.glUniform1i(pC.u("uD"), 1)
                  G.glUniform2f(pC.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform1f(pC.u("uRng"), rng)
                  G.glUniform1f(pC.u("uW"), w); G.glUniform1f(pC.u("uA"), 1f); G.glUniform2f(pC.u("uO"), 0f, 0f)
                  G.glUniform4f(pC.u("uR"), 0f, 0f, 1f, 1f)
                  G.glActiveTexture(G.GL_TEXTURE1); G.glBindTexture(G.GL_TEXTURE_2D, dTex); G.glActiveTexture(G.GL_TEXTURE0)
              }
              private fun drawLayers() {
                  G.glEnable(G.GL_BLEND)
                  for ((i, l) in layers.withIndex()) if (l.show) {
                      blend(l.blend); G.glBindTexture(G.GL_TEXTURE_2D, l.tex); G.glUniform1f(pC.u("uA"), l.alpha)
                      val mv = tool == Tool.MOVE && i == cur
                      G.glUniform2f(pC.u("uO"), if (mv) mox else 0f, if (mv) moy else 0f); quad()
                  }
                  G.glDisable(G.GL_BLEND)
              }
              private fun composite() {
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H)
                  G.glClearColor(0f, 0f, 0f, 0f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  compUniforms(if (warped) 1f else 0f); drawLayers()
              }
              override fun onDrawFrame(g: GL10?) {
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, 0); G.glViewport(0, 0, vw, vh)
                  val b = bgv; G.glClearColor(b, b, b, 1f); G.glClear(G.GL_COLOR_BUFFER_BIT)
                  val s = sc()
                  G.glViewport(lf(s).roundToInt(), (vh - tp(s) - H * s).roundToInt(), (W * s).roundToInt(), (H * s).roundToInt())
                  compUniforms(if (warped) 1f else 0f); drawLayers()
              }

              // ---------- input (GL thread; x,y canvas px, y up) ----------
              private inline fun sym(x: Float, y: Float, a: Float, f: (Float, Float, Float) -> Unit) {
                  f(x, y, a)
                  when (symMode) {
                      1 -> f(W - x, y, PIF - a)
                      2 -> f(x, H - y, -a)
                      3 -> { f(W - x, y, PIF - a); f(x, H - y, -a); f(W - x, H - y, PIF + a) }
                      4 -> {
                          val cx = W / 2f; val cy = H / 2f
                          for (k in 1 until symN) {
                              val t = 2.0 * PI * k / symN; val c = cos(t).toFloat(); val s = sin(t).toFloat()
                              f(cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c, a + t.toFloat())
                          }
                      }
                  }
              }

              fun begin(x: Float, y: Float, p: Float) {
                  commitStep()
                  busy = true
                  x0 = x; y0 = y; sx = x; sy = y; lx = x; ly = y; acc = 0f; pdx = x; pdy = y
                  when (tool) {
                      Tool.FILL -> fill(x.toInt(), y.toInt())
                      Tool.PICK -> pick(x.toInt(), y.toInt())
                      Tool.LIQUIFY -> beginStep(map)
                      Tool.MOVE -> { beginStep(layers[cur]); mox = 0f; moy = 0f }
                      Tool.GRAD, Tool.LINE, Tool.RECT, Tool.OVAL -> beginStep(layers[cur])
                      else -> { beginStep(layers[cur]); dab(x, y, p, pen.angle * PIF / 180f) }
                  }
              }

              fun move(x: Float, y: Float, p: Float) {
                  when (tool) {
                      Tool.FILL -> {}
                      Tool.PICK -> pick(x.toInt(), y.toInt())
                      Tool.LIQUIFY -> { val dx = x - lx; val dy = y - ly; if (hypot(dx, dy) >= .5f) { push(x, y, dx, dy); lx = x; ly = y } }
                      Tool.MOVE -> { mox = (x - x0).roundToInt().toFloat(); moy = (y - y0).roundToInt().toFloat() }
                      Tool.GRAD, Tool.LINE, Tool.RECT, Tool.OVAL -> { sx = x; sy = y }
                      else -> {
                          val k = pen.smooth.coerceIn(0f, .95f)
                          sx += (x - sx) * (1f - k); sy += (y - sy) * (1f - k); seg(sx, sy, p)
                      }
                  }
              }

              fun end() {
                  when (tool) {
                      Tool.GRAD -> gradient(x0, y0, sx, sy)
                      Tool.LINE -> { lx = x0; ly = y0; acc = 0f; seg(sx, sy, 1f) }
                      Tool.RECT -> { lx = x0; ly = y0; acc = 0f; seg(sx, y0, 1f); seg(sx, sy, 1f); seg(x0, sy, 1f); seg(x0, y0, 1f) }
                      Tool.OVAL -> {
                          val cx = (x0 + sx) / 2f; val cy = (y0 + sy) / 2f; val rx = abs(sx - x0) / 2f; val ry = abs(sy - y0) / 2f
                          lx = cx + rx; ly = cy; acc = 0f
                          for (i in 1..72) { val t = i * 2f * PIF / 72f; seg(cx + rx * cos(t), cy + ry * sin(t), 1f) }
                      }
                      Tool.MOVE -> commitMove()
                      else -> {}
                  }
                  commitStep()
                  busy = false
              }

              /** Cancel the running stroke: restores the touched tiles, leaves history untouched. */
              fun abort() {
                  val st = step; step = null; busy = false; mox = 0f; moy = 0f
                  if (st != null && st.t.isNotEmpty()) { val r = swap(st); dropTiles(r) }
              }

              private fun seg(x: Float, y: Float, p: Float) {
                  val dx = x - lx; val dy = y - ly; val d = hypot(dx, dy)
                  if (d < .01f) return
                  val ang = if (pen.follow) atan2(dy, dx) else pen.angle * PIF / 180f
                  val st = max(1f, pen.size * pen.spacing); var t = st - acc
                  while (t <= d) { dab(lx + dx * t / d, ly + dy * t / d, p, ang); t += st }
                  acc = d - (t - st); lx = x; ly = y
              }

              private fun dab(x: Float, y: Float, p: Float, a: Float) {
                  if (tool == Tool.SMUDGE) { stamp(x, y, p, a); return }
                  sym(x, y, a) { xx, yy, aa -> stamp(xx, yy, p, aa) }
              }

              private fun stamp(x: Float, y: Float, p: Float, a: Float) {
                  val l = layers[cur]
                  val pp = p.coerceIn(0f, 1f).pow(max(.05f, pen.pCurve))
                  val r = max(.5f, pen.size / 2f * (1f - pen.pSize + pen.pSize * pp) * (1f - pen.sizeJit * Random.nextFloat()))
                  val op = pen.opacity * (1f - pen.pOp + pen.pOp * pp) * (1f - pen.opJit * Random.nextFloat())
                  var cx = x; var cy = y
                  if (pen.scatter > 0f) {
                      val t = Random.nextFloat() * 2f * PIF; val q = Random.nextFloat() * pen.scatter * r * 2f
                      cx += cos(t) * q; cy += sin(t) * q
                  }
                  val flt = tool == Tool.SMUDGE || tool == Tool.BLUR
                  val fd = if (tool == Tool.SMUDGE) hypot(cx - pdx, cy - pdy) else if (flt) pen.blurR else 0f
                  val pad = ceil(r + fd).toInt() + 3
                  val bx0 = max(0, floor(cx).toInt() - pad); val bx1 = min(W, ceil(cx).toInt() + pad)
                  val by0 = max(0, floor(cy).toInt() - pad); val by1 = min(H, ceil(cy).toInt() + pad)
                  if (bx1 <= bx0 || by1 <= by0) return
                  touch(bx0, by0, bx1, by1)
                  G.glActiveTexture(G.GL_TEXTURE0)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo); G.glViewport(0, 0, W, H)
                  val rx = cx * 2f / W - 1f; val ry = cy * 2f / H - 1f; val rw = 2f * r / W; val rh = 2f * r / H
                  if (flt) {
                      G.glBindTexture(G.GL_TEXTURE_2D, sTex)
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, bx0, by0, bx0, by0, bx1 - bx0, by1 - by0)
                      G.glUseProgram(pS.id); G.glUniform1i(pS.u("uT"), 0); G.glUniform4f(pS.u("uR"), rx, ry, rw, rh)
                      G.glUniform2f(pS.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform2f(pS.u("uD"), cx - pdx, cy - pdy)
                      G.glUniform4f(pS.u("uQ"), min(pen.hardness, .98f), 0f, 0f, 0f)
                      G.glUniform1f(pS.u("uM"), if (tool == Tool.SMUDGE) 0f else 1f)
                      G.glUniform1f(pS.u("uS"), op); G.glUniform1f(pS.u("uBr"), pen.blurR)
                      G.glDisable(G.GL_BLEND); quad(); pdx = cx; pdy = cy
                  } else {
                      G.glUseProgram(pB.id); G.glUniform4f(pB.u("uR"), rx, ry, rw, rh)
                      G.glUniform4f(pB.u("uC"), ch(pen.color, 16), ch(pen.color, 8), ch(pen.color, 0), op)
                      G.glUniform4f(pB.u("uQ"), min(pen.hardness, .98f), pen.round.coerceIn(.05f, 1f), a, pen.grain)
                      G.glUniform2f(pB.u("uG"), max(1f, pen.grainScale), if (tool == Tool.DODGE || tool == Tool.BURN) 1f else 0f)
                      G.glEnable(G.GL_BLEND)
                      when (tool) {
                          Tool.ERASER -> G.glBlendFunc(G.GL_ZERO, G.GL_ONE_MINUS_SRC_ALPHA)
                          Tool.DODGE -> G.glBlendFuncSeparate(G.GL_ONE, G.GL_ONE, G.GL_ZERO, G.GL_ONE)
                          Tool.BURN -> G.glBlendFuncSeparate(G.GL_ZERO, G.GL_ONE_MINUS_SRC_COLOR, G.GL_ZERO, G.GL_ONE)
                          else -> G.glBlendFunc(G.GL_ONE, G.GL_ONE_MINUS_SRC_ALPHA)
                      }
                      quad(); G.glDisable(G.GL_BLEND)
                  }
              }

              private fun gradient(ax: Float, ay: Float, ex: Float, ey: Float) {
                  if (hypot(ex - ax, ey - ay) < 1f) return
                  val l = layers[cur]; touch(0, 0, W, H)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo); G.glViewport(0, 0, W, H); G.glUseProgram(pG.id)
                  G.glUniform2f(pG.u("uA"), ax, ay); G.glUniform2f(pG.u("uB"), ex, ey); G.glUniform4f(pG.u("uR"), 0f, 0f, 1f, 1f)
                  pm(pG, "uC1", pen.color); pm(pG, "uC2", pen.color2)
                  G.glEnable(G.GL_BLEND); blend(0); quad(); G.glDisable(G.GL_BLEND)
              }

              private fun push(x: Float, y: Float, dx: Float, dy: Float) {
                  val r = liqR
                  val bx0 = max(0, floor(x - r).toInt()); val bx1 = min(W, ceil(x + r).toInt())
                  val by0 = max(0, floor(y - r).toInt()); val by1 = min(H, ceil(y + r).toInt())
                  if (bx1 <= bx0 || by1 <= by0) return
                  touch(bx0, by0, bx1, by1)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H); G.glUseProgram(pL.id)
                  G.glActiveTexture(G.GL_TEXTURE0); G.glBindTexture(G.GL_TEXTURE_2D, dTex); G.glUniform1i(pL.u("uD"), 0)
                  G.glUniform4f(pL.u("uR"), (bx0 + bx1) / W.toFloat() - 1f, (by0 + by1) / H.toFloat() - 1f, (bx1 - bx0) / W.toFloat(), (by1 - by0) / H.toFloat())
                  G.glUniform2f(pL.u("uSz"), W.toFloat(), H.toFloat()); G.glUniform2f(pL.u("uC"), x, y); G.glUniform2f(pL.u("uV"), dx, dy)
                  G.glUniform1f(pL.u("uRad"), r); G.glUniform1f(pL.u("uS"), liqS); G.glUniform1f(pL.u("uRng"), rng)
                  G.glUniform1f(pL.u("uM"), liqMode.toFloat())
                  G.glDisable(G.GL_BLEND); quad()
                  G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, bx0, by0, bx0, by0, bx1 - bx0, by1 - by0)
                  warped = true
              }

              /** Resample every layer ONCE through the map (keeps detail sharp), reset the map. Clears history. */
              fun bake() {
                  if (!warped) return
                  for (l in layers) {
                      compUniforms(1f); G.glDisable(G.GL_BLEND)
                      G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H)
                      G.glBindTexture(G.GL_TEXTURE_2D, l.tex); quad()
                      G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, 0, 0, W, H)
                  }
                  clearMap(); warped = false; clearHistory()
              }

              private fun commitMove() {
                  val dx = mox; val dy = moy; mox = 0f; moy = 0f
                  if (dx == 0f && dy == 0f) return
                  val l = layers[cur]; touch(0, 0, W, H)
                  compUniforms(0f); G.glUniform2f(pC.u("uO"), dx, dy); G.glDisable(G.GL_BLEND)
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, sFbo); G.glViewport(0, 0, W, H)
                  G.glBindTexture(G.GL_TEXTURE_2D, l.tex); quad()
                  G.glCopyTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, 0, 0, W, H)
              }

              private fun pick(x: Int, y: Int) {
                  if (x !in 0 until W || y !in 0 until H) return
                  composite()
                  val bb = ByteBuffer.allocateDirect(4).order(ByteOrder.nativeOrder())
                  G.glReadPixels(x, y, 1, 1, G.GL_RGBA, G.GL_UNSIGNED_BYTE, bb)
                  val r = bb.get(0).toInt() and 255; val g = bb.get(1).toInt() and 255
                  val b = bb.get(2).toInt() and 255; val a = bb.get(3).toInt() and 255
                  if (a == 0) return
                  val c = (255 shl 24) or (min(255, r * 255 / a) shl 16) or (min(255, g * 255 / a) shl 8) or min(255, b * 255 / a)
                  pen.color = c; onPick?.invoke(c)
              }

              private fun near(p: Int, t: Int, tol: Int): Boolean {
                  var s = 0
                  while (s < 32) { if (abs(((p shr s) and 255) - ((t shr s) and 255)) > tol) return false; s += 8 }
                  return true
              }

              private fun fill(sx0: Int, sy0: Int) {
                  if (sx0 !in 0 until W || sy0 !in 0 until H) return
                  val l = layers[cur]
                  G.glBindFramebuffer(G.GL_FRAMEBUFFER, l.fbo)
                  val bb = ByteBuffer.allocateDirect(W * H * 4).order(ByteOrder.nativeOrder())
                  G.glReadPixels(0, 0, W, H, G.GL_RGBA, G.GL_UNSIGNED_BYTE, bb)
                  val a = IntArray(W * H); bb.asIntBuffer().get(a)
                  val o = pen.opacity
                  val fc = ((255 * o).toInt() shl 24) or ((ch(pen.color, 0) * o * 255).toInt() shl 16) or
                      ((ch(pen.color, 8) * o * 255).toInt() shl 8) or (ch(pen.color, 16) * o * 255).toInt()
                  val t = a[sy0 * W + sx0]; val tol = pen.tol.toInt()
                  if (t == fc) return
                  val vis = BooleanArray(W * H); var st = IntArray(1024); var sp = 0
                  var mnx = W; var mxx = 0; var mny = H; var mxy = 0
                  st[sp++] = sy0 * W + sx0
                  while (sp > 0) {
                      val p = st[--sp]; val y = p / W; val x = p - y * W; val rb = y * W
                      if (vis[p] || !near(a[p], t, tol)) continue
                      var l2 = x; while (l2 > 0 && !vis[rb + l2 - 1] && near(a[rb + l2 - 1], t, tol)) l2--
                      var r2 = x; while (r2 < W - 1 && !vis[rb + r2 + 1] && near(a[rb + r2 + 1], t, tol)) r2++
                      for (i in l2..r2) { vis[rb + i] = true; a[rb + i] = fc }
                      mnx = min(mnx, l2); mxx = max(mxx, r2); mny = min(mny, y); mxy = max(mxy, y)
                      for (ny in intArrayOf(y - 1, y + 1)) {
                          if (ny < 0 || ny >= H) continue
                          val nb = ny * W; var i = l2
                          while (i <= r2) {
                              if (!vis[nb + i] && near(a[nb + i], t, tol)) {
                                  if (sp == st.size) st = st.copyOf(sp * 2)
                                  st[sp++] = nb + i
                                  while (i <= r2 && !vis[nb + i] && near(a[nb + i], t, tol)) i++
                              } else i++
                          }
                      }
                  }
                  beginStep(l); touch(mnx, mny, mxx + 1, mxy + 1)
                  G.glBindTexture(G.GL_TEXTURE_2D, l.tex)
                  G.glTexSubImage2D(G.GL_TEXTURE_2D, 0, 0, 0, W, H, G.GL_RGBA, G.GL_UNSIGNED_BYTE, IntBuffer.wrap(a))
                  commitStep()
              }

              fun snapshot(): Bitmap {
                  composite()
                  val bb = ByteBuffer.allocateDirect(W * H * 4).order(ByteOrder.nativeOrder())
                  G.glReadPixels(0, 0, W, H, G.GL_RGBA, G.GL_UNSIGNED_BYTE, bb); bb.rewind()
                  val b = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888); b.copyPixelsFromBuffer(bb)
                  val m = Matrix(); m.preScale(1f, -1f)
                  return Bitmap.createBitmap(b, 0, 0, W, H, m, false)
              }
          }
          EOF_SRC
