      # 2) Eksperimental: ONNX -> TFLite -> LiteRT GPU. Boleh gagal tanpa merusak APK utama.
      - name: Konversi vision encoder ONNX ke TFLite
        id: conv
        continue-on-error: true
        run: |
          set -e
          mkdir -p conv && cd conv
          curl -fsSL -o vision_model.onnx             https://huggingface.co/plhery/mobileclip2-onnx/resolve/main/onnx/s0/vision_model.onnx
          pip install -q onnx2tf tensorflow tf_keras onnx onnxruntime onnxsim sng4onnx onnx_graphsurgeon psutil ai-edge-litert
          onnx2tf -i vision_model.onnx -o tfl -b 1
          ls -l tfl
          mkdir -p ../app/src/gpu/assets
          cp tfl/vision_model_float32.tflite ../app/src/gpu/assets/vision_s0.tflite

      - name: Build APK gpu (LiteRT)
        if: steps.conv.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleGpuDebug --no-daemon --console=plain 2>&1 | tee build-gpu.log || {
            grep -E '^e: |What went wrong' -A2 build-gpu.log | head -40
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSeek-gpu-apk-experimental
          path: app/build/outputs/apk/gpu/debug/app-gpu-debug.apk
          if-no-files-found: ignore
