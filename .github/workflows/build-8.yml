# PhotoSeek: pencari foto pakai deskripsi visual (MobileCLIP2-S0, on-device)
# Output: APK std (wajib) + APK gpu/LiteRT (eksperimental)
# Taruh file ini di .github/workflows/build.yml di repo kosong, lalu Actions > Build APK > Run workflow.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cek URL model (gagal cepat kalau 404)
        run: |
          set -e
          B=https://huggingface.co/plhery/mobileclip2-onnx/resolve/main/onnx/s0
          for f in vision_model.onnx text_model.onnx; do
            code=$(curl -sL -o /dev/null -I -w '%{http_code}' "$B/$f")
            size=$(curl -sIL "$B/$f" | grep -i '^content-length' | tail -1 | tr -d '\r')
            echo "$f -> HTTP $code | $size"
            [ "$code" = "200" ] || { echo "::error::$f tidak ketemu"; exit 1; }
          done

      - name: Generate project via heredoc
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets app/src/main/kotlin/dev/photoseek app/src/std/kotlin/dev/photoseek app/src/gpu/kotlin/dev/photoseek

          cat > app/build.gradle.kts <<'PHOTOSEEK_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "dev.photoseek"
              compileSdk = 35

              defaultConfig {
                  applicationId = "dev.photoseek"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }

              // std = ONNX Runtime (NNAPI). gpu = + LiteRT GPU (eksperimental, butuh vision_s0.tflite hasil konversi CI)
              flavorDimensions += "accel"
              productFlavors {
                  create("std") { dimension = "accel" }
                  create("gpu") {
                      dimension = "accel"
                      applicationIdSuffix = ".gpu"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              sourceSets["main"].java.srcDirs("src/main/kotlin")
              sourceSets["std"].java.srcDirs("src/std/kotlin")
              sourceSets["gpu"].java.srcDirs("src/gpu/kotlin")
              androidResources { noCompress += listOf("gz", "tflite") }
          }

          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.22.0")
              "gpuImplementation"("com.google.ai.edge.litert:litert:2.3.0")
              "gpuImplementation"("com.google.ai.edge.litert:litert-gpu:2.3.0")
          }
          PHOTOSEEK_EOF

          cat > app/src/gpu/kotlin/dev/photoseek/GpuAccel.kt <<'PHOTOSEEK_EOF'
          package dev.photoseek

          import android.content.Context
          import com.google.ai.edge.litert.Accelerator
          import com.google.ai.edge.litert.CompiledModel
          import com.google.ai.edge.litert.Environment
          import kotlin.math.sqrt

          /**
           * LiteRT GPU untuk vision encoder. Hanya dipakai kalau:
           * 1) assets/vision_s0.tflite ada (hasil konversi onnx2tf di CI),
           * 2) model bisa dibuat di GPU,
           * 3) outputnya cocok (cosine > 0.98) dengan ONNX Runtime pada input uji.
           * Selain itu return null dan engine tetap pakai ONNX Runtime.
           */
          object GpuAccel {
              private fun l2(f: FloatArray): FloatArray {
                  var n = 0f
                  for (x in f) n += x * x
                  val inv = 1f / sqrt(n + 1e-12f)
                  return FloatArray(f.size) { f[it] * inv }
              }

              private fun dot(a: FloatArray, b: FloatArray): Float {
                  var s = 0f
                  for (i in a.indices) s += a[i] * b[i]
                  return s
              }

              private fun toNhwc(x: FloatArray): FloatArray {
                  val p = SZ * SZ
                  val o = FloatArray(x.size)
                  for (i in 0 until p) {
                      o[i * 3] = x[i]
                      o[i * 3 + 1] = x[p + i]
                      o[i * 3 + 2] = x[2 * p + i]
                  }
                  return o
              }

              fun tryCreate(ctx: Context, ref: (FloatArray) -> FloatArray): ((FloatArray) -> FloatArray)? {
                  try {
                      ctx.assets.open("vision_s0.tflite").close()
                  } catch (e: Throwable) {
                      return null
                  }
                  return try {
                      val env = Environment.create()
                      val model = CompiledModel.create(
                          ctx.assets, "vision_s0.tflite", CompiledModel.Options(Accelerator.GPU), env
                      )
                      val inB = model.createInputBuffers()
                      val outB = model.createOutputBuffers()
                      fun exec(x: FloatArray, nhwc: Boolean): FloatArray {
                          inB[0].writeFloat(if (nhwc) toNhwc(x) else x)
                          model.run(inB, outB)
                          return l2(outB[0].readFloat())
                      }

                      val plane = SZ * SZ
                      val probe = FloatArray(3 * plane) {
                          val c = it / plane
                          val p = it % plane
                          (((p % SZ) * (c + 1) + (p / SZ) * (3 - c)) % 256) / 255f
                      }
                      val want = ref(probe)
                      var found: ((FloatArray) -> FloatArray)? = null
                      for (nhwc in booleanArrayOf(true, false)) {
                          val got = exec(probe, nhwc)
                          if (got.size == want.size && dot(got, want) > 0.98f) {
                              found = { x -> exec(x, nhwc) }
                              break
                          }
                      }
                      found
                  } catch (e: Throwable) {
                      null
                  }
              }
          }
          PHOTOSEEK_EOF

          cat > app/src/main/AndroidManifest.xml <<'PHOTOSEEK_EOF'
