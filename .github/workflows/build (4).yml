name: Foxle APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
concurrency:
  group: foxle
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
      - name: Sumber (heredoc)
        run: |
          set -e
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/foxle/fm app/src/main/res/values app/src/main/res/drawable app/src/main/assets/fonts
          cat > settings.gradle.kts <<'__FX__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Foxle"
          include(":app")
          __FX__
          cat > build.gradle.kts <<'__FX__'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          __FX__
          cat > gradle.properties <<'__FX__'
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          kotlin.incremental=false
          __FX__
          cat > app/build.gradle.kts <<'__FX__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          val vc = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          android {
              namespace = "com.foxle.fm"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.foxle.fm"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = vc
                  versionName = "15.$vc"
              }
              signingConfigs {
                  create("r") {
                      storeFile = file("../k.p12")
                      storePassword = "foxle1"
                      keyAlias = "k"
                      keyPassword = "foxle1"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      isDebuggable = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("r")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-Xno-param-assertions", "-Xno-call-assertions", "-Xno-receiver-assertions")
              }
              buildFeatures {
                  buildConfig = false
                  resValues = false
              }
              packaging {
                  resources {
                      excludes += setOf("META-INF/**", "kotlin/**", "**/*.kotlin_*", "DebugProbesKt.bin")
                  }
              }
              dependenciesInfo {
                  includeInApk = false
                  includeInBundle = false
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          __FX__
          cat > app/proguard-rules.pro <<'__FX__'
          -keep class com.foxle.fm.Br { @android.webkit.JavascriptInterface <methods>; }
          -allowaccessmodification
          -repackageclasses ''
          -dontwarn **
          __FX__
          cat > app/src/main/AndroidManifest.xml <<'__FX__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <application android:label="Foxle" android:icon="@drawable/ic" android:theme="@style/T" android:allowBackup="false" android:requestLegacyExternalStorage="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|keyboard|smallestScreenSize|uiMode|density|fontScale|locale|layoutDirection" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __FX__
          cat > app/src/main/res/values/styles.xml <<'__FX__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="T" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowAnimationStyle">@null</item>
              </style>
          </resources>
          __FX__
          cat > app/src/main/java/com/foxle/fm/MainActivity.kt <<'__FX__'
          package com.foxle.fm

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.StatFs
          import android.provider.Settings
          import android.system.Os
          import android.system.OsConstants
          import android.util.Base64
          import android.webkit.*
          import org.json.JSONObject
          import java.io.*
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors

          class Br(private val a: MainActivity) {
              @JavascriptInterface fun root(): String = a.root
              @JavascriptInterface fun perm(): Boolean = a.hasPerm()
              @JavascriptInterface fun ask() { a.runOnUiThread { a.askPerm() } }
              @JavascriptInterface fun exit() { a.runOnUiThread { a.finishAndRemoveTask() } }
              @JavascriptInterface fun sp(): String { val s = StatFs(a.root); return s.totalBytes.toString() + "," + s.availableBytes }
              @JavascriptInterface fun ls(id: Int, p: String) { a.ex.execute { a.rs(id, a.lsImpl(p)) } }
              @JavascriptInterface fun st(id: Int, p: String) { a.ex.execute { a.rs(id, a.stImpl(p)) } }
              @JavascriptInterface fun mk(id: Int, p: String, d: Int) {
                  a.ex.execute {
                      a.rs(id, try {
                          val f = File(p)
                          if (d == 1) f.mkdirs() else { f.parentFile?.mkdirs(); f.createNewFile() }
                          "1"
                      } catch (e: Exception) { "0" })
                  }
              }
              @JavascriptInterface fun rm(id: Int, p: String) { a.ex.execute { a.rs(id, try { if (File(p).deleteRecursively()) "1" else "0" } catch (e: Exception) { "0" }) } }
              @JavascriptInterface fun mv(id: Int, x: String, y: String) { a.ex.execute { a.rs(id, try { if (File(x).renameTo(File(y))) "1" else "0" } catch (e: Exception) { "0" }) } }
              @JavascriptInterface fun wr(id: Int, p: String, b: String, m: Int) {
                  a.ex.execute {
                      a.rs(id, try {
                          val f = File(p)
                          f.parentFile?.mkdirs()
                          FileOutputStream(f, m == 1).use { if (b.isNotEmpty()) it.write(Base64.decode(b, Base64.DEFAULT)) }
                          "1"
                      } catch (e: Exception) { "0" })
                  }
              }
              @JavascriptInterface fun cp(id: Int, x: String, y: String) {
                  a.ex.execute {
                      a.rs(id, try {
                          File(y).parentFile?.mkdirs()
                          FileInputStream(x).channel.use { i ->
                              FileOutputStream(y).channel.use { o ->
                                  var p = 0L
                                  val n = i.size()
                                  while (p < n) {
                                      val k = i.transferTo(p, n - p, o)
                                      if (k <= 0) break
                                      p += k
                                  }
                              }
                          }
                          "1"
                      } catch (e: Exception) { "0" })
                  }
              }
          }

          class RS(f: File, a: Long, private var n: Long) : InputStream() {
              private val r = RandomAccessFile(f, "r").apply { seek(a) }
              override fun read(): Int { if (n <= 0) return -1; n--; return r.read() }
              override fun read(b: ByteArray, o: Int, l: Int): Int {
                  if (n <= 0) return -1
                  val k = r.read(b, o, minOf(l.toLong(), n).toInt())
                  if (k > 0) n -= k
                  return k
              }
              override fun close() { r.close() }
          }

          class MainActivity : Activity() {
              lateinit var wv: WebView
              val ex: ExecutorService = Executors.newFixedThreadPool(3)
              val root: String = Environment.getExternalStorageDirectory().path
              private val host = "foxle.local"
              private var fcb: ValueCallback<Array<Uri>>? = null

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  wv = WebView(this)
                  wv.setBackgroundColor(Color.BLACK)
                  wv.overScrollMode = android.view.View.OVER_SCROLL_NEVER
                  wv.isVerticalScrollBarEnabled = false
                  wv.isHorizontalScrollBarEnabled = false
                  val s = wv.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = false
                  s.allowContentAccess = false
                  s.mediaPlaybackRequiresUserGesture = false
                  s.setSupportZoom(false)
                  s.builtInZoomControls = false
                  s.displayZoomControls = false
                  s.textZoom = 100
                  s.setSafeBrowsingEnabled(false)
                  wv.addJavascriptInterface(Br(this), "FXN")
                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? {
                          val u = r.url
                          if (u.host != host) return null
                          return try {
                              val p = u.path ?: "/"
                              when {
                                  p.startsWith("/_f/") -> fileResp(p.substring(3), r.requestHeaders["Range"])
                                  p.startsWith("/_t/") -> {
                                      val q = p.substring(4)
                                      thumb("/" + q.substringAfter('/'), q.substringBefore('/').toInt()) ?: nf()
                                  }
                                  else -> asset(p)
                              }
                          } catch (e: Throwable) { nf() }
                      }
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          if (r.url.host == host) return false
                          try { startActivity(Intent(Intent.ACTION_VIEW, r.url)) } catch (e: Exception) {}
                          return true
                      }
                  }
                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams): Boolean {
                          fcb?.onReceiveValue(null)
                          fcb = cb
                          return try { startActivityForResult(p.createIntent(), 7); true } catch (e: Exception) { fcb = null; false }
                      }
                  }
                  setContentView(wv)
                  wv.loadUrl("https://$host/index.html")
              }

              override fun onActivityResult(r: Int, c: Int, d: Intent?) {
                  if (r == 7) { fcb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, d)); fcb = null }
                  else super.onActivityResult(r, c, d)
              }

              override fun onResume() {
                  super.onResume()
                  if (::wv.isInitialized) { wv.onResume(); wv.evaluateJavascript("window.__pm&&__pm(" + hasPerm() + ")", null) }
              }
              override fun onPause() { if (::wv.isInitialized) wv.onPause(); super.onPause() }

              @Deprecated("b")
              override fun onBackPressed() { if (wv.canGoBack()) wv.goBack() else finish() }

              override fun onDestroy() { ex.shutdownNow(); wv.destroy(); super.onDestroy() }

              fun hasPerm(): Boolean =
                  if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager()
                  else checkSelfPermission(android.Manifest.permission.WRITE_EXTERNAL_STORAGE) == 0

              fun askPerm() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try { startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName"))) }
                      catch (e: Exception) { startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)) }
                  } else requestPermissions(arrayOf(android.Manifest.permission.WRITE_EXTERNAL_STORAGE, android.Manifest.permission.READ_EXTERNAL_STORAGE), 1)
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<String>, r: IntArray) {
                  wv.evaluateJavascript("window.__pm&&__pm(" + hasPerm() + ")", null)
              }

              fun rs(id: Int, s: String) {
                  val js = "__r($id," + JSONObject.quote(s) + ")"
                  wv.post { wv.evaluateJavascript(js, null) }
              }

              fun lsImpl(p: String): String {
                  val names = File(p).list() ?: return ""
                  val sb = StringBuilder(names.size * 48)
                  var first = true
                  for (n in names) {
                      var d = false
                      var sz = 0L
                      var mt = 0L
                      try {
                          val s = Os.stat("$p/$n")
                          d = OsConstants.S_ISDIR(s.st_mode)
                          sz = s.st_size
                          mt = s.st_mtime * 1000
                      } catch (e: Exception) {}
                      if (!first) sb.append('\u001e')
                      first = false
                      sb.append(if (d) 'd' else 'f').append('\u001f').append(n).append('\u001f').append(sz).append('\u001f').append(mt)
                  }
                  return sb.toString()
              }

              fun stImpl(p: String): String = try {
                  val s = Os.stat(p)
                  (if (OsConstants.S_ISDIR(s.st_mode)) "d" else "f") + "\u001f" + s.st_size + "\u001f" + s.st_mtime * 1000
              } catch (e: Exception) { "" }

              private fun nf() = WebResourceResponse("text/plain", null, 404, "Not Found", HashMap(), ByteArrayInputStream(ByteArray(0)))

              private fun okPath(p: String) = try { File(p).canonicalPath.startsWith("/storage/") } catch (e: Exception) { false }

              private fun mime(n: String): String {
                  val e = n.substringAfterLast('.', "").lowercase()
                  return when (e) {
                      "html" -> "text/html"
                      "js" -> "text/javascript"
                      "css" -> "text/css"
                      "woff2" -> "font/woff2"
                      "svg" -> "image/svg+xml"
                      else -> MimeTypeMap.getSingleton().getMimeTypeFromExtension(e) ?: "application/octet-stream"
                  }
              }

              private fun asset(p: String): WebResourceResponse {
                  val n = if (p == "/") "index.html" else p.substring(1)
                  val m = mime(n)
                  val h = HashMap<String, String>()
                  h["Cache-Control"] = "max-age=86400"
                  return WebResourceResponse(m, if (m.startsWith("text") || m.endsWith("javascript")) "utf-8" else null, 200, "OK", h, assets.open(n))
              }

              private fun fileResp(path: String, rg: String?): WebResourceResponse {
                  val f = File(path)
                  if (!okPath(path) || !f.isFile) return nf()
                  val len = f.length()
                  var a = 0L
                  var b = len - 1
                  var c = 200
                  if (rg != null && rg.startsWith("bytes=") && len > 0) {
                      try {
                          val q = rg.substring(6).substringBefore(',').split("-")
                          if (q[0].isEmpty()) a = maxOf(0L, len - q[1].toLong())
                          else { a = q[0].toLong(); if (q.size > 1 && q[1].isNotEmpty()) b = minOf(b, q[1].toLong()) }
                          if (a > b || a >= len) { a = 0; b = len - 1 } else c = 206
                      } catch (e: Exception) { a = 0; b = len - 1 }
                  }
                  val n = if (len == 0L) 0L else b - a + 1
                  val h = HashMap<String, String>()
                  h["Accept-Ranges"] = "bytes"
                  h["Content-Length"] = n.toString()
                  h["Cache-Control"] = "no-store"
                  if (c == 206) h["Content-Range"] = "bytes $a-$b/$len"
                  return WebResourceResponse(mime(path), null, c, if (c == 206) "Partial Content" else "OK", h, RS(f, a, n))
              }

              private fun thumb(path: String, w: Int): WebResourceResponse? {
                  if (!okPath(path)) return null
                  return try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(path, o)
                      var s = 1
                      val m = minOf(o.outWidth, o.outHeight)
                      while (m / (s * 2) >= w) s *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = s
                      o2.inPreferredConfig = Bitmap.Config.RGB_565
                      var bm = BitmapFactory.decodeFile(path, o2) ?: return null
                      val deg = when (try { ExifInterface(path).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1) } catch (e: Exception) { 1 }) {
                          6 -> 90f
                          3 -> 180f
                          8 -> 270f
                          else -> 0f
                      }
                      if (deg != 0f) {
                          val mx = Matrix()
                          mx.postRotate(deg)
                          val r = Bitmap.createBitmap(bm, 0, 0, bm.width, bm.height, mx, true)
                          bm.recycle()
                          bm = r
                      }
                      val bo = ByteArrayOutputStream(16384)
                      bm.compress(Bitmap.CompressFormat.JPEG, 72, bo)
                      bm.recycle()
                      val h = HashMap<String, String>()
                      h["Cache-Control"] = "no-store"
                      WebResourceResponse("image/jpeg", null, 200, "OK", h, ByteArrayInputStream(bo.toByteArray()))
                  } catch (e: Throwable) { null }
              }
          }
          __FX__
          cat > app/src/main/assets/host.js <<'__FX__'
          (()=>{
          const B=window.FXN,P=new Map(),CH=196608,O='https://foxle.local';let n=0;
          window.__r=(i,v)=>{const f=P.get(i);if(f){P.delete(i);f(v)}};
          const call=(m,...a)=>new Promise(r=>{const i=++n;P.set(i,r);B[m](i,...a)});
          const enc=p=>O+'/_f'+p.split('/').map(encodeURIComponent).join('/');
          const T={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',flac:'audio/flac',m4a:'audio/mp4',aac:'audio/aac',pdf:'application/pdf',json:'application/json',html:'text/html',txt:'text/plain'};
          const mime=p=>T[p.slice(p.lastIndexOf('.')+1).toLowerCase()]||'';
          const u8=async c=>{if(typeof c=='string')return new TextEncoder().encode(c);if(c instanceof ArrayBuffer)return new Uint8Array(c);if(ArrayBuffer.isView(c))return new Uint8Array(c.buffer,c.byteOffset,c.byteLength);if(c&&c.arrayBuffer)return new Uint8Array(await c.arrayBuffer());return new Uint8Array(0)};
          const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
          const base=p=>p.slice(p.lastIndexOf('/')+1);
          class LF{
           constructor(p,s,m){this._p=p;this._a=0;this._b=s;this._f=s;this._c=true;this.size=s;this.lastModified=m;this.name=base(p);this.type=mime(p)}
           slice(a,b,t){const s=this.size;a=a==null?0:a<0?Math.max(s+a,0):Math.min(a,s);b=b==null?s:b<0?Math.max(s+b,0):Math.min(b,s);const x=new LF(this._p,0,this.lastModified);x._a=this._a+a;x._b=this._a+Math.max(a,b);x._f=this._f;x.size=Math.max(b-a,0);x._c=x._a==0&&x._b==x._f;x.type=t||'';return x}
           _fetch(){return this.size?fetch(enc(this._p),{headers:{Range:'bytes='+this._a+'-'+(this._b-1)}}):Promise.resolve(new Response(new Uint8Array(0)))}
           async arrayBuffer(){return(await this._fetch()).arrayBuffer()}
           async text(){return(await this._fetch()).text()}
           async blob(){const b=await(await this._fetch()).blob();return b.slice(0,b.size,this.type||b.type)}
           stream(){let rd;const s=this,x=new ReadableStream({async pull(c){if(!rd)rd=(await s._fetch()).body.getReader();const r=await rd.read();r.done?c.close():c.enqueue(r.value)},cancel(){rd&&rd.cancel()}});x._lf=this;return x}
          }
          class FW extends WritableStream{
           constructor(p){let m=0;const w=async c=>{if(c&&typeof c=='object'&&c.type&&!(c instanceof Blob)){if(c.type!='write')return;c=c.data}const u=await u8(c);for(let i=0;i<u.length;i+=CH){await call('wr',p,b64(u.subarray(i,i+CH)),m);m=1}};
            super({write:w,close:async()=>{if(!m){await call('wr',p,'',0);m=1}},abort(){}});this._p=p;this._w=w}
           write(c){return this._w(c)}
           seek(){return Promise.resolve()}
           truncate(){return Promise.resolve()}
           close(){return this.getWriter().close()}
          }
          const PT=ReadableStream.prototype.pipeTo;
          ReadableStream.prototype.pipeTo=function(w,o){const f=this._lf;if(f&&f._c&&w instanceof FW&&!this.locked)return call('cp',f._p,w._p).then(r=>{if(r!='1')throw new Error('copy failed')});return PT.call(this,w,o)};
          const NF=()=>new DOMException('Not found','NotFoundError');
          async function mv(h,nn){const np=h._p.slice(0,h._p.lastIndexOf('/')+1)+nn;if(await call('mv',h._p,np)!='1')throw new Error('rename failed');h._p=np;h.name=nn}
          class FH{
           constructor(p,s,m){this.kind='file';this.name=base(p);this._p=p;this._s=s;this._m=m}
           async getFile(){if(this._s<0){const r=(await call('st',this._p)).split('\u001f');if(!r[0])throw NF();this._s=+r[1];this._m=+r[2]}return new LF(this._p,this._s,this._m)}
           async createWritable(){return new FW(this._p)}
           move(nn){return mv(this,nn)}
          }
          class DH{
           constructor(p,nm){this.kind='directory';this.name=nm||base(p);this._p=p}
           async*values(){const r=await call('ls',this._p);if(!r)return;for(const l of r.split('\u001e')){const f=l.split('\u001f'),p=this._p+'/'+f[1];yield f[0]=='d'?new DH(p):new FH(p,+f[2],+f[3])}}
           async*entries(){for await(const h of this.values())yield[h.name,h]}
           async*keys(){for await(const h of this.values())yield h.name}
           [Symbol.asyncIterator](){return this.entries()}
           async getFileHandle(nm,o){const p=this._p+'/'+nm;if(o&&o.create){await call('mk',p,0)}else{const s=await call('st',p);if(s[0]!='f')throw NF()}return new FH(p,-1,0)}
           async getDirectoryHandle(nm,o){const p=this._p+'/'+nm;if(o&&o.create){await call('mk',p,1)}else{const s=await call('st',p);if(s[0]!='d')throw NF()}return new DH(p)}
           async removeEntry(nm){if(await call('rm',this._p+'/'+nm)!='1')throw NF()}
           move(nn){return mv(this,nn)}
          }
          window.Host={perm:()=>B.perm(),exit:()=>B.exit()};
          window.showDirectoryPicker=async()=>{if(!B.perm()){B.ask();const ok=await new Promise(r=>window.__pm=r);window.__pm=null;if(!ok)throw new DOMException('denied','AbortError')}return new DH(B.root(),'Storage')};
          try{navigator.storage.estimate=async()=>{const a=B.sp().split(',');return{quota:+a[0],usage:+a[0]-+a[1]}}}catch(e){}
          const CU=URL.createObjectURL.bind(URL);URL.createObjectURL=o=>o instanceof LF?enc(o._p):CU(o);
