      - name: Aset + ikon
        run: |
          set -e
          test -f Foxle.html || { echo "::error::Foxle.html tidak ada di root repo"; exit 1; }
          python3 - <<'__PY__'
          import re,os,urllib.request
          A='app/src/main/assets/'
          h=open('Foxle.html',encoding='utf-8').read()
          h=h.replace('<head>','<head>\n<script src="host.js"></script>',1)
          try:
              open(A+'jszip.min.js','wb').write(urllib.request.urlopen('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',timeout=30).read())
              h=h.replace('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','jszip.min.js')
          except Exception as e:
              print('jszip tetap CDN:',e)
          try:
              m=re.search(r'<link href="(https://fonts\.googleapis\.com[^"]+)"[^>]*>',h)
              rq=urllib.request.Request(m.group(1).replace('&amp;','&'),headers={'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0 Mobile Safari/537.36'})
              css=urllib.request.urlopen(rq,timeout=30).read().decode()
              for i,u in enumerate(sorted(set(re.findall(r'url\((https://[^)]+)\)',css)))):
                  fn='f%d.woff2'%i
                  open(A+'fonts/'+fn,'wb').write(urllib.request.urlopen(u,timeout=30).read())
                  css=css.replace(u,fn)
              open(A+'fonts/fonts.css','w').write(css)
              h=re.sub(r'<link rel="preconnect"[^>]*>\s*','',h)
              h=h.replace(m.group(0),'<link rel="stylesheet" href="fonts/fonts.css">')
          except Exception as e:
              print('font tetap online:',e)
          open(A+'index.html','w',encoding='utf-8').write(h)
          G=["o......o","oo....oo","oooooooo","owkoowko","oooooooo","owwoowwo",".owwwwo.","..okko.."]
          C={'o':'#FFE8802A','w':'#FFFFFFFF','k':'#FF000000'}
          P={}
          for y,r in enumerate(G):
              for x,c in enumerate(r):
                  if c in C:P.setdefault(c,[]).append('M%d,%dh1v1h-1z'%(x,y))
          v='<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="8" android:viewportHeight="8"><path android:fillColor="#FF000000" android:pathData="M0,0h8v8h-8z"/>'
          for c,d in P.items():v+='<path android:fillColor="%s" android:pathData="%s"/>'%(C[c],''.join(d))
          open('app/src/main/res/drawable/ic.xml','w').write(v+'</vector>')
          __PY__
