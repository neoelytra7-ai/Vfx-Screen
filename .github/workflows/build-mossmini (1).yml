      - name: "Write Ui.kt"
        run: |
          cat > app/src/main/java/com/mossmini/app/Ui.kt <<'EOF'
          package com.mossmini.app

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.text.InputType
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale

          object Pal {
              val text = 0xFFEAF5E4.toInt()
              val sub = 0xFFA9CBA2.toInt()
              val card = 0xB0071A11.toInt()
              val stroke = 0x55B9E6A8
              val field = 0x66000000
              val g1 = 0xFF8EE07A.toInt()
              val g2 = 0xFF2FB38A.toInt()
              val gold1 = 0xFFF2D36B.toInt()
              val gold2 = 0xFFE59A4B.toInt()
              val dark = 0xFF06150D.toInt()
              val danger1 = 0xFFE5857A.toInt()
              val danger2 = 0xFFC2544A.toInt()
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()
          fun Context.dpf(v: Int): Float = v * resources.displayMetrics.density

          fun glass(ctx: Context, radiusDp: Int, fill: Int, stroke: Int = Pal.stroke): GradientDrawable =
              GradientDrawable().apply {
                  setColor(fill)
                  cornerRadius = ctx.dpf(radiusDp)
                  setStroke(ctx.dp(1), stroke)
              }

          fun fieldView(ctx: Context, hint: String, value: String, numeric: Boolean = false, multiline: Boolean = false): EditText =
              EditText(ctx).apply {
                  this.hint = hint
                  setText(value)
                  setTextColor(Pal.text)
                  setHintTextColor(Pal.sub)
                  textSize = 15f
                  background = glass(ctx, 14, Pal.field)
                  setPadding(ctx.dp(14), ctx.dp(12), ctx.dp(14), ctx.dp(12))
                  if (numeric) {
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  } else if (multiline) {
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                      minLines = 2
                  }
              }

          /** kind: 0 = green, 1 = gold, 2 = ghost outline, 3 = danger */
          fun pill(ctx: Context, label: String, kind: Int = 0): Button {
              val c1: Int
              val c2: Int
              val tc: Int
              when (kind) {
                  0 -> { c1 = Pal.g1; c2 = Pal.g2; tc = Pal.dark }
                  1 -> { c1 = Pal.gold1; c2 = Pal.gold2; tc = Pal.dark }
                  3 -> { c1 = Pal.danger1; c2 = Pal.danger2; tc = Pal.dark }
                  else -> { c1 = 0x00000000; c2 = 0x00000000; tc = Pal.text }
              }
              val bg = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(c1, c2)).apply {
                  cornerRadius = ctx.dpf(26)
                  if (kind == 2) setStroke(ctx.dp(1), Pal.stroke)
              }
              return Button(ctx).apply {
                  text = label
                  isAllCaps = false
                  textSize = 15f
                  setTextColor(tc)
                  typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  background = RippleDrawable(ColorStateList.valueOf(0x55FFFFFF), bg, null)
                  stateListAnimator = null
                  minHeight = ctx.dp(52)
                  minimumHeight = ctx.dp(52)
                  setPadding(ctx.dp(20), 0, ctx.dp(20), 0)
                  setOnTouchListener { v, e ->
                      if (e.actionMasked == MotionEvent.ACTION_DOWN) {
                          v.animate().scaleX(0.97f).scaleY(0.97f).setDuration(90).start()
                      } else if (e.actionMasked == MotionEvent.ACTION_UP || e.actionMasked == MotionEvent.ACTION_CANCEL) {
                          v.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                      }
                      false
                  }
              }
          }

          fun cardView(ctx: Context, title: String?): LinearLayout =
              LinearLayout(ctx).apply {
                  orientation = LinearLayout.VERTICAL
                  background = glass(ctx, 24, Pal.card)
                  setPadding(ctx.dp(18), ctx.dp(16), ctx.dp(18), ctx.dp(18))
                  if (title != null) {
                      addView(TextView(ctx).apply {
                          text = title.uppercase(Locale.ROOT)
                          textSize = 12f
                          letterSpacing = 0.12f
                          setTextColor(Pal.g1)
                          typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      })
                  }
              }

          fun LinearLayout.put(
              v: View, topDp: Int = 10,
              w: Int = ViewGroup.LayoutParams.MATCH_PARENT,
              h: Int = ViewGroup.LayoutParams.WRAP_CONTENT
          ) {
              addView(v, LinearLayout.LayoutParams(w, h).apply { topMargin = context.dp(topDp) })
          }
          EOF

      - name: "Write MainActivity.kt"
        run: |
          cat > app/src/main/java/com/mossmini/app/MainActivity.kt <<'EOF'
          package com.mossmini.app

          import android.app.Activity
          import android.app.ActivityManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.SharedPreferences
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.provider.MediaStore
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import org.json.JSONObject
          import java.io.File
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private class MF(val id: String, val name: String, val url: String, val size: Long, val sha: String)
              private class Prof(val name: String, val flags: List<String>)

              private val ui = Handler(Looper.getMainLooper())
              private lateinit var prefs: SharedPreferences
              private val libEnv = "/vendor/lib64:/system/lib64:/vendor/lib64/egl"

              @Volatile private var busy = false
              @Volatile private var cancel = false
              @Volatile private var ready = false
              @Volatile private var ignoreRamNow = false
              @Volatile private var proc: Process? = null

              private var files: List<MF> = emptyList()
              private var profiles: List<Prof> = emptyList()
              private var reqFlags: List<String> = emptyList()
              private var peakRssMb = 0L
              private var sdCommit = ""
              private var testInfo = ""

              private lateinit var compatView: TextView
              private lateinit var status: TextView
              private lateinit var bar: ProgressBar
              private lateinit var logView: TextView
              private lateinit var img: ImageView
              private lateinit var btnDl: Button
              private lateinit var btnGen: Button
              private lateinit var prompt: EditText
              private lateinit var steps: EditText
              private lateinit var cfg: EditText
              private lateinit var sizeSpin: Spinner

              private val modelDir: File get() = File(filesDir, "models").apply { mkdirs() }
              private fun fileOf(m: MF): File = File(modelDir, m.name)
              private fun partOf(m: MF): File = File(modelDir, m.name + ".part")

              // ---------- small helpers ----------
              private fun log(s: String) {
                  ui.post {
                      logView.append(s + "\n")
                      if (logView.length() > 24000) logView.text = logView.text.toString().takeLast(14000)
                  }
              }

              private fun availMemMb(): Long = try {
                  File("/proc/meminfo").readLines().first { it.startsWith("MemAvailable") }
                      .filter { it.isDigit() }.toLong() / 1024
              } catch (e: Exception) { -1L }

              private fun totalMemMb(): Long = try {
                  val mi = ActivityManager.MemoryInfo()
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  am.getMemoryInfo(mi)
                  mi.totalMem shr 20
              } catch (e: Exception) { -1L }

              private fun freeDiskMb(): Long = try { StatFs(modelDir.path).availableBytes shr 20 } catch (e: Exception) { -1L }

              private fun stamp(m: MF, f: File): String = f.length().toString() + ":" + f.lastModified() + ":" + m.sha

              private fun isVerified(m: MF): Boolean {
                  val f = fileOf(m)
                  return f.exists() && f.length() == m.size && prefs.getString("v_" + m.id, "") == stamp(m, f)
              }

              private fun flagFor(id: String): String = when (id) {
                  "dit" -> "--diffusion-model"
                  "te" -> "--llm"
                  "vae" -> "--vae"
                  else -> "--tokenizer"
              }

              private fun loadManifest() {
                  val j = JSONObject(assets.open("manifest.json").bufferedReader().use { it.readText() })
                  sdCommit = j.optString("sd_commit")
                  peakRssMb = j.optLong("peak_rss_mb", 0L)
                  testInfo = j.optString("smoke")
                  val rq = j.getJSONArray("required_flags")
                  reqFlags = List(rq.length()) { i -> rq.getString(i) }
                  val pa = j.getJSONArray("profiles")
                  profiles = List(pa.length()) { i ->
                      val o = pa.getJSONObject(i)
                      val fa = o.getJSONArray("flags")
                      Prof(o.getString("name"), List(fa.length()) { k -> fa.getString(k) })
                  }
                  val fl = j.getJSONArray("files")
                  files = List(fl.length()) { i ->
                      val o = fl.getJSONObject(i)
                      MF(o.getString("id"), o.getString("name"), o.getString("url"), o.getLong("size"), o.getString("sha256"))
                  }
              }

              private fun engineHelp(bin: File): String? = try {
                  val pb = ProcessBuilder(bin.absolutePath, "--help").redirectErrorStream(true)
                  pb.environment()["LD_LIBRARY_PATH"] = libEnv
                  val p = pb.start()
                  val txt = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  txt
              } catch (e: Exception) {
                  log("Engine failed to start: $e")
                  null
              }

              // ---------- compatibility check ----------
              private fun preflight() {
                  val lines = ArrayList<String>()
                  var allOk = true
                  fun item(ok: Boolean, text: String) {
                      lines.add((if (ok) "\u2713 " else "\u2717 ") + text)
                      if (!ok) allOk = false
                  }

                  val abiOk = Build.SUPPORTED_64_BIT_ABIS.contains("arm64-v8a")
                  item(abiOk, "CPU is arm64-v8a" + (if (abiOk) "" else " (this phone: " + Build.SUPPORTED_ABIS.joinToString() + ")"))

                  val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                  val binOk = bin.exists() && bin.canExecute()
                  item(binOk, "Engine file present (" + (bin.length() shr 10) + " KB)")
                  if (binOk) {
                      val help = engineHelp(bin)
                      if (help == null) {
                          item(false, "Engine does not start (see log)")
                      } else {
                          val missing = reqFlags.filter { !help.contains(it) }
                          item(missing.isEmpty(),
                              if (missing.isEmpty()) "Engine supports all " + reqFlags.size + " flags this app needs"
                              else "Engine is missing: " + missing.joinToString(" "))
                      }
                  }

                  var needBytes = 0L
                  for (m in files) {
                      if (isVerified(m)) continue
                      val have = maxOf(fileOf(m).length(), partOf(m).length())
                      needBytes += maxOf(0L, m.size - have)
                  }
                  val needMb = needBytes shr 20
                  val freeMb = freeDiskMb()
                  item(freeMb >= needMb + 300, "Storage: $freeMb MB free, $needMb MB still to download")

                  val avail = availMemMb()
                  val total = totalMemMb()
                  val needRam = (peakRssMb * 1.15).toLong() + 200
                  val ramOk = avail >= needRam
                  val ramText = "RAM: $avail MB available (of $total MB), needs about $needRam MB (peak measured in CI: $peakRssMb MB)"
                  if (ramOk) item(true, ramText)
                  else if (ignoreRamNow) item(true, ramText + " - IGNORED by you, may crash")
                  else item(false, ramText + ". Close other apps, then Re-check.")

                  for (m in files) {
                      val st = when {
                          isVerified(m) -> "verified (SHA-256 matches CI-tested file)"
                          fileOf(m).exists() && fileOf(m).length() == m.size -> "downloaded, not verified yet"
                          partOf(m).exists() -> "partial: " + (partOf(m).length() shr 20) + " of " + (m.size shr 20) + " MB"
                          else -> "not downloaded (" + (m.size shr 20) + " MB)"
                      }
                      item(isVerified(m), m.name + ": " + st)
                  }

                  ready = allOk
                  val head = if (allOk) "READY - everything is compatible and verified" else "NOT READY - fix the red items"
                  val txt = head + "\n\n" + lines.joinToString("\n")
                  ui.post {
                      compatView.text = txt
                  }
                  refreshButtons()
              }

              private fun refreshButtons() {
                  ui.post {
                      btnGen.isEnabled = ready && !busy
                      btnGen.alpha = if (btnGen.isEnabled) 1f else 0.5f
                      btnDl.isEnabled = !busy
                      btnDl.alpha = if (busy) 0.5f else 1f
                  }
              }

              // ---------- download + verify ----------
              private fun setProgress(done: Long, total: Long, label: String) {
                  ui.post {
                      if (total > 0) { bar.max = 1000; bar.progress = (done * 1000 / total).toInt() }
                      status.text = label + ": " + (done shr 20) + " / " + (total shr 20) + " MB"
                  }
              }

              private fun sha256(f: File, label: String): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  val total = f.length()
                  var done = 0L
                  var lastUi = 0L
                  f.inputStream().use { inp ->
                      val buf = ByteArray(1 shl 20)
                      while (true) {
                          if (cancel) throw RuntimeException("cancelled")
                          val n = inp.read(buf)
                          if (n < 0) break
                          md.update(buf, 0, n)
                          done += n
                          if (done - lastUi > (16L shl 20)) { lastUi = done; setProgress(done, total, "Verifying $label") }
                      }
                  }
                  return md.digest().joinToString("") { b -> String.format("%02x", b) }
              }

              private fun download(u: String, dest: File, part: File, expected: Long) {
                  if (part.exists() && part.length() > expected) part.delete()
                  val have = if (part.exists()) part.length() else 0L
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 30000
                  c.readTimeout = 60000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "MossMini/1.0")
                  if (have > 0) c.setRequestProperty("Range", "bytes=$have-")
                  val code = c.responseCode
                  if (code == 416) { dest.delete(); part.renameTo(dest); return }
                  if (code !in 200..299) throw RuntimeException("HTTP $code")
                  val append = code == 206
                  val total = expected
                  val free = StatFs(modelDir.path).availableBytes
                  val need = total - (if (append) have else 0L)
                  if (need > free - (200L shl 20)) throw RuntimeException("Not enough storage: need " + (need shr 20) + " MB, free " + (free shr 20) + " MB")
                  log("Downloading " + dest.name + " (" + (total shr 20) + " MB)")
                  RandomAccessFile(part, "rw").use { raf ->
                      if (append) raf.seek(have) else raf.setLength(0)
                      var done = if (append) have else 0L
                      var lastUi = 0L
                      c.inputStream.use { inp ->
                          val buf = ByteArray(1 shl 20)
                          while (true) {
                              if (cancel) throw RuntimeException("cancelled")
                              val n = inp.read(buf)
                              if (n < 0) break
                              raf.write(buf, 0, n)
                              done += n
                              if (done - lastUi > (2L shl 20)) { lastUi = done; setProgress(done, total, dest.name) }
                          }
                      }
                  }
                  if (part.length() != expected) throw RuntimeException("incomplete: " + part.length() + " of " + expected + " bytes")
                  dest.delete()
                  if (!part.renameTo(dest)) throw RuntimeException("could not finalize file")
              }

              private fun downloadAll() {
                  if (busy) { log("Busy."); return }
                  busy = true
                  cancel = false
                  refreshButtons()
                  try {
                      for (m in files) {
                          if (cancel) break
                          if (isVerified(m)) { log(m.name + ": already verified"); continue }
                          val f = fileOf(m)
                          if (!(f.exists() && f.length() == m.size)) {
                              var ok = false
                              for (attempt in 1..4) {
                                  if (cancel) break
                                  try {
                                      download(m.url, f, partOf(m), m.size)
                                      ok = true
                                      break
                                  } catch (e: Exception) {
                                      if (cancel) break
                                      log(m.name + " attempt " + attempt + " failed: " + e)
                                      try { Thread.sleep(2000L * attempt) } catch (ie: InterruptedException) { }
                                  }
                              }
                              if (!ok) { log(m.name + ": download did not finish. Tap Download again to resume."); continue }
                          }
                          if (f.length() != m.size) {
                              log(m.name + ": wrong size, deleted.")
                              f.delete()
                              continue
                          }
                          val h = sha256(f, m.name)
                          if (h == m.sha) {
                              prefs.edit().putString("v_" + m.id, stamp(m, f)).apply()
                              log(m.name + ": SHA-256 OK")
                          } else {
                              log(m.name + ": SHA-256 MISMATCH. Expected " + m.sha.take(12) + ", got " + h.take(12) + ". File deleted (corrupt, or changed upstream after this app was built).")
                              f.delete()
                              prefs.edit().remove("v_" + m.id).apply()
                          }
                      }
                      log(if (cancel) "Cancelled. Progress is kept; tap Download to resume." else "Download + verify step finished.")
                  } catch (e: Exception) {
                      if (cancel) log("Cancelled.") else log("Download/verify error: $e")
                  } finally {
                      busy = false
                      ui.post { status.text = ""; bar.progress = 0 }
                      preflight()
                  }
              }

              // ---------- generate ----------
              private fun generate() {
                  if (busy) return
                  val text = prompt.text.toString().trim()
                  if (text.isEmpty()) { log("Write a prompt first."); return }
                  val size = (sizeSpin.selectedItem as String).toInt()
                  val st = (steps.text.toString().toIntOrNull() ?: 20).coerceIn(1, 50)
                  val c = (cfg.text.toString().toDoubleOrNull() ?: 3.0).coerceIn(0.0, 20.0)
                  thread { runGenerate(text, size, st, c) }
              }

              private fun runGenerate(text: String, size: Int, st: Int, c: Double) {
                  if (busy) return
                  busy = true
                  cancel = false
                  refreshButtons()
                  try {
                      preflight()
                      if (!ready) { log("Not generating: a compatibility check failed (see the list at the top)."); return }
                      val last = prefs.getString("last_profile", "") ?: ""
                      val order = profiles.sortedBy { if (it.name == last) 0 else 1 }
                      var produced = false
                      for (p in order) {
                          if (cancel) break
                          log("--- Mode: " + p.name)
                          val res = runOnce(p, text, size, st, c)
                          if (res == 0) {
                              prefs.edit().putString("last_profile", p.name).apply()
                              produced = true
                              break
                          }
                          if (res == 2) break
                          log("This mode did not produce an image. Trying the next mode.")
                      }
                      if (!produced && !cancel) log("No mode produced an image. Use Copy log and send it for debugging.")
                  } catch (e: Exception) {
                      log("ERR: $e")
                  } finally {
                      proc = null
                      busy = false
                      refreshButtons()
                  }
              }

              /** 0 = image made, 1 = failed (try next mode), 2 = stop everything */
              private fun runOnce(p: Prof, text: String, size: Int, st: Int, c: Double): Int {
                  val out = File(cacheDir, "out.png")
                  out.delete()
                  val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                  val cmd = ArrayList<String>()
                  cmd.add(bin.absolutePath)
                  for (m in files) {
                      cmd.add(flagFor(m.id))
                      cmd.add(fileOf(m).absolutePath)
                  }
                  cmd.addAll(p.flags)
                  cmd.addAll(listOf("-p", text, "-W", size.toString(), "-H", size.toString(),
                      "--steps", st.toString(), "--cfg-scale", c.toString(), "-o", out.absolutePath, "-v"))
                  log("RUN: " + cmd.joinToString(" "))
                  val t0 = System.currentTimeMillis()
                  val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                  pb.environment()["LD_LIBRARY_PATH"] = libEnv
                  val pr = pb.start()
                  proc = pr
                  pr.inputStream.bufferedReader().forEachLine { line -> log(line) }
                  val code = pr.waitFor()
                  log("exit=" + code + " | " + ((System.currentTimeMillis() - t0) / 1000) + " s")
                  if (cancel) { log("Stopped."); return 2 }
                  if (code == 137 || code == 9) {
                      log("Android killed the engine (out of memory). Close other apps and try again.")
                      return 2
                  }
                  if (!out.exists()) return 1
                  val bmp = BitmapFactory.decodeFile(out.absolutePath)
                  if (bmp == null) { log("Engine wrote an unreadable image."); return 1 }
                  if (looksBlank(bmp)) { log("The image is blank/flat, so this mode did not really work."); return 1 }
                  ui.post { showImage(bmp) }
                  saveToGallery(out)
                  return 0
              }

              private fun looksBlank(b: Bitmap): Boolean {
                  val stepX = maxOf(1, b.width / 32)
                  val stepY = maxOf(1, b.height / 32)
                  var sum = 0.0
                  var sq = 0.0
                  var n = 0
                  var y = 0
                  while (y < b.height) {
                      var x = 0
                      while (x < b.width) {
                          val px = b.getPixel(x, y)
                          val l = (((px shr 16) and 0xff) + ((px shr 8) and 0xff) + (px and 0xff)) / 3.0
                          sum += l
                          sq += l * l
                          n++
                          x += stepX
                      }
                      y += stepY
                  }
                  if (n == 0) return true
                  val mean = sum / n
                  return (sq / n - mean * mean) < 9.0
              }

              private fun showImage(bmp: Bitmap) {
                  img.setImageBitmap(bmp)
                  img.visibility = View.VISIBLE
              }

              private fun saveToGallery(f: File) {
                  try {
                      val name = "mossmini_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".png"
                      val v = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/MossMini")
                      }
                      val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return
                      contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { it.copyTo(o) } }
                      log("Saved to Pictures/MossMini/" + name)
                  } catch (e: Exception) {
                      log("Gallery save failed: $e")
                  }
              }

              // ---------- UI ----------
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Pal.dark
                  window.navigationBarColor = Pal.dark

                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val wc = ViewGroup.LayoutParams.WRAP_CONTENT

                  try {
                      loadManifest()
                  } catch (e: Exception) {
                      val tv = TextView(this)
                      tv.text = "manifest.json is missing or broken in this build: " + e
                      tv.setTextColor(Pal.text)
                      tv.setPadding(dp(20), dp(60), dp(20), dp(20))
                      setContentView(tv)
                      return
                  }

                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.setPadding(dp(16), dp(40), dp(16), dp(40))
                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(Pal.dark)
                  scroll.addView(content, ViewGroup.LayoutParams(mp, wc))

                  val title = TextView(this)
                  title.text = "MossMini"
                  title.textSize = 34f
                  title.setTextColor(Pal.text)
                  title.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  content.addView(title)

                  val sub = TextView(this)
                  sub.text = "MOSS-Image SFT, smallest build. Every file is SHA-256 checked against the exact files tested in CI."
                  sub.textSize = 13f
                  sub.setTextColor(Pal.sub)
                  sub.setPadding(0, dp(4), 0, dp(8))
                  content.addView(sub)

                  val info = TextView(this)
                  info.text = "Engine commit " + sdCommit.take(8) + "\nCI: " + testInfo
                  info.textSize = 11f
                  info.setTextColor(Pal.sub)
                  info.typeface = Typeface.MONOSPACE
                  content.addView(info)

                  // --- compatibility card
                  val cCompat = cardView(this, "Compatibility")
                  compatView = TextView(this)
                  compatView.textSize = 12.5f
                  compatView.setTextColor(Pal.text)
                  compatView.typeface = Typeface.MONOSPACE
                  compatView.text = "Checking..."
                  cCompat.put(compatView, 12)
                  val ignoreRam = CheckBox(this)
                  ignoreRam.text = "Ignore the RAM check (may crash)"
                  ignoreRam.setTextColor(Pal.sub)
                  ignoreRam.setOnCheckedChangeListener { _, v ->
                      ignoreRamNow = v
                      if (!busy) thread { preflight() }
                  }
                  cCompat.put(ignoreRam, 8)
                  val btnRecheck = pill(this, "Re-check", 2)
                  btnRecheck.setOnClickListener { if (!busy) thread { preflight() } }
                  cCompat.put(btnRecheck, 10)
                  content.addView(cCompat, LinearLayout.LayoutParams(mp, wc).apply { topMargin = dp(14) })

                  // --- files card
                  val cFiles = cardView(this, "Model files")
                  val totalMb = files.sumOf { it.size } shr 20
                  val fl = TextView(this)
                  fl.text = "4 files, about " + totalMb + " MB in total. Downloads resume if interrupted."
                  fl.textSize = 13f
                  fl.setTextColor(Pal.sub)
                  cFiles.put(fl, 10)
                  btnDl = pill(this, "Download + verify all files", 1)
                  btnDl.setOnClickListener { if (!busy) thread { downloadAll() } }
                  cFiles.put(btnDl, 12)
                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = 1000
                  bar.progressTintList = ColorStateList.valueOf(Pal.g1)
                  cFiles.put(bar, 12, h = dp(8))
                  status = TextView(this)
                  status.textSize = 12f
                  status.setTextColor(Pal.sub)
                  cFiles.put(status, 6)
                  val btnStopDl = pill(this, "Stop", 3)
                  btnStopDl.setOnClickListener {
                      cancel = true
                      proc?.destroyForcibly()
                      log("Stop requested.")
                  }
                  cFiles.put(btnStopDl, 10)
                  content.addView(cFiles, LinearLayout.LayoutParams(mp, wc).apply { topMargin = dp(14) })

                  // --- create card
                  val cCreate = cardView(this, "Create")
                  prompt = fieldView(this, "Describe your image", "a lighthouse on a cliff at dawn, volumetric light, detailed", multiline = true)
                  cCreate.put(prompt, 12)
                  val l1 = TextView(this)
                  l1.text = "Size (px)"
                  l1.textSize = 11f
                  l1.setTextColor(Pal.sub)
                  cCreate.put(l1, 12)
                  sizeSpin = Spinner(this)
                  sizeSpin.adapter = ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, listOf("512", "384", "256"))
                  cCreate.put(sizeSpin, 4)
                  val l2 = TextView(this)
                  l2.text = "Steps"
                  l2.textSize = 11f
                  l2.setTextColor(Pal.sub)
                  cCreate.put(l2, 12)
                  steps = fieldView(this, "Steps", "20", true)
                  cCreate.put(steps, 4)
                  val l3 = TextView(this)
                  l3.text = "CFG scale"
                  l3.textSize = 11f
                  l3.setTextColor(Pal.sub)
                  cCreate.put(l3, 12)
                  cfg = fieldView(this, "CFG", "3.0", true)
                  cCreate.put(cfg, 4)
                  btnGen = pill(this, "Generate", 0)
                  btnGen.isEnabled = false
                  btnGen.alpha = 0.5f
                  btnGen.setOnClickListener { generate() }
                  cCreate.put(btnGen, 16)
                  val btnStopGen = pill(this, "Stop", 3)
                  btnStopGen.setOnClickListener {
                      cancel = true
                      proc?.destroyForcibly()
                      log("Stop requested.")
                  }
                  cCreate.put(btnStopGen, 10)
                  content.addView(cCreate, LinearLayout.LayoutParams(mp, wc).apply { topMargin = dp(14) })

                  // --- result
                  img = ImageView(this)
                  img.adjustViewBounds = true
                  img.visibility = View.GONE
                  content.addView(img, LinearLayout.LayoutParams(mp, wc).apply { topMargin = dp(14) })

                  // --- log card
                  val cLog = cardView(this, "Log")
                  logView = TextView(this)
                  logView.textSize = 11f
                  logView.setTextColor(Pal.sub)
                  logView.typeface = Typeface.MONOSPACE
                  logView.setTextIsSelectable(true)
                  cLog.put(logView, 12)
                  val btnCopy = pill(this, "Copy log", 2)
                  btnCopy.setOnClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("MossMini log", logView.text.toString()))
                      log("Log copied.")
                  }
                  cLog.put(btnCopy, 10)
                  content.addView(cLog, LinearLayout.LayoutParams(mp, wc).apply { topMargin = dp(14) })

                  setContentView(scroll)
                  log("MossMini " + Build.MODEL + " | Android " + Build.VERSION.SDK_INT)
                  thread { preflight() }
              }

              override fun onDestroy() {
                  cancel = true
                  proc?.destroyForcibly()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build signed release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Show the real error (only if the build failed)
        if: failure()
        run: |
          {
            echo "### Build failed - first errors"
            echo '```'
            grep -E -A3 '^e: |What went wrong|error:' build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log + generated sources (only if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            build.log
            app/src/main/java
            app/build.gradle.kts
          retention-days: 7

      - name: "Verify and name the APK"
        run: |
          APK="MossMini-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" > cert.txt
          head -3 cert.txt
          unzip -l "$APK" > apk_list.txt
          grep -q 'lib/arm64-v8a/libsdcli.so' apk_list.txt || { echo "::error::sd-cli missing from APK"; exit 1; }
          grep -q 'assets/manifest.json' apk_list.txt || { echo "::error::manifest.json missing from APK"; exit 1; }
          sha256sum "$APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python3 - <<'PY'
          import json
          m = json.load(open("manifest/manifest.json"))
          lines = ["MossMini: MOSS-Image SFT (smallest build), proven in CI.", "",
                   "- stable-diffusion.cpp commit: `%s`" % m["sd_commit"],
                   "- CI end-to-end test: %s" % m["smoke"],
                   "- Measured peak RAM in CI: %d MB" % m["peak_rss_mb"], "", "Files the app downloads (SHA-256 checked on the phone):"]
          for f in m["files"]:
              lines.append("- `%s` - %d MB - `%s`" % (f["name"], f["size"] >> 20, f["sha256"]))
          open("release_notes.md", "w").write("\n".join(lines) + "\n")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mini-v${{ github.run_number }}
          name: MossMini ${{ env.VERSION_NAME }}
          body_path: release_notes.md
          files: |
            MossMini-${{ env.VERSION_NAME }}.apk
            SHA256SUMS.txt
          make_latest: false

      - uses: actions/upload-artifact@v4
        with:
          name: MossMini-apk
          path: MossMini-*.apk
          retention-days: 14
