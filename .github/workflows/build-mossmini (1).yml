# Save as: .github/workflows/build-mossmini.yml
#
# MossMini: a tiny Android app that runs ONE thing: MOSS-Image SFT, smallest build
#   DiT  MOSS-Image-SFT-Q2_K.gguf        (leejet/MOSS-Image-SFT-GGUF)
#   LLM  Qwen3.5-9B-UD-IQ2_XXS.gguf      (unsloth/Qwen3.5-9B-GGUF)
#   VAE  flux2-vae.safetensors           (Comfy-Org/MOSS-Image)
#   TOK  tokenizer.json                  (OpenMOSS-Team/MOSS-Image-Base)
#
# HOW COMPATIBILITY IS PROVEN (nothing is guessed):
#  1. CI pins the exact stable-diffusion.cpp commit and the exact Hugging Face revisions.
#  2. CI downloads the 4 files, builds sd-cli for x86, and generates a real 512x512 image with
#     the SAME flags the app uses. The build STOPS if that fails or the image is blank.
#  3. CI records size + SHA-256 of every file and the measured peak RAM into manifest.json,
#     which is baked into the APK.
#  4. On the phone the app re-checks: CPU ABI, engine runs and has every flag, free storage,
#     free RAM vs the measured peak, and SHA-256 of every downloaded file. Generate stays
#     disabled until everything is green.
#  5. At generate time the app tries the GPU mode first and falls back to the CPU mode
#     (the mode CI actually tested) if the GPU mode fails.
#
# NO SECRETS NEEDED. The signing key is created on the first run and kept in the repo cache
# (weekly keep-alive job). Optional secrets: KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS.
# Manual run options: skip_smoke_test (faster, but then nothing is proven end-to-end).

name: Build MossMini APK

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      sd_cpp_ref:
        description: "stable-diffusion.cpp branch/tag/commit"
        default: "master"
      skip_smoke_test:
        description: "Skip the end-to-end x86 test (NOT recommended)"
        type: boolean
        default: false
      allow_new_key:
        description: "Allow creating a NEW signing key"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mossmini
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}
  REQ_FLAGS: "--diffusion-model --llm --vae --tokenizer --backend --params-backend --cfg-scale --steps"
  COMMON_FLAGS: "--params-backend te=disk,diffusion=disk,vae=cpu"

jobs:
  keepalive:
    name: Keep signing key cache alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        id: k
        with:
          path: ~/.mossmini-key
          key: mossmini-signing-key-v1
      - run: |
          if [ "${{ steps.k.outputs.cache-hit }}" = "true" ]; then
            echo "Signing key cache is alive."
          else
            echo "::warning::Signing key cache NOT found. The next build will refuse to make a new key unless allow_new_key=true."
          fi

  prep:
    name: Pin exact versions (sd.cpp commit + Hugging Face revisions)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sd_commit: ${{ steps.r.outputs.sd_commit }}
      rev_dit: ${{ steps.r.outputs.rev_dit }}
      rev_te: ${{ steps.r.outputs.rev_te }}
      rev_vae: ${{ steps.r.outputs.rev_vae }}
      rev_tok: ${{ steps.r.outputs.rev_tok }}
    steps:
      - name: Resolve versions
        id: r
        env:
          SD_REF: ${{ inputs.sd_cpp_ref || 'master' }}
        run: |
          set -e
          URL=https://github.com/leejet/stable-diffusion.cpp
          C=$(git ls-remote "$URL" "refs/heads/$SD_REF" | head -1 | cut -f1)
          [ -z "$C" ] && C=$(git ls-remote "$URL" "refs/tags/$SD_REF" | head -1 | cut -f1)
          [ -z "$C" ] && C="$SD_REF"
          echo "sd.cpp commit: $C"
          rev() {
            V=$(curl -fsS --retry 5 --retry-all-errors "https://huggingface.co/api/models/$1" | jq -r .sha)
            if [ -z "$V" ] || [ "$V" = "null" ]; then echo "::error::cannot resolve Hugging Face revision of $1"; exit 1; fi
            echo "$V"
          }
          RD=$(rev leejet/MOSS-Image-SFT-GGUF)
          RT=$(rev unsloth/Qwen3.5-9B-GGUF)
          RV=$(rev Comfy-Org/MOSS-Image)
          RK=$(rev OpenMOSS-Team/MOSS-Image-Base)
          {
            echo "sd_commit=$C"
            echo "rev_dit=$RD"
            echo "rev_te=$RT"
            echo "rev_vae=$RV"
            echo "rev_tok=$RK"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Pinned versions"
            echo "- stable-diffusion.cpp: \`$C\`"
            echo "- DiT repo rev: \`$RD\`"
            echo "- Qwen3.5 repo rev: \`$RT\`"
            echo "- VAE repo rev: \`$RV\`"
            echo "- tokenizer repo rev: \`$RK\`"
          } >> "$GITHUB_STEP_SUMMARY"

  native:
    name: Build sd-cli (arm64, OpenCL/Adreno + NEON)
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SD_COMMIT: ${{ needs.prep.outputs.sd_commit }}
    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake git

      - name: "Fetch stable-diffusion.cpp at the pinned commit and check it"
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp
          git checkout "$SD_COMMIT"
          git submodule update --init --recursive
          cd ..
          for f in diffusion-model llm vae tokenizer backend params-backend cfg-scale steps; do
            grep -rqF -- "--$f" sdcpp/examples || { echo "::error::sd.cpp @ $SD_COMMIT has no --$f option"; exit 1; }
          done
          grep -rIqi "moss" sdcpp/src || { echo "::error::sd.cpp @ $SD_COMMIT has no MOSS-Image support"; exit 1; }
          echo "sd.cpp @ $SD_COMMIT knows MOSS-Image and every flag the app uses."

      - name: "Build OpenCL headers + ICD stub (link-time only)"
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          TC="$NDK/build/cmake/android.toolchain.cmake"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git
          cmake -S OpenCL-Headers -B oh -DCMAKE_INSTALL_PREFIX="$HOME/ocl"
          cmake --build oh --target install
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git
          cmake -S OpenCL-ICD-Loader -B ol -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 \
            -DANDROID_STL=c++_static \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$HOME/ocl/include" \
            -DCMAKE_INSTALL_PREFIX="$HOME/ocl" -DCMAKE_BUILD_TYPE=Release
          cmake --build ol --target install

      - name: "Compile sd-cli"
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S sdcpp -B sdcpp/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON -DGGML_OPENCL_EMBED_KERNELS=ON \
            -DOpenCL_INCLUDE_DIR="$HOME/ocl/include" -DOpenCL_LIBRARY="$HOME/ocl/lib/libOpenCL.so" \
            -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_EXAMPLES=ON
          cmake --build sdcpp/build --target sd-cli || cmake --build sdcpp/build --target sd
          BIN=$(find sdcpp/build -type f \( -name sd-cli -o -name sd \) | head -1)
          test -n "$BIN"
          mkdir -p out
          cp "$BIN" out/libsdcli.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/libsdcli.so
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: sdcli
          path: out/libsdcli.so
          retention-days: 7

  smoke:
    name: Verify model files + end-to-end test (x86)
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SD_COMMIT: ${{ needs.prep.outputs.sd_commit }}
      RD: ${{ needs.prep.outputs.rev_dit }}
      RT: ${{ needs.prep.outputs.rev_te }}
      RV: ${{ needs.prep.outputs.rev_vae }}
      RK: ${{ needs.prep.outputs.rev_tok }}
      SKIP_SMOKE: ${{ inputs.skip_smoke_test && 'true' || 'false' }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake git time jq

      - name: "Download the 4 model files (pinned revisions)"
        run: |
          set -e
          mkdir -p m
          dl() { curl -fL --retry 6 --retry-delay 5 --retry-all-errors -o "m/$1" "$2"; ls -l "m/$1"; }
          dl MOSS-Image-SFT-Q2_K.gguf "https://huggingface.co/leejet/MOSS-Image-SFT-GGUF/resolve/$RD/MOSS-Image-SFT-Q2_K.gguf"
          dl Qwen3.5-9B-UD-IQ2_XXS.gguf "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/$RT/Qwen3.5-9B-UD-IQ2_XXS.gguf"
          dl flux2-vae.safetensors "https://huggingface.co/Comfy-Org/MOSS-Image/resolve/$RV/vae/flux2-vae.safetensors"
          dl tokenizer.json "https://huggingface.co/OpenMOSS-Team/MOSS-Image-Base/resolve/$RK/tokenizer/tokenizer.json"
          head -c 4 m/MOSS-Image-SFT-Q2_K.gguf | grep -q GGUF || { echo "::error::DiT is not a GGUF file"; exit 1; }
          head -c 4 m/Qwen3.5-9B-UD-IQ2_XXS.gguf | grep -q GGUF || { echo "::error::LLM is not a GGUF file"; exit 1; }
          head -c 1 m/tokenizer.json | grep -q '{' || { echo "::error::tokenizer.json is not JSON"; exit 1; }
          df -h .

      - name: "Build x86 sd-cli at the same commit"
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then echo "smoke test skipped"; exit 0; fi
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp
          git checkout "$SD_COMMIT"
          git submodule update --init --recursive
          cd ..
          cmake -S sdcpp -B sdcpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON
          cmake --build sdcpp/build --target sd-cli || cmake --build sdcpp/build --target sd
          BIN=$(find sdcpp/build -type f \( -name sd-cli -o -name sd \) | head -1)
          test -n "$BIN"
          cp "$BIN" ./sdcli-x86
          ls -l ./sdcli-x86

      - name: "Check that the engine has every flag the app uses"
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then exit 0; fi
          ./sdcli-x86 --help > help.txt 2>&1 || true
          wc -l help.txt
          for f in $REQ_FLAGS; do
            grep -qF -- "$f" help.txt || { echo "::error::engine --help does not list $f"; exit 1; }
          done
          echo "all required flags present"

      - name: "END-TO-END TEST: real 512x512 image with the app's exact flags (CPU mode)"
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then echo 4500 > peak_mb.txt; echo "SKIPPED (no end-to-end proof for this build)" > smoke_info.txt; exit 0; fi
          set -o pipefail
          T0=$(date +%s)
          /usr/bin/time -v -o time.txt ./sdcli-x86 \
            --diffusion-model m/MOSS-Image-SFT-Q2_K.gguf \
            --llm m/Qwen3.5-9B-UD-IQ2_XXS.gguf \
            --vae m/flux2-vae.safetensors \
            --tokenizer m/tokenizer.json \
            --backend cpu $COMMON_FLAGS \
            -p "a lighthouse on a cliff at dawn, volumetric light" \
            -W 512 -H 512 --steps 2 --cfg-scale 3.0 -o smoke.png -v 2>&1 | tee smoke.log
          SECS=$(( $(date +%s) - T0 ))
          KB=$(grep "Maximum resident" time.txt | awk '{print $NF}')
          MB=$(( KB / 1024 ))
          test "$MB" -gt 100
          echo "$MB" > peak_mb.txt
          test -s smoke.png
          python3 - <<'PY'
          import math, struct, zlib
          data = open("smoke.png", "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          pos = 8
          idat = b""
          while pos < len(data):
              ln = struct.unpack(">I", data[pos:pos + 4])[0]
              typ = data[pos + 4:pos + 8]
              body = data[pos + 8:pos + 8 + ln]
              pos += 12 + ln
              if typ == b"IHDR":
                  w, h, bd, ct, _, _, il = struct.unpack(">IIBBBBB", body)
              elif typ == b"IDAT":
                  idat += body
          assert bd == 8 and il == 0 and ct in (0, 2, 6), "unsupported PNG layout %r" % ((bd, ct, il),)
          ch = {0: 1, 2: 3, 6: 4}[ct]
          stride = w * ch
          raw = zlib.decompress(idat)
          prev = bytearray(stride)
          rows = []
          i = 0
          for y in range(h):
              f = raw[i]
              line = bytearray(raw[i + 1:i + 1 + stride])
              i += 1 + stride
              if f == 1:
                  for x in range(ch, stride):
                      line[x] = (line[x] + line[x - ch]) & 255
              elif f == 2:
                  for x in range(stride):
                      line[x] = (line[x] + prev[x]) & 255
              elif f == 3:
                  for x in range(stride):
                      a = line[x - ch] if x >= ch else 0
                      line[x] = (line[x] + ((a + prev[x]) >> 1)) & 255
              elif f == 4:
                  for x in range(stride):
                      a = line[x - ch] if x >= ch else 0
                      b = prev[x]
                      c = prev[x - ch] if x >= ch else 0
                      p = a + b - c
                      pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                      pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                      line[x] = (line[x] + pr) & 255
              rows.append(line)
              prev = line
          n = 0
          s1 = 0.0
          s2 = 0.0
          k3 = min(ch, 3)
          for y in range(0, h, 8):
              row = rows[y]
              for x in range(0, w, 8):
                  k = x * ch
                  v = sum(row[k:k + k3]) / float(k3)
                  s1 += v
                  s2 += v * v
                  n += 1
          mean = s1 / n
          sd = math.sqrt(max(0.0, s2 / n - mean * mean))
          print("image", w, h, "channels", ch, "pixel stddev", round(sd, 2))
          raise SystemExit(0 if (w == 512 and h == 512 and sd > 8) else 1)
          PY
          echo "end-to-end test passed: 512x512, 2 steps, ${SECS}s, peak RAM ${MB} MB (x86 CPU mode)" | tee smoke_info.txt

      - name: "Show the log tail if the test failed"
        if: failure()
        run: |
          {
            echo "### End-to-end test FAILED - last log lines"
            echo '```'
            tail -n 60 smoke.log 2>/dev/null || echo "(no smoke.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Write manifest.json (sizes, SHA-256, measured RAM)"
        run: |
          mkdir -p manifest
          python3 - <<'PY'
          import hashlib, json, os

          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(1 << 20), b""):
                      h.update(b)
              return h.hexdigest()

          spec = [
              ("dit", "MOSS-Image-SFT-Q2_K.gguf", "leejet/MOSS-Image-SFT-GGUF", os.environ["RD"], "MOSS-Image-SFT-Q2_K.gguf"),
              ("te", "Qwen3.5-9B-UD-IQ2_XXS.gguf", "unsloth/Qwen3.5-9B-GGUF", os.environ["RT"], "Qwen3.5-9B-UD-IQ2_XXS.gguf"),
              ("vae", "flux2-vae.safetensors", "Comfy-Org/MOSS-Image", os.environ["RV"], "vae/flux2-vae.safetensors"),
              ("tok", "tokenizer.json", "OpenMOSS-Team/MOSS-Image-Base", os.environ["RK"], "tokenizer/tokenizer.json"),
          ]
          files = []
          for fid, name, repo, rev, path in spec:
              p = "m/" + name
              files.append({
                  "id": fid, "name": name,
                  "url": "https://huggingface.co/%s/resolve/%s/%s" % (repo, rev, path),
                  "size": os.path.getsize(p), "sha256": sha(p),
              })
          base = os.environ["COMMON_FLAGS"].split()
          manifest = {
              "sd_commit": os.environ["SD_COMMIT"],
              "peak_rss_mb": int(open("peak_mb.txt").read().strip()),
              "smoke": open("smoke_info.txt").read().strip(),
              "required_flags": os.environ["REQ_FLAGS"].split(),
              "profiles": [
                  {"name": "GPU mode (OpenCL for the diffusion model, CPU text encoder)", "flags": ["--backend", "te=cpu,vae=cpu"] + base},
                  {"name": "CPU mode (the exact mode tested in CI)", "flags": ["--backend", "cpu"] + base},
              ],
              "files": files,
          }
          json.dump(manifest, open("manifest/manifest.json", "w"), indent=1)
          print(json.dumps(manifest, indent=1))
          PY
          {
            echo "### Verified files"
            echo '```'
            cat manifest/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest/manifest.json
          retention-days: 14

      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            smoke.log
            smoke.png
            time.txt
            help.txt
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: Scaffold, build, sign, release
    needs: [native, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: "Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)"
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - uses: actions/download-artifact@v4
        with: { name: sdcli, path: native }

      - uses: actions/download-artifact@v4
        with: { name: manifest, path: manifest }

      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.mossmini-key
          key: mossmini-signing-key-v1

      - name: "Prepare signing key"
        env:
          KS_B64_SECRET: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          ALLOW_NEW_KEY: ${{ inputs.allow_new_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.mossmini-key
          if [ -n "$KS_B64_SECRET" ]; then
            echo "$KS_B64_SECRET" | base64 -d > ~/.mossmini-key/release.jks
            PW="$KS_PASS_SECRET"; AL="$KS_ALIAS_SECRET"
            echo "Using key from repo secrets."
          elif [ -f ~/.mossmini-key/release.jks ] && [ -f ~/.mossmini-key/pass.txt ]; then
            PW=$(cat ~/.mossmini-key/pass.txt); AL=mossmini
            echo "Using key restored from cache."
          else
            if [ "$ALLOW_NEW_KEY" != "true" ] && gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null | grep -q 'mini-v'; then
              echo "::error::Signing key is missing but MossMini releases already exist. A new key would block in-place updates. Re-run with allow_new_key=true only if you accept uninstall/reinstall."
              exit 1
            fi
            PW=$(openssl rand -hex 24); AL=mossmini
            keytool -genkeypair -keystore ~/.mossmini-key/release.jks -alias mossmini \
              -storepass "$PW" -keypass "$PW" -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=MossMini, O=MossMini, C=ID"
            echo "$PW" > ~/.mossmini-key/pass.txt
            echo "::notice::New signing key created and cached."
          fi
          echo "::add-mask::$PW"
          echo "KS_PATH=$HOME/.mossmini-key/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PW" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$AL" >> "$GITHUB_ENV"

      - name: "Scaffold project files"
        run: |
          mkdir -p app/src/main/{java/com/mossmini/app,res/xml,res/values,res/drawable,res/mipmap-anydpi-v26,assets,jniLibs/arm64-v8a}
          cp native/libsdcli.so app/src/main/jniLibs/arm64-v8a/libsdcli.so
          cp manifest/manifest.json app/src/main/assets/manifest.json
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MossMini"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          fun env(k: String) = System.getenv(k) ?: ""
          android {
              namespace = "com.mossmini.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mossmini.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = (System.getenv("VERSION_CODE") ?: "1").toInt()
                  versionName = System.getenv("VERSION_NAME") ?: "1.0.0"
                  ndk { abiFilters += "arm64-v8a" }
              }
              lint { checkReleaseBuilds = false; abortOnError = false }
              signingConfigs {
                  create("release") {
                      storeFile = file(env("KS_PATH"))
                      storePassword = env("KS_PASS")
                      keyAlias = env("KS_ALIAS")
                      keyPassword = env("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
