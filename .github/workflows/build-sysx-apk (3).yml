            const val WIDGET_SYS = """Write a compact Android home-screen widget text template for the user's request. Reply with ONLY the template text (max 6 short lines), no markdown. Allowed variables: {battery} {temp} {ramfree} {cpu} {thermal} {down} {up} {time} {cpupct} {rampct} {power} {uptime} {bcpu} {bram} {bbat} {date}. Emojis allowed."""

            private fun call(key: String, system: String, user: String): String {
