          fun Context.dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          fun Context.dpf(v: Float) = v * resources.displayMetrics.density
          fun View.dp(v: Int) = context.dp(v)
          fun View.dpf(v: Float) = context.dpf(v)
          fun rr(c: Int, r: Float, s: Int = 0, sw: Int = 0) = GradientDrawable().apply { setColor(c); cornerRadius = r; if (sw > 0) setStroke(sw, s) }
          fun rip(bg: Drawable, c: Int = 0x33FFFFFF) = RippleDrawable(ColorStateList.valueOf(c), bg, null)

          fun View.press(act: () -> Unit) {
