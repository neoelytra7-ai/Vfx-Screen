            return HorizontalScrollView(c).apply { isHorizontalScrollBarEnabled = false; addView(row) }
          }

          fun Context.swatch(cols: List<Int>, sel: Int, cb: (Int) -> Unit): LinearLayout {
            val c = this; val row = LinearLayout(c); val vs = ArrayList<View>()
            fun paint(s: Int) = vs.forEachIndexed { i, v ->
              v.background = rr(cols[i], dpf(16f), Color.WHITE, if (i == s) dp(2) else 0)
              v.animate().scaleX(if (i == s) 1.15f else 1f).scaleY(if (i == s) 1.15f else 1f).setDuration(200).start()
            }
            cols.forEachIndexed { i, col -> val v = View(c).apply { press { paint(i); cb(i) } }; vs.add(v); row.add(v, dp(32), dp(32), mr = 10) }
            paint(sel); return row
          }

          class Ring(c: Context, val lab: String) : View(c) {
            private var shown = 0f; private var cs = T.acc; private var col = T.acc; private var txt = "–"; private var an: ValueAnimator? = null
            private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
            private val t = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER; typeface = Typeface.MONOSPACE }
            fun set(v: Float, text: String, color: Int) {
              val f0 = shown; val c0 = cs; txt = text; col = color; val tg = v.coerceIn(0f, 1f); an?.cancel()
              if (!Fx.anim) { shown = tg; cs = color; invalidate(); return }
              an = ValueAnimator.ofFloat(0f, 1f).apply {
                duration = 700; interpolator = DecelerateInterpolator()
                addUpdateListener { val f = it.animatedFraction; shown = f0 + (tg - f0) * f; cs = T.mix(c0, col, f); invalidate() }; start()
              }
            }
            override fun onMeasure(w: Int, h: Int) { val s = MeasureSpec.getSize(w); setMeasuredDimension(s, s) }
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val sw = w * .09f; p.strokeWidth = sw; val r = RectF(sw * 1.6f, sw * 1.6f, w - sw * 1.6f, w - sw * 1.6f)
              p.color = 0x1FFFFFFF; cv.drawArc(r, 135f, 270f, false, p)
              p.color = cs; p.alpha = 50; p.strokeWidth = sw * 1.9f; cv.drawArc(r, 135f, 270f * shown, false, p)
              p.color = cs; p.strokeWidth = sw; cv.drawArc(r, 135f, 270f * shown, false, p)
              t.color = T.tx; t.textSize = w * .235f; cv.drawText(txt, w / 2, w / 2 + t.textSize * .12f, t)
              t.color = T.dim; t.textSize = w * .13f; cv.drawText(lab, w / 2, w * .88f, t)
            }
          }

          class Spark(c: Context, val title: String, val unit: String = "", var col: Int = T.acc) : View(c) {
            var src: List<Float> = emptyList(); var fixMax = 0f; var compact = false; var fit = false
            private val p = Paint(Paint.ANTI_ALIAS_FLAG); private var ph = 0f
            private val an = ValueAnimator.ofFloat(0f, 1f).apply { duration = 1500; repeatCount = ValueAnimator.INFINITE; addUpdateListener { ph = it.animatedFraction; invalidate() }; start() }
            override fun onDetachedFromWindow() { an.cancel(); super.onDetachedFromWindow() }
            private fun f(v: Float) = if (v >= 100f) "%.0f".format(v) else "%.1f".format(v)
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val h = height.toFloat(); val d = src; val n = d.size; val top = if (compact) 2f else dpf(24f)
              if (!compact) {
                p.style = Paint.Style.FILL; p.typeface = Typeface.MONOSPACE; p.textSize = dpf(11f)
                p.color = T.dim; p.textAlign = Paint.Align.LEFT; cv.drawText(title.uppercase() + if (n > 0) "  pk " + f(d.maxOrNull() ?: 0f) else "", 0f, dpf(12f), p)
                if (n > 0) { p.color = col; p.textAlign = Paint.Align.RIGHT; p.textSize = dpf(15f); p.typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD); cv.drawText(f(d[n - 1]) + unit, w, dpf(14f), p) }
              }
              if (n < 2) return
              val mx = if (fixMax > 0) fixMax else maxOf(d.maxOrNull() ?: 1f, 1f) * 1.15f
              val step = if (fit) w / (n - 1) else w / 89f; val path = Path(); var px = 0f; var py = 0f; var fx = 0f
              for (i in 0 until n) {
                val x = if (fit) i * step else w - (n - 1 - i) * step; val y = h - 3f - (d[i] / mx).coerceIn(0f, 1f) * (h - top - 6f)
                if (i == 0) { path.moveTo(x, y); fx = x } else { val m = (px + x) / 2; path.cubicTo(m, py, m, y, x, y) }
                px = x; py = y
              }
              val fill = Path(path).apply { lineTo(px, h); lineTo(fx, h); close() }
              p.style = Paint.Style.FILL; p.shader = LinearGradient(0f, top, 0f, h, (col and 0xFFFFFF) or 0x66000000, col and 0xFFFFFF, Shader.TileMode.CLAMP)
              cv.drawPath(fill, p); p.shader = null
              p.style = Paint.Style.STROKE; p.strokeWidth = dpf(2f); p.strokeJoin = Paint.Join.ROUND; p.color = col; cv.drawPath(path, p)
              p.style = Paint.Style.FILL; p.alpha = ((1 - ph) * 110).toInt(); cv.drawCircle(px, py, dpf(3f + 7f * ph), p)
              p.color = col; cv.drawCircle(px, py, dpf(3f), p)
            }
          }

          class Bars(c: Context) : View(c) {
            private var f = FloatArray(0); private var t = FloatArray(0); private var lab = emptyList<String>()
            private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { typeface = Typeface.MONOSPACE }
            fun set(v: List<Float>, labels: List<String>) {
              lab = labels; if (f.size != v.size) { f = FloatArray(v.size); requestLayout() }
              val s0 = f.copyOf(); t = v.toFloatArray()
              if (!Fx.anim) { f = t.copyOf(); invalidate(); return }
              ValueAnimator.ofFloat(0f, 1f).apply { duration = 600; interpolator = DecelerateInterpolator(); addUpdateListener { for (i in f.indices) f[i] = s0[i] + (t[i] - s0[i]) * it.animatedFraction; invalidate() }; start() }
            }
            override fun onMeasure(w: Int, h: Int) = setMeasuredDimension(MeasureSpec.getSize(w), maxOf(f.size, 1) * dp(24))
            override fun onDraw(cv: Canvas) {
              val w = width.toFloat(); val rh = dp(24).toFloat(); p.textSize = dpf(10.5f)
              for (i in f.indices) {
                val y = i * rh; val x0 = w * .40f; val tr = RectF(x0, y + rh * .3f, w, y + rh * .7f)
                p.style = Paint.Style.FILL; p.color = 0x1AFFFFFF; cv.drawRoundRect(tr, rh, rh, p)
                p.color = T.heat(f[i]); cv.drawRoundRect(RectF(x0, tr.top, x0 + (w - x0) * f[i].coerceIn(.02f, 1f), tr.bottom), rh, rh, p)
                p.color = T.dim; cv.drawText(lab.getOrElse(i) { "" }, 0f, y + rh * .68f, p)
              }
            }
          }

          class Shimmer(c: Context) : View(c) {
            private val p = Paint(); private var ph = 0f; private var on = false
            private val an = ValueAnimator.ofFloat(0f, 1f).apply { duration = 1100; repeatCount = ValueAnimator.INFINITE; addUpdateListener { ph = it.animatedFraction; invalidate() } }
            init { background = rr(0x14FFFFFF, dpf(2f)); visibility = INVISIBLE }
            fun run(b: Boolean) { on = b; if (b) { visibility = VISIBLE; if (!an.isStarted) an.start() } else { an.cancel(); visibility = INVISIBLE } }
            override fun onDraw(cv: Canvas) {
              if (!on) return; val w = width.toFloat(); val x = w * (ph * 2 - 1)
              p.shader = LinearGradient(x, 0f, x + w * .5f, 0f, intArrayOf(T.acc and 0xFFFFFF, T.acc, T.acc and 0xFFFFFF), null, Shader.TileMode.CLAMP)
              cv.drawRect(0f, 0f, w, height.toFloat(), p)
            }
            override fun onDetachedFromWindow() { an.cancel(); super.onDetachedFromWindow() }
          }

          class Dot(c: Context, val col: Int) : View(c) {
            private var ph = 0f; private val p = Paint(Paint.ANTI_ALIAS_FLAG)
            private val an = ValueAnimator.ofFloat(0f, 1f).apply { duration = 1300; repeatCount = ValueAnimator.INFINITE; addUpdateListener { ph = it.animatedFraction; invalidate() }; start() }
            override fun onMeasure(w: Int, h: Int) = setMeasuredDimension(dp(14), dp(14))
            override fun onDraw(cv: Canvas) {
              val m = width / 2f; p.color = col; p.alpha = ((1 - ph) * 120).toInt(); cv.drawCircle(m, m, m * (.4f + .6f * ph), p)
              p.color = col; cv.drawCircle(m, m, m * .38f, p)
            }
            override fun onDetachedFromWindow() { an.cancel(); super.onDetachedFromWindow() }
          }
