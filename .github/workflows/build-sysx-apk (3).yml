          }

          object Fx {
            var hap = true; var anim = true
            fun tick(v: View) { if (hap) v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP) }
            fun heavy(v: View) { if (hap) v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS) }
            fun snack(a: Activity, msg: String, col: Int = T.acc) {
              val root = a.findViewById<ViewGroup>(android.R.id.content); val d = a.resources.displayMetrics.density
              val tv = TextView(a).apply {
                text = msg; setTextColor(T.tx); textSize = 13f; setPadding((18 * d).toInt(), (11 * d).toInt(), (18 * d).toInt(), (11 * d).toInt())
                background = rr(T.card2, 24 * d, col, (1.5f * d).toInt()); elevation = 14 * d; alpha = 0f; translationY = 40 * d
              }
              root.addView(tv, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply { bottomMargin = (98 * d).toInt() })
              tick(tv)
              tv.animate().alpha(1f).translationY(0f).setDuration(300).setInterpolator(OvershootInterpolator(2f)).withEndAction {
                tv.animate().alpha(0f).translationY(16 * d).setStartDelay(1600).setDuration(260).setInterpolator(AccelerateInterpolator()).withEndAction { root.removeView(tv) }.start()
              }.start()
            }
