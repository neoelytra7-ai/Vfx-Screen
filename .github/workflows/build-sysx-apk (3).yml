          cat > app/src/main/java/dev/sysx/Hist.kt <<'EOF'
          package dev.sysx

          import android.content.Context
          import android.speech.tts.TextToSpeech
          import java.text.SimpleDateFormat
          import java.util.*

          class Series {
            val v = ArrayList<Float>(); var pk = 0f
            fun add(x: Float) { v.add(x); if (v.size > 90) v.removeAt(0); if (x > pk) pk = x }
            fun last() = if (v.isEmpty()) 0f else v[v.size - 1]
          }

          object H {
            val cpu = Series(); val ram = Series(); val tmp = Series(); val pw = Series(); val dn = Series(); val upl = Series(); val bat = Series()
            var frozen = false; var rec: StringBuilder? = null; var recN = 0; private var last = 0L; private var tts: TextToSpeech? = null
            private val tf = SimpleDateFormat("HH:mm:ss", Locale.US)
            fun cpuPct(c: Context): Float { val f = S.freqs(); val m = S.maxf(); var s = 0f; var k = 0; for (i in f.indices) if (m[i] > 0) { s += f[i].toFloat() / m[i]; k++ }; return if (k == 0) 0f else s * 100 / k }
            fun ramPct(c: Context): Float { val (a, t) = S.ram(c); return if (t > 0) (t - a) * 100f / t else 0f }
            fun power(c: Context): Float { val v = S.bat(c)?.getIntExtra("voltage", 0) ?: 0; return (Math.abs(S.currentMa(c)) * v / 1e6).toFloat() }
            fun sample(c: Context) {
              val n = System.currentTimeMillis(); if (frozen || n - last < 800) return; last = n
              val cp = cpuPct(c); val rp = ramPct(c); val tm = S.tmax().toFloat(); val pwr = power(c); val (d, u) = S.net(); val b = S.batPct(c)
              cpu.add(cp); ram.add(rp); tmp.add(tm); pw.add(pwr); dn.add(d.toFloat()); upl.add(u.toFloat()); bat.add(b.toFloat())
              rec?.let { it.append(tf.format(Date())).append(",%.1f,%.1f,%.1f,%.2f,%.0f,%.0f,%d\n".format(cp, rp, tm, pwr, d, u, b)); recN++ }
            }
            fun startRec() { rec = StringBuilder("time,cpu_pct,ram_pct,temp_c,power_w,down_kbs,up_kbs,bat_pct\n"); recN = 0 }
            fun stopRec(): String? { val r = rec?.toString(); rec = null; return r }
            fun health(c: Context): Int {
              var s = 100.0; val t = S.tmax(); if (t > 38) s -= (t - 38) * 2.5
              val r = ramPct(c); if (r > 70) s -= (r - 70) * .8
              val st = S.stor(); val fp = st.first * 100.0 / st.second.coerceAtLeast(1); if (fp < 20) s -= (20 - fp)
              val b = S.batPct(c); if (b in 0..20 && !S.charging(c)) s -= (20 - b) * .8
              return s.coerceIn(0.0, 100.0).toInt()
            }
            fun sk(p: Float): Char = "▁▂▃▄▅▆▇█"[(p / 100f * 7.99f).toInt().coerceIn(0, 7)]
            fun say(c: Context, s: String) {
              val t = tts
              if (t == null) { tts = TextToSpeech(c.applicationContext) { if (it == TextToSpeech.SUCCESS) { tts?.language = Locale.getDefault(); tts?.speak(s, TextToSpeech.QUEUE_FLUSH, null, "sx") } } }
              else t.speak(s, TextToSpeech.QUEUE_FLUSH, null, "sx")
            }
            fun vars(c: Context, t: String): String {
              if (!t.contains('{')) return t
              val (fr, _) = S.stor(); val cp = cpuPct(c); val rp = ramPct(c); val b = S.batPct(c); val (a, tt) = S.ram(c)
              return t.replace("{cpupct}", "%.0f".format(cp)).replace("{rampct}", "%.0f".format(rp)).replace("{ramused}", ((tt - a) / 1048576).toString())
                .replace("{power}", "%.1f".format(power(c))).replace("{uptime}", S.up()).replace("{storfree}", S.gb(fr))
                .replace("{date}", SimpleDateFormat("EEE d MMM", Locale.getDefault()).format(Date())).replace("{net}", if (S.wifi(c)) "WiFi" else "Mobile")
                .replace("{bbat}", S.bar(b)).replace("{bram}", S.bar(rp.toInt())).replace("{bcpu}", S.bar(cp.toInt()))
            }
            fun ovText(c: Context, mode: Int, m: Int): String {
              fun has(b: Int) = (m and b) != 0
              val cp = cpu.last(); val rp = ram.last(); val b = S.batPct(c); val (d, u) = S.net()
              if (mode == 0) {
                val p = ArrayList<String>()
                if (has(1)) p.add(SimpleDateFormat("HH:mm", Locale.US).format(Date()))
                if (has(2)) p.add("⚙${"%.0f".format(cp)}%"); if (has(4)) p.add("▤${"%.0f".format(rp)}%")
                if (has(16)) p.add("🔋$b%"); if (has(32)) p.add("🌡${"%.0f".format(S.tmax())}°"); if (has(64)) p.add("↓${"%.0f".format(d)}")
                if (has(128)) p.add("💾${S.gb(S.stor().first)}G")
                return p.joinToString(" · ").ifEmpty { "SysX" }
              }
              val sb = StringBuilder()
              if (has(1)) sb.append("⏱ ${tf.format(Date())}  up ${S.up()}\n")
              if (has(2)) { val f = S.freqs(); val mx = S.maxf(); sb.append("CPU "); for (i in f.indices) sb.append(sk(if (mx[i] > 0) f[i] * 100f / mx[i] else 0f)); sb.append(" ${"%.0f".format(cp)}%\n") }
              if (has(4)) { val (a, t) = S.ram(c); sb.append("RAM ${S.bar(rp.toInt())} ${(t - a) / 1048576}/${t / 1048576}M\n") }
              if (has(8)) { val mm = S.mi(); val st = mm["SwapTotal"] ?: 0L; if (st > 0) sb.append("SWP ${((st - (mm["SwapFree"] ?: 0L)) / 1024)}/${st / 1024}M\n") }
              if (has(16)) sb.append("BAT $b% ${"%.1f".format(S.batTemp(c))}°C ${"%.1f".format(power(c))}W${if (S.charging(c)) " ⚡" else ""}\n")
              if (has(32)) sb.append("TMP ${"%.1f".format(S.tmax())}°C\n")
              if (has(64)) sb.append("NET ↓${"%.0f".format(d)} ↑${"%.0f".format(u)} KB/s ${if (S.wifi(c)) "WiFi" else "Mobile"}\n")
              if (has(128)) { val (fr, to) = S.stor(); sb.append("STO ${S.gb(fr)}/${S.gb(to)}G\n") }
              return sb.toString().trimEnd().ifEmpty { "SysX" }
            }
          }
          EOF

