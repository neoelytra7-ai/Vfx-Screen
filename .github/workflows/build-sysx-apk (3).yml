          fun Context.field(hint: String, v: String): EditText = EditText(this).apply {
            this.hint = hint; setText(v); setTextColor(T.tx); setHintTextColor(T.dim); textSize = 12.5f
            setPadding(dp(14), dp(11), dp(14), dp(11)); background = rr(0xFF0B121B.toInt(), dpf(14f), T.line, 1)
          }

          class Tog(c: Context, init0: Boolean, val cb: (Boolean) -> Unit) : View(c) {
            var on = init0; private var k = if (init0) 1f else 0f; private val p = Paint(Paint.ANTI_ALIAS_FLAG)
            init { setOnClickListener { set(!on, true) } }
            fun set(v: Boolean, fire: Boolean) {
              on = v
              ValueAnimator.ofFloat(k, if (v) 1f else 0f).apply { duration = 280; interpolator = OvershootInterpolator(1.6f); addUpdateListener { k = it.animatedValue as Float; invalidate() }; start() }
              if (fire) { Fx.tick(this); cb(v) }
            }
            override fun onMeasure(w: Int, h: Int) = setMeasuredDimension(dp(48), dp(28))
            override fun onDraw(cv: Canvas) {
              val kk = k.coerceIn(0f, 1f); val hh = height.toFloat(); p.color = T.mix(0xFF2A3748.toInt(), T.acc, kk)
              cv.drawRoundRect(0f, 0f, width.toFloat(), hh, hh / 2, hh / 2, p)
              p.color = Color.WHITE; cv.drawCircle(hh / 2 + (width - hh) * k, hh / 2, hh / 2 - dpf(3.5f), p)
            }
          }

          fun Context.togRow(t: String, s: String, on: Boolean, cb: (Boolean) -> Unit): LinearLayout {
            val c = this; val tg = Tog(c, on, cb)
            val tx = LinearLayout(c).apply { orientation = LinearLayout.VERTICAL; addView(c.tv(t, 14f)); if (s.isNotEmpty()) addView(c.tv(s, 11f, T.dim)) }
            return LinearLayout(c).apply { gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(7), 0, dp(7)); add(tx, 0, -2, 1f); addView(tg); setOnClickListener { tg.performClick() } }
          }

          fun Context.sld(t: String, lo: Int, hi: Int, cur: Int, fmt: (Int) -> String, cb: (Int) -> Unit): LinearLayout {
            val c = this; val lab = c.tv(fmt(cur), 12f, T.acc, true)
            val sb = SeekBar(c).apply {
              max = hi - lo; progress = cur - lo
              progressTintList = ColorStateList.valueOf(T.acc); thumbTintList = ColorStateList.valueOf(T.acc); progressBackgroundTintList = ColorStateList.valueOf(0x33FFFFFF)
              setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                override fun onProgressChanged(s: SeekBar?, v: Int, u: Boolean) { lab.text = fmt(v + lo); if (u) cb(v + lo) }
                override fun onStartTrackingTouch(s: SeekBar?) {}
                override fun onStopTrackingTouch(s: SeekBar?) { s?.let { Fx.tick(it) } }
              })
            }
            val r = LinearLayout(c); r.add(c.tv(t, 13f), 0, -2, 1f); r.addView(lab)
            return LinearLayout(c).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(6), 0, dp(2)); addView(r); addView(sb) }
          }

          fun Context.chips(opts: List<String>, sel: Int, cb: (Int) -> Unit): HorizontalScrollView {
            val c = this; val row = LinearLayout(c); val vs = ArrayList<TextView>()
            fun paint(s: Int) = vs.forEachIndexed { i, v -> v.background = rip(rr(if (i == s) T.acc else T.card2, dpf(16f))); v.setTextColor(if (i == s) T.bg else T.tx) }
            opts.forEachIndexed { i, o ->
              val v = c.tv(o, 12f, T.tx, false, true).apply { setPadding(dp(13), dp(8), dp(13), dp(8)); press { paint(i); cb(i) } }
              vs.add(v); row.add(v, -2, -2, mr = 6)
            }
