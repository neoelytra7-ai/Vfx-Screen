      - name: Build release APK
        working-directory: sysx
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp sysx/app/build/outputs/apk/release/app-release.apk SysX.apk
          { echo "### 📦 SysX APK"; echo "- size: $(du -h SysX.apk | cut -f1)"; echo "- sha256: \`$(sha256sum SysX.apk | cut -d' ' -f1)\`"; echo "- build: #$GITHUB_RUN_NUMBER @ ${GITHUB_SHA::7}"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: SysX-apk
          path: SysX.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SysX.apk
          generate_release_notes: true
