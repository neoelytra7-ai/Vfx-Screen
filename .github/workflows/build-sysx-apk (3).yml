            setOnTouchListener { v, e ->
              when (e.actionMasked) {
                MotionEvent.ACTION_DOWN -> v.animate().scaleX(.94f).scaleY(.94f).setStartDelay(0).setDuration(80).setInterpolator(DecelerateInterpolator()).start()
                MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> v.animate().scaleX(1f).scaleY(1f).setStartDelay(0).setDuration(300).setInterpolator(OvershootInterpolator(3.5f)).start()
              }
              false
            }
            setOnClickListener { Fx.tick(it); act() }
