# Save as: .github/workflows/build-moss-apk.yml
#
# MossLocal: Android app that runs diffusion models on-device via stable-diffusion.cpp
# (Adreno GPU through OpenCL, CPU NEON/i8mm fallback). Built-in one-tap model downloads:
# DreamShaper-7 LCM, SD-Turbo, SD 1.5 (Q4_0/Q8_0). 'Custom' slot is kept for MOSS-Image GGUFs.
#
# NO SECRETS NEEDED. The signing key is created on the first run and kept in the repo cache.
# A weekly keep-alive job touches that cache so GitHub never evicts it (7-day rule).
# If the key were ever lost, the build STOPS instead of silently making a new one
# (a new key would block in-place updates). Override with allow_new_key=true.
#
# Optional: set KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS secrets to use your own key.
#
# UPDATES: same applicationId + same key + increasing versionCode (= run number) => Android
# installs the new APK OVER the old one. Models are stored outside the APK and survive updates.
# (Uninstalling the app deletes them.) The app's "Update app" button reads the latest Release,
# verifies its SHA-256, then hands it to Android's installer.
# NOTE: the in-app updater needs a PUBLIC repo (private repos return 404 to anonymous requests).

name: Build MossLocal APK

on:
  push:
    branches: [main, master]
    paths: [".github/workflows/build-moss-apk.yml"]   # README edits etc. won't burn a build number
  schedule:
    - cron: "17 3 * * 0"                               # weekly: only runs the keep-alive job
  workflow_dispatch:
    inputs:
      sd_cpp_ref:
        description: "stable-diffusion.cpp branch/tag/commit"
        default: "master"
      extra_args:
        description: "Default extra sd-cli args shipped in the app (editable in-app)"
        default: "--diffusion-fa --offload-to-cpu --vae-tiling"
      allow_new_key:
        description: "Allow creating a NEW signing key (breaks in-place updates of installed apps)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moss-apk
  cancel-in-progress: false

env:
  SD_CPP_REF: ${{ inputs.sd_cpp_ref || 'master' }}
  EXTRA_ARGS: ${{ inputs.extra_args || '--diffusion-fa --offload-to-cpu --vae-tiling' }}
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}
  REPO_SLUG: ${{ github.repository }}

jobs:
  keepalive:
    name: Keep signing key cache alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v4
        id: k
        with:
          path: ~/.moss-key
          key: moss-signing-key-v1
      - run: |
          if [ "${{ steps.k.outputs.cache-hit }}" = "true" ]; then
            echo "Signing key cache is alive."
          else
            echo "::warning::Signing key cache NOT found. Next build will refuse to make a new key unless allow_new_key=true."
          fi

  native:
    name: Build sd-cli (arm64, OpenCL/Adreno + NEON)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake git

      - name: ccache (faster rebuilds)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: moss-native-${{ env.SD_CPP_REF }}

      - name: Fetch stable-diffusion.cpp
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp
          git checkout "$SD_CPP_REF"
          git submodule update --init --recursive
          echo "SD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check this ref knows MOSS-Image
        run: |
          if grep -rIil "moss" sdcpp/src sdcpp/docs sdcpp/README.md 2>/dev/null | head -1 | grep -q .; then
            echo "MOSS references found in sd.cpp source."
          else
            echo "::warning::No 'moss' reference found in stable-diffusion.cpp at $SD_COMMIT. MOSS-Image will not load until sd.cpp supports it."
          fi

      - name: Build OpenCL headers + ICD stub (link-time only)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          TC="$NDK/build/cmake/android.toolchain.cmake"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git
          cmake -S OpenCL-Headers -B oh -DCMAKE_INSTALL_PREFIX="$HOME/ocl"
          cmake --build oh --target install
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git
          cmake -S OpenCL-ICD-Loader -B ol -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 \
            -DANDROID_STL=c++_static \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$HOME/ocl/include" \
            -DCMAKE_INSTALL_PREFIX="$HOME/ocl" -DCMAKE_BUILD_TYPE=Release
          cmake --build ol --target install

      - name: Compile sd-cli
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S sdcpp -B sdcpp/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8.6-a+i8mm+dotprod+fp16 -O3" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON -DGGML_OPENCL_EMBED_KERNELS=ON \
            -DOpenCL_INCLUDE_DIR="$HOME/ocl/include" -DOpenCL_LIBRARY="$HOME/ocl/lib/libOpenCL.so" \
            -DSD_BUILD_SHARED_LIBS=OFF -DSD_BUILD_EXAMPLES=ON
          cmake --build sdcpp/build --target sd-cli || cmake --build sdcpp/build --target sd
          BIN=$(find sdcpp/build -type f \( -name sd-cli -o -name sd \) | head -1)
          test -n "$BIN"
          mkdir -p out
          cp "$BIN" out/libsdcli.so
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/libsdcli.so
          ls -l out
          grep -rhoE '"--[a-z0-9-]+"' sdcpp/examples 2>/dev/null | sort -u > out/cli_flags.txt || true
          { echo "### sd.cpp commit \`$SD_COMMIT\`"; echo "Supported CLI flags:"; echo '```'; cat out/cli_flags.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sdcli
          path: out/libsdcli.so
          retention-days: 7

  apk:
    name: Scaffold, build, sign, release
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - uses: actions/download-artifact@v4
        with: { name: sdcli, path: native }

      - name: Sanitize extra args (quotes would break the generated Kotlin)
        run: |
          CLEAN=$(printf '%s' "$EXTRA_ARGS" | tr -d '"\\$`\n\r')
          echo "EXTRA_ARGS=$CLEAN" >> "$GITHUB_ENV"

      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.moss-key
          key: moss-signing-key-v1

      - name: Prepare signing key
        env:
          KS_B64_SECRET: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          ALLOW_NEW_KEY: ${{ inputs.allow_new_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.moss-key
          if [ -n "$KS_B64_SECRET" ]; then
            echo "$KS_B64_SECRET" | base64 -d > ~/.moss-key/release.jks
            PW="$KS_PASS_SECRET"; AL="$KS_ALIAS_SECRET"
            echo "Using key from repo secrets."
          elif [ -f ~/.moss-key/release.jks ] && [ -f ~/.moss-key/pass.txt ]; then
            PW=$(cat ~/.moss-key/pass.txt); AL=moss
            echo "Using key restored from cache."
          else
            if [ "$ALLOW_NEW_KEY" != "true" ] && [ -n "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 2>/dev/null)" ]; then
              echo "::error::Signing key is missing but releases already exist. A new key would block in-place updates of installed apps. Re-run with allow_new_key=true only if you accept uninstall/reinstall."
              exit 1
            fi
            PW=$(openssl rand -hex 24); AL=moss
            keytool -genkeypair -keystore ~/.moss-key/release.jks -alias moss \
              -storepass "$PW" -keypass "$PW" -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=MossLocal, O=MossLocal, C=ID"
            echo "$PW" > ~/.moss-key/pass.txt
            echo "::notice::New signing key created and cached."
          fi
          echo "::add-mask::$PW"
          echo "KS_PATH=$HOME/.moss-key/release.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PW" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$AL" >> "$GITHUB_ENV"

      - name: Scaffold Android project
        run: |
          mkdir -p app/src/main/{java/com/mosslocal/app,res/xml,res/values,res/drawable,res/mipmap-anydpi-v26,jniLibs/arm64-v8a}
          cp native/libsdcli.so app/src/main/jniLibs/arm64-v8a/libsdcli.so

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MossLocal"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx3g" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          fun env(k: String) = System.getenv(k) ?: ""
          android {
              namespace = "com.mosslocal.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.mosslocal.app"      // never change: identity used for updates
                  minSdk = 29
                  targetSdk = 34
                  versionCode = (System.getenv("VERSION_CODE") ?: "1").toInt()
                  versionName = System.getenv("VERSION_NAME") ?: "1.0.0"
                  ndk { abiFilters += "arm64-v8a" }
                  buildConfigField("String", "EXTRA_ARGS", "\"" + env("EXTRA_ARGS") + "\"")
                  buildConfigField("String", "REPO_SLUG", "\"" + env("REPO_SLUG") + "\"")
              }
              buildFeatures { buildConfig = true }
              lint { checkReleaseBuilds = false; abortOnError = false }
              signingConfigs {
                  create("release") {
                      storeFile = file(env("KS_PATH"))
                      storePassword = env("KS_PASS")
                      keyAlias = env("KS_ALIAS")
                      keyPassword = env("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
              packaging { jniLibs { useLegacyPackaging = true } }   // extract .so so the binary can be exec'd
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application android:label="MossLocal" android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false" android:largeHeap="true"
                  android:usesCleartextTraffic="false">
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider"
                      android:authorities="com.mosslocal.app.files" android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <paths><external-cache-path name="updates" path="."/></paths>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="ic_bg">#101820</color></resources>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7C5CFF" android:pathData="M30,54 a24,24 0 1,0 48,0 a24,24 0 1,0 -48,0 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M42,64 L42,44 L54,56 L66,44 L66,64 L61,64 L61,53 L54,60 L47,53 L47,64 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/java/com/mosslocal/app/MainActivity.kt <<'EOF'
          package com.mosslocal.app

          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.provider.MediaStore
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.core.content.FileProvider
          import org.json.JSONObject
          import java.io.File
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          data class Preset(
              val id: String, val label: String, val url: String, val mb: Int,
              val steps: Int, val cfg: String, val extra: String
          )

          class MainActivity : Activity() {
              private val ui = Handler(Looper.getMainLooper())
              private lateinit var logView: TextView
              private lateinit var img: ImageView
              private lateinit var gen: Button
              private lateinit var spinner: Spinner
              private lateinit var status: TextView
              private lateinit var bar: ProgressBar
              private lateinit var customBox: LinearLayout
              @Volatile private var proc: Process? = null
              @Volatile private var busy = false
              @Volatile private var cancel = false
              private var lastSel = -1

              // Single-file GGUF models (CLIP + UNet + VAE inside) that stable-diffusion.cpp can run on the GPU (OpenCL).
              private val presets = listOf(
                  Preset("dreamshaper_lcm", "DreamShaper-7 LCM - realistic, 4 steps (2.1 GB)",
                      "https://huggingface.co/darkmaniac7/TokForge-DreamShaper-LCM-GGUF/resolve/main/dreamshaper-7-lcm-f16.gguf",
                      2100, 4, "1.5", "--sampling-method lcm --vae-tiling"),
                  Preset("sd_turbo", "SD-Turbo - fastest, 1 step (2.0 GB)",
                      "https://huggingface.co/Green-Sky/SD-Turbo-GGUF/resolve/main/sd_turbo-f16-q8_0.gguf",
                      2020, 1, "1.0", "--vae-tiling"),
                  Preset("sd15_q4", "Stable Diffusion 1.5 Q4_0 - lowest RAM (1.75 GB)",
                      "https://huggingface.co/gpustack/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-Q4_0.gguf",
                      1750, 20, "7.0", "--vae-tiling"),
                  Preset("sd15_q8", "Stable Diffusion 1.5 Q8_0 - better quality (1.9 GB)",
                      "https://huggingface.co/gpustack/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-Q8_0.gguf",
                      1880, 20, "7.0", "--vae-tiling")
              )
              private val customIdx get() = presets.size

              // Models live outside the APK -> survive app updates (deleted only on uninstall)
              private val modelDir get() = File(getExternalFilesDir(null), "models").apply { mkdirs() }
              private fun presetFile(p: Preset) = File(modelDir, "model_${p.id}.gguf")
              private val dit get() = File(modelDir, "moss_dit.gguf")
              private val te get() = File(modelDir, "qwen35_te.gguf")
              private val vae get() = File(modelDir, "flux2_vae.safetensors")
              private val logFile get() = File(getExternalFilesDir(null), "last-log.txt")
              private val libEnv = "/vendor/lib64:/system/lib64:/vendor/lib64/egl"

              private fun log(s: String) {
                  try { logFile.appendText(s + "\n") } catch (e: Exception) { }
                  ui.post {
                      logView.append(s + "\n")
                      if (logView.length() > 20000) logView.text = logView.text.toString().takeLast(12000)
                  }
              }

              private fun setBusy(b: Boolean) { busy = b; ui.post { gen.isEnabled = !b } }

              private fun availMemMb(): Long = try {
                  File("/proc/meminfo").readLines().first { it.startsWith("MemAvailable") }
                      .filter { it.isDigit() }.toLong() / 1024
              } catch (e: Exception) { -1L }

              private fun freeDiskMb(): Long = StatFs(modelDir.path).availableBytes shr 20

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  try { logFile.writeText("") } catch (e: Exception) { }
                  File(externalCacheDir, "update.apk").delete()

                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 64, 24, 48) }
                  val scroll = ScrollView(this).apply { addView(root) }
                  fun et(hint: String, v: String, num: Boolean = false) = EditText(this).apply {
                      this.hint = hint; setText(v)
                      if (num) inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  }
                  fun btn(t: String) = Button(this).apply { text = t }
                  fun head(t: String) = TextView(this).apply { text = t; textSize = 13f; setPadding(0, 28, 0, 4) }

                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  val prompt = et("Prompt", "a lighthouse on a cliff at dawn, volumetric light, detailed")
                  val size = et("Size (square, multiple of 64)", "512", true)
                  val steps = et("Steps", "4", true)
                  val cfg = et("CFG", "1.5", true)
                  val extra = et("Extra sd-cli args", "--vae-tiling")
                  val uDit = et("DiT .gguf URL (https)", prefs.getString("dit", "") ?: "")
                  val uTe = et("Text encoder .gguf URL (https)", prefs.getString("te", "") ?: "")
                  val uVae = et("VAE .safetensors URL (https)", prefs.getString("vae", "") ?: "")
                  customBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; visibility = View.GONE
                      addView(uDit); addView(uTe); addView(uVae)
                  }
                  spinner = Spinner(this)
                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { max = 1000 }
                  status = TextView(this).apply { textSize = 12f }
                  gen = btn("Generate")
                  val stop = btn("Stop")
                  val dl = btn("Download selected model")
                  val del = btn("Delete selected model (free space)")
                  val test = btn("Self-test (engine, GPU flags)")
                  val upd = btn("Update app (v${BuildConfig.VERSION_NAME})")
                  img = ImageView(this).apply { adjustViewBounds = true }
                  logView = TextView(this).apply { textSize = 11f; setTextIsSelectable(true) }

                  listOf(
                      head("1) Pick a model   2) Download once   3) Generate. Runs on the Adreno GPU via OpenCL when the driver loads; the log tells you which backend was used."),
                      spinner, customBox, dl, bar, status,
                      head("Settings (auto-filled per model)"), prompt, size, steps, cfg, extra,
                      gen, stop, img, del, test, upd, logView
                  ).forEach { root.addView(it) }
                  setContentView(scroll)

                  spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          if (pos == lastSel) return
                          lastSel = pos
                          customBox.visibility = if (pos == customIdx) View.VISIBLE else View.GONE
                          if (pos < presets.size) {
                              val q = presets[pos]
                              steps.setText("${q.steps}"); cfg.setText(q.cfg); extra.setText(q.extra)
                          } else {
                              steps.setText("28"); cfg.setText("3.0"); extra.setText(BuildConfig.EXTRA_ARGS)
                          }
                          prefs.edit().putInt("sel", pos).apply()
                      }
                      override fun onNothingSelected(p: AdapterView<*>?) { }
                  }
                  refreshSpinner(prefs.getInt("sel", 0))

                  val free = availMemMb()
                  log("Build ${BuildConfig.VERSION_CODE} | free RAM $free MB | free disk ${freeDiskMb()} MB")

                  gen.setOnClickListener {
                      val idx = spinner.selectedItemPosition
                      val t = prompt.text.toString(); val s = size.text.toString().toIntOrNull() ?: 512
                      val st = steps.text.toString().toIntOrNull() ?: 4
                      val c = cfg.text.toString().ifBlank { "1.5" }; val x = extra.text.toString()
                      thread { generate(idx, t, s, st, c, x) }
                  }
                  stop.setOnClickListener { cancel = true; proc?.destroyForcibly(); log("Stop requested.") }
                  dl.setOnClickListener {
                      val idx = spinner.selectedItemPosition
                      val a = uDit.text.toString().trim(); val bb = uTe.text.toString().trim(); val c = uVae.text.toString().trim()
                      prefs.edit().putString("dit", a).putString("te", bb).putString("vae", c).apply()
                      thread { downloadSelected(idx, a, bb, c) }
                  }
                  del.setOnClickListener {
                      if (busy) { log("Busy."); return@setOnClickListener }
                      val idx = spinner.selectedItemPosition
                      val files = if (idx < presets.size) listOf(presetFile(presets[idx])) else listOf(dit, te, vae)
                      files.forEach { it.delete(); File(it.path + ".part").delete() }
                      log("Deleted. Free disk ${freeDiskMb()} MB")
                      refreshSpinner(idx)
                  }
                  test.setOnClickListener { thread { selfTest() } }
                  upd.setOnClickListener { thread { selfUpdate() } }
              }

              override fun onDestroy() {
                  cancel = true
                  proc?.destroyForcibly()
                  super.onDestroy()
              }

              private fun refreshSpinner(keep: Int) {
                  val names = presets.map { (if (validModel(presetFile(it))) "\u2713 " else "\u2193 ") + it.label } +
                      "Custom / MOSS-Image (advanced)"
                  spinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, names)
                  spinner.setSelection(keep.coerceIn(0, names.size - 1))
              }

              // ---------- model sanity ----------
              private fun validModel(f: File): Boolean {
                  if (!f.exists() || f.length() < 1_000_000) return false
                  return try {
                      f.inputStream().use { i ->
                          val h = ByteArray(8)
                          if (i.read(h) < 8) false
                          else if (f.name.endsWith(".gguf")) String(h, 0, 4, Charsets.US_ASCII) == "GGUF"
                          else {
                              var n = 0L
                              for (k in 7 downTo 0) n = (n shl 8) or (h[k].toLong() and 0xff)
                              n in 2L..100_000_000L
                          }
                      }
                  } catch (e: Exception) { false }
              }

              private fun modelArgs(idx: Int): List<String>? =
                  if (idx < presets.size) {
                      val f = presetFile(presets[idx])
                      if (validModel(f)) listOf("-m", f.absolutePath) else null
                  } else {
                      if (listOf(dit, te, vae).all { validModel(it) })
                          listOf("--diffusion-model", dit.absolutePath, "--llm", te.absolutePath, "--vae", vae.absolutePath)
                      else null
                  }

              // ---------- generate ----------
              private fun generate(idx: Int, text: String, sizeIn: Int, steps: Int, cfg: String, extra: String) {
                  if (busy) { log("Already running."); return }
                  val margs = modelArgs(idx)
                  if (margs == null) { log("Model not downloaded yet. Tap 'Download selected model'."); return }
                  var size = (sizeIn.coerceIn(256, 1536) / 64) * 64
                  val free = availMemMb()
                  val need = if (idx < presets.size) presets[idx].mb + 600 else 3500
                  if (free in 0 until need.toLong()) {
                      log("Low RAM: $free MB free, this model wants ~$need MB. Close other apps.")
                      if (size > 512) { size = 512; log("Forcing 512px.") }
                  }
                  cancel = false
                  setBusy(true)
                  val out = File(cacheDir, "out.png").also { it.delete() }
                  val t0 = System.currentTimeMillis()
                  try {
                      val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                      val cmd = mutableListOf(bin.absolutePath)
                      cmd += margs
                      cmd += listOf("-p", text, "-W", "$size", "-H", "$size", "--steps", "$steps",
                          "--cfg-scale", cfg, "-o", out.absolutePath, "-v")
                      cmd += extra.split(" ").filter { it.isNotBlank() }
                      log("RUN: " + cmd.joinToString(" "))
                      val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                      pb.environment()["LD_LIBRARY_PATH"] = libEnv
                      val p = pb.start(); proc = p
                      var gpu = false
                      val gpuRe = Regex("opencl|adreno", RegexOption.IGNORE_CASE)
                      p.inputStream.bufferedReader().forEachLine { line ->
                          if (!gpu && gpuRe.containsMatchIn(line)) gpu = true
                          log(line)
                      }
                      val code = p.waitFor()
                      log("exit=$code | " + ((System.currentTimeMillis() - t0) / 1000) + " s")
                      log("Backend: " + if (gpu) "GPU (OpenCL/Adreno detected)" else "CPU only (no OpenCL/Adreno line in engine output)")
                      if (out.exists()) {
                          ui.post { img.setImageBitmap(BitmapFactory.decodeFile(out.absolutePath)) }
                          saveToGallery(out)
                      } else if (cancel) log("Stopped.")
                      else if (code == 137 || code == 9) log("Android killed the engine (out of memory). Close other apps or pick the Q4_0 model.")
                      else log("No image produced. See log above, or run Self-test.")
                  } catch (e: Exception) { log("ERR: $e") }
                  finally { proc = null; setBusy(false) }
              }

              private fun saveToGallery(f: File) {
                  try {
                      val name = "moss_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".png"
                      val v = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/MossLocal")
                      }
                      val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return
                      contentResolver.openOutputStream(uri)?.use { o -> f.inputStream().use { it.copyTo(o) } }
                      log("Saved to Pictures/MossLocal/$name")
                  } catch (e: Exception) { log("Gallery save failed: $e") }
              }

              // ---------- self-test ----------
              private fun selfTest() {
                  if (busy) { log("Busy."); return }
                  setBusy(true); cancel = false
                  try {
                      val bin = File(applicationInfo.nativeLibraryDir, "libsdcli.so")
                      log("Engine: exists=${bin.exists()} size=${bin.length() / 1024} KB executable=${bin.canExecute()}")
                      log("Free RAM ${availMemMb()} MB | free disk ${freeDiskMb()} MB")
                      presets.forEach { log("${it.id}: " + if (validModel(presetFile(it))) "downloaded" else "not downloaded") }
                      val pb = ProcessBuilder(bin.absolutePath, "--help").redirectErrorStream(true)
                      pb.environment()["LD_LIBRARY_PATH"] = libEnv
                      val p = pb.start(); proc = p
                      val txt = p.inputStream.bufferedReader().readText()
                      p.waitFor()
                      log("Help output: ${txt.lines().size} lines")
                      listOf("-m", "--sampling-method", "--vae-tiling", "--diffusion-model", "--llm")
                          .forEach { log("flag $it: " + if (txt.contains(it)) "supported" else "NOT in this engine build") }
                      log("'lcm' sampler listed: " + txt.contains("lcm", ignoreCase = true))
                      log("MOSS mentioned in engine help: " + txt.contains("moss", ignoreCase = true))
                  } catch (e: Exception) { log("Self-test failed: $e") }
                  finally { proc = null; setBusy(false) }
              }

              // ---------- downloads: resumable, retrying, validated, with progress ----------
              private fun downloadSelected(idx: Int, a: String, b: String, c: String) {
                  if (busy) { log("Busy."); return }
                  setBusy(true); cancel = false
                  try {
                      val jobs = if (idx < presets.size) listOf(presets[idx].url to presetFile(presets[idx]))
                                 else listOf(a to dit, b to te, c to vae)
                      jobs.forEach { (u, f) ->
                          if (cancel) return@forEach
                          if (u.isBlank()) { log("No URL for ${f.name}"); return@forEach }
                          if (!u.startsWith("https://")) { log("URL for ${f.name} must start with https://"); return@forEach }
                          if (validModel(f)) { log("${f.name} already OK"); return@forEach }
                          var ok = false
                          for (attempt in 1..4) {
                              if (cancel) break
                              try { download(u, f); ok = true; break }
                              catch (e: Exception) {
                                  if (cancel) break
                                  log("${f.name} attempt $attempt failed: $e")
                                  try { Thread.sleep(2000L * attempt) } catch (ie: InterruptedException) { }
                              }
                          }
                          if (ok && !validModel(f)) { log("${f.name} is not a valid model file. Deleted."); f.delete() }
                      }
                      log(if (cancel) "Download cancelled. Progress kept; tap again to resume." else "Download step finished.")
                  } finally {
                      setBusy(false)
                      ui.post { status.text = ""; bar.progress = 0; refreshSpinner(idx) }
                  }
              }

              private fun download(u: String, dest: File) {
                  val part = File(dest.path + ".part")
                  val have = if (part.exists()) part.length() else 0L
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 30000; c.readTimeout = 60000; c.instanceFollowRedirects = true
                  if (have > 0) c.setRequestProperty("Range", "bytes=$have-")
                  val code = c.responseCode
                  if (code == 416) { part.renameTo(dest); return }
                  if (code !in 200..299) throw RuntimeException("HTTP $code")
                  val append = code == 206
                  val total = if (append) have + c.contentLengthLong else c.contentLengthLong
                  val need = (if (total > 0) total else 0L) - (if (append) have else 0L)
                  val free = StatFs(modelDir.path).availableBytes
                  if (need > free - (200L shl 20)) throw RuntimeException("Not enough storage: need ${need shr 20} MB, free ${free shr 20} MB")
                  log("Downloading ${dest.name} (${total shr 20} MB)")
                  RandomAccessFile(part, "rw").use { raf ->
                      if (append) raf.seek(have) else raf.setLength(0)
                      var done = if (append) have else 0L
                      var lastUi = 0L
                      c.inputStream.use { inp ->
                          val buf = ByteArray(1 shl 20)
                          while (true) {
                              if (cancel) throw RuntimeException("cancelled")
                              val n = inp.read(buf); if (n < 0) break
                              raf.write(buf, 0, n); done += n
                              if (done - lastUi > (2L shl 20)) { lastUi = done; setProgress(done, total, dest.name) }
                          }
                      }
                  }
                  if (total > 0 && part.length() != total) throw RuntimeException("incomplete (${part.length()} of $total bytes)")
                  dest.delete()
                  if (!part.renameTo(dest)) throw RuntimeException("could not finalize file")
                  log("${dest.name} done")
              }

              private fun setProgress(done: Long, total: Long, name: String) {
                  ui.post {
                      if (total > 0) { bar.max = 1000; bar.progress = (done * 1000 / total).toInt() }
                      status.text = "$name: ${done shr 20} / ${total shr 20} MB"
                  }
              }

              // ---------- in-place self update from GitHub Releases ----------
              private fun sha256(f: File): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  f.inputStream().use { i ->
                      val b = ByteArray(1 shl 16)
                      while (true) { val n = i.read(b); if (n < 0) break; md.update(b, 0, n) }
                  }
                  return md.digest().joinToString("") { "%02x".format(it) }
              }

              private fun httpText(u: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000; c.readTimeout = 30000; c.instanceFollowRedirects = true
                  return c.inputStream.bufferedReader().readText()
              }

              private fun selfUpdate() {
                  if (busy) { log("Wait until the current job ends."); return }
                  try {
                      if (!packageManager.canRequestPackageInstalls()) {
                          log("Allow 'Install unknown apps' for MossLocal, then tap Update again.")
                          ui.post { startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName"))) }
                          return
                      }
                      val c = URL("https://api.github.com/repos/${BuildConfig.REPO_SLUG}/releases/latest").openConnection() as HttpURLConnection
                      c.connectTimeout = 15000; c.readTimeout = 30000
                      c.setRequestProperty("Accept", "application/vnd.github+json")
                      when (c.responseCode) {
                          200 -> { }
                          404 -> { log("No release found (repo is private, or nothing published yet)."); return }
                          403, 429 -> { log("GitHub rate limit reached. Try again later."); return }
                          else -> { log("Update check failed: HTTP ${c.responseCode}"); return }
                      }
                      val j = JSONObject(c.inputStream.bufferedReader().readText())
                      val remote = j.getString("tag_name").removePrefix("v").toIntOrNull()
                      if (remote == null) { log("Unrecognised release tag."); return }
                      if (remote <= BuildConfig.VERSION_CODE) { log("Up to date (build ${BuildConfig.VERSION_CODE})."); return }
                      var apkUrl = ""; var apkName = ""; var sumsUrl = ""
                      val assets = j.getJSONArray("assets")
                      for (i in 0 until assets.length()) {
                          val a = assets.getJSONObject(i); val n = a.getString("name")
                          if (n.endsWith(".apk")) { apkUrl = a.getString("browser_download_url"); apkName = n }
                          if (n == "SHA256SUMS.txt") sumsUrl = a.getString("browser_download_url")
                      }
                      if (apkUrl.isEmpty()) { log("Release has no APK."); return }
                      log("Downloading build $remote ...")
                      val apk = File(externalCacheDir, "update.apk"); apk.delete()
                      val d = URL(apkUrl).openConnection() as HttpURLConnection
                      d.connectTimeout = 30000; d.readTimeout = 60000; d.instanceFollowRedirects = true
                      d.inputStream.use { i -> apk.outputStream().use { o -> i.copyTo(o) } }
                      if (sumsUrl.isNotEmpty()) {
                          val expected = httpText(sumsUrl).lines().firstOrNull { it.contains(apkName) }
                              ?.trim()?.split(Regex("\\s+"))?.firstOrNull()
                          if (expected == null || !expected.equals(sha256(apk), ignoreCase = true)) {
                              apk.delete(); log("Checksum mismatch - update rejected."); return
                          }
                          log("Checksum OK.")
                      } else log("Warning: release has no checksum file.")
                      val uri = FileProvider.getUriForFile(this, "com.mosslocal.app.files", apk)
                      val inst = Intent(Intent.ACTION_VIEW).setDataAndType(uri, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      log("Installing over the current app. Models and settings are kept.")
                      ui.post { startActivity(inst) }
                  } catch (e: Exception) { log("Update failed: $e") }
              }
          }
          EOF

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and name the APK
        run: |
          APK="MossLocal-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsdcli.so' || { echo "::error::sd-cli missing from APK"; exit 1; }
          sha256sum "$APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release (tag = v<versionCode>, used by in-app updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MossLocal ${{ env.VERSION_NAME }}
          files: |
            MossLocal-${{ env.VERSION_NAME }}.apk
            SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: MossLocal-apk
          path: MossLocal-*.apk
          retention-days: 14
