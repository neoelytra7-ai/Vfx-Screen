            vec3 hor = vec3(.72,.84,.95), zen = vec3(.20,.42,.84);
            vec3 c = mix(hor, zen, pow(y,.55));
            float s = max(dot(d,sun),0.);
            c += vec3(1.,.85,.6)*(pow(s,600.)*3. + pow(s,12.)*.25);
            o = vec4(c,1.);
          }"""
              private val fsFade = """#version 300 es
          precision mediump float;
          uniform float a; out vec4 o;
          void main(){ o = vec4(0.,0.,0.,a); }"""

              private fun compile(t: Int, src: String): Int {
                  val s = G.glCreateShader(t); G.glShaderSource(s, src); G.glCompileShader(s)
                  val ok = IntArray(1); G.glGetShaderiv(s, G.GL_COMPILE_STATUS, ok, 0)
                  if (ok[0] == 0) throw RuntimeException("shader: " + G.glGetShaderInfoLog(s))
                  return s
              }

              private fun prog(v: String, f: String): Int {
                  val p = G.glCreateProgram()
                  G.glAttachShader(p, compile(G.GL_VERTEX_SHADER, v)); G.glAttachShader(p, compile(G.GL_FRAGMENT_SHADER, f))
                  G.glLinkProgram(p)
                  val ok = IntArray(1); G.glGetProgramiv(p, G.GL_LINK_STATUS, ok, 0)
                  if (ok[0] == 0) throw RuntimeException("link: " + G.glGetProgramInfoLog(p))
                  return p
              }

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  progScene = prog(vsScene, fsScene); progSky = prog(vsSky, fsSky); progFade = prog(vsSky, fsFade)
                  G.glEnable(G.GL_DEPTH_TEST)
                  G.glDisable(G.GL_CULL_FACE)
                  chunks.clear(); pending.clear(); wantKey = Long.MIN_VALUE
                  last = System.nanoTime()
              }

              override fun onSurfaceChanged(gl: GL10?, w: Int, h: Int) { sw = w; sh = h; G.glViewport(0, 0, w, h) }

              private fun key(cx: Int, cz: Int) = (cx.toLong() shl 32) or (cz.toLong() and 0xffffffffL)
              private fun kx(k: Long) = (k shr 32).toInt()
              private fun kz(k: Long) = k.toInt()

              // ---------- streaming ----------
              private fun addRing(set: HashMap<Long, Float>, cx: Int, cz: Int, r: Int) {
                  for (dx in -r..r) for (dz in -r..r) {
                      val d = hypot(dx.toFloat(), dz.toFloat())
                      if (d > r) continue
                      val k = key(cx + dx, cz + dz); val o = set[k]
                      if (o == null || d < o) set[k] = d
                  }
              }

              private fun updateWanted(now: Long) {
                  val cx = floor(px / 16f).toInt(); val cz = floor(pz / 16f).toInt()
                  val k = key(cx, cz)
                  if (k == wantKey && now - wantStamp < 700) return
                  wantKey = k; wantStamp = now
                  val set = HashMap<Long, Float>()
                  addRing(set, cx, cz, radius)
                  val n = nx
                  if (n != null) for (i in n.ptsX.indices) addRing(set, floor(n.ptsX[i] / 16f).toInt(), floor(n.ptsZ[i] / 16f).toInt(), if (i == 0) 7 else 4)
                  wanted = set.entries.sortedBy { it.value }.map { it.key }
                  // buang yang jauh
                  val keep = set.keys
                  val it = chunks.entries.iterator()
                  while (it.hasNext()) {
                      val e = it.next()
                      if (!keep.contains(e.key)) {
                          val dx = abs(kx(e.key) - cx); val dz = abs(kz(e.key) - cz)
                          if (max(dx, dz) > radius + 2 || n != null) {
                              G.glDeleteBuffers(1, intArrayOf(e.value.vbo), 0)
                              if (e.value.wvbo != 0) G.glDeleteBuffers(1, intArrayOf(e.value.wvbo), 0)
                              it.remove()
                          }
                      }
                  }
              }

              private fun pump() {
                  var budget = 8
                  for (k in wanted) {
                      if (budget <= 0 || pending.size >= 10) break
                      if (chunks.containsKey(k) || pending.contains(k)) continue
                      pending.add(k); budget--
                      val cx = kx(k); val cz = kz(k)
                      exec.execute { try { done.add(world.build(cx, cz)) } catch (e: Throwable) { } }
                  }
                  var up = 3
                  while (up > 0) {
                      val m = done.poll() ?: break
                      val k = key(m.cx, m.cz); pending.remove(k)
                      if (!wanted.contains(k) && chunks.size > 4) continue
                      val b = IntArray(2)
                      G.glGenBuffers(2, b, 0)
                      G.glBindBuffer(G.GL_ARRAY_BUFFER, b[0])
                      G.glBufferData(G.GL_ARRAY_BUFFER, m.n * 24, m.v, G.GL_STATIC_DRAW)
                      var wv = 0
                      if (m.w != null && m.wn > 0) {
                          G.glBindBuffer(G.GL_ARRAY_BUFFER, b[1])
                          G.glBufferData(G.GL_ARRAY_BUFFER, m.wn * 24, m.w, G.GL_STATIC_DRAW)
                          wv = b[1]
                      } else G.glDeleteBuffers(1, intArrayOf(b[1]), 0)
                      chunks[k] = Chunk(b[0], m.n, wv, m.wn)
                      up--
                  }
              }

              private fun ready(s: Shot): Boolean {
                  val cx = floor(s.ptsX[0] / 16f).toInt(); val cz = floor(s.ptsZ[0] / 16f).toInt()
                  var tot = 0; var ok = 0
                  for (dx in -6..6) for (dz in -6..6) if (hypot(dx.toFloat(), dz.toFloat()) <= 6f) { tot++; if (chunks.containsKey(key(cx + dx, cz + dz))) ok++ }
                  return ok >= tot * .98f
              }

              // ---------- kamera ----------
              private fun freeStep(dt: Float) {
                  yaw -= lookDX * .0045f; pit = (pit - lookDY * .0045f).coerceIn(-1.45f, 1.45f); lookDX = 0f; lookDY = 0f
                  val f = -moveY; val r = moveX; val sp = 16f
                  px += (-sin(yaw) * f + cos(yaw) * r) * sp * dt
                  pz += (-cos(yaw) * f - sin(yaw) * r) * sp * dt
                  val tgt = world.hg(px, pz) + 3f
                  py += (tgt - py) * min(1f, dt * 5f)
                  val d = world.clr(px, py, pz, .8f, co)
                  if (d < 0f) { px += co[0] * -d; py += co[1] * -d; pz += co[2] * -d }
                  roll += (0f - roll) * min(1f, dt * 4f); fov += (1.15f - fov) * min(1f, dt * 4f)
              }

              private fun cut() {
                  cur = nx; nx = null; ct = 0f; fade = 1f; shotNo++
                  val c = cur!!
                  anchX = c.ax; anchZ = c.az
                  val n = shotNo; val a = anchX; val b = anchZ
                  fut = exec.submit(Callable<Shot> { planner.make(n, 1, a, b) })
                  act.showTitle("SCENE " + String.format("%02d", shotNo) + " — " + c.tag, c.name)
                  wantKey = Long.MIN_VALUE
              }

              private fun cinStep(dt: Float, now: Long) {
                  if (!wasCin) {
                      wasCin = true; cur = null; nx = null; shotNo = 0; anchX = px; anchZ = pz; waitT = 0f
                      fut = exec.submit(Callable<Shot> { planner.make(0, 1, anchX, anchZ) })
                  }
                  val f = fut
                  if (f != null && f.isDone) {
                      try { nx = f.get() } catch (e: Exception) { nx = null }
                      fut = null; wantKey = Long.MIN_VALUE
                  }
                  val c = cur
                  if (c == null) {
                      val n = nx ?: return
                      waitT += dt
                      rig.pose(n, 0f, waitT, dt, pose); apply()
                      if (ready(n) || waitT > 14f) cut()
                      return
                  }
                  ct += dt
                  fade = max(0f, fade - dt / 1.2f)
                  val u = min(1f, ct / c.dur)
                  rig.pose(c, rig.ease(u, c.ease), ct, dt, pose); apply()
                  val n = nx
                  if (n != null && ct >= c.dur && (ready(n) || ct > c.dur + 8f)) cut()
              }

              private fun apply() { px = pose.x; py = pose.y; pz = pose.z; yaw = pose.yaw; pit = pose.pit; roll = pose.roll; fov = pose.fov }

              fun setCinematic(on: Boolean) {
                  cin = on
                  if (!on) { wasCin = false; cur = null; nx = null; fut = null; fade = 0f; roll = 0f; wantKey = Long.MIN_VALUE; act.hideTitle() }
              }

              // ---------- frame ----------
              override fun onDrawFrame(gl: GL10?) {
                  val t = System.nanoTime()
                  val dt = min(.05f, (t - last) / 1e9f); last = t
                  fps += (1f / max(dt, 1e-3f) - fps) * .05f
                  if (cin) cinStep(dt, t) else { wasCin = false; freeStep(dt) }
                  updateWanted(t / 1000000L); pump()

                  val cp = cos(pit); val sp = sin(pit)
                  val fw = floatArrayOf(-sin(yaw) * cp, sp, -cos(yaw) * cp)
                  val r0 = floatArrayOf(cos(yaw), 0f, -sin(yaw)); val u0 = floatArrayOf(sin(yaw) * sp, cp, cos(yaw) * sp)
                  val cr = cos(roll); val sr = sin(roll)
                  val rv = FloatArray(3) { r0[it] * cr + u0[it] * sr }; val uv = FloatArray(3) { u0[it] * cr - r0[it] * sr }
                  val e = floatArrayOf(px, py, pz)
                  fun dot(a: FloatArray, b: FloatArray) = a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
                  val z = floatArrayOf(-fw[0], -fw[1], -fw[2])
                  view[0] = rv[0]; view[1] = uv[0]; view[2] = z[0]; view[3] = 0f
                  view[4] = rv[1]; view[5] = uv[1]; view[6] = z[1]; view[7] = 0f
                  view[8] = rv[2]; view[9] = uv[2]; view[10] = z[2]; view[11] = 0f
                  view[12] = -dot(rv, e); view[13] = -dot(uv, e); view[14] = -dot(z, e); view[15] = 1f
                  val asp = sw / sh.toFloat()
                  Matrix.perspectiveM(proj, 0, Math.toDegrees(fov.toDouble()).toFloat(), asp, .1f, 1500f)
                  Matrix.multiplyMM(mvp, 0, proj, 0, view, 0)

                  G.glViewport(0, 0, sw, sh)
                  G.glClearColor(.72f, .84f, .95f, 1f)
                  G.glClear(G.GL_COLOR_BUFFER_BIT or G.GL_DEPTH_BUFFER_BIT)
                  val sun = floatArrayOf(.5f, .55f, .35f)
                  val sl = hypot(hypot(sun[0], sun[1]), sun[2]); for (i in 0..2) sun[i] /= sl
                  // langit
                  G.glDisable(G.GL_DEPTH_TEST)
                  G.glUseProgram(progSky)
                  G.glUniform3fv(G.glGetUniformLocation(progSky, "R"), 1, rv, 0)
                  G.glUniform3fv(G.glGetUniformLocation(progSky, "U"), 1, uv, 0)
                  G.glUniform3fv(G.glGetUniformLocation(progSky, "F"), 1, fw, 0)
                  G.glUniform3fv(G.glGetUniformLocation(progSky, "sun"), 1, sun, 0)
                  G.glUniform2f(G.glGetUniformLocation(progSky, "th"), tan(fov / 2f) * asp, tan(fov / 2f))
                  G.glDrawArrays(G.GL_TRIANGLES, 0, 3)
                  G.glEnable(G.GL_DEPTH_TEST)
                  // dunia
                  G.glUseProgram(progScene)
                  G.glUniformMatrix4fv(G.glGetUniformLocation(progScene, "m"), 1, false, mvp, 0)
                  G.glUniform3f(G.glGetUniformLocation(progScene, "cp"), px, py, pz)
                  G.glUniform3f(G.glGetUniformLocation(progScene, "fogc"), .72f, .84f, .95f)
                  G.glUniform1f(G.glGetUniformLocation(progScene, "fd"), 1f / (radius * 16f * .95f))
                  val uAlpha = G.glGetUniformLocation(progScene, "alpha")
                  G.glEnableVertexAttribArray(0); G.glEnableVertexAttribArray(1)
                  G.glUniform1f(uAlpha, 1f)
                  var drawn = 0
                  for ((k, c) in chunks) {
                      val vx = kx(k) * 16f + 8f - px; val vz = kz(k) * 16f + 8f - pz
                      if (vx * fw[0] + vz * fw[2] < -28f * (1f + 0f) && hypot(vx, vz) > 40f) continue
                      G.glBindBuffer(G.GL_ARRAY_BUFFER, c.vbo)
                      G.glVertexAttribPointer(0, 3, G.GL_FLOAT, false, 24, 0); G.glVertexAttribPointer(1, 3, G.GL_FLOAT, false, 24, 12)
                      G.glDrawArrays(G.GL_TRIANGLES, 0, c.n); drawn++
                  }
                  G.glEnable(G.GL_BLEND); G.glBlendFunc(G.GL_SRC_ALPHA, G.GL_ONE_MINUS_SRC_ALPHA); G.glDepthMask(false)
                  G.glUniform1f(uAlpha, .62f)
                  for ((k, c) in chunks) {
                      if (c.wvbo == 0) continue
                      G.glBindBuffer(G.GL_ARRAY_BUFFER, c.wvbo)
                      G.glVertexAttribPointer(0, 3, G.GL_FLOAT, false, 24, 0); G.glVertexAttribPointer(1, 3, G.GL_FLOAT, false, 24, 12)
                      G.glDrawArrays(G.GL_TRIANGLES, 0, c.wn)
                  }
                  G.glDepthMask(true)
                  // fade antar scene
                  if (cin && fade > 0f) {
                      G.glDisable(G.GL_DEPTH_TEST); G.glUseProgram(progFade)
                      G.glUniform1f(G.glGetUniformLocation(progFade, "a"), fade * fade * (3f - 2f * fade))
                      G.glDrawArrays(G.GL_TRIANGLES, 0, 3); G.glEnable(G.GL_DEPTH_TEST)
                  }
                  G.glDisable(G.GL_BLEND)
                  // letterbox 2.39:1
                  if (cin) {
                      val bh = ((sh - sw / 2.39f) / 2f).toInt()
                      if (bh > 0) {
                          G.glEnable(G.GL_SCISSOR_TEST); G.glClearColor(0f, 0f, 0f, 1f)
                          G.glScissor(0, 0, sw, bh); G.glClear(G.GL_COLOR_BUFFER_BIT)
                          G.glScissor(0, sh - bh, sw, bh); G.glClear(G.GL_COLOR_BUFFER_BIT)
                          G.glDisable(G.GL_SCISSOR_TEST)
                      }
                  }
                  hudT += dt
                  if (hudT > .5f) {
                      hudT = 0f
                      act.setHud(fps.toInt().toString() + " fps · chunk " + drawn + "/" + chunks.size + " · antre " + pending.size + (if (cin) " · cinematic" else ""))
                  }
              }

              fun destroy() { exec.shutdownNow() }
          }
