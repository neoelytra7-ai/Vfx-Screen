          package com.infinitepath.app

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.Typeface
          import android.opengl.GLSurfaceView
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var gv: GLSurfaceView
              private lateinit var r: Renderer
              private lateinit var hud: TextView
              private lateinit var titleTv: TextView
              private var mvId = -1; private var mx0 = 0f; private var my0 = 0f
              private var lkId = -1; private var lx = 0f; private var ly = 0f

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  try { window.setSustainedPerformanceMode(true) } catch (_: Throwable) {}
                  pickHighRefresh()
                  val root = FrameLayout(this)
                  gv = GLSurfaceView(this)
                  gv.setEGLContextClientVersion(3)
                  gv.setEGLConfigChooser(8, 8, 8, 0, 24, 0)
                  r = Renderer(this)
                  gv.setRenderer(r)
                  root.addView(gv)

                  hud = TextView(this)
                  hud.setTextColor(Color.WHITE); hud.textSize = 11f; hud.setShadowLayer(4f, 0f, 1f, Color.BLACK)
                  root.addView(hud, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START).also { it.setMargins(24, 16, 0, 0) })

                  titleTv = TextView(this)
                  titleTv.setTextColor(Color.WHITE); titleTv.textSize = 22f; titleTv.typeface = Typeface.SERIF
                  titleTv.letterSpacing = .3f; titleTv.setShadowLayer(14f, 0f, 2f, Color.BLACK); titleTv.alpha = 0f
                  root.addView(titleTv, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).also { it.setMargins(80, 0, 0, 140) })

                  val cb = Button(this)
                  cb.text = "\uD83C\uDFAC"; cb.setOnClickListener { r.setCinematic(!r.cin) }
                  root.addView(cb, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).also { it.setMargins(0, 8, 8, 0) })
                  val ub = Button(this)
                  ub.text = "\u2B06"; ub.setOnClickListener { Updater.check(this, true) }
                  root.addView(ub, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).also { it.setMargins(0, 130, 8, 0) })
                  setContentView(root)

                  gv.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                              val i = e.actionIndex; val id = e.getPointerId(i); val x = e.getX(i); val y = e.getY(i)
                              if (x < v.width * .45f && mvId < 0) { mvId = id; mx0 = x; my0 = y }
                              else if (lkId < 0) { lkId = id; lx = x; ly = y }
                          }
                          MotionEvent.ACTION_MOVE -> for (i in 0 until e.pointerCount) {
                              val id = e.getPointerId(i)
                              if (id == mvId) {
                                  r.moveX = ((e.getX(i) - mx0) / 90f).coerceIn(-1f, 1f); r.moveY = ((e.getY(i) - my0) / 90f).coerceIn(-1f, 1f)
                              } else if (id == lkId) {
                                  r.lookDX += e.getX(i) - lx; r.lookDY += e.getY(i) - ly; lx = e.getX(i); ly = e.getY(i)
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                              val id = e.getPointerId(e.actionIndex)
                              if (id == mvId) { mvId = -1; r.moveX = 0f; r.moveY = 0f }
                              if (id == lkId) lkId = -1
                          }
                      }
                      true
                  }
                  Updater.check(this, false)
              }

              fun setHud(s: String) { runOnUiThread { hud.text = s } }
              fun showTitle(s: String, name: String) {
                  runOnUiThread {
                      titleTv.text = s + "\n" + name.uppercase()
                      titleTv.animate().cancel(); titleTv.alpha = 0f
                      titleTv.animate().setStartDelay(600).alpha(1f).setDuration(900).withEndAction {
                          titleTv.animate().setStartDelay(3500).alpha(0f).setDuration(1200).start()
                      }.start()
                  }
              }
              fun hideTitle() { runOnUiThread { titleTv.animate().cancel(); titleTv.alpha = 0f } }

              private fun pickHighRefresh() {
                  try {
                      @Suppress("DEPRECATION")
                      val m = windowManager.defaultDisplay.supportedModes.maxByOrNull { it.refreshRate }
                      if (m != null) { val lp = window.attributes; lp.preferredDisplayModeId = m.modeId; window.attributes = lp }
                  } catch (_: Throwable) {}
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus) return
                  if (Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.let {
                          it.hide(WindowInsets.Type.systemBars())
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  }
              }

              override fun onPause() { super.onPause(); gv.onPause() }
              override fun onResume() { super.onResume(); gv.onResume() }
              override fun onDestroy() { r.destroy(); super.onDestroy() }
          }
