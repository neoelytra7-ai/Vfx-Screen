name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/example/cineoverlay
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CineOverlay"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.cineoverlay"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.cineoverlay"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="CineOverlay" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FxService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Screen overlay visual effects"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/cineoverlay/FxView.kt <<'EOF'
          package com.example.cineoverlay
          
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import kotlin.random.Random
          
          /** Live-tweakable settings, 0..100 each. */
          object Fx {
              @Volatile var vignette = 45
              @Volatile var grain = 25
              @Volatile var grade = 30      // teal/orange cinematic color grade
              @Volatile var fringe = 35     // red/cyan chromatic edge fringing
              @Volatile var letterbox = 0   // 2.39:1 bars
              @Volatile var scanlines = 0
          }
          
          class FxView(ctx: Context) : View(ctx) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private var lastFrame = 0L
              private val tick = object : Runnable {
                  override fun run() { invalidate(); postOnAnimation(this) }
              }
          
              override fun onAttachedToWindow() { super.onAttachedToWindow(); postOnAnimation(tick) }
              override fun onDetachedFromWindow() { removeCallbacks(tick); super.onDetachedFromWindow() }
          
              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (w == 0f) return
                  val cx = w / 2; val cy = h / 2
                  val r = Math.hypot(cx.toDouble(), cy.toDouble()).toFloat()
          
                  // Teal (top) -> orange (bottom) grade
                  if (Fx.grade > 0) {
                      val a = (Fx.grade * 0.9f).toInt()
                      p.shader = LinearGradient(0f, 0f, 0f, h,
                          Color.argb(a, 0, 110, 130), Color.argb(a, 255, 120, 30), Shader.TileMode.CLAMP)
                      c.drawRect(0f, 0f, w, h, p); p.shader = null
                  }
          
                  // Chromatic edge fringing: red and cyan rings, offset in opposite directions
                  if (Fx.fringe > 0) {
                      val a = (Fx.fringe * 1.6f).toInt().coerceAtMost(200)
                      val off = w * 0.006f * (Fx.fringe / 50f)
                      for ((color, dx) in listOf(Color.rgb(255, 0, 40) to off, Color.rgb(0, 220, 255) to -off)) {
                          p.shader = RadialGradient(cx + dx, cy, r,
                              intArrayOf(Color.TRANSPARENT, Color.TRANSPARENT, Color.argb(a, Color.red(color), Color.green(color), Color.blue(color))),
                              floatArrayOf(0f, 0.7f, 1f), Shader.TileMode.CLAMP)
                          c.drawRect(0f, 0f, w, h, p)
                      }
                      p.shader = null
                  }
          
                  // Vignette
                  if (Fx.vignette > 0) {
                      p.shader = RadialGradient(cx, cy, r,
                          intArrayOf(Color.TRANSPARENT, Color.TRANSPARENT, Color.argb((Fx.vignette * 2.4f).toInt().coerceAtMost(240), 0, 0, 0)),
                          floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                      c.drawRect(0f, 0f, w, h, p); p.shader = null
                  }
          
                  // Scanlines
                  if (Fx.scanlines > 0) {
                      p.color = Color.argb((Fx.scanlines * 1.2f).toInt(), 0, 0, 0)
                      var y = 0f
                      while (y < h) { c.drawRect(0f, y, w, y + 1.5f, p); y += 4f }
                  }
          
                  // Film grain (re-rolled ~24fps)
                  if (Fx.grain > 0) {
                      val now = System.nanoTime()
                      if (now - lastFrame > 41_000_000L) lastFrame = now
                      val rnd = Random(lastFrame)
                      val n = 200 + Fx.grain * 12
                      p.strokeWidth = 2.5f
                      repeat(n) {
                          val light = rnd.nextBoolean()
                          p.color = Color.argb(20 + Fx.grain, if (light) 255 else 0, if (light) 255 else 0, if (light) 255 else 0)
                          c.drawPoint(rnd.nextFloat() * w, rnd.nextFloat() * h, p)
                      }
                  }
          
                  // Letterbox
                  if (Fx.letterbox > 0) {
                      val bar = ((h - w / 2.39f) / 2f).coerceAtLeast(0f) * (Fx.letterbox / 100f)
                      p.color = Color.BLACK
                      c.drawRect(0f, 0f, w, bar, p); c.drawRect(0f, h - bar, w, h, p)
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/cineoverlay/FxService.kt <<'EOF'
          package com.example.cineoverlay
          
          import android.app.*
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.WindowManager
          
          class FxService : Service() {
              private var view: FxView? = null
              private val wm get() = getSystemService(WINDOW_SERVICE) as WindowManager
          
              override fun onBind(i: Intent?): IBinder? = null
          
              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("fx", "Overlay", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 0,
                      Intent(this, FxService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
                  startForeground(1, Notification.Builder(this, "fx")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Cinematic overlay active")
                      .addAction(Notification.Action.Builder(null, "Stop", stop).build()).build())
          
                  if (i?.action == "STOP") { stopSelf(); return START_NOT_STICKY }
                  if (view == null) {
                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.TRANSLUCENT)
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      view = FxView(this).also { wm.addView(it, lp) }
                  }
                  return START_STICKY
              }
          
              override fun onDestroy() { view?.let { wm.removeView(it) }; view = null; super.onDestroy() }
          }
          EOF
          cat > app/src/main/java/com/example/cineoverlay/RootFx.kt <<'EOF'
          package com.example.cineoverlay
          
          /** Root mode: sets SurfaceFlinger's global color matrix (what Night Light uses). Zero overlay cost, affects every pixel. */
          object RootFx {
              @Volatile var sat = 115     // 0..200 (100 = normal)
              @Volatile var contrast = 110
              @Volatile var warmth = 20   // -100 cool .. +100 warm
          
              fun apply(): Boolean {
                  val s = sat / 100f; val c = contrast / 100f; val w = warmth / 100f
                  val l = floatArrayOf(0.213f, 0.715f, 0.072f)
                  val gain = floatArrayOf(1f + 0.12f * w, 1f, 1f - 0.18f * w)
                  val m = Array(3) { FloatArray(3) }
                  for (r in 0..2) for (k in 0..2)
                      m[r][k] = (l[k] * (1 - s) + (if (r == k) s else 0f)) * c * gain[r]
                  val off = FloatArray(3) { (1 - c) / 2f * gain[it] }
                  // column-major 4x4; translation lives in elements 12..14
                  val f = floatArrayOf(
                      m[0][0], m[1][0], m[2][0], 0f,
                      m[0][1], m[1][1], m[2][1], 0f,
                      m[0][2], m[1][2], m[2][2], 0f,
                      off[0], off[1], off[2], 1f)
                  return su("service call SurfaceFlinger 1015 i32 1 " + f.joinToString(" ") { "f $it" })
              }
          
              fun reset() = su("service call SurfaceFlinger 1015 i32 0")
          
              private fun su(cmd: String): Boolean = try {
                  Runtime.getRuntime().exec(arrayOf("su", "-c", cmd)).waitFor() == 0
              } catch (e: Exception) { false }
          }
          EOF
          cat > app/src/main/java/com/example/cineoverlay/MainActivity.kt <<'EOF'
          package com.example.cineoverlay
          
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          
          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
                  fun slider(name: String, get: () -> Int, set: (Int) -> Unit) {
                      root.addView(TextView(this).apply { text = name; setPadding(0, 32, 0, 0) })
                      root.addView(SeekBar(this).apply {
                          max = 100; progress = get()
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, v: Int, u: Boolean) = set(v)
                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) {}
                          })
                      })
                  }
                  slider("Vignette", { Fx.vignette }) { Fx.vignette = it }
                  slider("Chromatic fringe", { Fx.fringe }) { Fx.fringe = it }
                  slider("Teal/orange grade", { Fx.grade }) { Fx.grade = it }
                  slider("Film grain", { Fx.grain }) { Fx.grain = it }
                  slider("Scanlines", { Fx.scanlines }) { Fx.scanlines = it }
                  slider("Letterbox 2.39:1", { Fx.letterbox }) { Fx.letterbox = it }
          
                  root.addView(TextView(this).apply { text = "— ROOT MODE (whole-screen color matrix) —"; setPadding(0, 56, 0, 0) })
                  slider("Saturation", { RootFx.sat / 2 }) { RootFx.sat = it * 2; RootFx.apply() }
                  slider("Contrast", { (RootFx.contrast - 50) }) { RootFx.contrast = it + 50; RootFx.apply() }
                  slider("Warmth", { (RootFx.warmth + 100) / 2 }) { RootFx.warmth = it * 2 - 100; RootFx.apply() }
                  root.addView(Button(this).apply {
                      text = "Root grade: reset"
                      setOnClickListener { RootFx.reset() }
                  })
                  root.addView(Button(this).apply {
                      text = "Start overlay"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                              startForegroundService(Intent(this@MainActivity, FxService::class.java))
                          }
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Stop overlay"
                      setOnClickListener { stopService(Intent(this@MainActivity, FxService::class.java)) }
                  })
                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: CineOverlay-debug, path: app/build/outputs/apk/debug/*.apk }
