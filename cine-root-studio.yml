name: Build CineRoot Studio APK
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate CineRoot Studio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/cineroot/studio
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CineRootStudio"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.cineroot.studio"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.cineroot.studio"
                  minSdk = 26
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="CineRoot Studio"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/cineroot/studio/MainActivity.kt <<'EOF'
          package com.cineroot.studio

          import android.app.Activity
          import android.app.AlertDialog
          import android.animation.LayoutTransition
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.widget.*
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread
          import kotlin.math.roundToInt

          private data class Grade(
              var exposure: Int = 0, var contrast: Int = 100, var saturation: Int = 100,
              var temperature: Int = 0, var tint: Int = 0, var highlights: Int = 0,
              var shadows: Int = 0, var vibrance: Int = 0, var red: Int = 0,
              var green: Int = 0, var blue: Int = 0, var vignette: Int = 0,
              var grain: Int = 0, var bloom: Int = 0, var tealOrange: Int = 0
          ) {
              fun json(): JSONObject = JSONObject().apply {
                  put("exposure", exposure); put("contrast", contrast); put("saturation", saturation)
                  put("temperature", temperature); put("tint", tint); put("highlights", highlights)
                  put("shadows", shadows); put("vibrance", vibrance); put("red", red)
                  put("green", green); put("blue", blue); put("vignette", vignette)
                  put("grain", grain); put("bloom", bloom); put("tealOrange", tealOrange)
              }
              companion object {
                  fun from(j: JSONObject) = Grade(
                      j.optInt("exposure", 0), j.optInt("contrast", 100), j.optInt("saturation", 100),
                      j.optInt("temperature", 0), j.optInt("tint", 0), j.optInt("highlights", 0),
                      j.optInt("shadows", 0), j.optInt("vibrance", 0), j.optInt("red", 0),
                      j.optInt("green", 0), j.optInt("blue", 0), j.optInt("vignette", 0),
                      j.optInt("grain", 0), j.optInt("bloom", 0), j.optInt("tealOrange", 0)
                  )
              }
          }

          private data class Control(val key: String, val title: String, val min: Int, val max: Int, val unit: String = "", val hint: String = "")

          class MainActivity : Activity() {
              private val prefs by lazy { getSharedPreferences("cine_root_studio", Context.MODE_PRIVATE) }
              private var grade = Grade()
              private lateinit var content: LinearLayout
              private lateinit var status: TextView
              private lateinit var rootButton: Button
              private var rootAvailable = false
              private var rootEffectEnabled = false
              private val presets = linkedMapOf(
                  "Clean Neutral" to Grade(),
                  "Hollywood Teal & Orange" to Grade(contrast=112, saturation=108, temperature=4, tealOrange=45, vignette=18, highlights=-12, shadows=8),
                  "Silver Screen" to Grade(contrast=125, saturation=0, temperature=-2, highlights=-18, shadows=10, grain=14, vignette=28),
                  "Warm 35mm" to Grade(contrast=108, saturation=92, temperature=22, tint=3, highlights=-15, shadows=8, grain=20, vignette=22),
                  "Bleach Bypass" to Grade(contrast=132, saturation=48, highlights=-20, shadows=-5, grain=10, tealOrange=8),
                  "Arctic Cinema" to Grade(contrast=110, saturation=105, temperature=-28, tint=-4, shadows=8, tealOrange=12, vignette=15),
                  "Golden Hour" to Grade(exposure=8, contrast=105, saturation=112, temperature=34, tint=5, highlights=-12, bloom=18),
                  "Neo Noir" to Grade(contrast=135, saturation=78, temperature=-8, highlights=-22, shadows=-12, vignette=48, tealOrange=22),
                  "Dream Bloom" to Grade(contrast=96, saturation=108, temperature=8, highlights=-8, shadows=12, bloom=42, grain=4),
                  "Muted Documentary" to Grade(contrast=106, saturation=82, temperature=-3, highlights=-14, shadows=12, grain=8)
              )
              private val controls = listOf(
                  Control("exposure","Exposure",-100,100,"","Exposure compensation"),
                  Control("contrast","Contrast",50,150,"%","Mid-tone separation"),
                  Control("saturation","Saturation",0,200,"%","Overall color intensity"),
                  Control("vibrance","Vibrance",-100,100,"","Selective saturation intent; backend dependent"),
                  Control("temperature","Temperature",-100,100,"","Cool blue ↔ warm amber"),
                  Control("tint","Tint",-100,100,"","Green ↔ magenta"),
                  Control("highlights","Highlight recovery",-100,100,"","Highlight roll-off intent"),
                  Control("shadows","Shadow lift",-100,100,"","Shadow depth intent"),
                  Control("red","Red channel",-100,100,"","Channel balance"),
                  Control("green","Green channel",-100,100,"","Channel balance"),
                  Control("blue","Blue channel",-100,100,"","Channel balance"),
                  Control("tealOrange","Teal & orange",-100,100,"","Creative split-tone intent"),
                  Control("vignette","Vignette",0,100,"%","Corner falloff intent"),
                  Control("grain","Film grain",0,100,"%","Film texture intent"),
                  Control("bloom","Bloom / halation",0,100,"%","Highlight glow intent")
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(10, 12, 18)
                  window.navigationBarColor = Color.rgb(10, 12, 18)
                  grade = loadGrade()
                  buildUi()
                  probeRoot()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).roundToInt()
              private fun color(hex: String) = Color.parseColor(hex)
              private fun bg(c: Int, radius: Float = 20f) = GradientDrawable().apply {
                  setColor(c); cornerRadius = dp(radius.toInt()).toFloat()
              }
              private fun text(value: String, size: Float, c: Int = Color.WHITE, bold: Boolean = false) =
                  TextView(this).apply {
                      text = value; textSize = size; setTextColor(c)
                      if (bold) typeface = Typeface.create("sans-serif", Typeface.BOLD)
                  }
              private fun card(): LinearLayout = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(16), dp(14), dp(16), dp(14))
                  background = bg(color("#171B26"), 18f)
                  layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = dp(12) }
              }
              private fun button(label: String, primary: Boolean = false, action: () -> Unit) =
                  Button(this).apply {
                      text = label; isAllCaps = false
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      background = bg(if (primary) color("#5B5CE2") else color("#292F40"), 14f)
                      setOnClickListener {
                          animate().scaleX(0.97f).scaleY(0.97f).setDuration(70).withEndAction {
                              animate().scaleX(1f).scaleY(1f).setDuration(130).start()
                              action()
                          }.start()
                      }
                  }

              private fun buildUi() {
                  content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(22), dp(18), dp(32))
                      setBackgroundColor(color("#0C0E14"))
                      layoutTransition = LayoutTransition().apply { setDuration(180) }
                  }
                  val scroll = ScrollView(this).apply { isFillViewport = true; addView(content) }
                  val hero = card().apply {
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          intArrayOf(color("#29264A"), color("#171B2C"), color("#171B26"))).apply { cornerRadius = dp(24).toFloat() }
                  }
                  hero.addView(text("CINE / ROOT STUDIO", 11f, color("#B9B8FF"), true))
                  hero.addView(text("Grade beyond\nthe ordinary.", 30f, Color.WHITE, true).apply {
                      setPadding(0, dp(10), 0, dp(8))
                  })
                  hero.addView(text("A root-first cinematic grading control center. System-wide effects depend on your Android build and vendor implementation.", 13f, color("#C2C6D4")))
                  content.addView(hero)
                  val statusCard = card()
                  status = text("Checking root access…", 14f, color("#F2C879"), true)
                  statusCard.addView(status)
                  statusCard.addView(text("This app does not use overlays or a non-root fallback. Unsupported system hooks are reported rather than simulated.", 12f, color("#A7ADBE")))
                  rootButton = button("Check root & backend", true) { probeRoot() }
                  statusCard.addView(rootButton)
                  statusCard.addView(button("Reset system grade", false) { resetRoot() })
                  content.addView(statusCard)

                  val presetCard = card()
                  presetCard.addView(text("LOOK LIBRARY", 11f, color("#A9A8FF"), true))
                  presetCard.addView(text("One tap. A whole mood.", 20f, Color.WHITE, true).apply { setPadding(0, dp(4), 0, dp(10)) })
                  presets.keys.chunked(2).forEach { pair ->
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      pair.forEach { name ->
                          val b = button(name) {
                              grade = presets.getValue(name).copy()
                              persist()
                              buildUi()
                              if (rootAvailable) applyRoot()
                          }
                          row.addView(b, LinearLayout.LayoutParams(0, -2, 1f).apply {
                              marginEnd = dp(5); bottomMargin = dp(5)
                          })
                      }
                      if (pair.size == 1) row.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                      presetCard.addView(row)
                  }
                  val templateRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  templateRow.addView(button("Save template") { saveTemplate() }, LinearLayout.LayoutParams(0, -2, 1f).apply { marginEnd = dp(5) })
                  templateRow.addView(button("Load template") { loadTemplate() }, LinearLayout.LayoutParams(0, -2, 1f).apply { marginStart = dp(5) })
                  presetCard.addView(templateRow)
                  presetCard.addView(button("Export profile JSON") { exportProfile() })
                  content.addView(presetCard)

                  content.addView(text("PRECISION CONTROLS", 11f, color("#A9A8FF"), true).apply {
                      setPadding(dp(2), dp(12), 0, dp(8))
                  })
                  controls.forEach { ctl -> addControl(ctl) }
                  val footer = card()
                  footer.addView(text("ENGINE NOTES", 11f, color("#A9A8FF"), true))
                  footer.addView(text(
                      "Android does not expose a universal public API for post-processing every pixel on the display. Root shell commands and SurfaceFlinger transaction codes vary by Android release and OEM. This build probes capabilities and deliberately avoids claiming a grade is active unless the command returns success. Some controls are profile metadata until a supported device-specific rendering backend is implemented.",
                      12f, color("#B5BBCB")
                  ).apply { setPadding(0, dp(8), 0, dp(8)) })
                  footer.addView(button("Show backend diagnostics") { diagnostics() })
                  content.addView(footer)
                  setContentView(scroll)
              }

              private fun addControl(c: Control) {
                  val panel = card()
                  val line = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  val label = text(c.title, 14f, Color.WHITE, true)
                  val value = text(valueOf(c.key) + c.unit, 13f, color("#B9B8FF"), true)
                  line.addView(label, LinearLayout.LayoutParams(0, -2, 1f))
                  line.addView(value)
                  panel.addView(line)
                  if (c.hint.isNotBlank()) panel.addView(text(c.hint, 11f, color("#939BAD")))
                  val seek = SeekBar(this).apply {
                      max = c.max - c.min
                      progress = (valueOf(c.key) - c.min).coerceIn(0, max)
                  }
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          if (!fromUser) return
                          setValue(c.key, p + c.min)
                          value.text = valueOf(c.key).toString() + c.unit
                          persist()
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  panel.addView(seek)
                  val actions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.END }
                  actions.addView(button("Reset") {
                      setValue(c.key, defaultGrade().let { valueOf(it, c.key) })
                      seek.progress = (valueOf(c.key) - c.min).coerceIn(0, seek.max)
                      value.text = valueOf(c.key).toString() + c.unit
                      persist()
                      if (rootAvailable) applyRoot()
                  })
                  panel.addView(actions)
                  content.addView(panel)
              }

              private fun valueOf(k: String) = valueOf(grade, k)
              private fun valueOf(g: Grade, k: String): Int = when(k) {
                  "exposure" -> g.exposure; "contrast" -> g.contrast; "saturation" -> g.saturation
                  "temperature" -> g.temperature; "tint" -> g.tint; "highlights" -> g.highlights
                  "shadows" -> g.shadows; "vibrance" -> g.vibrance; "red" -> g.red
                  "green" -> g.green; "blue" -> g.blue; "vignette" -> g.vignette
                  "grain" -> g.grain; "bloom" -> g.bloom; "tealOrange" -> g.tealOrange
                  else -> 0
              }
              private fun setValue(k: String, v: Int) { when(k) {
                  "exposure" -> grade.exposure=v; "contrast" -> grade.contrast=v; "saturation" -> grade.saturation=v
                  "temperature" -> grade.temperature=v; "tint" -> grade.tint=v; "highlights" -> grade.highlights=v
                  "shadows" -> grade.shadows=v; "vibrance" -> grade.vibrance=v; "red" -> grade.red=v
                  "green" -> grade.green=v; "blue" -> grade.blue=v; "vignette" -> grade.vignette=v
                  "grain" -> grade.grain=v; "bloom" -> grade.bloom=v; "tealOrange" -> grade.tealOrange=v
              } }
              private fun defaultGrade() = Grade()
              private fun persist() { prefs.edit().putString("active", grade.json().toString()).apply() }
              private fun loadGrade(): Grade = try {
                  Grade.from(JSONObject(prefs.getString("active", "{}") ?: "{}"))
              } catch (_: Exception) { Grade() }

              private fun saveTemplate() {
                  val input = EditText(this).apply { hint = "Template name"; setSingleLine(true) }
                  AlertDialog.Builder(this).setTitle("Save grading template").setView(input)
                      .setNegativeButton("Cancel", null).setPositiveButton("Save") { _, _ ->
                          val name = input.text.toString().trim()
                          if (name.isNotEmpty()) {
                              prefs.edit().putString("template:$name", grade.json().toString()).apply()
                              toast("Saved “$name”")
                          } else toast("Choose a template name")
                      }.show()
              }
              private fun loadTemplate() {
                  val names = prefs.all.keys.filter { it.startsWith("template:") }.sorted()
                  if (names.isEmpty()) { toast("No saved templates yet"); return }
                  AlertDialog.Builder(this).setTitle("Load template")
                      .setItems(names.map { it.removePrefix("template:") }.toTypedArray()) { _, which ->
                          val key = names[which]
                          try {
                              grade = Grade.from(JSONObject(prefs.getString(key, "{}") ?: "{}"))
                              persist(); buildUi()
                              if (rootAvailable) applyRoot()
                          } catch (_: Exception) { toast("Template could not be loaded") }
                      }.setNegativeButton("Cancel", null).show()
              }
              private fun exportProfile() {
                  val stamp = SimpleDateFormat("yyyyMMdd-HHmmss", Locale.US).format(Date())
                  val json = JSONObject().put("app", "CineRootStudio").put("version", 1).put("profile", grade.json()).toString(2)
                  AlertDialog.Builder(this).setTitle("Profile JSON").setMessage(json)
                      .setPositiveButton("Done", null).show()
              }
              private fun probeRoot() {
                  status.text = "Checking root permission and display backend…"
                  rootButton.isEnabled = false
                  thread {
                      val result = runSu("id; echo __CINE_SPLIT__; getprop ro.build.version.release; getprop ro.build.version.sdk; service list | grep -i SurfaceFlinger")
                      rootAvailable = result.first && result.second.contains("uid=0")
                      runOnUiThread {
                          rootButton.isEnabled = true
                          status.text = if (rootAvailable) "ROOT ACCESS CONFIRMED · backend still requires device validation" else "ROOT NOT AVAILABLE · grant su permission and retry"
                          status.setTextColor(if (rootAvailable) color("#7DE2B8") else color("#F2C879"))
                          rootButton.text = if (rootAvailable) "Apply current grade (experimental)" else "Check root & backend"
                      }
                  }
              }
              private fun applyRoot() {
                  if (!rootAvailable) { toast("Root access has not been confirmed"); return }
                  status.text = "Applying experimental system grade…"
                  thread {
                      // Explicitly opt-in, best-effort legacy SurfaceFlinger transaction.
                      // Transaction 1015 is not a stable Android API and may mean something else on a device.
                      val sat = (grade.saturation / 100f).coerceIn(0f, 2f)
                      val contrast = (grade.contrast / 100f).coerceIn(0.5f, 1.5f)
                      val warm = (grade.temperature / 100f).coerceIn(-1f, 1f)
                      val l = floatArrayOf(0.213f, 0.715f, 0.072f)
                      val gain = floatArrayOf(1f + 0.12f * warm, 1f, 1f - 0.18f * warm)
                      val m = Array(3) { FloatArray(3) }
                      for (r in 0..2) for (k in 0..2)
                          m[r][k] = (l[k] * (1f - sat) + (if (r == k) sat else 0f)) * contrast * gain[r]
                      val off = FloatArray(3) { (1f - contrast) / 2f * gain[it] }
                      val args = floatArrayOf(
                          m[0][0],m[1][0],m[2][0],0f,
                          m[0][1],m[1][1],m[2][1],0f,
                          m[0][2],m[1][2],m[2][2],0f,
                          off[0],off[1],off[2],1f
                      ).joinToString(" ") { "f $it" }
                      val r = runSu("service call SurfaceFlinger 1015 i32 1 $args")
                      runOnUiThread {
                          status.text = if (r.first && !r.second.contains("Exception", true))
                              "Command returned success; visual effect is NOT verified. Test carefully." 
                          else "Backend command failed or is unsupported on this ROM."
                          status.setTextColor(color("#F2C879"))
                          rootButton.text = "Apply current grade (experimental)"
                      }
                  }
              }
              private fun resetRoot() {
                  if (!rootAvailable) { toast("Root access has not been confirmed"); return }
                  thread {
                      val r = runSu("service call SurfaceFlinger 1015 i32 0")
                      runOnUiThread {
                          status.text = if (r.first) "Reset command sent; confirm display returned to normal." else "Reset failed; use device display settings or reboot."
                          status.setTextColor(color("#F2C879"))
                      }
                  }
              }
              private fun diagnostics() {
                  thread {
                      val r = runSu("id; echo SDK=$(getprop ro.build.version.sdk); echo RELEASE=$(getprop ro.build.version.release); service list | grep -i SurfaceFlinger; command -v su")
                      runOnUiThread { AlertDialog.Builder(this).setTitle("Root diagnostics")
                          .setMessage(r.second.ifBlank { "No diagnostic output. su command failed." })
                          .setPositiveButton("OK", null).show() }
                  }
              }
              private fun runSu(command: String): Pair<Boolean,String> = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", command))
                  val out = p.inputStream.bufferedReader().readText()
                  val err = p.errorStream.bufferedReader().readText()
                  val code = p.waitFor()
                  (code == 0) to (out + if (err.isNotBlank()) "\n$err" else "")
              } catch (e: Exception) { false to (e.message ?: e.javaClass.simpleName) }
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          EOF
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CineRootStudio-debug
          path: app/build/outputs/apk/debug/*.apk
